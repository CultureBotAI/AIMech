comments:
- A preprocessing layer which randomly crops images during training. During training, this layer will
  randomly choose a location to crop images down to a target size. The layer will crop all the images
  in the same batch to the same cropping location. At inference time, and during training if an input
  image is smaller than the target size, the input will be resized and cropped so as to return the largest
  possible window in the image that matches the target aspect ratio. If you need to apply random cropping
  at inference time, set training to True when calling the layer. Input pixel values can be of any range
  (e.g. [0., 1.) or [0, 255]) and of interger or floating point dtype. By default, the layer will output
  floats.
