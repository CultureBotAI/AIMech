comments:
- 'The exponential linear unit (ELU) with alpha > 0 is: x if x > 0 and alpha * (exp(x) - 1) if x < 0 The
  ELU hyperparameter alpha controls the value to which an ELU saturates for negative net inputs. ELUs
  diminish the vanishing gradient effect. ELUs have negative values which pushes the mean of the activations
  closer to zero. Mean activations that are closer to zero enable faster Learning as they bring the gradient
  closer to the natural gradient. ELUs saturate to a negative value when the argument gets smaller. Saturation
  means a small derivative which decreases the variation and the information that is propagated to the
  next layer.'
