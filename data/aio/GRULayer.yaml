comments:
- 'Gated Recurrent Unit - Cho et al. 2014. Based on available runtime hardware and constraints, this layer
  will choose different implementations (cuDNN-based or pure-TensorFlow) to maximize the performance.
  If a GPU is available and all the arguments to the layer meet the requirement of the cuDNN kernel (see
  below for details), the layer will use a fast cuDNN implementation. The requirements to use the cuDNN
  implementation are: activation == tanh, recurrent_activation == sigmoid, recurrent_dropout == 0, unroll
  is False, use_bias is True, reset_after is True. Inputs, if use masking, are strictly right-padded.
  Eager execution is enabled in the outermost context. There are two variants of the GRU implementation.
  The default one is based on v3 and has reset gate applied to hidden state before matrix multiplication.
  The other one is based on original and has the order reversed. The second variant is compatible with
  CuDNNGRU (GPU-only) and allows inference on CPU. Thus it has separate biases for kernel and recurrent_kernel.
  To use this variant, set reset_after=True and recurrent_activation=''sigmoid''.'
