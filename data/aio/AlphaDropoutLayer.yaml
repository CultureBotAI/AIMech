comments:
- Applies Alpha Dropout to the input. Alpha Dropout is a Dropout that keeps mean and variance of inputs
  to their original values, in order to ensure the self-normalizing property even after this dropout.
  Alpha Dropout fits well to Scaled Exponential Linear Units by randomly setting activations to the negative
  saturation value.
