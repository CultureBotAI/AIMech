comments:
- A preprocessing layer which randomly adjusts brightness during training. This layer will randomly increase/reduce
  the brightness for the input RGB images. At inference time, the output will be identical to the input.
  Call the layer with training=True to adjust the brightness of the input. Note that different brightness
  adjustment factors will be apply to each the images in the batch.
