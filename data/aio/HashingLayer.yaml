comments:
- A preprocessing layer which hashes and bins categorical features. This layer transforms categorical
  inputs to hashed output. It element-wise converts a ints or strings to ints in a fixed range. The stable
  hash function uses tensorflow::ops::Fingerprint to produce the same output consistently across all platforms.
  This layer uses FarmHash64 by default, which provides a consistent hashed output across different platforms
  and is stable across invocations, regardless of device and context, by mixing the input bits thoroughly.
  If you want to obfuscate the hashed output, you can also pass a random salt argument in the constructor.
  In that case, the layer will use the SipHash64 hash function, with the salt value serving as additional
  input to the hash function.
