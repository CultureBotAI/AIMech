comments:
- A preprocessing layer which encodes integer features. This layer provides options for condensing data
  into a categorical encoding when the total number of tokens are known in advance. It accepts integer
  values as inputs, and it outputs a dense or sparse representation of those inputs. For integer inputs
  where the total number of tokens is not known, use tf.keras.layers.IntegerLookup instead.
