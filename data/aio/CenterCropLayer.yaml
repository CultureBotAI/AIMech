comments:
- A preprocessing layer which crops images. This layers crops the central portion of the images to a target
  size. If an image is smaller than the target size, it will be resized and cropped so as to return the
  largest possible window in the image that matches the target aspect ratio. Input pixel values can be
  of any range (e.g. [0., 1.) or [0, 255]) and of interger or floating point dtype. By default, the layer
  will output floats.
