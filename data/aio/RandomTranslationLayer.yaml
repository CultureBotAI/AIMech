comments:
- A preprocessing layer which randomly translates images during training. This layer will apply random
  translations to each image during training, filling empty space according to fill_mode. aInput pixel
  values can be of any range (e.g. [0., 1.) or [0, 255]) and of interger or floating point dtype. By default,
  the layer will output floats.
