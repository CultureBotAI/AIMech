comments:
- 'Noisy dense layer that injects random noise to the weights of dense layer. Noisy dense layers are fully
  connected layers whose weights and biases are augmented by factorised Gaussian noise. The factorised
  Gaussian noise is controlled through gradient descent by a second weights layer. A NoisyDense layer
  implements the operation: $$ mathrm{NoisyDense}(x) = mathrm{activation}(mathrm{dot}(x, mu + (sigma cdot
  epsilon)) mathrm{bias}) $$ where mu is the standard weights layer, epsilon is the factorised Gaussian
  noise, and delta is a second weights layer which controls epsilon.'
