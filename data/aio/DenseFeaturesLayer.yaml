comments:
- A layer that produces a dense Tensor based on given feature_columns. Generally a single example in training
  data is described with FeatureColumns. At the first layer of the model, this column oriented data should
  be converted to a single Tensor. This layer can be called multiple times with different features. This
  is the V2 version of this layer that uses name_scopes to create variables instead of variable_scopes.
  But this approach currently lacks support for partitioned variables. In that case, use the V1 version
  instead.
