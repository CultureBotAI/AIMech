comments:
- 'Depthwise 1D convolution. Depthwise convolution is a type of convolution in which each input channel
  is convolved with a different kernel (called a depthwise kernel). You can understand depthwise convolution
  as the first step in a depthwise separable convolution. It is implemented via the following steps: Split
  the input into individual channels. Convolve each channel with an individual depthwise kernel with depth_multiplier
  output channels. Concatenate the convolved outputs along the channels axis. Unlike a regular 1D convolution,
  depthwise convolution does not mix information across different input channels. The depth_multiplier
  argument determines how many filter are applied to one input channel. As such, it controls the amount
  of output channels that are generated per input channel in the depthwise step.'
