comments:
- 'This wrapper allows to apply a layer to every temporal slice of an input. Every input should be at
  least 3D, and the dimension of index one of the first input will be considered to be the temporal dimension.
  Consider a batch of 32 video samples, where each sample is a 128x128 RGB image with channels_last data
  format, across 10 timesteps. The batch input shape is (32, 10, 128, 128, 3). You can then use TimeDistributed
  to apply the same Conv2D layer to each of the 10 timesteps, independently:'
