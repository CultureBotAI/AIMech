comments:
- 'Max pooling operation for 1D temporal data. Downsamples the input representation by taking the maximum
  value over a spatial window of size pool_size. The window is shifted by strides. The resulting output,
  when using the "valid" padding option, has a shape of: output_shape = (input_shape - pool_size + 1)
  / strides) The resulting output shape when using the "same" padding option is: output_shape = input_shape
  / strides.'
