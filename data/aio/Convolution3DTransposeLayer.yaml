comments:
- Transposed convolution layer (sometimes called Deconvolution). The need for transposed convolutions
  generally arises from the desire to use a transformation going in the opposite direction of a normal
  convolution, i.e., from something that has the shape of the output of some convolution to something
  that has the shape of its input while maintaining a connectivity pattern that is compatible with said
  convolution. When using this layer as the first layer in a model, provide the keyword argument input_shape
  (tuple of integers or None, does not include the sample axis), e.g. input_shape=(128, 128, 128, 3) for
  a 128x128x128 volume with 3 channels if data_format="channels_last".
