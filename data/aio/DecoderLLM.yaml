comments:
- A decoder-only architecture consisting of only a decoder, trained to predict the next token in a sequence
  given the previous tokens. Unlike the encoder-decoder architecture, it does not have an explicit encoder
  and encodes information implicitly in the hidden state of the decoder, updated at each step of the generation
  process.
