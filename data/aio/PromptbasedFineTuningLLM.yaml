id: AIO:PromptbasedFineTuningLLM
name: Prompt-based Fine-Tuning LLM
definition: A large language model which is fine-tuned on a small number of examples or prompts, rather
  than full task datasets. This allows for rapid adaptation to new tasks with limited data, leveraging
  the model's few-shot learning capabilities.
