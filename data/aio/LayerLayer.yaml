comments:
- 'This is the class from which all layers inherit. A layer is a callable object that takes as input one
  or more tensors and that outputs one or more tensors. It involves computation, defined in the call()
  method, and a state (weight variables). State can be created in various places, at the convenience of
  the subclass implementer: in __init__(); in the optional build() method, which is invoked by the first
  __call__() to the layer, and supplies the shape(s) of the input(s), which may not have been known at
  initialization time; in the first invocation of call(), with some caveats discussed below. Users will
  just instantiate a layer and then treat it as a callable.'
