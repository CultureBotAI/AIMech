comments:
- A hidden layer is located between the input and output of the algorithm, in which the function applies
  weights to the inputs and directs them through an activation function as the output. In short, the hidden
  layers perform nonlinear transformations of the inputs entered into the network. Hidden layers vary
  depending on the function of the neural network, and similarly, the layers may vary depending on their
  associated weights.
