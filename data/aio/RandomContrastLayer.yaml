comments:
- A preprocessing layer which randomly adjusts contrast during training. This layer will randomly adjust
  the contrast of an image or images by a random factor. Contrast is adjusted independently for each channel
  of each image during training. For each channel, this layer computes the mean of the image pixels in
  the channel and then adjusts each component x of each pixel to (x - mean) * contrast_factor + mean.
  Input pixel values can be of any range (e.g. [0., 1.) or [0, 255]) and in integer or floating point
  dtype. By default, the layer will output floats. The output value will be clipped to the range [0, 255],
  the valid range of RGB colors.
