id: AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustDistributedLearning
name: Coordinate-wise Median and Trimmed Mean Byzantine-Robust Distributed Learning
concept_kind: algorithm
review_status: DRAFT
definition: 'A family of dimension-separable robust gradient and parameter aggregation algorithms for Byzantine-resilient distributed optimization across m worker machines with an alpha-fraction of adversarial workers (alpha < 1/2), comprising: (1) Coordinate-wise Median Gradient Descent, which updates w_{t+1} = w_t - eta * med{nabla F_i(w_t)}_{i=1}^m by taking the 1D median independently along each coordinate k in [d]; (2) Coordinate-wise beta-Trimmed Mean Gradient Descent (alpha <= beta < 1/2), which sorts the m worker values along each coordinate k, discards the largest beta*m and smallest beta*m values, and averages the remaining (1 - 2*beta)*m entries; and (3) One-round Coordinate-wise Median ERM aggregation w_hat = med{w_hat_i}_{i=1}^m for quadratic objectives.'
identity_notes: Distinct from Krum and Multi-Krum (AIMech:KrumAndMultiKrumByzantineTolerantGradientDescent, which select complete worker vectors via joint d-dimensional pairwise Euclidean distances in O(m^2 d) time rather than coordinate-wise 1D order statistics in O(m log m * d) or O(m d) time) and from RFA Smoothed Weiszfeld Geometric Median (AIMech:RfaRobustFederatedAggregationSmoothedWeiszfeldGeometricMedian, which computes the rotation-equivariant l_2 geometric median iteratively rather than coordinate-separable l_1 median or trimmed mean statistics).
aliases:
- Coordinate-wise Median Gradient Descent
- Coordinate-wise Trimmed Mean Gradient Descent
- Byzantine-Robust Coordinate-wise Trimmed Mean
- Yin-Chen-Kannan-Bartlett Trimmed Mean and Median GD
