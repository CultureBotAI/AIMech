claims:
- claim_id: r400-trimmed-mean-order-optimal-statistical-error-rates
  kind: mechanism
  statement: For v-sub-exponential gradient coordinates and trimming level alpha <= beta <= 1/2 - epsilon, Theorems 4, 5, and 6 prove that Coordinate-wise beta-Trimmed Mean GD achieves uniform gradient concentration O_tilde(v * sqrt(d) * (alpha / sqrt(n) + 1 / sqrt(n m))) and converges on strongly convex, non-strongly convex, and smooth nonconvex losses to the statistical error rate O_tilde(alpha / sqrt(n) + 1 / sqrt(n m)), matching the minimax information-theoretic lower bound Omega(alpha / sqrt(n) + sqrt(d / (n m))) of Observation 1 in sample dependency.
  evidence:
  - source_id: r400-primary-pdf
    locator: Section 4.2 Guarantee for Trimmed Mean (Theorems 4-6), Section 6 Lower Bound (Observation 1), & Table 1, pp. 4-8
    relation: supports
- claim_id: r400-coordinate-median-berry-esseen-skewness-and-one-round-erm-rate
  kind: mechanism
  statement: Using a Berry-Esseen normal approximation in terms of the gradient skewness S, Theorems 1-3 prove that Coordinate-wise Median GD achieves statistical error O_tilde(alpha / sqrt(n) + 1 / sqrt(n m) + 1 / n) requiring only bounded 3rd central moments (skewness), while Algorithm 2 and Theorem 7 show that for quadratic losses a single round of coordinate-wise median parameter aggregation achieves O_tilde(d / sqrt(n m) + sqrt(d) / n + alpha * sqrt(d / n)).
  evidence:
  - source_id: r400-primary-pdf
    locator: Section 4.1 Guarantee for Median (Theorems 1-3) & Section 5 One-Round Aggregation for Quadratic Loss (Algorithm 2, Theorem 7), pp. 4-8
    relation: supports
- claim_id: r400-skewness-bias-one-over-n-and-beta-knowledge-limitation
  kind: limitation
  statement: Coordinate-wise Median GD incurs an extra O(S / n) bias term when per-sample gradients have non-zero skewness S (Because the median of a skewed distribution differs from its mean by O(1/sqrt(n)) per worker), and Coordinate-wise beta-Trimmed Mean requires knowing an upper bound beta >= alpha on the Byzantine fraction alpha < 1/2.
  evidence:
  - source_id: r400-primary-pdf
    locator: Section 3 Definition 2 & Section 4.1 Discussion of Theorem 1 and Skewness S, pp. 3-5
    relation: supports
- claim_id: r400-distributed-regression-and-classification-byzantine-defense-application
  kind: application
  statement: Provides order-optimal Byzantine-tolerant distributed gradient aggregation for strongly convex, convex, and nonconvex empirical risk minimization when up to alpha < 1/2 of worker machines suffer arbitrary crashes, software bugs, or adversarial gradient corruption.
  evidence:
  - source_id: r400-primary-pdf
    locator: Section 1 Introduction, Section 2 Problem Setup, and Section 4 Main Results (Table 1), pp. 1-7
    relation: supports
