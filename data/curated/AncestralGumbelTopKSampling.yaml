claims:
- claim_id: method
  kind: mechanism
  statement: Given a finite discrete Bayesian DAG with normalized parent-conditioned probabilities, choose
    a requested k no larger than the positive-probability configuration support and a parallel expansion
    budget m between 1 and the initial k. Start a priority frontier at the empty assignment, with log
    mass zero and a Gumbel root maximum sampled from Gumbel(0) or conditioned to zero. Each retained partial
    assignment represents a disjoint set of possible completions and carries their maximum perturbed log
    probability. Remove up to m highest-priority entries. Keep already-complete entries unchanged; for
    each incomplete entry choose an unassigned variable whose parents have been assigned, form all of
    its possible-value children, and update each child’s log mass with that variable’s conditional log
    probability. Sample child Gumbel maxima conditionally on their maximum equaling the parent score,
    using the source’s conditional-maximum transform. Combine children and retained entries with the unexpanded
    frontier, then keep at most the remaining requested count of highest-priority entries. Emit a completed
    assignment only while it is at the head of the priority frontier, decrementing the remaining sample
    count for every emitted assignment. Continue until the requested ordered sample has been returned.
    The pruning proof uses disjoint completion sets and consistent maxima to preserve the same ordered
    Gumbel-Top-k distribution as explicit enumeration of all configurations.
  evidence:
  - source_id: method-source
    locator: Sections2.1 and2.4, PDF/printed pp.3 and5; Sections3.1–3.9, Equation(18), Lemmas1–2, Theorem3
      and Algorithm1, pp.6–15
    relation: supports
- claim_id: parallel-specialization
  kind: scope
  statement: With m=1 and a fixed variable order the algorithm expands the highest-priority incomplete
    configuration first and can emit samples incrementally. Expanding the full retained frontier reproduces
    the layerwise stochastic-beam schedule under the fixed-order setup. The exact without-replacement
    distribution is preserved across the allowed scheduling choices, but total expansions and allocated
    processor work can differ.
  evidence:
  - source_id: method-source
    locator: Sections3.7–3.8, Algorithm1 and Figures5–6, PDF/printed pp.11–14; Section4.2, p.16
    relation: supports
- claim_id: variable-selection
  kind: mechanism
  statement: A globally fixed topological order is sufficient but not required. The next variable may
    depend on the sampled partial assignment, provided every parent of that variable is already assigned.
    Such a strategy changes the configuration tree and potential reuse/pruning while retaining the target
    distribution under the described construction.
  evidence:
  - source_id: method-source
    locator: Section3.9 and Figure7, PDF/printed p.15
    relation: supports
