name: Ancestral Gumbel-Top-k sampling
definition: An exact without-replacement sampler for finite discrete Bayesian-network configurations that
  propagates conditional Gumbel subtree maxima through a bounded priority frontier, with a configurable
  number of parallel expansions and parent-respecting variable selection.
concept_kind: algorithm
identity_notes: 'This is Kool and colleagues’ 2020 general ancestral algorithm. It extends the 2019 stochastic
  beam sampler beyond a fixed sequence-layer schedule: serial expansion is best-first, while expanding
  the whole retained frontier yields the stochastic-beam specialization. The generic categorical Gumbel-Top-k
  identity remains a separate mathematical method. Equal output distributions across expansion schedules
  do not make those schedules or their computational costs identical. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 331 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 11 and 11 lines
  respectively. All 10 unique hit contents were inspected: neighboring Gumbel-Top-k contrasts, saved review
  and ledger references, new source leads, and incidental concrete-distribution wording in an older random-search
  report, not existing candidate records. Exact checkout counts and differences are retained in the ledger.
  Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The guarantee concerns finite discrete Bayesian networks with accessible normalized conditionals, well-defined
  positive support and the specified conditional-max construction. Arbitrary graphical models, cyclic
  dependencies or invalid zero-mass arithmetic are not silently covered.
- The frontier contains disjoint surviving completion domains; after pruning it need not cover the entire
  original domain. Reusing overlapping partial assignments or sampling a variable before its parents violates
  the stated construction.
- Serial m=1 expansion and full-frontier expansion can have the same sampling law but different work and
  parallel depth. The paper’s cost accounting includes allocated processor slots, idle slots and potentially
  unnecessary expansions; it is not a universal wall-clock speedup or a cost independent of variable-domain
  size.
- The retained frontier bound counts entries, not all memory for model states, temporary children, assignments
  or result storage. Finite precision, ties and numerical stability need implementation policies.
- The pseudocode’s access to the first queue element requires an empty-queue guard in an executable implementation.
  No literal pseudocode, author implementation or numerical benchmark was run.
- Without-replacement configurations are dependent samples. The method’s sampling law does not make an
  arbitrary unweighted estimator unbiased, and it is distinct from Gibbs transitions or ordinary envelope-based
  rejection sampling.
