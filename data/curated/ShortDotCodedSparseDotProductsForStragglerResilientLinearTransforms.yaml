claims:
- claim_id: short-dot-sparsity-and-k-recovery-construction
  kind: mechanism
  statement: Given any M x N matrix A and straggler recovery threshold K in {M + 1, ..., P} (when P divides N), appending K - M rows z_j = -(B^{U_j}_{cols M+1:K})^{-1} B^{U_j}_{cols 1:M} A_j for cyclic zero-index sets U_j of size K - M yields a P x N encoded matrix F = B A_tilde in which every row f_i^T has sparsity at most s = (N / P)(P - K + M) and the first M rows of (B^V)^{-1} v_V recover A x from the short dot products v_V of any K-subset V of processors.
  evidence:
  - source_id: r543-primary-pdf
    locator: Section 2 Theorem 1 & Lemmas 1-2 p. 5-6 Eq. 1-2; Algorithm 1 p. 7
    relation: supports
- claim_id: short-dot-near-optimal-sparsity-and-expected-time
  kind: scope
  statement: Any P x N linear encoding F whose every K rows span the M rows of a generic M x N matrix A must have average row sparsity s_bar > (N / P)(P - K + M) - (M^2 / P) C(P, K - M + 1) = (N / P)(P - K + M) - o(N / P) for large N (Theorem 3, Eq. 6-7), proving Short-Dot is asymptotically sparsity-optimal; under shifted-exponential worker delays with M = P / log P and K = P - M / 2, Short-Dot achieves scaled expected time E[T_{SD}] / N = O(log(log P) / log P) -> 0 whereas MDS coding, repetition, and uncoded parallelization remain Omega(1) (Theorem 4, Eq. 13-17).
  evidence:
  - source_id: r543-primary-pdf
    locator: Section 3.1 Theorem 3 p. 8 Eq. 6-7; Section 4 Theorem 4 p. 10-12 Eq. 13-17
    relation: supports
- claim_id: short-dot-offline-encoding-and-real-vandermonde-limitation
  kind: limitation
  statement: Pre-processing matrix A into F requires solving N / P linear systems of size (K - M) x (K - M) (costing O((N / P)(K - M)^3 + 2 P K N) naively or O(N P log^2 P) with Vandermonde fast polynomial interpolation), making Short-Dot suited primarily to settings where A is known offline or reused across many input vectors x.
  evidence:
  - source_id: r543-primary-pdf
    locator: Section 5.1 Encoding Complexity p. 12 Eq. 18-20
    relation: supports
