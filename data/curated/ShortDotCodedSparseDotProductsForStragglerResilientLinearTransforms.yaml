id: AIMech:ShortDotCodedSparseDotProductsForStragglerResilientLinearTransforms
name: Short-Dot Coded Sparse Dot Products for Straggler-Resilient Linear Transforms
concept_kind: algorithm
review_status: DRAFT
definition: A straggler-resilient coded parallelization method for computing large linear transforms A x (with A in R^{M x N} and input x in R^N across P > M processors) that appends K - M auxiliary rows Z in R^{(K - M) x N} to A to form A_tilde = [A^T | Z^T]^T in R^{K x N} and multiplies by a P x K super-regular or Vandermonde encoding matrix B to produce F = B A_tilde in R^{P x N}, choosing each column z_j = -(B^{U_j}_{cols M+1:K})^{-1} B^{U_j}_{cols 1:M} A_j to enforce K - M cyclic zeros per column so that every processor's encoded row f_i^T has sparsity at most s = (N / P)(P - K + M) < N and any K out of P short dot products <f_i^{S_i}, x^{S_i}> suffice to linearly recover A x.
identity_notes: 'Distinct from Maximum Distance Separable (MDS) coded matrix-vector multiplication (Lee et al., 2015/2018, which requires K = M processors to finish but forces every processor to store and compute a full N-length dot product) and from Polynomial / MatDot / Entangled Polynomial Codes (AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication, AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication, AIMech:EntangledPolynomialCodesForStragglerResilientDistributedMatrixMultiplication, which encode dense block submatrices of two matrices A and B): Short-Dot (Dutta, Cadambe, & Grover, NeurIPS 2016 / IEEE TIT 2019) jointly encodes M rows into P sparse vectors of length s = (N/P)(P - K + M) by solving for K - M padded rows Z that annihilate cyclic (K - M)-subsets of rows in B A_tilde, trading a slightly higher recovery threshold K >= M for shorter per-worker dot products, reduced worker memory, and reduced input communication.'
aliases:
- Short-Dot
- Short-Dot Codes
- Short-Dot Coded Linear Transform
