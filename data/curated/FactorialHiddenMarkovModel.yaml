claims:
- claim_id: method
  kind: mechanism
  statement: With independent initial states and chain-specific transitions, the joint distribution factors
    into the product of chain priors, the product over times and chains of p(s_t^m|s_(t-1)^m), and one
    shared p(y_t|s_t^1,...,s_t^M) per time. The paper’s worked emission is Gaussian with mean sum_m W_m
    s_t^m for one-hot states and common covariance C. Although chains are independent a priori, observations
    generally couple their posterior paths through the shared emission. For M chains each having K states,
    the joint latent state has K^M configurations. Exact forward–backward can exploit the transition factorization
    by contracting one chain dimension at a time, with O(T M K^(M+1)) transition work under the paper’s
    fixed-observation-dimension setting; this remains exponential in M. EM uses posterior state, temporal-pair
    and cross-chain moments. In the additive Gaussian model its weight update is a linear-system solution
    with a pseudoinverse because chain contributions have redundant mean offsets. Exact inference, Gibbs
    sampling and variational approximations are separate procedures, not defining alternatives for model
    identity.
