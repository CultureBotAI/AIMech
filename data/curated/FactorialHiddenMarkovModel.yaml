name: Factorial hidden Markov model
definition: A directed latent sequence-model family in which several independently evolving hidden Markov
  chains jointly determine the observation distribution at each time.
concept_kind: model_family
identity_notes: 'This record covers the independent-chain factorial HMM developed by Ghahramani and Jordan,
  with a shared observation distribution. It is not a mixture selecting one HMM, a globally normalized
  product of complete HMM likelihoods, an input-conditioned HMM, or the variational algorithm used to
  fit the model. Each combination of chain states is one joint state; factorial refers to its distributed
  component representation. The later coupled-chain and input-conditioned extensions in Section 5 are
  outside this narrow definition. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 376 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 5 and 5 lines. All 4 unique matched contents were fully
  read: preceding boundary discussions, citations, reviews and pending leads, not existing records of
  these three identities. All 64 semantic label/synonym hits, 17 exact fully annotated AIO nodes with
  outgoing edges, their generated records and four native neighbors were inspected or verified unchanged
  after prior full reading. Absence is bounded to this pin and inspected neighborhood.'
limitations:
- Independent latent dynamics do not imply posterior independence after shared observations. Special emission
  structures may decouple chains; for the Gaussian case a sufficient condition is cross-chain orthogonality
  in the C^-1 metric. Note 3’s ordinary orthogonality with a merely diagonal covariance is not sufficient
  in general.
- The Gaussian additive mean is a worked parameterization, not the only possible factorial-HMM emission.
  Its closed-form parameter updates do not automatically transfer to nonlinear or discrete emissions.
- Factorized transitions reduce exact computation relative to a naive unconstrained joint-state HMM but
  do not remove exponential state growth. A compact parameterization is not a universal scalability or
  accuracy guarantee.
- Approximate E-steps may improve a variational bound without monotonically improving the true likelihood.
  Additive offsets are not individually identifiable without conventions; the paper uses a pseudoinverse.
- Section 5’s coupled-transition and input-conditioned extension displays contain indexing/factorization
  ambiguities. They are not adopted as the defining joint distribution here. No experimental performance,
  author implementation or general convergence guarantee is certified.
