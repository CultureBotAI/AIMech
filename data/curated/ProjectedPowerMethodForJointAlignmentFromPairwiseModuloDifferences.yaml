claims:
- claim_id: claim-block-circulant-lifting-and-scaled-simplex-projection-contraction
  kind: mechanism
  statement: "Lifting discrete states $x_i \\in \\mathbb{Z}_m$ to indicator blocks $\\boldsymbol{z}_i = \\boldsymbol{e}_{x_i} \\in \\mathbb{R}^m$ turns non-concave multi-frequency pairwise likelihoods into the bilinear block-circulant quadratic form $\\boldsymbol{z}^\\top\\boldsymbol{L}\\boldsymbol{z}$ (Equations 2.2\u20132.5), and Lemma 1 proves that the scaled simplex projection $\\mathcal{P}_{\\Delta_m}(\\mu\\boldsymbol{v}_i)$ is firmly non-expansive ($\\|\\mathcal{P}_{\\Delta_m}(\\boldsymbol{a}) - \\mathcal{P}_{\\Delta_m}(\\boldsymbol{b})\\|_2 \\le \\|\\boldsymbol{a} - \\boldsymbol{b}\\|_2$) while mapping any vector with a strict top-coordinate separation $v_{i,(1)} - v_{i,(2)} \\ge 1/\\mu$ exactly onto the discrete vertex $\\boldsymbol{e}_{\\arg\\max_s v_{i,s}}$ (Section 2.2, Equations 2.7\u20132.10, Section 6.1, Lemmas 1\u20134)."
  evidence:
  - source_id: cc2018-ppm-pdf
    locator: Section 2.2 (Eqs. 2.7-2.10, Algorithm 1, pp. 7-10), Section 6.1 (Lemmas 1-4, pp. 24-27)
    relation: supports
- claim_id: claim-two-stage-exact-discrete-alignment-in-logarithmic-iterations
  kind: mechanism
  statement: "Within the contraction basin $\\{\\boldsymbol{z} \\in \\Delta : \\|\\boldsymbol{z} - \\boldsymbol{z}^*\\|_2 \\le \\delta\\sqrt{n}\\}$, Theorem 1 proves that PPM iterates $\\boldsymbol{z}^{t+1} = \\mathcal{P}_{\\Delta}(\\mu_t\\boldsymbol{L}\\boldsymbol{z}^t)$ first contract geometrically in $\\ell_2$ norm ($\\|\\boldsymbol{z}^t - \\boldsymbol{z}^*\\|_2 \\le \\rho^t\\|\\boldsymbol{z}^0 - \\boldsymbol{z}^*\\|_2$) and then, by entrywise $\\ell_\\infty$ separation of the true coordinate score $(\\boldsymbol{L}\\boldsymbol{z}^t)_{i,x_i^*}$ above all $s \\ne x_i^*$, snap to the exact ground-truth discrete configuration $\\boldsymbol{z}^t = \\boldsymbol{z}^*$ in at most $T = O(\\log n)$ iterations when $p_{\\mathrm{obs}} \\gtrsim \\frac{\\log^2(nm)}{n \\cdot \\mathrm{KL}^{\\min}}$ (Section 3, Theorems 1\u20133, Sections 6.2\u20136.4, Lemmas 5\u201310)."
  evidence:
  - source_id: cc2018-ppm-pdf
    locator: Section 3 (Theorems 1-3, pp. 11-16), Sections 6.2-6.4 (Lemmas 5-10, pp. 28-38)
    relation: supports
- claim_id: claim-information-theoretic-minimax-kl-divergence-threshold
  kind: application
  statement: Theorem 4 establishes that if $p_{\mathrm{obs}} < \frac{(1-\varepsilon)\log n}{n \cdot \max_{l \ne 0}\mathrm{KL}(P_0 \| P_l)}$, then any estimator fails to recover the exact joint alignment with probability approaching 1, proving that PPM achieves the information-theoretic sample complexity threshold up to logarithmic factors while running in $O(|\mathcal{E}|m\log m)$ time per iteration via Fast Fourier Transforms on the circulant blocks (Sections 2.2 and 3.2, Theorem 4, Appendix D).
  evidence:
  - source_id: cc2018-ppm-pdf
    locator: Section 2.2 (p. 9), Section 3.2 (Theorem 4, pp. 15-16), Appendix D (pp. 51-53)
    relation: supports
