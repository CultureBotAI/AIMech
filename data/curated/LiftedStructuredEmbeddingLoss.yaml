claims:
- claim_id: method
  kind: mechanism
  statement: 'For labeled embeddings let D_ij=||z_i−z_j||_2. The original Equation (3) uses full-training-set
    positive pairs Phat and negative pairs Nhat. For positive (i,j), define J_ij=D_ij+max({alpha−D_ik:(i,k)
    in Nhat} union {alpha−D_jl:(j,l) in Nhat}), then average max(0,J_ij)^2 with divisor 2|Phat|. The practical
    Equation (4) instead uses a supplied minibatch: let P be its unordered same-class pairs and use Jtilde_ij=D_ij+log[sum_(k:y_k!=y_i)exp(alpha−D_ik)+sum_(l:y_l!=y_j)exp(alpha−D_jl)],
    summing only batch examples. Its loss is (1/(2|P|))sum_(i,j in P)max(0,Jtilde_ij)^2. Both endpoint-specific
    terms enter even when the same negative example belongs to both pools. Log-sum-exp bounds a hard maximum
    over the same terms; changing to a mined minibatch does not make its value a certified bound on the
    full-data objective. A dense pairwise distance matrix supports the batch computation. Loss distances
    are Euclidean norms, not squared distances; the squared matrix is only an intermediate.'
