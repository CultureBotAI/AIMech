name: Lifted structured embedding loss
definition: A metric-learning objective that penalizes a positive pair’s Euclidean distance against negative
  distances incident to either endpoint, using a squared hinge and a hard maximum or its log-sum-exp relaxation.
concept_kind: mathematical_method
identity_notes: This record covers Song et al.’s lifted structured embedding loss, including the original
  maximum construction and the practically optimized log-sum-exp upper-bound form. These two forms are
  distinguished, not asserted numerically identical. The objective is separate from the full network,
  image preprocessing, hard-negative batch construction and optimizer. It is not N-pair-mc’s one-anchor
  dot-product categorical loss or N-pair-ovo’s sum of binary softplus comparisons. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 223 preceding native IDs/names/aliases.
  Word-delimited fixed-string searches of both full checkouts, including ignored and hidden files, returned
  2 worktree lines in discovery context and 6 main-checkout lines including four unrelated ignored dependency
  matches. Six neighboring native records and nine exact AIO nodes with scoped synonyms and outgoing edges
  were inspected.
limitations:
- The stated minibatch expression needs at least one positive pair and a nonempty negative pool for each
  evaluated pair. The paper’s loss definition does not itself provide an empty-batch fallback.
- For a fixed candidate pool, log-sum-exp upper-bounds and smooths the inner maximum. It is not the same
  loss and depends on the number of negative terms. The Euclidean norm still requires care at zero distance
  when differentiating with respect to embeddings.
- The original author loss file enumerates all same-label unordered pairs and both different-label endpoint
  pools in the supplied batch. That does not imply exhaustive mining over the whole training dataset or
  any particular sampling distribution.
- This objective imposes neither a cosine normalization nor an InfoNCE positive-containing denominator.
  Margin, representation, batch composition and optimization affect results. No model training or benchmark
  was reproduced.
