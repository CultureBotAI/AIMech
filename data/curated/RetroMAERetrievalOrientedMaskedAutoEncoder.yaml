id: AIMech:RetroMAERetrievalOrientedMaskedAutoEncoder
name: RetroMAE (Retrieval-Oriented Masked Auto-Encoder Pre-Training)
concept_kind: learning_paradigm
review_status: DRAFT
definition: "A retrieval-oriented self-supervised masked auto-encoder (MAE) pre-training paradigm for dense text retrieval that pollutes an input sentence X twice with independent masks at asymmetric ratios\u2014encoding a moderately masked view X_tilde_enc (15-30% masked, default 30%) with a full multi-layer bidirectional transformer Phi_enc into a [CLS] sentence embedding h_{X_tilde} and reconstructing all original tokens of X through a single-layer transformer decoder Phi_dec conditioned on h_{X_tilde} and an aggressively masked context (50-70% masked, default 50%) via two-stream position-specific enhanced decoding."
identity_notes: Introduced by Xiao, Liu, Shao, and Cao (EMNLP 2022, pp. 538-548, arXiv:2205.12035). Distinguished from standard BERT Masked Language Modeling (15% single-mask token prediction without a sentence-embedding bottleneck), from Condenser/coCondenser (Gao & Callan, 2021, 2022) which concatenate the [CLS] state with intermediate encoder hidden states under a single mask, and from SEED (Lu et al., 2021) or TSDAE (Wang et al., 2021) which rely on autoregressive prefix decoding rather than asymmetric dual-mask MLM with two-stream position-specific attention.
aliases:
- Retrieval-Oriented Masked Auto-Encoder
- RetroMAE Pre-Training Paradigm
- RetroMAE Asymmetric Masked Auto-Encoding
