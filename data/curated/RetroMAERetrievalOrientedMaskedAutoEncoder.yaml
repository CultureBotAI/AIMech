claims:
- claim_id: retromae-asymmetric-dual-mask-and-enhanced-decoding-mechanism
  kind: mechanism
  statement: RetroMAE encodes a moderately masked input X_tilde_enc (30% mask ratio) into h_{X_tilde} = Phi_enc(X_tilde_enc) and performs single-layer enhanced decoding using query stream H_1 = [h_{X_tilde} + p_0, ..., h_{X_tilde} + p_N], unmasked context stream H_2 = [h_{X_tilde}, e_{x_1} + p_1, ..., e_{x_N} + p_N], and position-specific mask M_{ij} = 0 if x_j in s(X_{!= i}) or (j = 0 and i != 0) else -infinity (with diagonal M_{ii} = -infinity), optimizing L_enc + L_dec where L_dec = sum_{x_i in X} CE(x_i | A, H_1) reconstructs 100% of input tokens from distinct sampled contexts.
  evidence:
  - source_id: r747-primary-pdf
    locator: Section 3.1-3.3 (Equations 1-7 & Algorithm 1), pp. 3-5
    relation: supports
  - source_id: r747-primary-pdf
    locator: build_enhanced_decoding_mask, single_layer_enhanced_decode_attention & main
    relation: supports
- claim_id: retromae-zero-shot-and-supervised-dense-retrieval-gains
  kind: scope
  statement: Pre-trained on Wikipedia and BookCorpus at BERT-base scale, RetroMAE achieves 0.452 average nDCG@10 across 18 zero-shot BEIR benchmarks (+4.5 points over Condenser's 0.407 and +8.1 over BERT's 0.371), reaches 0.393 MRR@10 on MS MARCO under ANCE fine-tuning (surpassing coCondenser's 0.382), and achieves 0.416 MRR@10 on MS MARCO with cross-encoder KL knowledge distillation.
  evidence:
  - source_id: r747-primary-pdf
    locator: Section 4.2 (Main Results, Tables 1-5), pp. 6-7
    relation: supports
- claim_id: retromae-single-layer-decoder-and-encoder-mask-sensitivity-limitation
  kind: limitation
  statement: Enhanced position-specific decoding is restricted to a single-layer transformer decoder (increasing decoder depth to 2 or 3 layers requires disabling enhanced decoding and reduces MS MARCO MRR@10 from 0.3553 to 0.3439), and setting an overly aggressive encoder masking ratio (e.g., 0.9) discards sentence semantics and degrades MS MARCO MRR@10 from 0.3553 to 0.3365.
  evidence:
  - source_id: r747-primary-pdf
    locator: Section 4.3 (Ablation Studies, Table 6) & Section 6 (Limitations), pp. 8-9
    relation: supports
