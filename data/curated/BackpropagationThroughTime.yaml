limitations:
- The record covers full differentiation of a specified finite differentiable trajectory. Nonsmooth choices
  require a derivative convention, and stochastic expectation gradients require additional assumptions
  and estimators.
- A detached intermediate boundary changes the derivative problem unless its omitted contribution is zero.
  Particular truncation, checkpointing, reversible or online implementations require separate evidence.
- The initial-state and direct-parameter terms in the generalized formula are required by the chain rule.
  The source’s simple pseudocode uses fixed zero initial states and must not be generalized by silently
  dropping those terms.
- All eleven scanned journal pages were read. Earlier historical-priority sources, executable author code,
  modern library code and empirical performance were not inspected or reproduced.
- Constructed rational and finite-difference calculations check stated derivative boundaries only. No
  model training, paid service, hardware measurement or numerical benchmark was run.
