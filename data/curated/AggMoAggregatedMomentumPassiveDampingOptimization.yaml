claims:
- claim_id: nesterov-accelerated-gradient-recovery-as-k2-aggmo-special-case
  kind: mechanism
  statement: Section 4 (Eqs. 4-7, p. 4) proves that generalized AggMo with K = 2 damping coefficients beta = [0, beta] and velocity learning rates gamma_t^(1) = 2 gamma, gamma_t^(2) = 2 beta gamma yields the update theta_t = theta_{t-1} + gamma beta^2 v_{t-1} - (1 + beta) gamma nabla_theta f(theta_{t-1}), which is identical at every iteration to Nesterov's accelerated gradient under the lookahead reparameterization phi_t = theta_t + gamma beta v_t.
  evidence:
  - source_id: r606-primary-pdf
    locator: Section 4, Eqs. 4-7, p. 4; Appendix A, Figures 8-9, p. 12-13
    relation: supports
- claim_id: block-companion-dynamical-system-and-k-plus-1-order-finite-difference
  kind: mechanism
  statement: On quadratic objectives f(x) = (1/2) x^T A x + b^T x with eigenvalues {lambda_j}, AggMo evolves as a (K + 1)-dimensional linear dynamical system per eigenmode with block matrix B_j (Appendix B & C.1, p. 12-13, 17) and satisfies a (K + 1)-th order finite difference equation (Eqs. 9-12, p. 18), interpolating smoothly between the critical-damping convergence rates of its constituent beta^(i) modes and achieving ~3x faster convergence than Nesterov momentum in the under-damped regime (Section 5.1, Figure 3, p. 5).
  evidence:
  - source_id: r606-primary-pdf
    locator: Section 5.1, Figure 3, p. 4-5; Appendix B & C.1, Eqs. 9-12, p. 12-13, 17-18
    relation: supports
- claim_id: online-convex-programming-regret-bound-and-beta-averaged-momentum
  kind: scope
  statement: Under online convex programming with bounded gradients ||nabla f_t(theta)||_infty < G_infty, bounded domain diameter D, D_infty, stepsize gamma_t = gamma / sqrt(t), and decaying damping beta_t^(i) = beta^(i) lambda^t, Lemma 1 and Theorem 1 (Section 5.2, p. 5-6; Appendix C, p. 14-17) prove R(T) <= D_infty^2 sqrt(T) / gamma + (gamma sqrt(1 + log T) / (2K)) sum_{j=1}^d ||g_{1:T,j}||_4^2 sum_{i=1}^K (1 + beta^(i)) / (1 - beta^(i))^2 + (D^2 / (2K gamma (1 - lambda)^2)) sum_{i=1}^K beta^(i) = O(sqrt(T)); Appendix F (Eqs. 14-17, p. 21) further derives closed-form Beta-Averaged Momentum updates with weight E[b^k] = prod_{r=0}^{k-1} (alpha + r) / (alpha + beta + r).
  evidence:
  - source_id: r606-primary-pdf
    locator: Section 5.2, Theorem 1, p. 5-6; Appendix C, Lemma 1, p. 14-17; Appendix F, Eqs. 14-17, p. 21
    relation: supports
- claim_id: autoencoder-cnn-resnet-without-batchnorm-and-lstm-benchmarks
  kind: application
  statement: Across MNIST deep autoencoders, CIFAR-10 CNN-5, CIFAR-10/100 ResNet-32 (including training ResNet-32 without batch normalization at large learning rates), and Penn Treebank 3-layer LSTM language modeling, AggMo achieves faster training convergence and lower or competitive validation/test loss compared to classical momentum, Nesterov momentum, and Adam while remaining stable at damping coefficients up to 0.999.
  evidence:
  - source_id: r606-primary-pdf
    locator: Section 7.1-7.3, Tables 1-3 and Figures 4-7, p. 7-9
    relation: supports
- claim_id: k-fold-velocity-memory-overhead-and-open-closed-form-spectral-analysis
  kind: limitation
  statement: AggMo stores K separate velocity vectors of the same dimension as the model parameters (increasing optimizer state memory K-fold over classical momentum), lacks a closed-form analytical formula for the optimal learning rate and complex eigenvalue boundaries of B_j for K >= 2 (Appendix B & C.1, p. 13, 17), and its continuous Beta-Averaged Momentum analog requires storing the full gradient history (Appendix F, p. 21).
  evidence:
  - source_id: r606-primary-pdf
    locator: Section 3.1, p. 4; Appendix B, p. 13; Appendix C.1, p. 17-18; Appendix F, p. 21
    relation: supports
