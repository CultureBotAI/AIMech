id: AIMech:AggMoAggregatedMomentumPassiveDampingOptimization
name: Aggregated Momentum (AggMo Passive Damping Optimizer)
concept_kind: algorithm
review_status: DRAFT
definition: 'A multi-velocity first-order momentum optimization method inspired by passive structural damping that maintains K parallel velocity vectors v_t^(1), ..., v_t^(K) associated with a damping vector beta = [beta^(1), ..., beta^(K)] (by default exponentially spaced as beta^(i) = 1 - a^{i-1} with scale factor a = 0.1 for i = 1, ..., K). At each step t, AggMo updates every velocity independently via v_t^(i) = beta^(i) v_{t-1}^(i) - nabla_theta f(theta_{t-1}) and updates the parameters by averaging the velocities: theta_t = theta_{t-1} + (gamma_t / K) sum_{i=1}^K v_t^(i) (or with per-velocity stepsizes gamma_t^(i) in Eq. 4, or continuous Beta(alpha, beta) density integration in Beta-Averaged Momentum, Eqs. 14-17).'
identity_notes: 'Distinct from Classical Polyak Momentum, Nesterov Accelerated Gradient, and AdEMAMix (AIMech:AdEMAMixAdaptiveEMAMixtureOptimization): AggMo is a non-adaptive multi-frequency passive-damping momentum scheme whose dynamics evolve according to a (K + 1)-th order finite difference equation (Appendix C.1, Eq. 12) rather than a 2nd-order ODE discretization, and whose generalized K = 2 form with beta = [0, beta] and gamma_t^(1) = 2 gamma, gamma_t^(2) = 2 beta gamma exactly recovers Nesterov''s half-step reparameterized iterate phi_t = theta_t + gamma beta v_t (Section 4, Eqs. 4-7).'
aliases:
- AggMo
- Aggregated Momentum Optimizer
- Passive Damping Aggregated Momentum and Beta-Averaged Momentum
