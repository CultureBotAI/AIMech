aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 319 preceding native IDs/names/aliases;
    both full checkouts including ignored and hidden text; semantic search for SAT/search, weighting,
    assignment reuse, stochastic processes and evolutionary terminology; eight exact AIO CLASS nodes and
    six complete native neighbors.
  rationale: No suitable AIO target was established for this GSAT search extension in the inspected snapshot
    and semantic neighborhood. Search-history reuse and adaptive penalties do not justify a forced learning-task
    or language-model mapping.
  examined_targets:
  - target: AIO:ReasoningLLM
    rejection_reason: Solving a supplied CNF formula does not require a language model that performs language-task
      reasoning.
  - target: AIO:TrainingStrategy
    rejection_reason: The procedure adjusts search costs or initialization rather than requiring preprocessing
      to train a machine-learning model.
  - target: AIO:MachineLearningTask
    rejection_reason: Retaining solver information between attempts does not by itself identify a process
      of developing a reusable method that learns from data.
  - target: AIO:ReinforcementLearning
    rejection_reason: Adaptive clause weights or assignment reuse are not learned reward/action-value
      policies merely because they use search history.
  - target: AIO:MarkovChain
    rejection_reason: A state representation can include search memory, but that mathematical representation
      alone does not ground this particular retained-weight or retained-assignment algorithm in the pinned
      network/model class.
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: The method operates on Boolean assignments and clause scores, not a network of artificial
      neurons.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The target is a language model optimized with evolutionary computation. Its related
      evolutionary-algorithms synonym does not make Boolean assignment averaging a language-model architecture.
  - target: AIO:WeightedLayer
    rejection_reason: Weights on SAT clauses are not values applied to cells or neurons in a network.
