name: GSAT clause-weighting strategy
definition: A GSAT extension that starts each clause with weight one, uses weighted clause counts to select
  flips, and increases the weights of clauses unsatisfied by the current assignment at the end of each
  search attempt.
concept_kind: algorithm
identity_notes: 'This is Strategy I of Selman and Kautz’s 1993 GSAT extensions. The adaptive weights guide
  solving the original SAT formula; they are not externally supplied weighted MAX-SAT preferences. The
  update occurs between attempts and uses the current end-of-attempt assignment, unlike Breakout’s reweighting
  at non-solution local minima within a run or Fill’s state-specific cost lifts. The paper credits Morris
  with an independently proposed similar approach rather than claiming exclusive invention. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 319 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  11 and 11 lines respectively. All eleven unique lines were inspected, and the sorted checkout hit sets
  were identical: source-title references and saved review/ledger frontier leads, not existing candidate
  records. Eight exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native
  neighboring records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The source reports an empirical search extension, not a completeness or polynomial-time guarantee. Unsuccessful
  finite search does not certify UNSAT, and Fill’s separate completeness theorem must not be transferred
  to these shared clause weights.
- 'The update schedule matters: raising weights at every local minimum, at every flip, or according to
  a stored best assignment implements a different rule. The source does not prescribe a decay, cap or
  automatic normalization of these retained weights.'
- K=1 is a reported usual choice, not a universal optimum. Positive integer weights preserve the source’s
  repeated-clause interpretation; arbitrary real, negative or externally fixed weights require a separate
  formulation.
- Attempt budgets, initialization, tie handling and the original GSAT final-flip test boundary remain
  implementation choices to declare. Combining the extension with other strategies does not justify inventing
  their interaction or reset semantics. No source solver or numerical experiment was run.
