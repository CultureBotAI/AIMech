claims:
- claim_id: method
  kind: mechanism
  statement: Initialize all clause weights to 1. During a GSAT attempt, count a clause according to its
    positive integer weight when evaluating the change in satisfied-clause score from a variable flip.
    Choose a best weighted-score flip with the underlying GSAT tie convention. A clause of weight L therefore
    contributes as if it occurred L times. At the end of an unsuccessful attempt, increment by K the weights
    of every clause unsatisfied by the current assignment, retain the resulting weights and begin the
    next attempt under the selected initialization rule. The paper normally uses K=1. Satisfaction of
    the original formula remains the stopping goal; adaptive weights alter move ranking but do not change
    which assignments satisfy all clauses. The source’s update names the current assignment, not the best
    assignment seen earlier in that attempt.
