id: AIMech:AveragedStochasticGradientDescent
name: Averaged stochastic gradient descent
definition: A stochastic gradient optimization method that maintains an average of parameter iterates
  in addition to the current iterate.
concept_kind: algorithm
identity_notes: ASGD adds parameter-iterate averaging to stochastic gradient descent. It is not the same
  operation as averaging gradients in a momentum buffer.
definition_evidence:
- source_id: pytorch-docs
  locator: ASGD class documentation lines 174–200 and _single_tensor_asgd averaging/update lines 248–273
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The inspected implementation updates the current parameters by a scheduled gradient step
    and maintains an auxiliary parameter average, with averaging weights controlled by the iteration count
    and a configurable starting point.
  evidence:
  - source_id: pytorch-docs
    locator: ASGD class documentation lines 174–200 and _single_tensor_asgd averaging/update lines 248–273
    relation: supports
