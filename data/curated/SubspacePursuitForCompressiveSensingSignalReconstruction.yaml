claims:
- claim_id: claim-01
  kind: mechanism
  statement: Because Subspace Pursuit re-projects the measurement vector y onto the pruned K-column subspace span(Phi_{T^{l-1}}) to form y_r^{l-1} = resid(y, Phi_{T^{l-1}}), the correlation vector Phi^* y_r^{l-1} vanishes identically on all currently active indices T^{l-1} (Lemma 2), ensuring that the K newly selected correlation indices are strictly disjoint from T^{l-1} and that the merged support T_tilde^l has exact cardinality 2K, requiring only 3K-restricted isometry constants delta_{3K} rather than 4K-RIP constants.
  evidence:
  - source_id: r316-primary-pdf
    locator: Section II.A, Algorithm 1, p. 3; Section III.A, Lemma 2 and Theorem 1, pp. 4-5; Appendix B-C, Proofs of Lemmas 2 and Theorem 1, pp. 12-14
    relation: supports
  - source_id: r316-metadata-cr
    locator: Bibliographic metadata for IEEE Transactions on Information Theory 55(5):2230-2249
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Under the noiseless 3K-RIP condition delta_{3K} < 0.205 (or delta_{3K} < 0.165 for both support-missed error and residue norms), Theorem 1 and Theorem 2 prove the per-step contractions ||x_{T - T^l}||_2 <= c_K ||x_{T - T^{l-1}}||_2 and ||y_r^l||_2 <= c'_K ||y_r^{l-1}||_2 with c_K, c'_K < 1, guaranteeing exact K-sparse recovery in finite iterations <= ceil(log(x_min/||x||_2)/log(c_K)) (Theorem 3); under noisy compressible measurements with delta_{3K} < 0.083, Theorem 9 proves ||x - x_hat||_2 <= C_1 ||x - x_K||_2 + (C_1/sqrt(K)) ||x - x_K||_1 + C_2 ||e||_2.
  evidence:
  - source_id: r316-primary-pdf
    locator: Section III.A-B, Theorems 1, 2, and 3, pp. 4-6; Section IV, Theorem 9, pp. 8-9; Appendix F, Proof of Theorem 9, pp. 15-17
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Unlike CoSaMP, each Subspace Pursuit iteration performs two least-squares pseudoinversions (one on the 2K-column matrix Phi_{T_tilde^l} for pruning and a second on the K-column matrix Phi_{T^l} to orthogonalize the residue y_r^l), and requires the target sparsity K to be known a priori.
  evidence:
  - source_id: r316-primary-pdf
    locator: Section II.A-B, Algorithm 1 and Comparison with CoSaMP/ROMP, pp. 3-4; Section III.C, Computational Complexity Theorems 6-8, pp. 7-8
    relation: supports
