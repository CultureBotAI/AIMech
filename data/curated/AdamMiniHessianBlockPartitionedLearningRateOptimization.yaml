id: AIMech:AdamMiniHessianBlockPartitionedLearningRateOptimization
name: Adam-mini (Hessian-Block-Partitioned Learning Rate Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient adaptive first-order optimization algorithm that partitions neural network parameters into blocks corresponding to the smallest dense sub-blocks of the Hessian matrix and replaces Adam's coordinate-wise second-moment vector within each block by a single scalar exponential moving average of the block-mean squared gradient, eliminating over 99.9% of second-moment parameters and halving total optimizer-state memory.
identity_notes: Distinct from NovoGrad (AIMech:NovoGrad), which partitions parameters coarsely by entire PyTorch layers (causing training instability on billion-parameter Transformers) and normalizes the current gradient before accumulating first-order momentum; Adam-mini partitions Transformer parameters by smallest dense Hessian sub-blocks (heads for Query/Key, output neurons for Value/Attn.Proj/MLP, and tokens for Embedding/Output) and retains standard AdamW first-order momentum m_b while averaging g_b (.) g_b per block. Distinct from LAMB (AIMech:LambLayerwiseAdaptiveLargeBatchOptimization), which retains full coordinate-wise v in R^d alongside layerwise trust-ratio scaling and saves zero memory.
aliases:
- Adam-mini
- Adam-mini Optimizer
- Hessian-Structure Blockwise Adaptive Learning Rate Optimizer
- Smallest-Dense-Hessian-Subblock AdamW
