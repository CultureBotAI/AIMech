limitations:
- This record covers the fractional-symbol stack formulation inspected in the 1992 author manuscript,
  not every later neural pushdown automaton or all differentiable-stack architectures.
- Simulation thresholds have unspecified exact endpoints, and empty-stack, underflow and signed-action
  implementation details are not certified. No allocator or executable implementation was inspected.
- The stack-read sensitivity is an explicit approximation. Analog quantities and a recursive derivative
  expression do not certify a globally exact or smooth gradient computation.
- A zero illegal-string surrogate loss does not alone enforce the stronger categorical rejection alternatives
  stated in the source prose.
- Hints add grammar information; quantization is an additional extraction step. Selected small-language
  comparisons do not establish arbitrary-grammar learning or unlimited exact recognition.
- All six pages of the author-hosted conference manuscript were read. No later version, author code, training,
  runtime audit or empirical replication was inspected. Earlier work is acknowledged; historical priority
  is not asserted.
