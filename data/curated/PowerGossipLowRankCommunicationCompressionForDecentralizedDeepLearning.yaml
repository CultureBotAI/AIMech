claims:
- claim_id: powergossip-distributed-linear-projection-and-power-iteration-mechanism
  kind: mechanism
  statement: Exploiting the linearity of matrix-vector multiplication, connected nodes i and j maintain a shared projection vector v_{ij} = -v_{ji}, locally compute vectors p_j = X_j v_hat and p_i = X_i v_hat for v_hat = v_{ij} / ||v_{ij}||_2, exchange p_j and p_i to form the rank-1 update Q_hat = (p_j - p_i) v_hat^T = C_{v_hat}(X_j - X_i), and update v_{ij} <- p_j - p_i (alternating between X and X^T across s power-iteration steps) while preserving the exact global average X_bar^(t) = X_bar^(0) (Lemma 1).
  evidence:
  - source_id: r556-primary-pdf
    locator: Section 4 Equations (2)-(3), Algorithms 1-2, & Appendix A Lemma 1, pp. 3-4, 12
    relation: supports
- claim_id: powergossip-q-linear-consensus-and-asymptotically-independent-sgd-scope
  kind: scope
  statement: For any delta-approximate unbiased linear projection operator C satisfying C(X+Y)=C(X)+C(Y), C(C(X))=C(X), and E[C(X)]=delta*X (such as random rank-k subspace projection with delta = k/q) over a mixing matrix W with spectral gap rho = 1 - lambda_2^2 > 0, compressed consensus achieves a parameter-free Q-linear rate (1/N) sum_{i=1}^N E||X_i^(t) - X_bar^(0)||_F^2 <= (1 - rho*delta) (1/N) sum_{i=1}^N ||X_i^(t-1) - X_bar^(0)||_F^2 (Theorem I), and compressed stochastic optimization reaches epsilon-accuracy in O(L*sigma^2 / (n*epsilon^2) + sqrt(L)*(zeta+sigma) / (rho*delta*epsilon^(3/2)) + L / (rho*delta*epsilon)) non-convex rounds (Theorem II).
  evidence:
  - source_id: r556-primary-pdf
    locator: Section 5.1 Assumptions (A4)-(A5) & Section 5.2 Theorems I-II, pp. 5-6
    relation: supports
- claim_id: powergossip-peaky-spectrum-and-per-edge-vector-state-limitation
  kind: limitation
  statement: Low-rank power-iteration compression outperforms random projections only when inter-worker parameter differences exhibit a peaky singular-value spectrum (whereas on unstructured i.i.d. Gaussian matrices no compressed gossip outperforms uncompressed gossip per bit), and each node must store previous projection vectors v_{ij} scaling linearly with its number of graph neighbors.
  evidence:
  - source_id: r556-primary-pdf
    locator: Section 4.1 Properties, Section 6 Figure 1, & Appendix E.2, pp. 4, 7, 16
    relation: supports
- claim_id: powergossip-decentralized-cifar-resnet20-and-wikitext2-lstm-application
  kind: application
  statement: Applied to decentralized training of ResNet-20 on CIFAR-10 (8-worker ring, 34x-57x compression) and 3-layer LSTMs on WikiText-2 language modeling (16-worker ring, 35x-122x compression) using the exact centralized SGD learning rate without tuning any compression hyperparameters.
  evidence:
  - source_id: r556-primary-pdf
    locator: Section 6 Experimental analysis, Tables 1-2, pp. 7-8
    relation: supports
