id: AIMech:PowerGossipLowRankCommunicationCompressionForDecentralizedDeepLearning
name: PowerGossip Low-Rank Communication Compression for Decentralized Deep Learning
concept_kind: algorithm
review_status: DRAFT
definition: A hyperparameter-free compressed gossip and decentralized stochastic optimization algorithm (PowerGossip) that directly compresses pairwise model parameter matrix differences X_j - X_i in R^(p x q) across connected neighbors (i, j) using linear rank-1 projection operators C_{v_{ij}}(X_j - X_i) = (X_j v_{ij} - X_i v_{ij}) v_{ij}^T updated via alternating power-iteration steps v^(2k+1) = D^(2k) v^(2k) / ||D^(2k) v^(2k)||_2 and v^(2k) = (D^(2k-1))^T v^(2k-1) / ||(D^(2k-1))^T v^(2k-1)||_2 on D^(k) = X_j^(k) - X_i^(k), enabling distributed vector exchange of p_j = X_j v_hat and p_i = X_i v_hat without communicating full p x q matrices or tuning a separate consensus stepsize.
identity_notes: Introduced by Thijs Vogels, Sai Praneeth Karimireddy, and Martin Jaggi (NeurIPS 2020, Vol. 33, pp. 14171-14181; arXiv:2008.01425). Distinct from PowerSGD (Vogels, Karimireddy, & Jaggi, NeurIPS 2019), which performs centralized all-reduce low-rank approximation of error-compensated gradients rather than pairwise edge-wise model-difference compression; and distinct from Choco-SGD / Choco-Gossip (Koloskova et al., ICML 2019) and DeepSqueeze (Tang et al., 2019), which maintain full-model neighbor replicas or error buffers and require tuning an additional consensus stepsize gamma.
aliases:
- PowerGossip
