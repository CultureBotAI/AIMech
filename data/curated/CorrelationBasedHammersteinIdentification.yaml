claims:
- claim_id: correlation-separation
  kind: mechanism
  statement: The first stage correlates centered output with the centered Gaussian input fluctuation of
    excitation u=b+x. Under the source’s independent-output-noise and sufficiently white practical-excitation
    assumptions, the result approximates alpha*h, with alpha=mu*[gamma1+2*b*gamma2+3*gamma3*(variance(x)+b²)+...]
    and mu the input autocorrelation area. The report explicitly distinguishes finite practical variance
    from ideal continuous-white variance. For discrete iid unit-variance Gaussian inputs the corresponding
    factorization is exact at the population level. A nonzero alpha and appropriate moment/linear-response
    conditions are needed for recovery.
  evidence:
  - source_id: billings-fakhouri1978-hammerstein
    locator: Section 2, Equations 3–14, PDF pp. 5–8 / printed pp. 3–6; the discrete iid statement is a
      direct curator Gaussian-moment consequence of these equations
    relation: supports
- claim_id: filtered-input-powers
  kind: mechanism
  statement: After estimating the scaled linear response, build a design column for each degree j by filtering
    u^j through that response. Least-squares fit measured output on these columns. The input u includes
    the applied mean; x denotes the centered fluctuation only in the correlation stage. The displayed
    inverse requires full column rank. This differs from raising a filtered input to successive powers
    as in Wiener identification, and it does not select the polynomial degree or linear order automatically.
  evidence:
  - source_id: billings-fakhouri1978-hammerstein
    locator: Section 2, Equations 14–17, PDF pp. 8–9 / printed pp. 6–7; Figure 2, PDF p. 22
    relation: supports
  - source_id: billings-fakhouri1977-wiener
    locator: 'Equations 13–17, PDF pp. 7–8 / printed pp. 4–5: Wiener powers-of-filtered-input design'
    relation: supports
- claim_id: scale-reparameterization
  kind: scope
  statement: If the first stage recovers alpha*L, divide every polynomial coefficient by alpha, independent
    of its degree, to preserve L(g(u)). For h=(1,2), u=(1,2,-1), g(v)=v+v² and scale 3, the two filtered-power
    columns are (3,12,9) and (3,18,27); coefficients (1/3,1/3) reproduce outputs (2,10,12). These are
    exact deterministic curator calculations and do not uniquely determine the physical block gains or
    establish finite-sample estimation performance.
  evidence:
  - source_id: billings-fakhouri1978-hammerstein
    locator: Section 2, coefficient relation following Equation 15 and Equations 16–17, PDF pp. 8–9 /
      printed pp. 6–7; curator exact calculations in research/discovery/correlation-identification-boundaries.py
    relation: supports
- claim_id: gain-and-variant-boundaries
  kind: limitation
  statement: 'Even with u_t=1+x_t for iid standard Gaussian x, g(u)=u³-6u has zero centered input/output
    cross-correlation through a nonzero LTI block: the polynomial contributions cancel. The source’s nonzero-mean
    recommendation therefore needs a nonzero-gain check. Its separate parallel-feedforward extension uses
    squared-input correlation, whose gain can also vanish, and generally identifies the combined linear
    branch h1+omega1*h2 rather than both original paths. Those extra steps are not part of this two-stage
    Hammerstein algorithm.'
  evidence:
  - source_id: billings-fakhouri1978-hammerstein
    locator: Section 2, Equations 12–13, PDF p. 7 / printed p. 5; Section 3, Equations 20–32, PDF pp.
      11–15 / printed pp. 9–13; Conclusions, PDF p. 17 / printed p. 15; curator exact calculations in
      research/discovery/correlation-identification-boundaries.py
    relation: supports
