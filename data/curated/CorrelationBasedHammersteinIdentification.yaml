id: AIMech:CorrelationBasedHammersteinIdentification
name: Correlation-based Hammerstein identification
concept_kind: algorithm
definition: A two-stage identification algorithm for a real-valued single-input single-output polynomial
  Hammerstein cascade that estimates a scaled linear response from Gaussian-excited input/output cross-correlation,
  then fits the input polynomial by least squares on filtered input powers.
identity_notes: 'Compared all 442 pinned AIO IDs, names and scoped synonyms and 534 native IDs, names
  and aliases with both proposed estimator names, expanded two-stage/correlation names and related Bussgang/linear-approximation
  terms: no normalized identity match. Ignored- and hidden-inclusive full-text searches of the accessible
  recovery worktree and readable earlier worktree returned 81 and 68 lines. All distinct matched text
  was read; it concerns pending Bussgang blind-deconvolution leads and prior cascade-model source context.
  Blind deconvolution with unknown input is not these observed-input estimators. Original Documents untracked
  files remain inaccessible and are not claimed re-audited. Read all 36 semantic AIO rows, 58 native name/definition
  neighbors, eight complete annotated AIO CLASS nodes with incident edges, eight contextual generated
  YAMLs and six complete native neighbors. Wiener/Hammerstein records denote models, RPE/PLR denote recursive
  updates, forward OLS selects candidate structure, and the iterated Wiener filter estimates an image
  under a fixed prior. These are distinct mechanisms. AIO linear/least-squares regression supplies component
  fitting context, not the ordered two-stage estimator identity. DCC models changing covariances, GLM
  specifies a statistical link, ARDL specifies lagged model structure, and a convolutional layer is a
  neural component. No exact mapping is justified. These local descriptive method names do not claim original
  nomenclature or priority.'
