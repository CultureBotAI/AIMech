claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any n x d full-rank matrix A = U_A Sigma_A V_A^T, exact least-squares minimizer x_opt = A^+ b, and orthogonal residual b^perp = b - A x_opt with Z = ||b^perp||_2, Lemma 1 and Lemma 2 prove that whenever the sketching operator X satisfies Condition (8) sigma_min^2(X U_A) >= 1/sqrt(2) and Condition (9) ||U_A^T X^T X b^perp||_2^2 <= epsilon Z^2 / 2, the sketched normal equations obey (X U_A)^T X U_A z_opt = (X U_A)^T X b^perp where U_A z_opt = A(tilde{x}_opt - x_opt), yielding ||z_opt||_2^2 <= epsilon Z^2, ||b - A tilde{x}_opt||_2 <= (1 + epsilon) Z, and ||x_opt - tilde{x}_opt||_2 <= (sqrt(epsilon) / sigma_min(A)) Z <= sqrt(epsilon) (kappa(A) sqrt(gamma^{-2} - 1)) ||x_opt||_2.
  evidence:
  - source_id: r333-primary-pdf
    locator: Section 4.1, Structural Conditions (Equations 8-9), Lemma 1 (Equations 10-19), and Lemma 2 (Equations 20-21), pp. 6-8 of PDF (pp. 229-232)
    relation: supports
  - source_id: r333-arxiv-abs
    locator: 'Abstract: (1+epsilon) residual and kappa(A) sqrt(gamma^{-2}-1) parameter approximation in O(nd log n) time'
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Lemma 3 proves that applying the Randomized Hadamard Transform H D to any n x d orthonormal matrix U_A flattens all row leverage scores simultaneously to ||(H D U_A)_{(i)}||_2^2 <= (2 d log(40 n d)) / n for all i in [n] with probability at least 0.95, enabling uniform row sampling of r = max(48^2 d log(40 n d) log(100^2 d log(40 n d)), 40 d log(40 n d) / epsilon) rows in Algorithm 1 to satisfy both Conditions (8) and (9) in O(n d log r + r d^2) total time (Theorem 1).
  evidence:
  - source_id: r333-primary-pdf
    locator: Section 2, Theorem 1, p. 4 of PDF; Section 4.2, Lemma 3 (Equation 23), Lemma 4, and Lemma 5, pp. 8-13 of PDF
    relation: supports
  - source_id: r333-metadata-cr
    locator: Numerische Mathematik 117(2):219-249 bibliographic record
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Without Randomized Hadamard preconditioning H D, uniform row sampling S^T A on a design matrix A with a spiky high-leverage row (||(U_A)_{(i)}||_2^2 = 1) misses that row with probability (1 - 1/n)^r, producing a rank-deficient sampled matrix sigma_min(S^T A) = 0 and singular normal equations; moreover, direct sketch-and-solve requires r = Omega(d / epsilon) rows scaling inversely with epsilon.
  evidence:
  - source_id: r333-primary-pdf
    locator: Section 1 and Section 4.2, Discussion of non-uniform leverage scores and 1/epsilon sample complexity of direct sketch-and-solve, pp. 2-5, 8-12
    relation: supports
