claims:
- claim_id: five-generation-taxonomy-and-primal-dual-saddle-point-reformulation
  kind: mechanism
  statement: "Section 1.2 (Table 1) classifies local training into five generations \u2014 heuristic local SGD (Gen 1), homogeneous-data LT (Gen 2), drift-corrected unaccelerated LT such as Scaffold with O(kappa log(1/epsilon)) communication (Gen 3), full-participation accelerated LT such as Scaffnew/ProxSkip with O(sqrt(kappa) log(1/epsilon)) communication (Gen 4), and accelerated client-sampling LT (Gen 5) \u2014 and Section 3 (Equations 11-12) grounds 5GCS in the lifted saddle-point reformulation min_{x in R^d} max_{u_1, ..., u_n in R^d} {(1/n) sum_{i=1}^n (langle x, u_i rangle - f_i^*(u_i)) + r(x)}."
  evidence:
  - source_id: r581-primary-pdf
    locator: Section 1.2, Table 1, pp. 2-4; Section 3, Equations (11)-(12), p. 5
    relation: supports
- claim_id: accelerated-client-sampling-communication-complexity-under-app-condition
  kind: mechanism
  statement: "Theorem 4.2 proves that for any contraction factor delta in [0, (1 + mu/(2 tau))^{-1}) in the Approximate Proximal Point condition ||hat{x}_i^t - x_i^*(tilde{x}^t, u_i^t)||^2 <= delta ||tilde{x}^t - x_i^*(tilde{x}^t, u_i^t)||^2 (Definition 4.1) and any penalty tau >= (n/(2 s) - 1) mu, setting alpha = tau (1 - delta (1 + mu/(2 tau)))/(1 + delta) yields linear Lyapunov contraction E[Psi^{t+1}] <= (1 + theta)^{-1} Psi^t, attaining epsilon-accuracy in T = O(((n/s) + sqrt((n/s)(tau/mu))) log(1/epsilon)) communication rounds \u2014 simplifying at the optimal penalty tau = (n L)/s to O((n/s) sqrt(L/mu) log(1/epsilon)) rounds."
  evidence:
  - source_id: r581-primary-pdf
    locator: Section 4, Definition 4.1, Algorithm 1, Theorem 4.2, and Corollary 5.1, pp. 6-8
    relation: supports
  - source_id: r581-metadata-cr
    locator: Bibliographic record (PMLR 206:1055-1092)
    relation: supports
- claim_id: fixed-local-gd-and-cgd-inner-loop-implementations-of-5gcs
  kind: application
  statement: "Section 5 (Algorithms 2 and 3, Theorems 5.2 and 5.4) instantiates the APP(delta) local solver using K fixed local gradient descent steps with stepsize gamma = 2/(L + mu + 2 tau) \u2014 requiring only K >= (1 + L s / (n mu)) log(4) local steps (at most K = ceil(2 log 4) = 3 local steps when tau >= L) to achieve O((n/s) sqrt(L/mu) log(1/epsilon)) communication \u2014 as well as randomized Coordinate Gradient Descent (CGD) and Accelerated CGD local solvers."
  evidence:
  - source_id: r581-primary-pdf
    locator: Section 5.2-5.4, Algorithms 2-3, Theorems 5.2 and 5.4, Table 1, pp. 8-10
    relation: supports
- claim_id: client-statefulness-and-strong-convexity-requirement
  kind: limitation
  statement: 5GCS requires each client i in {1, ..., n} to maintain a persistent local dual control variate u_i^t in R^d across rounds (making it a stateful cross-silo/cross-device method) and relies on strong convexity (mu > 0) of the local objectives f_i or global regularizer r for its accelerated O((n/s) sqrt(L/mu) log(1/epsilon)) rate.
  evidence:
  - source_id: r581-primary-pdf
    locator: Section 2, Assumption 2.1, p. 4; Section 4, Algorithm 1, p. 6
    relation: supports
