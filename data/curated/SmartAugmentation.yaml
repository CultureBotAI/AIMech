claims:
- claim_id: method
  kind: mechanism
  statement: During training, an augmentation network A takes same-class examples and produces a synthetic
    example of the original sample type and spatial shape. A reference example from that class supplies
    an augmentation loss L_A, while a target network B supplies its task loss L_B. Backpropagate through
    B into A using a combined objective f(L_A,L_B), which may be weighted or scheduled. A can be shared
    across classes or specialized into separate class-dependent networks. In the published grayscale realization,
    stack k same-class input images as channels, produce a one-channel image, and choose an additional
    same-class reference that is not one of those inputs. L_A is mean squared error to this reference;
    B processes the generated image and the reference as separate examples with categorical cross-entropy
    L_B. Figure 9 combines losses as alpha*L_A+beta*L_B. At test time discard A and use B on ordinary
    examples. Multi-example blending is the central construction, while the reported experiments also
    include a one-input setting; fixed channel counts, architectures and weights are protocol choices.
