claims:
- claim_id: method
  kind: mechanism
  statement: Generate two augmented views v and v′ of each image. The online branch computes p(v)=q_theta(g_theta(f_theta(v))),
    and the target branch computes z_xi(v′)=g_xi(f_xi(v′)). Normalize both nonzero vectors and minimize
    their squared distance, plus the reversed-view term p(v′) versus z_xi(v), averaged over the batch.
    Stop gradients at target projections and optimize only the online encoder, projector and predictor.
    After the optimizer step update the corresponding target encoder/projector parameters by xi←tau xi+(1−tau)theta
    with tau in [0,1] and a chosen decay schedule. The target branch has no predictor to update. After
    training retain the online encoder f_theta and discard the training heads and target branch for the
    stated downstream representation.
