name: Bootstrap Your Own Latent
definition: A self-supervised image representation-learning procedure that trains an online predictor
  to match a stopped-gradient target projection from another augmented view, while updating the target
  encoder and projector by exponential moving averages.
concept_kind: algorithm
identity_notes: BYOL is the 2020 online/target learning procedure, not statistical bootstrap resampling
  or a particular trained network. Only the online branch has the prediction head. Its normalized regression
  objective has no explicit negative-pair term or historical key queue. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 187 prior native IDs/names/aliases. Ignored-inclusive
  searches of both full checkouts found no discovery-checkout hits and nine unrelated main-environment
  substrings (Pygments and Sphinx locale/bundle text). Exact neighboring AIO definitions, synonyms and
  incident edges were inspected; task/network vocabulary does not make these algorithms equivalent.
limitations:
- The paper’s general same-architecture wording is qualified by its explicit online-only predictor in
  Figure 2 and the algorithm. Matching encoder/projector weights are averaged; a nonexistent target predictor
  is not required.
- Absence of an explicit negative-pair term does not prove collapse impossible. The source’s conditional-variance
  explanation assumes an optimal predictor and simplified unnormalized, unsymmetrized dynamics; it is
  an intuition, not a general convergence theorem.
- Batch normalization still couples examples. The batch-size ablation also accumulates gradients to control
  effective update size; it does not establish unconditional batch-size independence.
- Augmentation, normalization, predictor design and target-decay schedule affect training. tau=1 freezes
  the target and tau=0 copies the online parameters; these endpoints do not by themselves reproduce the
  usual slow-target regime.
- Vector normalization needs a defined nonzero-norm numerical treatment. No universal transfer benefit,
  benchmark reproduction or model checkpoint is asserted.
