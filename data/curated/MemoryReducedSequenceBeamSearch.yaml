name: Memory-reduced best-first beam search for sequence decoding
definition: A capacity-limited variant of per-length best-first sequence beam search that, when its chosen
  total queue capacity is reached, removes the worst-scoring active hypothesis from the earliest active
  sequence length.
concept_kind: algorithm
identity_notes: This is the memory-reduced variant in Meister, Vieira and Cotterell Section 3.3. Its eviction
  first chooses the earliest active length, so it differs from globally removing the worst-ranked hypothesis.
  It also differs from the base per-length best-first procedure, which can retain hypotheses at several
  lengths without this extra capacity pruning. No normalized identity match was found across the 442 AIO
  and 135 prior native records; ignored-inclusive text hits in the main checkout were prior discovery
  leads, source citations, scope contrasts and DCBSS substring matches, plus seven public certificate-data
  substring matches, not existing concept records.
limitations:
- The finite beam is an approximation to exact sequence-model decoding; equality to a specified beam procedure
  is not global MAP optimality.
- Sequence length limits, EOS handling and compatible deterministic tie conventions are part of the comparison.
  Arbitrary implementations with different stopping or tie rules need not return identical hypotheses.
- Queue counts are counts of retained hypotheses, not total bytes including neural states, model parameters,
  backpointers and temporary successors. No numerical speedup or benchmark-quality claim is curated.
- Additional capacity eviction can remove paths retained by the unmodified beam procedure, so its same-output
  guarantee is not inherited. The memory/quality tradeoff is empirical and problem dependent.
- The queue cap does not bound the entire decoder or neural model memory. The earliest-length eviction
  is not a global worst-score eviction rule.
- No guarantee for arbitrary nonmonotonic scores or globally optimal sequence decoding is asserted.
