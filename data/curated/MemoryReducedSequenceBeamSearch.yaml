claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Organize active hypotheses in queues for their sequence lengths and prioritize lengths by
    their best available score. Apply the base per-length beam limits and an additional total active-queue
    capacity. To make room, evict the minimum-scoring item in the earliest nonempty length queue; then
    continue decoding the surviving agenda.
  evidence:
  - source_id: method-source
    locator: Section 3.3, Memory-Reduced Best-First Beam Search, printed pp. 799–800 / PDF pp. 5–6
    relation: supports
- claim_id: capacity-boundary
  kind: limitation
  statement: The variant adds pruning to the base decoder by limiting queue capacity and targeting the
    earliest active time step for eviction. The paper presents it as a separate memory-reduced method,
    not as the unchanged monotone-beam equivalence construction.
  evidence:
  - source_id: capacity-boundary
    locator: Section 3.3 memory-reduced variant, printed pp. 799–800 / PDF pp. 5–6
    relation: supports
