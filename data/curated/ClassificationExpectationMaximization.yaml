aio_mappings:
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The defining procedure estimates a hard grouping of unlabeled observations alongside fitted
    component parameters. The pinned target is a clustering task, so the algorithm is related without
    an is-a assertion. The word classification in the historical name does not identify the explicitly
    supervised AIO:Classification class.
claims:
- claim_id: e-c-m
  kind: mechanism
  statement: Compute t_ik proportional to p_k f_k(x_i) at the current fit. Assign observation i to a maximizing
    component; the inspected report chooses the smallest component index on ties. Fit parameters by maximizing
    the hard-assignment completed log likelihood. When mixing weights are estimated, p_k becomes n_k/N
    and each component fit uses its assigned data. Exact admissible C and M steps make that classification
    criterion nondecreasing; undefined or singular maximizers need an explicit policy.
  evidence:
  - source_id: cem-source
    locator: Section 3 Eq3.1-3.4, p.5 / PDF7; Proposition 2, pp.6-7 / PDF8-9
    relation: supports
- claim_id: criterion-and-kmeans
  kind: scope
  statement: The mixture classification criterion is sum_i log[p_(z_i) f_(z_i)(x_i)], which includes sum_k
    n_k log p_k. The separate-sampling criterion omits that weight term. With fixed equal weights and
    a common spherical Gaussian covariance, assignment to the nearest mean and centroid refitting recover
    the k-means variance objective. Estimating arbitrary mixing weights or using unequal covariances changes
    the assignment geometry and objective.
  evidence:
  - source_id: cem-source
    locator: Section 2 Eq2.3-2.7 and Proposition 1, pp.3-4 / PDF5-6; Section 3, p.5 / PDF7
    relation: supports
- claim_id: marginal-and-geometry
  kind: limitation
  statement: 'Classification-likelihood ascent is not marginal-mixture likelihood ascent: the saved two-component
    Bernoulli example increases the former and decreases the latter in one nonempty CEM step. The report’s
    general claim that CEM classes have disjoint convex hulls also fails for unequal-variance Gaussian
    components; the saved one-dimensional example assigns outer points to a broad component and inner
    points to a narrow one. Those limitations do not negate the restricted equal-covariance k-means case.'
  evidence:
  - source_id: cem-source
    locator: Proposition 2, pp.6-7 / PDF8-9; Section 4.1 convex-hull prose, p.10 / PDF12; curator finite
      counterexamples
    relation: supports
- claim_id: convergence-scope
  kind: scope
  statement: The finite-partition argument for stabilization needs admissible finite profiled objectives
    and well-defined maximizer selection; it is not a global-optimum guarantee. Initial partitions and
    ties can affect the solution. The local-rate proposition invokes stronger curvature and coordinate-optimization
    assumptions. Because the relaxed objective is affine in the assignment matrix, no generic negative-definite
    assignment Hessian or universal linear-rate claim is certified here.
  evidence:
  - source_id: cem-source
    locator: Propositions 2-3 and following discussion, pp.6-8 / PDF8-10; Eq2.3-2.5, pp.3-4 / PDF5-6
    relation: supports
limitations:
- The inspected primary version is the January 1991 author report, not the inaccessible 1992 journal full
  text. Eq2.2 prints a malformed marginal likelihood without the component sum; the mixture law in Eq2.1
  determines the correct normalization. Eq2.7 doubles the variable-dependent Gaussian log-likelihood terms,
  leaving the displayed optimizer but not literal likelihood values unchanged.
- Hard reassignment can empty a component; unrestricted component likelihoods can become singular or unbounded.
  Fixed component count, nonempty partitions and finite M-step solutions are not guaranteed by an argmax
  assignment alone.
- The source’s local-rate proof and its external grouped-coordinate theorem were not independently repaired.
  Affine assignment dependence and boundary solutions require care before importing smooth interior curvature
  claims.
- The numerical experiments evaluate a variance criterion under selected mixture and serum-data settings.
  A practical SEM-then-CEM hybrid is distinct from pure CEM; no universal superiority, generalization
  or semantic-cluster claim is curated.
- No author implementation or historical numerical experiment was reproduced. Finite curator calculations
  check formula boundaries, not empirical performance or a repaired convergence proof.
