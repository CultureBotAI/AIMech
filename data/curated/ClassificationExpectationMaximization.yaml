name: Classification Expectation Maximization
aliases:
- Classification EM
- CEM (classification expectation maximization)
concept_kind: algorithm
definition: A model-based hard-clustering algorithm that computes mixture responsibilities, assigns every
  observation to a highest-responsibility component, and maximizes the completed-data classification likelihood
  for that assignment.
identity_notes: 'CEM optimizes a joint parameter-and-partition classification criterion rather than ordinary
  marginal-mixture likelihood. The historical name refers to clustering unlabeled observations, not necessarily
  supervised classification. It differs from posterior-label sampling in SEM, cross-entropy optimization,
  and soft-responsibility EM. k-means is a restricted equal-weight spherical-Gaussian specialization,
  not an alias for every CEM instance. Bare CEM is not asserted as a unique alias. No normalized identity
  matches among 442 pinned and 473 maintained records, including the bare acronym probes. Existing supplemented
  EM and cross-entropy optimization are distinct methods; qualified aliases avoid claiming SEM or CEM
  as unique names. ICE, MCEM, SAEM, deterministic tempered EM, simulated annealing and k-means provide
  neighboring but different scopes. Existing stochastic-EM frontier and incidental references are not
  records of the new identities. The absence assessment is bounded to this snapshot and corpus. Identity-search
  counts: 227 matched lines in the worktree and 245 in main; all 137 distinct matching-text windows were
  read, with ignored and hidden files included.'
