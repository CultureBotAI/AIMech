- claim_id: sequential-kernel-mmd-betting-test-and-unbounded-sigmoid-extension
  kind: mechanism
  statement: 'For general metric spaces X equipped with a characteristic reproducing kernel Hilbert space
    H_K with bounded kernel sup_{x,x''} sqrt{K(x,x'')} <= 1 and witness ball G = {g in H_K : ||g||_K <=
    1/2} generating the Maximum Mean Discrepancy d_MMD(P_X, P_Y) (Equation 33), adaptive RKHS Online Gradient
    Ascent g_{t+1} = Pi_G(g_t + eta_t (K(X_t, .) - K(Y_t, .))) with Pi_G(h) = h / (2 ||h||_K) when ||h||_K
    > 1/2 and eta_t = 1 / sqrt(2 sum_{i=1}^t ||K(X_i, .) - K(Y_i, .)||_K^2) (Equation 35) yields a sequential
    kernel-MMD test (Definition 8) with O(tau^2) total complexity, expected stopping time E[tau] = O(sigma^2
    log(1/(alpha Delta)) / Delta^2) for Delta = d_MMD(P_X, P_Y) and sigma^2 = E[||K(X, .) - K(Y, .)||_K^2]
    (Proposition 3, near-optimal by Proposition 4), and mid-point KL error exponent beta = inf_{P'' in
    P(X)} (1/2)(d_KL(P'', P_X) + d_KL(P'', P_Y)); moreover, when G or K is unbounded, composing the raw
    witness payoff g_t(X_t) - g_t(Y_t) with any odd sigmoid function varrho : R -> [-1, 1] satisfying
    varrho(-x) = -varrho(x) (such as varrho(x) = tanh(x)) preserves E_{H_0}[varrho(g_t(X_t) - g_t(Y_t))
    | F_{t-1}] = 0 by distributional symmetry g_t(X_t) - g_t(Y_t) =^d g_t(Y_t) - g_t(X_t) under H_0 (Section
    2.3, Definition 6).'
  evidence:
  - source_id: shekhar-ramdas2023-two-sample-betting-ar5iv
    locator: Section 2.3, lines 607–650, Definition 6; Section 4, lines 837–1085, Equations 33–39, Definition
      8, Propositions 3–4, Remarks 8–9; Appendix E, lines 3487–3508
    relation: supports
- claim_id: time-varying-nonexchangeable-streams-and-operator-invariance-testing
  kind: mechanism
  statement: 'Under non-i.i.d. time-varying F_{t-1}-measurable data streams (X_t, Y_t) ~ P_t x Q_t (Definition
    9, where temporal marginal drift P_t != P_{t''} violates across-time exchangeability and invalidates
    batch permutation tests; Remark 10), the sequential betting test tau(A_ONS, A_pred) maintains nonasymptotic
    Type-I error P(tau < infty) <= alpha under H_0 : P_t = Q_t for all t >= 1 and achieves power 1 under
    H_1 : d_G(P, Q) := liminf_{n->infty} d_G(bar{P}_n, bar{Q}_n) > 0 whenever limsup_{n->infty} R_n/n
    < d_G(P, Q) a.s. (Proposition 5, Corollary 1); furthermore, the framework generalizes to testing distributional
    invariance under an arbitrary operator T : Z -> Z (H_0 : P o T^{-1} = P versus H_1 : P o T^{-1} !=
    P; Definitions 10–13, unifying two-sample testing T(x, y) = (y, x), symmetry testing T(z) = -z, and
    independence testing T((x, y), (x'', y'')) = ((x, y''), (x'', y)) via the symmetrized witness class
    tilde{G} = {(1/2)(g - g o T) : g in G}), where the empirical risk minimization (ERM) strategy achieves
    consistency whenever the Rademacher complexity C_n(tilde{G}, P) -> 0 and finite-sample detection threshold
    Delta_n^* = Omega(n^{-1} sum_{t=1}^{n-1} C_t(tilde{G}) + sqrt(log(n/alpha)/n) + sqrt(log(n/gamma)/n))
    (Theorem 2, Equations 51–53, Remark 11).'
