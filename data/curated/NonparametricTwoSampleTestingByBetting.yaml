limitations:
- The exact sequential kernel-MMD betting test using adaptive Online Gradient Ascent in an RKHS (Section
  4, Definition 8) requires O(t) kernel evaluations at step t to compute g_t(X_t) - g_t(Y_t), resulting
  in O(tau^2) cumulative computational complexity up to stopping time tau (or O(n^2) in the fixed-horizon
  batch setting) unless finite-dimensional random Fourier features or Nystrom approximations are employed
  (Section 4.1, Remark 9).
- Ensuring nonnegativity of the betting wealth process K_t = prod_{i=1}^t (1 + lambda_i v_i) with lambda_i
  in [-1/2, 1/2] requires bounded payoffs v_i in [-1, 1]; when the underlying witness class G or kernel
  K is unbounded (Section 2.3, Definition 6), composing g_t(X_t) - g_t(Y_t) with an odd sigmoid squashing
  function varrho(x) = tanh(x) preserves exact Type-I error control and asymptotic consistency, but the
  finite-sample expected stopping time and variance-adaptivity bounds of Theorem 1(iii)-(iv) then apply
  to the squashed discrepancy rather than directly to the raw IPM d_G(P_X, P_Y).
- The standard formulation assumes paired sequential observations (X_t, Y_t) arriving at a 1:1 sampling
  ratio; extending to unbalanced or asynchronous arrival streams requires mini-batching or pooling observations
  into matched blocks before updating the witness predictor and betting fraction.
- All 3,527 lines of Shekhar & Ramdas (2023, arXiv:2112.09162) were read. Constructed numerical checks
  in research/discovery/nonparametric-two-sample-testing-by-betting-boundaries.py verify the Cutkosky-Orabona
  ONS wealth lower bounds (Appendix A.3) and Eq. 65 ONS regret bound <= 0.5 log n (max ratio 0.2825),
  Theorem 1(iii) variance-adaptive log-wealth growth rate (0.0951 >= 0.05 for small variance vs. 0.0271
  >= 0.0147 for large variance at identical Delta = 0.20), Section 3 Propositions 1–2 bounded-mean adaptive
  OGA regret ratio R_t / ((3/2) sqrt(M_t)) <= 0.5219 <= 1.0, Type-I error 0.0 <= 0.05, power 1.0, and
  stopping time scaling above Lemma 4's Wald-KL lower bound (55.27 > 8.84), Section 4 & 2.3 sequential
  RBF kernel-MMD detection of zero-mean equal-variance distributions (power 1.0, E[tau]=17.6, null Type-I
  error 0.0) and odd-sigmoid tanh(x) unbounded test (power 1.0, null Type-I error 0.05), and Section 5.1–5.2
  time-varying non-exchangeable streams (power 1.0, null Type-I error 0.0) and operator-invariance symmetry
  (power 1.0, null Type-I error 0.0333) and independence testing (power 1.0, null Type-I error 0.0).
