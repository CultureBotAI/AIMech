id: AIMech:NonparametricTwoSampleTestingByBetting
name: Nonparametric two-sample testing by betting
aliases:
- Sequential IPM Two-Sample Testing by Betting
- ONS-Predicted Witness Two-Sample Betting Test
- Sequential Kernel MMD Test by Betting
- Operator Invariance Sequential Testing by Betting
concept_kind: mathematical_method
definition: 'A general sequential nonparametric two-sample and operator-invariance hypothesis testing
  framework (Shekhar & Ramdas 2023, IEEE Transactions on Information Theory 70(2):1178–1203) that tests
  H_0 : P_X = P_Y against H_1 : P_X != P_Y from paired streaming observations {(X_t, Y_t) : t >= 1} by
  exploiting the variational representation of an Integral Probability Metric (IPM) d_G(P_X, P_Y) = sup_{g
  in G} (E_{P_X}[g(X)] - E_{P_Y}[g(Y)]) over a symmetric bounded witness class G subseteq [-1/2, 1/2]^X
  to construct an iterative betting game with wealth process K_t = prod_{i=1}^t (1 + lambda_i (g_i(X_i)
  - g_i(Y_i))), decoupling predictable witness selection g_t in G via a no-regret online learner A_pred
  (such as adaptive Online Gradient Ascent in Euclidean or reproducing-kernel Hilbert spaces, or empirical
  risk minimization over low-Rademacher-complexity classes) from predictable bet-fraction selection lambda_t
  in [-1/2, 1/2] via the Online Newton Step strategy A_ONS, so that stopping at tau = inf{t >= 1 : K_t
  >= 1/alpha} guarantees nonasymptotic Type-I error P_{H_0}(tau < infty) <= alpha via Ville''s inequality
  alongside variance-adaptive exponential wealth growth, power-one consistency, and minimax-optimal expected
  stopping time E[tau] = O(sigma^2 log(1/(alpha Delta)) / Delta^2) under H_1.'
identity_notes: No normalized identity match for nonparametric two-sample testing by betting across all
  442 pinned AIO records and 579 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches
  across data, sources, research, history, and reviews returned only lines in Round 184 artifacts where
  Shekhar & Ramdas (2023, IEEE Transactions on Information Theory 70(2):1178-1203, arXiv:2112.09162) was
  queued as a pending frontier lead. Distinct from AIMech:BettingConfidenceSequencesForBoundedMeans (Waudby-Smith
  & Ramdas 2024, JRSS Series B 86(1):1-27, arXiv:2010.09686), which constructs one-sample confidence sequences
  for scalar bounded means in [0, 1] rather than sequential nonparametric two-sample IPM/kernel-MMD and
  operator-invariance hypothesis tests over multivariate or general metric spaces via coupled online witness
  prediction A_pred and ONS betting A_ONS; also distinct from AIMech:UniversalInferenceSplitLikelihoodRatioTest
  (Wasserman, Ramdas, & Balakrishnan 2020, PNAS 117(29):16880-16890), which requires parametric likelihood
  evaluation over H_0.
