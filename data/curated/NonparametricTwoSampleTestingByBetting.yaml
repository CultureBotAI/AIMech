- claim_id: bounded-mean-sequential-two-sample-test-via-adaptive-oga-and-minimax-optimality
  kind: mechanism
  statement: 'For bounded Euclidean random vectors X_t, Y_t in {x in R^m : ||x||_2 <= 1} testing H_0 :
    mu_X = mu_Y against H_1 : mu_X != mu_Y using the linear IPM witness class G = {<u, .> : ||u||_2 <=
    1/2} (where d_G(P_X, P_Y) = (1/2) ||mu_X - mu_Y||_2 = Delta), instantiating A_pred as scale-free adaptive
    Online Gradient Ascent u_{t+1} = Pi_U(u_t + eta_t (X_t - Y_t)) with eta_t = 1 / sqrt(2 M_t) and M_t
    = sum_{i=1}^t ||X_i - Y_i||_2^2 (Equation 29) achieves cumulative regret R_n <= (3/2) sqrt(M_n) (Appendix
    A.4 / D), O(m) per-step computation (O(tau m) total time), and expected stopping time E[tau] = O(sigma^2
    log(1/(alpha Delta)) / Delta^2) where sigma^2 = E[||X - Y||_2^2] (Definition 7, Proposition 1), matching
    up to logarithmic factors the information-theoretic minimax lower bound E[tau''] = Omega(sigma^2 log(1/alpha)
    / Delta^2) established via the generalized Wald identity E_{H_1}[tau''] >= log(1/alpha) / d_KL(P_Y,
    P_X) (Proposition 2, Appendix F Lemma 4).'
  evidence:
