claims:
- claim_id: ipm-variational-two-sample-betting-game-and-ons-wealth-lower-bound
  kind: mechanism
  statement: 'For any symmetric witness class G subseteq [-1/2, 1/2]^X generating an Integral Probability
    Metric d_G(P_X, P_Y) = sup_{g in G}(E_{P_X}[g(X)] - E_{P_Y}[g(Y)]) (Assumption 1, Equation 5), the
    oracle two-sample betting game replaces the unknown optimal witness g* and bet lambda* with a predictable
    witness prediction strategy A_pred selecting F_{t-1}-measurable g_t in G (with cumulative regret R_n
    = n d_G(hat{P}_{X,n}, hat{P}_{Y,n}) - sum_{t=1}^n (g_t(X_t) - g_t(Y_t)); Definition 4, Equation 10)
    and the Online Newton Step betting strategy A_ONS updating lambda_{t+1} = Pi_{[-1/2, 1/2]}(lambda_t
    - (2 / (2 - log 3)) z_t / a_t) from lambda_1 = 0 with v_t = g_t(X_t) - g_t(Y_t) in [-1, 1], z_t =
    v_t / (1 - lambda_t v_t), and a_t = 1 + sum_{i=1}^t z_i^2 (Definition 5, Equation 11); by Cutkosky
    & Orabona''s coin-betting bound (Appendix A.3), K_n = prod_{t=1}^n (1 + lambda_t v_t) satisfies pathwise
    K_n >= (1 / sum_{t=1}^n v_t^2) exp((sum_{t=1}^n v_t)^2 / (4(sum_{t=1}^n v_t^2 + sum_{t=1}^n v_t)))
    >= exp((n/8)(n^{-1} sum_{t=1}^n v_t)^2 - log n), and Theorem 1 guarantees for tau = inf{t >= 1 : K_t
    >= 1/alpha} that (i) Type-I error satisfies sup_{P_X = P_Y} P(tau < infty) <= alpha via Ville''s inequality
    (Equation 16), (ii) P_{H_1}(tau < infty) = 1 whenever limsup_{n->infty} R_n/n < d_G(P_X, P_Y) a.s.
    (Equations 17–18), (iii) empirical-Bernstein variance-adaptive asymptotic log-wealth rate liminf_{n->infty}
    n^{-1} log K_n >= (Delta/4)(min(Delta / E[(g*(X)-g*(Y))^2], 1)) when n^{-1} sum_{t=1}^n v_t -> Delta
    = d_G(P_X, P_Y) (Equations 19–20, Appendix C), and (iv) Sanov KL-projection error exponent lim_{n->infty}
    -(2n)^{-1} log P(tau > n) >= beta (Equation 22).'
