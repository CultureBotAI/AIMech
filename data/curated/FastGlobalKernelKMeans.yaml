id: AIMech:FastGlobalKernelKMeans
name: Fast Global Kernel K-Means
aliases: []
concept_kind: algorithm
definition: An incremental kernel clustering algorithm that chooses each new singleton seed by maximizing
  a computable lower bound on error reduction, then runs one local kernel k-means fit for that stage.
identity_notes: This is the Tzortzis-Likas2009 fast variant with its positive observation-weight extension.
  It maximizes a bound over datum seeds and performs one local fit per stage, rather than evaluating final
  errors for every seed or fitting a CMM exemplar shortlist. Maximizing the bound need not select the
  seed with greatest actual final improvement. Compared all 442 pinned AIO IDs, labels and scoped synonyms
  with all 492 prior native IDs, names and aliases; no normalized identity collision. Full searches of
  both checkouts include ignored and hidden files, returning 62 worktree and 62 main matched lines. All
  47 distinct matched texts were inspected as neighboring method mentions, query/frontier references or
  rendered copies. Eleven annotated AIO nodes, eleven generated YAMLs and seven native neighbors were
  examined. Nine unchanged annotated nodes, their generated YAMLs, all 442 class labels and 139 semantic
  rows reuse byte-verified earlier readings; two additional annotated targets and eight new semantic rows
  were read (147 rows total). Absence is bounded to this pin and corpus.
