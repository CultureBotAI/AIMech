  search_scope: The fresh merged-base collection compared442 pinned AIO identities and763 native identities
    with ignored- and hidden-inclusive searches of four checkouts and recursive matching across909main
    and393nested frontier objects. Root assessed39 focused candidate contexts,15 normalized context fields
    and20 full matching frontier objects; broader text matches are not all claimed as root-read. Historical
    exact inspection of eight pinned AIO CLASS nodes and44incident edges remains applicable because the
    snapshot bytes are unchanged (commit397851c547d1c4d8f06ef184f63c1d40bc86937a); all eight rejection
    rationales are preserved. This is bounded snapshot absence, not worldwide coverage or saturation.
  rationale: The inspected AIO candidates do not adequately identify this generic combinatorial neighborhood-search
    family. Model-training and learning-task classes require a scope that is not mandatory here. A possible
    augmented-state Markov representation or use of mathematical functions is too generic to distinguish
    the whole algorithm family. No positive mapping is forced.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The target denotes preprocessing/training of machine-learning models. Generic combinatorial
      neighborhood search need not train a model.
  - target: AIO:MachineLearningTask
    rejection_reason: The target is a process for building methods that learn from data; this search framework
      also solves fixed combinatorial instances without learning from data.
  - target: AIO:ReinforcementLearning
    rejection_reason: Exploration and feedback terminology alone does not make all SLS a reinforcement-learning
      task; no action-value, policy or environmental-response learning rule is mandatory.
  - target: AIO:UnsupervisedLearning
    rejection_reason: The framework need not learn patterns from unlabeled observations; optimizing a
      fixed constraint/objective is insufficient.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The related synonym evolutionary algorithms is attached to an LLM class. Population-valued
      SLS encodings do not require a language model.
  - target: AIO:ReasoningLLM
    rejection_reason: SAT and constraint applications do not require an LLM or language-task reasoning
      architecture.
  - target: AIO:MarkovChain
    rejection_reason: An appropriately augmented search state may have Markov transition semantics, but
      the pinned node is exported as a stochastic network/model with a probabilistic hidden-layer part.
      That representation alone is too generic to map the algorithm family; memoryless current-position
      behavior is not mandatory.
  - target: AIO:MathematicalFunction
    rejection_reason: Problem-specific evaluation and transition functions are ingredients, not a distinctive
      mathematical function defining this entire algorithm family.
