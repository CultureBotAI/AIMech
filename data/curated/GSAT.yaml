name: GSAT
definition: A randomized local-search SAT procedure that repeatedly flips a Boolean variable giving the
  largest change toward more satisfied CNF clauses, breaks tied choices randomly, and restarts from a
  random complete assignment under specified flip and attempt budgets.
concept_kind: algorithm
identity_notes: 'This is the Selman–Levesque–Mitchell GSAT model-finding procedure. It evaluates single-variable
  flips across the current assignment, rather than first choosing a conflicted variable and then its minimum-conflict
  domain value. It is not strict hill climbing, a resolution proof procedure, a generic language-model
  reasoner or every later GSAT/WalkSAT extension. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 310 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 3 and 9 lines respectively.
  All twelve text hits were inspected: six prior candidate-lead lines across the checkouts and six unrelated
  Pygments lexer-state lines in the ignored main environment. No hit established an existing candidate
  record. Seven exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native
  neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- GSAT is an incomplete model finder under finite budgets. A satisfiable formula may be missed, and the
  source discusses families that can require exponentially many attempts. Search failure must not be reported
  as an UNSAT proof.
- Allowing plateau and occasionally decreasing flips distinguishes the method from strict-improvement
  hill climbing. Replacing these moves with immediate restarts changes the specified procedure.
- 'The Figure1 pre-flip test leaves a final-flip boundary: with one allowed flip on a single positive
  unit clause, an initially false assignment can become satisfying after the last check. The record exposes
  this literal pseudocode behavior rather than silently certifying a corrected implementation.'
- MAX-FLIPS, MAX-TRIES, randomization, tie handling and CNF encoding affect outcomes. Experiments on selected
  satisfiable instances and particular distributions are not universal runtime or success guarantees;
  no numerical benchmark result is curated.
