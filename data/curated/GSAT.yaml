claims:
- claim_id: method
  kind: mechanism
  statement: 'For up to MAX-TRIES attempts, generate a random complete truth assignment for the input
    CNF clauses. During each attempt, test the current assignment for satisfaction and, while within MAX-FLIPS,
    choose a variable whose flip gives the largest increase in the number of satisfied clauses, breaking
    equally good choices randomly, then flip it. The argmax does not require a positive gain: sideways
    moves remain possible, and the source also acknowledges occasional decreasing moves. Restart after
    the per-attempt budget and report search failure after all attempts if no tested satisfying assignment
    was found. A returned assignment is a directly checkable model; an unsuccessful search does not prove
    unsatisfiability. Figure1 checks before each flip, so the assignment produced by the last allowed
    flip is not checked inside its literal loop; a concrete implementation must state whether it adds
    that final check.'
