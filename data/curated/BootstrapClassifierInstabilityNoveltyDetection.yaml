limitations:
- The source does not fully resolve its threshold notation, finite-sample variance divisor or all bootstrap
  implementation conventions. No precise historical implementation is certified.
- A low score can reflect shared stable extrapolation rather than familiar input. Output variance, class
  probability, predictive accuracy and novelty are different quantities.
- The training labels, base classifier and output transformation used in the reported experiment are retained
  explicitly. No new model was trained and no reported benchmark result was reproduced.
- All nine primary manuscript pages were visually read. Plot captions and the text-defined corrected rejection
  metric are not silently equated; no numerical benchmark result is curated.
