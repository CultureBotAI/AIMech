claims:
- claim_id: mole-output-conditioned-hierarchical-layer-gating
  kind: mechanism
  statement: For a set of N frozen trained LoRAs Omega = {Delta theta_i}_{i=0}^{N-1} at a given block or layer, MoLE computes each LoRA's output E_{Delta theta_i}(x) in R^{L x d}, concatenates and normalizes them into E_Omega(x) = Normalization(E_{Delta theta_0}(x) oplus ... oplus E_{Delta theta_{N-1}}(x)) in R^{xi} (xi = N L d), computes logits eps = Flatten(E_Omega(x))^T e in R^N, and combines expert outputs via O(x) = F_theta(x) + sum_{i=0}^{N-1} [exp(eps_i / tau) / sum_j exp(eps_j / tau)] E_{Delta theta_i}(x).
  evidence:
  - source_id: r686-primary-pdf
    locator: Section 3.2 Mixture of LoRA Experts, Eq. 7-13, p. 5-6
    relation: supports
- claim_id: mole-gating-balancing-loss-and-proportional-masking
  kind: mechanism
  statement: To prevent gating entropy collapse toward a single early-stage dominant LoRA expert during training, MoLE adds the gating balancing loss L_balance = -log(prod_{i=0}^{N-1} q^(i)) where q^(i) = (1/M) sum_{k=1}^M exp(eps_i^k / tau) / sum_{j=1}^N exp(eps_j^k / tau) across M gated blocks, and at inference time supports manual masking of undesired LoRAs with proportional redistribution of the remaining gating weights without retraining.
  evidence:
  - source_id: r686-primary-pdf
    locator: Section 1 Figure 1, Section 3.3 Eq. 14-16 & Section 5 Table 7 and Figure 8, p. 1, 6, 8-9, 12, 14
    relation: supports
- claim_id: mole-multimodal-and-nlp-composition-application
  kind: application
  statement: MoLE is applied to multi-subject text-to-image diffusion composition with DreamBooth on Stable Diffusion V2.1 and to multi-task NLP composition on FLAN-T5 across WMT translation, Struct-to-Text, Closed-Book QA, Big-Bench Hard (BBH), and NLI, outperforming normalized linear arithmetic, SVDiff, PEMs, and LoraHub.
  evidence:
  - source_id: r686-primary-pdf
    locator: Section 4.1-4.2, Tables 1-3 & Section 5 Tables 6-10, p. 6-9, 12-13
    relation: supports
- claim_id: mole-very-large-expert-array-and-matrix-granularity-limitation
  kind: limitation
  statement: When the number of composed LoRAs scales to very large arrays (such as 128 LoRAs on BBH), composition performance degrades relative to moderate expert counts (e.g., 48 LoRAs), and applying gating at overly fine parameter-matrix granularity (m-MoLE) underperforms block-wise (b-MoLE) and layer-wise (l-MoLE) gating due to excessive control interfering with intra-layer parameter relationships.
  evidence:
  - source_id: r686-primary-pdf
    locator: Section 5 Coarse-to-fine gating analysis, Section 6 Limitations & Tables 6 and 9, p. 8-9, 12-13
    relation: supports
