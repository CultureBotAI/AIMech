id: AIMech:MoLEMixtureOfLoRAExperts
name: MoLE (Mixture of LoRA Experts)
concept_kind: architecture
review_status: DRAFT
definition: A hierarchical modular composition architecture for pre-trained Low-Rank Adaptation (LoRA) modules that treats each layer of N frozen trained LoRAs as a distinct expert, concatenates and normalizes their layer outputs E_{Delta theta_i}(x) in R^{L x d} into E_Omega(x) in R^{N L d}, projects them via a learnable gating embedding e in R^{(N L d) x N} and temperature-scaled softmax G(eps_i) = exp(eps_i / tau) / sum_j exp(eps_j / tau) to weight each LoRA expert's output, and regularizes gating entropy across M blocks via the balancing loss L_balance = -log(prod_{i=0}^{N-1} q^(i)).
identity_notes: Distinct from LoraHub (AIMech:LoraHub, which optimizes static scalar weights per LoRA module via gradient-free black-box optimization), from LoRA-Flow (AIMech:LoRAFlow, which computes token-level gates directly from the pre-LoRA hidden state x^l_t without concatenating LoRA expert outputs or optimizing a log-product gating balancing loss), and from LoRAMoE (AIMech:LoRAMoE, which trains LoRA experts from scratch inside FFN blocks with a localized balancing constraint to prevent world knowledge forgetting during SFT rather than composing separately pre-trained frozen LoRAs). Formulated by Wu, Huang, and Wei (ICLR 2024, arXiv:2404.13628).
aliases:
- Mixture of LoRA Experts
- MoLE Hierarchical LoRA Composition
- Layer-Wise Gated Mixture of Pre-Trained LoRA Experts
