- claim_id: estimation-offset-pythagorean-clt-and-pairs-bootstrap-sandwich-limit
  kind: mechanism
  statement: Conditioning on the random design matrix X = (X_vec_1, ..., X_vec_N)' defines the conditional
    target beta(X) = E[beta_hat | X] = (X'X)^{-1} X' mu(X) (Section 5, page 12, Equation 11) and decomposes
    the Total Estimation Offset beta_hat - beta(P) into the Noise Estimation Offset beta_hat - beta(X)
    = (X'X)^{-1} X' eps_vec and the Approximation Estimation Offset beta(X) - beta(P) = (X'X)^{-1} X'
    eta_vec (Equation 12), which are exactly uncorrelated for finite N (Cov(beta_hat - beta(X), beta(X)
    - beta(P)) = 0, Equation 13) and satisfy the Pythagorean covariance identity V[beta_hat] = E[V[beta_hat
    | X]] + V[beta(X)] (Equations 14-15) and the decomposed Central Limit Theorems N^{1/2}(beta_hat -
    beta(X)) ->^D N(0, E[X_vec X_vec']^{-1} E[sigma^2(X_vec) X_vec X_vec'] E[X_vec X_vec']^{-1}), N^{1/2}(beta(X)
    - beta(P)) ->^D N(0, E[X_vec X_vec']^{-1} E[eta^2(X_vec) X_vec X_vec'] E[X_vec X_vec']^{-1}), and
    N^{1/2}(beta_hat - beta(P)) ->^D N(0, E[X_vec X_vec']^{-1} E[m^2(X_vec) X_vec X_vec'] E[X_vec X_vec']^{-1})
    (Section 7, page 16, Proposition 7, Equation 16). Furthermore, Proposition 8.1 proves that the Eicker-Huber-White
    plug-in sandwich estimator AV_hat_sand[beta] = (X'X/N)^{-1} (1/N sum_{i=1}^N r_i^2 x_vec_i x_vec_i')
    (X'X/N)^{-1} (Equation 17) is consistent under combined nonlinearity and heteroskedasticity, while
    Proposition 8.2 (Section 8.2, page 18, Equations 18-20) proves that for a fixed sample P_hat_N, the
    M-of-N x-y bootstrap estimator beta^*_M satisfies M^{1/2}(beta^*_M - beta_hat) ->^D N(0, AV_hat_sand[beta])
    and AV_hat_sand[beta] = lim_{M -> infty} M V_{P_hat_N}[beta^*_M].
