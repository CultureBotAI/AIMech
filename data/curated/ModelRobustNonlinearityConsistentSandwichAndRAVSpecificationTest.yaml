id: AIMech:ModelRobustNonlinearityConsistentSandwichAndRAVSpecificationTest
name: Model-robust nonlinearity-consistent sandwich variance and Ratio of Asymptotic Variances (RAV) specification
  test
concept_kind: mathematical_method
aliases:
- Models as Approximations I model-robust linear regression framework (Buja et al. 2019)
- Ratio of Asymptotic Variances (RAV_j) regressor-specific misspecification diagnostic and test
- Canonical Noise and Approximation Estimation Offset (EO) decomposition
- Case-wise and pairwise adjusted-regressor weighted slope representations
definition: A model-robust theory and diagnostic methodology for ordinary least squares (OLS) linear regression
  under arbitrary joint regressor-response distributions P = P_{Y, X_vec} without assuming linearity or
  homoskedasticity (Buja, Berk, Brown, George, Pitkin, Traskin, Zhao, & Zhang 2019). Viewing the population
  OLS parameter beta(P) = E[X_vec X_vec']^{-1} E[X_vec Y] = E[X_vec X_vec']^{-1} E[X_vec mu(X_vec)] (Equations
  3-4) as a statistical functional of the joint distribution P, Proposition 4.1 proves that regressor
  ancillarity fails whenever the conditional mean mu(x_vec) = E[Y | X_vec = x_vec] is nonlinear because
  beta(P) then depends on the marginal regressor distribution P_{X_vec}. Decomposing the response as Y
  = beta' X_vec + eta(X_vec) + eps with canonical nonlinearity eta(X_vec) = mu(X_vec) - beta' X_vec and
  noise eps = Y - mu(X_vec) satisfying E[X_vec eta(X_vec)] = 0, E[X_vec eps] = 0, E[eta(X_vec) eps] =
  0, and conditional MSE m^2(X_vec) = sigma^2(X_vec) + eta^2(X_vec) (Section 5, Equations 6-9), the framework
  separates the Total Estimation Offset beta_hat - beta(P) into the uncorrelated Noise Estimation Offset
  beta_hat - beta(X) and Approximation Estimation Offset beta(X) - beta(P), where beta(X) = (X'X)^{-1}
  X' mu(X) is the conditional target of fixed-X regression (Equations 10-15), both of order O_P(N^{-1/2})
  with asymptotic covariance matrices E[X_vec X_vec']^{-1} E[sigma^2(X_vec) X_vec X_vec'] E[X_vec X_vec']^{-1}
  and E[X_vec X_vec']^{-1} E[eta^2(X_vec) X_vec X_vec'] E[X_vec X_vec']^{-1} whose sum is consistently
  estimated by the Eicker-Huber-White sandwich estimator AV_hat_sand[beta] = lim_{M -> infty} M V_{P_hat_N}[beta^*_M]
  (Propositions 7, 8.1, 8.2, Equations 16-20). Using adjusted regressors X_{j.} = X_j - beta_{-j}' X_vec_{-j},
  the j-th slope admits case-wise and pairwise weighted-average representations (Section 10, Equations
  22-23), and the Ratio of Asymptotic Variances RAV[beta_j, m^2] = AV_total[beta_j] / AV_lin[beta_j] =
  E[m^2(X_vec) X_{j.}^2] / (E[m^2(X_vec)] E[X_{j.}^2]) = w_sigma RAV[beta_j, sigma^2] + w_eta RAV[beta_j,
  eta^2] (Definition 11.4, Lemma E.2, Equation 27) quantifies regressor-specific protective (RAV < 1)
  vs. anti-protective (RAV > 1) standard-error distortion within sharp range [P-min X_{j.}^2 / E[X_{j.}^2],
  P-max X_{j.}^2 / E[X_{j.}^2]] (Proposition 11.5) and yields the regressor-specific test statistic RAV_hat_j
  = N <r^2, X_{j,.hat}^2> / (||r||^2 ||X_{j,.hat}||^2) with asymptotic null variance (E[delta^4]/E[delta^2]^2)(E[X_{j.}^4]/E[X_{j.}^2]^2)
  - 1 (Proposition 12.2, Equation 30) and a permutation test (Section 12.3).
identity_notes: 'Distinct from AIMech:ValidPostSelectionInferencePoSIConstant (Berk, Brown, Buja, Zhang,
  & Zhao 2013), which studies fixed-design homoskedastic Gaussian simultaneous post-selection confidence
  intervals across submodels M in M_all. Distinct from AIMech:PostModelSelectionPredictorPoSIConfidenceIntervals
  (Bachoc, Leeb, & Pötscher 2019) and AIMech:UniformlyValidPostModelSelectionConfidenceIntervals (Bachoc,
  Preinerstorfer, & Steinberger 2020), which study post-model-selection simultaneous coverage constants.
  Buja, Berk, Brown, George, Pitkin, Traskin, Zhao, & Zhang (2019, Statistical Science 34(4):523-544,
  arXiv:1404.1578v4, DOI:10.1214/18-STS693) establish the foundational model-robust theory of linear OLS
  under nonlinear misspecification and random regressors: proving the failure of regressor ancillarity
  under nonlinearity (Proposition 4.1), the canonical orthogonal decomposition into Noise Estimation Offset
  beta_hat - beta(X) and Approximation Estimation Offset beta(X) - beta(P) (Sections 5-7, Proposition
  7), the exact characterization of the plug-in sandwich estimator as the M -> infty limit of the M-of-N
  pairs bootstrap (Proposition 8.2), the case-wise and pairwise adjusted-regressor weighted slope representations
  (Section 10, Equations 22-23), and the Ratio of Asymptotic Variances (RAV) functional, sharp bounds,
  and regressor-specific specification test RAV_hat_j (Sections 11-12, Definition 11.4, Propositions 11.5
  & 12.2, Appendix E).'
