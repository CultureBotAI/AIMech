aio_mappings:
- target: AIO:LinearRegression
  relation: related_match
  rationale: Reconstructs ordinary least squares linear regression model-freely as a population projection
    functional beta(P) under nonlinearity and heteroskedasticity, with sandwich/bootstrap standard errors
    and the regressor-specific RAV_hat_j specification test (AIO:LinearRegression).
limitations:
- Model-robustness via the Eicker-Huber-White sandwich estimator AV_hat_sand[beta] or the x-y pairs bootstrap
  requires finite fourth moments of the regressors X_vec and residuals delta; as emphasized in Section
  12.2 (page 26) and Section 13 (pages 27-28), model robustness is distinct from heavy-tail/outlier robustness
  and can suffer from high variance under heavy-tailed regressor or error distributions.
- A population value RAV[beta_j, m^2] = 1 is necessary but not sufficient for linearity and homoskedasticity,
  because protective (RAV < 1) and anti-protective (RAV > 1) deviations of m^2(X_vec) across the domain
  of X_{j.}^2 can cancel in expectation E[m^2(X_vec) X_{j.}^2] = E[m^2(X_vec)] E[X_{j.}^2] (Section 12.1,
  page 25).
- 'Four minor typographical notes in arXiv:1404.1578v4 were identified and verified during full-text inspection:
  (1) the Section 5 heading (page 11) prints ''DEPOMPOSITION'' for ''DECOMPOSITION''; (2) Section 13 (page
  28, line 4) prints ''boostrap'' for ''bootstrap'' and ''R (2008))'' with an extra closing parenthesis;
  (3) Section 14 (page 29, line 9) prints ''dissatified'' for ''dissatisfied''; and (4) Appendix E.1 (page
  36) duplicates a 4-line paragraph in the proof of Proposition 4.1 (lines 20-29) and writes ''\mu_o(\vec{X})''
  with a letter ''o'' instead of ''0''.'
- All 43 pages of the full-text PDF of Buja, Berk, Brown, George, Pitkin, Traskin, Zhao, & Zhang (2019,
  Statistical Science 34(4):523-544, arXiv:1404.1578v4, DOI:10.1214/18-STS693) were read. Constructed
  numerical checks in research/discovery/model-robust-nonlinearity-sandwich-and-rav-test-boundaries.py
  verify (1) Proposition 4.1 regressor-distribution dependence under nonlinearity vs. invariance under
  linearity and Equations 6-9 canonical orthogonality, (2) Equations 12-15 Estimation Offset Pythagorean
  decomposition and Proposition 8.2 convergence of M * V_{P_hat_N}[beta^*_M] to AV_hat_sand[beta], (3)
  Section 10 case-wise and pairwise adjusted-regressor slope identities and Lemma E.2 / Proposition 11.5
  RAV convex decomposition and sharp bounds, and (4) Proposition 12.2 Gaussian null variance (= 8) and
  Section 12.3 permutation test detection of regressor-specific nonlinearity.
