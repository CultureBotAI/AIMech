claims:
- claim_id: regressor-ancillarity-failure-and-canonical-noise-nonlinearity-decomposition
  kind: mechanism
  statement: 'For a joint regressor-response distribution P with integrable second moments and full-rank
    second-moment matrix E[X_vec X_vec''], the population OLS functional beta(P) = argmin_beta E[(Y -
    beta'' X_vec)^2] = E[X_vec X_vec'']^{-1} E[X_vec Y] = E[X_vec X_vec'']^{-1} E[X_vec mu(X_vec)] (Section
    3, Equations 3-4) depends on P_{X_vec} whenever the conditional expectation mu(x_vec) = E[Y | X_vec
    = x_vec] is nonlinear: Proposition 4.1 (Section 4, page 10, proved in Appendix E.1, page 36) proves
    that beta(P) is independent of the marginal regressor distribution P_{X_vec} if and only if mu(X_vec)
    = beta_0'' X_vec almost surely for some beta_0, invalidating conditionality/ancillarity of X_vec under
    model misspecification. Decomposing the response as Y = beta'' X_vec + eta(X_vec) + eps with population
    residual delta = Y - beta'' X_vec = eta(X_vec) + eps, nonlinearity eta(X_vec) = mu(X_vec) - beta''
    X_vec, and noise eps = Y - mu(X_vec) (Section 5, page 11, Equations 6-9) yields exact orthogonality
    E[X_vec delta] = E[X_vec eta(X_vec)] = E[X_vec eps] = 0, E[eta(X_vec) eps] = 0, and pointwise conditional
    MSE decomposition m^2(X_vec) = E[delta^2 | X_vec] = sigma^2(X_vec) + eta^2(X_vec).'
  evidence:
