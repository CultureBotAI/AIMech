- claim_id: adjusted-regressor-weighted-slopes-and-rav-convex-bounds
  kind: mechanism
  statement: Using the population adjusted regressor X_{j.} = X_j - argmin_{L} E[(X_j - L(X_vec_{-j}))^2]
    and empirical adjusted regressor X_{j,.hat} (Section 9, pages 19-20, Proposition 9.1), Section 10
    (pages 20-21, Equations 22-23) proves that beta_hat_j = <y, X_{j,.hat}> / ||X_{j,.hat}||^2 admits
    both the case-wise weighted slope representation beta_hat_j = sum_{i=1}^N v_i (y_i / X_{i,j.hat})
    with weights v_i = X_{i,j.hat}^2 / ||X_{j,.hat}||^2 and the pairwise weighted slope representation
    beta_hat_j = sum_{i,k} w_{i,k} (y_i - y_k) / (X_{i,j.hat} - X_{k,j.hat}) with weights w_{i,k} = (X_{i,j.hat}
    - X_{k,j.hat})^2 / (2 N ||X_{j,.hat}||^2) summing to 1. Section 11 and Appendix E (pages 21-25, 36-40,
    Definition 11.4, Lemma E.2, Proposition 11.5, Proposition E.3, Equations 24-28) define the Ratio of
    Asymptotic Variances RAV[beta_j, m^2] = AV_total[beta_j] / AV_lin[beta_j] = E[m^2(X_vec) X_{j.}^2]
    / (E[m^2(X_vec)] E[X_{j.}^2]), prove the convex combination identity RAV[beta_j, m^2] = w_sigma RAV[beta_j,
    sigma^2] + w_eta RAV[beta_j, eta^2] with w_sigma = E[sigma^2(X_vec)] / E[m^2(X_vec)] and w_eta = E[eta^2(X_vec)]
    / E[m^2(X_vec)] (Equation 27), and establish the sharp range [P-min X_{j.}^2 / E[X_{j.}^2], P-max
    X_{j.}^2 / E[X_{j.}^2]] classifying misspecification as protective (RAV < 1, when m^2 concentrates
    near X_{j.} = 0) or anti-protective (RAV > 1, when m^2 concentrates in the tails of X_{j.}^2).
  evidence:
  - source_id: buja2019p1-pdf
    locator: Sections 9-11, Pages 19-25, Equations (21)-(28), Proposition 9.1, Definition 11.4, Lemma
      11.4, Proposition 11.5; Appendix E.2-E.4, Pages 36-40, Lemma E.2, Proposition E.3
    relation: supports
- claim_id: regressor-specific-rav-specification-test-and-null-asymptotics
  kind: mechanism
  statement: Section 12 (pages 25-27, Definition 12.1, Proposition 12.2, Equations 29-30) defines the
    plug-in test statistic RAV_hat_j = SE_sand[beta_hat_j]^2 / SE_lin[beta_hat_j]^2 = N <r^2, X_{j,.hat}^2>
    / (||r||^2 ||X_{j,.hat}||^2) where r = Y - X beta_hat, and proves in Proposition 12.2 (proved in Appendix
    F, page 41) that under the null hypothesis H_0 that delta^2 and X_{j.}^2 are independent (implied
    by well-specification and homoskedasticity) and fourth moments exist, N^{1/2}(RAV_hat_j - 1) ->^D
    N(0, (E[delta^4]/E[delta^2]^2)(E[X_{j.}^4]/E[X_{j.}^2]^2) - 1), which equals N(0, 8) when delta and
    X_{j.} are Gaussian, and pairs this normal test with a heavy-tail-robust permutation test (Section
    12.3, page 27) that randomly permutes the squared residuals r_i^2 against X_{i,j.hat}^2.
  evidence:
  - source_id: buja2019p1-pdf
    locator: Section 12, Pages 25-27, Equations (29)-(30), Definition 12.1, Proposition 12.2, Section
      12.3; Appendix F, Page 41
    relation: supports
