claims:
- claim_id: r384-fedavg-client-drift-lower-bound-and-fixed-point-invariance
  kind: mechanism
  statement: Theorem I and Theorem II prove that under (G, B)-bounded gradient dissimilarity with K >= 2 local steps, FedAvg suffers an unavoidable Omega(G^2 / (mu^2 * R^2)) error floor from client drift even with full participation (S = N) and zero stochastic noise (sigma = 0); by contrast, SCAFFOLD's drift-corrected local step y_i <- y_i - eta_l * (g_i(y_i) - c_i + c) satisfies grad f_i(x*) - c_i* + c* = 0 when c_i* = grad f_i(x*) and c* = grad f(x*) = 0, making the global optimum x* an exact fixed point of the K-step local trajectory for any K >= 1.
  evidence:
  - source_id: r384-primary-pdf
    locator: Section 3 Theorem I, Theorem II, Section 4 Equations (2)-(5), and Section 5 Theorem III, pp. 3-6
    relation: supports
- claim_id: r384-heterogeneity-independent-convergence-and-hessian-similarity-speedup
  kind: mechanism
  statement: Theorem III proves that SCAFFOLD converges in R = O_tilde(sigma^2 / (mu * S * K * epsilon) + N / S + beta * N / (mu * S)) communication rounds for mu-strongly convex functions (reducing to SAGA when sigma = 0, K = 1, S = 1) and O((beta * N / S)^{2/3} * D^2 / epsilon + ...) for nonconvex functions without any dependence on gradient dissimilarity (G, B); moreover, under delta-bounded Hessian dissimilarity ||nabla^2 f_i(x) - nabla^2 f(x)|| <= delta, Theorem IV proves a true local-step communication reduction R = O_tilde(beta * sigma^2 / (mu * K * N * epsilon) + beta / (mu * K) + delta / mu).
  evidence:
  - source_id: r384-primary-pdf
    locator: Section 5 Theorem III, Corollary I, and Theorem IV, pp. 5-7
    relation: supports
- claim_id: r384-stateful-client-control-variate-and-2x-communication-limitation
  kind: limitation
  statement: SCAFFOLD requires stateful clients that persist local control variates c_i across rounds (causing control-variate staleness of factor N/S when S << N clients are sampled per round) and doubles the per-round communication payload (sending both Delta y_i and Delta c_i).
  evidence:
  - source_id: r384-primary-pdf
    locator: Section 4 Algorithm 1 and Section 5 Theorem III Discussion (Lag Term N/S), pp. 4-6
    relation: supports
- claim_id: r384-non-iid-federated-classification-application
  kind: application
  statement: Applied to federated logistic regression and 2-layer neural network classification on non-IID partitioned EMNIST across heterogeneous clients with partial participation.
  evidence:
  - source_id: r384-primary-pdf
    locator: Section 6 Experiments, Figures 2-4 and Table 3, pp. 7-8
    relation: supports
