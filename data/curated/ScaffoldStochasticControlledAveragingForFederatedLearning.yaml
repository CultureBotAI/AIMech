id: AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning
name: SCAFFOLD Stochastic Controlled Averaging for Heterogeneous Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A federated optimization algorithm (SCAFFOLD) that eliminates client drift across N heterogeneous clients by maintaining a local control variate c_i on each client i and an aggregate server control variate c = (1/N) sum_{i=1}^N c_i, correcting each of the K local mini-batch steps on sampled clients S subseteq [N] via y_i <- y_i - eta_l * (g_i(y_i) - c_i + c), updating the client control variate via c_i^+ = g_i(x) (Option I) or c_i^+ = c_i - c + (1 / (K * eta_l)) * (x - y_i) (Option II), and updating the global model x <- x + eta_g * (1/|S|) sum_{i in S} (y_i - x) and server control variate c <- c + (1/N) sum_{i in S} (c_i^+ - c_i), achieving convergence rates invariant to arbitrary client gradient dissimilarity.
identity_notes: Distinct from uncorrected periodic local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent, which Theorem II proves suffers an unavoidable Omega(G^2 / (mu^2 * R^2)) client-drift lower bound when K >= 2 under gradient dissimilarity G > 0), from proximal penalty stabilization without control variates (AIMech:FedProxProximalHeterogeneousFederatedOptimization), and from single-machine or every-step compressed variance reduction (AIMech:PageProbabilisticGradientEstimatorForNonconvexOptimization and AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization). Narrower than AIO:FederatedLearning, which covers the general federated learning paradigm without specifying stateful client/server control-variate drift correction.
aliases:
