aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: 'Model-X conditional independence test martingales guarantee anytime-valid Type-I error control
    P_{H_0}(exists n >= 1 : M^{(n)} >= 1/alpha) <= alpha under arbitrary data-dependent optional stopping
    and continuous monitoring (Grünwald et al. 2024, Proposition 3), preventing optional-stopping false
    positives (AIO:DataDredgingBias).'
- target: AIO:TimeSeriesAnalysis
  relation: related_match
  rationale: Proposition 3 establishes that the conditional e-process M^{(n)} = prod_{i=1}^n E_i remains
    a valid test martingale under arbitrary temporal dependence of the outcome and covariate streams (Y_n,
    Z_n)_{n>=1}, enabling sequential conditional independence testing in time-series and online streaming
    settings (AIO:TimeSeriesAnalysis).
limitations:
- Valid Type-I error control relies on the Model-X assumption that the conditional distribution Q_{X|Z}
  is known or estimated with vanishing cumulative Total Variation / Kullback-Leibler error over the horizon
  n; when hat{Q}_{X_i|Z_i} has a persistent non-vanishing estimation bias d_TV(Q^*_{X_i|Z_i}, hat{Q}_{X_i|Z_i})
  >= delta > 0 at every step, the product TV distance d_TV(Q^*_{X^{(n)}|Z^{(n)}}, hat{Q}_{X^{(n)}|Z^{(n)}})
  approaches 1 as n -> infty, rendering the Theorem 6 robustness bound vacuous over long horizons (Section
  4, p. 1559).
- When the conditional normalization integral int f(x, Y_n, Z_n) dQ_{X|Z=Z_n}(x) is approximated by the
  Monte Carlo plus-one estimator E^{(M)} (Proposition 2), each step is deterministically upper-bounded
  by M + 1, so achieving near-optimal GRO logarithmic growth under strong alternatives requires drawing
  M >> 1 conditional samples per time step (Section 2.1, p. 1556).
- Sequential plug-in estimation of the outcome model p_{hat{theta}_{n-1}}(y | x, z) from past samples
  requires O(n) cumulative refits (or online updates) and suffers low growth during initial burn-in when
  sample sizes are small relative to covariate dimension, requiring explicit truncation eps in (0, 1)
  to prevent early mispredictions from driving the product martingale near zero (Section 3.2, Section
  5).
- 'All 636 lines of Grünwald, Henzi, & Lardy (2024, JASA 119(546):1554-1565, arXiv:2209.12637v2) were
  read. Constructed numerical checks in research/discovery/model-x-anytime-valid-conditional-independence-testing-boundaries.py
  verify (1) Section 2.1 Propositions 1-3 exact conditional unit expectation E_{H_0}[E | Y, Z] = 1.0 and
  Monte Carlo plus-one exact unit expectation E_{H_0}[E^{(M)} | Y, Z] = 1.0 (with max bound 2.333333 <=
  M+1 = 3 for M=2 and null anytime rejection rate 0.034 <= 0.10) vs. naive MC inflation E_{H_0}[E^{naive}
  | Y, Z] = 1.239524 > 1, (2) Section 3.1 Theorem 4 & Proposition 4 GRO optimality E_{P_1}[log E^{GRO}]
  = I(X; Y | Z) = 0.12312 > E_{P_1}[log E_f] = 0.096722 and exact conditional KL regret decomposition
  diff 0.0, (3) Section 4 Theorem 6 product TV robustness bound P_{Q^*}(exists k <= n : hat{M}_k >= 1/alpha)
  = 0.0 <= alpha + d_TV = 0.157797, and (4) Section 3.2 & Section 5 truncation protection (eps=0.05 floor
  0.1 vs. untruncated 1.9e-13 under an outlier) and sequential logistic Model-X e-process null anytime
  Type-I error 0.025 <= 0.05 and alternative anytime power 1.0.'
