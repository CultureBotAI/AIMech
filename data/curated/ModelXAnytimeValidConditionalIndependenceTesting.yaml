claims:
- claim_id: conditional-e-variable-monte-carlo-plus-one-exchangeability-and-test-martingale
  kind: mechanism
  statement: 'For any non-negative measurable test function f(x, y, z) >= 0 with 0 < int f(x, y, z) dQ_{X|Z=z}(x)
    < infty, the normalized ratio E(X; Y, Z) = f(X, Y, Z) / int f(x, Y, Z) dQ_{X|Z=z}(x) satisfies E_P[E(X;
    Y, Z) | Y, Z] = 1 for every joint distribution P in H_0: X _||_ Y | Z with conditional law Q_{X|Z}
    (Proposition 1, Equation 2); when the integral denominator is intractable, drawing M >= 1 conditional
    randomization copies tilde{X}^{(1)}, ..., tilde{X}^{(M)} ~_{i.i.d.} Q_{X|Z} conditionally independent
    of (X, Y) given Z and including the observed X in the denominator yields the Monte Carlo plus-one
    e-variable E^{(M)}(X; Y, Z) = f(X, Y, Z) / ((1/(M+1))(f(X, Y, Z) + sum_{i=1}^M f(tilde{X}^{(i)}, Y,
    Z))), which satisfies E_P[E^{(M)}(X; Y, Z) | Y, Z] = 1 exactly by conditional exchangeability of (X,
    tilde{X}^{(1)}, ..., tilde{X}^{(M)}) given (Y, Z) while the naive Monte Carlo estimator without the
    observed X in the denominator violates E[E] <= 1 (Proposition 2, Equation 3); sequentially multiplying
    E_n with predictable functions f_n measurable wrt sigma(X^{(n-1)}, Y^{(n)}, Z^{(n)}) forms a non-negative
    test martingale M^{(n)} = prod_{i=1}^n E_i with E_P[M^{(n)}] = 1 even under arbitrary temporal dependence
    of (Y_n, Z_n), provided X_n _||_ (X^{(n-1)}, Y^{(n)}, Z^{(n-1)}) | Z_n (Proposition 3, Equation 4).'
  evidence:
  - source_id: grunwald2024-model-x-ci-ar5iv
    locator: Section 2.1–2.2, lines 113–215, Propositions 1–3, Equations 1–4; Appendix A, lines 510–540
    relation: supports
  - source_id: grunwald2024-model-x-ci-abs
    locator: Abstract (Model-X conditional e-statistics and test martingales under arbitrary covariate/outcome
      dependence)
    relation: supports
- claim_id: gro-conditional-mutual-information-and-conditional-kl-regret-identity
  kind: mechanism
  statement: Under a point alternative P_1 = P_{Z,Y} x P_{X|Y,Z} dominated by H_0 with positive densities
    p(x | y, z) and q(x | z), the Growth-Rate Optimal (GRO) conditional e-variable maximizing E_{P_1}[log
    E(X; Y, Z) | Y, Z] is uniquely E^{GRO}(X; Y, Z) = p(X | Y, Z) / q(X | Z), whose expected log-growth
    rate under P_1 equals the conditional mutual information I(X; Y | Z) = E_{P_1}[D_KL(P_{X|Y,Z} || Q_{X|Z})]
    >= 0 (Section 3.1, Theorem 4, Equations 5–6); furthermore, for any non-negative test function f(x,
    y, z) defining the tilted conditional density r_f(x | y, z) = f(x, y, z) q(x | z) / int f(x', y, z)
    q(x' | z) dx', the conditional expected log-growth satisfies the exact identity E_{X~P_{X|Y=y,Z=z}}[log
    E_f(X; y, z)] = D_KL(P_{X|Y=y,Z=z} || Q_{X|Z=z}) - D_KL(P_{X|Y=y,Z=z} || R_{f,X|Y=y,Z=z}) (Section
    3.1, Proposition 4, Equation 7), and when P_{Y|X,Z} belongs to a natural exponential family with density
    exp(theta^T T(X, Z) Y - A(theta | X, Z)), the plug-in test function f_hat(x, y, z) = p_{hat{theta}}(y
    | x, z) matches the oracle conditional density ratio up to estimation error in hat{theta} because
    baseline factors depending only on (y, z) cancel identically between numerator and denominator (Section
    3.2, Equations 8–9).
  evidence:
  - source_id: grunwald2024-model-x-ci-ar5iv
    locator: Section 3.1–3.2, lines 216–328, Theorem 4, Proposition 4, Equations 5–9; Appendix A, lines
      541–565
    relation: supports
  - source_id: grunwald2024-model-x-ci-crossref
    locator: JASA 119(546):1554–1565 publication record
    relation: supports
- claim_id: total-variation-type-i-error-bound-under-model-x-misspecification
  kind: mechanism
  statement: 'When the true covariate law Q^*_{X^{(n)}|Z^{(n)}} differs from the assumed or estimated
    law hat{Q}_{X^{(n)}|Z^{(n)}} used to normalize the e-variables hat{E}_i, if hat{E}_i is uniformly
    bounded by B > 0 then E_{Q^*}[hat{E}_i | Y_i, Z_i] <= 1 + B * d_TV(Q^*_{X_i|Z_i}, hat{Q}_{X_i|Z_i})
    (Proposition 5); crucially, for the stopped product process hat{M}_tau = prod_{i=1}^tau hat{E}_i at
    any stopping time tau <= n and level alpha in (0, 1), coupling Q^* and hat{Q} prior to Ville''s maximal
    inequality proves that the anytime type-I error under the true null distribution satisfies P_{Q^*}(exists
    k <= n : hat{M}_k >= 1/alpha | Y^{(n)}, Z^{(n)}) <= alpha + d_TV(Q^*_{X^{(n)}|Z^{(n)}}, hat{Q}_{X^{(n)}|Z^{(n)}})
    <= alpha + sqrt((1/2) sum_{i=1}^n D_KL(Q^*_{X_i|Z_i} || hat{Q}_{X_i|Z_i})) without requiring any boundedness
    assumption on hat{E}_i (Section 4, Theorem 6).'
  evidence:
  - source_id: grunwald2024-model-x-ci-ar5iv
    locator: Section 4, lines 329–405, Proposition 5, Theorem 6; Appendix A, lines 566–592
    relation: supports
- claim_id: truncation-protection-against-zero-lock-in-and-sequential-e-crt-betting
  kind: mechanism
  statement: Because a single outlier step with f_i(X_i, Y_i, Z_i) approx 0 can drive an untruncated product
    martingale close to zero and permanently stall evidence accumulation during burn-in, mixing or lower-truncating
    the raw conditional e-variable via E_{i,eps} = (1 - eps) E_i + eps or f_{i,eps}(x, y, z) = max(f_i(x,
    y, z), eps * int f_i(x', y, z) dQ_{X|Z=z}(x')) with eps in (0, 1) (e.g., eps = 0.05) preserves exact
    conditional expectation E_{H_0}[E_{i,eps} | Y_i, Z_i] = 1 while lower-bounding every single-step factor
    by eps (Section 3.2, Section 5, Equation 10); similarly, the sequential Model-X e-CRT (Shaer, Maman,
    & Romano 2023, NeurIPS 36, arXiv:2210.00354) constructs sequential betting e-variables E_t = 1 + lambda_t
    (s_t(X_t, Y_t, Z_t) - E_{Q_{X|Z}}[s_t(tilde{X}_t, Y_t, Z_t) | Y_t, Z_t]) with predictable bounded
    betting fractions lambda_t and arbitrary online black-box conformity scores s_t.
  evidence:
  - source_id: grunwald2024-model-x-ci-ar5iv
    locator: Section 3.2, lines 305–328; Section 5.1–5.2, lines 406–495, Equation 10
    relation: supports
  - source_id: shaer2023-ecrt-abs
    locator: arXiv:2210.00354 abstract (Sequential Model-X e-CRT with online predictors and betting martingales)
    relation: supports
