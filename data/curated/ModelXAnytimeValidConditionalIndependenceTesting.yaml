id: AIMech:ModelXAnytimeValidConditionalIndependenceTesting
name: Model-X anytime-valid conditional independence testing via e-processes
aliases:
- Model-X Conditional Independence E-Statistics
- Sequential E-CRT (e-Conditional Randomization Test)
- Monte Carlo Plus-One Model-X E-Process
- Conditional GRO E-Variable for Model-X Testing
concept_kind: mathematical_method
definition: 'A sequential conditional independence testing framework (Grünwald, Henzi, & Lardy 2024, Journal
  of the American Statistical Association 119(546):1554-1565, arXiv:2209.12637; Shaer, Maman, & Romano
  2023, NeurIPS 36, arXiv:2210.00354) for testing H_0: X _||_ Y | Z under the Model-X assumption (where
  the conditional law Q_{X|Z} is known or estimated while the outcome conditional law P_{Y|X,Z} is completely
  unspecified) that constructs conditional e-variables E(X_n; Y_n, Z_n) = f(X_n, Y_n, Z_n) / int f(x,
  Y_n, Z_n) dQ_{X|Z=Z_n}(x) (or exact finite-sample Monte Carlo plus-one approximations E^{(M)}(X_n; Y_n,
  Z_n) = f(X_n, Y_n, Z_n) / ((1/(M+1))(f(X_n, Y_n, Z_n) + sum_{i=1}^M f(tilde{X}_n^{(i)}, Y_n, Z_n)))
  using M >= 1 conditional randomization draws tilde{X}_n^{(i)} ~ Q_{X|Z=Z_n}) whose product M_n = prod_{i=1}^n
  E_i forms a non-negative test martingale under H_0 regardless of the serial dependence of (Y_n, Z_n),
  achieves Growth-Rate Optimality (GRO) equal to the conditional mutual information I(X; Y | Z) via a
  conditional Kullback-Leibler divergence regret decomposition, and admits nonasymptotic Total Variation
  type-I error inflation bounds under Model-X misspecification.'
identity_notes: 'No normalized identity match for Model-X anytime-valid conditional independence testing
  via e-processes across all 442 pinned AIO records and 582 maintained IDs, names, aliases and scoped
  synonyms. Fixed-string searches across data, sources, research, history, and reviews returned only prior
  discovery frontier entries where Grünwald, Henzi, & Lardy (2024, JASA 119(546):1554-1565, arXiv:2209.12637)
  and Shaer, Maman, & Romano (2023, NeurIPS 36, arXiv:2210.00354) were tracked as a pending frontier lead.
  Distinct from AIMech:SequentialKernelizedIndependenceTestingByBetting (Podkopaev et al. 2023), which
  tests unconditional independence H_0: X _||_ Y without knowing either marginal by pairing adjacent observations
  into an i.i.d. exchangeability stream; distinct from AIMech:KernelConditionalIndependenceTest (Zhang
  et al. 2011) and AIMech:GeneralisedCovarianceMeasureForConditionalIndependence (Shah & Peters 2020),
  which are fixed-sample asymptotic conditional independence tests without anytime-valid optional-stopping
  control; and distinct from AIMech:ModelXKnockoffsForHighDimensionalControlledVariableSelection (Candès
  et al. 2018) and AIMech:DerandomizedKnockoffsWithEValues (Ren & Barber 2024), which perform batch false
  discovery rate variable selection rather than sequential anytime-valid conditional independence testing
  via predictable e-processes.'
