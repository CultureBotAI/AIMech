name: Graph degree linkage
definition: An agglomerative clustering algorithm that merges the pair with greatest symmetric graph-degree
  affinity, formed by summing products of cluster-normalized incoming and outgoing edge weights on a fixed
  directed nearest-neighbor graph.
concept_kind: algorithm
identity_notes: 'GDL is the graph-degree clustering procedure of Zhang et al. Its affinity uses a product
  of directed degree averages, not average pairwise distance or a symmetrized graph. GDL-U is the paper’s
  exact update implementation of this same merge criterion; AGDL restricts candidate search and is represented
  separately. JULE incorporates graph-degree affinity while also learning representations and changing
  merge selection, so it is not the same algorithm. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 214 preceding native IDs/names/aliases. Word-delimited fixed-string
  searches of both full checkouts, including ignored and hidden files, returned 31 lines each: existing
  SimCLR/InfoNCE component discussion, shared primary-source references and discovery/review context.
  Five native neighbors and seven exact AIO nodes with scoped synonyms and outgoing relations were inspected.'
limitations:
- The distance, K, K0, bandwidth and requested cluster count determine the construction. Weak-component
  initialization can already join observations irreversibly; the merge-only procedure cannot recover a
  requested count larger than the initial number of components.
- Degree products encode two-way connectivity but do not prove recovery of true semantic clusters or universal
  robustness to noise. The graph is directed even though the final pair affinity is symmetric.
- GDL-U preserves the exact criterion when updates and tie handling agree. The paper’s AGDL approximation
  can choose different merges and is not an exact synonym.
- The published complexity analysis distinguishes naive GDL from its update and approximate implementations,
  and assumes fixed neighborhood parameters and sparsity. This record asserts no universal runtime or
  benchmark advantage. No implementation or benchmark was executed.
