claims:
- claim_id: method
  kind: mechanism
  statement: Construct a directed K-nearest-neighbor graph with w_ij=exp(−dist(i,j)^2/sigma^2) for retained
    edges and zero otherwise. Keep W fixed during clustering. Initialize clusters as weakly connected
    components of a smaller K0-nearest-neighbor graph. For vertex i and cluster C, define d_in(i,C)=sum_(j
    in C) w_ji/|C| and d_out(i,C)=sum_(j in C) w_ij/|C|. The directed affinity A(B→C)=sum_(i in B) d_in(i,C)d_out(i,C);
    the symmetric merge affinity is A(B,C)=A(B→C)+A(C→B). Repeatedly choose a pair with maximum affinity
    over all current pairs, merge it, and stop at the requested cluster count. The exact update implementation
    uses A((A union B)→C)=A(A→C)+A(B→C), while the opposite direction must be computed from the original
    degree expression; both directions are not generally additive.
