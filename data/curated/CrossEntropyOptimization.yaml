claims:
- claim_id: method
  kind: mechanism
  statement: 'Specify a sampling family f(x;v), initial parameter, sample size N, elite parameter rho
    and stopping rule. For maximization, draw candidates from the current distribution, evaluate their
    scores and choose the empirical (1−rho) quantile as threshold gamma. Fit new parameters by maximizing
    the sum of log f(x;v) over sampled candidates with score at least gamma. The optimization formulation
    uses unit weights: it redefines the associated stochastic problem at each iteration, so the rare-event
    algorithm’s nominal-to-current likelihood ratio is absent. Optionally smooth the fitted parameter
    toward the old one via v_new=alpha*v_fit+(1−alpha)*v_old. For independent Bernoulli coordinates, the
    unsmoothed fit is the coordinatewise fraction of ones among selected samples. Iterate until the chosen
    stopping condition; the displayed Algorithm2.3 uses an unchanged threshold over several iterations.
    The source’s cross-entropy derivation minimizes KL from the ideal selected-event distribution to the
    parameterized sampling distribution, not the reverse direction.'
