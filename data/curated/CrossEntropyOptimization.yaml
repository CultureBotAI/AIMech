name: Cross-entropy optimization
definition: A stochastic optimization method that iteratively samples a parameterized search distribution,
  selects high-performing samples using an adaptive threshold, and refits the distribution by maximum
  likelihood on those selected samples.
concept_kind: algorithm
identity_notes: This is the optimization branch of the cross-entropy method, represented by Algorithm2.3
  in the inspected 2005 tutorial. It is distinct from the rare-event probability estimator, the cross-entropy
  loss used to train a classifier, NES natural-gradient steps, and CMA-ES evolution-path covariance adaptation.
  The sampling family and its fit define concrete instances; the generic algorithm is not limited to independent
  Bernoulli variables or a Gaussian implementation. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 285 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 15 and 15 lines respectively.
  Every text hit was a prior candidate lead. Nine exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and seven native neighboring mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.
limitations:
- 'A score>=threshold rule need not select exactly rho*N candidates: order-statistic indexing and tied
  scores can increase the elite count. Implementations must state their quantile, tie and optimization-direction
  conventions; minimization requires the corresponding lower-score criterion or an equivalent score transformation.'
- Unsmoothed finite-sample fitting can produce Bernoulli probabilities 0 or 1 and remove future exploration.
  Interior initialization and 0<alpha<1 prevent exact endpoints after a single convex smoothing step in
  exact arithmetic; smoothing alone does not guarantee exploration forever or a global optimum, and finite
  precision can still collapse support.
- The choice of sampling family, initial support, sample size, elite fraction, fit constraints and stopping
  rule matters. A stabilized threshold is not an optimality certificate; the source explicitly permits
  getting trapped at a local minimum and limits its asymptotic discussion.
- Maximum-likelihood fitting of selected candidates is a sampling-distribution update, not an unbiased
  gradient of raw expected fitness. It does not require derivatives of the black-box objective; solving
  the distribution fit may still require numerical optimization. No universal performance or convergence-rate
  claim is curated.
