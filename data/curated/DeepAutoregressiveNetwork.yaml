claims:
- claim_id: method
  kind: mechanism
  statement: In the decoder, factor the top hidden prior along a fixed within-layer order. Each lower
    stochastic layer conditions each unit on the preceding units in that layer and the complete driving
    layer above, ending with the visible variables. The basic binary factors are logistic regressions;
    additional deterministic transformations or more expressive neural conditionals are optional. The
    recognition model proceeds bottom-up and can likewise be autoregressive within a layer, although the
    paper usually omits those recognition dependencies. Decoder ancestral sampling follows the top-down
    layer and within-layer orders and draws exact samples from the specified model; recognition sampling
    is exact for q but generally only approximate for the model posterior. Jointly train encoder and decoder
    toward the free-energy cost E_q[log q(h|x)-log p(x,h)], using the paper’s approximate gradient procedure
    through stochastic units. In Appendix A’s isolated Bernoulli calculation, with probability p depending
    on parameter theta and downstream f otherwise independent of theta, its final estimator is grad_theta(p)
    f-prime(h)/(2 q(h)), with h sampled from q. Its expectation equals grad_theta(p) times the average
    of the endpoint derivatives. This matches the finite-difference gradient for linear or quadratic f
    but need not for higher-order functions. The record distinguishes this approximation from the exact
    variational identity.
