name: Deep autoregressive network
definition: A generative neural architecture that combines directed stochastic hidden layers with autoregressive
  within-layer conditional dependencies and a separately parameterized recognition network for approximate
  latent inference.
concept_kind: architecture
identity_notes: 'This is the DARN family introduced by Gregor and colleagues, not every deep autoregressive
  model or a time-series forecasting method with a similar name. Its defining latent architecture differs
  from the fully visible original NADE model and extends paired encoder/decoder modeling with within-layer
  autoregression. The paper also permits deterministic layers, different conditional parameterizations,
  non-autoregressive recognition conditionals and an autoregression-free visible layer. Its zero-stochastic-hidden-layer
  limiting example is the fully visible sigmoid belief network. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 343 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 7 and 7 lines
  respectively. All 6 unique matched line contents were inspected in full: RWS component-model distinctions,
  its saved review and the carried sigmoid/autoregressive discovery lead, not existing candidate records.
  Exact checkout counts and differences are retained in the ledger. Thirteen exact AIO CLASS nodes with
  scoped synonyms/comments and outgoing edges and six full native neighboring records were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Efficient ancestral sampling of the joint model does not imply tractable exact marginal likelihood or
  posterior inference. The source uses explicit latent enumeration for small models and importance estimates
  for larger ones.
- The practical estimator can be biased for non-quadratic downstream functions; a curator cubic example
  checks that boundary. The isolated-unit calculation does not certify all gradient paths of the complete
  multilayer implementation, variance reduction or convergence.
- A restricted recognition family may not contain the true posterior. Minimizing the variational objective
  within that family does not remove its approximation gap automatically.
- Within-layer autoregression is directed and ordered, not an undirected recurrent connection. Exact model
  samples do not establish causal semantics or fidelity to observed data.
- Equation (4) in the publisher PDF prints the visible dimension as the upper product index for recognition
  hidden variables; this record interprets the product over the declared hidden units, consistent with
  the surrounding definition and multilayer Equation (8). No author-code behavior is inferred.
- The supplement contains generated sample images, not the gradient derivation; Appendix A of the main
  paper supplies that derivation. No benchmark ranking, universal runtime advantage or trained-model result
  is curated.
