limitations:
- Prescribed clock periods and copied inactive states differ from input-dependent learned gates or stochastic
  state-preservation regularizers.
- Slow modules can miss inputs between ticks. Proposed offsets, buffering, transformations and learned
  periods are not imported as tested baseline features.
- Identity carry on inactive steps does not constrain every active-step Jacobian or certify whole-network
  memory and gradient stability.
- Recurrent parameter and cycle-average operation counts have explicit equal-size and exponential-period
  assumptions. The finite remainder is retained instead of the Appendix intermediate bound.
- Reported handwriting outcomes and excluded poor runs qualify the performance evidence; no universal
  LSTM advantage, current ranking or independent benchmark is asserted.
- All nine primary conference-paper pages were read, including the Appendix. No author implementation,
  training, runtime audit or empirical replication was inspected.
