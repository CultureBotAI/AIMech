claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Operators specify preconditions and additions/deletions to a logical world model. The search
    identifies operators relevant to an unmet goal, treats their preconditions as subgoals, applies an
    applicable operator and revisits the original goal.
