name: STRIPS planning method
definition: A symbolic planning method that uses means–ends analysis and theorem proving over world models
  to construct a sequence of operators satisfying a goal.
identity_notes: This record denotes the planning procedure described in the 1971 STRIPS paper, not a particular
  executable or every later STRIPS-style action representation.
limitations:
- The original paper's predicate-calculus world models and theorem-proving procedure should not be equated
  automatically with every later propositional STRIPS formalism.
- No completeness, runtime or robotic performance guarantee is curated.
aio_no_match:
  search_scope: Compared all 442 pinned AIO labels/scoped synonyms and 56 prior native identities; searched
    both checkouts including hidden and ignored files. Inspected ReasoningLLM, NeuroSymbolicLLM and MachineLearningTask
    definitions.
  rationale: No suitable AIO target was identified for this symbolic planning method. AIO's language-model
    classes share a reasoning topic but do not identify this planner or a verified integration of it.
  examined_targets:
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: This class combines neural language modeling with symbolic components; the original
      STRIPS planning procedure is not such a language model, and no specific integration is asserted.
  - target: AIO:ReasoningLLM
    rejection_reason: The class concerns inference during language tasks, not this operator-based planning
      procedure.
  - target: AIO:MachineLearningTask
    rejection_reason: The planning procedure searches logical world models; it is not defined as learning
      methods from data.
