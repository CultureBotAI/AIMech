claims:
- claim_id: dorefa-net-bitwise-dot-product-and-tanh-weight-activation-quantization
  kind: mechanism
  statement: DoReFa-Net decomposes fixed-point dot products between M-bit and K-bit vectors into bitwise AND and bitcount operations sum_{m=0}^{M-1} sum_{k=0}^{K-1} 2^{m+k} bitcount[and(c_m(x), c_k(y))] (Eq. 3), deterministically quantizes k-bit weights via f_omega^k(r_i) = 2 * quantize_k(tanh(r_i) / (2 * max(|tanh(r_i)|)) + 0.5) - 1 (Eq. 9; or sign(r_i) * E(|r_i|) for k = 1, Eq. 7), and quantizes [0, 1]-clipped activations via f_alpha^k(r) = quantize_k(r) (Eq. 11) with Straight-Through Estimator backpropagation (Eqs. 5-6).
  evidence:
  - source_id: r822-primary-pdf
    locator: Section 2.1-2.3.2, Equations 1-11, pp. 2-4
    relation: supports
  - source_id: r822-primary-pdf
    locator: bitwise_dot_uint2 and dorefa_weight_quantize
    relation: supports
- claim_id: dorefa-net-stochastic-unbiased-gradient-quantization-and-maxpool-fusion
  kind: mechanism
  statement: Because backpropagated activation gradients dr are unbounded and span a wide dynamic range, DoReFa-Net maps dr into [0, 1] per sample via max_0(|dr|), injects uniform dithering noise N(k) = sigma / (2^k - 1) with sigma ~ Uniform(-0.5, 0.5) to yield unbiased k-bit stochastic gradients f_gamma^k(dr) = 2 * max_0(|dr|) * [quantize_k(dr / (2 * max_0(|dr|)) + 0.5 + N(k)) - 0.5] (Eqs. 12-14), and commutes activation quantization past max-pooling via quantize_k(max(a, b)) = max(quantize_k(a), quantize_k(b)) (Eq. 15).
  evidence:
  - source_id: r822-primary-pdf
    locator: Section 2.3.3-2.5, Equations 12-15 and Algorithm 1, pp. 4-6
    relation: supports
  - source_id: r822-primary-pdf
    locator: dorefa_grad_quantize and main
    relation: supports
- claim_id: dorefa-net-1bit-weight-2bit-activation-6bit-gradient-imagenet-training
  kind: application
  statement: On SVHN, CIFAR-10, and ImageNet (AlexNet), DoReFa-Net trains convolutional networks with 1-bit weights, 2-bit activations, and 6-bit stochastic gradients (or 8-bit gradients with <4-bit weights/activations) while maintaining competitive classification accuracy and enabling bitwise acceleration on CPU, FPGA, and ASIC platforms.
  evidence:
  - source_id: r822-primary-pdf
    locator: Section 3 (Experiment Results), Tables 1-3 and Figures 2-4, pp. 6-9
    relation: supports
- claim_id: dorefa-net-first-last-layer-full-precision-and-sub-4bit-gradient-collapse
  kind: limitation
  statement: DoReFa-Net keeps the first convolutional layer and final classification layer unquantized because quantizing them significantly degrades accuracy (Section 2.6), and quantizing backpropagated gradients below 4 bits (e.g., 2-bit gradients) causes substantial accuracy degradation.
  evidence:
  - source_id: r822-primary-pdf
    locator: Section 2.6 (First and the Last Layer, p. 5) and Section 3.1 (Table 1, p. 7)
    relation: supports
