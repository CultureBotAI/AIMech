id: AIMech:DoReFaNetTrainingLowBitwidthConvolutionalNeuralNetworksWithLowBitwidthGradients
name: DoReFa-Net (Training Low Bitwidth Convolutional Neural Networks with Low Bitwidth Gradients)
concept_kind: algorithm
review_status: DRAFT
definition: DoReFa-Net (Training Low Bitwidth Convolutional Neural Networks with Low Bitwidth Gradients) is a low-bitwidth neural network training and inference framework that executes both forward and backward passes via bitwise AND and popcount convolution kernels (Eq. 3) by deterministically quantizing weights to k_w bits via tanh-normalized uniform quantization f_omega^k(r_i) = 2 * quantize_k(tanh(r_i) / (2 * max(|tanh(r_i)|)) + 0.5) - 1 (or layer-mean scaling E(|r_i|) * sign(r_i) for 1-bit weights), deterministically quantizing [0, 1]-bounded activations to k_a bits via f_alpha^k(r) = quantize_k(r), and stochastically quantizing backpropagated activation gradients dr to k_g bits via per-instance max-abs scaling and additive uniform noise N(k) = sigma / (2^k - 1) with sigma ~ Uniform(-0.5, 0.5).
identity_notes: Distinct from PACT (AIMech:PACTParameterizedClippingActivationForQuantizedNeuralNetworks) which learns a parameterized activation clipping bound alpha with full-precision gradients rather than fixed [0, 1] clipping with stochastic low-bitwidth gradient quantization, and distinct from TTQ (AIMech:TTQTrainedTernaryQuantization) which learns asymmetric ternary weight scales {-W_l^n, 0, +W_l^p}.
aliases:
- DoReFa-Net
- DoReFa-Net Low-Bitwidth Gradient Quantization
- Training Low Bitwidth Convolutional Neural Networks with Low Bitwidth Gradients
