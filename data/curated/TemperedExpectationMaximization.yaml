claims:
- claim_id: method
  kind: mechanism
  statement: For observations x with multiplicities n_x, finite latent states z, model parameters eta
    and a positive inverse temperature beta, minimize F_beta(q,eta)=sum_x n_x*sum_z q_xz*[log q_xz-beta*log
    p_eta(x,z)]. For fixed eta, on positive joint support use q_xz=p_eta(x,z)^beta/sum_j p_eta(x,j)^beta.
    For fixed q and beta>0, minimizing F_beta over eta is equivalent to maximizing the expected complete
    log likelihood; in PLSA this gives the usual normalized expected-count M-step with the tempered responsibilities.
    At beta=1 the E-step is the ordinary posterior. With 0<beta<1 it is flatter on its positive support.
    Hofmann’s inverse-annealing schedule first runs early-stopped EM at beta=1, then reduces beta multiplicatively,
    continues iterations while held-out performance improves, and stops decreasing beta when further improvements
    cease. At fixed beta, exact block updates optimize that temperature’s free energy; changing beta changes
    the objective.
  evidence:
