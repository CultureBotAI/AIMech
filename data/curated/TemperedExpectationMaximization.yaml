name: Tempered expectation maximization
definition: An entropy-tempered generalization of expectation maximization for finite latent-state models
  that alternates powered latent-joint responsibilities with weighted complete-log-likelihood parameter
  updates at a positive inverse temperature.
concept_kind: algorithm
identity_notes: This record denotes the deterministic free-energy fitting procedure described by Hofmann,
  with his held-out inverse-annealing schedule as an explicit realization. Ordinary EM is its beta=1 case.
  The procedure changes responsibilities and parameter fitting; it is neither replica-exchange MCMC nor
  a supervised confidence-mask schedule, and it does not introduce a new topic-model probability family.
  The short TEM acronym is not asserted as a globally unambiguous alias. Compared all 442 pinned AIO labels
  and scoped synonyms and 418 preceding native IDs, names and aliases. The initial normalized LDA hit
  denotes LinearDiscriminantAnalysis, whose full Gaussian-classifier record was read; the bare LDA alias
  is omitted from the new topic-model record. No normalized identity match remains for the final candidate
  names/aliases. Final full-checkout fixed-string searches, including ignored and hidden files in both
  worktree and main, return two lines each; both unique contents are existing frontier references. An
  additional broad LDA search returned 289 worktree and 237 main lines before the preceding batch merged;
  all 84 distinct contents were read, covering the existing classifier, topic-context references, unrelated
  programming mnemonics and namespace abbreviations. All 188 semantic label/synonym hits were read. Nineteen
  exact annotated AIO CLASS nodes and outgoing edges were inspected (18 verified unchanged from prior
  reading, Biclustering read here), along with their generated records and 16 native neighbors. The 35
  contextual YAMLs were read or byte-verified after documented full reading. Absence is bounded to this
  snapshot, maintained corpus and inspected semantic neighborhood.
limitations:
- Responsibilities require a positive finite normalizer for each observed x. At positive beta, zero latent-joint
  entries remain zero; the beta-to-zero limit is uniform only over the positive support. beta=0 makes
  the displayed parameter objective independent of eta and is not included as an ordinary M-step.
- This record concerns finite latent-state sums. Raising a continuous latent density to a power below
  one need not preserve integrability; that extension requires its own conditions.
- Exact block updates concern fixed-beta free energy. They do not guarantee monotonic ordinary likelihood
  for beta different from one, global optimality, posterior calibration or held-out improvement. Changing
  beta does not optimize one unchanged objective.
- The inverse-annealing schedule decreases beta after an ordinary-EM start and uses held-out decisions.
  It is not the same schedule as conventional deterministic-annealing cooling, and it is not a stochastic
  sampling transition with an invariant target. Schedule thresholds and multiplicative factors require
  an implementation choice.
- The source’s perplexity and retrieval comparisons concern selected historical corpora and settings.
  No automatic prevention of overfitting, speedup, universal benefit or author-code reproduction is claimed.
