aio_mappings:
- target: AIO:RandomEffectsModel
  relation: related_match
  rationale: The procedure performs approximate inference in a hierarchical mixed-effects target containing
    random-effect blocks and their variance parameters. RandomEffectsModel denotes that modeling context,
    not this Gaussian loss convolution, factor family or inference schedule. This is an algorithm-to-model-family
    relationship without equivalence or an is-a assertion.
limitations:
- The record scopes the base unit-loss, full-Gaussian NCVB-UF procedure using Proposition 2 / Appendix
  A2 for its precision. Printed Algorithm 1 uses Rbar-C^T*W*C, inconsistent with that derivation and invalid
  even for some positive-curvature quadratic examples. This qualified reconstruction is not a claim that
  all source pseudocode or an author implementation has been certified.
- The source generic NCVMP sign, Equation 5 bound display and intermediate Appendix A1/A2 signs contain
  inconsistencies. The general expected-log-target plus entropy definition is used here; prior log determinants
  are separate from precision-weighted quadratics, and cancellation of scale-log terms requires the coordinate-optimal
  inverse-gamma shapes. No unqualified transcription of the displayed bound or stopping-rule convergence
  guarantee is asserted.
- 'Proposition 3 overstates global uniform convergence under its broad assumptions: for psi(eta)=exp(eta),
  Gaussian smoothing is exp(xi+nu^2/2), whose difference from exp(xi) has infinite supremum over all real
  xi for every nu>0. Positive-variance derivative identities require justified interchange, and nu=0 needs
  separate treatment. The source hinge and epsilon-insensitive examples also mix unscaled and doubled
  losses; only the internally reconciled unscaled pinball example is represented.'
- Fully/partially factorized Gaussian projections and stochastic minibatch variants remain outside this
  record. A single coordinate projection sweep need not reach the exact reverse-KL Gaussian projection;
  arbitrary entrywise learning rates need not preserve positive-definite precision. Global optimum comparisons
  with compatible augmented families do not imply that a local run is superior or has a unique optimizer.
- The author-linked BayesGLMM.jl snapshot 15ce3551f62b0dfb5a54a6bc455deb1cb6966b34 postdates arXiv v5.
  Ten selected files were statically read, with no Julia execution. Its added observation-scale factors,
  update order and step controls differ from the base target; its SVC expected-loss derivatives are inconsistent
  with its own unscaled expected loss. This package was not used to certify Algorithm 1 fidelity. The
  remaining package and journal reproduction supplement were not fully inspected.
- All 41 arXiv v5 pages were visually read. The full journal article and reproduction supplement were
  not accessed; journal landing-page access returned HTTP 403. Independent finite quadrature and a single
  supplied Gaussian/IG state check derivative and update algebra, not iterative fitting, convergence or
  accuracy. No empirical performance claim is made; inconsistencies in the source experiment descriptions
  and table contexts are retained in the discovery report. DRAFT remains.
