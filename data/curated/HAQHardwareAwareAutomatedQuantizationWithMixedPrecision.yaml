id: AIMech:HAQHardwareAwareAutomatedQuantizationWithMixedPrecision
name: HAQ (Hardware-Aware Automated Quantization with Mixed Precision)
concept_kind: algorithm
review_status: DRAFT
definition: 'HAQ (Hardware-Aware Automated Quantization with Mixed Precision) is an automated mixed-precision neural network quantization framework that models layer-wise bitwidth allocation for both weights and activations as a continuous-control reinforcement learning task solved by a Deep Deterministic Policy Gradient (DDPG) actor-critic agent: at each layer step k, the agent observes a 10-dimensional normalized layer state vector O_k, outputs a continuous action a_k in [0, 1] rounded to discrete bitwidth b_k in [b_min, b_max] (with sequential bitwidth reduction to satisfy direct hardware simulator latency, energy, or size constraints), applies KL-divergence-calibrated linear quantization (or k-means for size constraints), and updates its policy from one-epoch fine-tuned validation accuracy rewards.'
identity_notes: Distinct from uniform fixed-bitwidth quantization (e.g., PACT or 8-bit integer quantization), distinct from Hessian-spectrum mixed-precision quantization such as Q-BERT (AIMech:QBERTHessianBasedUltraLowPrecisionQuantizationOfBERT) which relies on second-order sensitivity without hardware-in-the-loop latency/energy feedback, and distinct from AMC (AIMech:AMCAccelerationAndModelCompressionOnMobileDevicesWithRL) which uses DDPG to search continuous channel/fine-grained pruning sparsity ratios rather than mixed-precision weight and activation bitwidths.
aliases:
- HAQ
- Hardware-Aware Automated Quantization
- Hardware-Aware Automated Quantization with Mixed Precision
