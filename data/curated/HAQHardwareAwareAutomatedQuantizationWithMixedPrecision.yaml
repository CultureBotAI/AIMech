claims:
- claim_id: haq-ddpg-layerwise-state-and-order-preserving-continuous-bitwidth-action
  kind: mechanism
  statement: HAQ processes a neural network layer-by-layer (taking two steps per layer, one for weights and one for activations) using a 10-dimensional state vector O_k = (k, c_in, c_out, s_kernel, s_stride, s_feat, n_params, i_dw, i_{w/a}, a_{k-1}) (Eqs. 1-2) and maps a continuous DDPG action a_k in [0, 1] to discrete bitwidth b_k = round(b_min - 0.5 + a_k * (b_max - b_min + 1)) (Eq. 3), sequentially decrementing layer bitwidths whenever direct hardware latency, energy, or model-size budgets are exceeded.
  evidence:
  - source_id: r818-primary-pdf
    locator: Section 3.1-3.3, Equations 1-3, pp. 3-4
    relation: supports
  - source_id: r818-primary-pdf
    locator: map_continuous_action_to_bits and enforce_resource_budget
    relation: supports
- claim_id: haq-kl-calibrated-linear-quantization-and-variance-reduced-bellman-update
  kind: mechanism
  statement: For each layer k, HAQ linearly quantizes weights on [-c, c] (and non-negative ReLU activations on [0, c]) via quantize(w, a_k, c) = round(clamp(w, c)/s) * s with step size s = c / (2^{a_k - 1} - 1) (Eq. 4) by choosing c to minimize D_KL(W_k || quantize(W_k, a_k, x)) (Eq. 5), and updates the DDPG critic via the baseline-subtracted Bellman target Q_hat_k = R_k - B + gamma * Q(O_{k+1}, w(O_{k+1}) | theta^Q) with R = lambda * (acc_quant - acc_origin) (Eqs. 6-8).
  evidence:
  - source_id: r818-primary-pdf
    locator: Section 3.4-3.6, Equations 4-8, pp. 4-5
    relation: supports
  - source_id: r818-primary-pdf
    locator: linear_quantize_weight and ddpg_target_q
    relation: supports
- claim_id: haq-roofline-specialized-edge-vs-cloud-mixed-precision-policies
  kind: application
  statement: Across BISMO temporal FPGA edge/cloud accelerators and BitFusion spatial ASIC accelerators on ImageNet (MobileNet-V1, MobileNet-V2, ResNet-50), HAQ reduces inference latency by 1.4x-1.95x and energy consumption by ~1.9x with negligible accuracy loss compared to fixed 8-bit quantization, automatically assigning fewer activation bits to memory-bound depthwise convolutions on edge devices while assigning more bits to depthwise convolutions on compute-bound cloud devices.
  evidence:
  - source_id: r818-primary-pdf
    locator: Section 4.1-4.3, Tables 3-6 and Figures 3-5, pp. 5-8
    relation: supports
- claim_id: haq-per-episode-retraining-and-hardware-simulator-dependency-limitation
  kind: limitation
  statement: Because HAQ fine-tunes the quantized network for one epoch after every RL episode to compute the reward signal R and queries a target hardware accelerator or simulator in the loop, policy exploration incurs multi-epoch retraining overhead and policies optimized for one hardware architecture are sub-optimal when deployed on another (Table 1).
  evidence:
  - source_id: r818-primary-pdf
    locator: Section 1 (Table 1, p. 2) and Section 3.5-3.7 (Finetuning, pp. 4-5)
    relation: supports
