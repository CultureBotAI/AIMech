name: Extended Guided Local Search
definition: The Tsang–Mills–Ford extension of Guided Local Search that combines cost-scaled penalty weighting,
  aspiration for a new best original-objective solution despite an augmented-objective penalty, and probabilistic
  random neighborhood moves.
concept_kind: algorithm
identity_notes: EGLS here denotes the combined coefficient, aspiration and randomness extension in CSM371.
  GLS+A and GLS+R are separate ablations, not exact aliases of the combined algorithm. The method modifies
  the GLS search framework; it is not FLS activation-bit bookkeeping, simulated annealing, or a generic
  name for any later GLS extension. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 307 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 4 and 4 lines respectively. All eight text hits were
  prior discovery leads in the two checkouts, not existing candidate records. Eight exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The report title does not establish a parameter-free algorithm. Feature definitions, neighborhood and
  local solver, cost estimate C, coefficient a, randomization probability P_r, initialization and stopping
  remain choices; the proposed defaults were evaluated only in the reported problem settings.
- The literal aspiration inequality is strict in both original improvement and augmented deterioration.
  It does not specify equality handling when h(s_next)=h(s_current); the underlying local solver and concrete
  implementation must declare that boundary and the order of random versus ordinary/aspiration moves.
- Scaling by a typical cost contribution is problem-dependent. The TSP first-tour average is not a universal
  normalization for arbitrary objectives, especially zero, negative or mixed-scale terms.
- Random moves can worsen either objective and need not improve exploration on a particular step. Aspiration
  protects access to an examined new original best, not global optimality or monotonic improvement of
  the entire trajectory. No comparative performance claim is curated.
