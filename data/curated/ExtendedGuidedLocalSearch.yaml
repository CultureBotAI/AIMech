claims:
- claim_id: method
  kind: mechanism
  statement: 'Retain GLS feature counters, augmented objective h=g+lambda*sum(p_i*I_i), and penalty increments
    for present features tied for maximal cost/(1+p_i) utility. Scale lambda=a*C, where C estimates a
    characteristic cost contribution; the TSP illustration uses the first local-minimum tour cost divided
    by the number of cities. Add the report’s literal aspiration condition: accept an examined neighbor
    with g(s_next)<g(best_so_far) even when h(s_next)>h(s_current). This bypasses an augmented-cost rejection;
    it does not erase feature counters. Add randomization so that, with configured probability P_r per
    move, a randomly selected neighbor is accepted regardless of its objective or penalty quality. The
    combined EGLS uses all three changes. Its reported recommendations a=1 and P_r=.2 are experimental
    defaults, not universal constants or a proof of parameter independence.'
  evidence:
