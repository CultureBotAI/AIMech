aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 307 preceding maintained IDs/names/aliases;
    ignored/hidden text in both full checkouts; eight exact AIO CLASS nodes with scoped synonyms, comments
    and outgoing edges; five complete native neighboring records.
  rationale: No suitable target was found for this particular general optimization procedure in the inspected
    snapshot and semantic neighborhood. Shared learning, feedback or evolutionary vocabulary does not
    establish a model or task mapping.
  examined_targets:
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: The general GLS/genetic optimization procedure is not a network of artificial neurons.
      The neural history of GLS does not make every later optimizer a neural architecture.
  - target: AIO:Network
    rejection_reason: A population, feature collection or move graph is not by itself a defining network
      architecture; this very broad node does not identify the search procedure.
  - target: AIO:HopfieldNetwork
    rejection_reason: The method is not the recurrent content-addressable memory architecture specified
      by this target.
  - target: AIO:FeedbackNetwork
    rejection_reason: Adaptive search feedback is not this neural architecture with input, hidden and
      output layer relationships.
  - target: AIO:SymmetricallyConnectedNetwork
    rejection_reason: No symmetric neural connectivity with equal bidirectional weights defines this optimizer.
  - target: AIO:TrainingStrategy
    rejection_reason: The method solves general constrained optimization and is not restricted to preprocessing
      or training a machine-learning model.
  - target: AIO:MachineLearningTask
    rejection_reason: The target concerns building methods that learn from data. Searching assignments
      under a supplied objective does not necessarily instantiate that learning task.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The target is a large language model. Its related evolutionary-algorithms synonym
      does not identify all genetic optimizers.
