claims:
- claim_id: shared-weight-fitting
  kind: mechanism
  statement: For N observations with V aligned views, fix view-specific component values f_vij=f_vj(x_vi)
    and common simplex weights q_j. Minimize -(1/(N V))sum_vi log Q_vi, where Q_vi=sum_j q_j f_vij. Set
    q_j_new=q_j/(N V)*sum_vi f_vij/Q_vi. Each view contributes its average current responsibilities equally.
    Common factors depending on the view and observation but not the exemplar cancel in this update. With
    finite positive component values, positive support and exact unpruned iteration, the soft convex problem
    attains a global optimum; coefficient uniqueness is not implied.
  evidence:
  - source_id: multiview-source
    locator: Sections 3.1-3.2, printed pp. 208-209 / PDF pp. 4-5, Equations 6-9 and support condition
    relation: supports
- claim_id: specified-exemplars-and-assignment
  kind: mechanism
  statement: Given a requested M, retain the M largest fitted q values as exemplars, each anchoring its
    own cluster. Assign every other observation to the selected exemplar maximizing sum_v q_j f_vij/Q_vi.
    This sums per-view posteriors, rather than multiplying densities or taking the maximum over individual
    views. The source uses strict comparisons without a tie policy. Its implementation stops when the
    selected top-M indices and their ranking stay unchanged for several consecutive iterations; this can
    occur before the soft objective is optimized.
  evidence:
  - source_id: multiview-source
    locator: Section 3.2, printed pp. 209-210 / PDF pp. 5-6, stopping discussion and Equation 10
    relation: supports
- claim_id: scope-and-calibration
  kind: limitation
  statement: View families and beta_v values remain supplied choices. The empirical scale N^2 log(N)/sum_ij
    d_vij is a search guide and is undefined when its denominator vanishes. The fitting update needs O(N^2
    V) dense arithmetic per iteration, apart from distance construction. A fixed-M hard partition has
    no transferred global-optimum guarantee; stable ranking is not a bound on residual objective error.
    Equal view contribution also does not guarantee robustness to uninformative or systematically biased
    views.
  evidence:
  - source_id: multiview-source
    locator: Section 3.2, printed p. 210 / PDF p. 6, Equation 11 and cost; Sections 4-5, printed pp. 210-214
      / PDF pp. 6-10; curator stable-ranking example
    relation: supports
limitations:
- The record uses the finite evaluated-component/log-likelihood objective; the source empirical-versus-continuous
  KL shorthand requires a compatible measure or lift. Gaussian exponents use squared Euclidean distances.
- The soft fit is a shared-weight specialization of fixed-component EM. The complete multiview data construction,
  equal-view objective and sum-of-posteriors/top-M policy define this narrower algorithm.
- Source experiments remove observations lacking required views and select scale multipliers by label
  entropy. They do not establish an intrinsic missing-view algorithm, fully label-free model selection,
  or universal performance. No historical experiment was reproduced.
