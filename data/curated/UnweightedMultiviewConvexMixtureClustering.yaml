definition: A multiview exemplar-clustering procedure that fits a single vector of exemplar weights by
  minimizing the equally weighted sum of fixed-component negative log likelihoods across aligned data
  views, then selects a specified number of exemplars.
identity_notes: 'This is the unweighted Tzortzis-Likas 2009 procedure. Shared q couples corresponding
  exemplar indices across views, while each view retains its own fixed component family and scale. It
  averages view-specific log objectives and responsibilities; fixing uniform view weights inside the later
  weighted log-of-sum objective does not recover this procedure. The original sum-of-posteriors hard assignment
  and top-M ranking stop are retained explicitly. No normalized identity collision across all 442 pinned
  AIO IDs, labels/scoped synonyms and 487 maintained IDs, names and aliases. Full-checkout searches include
  ignored and hidden files: 8 matched lines in the worktree and 9 in main. All six distinct matched texts
  were read; they concern the prior exemplar-clustering frontier, its source/query URLs and an unrelated
  FreeFem lexer token. Seven annotated AIO nodes and seven full native neighbors were inspected. The same
  pinned bytes retain the previously read 442 class labels and 138 semantic label/synonym rows. Absence
  is bounded to this snapshot and corpus.'
