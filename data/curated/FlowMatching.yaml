name: Flow matching
definition: A generative-model training method that fits a time-dependent vector field by regression to
  velocities associated with a chosen probability path between a base distribution and a data distribution,
  with conditional flow matching providing a tractable training objective.
concept_kind: algorithm
identity_notes: The 442 pinned AIO identities and 90 preceding native identities, including scoped synonyms
  and aliases, were compared alongside ignored-inclusive searches of both checkouts. This record denotes
  the general probability-path training method of Lipman and colleagues. Conditional flow matching is
  its tractable objective construction, not an asserted synonym for every use of the general method. Straight
  conditional paths overlap with the training construction used in rectified flow; that overlap does not
  make the general path family and the rectification/reflow procedure identical.
limitations:
- The equality of conditional and marginal objective gradients is conditional on the paper's density and
  integrability assumptions, including positive path density in Theorem 2; finite neural training does
  not guarantee the ideal field.
- The Gaussian construction with positive terminal noise leaves a smoothed approximation to the data distribution.
  Training without ODE simulation does not remove numerical ODE solving from sampling.
- The optimal-transport conditional Gaussian path in Section 4 does not imply that the resulting marginal
  flow is a globally optimal transport map, as the paper explicitly notes on PDF p. 6.
- No benchmark superiority, universal sampling-step count or independently checked theorem proof is asserted.
