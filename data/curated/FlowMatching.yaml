claims:
- claim_id: generative-mechanism
  kind: mechanism
  statement: The method regresses a neural vector field on a target velocity under a prescribed time-indexed
    density. Conditional flow matching samples a data-conditioned path and its known conditional velocity;
    under the paper's assumptions its loss has the same parameter gradient as the marginal flow-matching
    loss. For the illustrated Gaussian conditional paths, the mean and standard deviation define an affine
    transformation of base noise. Training avoids integrating the learned ODE, while generation integrates
    that vector field from the base distribution.
