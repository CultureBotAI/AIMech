name: Adaptive rejection sampling
definition: The Gilks–Wild univariate rejection sampler that uses tangents to a concave log density as
  a piecewise-linear upper hull and chords as a lower hull, updating these bounds from evaluated proposals.
concept_kind: algorithm
identity_notes: This record scopes ARS to the derivative-based tangent construction in Gilks and Wild
  (1992), for a fixed log-concave scalar target on a connected domain. Derivative-free envelope constructions
  and adaptive rejection Metropolis sampling are distinct variants requiring their own evidence. Exact
  conditional draws do not make successive joint Gibbs states independent. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 167 prior native IDs/names/aliases. Full-checkout
  searches in both worktrees included ignored and hidden files; the 15 lines in each were shared Tierney
  source-title references or an adaptive-rejection discovery lead, not matching records. Existing Gibbs,
  Metropolis-within-Gibbs, random-walk and independence Metropolis mechanisms were inspected to resolve
  specialization boundaries.
limitations:
- Concavity of log g is essential for the tangent and chord bounds. Unimodality alone is insufficient,
  and non-log-concave targets are not covered by this construction.
- The displayed baseline assumes usable derivatives and connected scalar support. It does not assert validity
  for every nonsmooth density or a direct multivariate joint draw.
- Tail slopes and support endpoints must make the proposal integrable. Concentrated or skewed densities
  require numerical care.
- When a Gibbs conditional changes, hull values must be computed for that conditional; reusing stale density
  bounds is not justified.
- No universal evaluation savings or benchmark result is asserted. ARMS and its 1997 correction remain
  separate uninspected-method leads.
