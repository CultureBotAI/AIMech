claims:
- claim_id: method
  kind: mechanism
  statement: Write h=log g for a differentiable concave log density. At ordered support points evaluate
    h and h prime; tangent intersections define an upper hull u, and chords define a lower hull l, with
    l=−infinity outside the extreme support points. Initialize points so exp(u) is integrable; on unbounded
    tails this requires a positive leftmost slope and a negative rightmost slope. Draw x from normalized
    exp(u) and w uniformly on (0,1). Accept immediately if w≤exp(l(x)−u(x)); otherwise evaluate h(x) and
    h prime(x), accept if w≤exp(h(x)−u(x)), and incorporate the evaluated point into the hulls whether
    that full test accepted or rejected it. Repeat rejected trials. The conditional-on-history rejection
    argument gives the fixed target law for each output despite adaptation of the valid bounds.
  evidence:
