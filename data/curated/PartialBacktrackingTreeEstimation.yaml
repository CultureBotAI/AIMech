aio_no_match:
  search_scope: Compared all 442 pinned AIO and 643 native IDs, names, aliases and scoped synonyms; no
    normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
    discovery and original Documents checkouts returned 20, 0, 0 lines. All distinct match contents were
    inspected. Semantic matching covered 66 AIO and 347 native definitions, with every matched definition
    read. 13 full annotated AIO node/edge/generated contexts and 5 full native records were inspected.
    Retain the basic and modified partial-backtracking estimators as one algorithm identity with distinct
    candidate-testing order. Sampling several successors without replacement extends single-path tree
    probing without Chen-style stratum merging. Conditional-model extrapolation, search-threshold control
    and score-based beam pruning have different mechanisms.
  rationale: No suitable pinned AIO counterpart was established for this subset-weighted backtracking-tree
    estimator. The inspected classification, bias, learning-task and probabilistic-network identities
    have different scopes; the no-match assessment is bounded to the inspected snapshot.
  examined_targets:
  - target: AIO:DecisionTree
    rejection_reason: The pinned class is a classification task. This method estimates additive properties
      of a backtracking search tree rather than fitting a classifier.
  - target: AIO:MarkovChain
    rejection_reason: Random subset selection does not identify the complete fixed-tree additive-cost
      estimator with a generic stochastic-network class. No appropriate counterpart was established.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: The record is a sampling algorithm with an expectation claim, not the computational
      bias phenomenon defined by this class.
  - target: AIO:MathematicalFunction
    rejection_reason: The additive tree functional is an input; the maintained identity is the randomized
      estimation procedure.
  - target: AIO:MachineLearningTask
    rejection_reason: The algorithm samples an existing implicit tree and need not learn a model or perform
      a machine-learning task.
  - target: AIO:RegressionAnalysis
    rejection_reason: No response-surface regression is required for the weighted tree estimate.
  - target: AIO:ReinforcementLearning
    rejection_reason: Sampling tree nodes to estimate a sum does not learn a reward-maximizing policy
      or define exploration–exploitation control.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The search tree is not asserted to factor a joint distribution of random variables;
      no graphical-model learning task is required.
  - target: AIO:BayesianNetwork
    rejection_reason: An implicit rooted search tree is not by itself a Bayesian-network factorization
      or a sampler from its joint law.
  - target: AIO:GraphLanguageModel
    rejection_reason: No graph-based language model is required.
  - target: AIO:ReasoningLLM
    rejection_reason: The procedure is not a language-model reasoning architecture.
  - target: AIO:RecursiveLanguageModel
    rejection_reason: Tree-structured neural language composition is distinct from randomized additive
      tree-functional estimation.
  - target: AIO:ComputationalBias
    rejection_reason: Statistical bias is a property discussed when assessing estimators, not the identity
      of this sampling procedure.
limitations:
- This record retains basic and modified variants together; neither is score-threshold beam pruning, conditional-model
  CDP prediction, IDA* threshold control or Chen-style weighted-stratum representative merging.
- The sampling subset must have the stated conditional inclusion probabilities, and weights must match
  the actual sample size. Uniform weighting is not valid for arbitrary adaptive or preferential selection.
- Candidate-test counts, feasible-tree counts, root conventions and variable examination costs must not
  be interchanged. Tree path occurrences are not automatically deduplicated graph states.
- Historical matrix-multiplication results include a nine-node discrepancy between prose and an exhaustive
  table count; the larger problem has no exact comparison count. No numerical benchmark replication or
  universal performance claim is made.
- All 23 pages of the February 1977 TR60 scan were visually inspected. Institutional metadata lists 1978-11,
  but equivalence to the later journal text is unverified. Author software was not inspected or executed;
  constructed finite examples test boundaries only.
