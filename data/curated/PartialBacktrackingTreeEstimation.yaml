id: AIMech:PartialBacktrackingTreeEstimation
name: Tree-size estimation by partial backtracking
aliases:
- Purdom partial-backtracking estimator
concept_kind: algorithm
definition: A randomized backtracking-tree estimator that explores a uniformly selected subset of successors
  at each visited branching point and uses inverse inclusion weights to estimate the total cost of candidate
  examinations in the corresponding complete fixed search.
identity_notes: Compared all 442 pinned AIO and 643 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 20, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 66 AIO and 347 native definitions, with every matched definition
  read. 13 full annotated AIO node/edge/generated contexts and 5 full native records were inspected. Retain
  the basic and modified partial-backtracking estimators as one algorithm identity with distinct candidate-testing
  order. Sampling several successors without replacement extends single-path tree probing without Chen-style
  stratum merging. Conditional-model extrapolation, search-threshold control and score-based beam pruning
  have different mechanisms.
definition_evidence:
- source_id: purdom1977tr60
  locator: Section 2, PDF pp. 5–7, Basic B1–B6 and Modified M1–M5
  relation: supports
claims:
- claim_id: basic-subset-weighting
  kind: mechanism
  statement: The basic variant chooses m of a candidate values without replacement, with 1 <= m <= a when
    a is positive. Its sequential remaining-count selection produces a uniform subset. Each selected candidate
    receives its parent weight multiplied by a/m, contributes its examination cost and is tested for feasibility
    before recursion. For a finite fixed tree under the stated conditional sampling rule, the weighted
    estimate preserves the expected complete examination cost. A branch with no candidates terminates.
  evidence:
  - source_id: purdom1977tr60
    locator: Section 2, PDF pp. 5–6, B1–B6 and expectation discussion
    relation: supports
- claim_id: modified-pretesting
  kind: mechanism
  statement: The modified variant first tests every candidate at a visited parent and charges these tests
    using the parent weight. It then forms the feasible set, samples m of its a members uniformly without
    replacement and propagates weight a/m into their descendants. Testing all candidates can avoid choosing
    a failed branch, but adds work even when only a few feasible children are followed. Basic and modified
    variants have different sampling populations and cost-accounting order.
  evidence:
  - source_id: purdom1977tr60
    locator: Section 2, PDF pp. 6–7, M1–M5
    relation: supports
- claim_id: count-target-and-scope
  kind: scope
  statement: 'The target cost may include failed feasibility tests, so it need not equal the number of
    feasible expanded nodes. The displayed algorithm initializes the accumulated cost to zero and omits
    a root test, while the later theoretical singleton-tree convention counts a root. Count conventions
    must therefore be specified. Sampling multiple branches retains omitted-branch uncertainty: a finite
    partial traversal does not certify that no solution or deep subtree exists, and node-test counts are
    not universal wall-clock costs.'
  evidence:
  - source_id: purdom1977tr60
    locator: Sections 1–3, PDF pp. 3–9; Section 4, PDF pp. 14–15
    relation: supports
- claim_id: efficiency-and-variance-scope
  kind: limitation
  statement: The report studies a finite random binary-tree family and a policy that sometimes explores
    both successors instead of one. Its efficiency measure combines expected work with expected sampling
    variance conditional on a tree. This is distinct from variance of true tree sizes across the random
    family. Full traversal can remove sampling variance while remaining costly; the report’s depth-scheduling
    advice and historical experiments do not establish a universally optimal sampling policy or finite-sample
    accuracy guarantee.
  evidence:
  - source_id: purdom1977tr60
    locator: Section 3, PDF pp. 8–13; Section 4 and Tables 1–2, PDF pp. 14–18; Figures 2–4, pp. 21–23
    relation: supports
- claim_id: printed-analysis-and-version
  kind: limitation
  statement: The inspected February 1977 report contains printed analysis inconsistencies. Its displayed
    tree-size variance recurrence fails the two-level binary-tree case, and the work-distribution recurrence’s
    literal bracketing loses branching probability mass when both successors are always selected. Displayed
    policy expressions also conflict with the stated balance equation. These are qualifications on this
    scanned report, not findings about uninspected implementation code or the later journal version; the
    record does not certify those formulas or an optimal schedule.
  evidence:
  - source_id: purdom1977tr60
    locator: Section 3, PDF pp. 9–11; report cover, PDF p. 1
    relation: supports
