claims:
- claim_id: hydralora-asymmetric-shared-a-multi-b-parameter-decomposition
  kind: mechanism
  statement: Because fine-tuned LoRA down-projection matrices A converge across sub-domains while up-projection matrices B diverge to encode task-specific variations (Observations I-II), sharing a single A in R^{r x k} across N expert heads B_i in R^{d x r} reduces adapter parameter count from N r (d + k) to r (k + N d) while preventing destructive multi-domain interference.
  evidence:
  - source_id: r672-primary-pdf
    locator: Section 2.3 (Observations I-II, Figure 3) & Section 3.1 (Equation 2), pp. 3-4
    relation: supports
- claim_id: hydralora-moe-router-segregation-and-linear-inference-merging
  kind: mechanism
  statement: HydraLoRA determines the number of intrinsic corpus components N via TF-IDF and k-means elbow clustering (or a user-specified count) and trains a dense softmax router omega = softmax(W_g^T x) jointly with A and {B_i}_{i=1}^N so that during inference the linear expert heads can be dynamically merged via sum_{i=1}^N omega_i B_i A x.
  evidence:
  - source_id: r672-primary-pdf
    locator: Section 3.2.1-3.2.2 (Equations 3-4, Figure 4) & Appendix B (Initialization via k-means, Equations 7-8), pp. 4-5, 16-17
    relation: supports
- claim_id: hydralora-application-single-and-multitask-llm-finetuning-efficiency
  kind: application
  statement: On LLaMA2-7B and LLaMA2-13B across single-domain benchmarks (MMLU, Medical, Law, GSM8K, HumanEval) and multi-task Flanv2/BBH, HydraLoRA outperforms monolithic LoRA, AdaLoRA, LoraHub, and symmetric LoRA MoE while using only 0.341% trainable parameters on BBH (vs. 2.976% for LoRA MoE) and cutting GSM8K training energy by 49.6% with a 1.96x speedup over rank-32 LoRA.
  evidence:
  - source_id: r672-primary-pdf
    locator: Section 4.2-4.3 (Tables 2-3, Figures 5-6) & Appendix D (Table 4), pp. 6-8, 18
    relation: supports
- claim_id: hydralora-limitation-multi-expert-training-iteration-overhead
  kind: limitation
  statement: Compared to a single low-rank LoRA head of the same base rank r, training N expert B_i matrices and the gating router requires 1x to 2x more training iterations/compute than minimal single-head PEFT baselines and relies on input-dependent routing during inference so the expert heads cannot be statically collapsed into a single input-independent matrix.
  evidence:
  - source_id: r672-primary-pdf
    locator: Section 3.2.2 (p. 5) & Appendix E (Limitation, p. 19)
    relation: supports
