id: AIMech:ChainOfLoRA
name: Chain of LoRA
concept_kind: algorithm
review_status: DRAFT
definition: An iterative parameter-efficient fine-tuning framework that approximates a higher-rank weight update by training a sequence of low-rank LoRA adapters, periodically merging each learned low-rank update B_j A_j into the frozen backbone weights, and re-initializing the adapter parameters to fit the remaining optimization residual without increasing peak trainable parameter count or inference latency.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which optimizes a single pair of low-rank matrices B and A whose update rank is bounded above by a single rank r), from AdaLoRA (AIMech:AdaLoRA, which dynamically prunes singular values within a single SVD-parameterized adapter during training rather than chaining and merging successive residual low-rank updates), and from rsLoRA (AIMech:RsLoRA, which modifies the scaling factor alpha / sqrt(r) of a single high-rank LoRA module rather than constructing a high-rank update via a sequential chain of low-rank residual steps). Formulated by Xia, Qin, and Hazan (ICML 2024, PMLR 235:54088-54099, arXiv:2401.04151).
aliases:
- Chain of LoRA (COLA)
- COLA Iterative Residual Low-Rank Adaptation
- Frank-Wolfe Residual Chain of Low-Rank Adaptation
