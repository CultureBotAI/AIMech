claims:
- claim_id: chainoflora-iterative-tune-merge-reset-update
  kind: mechanism
  statement: Chain of LoRA (COLA) constructs an M-step chain of low-rank adapters {(A_1, B_1), ..., (A_M, B_M)} by iteratively optimizing only the current low-rank matrices (A_j, B_j) of rank r_j against the accumulated frozen weight matrix W_{j-1} = W_0 + sum_{i=1}^{j-1} B_i A_i, merging the resulting product B_j A_j into W_{j-1} to form W_j = W_{j-1} + B_j A_j, and resetting the next adapter with Gaussian initialization for A_{j+1}, zero initialization for B_{j+1}, and cleared optimizer state.
  evidence:
  - source_id: r678-primary-pdf
    locator: Section 4 Methodology, Eq. 3 and Algorithm 1, p. 3-4
    relation: supports
- claim_id: chainoflora-cumulative-rank-expansion-and-frank-wolfe-view
  kind: mechanism
  statement: Because the rank of a sum of M rank-r matrices is bounded above by min(M r, d, k) while only a single pair of matrices (A_j, B_j) of rank r_j is active in memory at any step j, Chain of LoRA expands the effective rank of the total weight update sum_{j=1}^M B_j A_j beyond r without increasing peak GPU memory or inference latency, interpreting each residual low-rank update as an approximate Frank-Wolfe conditional-gradient step in matrix space.
  evidence:
  - source_id: r678-primary-pdf
    locator: Section 4.1 Residual Learning as Frank-Wolfe & Section 4.2 Complexity Analysis, p. 4-5
    relation: supports
- claim_id: chainoflora-llm-finetuning-application
  kind: application
  statement: Chain of LoRA is applied to parameter-efficient fine-tuning of large language models including OPT-1.3B, Llama-2-7B, and Llama-2-13B across commonsense reasoning, world knowledge, reading comprehension, and sequence classification benchmarks, consistently outperforming standard single-stage LoRA under identical total training epoch budgets and step-down rank schedules.
  evidence:
  - source_id: r678-primary-pdf
    locator: Section 5 Experiments, Tables 1-3 and Figures 2-4, p. 5-8
    relation: supports
- claim_id: chainoflora-merged-weight-storage-overhead
  kind: limitation
  statement: Merging successive low-rank updates directly into the backbone weights or storing all M low-rank adapter pairs {(A_j, B_j)}_{j=1}^M for multi-task checkpoint switching increases disk checkpoint storage by a factor of M relative to storing a single rank-r LoRA adapter, and requires tuning the chain length M and per-step rank schedule.
  evidence:
  - source_id: r678-primary-pdf
    locator: Section 4.2 Complexity Analysis & Section 5.3 Ablation Study, p. 4-5, 7-8
    relation: supports
