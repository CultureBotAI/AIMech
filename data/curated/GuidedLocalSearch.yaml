aio_no_match:
  search_scope: All 442 pinned AIO CLASS identities and scoped synonyms, all 301 preceding maintained
    identities, ignored/hidden full-checkout text, six exact AIO targets and seven native neighboring
    methods.
  rationale: No suitable AIO target was found for this general optimization framework in the inspected
    snapshot and semantic neighborhood. Search memory, local costs and optional machine-learning applications
    do not by themselves identify a learning task or model class.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The definition concerns preprocessing or training machine-learning models. General
      local-search optimization is not restricted to such training.
  - target: AIO:MachineLearningTask
    rejection_reason: The target concerns learning methods from data; minimizing a supplied combinatorial
      objective is not necessarily that task.
  - target: AIO:ReinforcementLearning
    rejection_reason: Memory, adaptive penalties or an acceptance criterion do not themselves define a
      policy/environment learning problem. Exploration terminology is insufficient for a forced mapping.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: The method is not a language model fine-tuned through reward feedback.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The target is a large language model. Its related evolutionary-algorithms synonym
      does not identify all optimizers or convert a single-trajectory method into a model.
  - target: AIO:MarkovChain
    rejection_reason: Some memoryless configurations admit a Markov description, while others use search
      history. That mathematical representation alone does not identify the optimization framework with
      the pinned network/model class or its semantic parent.
