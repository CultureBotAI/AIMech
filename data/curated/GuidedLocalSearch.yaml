claims:
- claim_id: method
  kind: mechanism
  statement: Choose binary indicators I_i(s) for nontrivial solution features, feature costs c_i, a local-search
    procedure and penalty scale lambda. In the inspected basic formulation the c_i are fixed and nonnegative,
    and penalties p_i start at zero. Repeatedly run local search from the current solution using h(s)=g(s)+lambda*sum_i
    p_i*I_i(s), where g is the original cost. At an h-local minimum s_star, compute u_i=I_i(s_star)*c_i/(1+p_i).
    In the nondegenerate case of positive maximum utility, increment p_i by one for every feature tied
    at that maximum, then resume local search from the same solution under the modified h. Penalization
    can repeat without an intervening move. Feature costs enter the utility ranking, not as extra multipliers
    in the displayed penalty sum. Retain and return the best solution found according to g, rather than
    choosing it by the changing augmented objective. FLS and other accelerations may be combined with
    the local-search subroutine but are not required by this baseline.
