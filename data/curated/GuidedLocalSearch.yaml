name: Guided local search
definition: A local-search metaheuristic that repeatedly minimizes an objective augmented by feature penalties,
  increasing selected penalties at local minima to alter subsequent search while retaining solutions according
  to the original objective.
concept_kind: algorithm
identity_notes: 'GLS is the named feature-penalty procedure, not all tabu search, a hard prohibition of
  recently visited moves, or Fast Local Search (FLS), which is a separately combinable neighborhood-reduction
  technique. The authors relate GLS to the broader tabu-search framework; that relationship does not make
  every tabu algorithm and the specified GLS update identical. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 301 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 37 and 37 lines
  respectively. All 13 unique hit contents were inspected: prior local-search candidate leads, Ant System’s
  feasibility-list distinction, and their saved reports/reviews. These were references to methods rather
  than existing candidate records. Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and seven native neighboring mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- The source allows zero feature costs. If every utility is zero, the all-feature pseudocode makes absent
  features tie with present ones, whereas the prose says only local-minimum features are penalized. A
  concrete implementation must declare its zero-utility and eligible-feature convention; the record’s
  stated update is restricted to the positive-maximum case.
- 'Curator qualification of Equation 1: equal penalties contribute lambda*p times the number of active
  features. They cancel from move-cost differences only when that feature count is unchanged. The source’s
  equal-penalty cancellation statement is therefore not universal for variable-cardinality feature sets.'
- Penalties are finite soft costs, not hard prohibitions. Their effect depends on lambda, objective scale,
  feature definition, move set and stopping. At lambda=0 the guidance vanishes; increasing penalties does
  not prove escape from every basin or convergence to a global optimum.
- Local minima are relative to h and the chosen neighborhood, not necessarily g. A deterministic penalty
  update does not make an entire implementation deterministic if its initial solution or local-search
  routine is randomized. The manuscript’s TSP comparisons do not establish universal superiority, and
  no benchmark results are curated.
