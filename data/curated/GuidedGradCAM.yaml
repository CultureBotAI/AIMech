name: Guided Grad-CAM
definition: A visualization method combining an upsampled Grad-CAM localization map with guided-backpropagation
  input-space scores.
concept_kind: algorithm
identity_notes: Guided Grad-CAM is a specific fusion of two visualization methods, not a synonym for Grad-CAM
  or guided backpropagation alone.
limitations:
- The output inherits dependence on the selected Grad-CAM layer and the guided-backpropagation rule.
- Higher image resolution and visual appeal do not establish universal explanation fidelity or causal
  importance.
