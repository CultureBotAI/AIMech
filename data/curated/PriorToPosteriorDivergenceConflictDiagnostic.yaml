claims:
- claim_id: renyi-relative-belief-discrepancy-invariance
  kind: mechanism
  statement: The diagnostic defines the checking discrepancy as the prior-to-posterior Rényi divergence
    R_alpha(y) = (alpha - 1)^(-1) log int g(theta | y)^alpha g(theta)^(1 - alpha) dtheta = log ||RB(theta
    | y)||_{alpha - 1}, where RB(theta | y) = g(theta | y) / g(theta) is the relative belief ratio, and
    computes the tail probability p_alpha = P(R_alpha(Y) >= R_alpha(y_obs)) for Y ~ p(y) = int g(theta)
    p(y | theta) dtheta; because R_alpha(y) depends on the data only through the posterior distribution,
    it is automatically a function of any minimal sufficient statistic and invariant to its choice.
  evidence:
  - source_id: nott-wang2020
    locator: Section 2.1, Equations 2–4 and 6–7, lines 25–39
    relation: supports
  - source_id: nott-seah2020
    locator: Section 2.1, Equations 1–2, PDF pp. 4–5
    relation: supports
- claim_id: hierarchical-conditional-and-marginal-divergence-decomposition
  kind: mechanism
  statement: For a partitioned parameter theta = (theta_1, theta_2) with hierarchical prior g(theta_1
    | theta_2) g(theta_2), the check decomposes into (i) a marginal divergence R_{alpha 2}(y) between
    g(theta_2 | y) and g(theta_2) calibrated under the joint prior predictive p(y), and (ii) an expected
    conditional divergence R_{alpha 1}(y) = E_{g(theta_2 | y_obs)}[R_alpha(theta_1 | y, theta_2)] calibrated
    under the mixed reference predictive distribution m(y) = int g(theta_2 | y_obs) p(y | theta) g(theta_1
    | theta_2) dtheta_1 dtheta_2 (or its partial-posterior / leave-one-out variant).
  evidence:
  - source_id: nott-wang2020
    locator: Section 2.2, Equations 8–12, lines 41–55; Section 3.3, Example 3.3, lines 90–105
    relation: supports
- claim_id: asymptotic-jeffreys-and-reference-prior-calibration
  kind: mechanism
  statement: Under regularity conditions as sample size n -> infinity with true parameter theta*, R_alpha(y)
    - (d/2) log(n / (2*pi)) + (d / (2*alpha)) log(alpha) converges almost surely to -log g(theta*) + 0.5
    log |I(theta*)|, where I(theta) is the per-observation Fisher information matrix, so p_alpha converges
    to P(g(theta)|I(theta)|^(-1/2) <= g(theta*)|I(theta*)|^(-1/2)) for theta ~ g(theta), yielding a limiting
    p-value of 1 under Jeffreys' prior (and under two-stage reference priors for the hierarchical checks).
  evidence:
  - source_id: nott-wang2020
    locator: Section 2.1, Equation 5, lines 33–34; Section 3.2, Equation 17, lines 75–85; Section 4, Equations
      19–20, lines 121–131
    relation: supports
- claim_id: variational-and-gaussian-mixture-divergence-approximation
  kind: application
  statement: To avoid expensive Markov chain Monte Carlo posterior integration across M + 1 simulated
    prior-predictive datasets, the diagnostic replaces g(theta | y) with fast variational Bayes approximations
    q(theta) in the same exponential family as the prior (yielding closed-form Rényi divergences) or with
    Gaussian mixture variational posteriors combined with the closed-form Hershey-Olsen Kullback-Leibler
    divergence bound.
  evidence:
  - source_id: nott-wang2020
    locator: Section 5, Examples 5.1–5.2 and Equation 21, lines 133–155
    relation: supports
