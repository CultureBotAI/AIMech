aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The prior-to-posterior divergence conflict diagnostic checks prior-data consistency across
    single-level and hierarchical Bayesian models (directed acyclic graphs of parameters and data). AIO:BayesianNetwork
    supplies the probabilistic graphical modeling context rather than an algorithmic superclass.
limitations:
- Because the asymptotic calibration P(g(theta)|I(theta)|^(-1/2) <= g(theta*)|I(theta*)|^(-1/2)) measures
  prior density relative to Jeffreys' prior |I(theta)|^(1/2) rather than Lebesgue measure, a flat proper
  prior on a bounded parameter (such as Beta(1, 1) on a Binomial proportion) can produce small divergence
  p-values near the boundary even when the prior predictive distribution is completely uniform.
- In the hierarchical level-1 check, integrating over the full hyperparameter posterior g(theta_2 | y_obs)
  rather than the partial posterior g(theta_2 | y_obs \ R_{alpha 1}(y_obs)) uses the observed discrepancy
  information twice, inflating the reference predictive scale and making the check more conservative when
  level-1 conflict is strong.
- Direct Monte Carlo evaluation requires computing posterior-to-prior divergences across M + 1 simulated
  datasets, and variational or Hershey-Olsen Gaussian mixture approximations introduce approximation error
  when the true posterior is poorly captured by the variational family.
- All 749 lines of Nott, Wang, Evans, & Englert (2020, arXiv:1611.00113v1) and all 31 pages of Nott et
  al. (2020, arXiv:1902.10393v2) were read. No author variational Bayes or MCMC code for the Missouri
  cancer or Bristol Royal Infirmary datasets was executed; constructed numerical checks in research/discovery/prior-posterior-divergence-conflict-boundaries.py
  verify analytical Normal, Beta-Binomial, Normal-Inverse-Gamma, and Hershey-Olsen mixture boundaries
  only.
