id: AIMech:PriorToPosteriorDivergenceConflictDiagnostic
name: Prior-to-posterior divergence conflict diagnostic
aliases:
- Prior-to-posterior Rényi divergence prior-data conflict check
- Relative belief prior-to-posterior divergence conflict diagnostic
concept_kind: algorithm
definition: A Bayesian prior-data conflict diagnostic algorithm that measures belief change from a proper
  prior g(theta) to the posterior g(theta | y) using the Rényi divergence R_alpha(y) of order alpha >
  0 (including Kullback-Leibler divergence at alpha = 1 and log maximum relative belief as alpha -> infinity),
  calibrates the observed divergence R_alpha(y_obs) against its reference distribution under the prior
  predictive p(y), and extends to hierarchical priors g(theta_1 | theta_2)g(theta_2) by decomposing checking
  into a marginal prior-predictive divergence test for theta_2 and a posterior-integrated (or partial-posterior)
  conditional divergence test for theta_1 | theta_2.
identity_notes: No normalized identity match for the prior-to-posterior divergence conflict diagnostic
  across all 442 pinned AIO records and 564 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only frontier-tracking references
  in prior discovery reports noting Nott, Wang, Evans, & Englert (2020) as a pending concept. Distinct
  from AIMech:PriorExpansionScoreConflictDiagnostic, which evaluates the local directional derivative
  (Fisher score) of a family of prior expansions around the baseline prior rather than the global prior-to-posterior
  Rényi divergence of a fixed prior. Distinct from AIMech:EvansMoshonovPriorDataConflictCheck (and sufficient-statistic
  prior predictive checks), which compare the prior predictive density p(t_obs) of a minimal sufficient
  statistic T rather than the sufficiency-invariant posterior-to-prior divergence R_alpha(y).
