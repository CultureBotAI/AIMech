- target: AIO:DataDredgingBias
  relation: related_match
  rationale: ADDOW and crADDOW control the false discovery rate across heterogeneous hypothesis groups
    to prevent false-positive inflation (AIO:DataDredgingBias) while adapting group weights and group
    null proportions to maximize discovery power.
limitations:
- ADDOW's FDR control and power optimality guarantees (Theorems 5.1, 5.2, and 7.1) are asymptotic as total
  hypotheses m -> infinity with fixed group number G and positive limiting group fractions pi_g > 0 (Assumption
  5.2); in finite samples with weak signal (small bar_mu), unsplit ADDOW and ADDOW-tilde can overfit empirical
  fluctuations and exceed nominal FDR alpha unless stabilized by F-fold cross-weighting (crADDOW, Section
  6.2 and Section 7).
- 'Asymptotic power optimality over all data-driven WBH and MWBH procedures in K_hat (Theorem 5.2) requires
  strictly concave alternative CDFs F_g (Assumption 5.1) and Multiplicative Estimation (ME: pi_hat_{g,0}
  -> C pi_{g,0} with a common constant C >= 1 across all groups); when group null proportion estimators
  have heterogeneous upward biases C_g != C_g'' across groups, maximizing total discoveries G_w^infty(u)
  over K^infty is no longer guaranteed to coincide with maximizing true-discovery power P_w^infty(u) (Section
  5.1, Lemma B.3).'
- For G >= 3 groups, exact optimization of the non-concave empirical step function G_hat_w(u) over K_hat
  is combinatorial, so practical multi-group computation relies on the Grenander least concave majorant
  relaxation D_tilde_g (ADDOW-tilde), which reduces each step-up evaluation to a concave program with
  piecewise-constant derivatives (Section 3.2, Section 4.3, Remark 4.1).
- All 1,118 lines of Durand (2019, Electronic Journal of Statistics 13(2):3336-3385, arXiv:1710.01094v2)
  were read. Constructed numerical checks in research/discovery/adaptive-data-driven-optimal-p-value-weighting-boundaries.py
  verify (1) Lemma A.5 and Remark 4.1/9.2 exact step-up fixed-point equivalence between MWBH(W_hat^*)
  and single-step WBH(W_hat^*(u_hat)) across 40 random 2-group instances (mismatches = 0, monotonicity
  violation = 0.0, Grenander LCM concavity violation = 0.0), (2) Lemma B.3 exact equivalence between maximizing
  G^infty_w(u) and maximizing P^infty_w(u) over K^infty under Multiplicative Estimation (max weight discrepancy
  = 0.0), Theorem 5.1 asymptotic FDR = alpha/C (0.05 for C=1.0, 0.043478 for C=1.15), and Theorem 5.2
  asymptotic power dominance of ADDOW (0.131404) over Pro1 (0.131199), HZZ (0.130514), ABH (0.127344),
  IHW (0.119278), and BH (0.117761), (3) Remark 3.1 and Section 6.4 uneven-null counterexample where size-investing
  IHW has strictly lower power than unweighted BH both asymptotically (0.20932 < 0.216218 < 0.229168)
  and in Monte Carlo (0.21465 < 0.21713 < 0.23123) while incurring higher FDR than BH (0.566215 > 0.539),
  and (4) Section 7 crADDOW 5-fold cross-weighting reducing weak-signal finite-sample FDR from 0.09417
  (> 0.05) to 0.048 (<= 0.05) while maintaining strong-signal TPR 0.63267 vs. BH 0.5775 (Theorem 7.1).
