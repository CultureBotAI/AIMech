id: AIMech:AdaptiveDataDrivenOptimalPValueWeighting
name: Adaptive data-driven optimal p-value weighting
aliases:
- ADDOW (Adaptive Data-Driven Optimal Weighting)
- Multi-Weighted Benjamini-Hochberg Procedure (MWBH)
- Cross-Weighted Adaptive Data-Driven Optimal Weighting (crADDOW)
- Concave-Majorant Adaptive Group Weighting for FDR Control
concept_kind: mathematical_method
definition: 'An adaptive grouped multiple-testing methodology (Durand 2019, Electronic Journal of Statistics
  13(2):3336-3385, arXiv:1710.01094) that generalizes the Weighted Benjamini-Hochberg (WBH) procedure
  to Multi-Weighted Benjamini-Hochberg (MWBH) with threshold-dependent weight functions W : [0, 1] ->
  [0, infinity)^G and constructs Adaptive Data-Driven Optimal Weighting (ADDOW) to simultaneously estimate
  group null proportions pi_{g,0} and group p-value cumulative distribution functions D_g via their Grenander
  least concave majorant (LCM) D_tilde_g. At each candidate rejection fraction u in {0, 1/m, ..., 1},
  ADDOW solves the constrained maximization W_hat^*(u) in argmax_{w in K_hat} G_hat_w(u) over the null-proportion-adaptive
  weight budget K_hat = {w in [0, infinity)^G : sum_{g=1}^G (m_g / m) pi_hat_{g,0} w_g <= 1}, where G_hat_w(u)
  = sum_{g=1}^G (m_g / m) D_hat_g(alpha u w_g), and rejects hypotheses with p_{g,i} <= alpha u_hat_{W_hat^*}
  W_hat^*_g(u_hat_{W_hat^*}) at the step-up threshold u_hat_{W_hat^*} = max{u in {0, 1/m, ..., 1} : G_hat_{W_hat^*}(u)
  >= u}. Under Multiplicative Estimation (ME, pi_hat_{g,0} -> C pi_{g,0} with C >= 1), ADDOW controls
  the false discovery rate asymptotically at alpha / C <= alpha (Theorem 5.1) while achieving the maximum
  asymptotic discovery power among all WBH and MWBH procedures constrained to K_hat (Theorem 5.2, Corollaries
  5.2-5.3), and admits an F-fold cross-weighted stabilization (crADDOW, Section 7, Theorem 7.1) that eliminates
  finite-sample weak-signal overfitting while preserving full asymptotic power.'
identity_notes: No normalized identity match for adaptive data-driven optimal p-value weighting, ADDOW,
  crADDOW, or Multi-Weighted Benjamini-Hochberg (MWBH) across all 442 pinned AIO records and 588 maintained
  IDs, names, aliases and scoped synonyms. Fixed-string searches across data, sources, research, history,
  and reviews returned zero matches. Distinct from AIMech:CovariatePoweredCrossWeightedMultipleTesting
  (Ignatiadis & Huber 2021, IHW), which optimizes a single static weight vector over the unadjusted simplex
  K_0 = {sum_g (m_g/m) w_g <= 1} (or within-fold sum_{i in I_ell} W_i = |I_ell|) via size-investing and
  can have strictly lower asymptotic power than unweighted BH when null hypotheses are not evenly distributed
  across groups (Remark 3.1, Section 6.4), whereas ADDOW optimizes threshold-dependent MWBH weights W_hat^*(u)
  over the null-proportion-weighted budget K_hat = {sum_g (m_g/m) pi_hat_{g,0} w_g <= 1} so that maximizing
  total rejections G_w^infty(u) is mathematically equivalent to maximizing true-discovery power P_w^infty(u)
  without requiring evenly distributed nulls (Lemma B.3, Theorem 5.2); distinct from AIMech:AdaptivePValueThresholding
  (Lei & Fithian 2018, AdaPT), which iteratively updates coordinatewise thresholds using mirror-masked
  p-values min(P_i, 1 - P_i); and distinct from AIMech:SelectivelyTraversedAccumulationRulesForStructuredFDRControl
  (Lei, Ramdas, & Fithian 2021, STAR), which enforces combinatorial structural constraints R_t in K by
  filtration peeling.
