id: AIMech:GuidedFastLocalSearch
name: Guided Fast Local Search
concept_kind: algorithm
aliases: []
definition: A local-search algorithm that combines GLS feature-penalty updates with FLS activation-bit
  search, reactivating subneighborhoods associated with newly penalized features and retaining solutions
  according to the original objective.
definition_evidence:
- source_id: voudouris1999
  locator: PDF pp. 14–16, especially Figure 2 on p. 16
  relation: supports
- source_id: voudouris2010
  locator: Sections 6.3–6.4, PDF pp. 12–13
  relation: supports
claims:
- claim_id: named-penalty-activation-controller
  kind: scope
  statement: Guided Fast Local Search is the named combined controller that repeatedly applies FLS to
    a feature-penalized objective and couples selected penalty updates to reactivation of related subneighborhoods.
  evidence:
  - source_id: voudouris1999
    locator: PDF pp. 14–16, especially Figure 2 on p. 16
    relation: supports
  - source_id: voudouris2010
    locator: Sections 6.3–6.4, PDF pp. 12–13
    relation: supports
- claim_id: initialization-and-current-objective
  kind: mechanism
  statement: Initialize a constructed candidate, set every feature penalty p_i to zero, and set every
    activation bit to one. For binary feature indicators I_i(s), search using the current augmented objective
    h(s)=g(s)+lambda*sum_i p_i I_i(s). The penalties in h are the current penalty state, not fixed at
    their initial zero values.
  evidence:
  - source_id: voudouris2010
    locator: Section 3, Equations 1–2, PDF p. 3; Section 6.3, PDF p. 12
    relation: supports
  - source_id: voudouris1999
    locator: Figure 2, PDF p. 16
    relation: supports
- claim_id: strict-active-subneighborhood-search
  kind: mechanism
  statement: Within a FLS call, scan active subneighborhoods in the configured order and accept the first
    encountered move that strictly improves the current augmented objective. Keep the successful subneighborhood
    active, activate the configured subneighborhoods affected by the accepted move, update the candidate,
    and continue to the next subneighborhood instead of restarting the complete scan. Deactivate a subneighborhood
    when its scan finds no improving move, and return when all activation bits are zero.
  evidence:
  - source_id: voudouris2010
    locator: Sections 5–6.2, PDF pp. 8–11, FLS pseudocode on p. 10
    relation: supports
  - source_id: voudouris1999
    locator: PDF pp. 14–16 and Figure 2
    relation: supports
- claim_id: utility-penalty-and-reactivation
  kind: mechanism
  statement: After FLS returns, compute feature utilities I_i(s)c_i/(1+p_i), increment every maximum-utility
    feature penalty by one, and activate the subneighborhoods returned by the feature-to-subneighborhood
    mapping before the next FLS call.
  evidence:
  - source_id: voudouris2010
    locator: Equation 3, PDF p. 3; Sections 6.3–6.4.1, PDF pp. 12–13
    relation: supports
  - source_id: voudouris1999
    locator: PDF pp. 15–16 and Figure 2
    relation: supports
- claim_id: original-objective-incumbent-and-stopping
  kind: scope
  statement: The outer procedure retains the best solution found according to the original objective g
    and stops by a supplied stopping criterion; feature/move activation mappings depend on the optimization
    problem.
  evidence:
  - source_id: voudouris2010
    locator: Sections 4.2.5–4.2.6, PDF p. 7; Sections 6.3–6.4, PDF pp. 12–13; Section 10.4, PDF pp. 25–26
    relation: supports
  - source_id: voudouris1999
    locator: Figure 2, PDF p. 16
    relation: supports
limitations:
- All inactive bits do not certify an exhaustive local minimum unless the move enumeration and reactivation
  policy establish the required coverage. Subneighborhoods may overlap, and the method can miss improvements.
- With nonnegative feature costs, a positive maximum utility selects present features, but when every
  utility is zero the printed all-maxima loop can also select absent features although the prose discusses
  present features. A boundary convention must be specified for implementation; none is silently added
  here.
- Problem-specific features, costs, move enumeration, scan order, move/feature activation callbacks, incumbent
  bookkeeping and stopping semantics are required. The mathematical objective must reflect current penalties,
  and bit changes must persist as intended across calls; pseudocode is not a language-level API specification.
- Penalty guidance is a soft objective change, not a forbidden move or a guarantee of escape. With lambda=0,
  or features constant over the relevant moves, penalties do not change those move comparisons. Strict
  inner descent does not by itself ensure the outer process terminates or finds a global optimum.
- The core FLS rule is strict improvement. Problem-specific variants such as the radio-link example allowing
  sideways moves and an extra stagnation stop should not be silently included in that core or inherit
  its conditional finite-descent argument.
- The sources motivate and report efficiency gains in selected applications, but the complete controller
  description does not establish a general runtime advantage, universal quality improvement, global convergence
  or an application-independent parameter prescription.
- The inspected evidence is the exact 1999 author manuscript and 2010 chapter layout. Their named complete
  procedure supports this scope; it does not establish earliest priority, equivalence of every later GLS/FLS
  hybrid, or exhaustion of later variants and neighboring search methods.
aio_no_match:
  search_scope: The actual 2026-10-15 post-cohort349 collection at commit f4b274e9c75703c0f3051ab630b4f090272f056a
    covers 780 maintained and 442 generated records. Four fixed-string, word-boundary searches included
    ignored and hidden files across the original checkout and three retained discovery/recovery checkouts.
    All 16608 occurrences were reconstructed into 1095 distinct contents, freshly read by two attributed
    supporting readers; root read 18 candidate-focused contents, all nine normalized definitions/21 fields
    and all 13 matching frontier objects. Normalization covered 4858 identity-field occurrences. The pinned
    AIO CLASS identities, synonyms and graph context for the nine explicitly listed examined targets were
    separately read and rejected for the maintained GFLS algorithm scope. General task/training/network/function
    abstractions and unrelated learning families do not cover its controller. No suitable target was identified
    in this inspected snapshot and semantic scope; this is not a claim about all upstream revisions.
  rationale: No informative positive AIO mapping is supported for this complete source-defined search
    controller among the nine inspected targets. The result is bounded to the pinned snapshot and selected
    semantic neighborhood.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition concerns preprocessing used to train machine-learning models.
      This general combinatorial optimization controller is not intrinsically such a training method.
  - target: AIO:MachineLearningTask
    rejection_reason: The pinned class requires methods learning from data. Updating search penalties
      and activation state for a supplied objective does not by itself establish that task identity.
  - target: AIO:ReinforcementLearning
    rejection_reason: Search guidance and exploration do not alone establish the pinned machine-learning
      task. The source defines feature penalties and selective local search, not a reinforcement-learning
      task or value/policy-learning construction.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: The candidate is not a large language model fine-tuned with rewards.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The candidate is neither a large language model nor a population-based evolutionary
      model architecture.
  - target: AIO:MarkovChain
    rejection_reason: Representing an appropriately expanded algorithm state by a stochastic process is
      a generic formalization, not evidence that this whole source-defined controller is the pinned network/model
      class.
  - target: AIO:MathematicalFunction
    rejection_reason: The pinned definition is a general mathematical input/output rule and is not scalar-only.
      The candidate is the complete configurable search controller, with objective, move, activation and
      stopping policies; generic functional describability alone does not establish an informative mapping
      to this class. Its augmented objective and utility formulas are mathematical components, not the
      whole candidate identity.
  - target: AIO:RegularizationLayer
    rejection_reason: The feature-penalty objective operates on candidate solutions in combinatorial search,
      not penalties on neural layer parameters or activity.
  - target: AIO:MetaLearning
    rejection_reason: The source does not define learning from metadata about machine-learning experiments.
