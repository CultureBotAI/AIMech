id: AIMech:LoRADrop
name: LoRA-drop
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning algorithm that evaluates the layer-wise importance of low-rank adapters using the normalized sum of squared Euclidean norms of the adapter outputs ||Delta W_i x_i||^2 over a stratified sample of task data, retains independent trainable LoRA modules for the highest-importance layers up to a cumulative importance threshold T, and replaces all remaining low-importance layers with a single shared trainable LoRA module.
identity_notes: Distinct from AdaLoRA (AIMech:AdaLoRA, which dynamically prunes singular triplets of SVD-parameterized adapters based on weight-gradient sensitivity scores without cross-layer parameter sharing), from Tied-LoRA (AIMech:TiedLoRA, which uniformly ties projection matrices across all layers with diagonal scaling vectors rather than partitioning layers by data-dependent output norms ||Delta W_i x_i||^2), and from standard LoRA (AIMech:LoRA, which trains independent untied adapters across all layers). Formulated by Zhou et al. (COLING 2025, pages 5530-5543; arXiv:2402.07721).
aliases:
- LoRA-Drop Output-Evaluated Parameter Pruning
- Output-Based LoRA Layer Pruning and Sharing
- LoRA-drop Parameter-Efficient Fine-Tuning
