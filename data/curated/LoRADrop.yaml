claims:
- claim_id: loradrop-output-norm-importance-score
  kind: mechanism
  statement: LoRA-drop performs a short warm-up update of layer-wise LoRA modules Delta W_i = B_i A_i on a stratified subset D_s of the downstream task dataset (with sampling ratio alpha in (0, 1)), computes the unnormalized output energy g_i = sum_{x in D_s} ||Delta W_i x_i||_2^2 for each layer i, and normalizes across layers to obtain the relative importance score I_i = g_i / sum_j g_j in [0, 1] satisfying sum_i I_i = 1.
  evidence:
  - source_id: r680-primary-pdf
    locator: Section 3.1 Importance Evaluation, Eq. 2-3, p. 3-4
    relation: supports
- claim_id: loradrop-threshold-retention-and-low-importance-sharing
  kind: mechanism
  statement: During task adaptation, LoRA-drop sorts layers in descending order of I_i, selects the top k layers whose cumulative importance reaches threshold T (default T = 0.9) to retain dedicated trainable LoRA parameters, and assigns a single shared trainable LoRA module to all remaining L - k low-importance layers, reducing trainable parameters from 2 L d r to 2 (k + 1) d r.
  evidence:
  - source_id: r680-primary-pdf
    locator: Section 3.2 Task Adaptation & Section 4.4 Ablation Study, Table 4-5, p. 4, 7
    relation: supports
- claim_id: loradrop-nlu-and-nlg-finetuning-application
  kind: application
  statement: LoRA-drop is applied to parameter-efficient fine-tuning of RoBERTa-base, RoBERTa-large, and Llama2-7B across GLUE natural language understanding tasks and table-to-text, dialogue summarization, and mathematical reasoning generation benchmarks, matching or exceeding standard LoRA accuracy while training approximately 50% of the LoRA parameters on average.
  evidence:
  - source_id: r680-primary-pdf
    locator: Section 4.2 Main Results, Tables 1-2 and Tables 6-7, p. 4-5, 12-13
    relation: supports
- claim_id: loradrop-coarse-layer-granularity-and-inference-cost
  kind: limitation
  statement: LoRA-drop evaluates and prunes adapters at the coarse granularity of entire layer-level LoRA modules rather than fine-grained internal rank dimensions, and requires an initial warm-up importance-evaluation stage on sampled task data without reducing forward-pass inference cost.
  evidence:
  - source_id: r680-primary-pdf
    locator: Limitations section, p. 9
    relation: supports
