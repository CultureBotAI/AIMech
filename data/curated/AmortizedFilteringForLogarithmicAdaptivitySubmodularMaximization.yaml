claims:
- claim_id: r360-claim-iterative-filtering-geometric-shrinkage-and-survival-value
  kind: mechanism
  statement: In each non-terminating round i of Filter(N, S, r) (Algorithm 2) where E_{R~U(X_i, k/r)}[f_S(R)] < (1 - epsilon)(OPT - f(S))/r, discarding all elements a with E_{R~U(X_i)}[f_{S union (R\{a})}(a)] < (1 + epsilon/2)(1 - epsilon)(OPT - f(S))/k reduces the surviving candidate pool geometrically as |X_{i+1}| < |X_i| / (1 + epsilon/2) (Lemma 3) while preserving a subset T of the optimal solution O among the surviving elements X_rho with marginal value f_S(X_rho) >= (1/r)*(1 - epsilon)*(OPT - f(S)) whenever r >= 20*rho*epsilon^{-1} (Lemmas 1-2), guaranteeing termination of Filter in at most log_{1+epsilon/2}(n) rounds (Lemma 4) and a (1 - 1/e - epsilon) approximation for Iterative-Filtering (Algorithm 1) in O(log^2 n) adaptive rounds (Theorem 1).
  evidence:
  - source_id: r360-primary-pdf
    locator: Section 2.1-2.3, Algorithms 1-2, Lemmas 1, 2, 3, and 4, and Theorem 1, pp. 4-8; Appendix C, pp. 18-20
    relation: supports
- claim_id: r360-claim-amortized-filtering-across-epochs-in-logarithmic-rounds
  kind: mechanism
  statement: Amortized-Filtering (Algorithm 3) partitions execution into at most 20/epsilon epochs during which the surviving pool X is reused across block additions T <- T union R until f_S(T) >= (epsilon/20)(OPT - f(S)) or |S union T| = k; because the solution value increases by at most (epsilon/20)(OPT - f(S_j)) within epoch j, surviving elements after rho filtering rounds satisfy f_{S_j^+}(X_rho) >= (epsilon/4)(1 - epsilon)(OPT - f(S_j)) (Lemmas 5-6), bounding the total number of filtering rounds per epoch by at most log_{1+epsilon/2}(n) (Lemma 7) and achieving a (1 - 1/e - epsilon) approximation in at most 20*epsilon^{-1}*log_{1+epsilon/2}(n) + (epsilon/20)^{-1}*log_{1+epsilon/2}(n) = O(epsilon^{-1} log n) adaptive rounds (Theorem 2).
  evidence:
  - source_id: r360-primary-pdf
    locator: Section 3.1-3.3, Algorithm 3, Lemmas 5, 6, and 7, and Theorem 2, pp. 8-10; Appendix D, pp. 20-22
    relation: supports
- claim_id: r360-claim-monte-carlo-marginal-estimation-and-parallel-opt-guessing
  kind: mechanism
  statement: In the full randomized algorithm Amortized-Filtering-Full (Algorithms 4-7), running log_{(1-epsilon/20)^{-1}}(n) parallel branches over geometric OPT guesses v_i = (1 + epsilon)^i * max_{a in N} f(a) and estimating E[f_S(R)] and E[f_{S union (R\{a})}(a)] in a single non-adaptive round via Hoeffding concentration with m = O(n*((k + log_{1+epsilon/3} n)/epsilon)^2 * log(n/delta)) uniform samples preserves geometric candidate shrinkage |X_{i+1}| < |X_i|/(1 + epsilon/3) (Lemma 10) and obtains a (1 - 1/e - epsilon) approximation with probability at least 1 - delta in O(epsilon^{-1} log_{1+epsilon/3} n) adaptive steps and O(n*log_{(1-epsilon/20)^{-1}}(n)*((k + log_{1+epsilon/3} n)/epsilon)^2 * log(n/delta)) oracle queries per round (Lemmas 8-14 and Theorem 3).
  evidence:
  - source_id: r360-primary-pdf
    locator: Section 3.3, Theorem 3, p. 10; Appendix E, Algorithms 4-7, Lemmas 8-14, and Proof of Theorem 3, pp. 23-30
    relation: supports
