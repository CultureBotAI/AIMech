id: AIMech:AmortizedFilteringForLogarithmicAdaptivitySubmodularMaximization
name: Amortized-Filtering and Iterative-Filtering for Optimal Logarithmic-Adaptivity Submodular Maximization
concept_kind: algorithm
review_status: DRAFT
definition: 'Amortized-Filtering and Iterative-Filtering for Optimal Logarithmic-Adaptivity Submodular Maximization is a parallel value-oracle algorithmic paradigm introduced by Balkanski, Rubinstein, and Singer (2018, 2019) for maximizing a monotone submodular function f : 2^N -> R_+ subject to a cardinality constraint |S| <= k in O(log n) adaptive rounds. Rather than adding single elements sequentially over k rounds, the algorithm adds blocks R ~ U(X, k/r) of size k/r in r = 20*epsilon^{-1}log_{1+epsilon/2}(n) iterations by filtering out elements a in X whose expected marginal contribution E_{R~U(X)}[f_{S union (R\{a})}(a)] falls below (1+epsilon/2)(1-epsilon)(OPT - f(S))/k while E_{R~U(X)}[f_S(R)] < (1-epsilon)(OPT - f(S))/r, and amortizes the filtering rounds across 20/epsilon epochs (each bounded by f_S(T) < (epsilon/20)(OPT - f(S))) so that at most log_{1+epsilon/2}(n) filtering steps occur per epoch, achieving the optimal (1 - 1/e - epsilon) approximation in O(epsilon^{-1}log_{1+epsilon/3} n) adaptive rounds.'
identity_notes: Distinct from AIMech:GreeDiTwoStageDistributedSubmodularMaximization (Round 359), which partitions data across MapReduce machines but runs sequential k-round greedy selection on each machine (Omega(k) adaptivity), and from AIMech:StochasticGreedyLinearTimeMonotoneSubmodularMaximization (Round 348), which reduces total oracle evaluations to O(n log(1/epsilon)) across k sequential rounds. Also distinct from AIMech:SieveStreamingAndSieveStreamingPlusPlusForSubmodularMaximization (Round 350), which is a single-pass streaming threshold algorithm achieving 1/2 - epsilon rather than a low-adaptivity parallel algorithm achieving 1 - 1/e - epsilon.
aliases:
- Balkanski-Rubinstein-Singer Amortized-Filtering Algorithm
- Iterative-Filtering and Amortized-Filtering for Low-Adaptivity Submodular Maximization
- Logarithmic-Adaptivity (1 - 1/e - epsilon) Submodular Maximization
