limitations:
- The maintained scope is a finite strictly positive normalized target and consistent complete component
  kernels. Zero-current conventions, approximate normalization and countably infinite upward ordering
  are outside this scope.
- The source calls this equal mixture UDNAM. Fixed/upward/downward NAM policies, ZDNAM completion, UDST
  and arbitrary mixtures of invariant kernels are not exact aliases for it.
- The original FHY1992 full text was not obtained. Historical attribution of the UNAM component does not
  identify every earlier estimator or truncated modification with the full UDNAM mixture.
- Original exact curator calculations support bounded identities and counterexamples. No author code,
  numerical implementation, empirical benchmark or full 84-page performance review is claimed.
