id: AIMech:UpwardDownwardNestedAntitheticMixture
name: Upward-downward nested antithetic mixture
concept_kind: algorithm
definition: A finite conditional Markov update that chooses with equal probability between complete upward
  and downward nested antithetic modification kernels for the same target distribution.
definition_evidence:
- source_id: neal2024
  locator: Section 8, PDF p. 28, explicit UDNAM equal-mixture definition
  relation: supports
claims:
- claim_id: complete-upward-and-downward-components
  kind: mechanism
  statement: Let pi be a strictly positive normalized probability mass function on a finite state space.
    Construct UNAM from a nondecreasing probability order and DNAM from a nonincreasing order. Each is
    a complete NAM construction starting with K(i,j)=pi(j). At a stage whose remaining block has K(i,j)=r*pi(j),
    let q be its focal-state mass and s the nonempty tail mass. Set delta=r*min(q/s,s/q). Increase focal-to-tail
    entries by delta*pi(j) and tail-to-focal entries by delta*q; decrease the focal diagonal by delta*s
    and tail-to-tail entries by delta*pi(j)*q/s. Previously determined entries are unchanged. Continue
    on the tail if q<s; if q>=s its block becomes zero and the construction stops. A one-state target
    already has the identity kernel. The component is not an incomplete first-stage modification.
  evidence:
  - source_id: neal2024
    locator: Section 5, PDF p. 10, Equation 19; Section 6, pp. 14–17, Equations 28–34 and Algorithm 2;
      Sections 7–8, pp. 22–29, upward/downward orders and Algorithms 3–4
    relation: supports
- claim_id: constant-half-mixture-selection
  kind: mechanism
  statement: Write U and D for the two completed component matrices. UDNAM uses M(i,j)=(U(i,j)+D(i,j))/2.
    It can sample a fresh fair component choice for each local update and then sample that component row,
    or sample directly from the averaged row. The half weights do not depend on the current state label.
    Selecting a component once for a whole chain, applying U followed by D, or using current-state-dependent
    component weights does not define this specified transition matrix. Both component ordering rules
    define all rows for the same target.
  evidence:
  - source_id: neal2024
    locator: Section 8, PDF p. 28, equal random choice and averaged transition probabilities; Section
      2, pp. 2–3, distinction between mixtures and compositions
    relation: supports
- claim_id: reversible-mixture-and-conditional-use
  kind: mechanism
  statement: Both U and D are nonnegative stochastic matrices satisfying detailed balance with pi. Their
    arithmetic average therefore has row sums one and satisfies pi(i)*M(i,j)=pi(j)*M(j,i), so it preserves
    pi. Used for a valid full conditional with other coordinates fixed, the update preserves the joint
    target. The probability ordering may change when that conditioning environment changes. Fixed mixtures
    and fixed sequential compositions of valid conditional updates preserve the joint target too; the
    local reversibility statement does not imply that a full sequential sweep is reversible.
  evidence:
  - source_id: neal2024
    locator: Sections 5–6, PDF pp. 10 and 14–20, balance-preserving antithetic construction; Section 8,
      p. 28, mixture; Section 2, pp. 2–3, Equations 1–4 and composition
    relation: supports
- claim_id: downward-tie-policy
  kind: scope
  statement: UNAM is unchanged by permutations within equal-probability groups, whereas DNAM can depend
    on its tie order. UDNAM inherits this dependence and requires a stated consistent downward tie policy.
    For pi=(1,3,3,5)/12, the original exact calculations use upward orders (1,2,3,4) and (1,3,2,4), with
    corresponding downward orders (4,3,2,1) and (4,2,3,1), in one-based labels. The UNAM kernel is unchanged,
    but the UDNAM diagonals are respectively (0,1/42,0,5/44) and (0,0,1/42,5/44). Both mixtures remain
    reversible. Unlike the paired-tower mixture, UDNAM does not need its two component orders to be exact
    reversals for reversibility, because each component is already reversible.
  evidence:
  - source_id: neal2024
    locator: Section 7, PDF p. 24, Equation 75 and tie invariance; Section 8, pp. 28–29, tie discussion
      and Figure 6(a); original exact tie comparison in research/discovery/mixture-boundaries.py
    relation: supports
- claim_id: distinct-mixture-and-self-mass
  kind: scope
  statement: 'The equal mixture is not generally one NAM focal ordering. At pi=(4,3,2)/9, its diagonal
    is (5/56,1/30,0), with two positive entries, whereas a complete single-order NAM construction has
    at most one. Original exact calculations confirm the difference for all six focal permutations on
    this target, retaining duplicate resulting matrices in that enumeration. UDNAM also need not minimize
    self transitions: this target has no mass exceeding one half, yet its mixture has positive stationary
    self mass. Agreement with UNAM, DNAM or other samplers on special targets does not identify the full
    constructions.'
  evidence:
  - source_id: neal2024
    locator: Section 6, PDF pp. 14–20, completed NAM diagonal structure; Section 8, pp. 28–30, mixture
      and ordering limits; Section 13, pp. 49–51, simple-target comparisons; original six-order calculation
      in research/discovery/mixture-boundaries.py
    relation: supports
- claim_id: invariance-is-not-convergence
  kind: limitation
  statement: For a uniform binary target, both components and their mixture flip the state deterministically.
    For two independent uniform binary coordinates, a fixed full scan maps (a,b) to (1-a,1-b), so it has
    two closed classes even though the joint uniform target is invariant. Thus a reversible local mixture
    and reduced self transitions do not establish aperiodicity, joint exploration or convergence from
    every initial state. The source discusses efficiency comparisons under additional assumptions; this
    record makes no general variance, spectral-efficiency, burn-in, finite-run accuracy or runtime claim.
  evidence:
  - source_id: neal2024
    locator: Section 5, PDF pp. 13–14 and footnotes 7–8, scan boundaries; Section 8, p. 28, scoped efficiency
      discussion; Section 13, p. 49, uniform-target behavior; original scan checks in research/discovery/mixture-boundaries.py
    relation: supports
identity_notes: The actual post317 assessment covers all 442 pinned AIO and 710 native IDs, names, aliases
  and every scoped synonym, plus four complete checkout searches including ignored and hidden files. Historical
  706-native source research, 334 selected ID/name rows, 103 selected definitions, 59 additional mixture
  definitions, 22 exact AIO node/incident/generated contexts and 18 full native neighbors retain their
  attributed reading scope. The four actual FSS/ZFSS and NAM/ZDNAM records are freshly assessed. AIO:MarkovChain
  is related_match between a transition construction and a stochastic process; no equivalent or subclass
  mapping or neural-layer inheritance is asserted. No aliases adopted. UDNAM is a constant equal choice
  between complete upward and downward NAM kernels, with consistent independently selected valid tie policies.
  A mixture is not a single supplied-order NAM modification, sequential U-then-D composition or state-dependent
  component selection. The finite (4,3,2)/9 two-positive-diagonal witness excludes every single NAM ordering.
  UNAM tie invariance and DNAM tie sensitivity are distinguished. Shared local reversible kernels or special
  cases with other samplers do not establish identity.
