claims:
- claim_id: r653-claim-linear-rank-parameter-scaling-and-seed-storage
  kind: mechanism
  statement: "Because the frozen Kaiming-initialized matrices B in R^{m x r} and A in R^{r x n} are shared across all adapted layers and reconstructed deterministically from a single RNG seed, VeRA's stored checkpoint footprint consists solely of the RNG seed and the trainable vectors b and d, totaling |Theta| = L_{tuned} (d_{model} + r) parameters\u2014which grows by only L_{tuned} per unit increase in rank r compared to 2 L_{tuned} d_{model} for LoRA."
  evidence:
  - source_id: r653-primary-pdf
    locator: Section 3.2 (Parameter Count), Table 1, p. 4
    relation: supports
- claim_id: r653-claim-kaiming-and-scaling-vector-initialization
  kind: mechanism
  statement: VeRA initializes the shared frozen matrices A and B with Kaiming initialization so that the variance of B A remains invariant across ranks r without retuning the learning rate per rank, initializes b = 0 so the initial forward pass h = W_0 x is exact, and initializes d = d_{init} * 1 (e.g., d_{init} = 0.1) so that b receives non-zero gradients on the first backward pass and both scaling vectors jointly modulate rows and columns of B and A.
  evidence:
  - source_id: r653-primary-pdf
    locator: Section 3.3 (Initialization Strategies), p. 4; Section 4.6 (Ablation Study), Table 6, p. 8-9
    relation: supports
- claim_id: r653-claim-glue-e2e-llama-vit-applications
  kind: application
  statement: VeRA matches or exceeds LoRA's performance on GLUE (RoBERTa-base/large), E2E natural language generation (GPT-2 Medium/Large), Vision Transformer image classification (ViT-B/L on CIFAR-100, Food101, Flowers102, RESISC45), and LLaMA-1/2 7B and 13B instruction tuning on MT-Bench while using 10x to 100x fewer trainable parameters and 7.4% less GPU training memory.
  evidence:
  - source_id: r653-primary-pdf
    locator: Section 4.1-4.4, Tables 2-5, p. 5-8; Appendix C, Table 12, p. 16
    relation: supports
- claim_id: r653-claim-higher-rank-and-d-init-sensitivity-limitation
  kind: limitation
  statement: Because A and B are random and frozen, VeRA typically requires a much larger internal rank r (e.g., r = 256 or 1024 vs. r = 8 or 16 in LoRA) and a ~10x higher learning rate on the scaling vectors, and its downstream accuracy degrades sharply if the initial scaling constant d_{init} is set too large (e.g., d_{init} = 1.0 vs. 10^{-1} or 10^{-7}) or if either scaling vector b or d is omitted.
  evidence:
  - source_id: r653-primary-pdf
    locator: Section 4.6 (Ablation Study), Table 6(a)-(c), p. 8-9; Appendix A, Tables 8-11, p. 14-15
    relation: supports
