aio_mappings:
- target: AIO:MathematicalFunction
  relation: broad_match
  rationale: The local concept is the precisely defined function (G,i) -> pi_i/sum_t((P^t)_ii-pi_i) on
    its stated graph domain. AIO MathematicalFunction is broader and defines a rule assigning a dependent
    value to specified independent variables. This record denotes the scoring functional rather than a
    particular numerical solver.
- target: AIO:MarkovChain
  relation: related_match
  rationale: The score is constructed from stationary and return probabilities of the specified Markov
    walk. The AIO target denotes the stochastic process/model; the local scalar centrality is a property
    of that process, not an equivalent process or subclass network. The target’s Network parent and probabilistic-hidden-layer
    relationship are retained as ontology context, not asserted as properties of this score.
limitations:
- The maintained scope is the original unweighted undirected non-bipartite walk. The source’s symmetric-weight
  extension is noted but not adopted here; directed and interacting-walker extensions remain outside scope.
- Global return dynamics are required; degree alone and a single spectral relaxation scale do not determine
  the score in general.
- The exact statement concerns mean passage times. Early-visit ranking and transport interpretations do
  not provide a universal arrival-probability, causal or predictive guarantee.
- The arXiv v2 watermark/version history says March 2004, while the inspected PDF prints November 2024
  and has five pages versus four in its metadata. The mismatch remains unresolved; no publisher-byte equivalence
  is claimed.
- Finite curator matrix checks are mathematical examples, not author software, raw simulation replication
  or a new general proof. DRAFT remains.
