name: Persistent contrastive divergence
definition: A learning algorithm that estimates an energy model’s negative-phase statistics with Markov
  chains whose states persist across parameter updates, rather than restarting those chains at the current
  data minibatch.
concept_kind: algorithm
identity_notes: This is persistent contrastive divergence as presented for RBMs by Tieleman. Persistence
  refers to the fantasy-particle sampling state across learning updates, not continual-learning tasks
  or recurrent sequence-model state. It is an instance of persistent-chain stochastic-approximation learning,
  not the original data-restarted CD-k rule. Fast PCD adds temporary sampling parameters and remains a
  separate variant. All 442 pinned AIO labels/scoped synonyms and 370 preceding native IDs/names/aliases
  were compared, with no normalized identity match. Fixed-string searches included ignored and hidden
  files throughout both worktree and main, returning 29 lines each; all 22 unique matched contents were
  read. Hits described CD as a training component, a pending lead or a boundary from CD-PercLoss, not
  an existing candidate record. All 61 semantic label/synonym hits, 21 exact annotated AIO nodes with
  outgoing edges, corresponding generated records and four native neighbors were inspected. Previously
  fully read contextual files were verified byte-identical. Absence is bounded to this snapshot and inspected
  neighborhood.
limitations:
- Finite transitions, correlated particles and changing parameters can leave negative statistics biased
  for the current equilibrium expectation. The small-learning-rate justification depends on mixing relative
  to parameter drift; it is not a guarantee at every finite step size.
- A persistent chain is neither an independent model sample at each iteration nor a proof of rapid mixing.
  The original paper discusses difficulties when strong dependencies or large weights slow exploration,
  and the regularization and learning-rate schedule affect behavior.
- Exact positive-phase inference is available for the binary RBM formulation inspected here; that property
  does not transfer automatically to models with interacting latent variables. The paper also examines
  fully visible MRFs with different update costs and sampling structure.
- The fixed-R contrastive expression is an instantaneous derivative description. Particle evolution and
  parameter adaptation remain coupled; the ordinary data-restarted contrastive-divergence objective does
  not describe that entire process.
- The retained particles and one-step experimental choice do not imply that conditional models with changing
  conditioning inputs have the same tracking problem as an unconditional RBM. No universal superiority,
  global convergence or author-code behavior is certified.
