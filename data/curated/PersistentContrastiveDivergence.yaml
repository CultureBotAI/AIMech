claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a collection of fantasy-particle configurations independently of which data minibatch
    is currently presented. Compute positive-phase sufficient statistics from that minibatch, using exact
    hidden conditional expectations for an RBM. Advance the existing fantasy particles by a small number
    of Gibbs transitions under the current model parameters and estimate negative-phase statistics from
    those particles. Update the model parameters from the positive-minus-negative difference and retain
    the particle states for subsequent iterations. The 2008 experiments use one full Gibbs step per update,
    one particle per minibatch member and no chain resets; those are specified experimental choices, while
    persistence is the defining distinction. If the chain distribution tracks the current equilibrium
    sufficiently closely, its negative statistics approximate those of the model. For fixed particle-distribution
    R, the instantaneous update can be expressed as the negative derivative of KL(q_data||p_theta)-KL(R||p_theta),
    with R held fixed; this does not make the whole coupled adaptive process descent on one fixed objective.
