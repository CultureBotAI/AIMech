name: AdamNC
definition: An Adam-family optimization method that uses time-dependent first- and second-moment decay
  schedules.
identity_notes: AdamNC changes the moment schedules rather than taking AMSGrad's historical maximum. The
  named method is distinct from an arbitrary claim that any changing Adam hyperparameters ensures convergence.
limitations:
- The paper's guarantees require additional conditions on schedules, gradients and the feasible region;
  no guarantee is asserted for arbitrary schedules or nonconvex training.
- No performance comparison or experimental replication is curated.
