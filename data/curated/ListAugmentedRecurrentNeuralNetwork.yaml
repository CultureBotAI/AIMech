limitations:
- Soft action mixtures need not preserve a discrete list or head interpretation; exact nonlinear propagation
  of an ensemble is not asserted.
- The paper ideal memory and the curator finite-window example are distinguished. No particular list capacity,
  sentinel, allocator or implementation is certified.
- Stack-RNN historical code is evidence about a different memory topology, not an inspected List RNN implementation.
- All nine primary conference-paper pages were read; no supplement, List RNN source execution, training,
  backward audit or empirical replication was performed.
- Published capacities, task settings, sequence lengths and tuning limit the evaluation claims. No universal
  algorithm-learning or unlimited exact-memory guarantee follows.
