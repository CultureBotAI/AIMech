name: GSAT averaging-in strategy
definition: A GSAT restart-initialization strategy that reuses agreements between earlier complete assignments,
  randomizes their differing positions, and periodically resets to a fresh random start.
concept_kind: algorithm
identity_notes: 'This is Strategy II, Averaging in, in the 1993 GSAT extensions paper. The word averaging
  denotes Boolean agreement preservation and random filling of disagreements, not arithmetic averaging
  into fractional truth values. It reuses selected earlier near-solutions in a sequence of GSAT attempts;
  it is not a full genetic algorithm with population selection, crossover and mutation, although the authors
  note related features. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 319 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 11 and 11 lines respectively. All eleven unique lines
  were inspected, and the sorted checkout hit sets were identical: source-title references and saved review/ledger
  frontier leads, not existing candidate records. Eight exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- 'The first two attempts use a different recurrence from later attempts: initial2 combines initial1 with
  best1, while initiali for i>=3 combines the two preceding best assignments. Substituting terminal states
  for best states, or using the same pair rule from the first attempt onward, changes the specification.'
- The pseudocode explicitly performs the first two attempts before its i=3 loop. An implementation must
  declare RESET-TRIES and budget boundary conventions, including a budget too small to complete that prefix,
  rather than silently infer arbitrary one-attempt behavior.
- The inspected source says discrepant positions receive random truth values but does not fully specify
  joint random-number coupling or tied-best-assignment retention. No particular implementation of those
  boundaries is certified here.
- Assignment reuse can concentrate starts and does not prove faster convergence, eventual SAT success
  or an UNSAT result on failure. The reported reset settings are empirical choices, not universal constants;
  no numerical benchmark claim is curated.
id: AIMech:GSATAveragingIn
