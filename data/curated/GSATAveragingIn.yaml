claims:
- claim_id: method
  kind: mechanism
  statement: Within a reset block, start the first GSAT attempt from a random complete assignment and
    retain the best assignment encountered, defined by the fewest unsatisfied clauses. Form the second
    attempt’s initial assignment by averaging the first initial assignment with that first best assignment.
    For attempt i from 3 through RESET-TRIES, average the best assignments from attempts i−1 and i−2 to
    obtain its initial assignment, run the GSAT inner loop, and retain its best assignment. Averaging
    preserves a bit when both inputs agree and randomly assigns a truth value when they disagree. After
    the reset block, begin again from a fresh random assignment. The source motivates periodic resets
    because reused starts and best assignments can become similar; no diversity guarantee follows from
    the operation alone.
  evidence:
