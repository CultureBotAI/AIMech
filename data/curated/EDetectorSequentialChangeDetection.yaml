id: AIMech:EDetectorSequentialChangeDetection
name: E-detector nonparametric sequential change detection
aliases:
- E-Detector
- P-e-detector
- Shiryaev-Roberts E-Detector (e-SR)
- CUSUM E-Detector (e-CUSUM)
- Adaptive Mixture E-Detector
concept_kind: mathematical_method
definition: 'A nonparametric, nonasymptotic sequential changepoint detection framework (Shin, Ramdas,
  & Rinaldo 2024) defined with respect to a composite pre-change class of distributions P over possibly
  dependent, non-stationary data streams by any nonnegative adapted process M = {M_n}_{n>=0} satisfying
  E_{P,infinity}[M_tau] <= E_{P,infinity}[tau] for all P in P and all stopping times tau (Definition 2.2),
  constructed by summing (Shiryaev-Roberts e-detector M_n^SR = sum_{j=1}^n Lambda_n^(j)) or maximizing
  (CUSUM e-detector M_n^CU = max_{1<=j<=n} Lambda_n^(j)) sequential e_j-processes Lambda^(j) started at
  consecutive candidate changepoints j >= 1 (Definitions 2.5–2.6), so that declaring a changepoint at
  N^* = inf{n >= 1 : M_n >= 1/alpha} provably controls the nonasymptotic Average Run Length (ARL) at E_{P,infinity}[N^*]
  >= 1/alpha for any alpha in (0, 1) without i.i.d. or parametric likelihood assumptions (Theorem 2.4).'
identity_notes: No normalized identity match for E-detector nonparametric sequential change detection
  across all 442 pinned AIO records and 573 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 178 discovery
  artifacts where Shin, Ramdas, & Rinaldo (2022/2024, arXiv:2203.03532) was queued as a pending frontier
  lead. Distinct from AIMech:UniversalInferenceSplitLikelihoodRatioTest (Wasserman, Ramdas, & Balakrishnan
  2020), AIMech:EValueCalibrationAndMerging (Vovk & Wang 2021), and AIMech:EValueBenjaminiHochbergProcedure
  (Wang & Ramdas 2022), which address fixed-sample or anytime-valid null hypothesis testing and multiple
  testing rather than sequential changepoint detection with nonasymptotic Average Run Length (ARL) control
  E_{P,infinity}[N^*] >= 1/alpha and worst-case Lorden/Pollak post-change detection delay bounds.
