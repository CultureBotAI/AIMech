- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Because e-detectors satisfy E_{P,infinity}[M_tau] <= E_{P,infinity}[tau] across all stopping
    times tau under composite pre-change classes, they allow continuous online monitoring and adaptive
    stopping while guaranteeing nonasymptotic false-alarm rate (FAR <= alpha) and ARL >= 1/alpha without
    false-positive inflation from sequential peeking (AIO:DataDredgingBias).
limitations:
- Using the universal threshold c_alpha = 1/alpha for e-CUSUM can be highly conservative compared to e-SR
  (under trivial e-processes Lambda_n^(j) = 1, M_n^SR = n reaches 1/alpha at ceil(1/alpha) whereas M_n^CU
  = 1 never stops for alpha < 1), and computing a tighter non-universal threshold c_alpha < 1/alpha requires
  known parametric pre-change distributions or historical simulation data that are unavailable in general
  non-stationary composite settings (Section 2.5 and Remark 2.13).
- Replacing a probability mixture of baseline e-detectors int M_n(lambda) d W(lambda) by an unpenalized
  supremum sup_{lambda in [lambda_L, lambda_U]} M_n(lambda) violates the e-detector optional-stopping
  inequality E_{P,infinity}[M_tau] <= E_{P,infinity}[tau] and fails ARL control (Remark 3.1), while no-separation
  adaptive infinite mixtures (Algorithm 2) require O(m log_eta n) active baseline processes at time n
  rather than O(1) memory (Section 4.2).
- General e-detectors built from non-supermartingale e_j-processes (such as universal inference split/running-MLE
  e-processes for log-concavity) that do not factor through a common 1-step baseline increment L_n require
  O(n) updates at step n, and directional nonparametric tests (e.g., homogeneity -> non-homogeneity, independence
  -> dependence, or log-concavity -> non-log-concavity) cannot simply swap P and Q because the reverse
  composite null admits no nontrivial test supermartingale (Remark 2.10, Section 2.6 Examples 3–6, and
  Section 6.3).
- All 1,104 lines of Shin, Ramdas, & Rinaldo (2024, arXiv:2203.03532) were read. Constructed numerical
  checks in research/discovery/edetector-sequential-change-detection-boundaries.py verify Theorem 2.4
  non-stationary ARL control and baseline recursions, Section 3.1 adaptive infinite-mixture recursions
  and Proposition 3.3 telescoping identity, Proposition 4.2 convex-conjugate KL identity and Section 5.2
  bounded-mean betting vs. sub-exponential dominance, and Section 6.2 e-SR vs. Generalized Lorden delay
  and Remark 3.1 supremum invalidity.
