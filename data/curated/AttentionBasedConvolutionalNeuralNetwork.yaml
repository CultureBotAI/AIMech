limitations:
- This record denotes Yin and colleagues’ named sentence-pair ABCNN, not every attention-based CNN. Its
  three numbered variants are not interchangeable aliases.
- Printed attention-matrix shapes and pooling-index notation are interpreted using the declared feature
  dimensions and window width. No author implementation was inspected to settle edge conventions.
- Training stages, feature augmentation, task-specific splits and non-significant comparisons limit empirical
  conclusions; attention visualization is not causal validation.
- All fourteen pages of arXiv1512.05193v4 were visually read, including figures, tables, footnotes and
  references. No author code, training, benchmark replication or other source version was inspected. DRAFT
  remains.
