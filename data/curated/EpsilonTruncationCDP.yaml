id: AIMech:EpsilonTruncationCDP
name: Epsilon-truncation for Conditional Distribution Prediction
aliases:
- CDP epsilon-truncation
concept_kind: algorithm
definition: A modification of conditional distribution prediction for IDA* tree size that removes conditional
  child-type probabilities below a calibrated level-specific cutoff, renormalizes the surviving probabilities
  and uses the modified tables in node-count propagation.
identity_notes: Compared all 442 pinned AIO and 639 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 5, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 66 AIO and 345 native definitions, with every matched definition
  read. 12 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. Retain
  the named CDP probability-table modification and calibrated per-level cutoff method. It changes an estimator,
  not the actual IDA* search tree or solution policy. Original CDP, lookup-based reuse, IDA*IM threshold
  control, score-margin sequence beam pruning and pruned topic-model Gibbs transitions have distinct targets.
  Generic epsilon-truncation outside this search-estimation context is not asserted equivalent.
definition_evidence:
- source_id: lelis2013prediction
  locator: Section 5.2, PDF pp. 10–11 / printed pp. 61–62
  relation: supports
claims:
- claim_id: level-specific-table-modification
  kind: mechanism
  statement: For each prediction level and parent type, set conditional child-type probabilities strictly
    below the chosen cutoff to zero and divide the retained probabilities by their positive sum. Probabilities
    equal to the cutoff are retained. The source lowers a proposed cutoff if it would remove an entire
    conditional row. The resulting normalized table replaces the original table at that level of CDP count
    propagation; it does not prune nodes from an actual IDA* execution.
  evidence:
  - source_id: lelis2013prediction
    locator: Section 5.2, PDF pp. 10–11 / printed pp. 61–62
    relation: supports
- claim_id: offline-cutoff-calibration
  kind: mechanism
  statement: The source estimates transition and branching statistics, then obtains per-level cutoff candidates
    using sampled start states and a supertype allocation procedure that groups related parent-child contexts.
    It looks for a prefix of small probability values that are set to zero in at least half of the sampled
    allocation solutions, then guards against empty retained rows. This offline approximation replaces
    solving an allocation problem during every prediction. The cutoff depends on the sampled contexts
    and depth; it is not a universal constant or a guarantee of optimal true expansion counts.
  evidence:
  - source_id: lelis2013prediction
    locator: Sections 5–5.2, PDF pp. 8–11 / printed pp. 59–62, Procedures P1 and P2 and Figure 5
    relation: supports
- claim_id: printed-calibration-boundaries
  kind: limitation
  statement: The printed calibration objectives use p^j(1-p)^(N-j) as the probability of an exact count
    j, omitting the binomial multiplicity required for N independent Bernoulli trials. The supertype count
    in Equation 4 also sums over parent-child pairs, whereas the preceding transition formula sums distinct
    parent types; a parent with multiple child types in the same group can be counted repeatedly under
    that literal reading. The record therefore describes the practical cutoff construction without certifying
    those printed formulas as an exact expected-error optimization or equivalent recurrence. These observations
    do not establish what uninspected author code computes.
  evidence:
  - source_id: lelis2013prediction
    locator: Sections 5–5.2, PDF pp. 8–10 / printed pp. 59–61, Equations 3–6 and definitions of pr and
      supertype counts
    relation: supports
- claim_id: aggregation-and-accuracy-limits
  kind: limitation
  statement: 'The method addresses errors that can arise when CDP propagates fractional expected counts
    through aggregated types, including settings where a more detailed type system predicts less accurately.
    Removing rare transitions is nevertheless an approximation: a rare child type can have a large descendant
    subtree, and truncation can worsen a previously exact count. The source reports degradations in some
    error metrics and explicitly does not guarantee unbiased predictions. Accurate global conditional
    probabilities alone do not ensure accurate counts for every start.'
  evidence:
  - source_id: lelis2013prediction
    locator: Sections 4–6, PDF pp. 6–16 / printed pp. 57–67, especially Tables 2–11; Section 11, PDF p.
      23 / printed p. 74
    relation: supports
- claim_id: finite-evaluation-and-amortization
  kind: limitation
  statement: Evidence comes from configured sliding-tile, pancake and Rubik’s Cube experiments with selected
    heuristics, type systems, start sets and shallow-search radii. The paper separates aggregate prediction
    ratios, mean absolute relative error and root-mean-square relative error; these can rank settings
    differently. Sampling and cutoff calibration can be costly and are assumed amortized across predictions.
    Lookup CDP is a separate computational-reuse method; retaining identical predictions requires the
    same model and depth-dependent table context, not merely reusing a type label under a changed schedule.
  evidence:
  - source_id: lelis2013prediction
    locator: Sections 6–7 and 10–11, PDF pp. 11–17 and 20–23 / printed pp. 62–68 and 71–74; Tables 6–17
    relation: supports
