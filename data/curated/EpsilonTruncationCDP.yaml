  rationale: The method truncates and renormalizes the conditional transition law on CDP type contexts,
    potentially using a different law at each prediction level. This is a curator-inferred component relationship.
    Branching-count propagation and threshold pruning are not probability-preserving chain evolution,
    and compressed contexts need not make the actual search process Markov. The procedure is not asserted
    equivalent to or a subclass of the pinned network class.
limitations:
- This identity is the scoped CDP epsilon-truncation method. It is not generic numerical truncation, beam
  pruning, a cutoff in the actual IDA* search, lookup caching or an asserted exact new search algorithm.
- Each retained conditional row must have positive total mass. Equality follows the source’s retention
  rule; a cutoff that empties a row cannot be normalized.
- The printed count-probability and supertype aggregation formulas require the stated qualifications.
  No correction to author software is inferred, and neither the calibration objective nor heuristic cutoff
  is certified as an optimum of true expansion-count error.
- Finite empirical improvements do not establish unbiasedness, per-start accuracy, universal speedup or
  immunity to rare types with large subtrees. Absolute-depth-varying schedules must be preserved in any
  cached recurrence state.
- All 25 pages of the author-hosted journal personal copy were visually read. Earlier conference versions,
  author software and benchmark replication were not inspected or executed. Constructed rational examples
  test mathematical boundaries only.
