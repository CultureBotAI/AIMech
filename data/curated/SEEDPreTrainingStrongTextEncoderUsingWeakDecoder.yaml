claims:
- claim_id: seed-cls-bottleneck-and-weak-decoder-span
  kind: mechanism
  statement: "SEED-Encoder disconnects cross-attention to non-[CLS] encoder token representations so that the decoder accesses the encoder exclusively through the dense [CLS] vector, and weakens the autoregressive decoder Along two axes\u2014shallow depth (e.g., 1 to 3 layers) and restricted local attention span k (where position i only attends to the encoder [CLS] vector and local tokens i-k+1..i)\u2014so the decoder cannot rely on long-range causal language modeling and must extract global passage semantics from the [CLS] vector."
  evidence:
  - source_id: r760-primary-pdf
    locator: Section 3.2 Pre-training with a Weak Decoder, Figure 1, pp. 3-4
    relation: supports
  - source_id: r760-primary-pdf
    locator: main() verification of restricted_attention_mask(seq_len, span_k=3) and amplification of gradient w.r.t. encoder [CLS] summary c_cls
    relation: supports
- claim_id: seed-ablation-of-decoder-strength
  kind: mechanism
  statement: Ablation studies across decoder depth and attention span k (Table 4) demonstrate that overly strong decoders (unlimited attention span k = All or deeper 6-layer decoders) degrade downstream dense retrieval accuracy because the decoder solves autoregressive next-token prediction from local/causal context without forcing information through the encoder [CLS] bottleneck, whereas a 3-layer decoder with restricted span k = 2 or 3 maximizes retrieval MRR and Recall.
  evidence:
  - source_id: r760-primary-pdf
    locator: Section 4.3 Ablation Study, Table 4, pp. 6-7
    relation: supports
- claim_id: seed-dense-retrieval-applications
  kind: application
  statement: Pre-training with SEED-Encoder improves dense retrieval across both in-batch negative training and ANCE hard-negative training on MS MARCO Passage Ranking, MS MARCO Document Ranking, and Natural Questions (Tables 1-3).
  evidence:
  - source_id: r760-primary-pdf
    locator: Section 4.2 Main Results, Tables 1-3, pp. 5-6
    relation: supports
  - source_id: r760-metadata-cr
    locator: BibTeX citation record for arXiv:2102.09206 (EMNLP 2021)
    relation: supports
- claim_id: seed-span-tuning-limitation
  kind: limitation
  statement: Setting the decoder attention span too small (k = 1, degenerating toward bag-of-words prediction) or too large (k = All, full causal attention) hurts downstream dense retrieval performance (Table 4), requiring careful tuning of decoder capacity relative to encoder size.
  evidence:
  - source_id: r760-primary-pdf
    locator: Section 4.3 Ablation Study, Table 4, pp. 6-7
    relation: supports
