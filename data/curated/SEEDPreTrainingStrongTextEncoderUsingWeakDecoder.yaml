id: AIMech:SEEDPreTrainingStrongTextEncoderUsingWeakDecoder
name: SEED Pre-Training a Strong Text Encoder Using a Weak Decoder
concept_kind: architecture
review_status: DRAFT
definition: "A representation-bottleneck encoder-decoder pre-training architecture for dense text retrieval (SEED-Encoder) that encodes a masked input passage with a deep bidirectional Transformer encoder (trained with masked language modeling) into a single dense [CLS] representation vector and feeds only that [CLS] vector\u2014blocking all non-[CLS] token representations from the encoder\u2014to a structurally weakened autoregressive Transformer decoder (few layers and a restricted local self-attention span k where decoding step i can attend only to the encoder [CLS] vector and at most the preceding k local tokens i-k+1..i) to reconstruct the original uncorrupted document, thereby forcing global semantic information into the encoder [CLS] embedding before discarding the weak decoder for dense retrieval fine-tuning."
identity_notes: Distinct from Condenser (AIMech:CondenserPreTrainingArchitectureForDenseRetrieval), which uses a bidirectional MLM head with late-to-early skip connections rather than an autoregressive decoder with restricted local attention span k; distinct from RetroMAE (AIMech:RetroMAERetrievalOrientedMaskedAutoEncoder) and SimLM (AIMech:SimLMRepresentationBottleneckPreTraining), which use shallow bidirectional decoders with masked or generator-replaced tokens rather than causal autoregressive decoding with restricted attention span k; and distinct from standard BART/T5 seq2seq pre-training, which passes all encoder token embeddings via cross-attention and uses a strong full-span decoder.
aliases:
- SEED-Encoder
- SEED Weak-Decoder Pre-Training for Dense Retrieval
- Pre-Training a Strong Text Encoder for Dense Retrieval Using a Weak Decoder
