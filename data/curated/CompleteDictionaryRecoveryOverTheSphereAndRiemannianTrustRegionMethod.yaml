claims:
- claim_id: claim-three-zone-hemisphere-landscape-without-spurious-local-minima
  kind: mechanism
  statement: "Covering $\\mathbb{S}^{n-1}$ by $2n$ overlapping spherical caps $S_{\\pm}^{(i)} = \\{q\\in\\mathbb{S}^{n-1} : q_i^2 \\ge \\frac{1}{4n}\\}$ parameterized by $q(w) = (w, \\sqrt{1 - \\|w\\|^2})\\in\\mathbb{R}^{n-1}\\times\\mathbb{R}$, Theorem 2.1 and Propositions 2.5\u20132.7 prove that with high probability when $\\theta\\in (0,1/3)$, $\\mu \\le c_a\\min(\\theta, 1/\\sqrt{n})$, and $p \\ge C n^2\\log^2 n/(\\mu^2\\theta)$, the pullback $g(w) = f(q(w); X_0)$ on every cap satisfies: (i) $\\nabla^2 g(w) \\succeq \\frac{c_*\\theta}{\\mu} I$ on $R_1 = \\{\\|w\\| \\le \\frac{\\mu}{4\\sqrt{2}}\\}$ with a unique local minimizer $w_*$ obeying $\\|w_*\\| \\le C\\frac{\\mu}{\\theta}\\sqrt{\\frac{n\\log p}{p}}$ (Lemma 2.3), (ii) $\\frac{w^\\top \\nabla g(w)}{\\|w\\|} \\ge c_*\\theta$ on $R_2 = \\{\\frac{\\mu}{4\\sqrt{2}} \\le \\|w\\| \\le \\frac{1}{20\\sqrt{5}}\\}$, and (iii) $\\frac{w^\\top \\nabla^2 g(w) w}{\\|w\\|^2} \\le -c_*\\theta$ on $R_3 = \\{\\frac{1}{20\\sqrt{5}} \\le \\|w\\| \\le \\sqrt{\\frac{4n-1}{4n}}\\}$, proving that $f(q;X_0)$ has no spurious local minima anywhere on $\\mathbb{S}^{n-1}$."
  evidence:
  - source_id: sqw2017-dictsphere-pdf
    locator: Section 1.3-1.4, Equations (1.4)-(1.7), pp. 4-6; Section 2.1-2.3, Theorem 2.1, Lemma 2.3, & Propositions 2.5-2.7, pp. 7-15
    relation: supports
  - source_id: sqw2017-dictsphere-abs
    locator: Abstract
    relation: supports
- claim_id: claim-riemannian-trust-region-over-the-sphere-and-quadratic-local-convergence
  kind: mechanism
  statement: "Equipping $\\mathbb{S}^{n-1}$ with tangent space $T_q\\mathbb{S}^{n-1} = \\{\\delta : q^\\top\\delta = 0\\}$, exponential-map retraction $R_q(\\delta) = q\\cos\\|\\delta\\| + \\frac{\\delta}{\\|\\delta\\|}\\sin\\|\\delta\\|$ (Equation 3.4), Riemannian gradient $\\mathrm{grad}\\,f(q) = P_{T_q\\mathbb{S}^{n-1}}\\nabla f(q)$, and Riemannian Hessian $\\mathrm{Hess}\\,f(q) = P_{T_q\\mathbb{S}^{n-1}}(\\nabla^2 f(q) - \\langle q,\\nabla f(q)\\rangle I)P_{T_q\\mathbb{S}^{n-1}}$ (Equations 3.14\u20133.15), the Riemannian Trust-Region algorithm solves the quadratic subproblem $\\min_{\\delta\\in T_q\\mathbb{S}^{n-1}, \\|\\delta\\|\\le\\Delta} f(q) + \\langle\\mathrm{grad}\\,f(q),\\delta\\rangle + \\frac{1}{2}\\langle\\mathrm{Hess}\\,f(q)[\\delta],\\delta\\rangle$ (Equation 3.8); Theorem 3.1 proves global polynomial-time convergence from an arbitrary spherical initialization to $R_1$ followed by quadratic convergence $\\|q^{(k+1)} - q_*\\|_2 \\le C\\|q^{(k)} - q_*\\|_2^2$ inside $R_1$."
  evidence:
  - source_id: sqw2017-dictsphere-pdf
    locator: Section 3.1-3.3, Equations (3.4)-(3.15) & Theorem 3.1, pp. 15-20
    relation: supports
  - source_id: sqw2017-dictsphere-cr
    locator: IEEE Transactions on Information Theory 63(2):853-884 (2017) metadata
    relation: supports
- claim_id: claim-scope-lp-rounding-and-orthogonal-deflation-for-full-complete-dictionary-recovery
  kind: scope
  statement: Given an approximate local minimizer $r\in\mathbb{S}^{n-1}$ produced by RTR on preconditioned data $\overline{Y} = (\frac{1}{p\theta}Y Y^\top)^{-1/2} Y$ satisfying $\langle r, q_*\rangle \ge 249/250$, Lemma 4.2 proves that the linear program $\min_q \|q^\top \overline{Y}\|_1$ subject to $\langle r, q\rangle = 1$ recovers the exact dictionary row $q_*$ with high probability when $p \ge C n^2\log n$, and Algorithm 4.1 recovers all $n$ rows via sequential orthogonal subspace projection (Theorem 4.1).
  evidence:
  - source_id: sqw2017-dictsphere-pdf
    locator: Section 4.1-4.2, Algorithm 4.1, Theorem 4.1, & Lemma 4.2, pp. 20-23; Section 9, pp. 42-48
    relation: supports
- claim_id: claim-limitation-complete-dictionary-square-invertibility-and-smoothing-bias
  kind: limitation
  statement: The row-space equivalence $\mathrm{row}(Y) = \mathrm{row}(X_0)$ requires the dictionary $A_0\in\mathbb{R}^{n\times n}$ to be complete (square and invertible) rather than overcomplete ($m > n$), and for finite $p$ the smoothed $\mu\log\cosh(\cdot/\mu)$ minimizer $w_*$ incurs a finite-sample shift $\|w_*\|_2 = O(\frac{\mu}{\theta}\sqrt{\frac{n\log p}{p}})$ away from the exact basis vector $e_n$ prior to LP rounding.
  evidence:
  - source_id: sqw2017-dictsphere-pdf
    locator: Section 1.2, p. 3; Section 2.2, Lemma 2.3, p. 9; Section 5.1, pp. 23-24
    relation: supports
