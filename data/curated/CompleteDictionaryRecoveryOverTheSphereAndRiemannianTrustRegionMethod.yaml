- target: AIO:DimensionalityReduction
  relation: related_match
  rationale: Recovers sparse dictionary representations Y = A_0 X_0 by optimizing a smooth sparsity surrogate over the unit sphere S^{n-1}.
- target: AIO:PrincipalComponentAnalysis
  relation: related_match
  rationale: Uses empirical covariance preconditioning (1/(p*theta) Y Y^T)^{-1/2} Y to orthogonalize complete dictionaries prior to spherical optimization.
limitations:
- Restricted to complete (square invertible) dictionaries $A_0\in\mathbb{R}^{n\times n}$ where $\mathrm{row}(Y) = \mathrm{row}(X_0)$, requires smoothing parameter $\mu \le c_a\min(\theta, 1/\sqrt{n})$, and needs LP rounding or $\mu\to 0$ to eliminate the $O(\frac{\mu}{\theta}\sqrt{\frac{n\log p}{p}})$ finite-sample minimizer shift.
