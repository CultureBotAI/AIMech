id: AIMech:SelectivelyTraversedAccumulationRulesForStructuredFDRControl
name: Selectively traversed accumulation rules for structured false discovery rate control
aliases:
- STAR Framework for Interactive Structured Multiple Testing
- Selectively Traversed Accumulation Rules (STAR)
- Interactive Masked Peeling for Structured FDR Control
- Accumulation-Masked Interactive Peeling Under Structural Constraints
concept_kind: mathematical_method
definition: 'An interactive multiple-testing methodology (Lei, Ramdas, & Fithian 2021, Biometrika 108(2):253-267,
  arXiv:1710.02776) that controls the false discovery rate (FDR) in finite samples while enforcing arbitrary
  structural constraints R_t in K on the discovery set (including rooted tree heredity, directed acyclic
  graph heredity, spatial convexity or connectedness, and polynomially sized group structures). Given
  a bounded non-decreasing accumulation function h : [0, 1] -> [0, infinity) satisfying int_0^1 h(p) dp
  = 1, STAR constructs a paired continuous strictly decreasing reflection s : [0, 1] -> [0, 1] via H(s(p))
  = H(p) where H(x) = int_0^x (h(p) - 1) dp, and reveals to the analyst only the masked p-values g(p_i)
  = min{p_i, s(p_i)} together with side information x_i, the unmasked p-values (p_i)_{i notin R_t} outside
  the current candidate set R_t, and the aggregate false discovery proportion estimate FDP_hat_t = (h(1)
  + sum_{i in R_t} h(p_i)) / (1 + |R_t|). Starting from R_0 = [n], the analyst iteratively peels R_{t+1}
  subsetneq R_t inside K using any F_t-measurable model-assisted or human-in-the-loop rule until tau =
  inf{t : FDP_hat_t <= alpha}, guaranteeing exact finite-sample conditional FDR control E[FDP(R_tau) |
  (x_i, g(p_i))_{i=1}^n] <= alpha via optional stopping (Theorem 2.3).'
identity_notes: No normalized identity match for selectively traversed accumulation rules or interactive
  structured FDR control (STAR) across all 442 pinned AIO records and 586 maintained IDs, names, aliases
  and scoped synonyms. Fixed-string searches across data, sources, research, history, and reviews returned
  only frontier references in the Round 191 discovery report. Distinct from AIMech:AdaptivePValueThresholding
  (Lei & Fithian 2018, AdaPT), which adapts coordinatewise rejection thresholds s(x_i) to covariates via
  symmetric mirror reflection min(p_i, 1 - p_i) without coupling general accumulation functions h(p) to
  reflection maps s(p) via H(s(p)) = H(p) or enforcing hard combinatorial structural constraints R_t in
  K (trees, DAGs, spatial regions) through boundary peeling and one-group EM working models; distinct
  from AIMech:FocusedBH (Katsevich, Sabatti, & Bogomolov 2023), which applies an upfront monotonic structural
  filter F(P, alpha) to unmasked p-values and calibrates a single scalar p-value cutoff via permutation
  simulation rather than interactive partial-masking peeling adapted to F_t; and distinct from AIMech:SimultaneousPathwiseFalseDiscoveryProportionBounds
  (Katsevich & Ramdas 2020), which constructs simultaneous high-probability upper envelopes on FDP across
  fixed nested paths rather than controlling FDR at an interactive stopping time tau along a data-adaptively
  traversed path of structured candidate sets.
