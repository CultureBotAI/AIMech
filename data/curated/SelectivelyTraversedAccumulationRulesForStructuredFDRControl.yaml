claims:
- claim_id: integral-reflection-accumulation-masking-pairing-and-monotone-null-supermartingale-property
  kind: mechanism
  statement: 'For any bounded non-decreasing accumulation function h : [0, 1] -> [0, infinity) satisfying
    int_0^1 h(p) dp = 1 (including SeqStep h(p) = (1/(1 - p_*)) 1{p > p_*} and truncated ForwardStop /
    HingeExp rules), the cumulative integral H(x) = int_0^x (h(p) - 1) dp is continuous and convex with
    H(0) = H(1) = 0, and Theorem 2.5 guarantees a unique continuous strictly decreasing reflection s :
    [0, 1] -> [0, 1] with s(0) = 1, s(1) = 0, and H(s(p)) = H(p) such that the paired masking function
    g(p) = min{p, s(p)} satisfies E_{U[0,1]}[h(p) | g(p)] = 1 almost surely (Section 2.3, Theorem 2.5,
    Equation 5; Appendix A.3 and B.3); furthermore, under Proposition 2.1, for any conservative null distribution
    P_0 with non-decreasing density on [0, 1], E_{P_0}[h(p) | g(p)] >= 1 almost surely (Section 2.1, Proposition
    2.1, Assumption 2; Appendix A.1).'
