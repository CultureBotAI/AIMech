- claim_id: interactive-filtration-peeling-optional-stopping-fdr-control-under-hard-structural-constraints
  kind: mechanism
  statement: 'Starting from R_0 = [n], at each step t = 0, 1, ..., n the STAR oracle reveals the filtration
    F_t = sigma((x_i, g(p_i))_{i=1}^n, (p_i)_{i notin R_t}, sum_{i in R_t} h(p_i)) and computes FDP_hat_t
    = (h(1) + sum_{i in R_t} h(p_i)) / (1 + |R_t|); if the analyst selects any shrinking sequence of structured
    candidate sets R_0 supsetneq R_1 supsetneq ... with R_t in K and R_t measurable with respect to F_{t-1}
    and stops at tau = inf{t : FDP_hat_t <= alpha}, Theorem 2.3 guarantees exact finite-sample conditional
    FDR control E[FDP(R_tau) | (x_i, g(p_i))_{i=1}^n] <= alpha and marginal FDR <= alpha under independent
    null p-values satisfying E[h(p_i) | g(p_i)] >= 1 for i in H_0 (Section 2.1–2.2, Algorithm 2.1, Theorem
    2.3, Equations 3–4; Appendix A.2, Lemma A.4), while guaranteeing R_tau in K with probability 1 across
    rooted-tree heredity, DAG heredity, spatial convexity, and group constraints through bottom-up leaf
    or boundary peeling (Section 4, Appendix D, Appendix E).'
  evidence:
