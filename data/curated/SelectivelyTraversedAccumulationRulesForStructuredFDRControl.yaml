- claim_id: model-assisted-one-group-em-peeling-scores-and-structured-knockoff-variable-selection
  kind: mechanism
  statement: To rank candidate boundary hypotheses for peeling using covariates or spatial/graph smoothers
    phi(x_i) without the non-identifiability and variance inflation of two-group mixture EM on partially
    masked data, STAR fits a conditional one-group exponential-family working model p_i ~ f(p; mu_i) with
    link eta(mu_i) = theta(phi(x_i)) via an EM algorithm on F_{t-1} that imputes posterior sign weights
    tilde{w}_{t,i} = P(p_i = g(p_i) | g(p_i); mu_i^{(r-1)}) for i in R_{t-1} in the E-step and solves
    a weighted GLM / kernel smoothing problem on the resulting pseudo-dataset in the M-step (Section 3.2,
    Section 4, Section 5; Appendix B.4, Equations 17–18, Examples 1–2); furthermore, Section 6 extends
    STAR directly to model-X and fixed-design knockoff feature statistics W_i by mapping signs and magnitudes
    to p_i = (1 + 1{W_i <= 0}) / 2 (with h(p_i) = 2 * 1{W_i <= 0} and side information |W_i|), controlling
    finite-sample FDR under structural variable-selection constraints without assuming knockoff signs
    are independent of non-null magnitudes.
  evidence:
  - source_id: lei2021-star-structured-fdr-ar5iv
    locator: Section 3.2, lines 287–301; Section 4–6, lines 302–397; Appendix B.4, lines 669–741, Equations
      17–18, Examples 1–2
    relation: supports
- claim_id: asymptotic-power-dominance-over-plain-accumulation-tests-and-minimum-rejection-boundary
  kind: mechanism
  statement: Under the two-group model with non-null proportion pi_1 and alternative accumulation mean
    mu = E_1[h(p)] < 1, when prior ordering is uninformative and pi_1 < (1 - alpha) / (1 - mu), any plain
    ordered accumulation test has asymptotic rejection threshold t_{AT}^* = 0 and zero asymptotic power,
    whereas non-interactive STAR ordered by the canonical masked score g(p_i) achieves a strictly positive
    asymptotic threshold t^* > 0 and strictly higher asymptotic power (Appendix I.1–I.3, Equations 19–22);
    conversely, because FDP_hat_t = (h(1) + sum_{i in R_t} h(p_i)) / (1 + |R_t|) >= h(1) / (1 + |R_t|),
    STAR cannot make any non-empty rejections unless the candidate set size satisfies |R_t| >= ceil(h(1)
    / alpha - 1) (requiring smaller p_* with smaller h(1) = 1/(1 - p_*) when true discoveries are sparse
    or alpha is small, Section 5.2), and violating F_t-measurability by peeking at unmasked h(p_i) values
    inside R_t when choosing which hypothesis to peel destroys the optional-stopping supermartingale and
    inflates FDR (Section 2.2, Section 3.1).
  evidence:
  - source_id: lei2021-star-structured-fdr-ar5iv
    locator: Section 2.2, lines 202–235; Section 3.1, lines 273–286; Section 5.2, lines 352–375; Appendix
      I.1–I.3, lines 1105–1215, Equations 19–22
    relation: supports
