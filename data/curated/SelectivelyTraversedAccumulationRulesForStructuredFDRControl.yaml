- target: AIO:DataDredgingBias
  relation: related_match
  rationale: STAR prevents post-hoc selection and data-dredging bias (AIO:DataDredgingBias) during interactive
    human-in-the-loop or model-assisted hypothesis exploration under structural constraints by restricting
    peeling decisions to the masked filtration F_t.
limitations:
- Finite-sample FDR control in Theorem 2.3 requires that null p-values be mutually independent and independent
  of non-null p-values and satisfy the conditional accumulation expectation bound E[h(p_i) | g(p_i)] >=
  1 almost surely (Assumption 2 / Proposition 2.1), and that the analyst's peeling rule R_{t+1} subsetneq
  R_t be strictly measurable with respect to the masked filtration F_t without peeking at unmasked p-values
  inside R_t (Section 2.2, Section 3.1).
- Because the empirical false discovery proportion estimator satisfies FDP_hat_t = (h(1) + sum_{i in R_t}
  h(p_i)) / (1 + |R_t|) >= h(1) / (1 + |R_t|), STAR cannot reject any non-empty discovery set of cardinality
  smaller than ceil(h(1) / alpha - 1), which limits power when true non-nulls are sparse or target FDR
  alpha is very small unless a smaller SeqStep parameter p_* (with smaller h(1) = 1/(1 - p_*)) is chosen
  (Section 5.2).
- The interactive peeling protocol requires nested candidate sets R_0 supsetneq R_1 supsetneq ... and
  therefore cannot add back an already-peeled hypothesis once its unmasked p-value p_i is revealed upon
  leaving R_t (the no-look-back restriction, Section 3.1).
- All 1,509 lines of Lei, Ramdas, & Fithian (2021, Biometrika 108(2):253-267, arXiv:1710.02776v2) were
  read. Constructed numerical checks in research/discovery/selectively-traversed-accumulation-rules-for-structured-fdr-control-boundaries.py
  verify (1) Theorem 2.5 integral symmetry H(s(p)) = H(p) (max error 0.0 for SeqStep and 0.0 for truncated
  ForwardStop), Uniform(0,1) conditional expectation E[h(p)|g(p)] = 1 (max error 0.0), and Proposition
  2.1 conservative Beta(2,1) lower bound (min E[h(p)|g(p)] = 1.155556 >= 1), (2) Theorem 2.3 finite-sample
  FDR control (0.049024 <= 0.20) with 100% rooted-subtree constraint satisfaction (1.0 vs. standard BH
  0.0) and bottom-up leaf peeling power gain over top-down hierarchical testing (0.839 vs. 0.271), (3)
  Appendix B.4 one-group EM score correlation with oracle smoother (0.971733), higher spatial convex-interval
  power than canonical scores (0.965476 vs. 0.864286) with controlled FDR (0.067853 <= 0.15), and Section
  6 structured knockoff FDR control (0.050822 <= 0.15, power 0.783333), and (4) Appendix I.3 asymptotic
  power dominance over plain accumulation tests under uninformative ordering (0.819583 vs. 0.0 when pi_1
  = 0.25 < 0.804109), Section 5.2 minimum rejection floor (19 at p_*=0.5 vs. 12 at p_*=0.2), and filtration-violating
  peeking failure (global-null FDR = 1.0 > 0.20).
