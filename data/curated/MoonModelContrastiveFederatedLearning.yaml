id: AIMech:MoonModelContrastiveFederatedLearning
name: MOON (Model-Contrastive Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A federated learning algorithm for non-IID data (Li, He, & Song 2021, Algorithm 1) that corrects local representation drift by augmenting each client's supervised cross-entropy loss l_sup(w_i^t; (x, y)) with a model-level InfoNCE contrastive loss l_con(w_i^t; w^t, w_i^{t-1}, x) = -log(exp(sim(z, z_glob) / tau) / (exp(sim(z, z_glob) / tau) + exp(sim(z, z_prev) / tau))) weighted by mu > 0, where z = R_{w_i^t}(x), z_glob = R_{w^t}(x), and z_prev = R_{w_i^{t-1}}(x) are the projection-head feature representations extracted from the current local model w_i^t, the current global server model w^t (positive pair), and the client's own previous-round model w_i^{t-1} (negative pair) using cosine similarity sim(., .) and temperature tau > 0.
identity_notes: Distinct from parameter-space drift regularization methods such as FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization, which penalizes the Euclidean parameter distance (mu / 2) ||w_i^t - w^t||_2^2 without using feature representations or previous-round negative models w_i^{t-1}) and SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, which applies gradient control variates), and from data-level contrastive learning methods such as SimCLR and MoCo, which contrast augmented views of different input samples rather than representations of the same input x across three distinct models (w_i^t, w^t, w_i^{t-1}).
aliases:
- MOON
- Model-Contrastive Federated Learning
- Model-Level Contrastive Learning for Federated Optimization
