claims:
- claim_id: r413-model-level-infonce-representation-alignment-and-fedavg-boundary
  kind: mechanism
  statement: For each local input x, MOON pulls the current local projection representation z = R_{w_i^t}(x) toward the global representation z_glob = R_{w^t}(x) and pushes it away from the previous-round local representation z_prev = R_{w_i^{t-1}}(x) via l_con = -log(exp(sim(z, z_glob)/tau) / (exp(sim(z, z_glob)/tau) + exp(sim(z, z_prev)/tau))) (Eq. 3); in the ideal no-drift limit z_glob = z_prev, l_con equals the constant -log(1/2) = log 2 with zero gradient, recovering standard FedAvg (Section 3.3).
  evidence:
  - source_id: r413-primary-pdf
    locator: Section 3.2-3.3 Method & Connections with Contrastive Learning (Eqs. 1-4, Table 1), pp. 10715-10717
    relation: supports
- claim_id: r413-mlp-projection-head-representation-quality-and-non-iid-skew-robustness
  kind: mechanism
  statement: Inserting a 2-layer MLP projection head before the output classification layer to compute z, z_glob, and z_prev increases inter-class t-SNE representation margins on non-IID Dirichlet partitions and consistently outperforms FedAvg, FedProx, SCAFFOLD, and L2 representation-distance penalties without negative pairs w_i^{t-1}.
  evidence:
  - source_id: r413-primary-pdf
    locator: Section 3.1 Motivation (Figure 1) & Section 4.2-4.6 Ablation Studies (Tables 2-7, Figures 3-5), pp. 10714-10720
    relation: supports
- claim_id: r413-three-model-forward-pass-and-stateful-client-memory-limitation
  kind: limitation
  statement: Each local training step requires three forward passes through the feature encoder and projection head (for w_i^t, w^t, and w_i^{t-1}) and requires clients to store both the global model w^t and their previous-round local model w_i^{t-1} in memory.
  evidence:
  - source_id: r413-primary-pdf
    locator: Section 3.2 (Algorithm 1, Figure 2) & Appendix A Overhead Analysis
    relation: supports
- claim_id: r413-non-iid-cifar10-cifar100-and-tiny-imagenet-vision-application
  kind: application
  statement: Applied to federated image classification on Dirichlet-partitioned CIFAR-10, CIFAR-100, and Tiny-ImageNet with CNN and ResNet-50 backbones.
  evidence:
  - source_id: r413-primary-pdf
    locator: Section 4 Experiments (Tables 2-5, Figures 3-4), pp. 10717-10719
    relation: supports
