claims:
- claim_id: pals-parallel-projected-multihead-attention-with-shared-encoder-decoder
  kind: mechanism
  statement: PALs augment each L-layer BERT block in parallel as h^{l+1} = LN(h^l + SA(h^l) + V^D g^l(V^E h^l)), sharing task-specific encoder V^E in R^{d_s x d_m} and decoder V^D in R^{d_m x d_s} across all 12 layers while omitting the multi-head output matrix W^o inside g^l, so that each task requires 2 d_m d_s + 12 x 3 d_s^2 parameters (1.81M parameters per task at d_m=768, d_s=204 vs. d_s=84 when V^E and V^D are not shared across layers).
  evidence:
  - source_id: r712-primary-pdf
    locator: Section 3.3 & Table 1, Equations (8), (11), pp. 4-5
    relation: supports
- claim_id: pals-annealed-task-sampling-schedule
  kind: mechanism
  statement: To balance large and small datasets during multi-task training without late-stage task interference, PALs sample a batch from task i with probability p_i propto N_i^alpha where the exponent alpha(e) = 1 - 0.8 (e - 1)/(E - 1) anneals linearly from 1.0 (dataset-proportional sampling) at epoch 1 to 0.2 at final epoch E.
  evidence:
  - source_id: r712-primary-pdf
    locator: Section 4.1, Equations (12)-(14), p. 5
    relation: supports
- claim_id: pals-glue-multitask-parameter-efficiency-and-rte-transfer
  kind: application
  statement: On eight GLUE benchmark tasks with BERT-base, PALs (d_s=204) require only 1.13x total parameters (~7x fewer parameters than eight separately fine-tuned BERT-base models) while achieving a higher mean GLUE test score (80.4 vs. 79.6) and improving RTE test accuracy from 66.4% to 76.0%.
  evidence:
  - source_id: r712-primary-pdf
    locator: Section 5, Tables 2-3, pp. 6-7
    relation: supports
  - source_id: r712-metadata-cr
    locator: ICML 2019 bibliographic record
    relation: supports
- claim_id: pals-shared-layer-computation-and-joint-training-limitation
  kind: limitation
  statement: Because PALs insert task-specific branches at every layer of BERT-base and jointly fine-tune the shared backbone across all tasks simultaneously, they require simultaneous access to all tasks at training time and cannot share forward-pass layer activations across tasks on the same input text unless PALs are restricted to the top layers.
  evidence:
  - source_id: r712-primary-pdf
    locator: Section 2.2, Section 5.2 & Section 6, pp. 3, 8
    relation: supports
