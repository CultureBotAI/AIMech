id: AIMech:PALsProjectedAttentionLayers
name: Projected Attention Layers
concept_kind: layer
review_status: DRAFT
definition: A task-specific parallel multi-head attention adaptation layer for multi-task Transformer models that transforms each layer's hidden states via h^{l+1} = LN(h^l + SA(h^l) + TS(h^l)) with TS(h^l) = V^D g^l(V^E h^l), where task-specific encoder V^E in R^{d_s x d_m} and decoder V^D in R^{d_m x d_s} (d_s < d_m) are shared across all Transformer layers for a given task while g^l(.) applies layer-specific low-dimensional multi-head self-attention in R^{d_s} (omitting the final output matrix W^o), trained jointly with annealed task-sampling exponent alpha(e) = 1 - 0.8 (e-1)/(E-1).
identity_notes: Introduced by Asa Cooper Stickland and Iain Murray (ICML 2019, PMLR 97:5986-5995, arXiv:1902.02671) as Projected Attention Layers (PALs). Distinct from Houlsby bottleneck adapters and AdapterFusion (AIMech:AdapterFusion), which insert serial feed-forward down/up-projection modules within each layer; from AdaptFormer (AIMech:AdaptFormer), which places parallel bottleneck MLP branches alongside FFN sublayers in Vision Transformers; and from HyperFormer (AIMech:HyperFormerSharedHypernetworkAdapter), which generates serial adapter weights via a shared task-conditioned hypernetwork.
aliases:
- PALs
- BERT and PALs
- Projected Attention Layer
- Parallel Projected Multi-Head Attention Adapter
