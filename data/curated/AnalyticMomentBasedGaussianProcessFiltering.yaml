  rationale: The algorithm infers hidden states recursively from time-indexed noisy measurements. This
    is a concrete time-series analysis relationship; the complete filter includes measurement conditioning,
    rather than only prediction of future values.
limitations:
- Exact moment claims condition on the chosen squared-exponential posterior models, fixed training data/hyperparameters
  and the Gaussian input approximation. Gaussian prediction and joint-state/measurement projection discard
  higher-order structure; the method is not an exact general nonlinear Bayes filter.
- The source uses independent scalar GP outputs and diagonal white process/measurement noises. Correlated
  conditional outputs, correlated noises, non-Gaussian inputs and hyperparameter uncertainty require additional
  treatment. Shared uncertain input alone still induces cross-output covariance.
- Training requires hidden-state observations in the described setup. Smoothing and learning without direct
  state observations are discussed as future work, not delivered by this filter.
- The corrected source introduces process and measurement noise in its state-space model while later covariance
  additions are implicit. This record defines noisy versus latent covariances explicitly and adds independent
  noise once; no claim of reproducing an uninspected author implementation is made. Singular innovation
  covariance requires a separate supported treatment rather than an unconditional inverse.
- The inspected sources do not justify universally calibrated intervals, always-consistent state estimates
  or superiority over other filters. Their one-dimensional and pendulum illustrations are task-specific;
  no numerical performance claim is curated. A linear-Gaussian curator check validates only the displayed
  conditioning arithmetic.
- The Gaussian joint-conditioning counterexample and shared-input covariance check are curator analytic
  illustrations, not trained SE-GP experiments. No author code, fitting, stochastic trajectory simulation
  or benchmark was run. The record remains DRAFT after author self-review.
