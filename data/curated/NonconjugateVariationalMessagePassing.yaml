  source_id: knowles2011
  locator: Sections 2–4, Algorithm 1 and Theorems 1–2, PDF pp. 2–4
  relation: supports
claims:
- claim_id: restricted-family
  kind: scope
  statement: For a fixed normalizable target p(x) proportional to a product of factors f_a(x_a), choose
    q(x)=product_i q_i(x_i), allowing each block x_i to be vector-valued. Each q_i is a specified regular
    minimal exponential family q_i=exp(theta_i^T*u_i-kappa_i(theta_i)) relative to a fixed reference measure.
    The factorization of p must use the same product reference measure; nonconstant carrier terms cannot
    simply be discarded. Approximate inference minimizes KL(q||p), equivalently maximizing the expected
    log unnormalized target plus entropy relative to that measure. This is an inference procedure, not
    a requirement for neural amortization or model-parameter learning.
  evidence:
  - *id001
- claim_id: gradient-messages
  kind: mechanism
  statement: At the current proper q, hold all other blocks fixed and define S_a(theta_i)=E_q[log f_a]
    for factors adjacent to block i. Let C_i=Cov_q_i[u_i]=Hessian kappa_i, assumed finite and invertible.
    Compute each message’s natural-parameter contribution phi_ai=C_i^(-1)*grad_theta_i S_a and propose
    theta_i_new=sum_a phi_ai. Repeat block updates using current neighboring factors. The message contributions
    are potentials; individual messages need not each normalize as a standalone distribution, whereas
    their resulting q_i must be proper. The rule requires tractable or explicitly approximated expectations
    and their derivatives.
  evidence:
  - *id001
- claim_id: stationarity-not-convergence
  kind: mechanism
  statement: Where the fixed reference measure, finite expectations, differentiation and interior regularity
    assumptions apply, grad_theta_i KL=C_i*theta_i-sum_a grad_theta_i S_a. Thus the proposed increment
    theta_i_new-theta_i equals the Fisher natural-gradient direction of the variational lower bound. A
    valid fixed point has zero block gradients and conversely, but this algebra does not certify a local
    minimum, global optimum, exact posterior, monotonic bound improvement or convergence of unit steps.
    Approximate expectation bounds or numerical derivatives can instead yield stationary points of their
    approximation.
  evidence:
  - *id001
  - source_id: knowles2011-supp
    locator: Fixed-point and cavity derivation, PDF pp. 1–2
    relation: supports
- claim_id: conjugate-reduction
  kind: mechanism
  statement: If E_q_-i[log f_a] is beta_ai^T*u_i(x_i) plus a term constant in x_i, then grad_theta_i S_a=C_i*beta_ai
    and the message reduces to the usual conjugate variational message beta_ai. This reduces to the conjugate
    message rule within the chosen factorization; it does not remove the posterior approximation caused
    by independence restrictions.
  evidence:
  - source_id: knowles2011
    locator: Theorem 2 and proof, PDF p. 4
    relation: supports
- claim_id: damping-and-domain
  kind: limitation
  statement: A damped block proposal mixes natural parameters as theta_i_next=(1-rho)*theta_i+rho*theta_i_new
    with 0<rho<=1, corresponding to multiplying old and proposed message potentials to the complementary
    powers. For a fixed positive rho, valid fixed points are unchanged. If both endpoints lie in the regular
    natural-parameter domain, convex mixing stays there; an invalid endpoint requires an explicit domain
    check. Damping may help but supplies no general ascent or convergence guarantee. Initialize with proper
    variational factors rather than assuming theta_i=0 is a normalizable uniform density on an unbounded
    domain.
  evidence:
  - source_id: knowles2011
    locator: Algorithm 1 initialization, PDF p. 3; Section 7 damping, PDF p. 8
    relation: supports
- claim_id: full-gaussian-specialization
  kind: mechanism
  statement: For a vector block q_i=N(mu,Sigma), set S=E_q[log p_tilde(x)] with other blocks fixed, and
    define g=grad_mu S and symmetric G by the differential dS=g^T*dmu+tr(G^T*dSigma). Evaluate both derivatives
    at the current mu and Sigma. The full-Gaussian NCVMP proposal is Sigma_new=(-2*G)^(-1), mu_new=mu+Sigma_new*g,
    provided -2*G is positive definite. This is an algebraic specialization of the sufficient-statistic
    update, not a new objective or a general guarantee that the proposed covariance is valid. Correlations
    inside this block are retained; dependence between separately factorized blocks is omitted.
  evidence:
  - source_id: knowles2011
    locator: Section 4.1, Equation 7, PDF p. 4
    relation: supports
  - source_id: wand2014
    locator: Sections 2–4, Theorem 1 and Equation 7, PDF pp. 2–7 / printed pp. 1352–1357; Appendix A,
      PDF pp. 13–15 / printed pp. 1363–1365
    relation: supports
- claim_id: gradient-versus-moment-matching
  kind: scope
  statement: 'The local message approximation matches derivatives of expected log factors with derivatives
    of their exponential-family surrogate at the current variational parameters. The supplement also derives
    this through a fixed-cavity message update. Its analogy with expectation propagation does not identify
    the two algorithms: it does not replace the update by matching ordinary sufficient-statistic moments
    of an EP tilted distribution. Gradient-matching equations transform consistently under a differentiable
    change of coordinates with nonsingular Jacobian; this is not arbitrary finite-step parameterization
    invariance.'
  evidence:
  - source_id: knowles2011
    locator: Section 4, gradient-matching discussion, PDF pp. 3–4
    relation: supports
  - source_id: knowles2011-supp
    locator: Cavity and parameterization derivations, PDF pp. 1–3
    relation: supports
