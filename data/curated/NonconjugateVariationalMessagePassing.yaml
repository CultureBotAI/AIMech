id: AIMech:NonconjugateVariationalMessagePassing
name: Non-conjugate variational message passing
aliases:
- NCVMP
concept_kind: algorithm
definition: An approximate inference algorithm that restricts variational blocks to exponential families
  and updates their natural parameters by matching expected-log-factor gradients through the sufficient-statistic
  covariance.
identity_notes: 'No normalized match across 442 pinned AIO IDs, names and scoped synonyms and 550 maintained
  IDs, names and aliases, including NCVMP and spelling variants. Full-text fixed-string searches of the
  recovery, older discovery and original Documents checkouts included ignored and hidden files: 34, 13
  and 15 matched lines. All 26 distinct contents were read; matches are prior nonconjugate-model context,
  the Tan neighborhood record and its fitting leads, and unrelated programming-language tokens. Assessed
  all 15 semantic AIO rows and 121 native names/definitions, six complete annotated AIO CLASS nodes with
  incident edges and generated YAML, and six complete native neighboring records. NCVMP specifies expected-log-factor
  gradient matching and a Fisher-preconditioned fixed-point update, beyond choosing a mean-field family.
  It is distinct from BBVI score-sampling, natural evolution strategies, model-parameter VEM and query-local
  neighborhood selection. Wand’s full-Gaussian rewrite is represented as a specialization of this algorithm,
  not a duplicate new identity. The mapping and absence assessment are bounded to the inspected pin and
  corpus.'
