  rationale: The primary construction uses a probabilistic factor graph and its factor-to-variable neighborhoods
    to organize approximate inference. The pinned AIO class denotes a graphical-model task, whereas this
    record denotes an inference algorithm. This is a method-to-modeling-context relation without equivalence
    or an is-a assertion.
limitations:
- Regular minimal families, valid support, finite sufficient-statistic covariance and differentiable expectations
  are substantive assumptions. A nonminimal representation can have singular Fisher covariance; a formally
  written inverse is not a numerical recipe. Proper initialization and updated-factor normalization are
  required even if message potentials are individually improper.
- The unit proposal can leave the natural-parameter domain even for a proper target. The saved exact Gaussian
  example uses p(x) proportional to exp(2*x^2-x^4/4) and current q=N(0,1); the proposed precision is -1.
  A quarter natural-parameter step is proper in that example, without asserting bound ascent. These are
  curator arithmetic examples, not fitted posteriors or reproduced source experiments.
- Mean-field partition and exponential-family restrictions can produce inaccurate uncertainty or miss
  posterior structure. Fixed-point stationarity is weaker than convergence or optimality. Gaussian moment-coordinate
  simplification preserves the same proposal where well-defined; it does not make the general nonconjugate
  problem an exact coordinate solve.
- The main paper’s final proof line on PDF p. 3 has an entropy-derivative sign inconsistency corrected
  by Equation 6 on p. 4. Its zero-natural-parameter uniform initialization is not generally proper. The
  supplement’s parameterization argument needs a nonsingular Jacobian in addition to one-to-one labeling.
  The Gaussian rewrite follows Wand’s displayed derivation rather than a prose line that appears to differentiate
  the scalar expected-log-joint symbol prematurely.
- Logistic/softmax quadrature and auxiliary bounds are application-specific treatments, not defining requirements
  of general NCVMP. Source factor-of-two, sign and curvature-order issues in those variants remain recorded
  in the discovery notes; no separate bound algorithm is certified here. Tan spectral-fitting step-size
  adaptations likewise require a separate implementation and boundary audit.
- All three primary documents were read in full, including experimental contexts, but no quantitative
  accuracy or runtime superiority is asserted. No author implementation, fitting pipeline, training or
  benchmark was executed. The record remains DRAFT and author self-review is not independent approval.
