id: AIMech:HACE
name: HAC-E network clustering
aliases:
- HAC-E
concept_kind: algorithm
definition: A hierarchical network-clustering variant that greedily guides agglomeration by the observed
  edge density between two vertex groups and uses the resulting group hierarchy for link-probability estimation.
definition_evidence:
- source_id: park2011
  locator: Different merging scores, PDF p. 4, Equation 9; Link prediction, p. 5
  relation: supports
claims:
- claim_id: edge-density-guide
  kind: mechanism
  statement: The merge guide is the observed number of edges between two disjoint nonempty vertex groups
    divided by their number of possible cross-group pairs. Replacing HAC-ML’s profile-likelihood guide
    with this density gives HAC-E. The score favors dense cross-connections and does not directly compare
    agreement with all external groups.
  evidence:
  - source_id: park2011
    locator: Different merging scores, PDF p. 4, Equation 9; HAC-ML Equation 5, p. 3
    relation: supports
- claim_id: average-linkage-boundary
  kind: scope
  statement: For a binary adjacency matrix, the density is exactly mean cross-group adjacency; its complement
    is average dissimilarity when pair dissimilarity is one minus adjacency. The score after a merge therefore
    uses group-size weights, rather than an unweighted mean of the two old scores. This algebra identifies
    a shared linkage criterion, not equivalence of every implementation, search restriction or stopping
    rule.
  evidence:
  - source_id: park2011
    locator: Preliminary definitions, PDF p. 2; Equation 9, p. 4; curator derivation in research/discovery/hace-boundaries.py
    relation: supports
- claim_id: score-versus-prediction
  kind: scope
  statement: The density-based merge guide is distinct from the hierarchical model’s later link estimates.
    The study estimates densities between left and right vertex groups at tree joins for hierarchical
    methods. A score comparison alone does not establish a calibrated probability of a missing edge, a
    complete merge sequence or recovery of true biological communities.
  evidence:
  - source_id: park2011
    locator: Link prediction, PDF p. 5; Different merging scores, p. 4
    relation: supports
- claim_id: evaluation-scope
  kind: scope
  statement: The study compares this named variant with HAC-ML and other methods on biological interaction
    networks using held-out-edge prediction. Positive test pairs are balanced by an equal number of sampled
    holes, and maximum F scores summarize ranked predictions. This selection changes the negative prevalence
    relative to deployment. The reported comparisons support a setting-specific empirical assessment,
    not universal superiority or calibrated real-world link probabilities.
  evidence:
  - source_id: park2011
    locator: Performance Evaluation and Link prediction, PDF pp. 4–5; Table 2 and Figure 1, p. 6
    relation: supports
limitations:
- The average-adjacency criterion is mathematically related to average linkage. This record preserves
  the source-named network variant without claiming a novel general linkage function.
- On a three-vertex path, density favors adjacent singleton pairs while the HAC-ML profile guide favors
  the nonadjacent pair with identical external connectivity. This is a local score distinction; candidate
  restrictions and a complete execution were not modeled.
- This record covers a named 2011 score variant in Park and Bader’s network-clustering study, not a fitted
  interactome or the entire family of agglomerative clustering methods.
- The paper defines each alternative by replacing the merge guide. It does not separately specify every
  candidate-restriction, tie, stopping and terminal-collapse convention for each variant. The detailed
  HAC-ML implementation and its complexity are not automatically asserted for this variant.
- The experiments use undirected, unweighted interaction graphs with iterative removal of isolated and
  degree-one vertices. Missing observed edges can include unobserved biological interactions; sampled
  holes are not established biological negatives.
- No author implementation, data or supplementary archive was audited or executed. Finite constructed
  checks assess local scores and algebraic distinctions, not complete clustering runs, benchmark replication
  or global optimality. DRAFT remains.
