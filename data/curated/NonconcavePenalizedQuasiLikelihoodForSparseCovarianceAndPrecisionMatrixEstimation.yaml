claims:
- claim_id: unified-frob-and-operator-norm-convergence-rates-across-precision-covariance-and-cholesky
  kind: scope
  statement: Under regularity conditions (A) (0 < tau_1 < lambda_min(Sigma_0) <= lambda_max(Sigma_0) < tau_2 < infty), (B/B'/B2/B2'/B3/B5) on the maximum penalty derivatives a_{ni} = max_{(i,j) in S_i} p'_lambda(|theta^0_{ij}|) and b_{ni} = max_{(i,j) in S_i} p''_lambda(|theta^0_{ij}|), (C) origin singularity lim_{t->0+} p_lambda(t)/(lambda t) = k > 0, and (D) Lipschitz second derivative, together with sub-Gaussian squared tails (Lemma 2, Eq. 5.2, p. 4270 / PDF p. 17), Theorems 1, 5, and 9 prove via split diagonal/off-diagonal shell localization Delta_U = alpha_n R_U + beta_n D_U with alpha_n = (s_{ni} log p_n / n)^{1/2} and beta_n = (p_n log p_n / n)^{1/2} (Proof of Theorem 1, Eq. 5.5, pp. 4272-4274 / PDF pp. 19-21) and Neumann series expansion of the covariance Hessian g(v, Sigma_v) (Proof of Theorem 5, Eqs. 5.6-5.7, pp. 4276-4277 / PDF pp. 23-24) that local minimizers satisfy ||Omega_hat - Omega_0||_F^2 = O_P((p_n + s_{n1}) log p_n / n), ||Sigma_hat - Sigma_0||_F^2 = O_P((p_n + s_{n2})
    log p_n / n), and ||T_hat - T_0||_F^2 = O_P(s_{n3} log p_n / n). Furthermore, estimating the inverse correlation matrix Psi_hat (Eq. 2.4), correlation matrix Gamma_hat (Eq. 3.2), or normalized Cholesky factor T_hat (Eq. 4.4) removes the O_P(p_n log p_n / n) diagonal estimation term, yielding ||Psi_hat - Psi_0||_F^2 = O_P(s_{n1} log p_n / n), ||Gamma_hat - Gamma_0||_F^2 = O_P(s_{n2} log p_n / n), and operator-norm rates ||Omega_tilde - Omega_0||_2^2 = O_P((s_{n1} + 1) log p_n / n) and ||Sigma_tilde - Sigma_0||_2^2 = O_P((s_{n2} + 1) log p_n / n) (Theorems 3, 7, 11).
  evidence:
  - source_id: lf2009-sparsistency-pdf
    locator: Sections 2.3-4.2, Theorems 1, 3, 5, 7, 9, 11, pp. 4259-4269 (PDF pp. 6-16); Section 5, Lemmas 1-3 and Proofs of Theorems 1, 3, 5, 7, Equations (5.1)-(5.7), pp. 4269-4278 (PDF pp. 16-25)
    relation: supports
- claim_id: sparsistency-and-l1-bias-compatibility-bottleneck-versus-nonconcave-penalties
  kind: mechanism
  statement: Theorems 2, 4, 6, 8, 10, and 12 (Proofs on pp. 4275, 4277-4278 / PDF pp. 22, 24-25) establish that for any local minimizer with operator-norm error ||M_hat - M_0||_2^2 = O_P(eta_n) (and ||D_hat - D_0||_2^2 = O_P(zeta_n) for MCD), if log p_n / n + eta_n = O(lambda_{ni}^2), the off-diagonal partial derivative on the true zero set S_i^c (e.g., dq_1/d omega_{ij} = 2(s_{ij} - sigma_{ij} + p'_{lambda_{n1}}(|omega_{ij}|) sgn(omega_{ij})) or dq_2/d sigma_{ij} = 2(-(Omega S Omega)_{ij} + omega_{ij} + p'_{lambda_{n2}}(|sigma_{ij}|) sgn(sigma_{ij})), bounded via Lemma 1 and Lemma 3, Eqs. 5.3-5.4) is sign-dominated by sgn(theta_{ij}) near 0 with probability tending to 1, forcing exact zero estimates theta_hat_{ij} = 0 for all (i, j) in S_i^c (sparsistency). For the convex L1 penalty, where a_{ni} = lambda_{ni}, simultaneous consistency (Condition B) and sparsistency require log p_n / n + eta_n = O(lambda_{ni}^2) = (1 + p_n/(s_{ni} + 1)) log p_n / n (Equations 2.3, 2.5, 3.1, 3.3, 4.5, pp.
    4262-4268 / PDF pp. 9-15), which is compatible only if s_{ni} = O(1) in the worst-case operator-norm scenario (||M_hat - M_0||_2^2 asymp ||M_hat - M_0||_F^2) and at most s_{ni} = O(p_n) even in the optimistic scenario (||M_hat - M_0||_2^2 asymp ||M_hat - M_0||_F^2 / p_n); by contrast, folded-concave SCAD and hard-thresholding penalties satisfy a_{ni} = b_{ni} = 0 for sufficiently large n when min_{(i,j) in S_i} |theta^0_{ij}|/lambda_{ni} -> infty (or > a for SCAD), removing the upper bound on lambda_{ni} and guaranteeing simultaneous optimal convergence rates and sparsistency without restricting s_{ni}.
  evidence:
  - source_id: lf2009-sparsistency-pdf
    locator: Sections 2.4-4.2, Theorems 2, 4, 6, 8, 10, 12 and Equations (2.3), (2.5), (3.1), (3.3), (4.5), pp. 4261-4269 (PDF pp. 8-16); Section 5, Lemma 3 and Proofs of Theorems 2, 6, 10, pp. 4271-4272, 4275, 4277-4278 (PDF pp. 18-19, 22, 24-25)
    relation: supports
- claim_id: local-linear-approximation-iteratively-reweighted-l1-optimization
  kind: mechanism
  statement: To compute nonconcave penalized quasi-likelihood estimators efficiently when p_n > n, Section 2.1 (Equations 2.1-2.2, p. 4258 / PDF p. 5) expands the folded-concave penalty around the current iterate Omega_k = (omega_{ij,k}) via the local linear approximation p_{lambda_{n1}}(|omega_{ij}|) approx p_{lambda_{n1}}(|omega_{ij,k}|) + p'_{lambda_{n1}}(|omega_{ij,k}|)(|omega_{ij}| - |omega_{ij,k}|), reducing each outer step to the weighted L1-penalized likelihood problem argmin_Omega {tr(S Omega) - log|Omega| + sum_{i != j} p'_{lambda_{n1}}(|omega_{ij,k}|) |omega_{ij}|} (solved via graphical lasso group coordinate descent), where initializing at Omega_0 = 0 yields the unweighted L1 estimator at iteration 1 and subsequent iterations assign smaller penalty weights p'_{lambda_{n1}}(|omega_{ij,k}|) to large estimated entries to eliminate L1 shrinkage bias.
  evidence:
  - source_id: lf2009-sparsistency-pdf
    locator: Section 2.1, Equations (2.1)-(2.2), p. 4258 (PDF p. 5); Section 2.2, p. 4259 (PDF p. 6)
    relation: supports
