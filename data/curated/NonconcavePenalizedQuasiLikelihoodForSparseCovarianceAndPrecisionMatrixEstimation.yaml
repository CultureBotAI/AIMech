aio_mappings:
- target: AIO:LassoRegression
  relation: related_match
  rationale: The nonconcave penalized quasi-likelihood framework includes the convex L1 (LASSO) penalty as a special case and solves nonconcave SCAD problems via local linear approximation (LLA) iteratively reweighted L1 optimization (Section 2.1, Eqs. 2.1-2.2).
- target: AIO:LinearRegression
  relation: related_match
  rationale: Section 4 (Equations 4.1-4.4) formulates sparse modified Cholesky decomposition via autoregressive linear regressions y_i = sum_{j=1}^{i-1} phi_{ij} y_j + eps_i and Section 2.2 applies precision matrix estimates to linear discriminant analysis.
limitations:
- 'Non-convexity and local-minimizer guarantees: Because folded-concave penalties (such as SCAD and hard-thresholding) make the penalized quasi-likelihood objectives q_1(Omega), q_2(Sigma), and q_3(T, D) nonconvex (and log|Sigma| in q_2(Sigma) is itself concave), Theorems 1-12 establish convergence rates and sparsistency for an interior local minimizer within the Frobenius shell A rather than an arbitrary stationary point (Section 2.4, pp. 4260-4261).'
- 'Minimum signal-strength requirement for unbiasedness of nonconcave penalties: Achieving zero asymptotic penalty bias (a_{ni} = b_{ni} = 0) under SCAD or hard-thresholding requires that the minimum magnitude of true nonzero off-diagonal entries exceed the regularization scale, min_{(i,j) in S_i} |theta^0_{ij}| / lambda_{ni} -> infty (or > a for SCAD, Condition B, p. 4260).'
- 'Sample-size scaling constraint p_n / n -> y in [0, 1) in Lemma 3 for sparse covariance and Cholesky sparsistency: While precision and inverse-correlation estimation (Theorems 1-4) allow log p_n = o(n) via Lemma 2, the proofs of covariance and Cholesky sparsistency (Theorems 6, 8, 10, 12) invoke Lemma 3 (p. 4271 / PDF p. 18), which uses the Bai-Silverstein random-matrix eigenvalue bound under p_n / n -> y in [0, 1) (Section 4.2, p. 4269; Section 5, p. 4271).'
- 'Primary-source typographical audit of arXiv:0711.3933v3 (DOI:10.1214/09-AOS720): (1) On p. 5 (PDF p. 5), Equation (2.2) and the unnumbered display below it write ''arg max_Omega [tr(S Omega) - log|Omega| + ...]'' for the penalized negative log-likelihood q_1(Omega) of Equations (1.1) and (2.1), which is minimized (''arg min_Omega''), not maximized; (2) on p. 14 (PDF p. 14), Equations (4.2)-(4.4) write the penalty summation index as ''sum_{i<j} p_{lambda}(|t_{ij}|)'' for a lower-triangular matrix T = (t_{ij}) whose nonzero off-diagonal entries lie at j < i (i > j, as defined in Eq. 4.1 and used on p. 25, Proof of Theorem 10: ''Since i > j for (i, j) in S_3^c''); and (3) on p. 19 (PDF p. 19, bottom line), ''Consider, for Sigma = Sigma_0 + Delta_U, the difference q_1(Omega) - q_1(Omega_0)'' writes Sigma = Sigma_0 + Delta_U instead of Omega = Omega_0 + Delta_U, while on p. 22 (PDF p. 22, Proof of Theorem 2, lines 2, 5, and 26), ''(i, j) in S_2^c'' and ''complet.'' are printed instead of ''(i,
  j) in S_1^c'' and ''complete.''.'
