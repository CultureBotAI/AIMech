claims:
- claim_id: r523-stochastic-descendant-score-and-top-subset-averaging
  kind: mechanism
  statement: 'Using a validation mini-batch f_r(x) = (1/n_r) sum_{i=1}^{n_r} f(x; z_i) sampled after receiving worker candidate updates {tilde_v_i : i in [m]}, Zeno evaluates Score_{gamma, rho}(tilde_v_i, x) = f_r(x) - f_r(x - gamma * tilde_v_i) - rho * ||tilde_v_i||^2 (Definition 2) to reward loss decrease while penalizing update magnitude, sorts candidates as Score(tilde_v_{(1)}) >= ... >= Score(tilde_v_{(m)}), and outputs Zeno_b({tilde_v_i}) = (1/(m - b)) sum_{i=1}^{m-b} tilde_v_{(i)} (Definition 3).'
  evidence:
  - source_id: r523-primary-pdf
    locator: Section 3, Definitions 2-3 and Algorithm 1, p. 3
    relation: supports
- claim_id: r523-dishonest-majority-nonconvex-convergence-guarantee
  kind: scope
  statement: By Lemma 1, the i-th highest candidate score dominates the i-th highest honest worker score Score_{gamma, rho}(tilde_v_{(i)}, x) >= Score_{gamma, rho}(v_{(i)}, x) for all i in [m - q]; consequently, for any number of Byzantine workers q < m (including a dishonest majority q >= m/2) with m > b >= q, Theorem 1 and Corollaries 1-2 prove O(1/sqrt(T)) convergence to a stationary point of smooth non-convex objectives under both i.i.d. and disjoint non-i.i.d. worker data.
  evidence:
  - source_id: r523-primary-pdf
    locator: Section 4, Lemma 1, Theorem 1, and Corollaries 1-2, p. 4; Appendix A, pp. 10-15
    relation: supports
- claim_id: r523-server-validation-batch-and-forward-pass-overhead
  kind: limitation
  statement: Zeno requires the central server to hold a trusted validation dataset from the target learning distribution and to evaluate the validation loss f_r(x - gamma * tilde_v_i) across all m candidate updates at every iteration.
  evidence:
  - source_id: r523-primary-pdf
    locator: Section 3.1-3.2 and Section 4.1 Assumption 1, pp. 3-4
    relation: supports
