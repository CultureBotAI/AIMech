id: AIMech:ZenoSuspicionBasedFaultTolerantDistributedStochasticGradientDescent
name: Zeno Suspicion-Based Fault-Tolerant Distributed Stochastic Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-tolerant synchronous distributed stochastic gradient descent algorithm in which the parameter server samples a small validation mini-batch f_r(x) = (1/n_r) sum_{i=1}^{n_r} f(x; z_i) at each iteration, computes a regularized stochastic descendant score Score_{gamma, rho}(u, x) = f_r(x) - f_r(x - gamma * u) - rho * ||u||^2 for each of the m worker gradient candidates {tilde_v_i}, sorts candidates in descending score order, and averages the top m - b candidates (with m > b >= q) to update the global model.
identity_notes: Distinct from majority-based geometric or coordinate-wise robust aggregation rules that require q < m/2 without a server validation loss check (Krum, Bulyan, Trimmed-Mean, Coordinate-Wise Median), and distinct from FLTrust (which computes a server reference gradient on a root dataset and ReLU-clips cosine similarities rather than evaluating loss descent f_r(x) - f_r(x - gamma u) - rho ||u||^2). Specifically denotes the Zeno algorithm of Xie, Koyejo, & Gupta (ICML 2019, PMLR 97:6893-6901, Definitions 2-3, Algorithm 1, Lemma 1, Theorem 1).
aliases:
- Zeno
- Zeno Distributed SGD
- Zeno Suspicion-Based Aggregation
- Stochastic Descendant Score Aggregation
