aio_mappings:
- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: The architecture recurrently encodes word sequences and uses recurrent episodic and answer
    states. The pinned recurrent-network concept is broader than this specific arrangement.
- target: AIO:GatedRecurrentUnit
  relation: related_match
  rationale: GRUs implement modules of the reported architecture. This is a component relation, not an
    equivalence between the complete DMN and one gating unit; the source-specific update convention is
    preserved.
limitations:
- This record describes the original DMN from the inspected arXiv version, not the later DMN+ architecture.
- The default recurrent episode and the support-supervised QA softmax-sum variant are distinct; end-to-end
  differentiability does not remove the reported gate supervision.
- Task-specific experiments, selected attention examples and finite iteration counts do not establish
  general reasoning or universal benefits from more passes.
- All ten pages of arXiv1506.07285v5 were visually read. Its title-page author list differs from current
  arXiv and PMLR metadata, as recorded in the source version note. Author code, other paper versions and
  training were not inspected. DRAFT remains.
