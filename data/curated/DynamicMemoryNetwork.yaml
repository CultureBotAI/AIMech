id: AIMech:DynamicMemoryNetwork
name: Dynamic Memory Network
aliases:
- DMN
- Dynamic Memory Networks
concept_kind: architecture
definition: A recurrent neural architecture that encodes an input and a question, repeatedly forms question-conditioned
  episodes from input facts to update a memory state, and generates an answer from that state.
identity_notes: Compared all 442 pinned AIO and 604 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 22, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 65 AIO and 88 native definitions, with every matched definition
  read. 8 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. The
  original DMN has contextual recurrent input facts, question-conditioned episodic gates, memory updates
  and an answer module. This is distinct from original Memory Networks, MemN2N soft key/value reads and
  KV-MemNN supplied key/value representations. DMN+ is a later successor requiring separate primary inspection;
  the inherited broad discovery lead remains partly addressed.
definition_evidence:
- source_id: kumar2016
  locator: Section 2, PDF pp. 2–4, Figures 2–3 and Equations 5–10
  relation: supports
claims:
- claim_id: input-question-and-memory-modules
  kind: mechanism
  statement: The architecture combines input, question, episodic-memory and answer modules. Its text input
    RNN encodes a word stream; for a multi-sentence input, hidden states at end-of-sentence tokens become
    fact representations. The question has a separate recurrent encoder sharing word embeddings, and its
    final vector initializes episodic memory. These contextual sentence states differ from independently
    embedded bag-of-words memories. The experiments use GRUs and also report trying LSTMs.
  evidence:
  - source_id: kumar2016
    locator: Sections 2.1–2.3, PDF pp. 2–3 and Figure 2
    relation: supports
- claim_id: episodic-gates-and-recurrent-scan
  kind: mechanism
  statement: For each pass, a two-layer gating function scores a fact using the question and previous
    memory, their elementwise interactions, absolute differences and bilinear terms. The default sigmoid
    gates are not a softmax-normalized distribution over facts. Equation 7 interpolates a GRU update with
    the previous scan state using each gate; the last scan state forms an episode, and another GRU updates
    episodic memory. The ordered fact scan and repeated memory passes are separate recurrences. The source
    GRU convention weights the old state by z and applies its reset gate after the recurrent projection
    in Equation 3.
  evidence:
  - source_id: kumar2016
    locator: Sections 2.1 and 2.3, PDF pp. 2–4, Equations 1–8 and memory update description
    relation: supports
- claim_id: qa-aggregation-and-supervision
  kind: scope
  statement: The bAbI experiment uses labeled supporting facts to supervise attention, initially training
    the gate loss alone and then combining gate and answer losses. It also reports a QA-specific alternative
    that replaces the recurrent episode with a softmax-weighted fact sum using the pre-sigmoid gate scores.
    This normalized-sum variant differs from the default gated recurrent scan. Despite the abstract describing
    only input-question-answer triplets, these QA results do not establish answer-only training or general
    unsupervised reasoning.
  evidence:
  - source_id: kumar2016
    locator: Section 2.5, PDF p. 4; Section 4.1, p. 6; contrast with Abstract, p. 1
    relation: supports
- claim_id: answer-and-stopping-variants
  kind: scope
  statement: The answer GRU starts from the final memory and conditions subsequent outputs on the previous
    generated output and question. For sequence tagging, an answer is triggered at each word and the partial
    episodic scan state replaces the final scan state. A special end-of-passes representation is described
    for deciding when to stop memory iterations, while experiments without explicit gate supervision use
    a maximum number of iterations. This does not establish an unlimited adaptive reasoning procedure
    or inspected implementation details of discrete feedback and stopping.
  evidence:
  - source_id: kumar2016
    locator: Sections 2.3–2.4, PDF p. 4, Equations 7–10 and stopping description
    relation: supports
- claim_id: separate-task-evaluation
  kind: limitation
  statement: The reported language tasks are trained independently using task-specific input/output choices,
    pretrained word vectors and selected hyperparameters. The experiments cover synthetic bAbI QA, root-level
    Stanford Sentiment Treebank sentiment evaluation and WSJ part-of-speech tagging. QA uses supporting-fact
    labels; the reported POS test score in Table 3 uses an ensemble of four selected models. These protocols
    do not demonstrate one jointly trained multitask model, universal superiority or zero-extra-supervision
    transfer.
  evidence:
  - source_id: kumar2016
    locator: Section 4, PDF pp. 5–7, Sections 4.1–4.3 and Tables 1–3
    relation: supports
- claim_id: passes-and-attention-interpretation
  kind: limitation
  statement: Additional memory passes help selected question-answering tasks but do not improve every
    reported setting monotonically; Table 4 shows lower sentiment accuracy with three passes than with
    two. Attention examples illustrate selected behavior and even include a mistaken focus in Figure 3;
    they are not a proof of a correct reasoning chain or causal attribution. Multitask and multimodal
    extensions are proposed future work in this source, distinct from the later DMN+ architecture.
  evidence:
  - source_id: kumar2016
    locator: Figure 3, PDF p. 3; Section 4.4 and Table 4, p. 7; Section 5 and Figures 4–5, p. 8
    relation: supports
