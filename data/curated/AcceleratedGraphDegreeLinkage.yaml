name: Accelerated graph degree linkage
definition: An approximate graph degree linkage algorithm that selects merges from maintained cluster-neighbor
  sets and updates those sets locally instead of searching every current cluster pair.
concept_kind: algorithm
identity_notes: 'AGDL is Zhang et al.’s named candidate-restricted approximation to GDL, not merely the
  exact additive-update implementation GDL-U. It retains the GDL affinity but can omit the globally best
  pair after approximate neighbor-set updates. It is distinct from JULE’s representation-learning procedure.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 214 preceding
  native IDs/names/aliases. Word-delimited fixed-string searches of both full checkouts, including ignored
  and hidden files, returned 31 lines each: existing SimCLR/InfoNCE component discussion, shared primary-source
  references and discovery/review context. Five native neighbors and seven exact AIO nodes with scoped
  synonyms and outgoing relations were inspected.'
limitations:
- The method approximates global merge selection, not the defining degree-product formula. It has no asserted
  guarantee of reproducing exact GDL merges or recovering a globally optimal partition.
- Kc and the initial neighbor sets affect which pairs remain eligible. The source’s local-update assumptions
  can fail; an omitted pair need not re-enter through an exhaustive search.
- The supplement’s quadratic complexity argument assumes small initial clusters, fixed K/K0/Kc and a bound
  on how many other clusters include a merged cluster in their neighbor sets. A universal worst-case quadratic
  guarantee is not inferred from that argument.
- Graph construction, initialization, irreversibility and prescribed cluster count have the same scope
  limitations as GDL. No implementation, speedup measurement or clustering benchmark was reproduced.
