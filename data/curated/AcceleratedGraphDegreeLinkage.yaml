claims:
- claim_id: method
  kind: mechanism
  statement: Use the same fixed directed neighbor graph, weak-component initialization and symmetric product-of-degree
    affinity as GDL. Initialize a Kc-nearest cluster set for each cluster. Search only pairs for which
    at least one cluster belongs to the other’s maintained neighbor set, and merge the highest-affinity
    eligible pair A,B. For any existing cluster whose set contains A or B, add A union B and compute the
    new pair affinity. Build the merged cluster’s set by choosing Kc nearest clusters from the union of
    the two old neighbor sets. Remove A and B from remaining neighbor sets and delete their sets. Repeat
    until the target cluster count. These local updates rely on heuristic persistence of cluster-neighbor
    relationships, rather than recomputing every nearest-cluster set exactly.
