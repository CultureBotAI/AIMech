claims:
- claim_id: laprador-iterative-contrastive-learning-cache-alignment
  kind: mechanism
  statement: Iterative Contrastive Learning (ICoL, Section 3.3, Equations 2-7, Figure 2) alternates training between E_Q (minimizing L_q = L_qd + lambda L_qq while E_D is frozen) and E_D (minimizing L_d = L_dq + lambda L_dd while E_Q is frozen), storing gradient-free representations from the currently frozen encoder in a large FIFO cache queue Q (capacity m = 100k) and clearing Q at every switch so that all fresh and cached negative instances in L_qd and L_dq reside in the exact same hidden space without requiring extra momentum encoders.
  evidence:
  - source_id: r762-primary-pdf
    locator: Section 3.3 Iterative Contrastive Learning & Section 4.2.1, Equations 2-7, Figure 2, Table 2, pp. 3-5, 7
    relation: supports
  - source_id: r762-primary-pdf
    locator: main() verification of icol_qd_loss negative expansion and zero hidden-space drift across cached frozen representations
    relation: supports
- claim_id: laprador-lexicon-enhanced-dense-retrieval
  kind: mechanism
  statement: Lexicon-Enhanced Dense Retrieval (LEDR, Section 3.4, Equations 8-9) multiplies the dense dual-tower cosine similarity sim(q, d) by the BM25 lexical matching score BM25(q, d), score(q, d) = sim(q, d) * BM25(q, d), improving zero-shot BEIR average nDCG@10 from 0.294 to 0.457 (unsupervised) and from 0.396 to 0.485 (fine-tuned) while running 22.5x faster on GPU than BM25 + cross-encoder reranking (Tables 1 and 3).
  evidence:
  - source_id: r762-primary-pdf
    locator: Section 3.4 & Sections 4.2-4.3, Equations 8-9, Tables 1 & 3, Figure 3, pp. 5-8
    relation: supports
  - source_id: r762-primary-pdf
    locator: main() verification of LEDR multiplicative score resolving pure-BM25 and pure-dense failure modes
    relation: supports
- claim_id: laprador-beir-zero-shot-applications
  kind: application
  statement: "Across the 18 zero-shot datasets of the BEIR benchmark, unsupervised LaPraDoR (pre-trained on C4 with weight sharing between E_Q and E_D) achieves 0.457 average nDCG@10\u2014outperforming supervised dense retrievers DPR (0.237), ANCE (0.389), GenQ (0.410), and TAS-B (0.415)\u2014and reaches 0.485 average nDCG@10 after MS MARCO fine-tuning (Table 1)."
  evidence:
  - source_id: r762-primary-pdf
    locator: Section 4.2 Experimental Results, Tables 1-4, pp. 6-8
    relation: supports
  - source_id: r762-metadata-cr
    locator: BibTeX citation record for arXiv:2203.06169
    relation: supports
- claim_id: laprador-zero-bm25-cutoff-and-pretraining-cost-limitation
  kind: limitation
  statement: Because LEDR multiplies sim(q, d) by BM25(q, d) and sets BM25 scores beyond the top-1,000 lexical candidates to zero for computational efficiency, documents with zero lexical overlap (or outside the BM25 top-1,000) receive a zero LEDR score regardless of their dense cosine similarity, and large-scale C4 pre-training requires 1M steps (~400 hours on 16 V100 GPUs).
  evidence:
  - source_id: r762-primary-pdf
    locator: Section 3.4 Equation 9 & Section 4.1 Model Settings and Training Details, pp. 5-6
    relation: supports
