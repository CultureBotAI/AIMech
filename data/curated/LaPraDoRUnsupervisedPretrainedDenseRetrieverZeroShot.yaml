id: AIMech:LaPraDoRUnsupervisedPretrainedDenseRetrieverZeroShot
name: LaPraDoR Iterative Contrastive Learning and Lexicon-Enhanced Dense Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: "An unsupervised dual-tower dense retrieval pre-training and zero-shot inference algorithm that combines Inverse Cloze Task (ICT) and Dropout as Positive Instance (DaPI) supervision under Iterative Contrastive Learning (ICoL)\u2014which alternates training between the query encoder E_Q (optimizing L_q = L_qd + lambda L_qq with E_D frozen while enqueuing frozen document embeddings into a FIFO cache queue Q) and the document encoder E_D (optimizing L_d = L_dq + lambda L_dd with E_Q frozen while enqueuing frozen query embeddings into Q, clearing Q whenever the active encoder switches so all cached negative representations lie in the exact same hidden space)\u2014and performs zero-shot retrieval via Lexicon-Enhanced Dense Retrieval (LEDR) by multiplying the mean-pooled cosine similarity sim(q, d) with the BM25 lexical score: score(q, d) = sim(q, d) * BM25(q, d)."
identity_notes: Distinct from MoCo (AIMech:MomentumContrastiveLearning) and xMoCo, which maintain slow momentum-updated target encoders whose older queued representations drift across different hidden spaces over training steps; distinct from Contriever (AIMech:ContrieverUnsupervisedDenseInformationRetrievalWithContrastiveLearning), which uses a MoCo momentum queue with random cropping and inverse cloze without alternating frozen-encoder cache clearing or multiplicative BM25 scoring; and distinct from COIL (AIMech:COILContextualizedInvertedList), which stores contextualized token vectors in an inverted list rather than multiplying a single global mean-pooled cosine similarity with BM25.
aliases:
- LaPraDoR
- Large-scale Pretrained Dense Zero-shot Retriever
- ICoL and LEDR for Unsupervised Zero-Shot Dense Retrieval
