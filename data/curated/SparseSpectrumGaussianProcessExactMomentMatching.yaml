claims:
- claim_id: fixed-feature-posterior
  kind: mechanism
  statement: For fixed frequencies omega_i, the source uses a 2m-dimensional feature vector with cosine
    and sine entries scaled by sigma_k=sigma_f/sqrt(m). For n training input/response pairs, Phi=[phi(x_1),...,phi(x_n)]
    is the 2m by n feature-design matrix and y=[y_1,...,y_n]^T is the n-vector of scalar training responses.
    With Gaussian coefficient prior N(0,I) and scalar Gaussian observation noise of variance sigma_n^2,
    its trained coefficient posterior is N(alpha,S), where alpha=A^{-1}*Phi*y, S=sigma_n^2*A^{-1} and
    A=Phi*Phi^T+sigma_n^2*I. The fixed-input response has mean alpha^T*phi(x) and variance sigma_n^2+phi(x)^T*S*phi(x).
    Uncertain-input prediction integrates a prescribed X~N(mu,Sigma) independently of this fixed coefficient
    posterior, conditional on the training data, frequencies and hyperparameters. These prediction methods
    do not require one particular training solver once the posterior coefficient moments are supplied.
  evidence:
  - source_id: pan2017
    locator: Section 2, Equations 4, 6–7 and following remark, PDF pp. 2–3; Section 3 assumptions, PDF
      p. 3
    relation: supports
  - source_id: pan2017-supp
    locator: Sections 2–3.1, Equations 1–5 and Gaussian-input assumptions, PDF pp. 1–2
    relation: supports
- claim_id: exact-feature-moments
  kind: mechanism
  statement: Let q=E[phi(X)] and Psi=E[phi(X)*phi(X)^T]. SSGP-EMM computes E[Y]=alpha^T*q and Var[Y]=sigma_n^2+tr(S*Psi)+alpha^T*(Psi-q*q^T)*alpha,
    then represents the output by a Gaussian with these moments. Gaussian characteristic-function identities
    give E[cos(omega^T*X)]=exp(-omega^T*Sigma*omega/2)*cos(omega^T*mu), with sine in place of cosine for
    E[sin]. Product-to-sum identities at frequency sums and differences give Psi. These are exact first
    two moments of the fixed finite-feature posterior under the stated independent Gaussian input, not
    exact moments of the original infinite-rank kernel model or integration over frequencies and hyperparameters.
  evidence:
  - source_id: pan2017
    locator: Section 3.1, Equations 8–9, Proposition 1 and feature-product blocks, PDF pp. 3–4
    relation: supports
  - source_id: pan2017-supp
    locator: Sections 3.1–3.2 and 3.4, PDF pp. 3–5
    relation: supports
- claim_id: cross-covariances
  kind: mechanism
  statement: For a column-vector input, Cov(X,Y)=Cov(X,phi(X))*alpha. The cosine feature column is -sigma_k*Sigma*omega_i*E[sin(omega_i^T*X)]
    and the sine feature column is sigma_k*Sigma*omega_i*E[cos(omega_i^T*X)], with sigma_k the feature
    scale. For distinct conditionally independent scalar output models a and b with independent residual
    noises, Cov(Y_a,Y_b)=alpha_a^T*(Psi_ab-q_a*q_b^T)*alpha_b, where Psi_ab=E[phi_a(X)*phi_b(X)^T]. Shared
    input uncertainty can therefore correlate outputs even when their conditional distributions factorize.
    Conditional cross-output covariance or correlated noise would require an additional term.
  evidence:
  - source_id: pan2017
    locator: Section 3.1, Equations 10–11 and Proposition 2, PDF p. 4
    relation: supports
  - source_id: pan2017-supp
    locator: Sections 3.1, 3.3–3.4, PDF pp. 3–5; Section 6.1, PDF p. 12
    relation: supports
- claim_id: gaussian-shape-boundary
  kind: limitation
  statement: Matching exact first two moments does not make the nonlinear predictive mixture Gaussian.
    As a curator boundary illustration, fixed coefficient Y=cos(X) with X~N(0,1) has mean exp(-1/2), variance
    (1+exp(-2))/2-exp(-1)>0 and support [-1,1]. Its moment-matched Gaussian has unbounded support. This
    uses deterministic coefficients and no observation noise as a limiting finite-feature example, not
    a fitted SSGP experiment. Direct deterministic quadrature of a separate nondegenerate two-feature
    Gaussian coefficient example checks moment and covariance formulas without establishing general empirical
    accuracy.
  evidence:
  - source_id: pan2017
    locator: Section 3, distinction between the predictive integral and Gaussian approximation, PDF p.
      3; Proposition 1, PDF p. 3
    relation: supports
  - source_id: pan2017-supp
    locator: Section 3 introductory assumptions and Section 3.4, PDF pp. 2 and 5
    relation: supports
- claim_id: sequential-use
  kind: limitation
  statement: The source uses these prediction transforms inside Bayesian filtering and future-state prediction
    for control. Gaussian moment propagation alone does not retain the full predictive shape or all dependence
    between a repeatedly used uncertain dynamics function and subsequent states. Hewing and colleagues
    explicitly analyze the successive-evaluation independence approximation in Pan-style trajectory prediction.
    This prediction transform is therefore not an exact shared-function trajectory inference algorithm
    or, by itself, a complete filter or controller.
  evidence:
  - source_id: pan2017
    locator: Section 4.1 prediction and filtering stages, PDF pp. 5–6; Section 4.2, PDF pp. 6–7
    relation: supports
  - source_id: hewing2020
    locator: Introduction and Sections 2–3, PDF pp. 1–4; distinct trajectory constructions, PDF pp. 5–7
    relation: supports
