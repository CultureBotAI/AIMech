- claim_id: primal-dual-lp-rankscore-interpolation-sparsity-and-post-l1-qr-debiasing
  kind: mechanism
  statement: The primal $\ell_1$-QR linear program (Eq. C.1) and dual rankscore linear program $\max_{a \in [u-1, u]^n} \mathbb{E}_n[y_i a_i]$ subject to $|\mathbb{E}_n[x_{ij} a_i]| \le \frac{\lambda\sqrt{u(1-u)}}{n}\widehat{\sigma}_j$ ($j=1,\dots,p$, Eq. C.2) satisfy complementary slackness $\widehat{\beta}_j(u) \ne 0 \implies |\mathbb{E}_n[x_{ij} \widehat{a}_i(u)]| = \frac{\lambda\sqrt{u(1-u)}}{n}\widehat{\sigma}_j$, and under continuous response distributions any basic optimal solution interpolates exactly $I_u = |\widehat{T}_u| = \|\widehat{\beta}(u)\|_0$ observations $y_i = x_i'\widehat{\beta}(u)$ (Lemma 9, Eqs. C.3-C.4, pp. 33-34), which together with the maximal sparse eigenvalue $\phi_{\max}(m)$ guarantees uniform sparsity $\widehat{s} = \sup_{u \in \mathcal{U}} |\widehat{T}_u| \lesssim_P s$ (Theorem 3, Eq. 2.11, p. 11; Lemmas 10-13, pp. 35-38). Consequently, the post-$\ell_1$-QR estimator $\widetilde{\beta}(u)$ (Eq. 2.5) eliminates $\ell_1$-shrinkage bias on $\widehat{T}_u$ and achieves $\sup_{u \in \mathcal{U}} \|\widetilde{\beta}(u) - \beta(u)\|_{J_u} \lesssim_P \sqrt{\frac{(\widehat{s} \vee s)\log(p \vee n)}{n\phi_{\min}(\widehat{s} + s)}} + \sup_{u \in \mathcal{U}} \sqrt{Q_u(\beta_{T_u \setminus \widehat{T}_u}(u)) - Q_u(\beta(u))}$ regardless of whether $\widehat{T}_u$ achieves exact support recovery (Theorem 5, Eq. 2.14, p. 13; Appendix D, Lemmas 14-18, pp. 39-44).
  evidence:
