claims:
- claim_id: distribution-free-conditional-pivotality-of-rankscore-supremum-process
  kind: mechanism
  statement: Under Condition D.1, the conditional quantile identity $F_{y_i \mid x_i}(x_i'\beta(u) \mid x_i) = u$ implies that the indicator $\mathbb{1}\{y_i \le x_i'\beta(u)\} = \mathbb{1}\{u_i \le u\}$ is a function solely of latent independent uniforms $u_1, \dots, u_n \stackrel{\text{i.i.d.}}{\sim} \operatorname{Uniform}(0, 1)$ independent of $X$. Consequently, the maximal rescaled rankscore process $\Lambda = n\sup_{u \in \mathcal{U}} \max_{1 \le j \le p} |\mathbb{E}_n[\frac{x_{ij}(u - \mathbb{1}\{u_i \le u\})}{\widehat{\sigma}_j\sqrt{u(1-u)}}]|$ (Eq. 2.6) is conditionally pivotal given $X$ (its conditional distribution is identical across Gaussian, Cauchy, and heteroscedastic location-scale conditional distributions without any unknown noise scale parameter), its conditional $(1-\alpha)$-quantile $\Lambda(1 - \alpha \mid X)$ can be computed to arbitrary precision by Monte Carlo simulation of $u_1, \dots, u_n \sim \operatorname{Uniform}(0, 1)$, and Theorem 1 (Eq. 2.8, p. 10) proves $\Lambda \le K_{\mathcal{U}} W_{\mathcal{U}}\sqrt{n\log(p/\gamma_n)}$ with conditional probability at least $1 - \gamma_n - 4\gamma_n/p$ where $W_{\mathcal{U}} = \sup_{u \in \mathcal{U}} [u(1-u)]^{-1/2}$.
  evidence:
  - source_id: bc2011-l1qr-pdf
    locator: Section 2.3, pp. 6-7, Equations (2.6)-(2.7); Section 2.5, p. 10, Equation (2.8), Theorem 1; Section 3.2, pp. 17-18, Lemma 2; Appendix A, pp. 25-28, Proof of Lemma 2 and Theorem 1
    relation: supports
