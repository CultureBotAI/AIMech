- claim_id: restricted-nonlinear-impact-minorization-and-uniform-near-oracle-convergence
  kind: mechanism
  statement: 'On the pivotal rankscore domination event $\lambda \ge \frac{c_0 + 3}{c_0 - 3}\Lambda$ ($c_0 > 3$), Lemma 3 (Eq. 3.2, p. 18) forces the estimation error $\delta_u = \widehat{\beta}(u) - \beta(u)$ into the restricted cone $A_u = \{\delta \in \mathbb{R}^p : \|\delta_{T_u^c}\|_{1,n} \le c_0\|\delta_{T_u}\|_{1,n}\}$ uniformly for all $u \in \mathcal{U}$. Under Condition D.4, which defines the Restricted Eigenvalue $\kappa_u = \inf_{\delta \in A_u,\, \delta \ne 0} \frac{\|J_u^{1/2}\delta\|}{\|\delta_{T_u}\|_2} \ge \kappa > 0$ ($J_u = \mathbb{E}[f_{y_i \mid x_i}(x_i''\beta(u) \mid x_i)x_i x_i'']$) and the Restricted Nonlinear Impact (RNI) coefficient $q_u = \frac{3}{8}\frac{\underline{f}^{3/2}}{\bar{f}''}\inf_{\delta \in A_u,\, \delta \ne 0} \frac{\mathbb{E}[|x_i''\delta|^2]^{3/2}}{\mathbb{E}[|x_i''\delta|^3]} \ge q > 0$ (p. 8), Lemma 4 (Eq. 3.7, p. 19; Appendix B, Eq. B.4, p. 30) establishes the piecewise quadratic-linear population minorization $Q_u(\beta(u) + \delta) - Q_u(\beta(u)) \ge \min(\|J_u^{1/2}\delta\|^2 / 4,\, q\|J_u^{1/2}\delta\|)$ for all $\delta \in A_u$, yielding the uniform near-oracle convergence bound $\sup_{u \in \mathcal{U}} \|\widehat{\beta}(u) - \beta(u)\|_{J_u} \lesssim_P \frac{1}{\kappa}\sqrt{\frac{s\log(p \vee n)}{n}}$ whenever $\frac{\sqrt{s\log(p \vee n)}}{\sqrt{n}(\kappa \wedge q)} \to 0$ (Theorem 2, Eq. 2.10, p. 11).'
