    locator: Section 2.5, pp. 11-14, Equations (2.11)-(2.14), Theorems 3-5; Appendix C, pp. 33-38, Equations (C.1)-(C.12), Lemmas 9-13; Appendix D, pp. 39-44, Lemmas 14-18
    relation: supports
