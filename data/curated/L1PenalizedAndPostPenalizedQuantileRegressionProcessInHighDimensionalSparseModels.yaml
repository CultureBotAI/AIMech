id: AIMech:L1PenalizedAndPostPenalizedQuantileRegressionProcessInHighDimensionalSparseModels
name: L1-Penalized and Post-Penalized Quantile Regression Process in High-Dimensional Sparse Models
review_status: DRAFT
concept_kind: algorithm
aliases:
- l1-Penalized Quantile Regression Process
- Post-l1-Penalized Quantile Regression
- Belloni-Chernozhukov Pivotal Rankscore High-Dimensional Quantile Regression
- l1-QR and Post-l1-QR under Restricted Nonlinear Impact
definition: 'L1-Penalized and Post-Penalized Quantile Regression Process in High-Dimensional Sparse Models is a family of distribution-free pivotal regularized and post-selection refitted conditional quantile estimators introduced by Belloni and Chernozhukov (2011, The Annals of Statistics 39(1):82-130, DOI:10.1214/10-AOS827, arXiv:0904.2931v5) for the conditional quantile function $F_{y_i \mid x_i}^{-1}(u \mid x_i) = x_i''\beta(u)$ uniformly over a compact quantile index set $u \in \mathcal{U} \subset (0, 1)$ when $p \gg n$ and $|\operatorname{supp}(\beta(u))| = s_u \le s \ll n$. The $\ell_1$-QR estimator minimizes the check-loss empirical risk $\widehat{Q}_u(\beta) = \mathbb{E}_n[\rho_u(y_i - x_i''\beta)]$ ($\rho_u(t) = (u - \mathbb{1}\{t \le 0\})t$) plus a quantile-and-covariate standardized $\ell_1$ penalty, $\widehat{\beta}(u) \in \arg\min_{\beta \in \mathbb{R}^p} \widehat{Q}_u(\beta) + \frac{\lambda\sqrt{u(1-u)}}{n}\sum_{j=1}^p \widehat{\sigma}_j |\beta_j|$ (Eq. 2.4), while the post-$\ell_1$-QR estimator refits unpenalized quantile regression over the selected support $\widehat{T}_u = \operatorname{supp}(\widehat{\beta}(u))$, $\widetilde{\beta}(u) \in \arg\min_{\beta \in \mathbb{R}^p : \beta_{\widehat{T}_u^c} = 0} \widehat{Q}_u(\beta)$ (Eq. 2.5). Because the probability integral transform $u_i = F_{y_i \mid x_i}(y_i \mid x_i) \sim \operatorname{Uniform}(0, 1)$ makes the maximal rescaled rankscore supremum $\Lambda = n\sup_{u \in \mathcal{U}} \max_{1 \le j \le p} |\mathbb{E}_n[\frac{x_{ij}(u - \mathbb{1}\{u_i \le u\})}{\widehat{\sigma}_j\sqrt{u(1-u)}}]|$ (Eq. 2.6) conditionally pivotal given $X$ across all continuous conditional response distributions, setting $\lambda = c\cdot\Lambda(1 - \alpha \mid X)$ ($c > 1$, Eq. 2.7) achieves uniform near-oracle convergence $\sup_{u \in \mathcal{U}} \|\widehat{\beta}(u) - \beta(u)\|_{J_u} \lesssim_P \sqrt{(s/n)\log(p \vee n)}$ under the Restricted Nonlinear Impact (RNI) condition (Theorem 2), uniform sparsity $\sup_{u \in \mathcal{U}} \|\widehat{\beta}(u)\|_0 \lesssim_P s$ (Theorem 3), and rate-optimal post-selection refitting even when first-stage variable selection misses small non-zero coefficients (Theorem 5).'
identity_notes: 'Distinct from Square-Root LASSO (`AIMech:SquareRootLassoPivotalConicSparseRegression`) and Scaled LASSO (`AIMech:ScaledLassoAndHuberConcomitantPenalizedJointSparseRegression`), which estimate a single conditional mean regression vector $\beta_0$ under squared-error or root-MSE loss, whereas Belloni & Chernozhukov (2011) estimate an entire conditional quantile process $\{\beta(u) : u \in \mathcal{U}\}$ under the non-differentiable piecewise-linear check loss $\rho_u(t)$ via linear programming (LP) primal-dual rankscore duality (Eqs. C.1-C.2), distribution-free uniform rankscore pivotality (Eq. 2.6), and the Restricted Nonlinear Impact (RNI) minorization coefficient $q$ (Condition D.4, Lemma 4). Also distinct from Conformalized Quantile Regression (`AIMech:ConformalizedQuantileRegression`), which wraps arbitrary black-box quantile predictors in a split-conformal calibration step for prediction intervals rather than performing high-dimensional $\ell_1$-penalized and post-penalized parameter recovery.'
