id: AIMech:LiteTransformerWithLongShortRangeAttention
name: Lite Transformer with Long-Short Range Attention (LSRA)
concept_kind: architecture
review_status: DRAFT
definition: 'Lite Transformer with Long-Short Range Attention (LSRA) is a computation- and memory-efficient Transformer architecture for resource-constrained mobile NLP (<500M Mult-Adds, <10M parameters) that eliminates the standard 1:4 FFN channel expansion bottleneck by flattening the attention and FFN channel dimensions and replaces standard multi-head attention with a parallel two-branch LSRA primitive: the input channels are split equally into two d/2 halves, where the global extractor branch applies multi-head self-attention to capture sparse long-range relationships and the local extractor branch applies gated linear units (GLU) and lightweight depthwise separable 1D convolutions to capture diagonal local neighborhood context before channel concatenation and FFN mixing.'
identity_notes: Distinct from Evolved Transformer (So et al., 2019), which stacks convolution and self-attention layers sequentially rather than in parallel channel-split branches and retains the 1:4 FFN bottleneck, distinct from LightConv (Wu et al., 2019), which replaces self-attention entirely with lightweight convolutions and lacks a global attention branch, and distinct from MobileBERT (AIMech:MobileBERTCompactTaskAgnosticBERTWithBottlenecks), which narrows intra-block channels via linear bottlenecks rather than flattening the FFN and splitting channels across parallel attention and convolution extractors.
aliases:
- Lite Transformer
- Long-Short Range Attention
- LSRA Lite Transformer
