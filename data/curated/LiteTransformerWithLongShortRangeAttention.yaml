claims:
- claim_id: lite-transformer-flattened-bottleneck-for-1d-attention
  kind: mechanism
  statement: For typical 1D NLP sequence lengths N (~20-30 tokens), the standard Transformer 1:4 bottleneck between attention O(4 N d^2 + N^2 d) and FFN O(2 * 4 N d^2) causes the context-agnostic FFN to consume the majority of Mult-Adds (754M vs 582M in Transformer-Base); Lite Transformer flattens this bottleneck so that attention and FFN share the same channel dimension, shifting the computational budget to the context-capturing module.
  evidence:
  - source_id: r817-primary-pdf
    locator: Section 3 (Is Bottleneck Effective for 1-D Attention?), Figure 2, pp. 3-4
    relation: supports
  - source_id: r817-primary-pdf
    locator: transformer_block_mult_adds and main
    relation: supports
- claim_id: lite-transformer-parallel-channel-split-long-short-range-attention
  kind: mechanism
  statement: Long-Short Range Attention (LSRA) splits the input along the channel dimension into two equal d/2 groups (reducing branch computation by 2x) and processes them side-by-side through a global multi-head self-attention branch (which specializes in off-diagonal long-range token dependencies) and a local GLU + lightweight depthwise convolution branch (which captures diagonal neighborhood correlations), followed by FFN channel mixing.
  evidence:
  - source_id: r817-primary-pdf
    locator: Section 4 (Long-Short Range Attention) and Section 5.3 (Architecture), Figure 3, pp. 4-5, 7
    relation: supports
  - source_id: r817-primary-pdf
    locator: lsra_dual_branch_mult_adds and lsra_forward_split_and_concat
    relation: supports
- claim_id: lite-transformer-mobile-translation-summarization-and-compression
  kind: application
  statement: Under mobile constraints (500M/100M MACs), Lite Transformer outperforms vanilla Transformer by +1.2/+1.7 BLEU on WMT'14 En-Fr and by +3.1 BLEU on IWSLT'14 De-En (<100M MACs), reduces Transformer-Base computation by 2.5x (and model size by 18.2x to 9.7 MB when combined with pruning and 8-bit k-means quantization), lowers WikiText-103 test perplexity by 1.8, and beats Evolved Transformer by +0.5 BLEU with 19,567x lower CO2 design cost.
  evidence:
  - source_id: r817-primary-pdf
    locator: Section 6.1-6.3, Tables 1-5 and Figures 4-5, pp. 7-10
    relation: supports
- claim_id: lite-transformer-quadratic-global-branch-scaling-and-manual-kernel-limitation
  kind: limitation
  statement: Because the global extractor branch retains standard O(N^2 (d/2)) pairwise dot-product self-attention on half of the channels and the local branch uses manually specified layer-wise convolution kernel sizes (e.g., [3, 5, 7, 31x3]), quadratic sequence-length scaling still re-emerges for very long sequences N >> d.
  evidence:
  - source_id: r817-primary-pdf
    locator: Section 3 (computation scaling N^2 d) and Section 5.3 (Architecture kernel sizes), pp. 3-4, 7
    relation: supports
