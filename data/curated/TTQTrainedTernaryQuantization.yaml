id: AIMech:TTQTrainedTernaryQuantization
name: TTQ (Trained Ternary Quantization)
concept_kind: algorithm
review_status: DRAFT
definition: TTQ (Trained Ternary Quantization) is a neural network weight quantization method that compresses full-precision weights into 2-bit asymmetric ternary values {-W_l^n, 0, +W_l^p} per layer l by normalizing latent full-precision weights w_tilde_l into [-1, 1], thresholding by Delta_l = t * max(|w_tilde_l|) (or a constant sparsity ratio r), and jointly training both the asymmetric positive and negative scaling coefficients (W_l^p, W_l^n) via summed intra-bucket gradients (Eq. 7) and the ternary assignments via asymmetrically scaled latent-weight gradients dL/dw_tilde_l in {W_l^p * dL/dw_l^t, 1 * dL/dw_l^t, W_l^n * dL/dw_l^t} (Eq. 8).
identity_notes: Distinct from symmetric Ternary Weight Networks (TWN), which tie positive and negative ternary magnitudes to a single analytical scale W_l with heuristic threshold 0.7 * E(|w|), and distinct from uniform k-bit weight quantizers such as DoReFa-Net (AIMech:DoReFaNetTrainingLowBitwidthConvolutionalNeuralNetworksWithLowBitwidthGradients).
aliases:
