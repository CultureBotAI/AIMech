claims:
- claim_id: ttq-asymmetric-ternary-quantization-and-threshold-rule
  kind: mechanism
  statement: TTQ normalizes latent full-precision weights w_tilde_l to [-1, 1] via maximum-magnitude division (Eq. 5) and assigns ternary weights w_l^t = +W_l^p for w_tilde_l > Delta_l, 0 for |w_tilde_l| <= Delta_l, and -W_l^n for w_tilde_l < -Delta_l (Eq. 6), where the threshold Delta_l = t * max(|w_tilde_l|) (Eq. 9, typically t = 0.05) or is set to maintain a constant layer sparsity ratio r.
  evidence:
  - source_id: r823-primary-pdf
    locator: Section 3, Equations 5-6 and 9, pp. 3-4
    relation: supports
  - source_id: r823-primary-pdf
    locator: ttq_quantize
    relation: supports
- claim_id: ttq-joint-scale-and-latent-assignment-gradient-backpropagation
  kind: mechanism
  statement: During backpropagation, TTQ updates the per-layer positive and negative scaling coefficients via dL/dW_l^p = sum_{i in I_l^p} dL/dw_l^t(i) and dL/dW_l^n = sum_{i in I_l^n} dL/dw_l^t(i) (Eq. 7) and updates the latent weights via piecewise scaled gradients dL/dw_tilde_l = W_l^p * dL/dw_l^t for w_tilde_l > Delta_l, 1 * dL/dw_l^t for |w_tilde_l| <= Delta_l, and W_l^n * dL/dw_l^t for w_tilde_l < -Delta_l (Eq. 8).
  evidence:
  - source_id: r823-primary-pdf
    locator: Section 3, Equations 7-8 and Figure 1, pp. 3-4
    relation: supports
  - source_id: r823-primary-pdf
    locator: ttq_backward and main
    relation: supports
- claim_id: ttq-16x-weight-compression-exceeding-or-matching-fp32-on-cifar-and-imagenet
  kind: application
  statement: TTQ reduces weight storage from 32 bits to 2 bits (~16x model compression) with 30%-50% zero-weight sparsity while outperforming full-precision baselines on CIFAR-10 (ResNet-20, 32, 44, 56) and AlexNet on ImageNet (57.5% vs. 57.2% top-1 accuracy) and matching ResNet-18 within 3% top-1 accuracy.
  evidence:
  - source_id: r823-primary-pdf
    locator: Section 4.1-4.2, Tables 1-3 and Figures 2-3, pp. 5-7
    relation: supports
- claim_id: ttq-full-precision-activations-and-first-last-layer-exclusion
  kind: limitation
  statement: TTQ quantizes only network weights (keeping activations and gradients in 32-bit floating point) and leaves the first convolutional layer and final fully connected layer in full precision across CIFAR-10 and ImageNet experiments.
  evidence:
  - source_id: r823-primary-pdf
    locator: Section 4.1 (p. 5) and Section 4.2 (AlexNet and ResNet-18, pp. 5-7)
    relation: supports
