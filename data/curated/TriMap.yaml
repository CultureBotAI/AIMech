  relation: supports
claims:
- claim_id: method-scope
  kind: mechanism
  statement: Sample neighbor-versus-farther triplets and additional randomly selected triplets ordered
    by input proximity. Weight triplets using input-distance differences and the version-specific smoothing
    rule. Minimize the sum of weighted s(i,k)/(s(i,j)+s(i,k)) losses with s(i,j)=1/(1+||y_i−y_j||²), commonly
    starting from scaled PCA coordinates and using momentum-based full-batch optimization. The inspected
    revision describes shifted tempered-log weights and updated triplet counts separately from older experimental
    settings.
  evidence:
  - source_id: original-paper
    locator: Section 3, PDF pp. 4–5; version-update notice on p. 1; global-score definition, Section 2,
      pp. 3–4
    relation: supports
- claim_id: initialization-and-version-limit
  kind: limitation
  statement: 'Wang et al. challenge attributing global layout solely to the triplet loss: their analysis
    emphasizes initialization and the limited range of attractive and repulsive forces. Their inspected
    TriMap definition uses 55 triplets per point and the older exponential/log weight rule, so this qualification
    is version-scoped rather than a claim about all later code.'
  evidence:
  - source_id: initialization-analysis
    locator: Sections 3.3, 5.1 and 6.1–6.2, PDF pp. 10–11, 28–30 and 33–36; Figure 11, p. 29
    relation: supports
