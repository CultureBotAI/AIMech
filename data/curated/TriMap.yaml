name: TriMap
definition: A nonlinear dimensionality-reduction algorithm that selects weighted triplet comparisons from
  high-dimensional data and optimizes embedding coordinates to favor the corresponding ordering of pairwise
  similarities.
concept_kind: algorithm
identity_notes: TriMap denotes the sampled triplet embedding algorithm, not a three-valued segmentation
  trimap, generic ordinal embedding, its PCA-based global score, or PaCMAP’s pair losses. Version updates
  to sampling and weights are retained as method variations, not silently mixed with the older experiments.
  All 442 pinned AIO labels/scoped synonyms and 114 preceding native identities were compared, together
  with hidden/ignored-inclusive searches of both checkouts; source citations and pending frontier mentions
  were distinguished from existing concept identities.
limitations:
- Triplet sampling, weighting, initialization and input metric influence the layout; minimizing the sampled
  objective does not guarantee satisfaction of every possible triplet or recovery of a unique manifold.
- The v2 PDF says its displayed experiments use older code. It updates counts from 10×5+5 to 12×4+3 and
  replaces the earlier weight transformation; these are not results for a single identical software version.
- Wang et al.’s initialization critique studies the older 55-triplet construction and should not be treated
  as a direct benchmark of every later revision.
- The separately proposed global score is based on linear reconstruction relative to PCA; it is not a
  universal geometric-fidelity certificate, and its displayed normalization requires nonzero PCA residual
  error.
