name: Residual Attention Network
definition: A convolutional-network architecture that stacks attention modules combining trunk features
  with learned bottom-up and top-down masks through residual attention gating.
concept_kind: architecture
identity_notes: This record covers the 2017 architecture with its canonical mixed sigmoid masks and attention
  residual learning. It is a network construction rather than a single attention block, trained model
  or generic ResNet. Named depths such as Attention-56 and Attention-92 configure this architecture; constrained
  channel/spatial mask variants are not silently substituted for the selected mixed-mask procedure. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 282 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 2 and 2 lines respectively. Every text hit was a prior candidate lead or a closely
  related variant lead. Ten exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and
  five native neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.
limitations:
- Attention residual learning uses (1+M)*T, not raw-input addition x+M*T and not the naive product M*T.
  A near-zero mask preserves the trunk output T, which need not equal the module input x. Residual units
  within the trunk are a separate architectural choice.
- For the selected sigmoid mask, one-plus-mask lies between one and two for finite real logits. Immediate
  trunk magnitudes are therefore not attenuated; noise suppression in the source is a relative or network-level
  interpretation. The source’s L2-normalized channel-mask variant does not necessarily obey these sigmoid
  bounds.
- The gradient formula with factor M in Equation2 describes the naive product. For fixed mask and separate
  trunk parameters, the residual formulation instead has factor1+M. It does not by itself prevent an erroneous-label
  gradient or guarantee robustness, gradient stability or monotonically improving accuracy with depth.
- Masks are learned feature weights, not calibrated object probabilities or causal explanations. The paper’s
  classification and noisy-label experiments have specific conditions; detection/segmentation are proposed
  follow-up applications. No benchmark superiority, unlimited depth or author-code execution is asserted.
