claims:
- claim_id: method
  kind: mechanism
  statement: Stack attention modules at successive network stages. Within a module, a trunk branch computes
    convolutional features while a mask branch pools down to broader context and upsamples through a top-down
    path, with skip connections between scales. The source uses max pooling, bilinear interpolation, intermediate
    feature-processing units, two final 1-by-1 convolutions and an elementwise sigmoid to form a mask
    matching the trunk tensor in spatial positions and channels. Combine them as one-plus-mask multiplied
    elementwise by the trunk output. This retains the trunk signal when the mask approaches zero while
    allowing input-dependent relative emphasis. The source composes these modules with feature-processing
    units and a classifier; numbers of modules, stage widths, branch depths and basic units are architecture
    choices. The bottom-up/top-down process is implemented in a single feedforward computation, not an
    iterative recurrent feedback loop.
