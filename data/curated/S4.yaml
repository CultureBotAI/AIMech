name: Structured state space sequence model
definition: A structured linear state-space sequence model whose normal-plus-low-rank state matrix is
  transformed to diagonal-plus-low-rank form for efficient convolution-kernel computation and recurrent
  sequence evaluation.
concept_kind: model_family
identity_notes: S4 denotes Gu, Goel and Ré's specific structured state-space construction, not every state-space
  model, S4D, an exponential-smoothing model, or Mamba's input-dependent selective state updates. Deep
  S4 networks compose these linear models with channel mixing and nonlinearities.
limitations:
- This record follows arXiv v3's original diagonal-minus-PQ* parameterization. Section 3.4 notes possible
  numerical instability with right-half-plane eigenvalues and points to a later diagonal-minus-PP* revision;
  stability is not asserted unconditionally.
- The core S4 model is linear. A deep nonlinear S4 network adds channel mixing and nonlinear transformations;
  kernel computation is not the complete network.
- No universal accuracy, memory or wall-clock advantage is asserted.
