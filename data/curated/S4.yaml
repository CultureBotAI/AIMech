claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Bilinear discretization gives recurrent and zero-initial-state convolutional views. A unitary
    basis change produces a diagonal-plus-low-rank state matrix; Cauchy-kernel evaluations, a low-rank
    Woodbury correction and an inverse FFT compute the finite convolution kernel.
