id: AIMech:GradientCentralizationOptimization
name: Gradient Centralization
concept_kind: algorithm
review_status: DRAFT
definition: 'A hyperparameter-free projected-gradient optimization technique for deep neural networks that operates directly on the weight gradient matrix or unfolded convolutional gradient tensor grad_W L in R^{M x N} (where M = C_in for fully connected layers and M = C_in k_1 k_2 for convolutional layers, and N = C_out) by subtracting the mean across input dimensions from each column vector grad_{w_i} L in R^M before the optimizer step: Phi_GC(grad_{w_i} L) = grad_{w_i} L - (1 / M) sum_{j=1}^M grad_{W_{j,i}} L, or in matrix form Phi_GC(grad_W L) = P grad_W L with orthogonal projection matrix P = I - e e^T (e = (1 / sqrt(M)) 1).'
identity_notes: 'Distinct from activation normalizations (Batch Normalization, Layer Normalization, Group Normalization) and from weight reparameterizations (Weight Normalization, Weight Standardization): whereas Weight Standardization enforces e^T w = 0 directly on weights and therefore breaks pretrained ImageNet checkpoints whose initial weights have non-zero mean e^T w^0 != 0, Gradient Centralization projects gradients onto the hyperplane e^T (w - w^0) = 0, preserving any pretrained initialization w^0 while embedding into SGDM, Adam, or AdamW in a single line of code.'
aliases:
- GC
- Gradient Centralization Operator
- Phi_GC
- Projected Zero-Mean Gradient Centralization
