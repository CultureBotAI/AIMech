claims:
- claim_id: c-r625-hyperplane-projection-and-weight-mean-conservation
  kind: mechanism
  statement: The Gradient Centralization matrix P = I - e e^T (where e = (1 / sqrt(M)) 1) satisfies P^2 = P = P^T and e^T P grad_W L = 0 (Eq. 3 and Eq. 9), so replacing grad_{w^t} L by P grad_{w^t} L performs projected gradient descent on the affine hyperplane e^T (w - w^0) = 0 (Eq. 4), holding e^T w^t = e^T w^0 exactly constant throughout training for any initialization w^0.
  evidence:
  - source_id: r625-primary-pdf
    locator: Section 4.1 Eq. (3)-(4) & Figure 2, p. 6-7; Appendix A1-A2 Eq. (9), p. 15-16
    relation: supports
- claim_id: c-r625-output-feature-constant-intensity-shift-invariance
  kind: mechanism
  statement: Theorem 4.1 (Eq. 5 and Appendix A1 Eq. 7-8) proves that when SGD or SGDM with Gradient Centralization updates a weight vector w^t = w^0 - P sum_{i=0}^{t-1} alpha^{(i)} grad_{w^{(i)}} L, the output activation difference for any input feature x and constant intensity shift x + gamma 1 satisfies (w^t)^T x - (w^t)^T (x + gamma 1) = -gamma 1^T w^0 for all t, depending only on the initial weight sum 1^T w^0 rather than the learned weights w^t.
  evidence:
  - source_id: r625-primary-pdf
    locator: Section 4.1 Theorem 4.1, Eq. (5), p. 7-8; Appendix A1 Proof of Theorem 4.1, Eq. (7)-(8), p. 15-16
    relation: supports
- claim_id: c-r625-lipschitz-smoothing-and-gradient-explosion-suppression
  kind: mechanism
  statement: Theorem 4.2 (Eq. 6 and Appendix A2 Eq. 10-11) proves that ||Phi_GC(grad_w L)||_2^2 = ||grad_w L||_2^2 - ||e^T grad_w L||_2^2 <= ||grad_w L||_2^2 and ||grad_w Phi_GC(grad_w L)||_2^2 = ||P grad_w^2 L||_2^2 = ||grad_w^2 L||_2^2 - ||e^T grad_w^2 L||_2^2 <= ||grad_w^2 L||_2^2, smoothing the optimization landscape, suppressing gradient explosion, and improving test accuracy across SGDM, Adam, Adagrad, SGDW, and AdamW on CIFAR-100, ImageNet, fine-grained classification, and COCO object detection/segmentation.
  evidence:
  - source_id: r625-primary-pdf
    locator: Section 4.2 Theorem 4.2, Eq. (6) & Figure 4, p. 8-9; Section 5.2-5.6 Tables 1-9, p. 10-15; Appendix A2 Eq. (10)-(11), p. 16-17
    relation: supports
- claim_id: c-r625-feature-normalization-and-weight-decay-coupling-limitation
  kind: limitation
  statement: Gradient Centralization operates only on weight gradients and does not normalize intermediate feature activations, so deep networks still require activation normalization (such as Batch Normalization or Group Normalization) to train effectively; moreover, when L2 weight decay lambda w is added before projection as P(g^t + lambda w), the mean component of w is not decayed unless decoupled weight decay (SGDW/AdamW) is applied outside P.
  evidence:
  - source_id: r625-primary-pdf
    locator: Section 3.4, p. 5; Section 5.2-5.3, p. 11
    relation: supports
