claims:
- claim_id: temporal-law
  kind: mechanism
  statement: For fixed topic count K and vocabulary, the basic model evolves each topic logit vector as
    beta_tk|beta_(t-1)k~N(beta_(t-1)k,sigma² I) and maps it through softmax to word probabilities. In
    the full generative description, alpha_t|alpha_(t-1)~N(alpha_(t-1),delta² I) evolves the document-topic
    logit mean. Each document draws eta~N(alpha_t,a² I), then topic assignments from softmax(eta) and
    words from the selected time-specific topic. Initial-state distributions and variance settings must
    be specified. Documents are grouped into ordered slices; conditional within-document word exchangeability
    remains. The inference example beginning on p.3 retains evolving topics but fixes a Dirichlet document-proportion
    prior, a stated simplification rather than an equivalent formula for the entire full model.
  evidence:
  - source_id: method-source
    locator: Section 2 and opening of Section 3, PDF pp.2-3
    relation: supports
- claim_id: structured-approximation
  kind: mechanism
  statement: The published approximation uses Gaussian topic trajectories conditioned on optimized pseudo-observations,
    retaining time dependence within each topic chain while separating it from document-level latent factors.
    Gaussian forward filtering and backward smoothing compute the surrogate trajectory moments; a wavelet-regression
    approach is presented as an alternative. Expected topic-word counts connect document updates to trajectory
    fitting. Exact Kalman recursions for this Gaussian surrogate do not yield the exact nonconjugate multinomial
    posterior. The auxiliary expected-log-normalizer bound and numerical optimization introduce approximation;
    smoothing over a fitted interval can use later observations and must be distinguished from forecasting
    beyond that interval.
  evidence:
  - source_id: method-source
    locator: Section 3, PDF pp.3-5, Equations (3)-(4); Appendix A, pp.7-8
    relation: supports
