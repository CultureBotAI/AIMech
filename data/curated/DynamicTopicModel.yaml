name: Dynamic topic model
definition: A time-sliced topic-model family that links the softmax natural parameters of corresponding
  topic-word distributions across slices through Gaussian state transitions, allowing a fixed set of topics
  to change over time.
concept_kind: model_family
identity_notes: 'Scoped to Blei and Lafferty''s ICML 2006 dynamic topic models. Topic-word distributions
  evolve, unlike a static topic model with only changing document proportions. The full formulation also
  evolves the logistic-normal mean for document-topic proportions; the inference exposition explicitly
  simplifies that part to a fixed Dirichlet prior. Variational Kalman and wavelet approximations are fitting
  choices, not synonyms for the model family or neural state-space layers. No normalized identity match
  was found across all 442 pinned AIO labels and scoped synonyms and 423 preceding native IDs, names and
  aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree and main.
  Ten matched lines in each checkout reduce to nine unique line contents: prior frontier references, copied
  discovery context and cached web-result mentions. Every matching concept excerpt was inspected; these
  are not maintained or imported identities. All 200 semantic label/synonym hits were read. Eighteen exact
  annotated AIO CLASS nodes and outgoing edges were inspected, including 14 verified unchanged from prior
  reading and four newly read. Thirty contextual YAMLs comprise those 18 AIO records and 12 native neighbors:
  six fully read here, 23 byte-verified after prior reading and the updated APM verified against its fully
  reviewed round100 bytes. Absence is bounded to the pinned snapshot, maintained corpus and inspected
  semantic neighborhood.'
limitations:
- The basic random-walk model fixes topic count and vocabulary and does not create or remove topics. Richer
  drift, heteroscedasticity and topic birth/death processes are proposed extensions. Time-slice choice
  and Gaussian innovation assumptions matter; temporal association is not a causal account of scientific
  change.
- Softmax logits are invariant to a common shift. Fixed topic indexing links trajectories, while label
  permutation and model fitting can still limit semantic identification. The presented isotropic document-logit
  law does not itself fit the full static CTM covariance or evolving correlations.
- Appendix A's displayed expected transition quadratic omits adjacent-time posterior covariance terms,
  and its entropy display does not give the joint correlated Gaussian entropy. A correct Gaussian-chain
  calculation uses cross-time covariance and the joint covariance determinant. With fixed surrogate variances
  some omitted terms are constant for mean optimization, but the printed expressions are not certified
  as exact complete objectives when variances change.
- The reported next-year Science comparison uses a variational likelihood bound, as stated in Figure 5,
  rather than computed exact predictive likelihood. The illustrative wavelet approximation and historical
  results are not a universal accuracy or convergence guarantee. No author implementation or benchmark
  was executed.
