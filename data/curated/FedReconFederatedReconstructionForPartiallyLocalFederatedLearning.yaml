id: AIMech:FedReconFederatedReconstructionForPartiallyLocalFederatedLearning
name: FedRecon (Federated Reconstruction for Partially Local Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: 'A stateless partially local federated learning framework (Singhal, Sidahmed, Garrett, Wu, Rush, & Prakash 2021, Sections 3-4, Equations 1-2, Algorithm 1, Proposition 4.1) that partitions model parameters into shared global parameters g in G and private local parameters l_i in L without requiring clients to persist local state across rounds: in each round t, each selected client i in S^{(t)} splits its local dataset D_i into a reconstruction support set R_i and an update query set U_i, initializes local parameters l_i^{(t,0)} fresh, performs k_r gradient descent steps on R_i with frozen g^{(t)} to reconstruct l_i^{(t)} = R(D_i, g^{(t)}, L_i) = argmin_{l_i in L} L_i(g^{(t)}, l_i) (Equation 1), performs k_u gradient descent steps on U_i with frozen reconstructed l_i^{(t)} to update g_i^{(t)}, discards l_i^{(t)}, and returns only the global parameter update Delta_i^{(t)} = g^{(t)} - g_i^{(t)} to the server (Algorithm 1).'
identity_notes: Distinct from stateful partially local methods such as FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers, Arivazhagan et al. 2019), FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), and LG-FedAvg (AIMech:LgFedAvgLocalGlobalRepresentationsFederatedLearning, Liang et al. 2020), all of which require clients to persistently store their private parameters across communication rounds and cannot directly evaluate on unseen stateless cross-device clients without a reconstruction step; FedRecon discards local parameters after every round and reconstructs them on the fly via support/query splitting, naturally generalizing to unseen clients at inference time via ReconEval.
aliases:
- FedRecon
- Federated Reconstruction
- Stateless Partially Local Federated Learning via Reconstruction
