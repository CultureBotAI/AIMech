claims:
- claim_id: r481-stateless-on-the-fly-reconstruction-and-reconevaluation-mechanism
  kind: mechanism
  statement: Instead of maintaining persistent client state l_i across rounds, FedRecon reconstructs l_i^{(t)} from scratch on each active client's reconstruction split R_i via k_r gradient steps with frozen global parameters g^{(t)} before updating g_i^{(t)} on update split U_i and discarding l_i^{(t)}; at inference time (ReconEval), any unseen client reconstructs its personal parameters l_i from R_i in k_r steps and evaluates on U_i (Singhal et al. 2021, Section 3, Algorithm 1, pp. 3-4).
  evidence:
  - source_id: r481-primary-pdf
    locator: Section 3 (Equations 1-2, Algorithm 1), pp. 3-4
    relation: supports
- claim_id: r481-first-order-maml-equivalence-and-bilevel-convergence-scope
  kind: scope
  statement: Proposition 4.1 proves that for one reconstruction step (k_r = 1 on R_i with step size alpha_r) and one global update step (k_u = 1 on U_i), FedRecon optimizes the bi-level meta-learning objective min_g (1/|C|) sum_i F_i(g) = L_i(g, l_i - alpha_r nabla_l L_i(g, l_i)) using the first-order MAML gradient nabla_g L_{U_i}(g, l_i^{(t)}) (omitting the expensive second-order Hessian cross-term alpha_r nabla_g nabla_l L_i) and converges to an O(alpha_r)-stationary point at rate O(1/sqrt(T) + alpha_r) in smooth non-convex settings (Singhal et al. 2021, Section 4 & Appendix C).
  evidence:
  - source_id: r481-primary-pdf
    locator: Section 4 (Proposition 4.1), pp. 5-6, and Appendix C (Proposition C.4), pp. 14-16
    relation: supports
- claim_id: r481-federated-matrix-factorization-and-next-word-prediction-application
  kind: application
  statement: Applied to federated collaborative filtering via matrix factorization on MovieLens-1M (where user embeddings U_i are reconstructed locally and item embeddings V are aggregated globally) and personalized next-word prediction on StackOverflow with user-specific vocabulary bias/head layers (Singhal et al. 2021, Section 5, Figures 2-4, Tables 1-2).
  evidence:
  - source_id: r481-primary-pdf
    locator: Section 5.1-5.2 (Figures 2-4, Tables 1-2), pp. 6-9
    relation: supports
- claim_id: r481-support-split-requirement-for-reconstruction-limitation
  kind: limitation
  statement: Requires every participating and evaluated client to hold a labeled support subset R_i with enough local examples to reconstruct l_i^{(t)} in k_r steps without overfitting before global updates or inference can be performed (Singhal et al. 2021, Section 3 & Section 5.1, pp. 4 & 7).
  evidence:
  - source_id: r481-primary-pdf
    locator: Section 3 (Dataset Splitting), p. 4, and Section 5.1, p. 7
    relation: supports
