id: AIMech:FedPacFeatureAlignmentAndClassifierCollaborationForPersonalizedFederatedLearning
name: FedPAC (Personalized Federated Learning with Feature Alignment and Classifier Collaboration)
concept_kind: algorithm
review_status: DRAFT
definition: A personalized federated learning algorithm (Xu, Tong, & Huang 2023, Sections 3-4, Theorem 1, Equations 3-4, 10-19, 43-46) that jointly (1) aligns local feature extractors f_{theta_i} to global class feature centroids c_k via the regularization penalty R_i(theta_i; c) = (lambda / n_i) sum_{l=1}^{n_i} (1 / d) ||f_{theta_i}(x_l) - c_{y_l}||_2^2 (Equations 3, 17, 19) to reduce the local-global feature generalization gap Delta R_i (Equations 12-14), and (2) constructs each client i's personalized classifier head phi_hat_i^{(t+1)} = sum_{j=1}^m alpha_{ij} phi_j^{(t+1)} (Equation 4) using simplex-constrained weights alpha_i^* that minimize the expected chi_i^2 testing loss bound via the convex quadratic program min_{alpha_i >= 0, sum_j alpha_{ij} = 1} sum_{j=1}^m (alpha_{ij}^2 / n_j) V_j + sum_{j, j'=1}^m alpha_{ij} alpha_{ij'} D_{jj'} (Theorem 1, Equations 10-11, 43-46) computed from first- and second-order client feature statistics.
identity_notes: Distinct from FedRep (AIMech:FedRepSharedRepresentationPersonalizedFederatedLearning, Collins et al. 2021) and FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers), which keep each client's classifier head strictly local without inter-client classifier collaboration or global centroid alignment; and distinct from FedProto (AIMech:FedProtoFederatedPrototypeLearning, Tan et al. 2022), which communicates only class prototypes without aggregating shared feature extractors or solving a bias-variance quadratic program for personalized classifier combinations.
aliases:
- FedPAC
- Feature Alignment and Classifier Collaboration in Personalized Federated Learning
- Quadratic Bias-Variance Classifier Collaboration for Personalized Federated Learning
