claims:
- claim_id: r460-quadratic-bias-variance-classifier-collaboration-qp-mechanism
  kind: mechanism
  statement: Decomposes the expected chi_i^2 testing risk of a linearly combined classifier g_hat_i^* = sum_{j=1}^m alpha_{ij} g_hat_j into a pairwise distribution-mismatch bias quadratic form sum_{j,j'} alpha_{ij} alpha_{ij'} D_{jj'} and a sample-variance term sum_j (alpha_{ij}^2 / n_j) V_j (Theorem 1, Equations 10-11), and estimates V_j and D_{jj'} server-side from client class-conditional feature means mu_{j,y} and trace second moments tr(Lambda_{j,y}) under isotropic feature normalization (Appendix A.5, Equations 43-46) to solve a convex quadratic program for alpha_i^*.
  evidence:
  - source_id: r460-primary-pdf
    locator: Section 4.1 Theorem 1 (Equations 10-11) & Appendix A.2-A.5 (Equations 29-35, 43-46), pp. 5-6, 15-18
    relation: supports
- claim_id: r460-global-centroid-feature-alignment-generalization-scope
  kind: scope
  statement: Bounds the local generalization gap Delta R_i = 2 E_{P_Y^{(i)}}[(E_{P_{X|Y}^{(i)}}[f(x)] - E_{P_hat_{X|Y}^{(i)}}[f(x)])^T g_i(Y) / K] (Equations 12-14) by pulling local features f_{theta_i}(x_l) toward globally aggregated class centroids c_{y_l} (Equations 3, 17, 19), ensuring that classifier heads trained on different clients operate in a common aligned semantic subspace.
  evidence:
  - source_id: r460-primary-pdf
    locator: Section 3.2 (Equation 3) & Section 4.2 Feature Alignment by Regularization (Equations 12-19), pp. 4, 6-7
    relation: supports
- claim_id: r460-feature-statistics-upload-and-qp-overhead-limitation
  kind: limitation
  statement: Requires clients to compute and upload class-conditional feature means mu_{i,y} and scalar variance statistics V_i in addition to model parameters, and invokes a server-side m-variable quadratic program for each participating client during the initial collaboration rounds.
  evidence:
  - source_id: r460-primary-pdf
    locator: Section 4.2 Practical Implementation & Appendix A.5 Privacy and Communication Discussion (Equations 43-46), pp. 7, 17-18
    relation: supports
- claim_id: r460-personalized-vision-classification-under-label-skew-application
  kind: application
  statement: Applied to personalized federated image classification on EMNIST, Fashion-MNIST, CIFAR-10, CIFAR-100, and CINIC-10 under pathological and Dirichlet non-IID label distributions.
  evidence:
  - source_id: r460-primary-pdf
    locator: Section 5 Experiments (Tables 1-3, Figures 2-4), pp. 7-9
    relation: supports
