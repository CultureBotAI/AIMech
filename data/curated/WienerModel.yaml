  relation: supports
claims:
- claim_id: linear-then-static
  kind: mechanism
  statement: 'Write z_t=sum_{j=0}^{t-1} h_j*u_(t-j) for the zero-state linear response and y_t=g(z_t).
    The linear block first combines inputs across time; the memoryless nonlinearity then transforms that
    scalar. This differs in general from applying g before filtering: with h=(1,2), inputs (1,2,-1) and
    g(v)=v², the first three Wiener outputs are (1,16,9), whereas the corresponding Hammerstein outputs
    are (1,6,9). This is a finite curator example of block-order dependence, not an empirical comparison.'
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Figure 3.1 and Equations 3.1–3.4, PDF pp. 13–14 / printed pp. 10–11; curator exact
      calculations in research/discovery/cascade-model-boundaries.py
    relation: supports
- claim_id: conditional-output-recurrence
  kind: mechanism
  statement: For a finite-dimensional linear block satisfying z_(t+n)=sum_{i=1}^n a_i*z_(t+n-i)+sum_{j=0}^n
    b_j*u_(t+n-j), an inverse of g on the relevant internal-signal range gives y_(t+n)=g(sum_i a_i*g^(-1)(y_(t+n-i))+sum_j
    b_j*u_(t+n-j)). If the inverse is only valid on a selected interval, the required internal history
    must stay on that branch. The convolutional cascade itself does not require an inverse. Finite state
    order also does not imply a finite impulse-response memory.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Equations 3.2–3.8, PDF pp. 14–15 / printed pp. 11–12
    relation: supports
- claim_id: noninjective-output-boundary
  kind: limitation
  statement: For the source example x_next=x+u and y=x+x², two reachable internal states x=0 and x=-1
    have the same output 0, but with the same current input u=1/4 the next outputs are 5/16 and -3/16.
    Thus a single-valued update from only current y and u cannot cover both branches. Restricting x>-1/2
    gives the inverse branch used in the source. This does not rule out other histories, state tracking
    or a narrower operating domain.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 2, Example 2.1, Equations 2.6 and 2.22–2.25, PDF pp. 9,11–12 / printed pp. 6,8–9;
      curator exact calculations in research/discovery/cascade-model-boundaries.py
    relation: supports
- claim_id: internal-scale-ambiguity
  kind: limitation
  statement: Without a normalization, internal gain can be exchanged between the two blocks. For nonzero
    c, replacing the zero-state linear operator L by c*L and g(v) by g(v/c) preserves g(Lu) for every
    admissible input. A c=3 finite example reproduces the same outputs. This algebraic ambiguity means
    identical external responses alone do not uniquely determine both internal block gains; it does not
    establish the full set of identification ambiguities.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Equations 3.1–3.4, PDF p. 14 / printed p. 11; direct curator consequence of the
      cascade equations; curator exact calculations in research/discovery/cascade-model-boundaries.py
    relation: supports
