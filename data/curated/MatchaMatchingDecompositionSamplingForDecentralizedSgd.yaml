id: AIMech:MatchaMatchingDecompositionSamplingForDecentralizedSgd
name: MATCHA Matching Decomposition Sampling for Decentralized SGD
concept_kind: algorithm
review_status: DRAFT
definition: A topology-aware decentralized stochastic gradient descent algorithm (MATCHA) that decomposes a base communication graph G(V, E) into M vertex-disjoint matchings G_1, ..., G_M with Laplacians L_1, ..., L_M, solves a concave algebraic-connectivity optimization problem max_{p_1, ..., p_M} lambda_2(sum_{j=1}^M p_j L_j) subject to a communication budget sum_{j=1}^M p_j <= C_b * M and 0 <= p_j <= 1, and at each iteration k independently samples Bernoulli indicators B_j^(k) ~ Bernoulli(p_j) to form the time-varying symmetric doubly-stochastic mixing matrix W^(k) = I - alpha * sum_{j=1}^M B_j^(k) L_j with SDP-optimized step weight alpha.
identity_notes: Introduced by Jianyu Wang, Anit Kumar Sahu, Zhouyi Yang, Gauri Joshi, and Soummya Kar (MLSys 2020; arXiv:1905.09435). Distinct from vanilla Decentralized SGD (Lian et al., NeurIPS 2017) and Periodic DecenSGD, which activate all edges of the base graph simultaneously with equal frequency; and distinct from Stochastic Gradient Push (Assran et al., ICML 2019), which uses a deterministic time-varying directed exponential graph rather than algebraic-connectivity-optimized random matching decomposition.
