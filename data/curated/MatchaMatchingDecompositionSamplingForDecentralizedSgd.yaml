claims:
- claim_id: matcha-disjoint-matching-algebraic-connectivity-and-sdp-mixing-mechanism
  kind: mechanism
  statement: MATCHA decomposes G(V, E) via edge coloring into M in {Delta(G), Delta(G) + 1} disjoint matchings with Laplacians L_j satisfying L_j^2 = 2 * L_j, maximizes the Fiedler eigenvalue lambda_2(sum_{j=1}^M p_j L_j) under sum_{j=1}^M p_j <= C_b * M to assign higher activation probabilities p_j to connectivity-critical links, and solves a convex semidefinite program to select alpha minimizing the second-moment spectral norm rho = ||I - 2*alpha*L_bar + alpha^2*(L_bar^2 + 2*L_tilde) - (1/m)*1*1^T||_2.
  evidence:
  - source_id: r554-primary-pdf
    locator: Section 3 Equations (4)-(5), Section 4 Equations (6)-(7), & Appendix B Equations (11)-(29), pp. 4-6, 11-14
    relation: supports
- claim_id: matcha-nonconvex-linear-speedup-arbitrary-budget-scope
  kind: scope
  statement: For any communication budget C_b > 0 on a connected base graph G, Theorem 1 guarantees the existence of alpha > 0 such that rho = ||E[W^(k)^T W^(k)] - (1/m)*1*1^T||_2 < 1, and Theorem 2 / Corollary 1 establish non-convex convergence at rate (1/K) sum_{k=1}^K E[||grad F(x_bar^(k))||^2] = O(1 / sqrt(m*K)) + O(m / K).
  evidence:
  - source_id: r554-primary-pdf
    locator: Section 4 Theorem 1 & Section 5 Theorem 2 and Corollary 1, pp. 5-7
    relation: supports
- claim_id: matcha-undirected-symmetric-matching-and-two-stage-optimization-limitation
  kind: limitation
  statement: Jointly optimizing the matching probabilities {p_j} and mixing weight alpha to minimize rho is non-convex, requiring a two-stage heuristic that first maximizes lambda_2(L_bar) and then solves an SDP for alpha, and the formulation assumes undirected symmetric links with uniform unit link delay.
  evidence:
  - source_id: r554-primary-pdf
    locator: Section 4 p. 6, Section 7 Concluding Remarks p. 9, & Appendix B.2 p. 14
    relation: supports
- claim_id: matcha-distributed-vision-and-language-modeling-application
  kind: application
  statement: Applied to decentralized training of WideResNet and ResNet-50 on CIFAR-10/100 and two-layer LSTM language modeling on Penn Treebank over Erdos-Renyi and random geometric graphs, achieving up to 5.2x wall-clock speedup.
  evidence:
  - source_id: r554-primary-pdf
    locator: Section 6 Experimental Results, Figures 4-5, pp. 7-9
    relation: supports
