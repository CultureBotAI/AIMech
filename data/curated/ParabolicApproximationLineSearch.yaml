id: AIMech:ParabolicApproximationLineSearch
name: Parabolic Approximation Line Search
concept_kind: algorithm
review_status: DRAFT
definition: A stochastic line-search optimization algorithm for deep neural networks that at each step t defines a one-dimensional loss cross-section l_t(s) = L(x_t; theta_t + s d_t / ||d_t||_2) along a unit-normalized search direction d_t / ||d_t||_2 (where d_t = -grad_{theta_t} L(x_t; theta_t) + beta d_{t-1} with beta in [0, 1]), evaluates the current mini-batch loss l_t(0), directional derivative b = l'_t(0) = grad_{theta_t} L(x_t; theta_t)^T d_t / ||d_t||_2, and one additional forward pass l_t(mu) at measuring step distance mu > 0 on the same mini-batch (reusing any stochastic dropout masks), fits the exact interpolating 1D parabola l_hat_t(s) = a s^2 + b s + c with a = (l_t(mu) - l_t(0) - b mu) / mu^2 and c = l_t(0), and updates parameters by theta_{t+1} = theta_t + min(alpha s_upd, s_max) d_t / ||d_t||_2 where s_upd = -b / (2a) when a > 0 and b < 0, s_upd = mu when a <= 0 and b < 0, and s_upd = 0 otherwise.
identity_notes: 'Distinct from backtracking Armijo Stochastic Line Search (SLS, which requires the interpolation condition and checks sufficient decrease via variable numbers of forward passes), from linear loss-approximation step-size schemes (L4, ALIG), and from Gaussian-process Probabilistic Line Search (PLS): PAL uses a deterministic 2-forward-pass, 1-backward-pass 1D parabolic fit along unit-normalized negative-gradient or conjugate-like directions.'
aliases:
- PAL
- PAL Optimizer
- Parabolic Approximation Line Search for DNNs
