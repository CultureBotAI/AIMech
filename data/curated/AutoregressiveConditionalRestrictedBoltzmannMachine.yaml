name: Autoregressive conditional restricted Boltzmann machine
definition: A neural sequence architecture that models each current vector with a conditional RBM whose
  visible and hidden biases are affine functions of a fixed window of preceding observed vectors, without
  hidden-to-hidden temporal links.
concept_kind: architecture
identity_notes: 'This record is scoped to Taylor, Hinton and Roweis’s autoregressive CRBM construction
  for vector sequences, particularly its Gaussian-visible, binary-hidden formulation. The general label
  conditional RBM and acronym CRBM are not claimed as exclusive aliases because other conditional RBMs
  condition on arbitrary inputs or use different parameterizations. This is the observed-history specialization
  related to TRBM-HH; RTRBM and full TRBM also propagate hidden history. A stacked multilevel construction
  is not silently included in the single-layer record. All 442 pinned AIO labels/scoped synonyms and 361
  preceding native IDs/names/aliases were compared, with no normalized identity match. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main, returning 24 lines each. All 18
  unique matched contents were read: temporal FRBM source references, model contrasts, a discovery lead
  and saved review context, rather than existing candidate records. All 44 semantic label/synonym hits
  and 21 exact AIO nodes were inspected, alongside corresponding generated records and four complete native
  neighbors. Previously read contextual files were checked for byte identity. Absence is bounded to this
  snapshot and inspected neighborhood.'
limitations:
- The single-layer visible conditional depends on the fixed observed lag window. Nonlinear hidden features
  do not introduce an unbounded latent temporal memory path; deeper stacked models are separate compositions.
- 'Sections 2–2.1 explicitly give exact factorial hidden inference for fully observed frames. Section
  2.2’s broad statement about omitted smoothing must not override that graph-specific result: future factors
  contain no earlier hidden state once the visible sequence is fixed. Missing visible data and multilevel
  models can require smoothing; the reported online missing-data procedure is approximate.'
- Replacing Gaussian visible samples by conditional means removes conditional sampling variance and is
  not exact Gibbs sampling from the stated Gaussian model. Finite CD is not an exact likelihood gradient
  or a convergence guarantee.
- The general energy in Equation (1) includes visible standard deviations and scaled interactions; the
  displayed mechanism deliberately adopts the source’s sigma_i=1 convention. Rescaling arbitrary variances
  without transforming weights changes the distribution.
- A conditional RBM is richer than a linear autoregression, although removing the hidden interactions
  leaves an autoregressive Gaussian special case. Initial-frame distributions, missing-data posterior
  integration, phase disambiguation and transition coverage need separate modeling assumptions. No benchmark
  ranking or author-code certification is asserted.
