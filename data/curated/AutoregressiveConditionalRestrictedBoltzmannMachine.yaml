aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: The pinned AIO class is broader than this particular neural sequence architecture with nonlinear
    stochastic units and weighted connections. This mapping does not claim equivalence to a symmetric
    Boltzmann machine, a pure directed Bayesian network or an autoregressive language model. The latter
    is language-specific, while this model supports general vector sequences.
- target: AIO:RestrictedBoltzmannMachine
  relation: related_match
  rationale: Each time step uses a conditional RBM with undirected visible–hidden interactions. The entire
    sequence construction additionally has directed history connections and a separate conditional normalizer
    per step; a related mapping records the component relationship without equating the whole temporal
    architecture to one unconditioned symmetric RBM.
