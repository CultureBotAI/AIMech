claims:
- claim_id: method
  kind: mechanism
  statement: Condition on preceding visible frames and compute dynamic biases d_t=c+sum_k A_k^T v_(t-k)
    and e_t=b+sum_k D_k^T v_(t-k), allowing different lag windows for the two sums. In the source’s unit-variance
    Gaussian formulation, E(v_t,h_t|history)=one-half times ||v_t-d_t|| squared minus e_t^T h_t minus
    v_t^T W h_t. Thus hidden probabilities are sigmoid(e_t+W^T v_t), and visible coordinates given h_t
    are independent unit-variance Gaussians with mean d_t+W h_t. The partition is conditional on the fixed
    history. For fully observed frames the hidden posterior factorizes, and likelihood gradients contrast
    data and conditional-model statistics; the paper approximates them by CD while holding earlier frames
    fixed. Its implementation description samples positive-phase binary hidden states, uses hidden probabilities
    for negative-phase statistics, and uses mean visible reconstructions in place of Gaussian draws. Generation
    starts from supplied initial frames and repeatedly samples the current conditional RBM; the original
    conditional training does not model the first lag-window frames.
