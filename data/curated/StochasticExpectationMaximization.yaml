name: Stochastic Expectation Maximization
aliases:
- Stochastic EM
- SEM (stochastic expectation maximization)
concept_kind: algorithm
definition: A finite-mixture fitting algorithm that draws one hard component assignment for each observation
  from its current posterior responsibilities, fits the resulting completed-data model, and recomputes
  the responsibilities for the next iteration.
identity_notes: 'This record denotes the Celeux-Diebolt stochastic-completion construction. It is a single-completion
  specialization of Monte Carlo EM and corresponds algebraically to a one-draw, unit-weight replacement
  in the SAEM recursion, rather than decreasing-step recursive averaging. Its named stochastic process
  and stationary-summary interpretation differ from CEM posterior-mode assignment, supplemented-EM covariance
  estimation, general ICE estimator averaging and Bayesian sampling of model parameters. Bare SEM is not
  asserted as a unique alias. No normalized identity matches among 442 pinned and 473 maintained records,
  including the bare acronym probes. Existing supplemented EM and cross-entropy optimization are distinct
  methods; qualified aliases avoid claiming SEM or CEM as unique names. ICE, MCEM, SAEM, deterministic
  tempered EM, simulated annealing and k-means provide neighboring but different scopes. Existing stochastic-EM
  frontier and incidental references are not records of the new identities. The absence assessment is
  bounded to this snapshot and corpus. Identity-search counts: 227 matched lines in the worktree and 245
  in main; all 137 distinct matching-text windows were read, with ignored and hidden files included.'
