claims:
- claim_id: random-completion
  kind: mechanism
  statement: For current weights and component densities, normalize p_k f_k(x_i) over k to obtain responsibilities
    t_ik. Independently draw a categorical label for each observation under t_i, then maximize the completed-data
    log likelihood. With unrestricted mixture weights the update is the sampled class count divided by
    N; each component parameter uses its assigned observations and the selected distribution family. Recompute
    responsibilities from the fit. The original cyclic S-M-E presentation is equivalent to E-S-M when
    starting from current parameters.
  evidence:
  - source_id: sem-source
    locator: Section 4.1, pp.40-41 / PDF7-8
    relation: supports
- claim_id: process-and-summary
  kind: scope
  statement: Random complete-data refitting can retain fluctuations on a fixed observed data set. The
    source proposes summary means and variances after a stationary regime, rather than equating every
    iterate with a converged point estimate. Its stated asymptotic result is restricted to two components
    with an unknown mixing proportion and refers to an earlier technical proof; the general extension
    is conjectural. A reliable universal burn-in cutoff, unbiased estimator or global maximum is not established.
  evidence:
  - source_id: sem-source
    locator: Sections 4.2-4.4, pp.41-42 / PDF8-9
    relation: supports
- claim_id: small-class-policy
  kind: scope
  statement: 'The stated baseline restarts when a sampled class has fewer than N*c(N,d) observations.
    A later practical variant instead deletes a class with count at most d and continues with one fewer
    component. Restart and deletion define different transition and model-order behavior. Neither automatic
    component-count recovery nor ergodicity follows from the unprotected assignment/count formula: a zero
    weight can make that component unreachable.'
  evidence:
  - source_id: sem-source
    locator: Section 4.1, p.40 / PDF7; Section 4.3, p.42 / PDF9; Section 5.4, p.49 / PDF16
    relation: supports
- claim_id: likelihood-and-partition
  kind: limitation
  statement: A sampled hard partition is not the actual posterior-responsibility matrix. The entropy identity
    for the actual posterior does not imply equality of completed and marginal likelihood for arbitrary
    sampled labels, contrary to the report prose following Eq4.4. The saved normalized Bernoulli-mixture
    example has a positive-probability nonempty completion whose fitted mixing weight decreases marginal
    likelihood. Per-step ordinary EM ascent therefore cannot be inherited by this stochastic update.
  evidence:
  - source_id: cem-source
    locator: Section 4.1 Eq4.2-4.4 and following prose, p.9 / PDF11; curator finite-mixture counterexample
    relation: supports
limitations:
- Source stationarity claims depend on the complete transition construction, admissible fits and recurrence
  assumptions. The original 1985 English article, 1984 proof report and distinct 1986 INRIA RR563 were
  not fully inspected; generic stationary normality, point convergence or global convergence is not certified.
- Model-specific completed-data estimators matter. Empty or undersized classes, unbounded Gaussian fits
  and identifiability up to label permutation require explicit treatment. The raw formula alone does not
  specify those policies.
- The 1986 numerical tables use 1000 post-stationary iterations, not 1000 independent data sets; their
  mean-plus/minus-SD summaries are not calibrated confidence intervals. Printed component-weight, mean-sign
  and component-location discrepancies remain unresolved, so no quantitative superiority or recovery claim
  is curated.
- The optional posterior-threshold classification can leave points unassigned; at threshold one half,
  tied probabilities can place a point in more than one set. It is a separate readout from the stochastic
  fitting transition.
- No author implementation or historical numerical experiment was reproduced. Finite curator calculations
  check formula boundaries, not empirical performance or a repaired convergence proof.
