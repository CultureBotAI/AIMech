name: Restricted Boltzmann Machine Collaborative Filtering
aliases:
- RBM collaborative filtering
- RBM-CF
concept_kind: model_family
definition: A family of shared-parameter restricted Boltzmann models for categorical user-item ratings,
  with a user-specific visible set and optional conditioning on the item-observation mask and low-rank
  factorization of rating interactions.
identity_notes: This record denotes the specific mask-indexed rating construction and its conditional/factored
  variants in Salakhutdinov, Mnih and Hinton 2007. It is narrower than a generic RBM application or the
  maintained input-conditioned RBM architecture. Corresponding item/rating parameters are shared across
  users, but each observed-item set defines its own joint law. It is not a single trained Netflix model,
  a matrix-factorization predictor, the generic CRBM, or a standalone ensemble-performance record. Gaussian
  hidden units with unit variance are a source variant; the defining displayed mechanism below uses binary
  hidden units. Four candidate identities were compared against all 442 pinned AIO IDs, labels and scoped
  synonyms and 447 preceding native IDs, names and aliases. Sparse coding matches the exact synonym and
  definition of AIO:SparseLearning and is reused; none of the three selected additions has a normalized
  identity match. Ignored/hidden full-checkout searches returned 47 lines each in worktree and main, with
  identical matched-line sets after merge. All 47 matched lines were read; they contain the existing sparse-coding
  class, its source/export and prior discovery context. All 205 semantic label/synonym rows were read
  and verified unchanged. Twenty-four annotated AIO nodes and outgoing edges comprise 23 unchanged prior
  readings and one new symmetry-network inspection. Thirty-two contextual YAMLs comprise 31 unchanged
  prior readings and one fully read new record, including eight native neighbors. Absence and no-match
  assessments are bounded to this snapshot and inspected neighborhood.
