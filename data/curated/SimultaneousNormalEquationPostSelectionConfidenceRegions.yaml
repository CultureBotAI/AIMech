claims:
- claim_id: equivalence-of-universal-post-selection-and-simultaneous-inference
  kind: mechanism
  statement: 'Section 3 (pp. 10-13, Theorem 3.1, Equations 7-10) proves purely set-theoretically without
    any distributional, independence, or dimensionality assumptions that for any family of confidence
    regions {R_hat_{n,M} : M in M_p} and any level alpha in [0, 1], universal post-selection coverage
    P(beta_{n,M_hat} in R_hat_{n,M_hat}) >= 1 - alpha for all data-dependent model selection procedures
    M_hat satisfying P(M_hat in M_p) = 1 is strictly equivalent to simultaneous family-wise coverage P(bigcap_{M
    in M_p} {beta_{n,M} in R_hat_{n,M}}) >= 1 - alpha, because any selector M_hat satisfies {beta_{n,M_hat}
    in R_hat_{n,M_hat}} supseteq bigcap_{M in M_p} {beta_{n,M} in R_hat_{n,M}} while the adversarial selector
    M_hat in argmin_{M in M_p} 1{beta_{n,M} in R_hat_{n,M}} achieves exact equality.'
  evidence:
  - source_id: kuchibhotla2020-posi-pdf
    locator: Section 3, Pages 10-13, Theorem 3.1, Remarks 3.1-3.4, Equations (7)-(10)
    relation: supports
