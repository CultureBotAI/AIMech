- claim_id: model-cardinality-adaptive-volume-and-fixed-design-tightness
  kind: mechanism
  statement: 'Sections 4.5-4.6 and Appendix B (pp. 21-25 and 38-39, Lemma 4.2, Propositions 4.1-4.2, Equations
    20-31 and 40) prove that under marginal sub-Weibull(gamma) tail bounds max_{i,j} ||Z_i(j)||_{psi_gamma}
    <= K_{n,p}, max{C_n^Gamma(alpha), C_n^Sigma(alpha)} = O(sqrt(log(p)/n)) and the Lebesgue volume of
    R_hat_{n,M}^dagger satisfies Leb(R_hat_{n,M}^dagger) = |Sigma_hat_n(M)|^{-1} {2 C_n^Gamma(alpha) +
    2 C_n^Sigma(alpha) ||beta_hat_{n,M}||_1}^{|M|} = O_p(sqrt(|M| log(p)/n))^{|M|} uniformly over M in
    M_p(k) (Proposition 4.1, Equation 21), adapting to the selected model cardinality |M| rather than
    the maximum search size k in contrast to the Berk et al. (2013) max-|t| confidence region volume O_p(sqrt(k
    log(p)/n))^{|M|} (Equation 28). Under fixed covariates (Sigma_hat_n = Sigma_n, D_n^Sigma = 0, C_n^Sigma(alpha)
    = 0), R_hat_{n,M} = R_hat_{n,M}^dagger has volume O_p(|Sigma_n(M)|^{-1} (sqrt(log(p)/n))^{|M|}) (Equation
    25) and is tight: sup_{M in M_p(p)} ||Sigma_n(M)(beta_hat_{n,M} - beta_{n,M})||_infty = D_n^Gamma,
    achieved by the greedy marginal screening selector M_hat = {j_hat} with j_hat in argmax_{1 <= j <=
    p} |1/n sum_{i=1}^n X_i(j)(Y_i - E[Y_i])|.'
  evidence:
  - source_id: kuchibhotla2020-posi-pdf
    locator: Sections 4.5-4.6 and Appendix B, Pages 21-25 and 38-39, Lemma 4.2, Propositions 4.1-4.2,
