    locator: arXiv:1806.04119v1 abstract
    relation: supports
- claim_id: deterministic-normal-equation-inequality-and-simultaneous-regions
  kind: mechanism
  statement: 'Sections 4.1-4.4 (pp. 14-21, Equations 11-19, Theorems 4.1-4.2, Lemma 4.1) define the bivariate
    max-norm estimation errors D_n^Sigma := |||Sigma_hat_n - Sigma_n|||_infty = max_{M in M_p(2)} |||Sigma_hat_n(M)
    - Sigma_n(M)|||_infty and D_n^Gamma := ||Gamma_hat_n - Gamma_n||_infty = max_{M in M_p(1)} ||Gamma_hat_n(M)
    - Gamma_n(M)||_infty (Equation 12) and prove via the submodel normal equations that ||Sigma_hat_n(M){beta_{n,M}
    - beta_hat_{n,M}}||_infty <= D_n^Gamma + D_n^Sigma ||beta_{n,M}||_1 holds deterministically for all
    M in M_p(p) with probability 1 (Equations 17-18). Given bivariate (1-alpha)-quantiles (C_n^Gamma(alpha),
    C_n^Sigma(alpha)) satisfying P(D_n^Gamma <= C_n^Gamma(alpha), D_n^Sigma <= C_n^Sigma(alpha)) >= 1
    - alpha (Equation 15), Theorem 4.1 proves exact finite-sample simultaneous coverage P(bigcap_{M in
    M_p(p)} {beta_{n,M} in R_hat_{n,M}}) >= 1 - alpha for all n, p >= 1 (including p >> n and singular
    Sigma_hat_n(M)), and Lemma 4.1 and Theorem 4.2 prove uniform-in-model L1 consistency max_{M in M_p(k)}
    ||beta_hat_{n,M} - beta_{n,M}||_1 <= k (D_n^Gamma + D_n^Sigma max_{M in M_p(k)} ||beta_{n,M}||_1)
    / (Lambda_n(k) - k D_n^Sigma)_+ and asymptotic simultaneous validity of the 2|M|-constraint parallelepiped
    R_hat_{n,M}^dagger over M_p(k) under Condition (A1)(k): k D_n^Sigma = o_p(Lambda_n(k)).'
