id: AIMech:SimultaneousNormalEquationPostSelectionConfidenceRegions
name: Simultaneous normal-equation post-selection confidence regions in model-free linear regression
aliases:
- Model-Free Normal-Equation PoSI Confidence Regions
- Assumption-Lean Simultaneous Normal-Equation Confidence Regions (R_hat_{n,M}, R_hat_{n,M}^dagger)
- Polynomial-Time Multiplier-Bootstrap Post-Selection Confidence Regions
concept_kind: mathematical_method
definition: 'Simultaneous normal-equation post-selection confidence regions in model-free linear regression
  are an assumption-lean statistical inference methodology introduced by Kuchibhotla, Brown, Buja, Cai,
  George, and Zhao (2020, The Annals of Statistics 48(5):2953-2981, arXiv:1806.04119v1, DOI:10.1214/19-AOS1917)
  for constructing universally valid post-selection confidence regions across arbitrary data-dependent
  submodel selectors M_hat in M_p subseteq M_p(p) := {M subseteq {1,...,p} : 1 <= |M| <= p} for independent
  (possibly non-identically distributed) or functionally dependent observations (X_i^T, Y_i)^T in R^p
  x R. For each submodel M, the submodel ordinary least squares estimator beta_hat_{n,M} and the model-free
  submodel moving target beta_{n,M} solve the submodel normal equations Sigma_hat_n(M) beta_hat_{n,M}
  = Gamma_hat_n(M) and Sigma_n(M) beta_{n,M} = Gamma_n(M), where Sigma_hat_n := 1/n sum_{i=1}^n X_i X_i^T,
  Gamma_hat_n := 1/n sum_{i=1}^n X_i Y_i, Sigma_n := E[Sigma_hat_n], and Gamma_n := E[Gamma_hat_n] (Section
  2.2, Equations 4-6). After proving that universal post-selection validity P(beta_{n,M_hat} in R_hat_{n,M_hat})
  >= 1 - alpha over all selectors M_hat with P(M_hat in M_p) = 1 is strictly equivalent to simultaneous
  family-wise validity P(bigcap_{M in M_p} {beta_{n,M} in R_hat_{n,M}}) >= 1 - alpha (Section 3, Theorem
  3.1, Equation 9), the method exploits the assumption-free deterministic normal-equation inequality ||Sigma_hat_n(M)
  {beta_{n,M} - beta_hat_{n,M}}||_infty <= D_n^Gamma + D_n^Sigma ||beta_{n,M}||_1 for all M in M_p(p)
  (Equations 17-18), where D_n^Sigma := |||Sigma_hat_n - Sigma_n|||_infty = max_{M in M_p(2)} |||Sigma_hat_n(M)
  - Sigma_n(M)|||_infty and D_n^Gamma := ||Gamma_hat_n - Gamma_n||_infty = max_{M in M_p(1)} ||Gamma_hat_n(M)
  - Gamma_n(M)||_infty depend only on marginal and bivariate moments (Equation 12). Using bivariate joint
  (1-alpha)-quantiles (C_n^Gamma(alpha), C_n^Sigma(alpha)) of (D_n^Gamma, D_n^Sigma) estimated in polynomial
  O(n p^2) time via a high-dimensional Gaussian multiplier bootstrap on the q = p + p(p+1)/2 unique cross-product
  and Gram coordinates W_i = ({X_i(j) Y_i}, {X_i(l) X_i(m)}_{l <= m}) (Section 5, Theorem 5.1), the method
  defines the exact finite-sample simultaneous confidence region R_hat_{n,M} := {theta in R^{|M|} : ||Sigma_hat_n(M)(beta_hat_{n,M}
  - theta)||_infty <= C_n^Gamma(alpha) + C_n^Sigma(alpha) ||theta||_1} (Equation 13, Theorem 4.1) and
  its asymptotically valid 2|M|-constraint parallelepiped approximation R_hat_{n,M}^dagger := {theta in
  R^{|M|} : ||Sigma_hat_n(M)(beta_hat_{n,M} - theta)||_infty <= C_n^Gamma(alpha) + C_n^Sigma(alpha) ||beta_hat_{n,M}||_1}
  (Equation 14, Theorem 4.2), whose Lebesgue volume O_p(sqrt(|M| log(p)/n))^{|M|} adapts to the selected
  model cardinality |M| rather than the maximum search size k (Proposition 4.1, Equations 21 and 28).'
identity_notes: Evaluated against all 442 pinned AIO records and 611 maintained curated concepts in AIMech.
  Distinct from AIMech:UniformlyValidPostModelSelectionConfidenceIntervals (Berk, Brown, Buja, Zhang,
  & Zhao 2013, PoSI), which constructs coordinatewise max-|t| Scheffe-type confidence intervals under
  fixed covariates X and homoscedastic Gaussian errors Y = mu + epsilon by computing a PoSI constant K(X,
  M_p, alpha) over the selection collection M_p in exponential O(sum_{M in M_p} |M|^2) time with volume
  O_p(sqrt(k log(p)/n))^{|M|} scaling with the maximum search size k rather than the selected model size
  |M|. Distinct from AIMech:UnifiedAssumptionLeanMovingTargetLinearRegressionAndScoreBootstrap (Kuchibhotla,
  Brown, & Buja 2018, arXiv:1809.10538v1), which analyzes a single fixed model (p = o(n^{1/5})) via multidimensional
  Berry-Esseen bounds and score bootstraps without post-selection simultaneous inference over 2^p submodels.
  Distinct from AIMech:ExactPolyhedralPostSelectionInference (Lee, Sun, Sun, & Taylor 2016), which conditions
  on a specific polyhedral selection event {A y <= b} (such as Lasso at a fixed lambda) under exact Gaussianity
  rather than providing universal selection-agnostic simultaneous validity over all M_hat in M_p via the
  normal equations.
