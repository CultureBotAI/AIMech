    relation: supports
- claim_id: polynomial-time-multiplier-bootstrap-surrogate-and-ellipsoidal-extensions
  kind: mechanism
  statement: Sections 5-7 and Appendices D-F (pp. 27-33 and 41-49, Theorems 5.1, 6.1, 7.1, E.1, E.2, F.1,
    Equations 32-39 and 41-46) construct a polynomial-time O(n p^2) Gaussian multiplier bootstrap S_{n,j}^star
    = 1/sqrt(n) sum_{i=1}^n e_{i,j} (W_i - W_bar_n) on the q = 2p + p(p-1)/2 = p + p(p+1)/2 unique coordinates
    of W_i = ({X_i(j) Y_i}, {X_i(l) X_i(m)}_{l <= m}), proving via high-dimensional central limit theorems
    (Chernozhukov et al. 2017) and Anderson's Lemma that the bootstrap quantiles are asymptotically exact
    under i.i.d. observations and asymptotically conservative under non-identically distributed observations
    (Theorem 5.1, Appendix E). Section 6 generalizes the confidence regions to arbitrary surrogate matrices
    and vectors (Sigma_hat_n^star, Gamma_hat_n^star) for errors-in-variables, missing data, or outlier-robust
    estimation (Theorem 6.1); Section 7 derives valid Lasso-type (R_ring_{n,M}, R_ring_{n,M}^dagger) and
    sqrt-Lasso-type (R_breve_{n,M}, R_breve_{n,M}^dagger) ellipsoidal confidence regions whose intersection
    R_hat_{n,M} cap R_hat_{n,M}^dagger cap R_ring_{n,M} remains simultaneously valid with smaller volume
    (Theorem 7.1, Remark 7.1, Equation 43); and Appendix F proves concentration under Wu's (2005) functional
    dependence measure (Theorem F.1).
