claims:
- claim_id: r353-claim-matrix-bernstein-minibatch-concentration-and-cubic-movement
  kind: mechanism
  statement: By the matrix Bernstein inequality (Lemma 4), minibatch sizes n_1 = O~(max(M_1/epsilon, sigma_1^2/epsilon^2)) and n_2 = O~(max(M_2/sqrt(rho*epsilon), sigma_2^2/(rho*epsilon))) guarantee ||g_t - grad f(x_t)|| <= c_1 epsilon and ||(B_t - grad^2 f(x_t))v|| <= c_2 sqrt(rho*epsilon)||v|| with high probability, under which the global minimizer Delta_t^* of the stochastic cubic submodel satisfies m_t(x_t + Delta_t^*) - m_t(x_t) <= -(rho / 12)||Delta_t^*||^3 (Lemma 5) and ||Delta_t^*|| >= (1/2) sqrt(epsilon / rho) whenever x_t + Delta_t^* is not an epsilon-second-order stationary point of f (Lemma 6).
  evidence:
  - source_id: r353-primary-pdf
    locator: Section 4.1, Lemmas 4-6, pp. 8-9; Appendix A.2, Equations 12-21, pp. 14-17
    relation: supports
- claim_id: r353-claim-cauchy-step-and-perturbed-gd-cubic-subsolver
  kind: mechanism
  statement: 'The gradient-descent Cubic-Subsolver (Algorithm 3) requires only Hessian-vector products B_t[v]: when ||g_t|| >= ell^2 / rho, a single analytical Cauchy step Delta = -R_c g_t / ||g_t|| with Cauchy radius R_c = -g^T B g / (rho ||g||^2) + sqrt((g^T B g / (rho ||g||^2))^2 + 2||g|| / rho) >= (7/10)(ell / rho) decreases both tilde{m} and f by at least (7/20) sqrt(epsilon^3 / rho) (Lemma 9); when ||g_t|| < ell^2 / rho, running T(epsilon) = O~(ell / sqrt(rho * epsilon)) steps of sphere-perturbed gradient descent on tilde{m} satisfies Condition 1 (Lemma 2, Lemma 11).'
  evidence:
  - source_id: r353-primary-pdf
    locator: Section 3.1, Algorithm 3 and Lemma 2, p. 7; Appendix B.1-B.3, Lemmas 9 and 11, pp. 22-25
    relation: supports
- claim_id: r353-claim-three-point-five-stochastic-oracle-complexity
  kind: mechanism
  statement: Across at most T_out = O(sqrt(rho)(f(x_0) - f^*) / epsilon^{1.5}) outer cubic-regularization iterations (Equation 26), each iteration evaluates the minibatch gradient once (O~(sigma_1^2 / epsilon^2) stochastic gradients) and queries the minibatch Hessian-vector product T(epsilon) = O~(ell / sqrt(rho * epsilon)) times (O~(sigma_2^2 ell / (rho^{1.5} epsilon^{1.5})) Hessian-vector products), yielding a total oracle complexity of O~((sqrt(rho) Delta_f / epsilon^{1.5})(sigma_1^2 / epsilon^2 + sigma_2^2 ell / (rho^{1.5} epsilon^{1.5}))) = O~(epsilon^{-3.5}) to output an epsilon-second-order stationary point with probability at least 1 - delta (Theorem 1, Corollary 3, Remark 4).
  evidence:
  - source_id: r353-primary-pdf
    locator: Section 3, Theorem 1, Remark 1, and Corollary 3, pp. 6-7; Appendix A.5, Equation 26 and Remark 4, pp. 20-21
    relation: supports
