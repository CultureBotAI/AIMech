claims:
- claim_id: method
  kind: mechanism
  statement: Divide a total beam budget B into G ordered groups, conventionally each of width B′=B/G when
    divisible; the paper also allows unequal allocations. At each decoding step, update the first group
    by ordinary beam search. For every later group in order, extend its retained prefixes by one token
    and score each candidate by its cumulative model log probability plus lambda times its dissimilarity
    to the current-step beams already selected in all earlier groups, with lambda nonnegative. For the
    additive family, dissimilarity to a group is the sum of pairwise sequence dissimilarities. Select
    the group’s top B′ distinct candidate extensions under that augmented score and proceed to the next
    group. Repeat through the chosen maximum length or termination condition, then combine group outputs
    and sort by model log probability as described in the source prose. The method is greedy across both
    time and group order; it encourages diversity between groups rather than imposing a joint exact sequence-set
    optimum.
  evidence:
  - source_id: method-source
    locator: Section 4, Equations (4)–(5), Figure 2, Algorithm 1 and Section 4.1, printed pp.7374–7375
      / PDF pp.4–5
    relation: supports
- claim_id: diversity-choice
  kind: mechanism
  statement: The source’s simple Hamming-style option penalizes a candidate token according to how often
    earlier groups used that token at the same position. Other discussed choices include cumulative positional
    mismatch, n-gram overlap and embedding-based dissimilarity. These are configurable scoring choices,
    not interchangeable definitions or guaranteed measures of semantic diversity.
  evidence:
  - source_id: method-source
    locator: Section 4.1, Choice of Diversity Function, printed p.7375 / PDF p.5
    relation: supports
- claim_id: inference-context
  kind: application
  statement: The method operates during inference on sequence-model scores without requiring retraining,
    and is developed for image captioning, visual question generation and machine translation. Its empirical
    comparisons do not establish universal improvements.
  evidence:
  - source_id: method-source
    locator: Abstract, printed p.7371 / PDF p.1; Section 2, Sequence Optimization, printed p.7373 / PDF
      p.3
    relation: supports
