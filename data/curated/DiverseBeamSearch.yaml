name: Diverse beam search
definition: The inference procedure of Vijayakumar and colleagues that partitions a sequence beam budget
  into groups and updates each group using model log-probability scores augmented by a weighted dissimilarity
  to the already-updated earlier groups at the same decoding step.
concept_kind: algorithm
identity_notes: 'This record denotes the group-based diversity-augmented method published at AAAI 2018,
  first submitted under a different title in 2016. It is distinct from Gumbel-based stochastic beam sampling,
  inter-sibling rank penalties, repeated complete beam runs with final-output diversity, and earlier algorithms
  using the phrase diversity beam search. The diversity objective is integrated into group beam updates;
  the procedure requires no retraining of the scoring model. No normalized identity match was found across
  all 442 pinned AIO labels/scoped synonyms and 328 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 49 and 49 lines
  respectively. All 2 unique hit contents were inspected: a saved stochastic-beam/Gumbel discovery lead
  and a search-result title about coalition-formation scatter search, not existing candidate records.
  Exact checkout counts and differences are retained in the ledger. Nine exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and four full native neighboring records were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.'
limitations:
- The first group is an ordinary beam of width B′. Its baseline inclusion is not a guarantee of matching
  or beating an ordinary beam of total width B, nor a guarantee of global MAP or globally optimal diversity.
- Setting G=1 recovers an ordinary width-B beam. With G>1, setting lambda=0 leaves separate smaller beams;
  it does not generally reconstruct one width-B beam and can reproduce outputs across groups.
- Distinctness is enforced within each selected group. The soft inter-group diversity term does not impose
  hard global output uniqueness, semantic correctness or a minimum pairwise distance. Large diversity
  weight can overwhelm model scores.
- The diversity measure and strength, group allocation/order, score ties, EOS handling and maximum length
  are part of the configuration. Prefix-based diversity cannot automatically use an arbitrary sentence-level
  metric that requires completed outputs.
- The paper reports empirical quality/diversity gains in specified generation experiments. No universal
  superiority, runtime speedup, numerical benchmark result or current library behavior is asserted here.
