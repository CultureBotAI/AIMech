claims:
- claim_id: claim-schur-complement-irrepresentable-condition-failure
  kind: mechanism
  statement: "For the projected instrument covariance $C = Q - Q\\gamma(\\gamma'Q\\gamma)^{-1}\\gamma'Q$ partitioned into $s$ invalid instruments ($Z_1$) and $L-s$ valid instruments ($Z_2$), Proposition 1 proves $C_{21}C_{11}^{-1} = (I_{L-s} - \\frac{\\widetilde{Q}_{22}\\gamma_2\\gamma_2'}{\\gamma_2'\\widetilde{Q}_{22}\\gamma_2})Q_{21}Q_{11}^{-1} - \\frac{\\widetilde{Q}_{22}\\gamma_2\\gamma_1'}{\\gamma_2'\\widetilde{Q}_{22}\\gamma_2}$ with Schur complement $\\widetilde{Q}_{22} = Q_{22} - Q_{21}Q_{11}^{-1}Q_{12}$ (Equation 18), and Proposition 2 proves $\\gamma_2'C_{21}C_{11}^{-1} = -\\gamma_1'$, so for standardized orthogonal instruments ($Q = I_L$) the Lasso irrepresentable condition $\\|C_{21}C_{11}^{-1}\\text{sign}(\\alpha_1)\\|_\\infty < 1$ simplifies to $|\\gamma_1'\\text{sign}(\\alpha_1)| < \\|\\gamma_2\\|_2^2 / \\|\\gamma_2\\|_\\infty$ and fails whenever the invalid instruments have strong first-stage effects $\\gamma_1$ (Section 3.2, Propositions 1\u20132, Equations 18\u201322)."
  evidence:
  - source_id: windmeijer2019-ivlasso-pmc
    locator: Section 3.2, Propositions 1-2, Equations (18)-(22), Appendix A.1
    relation: supports
- claim_id: claim-median-of-ratios-root-n-consistency-under-majority-rule
  kind: mechanism
  statement: "Under the majority validity rule $s < L/2$ with $\\gamma_j \\ne 0$ for all $j \\in \\{1,\\dots,L\\}$, Theorem 1 proves that the Median-of-Ratios estimator $\\widehat{\\beta}_m = \\text{median}(\\{\\widehat{\\pi}_j\\}_{j=1}^L)$ where $\\widehat{\\pi}_j = \\widehat{\\Gamma}_j / \\widehat{\\gamma}_j$ is the ratio of the $j$-th OLS reduced-form coefficient to the $j$-th OLS first-stage coefficient is $\\sqrt{n}$-consistent for $\\beta$ and converges in distribution to the normal order-statistic limit $\\sqrt{n}(\\widehat{\\beta}_m - \\beta) \\xrightarrow{d} q_{[l],L-s}$ (Section 4.1, Theorem 1, Equations 23\u201324, Appendix A.2)."
  evidence:
  - source_id: windmeijer2019-ivlasso-pmc
    locator: Section 4.1, Theorem 1, Equations (23)-(24), Appendix A.2
    relation: supports
- claim_id: claim-adaptive-lasso-oracle-instrument-selection-and-post-lasso-2sls
  kind: mechanism
  statement: Using $\widehat{\alpha}_m = \widehat{\Gamma} - \widehat{\gamma}\widehat{\beta}_m$ as the $\sqrt{n}$-consistent initial estimator in the Adaptive Lasso objective $\widehat{\alpha}_{\text{ad}}^n = \arg\min_\alpha \frac{1}{2}\|\widehat{M}_{\widehat{d}}y - \widehat{M}_{\widehat{d}}Z\alpha\|_2^2 + \lambda_n^a\sum_{j=1}^L |\alpha_j| / |\widehat{\alpha}_{m,j}|^\nu$ with $\lambda_n^a / \sqrt{n} \to 0$ and $\lambda_n^a n^{(\nu-1)/2} \to \infty$ for $\nu > 0$, Theorem 2 proves $\mathbb{P}(\text{supp}(\widehat{\alpha}_{\text{ad}}^n) = \{1,\dots,s\}) \to 1$ without any irrepresentable condition on $C$, and the resulting post-Adaptive-Lasso two-stage least squares estimator $\widehat{\beta}_{\text{post}}$ achieves the oracle asymptotic distribution $\sqrt{n}(\widehat{\beta}_{\text{post}} - \beta) \xrightarrow{d} \mathcal{N}(0, \sigma_u^2 / (\gamma_2'\widetilde{Q}_{22}\gamma_2))$ (Section 4.2, Theorem 2, Equation 25).
  evidence:
  - source_id: windmeijer2019-ivlasso-pmc
    locator: Section 4.2, Theorem 2, Equation (25)
    relation: supports
