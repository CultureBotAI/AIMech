claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any matrix A in R^{m x n} with rank-k SVD A_k = U_{A,k} Sigma_{A,k} V_{A,k}^T and row-sampling/rescaling matrix S = D S_0^T, Lemma 1 (Equations 26-27) proves that whenever sigma_k(S U_{A,k}) >= 1/sqrt(2), the sketched rank-k factor satisfies rank(S A_k) = k and the exact Moore-Penrose pseudoinverse factorization (S A_k)^+ = V_{A,k} Sigma_{A,k}^{-1} (S U_{A,k})^+, so the generalized regression solution Z_opt = (S B)^+ S A satisfies ||A - B Z_opt||_F <= (1 + epsilon)||A - A_k||_F.
  evidence:
  - source_id: r332-primary-pdf
    locator: Section 4.1-4.2, Theorem 3, Lemma 1, and Equations 23-27, pp. 861-866 (pp. 16-20 of PDF)
    relation: supports
  - source_id: r332-arxiv-abs
    locator: 'Abstract: relative-error CX and CUR matrix decompositions via subspace sampling'
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Theorem 1 and Theorem 2 prove that sampling c = O(k log k / epsilon^2) columns of A with probabilities p_j >= beta ||(V_{A,k})_{(j)}||_2^2 / k (where sum_{j=1}^n ||(V_{A,k})_{(j)}||_2^2 = k) yields ||A - C (C^+ A)||_F <= (1 + epsilon)||A - A_k||_F, and subsequently sampling r = O(c log c / epsilon^2) rows with probabilities q_i >= beta ||(U_C)_{(i)}||_2^2 / c and setting U = W^+ = (D_R S_R^T C)^+ yields ||A - C U R||_F <= (1 + epsilon)||A - A_k||_F with high probability, recovering A exactly (||A - C U R||_F = 0) whenever rank(A) <= k and the sampled subspace sketches have full rank k.
  evidence:
  - source_id: r332-primary-pdf
    locator: Section 3.1-3.2, Algorithm 1 (Theorem 1, Equation 4) and Algorithm 2 (Theorem 2, Equation 9), pp. 855-858 (pp. 10-13 of PDF)
    relation: supports
  - source_id: r332-metadata-cr
    locator: SIMAX 30(2):844-881 bibliographic record
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Computing the exact subspace leverage scores p_j = (1/k)||(V_{A,k})_{(j)}||_2^2 requires the top-k right singular subspace V_{A,k} of A (costing O(min(m,n) m n) via exact SVD), and replacing subspace leverage sampling by Euclidean column-norm sampling p_j = ||A^{(j)}||_2^2 / ||A||_F^2 fails to achieve relative error when a low-norm column carries an entire top-k singular direction while rank-1 high-norm columns dominate ||A||_F^2.
  evidence:
  - source_id: r332-primary-pdf
    locator: Section 1.3 and Section 3.1, Discussion of SVD cost O(min{m,n}mn) and contrast with additive-error norm sampling, pp. 847-848, 856
    relation: supports
