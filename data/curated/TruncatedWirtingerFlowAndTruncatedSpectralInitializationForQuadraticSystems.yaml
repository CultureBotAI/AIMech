claims:
- claim_id: claim-truncated-spectral-initialization-order-n-concentration
  kind: mechanism
  statement: "Replacing the untruncated weighted covariance matrix by the truncated estimator $\\boldsymbol{Y} = \\frac{1}{m}\\sum_{i=1}^m y_i\\boldsymbol{a}_i\\boldsymbol{a}_i^*\\mathbb{I}_{\\{|y_i| \\le \\alpha_y^2\\lambda_0^2\\}}$ (Equation 2.7) caps the spectral norm of each summand while preserving the rank-1 population gap $\\mathbb{E}[\\boldsymbol{Y}] = \\beta_1\\boldsymbol{x}\\boldsymbol{x}^* + \\beta_2\\|\\boldsymbol{x}\\|^2\\boldsymbol{I}_n$ with $\\beta_1 = 2 - (\\alpha_y^4 + 2\\alpha_y^2 + 2)e^{-\\alpha_y^2/2} > 0$ (Equations B.1\u2013B.2), so Proposition 1 proves $\\mathrm{dist}(\\boldsymbol{z}^{(0)},\\boldsymbol{x}) \\le \\delta\\|\\boldsymbol{x}\\|$ with $m \\ge c_0 n$ Gaussian measurements (Section 2.1, Equations 2.6\u20132.7, Appendix B, Proposition 1)."
  evidence:
  - source_id: cc2017-twf-pdf
    locator: Section 2.1 (Eqs. 2.6-2.7, pp. 8-9), Appendix B (Proposition 1, Eqs. B.1-B.2, pp. 42-43)
    relation: supports
- claim_id: claim-dual-event-truncated-poisson-gradient-regularity-condition
  kind: mechanism
  statement: "By restricting each Poisson score summand $2(\\frac{|\\boldsymbol{a}_i^*\\boldsymbol{z}|^2 - y_i}{\\boldsymbol{z}^*\\boldsymbol{a}_i})\\boldsymbol{a}_i$ to the intersection $\\mathcal{E}_1^{(t)} \\cap \\mathcal{E}_2^{(t)}$ (Equations 2.8\u20132.10), the denominator $|\\boldsymbol{a}_i^*\\boldsymbol{z}|$ is bounded away from zero and the residual is adaptively clipped at $\\alpha_h K_t |\\boldsymbol{a}_i^*\\boldsymbol{z}|/\\|\\boldsymbol{z}\\|$ where $0.6\\|\\boldsymbol{h}\\| \\le K_t / \\|\\boldsymbol{z}\\| \\le 1.2\\|\\boldsymbol{h}\\|$ (Lemma 1); Lemmas 2\u20136 prove that the truncated gradient $-\n\\nabla\\ell_{\\mathrm{tr}}(\\boldsymbol{z})$ satisfies the local Regularity Condition $RC(\\mu,\\lambda,\\delta)$ with constant parameters $\\zeta_1 = 2[1 - \\sqrt{2/\\pi}\\alpha_z^{\\mathrm{lb}}e^{-(\\alpha_z^{\\mathrm{lb}})^2/2}]$ and $\\zeta_2 = \\mathbb{E}[\\xi^2\\mathbb{I}_{\\{|\\xi| \\ge \\sqrt{1.99}\\alpha_h/(2\\alpha_z^{\\mathrm{ub}})\\}}]$ satisfying $2(1 - \\zeta_1 + \\zeta_2) < 1.99$ (Table 1, Equation 3.8, Sections 5.1\u20135.5, Lemmas 1\u20136, Proposition 2)."
  evidence:
  - source_id: cc2017-twf-pdf
    locator: Section 2.1 (Eqs. 2.8-2.10, Table 1, pp. 8-11), Section 3 (Eq. 3.8, p. 16), Sections 5.1-5.5 (Lemmas 1-6, Proposition 2, pp. 19-30)
    relation: supports
- claim_id: claim-linear-convergence-in-linear-time-and-minimax-noise-stability
  kind: application
  statement: "With constant step size $\\mu_t \\equiv \\mu_0$ (e.g. $\\mu_0 = 0.2$ for real Gaussian vectors) and $m \\ge c_0 n$, Theorem 1 proves that TWF contracts as $\\mathrm{dist}(\\boldsymbol{z}^{(t)},\\boldsymbol{x}) \\le \\frac{1}{10}(1-\\nu)^t\\|\\boldsymbol{x}\\|$ in $O(m n \\log(1/\\epsilon))$ total flops, and under bounded or Poisson noise $y_i = |\\boldsymbol{a}_i^*\\boldsymbol{x}|^2 + \\eta_i$, Theorem 2 proves $\\mathrm{dist}(\\boldsymbol{z}^{(t)},\\boldsymbol{x}) \\lesssim \\frac{\\|\\boldsymbol{\\eta}\\|_2}{\\sqrt{m}\\|\\boldsymbol{x}\\|} + (1-\\nu)^t\\|\\boldsymbol{x}\\|$, matching the information-theoretic Cram\xE9r\u2013Rao lower bound of Proposition 3 (Section 2.3, Theorems 1\u20132, Proposition 3, Section 6)."
  evidence:
  - source_id: cc2017-twf-pdf
    locator: Section 2.3 (Theorems 1-2, Proposition 3, pp. 12-14), Section 6 (pp. 30-35)
    relation: supports
