id: AIMech:TruncatedWirtingerFlowAndTruncatedSpectralInitializationForQuadraticSystems
name: Truncated Wirtinger Flow and Truncated Spectral Initialization for Random Quadratic Systems
concept_kind: algorithm
review_status: DRAFT
definition: "An adaptive nonconvex phase-retrieval and quadratic-sensing algorithm (introduced by Yuxin Chen and Emmanuel J. Cand\xE8s in 2017) that solves $m$ random quadratic equations $y_i = |\\boldsymbol{a}_i^*\\boldsymbol{x}|^2$ (or noisy Poisson intensity observations $y_i \\sim \\mathrm{Poisson}(|\\boldsymbol{a}_i^*\\boldsymbol{x}|^2)$) in $O(m n \\log(1/\\epsilon))$ total flops from an information-theoretically optimal sample size $m \\asymp n$. Rather than minimizing the heavy-tailed quartic intensity residual, Truncated Wirtinger Flow (TWF, Algorithm 1) maximizes the Poisson log-likelihood $\\sum_{i=1}^m [y_i\\log(|\\boldsymbol{a}_i^*\\boldsymbol{z}|^2) - |\\boldsymbol{a}_i^*\\boldsymbol{z}|^2]$ using two statistically adaptive truncation mechanisms: (1) *Truncated Spectral Initialization* (Equations 2.6\u20132.7), which computes the leading eigenvector of $\\boldsymbol{Y} = \\frac{1}{m}\\sum_{i=1}^m y_i\\boldsymbol{a}_i\\boldsymbol{a}_i^*\\mathbb{I}_{\\{|y_i| \\le \\alpha_y^2 (\\frac{1}{m}\\sum_l y_l)\\}}$ discarding measurements where $|y_i|$ exceeds $\\alpha_y^2\\|\\boldsymbol{x}\\|^2$ so that the summands are bounded and concentrate at $m \\asymp n$ via matrix Bernstein; and (2) *Truncated Wirtinger Gradient Updates* $\\boldsymbol{z}^{(t+1)} = \\boldsymbol{z}^{(t)} + \\frac{\\mu_t}{m}\\sum_{i\\in\\mathcal{E}_1^{(t)}\\cap\\mathcal{E}_2^{(t)}} \\frac{y_i - |\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|^2}{\\boldsymbol{z}^{(t)*}\\boldsymbol{a}_i}\\boldsymbol{a}_i$ (Equations 2.4\u20132.5, 2.8\u20132.10), where $\\mathcal{E}_1^{(t)} = \\{\\alpha_z^{\\mathrm{lb}} \\le \\frac{|\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|}{\\|\\boldsymbol{z}^{(t)}\\|} \\le \\alpha_z^{\\mathrm{ub}}\\}$ prevents division by small inner products $|\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|$ and $\\mathcal{E}_2^{(t)} = \\{|y_i - |\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|^2| \\le \\alpha_h K_t \\frac{|\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|}{\\|\\boldsymbol{z}^{(t)}\\|}\\}$ (with empirical median residual $K_t = \\mathrm{median}_i(|y_i - |\\boldsymbol{a}_i^*\\boldsymbol{z}^{(t)}|^2|)$) suppresses high-leverage residual outliers. Theorems 1\u20132 prove linear convergence $\\mathrm{dist}(\\boldsymbol{z}^{(t)},\\boldsymbol{x}) \\le \\delta_0(1-\\rho)^t\\|\\boldsymbol{x}\\|$ with constant step size $\\mu_t = \\mu_0 \\asymp 1$ and minimax-optimal noise stability $\\mathrm{dist}(\\boldsymbol{z}^{(t)},\\boldsymbol{x}) \\lesssim \\frac{\\|\\boldsymbol{\\eta}\\|_2}{\\sqrt{m}\\|\\boldsymbol{x}\\|}$."
identity_notes: "Resolved against all 442 pinned AIO concepts and 685 maintained AIMech concepts. Distinct from `AIMech:WirtingerFlowPhaseRetrievalAndSpectralInitialization` (Cand\xE8s, Li, & Soltanolkotabi 2015, which minimizes the untruncated quartic intensity loss with untruncated spectral initialization, requiring $m \\gtrsim n\\log n$ samples and vanishing step size $\\mu \\lesssim 1/n$ due to fourth-moment heavy tails, whereas Chen & Cand\xE8s 2017 introduce the Poisson log-likelihood formulation, Truncated Spectral Initialization $\\mathbb{I}_{\\{|y_i| \\le \\alpha_y^2\\lambda_0^2\\}}$, and the dual-event gradient truncation rules $\\mathcal{E}_1^{(t)} \\cap \\mathcal{E}_2^{(t)}$ achieving $O(n)$ sample complexity and $O(1)$ step size)."
aliases:
- Truncated Wirtinger Flow (TWF)
- Chen-Candes Truncated Poisson Phase Retrieval
- Truncated Spectral Initialization and Adaptive Gradient Truncation for Quadratic Sensing
