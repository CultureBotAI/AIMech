claims:
- claim_id: r804-claim-bottleneck-and-stacked-ffn-architecture
  kind: mechanism
  statement: MobileBERT pairs a 24-layer Inverted-Bottleneck teacher (IB-BERT_LARGE with inter-block hidden size 512 and intra-block hidden size 1024) with a 24-layer bottlenecked student (inter-block hidden size 512 and intra-block hidden size 128 with 512-dimensional residual connections), and replaces the single FFN in each block with 4 stacked FFNs (128 input/output, 512 intermediate) to restore the 1:2 Multi-Head Attention-to-FFN parameter ratio distorted by the bottleneck projections.
  evidence:
  - source_id: r804-primary-pdf
    locator: Section 2.1 (Bottleneck and Inverted-Bottleneck) & Section 2.2 (Stacked Feed-Forward Networks), Figure 1 & Table 1, Pages 2-3
    relation: supports
  - source_id: r804-primary-pdf
    locator: MHA-to-FFN parameter ratio verification (2:1 with 1 FFN vs 1:2 with 4 stacked FFNs) in main()
    relation: supports
- claim_id: r804-claim-progressive-knowledge-transfer-equations
  kind: mechanism
  statement: Because joint multi-layer transfer across 24 layers can destabilize student optimization, MobileBERT trains the student via L-stage bottom-to-top Progressive Knowledge Transfer (PKT), where stage l freezes lower layers 1..l-1 and minimizes a linear combination of Feature Map Transfer L_FMT^l = (1/(T*N)) sum_{t=1}^T sum_{n=1}^N (H_{t,l,n}^{tr} - H_{t,l,n}^{st})^2 (Eq. 2) and Attention Transfer L_AT^l = (1/(T*A)) sum_{t=1}^T sum_{a=1}^A D_KL(a_{t,l,a}^{tr} || a_{t,l,a}^{st}) (Eq. 3), followed by Pre-training Distillation L_PD = alpha * L_MLM + (1 - alpha) * L_KD + L_NSP (Eq. 4).
  evidence:
  - source_id: r804-primary-pdf
    locator: Section 2.4 (Training Objectives) & Section 2.5 (Training Strategies), Equations 2-4 & Figure 2, Pages 3-4
    relation: supports
  - source_id: r804-primary-pdf
    locator: feature_map_transfer_loss, attention_transfer_loss, and L_PD verification in main()
    relation: supports
- claim_id: r804-claim-operational-optimizations-and-benchmark-performance
  kind: application
  statement: Replacing LayerNorm with the elementwise affine operation NoNorm(h) = gamma o h + beta (Eq. 1), GELU with ReLU, and 768-d embeddings with 128-d embeddings expanded by a kernel-3 1D convolution yields a 25.3M-parameter MobileBERT that is 4.3x smaller and 5.5x faster than BERT_BASE (62 ms vs. 342 ms latency on a Pixel 4 phone), achieving 77.7 GLUE test score (0.6 below BERT_BASE) and 90.0 / 79.2 dev F1 on SQuAD v1.1 / v2.0 (+1.5 / +2.1 F1 over BERT_BASE).
  evidence:
  - source_id: r804-primary-pdf
    locator: Section 2.3 (Operational Optimizations, Eq. 1) & Section 3 (Experiments, Tables 2-4), Pages 3-6
    relation: supports
- claim_id: r804-claim-custom-ib-teacher-pretraining-cost
  kind: limitation
  statement: MobileBERT cannot directly distill intermediate layer feature maps and 4-head attention maps from an off-the-shelf standard BERT_LARGE checkpoint; it requires first pre-training a custom 24-layer Inverted-Bottleneck teacher (IB-BERT_LARGE) from scratch whose inter-block dimension (512) and head count (4) match the student, followed by 24 sequential layer-wise PKT stages.
  evidence:
  - source_id: r804-primary-pdf
    locator: Section 2.1, Section 2.5 (Progressive Knowledge Transfer), and Section 3.1 (Implementation Details), Pages 2-5
    relation: supports
