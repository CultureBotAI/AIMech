id: AIMech:MobileBERTCompactTaskAgnosticBERTWithBottlenecks
name: 'MobileBERT: Compact Task-Agnostic BERT with Bottleneck Structures and Progressive Knowledge Transfer'
concept_kind: architecture
review_status: DRAFT
definition: A deep-and-thin task-agnostic 24-layer Transformer architecture and progressive distillation framework that compresses BERT width rather than depth by equipping both an Inverted-Bottleneck teacher (IB-BERT_LARGE, inter-block hidden dimension 512 and intra-block dimension 1024) and a bottlenecked student (MobileBERT, inter-block dimension 512 and intra-block dimension 128) with shared-dimension linear input/output projections, stacking 4 feed-forward networks per Multi-Head Attention block to restore the 1:2 MHA-to-FFN parameter ratio, compressing token embeddings to 128 dimensions with a kernel-3 1D convolution, replacing LayerNorm and GELU with elementwise affine NoNorm(h) = gamma o h + beta and ReLU, and transferring layer-wise feature maps and attention distributions bottom-to-top across L stages via Progressive Knowledge Transfer (PKT) followed by Pre-training Distillation.
identity_notes: 'Introduced by Zhiqing Sun, Hongkun Yu, Xiaodan Song, Renjie Liu, Yiming Yang, and Denny Zhou (ACL 2020, pp. 2158-2170, arXiv:2004.02984, doi:10.18653/v1/2020.acl-main.195). Distinct from shallow-and-wide BERT distillation methods such as DistilBERT (Round 803), BERT-PKD (Round 802), TinyBERT (Round 800), and MiniLM (Round 801): MobileBERT preserves the full 24-layer depth of BERT_LARGE to avoid the capacity loss of depth reduction and narrows intra-block hidden dimensions via matched inter-block linear bottlenecks (d_inter = 512) so that Feature Map Transfer (Eq. 2) and Attention Transfer (Eq. 3) require no auxiliary projection matrices.'
aliases:
- MobileBERT
- MobileBERT Bottleneck Transformer Architecture
- Inverted-Bottleneck Progressive Knowledge Transfer for MobileBERT
