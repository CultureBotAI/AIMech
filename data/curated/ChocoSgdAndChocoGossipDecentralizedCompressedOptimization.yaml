claims:
- claim_id: r382-exact-average-preservation-and-linear-gossip-convergence
  kind: mechanism
  statement: Because W is symmetric doubly stochastic (sum_i w_{ij} = 1 = sum_j w_{ij}), the gossip update x_i^{(t+1)} = x_i^{(t)} + gamma * sum_j w_{ij} (x_hat_j^{(t+1)} - x_hat_i^{(t+1)}) preserves the exact global mean x_bar^{(t+1)} = x_bar^{(t)} at every step regardless of compressor bias (Remark 14), and Theorem 2 proves that for gamma = delta * omega / (16 * delta + delta^2 + 4 * beta^2 + 2 * delta * beta^2 - 8 * delta * omega) the joint Lyapunov function e_t = E_Q sum_{i=1}^n (||x_i^{(t)} - x_bar||^2 + ||x_i^{(t)} - x_hat_i^{(t+1)}||^2) contracts geometrically as e_t <= (1 - delta^2 * omega / 82) * e_{t-1}.
  evidence:
  - source_id: r382-primary-pdf
    locator: Section 3 Algorithm 1, Theorem 2, and Appendix B Remarks 14-15 & Proof of Theorem 2, pp. 3-4, 13-15
    relation: supports
- claim_id: r382-decentralized-linear-speedup-rate
  kind: mechanism
  statement: For L-smooth mu-strongly convex objectives with local variance sigma_i^2 and second-moment bound G^2, Theorem 4 proves that Choco-SGD (Algorithm 2) with stepsize eta_t = 4 / (mu * (a + t)) and weights w_t = (a + t)^2 achieves E[f(x_avg^{(T)}) - f*] = O(sigma_bar^2 / (mu * n * T)) + O(kappa * G^2 / (mu * omega * delta^2 * T^2)) + O(G^2 / (mu * omega^3 * delta^6 * T^3)), where the leading O(1/(n*T)) term matches centralized uncompressed mini-batch SGD independent of graph spectral gap delta and compression ratio omega.
  evidence:
  - source_id: r382-primary-pdf
    locator: Section 4 Algorithm 2 and Theorem 4, pp. 5-6
    relation: supports
- claim_id: r382-neighbor-replica-memory-and-spectral-gap-limitation
  kind: limitation
  statement: Each node i must maintain replica vectors x_hat_j^{(t)} in R^d for itself and its graph neighbors j in N_i (requiring O(deg(i) * d) memory unless nodes share a common random seed for sparsification), and higher-order transient terms scale inversely with delta^2 * omega.
  evidence:
  - source_id: r382-primary-pdf
    locator: Section 3 Algorithm 1, Theorem 4, and Appendix D Memory Efficient Variant, pp. 4-6, 19
    relation: supports
- claim_id: r382-decentralized-ring-and-torus-optimization-application
  kind: application
  statement: Applied to decentralized optimization and consensus averaging over ring and 2D torus network topologies with 1% Top-k sparsification and 1-bit/low-bit quantization.
  evidence:
  - source_id: r382-primary-pdf
    locator: Section 5 Experiments, Figures 1-3, pp. 6-8
    relation: supports
