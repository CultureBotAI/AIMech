  relation: supports
claims:
- claim_id: directional-soft-penalty
  kind: mechanism
  statement: For a nonzero backpropagated error row vector v at a recurrent step and local state Jacobian
    J, the method encourages norm(v*J)/norm(v) to approach one. Main Equation 9 sums squared deviations
    of this norm ratio from one over time. This is a soft penalty in the currently observed error directions,
    not an orthogonality constraint on every Jacobian direction, a bound on every singular value, or a
    guarantee that all long-range gradient components are preserved.
  evidence:
  - source_id: pascanu2013
    locator: Section 3.3 Equation 9 and following scope discussion, PDF p. 6
    relation: supports
- claim_id: norm-ratio-source-discrepancy
  kind: limitation
  statement: The main paper Equation 9 displays (norm(v*J)/norm(v)-1)^2, whereas main Equation 10, supplementary
    Equation 5 and the pinned author implementation use the squared-norm ratio form (norm(v*J)^2/norm(v)^2-1)^2.
    Both vanish at unit gain, but their values and derivatives differ away from it. The record preserves
    these source formulations explicitly and follows the squared-norm ratio when discussing the inspected
    implementation; it does not silently treat the two penalties as algebraically identical.
  evidence:
  - source_id: pascanu2013
    locator: Equations 9–10, PDF p. 6
    relation: supports
  - source_id: supplement
    locator: Equation 5, printed/PDF p. 4
    relation: supports
  - source_id: authorcode
    locator: jobman, tmp_x, tmp_y and tmp_reg
    relation: supports
- claim_id: immediate-derivative
  kind: mechanism
  statement: 'The added recurrent-weight contribution uses an immediate partial derivative of the local
    penalty: states and backpropagated error vectors are treated as fixed while differentiating the explicit
    recurrent-weight dependence. The author code constructs the penalty with symbolic placeholder states/error
    vectors, differentiates it with respect to W_hh, then substitutes values from backpropagation. This
    is not the full derivative through all recurrent states and loss-gradient dependencies, and it does
    not establish equivalence to optimizing the fully differentiated nested-gradient objective.'
  evidence:
  - source_id: pascanu2013
    locator: Section 3.3 immediate derivative discussion, PDF p. 6
    relation: supports
  - source_id: supplement
    locator: Section 2.2 computational discussion, printed/PDF p. 4
    relation: supports
  - source_id: authorcode
    locator: jobman, d_ht/ht placeholders, TT.grad(tmp_reg,W_hh), then theano.clone
    relation: supports
- claim_id: small-denominator-and-reduction
  kind: limitation
  statement: The supplementary method excludes local contributions whose squared error norm is too small,
    using a reported threshold of 1e-20. The pinned code uses a greater-than-or-equal comparison to its
    configurable bound, substitutes a unit ratio for excluded terms, and normalizes the summed penalties
    by the count of included time/example contributions. If every contribution is excluded, the displayed
    code has a zero numerator and zero normalization denominator without a separate all-masked guard.
    Masking, equality and empty-selection handling are implementation policies, not a proof that the ideal
    ratio is defined for zero error vectors.
  evidence:
  - source_id: supplement
    locator: Section 2.2 small-denominator discussion, printed/PDF p. 4
    relation: supports
  - source_id: authorcode
    locator: jobman, TT.ge(tmp_y,state[bound]), tmp_reg and n_elems reduction; bound default
    relation: supports
- claim_id: composition-with-clipping
  kind: mechanism
  statement: The inspected code adds alpha times the immediate regularizer derivative to the recurrent-weight
    task gradient when enabled, then computes the joint parameter-gradient norm and may clip the combined
    gradient before a vanilla-SGD step. The regularizer and norm clipping address different failure modes
    and remain separate operations. A finite soft penalty does not enforce exact norm preservation, and
    retaining relevant backward signals can still leave exploding gradients or conflict with reducing
    the current task loss.
  evidence:
  - source_id: pascanu2013
    locator: Section 3.3 and Algorithm 1, PDF p. 6
    relation: supports
  - source_id: authorcode
    locator: jobman, alpha contribution before norm_theta and clipstyle branch
    relation: supports
- claim_id: strength-and-evaluation-boundaries
  kind: limitation
  statement: The authors report that this regularizer can hurt learning on complex tasks such as polyphonic
    music and suggest reducing its strength over training, including a 1/t schedule, while noting further
    investigation is needed. The main comparisons combine initialization, minibatch SGD, clipping and
    regularization choices. These are conditional observations, not a universal improvement, convergence
    proof or rule that every recurrent model should use the same penalty strength. No numerical benchmark
    or trained-model reproduction is imported.
  evidence:
  - source_id: pascanu2013
    locator: Section 4 and conclusion, PDF pp. 6–8
    relation: supports
  - source_id: supplement
    locator: Section 2.2 limitations and schedule discussion, printed/PDF p. 4
    relation: supports
