aio_mappings:
- target: AIO:RecurrentNeuralNetwork
  relation: related_match
  rationale: The procedure regularizes error transport through recurrent state transitions. The target
    denotes the network architecture context, not the regularization algorithm itself.
- target: AIO:TrainingStrategy
  relation: related_match
  rationale: The procedure changes model-training gradient contributions. The target supplies training
    context but has a preprocessing genus, so the relation is contextual rather than equivalence or subclass
    membership.
limitations:
- Main Equation 9 uses a norm ratio; Equation 10, supplementary Equation 5 and author code use a squared-norm
  ratio. They share the unit-gain zero but differ elsewhere.
- The immediate derivative freezes states and backward error vectors. No equivalence to a full nested-gradient
  derivative is asserted.
- A directional soft penalty neither constrains every Jacobian direction nor guarantees exact gradient
  preservation, convergence or improved task loss.
- Near-zero error masking and the all-masked normalization require explicit implementation policies; the
  historical code does not show a separate all-masked guard.
- All nine main PDF pages and supplementary printed/PDF pages 2–4 of ten were read, together with complete
  pinned RNN.py and README. Other supplementary pages, task files and framework dependencies were not
  audited.
- No Theano execution, training, numerical benchmark reproduction, current compatibility or independent
  approval is claimed; constructed calculations illustrate algebraic boundaries only.
