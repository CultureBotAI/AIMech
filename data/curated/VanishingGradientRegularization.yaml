id: AIMech:VanishingGradientRegularization
name: Vanishing gradient regularization
aliases: []
concept_kind: algorithm
definition: A recurrent-network training regularization procedure that softly penalizes deviations from
  unit norm gain when a local recurrent Jacobian transports the current backpropagated error direction,
  using an immediate derivative that holds the states and error vectors fixed.
identity_notes: 'Compared all 442 pinned AIO and 569 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 68, 0, 0 lines. Canonical matching lines were read
  as source references, neighboring gradient norm clipping scope statements and pending leads; generated
  full-record search-index matches were classified against the already-read maintained record. No hit
  supplied an existing maintained regularizer identity. A semantic search covered 21 AIO rows and 108
  native definitions: ten AIO and 93 native rows were verified unchanged, and eleven new AIO and fifteen
  new native rows were read. Five complete annotated AIO node/edge/generated contexts and twelve full
  native records were read or verified unchanged. The method softly penalizes backward error norm gain
  and uses an immediate recurrent-weight derivative. It differs from ordinary gradient clipping, coordinate
  moments, parameter-relative rate control, Zoneout stochastic state preservation, activation penalties
  and consistency or representation regularization. RegularizationLayer and ActivityRegularizationLayer
  are layer abstractions, not this directional training algorithm; the RNN and TrainingStrategy mappings
  are contextual only.'
