id: AIMech:AccDngdAcceleratedDistributedNesterovGradientDescent
name: Acc-DNGD (Accelerated Distributed Nesterov Gradient Descent)
concept_kind: algorithm
review_status: DRAFT
definition: An accelerated decentralized first-order optimization method (Qu & Li 2020, Section II, Algorithms 1-2, Equations 3a-3d and 4a-4d) that couples three consensus primal sequences x_i(t), v_i(t), y_i(t) with a dynamic average-gradient tracker s_i(t) over a doubly stochastic mixing matrix W = [w_{ij}], updating x_i(t+1) = sum_j w_{ij} y_j(t) - eta s_i(t), v_i(t+1) = (1 - alpha_t) sum_j w_{ij} v_j(t) + alpha_t sum_j w_{ij} y_j(t) - (eta / alpha_t) s_i(t), y_i(t+1) = (x_i(t+1) + alpha_{t+1} v_i(t+1)) / (1 + alpha_{t+1}), and s_i(t+1) = sum_j w_{ij} s_j(t) + nabla f_i(y_i(t+1)) - nabla f_i(y_i(t)) with s_i(0) = nabla f_i(y_i(0)).
identity_notes: Distinct from unaccelerated Distributed Gradient Tracking / DIGing (AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs, Nedic, Olshevsky, & Shi 2017; Qu & Li 2018), whose iteration complexity scales linearly with the condition number O(kappa) on strongly convex problems and O(1/t) on general convex problems, and from Dual Optimal Decentralized Acceleration (Uribe et al. 2020), which requires Fenchel conjugate oracle evaluations rather than purely primal gradient-tracking Nesterov extrapolation.
aliases:
- Acc-DNGD
- Accelerated Distributed Nesterov Gradient Descent
- Acc-DNGD-SC and Acc-DNGD-NSC
