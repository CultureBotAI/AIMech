id: AIMech:ExtraExactFirstOrderDecentralizedConsensusOptimization
name: EXTRA (Exact First-Order Algorithm for Decentralized Consensus Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: An exact first-order decentralized consensus optimization algorithm for minimizing bar_f(x) = (1/n) sum_{i=1}^n f_i(x) over an undirected connected network (Shi, Ling, Wu, & Yin 2015, Section 2, Algorithm 1, Equations 6-7 and 11), which initializes x^1 = W x^0 - alpha nabla f(x^0) and updates for k >= 0 via the two-step recursion x^{k+2} = (I + W) x^{k+1} - tilde_W x^k - alpha [nabla f(x^{k+1}) - nabla f(x^k)] (equivalently x^{k+1} = tilde_W x^k - alpha nabla f(x^k) + sum_{t=0}^k (W - tilde_W) x^t) using a constant step size alpha > 0 and two symmetric mixing matrices W and tilde_W = (I + W)/2 satisfying (I + W)/2 >= tilde_W >= W and tilde_W > 0.
identity_notes: Distinct from Exact Diffusion (AIMech:ExactDiffusionForDistributedOptimizationAndLearning, Yuan et al. 2019), which applies an adapt-then-combine step psi_i^k = w_i^{k-1} - mu_i nabla J_i(w_i^{k-1}) so that both mixing and gradient differences are premultiplied by A_bar = (I + A)/2 with double the stability range, and from DIGing (AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs, Nedic, Olshevsky, & Shi 2017), which communicates an auxiliary gradient tracker y^k at every iteration rather than maintaining single-vector primal consensus differences.
aliases:
- EXTRA Decentralized Consensus Optimization
- Exact First-Order Algorithm for Decentralized Consensus Optimization
- EXTRA Two-Mixing-Matrix Decentralized Gradient Method
