id: AIMech:OneAndTwoStageAdaptiveStepUpFDRUnderDependence
name: One-stage and two-stage adaptive step-up procedures for false discovery rate control under independence
  and dependence
aliases:
- Blanchard-Roquain One-Stage and Two-Stage Adaptive Step-Up FDR Procedures
- BR-1S-lambda and BR-2S-lambda Adaptive Step-Up FDR Procedures
- Piecewise Inverse-Volume and Markov Two-Stage Adaptive FDR Control
concept_kind: mathematical_method
definition: 'A family of one-stage and two-stage adaptive multiple hypothesis testing procedures developed
  by Gilles Blanchard and Etienne Roquain (2009, Journal of Machine Learning Research 10:2837-2871, arXiv:0707.0536v3)
  that adapt step-up thresholds to the unknown null proportion pi_0 = m_0 / m while controlling the finite-sample
  False Discovery Rate under independent, positively dependent (PRDS), or arbitrarily dependent p-values:
  (1) the one-stage piecewise inverse-volume procedure BR-1S-lambda with threshold collection Delta(i)
  = min(lambda, alpha (1 - lambda) i / (m - i + 1)) (default lambda = alpha), which modifies the asymptotically
  optimal Finner-Dickhaus-Roters rejection curve to guarantee exact finite-sample FDR <= alpha for any
  coordinate-wise non-increasing self-consistent procedure under independence (Theorem 3.1); (2) the two-stage
  plug-in procedure BR-2S-lambda using estimator G_4(p) = (1 - lambda) m / (m - |R_{BR-1S-lambda}(p)|
  + 1), which dominates the Benjamini-Krieger-Yekutieli (2006) estimator G_3 while satisfying the unified
  self-consistent plug-in bound FDR(R) <= (alpha / m) sum_{h in H_0} E[G(p_{0,h})] <= alpha under independence
  (Theorem 3.2 and Corollary 1); (3) the tuning principle lambda = alpha that prevents catastrophic FDR
  inflation under comonotonic/strong positive dependence (Proposition 1); and (4) two-stage adaptive step-up
  procedures for PRDS and arbitrary dependence using either an FWER-controlled first stage Delta(i) =
  alpha_1 (m - |R_0|)^{-1} beta(i) (Theorem 4.1) or an FDR-controlled first stage with the Markov-inequality
  transformation F_kappa(x) = 2 / (kappa - sqrt((kappa^2 - 4 kappa (1 - x))_+)) for x >= 1/kappa (Theorem
  4.2).'
identity_notes: 'Distinct from all 442 pinned AIO concepts and all 594 previously curated AIMech concepts.
  While AIMech:SelfConsistencyAndDependencyControlFDRFramework (Blanchard & Roquain 2008, Electronic Journal
  of Statistics 2:963-992) establishes the general non-adaptive Self-Consistency SC(alpha, pi, beta) and
  Dependency Control DC(beta) framework on volume-measured spaces, Blanchard & Roquain (2009, Journal
  of Machine Learning Research 10:2837-2871, arXiv:0707.0536v3) specifically formulate and analyze pi_0-adaptive
  threshold collections: the one-stage piecewise inverse-volume step-up procedure BR-1S-lambda with Delta(i)
  = min(lambda, alpha (1 - lambda) i / (m - i + 1)) (Theorem 3.1) and its Gaussian signal threshold mu*
  (Lemma 2), the unified coordinate-wise non-increasing plug-in theorem FDR(R) <= (alpha / m) sum_{h in
  H_0} E[G(p_{0,h})] and two-stage procedure BR-2S-lambda with G_4(p) = (1 - lambda) m / (m - |R_{BR-1S-lambda}(p)|
  + 1) (Theorem 3.2, Corollary 1), the exact comonotonic maximal-dependence FDR formulas showing that
  lambda = 1/2 inflates Storey-1/2 FDR to min(alpha m, 1)/2 = 10 alpha whereas lambda = alpha preserves
  exact FDR = alpha (Proposition 1), and the Markov-inequality transformation F_kappa(x) for two-stage
  FDR-to-FDR adaptation under PRDS and arbitrary dependence (Theorem 4.2).'
