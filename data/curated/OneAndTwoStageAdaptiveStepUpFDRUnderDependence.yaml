claims:
- claim_id: one-stage-piecewise-inverse-volume-step-up-and-gaussian-signal-threshold
  kind: mechanism
  statement: Modifying the asymptotically optimal Finner-Dickhaus-Roters (2009) rejection curve alpha
    i / (m - (1 - alpha) i) to obtain non-asymptotic finite-sample control, Theorem 3.1 proves via the
    inverse-binomial expectation bound E[(Y + 1)^{-1}] = (1 - (1 - q)^k)/(k q) <= 1/(k q) for Y ~ Binomial(k,
    q) (Lemma 7) that for any tuning parameter lambda in (0, 1), any coordinate-wise non-increasing procedure
    R self-consistent with respect to the one-stage piecewise inverse-volume threshold collection Delta_{BR-1S-lambda}(i)
    = min(lambda, alpha (1 - lambda) i / (m - i + 1)) controls the False Discovery Rate at level alpha
    under independent conservative p-values; furthermore, at lambda = alpha, Delta_{BR-1S-alpha}(i) strictly
    exceeds the linear step-up threshold alpha i / m whenever i / m > alpha + 1/m, and Lemma 2 proves
    that in the one-sided Gaussian location model with signal strength mu > 0, the asymptotic linear step-up
    rejection proportion exceeds alpha + 1/m with probability tending to 1 if and only if mu > mu* = Phi_bar^{-1}(alpha^2)
    - Phi_bar^{-1}(alpha (1 - pi_0 alpha) / (1 - pi_0)) (e.g., mu* = 1.511105 at pi_0 = 0.5, alpha = 0.05).
  evidence:
  - source_id: blanchard-roquain2009-ar5iv
    locator: Section 3.1, lines 280–376, Theorem 3.1 and Lemma 2; Appendix A.2, lines 742–794; Appendix
      B, lines 942–964, Lemma 7
    relation: supports
  - source_id: blanchard-roquain2009-abs
    locator: Abstract (new one-stage step-up procedure related to the asymptotically optimal rejection
      curve of Finner et al. 2009)
    relation: supports
- claim_id: unified-plug-in-self-consistency-theorem-and-br-2s-dominance
  kind: mechanism
  statement: 'For any inverse null-proportion estimator G: [0, 1]^m -> (0, infty] that is coordinate-wise
    non-increasing in each p_h, Theorem 3.2 proves that any coordinate-wise non-increasing procedure R
    satisfying the adaptive self-consistency condition R(p) subset {h in H : p_h <= (alpha / m) G(p) |R(p)|}
    under independent p-values satisfies FDR(R) <= (alpha / m) sum_{h in H_0} E[G(p_{0,h})] where p_{0,h}
    sets p_h = 0; since E[G_1(p_{0,h})] <= m / m_0 for the Storey (2002) estimator G_1(p) = (1 - lambda)
    m / (m - |R^0_{lambda}(p)| + 1) and the estimator hierarchy satisfies G_3(p) <= G_4(p) <= G_1(p) whenever
    |R_{LSU,lambda}(p)| <= |R_{BR-1S-lambda}(p)| <= |R^0_{lambda}(p)|, Corollary 1 establishes that the
    two-stage adaptive step-up procedure BR-2S-lambda using G_4(p) = (1 - lambda) m / (m - |R_{BR-1S-lambda}(p)|
    + 1) achieves finite-sample FDR <= alpha under independence while strictly dominating the Benjamini-Krieger-Yekutieli
    (2006) procedure BKY06-lambda (G_3) whenever the first stage BR-1S-lambda rejects more hypotheses
    than linear step-up at level lambda.'
  evidence:
  - source_id: blanchard-roquain2009-ar5iv
    locator: Section 3.2, lines 377–459, Theorem 3.2 and Corollary 1; Appendix A.3, lines 795–831
    relation: supports
- claim_id: maximal-comonotonic-dependence-fdr-and-lambda-alpha-robustness
  kind: mechanism
  statement: 'Under the maximal comonotonic positive dependence boundary p_1 = ... = p_m ~ Uniform[0,
    1] with m_0 = m true nulls, Proposition 1 derives exact closed-form False Discovery Rates demonstrating
    that standard constant tuning lambda = 1/2 causes severe FDR inflation: Storey-1/2 has FDR = min(alpha
    m, 1) / 2 (reaching 0.50 = 10 alpha for m >= 20 at alpha = 0.05) and the median quantile procedure
    Quant-1/2 has FDR = 2 alpha / (1 + 2 alpha + 2/m) approx 2 alpha, whereas for any lambda in [lambda_1,
    lambda_2] with lambda_1 = alpha / (1 + alpha + 1/m) and lambda_2 = alpha / (alpha + 1/m) — in particular
    the canonical choice lambda = alpha — BR-1S-alpha, BR-2S-alpha, BKY06-alpha, and Storey-alpha all
    achieve exact FDR = min(lambda, alpha (1 - lambda) / (1 - lambda + 1/m)) = alpha (and Quant-k_0 achieves
    FDR = alpha for k_0 <= (1 - alpha) m + 1).'
  evidence:
  - source_id: blanchard-roquain2009-ar5iv
    locator: Section 3.3, lines 460–517, Proposition 1; Section 5.2, lines 663–716; Appendix A.4, lines
      832–873
    relation: supports
- claim_id: two-stage-fwer-and-markov-fdr-adaptive-step-up-under-dependence
  kind: mechanism
  statement: For general p-value dependency structures without stage independence, Lemma 3 establishes
    the distribution-free and PRDS tail-probability decomposition FDR(R) <= alpha pi_0 t + P(G(p) > t,
    |R| > 0) for any t > 0 (requiring G(p) to be coordinate-wise non-decreasing under PRDS with beta(i)
    = i, and no monotonicity on G under arbitrary dependence with prior-integrated beta_nu(i) = sum_{j=1}^i
    j nu({j})), from which Theorem 4.1 proves that a first-stage alpha_0-FWER procedure R_0 paired with
    second-stage thresholds Delta(i) = alpha_1 (m - |R_0|)^{-1} beta(i) controls FDR <= alpha_0 + alpha_1,
    and Theorem 4.2 proves via Markov's inequality on FDP(R_0) that a first-stage alpha_0-FDR procedure
    R_0 paired with the transformation F_kappa(x) = 2 / (kappa - sqrt((kappa^2 - 4 kappa (1 - x))_+))
    for x >= 1/kappa (with inverse F_kappa^{-1}(t) = kappa^{-1} t^{-2} - t^{-1} + 1 satisfying (1 - t^{-1})
    F_kappa^{-1}(t) = (kappa t)^{-1}) and second-stage thresholds Delta_1(i) = alpha_1 beta(i) F_kappa(|R_0|/m)
    / m controls FDR <= alpha_1 + kappa alpha_0 while dominating non-adaptive step-up whenever |R_0|/m
    > F_2^{-1}(2) = 0.625 (at kappa = 2, alpha_0 = alpha/4, alpha_1 = alpha/2).
  evidence:
  - source_id: blanchard-roquain2009-ar5iv
    locator: Section 4, lines 519–629, Lemma 3, Theorems 4.1–4.2, and Equation (12); Appendix A.5, lines
      874–940
    relation: supports
