id: AIMech:AdaCompAdaptiveResidualGradientCompression
name: AdaComp (Adaptive Residual Gradient Compression)
concept_kind: algorithm
review_status: DRAFT
definition: An O(N) sorting-free residual gradient compression algorithm for data-parallel distributed deep learning that updates each layer's accumulated residual gradient G = residue + dW and forms a soft-threshold comparison vector H = G + dW = residue + 2 dW, uniformly partitions G into fixed-length bins of size L_T, computes each bin's local maximum absolute value g_max(i) = max_{j in bin i} |G(index)|, transmits and quantizes all bin entries satisfying |H(index)| >= g_max(i) into a sign bit times a single layer-wide scale factor equal to the mean of g_max across all bins, and retains the quantization error G(index) - G_q(index) and all untransmitted bin entries in residue(index) for the next mini-batch.
identity_notes: Distinct from 1-bit SGD (AIMech:OneBitStochasticGradientDescent, Seide et al. 2014) and TernGrad (AIMech:TernGradTernaryGradients, Wen et al. 2017), which quantize dense gradient vectors without local-bin sparsity selection and either diverge on convolutional layers when combined with FC compression or cap compression at 16x. Distinct from fixed-threshold compression (Strom 2015), fixed-percentage global top-k sorting (Dryden et al. 2016), and Deep Gradient Compression (AIMech:DeepGradientCompression, Lin et al. 2018), which rely on global thresholding or sorting rather than O(N) localized bin sampling with the self-adjusting soft threshold |residue + 2 dW| >= g_max(i).
aliases:
