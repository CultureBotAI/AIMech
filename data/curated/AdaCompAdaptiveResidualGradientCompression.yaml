claims:
- claim_id: r629-local-bin-soft-threshold-and-mean-gmax-quantization
  kind: mechanism
  statement: For each layer, AdaComp computes the updated residual gradient G = residue + dW and the doubled-gradient probe H = G + dW = residue + 2 dW, divides G into uniform bins of length L_T, finds each bin's local maximum magnitude g_max(i), and transmits every element satisfying |H(index)| >= g_max(i) quantized as G_q(index) = sign(G(index)) * s where s = (1 / B) sum_{i=1}^B g_max(i) is the layer-wide mean of the bin maxima, updating residue(index) <- G(index) - G_q(index) for transmitted elements and residue(index) <- G(index) for untransmitted elements in O(N) time without sorting (Algorithm 2).
  evidence:
  - source_id: r629-primary-pdf
    locator: Adaptive Residual Gradient Compression (AdaComp) Technique & Algorithm 2, pp. 3-4
    relation: supports
- claim_id: r629-self-adjusting-sparsity-prevents-residual-explosion
  kind: mechanism
  statement: "Unlike hard Local Selection (LS) without a soft threshold\u2014which transmits only a fixed number of bin maxima and suffers a positive-feedback loop at L_T >= 300 where untransmitted residual gradients (RG) and weight gradients (dW) grow exponentially to [-240K, 239K] and cause model divergence\u2014AdaComp's soft threshold |residue + 2 dW| >= g_max(i) automatically transmits more elements in early epochs (when residues are small relative to dW) and drains clusters of near-maximal residues together, bounding residual gradients within [-0.015, 0.015] even at L_T = 5000 (~2000x compression, Figures 4-6)."
  evidence:
  - source_id: r629-primary-pdf
    locator: 'Discussions: Robustness of the AdaComp Technique, Figures 4-6, pp. 6-7'
    relation: supports
- claim_id: r629-conv-40x-and-fc-lstm-200x-compression-across-optimizers
  kind: application
  statement: Using fixed bin sizes of L_T = 50 for convolutional layers (encoded with 8-bit sparse-indexed ternarized representations for L_T < 64) and L_T = 500 for fully-connected and recurrent layers (encoded with 16-bit sparse-indexed ternarized representations), AdaComp selects an average of up to 5 elements per bin to achieve ~40x effective compression on convolutional layers and ~200x effective compression on fully-connected and LSTM layers across MNIST-CNN, CIFAR10-CNN (up to 128 learners), AlexNet, ResNet18, ResNet50 on ImageNet, BN50-DNN speech recognition, and Shakespeare LSTM under both momentum SGD and Adam without noticeable accuracy degradation (Table 2, Figures 2-3).
  evidence:
  - source_id: r629-primary-pdf
    locator: Experiment Results, Table 2 & Figures 2-3, pp. 4-6
    relation: supports
  - source_id: r629-metadata-cr
    locator: AAAI 2018 bibliographic record (conf/aaai/ChenCBAZG18)
    relation: supports
- claim_id: r629-minibatch-size-activity-and-variable-message-length
  kind: limitation
  statement: Increasing the per-learner mini-batch size increases input feature activity across bins so that more residues satisfy |residue + 2 dW| >= g_max(i), reducing the achievable effective compression rate at fixed accuracy (Figure 7a), and the number of transmitted elements varies dynamically across bins, layers, and epochs rather than guaranteeing a fixed per-step message size.
  evidence:
  - source_id: r629-primary-pdf
    locator: Impact of mini-batch size and number of learners, Figure 7(a)-(b), pp. 7-8
    relation: supports
