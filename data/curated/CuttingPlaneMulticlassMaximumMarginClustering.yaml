limitations:
- This record describes the printed working-set and frozen-winner procedure with explicit tie and nonconvexity
  limits. No unmentioned tie repair, globally optimal restricted solver, global optimum or universal convergence
  guarantee is silently supplied.
- The class count, fixed kernel/features, regularization beta, score-balance bound and epsilon are supplied
  choices. Pairwise score balance is not class-count balance; the displayed formulation has no intercept.
- All eight paper pages, tables and figures were read. Experiments supply true class counts, use selected
  datasets and kernel tuning, and assess majority-label accuracy per cluster and Rand index. The tables
  include accuracy and runtime cases favoring comparators, so no universal superiority is asserted. No
  historical implementation or benchmark was reproduced.
