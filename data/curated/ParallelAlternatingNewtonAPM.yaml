name: Parallel alternating Newton-like algorithm for APM
definition: A block-alternating Newton-like method for fitting an admixture of Poisson Markov random fields
  through a sparsity-penalized nodewise Poisson regression surrogate, alternating topic coefficients with
  document-specific simplex weights and parallelizing independent subproblems.
concept_kind: algorithm
identity_notes: This is the fitting procedure named in Section 3 of Inouye et al. 2014, distinct from
  the APM probability-model construction, generic pseudolikelihood estimation and posterior EM. Its defining
  split yields word-specific coefficient problems and document-specific simplex problems. The inspected
  released solver represents independent directed nodewise coefficients; model validity requires separate
  compatibility and normalization restrictions. It is not generic Newton optimization, QUIC itself or
  a particular trained topic model. No normalized identity match was found across all 442 pinned AIO labels
  and scoped synonyms and 421 preceding native IDs, names and aliases. Full-checkout fixed-string searches
  in worktree and main included ignored and hidden files. Ten matched lines in each checkout concern prior
  discovery references, raw search/abstract captures and downloaded-source metadata; these were classified
  by their file/field context and matched excerpts, not treated as ontology identities. All 192 semantic
  label/synonym hits were read. Nineteen exact annotated CLASS nodes and outgoing edges were inspected,
  with 13 verified equal to prior reading and six newly read. Thirty-four contextual YAMLs comprise 19
  AIO and 15 native records; eight were fully read here, three final round99 records were hash-verified
  after full reading, and 23 were byte-verified after earlier full reading. Absence is bounded to the
  pinned snapshot, maintained corpus and inspected semantic neighborhood.
limitations:
- Convexity of each fixed block does not imply joint convexity, uniqueness, global optimality or convergence
  for every approximate implementation. Degenerate curvature, numerical overflow and stopping tolerances
  require care; empirical parallel timing is not a universal complexity or speedup guarantee.
- Independent nodewise Poisson conditionals may be mutually incompatible. Even symmetrizing coefficients
  does not make unrestricted positive raw-count interactions normalizable. OR/AND edge support post-processing
  and coefficient averaging do not establish causal or conditional-independence semantics for an invalid
  joint model.
- For the stated average objective, the printed component gradient needs compatible matrix orientation,
  the augmented self-row index needs its intercept offset, and curvature terms require 1/n. The printed
  Armijo penalty difference lacks lambda. The released code resolves several of these notational issues
  but also omits lambda in that Armijo expression; a separate objective-decrease guard remains. No general
  convergence theorem is certified from the displayed pseudocode or this static code reading.
- In the release, the n>5000 block-gradient loop covers rows 1 through p although the augmented design
  has p+1 rows, omitting its final feature row. The simplex subsolver does not explicitly handle zero
  pair curvature. These bounded static observations are not a benchmark reproduction or a claim that every
  fitted result fails.
- The released core routines and options do not implement the papers beta pseudocount prior. The paper
  names additional experimental settings; their equivalence to this release is not assumed. Held-out selection
  fits document weights and compares the surrogate, not a verified exact marginal document likelihood.
- The model definition, raw regression surrogate and modified-statistic constructions must remain distinct.
  The separate APM-native model record requires a proper shared base distribution; this estimator does
  not automatically supply one.
