claims:
- claim_id: alternating-surrogate
  kind: mechanism
  statement: For nonnegative count vectors x_i, K topics and simplex weights w_ij, define eta_is=sum_j
    w_ij*(a_js+sum_{t!=s} b_jts*x_it). Minimize F=(1/n)*sum_is[exp(eta_is)-x_is*eta_is]+lambda*sum_j,s,t!=s
    abs(b_jts), with unpenalized intercepts a_js and nonnegative lambda. Constants independent of fitted
    parameters are omitted. Fixing document weights gives separate convex penalized problems for each
    response word; fixing topic coefficients gives separate convex simplex problems for each document.
    Alternate the two blocks. The coefficient solver uses active/free coordinates, quadratic approximations,
    approximate coordinate-descent Newton directions and backtracking. The weight solver uses a quadratic
    approximation with pairwise coordinate transfers respecting the simplex. The paper traces decreasing
    regularization from an independent-component fit. These are point estimates under a surrogate, not
    posterior-responsibility E-steps, exact joint likelihood optimization or a globally convex joint problem.
