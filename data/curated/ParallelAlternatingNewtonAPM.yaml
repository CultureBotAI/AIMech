- claim_id: implementation-boundary
  kind: limitation
  statement: The inspected v0.9.1 source uses raw counts and exponentiated linear predictors, fits asymmetric
    zero-diagonal nodewise coefficients, and returns those directed coefficient arrays. It does not impose
    the sufficient-statistic modifications, sign restrictions or joint-compatibility constraints needed
    to establish a proper positive-interaction Poisson MRF. The code normalizes initial document weights
    and retains unpenalized intercepts and 1/n component curvature scaling, clarifying omissions in the
    printed pseudocode. It also caps computed rates at 1e300; that numerical safeguard is not a normalized-model
    construction. Static inspection establishes these code paths, not the behavior of every historical
    experiment or unseen implementation.
  evidence:
