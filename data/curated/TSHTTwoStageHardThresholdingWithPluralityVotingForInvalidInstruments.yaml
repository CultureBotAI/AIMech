id: AIMech:TSHTTwoStageHardThresholdingWithPluralityVotingForInvalidInstruments
name: TSHT Two-Stage Hard Thresholding with Plurality Voting for Invalid Instruments
concept_kind: mathematical_method
review_status: DRAFT
definition: An instrumental variable causal inference and confidence interval construction method for settings with invalid instruments that first applies hard thresholding to first-stage exposure-instrument regression coefficients (or high-dimensional debiased Lasso estimates) to select relevant instruments, and second applies pairwise hard thresholding to candidate invalidity residuals to construct a symmetric voting matrix whose plurality winner identifies the set of valid instruments for post-selection causal effect estimation.
identity_notes: No AIO class represents Two-Stage Hard Thresholding with Plurality Voting for invalid instrumental variables; LinearRegression (AIO:LinearRegression) is the closest broad match covering linear instrumental variable regression models.
aliases:
- TSHT with Plurality Voting
- Two-Stage Hard Thresholding with Voting for Invalid Instruments
- TSHT Instrumental Variable Estimator
