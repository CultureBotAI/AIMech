claims:
- claim_id: plurality-rule-causal-effect-identification
  kind: mechanism
  statement: 'Under the plurality rule (Condition IN1-P), the causal effect beta^* is uniquely identified whenever the set of valid relevant instruments S^* = {j in S : pi_j^* = 0} is strictly larger than any cluster of invalid relevant instruments sharing a common non-zero ratio pi_j^* / gamma_j^* = c != 0 (Theorem 1), strictly relaxing the 50% majority validity requirement.'
  evidence:
  - source_id: r832-primary-pdf
    locator: Section 2.2, Condition IN1-P and Theorem 1, pp. 6-7
    relation: supports
- claim_id: two-stage-hard-thresholding-and-symmetric-voting-matrix
  kind: mechanism
  statement: Stage 1 selects strong relevant instruments S_hat by hard thresholding first-stage estimates |gamma_hat_j| against a noise-calibrated threshold (Equations 5-6), and Stage 2 evaluates each candidate beta^[j] = Gamma_hat_j / gamma_hat_j across all k in S_hat by hard thresholding the invalidity residual Gamma_hat_k - beta^[j] gamma_hat_k to form a symmetric binary voting matrix V_hat and select the plurality winner S_hat_V (Equations 7-12).
  evidence:
  - source_id: r832-primary-pdf
    locator: Section 3.2-3.5, Equations 5-12, pp. 8-11
    relation: supports
- claim_id: mendelian-randomization-and-econometric-iv-application
  kind: application
  statement: TSHT with voting is applied to construct asymptotically valid confidence intervals for causal effects in low- and high-dimensional instrumental variable regressions and Mendelian randomization studies with pleiotropic genetic variants.
  evidence:
  - source_id: r832-primary-pdf
    locator: Section 3.7, Equations 13-17, pp. 12-14; Section 5-6, pp. 19-28
    relation: supports
- claim_id: plurality-violation-and-weak-instrument-screening-limitation
  kind: limitation
  statement: TSHT requires the plurality rule (Condition IN1-P) and sufficient first-stage instrument strength to pass Stage 1 hard thresholding; if a coordinated pleiotropic mechanism causes a single non-zero ratio c != 0 to outnumber the valid instruments, or if valid instruments are too weak to survive Stage 1 screening, TSHT can select an invalid cluster.
  evidence:
  - source_id: r832-primary-pdf
    locator: Section 2.2, p. 6; Section 3.2, p. 9; Section 4.1, Theorem 2 conditions, pp. 14-16
    relation: supports
