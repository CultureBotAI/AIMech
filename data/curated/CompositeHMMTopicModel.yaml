name: Composite HMM-topic model
definition: A generative sequence model combining an HMM class sequence with a document topic mixture,
  where one designated class emits words through latent topics and each other class emits words from its
  own categorical distribution.
concept_kind: model_family
identity_notes: 'Scoped to the composite model of Griffiths, Steyvers, Blei and Tenenbaum''s Integrating
  Topics and Syntax. The maintained name describes that source-defined construction; no additional acronym
  is asserted as a source synonym. All tokens follow class transitions, while only the semantic class
  uses the document-topic mixture. This differs from independent topic models, generic HMMs, a product
  of HMM experts, or modern mixture-of-experts language models. No normalized candidate identity matched
  all 442 pinned AIO IDs, labels and scoped synonyms or 426 preceding native IDs, names and aliases. Both
  full-checkout searches included ignored and hidden files; 13 matching lines in each checkout came from
  four unique file contents containing prior frontier leads, contextual distinctions and a cached bibliography
  mention. Matching concept excerpts were inspected; the long cached web transcript was not reread in
  full. Semantic search returned 204 label/synonym hits: 200 verified unchanged from prior reading and
  four newly read. Eighteen annotated AIO CLASS nodes and outgoing edges comprise 16 verified unchanged
  and two newly read; 30 contextual YAMLs comprise 25 unchanged prior readings, two newly read AIO records
  and three final records verified against the round101 scientific-review inputs. No candidate identity
  is present within this bounded pinned-snapshot and maintained-corpus search.'
limitations:
- The distinction between syntactic classes and semantic topics is induced by this model and corpus. It
  need not coincide with linguistic ground truth, supervised part-of-speech tags or full grammar. Fixed
  class/topic counts and finite-state local transitions restrict its scope.
- The source LDA comparison uses a semantic class plus a dedicated sentence-marker class with the stated
  boundary handling; arbitrary two-state HMMs are not equivalent to LDA. With one topic, the semantic
  emission has its own prior, so the resulting HMM comparison must preserve those hyperparameters.
- A finite auxiliary-update invariance calculation supports a compatible semantic-only interpretation;
  it is not a proof that historical software followed that convention or that finite chains mixed. The
  displayed first-order transition formula requires additional factors for higher-order contexts.
- Historical results use particular Brown, TASA and NIPS preparations. Adjusted Rand agreement is not
  supervised tag accuracy, and the reported harmonic-mean evidence estimate is not exact marginal likelihood
  or guaranteed stable. The document-classification experiment reports LDA somewhat better. No universal
  advantage or empirical reproduction is asserted.
