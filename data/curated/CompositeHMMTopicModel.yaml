claims:
- claim_id: class-dependent-emission
  kind: mechanism
  statement: A document draws a Dirichlet topic vector. An HMM generates the token-class sequence. If
    a token occupies the designated semantic class, a topic selected from the document vector determines
    its word distribution; otherwise its class-specific word distribution generates the token. The Bayesian
    formulation puts symmetric Dirichlet priors on topic emissions, nonsemantic class emissions and transition
    rows. The source draws a topic at every position, but topics unused by nonsemantic emissions can be
    marginalized. The displayed model is first order; experiments also use higher-order transitions and
    a dedicated sentence-marker state. Initial and boundary conventions, class count, topic count and
    vocabulary are part of a complete specification.
  evidence:
  - source_id: method-source
    locator: Sections 2.1-2.2, PDF pp.3-4, Figure 1, generative steps and prior definitions
    relation: supports
- claim_id: collapsed-auxiliary-inference
  kind: mechanism
  statement: The source alternates topic and class updates with parameters integrated out. Its document-topic
    counts include semantic tokens only, and the first-order class update accounts for both neighboring
    transitions, including corrections when they share a transition row or cell. A coherent interpretation
    first marginalizes unused topics, then introduces a temporary topic for the currently updated nonsemantic
    token from the leave-one-out document predictive law. Updating that topic and then the class allows
    the common document-topic factor to cancel in the class conditional; discard the temporary topic if
    the resulting class is nonsemantic. This is an explicit curator interpretation of the printed count
    convention, checked in a small enumerated model, not a claim about unseen author code. Retaining all
    inactive topic draws in a fully augmented sampler would instead require document counts over all those
    draws.
  evidence:
  - source_id: method-source
    locator: Section 2.2, PDF pp.3-4, topic and class conditionals and semantic-only count statement
    relation: supports
