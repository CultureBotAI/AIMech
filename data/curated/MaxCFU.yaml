name: MAXCFU
definition: A multivariate sensitivity algorithm that uses gradient ascent through fitted additive-noise
  models to search for large counterfactual prediction discrepancies under bounded correlations of structural
  error terms.
concept_kind: evaluation_method
identity_notes: MAXCFU is the named optimization-based tool for multivariate confounding, distinct from
  the bivariate grid procedure, its CFU discrepancy and the counterfactual-fairness criterion. The record
  describes the published search procedure, not a certified optimizer. All 442 pinned AIO labels/scoped
  synonyms and 99 preceding native identities were compared, together with hidden/ignored-inclusive searches
  of both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- The published off-diagonal tanh transformation gives a symmetric unit-diagonal matrix with bounded entries
  but explicitly does not guarantee positive semidefiniteness. A resulting matrix is therefore not automatically
  a valid correlation matrix.
- Nested fitting and the outer search are nonconvex; local optimization, initialization and differentiation
  through fitting matter. No certified global worst-case value is asserted.
- Sensitivity is conditional on the assumed structural model, predictor, intervention, confounding budget
  and sample. It does not identify the true hidden confounding or establish overall fairness.
- The sparse clique parameterization is discussed but not exercised in the paper’s experiments, and its
  expressivity and numerical constraints are not certified here.
aliases:
- Optimization-based counterfactual-fairness sensitivity
id: AIMech:MaxCFU
