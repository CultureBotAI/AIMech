  relation: supports
claims:
- claim_id: method-scope
  kind: mechanism
  statement: Fit the working model and its residual-based predictor once. Parameterize candidate error
    correlations through a transformed matrix product, fit the alternative model for each candidate, propagate
    counterfactual features, and measure squared prediction changes using the original predictor and working-model
    residual transform. Algorithm 1 uses minibatches and automatic differentiation to ascend this discrepancy
    with respect to the correlation parameters, then evaluates it on the full data.
  evidence:
  - source_id: original-paper
    locator: Sections 4.1–4.3, equation (7) and Algorithm 1 MAXCFU, PDF pp. 6–8; Section 3.4 equation
      (6) for the discrepancy
    relation: supports
- claim_id: optimization-limits
  kind: limitation
  statement: The supplement identifies nested local likelihood fitting and a nonconvex sensitivity objective
    as computational obstacles. Its matrix counterexample shows that setting all allowed correlations
    to the same bound can produce an invalid covariance structure; it does not supply a general global-optimization
    guarantee.
  evidence:
  - source_id: supplement
    locator: Supplementary material, Appendices A–B, PDF p. 1
    relation: supports
