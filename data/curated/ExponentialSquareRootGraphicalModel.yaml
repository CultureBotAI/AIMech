claims:
- claim_id: method
  kind: mechanism
  statement: On X_i>=0 relative to product Lebesgue measure, define p(x)=Z^(-1)*exp[sum_i theta_i*sqrt(x_i)+sum_i
    Phi_ii*x_i+2*sum_(i<j) Phi_ij*sqrt(x_i*x_j)], with symmetric Phi and finite positive Z. The site conditional
    has kernel exp[Phi_ii*t+eta_i*sqrt(t)], t>=0, with eta_i=theta_i+2*sum_(j!=i) Phi_ij*sqrt(x_j). A
    sufficient regime for every finite theta is u^T Phi u<0 for every nonzero u>=0. Continuity on the
    compact nonnegative unit sphere then gives u^T Phi u<=-c*||u||^2 for some c>0. With u_i=sqrt(x_i),
    Young’s inequality bounds theta_i*u_i by epsilon*x_i+theta_i^2/(4*epsilon), where 0<epsilon<c; the
    joint kernel is dominated by an integrable constant times exp[-(c-epsilon)*sum_i x_i]. Whole-space
    negative definiteness is sufficient, not necessary. With theta=0 and diagonal negative Phi, the variables
    are independent exponentials of rates -Phi_ii. Flat quadratic boundary cases require separate linear-in-root
    tail analysis.
