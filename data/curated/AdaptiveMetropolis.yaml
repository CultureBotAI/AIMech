name: Adaptive Metropolis
definition: A history-adaptive random-walk Metropolis sampler whose Gaussian proposal covariance is estimated
  from the accumulated retained states, including repetitions after rejected proposals.
concept_kind: algorithm
identity_notes: This record identifies covariance adaptation from the full retained history, distinguished
  from a fixed random-walk kernel, finite sliding-window adaptation, scale-only tuning and RAM direction-based
  adaptation. The original empirical-covariance form and later recursive modifications share this core
  but differ in update timing and regularization. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 181 prior native IDs/names/aliases. Ignored-inclusive searches
  of both full checkouts found prior discovery leads, neighboring sampler discussions and unrelated author-name/environment
  substrings. Existing random-walk Metropolis, delayed-rejection, fixed symmetric delayed-rejection and
  RAM records were inspected; shared components do not make these procedures equivalent.
limitations:
- The 2010 source explicitly analyzes a recursive modification, not an exact restatement of the original
  unbiased sample covariance. Its displayed outline also shifts the covariance index; the original timing
  is stated explicitly here.
- The original full-method text was read through a public indexed PDF. Direct download returned 403 and
  no visible page images were obtained; no original-PDF hash or visual inspection is claimed. The 2010
  method pages were read and visually checked.
- The original bounded-support result and the later regular superexponential-tail results have different
  hypotheses. Neither licenses arbitrary targets or unrestricted adaptive variants.
- The usual dimension-based scale is a tuning heuristic under particular target assumptions, not a universal
  optimum. Empirical covariance estimation can be unsuitable for distributions without finite second moments.
- The sampled-state sequence alone is history dependent; invariant kernels at frozen settings do not by
  themselves prove adaptive convergence.
