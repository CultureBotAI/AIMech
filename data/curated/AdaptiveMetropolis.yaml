claims:
- claim_id: method
  kind: mechanism
  statement: Start at a state with positive target density. In the original form, after an initial period
    with a chosen positive-definite C0, propose Y from N(X_(t−1), C_t), where C_t=s_d[Cov(X_0,...,X_(t−1))+epsilon
    I], epsilon>0 and s_d>0. The empirical covariance uses every retained state, with denominator t−1
    for t available states; choose the adaptation start after at least two states. Accept with min(1,pi(Y)/pi(X_(t−1)))
    and otherwise repeat the old state. The fixed-covariance Metropolis rule is used at each iteration,
    but adapting C_t from the sampled history requires a separate validity argument.
