name: Stochastic beam search
definition: The sequence-sampling algorithm of Kool, van Hoof and Welling that implements Gumbel-Top-k
  without replacement implicitly on a locally normalized sequence tree by propagating conditional perturbed
  subtree maxima and retaining the k highest-scoring prefixes at each level.
concept_kind: algorithm
identity_notes: 'This record denotes the 2019 Gumbel-based sequence sampler, not every search algorithm
  called stochastic beam search. The generic Gumbel-Top-k distributional construction is a separate record.
  The method differs from independently resampling prefixes at every beam step, ordinary probability-ranked
  beam decoding, and diversity-penalized beam groups. An earlier search hit about coalition-formation
  scatter search is a separate title lead, not evidence of equivalence. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 328 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 49 and 49 lines
  respectively. All 2 unique hit contents were inspected: a saved stochastic-beam/Gumbel discovery lead
  and a search-result title about coalition-formation scatter search, not existing candidate records.
  Exact checkout counts and differences are retained in the ledger. Nine exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and four full native neighboring records were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.'
limitations:
- The requested sample count must not exceed the number of positive-probability complete leaves. Zero-mass
  branches require exclusion or an explicit limiting representation; an exhausted support is not a source
  of additional distinct samples.
- The exact sampling statement requires consistent conditional subtree maxima and the declared normalized
  sequence distribution. Independently resampling prefixes at each depth, using raw length-normalized
  scores, or transplanting ordinary beam early stopping does not inherit that statement.
- The paper assumes common-length sequences with padding possible. Variable-length generation requires
  an explicit terminal/EOS policy preserving the intended leaf distribution; arbitrary forced truncation
  or nonterminating probability mass is not silently covered.
- The linear-in-k-and-length claim concerns the number of model evaluations. Vocabulary expansion, top-k
  selection, neural-state storage and numerical operations still have costs; this is not a bound independent
  of vocabulary size or model cost.
- The conditional-maximum formula can be numerically unstable in direct exponential form. Appendix B supplies
  stable transformations; exact distributional reasoning is not a certification of finite-precision implementation.
- Distinct complete samples can share prefixes and need not have high semantic diversity or be the unperturbed
  MAP sequences. Without-replacement samples are dependent, and arbitrary unweighted sample averages are
  not automatically unbiased.
