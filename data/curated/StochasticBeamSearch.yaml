claims:
- claim_id: method
  kind: mechanism
  statement: Represent complete sequences as leaves of a finite locally normalized prefix tree, using
    a declared common horizon or probability-preserving padding of completed sequences. A prefix log probability
    is the log of its descendant probability mass. Its stochastic score represents the maximum perturbed
    leaf log probability in that subtree. Start at the root; its maximum may be sampled from Gumbel(0)
    or fixed at zero as in Algorithm 1, since the maximum is independent of the selected ranking. For
    each retained parent with stochastic score T, sample independent child values G_i from Gumbel(phi_i),
    where phi_i is the child’s cumulative log probability; let Z=max_i G_i, then transform each to −log(exp(−T)−exp(−Z)+exp(−G_i)).
    This samples child maxima conditionally on their maximum being the parent’s T. Pool child candidates
    and retain up to k with the largest transformed scores, repeating through the declared horizon. Under
    the stated finite normalized tree construction this returns the same ordered without-replacement sequence
    distribution as explicitly applying Gumbel-Top-k to all complete leaves. The ordering is by perturbed
    score, not raw sequence probability.
  evidence:
  - source_id: method-source
    locator: Sections 2.5–2.6 and 3.1–3.3, Figure 1, Equations (8)–(10), Algorithm 1 and footnote 2, PDF
      pp.2–5
    relation: supports
  - source_id: conditional-sampling
    locator: Appendices B.1–B.3, Equations (20)–(24), supplement PDF pp.1–2
    relation: supports
- claim_id: language-generation
  kind: application
  statement: The paper develops sequence sampling as an alternative to ordinary sampling and deterministic
    beam decoding for language generation, and studies translation as its principal application. This
    is a procedure operating on a probability-supplying model, not a trained model identity or a universal
    translation-quality claim.
  evidence:
  - source_id: method-source
    locator: Abstract and Introduction, PDF p.1; Sections 2.5 and 4.1, PDF pp.2 and 5
    relation: supports
- claim_id: prefix-consistency
  kind: scope
  statement: Retained branches carry a consistent conditional perturbation. More than one final sample
    may share a prefix; requiring exactly one descendant per earlier beam member changes the sampling
    procedure. The source also distinguishes this construction from independently choosing fresh random
    prefixes at every depth.
  evidence:
  - source_id: method-source
    locator: Section 3.2 continuation, PDF p.5
    relation: supports
