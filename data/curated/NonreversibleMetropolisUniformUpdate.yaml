id: AIMech:NonreversibleMetropolisUniformUpdate
name: Nonreversible Metropolis uniform update
concept_kind: algorithm
definition: A Metropolis transition algorithm that retains a signed uniform acceptance variable, updates
  it by wrapped translation, and rescales it after an accepted state proposal to preserve a joint target
  distribution while changing the temporal dependence of acceptance decisions.
definition_evidence:
- source_id: neal2020
  locator: Section 2, PDF p. 2, Equations 1–2 and the augmented-state derivation
  relation: supports
claims:
- claim_id: joint-target-and-wrapped-update
  kind: mechanism
  statement: In the maintained regular case, let pi be a proper target density that is positive on the
    state space used by the proposal. Retain the full state (x,v), with joint target pi(x) times Uniform(−1,1),
    and use u=abs(v) as the acceptance threshold. The equivalent height s=abs(v)*pi(x) is uniform between
    zero and pi(x), conditional on x. Replace v by v+delta+noise, wrapped modulo 2 into the signed interval.
    A fixed shift delta and a noise law independent of the current v preserve its conditional uniform
    distribution. The signed value, or equivalent direction information, must be retained; abs(v) alone
    does not determine the stated wrapped update.
  evidence:
  - source_id: neal2020
    locator: Section 2, PDF p. 2, under-density augmentation and Equation 1
    relation: supports
- claim_id: accepted-state-rescaling
  kind: mechanism
  statement: For a symmetric stochastic proposal q(x,y)=q(y,x) whose distribution does not depend on v,
    propose y and accept when abs(v)<pi(y)/pi(x). On acceptance replace (x,v) by (y,v*pi(x)/pi(y)); on
    rejection retain both x and v for this accept/reject substep. The rescaling preserves the under-density
    height and is required for both lower-density and higher-density accepted moves. Together with the
    wrapped uniform update, this preserves the joint target. The target-density ratio alone is not a general
    acceptance rule for an asymmetric proposal.
  evidence:
  - source_id: neal2020
    locator: Section 2, PDF p. 2, acceptance paragraph and Equation 2; symmetric Gaussian random-walk
      proposal, Section 3, p. 3; proposal-domain qualification and exact counterexample in research/discovery/nonreversible-boundaries.py
    relation: supports
- claim_id: composition-and-stationary-acceptance
  kind: limitation
  statement: 'Invariance of the joint target does not imply detailed balance or ergodicity. Reversibility
    of the threshold-update substep alone also does not determine reversibility of the full update: exact
    examples remain nonreversible after a half-period wrapped shift or after a full uniform refresh followed
    by accept/rescale. A fresh uniform before every proposal recovers ordinary Metropolis for the x process,
    but the augmented output includes the rescaled v. For repeated accept/rescale updates with zero shift,
    no noise and no other state updates, the under-density height remains fixed, providing no general
    ergodicity guarantee. At stationarity, using the same proposal kernel, the mean acceptance probability
    agrees with ordinary Metropolis because abs(v) is uniform and independent of x; temporal clustering
    can nevertheless change.'
  evidence:
  - source_id: neal2020
    locator: Section 2, PDF pp. 2–3, invariance, noise and acceptance-rate discussion; composition counterexamples
      derived in research/discovery/nonreversible-boundaries.py
    relation: supports
- claim_id: augmented-momentum-and-interleaving-scope
  kind: scope
  statement: The illustrated persistent-momentum application uses partial Gaussian momentum refresh, one
    leapfrog step with proposal momentum negation, accept/reject, and a final momentum negation. Its reversible,
    volume-preserving proposal acts on the joint position/momentum state, so acceptance and threshold
    rescaling use that joint density. This does not justify dropping the proposal correction from an arbitrary
    asymmetric position-only Langevin proposal. Other x updates preserving pi may be interleaved while
    leaving v alone when those updates ignore v, since the target factorizes. The threshold mechanism
    is not identical to the momentum method or to Hamiltonian Monte Carlo as a whole.
  evidence:
  - source_id: neal2020
    locator: Section 2 continuation, PDF p. 3; Section 4, p. 5, Equation 3 and Steps 1–4
    relation: supports
- claim_id: exact-finite-boundary-checks
  kind: scope
  statement: Curator calculations propagate piecewise constant signed-threshold densities with exact rational
    arithmetic. For target probabilities (1/3,2/3) and a symmetric state-flip proposal, accept/rescale
    preserves the product target. Omitting rescaling preserves the x marginal for one step but changes
    state 0 mass to 1/6 after the second step, instead of 1/3. Using the target ratio with the asymmetric
    proposal matrix with rows (1/2,1/2) and (1,0) gives state 0 mass 1/2. Further examples show unequal
    forward and reverse set fluxes for the half-period and full-refresh compositions. All 576 constructed
    positive-target, symmetric-proposal shift/noise cases preserve the joint density. These are exact
    finite examples with a continuous auxiliary variable, not author-code replication, a general convergence
    proof or a performance benchmark.
  evidence:
  - source_id: neal2020
    locator: Section 2, PDF p. 2, Equations 1–2; independently authored curator calculations in research/discovery/nonreversible-boundaries.py
    relation: supports
- claim_id: efficiency-and-source-limits
  kind: limitation
  statement: The source notes that noise may be needed when the target density takes only finitely many
    values; continuous variation is not a guarantee that a deterministic shift mixes. Its experiments
    concern particular Gaussian, mixed discrete/continuous and Bayesian neural-network targets, observables
    and tuning choices. They do not establish universal variance reduction, a higher stationary acceptance
    rate, or lower computational cost. The Bayesian neural-network result is preliminary. The appendix
    scripts were inspected as source text, without execution or benchmark reproduction.
  evidence:
  - source_id: neal2020
    locator: Section 2, PDF p. 2; experiments and discussion, Sections 3–7, pp. 3–8; appendix scripts,
      pp. 9–14
    relation: supports
