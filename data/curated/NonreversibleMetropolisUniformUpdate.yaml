  relation: related_match
  rationale: The algorithm constructs a Markov transition on an augmented state with a specified target
    marginal. The AIO target describes a stochastic process/model; this is a method-to-process relation,
    without equivalence, subclass status, or inheritance of its Network and ProbabilisticHiddenLayer assertions.
limitations:
- The local label denotes this signed-threshold construction. Generic nonreversible MCMC, lifted MCMC,
  persistent learning particles and the full paper title are not asserted as exact aliases.
- The maintained target-ratio formula assumes a proper positive target and a symmetric proposal independent
  of v. Zero-support extensions and arbitrary asymmetric proposals require separate treatment.
- Threshold-substep reversibility cannot be promoted to full-composition reversibility. Neither the method
  name nor invariant marginals establish ergodicity for every tuning choice.
- The author-hosted 2020 report is the inspected version. Equivalence to arXiv PDF bytes was not established;
  other implementations and numerical reversibility were not audited.
- No author code, training, paid provider or benchmark replication was run. DRAFT remains.
