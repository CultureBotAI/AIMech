claims:
- claim_id: self-normalized-moderate-deviation-heteroscedastic-loadings-and-first-stage-oracle-rates
  kind: mechanism
  statement: Under conditional heteroscedasticity and non-Gaussian disturbances $\zeta_i = d_i - D(z_i)$ with bounded third moments $\max_j (\bar{\mathbb{E}}[|f_{ij}\zeta_i|^3])^{1/3} / (\bar{\mathbb{E}}[f_{ij}^2\zeta_i^2])^{1/2} \le K_n$ and $K_n^3 \log^{3/2}(p \vee n) \le \delta_n \sqrt{n}$, Jing, Shao, and Wang's (2003) self-normalized moderate deviation lemma (Lemma 5, Eq. A.8, p. 41) guarantees $\mathbb{P}\left(\max_{1 \le j \le p} \frac{|\sqrt{n}\mathbb{E}_n[f_{ij}\zeta_i]|}{\sqrt{\mathbb{E}_n[f_{ij}^2\zeta_i^2]}} > \Phi^{-1}(1 - \gamma/(2p))\right) \le \gamma(1 + o(1))$. Algorithm A.1's iterative refinement of data-driven loadings $\widehat{\gamma}_j^{(k)} = \sqrt{\mathbb{E}_n[f_{ij}^2(d_i - f_i'\widehat{\beta}^{(k)})^2]}$ from initial demeaned loadings $\widehat{\gamma}_j^{(0)} = \sqrt{\mathbb{E}_n[f_{ij}^2(d_i - \bar{d})^2]}$ achieves asymptotically valid loading bounds $l \overset{P}{\to} 1 \overset{P}{\leftarrow} u$ ($l\gamma_j^0 \le \widehat{\gamma}_j \le u\gamma_j^0$, Lemma 12, p. 44), and under the restricted eigenvalue condition $\kappa_{\bar{c}} > 0$ and sparse eigenvalue bounds $\phi_{\min}(m) > 0$, both LASSO and Post-LASSO (incorporating up to $k_n$ additional instruments $I_i$) satisfy $\|\widehat{D}_i - D_i\|_{2,n} \lesssim_P \frac{c\sqrt{s\log(p \vee n)/n}}{(1-a)\kappa_{\bar{c}}} + \sqrt{\frac{k_n\log(p \vee n)}{n\phi_{\min}(k_n + \widehat{s})}} + c_s$ with sparsity $\widehat{s} = |\widehat{T}| \lesssim_P s$ (Theorem 1, Eqs. 3.10-3.11, p. 17; Lemmas 6-8, pp. 42-43).
  evidence:
  - source_id: bcch2012-iv-pdf
    locator: Section 3.1-3.3, pp. 10-18, Equations (3.1)-(3.11), Theorem 1; Appendix A, pp. 38-39, Algorithm A.1; Appendix B, pp. 40-44, Lemmas 1-12
    relation: supports
- claim_id: semiparametric-efficiency-and-root-n-asymptotic-normality-under-s-squared-sparsity
  kind: mechanism
  statement: When the structural parameter $\alpha_0 \in \mathbb{R}^{k_d}$ in $y_i = d_i'\alpha_0 + \epsilon_i$ ($\mathbb{E}[\epsilon_i \mid z_i] = 0$) is strongly identified ($\lambda_{\min}(\mathbb{E}[D_i D_i']) \ge \mu_0 > 0$) and the sparsity index satisfies $\frac{s^2\log^2(p \vee n)}{n} \to 0$ with approximation error $c_s \lesssim \sqrt{s/n}$, the cross-term $\sqrt{n}\mathbb{E}_n[(\widehat{D}_i - D_i)\epsilon_i]$ is $o_P(1)$ because Cauchy-Schwarz and the self-normalized score bound yield $|\sqrt{n}\mathbb{E}_n[(f_i'\widehat{\beta} - D_i)\epsilon_i]| \le \|\widehat{\beta} - \beta_{0n}\|_1 \max_j |\sqrt{n}\mathbb{E}_n[f_{ij}\epsilon_i]| + |\sqrt{n}\mathbb{E}_n[r_i\epsilon_i]| = O_P(\sqrt{s^2\log^2(p \vee n)/n}) = o_P(1)$ (Appendix E, Step 2, p. 55). Consequently, the IV estimator $\widehat{\alpha} = (\mathbb{E}_n[\widehat{D}_i d_i'])^{-1}\mathbb{E}_n[\widehat{D}_i y_i]$ is asymptotically equivalent to the infeasible oracle optimal-instrument estimator and satisfies $\Omega_n^{-1/2}\sqrt{n}(\widehat{\alpha} - \alpha_0) \to_d \mathcal{N}(0, I)$ with consistent plug-in sandwich variance $\widehat{\Omega}_n$ (Theorem 2, Eq. 3.12, p. 19; Theorems 3-4, pp. 21-22).
  evidence:
  - source_id: bcch2012-iv-pdf
    locator: Section 3.4, pp. 18-23, Equations (3.12)-(3.16), Theorems 2-4; Appendix E, pp. 54-60, Proofs of Theorems 2-4
    relation: supports
- claim_id: weak-identification-robust-sup-score-test-and-inverse-lasso-duality
  kind: mechanism
  statement: 'Without assuming strong identification or instrument sparsity, testing $H_0 : \alpha = \alpha_0$ under $\mathbb{E}[(y_i - d_i''\alpha_0)f_{ij}] = 0$ ($1 \le j \le p$) via the self-normalized Sup-Score statistic $\widehat{S}(\alpha) = \max_{1 \le j \le p} \frac{|\sqrt{n}\mathbb{E}_n[(y_i - d_i''\alpha)f_{ij}]|}{\sqrt{\mathbb{E}_n[(y_i - d_i''\alpha)^2 f_{ij}^2]}}$ with critical value $\Lambda_{1-\gamma} = c\Phi^{-1}(1 - \gamma/(2p))$ ($c > 1$) yields confidence regions $\mathcal{C}_{1-\gamma} = \{\alpha : \widehat{S}(\alpha) \le \Lambda_{1-\gamma}\}$ with uniform asymptotic coverage $\liminf_{n \to \infty} \mathbb{P}(\alpha_0 \in \mathcal{C}_{1-\gamma}) \ge 1 - \gamma$ even when instruments are arbitrarily weak or unidentified (Section 3.5, Eqs. 3.17-3.18, pp. 23-24). Moreover, by the KKT conditions of LASSO regressions of the structural residual $y_i - d_i''\alpha$ on $f_i$ with residual-self-normalized loadings $\widehat{\gamma}_j(\alpha) = \sqrt{\mathbb{E}_n[(y_i - d_i''\alpha)^2 f_{ij}^2]}$ and penalty $\lambda = 2\Lambda_{1-\gamma}\sqrt{n}$, $\widehat{S}(\alpha) \le \Lambda_{1-\gamma}$ holds if and only if the Inverse LASSO solution is identically zero ($\widehat{\beta}_{\mathrm{IL}}(\alpha) = 0$, Eq. 3.19, p. 25).'
  evidence:
  - source_id: bcch2012-iv-pdf
    locator: Section 3.5, pp. 23-25, Equations (3.17)-(3.19)
    relation: supports
