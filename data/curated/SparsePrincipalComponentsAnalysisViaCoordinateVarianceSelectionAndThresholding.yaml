id: AIMech:SparsePrincipalComponentsAnalysisViaCoordinateVarianceSelectionAndThresholding
name: Sparse Principal Components Analysis via Coordinate-Variance Subset Selection and Thresholding
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Johnstone-Lu Adaptive Sparse Principal Components Analysis
- ASPCA Coordinate-Variance Subset Selection and Wavelet Thresholding
- Spiked Covariance Model Coordinate-Screening Sparse PCA
definition: Sparse Principal Components Analysis via Coordinate-Variance Subset Selection and Thresholding (ASPCA) is a high-dimensional principal component estimation methodology motivated by the single- and multi-component spiked covariance models x_i = mu + sum_{j=1}^m v_i^j rho^j + sigma z_i (where classical sample PCA is consistent for rho^1 if and only if p(n)/n -> 0 and satisfies liminf_{n->infty} E angle(rho_hat^1, rho^1) > 0 whenever p(n)/n -> c > 0; Theorems 1-3). Given n observations on p variables, the algorithm (1) represents each observation x_i(t) = sum_nu x_{i,nu} e_nu(t) in an orthonormal basis {e_nu} (such as wavelets) where population principal components belong to weak l_q balls wl_q(C) (|rho|_{(nu)} <= C nu^{-1/q}); (2) computes sample coordinate variances sigma_hat_nu^2 = Var_hat(x_{i,nu}) and selects a reduced coordinate subset I_hat of size k << min(n, p) exceeding noise either via threshold sigma_hat_nu^2 >= sigma_hat^2 (1 + gamma_n) with median noise estimate sigma_hat^2
  = median(sigma_hat_nu^2) and gamma_n = gamma sqrt(n^{-1} log n) or via cumulative chi-square percentile excess fraction w(n); (3) performs standard PCA on the k x k reduced sample covariance S_I in O(k^3) operations to obtain eigenvectors rho_hat^j; (4) denoises coordinates by hard thresholding rho_hat_nu^{*j} = eta_H(rho_hat_nu^j, delta) at Anderson-variance threshold delta = tau_hat_j sqrt(2 log k); and (5) reconstructs rho_hat_j(t) = sum_nu rho_hat_nu^{*j} e_nu(t) in O(n p log p + k^2 p) total operations, recovering almost-sure angular consistency angle(rho_hat_I, rho) -> 0 even when p/n -> c > 0 or p = O(n^a) (Theorem 5).
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Johnstone & Lu (2009, Journal of the American Statistical Association 104(486):682-693; arXiv:0901.4392v1, DOI:10.1198/jasa.2009.0121). Distinct from AIMech:SparsePrincipalComponentAnalysis (Zou, Hastie, & Tibshirani 2006), which formulates sparse PCA as an alternating L1/L2 Elastic-Net regression optimization problem, and from AIMech:DirectSparsePrincipalComponentAnalysis (d'Aspremont et al. 2007), which solves a trace-L1 semidefinite programming relaxation, whereas Johnstone & Lu (2009) introduce the spiked covariance model x_i = v_i rho + sigma z_i, prove the necessary and sufficient condition p/n -> 0 for classical PCA consistency (Theorems 1-3), and establish non-iterative coordinate-variance subset screening followed by reduced k x k eigendecomposition and wavelet-domain hard thresholding with polynomial false-selection bounds (Theorem 4) and almost-sure high-dimensional consistency (Theorem 5).
