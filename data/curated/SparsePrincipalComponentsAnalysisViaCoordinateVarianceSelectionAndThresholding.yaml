claims:
- claim_id: spiked-covariance-phase-transition-and-inconsistency-of-classical-pca
  kind: scope
  statement: 'In the single-component spiked factor model x_i = v_i rho + sigma z_i (eq. 2, p. 3) and the m-component model x_i = mu + sum_{j=1}^m v_i^j rho^j + sigma z_i (eq. 8, p. 5) with p(n)/n -> c in [0, infty) and ||rho^j(n)|| -> varrho_j, Theorem 1 (p. 5) and Theorem 3 (p. 6; proved via Proposition 1 and Golub-Van Loan symmetric perturbation bounds in Appendix A.1-A.2, pp. 17-22) establish the almost-sure upper bound limsup_{n->infty} sin angle(rho_hat^1, rho^1) <= [4 sigma sqrt(c) / (varrho_1^2 - varrho_2^2)] [varrho_+ + (2 + sqrt(c)) sigma], proving consistency angle(rho_hat^1, rho^1) = O_p(sqrt(p/n)) -> 0 when p/n -> 0. Conversely, when p/n -> c > 0, Theorem 2 (p. 5) and Theorem 3 (p. 6) prove via the symmetric reflection decomposition S_+ = D + B versus S_- = D - B and Lemma 1 (angle(eta, M eta) <= 3 angle(eta, xi), Appendix A.1, p. 16 & Appendix A.3, pp. 22-24) that classical PCA is strictly inconsistent: liminf_{n->infty} E angle(rho_hat^1, rho^1) > 0.'
  evidence:
  - source_id: jl2009-spca-pdf
    locator: Section 2, Equations (4)-(10) and Theorems 1-3, pp. 4-6; Appendix A.1-A.3, Lemma 1, Proposition 1, and Proofs of Theorems 1-3, pp. 15-24
    relation: supports
- claim_id: five-step-basis-coordinate-variance-screening-and-eigenvector-thresholding-algorithm
  kind: mechanism
  statement: 'Section 3 and Sections 3.1-3.4 (pp. 6-11) formulate the five-step Sparse PCA algorithm: (1) transform signals x_i(t) = sum_nu x_{i,nu} e_nu(t) into a sparse orthonormal basis {e_nu} (such as wavelets, where Besov smoothness rho in B_{p,q}^alpha implies weak-l_p sparsity (rho_nu) in wl_p with p = 2/(2 alpha + 1), Section 3.1, p. 7); (2) compute coordinate sample variances sigma_hat_nu^2 and select subset I_hat via either fixed noise fraction sigma_hat_nu^2 >= sigma_hat^2(1 + alpha_n) or adaptive chi-square percentile excess sum_{nu=1}^{k_hat} tau_hat_{(nu)}^2 >= w(n) sum_nu tau_hat_{(nu)}^2 using the median noise variance estimator sigma_hat^2 = median(sigma_hat_nu^2) (eq. 11, p. 8); (3) compute the k x k reduced eigendecomposition on {x_{i,nu}, nu in I_hat}; (4) apply hard thresholding eta_H(rho_hat_nu^j, delta) with threshold delta = tau_hat_j sqrt(2 log k) where tau_hat_nu approx (1/sqrt(n)) sigma sqrt(||rho||^2 + sigma^2) / ||rho||^2 (eq. 13, p. 11) and ||rho||_hat^2 = sum_{nu=1}^p
    (S_nu^2 - median(S_nu^2)) (eq. 14, p. 11); and (5) reconstruct in the signal domain in O(n p log p + k^2 p) = o(p^3) operations (Section 3.3, pp. 8-9).'
  evidence:
  - source_id: jl2009-spca-pdf
    locator: Section 3, Sections 3.1-3.4, Equations (11)-(14), and Table 1, pp. 6-11
    relation: supports
- claim_id: polynomial-subset-selection-reliability-and-almost-sure-weak-lq-consistency
  kind: scope
  statement: 'Under marginal chi-square coordinate variances sigma_hat_nu^2 = S_{nu,nu} ~ sigma_nu^2 chi_{(n)}^2 / n without joint distribution assumptions (eq. 15, p. 11), Theorem 4 (p. 12; proved via Cramer large deviations in Appendix A.4, p. 25) proves that the probability of either a false exclusion FE = cup_{l in I_in} {sigma_hat_l^2 < sigma_hat_{(k)}^2} or false inclusion FI = cup_{l in I_out} {sigma_hat_l^2 >= sigma_hat_{(k)}^2} at relative separation alpha_n = gamma n^{-1/2}(log n)^{1/2} is polynomially small: P{FE cup FI} <= 2 p k n^{-b(gamma)} + k n^{-(1-2 alpha_n) b(gamma)} with b(gamma) = [gamma sqrt(3)/(4 + 2 sqrt(3))]^2. Furthermore, under the single-component model with p/n -> c > 0 (or p = O(n^a)) and uniform weak-l_q sparsity rho(n) in wl_q(C) (eq. 17, p. 13), Theorem 5 (p. 13; Appendix A.5, pp. 25-28) proves that the subset-selected PCA estimator rho_hat_I with I_hat = {nu : sigma_hat_nu^2 >= sigma^2(1 + gamma_n)} is almost surely consistent: angle(rho_hat_I, rho) -> 0
    a.s.'
  evidence:
  - source_id: jl2009-spca-pdf
    locator: Sections 3.5-3.6, Equations (15)-(17) and Theorems 4-5, pp. 11-13; Appendix A.4-A.5, Equation (54) and Proofs of Theorems 4-5, pp. 25-28
    relation: supports
