id: AIMech:BAdamBlockCoordinateAdamFullParameterOptimization
name: BAdam (Block Coordinate Descent with Adam's Update Rule)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient full-parameter optimization algorithm for large language models that partitions model parameters theta in R^d into D ordered blocks pi = {pi_1, ..., pi_D} (such as D transformer modules in random-reshuffling, ascending, or descending order) and executes block coordinate descent (BCD) where each active block theta_{pi_i} is updated for K inner Adam steps from zero-initialized block momentum and second-moment states (m_{pi_i}^{t,0} = 0, v_{pi_i}^{t,0} = 0) while all D - 1 inactive blocks remain frozen at their most recent FP16 values, followed by deallocating the active block's FP32 gradient and optimizer states ((g_{pi_i}, m_{pi_i}, v_{pi_i}) <- None) before activating the next block.
identity_notes: Distinct from parameter-efficient fine-tuning methods such as LoRA (AIMech:LowRankAdaptation, Hu et al. 2021), which restrict weight updates to low-rank adapter subspaces rather than learning full-rank perturbations across all model parameters. Distinct from LOMO (AIMech:LOMOLowMemoryOptimization, Lv et al. 2023), which performs stateless on-the-fly FP16 SGD updates during backpropagation without Adam moments or gradient accumulation, and from GaLore (AIMech:GaLoreGradientLowRankProjection, Zhao et al. 2024), which projects gradients of all layers into SVD subspaces simultaneously rather than performing block coordinate Adam updates with per-block state clearing.
aliases:
- BAdam
- BAdam Optimizer
- Block Coordinate Adam
- Block Coordinate Descent with Adam Update Rule
