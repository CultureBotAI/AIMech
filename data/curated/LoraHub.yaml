id: AIMech:LoraHub
name: LoraHub
concept_kind: algorithm
review_status: DRAFT
definition: A few-shot cross-task generalization framework that dynamically assembles N upstream task-specific LoRA modules {(A_i, B_i)}_{i=1}^N into a single unified low-rank module m_hat = (sum_i w_i A_i)(sum_i w_i B_i) and optimizes the scalar composition coefficients {w_1, ..., w_N} on a handful of labeled target-task examples via L1-regularized gradient-free black-box optimization.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which trains a single low-rank adapter via gradient descent on a target task), from HydraLoRA (AIMech:HydraLoRA, which jointly trains a shared down-projection matrix A and multiple routed up-projection heads B_k end-to-end with backpropagation), and from S-LoRA (AIMech:SLoRA, an inference serving system that batches heterogeneous LoRA adapters in unified paging memory rather than composing multiple upstream adapters into a single synthesized module for unseen tasks). Formulated by Huang et al. (COLM 2024, arXiv:2307.13269).
aliases:
- LoraHub Dynamic LoRA Composition
- LoraHub Gradient-Free Cross-Task LoRA Assembly
- Dynamic Low-Rank Adaptation Composition (LoraHub)
