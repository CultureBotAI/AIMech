claims:
- claim_id: lorahub-factorwise-bilinear-module-composition
  kind: mechanism
  statement: In the COMPOSE stage, LoraHub combines N upstream LoRA modules {m_i = A_i B_i}_{i=1}^N of matching rank r using real-valued scalar weights w = (w_1, ..., w_N) via separate element-wise linear combinations of the low-rank factors, m_hat = (sum_{i=1}^N w_i A_i)(sum_{i=1}^N w_i B_i), producing a single rank-r adapter that captures both self-terms w_i^2 A_i B_i and cross-task bilinear interactions w_i w_j A_i B_j.
  evidence:
  - source_id: r681-primary-pdf
    locator: 'Section 3.3 COMPOSE: Element-wise composition of LoRA modules, Eq. 1, p. 4'
    relation: supports
- claim_id: lorahub-gradient-free-cmaes-l1-adaptation
  kind: mechanism
  statement: In the ADAPT stage, LoraHub optimizes the scalar coefficients {w_1, ..., w_N} over K inference-only iterations on a few-shot support set Q using Covariance Matrix Adaptation Evolution Strategies (CMA-ES) to minimize the L1-regularized cross-entropy loss L(Q; w) + alpha sum_{i=1}^N |w_i| without computing backpropagation gradients or storing optimizer states for the base language model.
  evidence:
  - source_id: r681-primary-pdf
    locator: 'Section 3.4 ADAPT: Weight optimization via gradient-free methods, p. 4-5'
    relation: supports
- claim_id: lorahub-bbh-few-shot-generalization-efficiency
  kind: application
  statement: LoraHub is applied to few-shot cross-task generalization on the Big-Bench Hard (BBH) benchmark with FLAN-T5-large and FLAN-T5-xl, approaching few-shot in-context learning accuracy while requiring zero demonstration examples in the prompt at test time (reducing average inference tokens per example from 597.8 to 111.6) and using approximately 5 GB of GPU memory compared to 34 GB for gradient-based LoRA tuning.
  evidence:
  - source_id: r681-primary-pdf
    locator: Section 4.2 Main results, Table 1 & Section 5 Analysis, p. 5-8
    relation: supports
- claim_id: lorahub-uniform-rank-and-candidate-variance-limitation
  kind: limitation
  statement: Element-wise factor composition in LoraHub requires all combined LoRA modules to share the exact same rank r and base LLM architecture, and combining a large unpruned pool of candidate modules increases search space dimensionality and performance variance while lagging gradient-based fine-tuning on tasks that deviate sharply from the upstream module pool.
  evidence:
  - source_id: r681-primary-pdf
    locator: Section 3.3, Section 4.2, and Appendix H, p. 4, 6-8, 21
    relation: supports
