claims:
- claim_id: method
  kind: mechanism
  statement: Start from a complete assignment for a CNF formula and test whether it is satisfying. At
    a search step, with probability p choose a formula variable uniformly and flip it, irrespective of
    whether it appears in an unsatisfied clause or improves the clause count. With probability 1−p take
    a globally best GSAT flip, using the largest increase in the number of satisfied clauses and random
    tie handling. Apply the chosen outer flip and attempt budgets with random restarts as in the GSAT
    experiments. This unrestricted noise replaces the eligible-variable restriction in GSAT with random
    walk. It can perturb a variable whose current occurrences are all in satisfied clauses, and it uses
    no temperature-dependent acceptance test.
  evidence:
  - source_id: method-source
    locator: The Random Walk Strategy, PDF2 / printed338; random-noise variation and experimental parameter
      context, PDF3 / printed339
    relation: supports
