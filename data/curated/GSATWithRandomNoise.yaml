name: GSAT with random noise
definition: A GSAT variant that mixes a random flip drawn from all formula variables with a globally best
  GSAT flip, without restricting the random choice to variables in currently unsatisfied clauses.
concept_kind: algorithm
identity_notes: 'This is the random-noise strategy explicitly contrasted with the focused random-walk
  GSAT strategy in the 1994 primary paper. The defining difference is the random branch’s eligible variable
  set. It is not simulated annealing, Gaussian input noise, neural weight noise, or WalkSAT’s clause-first
  selection. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  316 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 7 and 7 lines respectively. All seven unique lines were inspected,
  and the sorted checkout hit sets were identical: neighboring GSAT/WalkSAT mentions and saved review/ledger
  references, not existing candidate records. Eight exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and four full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- A noise move need not help satisfy a currently violated clause and can break previously satisfied clauses.
  Conversely, the mechanism does not assert that every random move is uphill.
- Finite search failure is inconclusive about satisfiability. Empirical comparisons on the paper’s selected
  instances and tuned settings are not universal performance orderings or general runtime bounds.
- At p=0 the move policy reduces to basic GSAT, while p=1 selects only unrestricted random flips; the
  entire parameterized policy is not identical to either endpoint. The formula’s variable universe and
  treatment of empty clauses/candidate sets must be explicit.
- The record describes the source’s noise policy, not an executed reference implementation, a weighted
  MAX-SAT extension or automatic parameter adaptation. It does not silently repair the original GSAT final-flip
  check boundary.
