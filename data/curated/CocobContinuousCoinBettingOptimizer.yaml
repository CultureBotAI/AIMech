claims:
- claim_id: c-r621-scale-invariance-and-wealth-lower-bound
  kind: mechanism
  statement: Multiplying all negative subgradients g_{t,i} and coordinate scales L_i by any positive constant c > 0 leaves the COCOB iterate sequence w_{t,i} invariant; moreover, because |beta_{t,i} g_{t,i}| < 1, gambler wealth Wealth_{t,i} = L_i + Reward_{t,i} remains strictly positive and satisfies the inductive data-dependent lower bound Wealth_{T,i} >= L_i exp(theta_{T,i}^2 / (2 L_i (G_{T,i} + L_i)) - sum_{j=1}^T |g_{j,i}| / (2 (G_{j-1,i} + L_i))) (Lemma 2 and Eq. 3).
  evidence:
  - source_id: r621-primary-pdf
    locator: Section 5, p. 4-5; Appendix A Lemma 2 & Eq. (3)-(5), p. 12-14
    relation: supports
- claim_id: c-r621-weakly-quasi-convex-convergence-bound
  kind: mechanism
  statement: 'By Fenchel-conjugate duality (Lemma 1), Theorem 1 proves that on any tau-weakly-quasi-convex objective F : R^d -> R with bounded stochastic subgradients |g_{t,i}| <= L_i, COCOB guarantees E[F(w_I)] - F(w*) <= sum_{i=1}^d (L_i + |w*_i - w_{1,i}| sqrt(E[L_i (G_{T,i} + L_i) ln(1 + (G_{T,i} + L_i)^2 (w*_i - w_{1,i})^2 / L_i^2)])) / (tau T), achieving the optimal O_tilde(||w* - w_1||_1 / sqrt(T)) parameter-free rate while exploiting gradient sparsity via G_{T,i}.'
  evidence:
  - source_id: r621-primary-pdf
    locator: Section 5 Theorem 1, p. 5; Appendix A Proof of Theorem 1, p. 12-14
    relation: supports
- claim_id: c-r621-cocob-backprop-online-scale-adaptation
  kind: application
  statement: To train deep neural networks where per-coordinate gradient bounds L_i are unknown a priori and vary across layers, COCOB-Backprop (Algorithm 2) updates L_{t,i} = max(L_{t-1,i}, |g_{t,i}|), enforces non-negative wealth Reward_{t,i} = max(Reward_{t-1,i} + (w_{t,i} - w_{1,i}) g_{t,i}, 0), and updates w_{t+1,i} = w_{1,i} + (theta_{t,i} / (L_{t,i} max(G_{t,i} + L_{t,i}, alpha L_{t,i}))) (L_{t,i} + Reward_{t,i}) with default alpha = 100 so the first update step has bounded magnitude |w_{2,i} - w_{1,i}| = 1 / alpha.
  evidence:
  - source_id: r621-primary-pdf
    locator: Section 6 Algorithm 2, p. 6-7; Section 7 Figures 2-4, p. 7-9
    relation: supports
- claim_id: c-r621-known-scale-bound-and-overfitting-limitation
  kind: limitation
  statement: The theoretical convergence guarantee of Theorem 1 requires known a priori coordinate subgradient upper bounds |g_{t,i}| <= L_i; when L_{t,i} is estimated online in COCOB-Backprop, wealth positivity is no longer guaranteed without explicit clipping max(..., 0) and the formal regret guarantee no longer holds.
  evidence:
  - source_id: r621-primary-pdf
    locator: Section 6, p. 6-7; Section 7, p. 8-9
    relation: supports
