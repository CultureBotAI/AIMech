  - target: AIO:ReasoningLLM
    rejection_reason: This class describes deductive inference during language tasks, not general graph
      path search.
  - target: AIO:MathematicalFunction
    rejection_reason: The algorithm is a search procedure using an evaluation function, not that function
      itself.
