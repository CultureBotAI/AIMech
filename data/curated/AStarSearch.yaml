name: A-star search
definition: A heuristic graph-search method that selects an open node using the sum of its best known
  path cost from the start and an estimated remaining cost to a goal.
identity_notes: This is the graph-search algorithm conventionally written A*, not a graph language model
  or a learned policy. Its heuristic estimate is distinct from the exact remaining path cost.
limitations:
- The original analysis assumes graph arc costs bounded below by a positive constant; its optimality arguments
  depend on heuristic and graph assumptions.
- This record curates the search mechanism, not a claim of fewest possible expansions or universal optimality.
  The 1972 correction and later optimal-efficiency analyses remain follow-up evidence.
