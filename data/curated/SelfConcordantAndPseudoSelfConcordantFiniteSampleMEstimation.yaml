limitations:
- 'Sub-Gaussian Calibrated-Design Assumptions and Exponential Adversarial Design Scaling: Assumptions
  D1-D2 and D2* can fail when the second-derivative scaling [ell''''(Y, X^T theta)]^{1/2} grows super-polynomially
  (such as in Poisson regression where a''''(eta) = e^eta, Remark 2.2), and for adversarial discrete design
  distributions (Hazan, Koren, & Levy 2014) the local curvature parameter rho and critical sample size
  can grow as exp(R D) in the predictor-parameter product (Section 6, Figure 4).'
- 'Loss of Affine Invariance Under L1 Regularization in High Dimensions: In Theorems 5.1-5.2, the l_1
  norm and coordinate sparsity depend on the choice of basis and are not affine-invariant, so canonical
  self-concordance (Assumption SCb) does not eliminate the local curvature factor rho from the estimation
  error or the O(Q^2 s^2 log(e d/delta)) critical sample size.'
- 'Primary-Source Typographical Notes in Ostrovskii & Bach (2020/2021, arXiv:1810.06838v2): Verified five
  self-correcting typographical slips in the primary manuscript: (1) Theorem 1.2 (p. 8) writes ''In addition
  to the premise of Theorem 1.2'' instead of ''In addition to the premise of Theorem 1.1''; (2) Section
  2.1.3 (p. 11, after Eq. 21) writes ''|varphi_tau''''''(t)| <= (2/tau)[varphi_tau''''(t)]^{3/2}'', omitting
  the sqrt(2) factor from |varphi''''''(t)| <= 2 sqrt(2) [varphi''''(t)]^{3/2} (the exact rescaled constant
  is 2 sqrt(2)/tau); (3) Section 5 (p. 19, sentence preceding Theorem 5.1) states that Theorem 5.1 characterizes
  an l_1-penalized M-estimator with a ''canonically self-concordant loss'', whereas Theorem 5.1 assumes
  SCa (pseudo-self-concordance) and Theorem 5.2 assumes SCb (canonical self-concordance); (4) Section
  6 (p. 22, paragraph 1) states ''Thus, the logistic model for Y|X is well-specified in the second case''
  after defining the second case as probit regression (where the logistic model is misspecified, as noted
  in the second bullet on p. 22); and (5) Appendix B.1 (p. 34, final line) writes ''|varphi''''''(u)|
  <= c[varphi''''(u)]^{3/2}'' instead of ''|varphi''''''(t)| <= c[varphi''''(t)]^{3/2}''.'
- All 55 pages of the full-text PDF of Ostrovskii & Bach (2020/2021, Electronic Journal of Statistics
  15(1):326-391, arXiv:1810.06838v2) were read. Constructed numerical checks in research/discovery/self-concordant-m-estimators-finite-sample-boundaries.py
  verify (1) Section 2.1 pseudo-self-concordance for logistic and smooth pseudo-Huber losses and canonical
  self-concordance (<= 2 sqrt(2)) and Fenchel duality phi''(varphi'(t)) varphi''(t) = 1 for the novel
  loss (Eq. 21), (2) Propositions B.3-B.4 Taylor remainder bracketing and localization radius <= 4 ||nabla
  F(theta_0)||_{H_0^{-1}}, and (3) Theorem 4.1 Eq. (84) Dikin-ellipsoid Hessian stability factors [4/9,
  4] and Proposition D.1 cubic curvature scaling rho ~ 1 + ||theta_*||_Sigma^3.
