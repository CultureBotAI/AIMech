claims:
- claim_id: pseudo-and-canonical-self-concordance-and-fenchel-conjugate-losses
  kind: mechanism
  statement: 'For linear prediction losses ell_Z(theta) = ell(Y, X^T theta) that are convex and C^3 in
    eta = X^T theta, Ostrovskii and Bach (2021) distinguish two third-derivative control regimes: pseudo-self-concordance
    (Assumption SCa: |ell''''''(y, eta)| <= ell''''(y, eta), satisfied by logistic regression with c =
    1, Poisson regression with c = 1, and smooth pseudo-Huber contrasts log(cosh(t)) and sqrt(1+t^2)-1
    with c = 3) and canonical self-concordance (Assumption SCb: |ell''''''(y, eta)| <= 2[ell''''(y, eta)]^{3/2},
    satisfied by exponential-response GLMs). Moreover, using Fenchel conjugation of the normalized log-barrier
    phi(u) = -(1/2) log(1 - u^2) on (-1, 1) and the duality identity phi''''(varphi''(t)) * varphi''''(t)
    = 1 (Eq. 71), they construct the canonically self-concordant pseudo-Huber loss varphi(t) = (1/2)[sqrt(1
    + 4 t^2) - 1 + log((sqrt(1 + 4 t^2) - 1)/(2 t^2))] (Eq. 21), which satisfies varphi(0) = 0, varphi''''(0)
    = 1, |varphi''(t)| < 1, and |varphi''''''(t)| <= 2 sqrt(2) [varphi''''(t)]^{3/2}, together with a
    canonically self-concordant classification surrogate loss (Eq. 22).'
  evidence:
  - source_id: ostrovskii2020-self-concordant-pdf
    locator: Section 2.1, pp. 8-11, Assumptions SCa-SCb, Equations (17)-(22), and Appendix B.1, p. 34,
      Equation (71)
    relation: supports
- claim_id: self-concordant-taylor-bracketing-and-pointwise-critical-sample-size
  kind: mechanism
  statement: 'Along any line segment theta_t = theta_0 + t(theta_1 - theta_0) of a C^3 convex objective
    F: Theta -> R with H_0 = nabla^2 F(theta_0) > 0 and directional scale S = |<W, theta_1 - theta_0>|,
    Proposition B.3 (Lemmas B.1-B.3) establishes exact Taylor remainder bracketing under Case (a) |phi_F''''''(t)|
    <= S phi_F''''(t) (Eqs. 60-61) and Case (b) |phi_F''''''(t)| <= (S/(1 - S t)) phi_F''''(t) (Eqs. 62-63),
    and Proposition B.4 proves that whenever ||W||_{H_0^{-1}} ||nabla F(theta_0)||_{H_0^{-1}} <= 1/4,
    F has a unique minimizer theta_tilde satisfying ||theta_tilde - theta_0||_{H_0} <= 4 ||nabla F(theta_0)||_{H_0^{-1}}.
    Applying this under pointwise sub-Gaussian assumptions at theta_* (Assumptions D0-D2 and compatibility
    Sigma <= rho H, Assumption C) yields ||theta_hat_n - theta_*||_H^2 <= C ||nabla L_n(theta_*)||_{H^{-1}}^2
    <= C'' K_1^2 d_eff log(e/delta) / n and the same restricted-risk bound once n >= C max{K_2^4(d + log(1/delta)),
    rho K_0^2 K_1^2 d_eff d log(e d/delta)} for pseudo-self-concordant losses (Theorem 3.1) or n >= C
    max{K_2^4(d + log(1/delta)), K_1^2 K_2^2 d_eff d log(e d/delta)} for canonically self-concordant losses
    (Theorem 3.2, eliminating rho and Assumption D0).'
  evidence:
  - source_id: ostrovskii2020-self-concordant-pdf
    locator: Section 3, pp. 13-15, Theorems 3.1-3.2, Equations (26)-(32); Appendix B, pp. 30-34, Propositions
      B.1-B.4; Appendix C.1-C.2, pp. 34-38
    relation: supports
- claim_id: dikin-ellipsoid-covering-near-linear-critical-sample-size-and-gaussian-logistic-scaling
  kind: mechanism
  statement: Under Assumption D2* requiring the calibrated design X_tilde(theta) = [ell''(Y, X^T theta)]^{1/2}
    X to satisfy ||H(theta)^{-1/2} X_tilde(theta)||_{psi_2} <= K_bar_2(r) over the r-radius Dikin ellipsoid
    Theta_r(theta_*), Theorems 4.1 and 4.2 combine population-risk Hessian stability on Theta_{1/(2 c_bar)}(theta_*)
    ((4/9) H(theta_*) <= H(theta) <= 4 H(theta_*), Eq. 84) with individual-loss self-concordance on fine
    balls of radius varepsilon = O(1/(d^2 log(e n/delta))) (Eq. 88) and a union bound of sub-Gaussian
    covariance concentration over an varepsilon-net N_varepsilon of size |N_varepsilon| <= (3/(2 c_bar
    varepsilon))^d (Eq. 86) to establish uniform empirical Hessian bracketing 0.09 H(theta_*) <= H_n(theta)
    <= 32 H(theta_*) (Eq. 92) and unrestricted excess-risk bound L(theta_hat_n) - L(theta_*) <= C K_1^2
    d_eff log(e/delta) / n for near-linear critical sample size n >= C max{K_bar_2^4(r) d log(e d/delta),
    K_1^2 K_bar_2^6(r) d_eff log(e/delta)} (with r >= 1 under SCb, Theorem 4.1) or n >= C max{K_bar_2^4(r)
    d log(e d/delta), rho K_0^2 K_1^2 K_bar_2^4(r) d_eff log(e/delta)} (with r >= 1/sqrt(rho) under SCa,
    Theorem 4.2). For logistic regression with Gaussian design X ~ N(0, Sigma), Proposition D.1 proves
    tight polynomial scaling rho <= C(1 + ||theta_*||_Sigma^3) and K_2 ~ K_bar_2(1/sqrt(rho)) <= C(1 +
    log(1 + ||theta_*||_Sigma)) sqrt(1 + ||theta_*||_Sigma).
  evidence:
  - source_id: ostrovskii2020-self-concordant-pdf
    locator: Section 4, pp. 15-18, Assumption D2*, Theorems 4.1-4.2, Equations (34)-(36); Appendix C.3-C.4,
      pp. 38-43, Equations (84)-(100); Appendix D, pp. 47-51, Proposition D.1
    relation: supports
- claim_id: high-dimensional-l1-penalized-self-concordant-m-estimation
  kind: scope
  statement: In high dimensions (d >> n) where |theta_*|_0 <= s << d and Assumption C* holds (Sigma =
    I, G <= kappa_1 I, H <= kappa_2 I with condition number Q = rho max(kappa_1, kappa_2)), Theorems 5.1
    and 5.2 prove that for regularization parameter K_1 sqrt(kappa_1 log(e d/delta) / n) <= C lambda <=
    c / (rho K_0 s sqrt(log(e d n/delta))) (or with K_2 sqrt(kappa_2) in place of K_0 under SCb), the
    l_1-penalized M-estimator theta_hat_{lambda,n} satisfies the restricted cone property ||Delta_{S_c}||_1
    <= 3 ||Delta_S||_1 (Eq. 105), ||theta_hat_{lambda,n} - theta_*||_1 <= C rho s lambda, ||theta_hat_{lambda,n}
    - theta_*||_H^2 <= C rho s lambda^2, and restricted excess risk L_E(theta_hat_{lambda,n}) - L_E(theta_*)
    <= C rho s lambda^2 = O(Q s log(e d/delta) / n) whenever n >= C max{Q s, rho Q s^2} log(e d n/delta)
    (under SCa, Theorem 5.1) or n >= C max{Q s, Q^2 s^2} log(e d n/delta) (under SCb, Theorem 5.2), showing
    that lack of affine invariance of the l_1 penalty prevents canonical self-concordance from eliminating
    the curvature factor rho in high dimensions.
  evidence:
  - source_id: ostrovskii2020-self-concordant-pdf
    locator: Section 5, pp. 18-21, Assumption C*, Theorems 5.1-5.2, Equations (38)-(46); Appendix C.5-C.6,
      pp. 44-47, Equations (101)-(121)
    relation: supports
