id: AIMech:SelfConcordantAndPseudoSelfConcordantFiniteSampleMEstimation
name: Self-Concordant and Pseudo-Self-Concordant Finite-Sample M-Estimation
aliases:
- Finite-Sample Analysis of M-Estimators Using Self-Concordance
- Canonically Self-Concordant and Pseudo-Self-Concordant Empirical Risk Minimization
- Dikin-Ellipsoid Calibrated-Design Finite-Sample M-Estimator Excess Risk Theory
- Fenchel-Conjugate Canonically Self-Concordant Pseudo-Huber and Classification Losses
concept_kind: mathematical_method
definition: 'Self-Concordant and Pseudo-Self-Concordant Finite-Sample M-Estimation is a non-asymptotic
  statistical estimation and excess-risk analysis methodology for empirical risk minimizers (ERM) theta_hat_n
  in Argmin_{theta in Theta} L_n(theta) and l_1-penalized M-estimators theta_hat_{lambda,n} in Argmin_{theta
  in R^d} {L_n(theta) + lambda ||theta||_1} in random-design linear prediction models ell_Z(theta) = ell(Y,
  X^T theta) that characterizes the critical sample size n needed to achieve the Wilks-Fisher chi-square-type
  excess risk bound L(theta_hat_n) - L(theta_*) <= C K_1^2 d_eff log(e/delta) / n where d_eff = Tr(H^{-1/2}
  G H^{-1/2}) is the effective dimension, H = nabla^2 L(theta_*) = E[ell''''(Y, X^T theta_*) X X^T], and
  G = E[nabla ell_Z(theta_*) nabla ell_Z(theta_*)^T]. By exploiting either pseudo-self-concordance (|ell''''''(y,
  eta)| <= ell''''(y, eta), Assumption SCa) or canonical self-concordance (|ell''''''(y, eta)| <= 2 [ell''''(y,
  eta)]^{3/2}, Assumption SCb, including novel Fenchel-conjugate canonically self-concordant pseudo-Huber
  and classification surrogate losses) together with local sub-Gaussian calibrated-design assumptions
  at theta_* or over the population Dikin ellipsoid Theta_r(theta_*) = {theta in R^d : ||theta - theta_*||_{H(theta_*)}
  <= r}, the methodology localizes theta_hat_n without global empirical-process chaining and establishes
  critical sample sizes O(rho d d_eff) or O(d d_eff) under pointwise local assumptions at theta_* and
  near-linear critical sample sizes O(max{rho d_eff, d log d}) or O(max{d_eff, d log d}) via an epsilon-net
  covering argument over the Dikin ellipsoid.'
identity_notes: Grounded in Ostrovskii and Bach (2021, Electronic Journal of Statistics 15(1):326-391;
  arXiv:1810.06838v2, DOI:10.1214/20-EJS1780). Distinct from AIMech:DeterministicBanachContractionAndNewtonKantorovichInequalitiesForSmoothMEstimators
  (Kuchibhotla 2018, arXiv:1809.05172v1, which derives deterministic Banach contraction and Newton-Kantorovich
  fixed-point representation inequalities under third-derivative Holder continuity without self-concordance,
  Dikin-ellipsoid calibrated-design covering, or Fenchel-conjugate self-concordant loss constructions),
  AIMech:HigherOrderSmoothRegularizedEmpiricalRiskMinimizationAndSampleSplitNewton (Spokoiny 2012 / Marteau-Ferey
  et al. 2019), AIMech:BregmanDivergence, and AIMech:LassoRegression.
