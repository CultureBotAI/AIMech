  rationale: The rule forms abstraction states for partition-function inference in graphical-model search
    spaces. The pinned target provides the necessary model/task context; the link does not assert that
    a randomized partition component is itself a graphical model or learning task.
limitations:
- This record is the simpleRand abstraction component, not a complete estimator or every randomized abstraction.
  Bare RAND is not an alias. Random group membership alone does not identify value-based cuts, context
  hashing, a learned abstraction or a clustering objective.
- The stated cardinality formula uses a nonempty frontier and 1 <= k <= N. A larger cap requires an explicit
  singleton/empty-group convention; the separate supplemental singleton wrapper is presented for value-ordered
  abstractions and is not asserted here as simpleRand pseudocode. k=0 is invalid. Correct uniform shuffling
  is assumed.
- In a finite four-node example, all24 permutations give three balanced pairings equally often. With contributions1,1,9,9
  and uniform selection within each pair, every partition estimates20 in expectation; random pairing has
  variance256/3 while value-homogeneous pairing has variance0. This illustrates lack of universal variance
  reduction, not a benchmark result.
- Unequal proposal masses1,2,3,4 produce unequal marginal inclusion probabilities under the same random
  pairings. Conditional selection must use its actual probability, and positive contributions require
  positive support. Zero/all-zero proposal handling and numerical stability remain implementation responsibilities.
- All41 proceedings pages, including the appended30-page supplement, were visually read. The separate19-page
  extended background and OpenReview copies were not fully read; source-comparison and partial static
  implementation reading are documented in the ledger. No author program, training run, hardware measurement
  or benchmark replication was executed.
