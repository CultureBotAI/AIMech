id: AIMech:FedBabuFederatedAveragingWithBodyAggregationAndBodyUpdate
name: FedBABU (Federated Averaging with Body Aggregation and Body Update)
concept_kind: algorithm
review_status: DRAFT
definition: A decoupled representation-learning federated optimization algorithm (Oh, Kim, & Yun 2022, Section 5, Algorithms 1-2) that decomposes the deep network parameters theta = {theta_ext, theta_cls} into a feature extractor body theta_ext and a linear classification head theta_cls in R^{C x d}, freezes theta_cls = theta_{G,cls}^0 at its shared random orthogonal initialization (learning rate alpha_cls = 0) throughout all federated training rounds so clients update and server-aggregate only the body theta_ext against fixed shared class templates, and subsequently adapts the model to each client via local fine-tuning.
identity_notes: Distinct from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which actively updates each client's local linear head theta_{i,cls} via local gradient steps before updating the shared body in every round, whereas FedBABU keeps a single shared random orthogonal head completely frozen (alpha_cls = 0) during federated representation learning so all clients share identical fixed class decision boundaries.
aliases:
- FedBABU
- Federated Averaging with Body Aggregation and Body Update
- Frozen Orthogonal-Head Body-Only Federated Representation Learning
