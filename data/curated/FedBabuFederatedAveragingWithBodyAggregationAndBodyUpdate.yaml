claims:
- claim_id: r424-head-update-degradation-of-personalization-and-shared-orthogonal-template-mechanism
  kind: mechanism
  statement: Jointly updating and aggregating the classifier head theta_cls under non-IID client label distributions (as in FedAvg) causes divergent local head updates for missing classes that degrade the feature extractor's personalization capability (Section 3, Tables 1-3); freezing theta_cls at a shared orthogonal initialization forces all clients to map each class to the same fixed row template of theta_{G,cls}^0 without inter-client head interference (Section 4-5).
  evidence:
  - source_id: r424-primary-pdf
    locator: Section 3-4 Empirical Observations on Decoupled Parameter Updates (Tables 1-5, Figures 1-2) & Section 5 FedBABU
    relation: supports
- claim_id: r424-single-epoch-head-or-full-fine-tuning-rapid-personalization
  kind: mechanism
  statement: Because the body theta_{G,ext}^T learned with a frozen orthogonal head already produces well-clustered class representations, fine-tuning each client's local model after federated training converges within 1 to 5 local epochs and outperforms personalized baselines including FedPer, LG-FedAvg, FedRep, Per-FedAvg, andDitto (Section 5.2, Tables 6-8).
  evidence:
  - source_id: r424-primary-pdf
    locator: Section 5.2 Experimental Results (Tables 6-9, Figure 3), pp. 6-9
    relation: supports
- claim_id: r424-classification-head-architecture-and-local-finetuning-data-limitation
  kind: limitation
  statement: Restricted to supervised classification architectures with an explicit final linear classifier layer theta_cls, and personalized deployment requires labeled local data on each target client to perform the post-training fine-tuning step (Algorithm 2).
  evidence:
  - source_id: r424-primary-pdf
    locator: Section 5 Algorithm 1-2 & Appendix B-C
    relation: supports
- claim_id: r424-cifar10-cifar100-and-shard-partitioned-mobile-net-resnet-application
  kind: application
  statement: Applied to federated image classification on shard-partitioned CIFAR-10 and CIFAR-100 with ConvNet, MobileNet, ResNet, and VGG backbones under varying client participation rates and local epoch budgets.
  evidence:
  - source_id: r424-primary-pdf
    locator: Section 5.2 & Appendix D-I (Tables 6-9, Tables 13-22)
    relation: supports
