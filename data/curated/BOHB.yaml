claims:
- claim_id: method
  kind: mechanism
  statement: Keep observations separated by evaluation budget. For proposals, use the highest budget with
    enough data to build better- and worse-performing configuration densities. The paper uses multivariate
    KDEs, a loss-quantile split with minimum set sizes, and finite candidate sampling from an expanded
    better-performing density, selecting a candidate with favorable l(x)/g(x). Retain a positive fraction
    of random configurations, and fall back to random sampling when no model is available. Hyperband brackets
    and successive halving then allocate increasing resources to surviving candidates. Observations are
    shared across brackets, but the proposal density is not fitted by pooling all fidelity levels indiscriminately.
    The method can schedule multiple brackets and concurrent evaluations; the paper’s worker policy favors
    waiting smaller-budget jobs. Numerical model-building and sampling details differ in the pinned implementation,
    as recorded separately.
  evidence:
  - source_id: method-source
    locator: Sections3.1–4.2, PDF pp.3–5; Equations(2)–(3), Algorithms1–2 and accompanying descriptions
    relation: supports
  - source_id: schedule-code
