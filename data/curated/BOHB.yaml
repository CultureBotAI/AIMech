    relation: supports
  - source_id: density-code
    locator: 'Lines54–80,94–234 and267–354: model selection, candidate sampling and KDE construction'
    relation: supports
  - source_id: hyperband-source
    locator: 'Algorithm1, PDF/printed p.8: r=R*eta^(−s) and geometrically increasing allocation; original
      component context, not KDE evidence'
    relation: context
- claim_id: pinned-implementation
  kind: mechanism
  statement: The pinned scheduler uses geometrically spaced budgets b_max*eta^(−s) and computes its initial
    bracket count with int(floor((s_max+1)/(s+1))*eta^s), which differs from the paper’s ceiling convention.
    The proposal generator selects the largest available model budget, minimizes a numerically floored
    g/l ratio over finite samples, expands continuous-coordinate bandwidths, and samples randomly from
    ConfigSpace when needed. KDEs fit disjoint best/remainder slices and are created only when each actual
    slice contains more rows than dimensions. This implementation does not reproduce the paper’s small-sample
    overlapping-set rule. These are static source observations, not a runtime or compatibility result.
  evidence:
  - source_id: schedule-code
    locator: Lines96–103 and135–141
    relation: supports
  - source_id: density-code
    locator: Lines119–234 and300–354
    relation: supports
