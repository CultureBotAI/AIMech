name: BOHB
definition: A hyperparameter optimization algorithm combining Hyperband resource brackets with model-guided
  configuration proposals from performance-split multivariate kernel density estimates and a continuing
  random-sampling component.
concept_kind: algorithm
identity_notes: BOHB denotes the KDE-based method of Falkner, Klein and Hutter. It differs from pure random-sampling
  Hyperband and the original tree-structured one-dimensional TPE estimator. It is not every combination
  of Bayesian optimization and early stopping, a Gaussian-process surrogate, a Bayesian network, or the
  entire HpBandSter software framework. Paper and pinned implementation conventions are distinguished.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 256 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 2 lines in each checkout. These were prior random-search candidate
  leads, not existing records for these identities. Nine exact AIO CLASS nodes with synonyms and outgoing
  edges and six neighboring native mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.
limitations:
- The paper’s Equation(2) reverses the conditioning relative to configuration densities fitted from better/worse
  subsets. Its Algorithm1 prints eta^s*b_max as the initial budget, exceeding b_max for s>0. The recorded
  density interpretation and bounded geometric budgets follow the method prose, original Hyperband and
  inspected code; these are curator qualifications, not an author-issued erratum.
- Paper Equation(3) permits overlapping fit sets with few observations; the pinned code instead takes
  disjoint sorted slices and requires both actual slices to have more observations than dimensions. Its
  bandwidth widening applies to continuous proposal coordinates. Paper defaults and statements are not
  silently substituted for that implementation.
- Low-budget rankings can mislead search. Random exploration, density estimation and finite candidate
  sets do not give an unconditional finite-budget optimum, universal speedup or independent generalization
  guarantee. No author implementation was executed.
