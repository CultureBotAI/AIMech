claims:
- claim_id: r350-claim-half-minus-epsilon-threshold-sieve-guarantee
  kind: mechanism
  statement: 'For the active threshold tau in {(1 + varepsilon)^i} satisfying (1 - varepsilon) OPT / (2k) <= tau < OPT / (2k), admitting stream elements with marginal gain f({e} | S_tau) >= tau while |S_tau| < k guarantees f(S_tau) >= (1/2 - varepsilon) OPT in both terminal cases: if |S_tau| = k, telescoping marginal gains gives f(S_tau) >= k * tau >= (1/2 - varepsilon) OPT; if |S_tau| < k, every unpicked element e in S^* \ S_tau had marginal gain f({e} | S_tau) < tau < OPT / (2k), so submodularity yields OPT - f(S_tau) <= sum_{e in S^* \ S_tau} f({e} | S_tau) < OPT / 2.'
  evidence:
  - source_id: r350-primary-pdf
    locator: Section 3.1, Theorem 1 and Proof of Approximation Guarantee, pp. 5-6
    relation: supports
- claim_id: r350-claim-dynamic-lower-bound-geometric-memory-compression
  kind: mechanism
  statement: By maintaining LB = max_tau f(S_tau) >= max_tau (|S_tau| * tau) and pruning all thresholds tau < tau_min = max(LB, Delta) / (2k), Sieve-Streaming++ bounds the size of every active sieve S_tau by k for tau in [LB/(2k), LB/k] (at most ceil(log(2)/varepsilon) thresholds) and by |S_tau| <= LB / tau <= k / (1 + varepsilon)^i for tau = (LB / k)(1 + varepsilon)^i >= LB / k, reducing total memory from O(k log(k) / varepsilon) in Sieve-Streaming to the optimal O(k / varepsilon) while making O(log(k) / varepsilon) oracle queries per stream element.
  evidence:
  - source_id: r350-primary-pdf
    locator: Section 3.1, Table 1, Algorithm 1, and Proof of Theorem 1 (Memory complexity), pp. 5-6
    relation: supports
- claim_id: r350-claim-batch-sieve-streaming-low-adaptivity-and-communication
  kind: mechanism
  statement: Buffering B stream elements and applying geometric batch Threshold-Sampling (Batch-Sieve-Streaming++, Algorithms 2-3) achieves a (1/2 - 3 varepsilon / 2) approximation using O(B + k / varepsilon) memory in O(N log(B) log(k) / (B varepsilon)) expected adaptive rounds (Theorem 2), and in the multi-source streaming setting incurs O(k log(OPT / Delta_0) / varepsilon^2) total communication cost independent of the stream length N and buffer size B (Theorem 3).
  evidence:
  - source_id: r350-primary-pdf
    locator: Section 3.2, Algorithms 2-3, Theorem 2, and Lemma 1, pp. 7-10; Section 4, Theorem 3, pp. 11-12
    relation: supports
