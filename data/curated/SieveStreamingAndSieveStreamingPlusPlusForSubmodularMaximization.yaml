limitations:
- Any single-pass streaming algorithm using o(n / k) memory that evaluates the submodular oracle only on feasible sets of size at most k cannot exceed a 1/2 approximation ratio in adversarial stream order (Norouzi-Fard et al. 2018), and both Sieve-Streaming and Sieve-Streaming++ require monotonicity and non-negativity of f.
