id: AIMech:IterativeThresholdSearch
name: Iterative threshold search
aliases: []
definition: A limited-memory heuristic tree-search algorithm that explores branches
  within an iteratively revised cost threshold, stores bounds for branches whose children
  may still be ungenerated, and backs up those bounds when retracting stored nodes.
identity_notes: Iterative threshold search denotes the limited-memory tree procedure
  of Ghosh, Mahanti and Nau (1994), which combines cost-threshold passes with per-branch
  bounds including ungenerated successors, retraction and retained lower-bound information.
  It is distinct from ordinary smallest-excess IDA*, learned threshold-prediction
  IDA*IM, MREC, RBFS and beam search. The ambiguous bare acronym ITS is not added
  as an alias. The literal Background h(n)>0 versus Example 1 h(n)=0 discrepancy is
  retained. The two-tip retraction guard preserves the current path, so S=0 does not
  imply zero total storage. The actual cohort 358 collection at dd7a5a99eb412b5b587efb1e598cbb760a9bba0d
  contains 1,236 records (794 native and 442 pinned AIO), 4,903 identity-field occurrences
  including local IDs and 3,745 normalized values. Candidate IDs, names, aliases and
  retained source spellings have no normalized collision in that inventory. The collection
  includes ignored and hidden files in four-root text searches; semantic raw-search
  assessment is separately attributed. All 1,230 records in the older scientific-research
  inventory retain their bytes; six later additions were read as current definition/identity
  context. The seven normalized matches concern existing A*, IDA*, IDA*IM, beam-stack
  and RBFS-family contexts, not candidate identities. Current memory-search source
  owner 911 is only partially resolved; MA*/MAO* and separate IE owner 912 remain
  pending.
claims:
- claim_id: branch-state-before-child-generation
  kind: mechanism
  statement: When installing a node, ITS creates a branch for each applicable operator
    without needing to invoke that operator to generate its child. Each branch bound
    B starts at the installed node’s g + h; a dummy branch is installed when no operator
    applies.
  evidence:
  - source_id: its1994
    locator: Algorithm ITS, printed pp. 1353–1354 / PDF pp. 1–2; branch representation
      and Install procedure
    relation: supports
- claim_id: threshold-and-leftmost-selection
  kind: mechanism
  statement: Each outer iteration sets the threshold to the minimum bound among tip
    branches. ITS repeatedly selects the leftmost tip branch whose bound does not
    exceed that threshold, tests its parent node for a goal, and either handles a
    dummy branch or installs the selected child.
  evidence:
  - source_id: its1994
    locator: Printed p. 1354 / PDF p. 2; Procedure ITS, steps 2(a)–2(b)iii
    relation: supports
- claim_id: retraction-and-bound-backup
  kind: mechanism
  statement: Before installing a child, if the stored tree has at least S nodes and
    at least two tip nodes, ITS retracts the leftmost tip node whose outgoing branch
    bounds all exceed the threshold, or otherwise the rightmost tip node. It places
    the minimum outgoing bound on the retracted node’s incoming branch and removes
    the node and its outgoing branches.
  evidence:
  - source_id: its1994
    locator: Printed p. 1354 / PDF p. 2; Procedure ITS, step 2(b)iiiA and definitions
      of tip node and retraction
    relation: supports
- claim_id: minimum-storage-keeps-active-path
  kind: scope
  statement: S controls the amount of node storage used by the retraction condition.
    In the S = 0 setting described in the experiments, ITS retains the current search
    path while retracting other nodes; per-branch bounds and operator information
    still have to be represented.
  evidence:
  - source_id: its1994
    locator: Printed pp. 1354–1355 / PDF pp. 2–3; storage definition, two-tip retraction
      guard and Experimental Results memory-setting paragraph
    relation: supports
