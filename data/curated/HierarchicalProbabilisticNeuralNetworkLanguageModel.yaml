claims:
- claim_id: method
  kind: mechanism
  statement: Concatenate the embeddings of the preceding context words into x, sharing their embedding
    matrix across all tree nodes. For internal node n, compute q_n=sigmoid(alpha_n+beta^T tanh(c+W x+U
    N_n)), where N_n is its separately learned node embedding, alpha_n is its scalar bias, and beta, c,
    W and U are shared parameters. The binary code for a target word chooses q_n or 1-q_n at each node;
    multiply those factors to obtain its normalized next-word probability. Training backpropagates the
    observed-word log loss through nodes on that path and their shared parameters. Although W x can be
    reused, tanh(c+W x+U N_n) generally differs by node. The reported tree starts from WordNet, selects
    one parent for multiply parented nodes and the most frequent sense per word, then makes nonbinary
    branches binary using corpus-based clustering. This hierarchy is a modeling choice, not a semantic-equivalence
    guarantee.
