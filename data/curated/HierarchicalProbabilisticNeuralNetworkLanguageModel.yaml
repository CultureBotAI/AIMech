name: Hierarchical probabilistic neural network language model
definition: A neural next-word architecture that factors word probabilities along a binary vocabulary
  tree and shares a nonlinear branch predictor conditioned on context-word embeddings and a separate embedding
  of the current tree node.
concept_kind: architecture
identity_notes: 'This record covers Morin and Bengio’s 2005 shared-predictor architecture, including its
  WordNet-guided tree construction. It is a complete language model, distinct from the generic hierarchical-softmax
  output component and from HLBL’s linear context representation with node-vector scores. The title is
  scoped to this original construction, not every probabilistic language model using a hierarchy. All
  442 pinned AIO labels/scoped synonyms and 355 preceding native IDs/names/aliases were compared, with
  no normalized identity match. Full-checkout fixed-string searches included ignored and hidden files
  in both worktree and main, returning 54 lines each. All 41 unique matched contents were read: source
  references, complete-model contrasts, frontier leads and prior review context for the hierarchical-softmax
  component. None is an existing record for these complete architectures. Twenty exact AIO nodes and their
  generated records plus four complete native neighbors were inspected. Absence is bounded to this snapshot
  and semantic neighborhood.'
limitations:
- Target evaluation work scales with path length and the branch-predictor cost. A logarithmic path requires
  suitable tree depth; producing the entire vocabulary distribution still requires at least linear output
  work.
- The learned tree distribution is exactly normalized for its own parameters, but is not an equality-preserving
  numerical shortcut for a previously specified flat-softmax network.
- Choosing one frequent WordNet sense loses other senses. Multiple leaves per word are discussed as an
  extension and require summed path probabilities; this record does not attribute that implementation
  to the original experiment.
- Shared parameters reduce independent per-node parameterization but do not make the hidden activities
  identical at all nodes or establish convex learning or global convergence.
- The accessed reissue PDF has unresolved references and a page-count discrepancy against its landing-page
  pagination; evidence is tied to the exact six-page file. No claimed speedup, test ranking or author-code
  behavior is certified.
