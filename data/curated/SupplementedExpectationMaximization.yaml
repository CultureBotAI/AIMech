name: Supplemented Expectation Maximization
aliases:
- Supplemented EM
- SEM Algorithm (Supplemented EM)
concept_kind: algorithm
definition: A numerical supplement to expectation maximization that combines expected complete-data information
  with the local Jacobian of the EM update map to estimate the observed-data asymptotic parameter covariance.
identity_notes: Supplemented EM estimates uncertainty around a converged EM fit; it is distinct from stochastic
  EM, structural equation modeling, EM acceleration and the fitting algorithm itself. Bare SEM is not
  asserted as an alias. The full 1995 SECM primary follow-up gives the SEM equations and explicit implementation
  as a special case, supporting this record despite the inaccessible original 1991 full PDF. All 442 pinned
  AIO labels/scoped synonyms and 466 preceding native IDs, names and aliases were compared. The sole normalized
  search-term collision, bare SAGE, identifies the existing sparse additive text model; the new optimization
  method uses qualified aliases. Ignored-inclusive fixed-string searches of both full checkouts returned
  436 and 459 line instances. Context windows for all 143 distinct normalized matched texts were inspected;
  duplicate ledger/review mentions, unrelated environment strings and the stochastic-EM lead do not establish
  these four method identities. All 225 semantic label/synonym rows and 17 annotated AIO nodes with outgoing
  edges were inspected; sixteen nodes were byte-verified unchanged after prior reading and UncertaintyBias
  was newly read. Thirty-one contextual YAMLs comprise 17 AIO and 14 native records, with 27 verified
  prior readings and four full new readings; the existing sparse text SAGE was also reread. Absence is
  bounded to this pin, maintained corpus and inspected neighborhood.
