id: AIMech:AutoWalksat
name: Auto-Walksat
concept_kind: algorithm
aliases: []
definition: A preprocessing-and-run algorithm that estimates a fixed noise setting for a stochastic SAT
  solver by probing a terminal-score mean-to-standard-deviation ratio, searching the proxy with bracketing
  and parabolic interpolation, and using an empirical post-minimum adjustment.
definition_evidence:
- source_id: patterson2001
  locator: PDF pp. 3–4, Sections 2–3 and Figure 2; pp. 7–9, discussion and conclusion
  relation: supports
claims:
- claim_id: fixed-noise-preprocessing-controller
  kind: scope
  statement: Auto-Walksat is a preprocessing controller for a CNF formula and a supplied stochastic SAT
    algorithm with a noise parameter. It probes settings, estimates a setting from a proxy statistic,
    and then runs the solver with that selected setting; the defining experiments instantiate Walksat-SKC.
  evidence:
  - source_id: patterson2001
    locator: PDF pp. 1–4, Sections 1–3 and Figures 1–2
    relation: supports
- claim_id: terminal-unsuccessful-score-ratio
  kind: mechanism
  statement: For Walksat-SKC the objective is the number of unsatisfied clauses. The stated invariant
    ratio is the mean divided by the standard deviation of objective values at the ends of several unsuccessful
    attempts made with different random seeds.
  evidence:
  - source_id: patterson2001
    locator: PDF p. 3, Section 2
    relation: supports
  - source_id: kautz2004-context
    locator: PDF p. 2, AutoWalksat paragraph; later statistic wording is contextual and does not substitute
      for the 2001 definition
    relation: context
- claim_id: short-repeated-probes
  kind: mechanism
  statement: Figure 2 estimates the ratio at a fixed noise setting with repeated short attempts, collecting
    objective statistics after 2,000 flips plus one flip for every atom of the formula. It states a mean-confidence-interval
    stopping test whose exact displayed numerical convention is unresolved.
  evidence:
  - source_id: patterson2001
    locator: PDF p. 4, Figure 2, Probe definition
    relation: supports
- claim_id: bracketing-and-parabolic-search
  kind: mechanism
  statement: The described controller brackets noise over the displayed 0–100 scale, uses a parabolic
    interpolation proposal when the parabola is well formed, and otherwise takes a golden-section step
    toward the larger side before probing again and shrinking the bracket.
  evidence:
  - source_id: patterson2001
    locator: PDF pp. 3–4, Section 3 and Figure 2
    relation: supports
- claim_id: post-minimum-heuristic-and-failure
  kind: scope
  statement: The discussion and conclusion describe increasing the ratio-minimizing noise by ten percent
    before the final solver run as an empirical heuristic. The same paper reports that its logistics example
    instead calls for decreasing noise and says how to choose the direction is unresolved.
  evidence:
  - source_id: patterson2001
    locator: PDF pp. 7–9, Section 5, Figure 6 and Section 6
    relation: supports
limitations:
- The terminal statistic is defined over unsuccessful attempts, while the probe pseudocode does not specify
  treatment of successful attempts, a minimum retained count, a standard-deviation estimator, or what
  to do when the retained set is empty or has zero spread. These are source specification gaps, not observed
  implementation failures.
- Figure 2 visually prints 0.05 with superscript 3 and no corresponding footnote visible on that page.
  Its exact exponent/footnote meaning, interval width convention, replication rule and statistical construction
  are unresolved. Even a precise mean-only interval does not establish precision of mean divided by a
  near-zero standard deviation.
- Figure 2 leaves endpoint values initially undefined, gives only a general bracket reassignment instruction,
  and does not fully specify how the last proposal n relates to a retained best point. The prose’s one-percent
  refinement criterion does not identify its exact comparison quantity or zero boundary. Finite noisy
  probes and this description do not prove a global ratio minimum or an optimal solver noise setting.
- The prose’s ten-percent increase is absent from Figure 2. The logistics example explicitly needs the
  opposite direction. Its 39–69 to 9–39 numbers illustrate a 30-percentage-point decrease for that example,
  without establishing a general relative/additive offset or clipping convention. The original does not
  give an automatic rule for choosing the direction.
- The supplied algorithm must expose the relevant noise parameter and objective observations. The detailed
  evaluated move rule is Walksat-SKC; tuning one parameter need not fix instances difficult for that solver.
  This is preprocessing followed by a chosen fixed setting, not a specification of generic within-run
  adaptation. A finite failed SAT search is not an UNSAT certificate.
- Illustrated curves, four DIMACS problem experiments, short tuning overhead and logistics results are
  bounded observations. They do not establish universal speedup, calibrated success probability, optimality
  for every formula/variant, or a theorem that the invariant ratio predicts performance. No benchmark
  or author implementation was run here.
- This assessment uses the nine-page May 2001 author preprint layout, with publication identity corroborated
  separately. The 2004 owner-URL description uses different shorthand for the statistic and is context
  only. Publisher-byte equivalence, later code behavior, the original cited invariants theory and full
  Brent-method assumptions were not verified, so their details are not silently imported.
