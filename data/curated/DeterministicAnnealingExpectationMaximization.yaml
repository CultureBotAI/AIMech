name: Deterministic Annealing Expectation Maximization
aliases:
- Deterministic Annealing EM
- DAEM
concept_kind: algorithm
definition: A latent-variable likelihood-fitting procedure that performs deterministic powered-posterior
  EM updates along a warm-started cooling schedule from a small positive inverse temperature to one, including
  an ordinary-likelihood fit at the endpoint.
identity_notes: 'DAEM denotes the Ueda-Nakano outer cooling procedure, whose finite-state fixed-temperature
  update overlaps the existing tempered-EM framework. It is retained as a named schedule-defined specialization,
  not a disjoint update family. Hofmann’s held-out inverse-annealing realization starts at one and decreases
  inverse temperature, whereas this procedure increases it to one for likelihood fitting. CAEM samples
  hard assignments; DAEM uses fractional expectations. Neither deterministic procedure is Metropolis simulated
  annealing. No normalized identity matches among 442 pinned and 476 maintained records, including acronym
  probes. GEM is the exact-current-E/Q-improvement framework, IEM refreshes cached independent cases,
  sparse EM preserves frozen outside mass, and DAEM is the warm-started cooling-to-beta1 procedure. Existing
  TEM has the same finite-state fixed-beta update, but its broader update framework and held-out inverse-annealing
  realization do not define that outer cooling procedure. ECM, AECM and SAGE specialize parameter/augmentation
  updates, not these case or probability-subset operations. Structured factorial-HMM variational inference
  imposes a different family restriction. Names and incidental frontier references do not establish identity;
  qualified GEM/IEM aliases avoid unrelated uses. The absence assessment is bounded to this snapshot and
  corpus. Identity-search counts: 253 matched lines in the worktree and 260 in main; all 98 distinct matching-text
  windows were read, with ignored and hidden files included.'
