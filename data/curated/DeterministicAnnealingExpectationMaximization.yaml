claims:
- claim_id: powered-joint-stages
  kind: mechanism
  statement: At fixed beta>0 define f_beta(z|x,theta)=p(x,z|theta)^beta/Z_beta(x,theta), where Z is a
    positive finite latent sum or integral. The power applies to the whole joint density, including mixing
    weights. Compute expectations under f_beta at the current parameters, then maximize the expected complete
    log likelihood with that distribution held fixed. Repeat the deterministic stage updates to the chosen
    stopping condition, increase beta, and warm-start the next stage. Explicitly fit at beta=1 to recover
    the ordinary EM endpoint.
  evidence:
  - source_id: annealing-source
    locator: Sections3.1-3.2 Eq7-14, pp547-549 / PDF3-5
    relation: supports
- claim_id: stage-objective
  kind: scope
  statement: At fixed beta, the entropy-weighted variational objective profiles to (1/beta)*sum_i log
    Z_beta(x_i,theta), the negative of the paper’s free energy. Exact admissible coordinate updates increase
    that stage objective; beta=1 gives observed log likelihood. For beta different from one, stage improvement
    need not increase ordinary likelihood. Changing beta changes the optimized objective, so a cooling
    path is not ascent on a single unchanged likelihood surface.
  evidence:
  - source_id: annealing-source
    locator: Eq11-13, p548 / PDF4; Eq15-17, p551 / PDF7
    relation: supports
- claim_id: normalization-and-global-claims
  kind: limitation
  statement: 'The source’s high-temperature uniqueness and global-tracking argument is conditional, not
    a general convergence guarantee. On an unbounded continuous latent domain, the beta=0 uniform law
    need not exist and positive powers of a heavy-tailed density can have infinite normalizers. Negative
    log density also need not be nonnegative: normalized continuous densities can exceed one. Local warm-started
    optimization need not follow the global optimum through temperature changes or bifurcations.'
  evidence:
  - source_id: annealing-source
    locator: Section3.1 energy note, p548 / PDF4; Section3.2 global-minimum discussion, p549 / PDF5; curator
      continuous-density counterexamples
    relation: supports
- claim_id: endpoint-rule
  kind: limitation
  statement: The printed pseudocode increases beta and repeats only while beta<beta_max, which can stop
    before fitting at the desired beta_max=1. The endpoint solve is specified explicitly here; a literal
    transcription of that test is not certified. The experimental multiplicative rule beta_new=1.4*beta
    also requires an endpoint policy. The selected two-Gaussian demonstrations do not establish initialization
    independence or a universally successful cooling schedule.
  evidence:
  - source_id: annealing-source
    locator: Section3.2 steps4-5 and endpoint prose, p549 / PDF5; Section4 and footnote3, pp550-551 /
      PDF6-7
    relation: supports
limitations:
- The continuous extension requires a specified base measure, support and finite powered-density integrals
  at every scheduled beta. Finite mixtures avoid some integrability issues but can still have singular
  or inadmissible parameter fits.
- At beta=1 the update is ordinary EM, not necessarily a global maximum. The beta-to-infinity hard-assignment
  discussion is a different limit from this cooling-to-one likelihood procedure.
- The fully inspected1994proceedings version is distinct from the1998journal article. No unseen journal
  correction, proof or author implementation is claimed.
- No author software or historical empirical study was reproduced. Finite curator calculations illustrate
  stated objective and schedule boundaries; they are not a general convergence proof or an empirical speed
  comparison.
