aio_mappings:
- target: AIO:DimensionalityReduction
  relation: related_match
  rationale: PowerSGD compresses high-dimensional gradient tensors into low-rank matrix factors P in R^{n x r} and Q in R^{m x r} via warm-started subspace iteration.
- target: AIO:PrincipalComponentAnalysis
  relation: related_match
  rationale: PowerSGD's compression operator approximates the top-r singular subspace of the error-compensated gradient matrix using block power iteration and Gram-Schmidt orthogonalization.
limitations:
- Requires local Gram-Schmidt orthonormalization of an n x r matrix and two all_reduce operations per layer at each training step.
- 1D bias and normalization vectors cannot be low-rank factored and must be transmitted uncompressed.
