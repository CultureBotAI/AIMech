name: MixUp
definition: A training-data interpolation procedure that fits a predictor to convex combinations of example
  inputs and their corresponding targets using the same random mixing coefficient for both.
concept_kind: algorithm
identity_notes: This record denotes the original input-and-target interpolation training rule, not MixMatch’s
  full semi-supervised algorithm, hidden-representation Manifold Mixup, patch replacement, or a trained
  model. Case variants of mixup are the same name. AIO DataAugmentation is relevant to the virtual-example
  construction, while the entire training rule also specifies a target and loss; a related mapping avoids
  forcing the complete procedure into AIO’s preprocessing branch. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 234 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  21 lines in each from prior discovery and the related MixMatch record. Twelve exact AIO CLASS nodes,
  their scoped synonyms and outgoing edges, plus six neighboring native mechanisms were inspected. This
  absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- Inputs and targets need meaningful convex combinations in compatible vector spaces. Interpolations need
  not be natural samples or remain on a data manifold.
- Linearity between examples is an inductive bias, not a guarantee that the ground-truth conditional labels
  interpolate linearly or that accuracy and robustness improve.
- Beta(a,a) requires a>0; the empirical-risk limit a→0 is not a valid Beta(0,0) sampling instruction.
- No performance result, particular network architecture, fixed alpha or sampling implementation is asserted.
