claims:
- claim_id: method
  kind: mechanism
  statement: Draw pairs (x_i,y_i) and (x_j,y_j) from the training data and lambda from Beta(a,a), a>0.
    Construct x_tilde=lambda*x_i+(1−lambda)*x_j and y_tilde=lambda*y_i+(1−lambda)*y_j, then minimize the
    prediction loss on these mixed input-target pairs as an empirical vicinal risk. The classification
    example mixes one-hot labels into soft targets; the formulation is expressed for feature-target vectors.
    The source presents paired minibatches and also describes mixing a minibatch with its random shuffle.
    Its Figure1 uses one sampled coefficient for a paired minibatch; this is not a requirement that every
    variant share one coefficient. As a tends toward zero from above, the interpolation distribution concentrates
    at the endpoints, recovering empirical-risk training in that limit. The original rule does not replace
    lambda by max(lambda,1−lambda); that first-example-majority convention belongs to the later MixMatch
    family.
