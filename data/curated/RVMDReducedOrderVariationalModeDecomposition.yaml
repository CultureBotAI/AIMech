id: AIMech:RVMDReducedOrderVariationalModeDecomposition
name: RVMD Reduced-Order Variational Mode Decomposition
concept_kind: algorithm
review_status: DRAFT
definition: A spatiotemporal modal decomposition and dimensionality reduction algorithm that represents a high-dimensional space-time field q(x, t) as a rank-K expansion sum_{k=1}^K phi_k(x) c_k(t) with unit-norm spatial modes ||phi_k||_x = 1 and minimizes the sum of the space-time reconstruction error and the analytic-signal spectral bandwidth penalty sum_{k=1}^K int_0^infty 2*alpha*(omega - omega_k)^2 |c_hat_k(omega)|^2 d_omega via Block Coordinate Descent alternating residual spatial projection, second-order Wiener filtering g_hat_k(omega) = 1 / [1 + 2*alpha*(omega - omega_k)^2], and power-spectrum center-of-gravity frequency updates.
identity_notes: No AIO class represents Reduced-Order Variational Mode Decomposition (RVMD); DimensionalityReduction (AIO:DimensionalityReduction) and PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) are the closest broad matches covering low-rank orthogonal/non-orthogonal modal reduction of high-dimensional data.
aliases:
- Reduced-Order Variational Mode Decomposition
- RVMD Spatiotemporal Modal Decomposition
- Wiener-Filtered Block Coordinate Descent Reduced-Order VMD
