limitations:
- The named 2016 sentence-pair construction is narrower than generic attention pooling; AP-CNN and AP-biLSTM
  are variants rather than interchangeable aliases.
- Printed reduction bounds require an explicitly labelled dimensional interpretation. Empty sequences,
  zero-norm cosine inputs and gradient choices at max ties were not established from author code.
- Invariance of pooling over fixed encoded vectors does not imply word-order invariance, and attention
  heatmaps do not certify causal explanations.
- All ten pages of arXiv1602.03609v1 were visually read. Other versions, author code and training were
  not inspected; no benchmark or hardware result was replicated. DRAFT remains.
