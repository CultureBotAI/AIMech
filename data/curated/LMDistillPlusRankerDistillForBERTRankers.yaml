claims:
- claim_id: lm-plus-ranker-distill-three-regime-separation
  kind: mechanism
  statement: 'The framework decomposes BERT ranker compression into three regimes (Figure 1): Ranker Distill alone (distilling a fine-tuned BERT ranker into a randomly initialized student), LM Distill + Fine-tuning (distilling general-purpose LM predictions into a student LM followed by supervised search fine-tuning), and LM Distill + Ranker Distill (initializing the student via LM Distill and then distilling intermediate self-attention distributions and output relevance signals from a fine-tuned BERT ranker teacher).'
  evidence:
  - source_id: r798-primary-pdf
    locator: Section 3 (Distilling BERT for Ranking), pp. 1-2, Figure 1
    relation: supports
  - source_id: r798-primary-pdf
    locator: non_inferiority_margin_check and kl_divergence verification
    relation: supports
- claim_id: lm-plus-ranker-distill-noninferiority-and-9x-speedup
  kind: application
  statement: On MS MARCO Passage Ranking and TREC 2019 DL Queries, Ranker Distill alone fails 3%-margin non-inferiority testing at both 6 layers (0.3380 MRR@10) and 4 layers (0.3286 MRR@10 vs. 0.3527 for 12-layer BERT), and LM Distill + Fine-tuning fails at 4 layers (0.3320 MRR@10), whereas LM Distill + Ranker Distill achieves statistical non-inferiority at both 6 layers (0.3600 MRR@10, 2.0x speedup) and 4 layers with H=312 (0.3501 MRR@10, 0.6827 NDCG@10, 9.0x speedup at 0.33s per 1000 documents or 30 queries/sec at depth 100, Tables 1-2).
  evidence:
  - source_id: r798-primary-pdf
    locator: Section 5.1 (Impacts on Ranking Performance), p. 3, Tables 1-2
    relation: supports
  - source_id: r798-primary-pdf
    locator: Table 1 non-inferiority and depth-100 throughput verification
    relation: supports
- claim_id: lm-plus-ranker-distill-sample-complexity-and-overfitting-resistance
  kind: mechanism
  statement: While a 6-layer LM-distilled student converges near full BERT accuracy within 100K-1M training pairs, a highly compressed 4-layer (H=312) student requires 5M-10M pairs to recover lost LM capacity; beyond 5M pairs, direct fine-tuning degrades due to overfitting whereas Ranker Distill continues improving monotonically (Section 5.2, Figure 2).
  evidence:
  - source_id: r798-primary-pdf
    locator: Section 5.2 (Impacts on Training), p. 4, Figure 2
    relation: supports
- claim_id: lm-plus-ranker-distill-offline-training-time-cost
  kind: limitation
  statement: Because Ranker Distill executes both the 12-layer teacher and the student during training and requires 5x more training steps for the 4-layer model to converge (5M vs. 1M examples), reaching within 5% of teacher accuracy requires 5.5 hours (6-layer) to 14.8 hours (4-layer) on 4 GPUs, which is 5x-9x slower than direct fine-tuning (1.1h and 1.6h, Table 3).
  evidence:
  - source_id: r798-primary-pdf
    locator: Section 5.2 (Fine-tuning vs. Ranker Distill during Training, Table 3), p. 4
    relation: supports
