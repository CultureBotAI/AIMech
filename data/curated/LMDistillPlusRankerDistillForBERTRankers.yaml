id: AIMech:LMDistillPlusRankerDistillForBERTRankers
name: LM Distill + Ranker Distill (Two-Round Knowledge Distillation for BERT Rankers)
concept_kind: learning_paradigm
review_status: DRAFT
definition: 'A two-round knowledge distillation paradigm for compressing BERT-based neural rerankers (Gao, Dai, & Callan, ICTIR 2020) that explicitly disentangles and transfers two sources of teacher capability: (1) general-purpose language modeling knowledge via LM Distill, which distills a pre-trained 12-layer BERT language model over a large text corpus into a compact student language model, and (2) search-specific relevance modeling knowledge via Ranker Distill, which subsequently distills both intermediate self-attention distributions and output relevance predictions from a fine-tuned 12-layer BERT ranker onto the LM-distilled student, preserving statistical non-inferiority to the full BERT ranker at up to 9x inference speedup.'
identity_notes: Distinct from single-stage Ranker Distill (which distills a fine-tuned BERT ranker directly onto a randomly initialized student and fails to recover general language modeling knowledge) and from LM Distill + Fine-tuning (which fine-tunes a distilled LM directly on hard search labels and degrades or overfits under high compression such as 4-layer H=312 students). By pairing LM Distill initialization with Ranker Distill intermediate-attention and output supervision, LM Distill + Ranker Distill prevents overfitting past 5M training pairs and achieves statistical non-inferiority on both 6-layer (H=768) and 4-layer (H=312) rankers.
aliases:
- LM Distill + Ranker Distill
- Two-Round LM and Ranker Knowledge Distillation for BERT Rerankers
- LM-Distill-Plus-Ranker-Distill
