claims:
- claim_id: method
  kind: mechanism
  statement: Choose a representation of feasible configurations, an objective E to minimize, a random
    rearrangement proposal and an annealing schedule specifying temperatures and work at each temperature.
    At current configuration x, propose y and compute delta=E(y)−E(x). For the basic symmetric-proposal
    Metropolis rule at effective temperature T>0 measured in cost units, accept delta<=0 moves and accept
    delta>0 with probability exp(−delta/T); otherwise retain x. Repeat transitions at the current temperature,
    then lower temperature according to the schedule. High temperatures permit larger cost-increasing
    moves more frequently; cooling reduces that probability. The source motivates sufficient equilibration
    at each stage. Candidate representation, move set and schedule depend on the optimization problem;
    the returned low-cost configuration is a search result rather than a certified global minimizer.
  evidence:
  - source_id: method-source
    locator: Statistical Mechanics, PDF pp.3–4 / printed672–673, Metropolis acceptance and cooling schedule;
      Summary and Conclusions, PDFp.10 / printed679
    relation: supports
- claim_id: proposal-and-temperature-scope
  kind: limitation
  statement: 'Curator qualification by substituting pi_T(x) proportional to exp(−E(x)/T) into Hastings’s
    Metropolis choice: when the target is proper and the ratio is defined, an asymmetric proposal requires
    acceptance min(1,exp(−delta/T)*q(x|y)/q(y|x)). The uncorrected exponential rule follows when the proposal
    ratio cancels. This fixed-temperature construction does not establish finite-schedule equilibration
    or annealing convergence.'
