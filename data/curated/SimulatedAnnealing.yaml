name: Simulated annealing
definition: A stochastic optimization procedure that explores candidate configurations with temperature-controlled
  acceptance of cost-increasing moves and progressively cools that acceptance process to concentrate search
  on low-cost configurations.
concept_kind: algorithm
identity_notes: This record denotes the temperature-scheduled optimization procedure exemplified by Kirkpatrick,
  Gelatt and Vecchi. Its basic symmetric-proposal Metropolis step is distinguished from fixed-temperature
  target sampling, generic annealing metaphors, training signal annealing and a proof that a particular
  finite schedule reaches a global minimum. The 1983 article is a primary formulation, not a claim of
  exclusive invention. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 285 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 15 and 15 lines respectively. Every text hit was a
  prior candidate lead. Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and
  seven native neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.
limitations:
- The exp(−delta/T) expression is for positive effective temperature with the physical Boltzmann constant
  absorbed into its cost units. Zero temperature is a limiting or separately defined greedy rule, not
  evaluation of that quotient at T=0. Equal-cost moves are accepted in the displayed symmetric-proposal
  rule.
- At fixed T the Boltzmann interpretation requires a proper target and a valid transition construction.
  Arbitrary asymmetric proposals do not justify dropping the reverse-to-forward proposal ratio. Lowering
  T changes the target; stationarity for a fixed stage does not imply equilibrium throughout a finite
  cooling run.
- Positive-temperature uphill acceptance only permits escape through moves supported by the proposal.
  It does not ensure reaching every state, escaping a local basin in a chosen budget or tracking equilibrium.
  Rapid cooling can freeze search prematurely; schedule length, cost scale, move connectivity and constraints
  matter.
- The primary article’s heuristics and empirical scaling claims are not a finite-run global-convergence
  theorem or a universal complexity bound. The later mathematical conditions for asymptotic annealing
  convergence were not audited here. No electronic-design or traveling-salesman benchmark is reproduced.
