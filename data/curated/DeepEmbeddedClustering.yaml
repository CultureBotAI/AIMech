name: Deep embedded clustering
definition: A neural clustering procedure that jointly refines an embedding and cluster centers by fitting
  Student-t soft assignments to periodically refreshed, frequency-normalized squared-assignment targets.
concept_kind: algorithm
identity_notes: DEC denotes the original Xie et al. algorithm. Autoencoder reconstruction initializes
  the encoder; reconstruction is not retained in the clustering objective. This is distinct from k-means
  alone, hard pseudo-label classification in DeepCluster, balanced transport in SeLa, and later reconstruction-regularized
  extensions. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 199 preceding native IDs/names/aliases. Ignored-inclusive word-delimited searches of both full checkouts
  found eight prior discovery/review references in each. Short acronyms were compared in normalized record
  identities; broad text searches used the full names and longer aliases. Nearest maintained mechanisms
  and seven exact AIO nodes with incident edges were inspected.
limitations:
- K, initialization, representation capacity and the target-refresh schedule affect the result. Frequency
  normalization compensates for cluster mass but does not enforce equal cluster sizes or an externally
  specified prior.
- The auxiliary distribution amplifies confident assignments, including incorrect ones. Nonconvex optimization
  and changing targets do not provide a general global-optimum or semantic-recovery guarantee.
- The 0.1% label-change threshold is a stopping heuristic, not proof that an objective gradient is zero.
  Student-t assignments are normalized similarity weights, not calibrated class probabilities.
- The Python training driver was inspected, but the Caffe kernel and its gradients were not independently
  audited or executed. No reported benchmark was reproduced.
