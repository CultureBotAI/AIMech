claims:
- claim_id: mores-interaction-block-cross-and-query-self-attention
  kind: mechanism
  statement: Given independent document representations D = H_M^{doc} in R^{d x n} and query representations Q = H_N^{qry} in R^{q x n}, each MORES Interaction Block (IB) computes query-to-document cross-attention Q_x = LN(Attend(Q, D) + Q), query-only self-attention Q_self = LN(Attend(Q_x, Q_x) + Q_x), and feed-forward residual refinement IB(Q, D) = LN(FFN(Q_self) + Q_self) (Equations 5-9) while keeping D unchanged across all K Interaction Blocks before scoring via score(qry, doc) = w^T CLS(H_K^{IB}) (Equation 10).
  evidence:
  - source_id: r794-primary-pdf
    locator: Section 3.1 (The MORES Framework), p. 3, Figure 1, Equations (1)-(10)
    relation: supports
  - source_id: r794-primary-pdf
    locator: interaction_block_reuse_s1 and interaction_block_reuse_s2 verification
    relation: supports
- claim_id: mores-reuse-s1-and-reuse-s2-offline-precomputation
  kind: mechanism
  statement: 'MORES supports two mathematically equivalent offline pre-computation strategies: Document Representation Reuse (Reuse-S1), which stores D in R^{d x n} offline to eliminate the O(n d^2) document self-attention term at query time, and Projected Document Representation Reuse (Reuse-S2), which pre-computes and stores the key and value projections D_proj = {D W_k, D W_v} for each of the l Interaction Blocks (Equations 11-12) to further eliminate the O(n^2 d) online linear projection cost per candidate document (Table 1).'
  evidence:
  - source_id: r794-primary-pdf
    locator: Section 3.2 (Pre-Compute and Reuse Representation), p. 4, Table 1, Equations (11)-(12)
    relation: supports
  - source_id: r794-primary-pdf
    locator: Reuse-S1 vs Reuse-S2 exact output equivalence and complexity ratio verification
    relation: supports
- claim_id: mores-ms-marco-noninferiority-and-120x-speedup
  kind: application
  statement: Initialized via BERT-weight-assisted layer splitting (where the first 12 - l BERT layers initialize the Query Representation Module and the remaining l layers initialize the Interaction Blocks with copied self-attention weights), MORES with 2x IB achieves statistical non-inferiority within a 2% margin to a full BERT ranker on MS MARCO Dev (0.3456 vs. 0.3527 MRR@10) and TREC 2019 DL (0.7026 vs. 0.7032 NDCG@10) while delivering 124x GPU and CPU speedup on 512-token documents under Reuse-S2 (Table 2 & Table 4).
  evidence:
  - source_id: r794-primary-pdf
    locator: Section 3.3 & Section 4.2-4.3, pp. 4-7, Tables 2-4
    relation: supports
- claim_id: mores-storage-footprint-and-deeper-ib-optimization-drop
  kind: limitation
  statement: Under Reuse-S2, storing 2*l projected document matrices D W_k and D W_v increases uncompressed storage to 12.0 MB per 512-token document for 2x IB (vs. 1.5 MB under Reuse-S1), and increasing the Interaction Module beyond 2 blocks (3x IB or 4x IB) degrades ranking accuracy (from 0.3456 to 0.3307 MRR@10) due to optimization difficulty of cross-attention layers lacking native cross-attentive pre-training.
  evidence:
  - source_id: r794-primary-pdf
    locator: Section 4.2 (Ranking Effectiveness) & Section 4.3 (Table 4), pp. 5-6
    relation: supports
