- target: AIO:MarkovChain
  relation: related_match
  rationale: Tempered transitions constructs a Markov kernel preserving a specified target distribution
    by an up/down path and acceptance test. This procedure is related to the AIO process/model; it is
    not asserted to be equivalent to that class or to inherit its Network parent or hidden-layer relation.
limitations:
- The maintained regular case uses positive proper densities on a common state space. More general zero-support
  or constrained-state extensions need explicit measure/support handling.
- The complete path, kernel pairing and rejected state retention are essential. A heuristic outward/return
  annealing schedule without this correction is not automatically target preserving.
- The original 1994 report was read through OCR because its text encoding is garbled; core equations and
  figures/table were checked visually. Other displays remain OCR-only, and revised 1996 journal bytes
  were not inspected.
- The AIS source is a separately inspected 1998 report. Its later normalizer estimator is kept distinct
  from the original transition identity.
- No author software, floating-point reversibility audit, model training or benchmark replication was
  performed. DRAFT remains.
