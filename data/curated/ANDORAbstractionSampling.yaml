aio_mappings:
- target: AIO:ProbabilisticGraphicalModel
  relation: related_match
  rationale: The algorithm estimates the partition function of a factorized discrete graphical model and
    uses that model’s conditional-independence structure. The pinned AIO target denotes graphical-model
    terminology and is exported as a machine-learning task. This is an algorithm-to-model/task related
    match, not equivalence or an is-a assertion.
limitations:
- This record denotes the 2020 AOAS procedure, not every algorithm that samples an AND/OR tree. The separately
  described 2018 proper variant and the later 2024 abstraction-function catalog are not asserted aliases.
- Zero proposal mass must not discard a positive contribution. All-zero states, division by zero and termination
  at the dummy root require implementation conventions. Algorithm 1’s terminal pop/top sequence is not
  certified as literal executable pseudocode; the prose specifies return of the backed-up dummy-root value.
- In a constructed three-variable model the exact partition is 2478. Approximate sibling bounds give mean
  2478 and variance 54432; exact sibling values give variance 0 in that example. These are finite checks,
  not a general proof or an available exact heuristic for hard instances.
- With inherited parent weight 2 and child weights 4 on two sibling branches, relative backup gives the
  correct unit-model partition 8; applying both absolute child weights gives 32. A different naive unrestricted
  scheme has invalid probes with probability 1/2 yet is unbiased in the constructed case. Invalidity is
  therefore not claimed to prove bias in every possible variant.
- The proceedings proof is a sketch and the inspected supplement supplies additional traces and results.
  No full general proof certification, author-code execution, confidence guarantee or benchmark replication
  is claimed. A separate partial reading of later author code informs the discovery ledger, not an asserted
  implementation identity for the 2020 paper.
