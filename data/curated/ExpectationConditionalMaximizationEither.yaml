- target: AIO:MachineLearningTask
  relation: related_match
  rationale: This is an explicit likelihood-fitting algorithm used to learn parameters from data. The
    pinned target denotes a learning process/task, so the link is algorithm-to-task relatedness, not equivalence
    or a subclass assertion. Latent-data augmentation and auxiliary parameter expansion do not identify
    the pinned transformation-based DataAugmentation term.
claims:
- claim_id: ordered-either-objective-updates
  kind: mechanism
  statement: Compute the E-step expectation at the current parameter. Carry out the selected conditional
    Q maximizations using that fixed expectation, followed by the selected conditional actual-likelihood
    maximizations at the current intermediate parameters. The Q sequence establishes likelihood ascent
    relative to its E-step anchor; the subsequent observed-likelihood steps preserve or improve that value.
    The complete ECME iteration need not increase the original Q and therefore need not be a generalized
    EM step relative to that Q.
  evidence:
  - source_id: factor-source
    locator: Introduction, p.730 / PDF p.2; Section 3, pp.733-734 / PDF pp.5-6; curator Gaussian comparison
      of Q-then-likelihood and invalid stale-Q reverse ordering
    relation: supports
- claim_id: t-model-example
  kind: mechanism
  statement: For the multivariate t normal/gamma augmentation, compute expected latent weights from the
    old parameters. Update location and scatter through Q at the old degrees of freedom, then conditionally
    maximize actual observed likelihood over positive degrees of freedom using the new location and scatter.
    In this final step, terms depending on degrees of freedom must vary with each trial value; they are
    not frozen old E-step statistics. The fully observed scatter update centers weighted residuals at
    the new mean and divides by sample count. The parameter is scatter, not the marginal t covariance.
  evidence:
  - source_id: method-source
    locator: Sections 2-6, pp.20-28 / PDF pp.2-10, especially Section 6 Equations 29-30; consistent sufficient-statistic
      expression in Equation 24
    relation: supports
- claim_id: factor-model-and-safeguards
  kind: scope
  statement: In the inspected Gaussian factor-analysis application, Q updates loadings and any free factor-covariance
    parameters, followed by actual-likelihood fitting of diagonal uniqueness variances at those updated
    values. Numerical Newton steps are acceptable only with the required likelihood increase; Newton iteration
    alone does not guarantee it. This changes the fitting procedure while retaining the same marginal
    factor model.
  evidence:
  - source_id: factor-source
    locator: Section 3, pp.733-734 / PDF pp.5-6
    relation: supports
limitations:
- Observed-likelihood ascent is not global optimality or unconditional parameter convergence. Conditional
  numerical solves require valid parameter constraints and objective safeguards; a stationary root need
  not be the intended conditional maximum.
- The scheduling statement is the final-likelihood-step construction supported by the inspected sources.
  An earlier likelihood update followed by an unrefreshed Q update can decrease the full-iteration likelihood,
  as the saved curator Gaussian example shows.
- The t examples assume ignorable missingness and correct conditional first and second moments. The source
  contains inconsistent displayed conditional-mean signs and old/new mean subscripts; the record uses
  the model-consistent moment interpretation and does not reproduce those expressions.
- The original 1994 publisher PDF returned HTTP 403. Its general rate proof is not claimed as read. Two
  complete primary follow-ups support the stated method; historical iteration/time comparisons, clinical
  examples and source software were not reproduced. No universal acceleration or compute-cost guarantee
  is asserted.
