aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: Shared learned encoders, attention-weighted communication and a learned decoder make VAIN
    a particular artificial neural architecture; the generic AIO target is broader. No equivalence to
    a named GCN, Transformer or individual attention layer is asserted.
limitations:
- Agents here are modeled objects or players with supplied features; the paper does not describe autonomous
  language-model agents. Neural-network widths, address dimension and training details are experimental
  configurations.
- The selected formal architecture uses negative distances and singleton-encoding concatenation. Informal
  positive-exponent formulas and prose referring to original features are inconsistent with those formal
  choices; no implementation audit resolves the differences.
- The normalized masking order is reported as a literal equation interpretation, with the alternative
  distinguished explicitly. The unnormalized physical variant is separately scoped.
- No author code, training, benchmark or hardware timing was executed. The constructed calculations inspect
  formula boundaries on tiny chosen inputs, and the record remains DRAFT.
