claims:
- claim_id: canita-dual-compressed-difference-estimator-with-probabilistic-anchor-mechanism
  kind: mechanism
  statement: At each communication round t, CANITA forms the extrapolated query point y^t = theta_t x^t + (1 - theta_t) w^t, each worker i transmits two compressed gradient differences Q_i^t(nabla f_i(y^t) - h_i^t) and Q_i^t(nabla f_i(w^t) - h_i^t) to form the global gradient estimator g^t = h^t + (1/n) sum_i Q_i^t(nabla f_i(y^t) - h_i^t) and shift update h_i^{t+1} = h_i^t + alpha_t Q_i^t(nabla f_i(w^t) - h_i^t), updates x^{t+1} = x^t - (eta_t/theta_t) g^t and z^t = theta_t x^{t+1} + (1 - theta_t) w^t, and resets w^{t+1} = z^t with probability p_t (or keeps w^t with probability 1 - p_t).
  evidence:
  - source_id: r560-primary-pdf
    locator: Section 4 Algorithm 1 & Equations (3)-(4) p. 5
    relation: supports
- claim_id: canita-accelerated-general-convex-communication-complexity-scope
  kind: scope
  statement: Under L-average smoothness (Assumption 1) and unbiased omega-compression (Definition 1) with theta_t = 3(1+b)/(t + 9(1+b+omega)), p_t = 1/(1+b), alpha_t = 1/(1+omega), and b = min{omega, sqrt(omega(1+omega)^2 / n)} (Theorem 2 & Corollary 1), CANITA achieves an eps-suboptimal solution f(z^T) - f(x^*) <= eps in O(sqrt((1+omega) L / eps) + omega * (L / (n * eps))^{1/3} + (omega * L / (n * eps))^{1/2}) communication rounds, achieving strictly O(sqrt(L/eps)) round complexity when n >= omega^3.
  evidence:
  - source_id: r560-primary-pdf
    locator: Section 5 Theorem 1, Theorem 2 & Corollary 1 pp. 6-7
    relation: supports
  - source_id: r560-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: canita-unbiased-compressor-and-double-message-per-round-limitation
  kind: limitation
  statement: CANITA's convergence analysis requires randomized unbiased compression operators satisfying E[Q(x)] = x and E[||Q(x) - x||^2] <= omega ||x||^2 (excluding contractive biased compressors such as Top-k without error feedback) and transmits two compressed vectors per worker per round (for y^t and w^t).
  evidence:
  - source_id: r560-primary-pdf
    locator: Section 3 Definition 1 p. 4 & Algorithm 1 Line 5 p. 5
    relation: supports
- claim_id: canita-distributed-convex-logistic-and-linear-regression-application
  kind: application
  statement: Applied to distributed regularized logistic regression and unregularized convex learning across multiple worker nodes using randomized sparsification (Rand-k) and quantization (QSGD).
  evidence:
  - source_id: r560-primary-pdf
    locator: Section 3 Examples 1-2 p. 4 & Section 6 p. 9
    relation: supports
