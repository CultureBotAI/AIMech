id: AIMech:CanitaCompressedAcceleratedGradientMethodForDistributedConvexOptimization
name: CANITA Compressed Accelerated Gradient Method for Distributed Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A compressed Nesterov-style accelerated gradient algorithm for distributed smooth convex optimization across n machines (Algorithm 1) that couples three momentum-coupled iterate sequences (x^t, y^t, z^t) with a randomized loopless control-variate reference point w^t (updated to z^t with probability p_t) and worker-side DIANA-style gradient shifts h_i^{t+1} = h_i^t + alpha_t Q_i^t(nabla f_i(w^t) - h_i^t) under randomized unbiased (omega)-compressors, achieving the accelerated O(sqrt((1 + omega) L / eps) + omega * (L / (n * eps))^{1/3} + (omega * L / (n * eps))^{1/2}) communication complexity in general smooth convex regimes without strong convexity.
identity_notes: Distinct from non-accelerated DIANA (Mishchenko et al., 2019; O((1 + omega/n) L / eps) in general convex settings), ADIANA (Li et al., ICML 2020; requires strong convexity mu > 0), and uncompressed ANITA (Li, 2021). CANITA (Li & Richtarik, NeurIPS 2021, arXiv:2107.09461) is the first distributed method with communication compression to achieve the accelerated O(sqrt(L/eps)) leading term on general smooth convex objectives.
aliases:
