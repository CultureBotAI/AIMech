limitations:
- The paper's pseudocode abbreviates heap initialization and one distance argument; the accompanying phase
  descriptions establish the intended method, not an exact certified implementation. Neighbor and input-order
  conventions can change the selected subset.
- The printed arbitrary-k dominating-set proof requires care when a dominating set has fewer than k members,
  since missing neighbors are infinite. The general k=1 metric reduction is sufficient for a general hardness
  result; this record does not extend that argument to every fixed k or Euclidean dimension.
- Subset-size bounds or sample-compression arguments are not a guarantee that every condensed classifier
  has lower true error. Two dataset scans are not a linear-runtime guarantee.
- All15 primary author-PDF pages were visually read, including the table and all figures. Exact finite
  examples and the k=1 special-case selection were executed; historical CNNDD code, timing and benchmarks
  were not reproduced.
