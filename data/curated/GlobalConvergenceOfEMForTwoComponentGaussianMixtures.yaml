claims:
- claim_id: claim-two-dimensional-subspace-invariance-and-monotone-angle-contraction
  kind: mechanism
  statement: Under the re-parameterization $\boldsymbol{a}^{\langle t\rangle} = \frac{\boldsymbol{\mu}_1^{\langle t\rangle}+\boldsymbol{\mu}_2^{\langle t\rangle}}{2} - \frac{\boldsymbol{\mu}_1^\star+\boldsymbol{\mu}_2^\star}{2}$ and $\boldsymbol{b}^{\langle t\rangle} = \frac{\boldsymbol{\mu}_2^{\langle t\rangle}-\boldsymbol{\mu}_1^{\langle t\rangle}}{2}$ (Equation 11), Lemma 7 proves that $\boldsymbol{b}^{\langle t\rangle}\in \mathrm{span}(\boldsymbol{b}^{\langle 0\rangle},\boldsymbol{\theta}^\star)$ for all $t\ge 0$, Lemma 8 proves that the angle $\beta^{\langle t\rangle}$ between $\boldsymbol{b}^{\langle t\rangle}$ and $\boldsymbol{\theta}^\star$ strictly decreases via $\cot\alpha^{\langle t\rangle} = \cot\beta^{\langle t\rangle} + \frac{R(\|\tilde{\boldsymbol{b}}^{\langle t\rangle}\|,\tilde{a}_1^{\langle t\rangle}-\theta_{\langle t\rangle,1}^\star) + R(\|\boldsymbol{b}^{\langle t\rangle}\|,\tilde{a}_1^{\langle t\rangle}+\theta_{\langle t\rangle,1}^\star)}{\tilde{\gamma}_{\langle t\rangle,2}^{\langle t+1\rangle}} > \cot\beta^{\langle t\rangle}$ (Equation 29), and Theorem 3 establishes $\sin(\beta^{\langle t+1\rangle}) \le \kappa_\beta\sin(\beta^{\langle t\rangle})$ and $\|\boldsymbol{a}^{\langle t+1\rangle}\|^2 \le \kappa_a^2\|\boldsymbol{a}^{\langle t\rangle}\|^2 + \frac{\|\boldsymbol{\theta}^\star\|^2\sin^2(\beta^{\langle t\rangle})}{4}$ with $\kappa_a,\kappa_\beta\in(0,1)$.
  evidence:
  - source_id: xhm2016-globalem-pdf
    locator: Section 2.1, Theorems 1 & 3, pp. 5-6; Appendix A.3 & A.5, Lemmas 6-11 & Equations 17-41, pp. 13-21
    relation: supports
  - source_id: xhm2016-globalem-abs
    locator: Abstract
    relation: supports
- claim_id: claim-complete-stationary-point-landscape-and-orthogonal-hyperplane-saddle
  kind: mechanism
  statement: "Lemma 1 and Corollaries 1\u20134 prove that the population log-likelihood $G(\\boldsymbol{a},\\boldsymbol{b})$ has no spurious local maxima: its only stationary points are the two symmetric global maximizers $(\\frac{\\boldsymbol{\\mu}_1^\\star+\\boldsymbol{\\mu}_2^\\star}{2}, \\pm\\frac{\\boldsymbol{\\mu}_2^\\star-\\boldsymbol{\\mu}_1^\\star}{2})$ \u2014 reached from every initialization with $\\langle\\boldsymbol{b}^{\\langle 0\\rangle},\\boldsymbol{\\theta}^\\star\\rangle \\ne 0$ (Theorems 1 & 4) \u2014 and the single degenerate point $(\\frac{\\boldsymbol{\\mu}_1^\\star+\\boldsymbol{\\mu}_2^\\star}{2}, \\frac{\\boldsymbol{\\mu}_1^\\star+\\boldsymbol{\\mu}_2^\\star}{2})$ (or $\\boldsymbol{\\theta} = \\mathbf{0}$ in Model 1), which is a strict saddle point for $d > 1$ (and local minimum for $d = 1$) whose basin of attraction is exactly the measure-zero orthogonal hyperplane $\\{\\boldsymbol{b}^{\\langle 0\\rangle}: \\langle\\boldsymbol{b}^{\\langle 0\\rangle},\\boldsymbol{\\theta}^\\star\\rangle = 0\\}$ (Theorems 2 & 5)."
  evidence:
  - source_id: xhm2016-globalem-pdf
    locator: Section 2.1 & 2.3, Theorems 2, 4, 5, Lemma 1, & Corollaries 1-4, pp. 5-8; Appendix A.6-A.8, pp. 29-40
    relation: supports
  - source_id: xhm2016-globalem-cr
    locator: DBLP bibliographic record for NeurIPS 2016 pp. 2676-2684
    relation: supports
- claim_id: claim-global-sample-based-em-consistency-via-finite-horizon-population-tracking
  kind: scope
  statement: "By coupling pointwise convergence in probability $\\hat{\\boldsymbol{\\mu}}_i^{\\langle T_0\\rangle} \\xrightarrow{p} \\boldsymbol{\\mu}_i^{\\langle T_0\\rangle}$ at a finite iteration $T_0$ where the population trajectory enters a local contraction neighborhood $\\mathcal{N}_{\\mathbf{0},\\boldsymbol{\\theta}^\\star}$ (Theorem 6) with uniform Rademacher concentration of the sample EM operator inside $\\mathcal{N}_{\\mathbf{0},\\boldsymbol{\\theta}^\\star}$ (Lemmas 20\u201323), Theorem 7 proves that sample-based EM initialized at any $\\langle\\boldsymbol{\\mu}_2^{\\langle 0\\rangle}-\\boldsymbol{\\mu}_1^{\\langle 0\\rangle},\\boldsymbol{\\theta}^\\star\\rangle \\ne 0$ satisfies $\\limsup_{t\\to\\infty}\\|\\hat{\\boldsymbol{\\mu}}_i^{\\langle t\\rangle} - \\boldsymbol{\\mu}_i^{\\langle t\\rangle}\\| = O_p(\\sqrt{d/n}) \\to 0$ as $n\\to\\infty$."
  evidence:
  - source_id: xhm2016-globalem-pdf
    locator: Section 2.2, Theorems 6 & 7, p. 7; Appendix A.9-A.10, Lemmas 20-23, pp. 40-55
    relation: supports
- claim_id: claim-limitation-two-component-equal-weight-symmetry-requirement
  kind: limitation
  statement: The absence of spurious local maxima and global convergence from arbitrary non-orthogonal initializations rely on the symmetry of two equally weighted Gaussian components with known covariance; for mixtures of $k \ge 3$ Gaussians, the population log-likelihood possesses genuine spurious local maxima that trap randomly initialized EM with constant probability.
  evidence:
  - source_id: xhm2016-globalem-pdf
    locator: Section 1.2 & Section 3 Concluding Remarks, pp. 2-3, 8-9
    relation: supports
