aio_mappings:
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: GRINCH constructs a hierarchy through insertions and reversible subtree placement. The AIO
    target denotes the task, not this algorithm or an equivalent implementation.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The construction groups observations using supplied linkage scores. Reference labels assess
    quality; learning a linkage in a separate supervised application does not make the generic grouping
    algorithm a classifier.
limitations:
- The exact recovery statement assumes model-based separation and intended exact operations. Arbitrary
  linkage scores, approximate searches and caps do not establish those conditions.
- The printed Algorithm3 does not show an update to p in its final loop; Algorithm1 also leaves certain
  ties without progress. The record describes the intended method and preserves these source limitations.
- Equation1 and Algorithm3 use different node roles for rotation. The insertion implementation ascends
  a candidate sibling before attaching the new leaf; variable names are not silently identified across
  descriptions.
- The finite tied-score example is a standalone tree state, not an established insertion history or author
  execution. It does not refute the intended theorem or quantify clustering quality.
- The pinned Scala source has explicit control-flow and restructuring differences. No full reachable counterexample
  or correctness certification of that implementation is claimed.
- The 23-page arXiv version and complete cited files were read. The separate Python implementation, NSW
  and Ent internals, other revisions, datasets and historical benchmark runs were not audited or executed.
- The record remains DRAFT. No model fitting, paid service, data upload or benchmark replication was performed.
