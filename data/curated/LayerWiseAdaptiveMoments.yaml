  relation: supports
claims:
- claim_id: raw-moments-and-bias-correction
  kind: mechanism
  statement: For the minibatch loss gradient g_t, maintain raw states m_t=beta1*m_(t-1)+(1-beta1)*g_t
    and v_t=beta2*v_(t-1)+(1-beta2)*g_t^2 from zero initial states, with coordinate-wise squares. Form
    mhat_t=m_t/(1-beta1^t), vhat_t=v_t/(1-beta2^t), and r_t=mhat_t/(sqrt(vhat_t)+epsilon), with epsilon>0.
    Raw states, not the corrected views, feed the next recurrence. The paper reuses m_t and v_t symbols
    on its correction lines; the inspected official implementation explicitly distinguishes stored states
    from corrected values.
  evidence:
  - source_id: you2020
    locator: Algorithm 2, PDF/printed p. 5; Appendix E, p. 15
    relation: supports
  - source_id: tfaddons
    locator: _prepare_local and _resource_apply_dense, raw state assignments and m_t_hat/v_t_hat
    relation: supports
- claim_id: layer-normalized-direction
  kind: mechanism
  statement: For a chosen block i, form u_t^(i)=r_t^(i)+lambda*x_t^(i) and, when norm(u_t^(i))>0, update
    x_(t+1)^(i)=x_t^(i)-eta_t*phi(norm(x_t^(i)))*u_t^(i)/norm(u_t^(i)), using L2 norms and nonnegative
    global rate eta_t. Its displacement norm is eta_t*phi(norm(x_t^(i))). The paper discusses the identity
    scaling function and a weight-norm function clipped between lower and upper thresholds. Normalization
    acts on the moment-scaled combined direction, not the raw gradient norm, a mean of per-example gradient
    norms, or the separate sum of gradient and decay norms.
  evidence:
  - source_id: you2020
    locator: Section 3 general strategy, PDF/printed p. 4; Algorithm 2 and Section 3.2, p. 5
    relation: supports
- claim_id: decay-outside-moments-inside-normalization
  kind: mechanism
  statement: The stated lambda*x_t term is added after the loss-gradient moments are formed, so it does
    not enter their first- or second-moment recurrences. It nevertheless changes the direction and norm
    used by layer adaptation. Consequently this is not generally equivalent to either adding an L2-penalty
    gradient before Adam moment estimation or taking an independently scaled AdamW shrinkage step after
    the normalized gradient update. A concrete implementation may exclude selected parameters from decay
    or layer adaptation.
  evidence:
  - source_id: you2020
    locator: Algorithm 2, PDF/printed p. 5
    relation: supports
  - source_id: tfaddons
    locator: _resource_apply_dense, _do_use_weight_decay, _do_layer_adaptation and exclusion arguments
    relation: supports
- claim_id: zero-norm-and-grouping-boundaries
  kind: limitation
  statement: 'A positive epsilon protects the coordinate-wise second-moment denominator but does not make
    the final block norm nonzero: r_t and lambda*x_t can cancel. The displayed paper update supplies no
    explicit zero-block fallback. The inspected TensorFlow Addons revision uses the identity parameter-norm
    scaling and a ratio of one when either the parameter norm or the update norm is zero, and allows regex-based
    exclusions. Its zero-weight behavior can therefore differ from directly applying identity phi to the
    ideal formula. Parameter-block grouping, norm conventions and exclusions affect the method and must
    be specified.'
  evidence:
  - source_id: you2020
    locator: Section 3 and Algorithm 2, PDF/printed pp. 4–5; Appendix F, p. 16
    relation: supports
  - source_id: tfaddons
    locator: __init__, _resource_apply_dense and _resource_apply_sparse, ratio fallback and exclusions
    relation: supports
- claim_id: bias-correction-and-sign-limit
  kind: limitation
  statement: Removing bias correction is not universally equivalent to a warm-up schedule. For the same
    raw moment states, zero decay, zero epsilon and a defined nonzero normalized direction, the common
    positive bias-correction scalar cancels in the block normalization; with decay or positive epsilon
    that equivalence need not hold. Similarly the beta1=beta2=0 sign-gradient relation requires an ideal
    zero-epsilon, zero-decay limit and appropriate treatment of zero coordinates. At positive epsilon
    the coordinate ratio is g/(abs(g)+epsilon), not an exact sign. These qualifications concern algebraic
    limits, not a recommendation to remove numerical safeguards.
  evidence:
  - source_id: you2020
    locator: Algorithm 2 and sign-SGD discussion, PDF/printed p. 5; Appendix E and Figure 2, pp. 15–16;
      algebraic consequences with the stated conditions
    relation: supports
- claim_id: convergence-scope
  kind: limitation
  statement: The primary theory assumes smoothness and bounded stochastic-gradient noise, and studies
    a uniformly selected iterate under specified rates and batch scaling. The stated LAMB theorem focuses
    on beta1=0 and lambda=0, uses a positive bounded scaling function and equal block dimensions, and
    gives different stationarity bounds for zero versus positive beta2. These conditions do not automatically
    cover every momentum, decay, scaling-function, numerical-offset or implementation configuration. The
    comparison with SGD also uses different stationarity quantities; it is not a uniform guarantee that
    LAMB converges faster or generalizes better.
  evidence:
  - source_id: you2020
    locator: Preliminaries and Theorem 1, PDF/printed p. 3; Theorem 3 and discussion, p. 5; Appendix B
      proof, pp. 12–14; comparison context, Appendix C, p. 14
    relation: supports
- claim_id: applications-variants-and-evidence
  kind: scope
  statement: The paper studies neural-network optimization including BERT pretraining and image classification,
    with selected schedules, hardware, batch sizes and downstream evaluation. Its title training time
    depends on that experimental configuration and does not define the algorithm or establish universal
    speedup. Nesterov first-moment and two-moment variants, norm substitutions, bias-correction ablations
    and later library implementations require explicit version choices. This record describes the basic
    algorithm and a pinned implementation boundary without importing a numerical benchmark or claiming
    training reproduction.
  evidence:
  - source_id: you2020
    locator: Experiments, PDF/printed pp. 6–8; N-LAMB/NN-LAMB Algorithms 3–4 and Appendices D–F, pp. 14–16;
      implementation and evaluation discussion, pp. 17–20
    relation: supports
