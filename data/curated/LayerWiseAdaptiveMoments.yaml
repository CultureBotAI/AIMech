id: AIMech:LayerWiseAdaptiveMoments
name: Layer-wise adaptive moments
aliases:
- LAMB
concept_kind: algorithm
definition: A gradient optimizer that combines coordinate-wise Adam moment scaling with layer-wise normalization
  of the resulting update direction, optionally including weight decay, and scales each block by a function
  of its parameter norm and a global learning rate.
identity_notes: 'Compared all 442 pinned AIO and 565 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 55, 13, 16 lines. Canonical data hits were read:
  existing LARS/CLARS context or the author Alex Lamb in augmentation sources; original ignored dependencies
  contain unrelated ontology prefixes and an author name. Historical report and rendered-mirror paths
  were classified with bounded excerpts, not reread in full. A semantic search covered ten AIO rows and
  88 native definitions: the preceding ten AIO and 87 native rows were verified unchanged, and the new
  CLARS definition was read. Three complete AIO node/edge/generated contexts were verified unchanged;
  six full native context records were read or verified against prior full readings. LAMB normalizes a
  coordinate-wise moment-scaled direction within blocks; LARS, CLARS, ordinary SGD, Adam and RMSprop have
  different update rules. The separately named NovoGrad paper shares layer-wise adaptive moments terminology
  but its primary abstract identifies a distinct pending method, not an alias.'
