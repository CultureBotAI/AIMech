    so this contextual mapping does not assert algorithm equivalence, subclass membership or that LAMB
    is preprocessing.
limitations:
- The record uses separate raw and bias-corrected moment symbols, corroborated by the pinned implementation;
  the primary pseudocode reuses moment symbols on correction lines. Bias-correction ablations are explicitly
  conditional.
- Block normalization can remain undefined despite positive coordinate-wise epsilon. The inspected implementation
  supplies a ratio-one zero-norm policy and exclusions that are implementation choices, not a universal
  paper rule.
- Weight decay is outside the gradient moments but inside the normalized direction. It is not interchangeable
  with arbitrary L2 regularization or an independent unadapted shrinkage step.
- The stated convergence theorem has restricted momentum, decay, batch, scaling-function and block assumptions.
  An update-norm identity is not a universal convergence, stability or generalization theorem.
- The January 3, 2020 preprint and the April 15, 2024 archived TensorFlow Addons revision are distinct
  source versions. The latter was inspected statically, not treated as the exact historical training implementation;
  helper dependencies and runtime behavior were not audited.
- Rendered PDF pages 1–23 of 37 were inspected, including the full method, theorem proofs, variants and
  selected experimental material. Remaining baseline tuning tables on pp. 24–37 were not read. No numerical
  benchmark, independent proof certification, source-code execution or model training is claimed.
