- claim_id: learning-method
  kind: mechanism
  statement: For value estimate V, residuals r_t + gamma V(s_{t+1}) - V(s_t) are summed forward with weights
    (gamma lambda)^l; lambda controls the mixture of multi-step advantage estimates.
