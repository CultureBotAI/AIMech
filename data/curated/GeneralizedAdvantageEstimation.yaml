name: Generalized advantage estimation
aliases:
- GAE
definition: An advantage-function estimator for policy-gradient learning formed from an exponentially
  weighted sum of temporal-difference residuals.
concept_kind: mathematical_method
identity_notes: GAE estimates advantages used in a policy-gradient update; it is not itself a complete
  policy optimizer and is distinct from estimating the value function with TD(lambda).
limitations:
- Bias and variance depend on discounting, lambda and value-function accuracy; no unconditional unbiasedness
  or variance-reduction claim is made.
- The source's combined control system also uses trust-region optimization, which is a separate concept.
