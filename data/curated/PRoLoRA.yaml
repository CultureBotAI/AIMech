claims:
- claim_id: prolora-chunk-broadcast-rank-roll-and-unshared-rank-decomposition
  kind: mechanism
  statement: While pure hidden-dimension chunk broadcasting (CLoRA) replicates identical blocks in B A and rank-axis circular rotation A_i = Roll(A_0, i*s_A), B_j = Roll(B_0, j*s_B) (RoLoRA) still leaves blocks with equal relative displacement (j - i) identical when s_A = s_B, reserving u unshared ranks in PRoLoRA breaks block-wise symmetry while reducing trainable parameters from r(h+o) to u(h+o) + h(r-u)/m + o(r-u)/n.
  evidence:
  - source_id: r674-primary-pdf
    locator: Section 3.1 (Equations 2-4, Figure 1), pp. 3-5
    relation: supports
- claim_id: prolora-rectified-kaiming-uniform-initialization-bounds
  kind: mechanism
  statement: Because standard Kaiming uniform initialization on a shared chunk A_0 of width h/m would inflate sampling bounds by sqrt(m) relative to the unshared matrix A_u of width h, PRoLoRA rectifies A_0's initialization to U(-g sqrt(3/h), g sqrt(3/h)) using the full layer input dimension h while initializing B to zero.
  evidence:
  - source_id: r674-primary-pdf
    locator: Section 3.1 (Rectified Initialization Strategy, Equation 5) & Section 4.4 (Table 2), pp. 5, 7-8
    relation: supports
- claim_id: prolora-application-llama2-instruction-tuning-and-multi-lora-serving
  kind: application
  statement: Across MMLU, BBH, GSM8K, TyDi QA, and HumanEval on LLaMA2-7B and LLaMA2-13B, PRoLoRA outperforms rank-16 LoRA (37.53 vs. 36.97 average) using half the trainable parameters (19.99M vs. 40.98M), doubling concurrent multi-LoRA serving capacity in a fixed 20GB GPU memory budget from ~512 to ~1024 adapters without weight-shape restrictions.
  evidence:
  - source_id: r674-primary-pdf
    locator: Section 4.2-4.3 (Tables 2-3), pp. 6-7
    relation: supports
- claim_id: prolora-limitation-temporary-chunk-expansion-and-shared-learning-rate-shift
  kind: limitation
  statement: Increasing the chunk sharing ratios m and n shifts the optimal learning rate upward relative to unshared parameters, and naive forward execution without custom fused kernels temporarily materializes the expanded roll-broadcasted chunk copies in memory during each layer's computation.
  evidence:
  - source_id: r674-primary-pdf
    locator: Section 4.4 (Figure 2, p. 8) & Section 6 (Limitation, p. 9)
    relation: supports
