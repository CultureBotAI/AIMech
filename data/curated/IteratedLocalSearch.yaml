name: Iterated local search
definition: A metaheuristic that builds a single search trajectory among solutions returned by an embedded
  optimizer by perturbing the current accepted solution, rerunning that optimizer, and applying an acceptance
  criterion to the resulting candidate.
concept_kind: algorithm
identity_notes: 'The ILS framework includes the common local-minimum formulation but permits a more general,
  possibly stochastic or history-dependent embedded optimizer. Historical names such as iterated Lin–Kernighan
  and large-step Markov chains denote particular developments, not exact aliases of every ILS configuration.
  Single-chain search distinguishes the framework from population selection and distribution refitting;
  optional restarts and hybrids require their own declared choices. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 301 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 37 and 37 lines
  respectively. All 13 unique hit contents were inspected: prior local-search candidate leads, Ant System’s
  feasibility-list distinction, and their saved reports/reviews. These were references to methods rather
  than existing candidate records. Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and seven native neighboring mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- Perturbations that are too weak can return repeatedly to the same optimizer output; independent large
  perturbations remove the current solution’s influence from proposed starts and approach random-restart
  behavior. The full behavior still depends on the acceptance rule and the embedded optimizer.
- A deterministic memoryless embedded routine supports the simplified basin-of-attraction picture. General
  stochastic or history-dependent routines need not define the same fixed partition; history-free transition
  descriptions cannot be assumed for every ILS variant.
- Transitions between optimized solutions need not be reversible, and deterministic perturbations can
  produce short cycles. The framework alone is neither a target-invariant MCMC sampler nor a global-optimality
  or cycle-freedom guarantee.
- Initialization, perturbation, local-search termination, acceptance, best-so-far bookkeeping and restart
  conventions must be declared for an executable instance. The source reports sensitivity to module interactions,
  including settings worse than random restart; no universal performance ranking or empirical result is
  curated.
