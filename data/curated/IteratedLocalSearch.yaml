claims:
- claim_id: method
  kind: mechanism
  statement: 'Generate an initial solution and apply the embedded LocalSearch routine to obtain a current
    optimized solution. Repeat: perturb that current solution, apply LocalSearch to the perturbed intermediate
    point, then use an acceptance criterion comparing the current and candidate optimized solutions, potentially
    with search history, to choose the next current solution. Repeat until the declared termination condition.
    In the simplified deterministic memoryless setting, LocalSearch maps candidates into a reduced set
    of local optima, and perturbation followed by local search induces transitions among them. The general
    framework need not explicitly enumerate neighborhoods in that reduced space. Accepted variants include
    retaining only strict improvements, always accepting the newly optimized candidate, or temperature-dependent
    acceptance; improvement-only selection is not a universal requirement. Perturbation and acceptance
    may use history, and the embedded procedure can itself be stochastic or use memory.'
