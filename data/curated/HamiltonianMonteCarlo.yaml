name: Hamiltonian Monte Carlo
definition: A Markov chain Monte Carlo algorithm for differentiable continuous targets that augments positions
  with momenta, proposes a state through reversible volume-preserving numerical Hamiltonian dynamics,
  and applies a Metropolis correction for the Hamiltonian change.
concept_kind: algorithm
identity_notes: The record describes conventional Euclidean HMC with Gaussian momenta, leapfrog integration
  and an end-of-trajectory Metropolis test. The source’s unit-mass baseline is explicit; fixed positive-definite
  mass matrices are documented in the author technical chapter. HMC is not deterministic optimization,
  an uncorrected molecular-dynamics simulation, or NUTS’s adaptive tree-selection kernel. The original
  1987 publication’s metadata was verified, but its full text was inaccessible in this session. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 153 prior native IDs/names/aliases.
  Both checkout text searches included ignored and hidden files and returned no matches for the selected
  exact IDs, full labels, aliases and source titles. Existing HMM and Markov random field records describe
  probability models, not these sampling or tuning procedures.
limitations:
- The baseline needs evaluable log density and gradients on continuous coordinates. Discrete variables
  or constraints require additional handling; the stated algorithm does not directly solve those representation
  problems.
- Step size, trajectory length and coordinate scaling materially affect behavior. Too-large steps can
  cause integration failure or rejection, and too-short or resonant trajectories can explore poorly.
- Target invariance is not universal ergodicity or finite-sample convergence. Neal explicitly gives periodic
  trajectories that can cause nonergodicity.
- The correction does not remove Monte Carlo error or make floating-point dynamics exactly reversible
  in every implementation. Rejected positions remain part of the chain.
- No universal dimension-scaling law, tuned parameter value, benchmark superiority or current library
  default is asserted.
