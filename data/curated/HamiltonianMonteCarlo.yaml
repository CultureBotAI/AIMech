claims:
- claim_id: method
  kind: mechanism
  statement: 'For target pi(theta), use potential U=−log pi up to a constant and Gaussian momentum r with
    kinetic energy K=r·r/2 in the unit-mass baseline. Refresh r independently at each iteration. Apply
    L leapfrog steps: half a momentum update using the log-density gradient, a full position update, and
    the remaining half momentum update. Form the reversible proposal with momentum reversal and accept
    with min(1,exp(H_start−H_proposed)); on rejection retain the current position. The integrator preserves
    volume and reversibility mathematically, while the Metropolis correction accounts for numerical integration
    error in the invariant target. The final momentum sign can be omitted when only positions are retained
    and momenta are fully refreshed before reuse.'
  evidence:
  - source_id: method-source
    locator: Section 2 and Algorithm 1, printed pp. 1594–1596 / PDF pp. 2–4
    relation: supports
