id: AIMech:GenericTreeSampling
name: Generic tree sampling
aliases:
- Chen generic sampling
- Generic importance-weighted tree sampling
concept_kind: algorithm
definition: An importance-sampling generalization of Chen heuristic tree sampling that merges representatives
  of ordered tree strata using specified positive selection probabilities and inverse-probability survivor
  weights to estimate an additive tree functional.
identity_notes: 'Compared all 442 pinned AIO and 646 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 39, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 85 AIO and 382 native definitions, with every matched definition
  read. 12 full annotated AIO node/edge/generated contexts and 5 full native records were inspected. Retain
  Chen’s explicitly named generic sampling algorithm GS: it generalizes the maintained HS method by allowing
  arbitrary supported collision probabilities and changing the surviving weight by the corresponding inverse
  probability. The HS record specifies weight-proportional replacement and a summed survivor weight. GS
  is a broader algorithm family, not an alternative name for that particular rule. Knuth’s estimator follows
  one path; Purdom samples successor subsets; Gumbel top-k sampling and TreeSHAP have different sampling
  laws or targets. Bare generic sampling and GS are not aliases because the terms have unrelated uses.'
definition_evidence:
- source_id: chen1992hs
  locator: Section 3.2, PDF p.4 / printed p.298; Section 4.3, PDF pp.5–6 / printed pp.299–300
  relation: supports
claims:
- claim_id: inverse-probability-collision
  kind: mechanism
  statement: Start with root weight one, process parent strata before their descendants and let a newly
    generated child inherit its parent’s weight. When an incoming child of weight w collides with an existing
    representative of weight W, choose the child with a specified conditional probability p strictly between
    zero and one. Its surviving weight is w/p; if the existing representative survives, its weight is
    W/(1-p). Sum each expanded representative’s weight times its node-functional value.
  evidence:
  - source_id: chen1992hs
    locator: Sections 2–3.2, PDF pp.2–4 / printed pp.296–298; Algorithm HS and its GS replacement clause
    relation: supports
- claim_id: finite-tree-expectation
  kind: scope
  statement: For a finite fixed tree, finite node-functional values, valid stratum order and supported
    random choices with the stated weight corrections, the estimator preserves the additive total in expectation.
    The conditional expectation argument applies to each collision; it does not require p to equal the
    weight-proportional HS choice. This counts tree-path occurrences and does not establish a distinct-vertex
    estimator for a graph.
  evidence:
  - source_id: chen1992hs
    locator: Sections 2 and 4.1–4.3, PDF pp.2,4–6 / printed pp.296,298–300; Theorem 4, Equations 14–17
    relation: supports
- claim_id: hs-and-path-specializations
  kind: scope
  statement: Choosing p=w/(W+w) makes either survivor’s weight W+w and recovers the HS collision rule.
    With strata determined only by depth, the sampled tree has one path, connecting the construction to
    simple backtracking-tree sampling. GS also permits choices with a different distribution of weights
    and estimates.
  evidence:
  - source_id: chen1992hs
    locator: Sections 3.2–4.3, PDF pp.4–6 / printed pp.298–300; Theorem 1, Corollaries 2–3
    relation: supports
- claim_id: oracle-and-variance-conditions
  kind: limitation
  statement: For nonnegative subtree totals, the source’s zero-variance choice is proportional to the
    true incoming and existing weighted subtree totals. Those unknown totals are generally unavailable.
    Zero totals require separate support and division conventions; signed totals do not justify using
    this nonnegative formula unchanged. The later average-variance argument adds assumptions about the
    distribution of subtrees within strata.
  evidence:
  - source_id: chen1992hs
    locator: Section 3.2 and Section 4.4, PDF pp.4,6–7 / printed pp.298,300–301; Equation 18 and Theorem
      5
    relation: supports
- claim_id: ordering-and-cost-scope
  kind: limitation
  statement: A valid ordering is required even though the tree total is estimated without enumerating
    it. The source states order invariance for HS; that result does not establish order invariance for
    arbitrary GS proposals. At most one representative is expanded per stratum, while generating children,
    computing strata and evaluating proposals still cost work. Unbiasedness alone provides no finite-probe
    accuracy or runtime guarantee.
  evidence:
  - source_id: chen1992hs
    locator: Sections 3–4.4, PDF pp.2–7 / printed pp.296–301; Corollary 2 and Theorem 4
    relation: supports
