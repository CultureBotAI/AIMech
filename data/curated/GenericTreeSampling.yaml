  search_scope: 'Compared all 442 pinned AIO and 646 native IDs, names, aliases and scoped synonyms; no
    normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
    discovery and original Documents checkouts returned 39, 0, 0 lines. All distinct match contents were
    inspected. Semantic matching covered 85 AIO and 382 native definitions, with every matched definition
    read. 12 full annotated AIO node/edge/generated contexts and 5 full native records were inspected.
    Retain Chen’s explicitly named generic sampling algorithm GS: it generalizes the maintained HS method
    by allowing arbitrary supported collision probabilities and changing the surviving weight by the corresponding
    inverse probability. The HS record specifies weight-proportional replacement and a summed survivor
    weight. GS is a broader algorithm family, not an alternative name for that particular rule. Knuth’s
    estimator follows one path; Purdom samples successor subsets; Gumbel top-k sampling and TreeSHAP have
    different sampling laws or targets. Bare generic sampling and GS are not aliases because the terms
    have unrelated uses.'
  rationale: No suitable AIO counterpart was established for this conditional importance-weighted tree-functional
    estimator. Classification models, learning tasks, language architectures, bias phenomena and graphical-model
    terminology do not identify the algorithm merely because they share tree or sampling language. This
    assessment is bounded to the inspected pin.
  examined_targets:
  - target: AIO:DecisionTree
    rejection_reason: The pinned class denotes a classification model; an implicit search tree and its
      count estimator are not a trained decision-tree classifier.
  - target: AIO:MarkovChain
    rejection_reason: Random representative replacement alone does not identify the pinned network/process
      class or a substantive conditional type-transition model. Treating the entire algorithmic state
      as Markov would be an uninformative forced mapping.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: The record is a sampling algorithm with an expectation claim, not the computational
      bias phenomenon defined by this class.
  - target: AIO:MathematicalFunction
    rejection_reason: The additive tree functional is an input; the maintained identity is the randomized
      estimation procedure.
  - target: AIO:MachineLearningTask
    rejection_reason: The algorithm samples an existing implicit tree and need not learn a model or perform
      a machine-learning task.
  - target: AIO:RegressionAnalysis
    rejection_reason: No response-surface regression is required for the weighted tree estimate.
  - target: AIO:ReinforcementLearning
    rejection_reason: Sampling tree nodes to estimate a sum does not learn a reward-maximizing policy
      or define exploration–exploitation control.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The search tree is not asserted to factor a joint distribution of random variables;
      no graphical-model learning task is required.
  - target: AIO:BayesianNetwork
    rejection_reason: An implicit rooted search tree is not by itself a Bayesian-network factorization
      or a sampler from its joint law.
  - target: AIO:GraphLanguageModel
    rejection_reason: No graph-based language model is required.
  - target: AIO:ReasoningLLM
    rejection_reason: The procedure is not a language-model reasoning architecture.
  - target: AIO:RecursiveLanguageModel
    rejection_reason: Tree-structured neural language composition is distinct from randomized additive
      tree-functional estimation.
limitations:
- The native name is disambiguated by tree and the Chen alias. Bare GS and generic sampling are not asserted
  aliases; a generalization relationship does not make all GS instances identical to the fixed HS rule.
- For old weight1/value1 and incoming weight3/value5, corrected p=1/2 replacement has mean16 and variance196;
  HS has mean16 and variance48. Retaining the total weight4 with uncorrected uniform choice instead has
  mean12. Better or worse proposal variance does not change the required weight correction.
- A constructed tree with incomparable parent strata A and B sends leaf values2,5 from A and11 from B
  into a common later stratum. Constant incoming p=1/2 gives mean18 under either valid parent order but
  variance34 for A then B and226 for B then A. Thus the HS-specific order-invariance result cannot be
  transferred to arbitrary GS choices.
- Strict support excludes p=0 or1 in a collision with potentially contributing alternatives. A proposal
  based on exact positive subtree totals is an oracle illustration; no inexpensive perfect heuristic,
  general confidence bound or infinite-tree result is asserted.
- 'All21 pages of the cited journal copy were visually read. The definition and expectation claims use
  Sections2–4.4, not a certification of every later variance proof: the previously identified printed
  Appendix Equation99 inequality remains qualified. Dissertation, author software and empirical replication
  were not inspected or executed.'
