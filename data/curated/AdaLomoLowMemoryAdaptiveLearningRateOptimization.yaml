claims:
- claim_id: adalomo-fused-backward-nmf-second-moment-mechanism
  kind: mechanism
  statement: During the backward pass, as soon as the gradient g_{t,i} of parameter tensor theta_{t-1,i} in R^{m x n} is computed, AdaLomo updates row and column second-moment vectors r_{t,i} = beta * r_{t-1,i} + (1 - beta) * g_{t,i}^2 * 1_n in R^{m x 1} and c_{t,i} = beta * c_{t-1,i} + (1 - beta) * 1_m^T * g_{t,i}^2 in R^{1 x n}, reconstructs the non-negative matrix factorization second-moment estimate v_{t,i} = (r_{t,i} * c_{t,i}) / (1_m^T * r_{t,i}), updates theta_{t,i} immediately, and discards g_{t,i-1}, reducing optimizer-state storage to m + n values per matrix and gradient storage to at most two consecutive parameter tensors.
  evidence:
  - source_id: r635-primary-pdf
    locator: Section 2.1, Section 2.2 Equations (5)-(7), and Section 3.1 Algorithm 1 lines 5-13, pages 2-4
    relation: supports
- claim_id: adalomo-grouped-update-normalization-mechanism
  kind: mechanism
  statement: To avoid the two backward passes required by global gradient norm clipping in fused-backward training, AdaLomo applies grouped update normalization independently to each parameter tensor's raw adaptive update u_{t,i} within a single backward pass via u_hat_{t,i} = (u_{t,i} / max(1, RMS(u_{t,i}))) * max(epsilon, RMS(theta_{t-1,i})), where RMS(u) = sqrt((1/n) * sum_{k=1}^n u_k^2), scaling the step size proportionally to the parameter tensor's root-mean-square magnitude.
  evidence:
  - source_id: r635-primary-pdf
    locator: Section 3.1 Algorithm 1 line 11 and Section 3.2 Grouped Update Normalization, pages 4-5
    relation: supports
- claim_id: adalomo-second-moment-saddle-and-lipschitz-scope
  kind: scope
  statement: Ablation analysis isolating Adam's first-order momentum (Equation 3) versus second-order variance scaling (Equation 4) demonstrates that second-order moment estimation is the primary factor enabling escape from suboptimal local minima and compensating for unbounded layer-wise Lipschitz variations in Transformer self-attention.
  evidence:
  - source_id: r635-primary-pdf
    locator: Section 2.2 Theoretical and Empirical Analysis, Equations (3)-(4), Figure 1, and Appendix A Figure 6, pages 3-4, 13
    relation: supports
- claim_id: adalomo-llm-instruction-tuning-and-pretraining-application
  kind: application
  statement: Applied to instruction-tuning LLaMA-7B/13B/30B/65B on Alpaca-GPT4 (evaluated on MMLU, BBH, GSM8K, HumanEval, and AlpacaFarm), domain continual pre-training on Chinese and Python corpora, and from-scratch pre-training of a 1.1B LLaMA model on C4, AdaLomo matches AdamW convergence and benchmark accuracy while reducing total memory footprint to the level of LoRA (~40% of Adafactor's memory).
  evidence:
  - source_id: r635-primary-pdf
    locator: Section 1 Table 1, Section 4.1-4.4 Table 2, Figures 2-5, and Appendix F Table 8, pages 2, 5-9, 17
    relation: supports
- claim_id: adalomo-activation-memory-and-early-warmup-limitation
  kind: limitation
  statement: Because AdaLomo reduces only gradient and optimizer-state memory and omits first-order momentum, its overall memory savings are limited in regimes dominated by activation memory, and it can exhibit minor early-warmup loss fluctuations on smaller models as well as a modest throughput reduction relative to non-adaptive LOMO.
  evidence:
  - source_id: r635-primary-pdf
    locator: Section 4.2 page 7, Section 4.4 page 8, and Limitations Section, page 9
    relation: supports
