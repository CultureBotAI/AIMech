id: AIMech:AdaLomoLowMemoryAdaptiveLearningRateOptimization
name: AdaLomo (Low-Memory Optimization with Adaptive Learning Rate)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient full-parameter adaptive optimization algorithm for large language models that fuses gradient backpropagation with in-place parameter updates to maintain O(1) gradient memory while providing per-parameter adaptive learning rates via rank-1 non-negative matrix factorization of the second-order gradient moment and single-pass parameter-wise root-mean-square grouped update normalization.
identity_notes: Distinct from LOMO (AIMech:LomoFusedBackwardLowMemoryOptimization), which applies naive non-adaptive stochastic gradient descent during the fused backward pass and requires two backward passes whenever global gradient normalization is used; AdaLomo incorporates per-parameter second-moment scaling via row/column moving-average factors (r_{t,i}, c_{t,i}) and normalizes each tensor's update in a single fused backward pass via grouped update normalization. Distinct from Adafactor (AIMech:AdafactorSublinearMemoryAdaptiveOptimization), which materializes full-model gradients before the optimizer step and therefore consumes roughly 2.5x the memory of AdaLomo.
aliases:
- AdaLomo
- AdaLomo Optimizer
- Low-Memory Optimization with Adaptive Learning Rate
- Fused-Backward Factored Second-Moment Adaptive Optimizer
