claims:
- claim_id: path-level-variant
  kind: mechanism
  statement: In model 1 each document draws a root-to-supertopic vector and a subtopic vector for each
    supertopic. Each token chooses a supertopic and subtopic, then a level from a corpus-shared distribution
    specific to that path. It emits from the shared root, supertopic or subtopic word vector according
    to the selected level. Even root-emitted tokens have a latent complete path and contribute routing
    counts. With fixed priors, collapsed assignment weights combine document routing, corpus path-level
    and actual emitting-node word counts. Word counts must pool all paths that use the same emission vector.
  evidence:
  - source_id: method-source
    locator: Section 2.4, PDF p.3, Figure 1, model 1 and Equation 1; Figure 2 p.4
    relation: supports
- claim_id: local-exit-variant
  kind: mechanism
  statement: 'Model 2 adds an exit coordinate to each document-local routing vector. A root exit emits
    from the root; otherwise a supertopic is selected and either exits to its word distribution or routes
    to a subtopic. The path stops at the emitting node, so unused lower routing choices are not sampled.
    There is no model 1 path-specific level vector. The variants have different cross-document sharing:
    in a one-path example a shared Beta(1,2) root-level probability gives joint root emission probability
    1/6 across two documents, whereas independent document-local Beta(1,2) exits give 1/9 despite the
    same marginal probability.'
  evidence:
  - source_id: method-source
    locator: Section 2.4, PDF p.3, model 2 and comparison; Figure 2 p.4
    relation: supports
- claim_id: collapsed-fitting
  kind: mechanism
  statement: The paper describes Gibbs sampling with a factorization that first marginalizes paths to
    sample an emitting node, then samples a compatible path conditional on that node. This preserves the
    conditional when those probabilities are computed exactly. Document routing hyperparameters are periodically
    fitted from sampled counts by a Gibbs-EM procedure using fixed-point Dirichlet estimation. Such adaptation
    is distinct from a chain targeting one fixed-hyperparameter posterior throughout training.
  evidence:
  - source_id: method-source
    locator: Section 2.4, PDF pp.3-4, sampling factorization and parameter fitting
    relation: supports
