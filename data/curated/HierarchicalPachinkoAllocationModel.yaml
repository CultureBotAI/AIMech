name: Hierarchical pachinko allocation model
definition: A pachinko topic-model family that associates word-emission distributions with internal topic
  nodes as well as terminal topics, allowing document tokens to use multiple paths and emit from different
  levels of a topic DAG.
concept_kind: model_family
identity_notes: Scoped to Mimno, Li and McCallum's ICML2007 hierarchical PAM family and its two explicit
  variants. Internal vocabulary emissions distinguish it from the demonstrated four-level PAM with word
  emissions only at subtopics. Token-specific DAG paths and shared subtopics distinguish it from hierarchical
  LDA's single document path in a tree. The path-level and local-exit variants remain one source-defined
  family with explicit differences, not asserted interchangeable parameterizations. This paper uses fixed
  topic counts; nonparametric PAM is a separate construction. No normalized candidate identity matched
  all 442 pinned AIO IDs, labels and scoped synonyms or 435 preceding native IDs, names and aliases. Full-checkout
  searches included ignored and hidden files in both checkouts; two matching lines per checkout came from
  one unique prior discovery-ledger content with a source URL and pending extension cohort. All matching
  excerpts were read. All 205 semantic label/synonym hits and 18 annotated AIO nodes with outgoing edges
  were byte-verified unchanged from prior readings. Twenty-six contextual YAMLs comprise 24 unchanged
  prior readings and two fully read final round104 native targets verified against saved review inputs.
  No candidate record is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- Experiments use fixed three-level topic structures and finite topic counts. Probabilistic routing hierarchies
  are not automatically ontological subsumption or causal graphs. Private/public children, separate Beta
  exits and other proposed DAG variations are sketches outside the two evaluated constructions.
- Collapsed counts exclude the current token and respect shared emitting nodes. A literal independent
  word distribution per path/level triple would change the model. Finite calculations verify both variants'
  conditionals on synthetic examples, not historical software or chain convergence.
- Selected Medline and newsgroup studies use particular hyperparameters, finite topic grids and simulated-document
  likelihood estimates with plug-in shared parameters. Topic/journal mutual information is not direct
  taxonomy recovery or document classification accuracy. Some numeric prose and table summaries disagree;
  no disputed summary is adopted.
- Reported speed and performance comparisons depend on author implementations and chosen datasets. No
  author software, benchmark, universal superiority or exact marginal evidence is certified.
