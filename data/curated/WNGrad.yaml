id: AIMech:WNGrad
name: WNGrad
concept_kind: algorithm
review_status: DRAFT
definition: A weight-normalization-inspired adaptive step-size gradient descent algorithm that maintains an inverse learning-rate scalar b_k > 0 (globally or per neuron) updated via the square-root-free nonlinear recurrence b_{k+1} = b_k + (lambda^2 ||g_k||_2^2) / b_k and updates parameters via x_{k+1} = x_k - (lambda / b_k) g_k, automatically stabilizing at a constant multiple of the unknown Lipschitz smoothness constant L in deterministic batch optimization while growing as O(sqrt(k)) to achieve O(1/sqrt(k)) convergence in stochastic convex optimization.
identity_notes: Motivated by the Pythagorean norm growth ||v_{k+1}||_2^2 = ||v_k||_2^2 + (eta^2 / ||v_k||_2^2) ||P_{v_k^perp} nabla f||_2^2 of Weight Normalization on the unit sphere (Equation 4), WNGrad satisfies b_{k+1}^2 = b_k^2 + 2 ||g_k||_2^2 + ||g_k||_2^4 / b_k^2, avoiding square-root operations while remaining invariant to rescaling f -> lambda f when b_1 = C ||nabla f(x_1)||_2 (Remark 2.2). Also includes momentum extensions WNGrad-Momentum and WN-Adam (Algorithm 4).
aliases:
- Weight-Normalization Inspired Adaptive Learning Rate Gradient Descent
- Square-Root-Free Reciprocal Step-Size Update Optimization
- WN-Adam Weight-Normalized Adaptive Momentum
