id: AIMech:RMSprop
name: RMSprop
definition: An adaptive gradient optimization method that normalizes coordinate updates using an exponentially
  weighted estimate of squared gradients.
concept_kind: algorithm
identity_notes: RMSprop decays older squared-gradient information, unlike cumulative Adagrad. Centered
  and momentum settings are variants within this scoped record.
