claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any pure-topic/admixture document model with word-topic matrix A and topic prior moment matrix R = E[W W^T], Appendix D.1 proves that the single-document empirical estimator (tilde{H}_d tilde{H}_d^T - hat{H}_d) with scaling n_d(n_d - 1) is an exact unbiased estimator of A R A^T, and under p-separability every row Q_bar_i of the row-normalized co-occurrence matrix Q_bar is a convex combination sum_{k=1}^K C_{i,k} Q_bar_{s_k} of the K anchor rows with weights equal to the posterior topic probabilities C_{i,k} = P(z_1 = k | w_1 = i), allowing A_{i,k} to be recovered directly via Bayes' rule A_{i,k} propto C_{i,k} P(w = i) without inverting Q_bar_S.
  evidence:
  - source_id: r322-primary-pdf
    locator: Section 2.1, p. 2; Section 3.1, Algorithms 2-3, pp. 3-5; Appendix D.1, Claim D.1, p. 18
    relation: supports
  - source_id: r322-metadata-cr
    locator: Bibliographic metadata for ICML 2013 PMLR 28(2):280-288
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: FastAnchorWords (Algorithm 4) greedily selects the furthest row from the affine span of already selected anchors followed by a cleanup pass, and Theorem 4.2 (proved via simplex-volume determinant ratios in Lemma A.3 and Claim A.4) guarantees that whenever the perturbation error satisfies epsilon < gamma^2 p / (20^2 K^2) (where gamma is the minimum L1 topic-row distance of R_bar), FastAnchorWords identifies K near-anchor words within distance O(epsilon / gamma), while RecoverL2 (Theorem 3.1 and Appendix C) achieves polynomial sample complexity M = O(K^6 / (epsilon^2 p^6 gamma^4)).
  evidence:
  - source_id: r322-primary-pdf
    locator: Section 3.1, Theorem 3.1, p. 5; Section 4.1, Algorithm 4 and Theorem 4.2, pp. 5-6; Appendix A, Lemma A.3 and Claim A.4, pp. 11-15
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: The method requires each topic k to possess at least one anchor word with exclusivity A_{s_k,k} >= p > 0 and A_{s_k,k'} = 0 for k' != k; moreover, very rare anchor words (small p) have noisy row-normalized co-occurrence profiles Q_bar_i because dividing by a small marginal count (Q 1)_i amplifies multinomial sampling variance.
  evidence:
  - source_id: r322-primary-pdf
    locator: Section 2, Definition of p-separability, p. 2; Section 3.1, Discussion of rare words and row normalization, pp. 3-4
    relation: supports
