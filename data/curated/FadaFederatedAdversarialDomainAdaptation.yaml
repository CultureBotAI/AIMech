claims:
- claim_id: fada-weighted-federated-domain-adaptation-generalization-bound
  kind: mechanism
  statement: Theorem 2 (and Theorem 3 in Appendix G) proves that for a target classifier h_T = sum_{i=1}^N alpha_i h_{S_i} formed as a convex combination of N decentralized source hypotheses (alpha_i >= 0, sum_i alpha_i = 1) of VC dimension d with sample size m per domain, the target error is bounded with probability at least 1 - delta by epsilon_T(h_T) <= hat_epsilon_{tilde_S}(sum_i alpha_i h_{S_i}) + sum_{i=1}^N alpha_i ((1/2) hat_d_{H Delta H}(hat_D_{S_i}, hat_D_T) + lambda_i) + 4 sqrt((2 d log(2 N m) + log(4/delta)) / (N m)) (Equations 2 and 9), showing that target generalization depends on the alpha_i-weighted empirical H Delta H divergences between each source client and the target.
  evidence:
  - source_id: r516-primary-pdf
    locator: Section 3.1, Theorem 2, Equation (2), pages 3-4; Appendix G, Theorem 3, page 18
    relation: supports
- claim_id: fada-dynamic-attention-via-kmeans-gap-statistics-gain
  kind: mechanism
  statement: To suppress negative transfer from irrelevant source domains while updating the target model, FADA clusters unlabeled target features into k K-means clusters {C_r}_{r=1}^k, measures intra-cluster dispersion I = sum_{r=1}^k (1 / (2 n_r)) sum_{i,j in C_r} ||f_i^t - f_j^t||_2 (Equation 3), computes each source domain's gap-statistic improvement I_i^{gain} = I_i^{p-1} - I_i^p across training steps, and weights source gradients by Softmax(I_1^{gain}, ..., I_N^{gain}).
  evidence:
  - source_id: r516-primary-pdf
    locator: Section 3.1, Equation (3), page 4
    relation: supports
- claim_id: fada-decoupled-adversarial-alignment-and-mine-feature-disentanglement
  kind: mechanism
  statement: Because source and target data cannot be shared across nodes, FADA aligns each source generator G_i and target generator G_t through a domain identifier DI_i operating solely on extracted feature representations (Equations 4-5), while locally disentangling domain-invariant features f_{di} = D_{di}(G(x)) from domain-specific features f_{ds} = D_{ds}(G(x)) by training class identifier CI_i on f_{di} (Equation 6), adversarially confusing CI_i on f_{ds} via negative entropy L_{ent} = -(1/K) sum_k log CI_i(f_{ds})_k (Equation 7), and minimizing the Mutual Information Neural Estimator (MINE) lower bound I(P, Q) = (1/n) sum_{i=1}^n T(p, q, theta) - log((1/n) sum_{i=1}^n exp(T(p, q', theta))) (Equation 8) between f_{di} and f_{ds}.
  evidence:
  - source_id: r516-primary-pdf
    locator: Section 3.2-3.3, Equations (4)-(8) and Figure 2, pages 4-6
    relation: supports
- claim_id: fada-empirical-performance-on-digit-five-office-caltech-and-domainnet
  kind: application
  statement: Across federated multi-source adaptation benchmarks, FADA improves average target accuracy over the bare FedAvg baseline from 70.6% to 78.9% on Digit-Five (Table 1), from 89.5% to 92.0% on Office-Caltech10 (Table 2), from 67.9% to 75.3% on Office-31 (Table 4), and from 41.2% to 45.2% on DomainNet (Table 3).
  evidence:
  - source_id: r516-primary-pdf
    locator: Section 4.1-4.3, Tables 1-4, pages 7-8
    relation: supports
