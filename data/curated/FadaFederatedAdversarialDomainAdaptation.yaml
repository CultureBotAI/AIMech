id: AIMech:FadaFederatedAdversarialDomainAdaptation
name: FADA (Federated Adversarial Domain Adaptation)
concept_kind: algorithm
review_status: DRAFT
definition: FADA (Federated Adversarial Domain Adaptation) is a privacy-preserving multi-source unsupervised domain adaptation algorithm for federated learning that transfers knowledge from N decentralized labeled source clients {D_{S_i}}_{i=1}^N to an unlabeled target client D_T without sharing raw client data by combining (1) a dynamic attention mechanism that weights each source client's gradients via softmax over K-means target feature clustering gap-statistics gains I_i^{gain} = I_i^{p-1} - I_i^p, (2) decoupled adversarial domain alignment between each source extractor G_i and target extractor G_t using extracted feature vectors rather than raw samples, and (3) adversarial feature disentanglement with Mutual Information Neural Estimation (MINE) to separate domain-invariant features f_{di} from domain-specific features f_{ds}.
identity_notes: Introduced by Xingchao Peng, Zijun Huang, Yizhe Zhu, and Kate Saenko in 'Federated Adversarial Domain Adaptation' (ICLR 2020; arXiv:1911.02054). Distinct from centralized multi-source domain adaptation methods (DCTN, Xu et al. CVPR 2018; M3SDA, Peng et al. ICCV 2019; MDAN, Zhao et al. NeurIPS 2018), which require direct co-location of source and target domain examples on a single machine; and distinct from FedBN (Li et al. ICLR 2021), which handles feature shift across labeled federated clients via local batch normalization rather than adapting multiple labeled source clients to an unlabeled target client via dynamic attention and MINE feature disentanglement.
aliases:
- FADA
- Federated Adversarial Domain Adaptation
