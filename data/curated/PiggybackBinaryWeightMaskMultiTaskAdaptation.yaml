id: AIMech:PiggybackBinaryWeightMaskMultiTaskAdaptation
name: Piggyback Binary Weight-Mask Multi-Task Adaptation
concept_kind: algorithm
review_status: DRAFT
definition: A multi-task and continual neural network adaptation algorithm that freezes all weight matrices W of a pretrained backbone network, associates each weight w_{ji} with a trainable real-valued mask variable m^r_{ji} passed through a hard deterministic binary threshold m_{ji} = 1[m^r_{ji} >= tau] during the forward pass y = (W odot m) x, updates m^r via the straight-through gradient estimator delta_m = (delta_y . x^T) odot W during backpropagation, and discards m^r after training to retain only a 1-bit-per-parameter binary mask m per task.
identity_notes: Distinct from PackNet (Mallya & Lazebnik, CVPR 2018, AIMech:PackNetIterativePruningContinualLearning), which prunes and modifies network weights sequentially and degrades as tasks are added, from Edge-Popup (Ramanujan et al., CVPR 2020, AIMech:EdgePopupUntrainedSubnetworkScoreOptimization) and SupSup (AIMech:SupSupSupermasksInSuperposition), which discover fixed-sparsity top-k% subnetworks in randomly initialized networks without task-specific classification heads, and from Residual Adapters (Rebuffi et al., NeurIPS 2017), which insert additional trainable convolutional filter banks.
aliases:
- Piggyback
- Piggyback Weight Masking
- Piggyback Binary Mask Multi-Task Adaptation
- Differentiable Binary Weight Masking for Fixed Backbones
