claims:
- claim_id: r720-claim-straight-through-binary-mask
  kind: mechanism
  statement: Piggyback maintains real-valued mask weights m^r initialized uniformly above the binarizer threshold (e.g., m^r = 1e-2, tau = 5e-3 so all weights are initially active) and updates them with Adam using the straight-through gradient of the thresholded mask delta_m_{ji} = delta_y_j w_{ji} x_i, which scales proportionally to |W|; after training, discarding m^r leaves a binary mask requiring only 1 bit per 32-bit parameter (~3.12% storage overhead per task).
  evidence:
  - source_id: r720-primary-pdf
    locator: Section 3, Equations 4-7, pp. 5-6
    relation: supports
- claim_id: r720-claim-task-order-agnostic-continual
  kind: mechanism
  statement: Because Piggyback never alters the underlying backbone weights W and learns an independent binary mask per task, it is completely immune to catastrophic forgetting, agnostic to task ordering (unlike PackNet, whose error increases by 4-7% when a task is added fifth instead of first), and imposes no upper bound on the number of tasks that can piggyback onto the backbone.
  evidence:
  - source_id: r720-primary-pdf
    locator: Section 2 & Section 4, Table 2, pp. 3, 7-8
    relation: supports
- claim_id: r720-claim-visual-decathlon-and-fcn-application
  kind: application
  statement: Across VGG-16, ResNet-50, DenseNet-121, and Wide ResNet-28-4 backbones, Piggyback matches or outperforms dedicated per-task fine-tuned networks on CUBS, Stanford Cars, Flowers, WikiArt, Sketch, and Places365, achieves a 2838 cumulative score on the 10-task Visual Decathlon challenge with only a 1.28x total parameter ratio, and reaches 61.41 mIOU vs. 61.08 mIOU for full fine-tuning on PASCAL VOC FCN semantic segmentation.
  evidence:
  - source_id: r720-primary-pdf
    locator: Section 4 & Section 6, Tables 2, 3, 4, and 8, Figure 4, pp. 7-10, 13-14
    relation: supports
- claim_id: r720-claim-no-cross-task-sharing-and-bn-limitation
  kind: limitation
  statement: Because each task's binary mask operates independently on the fixed initial backbone, tasks added later cannot transfer or share newly learned features with one another, and on deep batch-normalized backbones (ResNet-50, DenseNet-121) under large domain shifts such as WikiArt, keeping batch-normalization parameters fixed leaves a 4-5% error gap unless task-specific batch-normalization parameters (~1 MB overhead) are also trained.
  evidence:
  - source_id: r720-primary-pdf
    locator: Section 4, Section 5.3, and Section 7, Tables 4 and 7, pp. 9-10, 12-13, 15
    relation: supports
