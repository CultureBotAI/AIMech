claims:
- claim_id: claim-two-to-infinity-norm-geometry-and-asymmetric-product-bounds
  kind: mechanism
  statement: "For $\\mathbf{A} \\in \\mathbb{R}^{p_1 \\times p_2}$, Proposition 2.1 proves that the induced two-to-infinity operator norm $\\|\\mathbf{A}\\|_{2\\to\\infty} = \\sup_{\\|\\mathbf{x}\\|_2=1}\\|\\mathbf{A}\\mathbf{x}\\|_\\infty$ equals the maximum Euclidean row norm $\\max_{i \\in [p_1]}\\|\\mathbf{A}_{i\\cdot}\\|_2$ and satisfies $\\|\\mathbf{A}\\mathbf{W}\\|_{2\\to\\infty} = \\|\\mathbf{A}\\|_{2\\to\\infty}$ for all $\\mathbf{W} \\in \\mathcal{O}_{p_2}$ and $\\|\\mathbf{U}\\|_{2\\to\\infty} = \\sqrt{r/p_1}\\,\\mu(\\mathbf{U})^{1/2}$ for $\\mathbf{U} \\in \\mathcal{O}_{p_1 \\times r}$; although $\\|\\cdot\\|_{2\\to\\infty}$ is not submultiplicative, Proposition 6.5 establishes the sharp asymmetric product inequalities $\\|\\mathbf{A}\\mathbf{B}\\|_{2\\to\\infty} \\le \\|\\mathbf{A}\\|_{2\\to\\infty}\\|\\mathbf{B}\\|_2$ and $\\|\\mathbf{C}\\mathbf{A}\\|_{2\\to\\infty} \\le \\|\\mathbf{C}\\|_\\infty\\|\\mathbf{A}\\|_{2\\to\\infty}$ (Sections 2.1\u20132.2 and 6.1, Proposition 2.1 and Proposition 6.5)."
  evidence:
  - source_id: ctp2019-twoinf-pdf
    locator: Sections 2.1-2.2 (Proposition 2.1, pp. 6-7), Section 6.1 (Proposition 6.5, p. 21)
    relation: supports
- claim_id: claim-procrustean-matrix-decomposition-and-deterministic-rowwise-subspace-bounds
  kind: mechanism
  statement: "For $\\widehat{\\mathbf{X}} = \\mathbf{X} + \\mathbf{E} \\in \\mathbb{R}^{p_1 \\times p_2}$ with rank-$r$ leading singular subspaces $\\mathbf{U}, \\widehat{\\mathbf{U}} \\in \\mathcal{O}_{p_1 \\times r}$ and $\\mathbf{V}, \\widehat{\\mathbf{V}} \\in \\mathcal{O}_{p_2 \\times r}$ aligned by the orthogonal Procrustes polar factors $\\mathbf{W}_U, \\mathbf{W}_V \\in \\mathcal{O}_r$, Lemma 6.7 proves $\\frac{1}{2}\\|\\sin\\boldsymbol{\\Theta}(\\widehat{\\mathbf{U}}, \\mathbf{U})\\|_2^2 \\le \\|\\mathbf{U}^T\\widehat{\\mathbf{U}} - \\mathbf{W}_U\\|_2 \\le \\|\\sin\\boldsymbol{\\Theta}(\\widehat{\\mathbf{U}}, \\mathbf{U})\\|_2^2$ and Theorem 3.1 establishes the exact four-term Procrustean decomposition $\\widehat{\\mathbf{U}} - \\mathbf{U}\\mathbf{W}_U = (\\mathbf{I} - \\mathbf{U}\\mathbf{U}^T)\\mathbf{E}\\mathbf{V}\\mathbf{W}_V\\widehat{\\boldsymbol{\\Sigma}}^{-1} + (\\mathbf{I} - \\mathbf{U}\\mathbf{U}^T)\\mathbf{E}(\\widehat{\\mathbf{V}} - \\mathbf{V}\\mathbf{W}_V)\\widehat{\\boldsymbol{\\Sigma}}^{-1} - \\mathbf{U}(\\mathbf{U}^T\\widehat{\\mathbf{U}} - \\mathbf{W}_U) + (\\mathbf{I} - \\mathbf{U}\\mathbf{U}^T)\\mathbf{X}(\\widehat{\\mathbf{V}} - \\mathbf{V}\\mathbf{W}_V)\\widehat{\\boldsymbol{\\Sigma}}^{-1}$, yielding deterministic row-wise bounds under the subspace singular-value gap $\\sigma_r(\\mathbf{X}) > \\sigma_{r+1}(\\mathbf{X})$ without requiring distinct top-$r$ singular values (Sections 2.3, 3, and 6.2\u20136.3, Theorem 3.1, Corollaries 3.2\u20133.4, Lemma 6.7)."
  evidence:
  - source_id: ctp2019-twoinf-pdf
    locator: Sections 2.3 and 3 (Theorem 3.1, Corollaries 3.2-3.4, pp. 8-12), Sections 6.2-6.3 (Lemma 6.7 and Proof of Theorem 3.1, pp. 21-24)
    relation: supports
- claim_id: claim-planted-clustering-spiked-pca-and-multilayer-network-recovery
  kind: application
  statement: "Applying Theorem 3.1 to statistical signal-plus-noise models proves (1) in the $r$-block planted clustering model $\\widehat{\\mathbf{Z}} = \\mathbf{Z} + \\mathbf{E} \\in \\mathbb{R}^{n \\times p}$ with balanced cluster size $K = n/r$, Minimum Distance Assignment on $\\widehat{\\mathbf{U}}_Z$ achieves zero clustering errors with high probability when $\\sigma_r(\\mathbf{Z}) \\gg \\sqrt{r}(\\sqrt{n} + \\sqrt{p})$ (Theorem 1.1); (2) under random sub-Gaussian perturbations of a rank-$r$ symmetric matrix with $\\lambda_r \\gg \\sqrt{p\\log p}$, $\\inf_{\\mathbf{W} \\in \\mathcal{O}_r}\\|\\widehat{\\mathbf{U}} - \\mathbf{U}\\mathbf{W}\\|_{2\\to\\infty} = O(\\|\\mathbf{U}\\|_{2\\to\\infty} + r/\\sqrt{p})$ (Theorems 4.1\u20134.2); (3) in high-dimensional spiked covariance PCA ($p \\gg n$, $p/(n\\log n) \\to \\infty$), $\\inf_{\\mathbf{W} \\in \\mathcal{O}_r}\\|\\widehat{\\mathbf{U}} - \\mathbf{U}\\mathbf{W}\\|_{2\\to\\infty} = O(\\|\\mathbf{U}\\|_{2\\to\\infty}/\\vartheta^{(1)} + \\sqrt{r\\log p}/(\\vartheta^{(r)}\\sqrt{n\\log n}))$ (Theorem 4.3); and (4) in $m$-layer stochastic blockmodel networks, averaging demeaned adjacency matrices achieves row-wise subspace error scaling as $O((m\\rho_p)^{-1/2}(p\\log p)^{-1/2}\\|\\mathbf{U}\\|_{2\\to\\infty})$ (Theorem 4.4)."
  evidence:
  - source_id: ctp2019-twoinf-pdf
    locator: Section 1.4 (Theorem 1.1, pp. 4-5), Section 4 (Theorems 4.1-4.4, pp. 12-19), Sections 6.6-6.10 (pp. 26-35)
    relation: supports
