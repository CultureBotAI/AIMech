claims:
- claim_id: polynomial-codes-outer-product-block-encoding-and-vandermonde-interpolation
  kind: mechanism
  statement: Given A = [A_0, ..., A_{m-1}] and B = [B_0, ..., B_{n-1}], the (1, m)-Polynomial Code assigns each worker i in {0, ..., N-1} a distinct scalar x_i in F_q and encoded submatrices tilde{A}_i = sum_{j=0}^{m-1} A_j x_i^j and tilde{B}_i = sum_{k=0}^{n-1} B_k x_i^{km} (Equation 17); worker i returns tilde{C}_i = tilde{A}_i^T tilde{B}_i = sum_{j=0}^{m-1} sum_{k=0}^{n-1} A_j^T B_k x_i^{j + km} (Equation 18), enabling the master to recover all mn block products A_j^T B_k by interpolating a degree-(mn - 1) polynomial from any mn workers in time O(rt log^2(mn) log log(mn)).
  evidence:
  - source_id: r540-primary-pdf
    locator: Section III-A & III-B, Definition 2 and Equations (10)-(18), pp. 5-6
    relation: supports
- claim_id: polynomial-codes-optimal-recovery-threshold-latency-communication-and-convolution-theorems
  kind: scope
  statement: Theorems 1-3 and Corollary 1 prove that Polynomial Codes achieve the cut-set optimal recovery threshold K* = mn (strictly improving over 1D-MDS K = N - N/n + m and Product Codes K = 2(m-1)sqrt(N) - (m-1)^2 + 1), minimum computation latency T_{poly}, minimum communication load L* = rt log_2 q, and Reed-Solomon error correction of up to floor((N - mn)/2) Byzantine module errors; Theorems 4-5 prove that the (1, 1)-Polynomial Code achieves recovery threshold K_{conv-poly} = m + n - 1 (within a factor of 2 of optimal) for distributed convolution.
  evidence:
  - source_id: r540-primary-pdf
    locator: Section I, Equations (1)-(3), pp. 2-3; Section II-B, Theorem 1 & Remark 6, pp. 4-5; Section III-C & III-D, Theorems 2-3, p. 7; Section IV, Theorems 4-5, p. 8
    relation: supports
- claim_id: polynomial-codes-real-valued-vandermonde-conditioning-and-quadratic-threshold-limitation
  kind: limitation
  statement: When each worker stores 1/m of both A and B (m = n), Polynomial Codes require K* = m^2 responding workers because they partition A and B into outer-product column blocks, and real-valued Vandermonde interpolation suffers numerical ill-conditioning for large mn unless inputs are quantized and embedded into a finite field F_q.
  evidence:
  - source_id: r540-primary-pdf
    locator: Section III-B, Remark 7, p. 6
    relation: supports
- claim_id: polynomial-codes-straggler-resilient-cluster-matrix-multiplication-application
  kind: application
  statement: Applied to straggler-resilient distributed large-matrix multiplication and FFT-based Reed-Solomon decoding on MPI/AWS EC2 clusters, reducing tail computation latency by 37% compared to uncoded execution.
  evidence:
  - source_id: r540-primary-pdf
    locator: Section V, Figure 5, p. 8
    relation: supports
