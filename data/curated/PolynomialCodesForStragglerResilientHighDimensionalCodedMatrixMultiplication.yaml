id: AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication
name: Polynomial Codes for Straggler-Resilient High-Dimensional Coded Matrix Multiplication
concept_kind: algorithm
review_status: DRAFT
definition: "An algebraic coded distributed computation method proposed by Yu, Maddah-Ali, and Avestimehr (NeurIPS 2017) for computing high-dimensional matrix products C = A^T B across N workers\u2014where each worker stores a 1/m fraction of A and a 1/n fraction of B\u2014by partitioning A into m column blocks [A_0, ..., A_{m-1}] and B into n column blocks [B_0, ..., B_{n-1}], encoding worker i's stored submatrices as tilde{A}_i = sum_{j=0}^{m-1} A_j x_i^j and tilde{B}_i = sum_{k=0}^{n-1} B_k x_i^{k m} at distinct evaluation points x_i, and recovering all mn block products A_j^T B_k from any K* = mn responding workers via degree-(mn - 1) polynomial interpolation."
identity_notes: Distinct from Lagrange Coded Computing (AIMech:LagrangeCodedComputingForResilientSecureAndPrivateDistributedLearning, which encodes a dataset of K separate inputs via Lagrange interpolation polynomials to evaluate a single multivariate polynomial f(X_i) on each batch), from Gradient Coding (AIMech:GradientCodingForStragglerResilientDistributedOptimization, which encodes partial loss gradients over replicated data blocks), and from MatDot and PolyDot Codes (AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication, which split A into column blocks and B into row blocks to compute inner-product sums sum_i A_i B_i with recovery threshold 2m - 1 at higher worker-to-master communication cost). Polynomial Codes (Yu, Maddah-Ali, & Avestimehr, NeurIPS 2017, pp. 4403-4413 / arXiv:1705.10464, Section II-IV, Definition 2, Equations 14-18, Theorems 1-5) achieve the information-theoretically minimum recovery threshold K_{poly} = mn = Theta(1) independent of N under minimum worker-to-master communication load L* = r t log_2 q (Theorems 1-3), and extend via the (alpha, beta) = (1, 1) code (Equations 31-33, Theorem 4) to distributed convolution c = a * b with recovery threshold K_{conv-poly} = m + n - 1.
aliases:
- Polynomial Codes
- (alpha, beta)-Polynomial Code
- (1, m)-Polynomial Code for Coded Matrix Multiplication
