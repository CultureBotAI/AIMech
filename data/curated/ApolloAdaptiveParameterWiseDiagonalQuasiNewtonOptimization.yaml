id: AIMech:ApolloAdaptiveParameterWiseDiagonalQuasiNewtonOptimization
name: Apollo (Adaptive Parameter-wise Diagonal Quasi-Newton Optimizer)
concept_kind: algorithm
review_status: DRAFT
definition: A diagonal quasi-Newton algorithm for nonconvex stochastic optimization that approximates the Hessian diagonally for each decoupled parameter tensor theta^(l) using only first-order gradients in O(d) time and memory. At iteration t, Apollo updates the bias-corrected gradient EMA m_{t+1} = (beta(1 - beta^t)/(1 - beta^{t+1})) m_t + ((1 - beta)/(1 - beta^{t+1})) g_{t+1}, computes the stepsize-bias-corrected weak-secant coefficient alpha = (d_t^T (m_{t+1} - m_t) + d_t^T B_t d_t) / (||d_t||_4 + eps)^4, updates the diagonal Hessian B_{t+1} = B_t - alpha Diag(d_t^2), rectifies negative or near-zero curvature via D_{t+1} = rectify(B_{t+1}, sigma) = max(|B_{t+1}|, sigma), and updates d_{t+1} = D_{t+1}^{-1} m_{t+1} and theta_{t+1} = theta_t - eta_{t+1} d_{t+1}.
identity_notes: 'Distinct from L-BFGS, SdLBFGS (Wang et al. 2017), AdaHessian (AIMech:AdaHessianAdaptiveSecondOrderOptimizer), and Sophia (AIMech:SophiaSecondOrderClippedStochasticOptimization): Apollo requires zero Hessian-vector products or multi-step secant history buffers; instead it solves the minimum-Frobenius-norm diagonal update min_B ||B - B_t||_F subject to the parameter-wise weak secant equation s_t^T B_{t+1} s_t = s_t^T y_t (Eqs. 6-7), applies stepsize bias correction y''_t = eta_t y_t so B_{t+1} is invariant to eta_t (Eq. 8), and enforces positive definiteness via elementwise rectified absolute values max(|B_{t+1}|, sigma) (Eq. 11).'
aliases:
- Apollo Optimizer
- ApolloW
- Adaptive Parameter-wise Diagonal Quasi-Newton Method
