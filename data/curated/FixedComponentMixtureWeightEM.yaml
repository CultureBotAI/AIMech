name: Fixed-Component Mixture-Weight EM
aliases:
- Mixture-Weight Expectation Maximization
concept_kind: algorithm
definition: An expectation-maximization specialization that keeps every component distribution fixed and
  updates only their simplex mixing weights by averaging current component responsibilities.
identity_notes: 'The name is a descriptive AIMech label for the fixed-component coefficient iteration
  in Csiszar-Tusnady Theorem5 and its mixture-decomposition interpretation. Fixed component laws do not
  mean merely a fixed number of components. This retains a distinct convex weight-fitting problem beneath
  generic EM; joint component-parameter fitting in Gaussian mixtures or MPPCA is outside it, and a mixture
  density network predicts input-dependent parameters instead. No normalized identity collision across
  all 442 pinned AIO IDs, labels/scoped synonyms and 483 maintained IDs, names and aliases. Full-checkout
  searches in the worktree and main included ignored and hidden files: 8 and 9 matched lines, respectively,
  reduce to six distinct matched texts, all inspected. Hits concern existing discovery leads and the unrelated
  assembler mnemonic AAM. The fixed-family exact KL projection procedure is narrower than generalized
  alternating minimization; weight-only EM fixes component laws rather than fitting a full mixture model;
  rate-distortion BA minimizes information plus distortion with a fixed source, whereas the IM algorithm
  maximizes a variational information bound; adaptive alternating minimization changes the feasible families
  at each iteration. Qualified AAM and descriptive weight-only names avoid unsupported acronym or historical
  naming claims. Absence is bounded to this snapshot and inspected corpus. Identity-search counts: 8 worktree
  and 9 main matched lines, all six distinct texts read, including ignored and hidden files.'
