claims:
- claim_id: responsibility-average
  kind: mechanism
  statement: For fixed component probabilities mu_i(y) and a target probability p(y), let q_c(y)=sum_i
    c_i mu_i(y). With positive initial weights summing to one and q_c positive on target support, set
    r_i(y)=c_i mu_i(y)/q_c(y) and c_i_new=sum_y p(y) r_i(y). The update normalizes because the responsibilities
    sum to one on target support. For empirical frequencies, it is the average responsibility over observations.
    No component location, covariance or shape parameter is updated. The source gives the corresponding
    integral formula for general fixed finite measures.
  evidence:
  - source_id: projection-source
    locator: Section4 Theorem5 Eq4.12-4.16, pp223-224 / PDF19-20; Section5A, pp229-230 / PDF25-26
    relation: supports
- claim_id: convex-coefficient-result
  kind: scope
  statement: 'Under Theorem5: a probability target, finitely many fixed component measures, strictly positive
    simplex initialization and a finite best divergence, the coefficient vector converges to a vector
    attaining the minimum divergence. For fixed probability components in a finite observation space this
    is the convex mixture-weight likelihood problem. The proof does not require identifiable component
    representation, so the limit can depend on initialization; identical components preserve their initial
    relative weights. This guarantee does not extend to jointly moving component parameters.'
  evidence:
  - source_id: projection-source
    locator: Section4 Theorem5 and coefficient KL argument, pp223-226 / PDF19-22; Section5A concluding
      mixture discussion, pp229-230 / PDF25-26
    relation: supports
- claim_id: certificate-and-support
  kind: limitation
  statement: The theorem bounds the current divergence gap by max_i log(c_i_(n+1)/c_i_n) where the ratios
    are defined. A coefficient driven to zero because its component has no target-support mass can be
    removed with an explicit support convention. Arbitrary zero initialization instead may permanently
    exclude useful components. With mu_1=(0.8,0.2), mu_2=(0.2,0.8) and target(0.6,0.4), an interior start
    tends to weights(2/3,1/3), while start(1,0) stays on a suboptimal face. Continuous-observation likelihood
    requires fixed density versions and the appropriate lifted measure; empirical point masses cannot
    naively be assigned finite KL to a continuous density.
  evidence:
  - source_id: projection-source
    locator: Theorem5 stopping inequality and proof, pp223-226 / PDF19-22; Section5A continuous-observation
      discussion, pp226-230 / PDF22-26; curator finite support example
    relation: supports
limitations:
- The number and distributions of candidate components are supplied. Fitting their weights does not choose
  a universally correct number of clusters or establish semantic component labels.
- Convexity does not imply strict convexity or unique coefficients. General continuous-law and finite-measure
  versions retain the source integrability and support conditions.
- Finite curator calculations check selected support, normalization and convergence boundaries. They are
  not author software, historical experiments or a proof of every source theorem.
