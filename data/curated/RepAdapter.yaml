claims:
- claim_id: repadapter-sequential-structural-reparameterization-mechanism
  kind: mechanism
  statement: By removing the internal non-linear activation from the residual bottleneck adapter f(X; theta) = (X W_d + b_d) W_u + b + X, RepAdapter simplifies the module at inference time to the single affine transformation f(X; theta) = X W_ada + b_ada with W_ada = W_d W_u + W_I and b_ada = b_d W_u + b (Eq. 9), and when sequentially pre-inserted before a pre-trained linear or convolutional layer (W_0, b_0) as X'_l = MHA(f(LN(X_{l-1}); theta)) + X_{l-1} and X_l = FFN(f(LN(X'_l); theta)) + X'_l (Eq. 12), merges into W_rep = W_ada W_0 and b_rep = b_ada W_0 + b_0 (Eq. 10) for zero additional inference parameters (Delta P = 0) and zero additional inference FLOPs or GPU latency (Delta F = 0).
  evidence:
  - source_id: r701-primary-pdf
    locator: Section 3.2.1 Sequentially Structural Re-parameterization, Figure 3 & Eqs. 8-10, p. 4; Section 3.2.2 Adapter Placement, Figure 4 & Eq. 12, p. 5; Section 4.3.3 Table 4, p. 7
    relation: supports
- claim_id: repadapter-dense-to-sparse-group-projection-mechanism
  kind: mechanism
  statement: RepAdapter formulates its upsampling projection phi_u as a k-group sparse transformation phi_u(X') = [X'_{g_0} W_{g_0}, ..., X'_{g_k} W_{g_k}] + b where each feature split X'_i in R^{n x (c/k)} is projected by W_i in R^{(c/k) x (d/k)} (Eq. 11) and converted to a dense matrix W_u in R^{c x d} via zero-padding during inference re-parameterization, saving 25% of adapter parameters when k = 2 (0.11M vs. 0.16M for RepAdapter_attn with c = 8) while outperforming both dense (k = 1) and fully sparse (both projections group-wise) variants.
  evidence:
  - source_id: r701-primary-pdf
    locator: Section 3.2.2 Adapter Structure, Eq. 11, p. 5; Section 4.2 Implementation Details, p. 5; Section 4.3.2 Ablation Studies, Tables 2-3, pp. 6-7
    relation: supports
- claim_id: repadapter-vision-benchmarks-application
  kind: application
  statement: Validated across 27 datasets spanning image classification (VTAB-1k, where RepAdapter achieves 76.1% average accuracy with 0.22M parameters on ViT-B/16, +7.2% over full tuning while saving 25% training time, 20% GPU memory, and 94.6% storage), CLIP few-shot and domain generalization (ImageNet, -V2, -Sketch, -A, -R), ConvNeXt-B (79.0%) and Swin-B (77.4%), video classification (SSv2 and HMDB51), and semantic segmentation (SETR on ADE20K).
  evidence:
  - source_id: r701-primary-pdf
    locator: Abstract, p. 1; Section 4.3.1 Table 1, p. 6; Section 4.3.3 Figure 5, p. 7; Section 4.3.4 Tables 5-8, pp. 7-8
    relation: supports
- claim_id: repadapter-group-count-and-post-insertion-limitation
  kind: limitation
  statement: Increasing the group count k beyond 2 (e.g., k = 4 or k = 8) or making both projections group-wise ('full sparse') degrades VTAB-1k accuracy (from 75.5% to 74.5% and 75.1%) by restricting cross-channel information exchange, and placing RepAdapter after MHA/FFN or increasing hidden dimension c beyond 8 (e.g., c = 16) reduces accuracy due to overfitting on small downstream datasets.
  evidence:
  - source_id: r701-primary-pdf
    locator: Section 4.3.2 Ablation Studies, Table 2(a)-(d), pp. 6-7
    relation: supports
