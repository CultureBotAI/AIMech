id: AIMech:InformationTheoreticLimitsOfHighDimensionalNoisySparsityRecovery
name: Information-Theoretic Limits of High-Dimensional Noisy Sparsity Recovery
concept_kind: mathematical_method
aliases:
- Information-Theoretic Limits on Sparsity Recovery in the High-Dimensional and Noisy Setting (Wainwright
  2009)
- Optimal Subset-Projection Decoder and Fano Multiway Lower Bounds for Noisy Support Recovery
- Exhaustive Projection Decoding and Linear-Sparsity Information-Computation Gap for Sparse Linear Regression
definition: Information-Theoretic Limits of High-Dimensional Noisy Sparsity Recovery is an information-theoretic
  and optimal subset-projection decoding framework introduced by Wainwright (2009, IEEE Transactions on
  Information Theory 55(12):5728-5741, arXiv:math/0702301v2, DOI:10.1109/TIT.2009.2032816) for characterizing
  necessary and sufficient conditions on the sample size n, ambient dimension p, support size s = |S|,
  and minimum non-zero magnitude M(beta*) := min_{i in S} |beta*_i| (Equation 4) for exact 0-1 support
  recovery rho(beta_hat, beta*) = I[{beta_hat_i != 0 forall i in S} cap {beta_hat_j = 0 forall j notin
  S}] (Equation 3) from noisy standard Gaussian linear measurements Y = X beta* + W (X_{ij} ~ N(0, 1),
  W_i ~ N(0, sigma^2) with sigma^2 = 1). Analyzing the optimal maximum-likelihood projection decoder phi_opt(Y)
  = argmin_{|U|=s} ||Pi_U^perp Y||_2^2 where Pi_U^perp = I_n - X_U (X_U^T X_U)^{-1} X_U^T (Equations 9-12b)
  via conditional non-central chi-squared tail bounds across overlap complement sizes k = |S \ U| in {1,
  ..., s} (Lemmas 1-2, Equations 13-26), Theorem 1 (Equations 5, 27) proves that if (n - s) M^2(beta*)
  -> +infty, then n > C max{s log(p/s), M(beta*)^{-2} log(p - s)} suffices for p_err(phi_opt) -> 0. Conversely,
  applying Fano's inequality and Markov's inequality over the N = binom(p, s)-way uniform support ensemble
  beta*_U = M(beta*) 1_U (Lemmas 3-4, Equations 28-30), Theorem 2 (Equations 6, 31) proves that any decoder
  has error probability bounded away from zero whenever n < [C' / (s M^2(beta*))] s log(p/s).
identity_notes: Resolved against all 442 pinned AIO records and 627 maintained AIMech records. Distinct
  from AIMech:PrimalDualWitnessAndSharpThresholdsForHighDimensionalNoisyLassoSparsityRecovery (Wainwright
  2009, IEEE Trans. Inf. Theory 55(5):2183-2202, arXiv:math/0605740v1, which characterizes polynomial-time
  l_1-constrained quadratic programming (Lasso) via the primal-dual witness method and mutual incoherence;
  comparing Theorem 1 here with the sharp noisy Lasso threshold n = 2s log(p - s) + s + 1 reveals an information-computation
  gap in the linear sparsity regime s = alpha p, where optimal projection decoding succeeds with n = Theta(p)
  samples while noisy Lasso requires n = Theta(p log p)), from AIMech:MinimaxEstimationRatesForHighDimensionalLinearRegressionOverLqBalls
  (Raskutti, Wainwright, & Yu 2011, IEEE Trans. Inf. Theory 57(10):6976-6994, which analyzes continuous
  l_2 estimation and prediction error over l_q balls via metric entropy and local packing rather than
  discrete 0-1 support recovery under minimum magnitude M(beta*)), and from AIO:LinearRegression and AIO:LassoRegression.
