claims:
- claim_id: optimal-projection-decoder-residual-decomposition-and-noncentral-chisquared-sufficient-thresholds
  kind: mechanism
  statement: 'For the optimal maximum-likelihood subset decoder phi_opt(Y) = argmin_{|U|=s} f(U; Y, X,
    beta*) minimizing the squared orthogonal-projection residual f(U) = min_{beta_U in R^s} ||Y - X_U
    beta_U||_2^2 = ||Pi_U^perp Y||_2^2 where Pi_U^perp = I_n - X_U (X_U^T X_U)^{-1} X_U^T (Equations 9-12b;
    Appendix A, p. 13), Lemma 1 (Section 2.2, p. 6, Equation 13) proves that phi_opt prefers an incorrect
    support U != S over the true support S if and only if Delta(U) := ||Pi_U^perp (X_{S \ U} beta*_{S
    \ U} + W)||_2^2 - ||Pi_S^perp W||_2^2 < 0. Conditioned on the noise W, the rescaled projection ||beta*_{S
    \ U}||_2^{-2} ||Pi_U^perp (X_{S \ U} beta*_{S \ U} + W)||_2^2 follows a non-central chi-squared distribution
    chi^2(d, nu) with d = n - s degrees of freedom and non-centrality parameter nu = ||beta*_{S \ U}||_2^{-2}
    ||Pi_U^perp W||_2^2, while ||Pi_S^perp W||_2^2 - ||Pi_U^perp W||_2^2 is distributed as the difference
    of two independent central chi_k^2 variates where k = |S \ U| is the overlap complement size (pp.
    7-8). Applying Birge''s non-central chi-squared tail bound (Equation 35b) and Laurent-Massart central
    chi-squared tail bounds (Equations 34a-34b), Lemma 2 (p. 7, Equation 15) and its simplified bound
    P[Delta(U) <= 0] <= 3 exp(-(n - s) k M^2(beta*) / (12(k M^2(beta*) + 8))) (p. 9, Equation 22) summed
    over N(k) = binom(s, k) binom(p - s, k) subsets for k in {1, ..., s} (Equations 23-26) prove Theorem
    1 (p. 4, Equation 5; p. 10, Equation 27): if (n - s) M^2(beta*) -> +infty, then n > C max{s log(p/s),
    M(beta*)^{-2} log(p - s)} suffices for p_err(phi_opt) -> 0.'
  evidence:
  - source_id: wainwright2009-it-limits-pdf
    locator: Section 1.2, p. 4, Theorem 1, Equation (5); Section 2.2, pp. 6-10, Lemmas 1-2, Equations
      (9)-(27); Appendix A, p. 13; Appendix C, p. 14, Equations (34a)-(35b)
    relation: supports
- claim_id: fano-multiway-hypothesis-testing-necessary-conditions-and-linear-sparsity-gap
  kind: mechanism
  statement: 'Restricting to the uniform N = binom(p, s)-way hypothesis ensemble where beta*_U = M(beta*)
    1_U on each s-element support U subset {1, ..., p} so Y = X_U v + W with v = M(beta*) 1_s (Equation
    28), the conditional Kullback-Leibler divergence given X between observation laws P_i and P_j (with
    noise variance sigma^2 = 1) is D(P_i || P_j) = (1/2) ||X_{U[i]} v - X_{U[j]} v||_2^2 = (1/2) Z_{U,V}
    where Z_{U,V} ~ gamma(U, V) chi_n^2 with scale factor gamma(U, V) = 2 M^2(beta*)(s - |U cap V|) <=
    2 M^2(beta*) s (Equation 29). Lemma 4 (Section 2.3, p. 11; proved in Appendix B, p. 13, Equation 32)
    applies Markov''s inequality to the ensemble average Z = N^{-2} sum_{U != V} Z_{U,V} (E[Z] <= 2 M^2(beta*)
    s n) to show P[Z >= 4 M^2(beta*) s n] <= 1/2, so at least half of all Gaussian measurement matrices
    X satisfy Z <= 4 M^2(beta*) s n; combining with Fano''s inequality (Lemma 3, p. 11) proves Theorem
    2 (p. 4, Equation 6; p. 12, Equation 31): asymptotically reliable recovery is impossible whenever
    n < [C'' / (s M^2(beta*))] s log(p/s).'
  evidence:
  - source_id: wainwright2009-it-limits-pdf
    locator: Section 1.2, pp. 4-5, Theorem 2, Equation (6); Section 2.3, pp. 10-12, Lemmas 3-4, Equations
      (28)-(31); Appendix B, p. 13, Equation (32)
    relation: supports
- claim_id: sublinear-versus-linear-sparsity-regime-comparison-with-noisy-lasso
  kind: scope
  statement: 'Comparing Theorems 1 and 2 with the sharp sample complexity threshold n = 2s log(p - s)
    + s + 1 of l_1-constrained quadratic programming (Lasso) for standard Gaussian designs (Section 1.2,
    p. 5) establishes two distinct regimes: (1) in the sublinear sparsity regime s = o(p) (such as s =
    O(1) with M(beta*) = Theta(1) or growing s with critical signal scaling M^2(beta*) = Theta(1/s)),
    the information-theoretic threshold n = Theta(s log(p/s)) = Theta(s log(p - s)) is achieved up to
    constant factors by polynomial-time noisy Lasso; whereas (2) in the linear sparsity regime s = alpha
    p (alpha in (0, 1)) with s M^2(beta*) -> +infty (e.g., M(beta*) = Theta(1)), the optimal projection
    decoder succeeds with n = Theta(p) observations while noisy Lasso requires n = Omega(p log p), demonstrating
    a strict information-computation gap.'
  evidence:
  - source_id: wainwright2009-it-limits-pdf
    locator: Section 1.2, pp. 4-5, Theorems 1-2 and Discussion of Comparison with Lasso; Section 3, p.
      12
    relation: supports
