limitations:
- The source’s Lp unit terminology is scoped to this learned centered projection construction. A unit
  computation, its containing layer and a complete MLP or recurrent architecture are distinct.
- Special cases require their stated centers, sign conditions and limits. Centered affine responses need
  not define a norm of the original input; continuity does not imply differentiability everywhere.
- The Pentomino table/prose discrepancy is preserved. Experimental evidence concerns finite configured
  networks, not an isolated causal ablation of learned order.
- One complete 17-page versioned paper was visually inspected. No author implementation or model training
  was executed; DRAFT remains.
