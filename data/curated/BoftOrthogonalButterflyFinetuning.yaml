claims:
- claim_id: r656-claim-butterfly-topology-expressivity-and-parameter-count
  kind: mechanism
  statement: Interpreting dense d x d orthogonal matrix parameterization as complete bipartite graph connectivity across d input and d output nodes, BOFT's block butterfly factorization with m = log_2(d/b) + 1 stages and block size b >= 2 achieves dense all-to-all connectivity (and by Kaleidoscope matrix expressivity, full O(d) representation when stacked) using only (1/2)(b - 1) d log_2 d effective parameters instead of O(d^2) for full orthogonal or O(b d) for block-diagonal OFT.
  evidence:
  - source_id: r656-primary-pdf
    locator: Section 2, Figure 1, p. 3-4; Section 3, Equations (5)-(6), Theorem 1 & Remark 2, p. 5-6
    relation: supports
- claim_id: r656-claim-hyperspherical-energy-preservation-and-spectral-norm
  kind: mechanism
  statement: Because the product of orthogonal butterfly factors R(m, b) = prod_{i=1}^m B~^b_{(d, i)} remains strictly orthogonal (R(m, b)^T R(m, b) = I_d), multiplying a pretrained weight matrix W^0 by R(m, b) exactly preserves the pairwise cosine similarities (hyperspherical energy) among the columns (neurons) of W^0 as well as the singular value spectrum and spectral norm ||R(m, b) W^0||_2 = ||W^0||_2.
  evidence:
  - source_id: r656-primary-pdf
    locator: Section 1, p. 1-2; Section 2, Equation (1), p. 3; Section 4 (Intriguing Insights & Discussions), p. 6-7
    relation: supports
- claim_id: r656-claim-multiplicative-dropout-for-butterfly-factors
  kind: mechanism
  statement: Because standard element-wise dropout destroys the orthogonality of Cayley-parameterized butterfly blocks, BOFT introduces multiplicative dropout, which randomly selects a fraction p_2 of the 2 x 2 block-orthogonal submatrices in each butterfly component B~^b_{(d, i)} and replaces them with the b x b identity matrix I_b, preserving exact orthogonality of R(m, b) throughout regularized training.
  evidence:
  - source_id: r656-primary-pdf
    locator: Section 3 (Multiplicative Dropout for BOFT), p. 6
    relation: supports
- claim_id: r656-claim-merging-zero-inference-overhead-and-training-cost-limitation
  kind: limitation
  statement: Once training finishes, all m butterfly factors are multiplied into a single orthogonal matrix and folded into W = R(m, b) W^0 with zero inference latency overhead, but during training BOFT incurs sequential matrix multiplications and Cayley matrix inversions across m butterfly stages and requires dimensions d divisible by b * 2^{m-1}.
  evidence:
  - source_id: r656-primary-pdf
    locator: Section 3 (Identity Initialization & Inference Efficiency), p. 5; Appendix A & F, p. 16-21
    relation: supports
