  rationale: AdaBelief is an adaptive first-order stochastic optimizer designed for training deep artificial neural networks such as CNNs, LSTMs, and GANs.
limitations:
- Sensitive to the damping floor hyperparameter epsilon when stochastic gradient variance vanishes near deterministic optima.
- Maintains two d-dimensional state buffers (m_t and s_t), matching Adam's memory footprint (2x SGD with momentum).
