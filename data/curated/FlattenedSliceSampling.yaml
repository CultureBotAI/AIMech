limitations:
- This record denotes Neal’s finite FSS kernel with the supplied ordering. Generic slice sampling, Gibbs
  sampling, shifted-tower sampling and ZFSS are not exact aliases.
- The input must define a nonnegative normalized conditional distribution. Approximate normalization,
  invalid conditioning contexts, adaptive order changes and countably infinite extensions are outside
  this maintained finite scope.
- Algorithm 9 was assessed through an explicitly documented interpretation, with its printed endpoint
  and loop caveats retained. No floating-point or author-code correctness claim is made.
- The inspected source is the pinned 2024 author report, read selectively. No complete 84-page empirical
  review, benchmark reproduction or universal efficiency claim is made.
