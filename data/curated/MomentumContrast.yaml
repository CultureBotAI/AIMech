claims:
- claim_id: method
  kind: mechanism
  statement: Initialize key-encoder parameters from the query encoder and maintain a finite FIFO queue
    of K≥1 encoded keys. For each image draw two augmented views, form normalized query q and current
    positive key k+, and use loss −log[exp(q·k+/tau)/(exp(q·k+/tau)+sum_(k in queue)exp(q·k/tau))] with
    tau>0. Stop gradients through the key outputs and queue; update the query encoder from the minibatch
    loss. In paper Algorithm 1, next update key parameters as theta_k←m theta_k+(1−m)theta_q, m in [0,1),
    enqueue the keys already computed for this batch, and remove the oldest batch to maintain the queue.
    The queue decouples dictionary size from current minibatch size; the momentum encoder reduces changes
    between key representations created at different iterations.
