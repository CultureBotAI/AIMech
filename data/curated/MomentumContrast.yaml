name: Momentum contrast
definition: A contrastive representation-learning mechanism that maintains a queue of encoded negative
  keys and produces new keys with an encoder updated by an exponential moving average of the query encoder.
concept_kind: algorithm
identity_notes: This is original MoCo from the 2020 paper, with its image instance-discrimination realization.
  The momentum acts on encoder parameters, not on per-example memory-bank embeddings. It is distinct from
  MoCo v2/v3 and from large-batch end-to-end contrastive training. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 187 prior native IDs/names/aliases. Ignored-inclusive
  searches of both full checkouts found no discovery-checkout hits and nine unrelated main-environment
  substrings (Pygments and Sphinx locale/bundle text). Exact neighboring AIO definitions, synonyms and
  incident edges were inspected; task/network vocabulary does not make these algorithms equivalent.
limitations:
- Queued keys were encoded at different parameter states. A slow update aims to improve consistency; it
  does not make historical keys identical to recomputed current-encoder outputs.
- The image realization treats different images as negatives. This is instance discrimination, not verification
  that all negative pairs belong to different semantic classes.
- The paper’s distributed ResNet implementation shuffles the key minibatch across GPUs and restores correspondence
  after encoding to reduce batch-normalization leakage. Other normalization choices need their own reproduction
  checks.
- The displayed algorithm abstracts queue initialization and requires a valid finite dictionary. Temperature,
  queue length, momentum and augmentation are tuning choices; no single setting is universally optimal.
- This record specifies the original paper’s update order and scope. It does not import later MoCo variants,
  claim independent samples, or reproduce benchmark training.
