id: AIMech:WARPWordLevelAdversarialReProgramming
name: WARP (Word-level Adversarial ReProgramming)
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient transfer learning method for frozen masked language models that inserts K special prompt tokens [P_1], ..., [P_K] and a [MASK] token before, between, and after input text segments according to a template T_{Theta^P}(x), removes the full vocabulary decoder projection from the masked language modeling head f(.), and optimizes only the continuous prompt embeddings Theta^P in R^{K x E} and class verbalizer embeddings Theta^V in R^{|C| x E} in word-embedding space R^E via stochastic gradient descent on the cross-entropy loss of P_Theta(y | x) = exp(Theta^V_y f(T_{Theta^P}(x))) / sum_{i in C} exp(Theta^V_i f(T_{Theta^P}(x))).
identity_notes: 'Introduced by Karen Hambardzumyan, Hrant Khachatrian, and Jonathan May (ACL/IJCNLP 2021, Volume 1: Long Papers, pp. 4921-4933, arXiv:2101.00121). Inspired by image-level Adversarial Reprogramming (Elsayed et al., ICLR 2019). Distinct from discrete prompt search such as AutoPrompt (Shin et al., EMNLP 2020), which restricts triggers and verbalizers to discrete vocabulary tokens, and distinct from generative Prompt Tuning (Lester et al., EMNLP 2021; AIMech:PromptTuning), which prepends prefix prompts to sequence-to-sequence models without jointly optimizing continuous MLM verbalizer vectors Theta^V at a template [MASK] position.'
aliases:
