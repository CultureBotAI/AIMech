    locator: Section 6, lines 99–114, Equations 26–33, Lemma 8, Theorem 9; Appendix B.3, lines 650–670,
      Proposition 16
    relation: supports
  - source_id: catoni2012-deviation-study
    locator: Abstract and Section 2 (Influence function bounds -log(1 - x + x^2/2) <= phi(x) <= log(1
      + x + x^2/2))
    relation: supports
- claim_id: comparison-with-dubins-savage-and-delyon-self-normalized-confidence-sequences
  kind: mechanism
  statement: 'While the Dubins-Savage confidence sequence CI_t^{DS} = [sum_{i=1}^t lambda_i X_i / sum_{i=1}^t
    lambda_i +- (2/alpha - 1 + sigma^2 sum_{i=1}^t lambda_i^2) / sum_{i=1}^t lambda_i] (Theorem 2, derived
    from Lemma 1''s linear supermartingale inequality P(exists t : S_t >= a + b V_t) <= 1/(1 + a b)) suffers
    polynomial width dependence O(1/alpha) (or O(alpha^{-1/2}) when tuned to alpha), and the Self-Normalized
    confidence sequence CI_t^{SN} (Lemma 5, Theorem 7, derived from Delyon''s inequality exp(x - x^2/6)
    <= 1 + x + x^2/3 via M_t^{SN} = prod_{i=1}^t exp(lambda_i(X_i - mu) - lambda_i^2(X_i - mu)^2 / 6 -
    lambda_i^2 sigma^2 / 3)) achieves O(log(1/alpha)) scaling by placing the quadratic empirical-variance
    term -(lambda_i^2/6)(X_i - mu)^2 in the exponent at the cost of producing a disconnected three-component
    union of intervals L_t^{SN} U M_t^{SN} U U_t^{SN} (complement of two anticonfidence intervals when
    the quadratic discriminants D^+, D^- are positive), the Catoni-style confidence sequence CI_t^C simultaneously
    preserves connected single-interval topology [u_t, l_t] and logarithmic O(log(1/alpha)) width scaling.'
  evidence:
  - source_id: wang-ramdas2023-catoni-cs
    locator: Section 1, lines 28–39, Table 1; Section 3, lines 53–68, Lemma 1, Theorem 2; Section 5, lines
      77–98, Lemmas 4–6, Theorem 7; Section 6, lines 99–114, Theorem 9; Appendix B.1–B.2, lines 616–648
    relation: supports
- claim_id: nonasymptotic-quadratic-width-bound-and-stitched-iterated-logarithm-rate
  kind: mechanism
  statement: Using the cubic upper bound phi(x) <= x - x^2/2 + x^3/3, Theorem 10 proves that whenever
    the weighted empirical variance sigma_hat_i^2 = (X_i - mu_hat)^2 around mu_hat = sum_{i=1}^t lambda_i
    X_i / sum_{i=1}^t lambda_i satisfies the discriminant condition Delta_t = (sum_{i=1}^t lambda_i)^2
    - 2(sum_{i=1}^t lambda_i^3)(sum_{i=1}^t lambda_i^2 sigma_hat_i^2 + sum_{i=1}^t lambda_i^2 sigma^2
    / 2 + log(2/alpha)) >= 0, the roots [u_t, l_t] of CI_t^C exist and have half-width bounded deterministically
    by the smaller quadratic root rho_t = (sum_{i=1}^t lambda_i - sqrt(Delta_t)) / sum_{i=1}^t lambda_i^3
    (Appendix B.4, Equations 34 and 72–76), which yields O(sqrt(t^{-1} log t)) shrinkage under predictable
    plugin tuning lambda_t = Theta(1/sqrt(t log t)) (Corollary 10.1) and attains the optimal law-of-the-iterated-logarithm
    rate O(sqrt(t^{-1} log log t)) via geometric epoch stitching CI_t^{Cstch} = cap_{s=1}^t I_s in Section
    6.2 (Corollary 10.2, Lemma 17).
  evidence:
  - source_id: wang-ramdas2023-catoni-cs
