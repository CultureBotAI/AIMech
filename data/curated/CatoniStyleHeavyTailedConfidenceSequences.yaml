- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Catoni-style and p-Catoni confidence sequences guarantee nonasymptotic time-uniform coverage
    across all stopping times under heavy-tailed distributions with only finite variance or finite p-th
    central moment (1 < p < 2), preventing false-positive inflation from continuous peeking in sequential
    experiments (AIO:DataDredgingBias).
- target: AIO:TimeSeriesAnalysis
  relation: related_match
  rationale: Catoni-style supermartingales track conditional means across dependent sequential processes
    (X_t)_{t>=1} adapted to filtrations (F_t)_{t>=0} with time-varying predictable variance bounds v_t
    (AIO:TimeSeriesAnalysis).
limitations:
- Constructing valid Catoni-style (or p-Catoni) confidence sequences requires a known a priori upper bound
  sigma^2 on the conditional variance E[(X_t - mu)^2 | F_{t-1}] <= sigma^2 (or a known upper bound v_t
  on the p-th central moment E[|X_t - mu|^p | F_{t-1}] <= v_t); by Bahadur-Savage-style impossibility
  and Proposition 16, if the true variance exceeds (1 + 2 kappa) sigma^2 on a positive-probability event,
  the Catoni process ceases to be a supermartingale and anytime coverage can fail (Section 2, Section
  7, Appendix B.3).
- At very small sample sizes t before the discriminant condition Delta_t >= 0 of Theorem 10 is satisfied
  (for example when a single extreme outlier makes sum_{i=1}^t lambda_i(X_i - m) fail to cross the threshold
  within the quadratic regime or whenphi is chosen from a bounded influence family), root-finding must
  be performed numerically via bisection/Newton-Raphson and bounded influence functions phi can yield
  infinite confidence intervals at small t (Section 6, Remark 2, Theorem 10).
- Under adversarial contamination where an epsilon-fraction of observations come from an arbitrary corrupting
  distribution with unbounded moments, standard Catoni-style confidence sequences can be biased unless
  modified to incorporate Huber-robust contamination budgets (Section 10, Wang & Ramdas 2023 AISTATS).
- All 804 lines of Wang & Ramdas (2023, arXiv:2202.01250) were read. Constructed numerical checks in research/discovery/catoni-style-heavy-tailed-confidence-sequences-boundaries.py
  verify Catoni influence bounds, Lemma 8 supermartingale expectations on heavy-tailed Student-t_3 and
  Proposition 16 tightness failure under underestimated variance, Delyon's inequality and the disconnected
  3-component topology of Self-Normalized CS vs. connected O(log(1/alpha)) Catoni CS and O(1/alpha) Dubins-Savage
  CS, Student-t_3 anytime coverage vs. naive CLT peeking failure and Theorem 10's quadratic width bound
  rho_t, and Section 9's infinite-variance p-Catoni (p = 1.5) Lemma 21 inequality and anytime coverage
  on symmetric Pareto(alpha_tail = 1.8) streams.
