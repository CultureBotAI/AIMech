- claim_id: infinite-variance-p-catoni-supermartingale-confidence-sequences
  kind: mechanism
  statement: 'When the conditional variance is infinite but the conditional p-th central moment is bounded
    by E[|X_t - mu|^p | F_{t-1}] <= v_t for known 1 < p < 2, replacing the quadratic Catoni influence
    function with the p-Catoni influence function satisfying -log(1 - x + |x|^p/p) <= phi_p(x) <= log(1
    + x + |x|^p/p) makes M_t^{Cp} = prod_{i=1}^t exp(phi_p(lambda_i(X_i - mu)) - lambda_i^p v_i / p) and
    N_t^{Cp} = prod_{i=1}^t exp(-phi_p(lambda_i(X_i - mu)) - lambda_i^p v_i / p) nonnegative supermartingales
    (Lemma 13) and yields the connected confidence sequence CI_t^{Cp} = {m in R : |sum_{i=1}^t phi_p(lambda_i(X_i
    - m))| <= sum_{i=1}^t lambda_i^p v_i / p + log(2/alpha)} (Theorem 14), whose half-width is bounded
    via the inequality |x + y|^p <= |x|^p + 4|y|^p + p y |x|^{p-1} sgn(x) (Lemma 21) and root analysis
    of g(r) = 4 A r^p - B r + C (Lemmas 19–20) to contract at rate O_tilde(t^{-(p-1)/p} log(1/alpha))
    when lambda_t = Theta_tilde(t^{-1/p}) (Theorem 15, Corollary 15.1).'
