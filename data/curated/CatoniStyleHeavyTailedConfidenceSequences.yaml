id: AIMech:CatoniStyleHeavyTailedConfidenceSequences
name: Catoni-style heavy-tailed confidence sequences
aliases:
- Catoni Supermartingale Confidence Sequence for Heavy-Tailed Means
- Infinite-Variance p-Catoni Confidence Sequence
- Stitched Catoni Law-of-the-Iterated-Logarithm Confidence Sequence
- Dubins-Savage and Delyon Self-Normalized Heavy-Tailed Confidence Sequences
concept_kind: mathematical_method
definition: 'A family of nonasymptotic, anytime-valid sequential confidence sequences (Wang & Ramdas 2023,
  building on Catoni 2012) for the conditional mean mu of potentially heavy-tailed real-valued stochastic
  processes (X_t)_{t>=1} knowing only an upper bound sigma^2 on the conditional variance E[(X_t - mu)^2
  | F_{t-1}] <= sigma^2 (or more generally knowing only a p-th central moment bound E[|X_t - mu|^p | F_{t-1}]
  <= v_t for 1 < p <= 2 when the variance is infinite), constructed by applying Ville''s maximal inequality
  to the nonnegative Catoni supermartingales M_t^C = prod_{i=1}^t exp(phi(lambda_i(X_i - mu)) - lambda_i^2
  sigma^2 / 2) and N_t^C = prod_{i=1}^t exp(-phi(lambda_i(X_i - mu)) - lambda_i^2 sigma^2 / 2) for any
  influence function phi satisfying -log(1 - x + x^2/2) <= phi(x) <= log(1 + x + x^2/2) (or the p-Catoni
  influence function -log(1 - x + |x|^p/p) <= phi_p(x) <= log(1 + x + |x|^p/p)) with predictable tuning
  sequence (lambda_t)_{t>=1}, yielding connected root-finding intervals CI_t^C = {m in R : |sum_{i=1}^t
  phi(lambda_i(X_i - m))| <= sum_{i=1}^t lambda_i^2 sigma^2 / 2 + log(2/alpha)} (and stitched intervals
  CI_t^{Cstch}) that achieve logarithmic dependence O(log(1/alpha)) in the error level alpha, match the
  optimal law-of-the-iterated-logarithm rate O(sqrt(t^{-1} log log t)) for finite variance, and attain
  width O_tilde(t^{-(p-1)/p} log(1/alpha)) for infinite-variance distributions with 1 < p < 2.'
identity_notes: No normalized identity match for Catoni-style heavy-tailed confidence sequences across
  all 442 pinned AIO records and 577 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 182 discovery
  artifacts where Wang & Ramdas (2023, arXiv:2202.01250) was queued as a pending frontier lead. Distinct
  from AIMech:SubPsiUniformBoundaryConfidenceSequences (Howard, Ramdas, McAuliffe, & Sekhon 2021), which
  requires light-tailed sub-psi / sub-gamma / empirical-Bernstein conditions or bounded increments to
  control exponential processes exp(lambda S_t - psi(lambda) V_t), and from AIMech:BettingConfidenceSequencesForBoundedMeans
  (Waudby-Smith & Ramdas 2024), which requires observations bounded in [0, 1], whereas CatoniStyleHeavyTailedConfidenceSequences
  transforms raw unbounded observations inside the exponent via Catoni's M-estimator influence function
  phi(lambda_i(X_i - m)) (and its p-Catoni generalization phi_p for 1 < p < 2) so that only a 2nd or p-th
  central moment bound is required without any moment generating function or boundedness assumption.
