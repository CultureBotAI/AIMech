claims:
- claim_id: catoni-influence-supermartingale-and-tightness-necessity
  kind: mechanism
  statement: 'For any sequence of random variables (X_t)_{t>=1} satisfying E[X_t | F_{t-1}] = mu and E[(X_t
    - mu)^2 | F_{t-1}] <= sigma^2, any predictable positive sequence (lambda_t)_{t>=1}, and any influence
    function phi satisfying -log(1 - x + x^2/2) <= phi(x) <= log(1 + x + x^2/2) (such as the narrowest
    choice phi(x) = log(1 + x + x^2/2) for x >= 0 and -log(1 - x + x^2/2) for x < 0), the inequality exp(+-phi(lambda_i(X_i
    - mu))) <= 1 +- lambda_i(X_i - mu) + lambda_i^2(X_i - mu)^2 / 2 implies that M_t^C = prod_{i=1}^t
    exp(phi(lambda_i(X_i - mu)) - lambda_i^2 sigma^2 / 2) and N_t^C = prod_{i=1}^t exp(-phi(lambda_i(X_i
    - mu)) - lambda_i^2 sigma^2 / 2) are nonnegative supermartingales with initial value 1 (Lemma 8) and
    that CI_t^C = {m in R : |sum_{i=1}^t phi(lambda_i(X_i - m))| <= sum_{i=1}^t lambda_i^2 sigma^2 / 2
    + log(2/alpha)} is a connected (1 - alpha)-confidence sequence (Theorem 9); conversely, Proposition
    16 proves this variance condition is tight because if E[(Y_t - mu)^2 | F_{t-1}] = v_t > (1 + 2 kappa)
    sigma^2 on an event S in F_{t-1} of positive probability, there exists lambda_t > 0 for which E[exp(phi(lambda_t(Y_t
    - mu)) - lambda_t^2 sigma^2 / 2) | F_{t-1}] > 1 on S.'
  evidence:
