claims:
- claim_id: sharp-phase-transition-for-diagonal-thresholding-at-theta-dia-scaling
  kind: scope
  statement: 'Under the generalized k-sparse spiked covariance model Sigma_p = beta z^* z^{*T} + diag(I_k, Gamma_{p-k}) (eq. 5, p. 6) with k = O(p^{1-delta}) for delta in (0, 1), Proposition 1 (p. 8) and Section 3 (pp. 12-16) prove that the diagonal thresholding estimator S_hat(D) selecting the k largest sample diagonal variances D_ell = [Sigma_hat]_{ell,ell} undergoes a sharp phase transition in the control parameter theta_dia(n, p, k) = n / [k^2 log(p - k)] (eq. 10): setting threshold tau_k = beta/(2k), if n > max{(64/(3 beta^2)) k^2 log(p - k), (16/beta^2) k^2 log k} then P[S_hat(D) = S(z^*)] >= 1 - exp(-Theta(k^2 log(p - k))) -> 1 (eq. 11 & p. 13), whereas by the sharp chi-square lower tail bound P[chi_n^2/n > 1 + t] >= (C/sqrt(n)) exp(-n t^2/2) (Lemma 4, p. 14 & Appendix C, p. 34), the one-sided Chebyshev inequality (eq. 19), and noncentral chi_{n,nu^*}^2 conditioning (eq. 20), if n <= theta_ell k^2 log(p - k) then P[S_hat(D) = S(z^*)] <= exp(-Theta(log(p - k))) -> 0 (eq. 12).'
  evidence:
  - source_id: aw2009-sdpspca-pdf
    locator: Section 2.1, Proposition 1 and Figure 1, pp. 7-9; Section 3, Lemma 4 and Proof of Proposition 1, pp. 12-16; Appendix B-C, pp. 33-34
    relation: supports
- claim_id: three-block-primal-dual-witness-certification-of-sdp-signed-support-recovery
  kind: mechanism
  statement: 'To analyze the semidefinite relaxation Z_hat = argmax_{Z in S_+^p, tr(Z)=1} [tr(Sigma_hat Z) - rho_n sum_{i,j} |Z_{ij}|] (eq. 13, p. 9) at regularization parameter rho_n = beta/(2k) (eq. 26, p. 18, yielding post-regularization signal-to-noise ratio alpha = beta - rho_n k = beta/2), Section 4 (Lemmas 5-13, pp. 16-29 & Appendices D-E, G, pp. 34-42, 44-45) constructs a primal-dual witness (Z_hat = z_hat z_hat^T, U_hat(x)) with z_hat = (z_hat_S, 0_{S^c}) for Phi = Sigma_hat - rho_n U_hat - Gamma (eq. 24): (A) on block S x S, setting U_hat_{SS} = sign(z_S^*) sign(z_S^*)^T (eq. 23), Lemma 6 proves that |||Delta_{SS}|||_{infty,infty} <= alpha/10 and |||Delta_{SS}|||_{2,2} -> 0 ensure ||z_hat_S - z_S^*||_infty <= 1/(2 sqrt(k)) (eq. 28) and exact sign recovery sign(z_hat_S) = sign(z_S^*); (B) on block S^c x S, setting U_hat_{S^c S} = (1/rho_n)(Delta_{S^c S} z_tilde_S) sign(z_hat_S)^T with z_tilde_S = z_hat_S / ||z_hat_S||_1 (eq. 30), Lemma 7 proves that |||Delta_{S^c S}|||_{infty,2}
    <= delta/sqrt(k) (delta <= beta/4) guarantees ||U_hat_{S^c S}||_infty <= 4 delta / beta <= 1 and (Delta_{S^c S} - rho_n U_hat_{S^c S}) z_hat_S = 0; and (C) on block S^c x S^c, setting U_hat_{S^c S^c}(x) = sign(v) sign(v)^T and bounding max_{||v||_2<=eta, ||v||_1<=ell} ||n^{-1/2} G_{S^c} v||_2 <= eta + B sqrt(log m / n) ell + eps via the Gordon-Slepian inequality and Gaussian concentration (Lemmas 8 and 13, pp. 20, 24-27), Theorem 2 proves signed support recovery whenever a rank-one solution exists for theta_sdp(n, p, k) = n/[k log(p - k)] > theta_crit (Theorem 2b) and unconditional rank-one uniqueness for theta_dia(n, p, k) > theta_wr (Theorem 2a, Appendix G).'
  evidence:
