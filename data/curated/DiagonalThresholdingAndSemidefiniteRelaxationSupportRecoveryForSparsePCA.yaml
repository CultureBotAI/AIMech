id: AIMech:DiagonalThresholdingAndSemidefiniteRelaxationSupportRecoveryForSparsePCA
name: Diagonal Thresholding and Semidefinite Relaxation Support Recovery for Sparse Principal Components
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Amini-Wainwright Primal-Dual Witness SDP and Diagonal Thresholding Sparse PCA Analysis
- High-Dimensional Spiked Covariance Support Recovery via SDP Relaxation and Diagonal Screening
- Computational-Statistical Phase Transitions for Sparse Principal Component Support Recovery
definition: 'Diagonal Thresholding and Semidefinite Relaxation Support Recovery for Sparse Principal Components is a high-dimensional sparse eigenvector model-selection and primal-dual certification methodology for the generalized k-sparse spiked covariance ensemble Sigma_p = beta z^* z^{*T} + diag(I_k, Gamma_{p-k}) (with z_i^* in {+-1/sqrt(k)} on support S(z^*) of size k, |||Gamma_{p-k}^{1/2}|||_{infty,infty} = O(1), and lambda_max(Gamma_{p-k}) <= min{1, lambda_min(Gamma_{p-k}) + beta/8}). It characterizes and contrasts two tractable decoders from n i.i.d. Gaussian samples x^i ~ N(0, Sigma_p) with sample covariance Sigma_hat = (1/n) sum_{i=1}^n x^i (x^i)^T: (1) Diagonal Thresholding, which selects the k largest sample diagonal entries D_ell = [Sigma_hat]_{ell,ell} in O(n p + p log p) operations and undergoes a sharp 0-1 support-recovery phase transition governed by the rescaled sample size theta_dia(n, p, k) = n / [k^2 log(p - k)] (Proposition 1); and (2) L1-penalized Semidefinite Programming
  (SDP) Relaxation Z_hat = argmax_{Z >= 0, tr(Z)=1} [tr(Sigma_hat Z) - rho_n sum_{i,j} |Z_{ij}|] with regularization parameter rho_n = beta/(2k), which is certified via a three-block primal-dual witness (Z_hat = z_hat z_hat^T, U_hat) and Gordon-Slepian Gaussian comparison to have a unique rank-one solution recovering the exact signed support S_+-(z_hat) = S_+-(z^*) for theta_dia(n, p, k) > theta_wr and to specify S_+-(z^*) whenever a rank-one solution exists for theta_sdp(n, p, k) = n / [k log(p - k)] > theta_crit (Theorem 2), matching up to constants the Fano information-theoretic minimax threshold theta_sdp(n, p, k) < (1 + beta)/beta^2 below which any decoder has error probability at least 1/2 (Theorem 3).'
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Amini & Wainwright (2009, The Annals of Statistics 37(5B):2877-2921; arXiv:0803.4026v2, DOI:10.1214/08-AOS664). Distinct from AIMech:DirectSparsePrincipalComponentAnalysis (d'Aspremont et al. 2007, SIAM Rev. 49(3):434-448), which introduces the deterministic DSPCA conic formulation and Nesterov first-order smoothing solver without high-dimensional statistical scaling or support-recovery guarantees, and from AIMech:SparsePrincipalComponentsAnalysisViaCoordinateVarianceSelectionAndThresholding (Johnstone & Lu 2009, JASA 104(486):682-693), which proves l2 angular consistency under weak-l_q sparsity when p/n -> c, whereas Amini & Wainwright (2009) formulate exact 0-1 signed support recovery in the generalized non-identity spiked model, prove the sharp converse and achievability phase transition theta_dia = n/[k^2 log(p-k)] for diagonal thresholding (Proposition 1), construct the 3-block primal-dual witness
  certificate proving SDP signed support recovery at scaling theta_sdp = n/[k log(p-k)] with rho_n = beta/(2k) (Theorem 2, Lemmas 5-13), and establish the Fano minimax lower bound showing statistical optimality and the computational-versus-statistical efficiency gap (Theorem 3, Lemma 14).
