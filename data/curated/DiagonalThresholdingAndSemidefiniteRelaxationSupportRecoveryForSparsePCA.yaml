    locator: Section 2.2, Theorem 2, pp. 9-11; Section 4, Lemmas 5-13, pp. 16-29; Appendices D, E, and G, Lemmas 15-16, pp. 34-42, 44-45
    relation: supports
- claim_id: fano-information-theoretic-minimax-lower-bound-and-mixture-covariance-spectrum
  kind: scope
  statement: "Section 5 (pp. 30-31) and Appendix F (pp. 42-44) establish the information-theoretic converse (Theorem 3, p. 11): restricting to the sub-collection tilde_S = {S in S | {1, ..., k-1} subset S} of cardinality |tilde_S| = p - k + 1, Lemma 14 (p. 31) proves via an explicit block eigendecomposition (eq. 84, p. 44) that the mixture covariance Sigma_M = E[x x^T] = I_p + (beta/(k |tilde_S|)) Y has exact eigenvalues 1 + beta(k-1)/k + beta/(k(p-k+1)) (multiplicity 1), 1 + beta/(k(p-k+1)) (multiplicity p - k), and 1 (multiplicity k - 1), yielding log det Sigma_M = log(1 + beta) + log(1 - [beta/(1 + beta)][(p - k)/(k(p - k + 1))]) + (p - k) log(1 + beta/(k(p - k + 1))) (eq. 55) and mutual information bound I(U; X^n) <= [beta^2 / (2(1 + beta))](n/k), so that by Fano's inequality any support estimator\u2014including exponential-time exhaustive search over (p choose k) subsets\u2014has error probability at least 1/2 when theta_sdp(n, p, k) = n/[k log(p - k)] < (1 + beta)/beta^2 (eq. 17)."
  evidence:
  - source_id: aw2009-sdpspca-pdf
    locator: Section 2.2, Theorem 3, p. 11; Section 5, Lemma 14 and Proof of Theorem 3, pp. 30-31; Appendix F, Proof of Lemma 14 and Equation (84), pp. 42-44
    relation: supports
