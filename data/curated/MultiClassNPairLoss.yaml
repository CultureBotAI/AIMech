name: Multi-class N-pair loss
definition: A supervised metric-learning objective that averages a joint positive-versus-multiple-negative
  log-softmax loss across a batch of positive pairs drawn from distinct classes.
concept_kind: mathematical_method
identity_notes: This is Sohn’s N-pair-mc objective, Equation (7), together with its distinct-class positive-pair
  batching. The source also uses unqualified N-pair loss for a family including N-pair-ovo, so that family
  name is not an exact alias of this member. Its per-anchor categorical form is shared with generic InfoNCE
  at dot-product scores, but the named supervised batching configuration is retained explicitly. It is
  not the full SimCLR procedure or NT-Xent’s cosine-temperature two-view construction. N-pair-ovo instead
  sums individual pairwise softplus terms. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 218 preceding native IDs/names/aliases. Word-delimited fixed-string searches
  of both full checkouts, including ignored and hidden files, returned 15 lines each in existing discovery/review
  context. Five neighboring native records and five exact AIO nodes with scoped synonyms and outgoing
  edges were inspected.
limitations:
- Use N positive pairs from N distinct classes; other positive-side examples must represent different
  classes for the stated objective. Pair sampling and class selection are part of this configuration,
  not interchangeable with arbitrary augmented-view negatives.
- The main paper uses embedding-norm regularization instead of a hard unit-length constraint. This record
  specifies the loss term; it does not prescribe a regularization coefficient, encoder, optimizer or full
  training schedule.
- No unconditional equivalence to a margin triplet hinge or an information lower bound is asserted. Objective
  shape and label-based batching do not establish downstream accuracy. No training or benchmark was reproduced.
- The proceedings Supplemental.zip inspected during retrieval contains a different paper by Steinhardt
  and Liang. It is not supporting evidence; this record relies on the inspected nine-page N-pair main
  paper.
