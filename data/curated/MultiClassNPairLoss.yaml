claims:
- claim_id: method
  kind: mechanism
  statement: Take N>=2 classes and two examples (x_i,x_i+) from each class. Encode 2N examples to f_i
    and f_i+. The Equation (7) objective is L_mc=(1/N) sum_i log[1+sum_(j!=i) exp(f_i^T f_j+−f_i^T f_i+)].
    Each anchor has its paired positive and N−1 negative candidates from the positive side of other classes.
    Sharing these candidates across anchors forms N tuplets using 2N forward embeddings. Equation (7)
    specifies one orientation; footnote 2 also mentions a symmetric loss that swaps the anchor/positive
    roles, without specifying its aggregation in that footnote. No explicit temperature or cosine normalization
    appears in this expression.
