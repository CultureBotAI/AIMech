id: AIMech:StochasticFactorizedVariationalSparseSpectrumGaussianProcessInference
name: Stochastic factorized variational sparse-spectrum Gaussian-process inference
aliases:
- sfVSSGP
concept_kind: algorithm
definition: The Gal–Turner stochastic extension of factorized variational sparse-spectrum regression that
  estimates its full-data evidence lower bound with uniformly sampled observation minibatches, scaling
  likelihood contributions by the population-to-batch ratio while retaining global KL penalties once.
identity_notes: 'Compared all 442 pinned AIO IDs, names and scoped synonyms and 546 maintained IDs, names
  and aliases; none matches the three proposed identities after normalization. Full-text searches of the
  recovery, older discovery and original Documents checkouts included hidden and ignored files, with 22,
  0 and 0 matched lines. All 21 distinct matched contents were read: pending source leads and source-reading
  context, not existing records. Assessed 50 semantic AIO rows and 172 maintained names/definitions, ten
  full annotated AIO CLASS nodes with incident edges and generated YAML, and five complete native context
  records. Generic mean-field methods and stochastic gradient descent do not identify this finite spectral
  regression procedure. The paired-feature SSGP model and its uncertain-test-input transforms also differ:
  these methods infer uncertain spectral parameters from training data. The three source labels distinguish
  optimal unrestricted coefficient factors, explicit diagonal factors, and data-minibatch optimization.
  Absence is bounded to the searched pin and corpus.'
definition_evidence:
- source_id: gal2015
  locator: Sections 4–5 and explicit three-variant naming in Section 7, PDF pp. 4–5
  relation: supports
claims:
- claim_id: finite-feature-model
  kind: mechanism
  statement: For one squared-exponential component, use K features phi_k(x)=sqrt(2*sigma^2/K)*cos(2*pi*w_k^T*L^{-1}*(x-z_k)+b_k),
    where L=diag(2*pi*l_j), l_j>0, and z_k are feature locations. Independent standardized frequencies
    have prior N(0,I); phases have uniform priors on [0,2*pi]. For N inputs, Phi has shape N by K. Each
    output column y_d has likelihood N(Phi*a_d,tau^{-1}*I), tau>0, with independent unit-Gaussian coefficient
    priors a_d. The variational family separates q(A) from q(omega), omega collecting frequencies and
    phases, and factors q(omega) across k with diagonal-Gaussian frequency factors and uniform phase intervals
    [alpha_k,beta_k] with 0<=alpha_k<beta_k<=2*pi. This is a finite-feature hierarchical regression model;
    integrating its random features does not generally yield the original full-kernel GP.
  evidence:
  - source_id: gal2015
    locator: Sections 2–4, feature construction, Equation 2 and variational family, PDF pp. 2–4
    relation: supports
  - source_id: gal2015-supp
    locator: Propositions 1–2, PDF pp. 1–2
    relation: supports
- claim_id: variational-objective
  kind: mechanism
  statement: The evidence lower bound is the expected Gaussian log likelihood minus KL(q(A)||p(A)) and
    KL(q(omega)||p(omega)). For F=E_q[Phi], H=E_q[Phi^T*Phi], q(a_d)=N(m_d,S_d) and response column y_d,
    its output-d likelihood contribution is -N/2*log(2*pi/tau)-tau/2*[y_d^T*y_d-2*y_d^T*F*m_d+tr(H*(S_d+m_d*m_d^T))].
    Gaussian trigonometric moments and uniform-phase integrals give F and H analytically. Distinct feature
    moments factor under the declared independent spectral factors; a feature’s second moment must be
    computed as E[phi_k^2], not (E[phi_k])^2.
  evidence:
  - source_id: gal2015
    locator: Section 4.1, Equation 6 and diagonal/off-diagonal moments, PDF p. 4
    relation: supports
  - source_id: gal2015-supp
    locator: Identities 1–3, PDF p. 1
    relation: supports
- claim_id: minibatch-estimator
  kind: mechanism
  statement: For a nonempty batch S of uniformly sampled observations, Equation 9 uses (N/|S|)*sum_{n
    in S,d} L_nd-KL(q(A)||p(A))-KL(q(omega)||p(omega)), retaining the explicit diagonal coefficient family
    of fVSSGP. With fixed current variational parameters and the stated uniform sampling, its expectation
    is the full fVSSGP objective; gradient unbiasedness additionally requires valid differentiation under
    expectation. Stochastic optimization updates spectral and coefficient variational parameters using
    this noisy objective or its gradients. A sampled value need not be a lower bound pointwise. Subsampling
    the already collapsed VSSGP log determinant and matrix inverse would be a different estimator.
  evidence:
  - source_id: gal2015
    locator: Section 5, Equations 8–9 and Section 7 sfVSSGP label, PDF p. 5
    relation: supports
- claim_id: predictive-moments
  kind: mechanism
  statement: For a fixed query, let phi be its K-dimensional column feature vector, f=E_q[phi], R=E_q[phi*phi^T],
    and M=[m_1,...,m_D]. Under q(A)q(omega), the response mean is M^T*f and its covariance is tau^{-1}*I+diag_d[tr(R*S_d)]+M^T*(R-f*f^T)*M.
    Shared spectral uncertainty can therefore correlate different outputs even though their coefficient
    factors are independent. These are moments of the variational predictive mixture, which is not generally
    Gaussian; the latent-output covariance omits only the future-observation-noise term.
  evidence:
  - source_id: gal2015
    locator: Section 6, Equations 10–11, PDF p. 5
    relation: supports
  - source_id: gal2015-supp
    locator: Propositions 4–5, PDF pp. 2–3
    relation: supports
- claim_id: implementation-boundary
  kind: scope
  statement: The inspected author model source computes Gaussian-frequency moments with the phase alpha
    fixed inside each cosine; its beta argument does not enter those moments and its objective contains
    frequency KL without a phase KL. Thus that revision implements a fixed-phase conditional variant,
    not integration over the paper’s positive-width uniform phase factors. Its second-moment diagonal
    uses the cosine-square expectation. The optimal-coefficient routine retains a full covariance and
    adds numerical diagonal regularization; source-code reading does not establish an executed result
    or exact correspondence to every published experiment.
  evidence:
  - source_id: author-implementation
    locator: get_EPhi, lines 61–78; get_opt_A, lines 80–85; get_model and get_model_exact_A, lines 87–131
    relation: supports
  - source_id: gal2015
    locator: Experimental setup, fixed randomized phases, Section 8.1, PDF p. 6
    relation: supports
