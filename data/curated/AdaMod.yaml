id: AIMech:AdaMod
name: AdaMod
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive stochastic gradient optimization algorithm that restricts extreme coordinate-wise adaptive learning rates eta_t = alpha_t / (sqrt(v_hat_t) + epsilon) by maintaining an uncorrected exponential moving average s_t = beta_3 s_{t-1} + (1 - beta_3) eta_t (with s_0 = 0 and smoothing hyperparameter beta_3 in (0, 1)) of historical adaptive step sizes and clipping each coordinate's effective step size from above via eta_hat_t = min(eta_t, s_t) before updating parameters x_t = x_{t-1} - eta_hat_t odot m_hat_t.
identity_notes: Distinct from AdaBound/AMSBound (AIMech:AdaBoundAndAMSBound, which clips step sizes to a deterministic scalar schedule [eta_l(t), eta_u(t)] converging to vanilla SGD) and from RAdam (AIMech:RectifiedAdam, which uses an analytical tractable-variance switch at rho_t > 4). AdaMod preserves per-coordinate adaptive step-size heterogeneity throughout training while using the uncorrected EMA s_t = (1 - beta_3) sum_{k=0}^{t-1} beta_3^k eta_{t-k} both as an automatic early-stage warmup ramp and as a dynamic momental upper bound against anomalous gradient-induced learning-rate spikes.
aliases:
- Adaptive and Momental Bound Method for Stochastic Learning
- Momental Step-Size Upper-Bounded Adaptive Optimization
- Exponentially Smoothed Learning-Rate Clipped Adam
