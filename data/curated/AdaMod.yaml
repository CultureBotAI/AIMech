claims:
- claim_id: adamod-momental-step-size-upper-bound-mechanism
  kind: mechanism
  statement: At iteration t, AdaMod computes the bias-corrected first and second moments m_hat_t = m_t / (1 - beta_1^t) and v_hat_t = v_t / (1 - beta_2^t), forms the raw adaptive learning rate vector eta_t = alpha_t / (sqrt(v_hat_t) + epsilon), updates the uncorrected exponential moving average s_t = beta_3 s_{t-1} + (1 - beta_3) eta_t = (1 - beta_3) sum_{k=0}^{t-1} beta_3^k eta_{t-k} with s_0 = 0, caps the step size via eta_hat_t = min(eta_t, s_t), and updates parameters via x_t = x_{t-1} - eta_hat_t odot m_hat_t, reducing exactly to Adam when beta_3 = 0.
  evidence:
  - source_id: r613-primary-pdf
    locator: Methods Section, Algorithm 2 and Equations 1-3, p. 3
    relation: supports
  - source_id: r613-metadata-cr
    locator: Bibliographic metadata for Ding et al. 2019
    relation: supports
- claim_id: adamod-intrinsic-warmup-and-spike-suppression-scope
  kind: scope
  statement: Because s_0 = 0 is intentionally left without bias correction, s_t starts at (1 - beta_3) eta_1 (reducing initial step-size spikes above 10^4 by a factor of 1 - beta_3 in {10^{-3}, 10^{-4}} for beta_3 in {0.999, 0.9999}) and acts as a long-term memory filter over approximately 1 / (1 - beta_3) steps that prevents sudden large learning-rate spikes when v_hat_t is transiently small.
  evidence:
  - source_id: r613-primary-pdf
    locator: Introduction (Figure 1) and Empirical Analysis on Learning Rates (Figures 2-3), p. 1-5
    relation: supports
- claim_id: adamod-vision-lm-and-unwarmed-transformer-applications
  kind: application
  statement: AdaMod improves test accuracy and perplexity over Adam, AMSGrad, and AdaBound on CIFAR-10 and CIFAR-100 (ResNet-34 and DenseNet-121), ImageNet (ResNet-18), Penn Treebank LSTM language modeling (1-, 2-, and 3-layer LSTMs), and WMT14 English-to-German and IWSLT14 German-to-English Transformer neural machine translation without requiring a manual learning-rate warmup schedule.
  evidence:
  - source_id: r613-primary-pdf
    locator: Experiments Section, Figures 4-8 and Tables 1-3, p. 4-9
    relation: supports
- claim_id: adamod-extra-state-vector-and-beta3-memory-horizon-limitation
  kind: limitation
  statement: AdaMod requires maintaining a third per-parameter state vector s_t alongside m_t and v_t (increasing optimizer state memory from 2P to 3P floats) and introduces the memory-horizon hyperparameter beta_3 whose effective window length 1 / (1 - beta_3) must align with the training horizon.
  evidence:
  - source_id: r613-primary-pdf
    locator: Methods Section (Algorithm 2) and Experiments Section (Table 3), p. 3, 8-9
    relation: supports
