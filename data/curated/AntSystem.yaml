claims:
- claim_id: method
  kind: mechanism
  statement: In the inspected positive-distance traveling-salesman formulation, place m ants at starting
    cities and initialize pheromone trails. An ant at city i samples an unvisited city j with probability
    proportional to tau_ij^alpha * eta_ij^beta, where eta_ij=1/d_ij; normalize over the currently unvisited
    cities. Each ant stores its visited cities and returns to its start after visiting every city. After
    all tours are complete, the ant-cycle rule updates every trail as tau_ij_new=rho*tau_ij+sum_k delta_tau_ij_k,
    with delta_tau_ij_k=Q/L_k if ant k used that edge and zero otherwise. Here rho is retention, 1−rho
    is evaporation, and L_k is the completed tour length. Reset tour-specific visited lists and deposit
    accumulators for the next iteration while retaining the best tour found. Ant-density instead deposits
    a constant Q per traversed edge at each step; ant-quantity deposits Q/d_ij per step. Those variants
    do not use the ant-cycle complete-tour deposit.
