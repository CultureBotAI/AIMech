name: Ant System
definition: A constructive combinatorial optimization method in which artificial ants sample solution
  components using shared pheromone trails and problem-specific heuristic information, then modify those
  trails through reinforcement and evaporation.
concept_kind: algorithm
identity_notes: This record covers Ant System through its canonical ant-cycle traveling-salesman formulation.
  Ant-density and ant-quantity are named variants in the same source; their per-step deposits are not
  substituted for the ant-cycle update. Ant System is a specific predecessor within ant-colony optimization,
  not an alias for every later ant algorithm. Its visited-city list enforces tour feasibility and is not
  the generic Tabu Search framework. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 288 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 10 and 10 lines respectively. Every
  text hit was a prior candidate lead. Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and five native neighboring mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.
limitations:
- The displayed inverse-distance and inverse-tour-length expressions require positive finite distances
  and tour lengths. Probability normalization needs finite nonnegative weights with a positive total.
  Zero pheromone, underflow or infeasible candidates require explicit handling.
- Setting alpha=0 removes pheromone dependence; it leaves heuristic-weighted random selection, not a deterministic
  nearest-neighbor rule. Equal initial pheromone likewise does not imply uniform selection when heuristic
  values differ.
- All-ant reinforcement can concentrate search prematurely. A best-so-far archive is not an optimality
  certificate; the source’s empirical convergence discussion does not establish a general finite-budget
  optimum. Evaporation alone does not ensure every feasible solution retains positive sampling probability.
- Representation, heuristic, parameters, start placement, constraints, tie conventions, stopping and update
  order define a concrete implementation. The natural-ant analogy and the source’s application claims
  are not independent validation or a universal performance guarantee.
