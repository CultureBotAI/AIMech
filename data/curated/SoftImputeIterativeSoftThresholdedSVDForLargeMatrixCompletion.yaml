claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'For any matrix W = U D V^T in R^{m x n} and regularization parameter lambda >= 0, the unique global minimizer of (1/2)||W - Z||_F^2 + lambda ||Z||_* is given by the soft-thresholded SVD operator S_lambda(W) = U D_lambda V^T with D_lambda = diag(max(d_i - lambda, 0)) (Lemma 1), and by the von Neumann trace inequality tr(A^T B) <= sum_i sigma_i(A) sigma_i(B) (Lemma 6), S_lambda is globally non-expansive in Frobenius norm: ||S_lambda(W_1) - S_lambda(W_2)||_F^2 <= ||W_1 - W_2||_F^2 for all W_1, W_2 (Lemma 3).'
  evidence:
  - source_id: r339-primary-pdf
    locator: Section 2, Lemma 1, p. 2290; Section 4, Lemma 3, p. 2296; Appendix A.2, Proof of Lemma 3 and Lemma 6 (Equations 16-22), pp. 2313-2317
    relation: supports
  - source_id: r339-arxiv-abs
    locator: 'Abstract: Soft-thresholded SVD iteratively replaces missing elements with current low-rank guesses and solves nuclear-norm regularized least squares'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: Each Soft-Impute update Z^{k+1} = S_lambda(P_Omega(X) + P_Omega^perp(Z^k)) minimizes the quadratic majorizer Q_lambda(Z | Z^k) = (1/2)||P_Omega(X) + P_Omega^perp(Z^k) - Z||_F^2 + lambda ||Z||_*, satisfies the monotonic descent bound f_lambda(Z^k) - f_lambda(Z^{k+1}) >= (1/2)||P_Omega(Z^k - Z^{k+1})||_F^2 (Lemma 2 and Proof of Lemma 4), satisfies the non-increasing step-difference property ||Z^{k+1} - Z^k||_F <= ||Z^k - Z^{k-1}||_F with ||Z^{k+1} - Z^k||_F -> 0 (Lemma 4), and converges to a global solution Z_lambda^* of min_Z f_lambda(Z) (Theorem 1).
  evidence:
  - source_id: r339-primary-pdf
    locator: Section 4, Lemmas 2, 4, 5 and Theorem 1 (Equations 12-15), pp. 2295-2298; Appendix A.1 and A.3-A.5, pp. 2313, 2317-2319
    relation: supports
  - source_id: r339-metadata-cr
    locator: Bibliographic record for Mazumder, Hastie, & Tibshirani (JMLR 2010, Vol. 11, pp. 2287-2322)
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Because nuclear-norm penalization shrinks all positive singular values by the same additive amount lambda (soft-thresholding d_i -> max(d_i - lambda, 0)), large signal singular values suffer shrinkage bias on noisy matrices, motivating post-processing unshrunk least-squares refitting on the active singular vectors or non-convex hard-thresholding.
  evidence:
  - source_id: r339-primary-pdf
    locator: Section 5, Post-Processing of Selectors and Comparison with Hard-Thresholding (Equations 23-24), pp. 2298-2301
    relation: supports
