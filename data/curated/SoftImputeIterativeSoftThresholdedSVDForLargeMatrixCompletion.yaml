id: AIMech:SoftImputeIterativeSoftThresholdedSVDForLargeMatrixCompletion
name: Soft-Impute Iterative Soft-Thresholded SVD for Large Matrix Completion
concept_kind: algorithm
review_status: DRAFT
definition: Soft-Impute Iterative Soft-Thresholded SVD for Large Matrix Completion is a convex spectral-regularization and majorization-minimization (EM-style) algorithm introduced by Mazumder, Hastie, and Tibshirani (2010) for solving the nuclear-norm regularized least-squares matrix completion problem min_{Z in R^{m x n}} f_lambda(Z) = (1/2) ||P_Omega(X) - P_Omega(Z)||_F^2 + lambda ||Z||_* across a warm-started path of regularization parameters lambda_1 > lambda_2 > ... > lambda_K. At each iteration, Algorithm 1 forms the surrogate completed matrix W^{old} = P_Omega(X) + P_Omega^perp(Z^{old}) by filling in missing entries with the current low-rank estimate Z^{old} and updates Z^{new} = S_lambda(W^{old}) = U D_lambda V^T via the singular value soft-thresholding operator D_lambda = diag(max(d_i - lambda, 0)) (Lemma 1). To scale to Netflix-sized matrices without destroying sparsity, Section 3.1 exploits the exact sparse-plus-low-rank decomposition W^{old} = [P_Omega(X) - P_Omega(Z^{old})] + Z^{old}, where the first term has |Omega| << m n nonzeros and the second term has low rank r << min(m, n), allowing Lanczos/PROPACK matrix-vector products in O(|Omega| r + (m + n) r^2) time per SVD step. Lemmas 2-5 and Theorem 1 prove that the Soft-Thresholded SVD operator S_lambda is non-expansive in Frobenius norm (||S_lambda(W_1) - S_lambda(W_2)||_F <= ||W_1 - W_2||_F), generates monotonically decreasing objectives f_lambda(Z^{k+1}) <= f_lambda(Z^k) - (1/2)||P_Omega(Z^{k+1} - Z^k)||_F^2, satisfies ||Z^{k+1} - Z^k||_F -> 0, and converges from any starting point to a global minimizer Z_lambda^* of f_lambda(Z).
identity_notes: Distinct from Singular Value Thresholding Algorithm for Matrix Completion (`AIMech:SingularValueThresholdingAlgorithmForMatrixCompletion`), which solves the equality-constrained Uzawa dual subgradient iteration Y^k = Y^{k-1} + delta_k P_Omega(X - Z^k) on sparse dual matrices rather than the unconstrained majorization-minimization update Z^{k+1} = S_lambda(P_Omega(X) + P_Omega^perp(Z^k)) with sparse-plus-low-rank Lanczos decomposition and warm-started regularization paths. Also distinct from AltMinSense and AltMinComplete Alternating Minimization for Low-Rank Matrix Sensing and Completion (`AIMech:AltMinSenseAndAltMinCompleteAlternatingMinimizationForLowRankMatrixSensingAndCompletion`), which performs non-convex fixed-rank alternating least squares without nuclear-norm soft-thresholding.
aliases:
- Soft-Impute Nuclear-Norm Regularized Matrix Completion (Mazumder-Hastie-Tibshirani)
- Iterative Soft-Thresholded SVD EM/MM Algorithm for Incomplete Matrices
- Sparse-Plus-Low-Rank Decomposition Soft-Impute Path
