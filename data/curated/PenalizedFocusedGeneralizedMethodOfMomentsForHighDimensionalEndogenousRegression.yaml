claims:
- claim_id: necessary-gradient-condition-and-inconsistency-of-penalized-least-squares-under-endogeneity
  kind: mechanism
  statement: For any loss function $L_n(\boldsymbol{\beta})$ that is twice differentiable in a neighborhood of $\boldsymbol{\beta}_0$ with bounded largest sparse eigenvalue $\lambda_{\max}(\partial^2 L_n(\boldsymbol{\beta}) / \partial\boldsymbol{\beta}_S^2) = O_p(1)$ and any folded-concave penalty $P_n$ satisfying $P_n'(0^+) = o(1)$, Theorem 2.1 (Section 2, p. 6, Equation 2.1) proves that a necessary condition for variable-selection consistency ($P(\operatorname{supp}(\widehat{\boldsymbol{\beta}}) = S) \to 1$ and $\|\widehat{\boldsymbol{\beta}}_S - \boldsymbol{\beta}_{0S}\| \xrightarrow{p} 0$) is $|\partial L_n(\boldsymbol{\beta}_0) / \partial\beta_l| \xrightarrow{p} 0$ for all $l = 1, \dots, p$. Specializing to $L_n(\boldsymbol{\beta}) = \frac{1}{n}\|\mathbf{Y} - \mathbf{X}\boldsymbol{\beta}\|^2$, Theorem 2.2 (p. 7) proves that if there exists even one unimportant regressor $l \notin S$ that is endogenous ($|\mathbb{E}(X_l\varepsilon)| > c > 0$ for $\varepsilon = Y - \mathbf{X}_S^T\boldsymbol{\beta}_{0S}$), then for any sequences $\lambda_n > 0$ and $a_n > 0$, $\limsup_{n\to\infty} P(\widehat{\boldsymbol{\beta}}_{\mathrm{PLS}} \text{ is Model Selection Consistent}) < 1$.
  evidence:
  - source_id: fl2014-fgmm-pdf
    locator: Section 2, pp. 5-8, Condition 2.1, Equation (2.1), Theorems 2.1-2.2; Appendix A, pp. 26-29
    relation: supports
- claim_id: focused-gmm-oracle-property-and-near-global-overidentified-optimality
  kind: scope
  statement: "Under the conditional moment restriction $\\mathbb{E}[g(Y, \\mathbf{X}_S^T\\boldsymbol{\\beta}_{0S}) | \\mathbf{W}] = 0$, the FGMM loss $L_{\\mathrm{FGMM}}(\\boldsymbol{\\beta})$ (Equation 3.3) includes two instrument conditions $f_j(\\mathbf{W})$ and $h_j(\\mathbf{W})$ per active regressor $\\beta_j \\ne 0$, creating $2|\\operatorname{supp}(\\boldsymbol{\\beta})|$ over-identifying equations that prevent the zero-loss overfitting of naive GMM when $|\\operatorname{supp}(\\boldsymbol{\\beta})| \\ge |\\mathbf{V}|$ while avoiding accumulation of $O_p(\\sqrt{p / n})$ estimation noise from unimportant regressors $j \\notin S$. Under Assumptions 4.1\u20134.6 with $s^3 \\log p = o(n)$ and signal strength $d_n \\gg \\lambda_n$, Theorem 4.1 (p. 16) establishes the oracle property $P(\\widehat{S} = S) \\to 1$ and $\\sqrt{n}\\boldsymbol{\\alpha}^T\\boldsymbol{\\Gamma}^{-1/2}\\boldsymbol{\\Sigma}(\\widehat{\\boldsymbol{\\beta}}_S - \\boldsymbol{\\beta}_{0S}) \\xrightarrow{d} N(0, 1)$ for a local minimizer, and Theorem 5.1 (p. 18) proves under over-identification Assumptions 5.1\u20135.2 that the global minimizer on $\\Theta_r = \\{\\boldsymbol{\\beta} : \\|\\boldsymbol{\\beta}\\|_0 \\le r_n\\}$ coincides with this oracle estimator with probability approaching 1."
  evidence:
  - source_id: fl2014-fgmm-pdf
    locator: Section 3, pp. 8-13, Equations (3.1)-(3.8); Section 4, pp. 13-17, Theorem 4.1; Section 5, pp. 17-19, Theorem 5.1; Appendices B-C, pp. 29-39
    relation: supports
- claim_id: post-fgmm-semiparametric-efficiency-and-smoothed-coordinate-descent-convergence
  kind: mechanism
  statement: Let $\mathbf{D}(\mathbf{W}) = \mathbb{E}[\nabla_{\boldsymbol{\beta}_S} g(Y, \mathbf{X}_S^T\boldsymbol{\beta}_{0S}) | \mathbf{W}]$ and $\sigma^2(\mathbf{W}) = \mathbb{E}[g(Y, \mathbf{X}_S^T\boldsymbol{\beta}_{0S})^2 | \mathbf{W}]$ with optimal instrument vector $\mathbf{A}^*(\mathbf{W}) = \sigma^{-2}(\mathbf{W})\mathbf{D}(\mathbf{W})$ (Section 6, p. 19). Using the first-stage FGMM estimator $\widehat{\boldsymbol{\beta}}$ to recover $\widehat{S} = S$ and form nonparametrically estimated optimal instruments $\widehat{\mathbf{A}}_i = \widehat{\sigma}(\mathbf{W}_i)^{-2}\widehat{\mathbf{D}}(\mathbf{W}_i)$, the two-step Post-FGMM estimator $\widehat{\boldsymbol{\beta}}_S^* = \arg\min_{\boldsymbol{\beta}_S} \left[\frac{1}{n}\sum_{i=1}^n g(Y_i, \mathbf{X}_{i,\widehat{S}}^T\boldsymbol{\beta}_S)\widehat{\mathbf{A}}_i\right]^T\left[\frac{1}{n}\sum_{i=1}^n g(Y_i, \mathbf{X}_{i,\widehat{S}}^T\boldsymbol{\beta}_S)\widehat{\mathbf{A}}_i\right]$ (Equation 6.2) achieves Chamberlain's (1987) semiparametric efficiency bound $\sqrt{n}(\widehat{\boldsymbol{\beta}}_S^* - \boldsymbol{\beta}_{0S}) \xrightarrow{d} N\left(0, \left[\mathbb{E}(\sigma(\mathbf{W})^{-2}\mathbf{D}(\mathbf{W})\mathbf{D}(\mathbf{W})^T)\right]^{-1}\right)$ when $s$ is fixed (Theorem 6.1, p. 20). Moreover, replacing $I_{(\beta_j \ne 0)}$ in Equation (3.3) with a smooth approximation $K(\beta_j^2 / h_n)$ satisfying $K(0) = 0$ and $K(t) = 1$ for $t > 1$ yields $Q_K(\boldsymbol{\beta})$ (Equation 7.1), which preserves exact selection consistency (Theorem 7.1, p. 21) and Cauchy coordinate-descent convergence $\|\boldsymbol{\beta}^{(m+1)} - \boldsymbol{\beta}^{(m)}\| \to 0$ (Theorem 7.2, p. 23).
  evidence:
  - source_id: fl2014-fgmm-pdf
    locator: Section 6, pp. 19-20, Equations (6.1)-(6.2), Theorem 6.1; Section 7, pp. 21-24, Equations (7.1)-(7.3), Theorems 7.1-7.2; Appendices D-E, pp. 39-44
    relation: supports
