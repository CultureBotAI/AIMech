id: AIMech:PenalizedFocusedGeneralizedMethodOfMomentsForHighDimensionalEndogenousRegression
name: Penalized Focused Generalized Method of Moments (FGMM) for High-Dimensional Endogenous Regression
concept_kind: algorithm
review_status: DRAFT
definition: "A high-dimensional variable-selection and over-identified estimation methodology (introduced by Jianqing Fan and Yuan Liao in 2014) for linear and nonlinear single-index structural models satisfying $\\mathbb{E}[g(Y, \\mathbf{X}_S^T\\boldsymbol{\\beta}_{0S}) | \\mathbf{W}] = 0$ with endogenous regressors ($p \\gg n$, $|S| = s \\ll n$) and auxiliary instruments $\\mathbf{W}$. After proving that any penalized empirical risk $\\min_{\\boldsymbol{\\beta}} L_n(\\boldsymbol{\\beta}) + \\sum_{j=1}^p P_n(|\\beta_j|)$ requires the necessary condition $|\\partial L_n(\\boldsymbol{\\beta}_0) / \\partial \\beta_l| \\xrightarrow{p} 0$ for all $l \\le p$ to be selection consistent (Theorem 2.1, Equation 2.1) and hence that Penalized Least Squares is inconsistent whenever any unimportant regressor $X_l$ ($l \\notin S$) is endogenous ($|\\mathbb{E}(X_l\\varepsilon)| > c > 0$, Theorem 2.2), FGMM constructs two instrument transformation vectors $\\mathbf{F} = (f_1(\\mathbf{W}), \\dots, f_p(\\mathbf{W}))^T$ and $\\mathbf{H} = (h_1(\\mathbf{W}), \\dots, h_p(\\mathbf{W}))^T$ and a $\\boldsymbol{\\beta}$-dependent working instrument vector $\\mathbf{V}_i(\\boldsymbol{\\beta}) = (\\mathbf{F}_i(\\boldsymbol{\\beta})^T, \\mathbf{H}_i(\\boldsymbol{\\beta})^T)^T$ supported only on $\\operatorname{supp}(\\boldsymbol{\\beta})$ (Section 3, Equations 3.1\u20133.2). Minimizing $Q_{\\mathrm{FGMM}}(\\boldsymbol{\\beta}) = L_{\\mathrm{FGMM}}(\\boldsymbol{\\beta}) + \\sum_{j=1}^p P_n(|\\beta_j|)$ where $L_{\\mathrm{FGMM}}(\\boldsymbol{\\beta}) = \\sum_{j=1}^p I_{(\\beta_j \\ne 0)}\\left\\{w_{j1}\\left[\\frac{1}{n}\\sum_{i=1}^n g(Y_i, \\mathbf{X}_i^T\\boldsymbol{\\beta})f_j(\\mathbf{W}_i)\\right]^2 + w_{j2}\\left[\\frac{1}{n}\\sum_{i=1}^n g(Y_i, \\mathbf{X}_i^T\\boldsymbol{\\beta})h_j(\\mathbf{W}_i)\\right]^2\\right\\}$ (Equations 3.3\u20133.4) with a folded-concave penalty $P_n$ (SCAD or MCP) focuses over-identifying moments on the active support, achieves the oracle property $P(\\widehat{S} = S) \\to 1$ and asymptotic normality when $s^3 \\log p = o(n)$ without irrepresentable conditions (Theorems 4.1 and 5.1), attains Chamberlain's semiparametric efficiency bound via two-step Post-FGMM (Theorem 6.1, Equation 6.2), and admits a smoothed surrogate $Q_K(\\boldsymbol{\\beta})$ with $K(\\beta_j^2 / h_n)$ for coordinate descent (Theorems 7.1 and 7.2)."
identity_notes: Resolved against all 442 pinned AIO concepts and 667 maintained AIMech concepts. Distinct from `AIMech:SelfTuningPivotalHighDimensionalInstrumentalVariablesAndSensitivityConfidenceSets` (Gautier & Rose 2011/2021, which solves a convex conic program with $\ell_\infty$ instrument-residual constraints across all $d_Z$ instruments simultaneously, rather than restricting moment equations to $\operatorname{supp}(\boldsymbol{\beta})$ via indicator-weighted $I_{(\beta_j \ne 0)}$ over-identified quadratic forms and folded-concave penalties to achieve the nonconcave oracle property and Chamberlain's semiparametric efficiency bound), distinct from `AIMech:SelfNormalizedLassoOptimalInstrumentEstimationAndSupNormWeakIdentificationTesting` (Belloni, Chen, Chernozhukov, & Hansen 2012, which estimates first-stage optimal instruments for a low-dimensional endogenous regressor vector rather than variable selection among $p \gg n$ endogenous regressors), distinct from `AIMech:SomeInvalidSomeValidInstrumentalVariablesEstimatorAndMajorityRuleIdentifiability` (Kang, Zhang, Cai, & Small 2016, which estimates a scalar causal effect under invalid instruments via majority-rule $\ell_1$ penalization), and distinct from `AIMech:NonconcavePenalizedLikelihoodInUltrahighDimensionalVariableSelection` (Fan & Lv 2011, which studies exogenous generalized linear models where $\mathbb{E}[\partial L_n(\boldsymbol{\beta}_0) / \partial\boldsymbol{\beta}] = 0$ holds automatically).
