    locator: Section 3, pages 9–11, Conjecture 3.2 and Figure 2; Section 4.1, pages 12–13, Proposition
      4.1, Equation (8), and Figure 3
    relation: supports
  - source_id: blanchard-dickhaus-roquain-villers2014-ar5iv
