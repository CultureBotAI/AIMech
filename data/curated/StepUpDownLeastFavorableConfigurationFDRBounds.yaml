aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Step-up-down multiple testing procedures and their least favorable configuration and non-asymptotic
    perturbation bounds directly control the False Discovery Rate across simultaneous hypothesis tests,
    preventing multiplicity-induced false positives (AIO:DataDredgingBias).
limitations:
- As proved in Proposition 4.1 (Section 4.1, Equation (8), Figure 3), the Dirac-uniform configuration
  (F == 1) is NOT a finite-sample least favorable configuration for intermediate linear step-up-down procedures
  LSUD_lambda (e.g., for m = 10, m_0 = 7, alpha = 0.5, lambda in {3, 4, 5, 6, 7, 8, 9}), so evaluating
  finite-sample FDR solely at F == 1 can underestimate the maximum finite-sample FDR over F in F.
- The explicit convergence rate O((1 - zeta_m)^{-1} sqrt((log m) / m)) in Corollary 4.5 requires (1 -
  zeta_m)^{-1} sqrt((log m) / m) = o(1) and therefore excludes the highly sparse regime where the true-null
  proportion zeta_m approaches 1 faster than 1 - sqrt((log m) / m) (Section 4.3, page 17).
- For the Finner-Dickhaus-Roters asymptotically optimal rejection curve (AORC) rho(u) = alpha u / (1 -
  u(1 - alpha)), the perturbation bound in Theorem 4.4 vanishes only when the step-up-down order satisfies
  lambda_m / m < v_delta = 1 - delta alpha / (zeta - alpha) + O(delta^2), requiring the additional condition
  (1 - lambda_m / m)^{-1} sqrt((log m) / m) = o(1) (Section 4.2–4.3, pages 16–17).
- 'All 33 pages of the PDF and all 987 lines of the ar5iv HTML of Blanchard, Dickhaus, Roquain, & Villers
  (2014, Statistica Sinica 24(1):1-23, arXiv:1108.5262v1, DOI:10.5705/ss.2011.205) were read. Constructed
  numerical checks in research/discovery/step-up-down-least-favorable-configuration-fdr-bounds-boundaries.py
  verify (1) Proposition 5.1 two-population generalized Steck recursion and Corollary 5.3 exact finite-sample
  SUD FDR formulas in FM(10, 7, F) and RM(10, 0.7, F), (2) Proposition 4.1 counterexample across lambda
  in [3, 4, 5, 6, 7, 8, 9] where FDR(LSUD_lambda, F(x)=x) > FDR(LSUD_lambda, F==1) (at lambda = 4: FM
  0.342981 > 0.32985, RM 0.342981 > 0.33406), (3) Lemma 4.3 continuous fixed-point bracketing on the Figure
  6 configuration (at lambda = 4: U_lower = 0.4 <= hat_k/m = 0.7 <= U_upper = 0.8), (4) Theorem 4.4 and
  Corollary 4.5 O(sqrt((log m)/m)) decay across m in {100, 1000, 10000, 100000} (at m = 100000: bound
  = 0.007018, scaled ratio = 0.654045), and (5) Lemma B.1 extreme configuration where FDR(SD) = 0.790285
  > FDR(SU) = 0.7 at t_0 = 0.2 > 0.158018.'
