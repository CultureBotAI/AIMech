id: AIMech:StepUpDownLeastFavorableConfigurationFDRBounds
name: Step-up-down least favorable configuration and two-population Steck false discovery rate bounds
aliases:
- Blanchard-Dickhaus-Roquain-Villers Step-Up-Down LFC Framework
- Two-Population Generalized Steck's Recursion for Step-Up-Down FDR
- Non-Asymptotic Perturbation Bounds for Step-Up-Down Multiple Testing
concept_kind: mathematical_method
definition: 'A finite-sample and non-asymptotic statistical multiple-testing framework developed by Gilles
  Blanchard, Thorsten Dickhaus, Etienne Roquain, and Fanny Villers (2014, Statistica Sinica 24(1):1-23,
  arXiv:1108.5262v1, DOI:10.5705/ss.2011.205) that evaluates and bounds the False Discovery Rate (FDR)
  of step-up-down procedures SUD_lambda(t) of order lambda in {1, ..., m} under two-group fixed-mixture
  FM(m, m_0, F) and random-mixture RM(m, pi_0, F) independent p-value models: (1) generalizes Steck''s
  order-statistic recursion to two heterogeneous populations (k_0 uniform true nulls and k - k_0 alternatives
  with c.d.f. F; Proposition 5.1, Equation (18)) to compute exact finite-sample joint (V, R) distributions
  and exact FDR(SUD_lambda(t)) (Theorem 5.2, Corollary 5.3); (2) disproves the conjecture (Conjecture
  3.2) that the Dirac-uniform configuration (F == 1) is a universal finite-sample least favorable configuration
  (LFC) for intermediate linear step-up-down procedures LSUD_lambda (Proposition 4.1); and (3) brackets
  the discrete rejection fraction hat_k/m via the continuous fixed-point functional U(ell, G) (Definition
  4.2, Lemma 4.3) to prove explicit Dvoretzky-Kiefer-Wolfowitz perturbation bounds (Theorem 4.4) and O((1
  - zeta_m)^{-1} sqrt((log m) / m)) convergence rates (Corollary 4.5) quantifying the maximum excess of
  FDR(SUD_lambda(t), F) over FDR(SUD_lambda(t), F == 1) for both Simes linear and Finner-Dickhaus-Roters
  asymptotically optimal rejection curves (AORC).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 596 previously curated AIMech concepts.
  While AIMech:SelfConsistencyAndDependencyControlFDRFramework (Blanchard & Roquain 2008), AIMech:OneAndTwoStageAdaptiveStepUpFDRUnderDependence
  (Blanchard & Roquain 2009), and AIMech:ContinuumMeasureSpaceStepUpFDRControl (Blanchard, Delattre, &
  Roquain 2014) establish FDR control for step-up and step-down procedures under self-consistency, dependency
  control, or continuum weak PRDS, none of those records analyze the least favorable alternative configuration
  (LFC) problem for intermediate step-up-down procedures SUD_lambda(t) (1 < lambda < m), derive the polynomial-time
  two-population generalized Steck recursion Psi_{k, k_0, F}(t_1, ..., t_k) (Proposition 5.1), disprove
  the finite-sample Dirac-uniform LFC conjecture for LSUD_lambda (Proposition 4.1), or establish the continuous
  fixed-point bracketing U(lambda/m, hat_G_m) <= hat_k/m <= U(lambda/m, (hat_G_m + m^{-1}) wedge 1) and
  DKW perturbation bounds (Lemma 4.3, Theorem 4.4, Corollary 4.5).
