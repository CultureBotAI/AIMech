claims:
- claim_id: two-population-steck-recursion-and-exact-sud-fdr
  kind: mechanism
  statement: For 0 <= k_0 <= k and independent variables (U_i)_{1 <= i <= k} comprising k_0 i.i.d. Uniform(0,
    1) true null p-values and k - k_0 i.i.d. alternative p-values with continuous c.d.f. F, Proposition
    5.1 (Equation (18)) proves that the joint order-statistic probability Psi_{k, k_0, F}(t_1, ..., t_k)
    = P(U_{(1)} <= t_1, ..., U_{(k)} <= t_k) satisfies the polynomial-time recursion Psi_{k, k_0, F}(t_1,
    ..., t_k) = (t_k)^{k_0} F(t_k)^{k - k_0} - sum_{0 <= j_0 <= j <= k - 2, j_0 <= k_0, j - j_0 <= k -
    k_0} comb(k_0, j_0) comb(k - k_0, j - j_0) (t_k - t_{j+1})^{k_0 - j_0} (F(t_k) - F(t_{j+1}))^{k -
    k_0 - j + j_0} Psi_{j, j_0, F}(t_1, ..., t_j) (with Psi_{0,0,F}(.) = 1 and 0^0 = 1), which combines
    with the step-up/step-down event partition {p_{(lambda)} > t_lambda} cup {p_{(lambda)} <= t_lambda}
    (Equation (25), Theorem 5.2, and Corollary 5.3, Equations (19)-(27)) to give exact finite-sample formulas
    for FDR(SUD_lambda(t)) and P(FDP(SUD_lambda(t)) <= x) (Appendix A, Corollary A.1) in both FM(m, m_0,
    F) and RM(m, pi_0, F).
  evidence:
