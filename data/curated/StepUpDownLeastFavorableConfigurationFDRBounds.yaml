    relation: supports
- claim_id: continuous-threshold-bracketing-and-dkw-perturbation-bound
  kind: mechanism
  statement: 'For any continuous non-decreasing critical value function rho: [0, 1] -> [0, 1] such that
    x -> rho(x)/x is non-decreasing and t_k = rho(k/m), Definition 4.2 and Lemma 4.3 (Equations (9)-(10))
    prove that the continuous fixed-point functional U(ell, G) = min{u in [ell, 1] : G(rho(u)) <= u} if
    G(rho(ell)) >= ell else max{u in [0, ell] : G(rho(u)) >= u} brackets the discrete rejection fraction
    hat_k / m via U(lambda/m, hat_G_m) <= hat_k / m <= U(lambda/m, (hat_G_m + m^{-1}) wedge 1). Combining
    this bracketing with Massart''s (1990) tight constant 2 in the Dvoretzky-Kiefer-Wolfowitz inequality
    around G_zeta^{DU}(x) = (1 - zeta) + zeta x, Theorem 4.4 (Equations (11)-(13)) proves that for any
    F in F, lambda in {1, ..., m}, zeta in (0, 1), and delta in (0, 1), FDR(SUD_lambda(t), m_0, F) <=
    FDR(SUD_lambda(t), m_0, F == 1) + (m_0/m) varepsilon(delta, m, zeta, nu) in FM(m, m_0, F) (with nu
    = max_{k in {m_0-1, m_0}} |k/m - zeta|) and FDR(SUD_lambda(t), pi_0, F) <= FDR(SUD_lambda(t), pi_0,
    F == 1) + pi_0 varepsilon(delta, m, zeta, gamma) + 4 exp(-2 m (gamma - 1/m)_+^2) in RM(m, pi_0, F)
    (with pi_0 = zeta), where u_delta^+ = U(lambda/m, (G_zeta^{DU} + delta) wedge 1), u_delta^- = U(lambda/m,
    (G_zeta^{DU} - delta) vee 0), and varepsilon(delta, m, zeta, y) = (rho(u_delta^+) - rho(u_delta^-))
    / u_delta^+ + (4 / (1 - zeta)) exp(-2 m (delta - y - 1/m)_+^2 (1 - y/zeta)_+).'
  evidence:
  - source_id: blanchard-dickhaus-roquain-villers2014-pdf
    locator: Section 4.2, pages 13–15, Definition 4.2, Lemma 4.3, Theorem 4.4, and Equations (9)–(13);
      Section 7.2–7.3, pages 23–27, Equations (28)–(36)
    relation: supports
  - source_id: blanchard-dickhaus-roquain-villers2014-ar5iv
    locator: Section 4.2, lines 140–183, Definition 4.2, Lemma 4.3, and Theorem 4.4; Section 7.2–7.3,
      lines 348–438
    relation: supports
- claim_id: vanishing-rate-for-linear-and-aorc-step-up-down
  kind: mechanism
  statement: For Simes linear critical values rho(x) = alpha x (where (rho(u_delta^+) - rho(u_delta^-))/u_delta^+
    <= 2 alpha delta / (1 - zeta + delta)) or the Finner-Dickhaus-Roters (2009) asymptotically optimal
    rejection curve (AORC) rho(u) = alpha u / (1 - u(1 - alpha)) (where (rho(u_delta^+) - rho(u_delta^-))/u_delta^+
    ~ 2 alpha (1 - alpha) delta / ((zeta^2 - alpha zeta)(1 - zeta)) as delta -> 0 provided lambda/m <
    v_delta = 1 - delta alpha / (zeta - alpha) + O(delta^2)), Corollary 4.5 (Equation (15)) proves that
    when zeta_m in (alpha, 1) satisfies (1 - zeta_m)^{-1} sqrt((log m)/m) = o(1) (and (1 - lambda_m/m)^{-1}
    sqrt((log m)/m) = o(1) for AORC), the positive part of the FDR excess over the Dirac-uniform model
    vanishes at the explicit non-asymptotic rate (FDR(SUD_{lambda_m}(t), F) - FDR(SUD_{lambda_m}(t), F
    == 1))_+ = O((1 - zeta_m)^{-1} sqrt((log m) / m)).
  evidence:
