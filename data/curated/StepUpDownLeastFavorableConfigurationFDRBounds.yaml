    locator: Section 5.1–5.2, pages 18–20, Equations (16)–(27), Proposition 5.1, Theorem 5.2, and Corollary
      5.3; Section 7.1, page 23; Appendix A, page 28, Corollary A.1
    relation: supports
  - source_id: blanchard-dickhaus-roquain-villers2014-ar5iv
    locator: Section 5, lines 247–336, Proposition 5.1, Theorem 5.2, and Corollary 5.3; Section 7.1, lines
      344–347; Appendix A, lines 448–490
    relation: supports
- claim_id: intermediate-lsud-dirac-uniform-lfc-counterexample
  kind: mechanism
  statement: 'Although the Dirac-uniform configuration (F == 1, where alternative p-values have point
    mass 1 at 0) is a finite-sample least favorable configuration for both linear step-up LSU = LSUD_m
    (Benjamini & Yekutieli 2001) and linear step-down LSD = LSUD_1 over concave F in RM(m, pi_0, F) (Roquain
    & Villers 2011a), Proposition 4.1 (Equation (8) and Figure 3) proves by exact two-population Steck
    evaluation at m = 10, level alpha = 0.5, and m_0 = 7 (or pi_0 = 0.7) that for intermediate orders
    lambda in {4, 5, 6, 7} (and across the complete intermediate set lambda in {3, 4, 5, 6, 7, 8, 9}),
    the uniform zero-signal alternative F(x) = x yields strictly larger FDR than the Dirac-uniform configuration:
    FDR(LSUD_lambda, F(x) = x) > FDR(LSUD_lambda, F == 1) in both FM(10, 7, F) (e.g., at lambda = 4: 0.342981
    > 0.329850) and RM(10, 0.7, F) (at lambda = 4: 0.342981 > 0.334060), disproving Conjecture 3.2.'
  evidence:
