id: AIMech:Adadelta
name: Adadelta
definition: An adaptive gradient optimization method that rescales gradients using exponentially weighted
  squared-gradient and squared-update histories.
concept_kind: algorithm
identity_notes: The additional update-history scale distinguishes Adadelta from RMSprop and from Adagrad's
  cumulative accumulator.
definition_evidence:
- source_id: pytorch-docs
  locator: Adadelta.__doc__, algorithm lines 192–219
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The update multiplies the gradient by the stabilized root-mean-square of prior updates divided
    by the stabilized root-mean-square of current gradient history, then updates the squared-update average.
  evidence:
  - source_id: pytorch-docs
    locator: Adadelta.__doc__, algorithm lines 192–219
    relation: supports
