claims:
- claim_id: claim-01
  kind: mechanism
  statement: In each step i of Frequent-Directions (Algorithm 1), shrinking the squared singular values of the l x m sketch by delta_i = sigma_l^2 via bar{Sigma} = sqrt(Sigma^2 - I_l delta_i) zeroes out the l-th row and satisfies ||C_i||_F^2 - ||B_i||_F^2 = l delta_i, which telescopes over all n streaming rows to give the exact identity sum_{i=1}^n delta_i = (||A||_F^2 - ||B||_F^2) / l <= ||A||_F^2 / l (Claim 1), while for every unit vector x in R^m, Claim 2 proves 0 <= ||A x||_2^2 - ||B x||_2^2 <= sum_{i=1}^n delta_i, implying both A^T A >= B^T B and ||A^T A - B^T B||_2 <= (||A||_F^2 - ||B||_F^2) / l (Theorem 4.1).
  evidence:
  - source_id: r330-primary-pdf
    locator: Section 4.1, Algorithm 1, Claims 1 and 2, and Theorem 4.1, p. 583
    relation: supports
  - source_id: r330-metadata-cr
    locator: Crossref metadata for KDD 2013 pp. 581-588
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: By doubling the sketch capacity and shrinking by delta_i = sigma_{l/2}^2 only when all l/2 zero rows are filled (Algorithm 2), Theorem 4.2 proves that the SVD cost O(m l^2) is amortized over l/2 row insertions to achieve total streaming runtime O(n m l) = O(n m / epsilon) for l = ceil(2 / epsilon) while preserving the deterministic guarantee ||A^T A - B^T B||_2 <= 2 (||A||_F^2 - ||B||_F^2) / l <= epsilon ||A||_F^2; moreover, when input rows are indicator vectors e_{j_i}, Frequent-Directions reduces exactly to the Misra-Gries / Space-Saving item frequency estimation algorithm (Section 3, Theorem 3.1).
  evidence:
  - source_id: r330-primary-pdf
    locator: Section 3, Theorem 3.1, p. 582; Section 4.1-4.2, Algorithm 2 and Theorem 4.2, pp. 583-584
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Frequent-Directions does not preserve input sparsity (the sketch B = bar{Sigma} V^T is dense even when the streaming rows a_i are sparse, requiring O(n m l) time rather than input-sparsity time), and its worst-case spectral error bound scales with ||A||_F^2 / l rather than the tail residual ||A - A_k||_F^2 / (l - k) in the original Liberty (2013) analysis when the spectrum of A is completely flat.
  evidence:
  - source_id: r330-primary-pdf
    locator: Section 4.1, Tightness remark on ||A||_F^2 - ||B||_F^2, p. 583; Section 5.2, Comparison with sparse hashing and random projection on sparse inputs, p. 586
    relation: supports
