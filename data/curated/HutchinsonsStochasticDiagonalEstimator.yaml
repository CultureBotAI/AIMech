claims:
- claim_id: rademacher-hadamard-unbiased-off-diagonal-variance
  kind: mechanism
  statement: Because Rademacher entries satisfy (g_i^z)^2 = 1 deterministically, the single-sample error vector e_z = g^z (x) A g^z - diag(A) has squared Euclidean norm equal to g^{zT} (A_bar^T A_bar) g^z and expected squared error E[||r^m(A) - diag(A)||_2^2] = ||A_bar||_F^2 / m with zero contribution from the diagonal entries of A.
  evidence:
  - source_id: r827-primary-pdf
    locator: Section 1, Definition 1, p. 1; Section 2.1, Equation 1 and Lemma 3, p. 3
    relation: supports
- claim_id: dimension-independent-subexponential-concentration
  kind: mechanism
  statement: By symmetrizing the error vector and bounding its moment generating function via a scalar sub-Gaussian comparison, Hutchinson diagonal estimator achieves ||r^m(A) - diag(A)||_2 <= c sqrt(log(2/delta)/m) ||A_bar||_F with probability 1 - delta using m = O(log(1/delta)/epsilon^2) matrix-vector products independent of matrix dimension n.
  evidence:
  - source_id: r827-primary-pdf
    locator: Section 1, Theorem 1, p. 2; Section 3.1-3.3, Equations 2-7, pp. 4-5
    relation: supports
- claim_id: hessian-diagonal-and-implicit-inverse-estimation-application
  kind: application
  statement: Hutchinson diagonal estimator is applied in machine learning and optimization to approximate the diagonals of large Hessian matrices and matrix inverses where explicit matrix construction is infeasible but matrix-vector products can be computed via backpropagation or iterative linear solvers.
  evidence:
  - source_id: r827-primary-pdf
    locator: Section 1, p. 1
    relation: supports
- claim_id: non-rademacher-fourth-moment-diagonal-error-limitation
  kind: limitation
  statement: When implemented with non-Rademacher mean-zero unit-variance random vectors having fourth moment c_4 > 1 (such as standard Gaussian probes with c_4 = 3), the estimator incurs an additional (c_4 - 1)||diag(A)||_2^2 / m error term that scales with the diagonal magnitude itself.
  evidence:
  - source_id: r827-primary-pdf
    locator: Section 4, Lemma 4 and Corollary 5, pp. 5-6; Section 4.1, Theorem 7 discussion, p. 7
    relation: supports
