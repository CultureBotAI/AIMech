id: AIMech:HutchinsonsStochasticDiagonalEstimator
name: Hutchinson Stochastic Diagonal Estimator
concept_kind: mathematical_method
review_status: DRAFT
definition: A randomized matrix-free numerical linear algebra method that estimates the diagonal vector diag(A) of a square matrix A using only implicit matrix-vector multiplications by averaging the entrywise Hadamard products g^z (x) (A g^z) over m independent Rademacher probe vectors g^z in {-1, +1}^n, achieving unbiased estimation whose squared L2 error depends solely on the off-diagonal Frobenius norm ||A_bar||_F^2 / m independent of matrix dimension n.
identity_notes: No AIO class represents Hutchinson Stochastic Diagonal Estimator; ArtificialNeuralNetwork (AIO:ArtificialNeuralNetwork) is the closest broad match covering neural network Hessian diagonal estimation, pruning, and optimization workflows.
aliases:
- Hutchinson Diagonal Estimator
- Hutchinsons Diagonal Estimator
- Rademacher Hadamard Stochastic Diagonal Estimator
