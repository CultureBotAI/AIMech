id: AIMech:FedPerFederatedLearningWithPersonalizationLayers
name: FedPer (Federated Learning with Personalization Layers)
concept_kind: algorithm
review_status: DRAFT
definition: A personalized federated deep learning algorithm (Arivazhagan, Aggarwal, Singh, & Choudhary 2019, Section 3, Equations 1-3, Algorithms 1-2) that decomposes each client j's deep feedforward network into K_B shared base layers W_B = (W_{B,K_B}, ..., W_{B,1}) and K_P client-specific personalization layers W_{P_j} = (W_{P_j,K_P}, ..., W_{P_j,1}) producing predictions y_hat = f(x; W_B, W_{P_j}) (Equation 1), minimizes the average personalized population risk L^{PR}(W_B, W_{P_1}, ..., W_{P_N}) = (1/N) sum_{j=1}^N E_{(x,y)~P_j}[l(y, f(x; W_B, W_{P_j}))] (Equation 2) by having each client j jointly update both its base and personalization layers locally via e epochs of stochastic gradient descent (W_{B,j}^{(k)}, W_{P_j}^{(k)}) <- SGD_j(W_B^{(k-1)}, W_{P_j}^{(k-1)}, eta_j^{(k)}) (Algorithm 1, Line 5), retaining W_{P_j}^{(k)} privately on device j while transmitting only W_{B,j}^{(k)} to the parameter server for sample-weighted FedAvg aggregation W_B^{(k)} <- sum_{j=1}^N gamma_j W_{B,j}^{(k)} with gamma_j = n_j / sum_{l=1}^N n_l (Algorithm 2, Line 6).
identity_notes: Distinct from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which alternates separate inner head-only optimization epochs and representation-only optimization steps within each round rather than jointly updating (W_{B,j}, W_{P_j}) simultaneously via coupled SGD steps (Algorithm 1, Line 5); and distinct from FedBABU (AIMech:FedBabuFederatedLearningWithOnlyBodyAggregationAndBodyUpdate, Oh et al. 2022), which freezes a shared random head (alpha_h = 0) during federated representation training.
aliases:
- FedPer
- Federated Learning with Personalization Layers
- Base Plus Personalization Layer Federated Learning
