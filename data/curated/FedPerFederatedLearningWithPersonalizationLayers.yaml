claims:
- claim_id: r473-coupled-local-sgd-base-only-server-aggregation-mechanism
  kind: mechanism
  statement: In each global round k, FedPer-Client(j) initializes from the server's aggregated base weights W_B^{(k-1)} and its own private personalization weights W_{P_j}^{(k-1)}, executes e local SGD epochs jointly over (W_B, W_{P_j}) on empirical risk L_j^{ER}(W_B, W_P) (Equation 3), and uploads only W_{B,j}^{(k)} for gamma_j-weighted server averaging while keeping W_{P_j}^{(k)} strictly private on client j (Arivazhagan et al. 2019, Section 3.2, Algorithms 1-2).
  evidence:
  - source_id: r473-primary-pdf
    locator: Section 3.2 (Algorithms 1-2), p. 4
    relation: supports
- claim_id: r473-contradictory-user-preference-and-reduction-to-fedavg-scope
  kind: scope
  statement: FedPer reduces exactly to standard FedAvg when K_P = 0, while for K_P >= 1 the private top layers W_{P_j} enable different clients to assign distinct or contradictory personalized labels to identical input features (where single-model FedAvg degrades to near-random guessing) and reduce cross-client test accuracy variance under non-identical class partitions (Arivazhagan et al. 2019, Sections 1, 4.2, & 4.5, Figures 2-3 & 7-8).
  evidence:
  - source_id: r473-primary-pdf
    locator: Sections 4.2-4.5 (Figures 2-8), pp. 5-8
    relation: supports
- claim_id: r473-personalized-image-aesthetics-and-non-iid-vision-application
  kind: application
  statement: Applied to personalized image aesthetics rating prediction on the FLICKR-AES dataset and non-identically partitioned image classification on CIFAR-10 and CIFAR-100 with ResNet-34 and MobileNet-v1 architectures (Arivazhagan et al. 2019, Section 4, Figures 2-18).
  evidence:
  - source_id: r473-primary-pdf
    locator: Section 4.1-4.5, pp. 5-8, and Appendix A, pp. 10-13
    relation: supports
- claim_id: r473-base-personalization-desynchronization-between-rounds-limitation
  kind: limitation
  statement: When the server replaces a client's local base layers W_{B,j}^{(k-1)} with the newly aggregated global base W_B^{(k-1)} at the start of round k, the private personalization layers W_{P_j}^{(k-1)} can be temporarily mismatched to the updated base representation until local fine-tuning or joint SGD epochs re-align them (Arivazhagan et al. 2019, Appendix A.3, Figures 15-16).
  evidence:
  - source_id: r473-primary-pdf
    locator: Appendix A.3 (Effect of FineTuning, Figures 15-16), pp. 10-12
    relation: supports
