claims:
- claim_id: claim-diagonal-deletion-bias-elimination-and-rowwise-subspace-normality
  kind: mechanism
  statement: "Zeroing the diagonal of the inverse-probability-weighted sample Gram matrix $\\boldsymbol{M} = \\mathcal{P}_{\\mathrm{off-diag}}(\\frac{1}{n p^2}\\mathcal{P}_\\Omega(\\boldsymbol{X})\\mathcal{P}_\\Omega(\\boldsymbol{X})^\\top)$ removes the $\\frac{1}{np}\\sum_{t=1}^n\\sigma_{i,t}^2$ diagonal noise spike while incurring only an $O(\\mu r/d)$ deterministic off-diagonal perturbation, and Theorem 1 proves that under $\\sqrt{n}p \\gg \\kappa^2\\mu r\\sqrt{\\log^3(d+n)}$ the aligned principal subspace rows satisfy $(\\boldsymbol{U}\\widehat{\\boldsymbol{H}} - \\boldsymbol{U}^\\star)_{i,\\cdot}^\\top = (\\boldsymbol{\\Lambda}^\\star)^{-1}\\boldsymbol{U}^{\\star\\top}(\\boldsymbol{M} - \\mathbb{E}[\\boldsymbol{M}])_{\\cdot,i} + \\boldsymbol{\\psi}_i$ with $(\\boldsymbol{S}^{(i,\\star)})^{-1/2}(\\boldsymbol{U}\\widehat{\\boldsymbol{H}} - \\boldsymbol{U}^\\star)_{i,\\cdot}^\\top \\stackrel{\\mathrm{d}}{\\to} \\mathcal{N}(\\boldsymbol{0},\\boldsymbol{I}_r)$ (Sections 2.2 and 3.1, Equations 2.5 and 3.2\u20133.7, Theorem 1)."
  evidence:
  - source_id: ycf2024-hpca-pdf
    locator: Section 2.2 (Eq. 2.5, pp. 733-734), Section 3.1 (Eqs. 3.2-3.7, Theorem 1, pp. 735-737)
    relation: supports
- claim_id: claim-plug-in-covariance-consistency-and-chi-square-subspace-wald-regions
  kind: mechanism
  statement: "Using the data-driven variance-covariance estimator $\\widehat{\\boldsymbol{S}}^{(i)} = \\frac{1}{n}\\boldsymbol{\\Lambda}^{-1}\\boldsymbol{U}^\\top\\widehat{\\boldsymbol{\\Xi}}^{(i)}\\boldsymbol{U}\\boldsymbol{\\Lambda}^{-1}$ with $\\widehat{\\Xi}_{j,l}^{(i)} = \\mathbb{I}_{\\{j=l\\ne i\\}}\\frac{1}{n}\\sum_{t=1}^n Z_{i,t}^2 Z_{j,t}^2$ (Equations 3.8\u20133.10), Theorem 2 proves $\\|(\\widehat{\\boldsymbol{S}}^{(i)})^{-1/2}\\boldsymbol{S}^{(i,\\star)}(\\widehat{\\boldsymbol{S}}^{(i)})^{-1/2} - \\boldsymbol{I}_r\\| = o_P(1)$ and establishes the pivotal $\\chi_r^2$ convergence $W_i = (\\boldsymbol{U}\\widehat{\\boldsymbol{H}} - \\boldsymbol{U}^\\star)_{i,\\cdot}(\\widehat{\\boldsymbol{S}}^{(i)})^{-1}(\\boldsymbol{U}\\widehat{\\boldsymbol{H}} - \\boldsymbol{U}^\\star)_{i,\\cdot}^\\top \\stackrel{\\mathrm{d}}{\\to} \\chi_r^2$ without requiring any separation among the $r$ nonzero eigenvalues $\\lambda_1^\\star,\\dots,\\lambda_r^\\star$ (Section 3.1, Theorem 2, Corollary 1, Section 3.2, Theorems 3\u20134)."
  evidence:
  - source_id: ycf2024-hpca-pdf
    locator: Sections 3.1-3.2 (Eqs. 3.8-3.11, Theorems 2-4, Corollary 1, pp. 737-741)
    relation: supports
- claim_id: claim-individual-eigenvector-linear-forms-and-entrywise-covariance-inference
  kind: application
  statement: "When the $k$-th eigenvalue $\\lambda_k^\\star$ is separated by $\\Delta_k^\\star = \\min_{l \\ne k}|\\lambda_k^\\star - \\lambda_l^\\star| > 0$, Theorems 5\u20136 establish a second-order resolvent expansion for any linear form $\\boldsymbol{c}^\\top(\\boldsymbol{u}_k - \\boldsymbol{u}_k^\\star) / \\sqrt{\\widehat{v}_{\\boldsymbol{c},k}} \\stackrel{\\mathrm{d}}{\\to} \\mathcal{N}(0,1)$ Incorporating cross-subspace interaction terms $\\sum_{l \\ne k}\\frac{\\lambda_l^\\star}{\\lambda_k^\\star - \\lambda_l^\\star}\\boldsymbol{u}_l^\\star\\boldsymbol{u}_l^{\\star\\top}$, while Theorems 7\u20138 prove eigengap-free asymptotic normality $(\\widehat{\\Sigma}_{i,j} - \\Sigma_{i,j}^\\star)/\\sqrt{\\widehat{\\vartheta}_{i,j}} \\stackrel{\\mathrm{d}}{\\to} \\mathcal{N}(0,1)$ for the reconstructed covariance matrix $\\widehat{\\boldsymbol{\\Sigma}} = \\boldsymbol{U}\\boldsymbol{\\Lambda}\\boldsymbol{U}^\\top$ (Sections 3.3\u20133.4, Theorems 5\u20138)."
  evidence:
  - source_id: ycf2024-hpca-pdf
    locator: Sections 3.3-3.4 (Theorems 5-8, pp. 741-746)
    relation: supports
