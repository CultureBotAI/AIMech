claims:
- claim_id: epr-scoring-lm-candidate-labeling-mechanism
  kind: mechanism
  statement: For each training pair (x, y), EPR retrieves a candidate pool E_bar of L examples using an unsupervised retriever on y, evaluates each candidate e_l independently using a scoring language model g_hat via s(e_l) = Prob_{g_hat}(y | e_l, x), and designates the top-k candidates as positive prompts E_pos and the bottom-k candidates as hard-negative prompts E_neg.
  evidence:
  - source_id: r735-primary-pdf
    locator: Section 3.1, p. 3, Figure 2
    relation: supports
- claim_id: epr-contrastive-biencoder-mips-mechanism
  kind: mechanism
  statement: EPR trains an input encoder E_X(x) and a prompt encoder E_P(e) with inner-product similarity sim(x, e) = E_X(x)^T E_P(e) using an in-batch contrastive negative log-likelihood objective over positive and hard-negative examples, enabling sub-linear test-time prompt retrieval via FAISS maximum inner-product search.
  evidence:
  - source_id: r735-primary-pdf
    locator: Section 3.2, p. 4, Equation 1
    relation: supports
- claim_id: epr-semantic-parsing-and-lm-proxy-application
  kind: application
  statement: EPR is applied to few-shot semantic parsing and meaning-representation generation on BREAK, MTOP, and SMCalFlow, where a retriever trained using a smaller proxy scoring language model (GPT-Neo 2.7B) transfers effectively to larger inference models including GPT-J, Codex, and GPT-3.
  evidence:
  - source_id: r735-primary-pdf
    locator: Section 4.1-4.4, pp. 4-7, Tables 2-5
    relation: supports
  - source_id: r735-metadata-cr
    locator: DBLP bibliographic record conf/naacl/RubinHB22
    relation: supports
- claim_id: epr-independent-singleton-scoring-limitation
  kind: limitation
  statement: Because EPR scores each candidate demonstration independently as a single-shot prompt during training data construction while concatenating multiple top-ranked demonstrations at inference time, it does not model redundancy or higher-order interactions among the jointly selected in-context examples.
  evidence:
  - source_id: r735-primary-pdf
    locator: Section 3.2, p. 4
    relation: supports
