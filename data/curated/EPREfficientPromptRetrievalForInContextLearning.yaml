id: AIMech:EPREfficientPromptRetrievalForInContextLearning
name: EPR Efficient Prompt Retrieval for In-Context Learning
concept_kind: algorithm
review_status: DRAFT
definition: A supervised dense prompt retrieval method for in-context learning that first filters candidate training demonstrations for each training example using an unsupervised retriever, scores each candidate by the conditional probability of the gold target sequence under a scoring language model conditioned on that candidate demonstration and the input, labels the highest- and lowest-scoring candidates as positive and hard-negative examples, and trains a dual-encoder bi-encoder via contrastive InfoNCE loss for fast maximum inner-product search at inference time.
identity_notes: Distinct from unsupervised or transfer sentence-embedding nearest-neighbor retrieval (AIMech:KATEkNNAugmentedInContextExampleSelection), which does not use language-model conditional decoding probabilities to supervise the retriever. Also distinct from determinantal point process subset selection (CEIL), which models pairwise diversity and joint subset interactions across multiple exemplars rather than scoring individual prompt candidates independently.
aliases:
- EPR
- Efficient Prompt Retrieval
- LM-Scored Contrastive Dense Prompt Retrieval
