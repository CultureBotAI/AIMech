limitations:
- This record denotes the Riihimäki–Vehtari virtual-derivative/probit/EP inference procedure for regression
  and binary classification. It is not every shape-constrained GP, an isotonic estimator, a construction-enforced
  monotone random process or a generic EP record. The inspected paper uses positive derivative information
  in selected coordinates; any decreasing-coordinate extension must state its sign convention.
- The derivative covariance requires a sufficiently differentiable kernel. Finite site placement, approximate
  Gaussian inference and point-estimated hyperparameters do not certify monotonicity between sites, calibrated
  uncertainty, convergence to a global optimum or correct prior knowledge.
- The source reports lower errors for some smooth synthetic functions and worse errors for its step-function
  examples, attributing difficulties to smoothness and Gaussian approximation near truncated derivative
  boundaries. Its health-care classification example is an application with an assumed age trend, not
  evidence of causal effects or general clinical benefit.
- The cubic counterexample checks the logic of finite derivative constraints, not a sampled squared-exponential
  GP trajectory. The half-normal calculation is a one-site hard-sign limit and is not the finite-nu multi-site
  empirical violation probability. No source implementation or empirical experiment was executed.
- All primary PDF pages were read. The author GPstuff demonstration is a discovered implementation lead;
  its complete implementation and runtime behavior were not audited. This record remains DRAFT and author
  self-review is not independent scientific approval.
