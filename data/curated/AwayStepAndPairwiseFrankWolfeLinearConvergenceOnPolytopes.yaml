claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any finite atom set A subseteq R^d, the Pyramidal Width PWidth(A) > 0 is strictly positive and lower-bounded by the minimal width over all subsets of atoms (Theorem 3); for the unit d-dimensional probability simplex conv(e_1, ..., e_d), PWidth(A) = 2 / sqrt(d) if d is even and 2 / sqrt(d - 1/d) if d is odd (Section 3.1), while for the unit hypercube [0, 1]^d, PWidth({0, 1}^d) = 1 / sqrt(d) and eccentricity(M) = d (Lemma 4); furthermore, any mu-strongly convex function f satisfies the Geometric Strong Convexity inequality mu_f^A >= mu * (PWidth(A))^2 (Theorem 6).
  evidence:
  - source_id: r342-primary-pdf
    locator: Section 3-3.1, Equations 7-13, Theorem 3, Lemma 4, and Theorem 6, pp. 4-6; Appendix B.1, Proof of Lemma 4, p. 11
    relation: supports
  - source_id: r342-arxiv-abs
    locator: 'Abstract: Global linear convergence rate characterized via the affine-invariant curvature and pyramidal width of the polytope'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: At every non-drop step of Away-Steps Frank-Wolfe (Algorithm 1), the objective suboptimality h_t = f(x^{(t)}) - f(x^*) decreases geometrically by at least h_{t+1} <= (1 - rho_f^{AFW}) h_t where rho_f^{AFW} = mu_f^A / (4 C_f^A) <= 1/2 (or h_{t+1} <= h_t / 2 when gamma_t = gamma_max > gamma_t^B), and since each drop step removes an active atom from S^{(t)} while at most one atom can be added per step, the number of good steps after t iterations is at least k(t) >= t / 2, yielding the global linear convergence bound h_t <= h_0 (1 - rho_f^{AFW})^{max(0, floor((t - |S^{(0)}| + 1)/2))} (Theorem 1 and Theorem 8).
  evidence:
  - source_id: r342-primary-pdf
    locator: Section 2, Theorem 1, p. 4; Appendix D, Theorem 8 and Proof of Linear Convergence (Equations 24-31), pp. 14-16
    relation: supports
  - source_id: r342-metadata-cr
    locator: 'Abstract: Global linear convergence for Away-Steps, Pairwise, and Fully-Corrective Frank-Wolfe variants without strict complementarity'
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Standard Frank-Wolfe without away or pairwise steps zig-zags across active boundary faces whenever x^* lies on the boundary of a polytope M, exhibiting sublinear O(1/t) convergence on strongly convex objectives where Away-Steps and Pairwise Frank-Wolfe converge linearly via drop steps.
  evidence:
  - source_id: r342-primary-pdf
    locator: Section 1, Introduction and Figure 1 (Zig-Zagging of Standard FW vs Away/Pairwise FW), pp. 1-2
    relation: supports
