- Lacoste-Julien and Jaggi Global Linear Convergence of Frank-Wolfe Variants
- Away-Steps Frank-Wolfe (AFW) and Pairwise Frank-Wolfe (PFW)
- Pyramidal Width Affine-Invariant Polytope Conditioning for Conditional Gradient
