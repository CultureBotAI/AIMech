id: AIMech:TopKRankingSpectralAndRegularizedMLEByLeaveOneOutAnalysis
name: Top-K Ranking by Spectral Method and Regularized Maximum Likelihood via Leave-One-Out Analysis
concept_kind: mathematical_method
review_status: DRAFT
definition: "A unified pairwise-comparison ranking and entrywise $\\ell_\\infty$ estimation framework (established by Yuxin Chen, Jianqing Fan, Cong Ma, and Kaizheng Wang in 2019) proving that both the spectral method (Rank Centrality stationary distribution $\\boldsymbol{\\pi}$ of the empirical comparison transition matrix $\\mathbf{P}$) and $\\ell_2$-regularized maximum likelihood estimation ($\\widehat{\\boldsymbol{\\theta}} = \\arg\\min_{\\boldsymbol{\\theta}} \\mathcal{L}_\\lambda(\\boldsymbol{\\theta})$ with $\\mathcal{L}_\\lambda(\\boldsymbol{\\theta}) = \\sum_{(i,j)\\in\\mathcal{E}, i>j}[-y_{j,i}(\\theta_i - \\theta_j) + \\log(1 + e^{\\theta_i - \\theta_j})] + \\frac{1}{2}\\lambda\\|\\boldsymbol{\\theta}\\|_2^2$) achieve minimax-optimal entrywise $\\ell_\\infty$ relative error and exact top-$K$ item identification under the Bradley\u2013Terry\u2013Luce (BTL) model $y_{i,j}^{(l)} \\sim \\text{Bernoulli}(w_j^*/(w_i^* + w_j^*))$ on an Erd\u0151s\u2013R\xE9nyi comparison graph $\\mathcal{G}_{n,p}$ with $L$ repeated comparisons per edge. Theorem 8 establishes a sharp stationary-distribution perturbation bound for reversible Markov chains in the $\\boldsymbol{\\pi}^*$-weighted norm $\\|\\mathbf{x}\\|_{\\boldsymbol{\\pi}^*} = \\sqrt{\\sum_i (x_i^2 / \\pi_i^*)}$ (for row distributions): $\\|\\boldsymbol{\\pi} - \\boldsymbol{\\pi}^*\\|_{\\boldsymbol{\\pi}^*} \\le \\|\\boldsymbol{\\pi}^*(\\mathbf{P} - \\mathbf{P}^*)\\|_{\\boldsymbol{\\pi}^*} / (1 - \\rho^* - \\|\\mathbf{P} - \\mathbf{P}^*\\|_{\\boldsymbol{\\pi}^*})$. Combining Theorem 8 with a leave-one-out transition matrix $\\mathbf{P}^{(m)}$ (replacing item $m$'s random comparisons by their population means, Section 4.2, Theorem 3) and a leave-one-out gradient-descent trajectory $\\boldsymbol{\\theta}^{t,(m)}$ for the regularized MLE (Section 4.3, Theorem 4) proves $\\|\\boldsymbol{\\pi} - \\boldsymbol{\\pi}^*\\|_\\infty / \\|\\boldsymbol{\\pi}^*\\|_\\infty \\lesssim \\sqrt{\\log n / (npL)}$ and $\\|\\widehat{\\boldsymbol{\\theta}} - \\boldsymbol{\\theta}^*\\|_\\infty \\lesssim \\sqrt{\\log n / (npL)}$, achieving exact top-$K$ identification whenever the total sample size satisfies $n^2 p L / 2 \\gtrsim n\\log n / \\Delta_K^2$ where $\\Delta_K = (w_K^* - w_{K+1}^*) / w_{\\max}^*$ (Theorems 1\u20132)."
identity_notes: Resolved against all 442 pinned AIO concepts and 678 maintained AIMech concepts. Distinct from `AIMech:EntrywiseFirstOrderEigenvectorApproximationAndLeaveOneOutPerturbationAnalysisForLowExpectedRankRandomMatrices` (Abbe, Fan, Wang, & Zhong 2020, which analyzes symmetric low-expected-rank matrices rather than asymmetric reversible Markov chain stationary distributions $\boldsymbol{\pi}^T\mathbf{P} = \boldsymbol{\pi}^T$ and $\ell_2$-regularized BTL logistic MLE trajectories) and from `AIMech:RankCentralityIterativeRandomWalkSpectralRankingFromPairwiseComparisons` (Negahban, Oh, & Shah 2017, which bounds only the aggregate Euclidean $\ell_2$ error $\|\boldsymbol{\pi} - \boldsymbol{\pi}^*\|_2 / \|\boldsymbol{\pi}^*\|_2$, suboptimal by a factor of $\Theta(n)$ in sample complexity for top-$K$ identification compared to the entrywise $\ell_\infty$ leave-one-out bounds of Chen, Fan, Ma, & Wang 2019).
aliases:
- Leave-One-Out Entrywise Optimal Spectral and Regularized MLE Top-K Ranking
- Chen-Fan-Ma-Wang Minimax Top-K BTL Ranking
- Reversible Markov Chain Perturbation and Leave-One-Out BTL Ranking
