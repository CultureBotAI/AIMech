claims:
- claim_id: claim-reversible-markov-chain-stationary-perturbation-bound
  kind: mechanism
  statement: For a Markov chain $\mathbf{P}$ reversible with respect to stationary distribution $\boldsymbol{\pi}^*$ ($\pi_i^* P_{i,j}^* = \pi_j^* P_{j,i}^*$), Theorem 8 proves that any perturbed stochastic matrix $\widehat{\mathbf{P}}$ with stationary distribution $\widehat{\boldsymbol{\pi}}$ satisfies $\|\widehat{\boldsymbol{\pi}} - \boldsymbol{\pi}^*\|_{\boldsymbol{\pi}^*} \le \|\boldsymbol{\pi}^*(\widehat{\mathbf{P}} - \mathbf{P}^*)\|_{\boldsymbol{\pi}^*} / (1 - \rho^* - \|\widehat{\mathbf{P}} - \mathbf{P}^*\|_{\boldsymbol{\pi}^*})$ whenever $\|\widehat{\mathbf{P}} - \mathbf{P}^*\|_{\boldsymbol{\pi}^*} < 1 - \rho^*$, where $\rho^* = \max\{\lambda_2(\mathbf{P}^*), -\lambda_n(\mathbf{P}^*)\}$ (Section 4.1, Theorem 8, Appendix A).
  evidence:
  - source_id: cfmw2019-topk-pdf
    locator: Section 4.1, Theorem 8 (p. 2219), Appendix A (pp. 2226-2227)
    relation: supports
- claim_id: claim-leave-one-out-entrywise-linfinity-spectral-and-regularized-mle
  kind: mechanism
  statement: "Constructing for each item $m \\in [n]$ a leave-one-out transition matrix $\\mathbf{P}^{(m)}$ and a leave-one-out regularized log-likelihood $\\mathcal{L}_\\lambda^{(m)}(\\boldsymbol{\\theta})$ by replacing comparison outcomes incident to $m$ with their population means decouples statistical dependence on item $m$'s comparisons and proves entrywise $\\ell_\\infty$ bounds $\\|\\boldsymbol{\\pi} - \\boldsymbol{\\pi}^*\\|_\\infty / \\|\\boldsymbol{\\pi}^*\\|_\\infty \\lesssim \\kappa\\sqrt{\\log n / (npL)}$ (Theorem 3) and $\\|\\widehat{\\boldsymbol{\\theta}} - \\boldsymbol{\\theta}^*\\|_\\infty \\lesssim \\kappa^2\\sqrt{\\log n / (npL)}$ for $\\lambda \\asymp \\sqrt{np\\log n / L}$ (Theorem 4, Sections 3.1 and 4.2\u20134.3)."
  evidence:
  - source_id: cfmw2019-topk-pdf
    locator: Section 3.1 (Theorems 3-4, pp. 2212-2213), Sections 4.2-4.3 (pp. 2220-2225)
    relation: supports
- claim_id: claim-minimax-optimal-top-k-ranking-sample-complexity
  kind: application
  statement: "Under the BTL model with condition number $\\kappa = w_{\\max}^*/w_{\\min}^* = O(1)$ and relative top-$K$ separation $\\Delta_K = (w_K^* - w_{K+1}^*)/w_{\\max}^*$, Theorem 1 proves that both the spectral method and regularized MLE recover the exact top-$K$ set $[K]$ with probability $1 - O(n^{-5})$ whenever $n^2 p L / 2 \\ge C(n\\log n) / \\Delta_K^2$, matching the information-theoretic Fano/KL minimax lower bound of Theorem 2 up to universal constants (Sections 2.2\u20132.3, Theorems 1\u20132)."
  evidence:
  - source_id: cfmw2019-topk-pdf
    locator: Sections 2.2-2.3, Theorems 1-2 (pp. 2209-2211)
    relation: supports
