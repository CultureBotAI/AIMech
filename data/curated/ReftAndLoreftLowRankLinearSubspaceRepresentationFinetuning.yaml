claims:
- claim_id: r655-claim-orthonormal-subspace-interchange-intervention
  kind: mechanism
  statement: Given a low-rank projection matrix R in R^{r x d} with orthonormal rows (R R^T = I_r), LoReFT's intervention Phi_{LoReFT}(h) = h + R^T (W h + b - R h) replaces the r-dimensional subspace coordinates R h with the learned linear projection W h + b (so that R Phi_{LoReFT}(h) = W h + b exactly) while leaving the (d - r)-dimensional orthogonal complement (I_d - R^T R) h completely unchanged.
  evidence:
  - source_id: r655-primary-pdf
    locator: Section 3.1-3.2, Equations (1)-(2) and Figure 2, p. 3-4
    relation: supports
- claim_id: r655-claim-prefix-suffix-position-selective-intervention
  kind: mechanism
  statement: Unlike weight-based PEFTs and activation adapters (such as RED) that must transform every token position during both prompt processing and autoregressive decoding, ReFT applies interventions I = {<Phi, P, l>} only to a fixed set of p prefix and s suffix prompt positions P = {1, ..., p} U {n - s + 1, ..., n}, incurring a constant intervention compute cost during initial KV-cache population that does not scale with prompt length or decoding length.
  evidence:
  - source_id: r655-primary-pdf
    locator: Section 3.3 (Definitions 3.1-3.2) & Section 4.1, p. 5-6; Appendix B & Appendix H (Figure 11), p. 20, 39-40
    relation: supports
- claim_id: r655-claim-parameter-efficiency-and-benchmark-performance
  kind: application
  statement: Across LLaMA-1 7B/13B, Llama-2 7B, Llama-3 8B, and RoBERTa-base/large, LoReFT uses 15x to 65x fewer trainable parameters than LoRA (e.g., 0.025%-0.031% vs. 0.670%-0.826% on LLaMA) while outperforming LoRA, DoRA, and adapter methods on eight commonsense reasoning benchmarks, Ultrafeedback instruction tuning (Alpaca-Eval v1.0), and GLUE natural language understanding.
  evidence:
  - source_id: r655-primary-pdf
    locator: Section 4.2-4.5, Tables 1, 3, 4 & Figure 1, p. 2, 6-9
    relation: supports
- claim_id: r655-claim-chain-of-thought-arithmetic-and-non-mergeable-limitation
  kind: limitation
  statement: Because ReFT interventions are position-selective and hooked into the forward activation graph rather than modifying linear layer weights, they cannot be folded into static base model weights for zero-overhead inference, and intervening only on prompt tokens exhibits weaker performance than LoRA on multi-step chain-of-thought arithmetic reasoning tasks (GSM8K, SVAMP, MAWPS) where long generation sequences dilute the effect of prompt-time representation edits.
  evidence:
  - source_id: r655-primary-pdf
    locator: Section 4.3 (Arithmetic reasoning, Table 2), p. 6-8; Appendix H (Inference overhead analysis), p. 39
    relation: supports
