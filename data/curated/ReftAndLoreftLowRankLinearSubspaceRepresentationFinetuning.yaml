id: AIMech:ReftAndLoreftLowRankLinearSubspaceRepresentationFinetuning
name: Representation Finetuning (ReFT) and Low-Rank Linear Subspace ReFT (LoReFT)
concept_kind: algorithm
review_status: DRAFT
definition: 'Representation Finetuning (ReFT) is a family of parameter-efficient adaptation methods for frozen language models that learns a set of non-overlapping forward-pass interventions I = {<Phi, P, l>}, where each intervention overwrites hidden representations h^{(l)}_p <- Phi(h^{(l)}_p) at a specified subset of token positions P subseteq {1, ..., n} (typically p prefix and s suffix prompt positions) in layer l. Its primary instantiation, Low-rank Linear Subspace ReFT (LoReFT), grounds Phi in causal Distributed Interchange Interventions (DII) by editing h in R^d strictly within the r-dimensional linear subspace spanned by a low-rank matrix R in R^{r x d} with orthonormal rows (R R^T = I_r, r << d) to take on values from a learned linear projection W h + b: Phi_{LoReFT}(h) = h + R^T (W h + b - R h), alongside its unconstrained ablation DiReFT, Phi_{DiReFT}(h) = h + W_2^T (W_1 h + b).'
identity_notes: Distinct from weight-based PEFT methods such as LoRA (Hu et al., 2022), DoRA (Liu et al., 2024), and VeRA (Kopiczko et al., 2024), which modify weight matrices across all sequence positions and merge updates into weights, whereas ReFT/LoReFT never modifies weights and instead intervenes selectively on hidden representations at specific token positions P (e.g., p prefix and s suffix tokens). Also distinct from RED (Wu et al., 2024a) and (IA)^3 (Liu et al., 2022), which apply element-wise scaling and bias to activations at every token position rather than performing a rank-r orthogonal subspace replacement R^T (W h + b - R h) on a small subset of prompt positions.
aliases:
- ReFT
- LoReFT
- Low-rank Linear Subspace ReFT
- Difference-based Low-rank Linear Subspace ReFT (DiReFT)
- Representation Finetuning for Language Models
