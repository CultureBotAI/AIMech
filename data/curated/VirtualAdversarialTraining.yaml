aio_no_match:
  search_scope: All 442 CLASS labels and scoped synonyms in pinned AIO commit 397851c547d1c4d8f06ef184f63c1d40bc86937a
    and all 203 preceding native IDs/names/aliases were compared. Ignored-inclusive searches covered both
    full checkouts. Exact candidate AIO nodes, definitions, scoped synonyms and direct parents were inspected;
    this no-match assessment is bounded to this snapshot and the stated semantic neighborhood.
  rationale: The inspected AIO candidates describe layers, LLM-specific tasks or generative adversarial
    architectures rather than label-free worst-case prediction smoothing. A shared regularization or adversarial
    word does not provide a sufficiently scoped mapping.
  examined_targets:
  - target: AIO:RegularizationLayer
    rejection_reason: A layer applying parameter/activity penalties is not this whole-model input-perturbation
      training procedure.
  - target: AIO:ActivityRegularizationLayer
    rejection_reason: Output activity penalties do not specify distributional consistency under a virtual
      adversarial input.
  - target: AIO:SemiSupervisedLLM
    rejection_reason: The class describes an LLM-specific learning arrangement; VAT is a general prediction
      regularizer.
  - target: AIO:GenerativeAdversarialNetwork
    rejection_reason: Competing generator/discriminator training is not VAT’s local input-perturbation
      procedure.
  - target: AIO:GenerativeAdversarialNetworkAugmentedLLM
    rejection_reason: Its related adversarial-training synonym is attached to an LLM-specific generative-adversarial
      class and does not establish VAT identity.
  - target: AIO:SelfsupervisedLearning
    rejection_reason: The class describes self-supervised prediction tasks. VAT by itself specifies a
      consistency penalty, not a missing-input prediction task.
