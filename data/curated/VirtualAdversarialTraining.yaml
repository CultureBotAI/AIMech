name: Virtual adversarial training
definition: A prediction-smoothing regularization procedure that trains a model to preserve its current
  output distribution under approximately worst-case small input perturbations, constructing those perturbations
  without using target labels.
concept_kind: algorithm
identity_notes: 'VAT denotes the Miyato et al. procedure described in the 2018 manuscript revision. The
  virtual target is the model’s current prediction. Label-free perturbation construction does not mean
  the complete supervised or semi-supervised training objective has no labels. VAT is a component of IMSAT
  but is not that information-maximization framework or a generative adversarial network. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 203 preceding native IDs/names/aliases.
  Ignored-inclusive word-delimited searches of both full checkouts returned 52 worktree and 75 main-checkout
  lines: existing component discussions and discovery/review references, plus unrelated ignored dependency
  text in main. Short acronyms were compared in normalized identities. Four nearest maintained mechanisms
  and eleven exact AIO candidate nodes with direct parent edges were inspected.'
limitations:
- The Hessian direction relies on a local quadratic approximation and finite-difference power iteration.
  One iteration does not solve the exact finite-radius maximization and provides no certified adversarial
  robustness.
- The perturbation radius, norm, input representation and regularization weight affect which prediction
  changes are penalized. Semantic label preservation is not guaranteed for arbitrary perturbations.
- A constant classifier can have zero consistency loss; VAT alone does not identify meaningful classes.
  The task loss or other learning signals remain material.
- The author code uses epsilon-stabilized vector normalization, so its returned vector need not have exactly
  the ideal radius. Batch-normalization handling and finite arithmetic also belong to implementation scope.
- Three source files were inspected at the declared ranges without execution. The earlier 2015 precursor
  was identified but its full methods were not compared; no historical-version equivalence or benchmark
  reproduction is asserted.
