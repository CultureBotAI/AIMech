claims:
- claim_id: r422-composed-quantizer-sparsifier-rescaled-contraction-lemma
  kind: mechanism
  statement: When composing a k-contraction sparsifier Comp_k in R^d and an unbiased stochastic quantizer Q_s with relative variance E||Q_s(u) - u||_2^2 <= beta_{k,s} ||u||_2^2, the unscaled operator Q_s(Comp_k(x)) has contraction factor gamma = (1 - beta_{k,s})(k / d) which fails whenever beta_{k,s} >= 1 (Lemma 1), whereas the rescaled operator Q_s(Comp_k(x)) / (1 + beta_{k,s}) (Lemma 2, Corollary 1) is unconditionally a gamma-contraction for all beta_{k,s} > 0 with strictly larger contraction coefficient gamma = k / (d (1 + beta_{k,s})) > (1 - beta_{k,s})(k / d).
  evidence:
  - source_id: r422-primary-pdf
    locator: Section 2 Contraction Operators (Lemmas 1-3, Corollary 1) & Appendix A
    relation: supports
- claim_id: r422-block-error-memory-bound-and-nonconvex-strongly-convex-rates
  kind: mechanism
  statement: Under synchronization period H and contraction parameter gamma, the local error memory satisfies E||m_t^{(r)}||_2^2 <= 4 (1 - gamma^2) / gamma^2 * eta^2 H^2 G^2 (Lemma 4), yielding smooth non-convex convergence at rate O(1 / sqrt(R T)) + O(H^2 / (gamma^2 T)) (Theorem 1, Corollary 2) and strongly convex convergence at rate O(1 / (R T)) + O(H^2 / (gamma^2 T^2)) (Theorem 2).
  evidence:
  - source_id: r422-primary-pdf
    locator: Section 4 Main Results (Theorems 1-6, Corollaries 2-3) & Appendix B (Lemma 4, Proofs of Theorems 1-2)
    relation: supports
- claim_id: r422-second-moment-gradient-bound-and-quadratic-h-gamma-penalty-limitation
  kind: limitation
  statement: Relies on a uniform second-moment bound E||g(x)||_2^2 <= G^2 to bound the block error accumulator m_t^{(r)}, and the higher-order error term scales quadratically with the ratio H / gamma.
  evidence:
  - source_id: r422-primary-pdf
    locator: Section 4 Assumptions & Theorem 1-2 Remarks
    relation: supports
- claim_id: r422-resnet50-imagenet-and-cifar10-joint-compression-application
  kind: application
  statement: Applied to distributed training of ResNet-50 on ImageNet and ResNet-20/VGG-11 on CIFAR-10, combining Top-k sparsification, 2-bit/4-bit QSGD quantization, and H = 4-8 local SGD steps to achieve up to 1000x communication reduction.
  evidence:
  - source_id: r422-primary-pdf
    locator: Section 5 Experiments (Figures 1-4), pp. 14675-14678
    relation: supports
