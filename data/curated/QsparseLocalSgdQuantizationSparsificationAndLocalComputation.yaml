id: AIMech:QsparseLocalSgdQuantizationSparsificationAndLocalComputation
name: Qsparse-local-SGD (Distributed SGD with Quantization, Sparsification, and Local Computations)
concept_kind: algorithm
review_status: DRAFT
definition: A unified distributed and decentralized optimization algorithm (Basu et al. 2019, Algorithms 1-2) that combines local multi-step SGD updates over synchronization periods of length H >= 1, composite gradient compression via a composed k-sparsifier Comp_k and s-level stochastic quantizer Q_s rescaled as Q_s(Comp_k(x)) / (1 + beta_{k,s}), and local error-memory compensation m_{t+H}^{(r)} = m_t^{(r)} + Delta x_t^{(r)} - Q(m_t^{(r)} + Delta x_t^{(r)}) across both synchronous and asynchronous parameter-server and decentralized topologies.
identity_notes: Distinct from uncompressed Local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent, Stich 2019), which performs periodic averaging every H steps without quantization, sparsification, or error memory, and from single-step Sparsified SGD with Error Memory (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression) and QSGD (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding), neither of which composes contractive sparsification with unbiased quantization over multi-step local blocks H > 1.
aliases:
- Qsparse-local-SGD
- Quantized Sparsified Local Stochastic Gradient Descent
- Error-Compensated Composed Quantizer-Sparsifier Local SGD
