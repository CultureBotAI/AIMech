aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 295 preceding native identities, ignored/hidden
    full-checkout text, six exact AIO CLASS targets and six neighboring native methods.
  rationale: No suitable AIO target was found for the ACO framework in the inspected snapshot and semantic
    neighborhood. Instance-specific learning relations and model labels are not generalized into a framework
    identity.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The framework is general constructive optimization, not specifically preprocessing
      or training a machine-learning model.
  - target: AIO:MachineLearningTask
    rejection_reason: The target is a learning task, whereas this record defines a general search framework;
      optimization terminology alone does not identify that task.
  - target: AIO:ReinforcementLearning
    rejection_reason: Some ACO members have explicit reinforcement-learning formulations, but the framework
      does not require their action-value or policy-learning semantics. Their individual related matches
      do not establish an appropriate relation for every ACO instantiation.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: Artificial ants and shared search memory do not establish a reward-fine-tuned language-model
      identity.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The target is a large language model; population-search analogies and its related
      evolutionary-algorithms synonym do not identify this framework.
  - target: AIO:MarkovChain
    rejection_reason: A stochastic augmented-state representation does not make this constructive search
      framework the pinned network/model class. Its representation and transition laws remain instance
      dependent.
