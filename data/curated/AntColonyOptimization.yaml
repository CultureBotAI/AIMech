claims:
- claim_id: method
  kind: mechanism
  statement: Represent the problem through states or solution components, feasible local moves and an
    objective. Artificial ants incrementally construct a solution or a component of one, maintaining private
    history as needed for feasibility. Their stochastic decisions use locally available pheromone information
    and, where configured, problem-specific heuristic information. Search experience changes the shared
    pheromone representation so later constructions can exploit prior discoveries. The framework schedules
    ant generation/activity, pheromone evaporation or forgetting, and optional globally informed daemon
    actions such as extra pheromone updates or local optimization. Deposits can occur during construction,
    after a solution is evaluated, or through the daemon; the ant’s stepwise and delayed deposit routines
    can both be absent when the daemon supplies deposits. A concrete algorithm must specify the representation,
    decision policy, update rule, scheduling and stopping criterion. Sequential or concurrent schedules
    are permitted by the prose; the framework does not prescribe a universal tau-power formula, inverse-cost
    deposit, elite rule or trail bound.
