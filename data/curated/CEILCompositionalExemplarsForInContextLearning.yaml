id: AIMech:CEILCompositionalExemplarsForInContextLearning
name: CEIL Compositional Exemplars for In-Context Learning
concept_kind: algorithm
review_status: DRAFT
definition: A subset-level exemplar selection algorithm for in-context learning that models the joint probability of an entire demonstration subset conditioned on the test input using a learnable conditional Determinantal Point Process (DPP) kernel balancing query relevance and inter-exemplar diversity, optimizes the dual neural embedders via a pairwise ranking margin loss supervised by the target language model's conditional decoding probability on sampled exemplar subsets, and selects the test-time demonstration set via greedy Cholesky maximum a posteriori (MAP) inference.
identity_notes: Distinct from singleton dense prompt retrieval (AIMech:EPREfficientPromptRetrievalForInContextLearning) and kNN example selection (AIMech:KATEkNNAugmentedInContextExampleSelection), which score and retrieve each demonstration independently and can select redundant near-duplicate examples, whereas CEIL optimizes the determinant of a conditional DPP submatrix log det(L'_S) = (1/lambda) sum_{i in S} r_i + log det(L_S) to capture negative pairwise interactions and compositional coverage across the selected subset.
aliases:
- CEIL
- Compositional Exemplars for In-Context Learning
- Conditional DPP In-Context Exemplar Subset Selection
