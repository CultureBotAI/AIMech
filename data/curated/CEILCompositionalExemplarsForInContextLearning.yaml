claims:
- claim_id: ceil-conditional-dpp-relevance-diversity-kernel
  kind: mechanism
  statement: CEIL defines a conditional DPP kernel matrix L' = Diag(exp(r / (2*lambda))) * L * Diag(exp(r / (2*lambda))) over learned neural embeddings of the test input x and candidate exemplars a_i, yielding an unnormalized subset log-probability log det(L'_S) = (1/lambda) sum_{i in S} r_i + log det(L_S) that explicitly trades off query-exemplar relevance r_i against subset diversity log det(L_S).
  evidence:
  - source_id: r739-primary-pdf
    locator: Section 3.1, pp. 2-3, Equation 2
    relation: supports
- claim_id: ceil-pairwise-margin-contrastive-subset-loss
  kind: mechanism
  statement: To train the conditional DPP without computing the O(N^3) normalizer det(L' + I), CEIL scores M sampled candidate subsets S_{ij} per training instance using the inference language model s_{ij} = P_LM(y_i | S_{ij}, x_i) and minimizes a rank-weighted pairwise margin loss over log det(L'_{S^-}) - log det(L'_{S^+}).
  evidence:
  - source_id: r739-primary-pdf
    locator: Section 3.2, pp. 3-4
    relation: supports
- claim_id: ceil-greedy-cholesky-map-inference-and-compositionality
  kind: application
  statement: At inference time, CEIL narrows the datastore to n candidates via kNN search and runs O(nK) incremental Cholesky greedy MAP inference to select K exemplars, outperforming EPR and TopK retrievers across 12 classification, commonsense, QA, code generation, and compositional semantic parsing benchmarks (GeoQuery and SMCalFlow-CS).
  evidence:
  - source_id: r739-primary-pdf
    locator: Section 3.3 & Section 4.4-4.5, pp. 4-7, Tables 2-3
    relation: supports
  - source_id: r739-metadata-cr
    locator: DBLP bibliographic record Jiacheng Ye et al. ICML 2023
    relation: supports
- claim_id: ceil-subset-scoring-construction-cost-limitation
  kind: limitation
  statement: Constructing training data for CEIL requires scoring multi-example candidate subsets with the language model rather than single examples, increasing offline dataset construction latency compared to singleton retrievers such as EPR.
  evidence:
  - source_id: r739-primary-pdf
    locator: Appendix C Limitation, p. 15
    relation: supports
