name: Population Based Augmentation
definition: An augmentation-schedule learning procedure that jointly trains a population of child classifiers
  and evolves their augmentation hyperparameters by copying successful members and perturbing their policies
  over training time.
concept_kind: algorithm
identity_notes: PBA learns a time-dependent augmentation schedule using population-based training; it
  is not identical to general PBT, fixed-policy AutoAugment, fixed-model Fast AutoAugment scoring, or
  a population ensemble used at inference. The transferred artifact is the schedule, not the child model
  checkpoint. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 247 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout, returning 6 lines in the worktree and 6 in main. These
  were prior candidate leads, not concept records. Twelve exact AIO CLASS nodes with synonyms and outgoing
  edges and six neighboring native mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.
limitations:
- The count distribution sets a maximum number of successful applications, not a guarantee of exactly
  that many operations. At zero probabilities no operation is applied even when the cap is positive; this
  is distinct from sampling exactly two operations.
- Each probability perturbation operates on an integer tenths-grid index, not by adding an unscaled integer
  to a probability in[0,1]. Some operations ignore magnitude.
- The retained schedule can change non-monotonically; a hypothesis that augmentation should strengthen
  through training is not a monotonicity constraint.
- Validation-guided population selection and schedule transfer can depend on population size, search data,
  model, duration and transformation choices. No guaranteed schedule quality, universal transfer, cost
  ratio or benchmark advantage is asserted.
- The source PDF and arXiv author list place Xi Chen last; the PMLR landing metadata orders the authors
  differently. Bibliographic order here follows the inspected primary PDF.
