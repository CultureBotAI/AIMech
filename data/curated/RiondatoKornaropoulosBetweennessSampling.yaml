  search_scope: Compared all442 pinned AIO and695 preceding native identities, with ignored- and hidden-inclusive
    searches across three checkouts. Semantic assessment covers155 AIO and540 native definitions, including
    the newly added KADABRA sampler; eleven complete AIO contexts and seven full native neighbors assessed.
  rationale: No examined AIO class denotes the graph-specific VC sample-size and uniform shortest-path
    estimator. Statistical learning theory supplies its guarantee but does not make the estimator a neural
    architecture, bias category, clustering task or data-preparation identity.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: Estimating a vector of centrality values does not group vertices into clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Absence of labels does not turn all-node path-indicator averaging into clustering.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity includes a specific randomized sampling procedure and VC-based sample
      count, not only a mathematical input-output function.
  - target: AIO:DataPreparation
    rejection_reason: The defined output is estimated graph prominence; possible downstream use as a feature
      does not establish a preprocessing identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The shortest-path estimator neither fits a language model nor learns a graph representation.
  - target: AIO:RankingBias
    rejection_reason: A network centrality estimate is not the belief that highly ranked information is
      necessarily relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Uniform pair/path sampling is the defined procedure, not a selection-bias concept.
  - target: AIO:RepresentationBias
    rejection_reason: The mathematical centrality estimator does not denote subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: The algorithm does not acquire labels or fit a deep neural network.
  - target: AIO:DataDredgingBias
    rejection_reason: A predetermined sample-size bound and iid estimation do not denote data-dredging
      bias.
  - target: AIO:BidirectionalLayer
    rejection_reason: The algorithm is not a recurrent-neural-network wrapper; shortest-path counting
      does not instantiate the AIO layer.
limitations:
- The sample-size guarantee is conditional on a sufficient theorem constant, a valid vertex-diameter upper
  bound and iid draws independent of its selection. No explicit universal validity of c=0.5 is asserted.
- Strictly positive weights, simple static graphs and exact shortest-path counts are the maintained scope.
  Zero-weight cycles, multigraph conventions, finite-precision counting and dynamic changes need separate
  analysis.
- The all-ordered-pair denominator includes unreachable pairs. A single collapsed empty path must carry
  the aggregate unreachable-pair mass; dropping it or assigning only one pair’s mass changes the distribution.
- The source contains small-diameter and equation-versus-pseudocode boundaries. This record follows the
  scoped mathematical procedure, not literal unqualified execution of Algorithm 1.
- Only selected source displays were visually inspected; remaining figures, tables and proof displays
  are text-only. No general proof certification, author-code execution, benchmark replication or publisher-byte
  equivalence.
- Top-k, edge, bounded-distance and walk variants, and the diameter-sample reuse optimization remain outside
  this identity. DRAFT remains after author self-review.
