id: AIMech:RiondatoKornaropoulosBetweennessSampling
name: Riondato–Kornaropoulos fixed-sample betweenness approximation
aliases:
- RK betweenness approximation
- Riondato–Kornaropoulos betweenness sampling
concept_kind: algorithm
definition: A fixed-sample graph betweenness approximation algorithm that chooses a sample count using
  a VC-dimension bound for shortest-path incidence ranges, then averages internal-vertex indicators from
  independent uniform endpoint-pair and conditional shortest-path draws.
definition_evidence:
- source_id: riondatokornaropoulos2016author
  locator: Sections 4 and 5.1, Corollary 1, Equation 3 and Algorithm 1, PDF pp. 9 and 15–19
  relation: supports
claims:
- claim_id: domain-and-estimand
  kind: scope
  statement: The maintained core applies to finite simple static directed or undirected graphs with n>=3
    and strictly positive edge weights, including unit weights. Draw an ordered pair of distinct vertices
    uniformly from all n(n-1) pairs, then a shortest path uniformly among that pair’s shortest paths.
    Unreachable pairs contribute an empty path and zero indicators. The output averages indicators for
    internal vertices only and targets shortest-path betweenness normalized by n(n-1). At a fixed sample
    count chosen independently of the main sample stream, each estimate is unbiased for that target.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Section 3.1, PDF pp. 5–6; Section 5.1, pp. 15–19
    relation: supports
- claim_id: vc-based-fixed-count
  kind: mechanism
  statement: Let D_hat>=3 be a valid integer upper bound on the maximum number of vertices in any shortest
    path, fixed before the main sample stream. Corollary 1 supplies d=floor(log2(D_hat-2))+1 as a VC-dimension
    upper bound for the internal-vertex path-incidence ranges. For tolerance epsilon and failure budget
    delta in (0,1), Equation 3 prescribes r=ceil((c/epsilon^2)(d+ln(1/delta))), using a constant c sufficient
    for the cited uniform-convergence theorem. Under its assumptions, the resulting iid sample gives simultaneous
    all-vertex additive error at most epsilon with probability at least 1-delta. The author manuscript
    calls c approximately 0.5 an estimate; this record does not certify that experimental value as a universal
    sufficient constant.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Theorem 1 and following constant discussion, PDF p. 8; Corollary 1, p. 9; Section 5.1, Equation
      3, p. 15
    relation: supports
- claim_id: count-weighted-path-sampling
  kind: mechanism
  statement: For each sampled pair (s,t), a shortest-path search computes distances, predecessor sets
    and exact shortest-path counts sigma_sx. Starting at t, choose predecessor z of the current vertex
    x with probability sigma_sz/sigma_sx and continue to s. The factors telescope to probability 1/sigma_st
    for each complete shortest path. All equal-distance predecessor contributions must be retained; choosing
    predecessors uniformly can bias the complete-path law. Add 1/r to each internal vertex’s score and
    perform exactly r pair draws, including unreachable pairs.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Section 5.1, PDF pp. 16–17 and Algorithm 1; curator weighted-path calculations in research/discovery/rk-path-boundaries.py
    relation: supports
- claim_id: diameter-and-transcription-boundaries
  kind: limitation
  statement: Vertex diameter counts vertices on shortest paths, not total edge weight or the minimum number
    of hops. A largest weakly connected component’s vertex count is a safe graph-dependent upper bound
    for the maintained positive-weight domain. If the actual vertex diameter is at most two, all internal-vertex
    scores are zero; log(VD-2) must not be evaluated blindly. Equation 3 includes the +1 in the VC bound,
    whereas Algorithm 1 line 5 omits it. Integer rounding is required. The undirected unique-shortest-path
    bound VC<=3 must not be extended to directed graphs. Source reuse of a diameter-estimation draw as
    a main sample needs a separate dependence argument; it is outside this record’s independent-main-stream
    scope.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Definition 1, PDF p. 6; Corollary 1 and Lemma 2, pp. 9–10; directed counterexample, pp. 11–12;
      Equation 3, p. 15; Algorithm 1 and diameter approximation, pp. 17–18
    relation: supports
- claim_id: finite-law-and-normalization-checks
  kind: limitation
  statement: Curator enumeration compares count-weighted backtracking with an independent simple-path
    oracle on all 729 directed three-vertex graphs whose arcs are absent or have weight 1 or 2, covering
    4374 ordered-pair cases. A separate unequal-predecessor example gives three paths probability 1/3
    each, versus 1/4,1/4,1/2 under uniform predecessor choice. A directed three-vertex chain plus an isolated
    vertex has empty-path probability 3/4 and central-vertex expectation 1/12; conditioning away unreachable
    pairs changes it to 1/3. Arithmetic with D_hat=4, epsilon=0.05, delta=0.1 and the experimental c=0.5
    gives ceilings 861 from Equation 3 and 661 from the omitted-+1 transcription. These finite checks
    certify neither the constant nor general confidence coverage.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Section 5.1, PDF pp. 15–19; explicit curator calculations in research/discovery/rk-path-boundaries.py
    relation: supports
- claim_id: identity-and-evaluation-scope
  kind: limitation
  statement: The fixed VC-based sample count distinguishes this algorithm from KADABRA’s adaptive stopping
    and ABRA’s exact pair-fraction estimators; its complete centrality estimator is also distinct from
    a conditional path-sampling subroutine. The inspected manuscript’s historical C/igraph implementation
    and five-run experiments use c=0.5, delta=0.1 and selected directed, undirected and synthetic networks.
    They do not establish a universal speedup, validate every parameter setting or certify current software.
    Relative top-k output, edge betweenness, bounded-distance and walk variants require separate identity
    and evidence assessment.
  evidence:
  - source_id: riondatokornaropoulos2016author
    locator: Sections 5.1–5.2, 6 and 7, PDF pp. 15–35; named-neighbor distinction assessed against the
      maintained KADABRA and ABRA records
    relation: supports
identity_notes: 'Compared all 442 pinned AIO and 695 native identities; no normalized match. Ignored-
  and hidden-inclusive searches of three full checkouts returned 51,0,0 lines, all read as existing RK
  source URLs, leads or query strings. Semantic assessment covered 155 AIO and 540 native definitions:
  all155 prior AIO and539 prior native rows verified unchanged, and the newly added conditional KADABRA
  sampler row and full record read. Eleven complete AIO contexts and seven full native neighbors were
  assessed; corrected KADABRA contexts were reassessed. The maintained identity is all-node fixed-sample
  path-indicator averaging with a VC-based sample count, not KADABRA adaptive stopping, ABRA pair-fraction
  averaging, exact Brandes accumulation, pivot dependency sampling or a conditional path sampler. Top-k
  and other estimands require separate assessment.'
