- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Constrained convex p-value weighting (Princessp) allocates monotone, box-bounded per-hypothesis
    significance thresholds q w_j using prior effect-size estimates while strongly controlling frequentist
    family-wise error rate or false discovery rate to prevent multiplicity-induced false positives (AIO:DataDredgingBias).
limitations:
- Concavity of the receiver operating characteristic (ROC) objective R_j(q w_j) requires continuous test
  statistics with monotone likelihood ratio (Proposition 2.1) or canonical exponential-family structure
  for two-sided equal-tailed tests (Proposition 2.2); discrete test statistics produce piecewise-constant
  step-function ROC curves that are not concave (Section 2.1), and non-MLR heavy-tailed models such as
  the Cauchy shift family violate concavity (Section 2.1).
- In the log-barrier interior-point solver (Section 4.2.1–4.2.2), adjacent weights that are equal at the
  constrained optimum (w_k^* = w_{k+1}^*) force the barrier Hessian entries (w_{k+1} - w_k)^{-2} -> infinity
  as the barrier parameter t increases, causing numerical ill-conditioning for large J > 10^3 that requires
  solving the convex program on a grid/subsample of size S ~ 500 and linearly interpolating the resulting
  monotone weight function (Section 4.2.2).
- Princessp optimizes weights assuming point estimates mu_j of the prior effect sizes and requires user
  specification of the lower bound l in [0, 1] and upper bound u >= 1 (typically l in {0.1, 0.25, 0.5});
  when prior effect estimates have known heterogeneous standard errors sigma_j > 0 in a Gaussian model
  without order constraints, analytical Bayes p-value weighting (Dobriban et al. 2015) directly integrates
  over the Gaussian prior uncertainty.
- 'All 962 lines of Dobriban (2018, Information and Inference: A Journal of the IMA 7(2):251-275, arXiv:1603.05334v2,
  DOI:10.1093/imaiai/iax013) were read. Constructed numerical checks in research/discovery/constrained-convex-p-value-weighting-in-monotone-likelihood-ratio-families-boundaries.py
  verify (1) Proposition 2.1 ROC concavity in Gaussian shift and Exponential scale MLR families (gaussian_roc_strictly_concave
  = True, exp_mlr_strictly_concave = True) versus non-concavity of the critical-value parametrization
  (second derivative at c = -3 is +0.241971 > 0) and discrete Bernoulli step ROC (bernoulli_step_roc_non_concave
  = True), (2) Propositions 2.2 & 2.3 two-sided exponential-family concavity and exact closed-form two-sided
  Gaussian arccosh weights (lambda^* = 0.08047, budget error = 0.0, max KKT stationarity error = 9.71445146547012e-17),
  (3) Propositions 3.1 & 3.2 small-q monotonicity at q = 4e-06 (monotone = True) versus moderate-q non-monotonicity
  at q = 0.001 where w^*(|mu|=3.5) = 1.16198 < w^*(|mu|=2.2) = 2.375011 and Proposition 3.2 two-sided
  mode a^* = 230.464399 (root error = 2.6645352591003757e-15), and (4) Section 4.2 Princessp O(J) tridiagonal-plus-rank-1
  Sherman-Morrison KKT solver (KKT residual = 4.6629367034256575e-15, order and box constraints satisfied
  = True / True, active-tie barrier curvature max H = 1.24e+10, and power on an underestimated true signal
  mu_true = -2.5 improved from 0.0 under Spjotvoll to 0.391248 under Princessp with l = 0.5).'
