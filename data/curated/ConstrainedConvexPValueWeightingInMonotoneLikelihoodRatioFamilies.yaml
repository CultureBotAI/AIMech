claims:
- claim_id: roc-reparametrization-concavity-in-mlr-families
  kind: mechanism
  statement: Whereas the critical-value parametrization c_j -> 1 - F_{a,j}(c_j) subject to J^{-1} sum_{j=1}^J
    (1 - F_{0,j}(c_j)) = q is non-convex (neither concave nor convex even in the Gaussian shift model),
    re-parametrizing power in terms of the per-test significance threshold u_j = q w_j via the receiver
    operating characteristic (ROC) function R_j(u_j) = 1 - F_{a,j}(F_{0,j}^{-1}(1 - u_j)) (for upper-tail
    tests) or F_{a,j}(F_{0,j}^{-1}(u_j)) (for lower-tail tests) yields a concave function on [0, 1] with
    derivative R_j'(u_j) = f_{a,j}(F_{0,j}^{-1}(1 - u_j)) / f_{0,j}(F_{0,j}^{-1}(1 - u_j)) whenever the
    test statistic comes from an absolutely continuous parametric family {F_theta} with monotone likelihood
    ratio (MLR) and theta_{a,j} > theta_{0,j} (Proposition 2.1, Section 6.1), reducing optimal p-value
    weighting under any convex constraint set C to a convex optimization problem.
  evidence:
  - source_id: dobriban2018-princessp-ar5iv
    locator: Section 2.1, lines 155–227, Proposition 2.1; Section 6.1, lines 682–711
    relation: supports
  - source_id: dobriban2018-princessp-crossref
    locator: Information and Inference 7(2):251–275 publication record
    relation: supports
- claim_id: two-sided-exponential-family-concavity-and-closed-form-gaussian-weights
  kind: mechanism
  statement: 'For two-sided tests rejecting H_{0,j}: theta_j = 0 in favor of theta_j != 0 when |T_j| >=
    z(u_j/2) with F_0(z(u)) = 1 - u in a canonical one-parameter exponential family f_theta(t) = exp(theta
    t - A(theta)) f_0(t), the two-sided ROC function R_theta(u) = 1 - F_theta(z(u/2)) + F_theta(-z(u/2))
    has derivative R_theta''(u) = (1/2)[f_theta(z(u/2))/f_0(z(u/2)) + f_theta(-z(u/2))/f_0(-z(u/2))] =
    exp(-A(theta)) cosh(theta z(u/2)), which is non-increasing on [0, 1] because u -> z(u/2) >= 0 is decreasing
    and cosh(|theta| x) is increasing on [0, infinity), establishing concavity of R_theta(u) on [0, 1]
    (Proposition 2.2, Section 6.2); in particular, for the two-sided Gaussian model T_j ~ N(mu_j, 1) with
    mu_j != 0, whenever J^{-1} sum_{j=1}^J Phi(-|mu_j|/2) >= q/2, the unconstrained Spjotvoll two-sided
    optimal weights are given in closed form by w_j^* = 2 q^{-1} Phi(-|mu_j|/2 - |mu_j|^{-1} arccosh(lambda
    exp(mu_j^2/2))), where lambda > 1 is the unique root of J^{-1} sum_{j=1}^J w_j(lambda) = 1 (Proposition
    2.3, Section 6.3).'
  evidence:
  - source_id: dobriban2018-princessp-ar5iv
    locator: Section 2.2, lines 228–285, Propositions 2.2 and 2.3; Section 6.2–6.3, lines 712–748
    relation: supports
  - source_id: dobriban2018-princessp-abs
    locator: Abstract (convex optimization formulation for one-sided and two-sided tests)
    relation: supports
- claim_id: spjotvoll-non-monotonicity-at-moderate-significance-levels
  kind: mechanism
  statement: 'In the Gaussian shift model with distinct non-zero prior effect sizes |mu_j|, there exists
    a critical significance threshold q_0 > 0 such that the unconstrained Spjotvoll weight vector w^*
    is strictly increasing in |mu_j| (both one-sided for mu_j < 0 and two-sided for mu_j != 0) for all
    q <= q_0 (Proposition 3.1, Section 6.4), whereas for larger q > q_0 when dual multiplier lambda >
    1, the weight function mu -> w^*(mu) is unimodal on (-infinity, 0): it increases from 0 at mu = 0
    to a peak at the negative root mu = -sqrt(2 log lambda) of mu^2/2 - log lambda = 0 (one-sided) or
    at the unique root mu = -sqrt(a^*) of a - 2 tanh(a/2 + acosh(lambda exp(a/2))) acosh(lambda exp(a/2))
    = 0 (two-sided, Proposition 3.2, Section 6.5) and then decreases to Phi(0)/q = 1/(2q) as |mu| -> infinity,
    paradoxically assigning smaller weights to the largest prior effects than to intermediate prior effects.'
  evidence:
  - source_id: dobriban2018-princessp-ar5iv
    locator: Section 3.1–3.2, lines 286–395, Propositions 3.1 and 3.2, Figures 1–2; Section 6.4–6.5, lines
      749–830
    relation: supports
- claim_id: princessp-order-and-box-constrained-tridiagonal-rank1-solver
  kind: mechanism
  statement: 'To eliminate both the non-monotonicity of unconstrained Spjotvoll weights at moderate q
    and the fragility of assigning zero weight to underestimated effects, Princessp (Section 3.1 & Section
    4.1–4.2) sorts hypotheses by |mu_1| <= |mu_2| <= ... <= |mu_J| and maximizes J^{-1} sum_{j=1}^J R_j(q
    w_j) over the convex polytope C = {w in R^J : J^{-1} sum_{j=1}^J w_j = 1, l <= w_j <= u, w_1 <= w_2
    <= ... <= w_J} with lower bound l in (0, 1] and upper bound u >= 1; in the log-barrier interior-point
    method minimizing t f_0(w) + sum_{k=1}^{J+1} phi_k(w) subject to 1^T w = J, the barrier Hessian H
    is symmetric tridiagonal (because each constraint w_k - w_{k+1} <= 0 couples only adjacent indices),
    so the Newton KKT system [[H, 1], [1^T, 0]] [Delta w; nu] = [-g; 0] decomposes into two tridiagonal
    linear solves H x = -g and H y = 1 combined via the Sherman-Morrison formula nu = (1^T x)/(1^T y)
    and Delta w = x - nu y in O(J) arithmetic operations per Newton step (Section 4.2.1), while a hybrid
    subsampling and linear-interpolation scheme resolves numerical ill-conditioning from active equality
    clusters when J is large (Section 4.2.2).'
  evidence:
  - source_id: dobriban2018-princessp-ar5iv
    locator: Section 3.1, lines 295–338; Section 4.1–4.2.2, lines 396–556; Section 5.1–5.2, lines 557–660
    relation: supports
