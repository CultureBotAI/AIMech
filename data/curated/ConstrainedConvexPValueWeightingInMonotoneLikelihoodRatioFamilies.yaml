id: AIMech:ConstrainedConvexPValueWeightingInMonotoneLikelihoodRatioFamilies
name: Constrained convex p-value weighting in monotone likelihood ratio families (Princessp)
aliases:
- Princessp
- Prior-Informed Convexly Constrained Spjotvoll P-Value Weighting
- Order- and Box-Constrained Convex P-Value Weighting
- Monotone Likelihood Ratio Convex P-Value Weighting
concept_kind: mathematical_method
definition: 'A convex-optimization p-value weighting methodology (Princessp: ''PRior-INformed, Convexly
  Constrained Spjotvoll'') introduced by Edgar Dobriban (2018, Information and Inference: A Journal of
  the IMA 7(2):251-275, arXiv:1603.05334v2, DOI:10.1093/imaiai/iax013) for testing massive collections
  of J hypotheses H_{0,j}: theta_j = theta_{0,j} against H_{a,j}: theta_j = theta_{a,j} at per-test significance
  level q in (0, 1) using p-values P_j and prior weights w_j >= 0 with J^{-1} sum_{j=1}^J w_j = 1 (controlling
  the family-wise error rate via weighted Bonferroni P_j <= q w_j or the false discovery rate via weighted
  Benjamini-Hochberg). By re-parametrizing the power of the j-th test in terms of the p-value threshold
  u_j = q w_j as the receiver operating characteristic (ROC) function R_j(u_j) = F_{a,j}(F_{0,j}^{-1}(u_j))
  rather than the non-concave critical-value parametrization c_j = F_{0,j}^{-1}(q w_j), Dobriban proves
  that R_j(u_j) is concave on [0, 1] whenever the test statistic comes from an absolutely continuous parametric
  family with monotone likelihood ratio (MLR) for one-sided tests (Proposition 2.1) or from a canonical
  exponential family for two-sided equal-tailed tests |T_j| >= z(u_j/2) (Proposition 2.2), where unconstrained
  two-sided Gaussian weights take the closed form w_j^* = 2 q^{-1} Phi(-|mu_j|/2 - |mu_j|^{-1} arccosh(lambda
  exp(mu_j^2/2))) (Proposition 2.3). Because unconstrained Spjotvoll weights become non-monotone in |mu_j|
  when q exceeds a critical level (assigning less weight to the largest effect sizes; Propositions 3.1-3.2)
  and place zero weight on small prior effects, Princessp maximizes J^{-1} sum_{j=1}^J R_j(q w_j) subject
  to the convex constraint set C = {w in R^J : J^{-1} sum_{j=1}^J w_j = 1, l <= w_j <= u, w_1 <= w_2 <=
  ... <= w_J} for hypotheses sorted by increasing |mu_j|, enforcing effect-size monotonicity and non-zero
  minimum weights l in (0, 1] via an O(J)-step interior-point Newton solver whose barrier Hessian + order-constraint
  KKT matrix reduces to a symmetric tridiagonal-plus-rank-1 system solved in O(J) time via the Sherman-Morrison
  formula combined with hybrid subsampling for large J.'
identity_notes: No normalized identity match for Constrained convex p-value weighting in monotone likelihood
  ratio families (Princessp) across all 442 pinned AIO records and 591 maintained IDs, names, aliases
  and scoped synonyms. Only frontier reference matches in Round 194-196 discovery artifacts were found.
  Distinct from AIMech:BayesOptimalPValueWeightingUnderGaussianPrior (Dobriban, Fortney, Kim, & Owen 2015),
  which models uncertain Gaussian priors mu_i ~ N(eta_i, sigma_i^2) on one-sided Gaussian means and solves
  an unconstrained non-convex marginal power optimization via quadratic-root critical values and jump-discontinuity
  sorting, whereas Dobriban (2018) proves concavity of the ROC function R_j(q w_j) across general monotone
  likelihood ratio (MLR) families and two-sided exponential-family tests (Propositions 2.1-2.3), proves
  non-monotonicity of unconstrained Spjotvoll weights in |mu_j| for moderate q (Propositions 3.1-3.2),
  and formulates Princessp to maximize average ROC power under linear order constraints w_1 <= ... <=
  w_J and box bounds l <= w_j <= u via an O(J) tridiagonal-plus-rank-1 interior-point solver (Section
  4.2); and distinct from AIMech:OptimalMultiWeightedStepUpProcedureForFDRControl (Roquain & van de Wiel
  2009) and AIMech:AdaptiveDataDrivenOptimalPValueWeighting (Durand 2019).
