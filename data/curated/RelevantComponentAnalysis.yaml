claims:
- claim_id: method
  kind: mechanism
  statement: Take the transitive closure of positive same-class constraints to obtain chunklets C_j with
    means m_j. Let N be the total number of observations in the chunklets, as clarified in Section 5,
    and compute Chat=(1/N)sum_j sum_(x in C_j)(x-m_j)(x-m_j)^T. When Chat is positive definite on the
    represented space, use the symmetric whitening transform W=Chat^(-1/2) on the original feature vectors.
    Equivalently, compare vectors with squared distance (x-y)^T Chat^(-1)(x-y). Large within-chunklet
    variance directions receive less weight. The method uses positive constraints without requiring explicit
    class labels or negative constraints. The paper permits an optional reduction before whitening and
    describes a constraints-based Fisher discriminant projection; nonsingularity must hold in the retained
    space.
  evidence:
  - source_id: method-source
    locator: Section 2, Algorithm 1 and Equation (1), PDF pp. 4–6 (printed 940–942); Section 5, PDF p.
      10, definition of N; Section 6 and Algorithm 2, PDF pp. 10–12 (printed 946–948), dimensionality
      and rank qualifications
    relation: supports
- claim_id: source-convention-check
  kind: limitation
  statement: 'Curator calculation: two chunklets {(0,0),(1,0),(2,0)} and {(10,0),(11,0),(12,0)} have within-chunklet
    covariance diag(2/3,0), of rank 1. The count sum_j(|C_j|-1)=4 exceeds the ambient dimension 2 while
    the covariance is singular. This disproves treating the sample-size count as a general exact rank
    or invertibility certificate. The exact calculation is saved in research/discovery/metric-source-boundaries.py.'
  evidence:
  - source_id: method-source
    locator: Section 2, Equation (1), PDF p. 4, supplies the covariance definition evaluated by the curator;
      Algorithm 2, PDF p. 12, supplies the challenged rank-count expression.
    relation: supports
