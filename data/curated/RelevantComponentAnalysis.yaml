name: Relevant component analysis
definition: A partially supervised linear metric-learning procedure that estimates within-group covariance
  from positive equivalence constraints and whitens the representation using that covariance.
concept_kind: algorithm
identity_notes: RCA forms chunklets from observations known to share a class without requiring their class
  names. Different chunklets need not represent different classes. It estimates variation within chunklets,
  unlike whitening by total covariance, and it does not optimize NCA’s stochastic neighbor reward. The
  maintained LDA record is a Gaussian classifier, not RCA or the optional constraints-based Fisher projection.
  This record describes batch RCA; online adaptation and optional dimensionality-reduction procedures
  are qualified extensions. No normalized identity match for this candidate was found across all 442 pinned
  AIO labels/scoped synonyms and 227 preceding native IDs/names/aliases. The same search identified BIRCH
  as an existing native record and excluded it from additions. Full-checkout word-delimited fixed-string
  searches included ignored and hidden files, with 79 worktree and 79 main-checkout matching lines; these
  concern BIRCH identity/proposal/review context and discovery leads. Ten exact AIO CLASS nodes with scoped
  synonyms and outgoing edges, and nine neighboring native records, were inspected.
limitations:
- The inverse and inverse square root require a nonsingular covariance on the represented space. Few,
  singleton or geometrically redundant chunklets may give a singular estimate. This record does not invent
  a universal pseudoinverse or regularization fallback.
- Algorithm 2 calls sum_j(|C_j|-1) the covariance rank. In general it is a sample-size upper bound, not
  the actual rank; collinearity can leave the covariance singular even when that count exceeds the feature
  dimension. The preceding prose’s rank-greater-than-dimension condition is not a feasible matrix-rank
  requirement. The source heuristic is not copied as an invertibility guarantee.
- Whitening can amplify low-variance noise, and erroneous equivalence constraints can contaminate entire
  chunklets through transitive closure. Small within-group variance is not itself evidence of relevance
  to a downstream task.
- The paper’s likelihood and information-optimality results have stated modeling assumptions; this record
  claims neither universal classification improvement nor unconditional statistical optimality. Optional
  cFLD, online RCA and their implementation details require separate scope assessments. No model was trained.
