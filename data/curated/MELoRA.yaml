claims:
- claim_id: melora-block-diagonal-mini-adapter-concatenation
  kind: mechanism
  statement: MELoRA partitions input activations x in R^{d_{in}} into n sub-vectors x_i in R^{d_{in}/n}, passes each sub-vector through a distinct mini-LoRA adapter B_i A_i with inner dimension r/n, and concatenates the resulting n sub-vectors of dimension d_{out}/n, which is algebraically equivalent to adding a block-diagonal update Delta_W = diag(B_1 A_1, ..., B_n A_n) to the frozen weight matrix W_0.
  evidence:
  - source_id: r664-primary-pdf
    locator: Section 3.1 (MELoRA Architecture) & Equations (2)-(4), pp. 3054-3055
    relation: supports
- claim_id: melora-additive-block-rank-with-one-over-n-parameter-cost
  kind: mechanism
  statement: "Because the rank of a block-diagonal matrix is the sum of the ranks of its diagonal blocks, n mini-LoRA blocks of rank r/n achieve a total update rank up to r using only r(d_{in} + d_{out}) / n trainable parameters\u2014or equivalently achieve an n-fold higher rank n r under the same parameter budget as a rank-r LoRA adapter."
  evidence:
  - source_id: r664-primary-pdf
    locator: 'Section 3.2 (Theoretical Analysis: Rank, Parameters, and Complexity), p. 3055, Table 1'
    relation: supports
- claim_id: melora-application-glue-and-llm-instruction-tuning
  kind: application
  statement: Evaluated on RoBERTa-base across GLUE tasks and LLaMA-2-7B across instruction-following, commonsense reasoning, and mathematical reasoning benchmarks, MELoRA consistently outperforms LoRA while using 8x fewer trainable parameters on GLUE and 2x to 4x fewer parameters on LLM instruction tuning.
  evidence:
  - source_id: r664-primary-pdf
    locator: Section 4 (Experiments), Tables 2-4, pp. 3056-3058
    relation: supports
- claim_id: melora-limitation-zero-off-diagonal-cross-block-feature-coupling
  kind: limitation
  statement: Because Delta_W = diag(B_1 A_1, ..., B_n A_n) is strictly block-diagonal, the adapter update cannot directly couple an input feature in block i with an output feature in block j != i within a single linear layer, relying instead on the frozen dense base matrix W_0 and subsequent layers for cross-block mixing.
  evidence:
  - source_id: r664-primary-pdf
    locator: Section 3.1 & Limitations section, pp. 3054, 3061
    relation: supports
