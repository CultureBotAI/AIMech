id: AIMech:MELoRA
name: MELoRA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning algorithm that partitions the input and output feature dimensions of a frozen linear layer into n disjoint sub-vectors and trains n mini-LoRA adapters arranged as a block-diagonal weight update matrix, preserving a cumulative matrix rank of r while reducing trainable parameters and adapter FLOPs by a factor of n relative to a single rank-r LoRA adapter.
identity_notes: Distinct from AIMech:LowRankAdaptation (LoRA), which applies a single dense low-rank update B A in R^{d_{out} x d_{in}} of rank r using r(d_{in} + d_{out}) parameters, and from multi-head or mixture-of-LoRA architectures that sum multiple full-dimension low-rank matrices across the entire feature space. MELoRA (Pengjie Ren, Chengshun Shi, Shiguang Wu, Mengqi Zhang, Zhaochun Ren, Maarten de Rijke, Zhumin Chen, and Jiahuan Pei, ACL 2024, pp. 3052-3064, arXiv:2402.17263) splits the input vector x in R^{d_{in}} into n contiguous segments x_i in R^{d_{in}/n} and applies an independent mini-LoRA module B_i A_i of inner rank r/n (with A_i in R^{(r/n) x (d_{in}/n)} and B_i in R^{(d_{out}/n) x (r/n)}) to each segment, concatenating the outputs. Equivalently, the overall weight update is the block-diagonal matrix Delta_W = diag(B_1 A_1, ..., B_n A_n) in R^{d_{out} x d_{in}}. Because the rank of a block-diagonal matrix equals the sum of the ranks of its diagonal blocks, rank(Delta_W) = sum_{i=1}^n rank(B_i A_i) <= n * (r/n) = r, while the total number of trainable parameters is n * (r/n) * (d_{in}/n + d_{out}/n) = r(d_{in} + d_{out}) / n.
aliases:
- Mini-Ensemble Low-Rank Adapters
- Block-Diagonal Mini-Ensemble LoRA
- MELoRA Parameter-Efficient Fine-Tuning
