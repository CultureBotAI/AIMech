limitations:
- This record identifies the intended greedy full-cover method, not a certified execution of the literal
  pseudocode. Empty candidate sets, unattainable shrunken coverage and no-progress termination require
  explicit implementation handling.
- At rho<1 the selection neighborhoods are smaller than the final PDD acceptance neighborhoods; the parameter
  does not simply replace theta at prediction. Eta denotes a covered fraction in baseline CPDD, unlike
  its marginal-gain role in FastCPDD.
- The general-metric hardness discussion does not establish a fixed-dimensional Euclidean claim. Full-cover
  set-cover approximation does not imply calibrated probability or universally lower true error.
- All 15 primary pages, algorithm figures and evaluation panels were visually read. Exact finite boundary
  checks were executed; original software, historical timings and the preliminary 2008 full text remain
  unverified.
