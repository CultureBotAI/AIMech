aio_mappings:
- target: AIO:BinaryClassification
  relation: related_match
  rationale: The PDD accept-versus-reject task, including detectors constructed by CPDD or FastCPDD, is
    related to AIO:BinaryClassification. This is an algorithm-to-task association, not equivalence or
    subclass membership. The target has Classification and SupervisedLearning ancestry, but the link does
    not assert representative abnormal-class training data. Inspected Classification, BinaryClassification,
    SupervisedLearning, UnsupervisedLearning, MachineLearningTask, all three KnearestNeighbor nodes, DimensionalityReduction,
    Distillation, DataPreparation and SelectionAndSamplingBias with annotations and outgoing edges. Neighbor
    voting or value averaging is distinct from radius-offset decisions; condensation does not reduce feature
    dimensions or assert a bias condition. Generic preparation and teacher-student distillation do not
    identify these covering procedures. Eleven native contexts distinguish NNDD distance norms, CNNDD
    reference selection, local distance ratios, bootstrap variability, density clustering, supervised
    metric learning, sphere support estimation and medoid optimization.
