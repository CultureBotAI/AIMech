id: AIMech:CompositionalSpatialTransformer
name: Compositional spatial transformer
concept_kind: layer
aliases: []
definition: A learnable image-alignment module that retains an original source image and accumulated warp
  state, samples that source under the current warp to predict an incremental transform, composes the
  increment with the state, and passes the source and updated geometry onward for later alignment or final
  sampling.
definition_evidence:
- source_id: lin2017
  locator: Section 4.1, PDF pp. 4–5 / printed pp. 2571–2572, Figures 3–4 and Equations 9–11.
  relation: supports
claims:
- claim_id: retained-source-and-geometric-state
  kind: mechanism
  statement: The module receives an original source image I and current warp parameters p_in. Its geometric
    predictor uses the source sampled under the current warp to estimate an update delta p. The module
    carries the original source and updated warp state onward, rather than replacing the source with the
    preceding cropped or resampled output. A later stage can therefore sample original pixels outside
    an earlier intermediate crop, provided those pixels are present in the retained source.
  evidence:
  - source_id: lin2017
    locator: Section 4.1, PDF p. 4 / printed p. 2571, Figures 2–3 and the geometry-preservation explanation;
      Figure 4, PDF p. 5.
    relation: supports
- claim_id: explicit-affine-left-composition
  kind: mechanism
  statement: For the displayed affine convention, p=(p1,p2,p3,p4,p5,p6) determines M(p)=[[1+p1,p2,p3],[p4,1+p5,p6],[0,0,1]].
    The module composes the update as M(p_out)=M(delta p) M(p_in). Writing these affine matrices as linear
    blocks A with translations b gives A_out=A_delta A_in and b_out=A_delta b_in+b_delta. This is composition
    of coordinate transformations, not addition of the six parameter vectors.
  evidence:
  - source_id: lin2017
    locator: Section 4.1, PDF p. 4 / printed p. 2571, Equations 9–10.
    relation: supports
- claim_id: differentiable-composition-partials
  kind: mechanism
  statement: The source supplies derivatives of p_out with respect to p_in while holding delta p fixed,
    and with respect to delta p while holding p_in fixed. In the six-parameter order of Equation 9, these
    are A_delta tensor-product I_3 and blockdiag(M(p_in)^T,M(p_in)^T), respectively. They agree with the
    displayed left-composition rule and allow gradients through the composition operation. They are fixed-argument
    partials, not the full state derivative through the learned predictor and image sampler.
  evidence:
  - source_id: lin2017
    locator: Section 4.1, PDF pp. 4–5 / printed pp. 2571–2572, Equation 11 and its immediately following
      backpropagation explanation.
    relation: supports
- claim_id: reusable-module-with-cascade-use
  kind: scope
  statement: Several compositional modules can be concatenated into an alignment cascade while retaining
    the source image and passing accumulated geometry between stages. The module definition does not require
    either distinct or shared predictor parameters. Reusing one predictor at all steps gives the IC-STN
    recurrent specialization; a finite cascade with separate predictors is another use of the module.
    The source identifies a one-step compositional model with a one-step IC-STN.
  evidence:
  - source_id: lin2017
    locator: Section 4.1, PDF pp. 4–5, Figures 3–4; Section 4.2, PDF p. 5, shared unrolling; Section 5.1,
      PDF p. 6, explicit c-STN-1/IC-STN-1 equivalence.
    relation: supports
- claim_id: learned-alignment-with-downstream-objective
  kind: scope
  statement: The predictor can be learned through the warp-and-composition graph together with a downstream
    objective. The source describes linear, fully connected and convolutional predictor configurations,
    using geometric-parameter error for its planar alignment experiment and joint alignment/classification
    configurations elsewhere. The module is not defined by one fixed classifier, one predictor architecture
    or the classical Lucas–Kanade least-squares objective.
  evidence:
  - source_id: lin2017
    locator: Section 4.1, PDF p. 5, learned-feature/end-to-end paragraph; Section 5.1, PDF p. 6, linear
      predictor and geometric-parameter objective; Section 5.2 and Table 2, PDF pp. 6–7.
    relation: supports
limitations:
- The affine coordinate convention and multiplication order are part of the stated mechanism. Composing
  singular affine matrices is algebraically possible, but interpreting a warp as invertible requires a
  nonsingular, suitably conditioned linear part. Equation 9 imposes no determinant constraint by itself.
  The homography experiments additionally require nonzero homogeneous denominators on the sampled domain;
  the affine Equation 11 does not specify homography derivatives. An incremental inverse, when required
  by a chosen interpretation, is not obtained by simply negating all six parameters.
- Retaining the original image prevents information loss caused by repeatedly replacing it with intermediate
  cropped or interpolated outputs. It does not recover pixels absent from the original source, physical
  occlusion or lost resolution. Intermediate samples for the predictors still occur. Finite grids, out-of-range
  sampling, interpolation, aliasing and numerical error remain relevant; exact matrix composition does
  not imply exact raster preservation.
- Equation 11 contains correct composition partials. If C(p,delta) is the composition and delta=f(warp(I,p)),
  the full state derivative is C_p+C_delta Df D_p[warp(I,p)] where differentiable. The identity term in
  a partial alone gives no arbitrary-horizon gradient guarantee. For 0<epsilon<1, constant incremental
  linear parts (1−epsilon)I or (1+epsilon)I produce direct gradient magnitudes (1−epsilon)^K or (1+epsilon)^K;
  these isotropic examples still have condition number one. Anisotropic scales can instead worsen conditioning.
  These are bounded hand constructions, not reports about trained-model failure or author-code backpropagation.
- Differentiable or subdifferentiable sampling enables optimization but does not imply smoothness at all
  interpolation knots and boundaries. The displayed composition partials must be combined with the predictor
  and sampler derivatives and their domain conventions. No padding, subgradient, coordinate-range or singular-transform
  handling is verified at implementation level.
- A learned linear predictor can share the algebraic form of a classical alignment regressor without equaling
  a particular template-Jacobian pseudoinverse or minimizing the same objective. The source’s LK/SDM analogy,
  residual-gradient explanation and selected empirical results do not establish universal solver equivalence,
  monotone descent, convergence or accuracy and computational advantages. This record denotes the Figure
  3 reusable module; cascade usage does not silently change its identity into a whole classifier or require
  untied weights.
- Evidence is the exact nine-page official CVPR 2017 proceedings PDF. The acquired CVF page numbering
  and Crossref IEEE numbering differ and are explicitly separated; no exact publication day or preprint
  byte identity is asserted. The official supplementary ZIP returned HTTP 404, so no supplementary content
  is claimed. Historical source inspection did not include author code or full original LK, IC-LK and
  SDM papers, and did not execute training or reproduce benchmarks. No implementation-level coordinate
  normalization, padding, device behavior or numerical accuracy is certified.
