  IDs, local IDs, names, aliases and scoped synonyms supplied 4,843 identity fields. Canonical names and
  explicit source spellings, including Greek lambda, produced no normalized candidate collision. Four
  fixed-string searches included ignored and hidden paths and retained 6,064 occurrences in 1,351 distinct
  content groups. Two supporting agents read all grouped contents in disjoint partitions; root read all
  37 filtered candidate-named groups, twelve normalized neighbor definitions, 29 fields and full owners
  264,265,266 and269. Candidate-named matches are source-lead, history, review and existing-neighbor context.
  All 1,216 pre-WIS-TD inventory rows and the newly merged WIS-TD record were reconciled at the actual
  base. Historical research snapshots remain separately dated. This supports a bounded identity decision
