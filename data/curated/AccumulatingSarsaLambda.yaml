  selected next action, accumulating state-action traces and the official first-edition correction resetting
  traces inside each episode. It differs from one-step Sarsa, neural MCQ-L gradient traces, true-online
  Sarsa with Dutch traces, replacing-trace variants, and the max-target Watkins and two-error Peng–Williams
  constructions. Unqualified Sarsa(lambda) references are contextual family mentions rather than exact
  aliases. Owner 265 retains MCQ-L and its cohort342 resolution and historical Cambridge pointer; the
  selected source is Sutton and Barto 1998 with official errata. The fresh collection after PR389 merged,
