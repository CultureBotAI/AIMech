claims:
- claim_id: method
  kind: mechanism
  statement: For the single-layer binary specialization, compute the past-dependent biases b_t=b+P r_(t-1)
    and c_t=c+Q r_(t-1). Fix an ordering of D bits within the current frame. At position i, compute z_(t,i)=sigmoid(c_t+W[:,<i]
    v_(t,<i)) and q_(t,i)=sigmoid(b_(t,i)+V[i,:] z_(t,i)). Multiply q_(t,i) raised to v_(t,i) times (1-q_(t,i))
    raised to (1-v_(t,i)) over positions, then multiply frame probabilities over time. Reuse a prefix
    accumulator initialized to c_t, adding W[:,i] v_(t,i) after evaluating each conditional. After the
    frame is observed or generated, update the separate recurrent state using its own input and recurrent
    weights. Differentiate the exact sum of frame negative log probabilities through the NADE parameters,
    the bias projections and the recurrent history. The 2012 paper explicitly contrasts these exact model
    gradients with CD-based RNN-RBM gradients. Ancestral generation samples bits in the fixed within-frame
    order before updating the recurrent state.
