name: RNN-NADE
definition: A neural sequence architecture in which a deterministic recurrent state supplies parameters
  of a NADE output distribution, combining temporal recurrence with normalized within-frame autoregressive
  conditionals.
concept_kind: architecture
identity_notes: 'This is the RNN-NADE identified in the 2012 recurrent-output-estimator paper by substituting
  NADE for the conditional RBM. Temporal order between vector frames and variable order within a frame
  are separate. The recurrent state and NADE prefix activations are deterministic computations; there
  is no stochastic RBM hidden state to integrate out. It is distinct from unconditional NADE, order-agnostic
  NADE, RNN-RBM and a recurrent predictor with independent Bernoulli outputs. All 442 pinned AIO labels/scoped
  synonyms and 364 preceding native IDs/names/aliases were compared, with no normalized identity match.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main, returning
  129 lines each. All 91 unique matched contents were read, including 58 initial contents and 33 additional
  saved-review contents: prior model contrasts, evidence references and discovery leads, rather than existing
  candidate identities. All 52 semantic label/synonym hits and 22 exact annotated AIO nodes were inspected,
  alongside corresponding generated records and four complete native neighbors. Previously read contextual
  files were checked for byte identity. Absence is bounded to this snapshot and inspected neighborhood.'
limitations:
- Exact normalized probabilities and gradients apply to this specified model with fully observed training
  sequences. They do not imply global optimization, calibration, equality to an RBM distribution or tractable
  inference for every pattern of missing frames or bits.
- The within-frame ordering and temporal recurrence serve different purposes. Prefix sharing gives O(DH)
  NADE evaluation per frame for H hidden units, in addition to the recurrent-state and bias-projection
  costs; it does not remove sequential generation dependencies.
- The original NADE paper prints an accumulator index discrepancy and initializes a multiplicatively accumulated
  probability to zero with an incorrect plus between Bernoulli factors in Algorithm 1. The displayed mechanism
  follows its normalized chain definition, Equations (9)–(11) and prefix-update rule, retaining the source
  qualification.
- Output weights V may be learned separately from W as in the original NADE paper. Sharing prefix parameters
  across conditionals does not require tying input and output weights, and it does not make within-frame
  variables independent.
- The RNN-RBM paper’s negative joint/bias signs concern its RBM formulas and are not a prescription for
  NADE conditionals. Backpropagation through the separate recurrence still requires dimensionally correct
  transposes. No author-code or empirical superiority claim is certified.
