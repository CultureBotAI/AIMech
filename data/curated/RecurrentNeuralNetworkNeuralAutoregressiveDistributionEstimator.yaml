aio_mappings:
- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: The pinned AIO target is broader than this explicit recurrent neural architecture with a
    specified conditional-density output. The deterministic state has directed temporal connections; the
    output estimator adds a narrower structural restriction. A temporal probability model over vector
    frames is not necessarily an autoregressive language model.
- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: The visible variables can be ordered first by frame time and then by within-frame position,
    with normalized neural conditional factors depending only on earlier visible variables. This is a
    fully visible acyclic probabilistic dependence model, so the pinned BayesianNetwork is broader. Deterministic
    recurrent and prefix computations parameterize factors and do not imply intervention-level causality.
