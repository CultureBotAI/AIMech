claims:
- claim_id: expando-mono-duo-four-stage-and-duot5-aggregation-mechanism
  kind: mechanism
  statement: 'Expando-Mono-Duo augments documents at Stage H_-1 with top-k sampled doc2query-T5 queries prior to BM25 indexing (Stage H_0), strips expansion queries before scoring top-k_0 candidates with pointwise monoT5 (Stage H_1), and reranks the top-k_1 candidates with pairwise duoT5 (Stage H_2) over all k_1(k_1 - 1) ordered pairs (d_i, d_j) using prompt ''Query: q Document0: d_i Document1: d_j Relevant:'' (Eq. 4) and symmetric pairwise aggregation SYM-SUM s_i = sum_{j != i} (p_{i,j} + (1 - p_{j,i})) (Eq. 7) or SYM-SUM-LOG s_i = sum_{j != i} (log p_{i,j} + log(1 - p_{j,i})) (Eq. 8).'
  evidence:
  - source_id: r788-primary-pdf
    locator: Section 3.1-3.4, Equations (1)-(8), Figure 1, pp. 3-6; Section 4.1, p. 8
    relation: supports
  - source_id: r788-primary-pdf
    locator: duot5_sum, duot5_sum_log, duot5_sym_sum, and duot5_sym_sum_log verification
    relation: supports
- claim_id: expando-mono-duo-additive-stage-gains-scope
  kind: scope
  statement: Across MS MARCO passage and document ranking, TREC 2020 Deep Learning Track, and TREC-COVID, each stage (H_-1 doc2query-T5, H_1 monoT5, and H_2 duoT5) contributes statistically significant, cumulative gains in MRR and nDCG, with SYM-SUM and SYM-SUM-LOG outperforming asymmetric SUM and SUM-LOG by combining evidence from both (d_i, d_j) and (d_j, d_i) orderings.
  evidence:
  - source_id: r788-primary-pdf
    locator: Section 5.1-5.5, Tables 1-5, Figure 4, pp. 13-20
    relation: supports
- claim_id: expando-mono-duo-quadratic-pairwise-and-model-size-limitation
  kind: limitation
  statement: Stage H_2 (duoT5) requires k_1(k_1 - 1) sequence-to-sequence forward passes per query (e.g., 2,450 inferences for k_1 = 50 with 1,024-token context), restricting pairwise reranking to small candidate sets k_1 for early precision, and duoT5 fails to improve over monoT5 if the duoT5 model is smaller than the preceding monoT5 model.
  evidence:
  - source_id: r788-primary-pdf
    locator: Section 3.4, p. 6; Section 4.2, p. 10; Section 5.1, Table 1, Condition (6) vs (9), p. 14
    relation: supports
