claims:
- claim_id: r807-claim-decoupled-branch-self-distillation
  kind: mechanism
  statement: To prevent intermediate exit branches from corrupting backbone representations during supervised fine-tuning, FastBERT first fine-tunes the L-layer Transformer backbone and top-layer teacher classifier p_t = Teacher_Classifier(h_{L-1}) (Eq. 3) with all student branches disabled, and then freezes the backbone and teacher classifier while training the L-1 student branch classifiers p_{s_i} = Student_Classifier_i(h_i) (Eq. 4) on labeled or unlabeled data by minimizing the total KL-divergence self-distillation loss Loss(p_{s_0}, ..., p_{s_{L-2}}, p_t) = sum_{i=0}^{L-2} D_KL(p_{s_i}, p_t) (Eqs. 5-6).
  evidence:
  - source_id: r807-primary-pdf
    locator: Section 3.1-3.2.3 (Equations 1-6), Pages 2-4
    relation: supports
  - source_id: r807-primary-pdf
    locator: self_distillation_loss verification in main()
    relation: supports
- claim_id: r807-claim-normalized-entropy-uncertainty-and-luha-exit
  kind: mechanism
  statement: 'During adaptive inference, FastBERT evaluates the normalized Shannon entropy Uncertainty = (sum_{i=1}^N p_s(i) log p_s(i)) / log(1/N) in [0, 1] (Eq. 7) at each executed layer''s student classifier and halts inference immediately whenever Uncertainty < Speed (Hypothesis 1, LUHA: ''the Lower the Uncertainty, the Higher the Accuracy''), incurring only 46.1M FLOPs per student classifier evaluation compared to 1809.9M FLOPs per Transformer block.'
  evidence:
  - source_id: r807-primary-pdf
    locator: Section 3.3 (Adaptive inference, Equation 7 & Table 1), Page 4
    relation: supports
  - source_id: r807-primary-pdf
    locator: normalized_entropy_uncertainty and sample_adaptive_flops verification in main()
    relation: supports
- claim_id: r807-claim-tunable-speedup-across-twelve-datasets
  kind: application
  statement: Evaluated across six Chinese datasets (ChnSentiCorp, Book review, Shopping review, LCQMC, Weibo, THUCNews) and six English datasets (AG News, Amazon Full, DBpedia, Yahoo Answers, Yelp Full, Yelp Polarity), FastBERT achieves a continuously tunable 1x to 12x FLOPs speedup over 12-layer BERT by varying Speed in [0.1, 0.8], delivering 2x to 5x speedup without accuracy loss at Speed = 0.1 and outperforming 6-layer, 3-layer, and 1-layer DistilBERT models at matched speedup ratios.
  evidence:
  - source_id: r807-primary-pdf
    locator: Section 4 (Experimental results, Tables 2-3 & Figures 3-7), Pages 5-8
    relation: supports
- claim_id: r807-claim-classification-entropy-and-nonlinear-speed-curve-limitation
  kind: limitation
  statement: Because FastBERT's Uncertainty criterion (Eq. 7) is defined as Shannon entropy normalized by log(1/N) over N discrete class probabilities, it applies directly only to classification tasks with N >= 2 classes (not continuous regression), and the relationship between the threshold Speed and the realized computational Speedup ratio is non-linear and dataset-dependent.
  evidence:
  - source_id: r807-primary-pdf
    locator: 'Section 3.3 (Equation 7), Figure 3(b)/(e), and Section 6 (Future work: ''linearizing the Speed-Speedup curve''), Pages 4, 6, & 9'
    relation: supports
