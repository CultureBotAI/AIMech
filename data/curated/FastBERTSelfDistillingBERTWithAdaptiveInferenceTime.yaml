id: AIMech:FastBERTSelfDistillingBERTWithAdaptiveInferenceTime
name: 'FastBERT: Self-Distilling BERT with Adaptive Inference Time'
concept_kind: architecture
review_status: DRAFT
definition: A sample-wise adaptive Transformer architecture and three-stage training paradigm that appends a teacher classifier to the final layer L-1 and lightweight student branch classifiers (each comprising a 768->128 projection, 128-dim self-attention, 128->128 dense layer, and N-class softmax) to intermediate layers 0..L-2, fine-tunes the backbone and teacher classifier on task labels with branches disabled, freezes the backbone and teacher to self-distill all L-1 student classifiers by minimizing sum_{i=0}^{L-2} D_KL(p_{s_i}, p_t), and terminates inference for any input sample at layer i when its normalized prediction entropy Uncertainty = (sum_{c=1}^N p_{s_i}(c) log p_{s_i}(c)) / log(1/N) falls below a tunable threshold Speed in [0, 1].
identity_notes: Introduced by Weijie Liu, Peng Zhou, Zhe Zhao, Zhiruo Wang, Haotang Deng, and Qi Ju (ACL 2020, pp. 6035-6044, arXiv:2004.02178, doi:10.18653/v1/2020.acl-main.537). Distinct from cross-model knowledge distillation methods (DistilBERT Round 803, TinyBERT Round 800, MobileBERT Round 804) that execute a fixed number of layers for every input, and from Patience-Based Early Exit (PABEE, Round 808), which jointly trains linear internal classifiers and exits based on cross-layer prediction agreement patience rather than frozen-backbone branch self-distillation and single-layer normalized entropy thresholding.
aliases:
- FastBERT
- FastBERT Self-Distilling Adaptive-Inference Transformer
- Self-Distilling BERT with Normalized-Entropy Early Exit
