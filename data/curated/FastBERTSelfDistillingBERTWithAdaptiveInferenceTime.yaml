- target: AIO:Distillation
  relation: narrow_match
  rationale: FastBERT introduces an in-model branch self-distillation stage that minimizes the sum of KL divergences from the frozen top-layer teacher classifier to L-1 intermediate student branch classifiers.
- target: AIO:ArtificialNeuralNetwork
  relation: related_match
  rationale: Augments a multi-layer Transformer neural network with per-layer bottleneck self-attention branch classifiers for sample-wise adaptive early exit.
limitations:
- The normalized entropy Uncertainty criterion requires a discrete N-class probability distribution (N >= 2) and does not directly support continuous regression tasks.
- The mapping from the user-specified threshold Speed in [0, 1] to the actual FLOPs speedup factor is non-linear and varies with dataset complexity.
