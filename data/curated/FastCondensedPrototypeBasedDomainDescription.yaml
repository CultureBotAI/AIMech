limitations:
- This is a supported heuristic concept with explicitly unresolved pseudocode boundaries. Neither default
  gain stopping nor the printed Dprime-exhaustion modification is represented as a general consistency
  guarantee.
- A full implementation would need documented boundary choices; no unpublished repair is attributed to
  the author. Exact-name, code and erratum searches and the public 15-repository lab inventory did not
  identify a correcting implementation, a bounded search result rather than proof of absence.
- All 15 primary PDF pages were visually read. The consistency counterexample and logarithm boundary were
  checked by exact finite calculations; no historical software, statistical training or benchmark execution
  was performed.
