claims:
- claim_id: tinybert-unnormalized-attention-and-projected-hidden-distillation
  kind: mechanism
  statement: Given an M-layer student with hidden size d' and an N-layer teacher with hidden size d linked by layer mapping n = g(m) (with g(0) = 0, g(M+1) = N+1, and uniform mapping g(m) = (N/M)*m for 1 <= m <= M), TinyBERT minimizes L_model = sum_{x in X} sum_{m=0}^{M+1} lambda_m L_layer(f_m^S(x), f_{g(m)}^T(x)) (Equations 6, 11), where m=0 optimizes embedding MSE L_embd = MSE(E^S W_e, E^T) (Equation 9), 1 <= m <= M optimizes unnormalized attention logits MSE L_attn = (1/h) sum_{i=1}^h MSE(A_i^S, A_i^T) plus projected hidden-state MSE L_hidn = MSE(H^S W_h, H^T) with learnable W_e, W_h in R^{d' x d} (Equations 7-8), and m=M+1 optimizes soft logit cross-entropy L_pred = CE(z^T/t, z^S/t) (Equation 10).
  evidence:
  - source_id: r800-primary-pdf
    locator: Section 3.1 (Transformer Distillation), pp. 3-4, Figure 2, Equations (6)-(11)
    relation: supports
  - source_id: r800-primary-pdf
    locator: layer_mapping and tinybert_layer_losses verification
    relation: supports
- claim_id: tinybert-two-stage-learning-and-contextual-data-augmentation
  kind: mechanism
  statement: 'TinyBERT executes a two-stage learning pipeline (Figure 1): (1) General Distillation (GD) on a general-domain corpus (2,500M words of English Wikipedia) using intermediate-layer losses (L_embd and L_hidn + L_attn) from pre-trained BERT_BASE to initialize the student, and (2) Task-specific Distillation (TD) on a 20x augmented task dataset (generated via Algorithm 1 by replacing single-piece words with BERT [MASK] predictions and multi-piece words with GloVe nearest neighbors at probability p_t = 0.4, N_a = 20, K = 15), performing 20 epochs of intermediate-layer distillation followed by 3 epochs of prediction-layer distillation.'
  evidence:
  - source_id: r800-primary-pdf
    locator: Section 3.2 (TinyBERT Learning, Algorithm 1) & Section 4.2, pp. 4-6
    relation: supports
- claim_id: tinybert-glue-and-squad-compression-performance
  kind: application
  statement: On the official GLUE test benchmark, 4-layer TinyBERT_4 (M=4, d'=312, d'_i=1200, h=12; 14.5M parameters, 1.2B FLOPs) retains 96.8% of BERT_BASE's average score (77.0 vs. 79.5) while being 7.5x smaller and 9.4x faster, outperforming 4-layer BERT_4-PKD (72.6) and DistilBERT_4 (71.9) by at least 4.4 points with ~28% of their parameters, while 6-layer TinyBERT_6 (67.0M parameters, 2.0x speedup) reaches 79.4 average GLUE score (on par with BERT_BASE's 79.5, Table 1).
  evidence:
  - source_id: r800-primary-pdf
    locator: Section 4.4 (Experimental Results on GLUE, Table 1) & Appendix B (Table 6), pp. 6-7, 11
    relation: supports
- claim_id: tinybert-layer-mapping-and-task-specific-augmentation-overhead
  kind: limitation
  statement: TinyBERT requires selecting a fixed layer-to-layer mapping function n = g(m) between student and teacher layers, introducing learnable projection matrices W_e, W_h in R^{d' x d} when d' != d, and running a costly 20x task-specific data augmentation and two-step teacher-student distillation pass for each downstream task (without which dev average drops from 75.6 to 68.5 w/o TD or 68.4 w/o DA, Table 2).
  evidence:
  - source_id: r800-primary-pdf
    locator: Section 4.5.1 (Effects of Learning Procedure, Table 2) & Section 4.6 (Table 4), pp. 7-8
    relation: supports
