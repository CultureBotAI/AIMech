id: AIMech:TinyBERTTransformerDistillationForNaturalLanguageUnderstanding
name: TinyBERT (Two-Stage Transformer Distillation for Natural Language Understanding)
concept_kind: learning_paradigm
review_status: DRAFT
definition: "A two-stage knowledge distillation framework for Transformer language models (Jiao et al., Findings of EMNLP 2020) that transfers knowledge from a N-layer teacher BERT to a smaller M-layer student TinyBERT with reduced hidden dimension d' < d via a layer mapping function n = g(m) (such as uniform mapping g(m) = (N/M)*m) and three layer-wise losses\u2014embedding-layer MSE L_embd = MSE(E^S W_e, E^T), Transformer-layer unnormalized attention matrix MSE L_attn = (1/h) sum_{i=1}^h MSE(A_i^S, A_i^T) plus projected hidden-state MSE L_hidn = MSE(H^S W_h, H^T), and prediction-layer soft cross-entropy L_pred = CE(z^T/t, z^S/t)\u2014applied across both a general pre-training distillation stage on unlabeled text and a two-step task-specific distillation stage over a BERT-and-GloVe word-replacement augmented task dataset."
identity_notes: Distinct from DistilBERT (Sanh et al., 2019, which distills only at the pre-training stage and requires identical hidden dimensions d' = d to initialize from teacher layers), from BERT-PKD (AIMech:BERTPKDPatientKnowledgeDistillationForBERTModelCompression, which matches only L2-normalized [CLS] hidden states at the fine-tuning stage), and from Simplified TinyBERT (AIMech:SimplifiedTinyBERTKnowledgeDistillationForDocumentRetrieval, which merges the two task-specific steps into one step and adds hard-label cross-entropy for document retrieval). TinyBERT fits unnormalized pre-softmax attention matrices A_i = Q K^T / sqrt(d_k), projects smaller student hidden states via learnable matrices W_e, W_h in R^{d' x d}, and expands task datasets 20x via single-piece BERT [MASK] prediction and multi-piece GloVe nearest-neighbor word replacement (Algorithm 1).
aliases:
- TinyBERT
- TinyBERT Transformer Distillation
- Two-Stage TinyBERT Knowledge Distillation Framework
