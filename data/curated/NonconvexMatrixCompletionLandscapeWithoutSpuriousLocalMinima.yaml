claims:
- claim_id: claim-strict-saddle-negative-curvature-along-procrustes-alignment-direction
  kind: mechanism
  statement: "For the full-observation factored objective $g(\\boldsymbol{X}) = \\frac{1}{2}\\|\\boldsymbol{M} - \\boldsymbol{X}\\boldsymbol{X}^\\top\\|_F^2$ with $\\boldsymbol{M} = \\boldsymbol{Z}\\boldsymbol{Z}^\\top$, Proposition 4.1 and Lemma 4.2 prove that along the optimal Procrustes alignment difference $\\boldsymbol{\\Delta} = \\boldsymbol{X} - \\boldsymbol{U}$ (where $\\boldsymbol{U} = \\boldsymbol{Z}\\boldsymbol{R}$ minimizes $\\|\\boldsymbol{X} - \\boldsymbol{Z}\\boldsymbol{R}\\|_F$ over orthogonal $\\boldsymbol{R}\\in\\mathbb{O}_r$), the directional Hessian quadratic form satisfies $\\langle\\boldsymbol{\\Delta}, \\nabla^2 g(\\boldsymbol{X})\\boldsymbol{\\Delta}\\rangle = \\|\\boldsymbol{\\Delta}\\boldsymbol{X}^\\top + \\boldsymbol{X}\\boldsymbol{\\Delta}^\\top\\|_F^2 - 2\\langle \\boldsymbol{M} - \\boldsymbol{X}\\boldsymbol{X}^\\top, \\boldsymbol{\\Delta}\\boldsymbol{\\Delta}^\\top\\rangle = 2\\langle \\nabla g(\\boldsymbol{X}), \\boldsymbol{\\Delta}\\rangle - \\|\\boldsymbol{M} - \\boldsymbol{X}\\boldsymbol{X}^\\top\\|_F^2 + 3\\|\\boldsymbol{\\Delta}\\boldsymbol{\\Delta}^\\top\\|_F^2 \\le 2\\langle \\nabla g(\\boldsymbol{X}), \\boldsymbol{\\Delta}\\rangle - \\frac{1}{2}\\|\\boldsymbol{M} - \\boldsymbol{X}\\boldsymbol{X}^\\top\\|_F^2$, certifying strictly negative curvature whenever $\\|\\nabla g(\\boldsymbol{X})\\|_F$ is small and $\\boldsymbol{X}\\boldsymbol{X}^\\top \\ne \\boldsymbol{M}$ (Sections 3 and 4, Claims 1f\u20132f, Proposition 4.1, Lemma 4.2)."
  evidence:
  - source_id: glm2016-mclandscape-pdf
    locator: Section 3 (Claims 1f-2f, pp. 4-5), Section 4 (Proposition 4.1, Lemma 4.2, pp. 5-6)
    relation: supports
- claim_id: claim-quartic-row-norm-incoherence-regularizer-directional-monotonicity
  kind: mechanism
  statement: For the smooth quartic row-norm regularizer $R(\boldsymbol{X}) = \sum_{i=1}^d (\|\boldsymbol{X}_i\|_2 - \alpha)_+^4$ with threshold $\alpha \ge 2\mu\sqrt{r/d}\sigma_1(\boldsymbol{Z})$, Proposition 5.2, Lemma 5.7, and Claim C.3 prove that for any target factor $\boldsymbol{U}$ with $\|\boldsymbol{U}_i\|_2 \le \alpha/2$, the gradient inner product satisfies $\langle \nabla R(\boldsymbol{X}), \boldsymbol{X} - \boldsymbol{U}\rangle \ge 2 R(\boldsymbol{X}) \ge 0$ and the directional Hessian satisfies $\langle \boldsymbol{\Delta}, \nabla^2 R(\boldsymbol{X})\boldsymbol{\Delta}\rangle \le 6\langle \nabla R(\boldsymbol{X}), \boldsymbol{\Delta}\rangle$, ensuring that every point with small gradient has incoherent rows $\|\boldsymbol{X}_i\|_2 \le 2\alpha$ without introducing any spurious stationary points (Section 5, Equation 5.1, Proposition 5.2, Lemma 5.7, Appendix C, Claim C.3).
  evidence:
  - source_id: glm2016-mclandscape-pdf
    locator: Section 5 (Eq. 5.1, Proposition 5.2, Lemma 5.7, pp. 6-8), Appendix C (Claim C.3, pp. 17-19)
    relation: supports
- claim_id: claim-global-convergence-of-random-initialized-stochastic-gradient-descent
  kind: application
  statement: Because $f(\boldsymbol{X})$ satisfies the global $(\theta,\gamma,\zeta)$-strict saddle property with no spurious local minima whenever $p \ge \tilde{\Omega}(\mu^4 r^6 \kappa^4 / d)$ (Theorems 1.1 and 5.3) and extends to asymmetric rectangular matrices $\boldsymbol{M}\in\mathbb{R}^{d_1\times d_2}$ via symmetric lifting (Section 6, Theorem 6.1), perturbed/stochastic gradient descent from an arbitrary random initialization converges in polynomial time to a global minimum $\boldsymbol{X}\boldsymbol{X}^\top = \boldsymbol{M}$ without requiring spectral initialization (Section 1, Theorem 1.1; Section 2, Theorem 2.2; Section 5, Theorem 5.3; Section 6, Theorem 6.1).
  evidence:
  - source_id: glm2016-mclandscape-pdf
    locator: Section 1 (Theorem 1.1, p. 2), Section 2 (Theorem 2.2, p. 4), Section 5 (Theorem 5.3, p. 7), Section 6 (Theorem 6.1, p. 8)
    relation: supports
