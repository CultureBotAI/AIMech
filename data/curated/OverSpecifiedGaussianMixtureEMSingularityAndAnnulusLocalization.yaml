claims:
- claim_id: claim-unbalanced-global-contraction-versus-balanced-fisher-singularity
  kind: mechanism
  statement: "For the two-component symmetric location model $\\pi\\mathcal{N}(\\theta,\\sigma^2 I_d) + (1-\\pi)\\mathcal{N}(-\\theta,\\sigma^2 I_d)$ fit to $\\mathcal{N}(0,\\sigma^2 I_d)$ data, the Fisher information matrix at $\\theta^* = 0$ is $\\mathcal{I}^\\pi(0) = (1 - 4\\pi(1-\\pi))I_d = \\rho^2 I_d$ ($\\rho = |1-2\\pi|$, Equation 84): when $\\pi \\ne 1/2$, population EM satisfies $\\|M(\\theta)\\|_2 \\le (1 - \\rho^2/2)\\|\\theta\\|_2$ for all $\\theta\\in\\mathbb{R}^d$ and sample EM achieves $\\|\\theta^t\\|_2 \\le \\|\\theta^0\\|_2(1-\\rho^2/2)^t + \\frac{c'(\\|\\theta^0\\|_2\\sigma^2 + \\rho\\sigma)}{\\rho^2}\\sqrt{\\frac{d+\\log(1/\\delta)}{n}}$ (Theorem 1), whereas when $\\pi = 1/2$, $\\mathcal{I}^{1/2}(0) = 0$ and population EM contracts only as $\\frac{\\|M(\\theta)\\|_2}{\\|\\theta\\|_2} \\asymp 1 - \\frac{\\|\\theta\\|_2^2}{\\sigma^2}$ near $\\theta^* = 0$ (Theorem 2, Equations 13\u201314)."
  evidence:
  - source_id: dhkwjy2020-singularem-pdf
    locator: Section 3.1-3.2.1, Theorems 1 & 2, pp. 12-16; Appendix D, Equation 84, pp. 55-57
    relation: supports
  - source_id: dhkwjy2020-singularem-abs
    locator: Abstract
    relation: supports
- claim_id: claim-annulus-based-localization-over-epochs-and-exponent-recursion
  kind: mechanism
  statement: Because a one-shot application of uniform concentration $\sup_{\|\theta\|_2\le r}\|M_n(\theta) - M(\theta)\|_2 \lesssim r\sqrt{d/n}$ (Lemma 1, Equation 20) with worst-case contraction $1 - \epsilon^2$ yields only the suboptimal rate $\epsilon = O((d/n)^{1/6})$ (Equation 21), partitioning iterations into epochs localized to annuli $(d/n)^{\alpha_{\ell+1}} \le \|\theta^t\|_2 \le (d/n)^{\alpha_\ell}$ (Equation 22) uses the outer radius $(d/n)^{\alpha_\ell}$ to bound empirical perturbation by $(d/n)^{\alpha_\ell + 1/2}$ and the inner radius $(d/n)^{\alpha_{\ell+1}}$ to bound population contraction by $1 - c(d/n)^{2\alpha_{\ell+1}}$, yielding the exponent recursion $\alpha_{\ell+1} = \frac{1}{3}\alpha_\ell + \frac{1}{6}$ ($\alpha_0 = 0$, Equation 23) that converges geometrically to $\alpha^* = 1/4$ (Theorem 3, Equation 16).
  evidence:
  - source_id: dhkwjy2020-singularem-pdf
    locator: Section 3.2.2, Theorem 3, pp. 16-17; Section 4.1-4.3, Lemma 1 & Equations 18-25, pp. 18-24; Appendix A.3, pp. 36-41
    relation: supports
  - source_id: dhkwjy2020-singularem-cr
    locator: Crossref metadata and published abstract for Ann. Statist. 48(6):3161-3182
    relation: supports
- claim_id: claim-sample-em-fixed-point-n-minus-one-quarter-lower-bound-and-regression-extension
  kind: scope
  statement: In the univariate balanced fit ($d = 1, \pi = 1/2$), any non-zero sample EM fixed point $\widehat{\theta}_n = \frac{1}{n}\sum_{i=1}^n X_i\tanh(\widehat{\theta}_n X_i/\sigma^2)$ (Equation 54) exists whenever $\frac{1}{n}\sum_{i=1}^n (X_i/\sigma)^2 > 1$ (Equation 59) and satisfies $|\widehat{\theta}_n|^2 \ge \frac{3\sigma^2(\frac{1}{n}\sum Y_i^2 - 1)}{\frac{1}{n}\sum Y_i^4}$ (Equation 56), implying $\mathbb{P}[|\widehat{\theta}_n| \ge c n^{-1/4}] \ge c'$ (Theorem 4, Equation 17); furthermore, the same $(d/n)^{1/4}$ statistical rate and $O((n/d)^{1/2})$ iteration complexity hold for over-specified balanced mixtures of linear regressions (Section 5.2, Appendix E, Lemma 7 & Corollary 2).
  evidence:
  - source_id: dhkwjy2020-singularem-pdf
    locator: Section 3.2.2, Theorem 4, p. 17; Appendix A.4, Equations 54-60, pp. 41-43; Section 5.2 & Appendix E, pp. 25, 57-60
    relation: supports
- claim_id: claim-limitation-unconstrained-means-and-unknown-variance-further-slowdown
  kind: limitation
  statement: The fast $(d/n)^{1/2}$ convergence of the unbalanced fit ($\pi \ne 1/2$) relies on both fixed unequal weights and the symmetric location constraint $\theta_2 = -\theta_1$; when location parameters $(\theta_1,\theta_2)$ are estimated freely or when scale/variance parameters $\sigma^2$ are also unknown, EM reverts to slow $n^{-1/4}$ (or even slower higher-order singular) convergence rates.
  evidence:
  - source_id: dhkwjy2020-singularem-pdf
    locator: Section 5.3-5.4, Figures 7-9, pp. 25-29; Appendix C.2, Lemma 6 & Corollary 1, pp. 52-55
    relation: supports
