aio_mappings:
- target: AIO:TrainingStrategy
  relation: related_match
  rationale: Teacher forcing specifies feedback supplied during model training. The pinned target describes
    preprocessing and general training strategies rather than this sequential feedback rule. A contextual
    related match preserves that abstraction difference without asserting exact identity or a subclass
    edge.
limitations:
- The explicit teacher-forcing name is supported by Williams and Zipser1989; Bengio et al2015 supplies
  the broader true-prefix sequence-training baseline. Jordan1986 was not accessible for inspection, so
  no origin or priority claim is made.
- The supplied target is assumed independent of model parameters in the stated derivative rule. Learned
  targets or differentiable target generation need their own dependency analysis.
- The reference-prefix likelihood claim is scoped to the cited autoregressive likelihood formulation;
  not all continuous-output or task-loss configurations have that likelihood objective.
- Target substitution and gradient truncation are separate choices. Keeping recurrent hidden paths does
  not guarantee that a particular implementation differentiates every path or that long dependencies are
  learned.
- Neither good reference-prefix prediction nor optional teacher-forced training establishes matched free-running
  performance, universal robustness or superiority over other training procedures.
- All ten1989 manuscript pages and nine2015 proceedings pages were read. Constructed algebraic examples
  were run without fitting; no author implementation, model training or benchmark replication was performed.
