id: AIMech:TeacherForcing
name: Teacher forcing
aliases: []
concept_kind: algorithm
definition: A sequence-training procedure that supplies reference outputs from earlier steps as feedback
  for subsequent predictions, in place of the model outputs that would otherwise be fed back.
identity_notes: Compared all 442 pinned AIO and 582 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 70, 10, 10 lines. All distinct match contents were
  inspected. Semantic matching covered 75 AIO and 167 native definitions, with unchanged preceding rows
  verified and new matches read. 4 full annotated AIO node/edge/generated contexts and 3 full native records
  were inspected. Matches concern the AIO DifferentiableLLM definition, the RTRL configuration and the
  pending broader teacher-forcing lead. Teacher forcing specifies the feedback supplied during training,
  not a particular architecture, gradient algorithm or trained instance. RTRL is one algorithm that can
  use it. Mean Teacher averages student parameters for consistency targets; DocumentNADE is a particular
  autoregressive architecture. Neither is this general feedback-substitution procedure. The pinned Distillation
  compression definition is also distinct. Scheduled sampling changes the feedback-selection rule and
  is not an alias; the all-reference endpoint coincides with full teacher guidance.
