claims:
- claim_id: reference-feedback
  kind: mechanism
  statement: During training, substitute the supplied reference output for the model output on the feedback
    path used by subsequent computations. In autoregressive token prediction this means predicting y_t
    given reference tokens y_<t and any conditioning input, rather than feeding the current target y_t
    as its own predictor input. The reference may be a token or a continuous output; the term does not
    by itself specify a neural architecture, optimizer or decoding policy. Merely placing a reference
    in the loss without substituting a feedback input is insufficient to define this procedure.
  evidence:
  - source_id: williams1989
    locator: Section2.3, Equations17–19 and explanation, PDF pp.5–6
    relation: supports
  - source_id: bengio2015
    locator: Sections2.1–2.2, Equations1–4, PDF/printed pp.2–3; Figure1, p.4
    relation: supports
- claim_id: observed-prefix-likelihood
  kind: mechanism
  statement: For the cited autoregressive sequence model, log p_theta(Y|X)=sum_t log p_theta(y_t|y_<t,X).
    Evaluating these conditionals on the observed prefix gives the exact observed-sequence log likelihood
    for that model. Conditioning on reference tokens during likelihood training is therefore not inherently
    an invalid likelihood objective. This identity does not establish that a trained model generates correct
    sequences or that every nonlikelihood use of teacher forcing optimizes this objective.
  evidence:
  - source_id: bengio2015
    locator: Sections2.1–2.2, Equations1–4, PDF/printed pp.2–3; Figure1, p.4
    relation: supports
- claim_id: derivative-paths
  kind: mechanism
  statement: When supplied reference values are parameter independent, future computations have no derivative
    through the model-output values they replace. Unreplaced recurrent hidden-state paths can still carry
    gradients through time. In the Williams–Zipser RTRL configuration, the current output sensitivity
    first contributes to its current update, then the forced output is treated as having zero sensitivity
    for subsequent propagation. Thus teacher forcing does not generally detach every hidden state or remove
    all temporal credit assignment.
  evidence:
  - source_id: williams1989
    locator: Section2.3, Equations17–19 and explanation, PDF pp.5–6
    relation: supports
  - source_id: bengio2015
    locator: Recurrent hidden-state Equation3, Section2.1, PDF/printed p.2; training Equation4, Section2.2,
      p.3; Figure1, p.4; curator hidden-state derivative example
    relation: supports
- claim_id: generation-distribution-boundary
  kind: limitation
  statement: At generation time the preceding reference output may be unavailable, so an autoregressive
    generator uses its own selected outputs, for example through sampling, greedy selection or beam search.
    Those prefixes can differ from training prefixes and permit errors to compound. This is a conditional
    distribution-mismatch concern, not a proof that every teacher-forced model fails or that low reference-prefix
    loss guarantees accurate autonomous rollouts.
  evidence:
  - source_id: bengio2015
    locator: Introduction, PDF/printed pp.1–2; inference Section2.3 and scheduled-sampling motivation
      Section2.4, pp.3–4
    relation: supports
  - source_id: williams1989
    locator: Teacher forcing and autonomous oscillation discussion, Sections2.3 and3.5, PDF pp.5–6,8
    relation: supports
- claim_id: scheduled-sampling-boundary
  kind: scope
  statement: The cited scheduled-sampling procedure chooses between the reference previous token and a
    model-generated token during training using a scheduled probability. Its all-reference endpoint is
    full teacher guidance; mixed-input training and the all-generated endpoint are distinct feedback rules,
    not aliases for full teacher forcing. The 2015 experiments do not backpropagate through the sampled
    token-selection decision. These choices do not redefine the exact observed-prefix likelihood identity
    for the all-reference baseline.
  evidence:
  - source_id: bengio2015
    locator: Section2.4, PDF/printed pp.3–4; Figures1–2, probability schedules and stated decision-gradient
      convention, p.4
    relation: supports
- claim_id: empirical-scope
  kind: scope
  statement: The 2015 comparisons cover specified image-captioning, parsing and speech setups. Training
    entirely on generated tokens from the start is not uniformly successful in those experiments; the
    parsing discussion reports failure to learn correct tree structure in that condition. The speech next-step
    and free-decoding frame-error results use different prediction conditions, and must not be treated
    as the same metric or as general word-recognition accuracy. These selected experiments do not establish
    a universal ordering between teacher forcing, scheduled sampling and autonomous training.
  evidence:
  - source_id: bengio2015
    locator: Sections4.1–4.3, task-specific training/evaluation settings and Tables1–3, PDF/printed pp.5–8;
      Section5 Conclusion, p.8
    relation: supports
