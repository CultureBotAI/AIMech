id: AIMech:DeeBERTDynamicEarlyExitingForAcceleratingBERTInference
name: DeeBERT (Dynamic Early Exiting for Accelerating BERT Inference)
concept_kind: algorithm
review_status: DRAFT
definition: DeeBERT (Dynamic Early Exiting for Accelerating BERT Inference) is a dynamic multi-exit fine-tuning and inference method for pretrained Transformer language models that inserts one intermediate classification off-ramp f_i(x; theta) after each Transformer layer i = 1..n (where f_n is the original final classifier), trains the network with a two-stage supervised protocol that first fine-tunes the embeddings, all n Transformer layers, and f_n under the final-layer cross-entropy loss L_n and then freezes the backbone and f_n while optimizing only the intermediate off-ramps f_1..f_{n-1} under sum_{i=1}^{n-1} L_i, and accelerates inference by exiting at the first off-ramp i whose output distribution z_i = f_i(x) has Shannon entropy H(z_i) < S.
identity_notes: Distinct from static layer-dropping and distillation methods (DistilBERT, TinyBERT, BERT-PKD, LayerDrop) that apply fixed depth reduction to all inputs regardless of difficulty, distinct from FastBERT (AIMech:FastBERTSelfDistillingBERTWithAdaptiveInferenceTime) which trains student branches via KL self-distillation from the final classifier's soft labels rather than supervised ground-truth cross-entropy in Stage 2, and distinct from PABEE (AIMech:PABEEPatienceBasedEarlyExitForBERT) which exits based on consecutive cross-layer prediction agreement (patience) rather than single-layer entropy H(z_i) < S.
aliases:
