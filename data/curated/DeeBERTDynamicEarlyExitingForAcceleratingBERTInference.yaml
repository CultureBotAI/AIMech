claims:
- claim_id: deebert-two-stage-off-ramp-fine-tuning-isolation
  kind: mechanism
  statement: 'DeeBERT attaches n classification off-ramps with per-layer cross-entropy loss L_i(D; theta) = (1/|D|) sum_{(x,y) in D} H(y, f_i(x; theta)) (Eq. 1) and decouples fine-tuning into two stages: Stage 1 updates embeddings, all n Transformer layers, and the final off-ramp f_n using L_n, while Stage 2 freezes all parameters updated in Stage 1 and updates only the intermediate off-ramps f_1..f_{n-1} using sum_{i=1}^{n-1} L_i, strictly preserving the full-depth Transformer''s predictive capacity at layer n.'
  evidence:
  - source_id: r812-primary-pdf
    locator: Section 3.1 (Fine-Tuning), Equation 1, pp. 2247-2248
    relation: supports
  - source_id: r812-primary-pdf
    locator: verify_two_stage_isolation and main
    relation: supports
- claim_id: deebert-entropy-threshold-early-exit-and-layer-saving
  kind: mechanism
  statement: At inference time (Algorithm 1), DeeBERT evaluates Transformer layers i = 1..n sequentially and immediately returns z_i = f_i(x) at the first layer satisfying entropy(z_i) < S, achieving analytical expected layer execution savings of 1 - (sum_{i=1}^n i * N_i) / (sum_{i=1}^n n * N_i) (Eq. 2), where N_i is the number of examples exiting at layer i.
  evidence:
  - source_id: r812-primary-pdf
    locator: Section 3.2 (Inference), Algorithm 1 and Equation 2, p. 2248
    relation: supports
  - source_id: r812-primary-pdf
    locator: deebert_early_exit and expected_layer_saving
    relation: supports
- claim_id: deebert-glue-inference-acceleration-for-bert-and-roberta
  kind: application
  statement: On six GLUE benchmark tasks (SST-2, MRPC, QNLI, RTE, QQP, and MNLI) across both BERT-base and RoBERTa-base, DeeBERT reduces inference time by up to ~40% with minimal accuracy degradation and traces a single continuous quality-efficiency trade-off curve by varying the entropy threshold S without retraining.
  evidence:
  - source_id: r812-primary-pdf
    locator: Section 4.2 (Main Results), Table 1 and Figure 2, pp. 2248-2249
    relation: supports
- claim_id: deebert-layerwise-redundancy-and-threshold-sensitivity-limitation
  kind: limitation
  statement: Because early off-ramp classifiers can exhibit overconfidence on hard inputs and ensemble effects across layers are absent in single-layer entropy checks, aggressive entropy thresholds S cause accuracy degradation on complex reasoning tasks, and wall-clock speedup requires batch-size-1 or dynamic batching execution.
  evidence:
  - source_id: r812-primary-pdf
    locator: Section 4.1 (Experimental Setup) and Section 4.3 (Layerwise Results), pp. 2248-2250
    relation: supports
