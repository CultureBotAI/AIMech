limitations:
- This is Chen and colleagues’ visual ABC-CNN, not Yin and colleagues’ sentence-pair ABCNN or every attention-based
  CNN.
- Printed classifier notation and ablation arithmetic contain inconsistencies; interpretation and table-derived
  calculations remain explicit, without assuming unseen code.
- Reported image encoders are fixed, answer outputs are single words, and dataset/feature/vocabulary settings
  differ. No unrestricted generation, universal superiority or causal attention faithfulness is established.
- All ten pages of arXiv1511.05960v2 were visually read. No author code, training, benchmark replication
  or other source version inspected. DRAFT remains.
