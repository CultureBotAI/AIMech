claims:
- claim_id: r459-correlation-frobenius-singular-value-variance-identity-mechanism
  kind: mechanism
  statement: Proves that under cross-entropy gradient flow, skewed local class frequencies mu_c reduce the rank of the driving matrix G(t), causing local and aggregated representations to collapse onto a low-dimensional subspace (Theorem 1, Equations 3-5), and mitigates this collapse by penalizing (1 / d^2) ||K||_F^2 on z-score normalized features z_hat_i, which equals (1 / d^2)(sum_{i=1}^d (lambda_i - 1)^2 + d) and therefore uniformizes the singular values lambda_1, ..., lambda_d of K without requiring an explicit SVD (Proposition 1, Equations 7-9).
  evidence:
  - source_id: r459-primary-pdf
    locator: Section 3.3 Theorem 1, Section 4 Proposition 1 (Equations 6-9), and Appendices A-B (Equations 32-51), pp. 4-6, 13-18
    relation: supports
- claim_id: r459-plug-and-play-local-feature-regularizer-scope
  kind: scope
  statement: Acts as a plug-and-play client-side representation regularizer compatible with standard federated optimization backbones (including FedAvg, FedProx, MOON, and FedRS) with zero communication overhead and negligible O(N d^2) mini-batch computation.
  evidence:
  - source_id: r459-primary-pdf
    locator: Section 4 Algorithm 1 & Section 5.1-5.2 Experimental Results (Tables 1-3), pp. 6-8
    relation: supports
- claim_id: r459-minibatch-size-sensitivity-for-correlation-estimation-limitation
  kind: limitation
  statement: Relies on mini-batch sample mean and variance normalization to estimate the d x d correlation matrix K, so very small local mini-batch sizes N produce noisy correlation estimates and degraded regularization effectiveness.
  evidence:
  - source_id: r459-primary-pdf
    locator: Section 4 Equations 7-8 & Section 5.3 Ablation Study on Mini-Batch Size (Figure 5b), pp. 6, 9
    relation: supports
- claim_id: r459-heterogeneous-federated-vision-classification-application
  kind: application
  statement: Applied to heterogeneous federated visual classification on CIFAR-10, CIFAR-100, Tiny-ImageNet, and PACS across Dirichlet label skew and multi-domain shift.
  evidence:
  - source_id: r459-primary-pdf
    locator: Section 5 Experiments (Tables 1-3, Figures 3-5) & Appendix E, pp. 7-9, 20-22
    relation: supports
