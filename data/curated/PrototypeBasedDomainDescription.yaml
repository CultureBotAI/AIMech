limitations:
- The general decision rule and the nonnegative kth-distance construction have different scopes. Claims
  about reference equivalence here require the latter, a valid metric and self-included reference distances.
- Printed kth-neighbor rank wording does not fully specify distance ties; this record uses the ordered-distance
  interpretation. Theorem 2.6 prints an acceptance sign in its rejection case; the defining rule determines
  the rejection.
- Population examples relating parameters to statistical outlier tests do not supply distribution-free
  finite-sample error calibration. No universal threshold, density interpretation or numerical performance
  advantage is curated.
- All 15 author-PDF pages were visually read. Exact finite calculations were executed; no historical implementation,
  trained model or benchmark was reproduced.
