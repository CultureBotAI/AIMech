id: AIMech:FedGenDataFreeKnowledgeDistillationForHeterogeneousFederatedLearning
name: FedGen (Data-Free Knowledge Distillation for Heterogeneous Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A data-free knowledge distillation algorithm for heterogeneous federated learning (Zhu, Hong, & Zhou 2021, Section 3, Algorithm 1) in which the server trains a lightweight conditional latent-space generator G_w(z | y, epsilon ~ N(0, I)) solely from uploaded client predictor heads {theta_k^p}_{k=1}^K and empirical label counts p_hat(y) by minimizing the label-count-weighted ensemble cross-entropy min_w E_{y ~ p_hat(y), z ~ G_w(.|y)}[l(sigma(sum_{k=1}^K lambda_k^y g(z; theta_k^p)), y)] plus a diversity loss (Eq. 4, Section 9), and broadcasts G_w to clients to regularize local training on synthetic latent representations z ~ G_w(.|y) without requiring any external proxy dataset.
identity_notes: Distinct from proxy-data ensemble distillation FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning, Lin et al. 2020), which requires an external unlabeled public dataset on the server to query client ensembles in raw input space X, whereas FedGen is strictly data-free and learns a compact conditional generator in the intermediate feature space Z.
aliases:
