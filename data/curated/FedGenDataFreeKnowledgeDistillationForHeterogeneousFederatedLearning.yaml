claims:
- claim_id: r423-conditional-kl-divergence-minimization-and-domain-discrepancy-contraction
  kind: mechanism
  statement: Training client k's predictor on latent representations z ~ G_w(.|y) minimizes the conditional KL divergence D_KL(r(z | y) || p(z | y; theta_k)) between the global ensemble induced latent distribution r(z | y) and the local model (Remark 1), and augmenting m local samples from D_k~ with m synthetic samples from D~ contracts the H Delta H domain discrepancy to d_{H Delta H}(D_k'~, D~) <= (1/2) d_{H Delta H}(D_k~, D~) + (1/2) epsilon while doubling effective sample size m' = 2m, strictly tightening the federated generalization bound whenever epsilon < d_{H Delta H}(D_k~, D~) (Section 4.3, Theorem 1, Corollary 1, Section 8).
  evidence:
  - source_id: r423-primary-pdf
    locator: Section 4 Theoretical Analysis (Remark 1, Theorem 1, Corollary 1) & Supplementary Section 8 (Proofs of Remark 1 and Corollary 1)
    relation: supports
- claim_id: r423-modular-latent-space-distillation-when-sharing-feature-extractors-is-infeasible
  kind: mechanism
  statement: Because G_w generates representations in the penultimate feature space Z rather than raw high-dimensional inputs X, FedGen remains functional even when clients only upload lightweight prediction heads theta_k^p and keep heterogeneous or privacy-sensitive feature extractors theta_k^f strictly local (Section 3.2, Table 3).
  evidence:
  - source_id: r423-primary-pdf
    locator: Section 3.2 Local Model Training & Section 5.2 Sharing Only Prediction Layer (Table 3)
    relation: supports
- claim_id: r423-client-label-count-reporting-and-generator-broadcast-overhead-limitation
  kind: limitation
  statement: Requires active clients to report empirical class counts n_k^y to construct the label-weighted ensemble logits lambda_k^y (or else fall back to uniform label priors with reduced accuracy under severe label skew) and adds the communication and local forward-pass cost of the generator G_w.
  evidence:
  - source_id: r423-primary-pdf
    locator: Section 3.1-3.2 & Supplementary Section 9-10 Privacy and Label Count Discussion
    relation: supports
- claim_id: r423-mnist-emnist-cifar10-and-celeba-non-iid-federated-application
  kind: application
  statement: Applied to heterogeneous federated classification on MNIST, EMNIST, CelebA, and Dirichlet-partitioned CIFAR-10, outperforming FedAvg, FedProx, FedEnsemble, and FedDF without using any external proxy dataset.
  evidence:
  - source_id: r423-primary-pdf
    locator: Section 5 Experiments (Tables 1-3, Figures 3-6), pp. 12884-12887
    relation: supports
