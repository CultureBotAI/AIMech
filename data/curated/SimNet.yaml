limitations:
- SimNet here denotes the original similarity/MEX architecture family; SimSiam and generic similarity-based
  methods are different concepts. The later Deep SimNets full paper remains an uninspected followup.
- MEX limits, nested-collapse conditions and optional constants matter. A powered distance and a weighted
  template response are not automatically kernels or posterior probabilities.
- The specific kernel constructions do not establish identical training objectives, arbitrary learned-weight
  kernel equivalence or universal expressivity/performance dominance.
- Original experiments use a shallow patch-labeling configuration and cross-validation comparisons; parameter
  savings are not hardware-speed measurements, and initialization effects remain protocol-dependent.
- All 19 primary PDF pages visually read, including mathematical appendices. Constructed calculations
  illustrate boundaries; no independent formal-proof certification, author code, training or benchmark
  replication. DRAFT remains.
