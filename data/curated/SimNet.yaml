id: AIMech:SimNet
name: SimNet
aliases:
- SimNets
concept_kind: architecture
definition: A neural architecture family built from learned template-similarity operations and MEX log-mean-exp
  operations that combine shifted similarity responses, with local sharing and pooling available in image-processing
  configurations.
identity_notes: 'Compared all 442 pinned AIO and 620 native IDs, names, aliases and scoped synonyms; the
  SimNet/SimNets identities match AIMech:SimNet and are reused.  Ignored- and hidden-inclusive fixed-string
  searches of the recovery, older discovery and original Documents checkouts returned 1138, 0, 0 lines.
  All distinct match contents were inspected. Semantic matching covered 22 AIO and 60 native definitions,
  with every matched definition read. 4 full annotated AIO node/edge/generated contexts and 2 full native
  records were inspected. Reuse AIMech:SimNet: the2016 source explicitly extends the same similarity/MEX
  architecture with stacked blocks. Deep configurations fall within the existing family definition, and
  a new title or deeper evaluation alone does not justify a separate ID. Deep SimNets is a scoped configuration
  designation, not added as an unqualified exact alias of every family member. MEXOperator is a scalar
  component; FastICA is an estimation algorithm that may initialize a transform, not this complete architecture.'
