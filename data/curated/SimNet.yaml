- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: SimNet is a specific learned neural architecture family; the pinned generic artificial-neural-network
    target is broader.
- target: AIO:DeepConvolutionalNetwork
  relation: related_match
  rationale: The family generalizes convolutional constructions using similarity and MEX operations. Generic
    members need not use the pinned convolutional components or image-specific scope, so the relationship
    is recorded without equivalence or a forced subclass direction.
limitations:
- SimNet denotes the similarity/MEX architecture family across the inspected 2014 and 2016 papers. The
  deeper stacked configurations are retained within that stable identity; a separate DeepSimNet ID or
  unqualified exact alias is not created.
- MEX limits, nested-collapse conditions and optional constants matter. A powered distance and a weighted
  template response are not automatically kernels or posterior probabilities.
- The specific kernel constructions do not establish identical training objectives, arbitrary learned-weight
  kernel equivalence or universal expressivity/performance dominance.
- The original paper evaluates shallow patch-labeling and cross-validation configurations; the followup
  adds deeper image classifiers with different initialization and tuning settings. FLOP and parameter
  savings are not measured latency, energy or deployment performance.
- All 19 original and 10 followup PDF pages visually read, including the original mathematical appendices.
  Constructed calculations illustrate boundaries; no independent formal-proof certification, author code,
  training or benchmark replication. DRAFT remains.
