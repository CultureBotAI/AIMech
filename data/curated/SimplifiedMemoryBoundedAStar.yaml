id: AIMech:SimplifiedMemoryBoundedAStar
name: Simplified memory-bounded A-star search
aliases:
- SMA*
definition: A node-budgeted best-first tree-search algorithm that generates one successor
  at a time, propagates evaluation values through pathmax and completed-node backup,
  and deletes selected high-cost nodes while retaining parent bounds for later regeneration.
identity_notes: SMA* denotes Russell's 1992 simplified memory-bounded A* tree procedure,
  with a node budget, incremental successor generation, pathmax, guarded completed-node
  backup and least-promising-node deletion with retained parent bounds. It is distinct
  from unrestricted A*, frontier-cap beam search, earlier MA*/MAO*, MREC and IE; later
  textbook variants and generic graph duplicate handling are not imported. The exact
  source parent guard and original storage/completeness qualifications remain part
  of its scope. The actual cohort 358 collection at dd7a5a99eb412b5b587efb1e598cbb760a9bba0d
  contains 1,236 records (794 native and 442 pinned AIO), 4,903 identity-field occurrences
  including local IDs and 3,745 normalized values. Candidate IDs, names, aliases and
  retained source spellings have no normalized collision in that inventory. The collection
  includes ignored and hidden files in four-root text searches; semantic raw-search
  assessment is separately attributed. All 1,230 records in the older scientific-research
  inventory retain their bytes; six later additions were read as current definition/identity
  context. The seven normalized matches concern existing A*, IDA*, IDA*IM, beam-stack
  and RBFS-family contexts, not candidate identities. Current memory-search source
  owner 911 is only partially resolved; MA*/MAO* and separate IE owner 912 remain
  pending.
claims:
- claim_id: best-leaf-and-single-successor
  kind: mechanism
  statement: SMA* chooses the deepest least-f-cost leaf in OPEN, tests that selected
    node for a goal, and generates its next successor. The successor receives the
    maximum of the parent’s backed-up f value and its own g + h value.
  evidence:
  - source_id: sma1992
    locator: Section 3.1, manuscript p. 3 / PDF p. 3; SMA*(start) pseudocode
    relation: supports
- claim_id: completed-node-backup
  kind: mechanism
  statement: When the selected node has no unexamined successors, SMA* calls BACKUP.
    In the displayed procedure, a completed node that has a parent receives the least
    successor f value; if that value changes, BACKUP is called on its parent under
    the same completion-and-parent guard. A node whose successors are all in memory
    is removed from OPEN.
  evidence:
  - source_id: sma1992
    locator: Section 3.1, manuscript p. 3 / PDF p. 3; completed-node definition, SMA*
      and BACKUP pseudocode
    relation: supports
- claim_id: bounded-pruning-and-regeneration
  kind: mechanism
  statement: After successor generation raises USED above MAX, the displayed algorithm
    deletes the shallowest highest-f-cost node in OPEN, removes it from its parent’s
    successor list and reinserts that parent in OPEN if necessary. Parent bounds and
    successor bookkeeping allow later regeneration without retaining every deleted
    descendant’s information.
  evidence:
  - source_id: sma1992
    locator: Sections 3.1–3.3, manuscript pp. 3–4 / PDF pp. 3–4; pruning steps and
      Figure 2 discussion
    relation: supports
- claim_id: node-budget-and-bookkeeping
  kind: scope
  statement: MAX specifies the number of nodes that can be accommodated and USED tracks
    nodes in memory. Each node stores g, h and f, the minimum f among examined successors,
    and information indicating the next successor to generate.
  evidence:
  - source_id: sma1992
    locator: Section 3.1, manuscript p. 3 / PDF p. 3; paragraph after BACKUP, continuing
      at top of right column
    relation: supports
