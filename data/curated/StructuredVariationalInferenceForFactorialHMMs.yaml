name: Structured variational inference for factorial HMMs
definition: A variational inference procedure for factorial hidden Markov models that approximates the
  posterior by independent chain-path distributions while retaining temporal dependence within each chain.
concept_kind: algorithm
identity_notes: 'This record denotes the chain-structured approximation and additive-Gaussian updates
  in Ghahramani–Jordan Section 3.5 and Appendix D. It is narrower than all structured variational inference
  and distinct from the factorial HMM model, a fully factorized state-by-time approximation, exact joint-state
  forward–backward, Gibbs sampling, or BBVI score-function optimization. It requires neither an amortized
  recognition network nor a variational autoencoder architecture. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 376 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 5 and 5 lines.
  All 4 unique matched contents were fully read: preceding boundary discussions, citations, reviews and
  pending leads, not existing records of these three identities. All 64 semantic label/synonym hits, 17
  exact fully annotated AIO nodes with outgoing edges, their generated records and four native neighbors
  were inspected or verified unchanged after prior full reading. Absence is bounded to this pin and inspected
  neighborhood.'
limitations:
- The approximation removes posterior dependence between chains even when the shared observation creates
  explaining-away effects. It preserves each chain’s time dependence, unlike a fully factorized state-by-time
  distribution.
- The h factors are positive unnormalized potentials, not row-normalized transition probabilities or already-normalized
  state posteriors. Normalization and initial/boundary conditions belong to the complete chain computation.
- The residual/diagonal formula depends on additive Gaussian emissions with common covariance. General
  emissions require their own expected-log-factor calculations; the formula is not an arbitrary-model
  black-box update.
- Coordinate-ascent guarantees require an exact update of one factor while holding the others fixed. Simultaneous
  arbitrary updates, local stopping criteria or approximate model steps do not establish a global optimum,
  exact evidence, or universal likelihood improvement.
- Appendix C Equation C.9 displays prior/transition signs inconsistent with its energy definition and
  derivative; that display is not adopted. Appendix D cancels explicit prior/transition log terms when
  the same factors are retained, but its moments and normalizer still depend on those factors; the accompanying
  independence wording is not literal total independence.
- The general product-of-path-distributions variational family contains independent-time factors, but
  the displayed fixed-transition/unary parameterization and local optimization do not justify claiming
  every run outperforms a fully factorized approximation. No benchmark or author implementation is certified.
