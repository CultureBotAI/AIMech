claims:
- claim_id: method
  kind: mechanism
  statement: For fixed model parameters and observations, choose q(S)=product_m q_m(s_1:T^m) and optimize
    the evidence lower bound E_q[log p(Y,S)-log q(S)], equivalently minimizing KL(q||p(S|Y)). Each chain
    factor is globally normalized over its path and retains the model’s initial and transition factors
    multiplied by positive unary potentials h_t^m. In the additive Gaussian model, h_t^m is proportional
    to exp((W_m)^T C^-1 [y_t-sum_(l!=m) W_l E_q[s_t^l]] - 0.5 diag((W_m)^T C^-1 W_m)), componentwise over
    the chain’s states. With other chain factors fixed, run forward–backward using these unary factors
    to update that chain’s state and temporal-pair moments, then repeat across chains. Same-time moments
    between different chains factorize under q; within-chain temporal moments do not. Such exact single-chain
    coordinate updates increase or preserve the bound for fixed model parameters. The moments may also
    supply a variational E-step for model fitting, but this approximate posterior does not become the
    exact posterior merely by convergence.
