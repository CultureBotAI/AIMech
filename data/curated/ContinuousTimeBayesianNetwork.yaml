- target: AIO:MarkovChain
  relation: related_match
  rationale: The complete finite-state model defines a continuous-time Markov process, and the pinned
    target includes Markov Process as an exact synonym. This related mapping does not equate the specific
    CIM factorization with the broad AIO node or assert inheritance of its Network classification or ProbabilisticHiddenLayer
    has-part relation. The separate initial BN does not make the possibly cyclic dynamics graph an AIO
    BayesianNetwork DAG.
limitations:
- The maintained scope is finite variables and finite, time-independent conditional rates with one local
  transition owner per variable. Time-dependent rates, infinite state spaces and simultaneous multi-variable
  jump extensions require separate definitions. Zero rates and reducibility are permitted; irreducibility
  and convergence to a unique stationary law independently of the initial distribution are not guaranteed.
- This is a stochastic model representation, not a particular simulator, learning procedure or approximate-inference
  algorithm. Hidden variables, emission distributions, action/reward control and intervention semantics
  are not required by this definition.
- 'Ancillary displayed inconsistencies in the corrected source remain outside the core construction: Example
  2.2 on PDF p. 2 reverses two probabilities in the third embedded-chain row; the first marginalization
  display on p. 8 mixes its initial/destination eliminated-state indices; and Section 5.2.2 on p. 9 labels
  an expected holding time as an intensity, although its example uses the reciprocal. No repaired approximate-inference
  implementation or author-issued erratum is claimed.'
- The author-hosted PDF is labeled Corrected without an established correction date or comparison to the
  original proceedings bytes. Original finite calculations support bounded examples; nonrational exponential
  probabilities are enclosed by rational bounds, not represented as exact rational values. No author-code
  execution, experiment replication, clinical validation or universal performance claim is included.
