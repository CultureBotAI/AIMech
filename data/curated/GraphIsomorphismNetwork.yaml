name: Graph isomorphism network
definition: A graph neural architecture using multilayer perceptrons on sums of neighboring representations
  and a separately weighted self-representation.
concept_kind: architecture
identity_notes: GIN is the named sum-and-MLP architecture, not the graph-isomorphism decision problem,
  all graph neural networks, or all architectures as expressive as a Weisfeiler–Lehman test.
aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: The architecture uses learned multilayer perceptrons to transform graph-node states; the
    AIO neural-network category is broader.
- target: AIO:GraphConvolutionalNetwork
  relation: related_match
  rationale: The AIO category describes graph-structured neural computation broadly; the GIN construction
    has a specific aggregation and self-weighting rule.
limitations:
- The equation is taken from revised v3; the earlier v1 expression lacks the separately parameterized
  self weighting.
- No claim that GIN solves arbitrary graph isomorphism or that every trained finite network attains the
  theoretical expressivity bound is curated.
