claims:
- claim_id: mebert-normalized-margin-dimension-bound-and-orthogonal-decomposition-theorem
  kind: mechanism
  statement: Defining the normalized margin between query q and documents d_1, d_2 as mu(q, d_1, d_2) = <q, d_1 - d_2> / (||q|| * ||d_1 - d_2||) (Definition 2.1), Lemma 1 proves that preserving the ranking <Phi q, Phi d_1> > <Phi q, Phi d_2> under random projection Phi in R^{k x v} with probability at least 1 - beta requires encoding dimension k >= 2 * (mu^2 / 2 - mu^3 / 3)^(-1) * ln(4 / beta) (Equation 2); Theorem 1 proves that decomposing long documents into m orthogonal segments d = sum_{i=1}^m d^(i) where q aligns with segment i guarantees mu(q, d_1^(i), d_2^(i)) >= mu(q, d_1, d_2), increasing the normalized margin and lowering the required dimension k.
  evidence:
  - source_id: r778-primary-pdf
    locator: Sections 2.2-2.3 & Section 3, Definition 2.1, Lemma 1, Theorem 1, & Appendix A, pp. 3-5, 13-15
    relation: supports
  - source_id: r778-primary-pdf
    locator: normalized_margin(), lemma1_min_dimension(), and main() verification of Theorem 1
    relation: supports
- claim_id: mebert-first-m-token-max-inner-product-single-query-mips
  kind: mechanism
  statement: ME-BERT encodes query x into a single vector f^(1)(x) = W_Q * [CLS]_Q and document y into m vectors f_j^(m)(y) = W_D * Z_j for its first m tokens j in {1, ..., m}, scoring relevance via psi^(m)(x, y) = max_{j in {1..m}} <f^(1)(x), f_j^(m)(y)> (Section 3, Figure 2); because argmax_{y in D} psi^(m)(x, y) is recovered by finding the pair (y, j) maximizing <f^(1)(x), f_j^(m)(y)>, retrieval executes as a single query lookup in an m * |D|-vector MIPS index without multi-query aggregation or attention post-processing.
  evidence:
  - source_id: r778-primary-pdf
    locator: Section 3 (Multi-Vector Encodings & Inference), Figure 2, pp. 5-6
    relation: supports
  - source_id: r778-primary-pdf
    locator: me_bert_score() and main() verification of flat m*|D| MIPS index equivalence
    relation: supports
- claim_id: mebert-long-document-and-open-retrieval-qa-application
  kind: application
  statement: "With m = 8 vectors per passage, ME-BERT consistently outperforms single-vector DE-BERT across MS MARCO, TREC-CAR, and four open-retrieval QA benchmarks (NaturalQuestions, TriviaQA, WebQuestions, CuratedTREC, Tables 2-4)\u2014with its largest gains over DE-BERT occurring on long documents where single-vector capacity degrades (Figures 3-4)\u2014and achieves higher retrieval accuracy and lower latency than Poly-encoders while further improving when hybridized with BM25 (ME-HYBRID, Table 2 & Figure 5)."
  evidence:
  - source_id: r778-primary-pdf
    locator: Section 6, Tables 2-5 & Figures 3-5, pp. 7-10
    relation: supports
- claim_id: mebert-m-fold-index-footprint-growth-limitation
  kind: limitation
  statement: Because ME-BERT indexes m separate k-dimensional vectors for every document in the collection, its dense MIPS index memory footprint and vector count scale linearly by a factor of m (e.g., 8x more indexed vectors for m = 8) compared to a single-vector dual encoder of the same embedding dimension k (Section 3).
  evidence:
  - source_id: r778-primary-pdf
    locator: Section 3 (Inference) & Section 6.3, Figure 5, pp. 5, 9-10
    relation: supports
