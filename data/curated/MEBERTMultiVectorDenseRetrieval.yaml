id: AIMech:MEBERTMultiVectorDenseRetrieval
name: ME-BERT Multi-Vector Dense Retrieval
concept_kind: architecture
review_status: DRAFT
definition: A multi-vector dense retrieval architecture and capacity-bounded representation framework that represents each query as a single projected [CLS] vector f^(1)(x) in R^k and each document as a fixed number m of dense vectors {f_1^(m)(y), ..., f_m^(m)(y)} in R^k obtained by applying a learnable linear projection to the contextualized BERT outputs of the first m document tokens, scoring query-document relevance by the maximum inner product across the m document vectors psi^(m)(x, y) = max_{j in {1..m}} <f^(1)(x), f_j^(m)(y)> so that exact top-K document retrieval reduces to a single maximum inner-product search (MIPS) query over an index of m * |D| vectors.
identity_notes: Distinct from ColBERT (AIMech:ColBERTContextualizedLateInteraction), which encodes every query token and every document token and sums maximum similarities across all query tokens (requiring multiple MIPS queries per user query plus post-processing rather than a single query vector searched against m fixed vectors per document); and distinct from Poly-encoders (AIMech:PolyEncoderArchitecture), which apply a softmax-weighted attention step over m context codes before computing the final query dot product (preventing direct single-query sublinear MIPS indexing).
aliases:
- ME-BERT
- Multi-Vector BERT Dense Retrieval
- Multi-Vector Encoding BERT
