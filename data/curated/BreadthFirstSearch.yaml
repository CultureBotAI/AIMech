  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: A FIFO queue holds discovered vertices awaiting expansion. Remove its front vertex, inspect
    its outgoing edges, mark each previously undiscovered neighbor when it is enqueued, and continue until
    the queue is empty or a goal-search stopping condition is met.
  evidence:
  - source_id: method-source
    locator: Opening traversal description; BFS(G, s) pseudocode; buffer(Buffer& Q) parameter
    relation: supports
- claim_id: edge-count-scope
  kind: scope
  statement: Unit-edge paths are within breadth-first search’s shortest-path scope; general nonnegative
    weighted paths require a cost-sensitive method such as Dijkstra’s algorithm.
  evidence:
  - source_id: versioned-documentation-scope
    locator: Opening description comparing nonnegative weighted shortest paths with unit-edge breadth-first
      search
    relation: supports
