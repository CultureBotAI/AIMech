name: Breadth-first search
definition: A graph or state-space traversal that expands vertices in nondecreasing shortest-path distance
  from a start vertex, where distance counts edges.
concept_kind: algorithm
identity_notes: BFS denotes breadth-first search in this record, not the abbreviation sometimes used for
  generic best-first search. FIFO layer traversal is distinct from a cost-priority queue for weighted
  paths and from depth-first traversal. No normalized identity match was found across the 442 AIO and
  119 prior native records; ignored-inclusive text hits in the main checkout were dependency-package documentation
  and an unrelated package-metadata substring, not existing concept records.
limitations:
- Shortest distance means number of edges; arbitrary unequal edge costs are not minimized by FIFO traversal.
- The cited graph implementation tracks discovered vertices. Its visited-state storage and frontier memory
  must not be confused with a path-only tree-search implementation.
- Traversal from a single start reaches only its reachable component; the documentation describes separate
  visits for disconnected components.
id: AIMech:BreadthFirstSearch
aliases:
