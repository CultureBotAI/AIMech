claims:
- claim_id: hyde-generative-hypothetical-document-pivoting
  kind: mechanism
  statement: Given a query q_{ij} and task instruction INST_i, HyDE samples N hypothetical answer passages d_hat_k ~ InstructLM(q_{ij}, INST_i) and computes the query representation as the expectation average v_hat_{q_{ij}} = (1/(N+1)) (sum_{k=1}^N f(d_hat_k) + f(q_{ij})) using an unsupervised contrastive document encoder f = enc_con.
  evidence:
  - source_id: r742-primary-pdf
    locator: Section 3.2, pp. 3-4, Equations 2-8
    relation: supports
- claim_id: hyde-dense-bottleneck-hallucination-filtering
  kind: mechanism
  statement: Because the unsupervised contrastive encoder f maps text into a compact dense vector trained for document-document similarity, it acts as a lossy bottleneck that filters out hallucinated factual details in the generated hypothetical passages while grounding the resulting vector to real corpus documents via inner-product search.
  evidence:
  - source_id: r742-primary-pdf
    locator: Section 1 & Section 3.2, pp. 2 & 4
    relation: supports
- claim_id: hyde-zero-shot-web-beir-and-multilingual-application
  kind: application
  statement: Without any relevance labels or model fine-tuning, HyDE pairing InstructGPT with Contriever or mContriever substantially outperforms BM25 and standalone Contriever across TREC DL19/DL20 web search, six BEIR low-resource retrieval tasks, and multilingual retrieval in Swahili, Korean, Japanese, and Bengali on Mr.TyDi.
  evidence:
  - source_id: r742-primary-pdf
    locator: Section 4.1-4.4, pp. 4-6, Tables 1-3
    relation: supports
  - source_id: r742-metadata-cr
    locator: DBLP bibliographic record Luyu Gao et al. ACL 2023
    relation: supports
- claim_id: hyde-online-llm-generation-latency-and-low-resource-limitation
  kind: limitation
  statement: HyDE requires invoking an instruction-following generative language model at query time for every user query and its effectiveness degrades when the generative model or contrastive encoder is under-trained on low-resource languages or specialized entity domains.
  evidence:
  - source_id: r742-primary-pdf
    locator: Section 4.3-4.4 & Section 6, pp. 5-7
    relation: supports
