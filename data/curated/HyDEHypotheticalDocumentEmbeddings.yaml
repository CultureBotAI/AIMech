id: AIMech:HyDEHypotheticalDocumentEmbeddings
name: HyDE Hypothetical Document Embeddings
concept_kind: algorithm
review_status: DRAFT
definition: 'A training-free zero-shot dense retrieval method that decomposes relevance modeling into an instruction-following natural language generation step and an unsupervised document-document similarity step: given a test query, an instruction-following language model generates N hypothetical documents that exemplify relevant answer patterns (even if factually ungrounded), an unsupervised contrastively pretrained encoder maps those hypothetical documents and the query into a dense query vector by averaging their embeddings, and real corpus documents are retrieved via inner-product similarity in the document embedding space.'
identity_notes: Distinct from document-to-query data augmentation methods such as Promptagator (AIMech:PromptagatorFewShotDenseRetrievalDataGeneration) and InPars (AIMech:InParsInContextDataAugmentationForInformationRetrieval), which generate synthetic queries from real documents offline to train retrievers or rerankers, whereas HyDE requires no model training or corpus access beforehand and instead translates each incoming query online into hypothetical documents so that retrieval occurs purely in an unsupervised document-document contrastive embedding space.
aliases:
- HyDE
- Hypothetical Document Embeddings
- Zero-Shot Dense Retrieval via Hypothetical Document Embeddings
