- claim_id: high-dimensional-covariance-rip-rsc-and-free-s-restricted-eigenvalue-optimization
  kind: mechanism
  statement: Sections 4.1-4.3 (pp. 15-24, Theorems 4.1-4.4, Section 4.3.1, Equations 4.2-4.27) establish
    finite-sample elementwise max-norm tail bounds for the uncentered empirical Gram error Delta_n :=
    |||hat{Sigma}_n - Sigma_n|||_infty <= 7 sqrt(Upsilon_{n,p}(t + 2 log p)/n) + C_alpha K_{n,p}^2 (log(2n))^{2/alpha}(t
    + 2 log p)^{1/gamma}/n with gamma = min{alpha/2, 1} (Theorem 4.1, Equations 4.4-4.5) and the centered
    sample covariance error Delta_n^* = |||hat{Sigma}_n^* - Sigma_n^*|||_infty (Theorem 4.2, Equations
    4.6-4.10); bound the k-sparse operator norm RIP_n(k) by Xi_{n,k}^{(M)}(t) <= k Delta_n(t) under marginal
    sub-Weibull tails and by Xi_{n,k}^{(J)}(t) with linear sqrt(k/n) leading term under joint sub-Weibull
    tails (Theorem 4.3, Equations 4.13-4.15); prove the unified Restricted Strong Convexity (RSC) inequality
    delta^T hat{Sigma}_n delta >= (lambda_min(Sigma_n) - 27 Xi_{n,s}) ||delta||_2^2 - (54 Xi_{n,s}/s)
    ||delta||_1^2 for any free parameter s in {1, ..., p} (Theorem 4.4, Equations 4.17, 4.20); and optimize
    s in min_{1<=s<=p}{Xi_{n,s} + k Xi_{n,s}/s} to obtain RE(k) sample complexity n >> k^2 log p at s
    = 1 under marginal sub-Weibull tails and n >> k log(ep/k) at s proportional to k under joint sub-Weibull
    tails (Section 4.3.1, Equations 4.21-4.27).
