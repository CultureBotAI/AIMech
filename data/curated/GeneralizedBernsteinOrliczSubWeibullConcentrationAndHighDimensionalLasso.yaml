- claim_id: hard-sparsity-free-misspecified-lasso-oracle-inequality-under-heavy-tailed-errors
  kind: scope
  statement: Section 4.4 and Appendix E (pp. 24-29 and 60-64, Theorems 4.5-4.6, Proposition E.1, Equations
    4.28-4.33 and E.9-E.11) analyze the high-dimensional Lasso estimator hat{beta}_n(lambda) relative
    to the model-free projection target beta_0 := arg min_{theta in R^p} 1/n sum_{i=1}^n E[(Y_i - X_i^T
    theta)^2] without hard-sparsity assumptions. Proposition E.1 proves that on E_n(lambda) := {||1/n
    sum_{i=1}^n X_i varepsilon_i||_infty <= lambda/2}, any subset S subseteq {1, ..., p} with 432 Xi_{n,|S|}^{(M)}
    <= lambda_min(Sigma_n) satisfies the approximate cone inequality ||nu(S^c)||_1 <= 3||nu(S)||_1 + 4||beta_0(S^c)||_1
    (Equation E.10) for nu = hat{beta}_n(lambda) - beta_0 and the deterministic l2 oracle bound ||hat{beta}_n(lambda)
    - beta_0||_2 <= (3 sqrt(|S|) lambda + sqrt(9|S|lambda^2 + D_{n,S})) / lambda_min(Sigma_n) with D_{n,S}
    = 4 lambda_min(Sigma_n)(lambda + 432(Xi_{n,|S|}^{(M)} / |S|)||beta_0(S^c)||_1)||beta_0(S^c)||_1 (Equation
    E.9), yielding non-asymptotic O_p(sqrt(k log(p)/n)) l2 rates under marginally sub-Weibull(alpha) covariates
    and either sub-Weibull(vartheta) errors (Theorem 4.5, Equation 4.30) or polynomial-tailed L_r errors
    via Fuk-Nagaev concentration (Theorem 4.6, Equations 4.31-4.32).
