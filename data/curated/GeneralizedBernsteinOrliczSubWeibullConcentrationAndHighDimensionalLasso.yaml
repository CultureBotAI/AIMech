  rationale: AIO:LinearRegression represents linear regression broadly, whereas AIMech:GeneralizedBernsteinOrliczSubWeibullConcentrationAndHighDimensionalLasso
    introduces the Generalized Bernstein-Orlicz (GBO) sub-Weibull concentration framework and applies
    it to high-dimensional covariance estimation, free-s Restricted Strong Convexity / Restricted Eigenvalue
    bounds, and misspecified high-dimensional Lasso.
- target: AIO:LassoRegression
