    rates for misspecified Lasso under marginally sub-Weibull(alpha) covariates and heavy-tailed errors.
limitations:
- 'Quasi-Norm Triangle Factor Q_alpha and Effective Exponent alpha^* = min{alpha, 1} for alpha < 1: When
  alpha in (0, 1), psi_alpha(x) = exp(x^alpha) - 1 is non-convex near the origin, so ||.||_{psi_alpha}
  and ||.||_{Psi_{alpha,L}} are quasi-norms satisfying the triangle inequality only up to Q_alpha = 2e(4/alpha)^{1/alpha}
  > 1 (Proposition A.5), and the heavy-tail exponent for sums of independent sub-Weibull(alpha) random
  variables is alpha^* = min{alpha, 1} rather than alpha (Theorems 3.1-3.3).'
- 'Quadratic vs. Linear Sparsity Sample Complexity Under Marginal vs. Joint Sub-Weibull Tails: Under purely
  marginal sub-Weibull tails ||X_i||_{M,psi_alpha} <= K_{n,p} without a joint sub-Weibull bound, the k-sparse
  operator norm bound Xi_{n,k}^{(M)} = k Delta_n scales linearly in k (Theorem 4.3(a)), so optimizing
  the free parameter s in Theorem 4.4 selects s = 1 and requires sample size n >> k^2 log p for the Restricted
  Eigenvalue condition RE(k), whereas joint sub-Weibull tails achieve n >> k log(ep/k) by selecting s
  proportional to k (Section 4.3.1, Equations 4.24-4.27).'
- 'Primary-Source Typographical Notes in arXiv:1804.02605v4: Verified five self-correcting typographical
  slips in the primary manuscript: (1) Theorem 3.1 (p. 9) prints ''b = (a_1 ||X_1||_{psi_alpha}, ...,
  a_n ||X_i||_{psi_alpha})'' where ''X_i'' in the last entry should be ''X_n''; (2) Proof of Proposition
  C.1 (p. 49) prints an extraneous factor ''L'' in ''e C_2 L (log(1+t)^4)^{1/alpha}''; (3) Proof of Proposition
  D.2 (p. 57) prints ''|W_1/alpha_1|^{alpha_1}(beta/alpha_1) + |W_2/eta_2|^{alpha_1}(beta/alpha_2)'' where
  ''alpha_1'' in the first denominator should be ''eta_1'' and the exponent ''alpha_1'' on the second
  term should be ''alpha_2''; (4) Proof of Theorem 4.5 (p. 60) prints ''max_{1<=i<=n} ||X_i(j) varepsilon_j||_{psi_gamma}''
  where ''varepsilon_j'' should be ''varepsilon_i''; and (5) Proposition E.1 (p. 63) prints ''||beta^*(S^c)||_1^2''
  for ''||beta_0(S^c)||_1^2'' and Equation (E.11) on p. 64 (line 1) prints ''32||beta_0(S^c)||_2^2'' before
  writing ''1728(Xi_{n,|S|}^{(M)}/|S|) ||beta_0(S^c)||_1^2''.'
- All 68 pages of the full-text PDF of Kuchibhotla & Chakrabortty (2022, arXiv:1804.02605v4, DOI:10.1093/imaiai/iaac012)
  were read. Constructed numerical checks in research/discovery/sub-weibull-gbo-concentration-and-lasso-boundaries.py
  verify (1) Proposition A.1 closed-form Orlicz equivalence ||X||_{Psi_{alpha,L}} <= ||X||_{phi_{alpha,L}}
  <= 2||X||_{Psi_{alpha,L}} and Proposition D.2 Holder-type product Orlicz inequality, (2) Definitions
  2.4-2.5 and Equation 4.1 sqrt(q) divergence of joint vs. marginal sub-Weibull norms under collinearity
  and Remark 3.2 strict improvement of Theorem 3.4 over Chernozhukov et al. (2017, Lemma E.1), (3) Theorem
  4.4 unified RSC and Section 4.3.1 free-s optimization for RE(k) sample complexity, and (4) Proposition
  E.1 deterministic hard-sparsity-free approximate cone condition and l2 oracle bound for misspecified
  Lasso.
