- claim_id: gbo-sum-and-maximum-concentration-product-orlicz-and-empirical-processes
  kind: mechanism
  statement: Section 3, Appendix B, and Appendix D (pp. 8-14, 33-47, 55-58, Theorems 3.1-3.4, B.1, Propositions
    B.1-B.4, D.2, Remarks 3.1-3.3, Equations 3.1-3.6 and B.1-B.6) prove Latala-type non-variance-scaling
    GBO bounds (Theorem 3.1) and Adamczak-Hoffmann-Jorgensen variance-scaling GBO bounds ||sum_{i=1}^n
    X_i||_{Psi_{alpha^*,L_n(alpha)}} <= 2e sqrt(6)(sum_{i=1}^n E[X_i^2])^{1/2} with alpha^* := min{alpha,
    1} (Theorems 3.2-3.3), yielding the high-dimensional maximum tail bound P(||1/n sum_{i=1}^n X_i||_infty
    >= 7 sqrt(Gamma_{n,q}(t + log q)/n) + C_alpha K_{n,q} (log(2n))^{1/alpha}(t + log q)^{1/alpha^*}/n)
    <= 3 exp(-t) (Theorem 3.4, Equation 3.1). Remark 3.2 (Equations 3.2-3.3) shows this strictly improves
    the Chernozhukov-Chetverikov-Kato maximal inequality (Lemma E.1 of Chernozhukov et al. 2017) by replacing
    (E[max_{i,j}|X_i(j)|^2])^{1/2} with K_{n,q}(log(2n))^{1/alpha}; Remark 3.3 (Equation 3.4) yields the
    sharp (n h^p)^{-1/2} deviation rate for linear kernel estimators; Proposition D.2 (Equation 3.5) proves
    the Holder-type product Orlicz inequality ||prod_{i=1}^k W_i||_{psi_beta} <= prod_{i=1}^k ||W_i||_{psi_{alpha_i}}
    with 1/beta = sum_{i=1}^k 1/alpha_i; and Appendix B (Theorem B.1, Propositions B.1-B.4) extends GBO
    tail bounds to suprema of unbounded empirical processes with sub-Weibull envelopes.
