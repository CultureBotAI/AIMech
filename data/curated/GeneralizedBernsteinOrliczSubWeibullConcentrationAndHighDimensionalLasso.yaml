id: AIMech:GeneralizedBernsteinOrliczSubWeibullConcentrationAndHighDimensionalLasso
name: Generalized Bernstein-Orlicz sub-Weibull concentration and high-dimensional misspecified Lasso
aliases:
- Generalized Bernstein-Orlicz (GBO) Norm and Sub-Weibull Concentration
- Sub-Weibull GBO Norm and High-Dimensional Covariance and Lasso Framework
- Marginal Sub-Weibull High-Dimensional Covariance Estimation and Misspecified Lasso
concept_kind: mathematical_method
definition: 'Generalized Bernstein-Orlicz sub-Weibull concentration and high-dimensional misspecified
  Lasso is a non-asymptotic heavy-tailed probability and high-dimensional statistical estimation methodology
  introduced by Kuchibhotla and Chakrabortty (2022, Information and Inference: A Journal of the IMA 11(4):1389-1456,
  arXiv:1804.02605v4, DOI:10.1093/imaiai/iaac012). It unifies sub-Gaussian (alpha = 2), sub-exponential
  (alpha = 1), and heavy-tailed Weibull-type (alpha > 0, including non-convex Orlicz regimes alpha < 1
  where moment-generating functions need not exist) random variables via the sub-Weibull(alpha) Orlicz
  quasi-norm ||X||_{psi_alpha} := inf{eta > 0 : E[psi_alpha(|X|/eta)] <= 1} with psi_alpha(x) = exp(x^alpha)
  - 1 (Definitions 2.1-2.2), and introduces the Generalized Bernstein-Orlicz (GBO) quasi-norm ||X||_{Psi_{alpha,L}}
  := inf{eta > 0 : E[Psi_{alpha,L}(|X|/eta)] <= 1} defined by its inverse function Psi_{alpha,L}^{-1}(t)
  := sqrt(log(1 + t)) + L(log(1 + t))^{1/alpha} for alpha > 0, L >= 0 (Definition 2.3, Equation 2.5).
  The GBO norm is equivalent up to factor 2 to the closed-form two-regime Orlicz quasi-norm ||X||_{phi_{alpha,L}}
  with phi_{alpha,L}(x) = exp(min{x^2, (x/L)^alpha}) - 1 (Proposition A.1), yields the sharp two-regime
  Gaussian-plus-Weibull tail inequality P(|X| >= ||X||_{Psi_{alpha,L}}{sqrt(t) + L t^{1/alpha}}) <= 2
  exp(-t) (Proposition A.3), satisfies Latala-type and Adamczak-Hoffmann-Jorgensen variance-scaling concentration
  bounds for sums of independent random variables (Theorems 3.1-3.3) and high-dimensional maxima improving
  Chernozhukov-Chetverikov-Kato (Theorem 3.4, Remark 3.2), obeys a Holder-type product Orlicz inequality
  ||prod_{i=1}^k W_i||_{psi_beta} <= prod_{i=1}^k ||W_i||_{psi_{alpha_i}} for 1/beta = sum_{i=1}^k 1/alpha_i
  (Proposition D.2), extends to suprema of unbounded empirical processes with sub-Weibull envelopes (Theorem
  B.1), and formally separates marginal sub-Weibull tails ||X||_{M,psi_alpha} := max_{1<=j<=q} ||X(j)||_{psi_alpha}
  from joint sub-Weibull tails ||X||_{J,psi_alpha} := sup_{||theta||_2=1} ||X^T theta||_{psi_alpha} (Definitions
  2.4-2.5) to establish non-asymptotic rates for elementwise covariance estimation (Theorems 4.1-4.2),
  k-sparse operator norm RIP_n(k) (Theorem 4.3), unified Restricted Strong Convexity (RSC) and free-sparsity
  s-optimized Restricted Eigenvalue RE(k) sample complexity (Theorem 4.4, Section 4.3.1), and hard-sparsity-free
  oracle inequalities for high-dimensional misspecified Lasso under sub-Weibull or polynomial-tailed errors
  (Theorems 4.5-4.6, Proposition E.1).'
identity_notes: Evaluated against all 442 pinned AIO records and 612 maintained curated concepts in AIMech.
  Distinct from AIMech:SimultaneousNormalEquationPostSelectionConfidenceRegions (Kuchibhotla et al. 2020,
  arXiv:1806.04119v1, DOI:10.1214/19-AOS1917), which constructs simultaneous normal-equation post-selection
  confidence regions R_hat_{n,M} and R_hat_{n,M}^dagger via a Gaussian multiplier bootstrap. Distinct
  from AIMech:UnifiedAssumptionLeanMovingTargetLinearRegressionAndScoreBootstrap (Kuchibhotla, Brown,
  & Buja 2018, arXiv:1809.10538v1), which studies a single low-dimensional least squares model (p = o(n^{1/5}))
  via multidimensional Berry-Esseen bounds and score bootstraps. Distinct from AIMech:NonAsymptoticHighDimensionalCentralLimitAndMultiplierBootstrapForMaximaOfSums
  (Chernozhukov, Chetverikov, & Kato 2013/2017), whose maximal inequality (Lemma E.1 of Chernozhukov et
  al. 2017) has a second-order term scaling with (E[max_{i,j}|X_i(j)|^2])^{1/2}, which Theorem 3.4 and
  Remark 3.2 here strictly improve to max_{i,j}||X_i(j)||_{psi_alpha} (log(2n))^{1/alpha}. Distinct from
  AIO:LassoRegression and AIO:L1Regularization, which represent L1-penalized regression broadly without
  the Generalized Bernstein-Orlicz quasi-norm, marginal-vs-joint sub-Weibull separation, free-s Restricted
  Eigenvalue optimization, or hard-sparsity-free misspecified Lasso oracle inequalities.
