claims:
- claim_id: generalized-bernstein-orlicz-norm-and-marginal-vs-joint-sub-weibull-separation
  kind: mechanism
  statement: 'Section 2 and Appendix A (pp. 4-8, 15, 30-32, 48-55, Definitions 2.1-2.5, Equation 2.5,
    Propositions A.1-A.7) define the sub-Weibull(alpha) Orlicz quasi-norm ||X||_{psi_alpha} := inf{eta
    > 0 : E[exp(|X|^alpha / eta^alpha)] <= 2} for alpha > 0 and the Generalized Bernstein-Orlicz (GBO)
    quasi-norm ||X||_{Psi_{alpha,L}} := inf{eta > 0 : E[Psi_{alpha,L}(|X|/eta)] <= 1} with inverse Psi_{alpha,L}^{-1}(t)
    := sqrt(log(1 + t)) + L(log(1 + t))^{1/alpha}, proving: (i) equivalence ||X||_{Psi_{alpha,L}} <= ||X||_{phi_{alpha,L}}
    <= 2||X||_{Psi_{alpha,L}} with the closed-form two-regime Orlicz function phi_{alpha,L}(x) = exp(min{x^2,
    (x/L)^alpha}) - 1 (Proposition A.1); (ii) the sharp two-regime tail bound P(|X| >= ||X||_{Psi_{alpha,L}}{sqrt(t)
    + L t^{1/alpha}}) <= 2 exp(-t) (Proposition A.3) and moment equivalence sup_{p>=1}(E|X|^p)^{1/p}/(sqrt(p)
    + L p^{1/alpha}) ~ ||X||_{Psi_{alpha,L}} (Proposition A.4); (iii) the quasi-norm triangle inequality
    ||X + Y||_{Psi_{alpha,L}} <= Q_alpha(||X||_{Psi_{alpha,L}} + ||Y||_{Psi_{alpha,L}}) with Q_alpha =
    1 for alpha >= 1 and Q_alpha = 2e(4/alpha)^{1/alpha} for alpha in (0, 1) (Proposition A.5) and finite/infinite
    maximal inequalities (Propositions A.6-A.7); and (iv) for random vectors X in R^q, strict separation
    between the marginal sub-Weibull norm ||X||_{M,psi_alpha} := max_{1<=j<=q} ||X(j)||_{psi_alpha} and
    the joint sub-Weibull norm ||X||_{J,psi_alpha} := sup_{||theta||_2=1} ||X^T theta||_{psi_alpha}, where
    under collinearity X(1) = ... = X(q), ||X||_{J,psi_alpha} = sqrt(q) ||X(1)||_{psi_alpha} diverges
    as sqrt(q) while ||X||_{M,psi_alpha} = ||X(1)||_{psi_alpha} remains dimension-free (Section 4, Equation
    4.1).'
