- target: AIO:DataDredgingBias
  relation: related_match
  rationale: 'Sequential kernelized independence testing by betting constructs a nonnegative test martingale
    K_t under H_0 whose Ville stopping rule tau = inf{t >= 1 : K_t >= 1/alpha} controls Type-I error under
    continuous monitoring and optional stopping, preventing false-positive inflation from sequential peeking
    (AIO:DataDredgingBias).'
- target: AIO:TimeSeriesAnalysis
  relation: related_match
  rationale: SKIT processes streaming paired observations sequentially across filtrations (F_t)_{t>=0},
    including non-stationary time-varying marginal distributions (X_t, Y_t) ~ P_X^{(t)} x P_Y^{(t)} and
    real-world financial/meteorological time-series dependence monitoring (Section 2 Theorem 3, Section
    5.2; AIO:TimeSeriesAnalysis).
limitations:
- Although caching tr(K^{(t)} L^{(t)}), K^{(t)} 1_{2t}, and L^{(t)} 1_{2t} reduces each step-t plug-in
  HSIC witness payoff evaluation from O(t^2) to O(t) (Appendix F.2, Equations 49–53), accumulating t steps
  still incurs O(t^2) total memory and time unless a sliding window, minibatching, or low-rank incomplete
  Cholesky approximation is used (Section 3, Appendix F.1).
- 'Under non-stationary time-varying streams Z_t ~ P_{XY}^{(t)}, SKIT''s anytime Type-I error guarantee
  for testing instantaneous independence H_0 : P_{XY}^{(t)} = P_X^{(t)} x P_Y^{(t)} requires that at most
  one marginal distribution shifts between consecutive observations 2t-1 and 2t (or that Assumption 2''s
  conditional exchangeability holds); if both marginals P_X^{(t)} and P_Y^{(t)} shift simultaneously at
  every odd/even step, the swap-based witness payoff can have nonzero conditional expectation under H_0
  (Appendix D, Example 3, where E[f_t | F_{t-1}] = 1/32).'
- For spectral COCO-SKIT and KCC-SKIT (Section 3, Theorem 4) and symmetry-based SKITs with unbounded kernels
  (Section 4, Theorem 5), nonasymptotic anytime Type-I error <= alpha is rigorously guaranteed, but formal
  power-one consistency and exponential wealth growth rate theorems analogous to Theorems 1–2 are established
  only for the bounded-kernel HSIC-SKIT plug-in witness (Section 3 Remark 3, Section 4).
- All 1,368 lines of Podkopaev, Blobaum, Kasiviswanathan, & Ramdas (2023, arXiv:2212.07383) were read.
  Constructed numerical checks in research/discovery/sequential-kernelized-independence-testing-by-betting-boundaries.py
  verify Section 2 & Appendix F.2 Example 2 log-growth rates (0.020136 for Kelly bet vs. -0.002447 for
  overshoot bet), exact agreement between O(t) cached norm updates and O(t^2) tensor-product norms (max
  diff 2e-15), direct HSIC-SKIT Type-I error 0.0 <= 0.05, power 1.0, and faster mean stopping sample size
  (95.43 vs. 180.0 for the 3-sample reduction to two-sample testing), Section 2 Theorem 3 & Appendix D
  Example 3 zero conditional payoff (0.0) under single-marginal drift vs. exact 1/32 (0.03125) bias under
  simultaneous marginal shifts and SKIT Type-I error 0.0 vs. batch permutation test Type-I error 1.0 under
  drifting marginals, Section 3 & Appendix F.1 Cholesky nuclear-norm upper bound (3.8895 <= 3.9260) and
  COCO-SKIT nonlinear power 1.0 (null Type-I error 0.0), and Section 4 Theorem 5 unbounded linear-kernel
  |W_t| = 635.81 > 1.0 vs. symmetry-based odd (power 1.0, Type-I 0.0), signed-rank (power 1.0, Type-I
  0.0), and predictive (power 0.9667, Type-I 0.0) SKITs.
