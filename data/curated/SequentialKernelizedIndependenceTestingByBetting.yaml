- claim_id: spectral-coco-and-kcc-generalized-eigenvalue-skit-and-cholesky-normalization
  kind: mechanism
  statement: 'For spectral kernel independence criteria including the Constrained Covariance (COCO) and
    Kernel Canonical Correlation (KCC), factorized predictable witnesses hat{g}_t in G and hat{h}_t in
    H are constructed from the leading generalized eigenvector (alpha, beta) of the centered Gram matrices
    tilde{K} = H K H and tilde{L} = H L H solving the generalized eigenproblem [0, (1/n) tilde{K} tilde{L};
    (1/n) tilde{L} tilde{K}, 0] [alpha; beta] = gamma [tilde{K} + kappa_1 I, 0; 0, tilde{L} + kappa_2
    I] [alpha; beta] (Equations 20 and 47), rescaled to enforce ||hat{g}_t||_G^2 = alpha^T tilde{K} alpha
    <= 1 and ||hat{h}_t||_H^2 = beta^T tilde{L} beta <= 1 (Equations 22–23, 48) so that the factorized
    payoff f_t(Z_{2t-1}, Z_{2t}) = (1/2)(hat{g}_t(X_{2t}) - hat{g}_t(X_{2t-1}))(hat{h}_t(Y_{2t}) - hat{h}_t(Y_{2t-1}))
    lies in [-1, 1] and satisfies E_{H_0}[f_t(Z_{2t-1}, Z_{2t}) | F_{t-1}] = 0, guaranteeing P_{H_0}(exists
    t >= 1 : K_t >= 1/alpha) <= alpha under ONS betting (Algorithm 3, Theorem 4, Appendix B.3, Appendix
    D Remark 6); for computational tractability, incomplete Cholesky factorization K approx G_1 G_1^T
    of rank M << 2t with nuclear-norm error ||K - G_1 G_1^T||_* <= delta bounds the witness norm via alpha_0^T
    H K H alpha_0 <= alpha_0^T H G_1 G_1^T H alpha_0 + delta ||H alpha_0||_2^2, preserving ||hat{g}_t||_G
    <= 1 in O(M^2 t) time (Appendix F.1, lines 1301–1334).'
  evidence:
  - source_id: podkopaev2023-skit-ar5iv
    locator: Section 3, lines 284–370, Equations 20–24, Algorithm 3, Theorem 4, Remark 3; Appendix B.3,
      lines 1107–1117; Appendix D, lines 1206–1236, Equations 47–48, Remark 6; Appendix F.1, lines 1301–1334
    relation: supports
- claim_id: symmetry-based-skit-payoffs-for-unbounded-kernels
  kind: mechanism
  statement: 'When the kernels k and l are unbounded (violating Assumption 1, e.g., linear kernels k(x,
    x'') = x x''), Proposition 2 proves that under H_0 (or Assumption 2) the unnormalized witness contrast
    W_t = <hat{g}_t, (phi(X_{2t}) - phi(X_{2t-1})) x (psi(Y_{2t}) - psi(Y_{2t-1}))>_{G x H} = hat{g}_t(X_{2t},
    Y_{2t}) + hat{g}_t(X_{2t-1}, Y_{2t-1}) - hat{g}_t(X_{2t}, Y_{2t-1}) - hat{g}_t(X_{2t-1}, Y_{2t}) (Equation
    25) is conditionally symmetric around zero given F_{t-1} (W_t | F_{t-1} =^d -W_t | F_{t-1}, Appendix
    B.4), enabling three bounded symmetry-based payoffs in [-1, 1] with E_{H_0}[f_t(W_t) | F_{t-1}] =
    0: (1) composition with any odd bounded function phi_odd : R -> [-1, 1] normalized by a predictable
    scale N_{t-1} such as f_t^odd(W_t) = tanh(W_t / N_{t-1}) (Equation 26), (2) the sequential signed-rank
    payoff f_t^rank(W_t) = sign(W_t) rk(|W_t|) / t where rk(|W_t|) = sum_{i=1}^t 1{|W_i| <= |W_t|} (Equation
    27), and (3) the composition-of-bets predictive payoff f_t^pred(W_t) = (2 p_t(|W_t|) - 1)_+ (1 - 2
    ell_t(W_t)) driven by an online sign-prediction probability p_t(|W_t|) and 0-1 loss ell_t(W_t) (Equation
    28), each yielding an anytime-valid SKIT with P_{H_0}(exists t >= 1 : K_t >= 1/alpha) <= alpha (Theorem
    5, Algorithm 4).'
  evidence:
  - source_id: podkopaev2023-skit-ar5iv
    locator: Section 4, lines 371–460, Equations 25–28, Proposition 2, Remark 4, Theorem 5, Algorithm
      4; Appendix B.4, lines 1118–1168
    relation: supports
