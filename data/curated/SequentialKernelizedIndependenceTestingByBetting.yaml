- claim_id: time-varying-instantaneous-independence-validity-and-simultaneous-shift-counterexample
  kind: mechanism
  statement: 'Under non-stationary time-varying streams Z_t = (X_t, Y_t) ~ P_{XY}^{(t)} testing the instantaneous
    independence null H_0 : P_{XY}^{(t)} = P_X^{(t)} x P_Y^{(t)} for all t >= 1 against H_1 : exists t
    >= 1 with P_{XY}^{(t)} != P_X^{(t)} x P_Y^{(t)} (Equations 2–3), where batch permutation tests fail
    even when only X_t drifts over time (Example 1), HSIC-SKIT preserves nonasymptotic Type-I error P_{H_0}(exists
    t >= 1 : K_t >= 1/alpha) <= alpha whenever each consecutive pair (Z_{2t-1}, Z_{2t}) satisfies conditional
    exchangeability of either (X_{2t-1}, X_{2t}) or (Y_{2t-1}, Y_{2t}) given F_{t-1} and conditional cross-independence
    X_{2t-1} _||_ Y_{2t} | F_{t-1}, X_{2t} _||_ Y_{2t-1} | F_{t-1} (Assumption 2, Theorem 3, Appendix
    B.2.2 Equations 45–46, holding in particular whenever at most one marginal distribution changes between
    2t-1 and 2t as in Equations 18–19); conversely, Appendix D Example 3 proves that forbidding simultaneous
    shifts in both marginals is necessary: if X_{2t-1}, Y_{2t-1} ~ Ber(1/2) independently and X_{2t},
    Y_{2t} ~ (1/2) Ber(1/2) independently under linear kernels with fixed witness g(x, y) = x y, then
    E[f_t(Z_{2t-1}, Z_{2t}) | F_{t-1}] = (1/2)(1/4 - 1/2)(1/4 - 1/2) = 1/32 != 0 despite instantaneous
    independence at both 2t-1 and 2t.'
