claims:
- claim_id: hsic-swap-payoff-betting-martingale-linear-time-norm-and-ons-growth-rate
  kind: mechanism
  statement: 'For characteristic reproducing kernel Hilbert spaces G on X (kernel k, feature map phi)
    and H on Y (kernel l, feature map psi) satisfying sup_x k(x,x) <= 1 and sup_y l(y,y) <= 1 (Assumption
    1), HSIC-SKIT pairs consecutive observations Z_{2t-1} = (X_{2t-1}, Y_{2t-1}) and Z_{2t} = (X_{2t},
    Y_{2t}) with coordinate-swapped pseudo-samples tilde{Z}_{2t-1} = (X_{2t-1}, Y_{2t}) and tilde{Z}_{2t}
    = (X_{2t}, Y_{2t-1}) to form the F_{t-1}-predictable normalized witness payoff f_t(Z_{2t-1}, Z_{2t})
    = (1/2) <hat{g}_t, (phi(X_{2t}) - phi(X_{2t-1})) x (psi(Y_{2t}) - psi(Y_{2t-1}))>_{G x H} in [-1,
    1] where hat{g}_t = (hat{mu}_{XY} - hat{mu}_X x hat{mu}_Y) / ||hat{mu}_{XY} - hat{mu}_X x hat{mu}_Y||_{G
    x H} (Equations 9–14, Proposition 1), whose denominator norm ||hat{mu}_{XY}^{(t)} - hat{mu}_X^{(t)}
    x hat{mu}_Y^{(t)}||_{G x H} = sqrt((1/(2t)^2) tr(K^{(t)} L^{(t)}) - (2/(2t)^3) 1_{2t}^T K^{(t)} L^{(t)}
    1_{2t} + (1/(2t)^4)(1_{2t}^T K^{(t)} 1_{2t})(1_{2t}^T L^{(t)} 1_{2t})) is updated in O(t) time per
    step by caching tr(K^{(t)} L^{(t)}), K^{(t)} 1_{2t}, and L^{(t)} 1_{2t} (Appendix F.2, Equations 49–53);
    coupling f_t with the Online Newton Step (ONS) betting strategy lambda_t in [-1/2, 1/2] (Algorithm
    2) yields a test martingale K_t = prod_{i=1}^t (1 + lambda_i f_i(Z_{2i-1}, Z_{2i})) satisfying P_{H_0}(exists
    t >= 1 : K_t >= 1/alpha) <= alpha, P_{H_1}(tau < infty) = 1 (Theorem 1), and variance-adaptive asymptotic
    log-wealth growth rate liminf_{t->infty} (log K_t)/t >= (E[f*]/4)(min(E[f*] / E[(f*)^2], 1)) >= HSIC(P_{XY};
    G, H) / 4 (Theorem 2, Appendix B.2 Lemmas 8–11), outperforming the 3-observations-per-step reduction
    to two-sample testing (Section 1(i), Remark 1, Appendix A.2 Figure 7).'
