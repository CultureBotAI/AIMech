id: AIMech:SequentialKernelizedIndependenceTestingByBetting
name: Sequential kernelized independence testing by betting
aliases:
- SKIT
- Sequential Hilbert-Schmidt Independence Criterion Test by Betting
- HSIC-SKIT
- COCO-SKIT and KCC-SKIT
- Symmetry-Based Sequential Kernel Independence Test
concept_kind: mathematical_method
definition: 'A sequential nonparametric independence hypothesis testing framework (Podkopaev, Blobaum,
  Kasiviswanathan, & Ramdas 2023, ICML / PMLR 202:27957-27993, arXiv:2212.07383) that tests whether streaming
  paired random variables Z_t = (X_t, Y_t) on general spaces X x Y are statistically independent (H_0
  : P_{XY} = P_X x P_Y against H_1 : P_{XY} != P_X x P_Y) under arbitrary optional stopping and time-varying
  marginal distributions by pairing consecutive draws (Z_{2t-1}, Z_{2t}) with their coordinate-swapped
  pseudo-observations tilde{Z}_{2t-1} = (X_{2t-1}, Y_{2t}), tilde{Z}_{2t} = (X_{2t}, Y_{2t-1}) to evaluate
  predictable witness functions from reproducing kernel Hilbert spaces G x H — instantiated via the Hilbert-Schmidt
  Independence Criterion (HSIC), the Constrained Covariance (COCO), or the Kernel Canonical Correlation
  (KCC), or via symmetry-preserving odd, sequential signed-rank, and predictive betting payoffs for unbounded
  kernels — and updating a wealth martingale K_t = prod_{i=1}^t (1 + lambda_i f_i(Z_{2i-1}, Z_{2i})) via
  the Online Newton Step (ONS) strategy so that stopping at tau = inf{t >= 1 : K_t >= 1/alpha} controls
  nonasymptotic anytime Type-I error P_{H_0}(tau < infty) <= alpha and achieves power-one consistency
  with variance-adaptive exponential log-wealth growth.'
identity_notes: 'No normalized identity match for sequential kernelized independence testing by betting
  across all 442 pinned AIO records and 580 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 185 artifacts
  where Podkopaev, Blobaum, Kasiviswanathan, & Ramdas (2023, ICML / PMLR 202:27957-27993, arXiv:2212.07383)
  was queued as a pending frontier lead. Distinct from AIMech:NonparametricTwoSampleTestingByBetting (Shekhar
  & Ramdas 2023, IEEE TIT 70(2):1178-1203, arXiv:2112.09162), which tests two-sample equality H_0 : P_X
  = P_Y and touches on independence only as an empirical risk minimization operator-invariance specialization
  or inefficient 3-sample reduction, whereas Podkopaev et al. (2023) develop the dedicated 2-sample-per-step
  coordinate-swap HSIC tensor-product witness payoff with O(t) cached norm updates (Appendix F.2), generalized-eigenvalue
  spectral COCO and KCC sequential tests with incomplete Cholesky nuclear-norm scaling (Section 3, Appendix
  F.1), time-varying instantaneous independence testing under single-marginal drift and simultaneous-shift
  necessity counterexamples (Section 2, Theorem 3, Appendix D Example 3), and symmetry-based odd, sequential
  signed-rank, and predictive betting payoffs for unbounded kernels (Section 4, Theorem 5).'
