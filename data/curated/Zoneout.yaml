name: Zoneout
definition: A recurrent-network regularization procedure that randomly preserves selected state components
  at their previous values instead of applying their proposed updates during training.
concept_kind: algorithm
identity_notes: Zoneout is a stochastic transition-modification procedure, not a particular RNN architecture
  or trained sequence model. Its identity branch retains previous activations; it differs from setting
  recurrent states to zero, dropping only input-gate contributions, fixed periodic update schedules and
  always skipping an entire recurrent layer. LSTM cells and hidden states can have separate preservation
  probabilities and masks. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 276 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 5 and 5 lines respectively. Every text hit was a prior
  candidate lead or a closely related variant lead. Nine exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and three native neighboring mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.
limitations:
- The generic operator formula in Section3.1 uses d for selecting the normal transition, whereas the LSTM
  formulas in Section3.2 use d for selecting preservation. The record defines its own preservation convention
  explicitly; those source masks are complements, not interchangeable symbols.
- The printed LSTM hidden-state proposal uses the unzoned cell-update expression inside tanh. An implementation
  that instead uses the already-mixed cell state can differ when cell and hidden selectors differ. This
  general method record does not certify all LSTM code as equivalent or invent an uninspected implementation
  rule.
- Replacing selectors by expectations gives a deterministic local mixture; nonlinear recurrence means
  it is not generally the exact ensemble-averaged state or output over complete stochastic trajectories.
  Preserved components pass their old values directly, but this does not guarantee that the entire network
  avoids vanishing/exploding gradients or processes every input in every component.
- Very high preservation can suppress adaptation to new inputs. State/cell probabilities, sharing and
  other regularizers matter; the source’s task-specific results and conjectures do not establish universal
  improvement. No exact trained-model replication, parameter sweep or author-code execution is asserted.
