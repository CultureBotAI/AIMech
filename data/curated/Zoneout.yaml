claims:
- claim_id: method
  kind: mechanism
  statement: At a recurrent timestep, form the model’s proposed next-state values and use a Bernoulli
    selector for each targeted component to choose between that proposal and its previous value. Defining
    z as the preservation probability, the update has the form mask times previous state plus one-minus-mask
    times proposed state, with a mask value of1 selecting preservation. This introduces direct identity
    paths through time for the preserved components. The source’s LSTM account usually uses separate selectors
    for memory cells and hidden states and also studies shared selectors. At testing, replace the random
    selector by its expectation, producing a weighted combination of previous and proposed values at each
    step. Selection probabilities, targeted state components and the underlying recurrent transition are
    configured choices; the procedure itself does not require a new learned gate.
