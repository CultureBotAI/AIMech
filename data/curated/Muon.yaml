    264–265
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The inspected implementation forms a momentum update, optionally uses a Nesterov combination,
    applies iterative matrix orthogonalization, and scales the resulting update for the parameter shape
    while applying decoupled weight decay.
  evidence:
  - source_id: pytorch-docs
    locator: Muon.__doc__, algorithm and orthogonalization lines 207–260; supported-parameter note lines
      264–265
    relation: supports
