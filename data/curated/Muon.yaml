id: AIMech:Muon
name: Muon optimizer
definition: A neural-network optimization method that approximately orthogonalizes momentum-based matrix
  updates using Newton–Schulz iterations.
concept_kind: algorithm
identity_notes: Muon is a matrix-update optimizer distinct from coordinatewise Adam-family scaling. The
  name here denotes the optimization algorithm, not unrelated uses of the word muon.
