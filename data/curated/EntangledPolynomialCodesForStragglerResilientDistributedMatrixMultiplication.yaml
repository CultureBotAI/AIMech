claims:
- claim_id: epc-degree-alignment-recovery-threshold
  kind: mechanism
  statement: By choosing exponent strides (alpha, beta, theta) = (1, p, p m) in Definition 4 (Eq. 28), each worker i evaluates a polynomial h(x_i) = A_tilde_i^T B_tilde_i of degree p m n + p - 2 in which each subblock C_{k,k'} = sum_{j=0}^{p-1} A_{j,k}^T B_{j,k'} appears as the exact coefficient of x_i^{p - 1 + k p + k' p m}, achieving recovery threshold K_{entangled-poly} = p m n + p - 1 from any subset of p m n + p - 1 non-straggling workers via polynomial interpolation.
  evidence:
  - source_id: r542-primary-pdf
    locator: Section III Theorem 1 p. 3 Eq. 10; Section IV-B p. 7 Eq. 28-29
    relation: supports
- claim_id: epc-linear-converse-and-bilinear-complexity-bound
  kind: scope
  statement: Entangled Polynomial Codes achieve the optimal linear recovery threshold K*_{linear} = p m n + p - 1 = p m + p n - 1 whenever m = 1 or n = 1 (Theorem 2, Lemma 1, Eq. 12 and 30), and for arbitrary (p, m, n) an improved bilinear-complexity construction using a rank-R tensor decomposition of m-by-p by p-by-n matrix multiplication achieves recovery threshold 2 R - 1, characterizing K*_{linear} within a factor of 2 as R(p, m, n) <= K*_{linear} <= 2 R(p, m, n) - 1 (Theorem 3, Eq. 15).
  evidence:
  - source_id: r542-primary-pdf
    locator: Section III Theorems 2-3 p. 4-5 Eq. 12-15; Section V Lemma 1 p. 8 Eq. 30; Section VI p. 9-10 Eq. 40-48
    relation: supports
- claim_id: epc-real-field-vandermonde-conditioning-limitation
  kind: limitation
  statement: When implemented over the field of real or complex numbers rather than a finite field, decoding Entangled Polynomial Codes requires interpolating a degree-(p m n + p - 2) polynomial (or degree-(2 R - 2) polynomial in the bilinear-complexity variant), which can suffer from numerical ill-conditioning and floating-point precision loss as p m n grows.
  evidence:
  - source_id: r542-primary-pdf
    locator: Section VII Concluding Remarks p. 11
    relation: supports
