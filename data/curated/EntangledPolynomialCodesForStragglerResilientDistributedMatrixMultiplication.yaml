id: AIMech:EntangledPolynomialCodesForStragglerResilientDistributedMatrixMultiplication
name: Entangled Polynomial Codes for Straggler-Resilient Distributed Matrix Multiplication
concept_kind: algorithm
review_status: DRAFT
definition: A straggler-resilient linear coded computing method for distributed matrix multiplication C = A^T B across N worker nodes that partitions A in F^{s x r} into p x m blocks A_{j,k} and B in F^{s x t} into p x n blocks B_{j',k'} (allowing each worker to store a 1/(pm) fraction of A and a 1/(pn) fraction of B) and encodes worker i's stored submatrices at distinct evaluation point x_i in F as A_tilde_i = sum_{j=0}^{p-1} sum_{k=0}^{m-1} A_{j,k} x_i^{j + k p} and B_tilde_i = sum_{j'=0}^{p-1} sum_{k'=0}^{n-1} B_{j',k'} x_i^{(p - 1 - j') + k' p m}, so that each desired inner-dimension sum C_{k,k'} = sum_{j=0}^{p-1} A_{j,k}^T B_{j,k'} aligns onto the unique degree-(p - 1 + k p + k' p m) coefficient of the degree-(p m n + p - 2) worker product polynomial h(x_i) = A_tilde_i^T B_tilde_i and can be recovered from any K_{entangled-poly} = p m n + p - 1 non-straggling workers.
identity_notes: 'Distinct from Polynomial Codes (AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication, which restrict p = 1 and partition input matrices only along their outer dimensions) and from MatDot and PolyDot Codes (AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication, where PolyDot achieves recovery threshold m^2 (2p - 1) for m = n because unaligned inner-dimension cross-terms double the polynomial degree in p): Entangled Polynomial Codes (Yu, Maddah-Ali, & Avestimehr, ISIT 2018 / IEEE TIT 2020) assign exponent strides (alpha, beta, theta) = (1, p, p m) with reversed inner-dimension powers x_i^j and x_i^{p-1-j''} to align all p summands of each C_{k,k''} onto x_i^{p-1 + k p + k'' p m}, reducing the recovery threshold by a factor of 2 to p m n + p - 1 and further to 2 R(p, m, n) - 1 via bilinear-complexity tensor decompositions.'
aliases:
- Entangled Polynomial Code
- Entangled Polynomial Codes
- Bilinear-Complexity Entangled Polynomial Coding
