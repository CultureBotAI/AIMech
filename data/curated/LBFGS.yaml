id: AIMech:LBFGS
name: Limited-memory BFGS
definition: A limited-memory quasi-Newton optimization method using a bounded history of parameter and
  gradient differences to compute approximate inverse-Hessian search directions.
concept_kind: algorithm
identity_notes: L-BFGS is an optimization algorithm, not a neural architecture; bounded curvature history
  distinguishes it from full-memory BFGS.
definition_evidence:
- source_id: pytorch-docs
  locator: LBFGS class documentation lines 183–220 and step curvature-history/two-loop update lines 360–408
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The implementation retains a bounded set of curvature pairs and applies a two-loop recursion
    to obtain a direction from the gradient without storing a dense inverse Hessian.
  evidence:
  - source_id: pytorch-docs
    locator: LBFGS class documentation lines 183–220 and step curvature-history/two-loop update lines
