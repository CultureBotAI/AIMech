claims:
- claim_id: frozen-mass-update
  kind: mechanism
  statement: For a case with cached q and plausible set S, freeze every q_z outside S and the total Q=sum_(z
    in S)q_z. At the current theta compute r_z=p(z|x,theta)/sum_(u in S)p(u|x,theta) within S and set
    q_z=Q*r_z there. The restricted normalizer must be positive and finite. The M-step uses the full expected
    complete log likelihood, including outside contributions; cached sufficient statistics can avoid recomputing
    unchanged terms.
  evidence:
  - source_id: neal-source
    locator: Section5 Eq13-15 and implementation discussion, PDF11-12
    relation: supports
- claim_id: refresh-and-objectives
  kind: scope
  statement: Occasionally recompute the full posterior to refresh outside probabilities, plausible sets
    and their total mass. The source suggests top-count or cumulative-mass sets as heuristics, without
    one universal optimal threshold or refresh frequency. Exact restricted E and admissible M updates
    make the entropy-augmented F nondecreasing, but the source explicitly permits observed likelihood
    to decrease. Zeroing outside mass and renormalizing retained states to one implements a different
    approximation.
  evidence:
  - source_id: neal-source
    locator: Section5, PDF11-12, particularly discussion after Eq15
    relation: supports
- claim_id: conditional-efficiency
  kind: limitation
  statement: Savings require a posterior concentrated on a manageable plausible set and a model for which
    unchanged contributions can be reused. Full refreshes and model-specific M-steps can dominate cost.
    The source’s stability wording is not a general proof of bounded iterates, parameter convergence or
    global optimization; admissible support, repeated refreshes and optimization conditions still need
    analysis.
  evidence:
  - source_id: neal-source
    locator: Section5, PDF11-12; Section2 Theorem2 and coordinate-optimization qualifications, PDF5-6
    relation: supports
limitations:
- An outside probability may remain nonzero. The saved finite example preserves outside mass and increases
  F while decreasing likelihood from an admissible cached state; reachability from a particular full-posterior
  initialization is not claimed.
- The finite-state exposition does not automatically establish an arbitrary continuous-latent or dependent-factor
  sparse-update algorithm. A changing set requires explicit full-distribution bookkeeping.
- This construction is not a guarantee of exact posterior recovery, a fixed truncation tolerance, universal
  acceleration or neural-network sparsity.
- No author software or historical empirical study was reproduced. Finite curator calculations illustrate
  stated objective and schedule boundaries; they are not a general convergence proof or an empirical speed
  comparison.
