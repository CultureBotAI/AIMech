name: Product of hidden Markov models
definition: A sequence-model family that multiplies the marginal probabilities assigned to a complete
  observation sequence by several hidden Markov models and normalizes the product over sequences of the
  same length.
concept_kind: model_family
identity_notes: PoHMM is Brown and Hinton’s undirected product construction with one hidden chain per
  expert. It is not a mixture that selects one HMM, an ordinary single-chain HMM, or a directed factorial
  HMM whose multiple latent chains jointly generate locally normalized emissions. Taylor and Hinton’s
  later AIS study retains this model identity and supplies an evaluation procedure, not a new synonymous
  architecture. The model is not restricted to linguistic sequences. All 442 pinned AIO labels/scoped
  synonyms and 373 preceding native IDs/names/aliases were compared. The sole normalized hit is Product
  of experts as a related synonym of FactorizedLLM; its language-specific definition and parent distinguish
  it from the generic candidate. Both full-checkout fixed-string searches included ignored and hidden
  files and returned 59 lines each. All 29 unique matched contents were read; other hits concern citations,
  training components, prior boundary discussions or pending leads. All 88 semantic label/synonym hits,
  20 exact fully annotated AIO nodes with outgoing edges, their generated records and four complete native
  neighbors were inspected or verified unchanged after previous full reading. Absence is bounded to this
  pin and inspected semantic neighborhood.
limitations:
- The partition function depends on model parameters and sequence length. Separate forward–backward computations
  evaluate the unnormalized product and complete-data hidden posteriors; they do not by themselves give
  the product’s global normalizer or exact likelihood. Small finite models can be enumerated, but this
  does not establish scalable tractability.
- When observations are missing or future observations are integrated out, the experts can become dependent.
  Exact separate posterior inference given a complete sequence is not a claim of equally simple causal
  prediction from a prefix.
- CD learning is approximate, and the customary short-chain update is not generally an exact likelihood
  or contrastive-objective gradient. The Brown paper’s initial pseudocode writes probability derivatives
  where its final update uses log derivatives; this record follows the log-score update supported by the
  later explicit formulation.
- Brown Equation (3) places a derivative outside a posterior expectation. The score identity used here
  means the expectation of the log-joint derivative at the current posterior, without differentiating
  through that posterior. The shared deterministic emission-feature extension is optional, not an extra
  required stochastic latent layer.
- Taylor Section 3.3 estimates normalization with an AIS path that tempers emission potentials inside
  hidden-path sums. This is generally different from simply raising whole HMM marginal likelihoods to
  fractional powers. Approximate normalizer estimates, and their logarithms, are not exact log likelihoods
  or a universal reliability guarantee.
- The papers’ language, rainfall and dance examples do not establish universal superiority. No author
  code, training experiment or AIS implementation was reproduced.
