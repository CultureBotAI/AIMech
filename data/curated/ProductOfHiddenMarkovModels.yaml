claims:
- claim_id: method
  kind: mechanism
  statement: For fixed length T, let p_m(v_1:T) sum each expert HMM’s joint probability over its hidden
    paths. Define p(v_1:T)=product_m p_m(v_1:T)/Z_T. Given the entire observed sequence, infer each expert’s
    hidden path posterior separately with forward–backward. A blocked Gibbs transition samples one path
    from each such posterior, then independently at each time samples an observation from the normalized
    product of the emissions selected by those paths. For CD-k learning, contrast each expert’s log-marginal
    score on the data and on the k-step reconstruction, treating reconstructed observations as fixed in
    the customary update. Each score is the posterior expectation of the derivative of the HMM log joint,
    with that posterior held fixed for this identity; it is not the total derivative through the posterior
    of an expected log joint. Global normalization over sequences distinguishes the model from independently
    normalizing a product emission at every time while retaining independent hidden-chain priors.
