aio_no_match:
  search_scope: 'Freshly assessed all 721 native and 442 pinned AIO records (1,163 total): IDs, names,
    aliases, scoped synonyms and complete definitions. Four whole-checkout searches used rg --no-ignore
    --hidden with exact IDs/full names and meaningful compounds; all 4,196 occurrences were reconciled
    and all 88 decoded matching contexts read. Bare DIRECT was not treated as an exhaustive identity probe;
    ordinary direct-algorithm phrases were false positives. All 902 main and 393 nested frontier labels/statuses,
    all matching fields and 29 relevant full objects were read. Nine exact examined AIO CLASS nodes (ActiveLearning,
    MachineLearningTask, TrainingStrategy, ReinforcementLearning, EvolutionaryLLM, MathematicalFunction,
    Model, Network and MarkovChain), including metadata/synonyms and every incident edge, support no suitable
    mapping for this deterministic rectangle-partition optimizer. TransferLearning was also inspected
    for the cohort. This is a scoped pinned-snapshot no-match assessment, not absence from all ontologies.'
  rationale: No inspected pinned AIO target provides a sufficiently specific mapping for the general DIRECT
    optimizer. Its machine-learning uses do not make it a learning task, training preprocessing, network
    or model. This is an explicit bounded no-match assessment, not a claim that no suitable concept exists
    in another ontology.
  examined_targets:
  - target: AIO:ActiveLearning
    rejection_reason: The general deterministic optimizer does not require labeling examples or selecting
      queries by learned predictive uncertainty; objective evaluation alone does not establish this learning-task
      mapping.
  - target: AIO:MachineLearningTask
    rejection_reason: The algorithm can optimize an arbitrary box-constrained objective without building
      a method that learns from data; an AI application does not identify its full scope with this task.
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition concerns preprocessing and model training. DIRECT is a reusable
      optimizer; its use inside hyperparameter selection is an application rather than a necessary training
      mechanism.
  - target: AIO:ReinforcementLearning
    rejection_reason: Balancing local and global exploration does not make the general search procedure
      a policy/environment learning task.
  - target: AIO:EvolutionaryLLM
    rejection_reason: This target is a large language model and its broad related synonyms do not denote
      the deterministic rectangle algorithm.
  - target: AIO:MathematicalFunction
    rejection_reason: The objective and selection score are mathematical functions, but the proposed concept
      is the iterative partitioning algorithm, not a function node.
  - target: AIO:Model
    rejection_reason: A partition and stored evaluations do not make this search algorithm identical to
      the pinned abstract model class.
  - target: AIO:Network
    rejection_reason: The optional search-tree representation is bookkeeping, not a defining network architecture.
  - target: AIO:MarkovChain
    rejection_reason: A generic state representation would be too broad; DIRECT does not define a stochastic
      transition process or target-invariant sampler.
