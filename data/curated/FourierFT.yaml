claims:
- claim_id: fourierft-sparse-spectral-to-spatial-idft-parameterization
  kind: mechanism
  statement: FourierFT defines a layer's weight update as Delta_W = alpha * Re(F^{-1}(ToMatrix(c))), where c in R^n is a trainable spectral vector scattered onto n pre-selected frequency coordinates (u_k, v_k) of a d_1 x d_2 spectral grid and F^{-1} is the 2D inverse discrete Fourier transform, decoupling the trainable parameter count n from the layer dimensions d_1 and d_2.
  evidence:
  - source_id: r663-primary-pdf
    locator: Section 3.1 (Forward and Backward Pass of FourierFT), pp. 3-4, Equations (3)-(5)
    relation: supports
- claim_id: fourierft-direct-basis-evaluation-and-frequency-bias-sampling
  kind: mechanism
  statement: Rather than executing a full O(d_1 d_2 log(d_1 d_2)) 2D FFT when n is small, FourierFT evaluates the inverse transform directly over the n active frequencies using precomputed complex exponential basis matrices, and optionally samples frequency coordinates with a radial Gaussian bias toward low- or mid-frequency bands.
  evidence:
  - source_id: r663-primary-pdf
    locator: Section 3.2 (Entry Sampling Strategies) & Algorithm 1, p. 4
    relation: supports
- claim_id: fourierft-application-extreme-compression-nlp-and-vision-peft
  kind: application
  statement: Across GLUE natural language understanding, instruction tuning on LLaMA-2, and ViT image classification benchmarks, FourierFT matches or exceeds LoRA accuracy while using up to an order of magnitude fewer trainable parameters (for example, n = 1000 spectral coefficients per layer versus rank-8 LoRA on RoBERTa-large).
  evidence:
  - source_id: r663-primary-pdf
    locator: Section 4 (Experiments), Tables 1-4, pp. 5-8
    relation: supports
- claim_id: fourierft-limitation-dense-delta-w-materialization-during-training
  kind: limitation
  statement: Because the inverse discrete Fourier transform produces a dense spatial matrix Delta_W in R^{d_1 x d_2} rather than a low-rank factored intermediate representation, FourierFT must either materialize Delta_W in memory during each forward/backward pass or compute O(n d_1 d_2) basis projections, incurring higher per-layer FLOPs than rank-1 LoRA when n is large.
  evidence:
  - source_id: r663-primary-pdf
    locator: Section 3.1 & Appendix (Complexity Analysis and Memory Discussion), pp. 4, 13-14
    relation: supports
