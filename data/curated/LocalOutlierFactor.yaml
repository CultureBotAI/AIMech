aio_mappings:
- target: AIO:UnsupervisedLearning
  relation: related_match
  rationale: LOF infers neighborhood-relative outlier scores from unlabeled observations, giving a related
    algorithm-to-task association with AIO:UnsupervisedLearning. The target is a MachineLearningTask;
    this link is neither exact equivalence nor a subclass assertion. The core score does not itself assign
    two classes, so BinaryClassification and its supervised ancestry are not selected. Clustering and
    OPTICS/DBSCAN organize clusters or reachability orderings, whereas LOF does not require a partition.
    All three AIO KnearestNeighbor classes specify label voting or response averaging, not local reachability
    ratios; RegressionAnalysis requires dependent/independent-variable relationships. DimensionalityReduction,
    DataPreparation and SelectionAndSamplingBias do not identify this scoring procedure. Native neighbor-ratio
    and distance-norm domain descriptions, PDD, supervised metric learning and density clustering have
    different outputs or neighborhood rules.
limitations:
- Reference population, feature scaling, dissimilarity and neighborhood size determine the meaning of
  local abnormality. A high score alone does not establish error, fraud, disease or any other domain conclusion.
- Definitions 3-7 explicitly exclude self. Printed theorem endpoints allowing k=n and Theorem 2's inclusion
  of p in a neighborhood partition do not override those core definitions; this record uses 1<=k<=n-1.
  The informal k=2 simplification is qualified by a counterexample.
- The mathematical core has no universal cutoff, duplicate regularizer or required novelty-query policy.
  The inspected library conventions are tied to exact source bytes and are not claimed for every version
  or backend.
- All twelve primary PDF pages were visually read, including equations, figures, the sports table and
  references. The complete pinned _lof.py and relevant neighbor-search methods were read; exact rational
  boundary calculations were executed. No trained model, library runtime or historical benchmark was executed.
