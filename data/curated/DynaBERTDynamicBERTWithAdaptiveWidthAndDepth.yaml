claims:
- claim_id: r806-claim-parallel-head-ffn-slicing-and-taylor-rewiring
  kind: mechanism
  statement: DynaBERT decomposes each Transformer layer into N_H parallel attention heads MHAttn(X) = sum_{h=1}^{N_H} Attn^h(X) (Eq. 1) and d_ff parallel intermediate FFN neurons FFN(A) = sum_{i=1}^{d_ff} GeLU(A*W^1_{:,i} + b^1_i)*W^2_{i,:} + b^2 (Eq. 2), ranks heads and neurons by first-order Taylor importance I_h approx |(dL/dh)*h| and I_w approx |sum_{i=1}^{2d} (dL/dw_i)*w_i| on the development set, and rewires each layer in descending importance so any width multiplier m_w retains the top floor(m_w * N_H) heads and floor(m_w * d_ff) neurons without altering the residual embedding dimension d.
  evidence:
  - source_id: r806-primary-pdf
    locator: Section 2.1 (Training DynaBERT_W with Adaptive Width) & Section 2.1.1 (Network Rewiring), Equations 1-2 & Figure 2, Pages 3-4
    relation: supports
  - source_id: r806-primary-pdf
    locator: taylor_head_importance and prefix importance dominance verification in main()
    relation: supports
- claim_id: r806-claim-two-stage-teacher-assistant-distillation-and-layer-matching
  kind: mechanism
  statement: DynaBERT first trains a width-adaptive teacher assistant DynaBERT_W at full depth (m_d = 1) using L = lambda_1 * l_pred(y^{(m_w)}, y) + lambda_2 * (l_emb(E^{(m_w)}, E) + l_hidn(H^{(m_w)}, H)) (Eq. 3), and then distills DynaBERT_W into joint width-and-depth sub-networks (m_w, m_d) via Eq. 4, where for m_d < 1 student layers at depth d satisfying mod(d, 1/(1 - m_d)) == 0 are dropped and the kept student layers L_S are matched via MSE against teacher layers L_T satisfying mod(d + 1, 1/(1 - m_d)) != 0 (preserving the final teacher layer L).
  evidence:
  - source_id: r806-primary-pdf
    locator: Section 2.1.2 (Eq. 3), Section 2.2 (Eq. 4), and Appendix A (Layer Pruning Strategy and Hidden States Matching), Pages 4-5 & 13
    relation: supports
  - source_id: r806-primary-pdf
    locator: student_dropped_layers and teacher_matched_layers verification for m_d=0.75 and m_d=0.5 in main()
    relation: supports
- claim_id: r806-claim-glue-and-squad-multi-configuration-efficiency
  kind: application
  statement: Across 4 x 3 = 12 sub-network configurations (m_w in {1.0, 0.75, 0.5, 0.25}, m_d in {1.0, 0.75, 0.5}) on GLUE and SQuAD v1.1, DynaBERT and DynaRoBERTa match or exceed BERT_BASE and RoBERTa_BASE at full size (e.g., 89.7 vs. 88.7 SQuAD v1.1 dev F1 and 88.8 F1 at 0.5x depth) while consistently outperforming DistilBERT, TinyBERT, and LayerDrop under equal parameter, FLOPs, GPU latency, and Kirin 810 ARM CPU latency budgets.
  evidence:
  - source_id: r806-primary-pdf
    locator: Section 3.1-3.3, Tables 1-5 & Figures 3-4, Pages 5-8
    relation: supports
- claim_id: r806-claim-fixed-residual-embedding-dimension-limitation
  kind: limitation
  statement: Because residual skip connections link the embedding dimension d across all Transformer layers, standard task-specific DynaBERT adapts only the number of attention heads N_H and intermediate FFN neurons d_ff while keeping the embedding and residual hidden state dimension d fixed.
  evidence:
  - source_id: r806-primary-pdf
    locator: Section 2.1 (paragraph following Equation 2), Page 3
    relation: supports
