id: AIMech:DynaBERTDynamicBERTWithAdaptiveWidthAndDepth
name: 'DynaBERT: Dynamic BERT with Adaptive Width and Depth'
concept_kind: architecture
review_status: DRAFT
definition: A dynamic Transformer architecture and two-stage distillation training method that adapts a task-specific BERT or RoBERTa model across both width multipliers m_w (retaining the leftmost floor(m_w * N_H) attention heads and floor(m_w * d_ff) intermediate FFN neurons per layer) and depth multipliers m_d (retaining a balanced subset of floor(m_d * L) Transformer layers) within a single weight-sharing network by (1) rewiring attention heads and FFN neurons in descending order of first-order Taylor loss-variation importance, (2) distilling the rewired teacher into a width-adaptive teacher assistant (DynaBERT_W), and (3) distilling DynaBERT_W into sub-networks spanning all (m_w, m_d) combinations over embeddings, matched hidden states, and prediction logits.
identity_notes: 'Introduced by Lu Hou, Zhiqi Huang, Lifeng Shang, Xin Jiang, Xiao Chen, and Qun Liu (NeurIPS 2020, arXiv:2004.04037). Distinct from fixed-size BERT compression methods such as TinyBERT (Round 800), MiniLM (Round 801), BERT-PKD (Round 802), DistilBERT (Round 803), MobileBERT (Round 804), and BERT-of-Theseus (Round 805), and from depth-only early-exit or layer-dropping methods such as FastBERT (Round 807), PABEE (Round 808), and LayerDrop: DynaBERT adapts both Transformer width (via parallel head and FFN-neuron slicing in Eqs. 1-2 after Taylor-importance network rewiring) and depth (via strided layer dropping and last-layer-preserving hidden-state matching in Eq. 4) inside a single deployed checkpoint.'
aliases:
- DynaBERT
- DynaBERT Adaptive Width and Depth Transformer
- Dynamic Width-and-Depth BERT with Network Rewiring
