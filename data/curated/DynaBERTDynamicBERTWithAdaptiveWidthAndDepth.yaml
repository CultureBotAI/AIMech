aio_mappings:
- target: AIO:Distillation
  relation: narrow_match
  rationale: DynaBERT uses a two-stage knowledge distillation pipeline (via a width-adaptive teacher assistant DynaBERT_W) over embeddings, hidden states, and output logits to train weight-sharing sub-networks across multiple width and depth multipliers.
- target: AIO:ArtificialNeuralNetwork
  relation: narrow_match
  rationale: DynaBERT is a dynamic Transformer neural network architecture whose Multi-Head Attention heads and Feed-Forward Network intermediate neurons are rewired by gradient-based Taylor importance and sliced at runtime.
limitations:
- Residual skip connections across Transformer layers prevent scaling the embedding/residual hidden state dimension d in the standard task-specific DynaBERT formulation.
- Requires a two-stage distillation and data-augmentation training loop iterating over all width multipliers (Stage 1) and all 12 width-depth pairs (Stage 2) for each downstream task.
