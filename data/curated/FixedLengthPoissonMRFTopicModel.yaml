claims:
- claim_id: method
  kind: mechanism
  statement: With fixed topic parameters (theta_j,Phi_j), draw document weights w from Dirichlet(alpha)
    with positive alpha, a total L from the chosen length law (Poisson in the stated example), and topic
    totals m from Multinomial(L,w). Conditional on m, draw z_j independently from LPMRF(theta_j,Phi_j,total=m_j)
    and set x=sum_j z_j. Each z_j uses its own finite-total partition function; topic parameters may include
    the explicitly chosen length-dependent weighting. At m_j=0 the topic vector is zero. Given w and L,
    the document mass sums products of these normalized topic masses over compatible z allocations and
    weights each m allocation by its Multinomial(L,w) probability. It is not a single LPMRF evaluated
    at averaged canonical parameters. With every Phi_j=0, z_j is multinomial with probabilities softmax(theta_j),
    and the allocation hierarchy gives the familiar LDA conditional token construction for fixed topic
    probabilities. That reduction does not assert equality of arbitrary priors on the topic parameters
    or equivalence of the paper’s approximate fitting procedure to exact LDA inference.
