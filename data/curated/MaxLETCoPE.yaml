id: AIMech:MaxLETCoPE
name: Max-LET CoPE scheduling
definition: An execution-focused CoPE scheduling schema that fixes each candidate
  action head to latest start times under a selected induced deadline, delegates the
  resulting computation-allocation problem to a supplied algorithm, and selects the
  combined policy with the highest returned success probability.
concept_kind: algorithm
aliases: []
identity_notes: 'The official execution-focused Max-LET_A policy-construction schema:
  choose source-defined deadlines, place each candidate action head at latest execution
  times, reduce to the supplied allocation problem, invoke A and compare resulting
  policies. A named parameterized algorithm is defensible. The supplied S(AE)^2 solver
  A is a parameter; its configurations do not automatically warrant additional records.
  Retain the general heuristic status, selected deadline convention and helper-interface
  limitations. Restricted KID-CoPE lazy-policy results do not certify general Max-LET
  optimality. Curated name adds CoPE scheduling to disambiguate the source-local Max-LET
  label. Bare Max-LET and solver-suffixed spellings remain search contexts, not aliases.
  Current insertion identity was assessed on 2026-10-16 at merged HEAD 8650bfb55ef0c67902b5a80f1527920c87ad1d9d
  and tree cd6972cabe7b7f1cdf9ca5ee69bd6263a991ba50. The complete inventory contains813
  maintained and442 pinned AIO records,1255 total, with no normalized collision among
  the four candidates. Eight ignored- and hidden-inclusive searches across data/,
  research/, sources/ and docs/ account for167 distinct matching contents and856 match
  events. Of these,105 groups retain exact historical scoped-event attribution and62
  contents received fresh semantic reading with complete relevant parent context.
  The newly added manufacturing record was fully compared;22 prior native contexts
  are byte-identical and retain attributed semantic comparisons. The current mapping
  assessment read21 complete pinned AIO nodes and72 incident edges. The peer independently
  checked the current-state work with original scientific authorship disclosed. This
  is bounded identity clearance for the selected corpus and pin, not universal novelty
  or source exhaustion. Historical131-content/588-occurrence searching used four whole
  checkouts and included review/vendor contexts; it is retained by attribution rather
  than described as the current four-root search. The existing main911 source coordinator
  is accepted for this insertion without merging method identities or closing source
  questions.'
definition_evidence:
- source_id: elboher2023
  locator: Official PDF p.6 Section 6 and Algorithm 1; p.7 helper Algorithms 3–4.
  relation: supports
claims:
- claim_id: parameterized-head-policy-construction
  kind: mechanism
  statement: Max-LET_A takes a CoPE instance and a supplied S(AE)^2 allocation algorithm
    A. For each candidate process head H_i, the displayed version sets a representative
    induced deadline d_i to the minimum of the support of D_i and constructs an initiation
    schedule for that head. The surrounding prose permits other deadline choices,
    such as an expectation, as explicit alternatives rather than identical input conventions.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6, Section 6 Max-LET paragraph and Algorithm 1.
    relation: supports
- claim_id: latest-head-initiation
  kind: mechanism
  statement: The selected head is scheduled backwards from d_i so that its actions
    have their latest execution-start times for that head/deadline. Read with the
    source duration notation, the intended backwards step subtracts each action duration
    and records its start. This describes the latest-placement construction; it does
    not certify that every such schedule is legal for arbitrary deadlines, empty heads
    or omitted guards.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6 Max-LET explanation; p.7 Algorithm 4 schedule_actions;
      p.4 legality and duration definitions.
    relation: supports
- claim_id: reduction-delegation-and-selection
  kind: mechanism
  statement: For each selected head and fixed initiation function, the schema reduces
    the remaining computation-allocation problem using effective deadlines, calls
    A to obtain a computation policy and a returned success probability, and combines
    that computation policy with the chosen base-action initiations. The display retains
    a candidate only when its returned probability is strictly greater than the best
    value so far. Computations for other compatible processes may occur before their
    invalidation or tardiness.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.5, fixed-head/effective-deadline explanation and Eq.7;
      p.6 Algorithm 1; p.7 Algorithm 3.
    relation: supports
- claim_id: general-case-schema-boundary
  kind: scope
  statement: The source places Max-LET among execution-focused suboptimal schemes
    for the general CoPE case. It constructs and compares policies under selected
    initiation choices; it is not the formal model itself or the computation-first
    one-action Demand-Execution rule. Solver A and the deadline convention configure
    the schema, and source-stated exact KID-CoPE cases do not imply universal optimality
    of Max-LET.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6, Section 6 introduction, execution-focused paragraph
      and Max-LET description.
    relation: supports
limitations:
- This schema is described in the static CoPE setting with supplied profiles and induced
  deadlines, deterministic world evolution and sequential non-preemptible base actions.
  It is not a complete temporal-planner integration, online profile learner, arbitrary
  parallel-action scheduler or stochastic-execution controller.
- Probability and reduction calculations use the source analysis assumptions, including
  independent completion/deadline variables where invoked. The background strict CDF
  survival and inclusive induced-deadline condition differ at atoms; no universal
  independent-probability or deadline-boundary convention is silently imposed.
- The official reduction helper prints no increment in its common-prefix loop, no
  explicit second-head-length guard and no complete all-compatible or empty-head convention.
  Eq.7 also needs mismatch-sentinel and empty-set treatment. This limits execution-level
  interpretation of the display without demonstrating a defect in uninspected code.
- Algorithm 4 subtracts H[j] although H is an action sequence, requiring the intended
  duration interpretation. The printed schema does not completely guard absent support
  minima, negative latest starts, empty heads or all scheduling-legality conditions.
  Latest placement is not by itself a certified feasible schedule on unrestricted
  inputs.
- The reduction display does not pass D explicitly even though effective deadlines
  depend on induced deadlines. Ambient distribution access, combining action schedules,
  returned success probabilities, tie treatment and all-zero-success behavior require
  implementation conventions. In Algorithm 1 p starts at0 and only strict improvements
  replace the empty initial policy; no additional fallback is invented.
- The supplied S(AE)^2 solver can introduce its own numerical domains and approximations.
  Conditional hazards require positive unfinished survival; log-failure utilities
  need zero/one boundary handling and LPF/time heuristics need positive allocation
  time. These are not certified by calling the solver through Max-LET.
- Fixing latest execution times and a representative uncertain deadline is a general-case
  heuristic choice. The known-deadline fixed-initiation and pseudo-polynomial special-case
  results have separate feasibility, head-length or slack premises, and the prior
  reading did not formally verify their proof sketches. No optimality, completeness
  or universal success bound is claimed for this schema.
- Official Algorithm 1 and its helper displays define the selected presentation. The
  author main PDF lacks the referenced appendix, and arXiv Appendix C contains older
  IPAE/Refined-Max-LET presentations whose equivalence is unresolved. Those names,
  A configurations and the newly retained2021 IPAE route are not aliases or newly
  accepted concepts. No linked code was acquired or run.
- The reported simulations depend on sampled15-puzzle-derived profiles, chosen process
  counts, action durations and supplied solvers. They do not establish calibrated
  probabilities, general deployment overhead, pointwise dominance or paired statistical
  significance. Ellipses and rounded small runtimes must not be interpreted as confidence
  intervals or exact timing.
