name: Set Transformer
definition: A neural encoder-decoder architecture for permutation-invariant set-input prediction that
  uses attention to encode interactions among elements and learned seed queries to aggregate encoded features.
concept_kind: architecture
identity_notes: The Set Transformer is a set-input architecture, not the AIO Transformer Language Model
  class, an individual multihead attention layer, or the later Set Transformer++ encoder revision.
limitations:
- The encoder is permutation equivariant; the pooled output is invariant to input ordering. Multiple seed
  outputs are not input-element labels.
- Linear scaling with input-set size concerns a fixed number of inducing points; ordinary self-attention
  blocks have quadratic interactions. No universal benchmark superiority is asserted.
