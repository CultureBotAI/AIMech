claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: Stack self-attention or induced-attention blocks without positional encoding, then pool encoded
    features by attention from learned seed vectors. The induced variant first attends from learned inducing
    points to the input and then from the input to the resulting summaries.
