claims:
- claim_id: exact-anchor-partial-maximization
  kind: mechanism
  statement: At theta_t form Q(theta|theta_t)=E_[Z|X,theta_t] log p(X,Z|theta), with the conditional law
    fixed throughout the parameter update. Choose an admissible theta_(t+1) satisfying Q(theta_(t+1)|theta_t)>=Q(theta_t|theta_t),
    then refresh the expectation. An exact argmax is allowed but not required; a numerical step needs
    an actual improvement check rather than the name of an optimizer.
  evidence:
  - source_id: correction-source
    locator: SectionII, p752 / PDF2, ordinary GEM definition and cross-entropy argument
    relation: supports
- claim_id: likelihood-bound
  kind: scope
  statement: For a well-defined normalized model with the support and finite-expectation conditions needed
    for the EM identity, the exact-current-posterior bound touches observed log likelihood at theta_t.
    Increasing its parameter-dependent Q term makes observed likelihood nondecreasing relative to that
    anchor. Stale per-case expectations or noisy estimates break that premise unless separately controlled.
  evidence:
  - source_id: neal-source
    locator: Section2 Eq1-5, PDF3-6; contrast with Sections3 and5
    relation: supports
- claim_id: ascent-not-convergence
  kind: limitation
  statement: Nondecreasing likelihood alone does not establish a stationary parameter limit, a local maximum
    or a global maximum. Even strict Q increases can become summably small and approach a nonstationary
    point, as the saved normalized Gaussian-model example shows. Convergence requires additional update-map,
    regularity and progress conditions. The source theorem about a joint maximum of the free-energy objective
    does not turn every coordinate-ascent sequence into such a maximum.
  evidence:
  - source_id: neal-source
    locator: Section2 Theorem2 and subsequent alternating-optimization discussion, PDF5-6; curator shrinking-step
      counterexample
    relation: supports
limitations:
- Exact posterior expectations can be expensive or unavailable. Monte Carlo, variational or numerical
  approximations need their own error analysis and are not certified GEM steps merely because they aim
  to increase a surrogate.
- The original Dempster-Laird-Rubin1977 source and Wu1983 convergence proof were not newly read for this
  record; the fully inspected primary chapter and published correction support the scoped definition.
  No universal stationary-limit theorem is asserted.
- No author software or historical empirical study was reproduced. Finite curator calculations illustrate
  stated objective and schedule boundaries; they are not a general convergence proof or an empirical speed
  comparison.
