name: Generalized Expectation Maximization
aliases:
- Generalized EM
- GEM (generalized expectation maximization)
concept_kind: algorithm
definition: A latent-variable likelihood-fitting framework that computes the expected complete-data log
  likelihood under the current exact posterior and replaces full maximization with a parameter update
  that does not decrease that same expected objective.
identity_notes: 'GEM generalizes the M-step requirement of ordinary EM; it does not license an arbitrary
  approximate E-step. Exact EM and suitable fixed-Q ECM updates are special cases. Cached-case incremental
  EM, Monte Carlo approximations and ECME actual-likelihood steps do not automatically satisfy the current-Q
  GEM inequality. The source-defined framework is distinct from any particular gradient, coordinate or
  space-alternating implementation. Bare GEM is not asserted as a globally unique alias. No normalized
  identity matches among 442 pinned and 476 maintained records, including acronym probes. GEM is the exact-current-E/Q-improvement
  framework, IEM refreshes cached independent cases, sparse EM preserves frozen outside mass, and DAEM
  is the warm-started cooling-to-beta1 procedure. Existing TEM has the same finite-state fixed-beta update,
  but its broader update framework and held-out inverse-annealing realization do not define that outer
  cooling procedure. ECM, AECM and SAGE specialize parameter/augmentation updates, not these case or probability-subset
  operations. Structured factorial-HMM variational inference imposes a different family restriction. Names
  and incidental frontier references do not establish identity; qualified GEM/IEM aliases avoid unrelated
  uses. The absence assessment is bounded to this snapshot and corpus. Identity-search counts: 253 matched
  lines in the worktree and 260 in main; all 98 distinct matching-text windows were read, with ignored
  and hidden files included.'
