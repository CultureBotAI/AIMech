claims:
- claim_id: method
  kind: mechanism
  statement: In the 2007 row-vector convention, let r_w be a word’s embedding written as a column, C_i
    the transform for context position i, b_r a feature bias and b_w a candidate-word bias. The candidate
    score is sum_i r_context_i^T C_i r_w+b_r^T r_w+b_w. Equivalently, form r_hat=b_r+sum_i C_i^T r_context_i
    once, then take score_w=r_hat^T r_w+b_w and apply the vocabulary softmax. The original energy is the
    negative of this score. Maximum-likelihood gradients are observed sufficient statistics minus their
    exact finite-vocabulary conditional expectations. Because the embedding matrix is shared, its gradient
    includes both input-context and candidate-output roles. The 2008 exposition writes r_hat=sum_i C_i
    r_context_i with the opposite matrix orientation and without an explicit feature bias; this is a notation/parameterization
    distinction to preserve when comparing formulas.
