aio_mappings:
- target: AIO:AutoregressiveLanguageModel
  relation: broad_match
  rationale: The source specifies next-word conditionals given preceding words, defining a sequential
    language model with a finite context. The AIO target is broader than this position-specific bilinear
    context and flat vocabulary-output architecture. The mapping uses its sequential-probability scope,
    not its qualitative assertion about excelling at generation. HierarchicalLanguageModel denotes multilevel
    representations and is not an exact identity for a vocabulary-tree construction; OutputLayer, SoftmaxLayer
    and EmbeddingLayer are components rather than whole-model superclasses.
