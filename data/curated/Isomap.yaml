name: Isomap
definition: A nonlinear dimensionality-reduction algorithm that estimates manifold geodesic distances
  by shortest paths in a local neighborhood graph and applies classical multidimensional scaling to those
  estimated distances.
concept_kind: algorithm
identity_notes: Isomap combines neighborhood-based geodesic estimation with classical MDS. It is not identical
  to generic MDS, PCA or LLE. Epsilon and nearest-neighbor graph options belong to the original algorithm;
  landmark and robust variants require separate inspection. All 442 pinned AIO labels/scoped synonyms
  and 109 preceding native identities were compared, together with hidden/ignored-inclusive searches of
  both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- Neighborhoods that bridge manifold branches create short-circuit distances; overly small neighborhoods
  can disconnect the graph and leave infinite pairwise distances.
- The original asymptotic recovery claim concerns manifolds intrinsically equivalent to a convex Euclidean
  region with sufficient sampling and suitable neighborhood choices; the spectral objective does not certify
  arbitrary manifold recovery.
- The 2002 comment demonstrates a noise/neighborhood failure, while the authors’ response shows that adjusting
  neighborhood size can recover useful embeddings in their studied examples. Neither establishes universal
  failure nor universal robustness.
- Classical Euclidean embedding can distort graph distances; retaining leading positive modes is not proof
  that every estimated distance has an exact low-dimensional Euclidean realization.
