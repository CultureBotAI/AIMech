claims:
- claim_id: method-scope
  kind: mechanism
  statement: Construct a weighted epsilon-neighborhood or nearest-neighbor graph with input distances
    as edge lengths, compute all-pairs shortest-path distances, and form the centered inner-product matrix
    from squared graph distances. Classical MDS uses leading positive eigenvalues and eigenvectors to
    obtain Euclidean embedding coordinates. The global optimum concerns that matrix-fitting objective,
    while agreement with true manifold geometry additionally depends on the graph and manifold assumptions.
  evidence:
  - source_id: original-paper
    locator: Main method, equation (1), Table 1 and notes 15–19, printed pp. 2320–2322 / PDF pp. 2–4
    relation: supports
- claim_id: noise-and-neighborhood-scope
  kind: limitation
  statement: Balasubramanian and Schwartz identify short-circuit sensitivity in a noisy Swiss-roll example.
    Tenenbaum, de Silva and Langford agree that neighborhood selection matters, distinguish their unorganized-point-cloud
    problem from known-mesh cortical flattening, and report useful ranges of neighborhood sizes in their
    examples. The exchange supports a conditional stability limitation, not a blanket rejection of Isomap.
  evidence:
  - source_id: stability-discussion
    locator: Comment and response, Science 295:7a; combined Oxford PDF pp. 6–8
    relation: supports
