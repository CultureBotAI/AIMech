- target: AIO:DataDredgingBias
  relation: related_match
  rationale: The pinned AIO bias node names apparent significance from testing many hypotheses. This procedure
    addresses that multiplicity risk for a declared comparison family under a valid joint reference. The
    algorithm is related to the risk it addresses, not a subtype or equivalent of the bias, and it does
    not automatically correct unaccounted adaptive selection or every form of data dredging.
limitations:
- This is the general parametric single-step maxT procedure, not the narrower Bayesian separator-conflict
  construction, every maxT resampling method, an omnibus Wald test, step-down testing or a software-package
  instance.
- The asymptotic result uses fixed family dimension and a fixed contrast matrix with estimable positive-variance
  comparisons and a consistent joint covariance. It does not establish high-dimensional, adaptive-selection
  or uniformly valid inference without further theory.
- Multivariate t exactness needs the model-specific common variance-scaling law and correct residual degrees
  of freedom. The report has ambiguous n-p-1 notation alongside a p counting all coefficients; use the
  actual model rank rather than copying that notation.
- 'The archived report labels a displayed interval as 1-2alpha while specifying the joint critical probability
  as 1-alpha. This record uses the coherent latter convention: G(c_alpha)=1-alpha gives joint coverage
  1-alpha under the valid reference.'
- The evidence is the complete 25-page February 15, 2008 LMU Technical Report 019, with PDF page n+2 matching
  printed page n. Journal metadata is identity context; this PDF is not assumed byte-identical to the
  journal article or a later package vignette.
- No multcomp installation or implementation-source audit, fitted model, application outcome, benchmark
  or empirical calibration study was performed. Constructed known-covariance Gaussian examples illustrate
  the procedure and dependence boundaries only.
