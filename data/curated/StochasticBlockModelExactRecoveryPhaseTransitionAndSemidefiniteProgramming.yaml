id: AIMech:StochasticBlockModelExactRecoveryPhaseTransitionAndSemidefiniteProgramming
name: Stochastic Block Model Exact Recovery Phase Transition and Semidefinite Programming
concept_kind: mathematical_method
review_status: DRAFT
definition: 'Stochastic Block Model Exact Recovery Phase Transition and Semidefinite Programming is the information-theoretic and convex-optimization framework established by Abbe, Bandeira, and Hall (2016) for exact community recovery (strong consistency) in the two-community symmetric Stochastic Block Model SBM(n, p, q) in the logarithmic degree regime p = alpha log(n)/n and q = beta log(n)/n (alpha > beta >= 0). It proves a sharp phase transition at the Chernoff-Hellinger threshold (sqrt(alpha) - sqrt(beta))^2 / 2 = 1 (equivalently alpha + beta - 2*sqrt(alpha*beta) = 2): when (sqrt(alpha) - sqrt(beta))^2 < 2, maximum a posteriori (MAP) estimation fails with probability -> 1 due to the emergence of flipped vertices having more cross-community than within-community neighbors (Theorem 1), whereas when (sqrt(alpha) - sqrt(beta))^2 > 2, both MAP and the polynomial-time Goemans-Williamson-type semidefinite programming relaxation max_{Y >= 0, Y_{ii}=1} Tr(B Y) with B = 2A - (1 1^T - I_n) recover the exact partition X^* = g g^T up to global sign with probability 1 - o(1) (Theorem 2 and Theorem 4).'
identity_notes: Distinct from generic graph clustering (AIO:Clustering, AIO:UnsupervisedClustering), normalized spectral clustering (AIMech:NormalizedSpectralClusteringNgJordanWeiss), and spectral regularization of sparse random graphs. Specifically captures the Abbe-Bandeira-Hall (2016) logarithmic-degree exact recovery threshold (sqrt(alpha) - sqrt(beta))^2 = 2 (Theorems 1-2), the binomial large-deviation bound P(Z_1 - Z_2 >= 0) = n^{-(sqrt(alpha)+sqrt(beta))^2/2 + o(1)} (Lemma 2), and the SDP dual-certificate Laplacian analysis S = 2 L_SBM + 1 1^T >= 0 with lambda_2(S) > 0 (Lemma 6, Lemma 11, and Theorem 4).
aliases:
- SBM Exact Recovery Phase Transition
- Abbe-Bandeira-Hall SBM Phase Transition
- Chernoff-Hellinger Symmetric SBM Threshold
- SBM Semidefinite Programming Exact Community Recovery
