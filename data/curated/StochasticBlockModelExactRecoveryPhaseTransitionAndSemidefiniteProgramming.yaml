claims:
- claim_id: claim-01
  kind: mechanism
  statement: Exact recovery in the symmetric two-community SBM reduces to maximum likelihood / minimum bisection min_{x in {+-1}^n, x^T 1 = 0} sum_{i<j} A_{ij} 1{x_i != x_j} (Lemma 1), which fails whenever both communities contain at least one vertex whose external degree Z_2 ~ Bin(n/2, beta log(n)/n) exceeds its internal degree Z_1 ~ Bin(n/2 - 1, alpha log(n)/n); by Lemma 2, P(Z_1 <= Z_2) = n^{-(sqrt(alpha)-sqrt(beta))^2/2 + o(1)}, so expected misclassified vertices diverge when (sqrt(alpha)-sqrt(beta))^2 < 2 and vanish when (sqrt(alpha)-sqrt(beta))^2 > 2 (Theorems 1-2).
  evidence:
  - source_id: r318-primary-pdf
    locator: Section II, Theorems 1-2, pp. 3-4; Section IV, Lemmas 1-5 and Proof of Theorem 1, pp. 9-12
    relation: supports
  - source_id: r318-metadata-cr
    locator: Bibliographic metadata for IEEE Transactions on Information Theory 62(1):471-487
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For the convex semidefinite relaxation max_{Y >= 0, Y_{ii}=1} Tr(B Y) with B = 2A - (1 1^T - I_n), Lemma 6 proves that the rank-one community matrix Y^* = g g^T is the unique optimal solution whenever the dual slack matrix S = 2 L_SBM + 1 1^T = 2(D^+ - D^- - A) + 1 1^T (which satisfies S g = 0 identically) is positive semidefinite with lambda_2(S) > 0; Lemma 11 shows that E[S] has eigenvalues n - 2*beta*log(n) (on 1), 0 (on g), and (alpha - beta)*log(n) (with multiplicity n - 2 on {1, g}^perp), enabling Theorem 4 to establish exact SDP recovery down to the optimal threshold.
  evidence:
  - source_id: r318-primary-pdf
    locator: Section III.B, Equations 20-24, Theorem 4, and Lemma 6, pp. 7-9; Section V.B, Lemmas 9-11 and Proof of Theorem 4, pp. 12-13
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Exact recovery (strong consistency of 100% of vertices) is information-theoretically impossible below the connectivity and Chernoff-Hellinger threshold (sqrt(alpha) - sqrt(beta))^2 < 2 or in the constant average degree regime O(1/n), where isolated and degree-flipped vertices occur with constant probability and only partial (weak) recovery is achievable.
  evidence:
  - source_id: r318-primary-pdf
    locator: Section I-II, Table I and Remark 1 (Strong vs. Weak Consistency), pp. 2-4; Section IV, Proof of Impossibility Theorem 1, pp. 9-12
    relation: supports
