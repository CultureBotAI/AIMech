limitations:
- Exact recovery of all n community labels requires edge probabilities in the logarithmic degree regime p = alpha log(n)/n, q = beta log(n)/n satisfying (sqrt(alpha) - sqrt(beta))^2 > 2; in sparser graphs or below this threshold, no algorithm can avoid misclassifying a non-empty set of vertices.
