id: AIMech:SquareRootLassoPivotalConicSparseRegression
name: Square-Root LASSO Pivotal Second-Order Cone Sparse Regression
review_status: DRAFT
concept_kind: algorithm
aliases:
- Square-Root Lasso
- Sqrt-LASSO Pivotal Sparse Recovery
- Belloni-Chernozhukov-Wang Second-Order Cone L1-Penalized Root-MSE Estimator
- Self-Normalized Score Pivotal L1-Regularized Regression
definition: Square-Root LASSO Pivotal Second-Order Cone Sparse Regression is a high-dimensional sparse linear regression estimator introduced by Belloni, Chernozhukov, and Wang (2011, Biometrika 98(4):791-806, DOI:10.1093/biomet/asr043, arXiv:1009.5689v5) for the model $y_i = x_i'\beta_0 + \sigma\epsilon_i$ ($i=1,\dots,n$, $\mathbb{E}_{F_0}(\epsilon_i)=0$, $\mathbb{E}_{F_0}(\epsilon_i^2)=1$, unknown noise scale $\sigma > 0$, support $T = \operatorname{supp}(\beta_0)$ of size $s < n$, and normalized covariates $\mathbb{E}_n(x_j^2) = 1$) that minimizes the square-root of the empirical mean-squared error plus an $\ell_1$ penalty, $\widehat{\beta} \in \arg\min_{\beta \in \mathbb{R}^p} \{\widehat{Q}(\beta)\}^{1/2} + \frac{\lambda}{n}\|\beta\|_1$ where $\widehat{Q}(\beta) = \frac{1}{n}\sum_{i=1}^n (y_i - x_i'\beta)^2$ (Eq. 8). Because the criterion gradient at $\beta_0$ is the self-normalized score $\tilde{S} = \nabla \widehat{Q}^{1/2}(\beta_0) = \frac{\mathbb{E}_n(x\epsilon)}{\{\mathbb{E}_n(\epsilon^2)\}^{1/2}}$ which is invariant to $(\beta_0, \sigma)$, setting the pivotal penalty $\lambda = c\Lambda(1 - \alpha) = c n^{1/2}\Phi^{-1}(1 - \alpha/(2p)) \le c\{2n\log(2p/\alpha)\}^{1/2}$ ($c > 1$) dominates $\Lambda = n\|\tilde{S}\|_\infty$ without knowing or pre-estimating $\sigma$, achieves the near-oracle prediction and $\ell_2$ convergence rate $\|\widehat{\beta} - \beta_0\|_{2,n} \lesssim \sigma\{s\log(2p/\alpha)/n\}^{1/2}$ across Gaussian and non-Gaussian errors (Theorem 1, Corollaries 1-4), and admits an exact second-order cone programming (SOCP) primal-dual formulation and closed-form coordinatewise update (Theorem 2, Eqs. 19-20, Appendix B.3).
identity_notes: Distinct from standard LASSO (`AIO:LassoRegression`), whose score $S = \nabla \widehat{Q}(\beta_0) = 2\sigma\mathbb{E}_n(x\epsilon)$ scales with the unknown noise standard deviation $\sigma$ and therefore requires an oracle $\sigma$, conservative pilot estimates, or cross-validation to set $\lambda = \sigma c 2 n^{1/2}\Phi^{-1}(1 - \alpha/(2p))$. Also distinct from Adaptive LASSO (`AIMech:AdaptiveLassoOracleWeightedL1PenalizedEstimation`), which reweights $\ell_1$ penalties using a root-$n$-consistent initial estimator in fixed or low dimensions, and from tangent-cone projected LASSO high-SNR risk analysis (`AIMech:WorstCaseProximalDenoisingNMSEAndSubdifferentialMeanSquaredDistance`). Belloni, Chernozhukov, & Wang (2011) replace $\widehat{Q}(\beta)$ with $\{\widehat{Q}(\beta)\}^{1/2}$ to make the score self-normalized and pivotal with respect to $\sigma$, prove finite-sample and moderate-deviation non-Gaussian near-oracle bounds under restricted eigenvalues, and establish strong conic duality over the second-order (ice-cream) cone $Q^{n+1}$.
