claims:
- claim_id: self-normalized-pivotal-score-and-gaussian-and-moderate-deviation-penalty-domination
  kind: mechanism
  statement: At the true parameter $\beta_0$, the gradient of $\widehat{Q}^{1/2}(\beta) = \{\frac{1}{n}\sum_{i=1}^n (y_i - x_i'\beta)^2\}^{1/2}$ is the self-normalized score $\tilde{S} = \nabla \widehat{Q}^{1/2}(\beta_0) = \frac{\nabla \widehat{Q}(\beta_0)}{2\{\widehat{Q}(\beta_0)\}^{1/2}} = \frac{\mathbb{E}_n(x\epsilon)}{\{\mathbb{E}_n(\epsilon^2)\}^{1/2}}$, whose scaled supremum $\Lambda = n\|\tilde{S}\|_\infty$ is completely independent of $(\beta_0, \sigma)$ (Section 2.1, p. 3). For $c > 1$ and confidence level $1 - \alpha$, setting $\lambda$ via the exact conditional quantile $\lambda = c\Lambda_F(1 - \alpha \mid X)$, the semi-exact family maximum $\lambda = c\max_{F \in \mathcal{F}} \Lambda_F(1 - \alpha \mid X)$, or the closed-form asymptotic option $\lambda = c\Lambda(1 - \alpha) = c n^{1/2}\Phi^{-1}(1 - \alpha/(2p)) \le c\{2n\log(2p/\alpha)\}^{1/2}$ (Eqs. 12-15) guarantees the regularization event $\lambda \ge c\Lambda$ with probability at least $1 - \alpha$ (exact) or $1 - \alpha\tau = 1 - \alpha(1 + o(1))$ under Gaussian errors $F_0 = \Phi$ with $\Lambda_\Phi(1 - \alpha \mid X) \le \nu\Lambda(1 - \alpha)$ where $\nu = \frac{\{1 + 2/\log(2p/\alpha)\}^{1/2}}{1 - 2\{\log(2/\alpha)/n\}^{1/2}}$ (Lemma 1, p. 5), and with probability $1 - \alpha - o(\alpha)$ for non-Gaussian errors with finite $q$-th moments ($q > 2$ under Slastnikov moderate deviations, Lemma 2, p. 6; or $q > 4$ under Jing-Shao-Wang self-normalized moderate deviations, Lemma 3, p. 19).
  evidence:
  - source_id: bcw2011-sqrt-lasso-pdf
    locator: Section 2, pp. 3-6, Equations (11)-(16), Lemmas 1-2; Appendix 2, pp. 14-17; Appendix A, p. 19, Equation (36), Lemma 3; Appendices D-F, pp. 25-30
    relation: supports
