- claim_id: restricted-eigenvalue-cone-membership-and-non-asymptotic-near-oracle-error-bounds
  kind: mechanism
  statement: 'On the regularization event $\lambda \ge c\Lambda$ ($c > 1$), convexity of $\widehat{Q}^{1/2}$ and optimality of $\widehat{\beta}$ force the estimation error $\widehat{\delta} = \widehat{\beta} - \beta_0$ into the restricted cone $\Delta_{\bar{c}} = \{\delta \in \mathbb{R}^p : \|\delta_{T^c}\|_1 \le \bar{c}\|\delta_T\|_1,\, \delta \ne 0\}$ with $\bar{c} = \frac{c+1}{c-1}$ (Appendix 1, Step 1, Eqs. 21-25, p. 13). Under the restricted eigenvalues $\kappa_{\bar{c}} = \min_{\delta \in \Delta_{\bar{c}}} \frac{s^{1/2}\|\delta\|_{2,n}}{\|\delta_T\|_1}$ and $\tilde{\kappa}_{\bar{c}} = \min_{\delta \in \Delta_{\bar{c}}} \frac{\|\delta\|_{2,n}}{\|\delta\|_2}$ (Eq. 17, p. 7) and the growth condition $\lambda s^{1/2} \le n\kappa_{\bar{c}}\rho$ for some $\rho < 1$, the quadratic-root factorization $\widehat{Q}(\widehat{\beta}) - \widehat{Q}(\beta_0) = [\{\widehat{Q}(\widehat{\beta})\}^{1/2} + \{\widehat{Q}(\beta_0)\}^{1/2}][\{\widehat{Q}(\widehat{\beta})\}^{1/2} - \{\widehat{Q}(\beta_0)\}^{1/2}]$ yields the deterministic finite-sample bound $\tilde{\kappa}_{\bar{c}}\|\widehat{\beta} - \beta_0\|_2 \le \|\widehat{\beta} - \beta_0\|_{2,n} \le A_n \sigma\{\mathbb{E}_n(\epsilon^2)\}^{1/2} \frac{\lambda s^{1/2}}{n}$ where $A_n = \frac{2(1 + 1/c)}{\kappa_{\bar{c}}(1 - \rho^2)}$ (Theorem 1, p. 8; Appendix 1, Step 2, Eqs. 26-31, pp. 13-14), achieving the near-oracle rate $\sigma\{2s\log(2p/\alpha)/n\}^{1/2}$ without knowledge of $\sigma$ (Corollaries 1-4, pp. 8-9, 19).'
  evidence:
  - source_id: bcw2011-sqrt-lasso-pdf
    locator: Section 3, pp. 7-9, Equation (17), Theorem 1, Corollaries 1-3; Appendix 1, pp. 13-14, Equations (21)-(31); Appendix A, p. 19, Corollary 4
    relation: supports
- claim_id: second-order-cone-primal-dual-equivalence-and-closed-form-coordinatewise-minimization
  kind: mechanism
  statement: 'The Square-Root LASSO problem (8) is equivalent to the primal second-order cone program $\min_{t,v,\beta^+,\beta^-} \frac{t}{n^{1/2}} + \frac{\lambda}{n}\sum_{j=1}^p (\beta_j^+ + \beta_j^-)$ subject to $v = Y - X\beta^+ + X\beta^-$, $(v, t) \in Q^{n+1} = \{(v, t) \in \mathbb{R}^n \times \mathbb{R} : t \ge \|v\|_2\}$, and $\beta^+, \beta^- \in \mathbb{R}_+^p$ (Eq. 19), which admits with zero duality gap the strongly dual problem $\max_{a \in \mathbb{R}^n} \frac{1}{n}\sum_{i=1}^n y_i a_i$ subject to $|\frac{1}{n}\sum_{i=1}^n x_{ij} a_i| \le \frac{\lambda}{n}$ ($j=1,\dots,p$) and $\|a\|_2 \le n^{1/2}$ (Eq. 20), where whenever $Y \ne X\widehat{\beta}$ the optimal dual vector is the normalized residual $\widehat{a} = n^{1/2}\widehat{v}/\|\widehat{v}\|_2 = (Y - X\widehat{\beta})/\{\widehat{Q}(\widehat{\beta})\}^{1/2}$ (Theorem 2, pp. 9-10; Proof of Theorem 2, p. 14). Moreover, single-coordinate minimization over $\beta_j$ given $\beta_{-j}$ admits an exact closed-form threshold and shrinkage update setting $\beta_j = 0$ iff $|\mathbb{E}_n\{x_j(y - x''\beta_{-j})\}| \le (\lambda/n)\gamma_j\{\widehat{Q}(\beta_{-j})\}^{1/2}$ (Appendix B.3, pp. 21-23).'
  evidence:
  - source_id: bcw2011-sqrt-lasso-pdf
    locator: Section 4, pp. 9-10, Equations (19)-(20), Theorem 2; Appendix 1, p. 14, Proof of Theorem 2; Appendix B, pp. 20-23, Table 1, Equation (37)
    relation: supports
