limitations:
- "The phase-transition thresholds in Theorems 2\u20136 are derived in the proportional asymptotic regime $r = \\beta n$ and $m = \\mu n^2$ (or $m = \\mu n(n+1)/2$) as $n \\to \\infty$ under i.i.d. Gaussian measurement operators $\\mathcal{A}$ whose null spaces are Haar-uniform on the Grassmannian; structured non-Gaussian measurements (such as entrywise matrix completion) do not possess Haar-uniform null spaces and require incoherence conditions."
- "Theorems 2\u20136 provide sufficient recovery thresholds via upper bounds on the Gaussian width $\\omega(S)$ in Gordon's Escape-Through-a-Mesh inequality; while empirical $40 \\times 40$ SDP simulations match the weak thresholds $\\mu_{\\mathrm{weak}}(\\beta)$ and $\\mu_{\\mathrm{PSD,weak}}(\\beta)$ closely (Figures 1 and 2), formal converse tightness proofs require lower-bounding the Gaussian width on the mesh."
- 'Primary-source typographical audit of `arXiv:1011.6326v1`: (1) Section 4.1 Proof of Lemma 6 line 4 (p. 5) writes ''$\|X + W\| = \sum_{i=r+1}^n \sigma_i(W)$'' omitting the nuclear-norm subscript ''$\star$''; (2) Section 4.2 Eq. (57) (p. 11) writes ''$\sum_{i=1}^c h_{2i}$'' without the comma subscript used in ''$h_{2,i}$'' on the same line; (3) Section 4.2.1 Eqs. (72) and (74) (p. 13) write ''$\|H\|_F - \sum_{i=1}^{c_{\mathrm{sec}}} h_{2,i}^2$'' inside the square root, omitting the exponent ''$2$'' on ''$\|H\|_F^2$'' (compare Eq. 59 and Eq. 93); (4) Figure 1 legend (p. 17) spells ''Sectional threhold''; and (5) Section 5.5.1 Lemma 28 line 1 (p. 26) writes ''$\Lambda \in \mathbb{R}^{r \times t}$'' instead of ''$\Lambda \in \mathbb{R}^{r \times r}$''.'
