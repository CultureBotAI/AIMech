claims:
- claim_id: strong-sectional-weak-null-space-conditions-and-quarter-circle-threshold-equations
  kind: mechanism
  statement: 'For an $n \times n$ matrix $X$ of rank $r = \beta n$ and a linear operator $\mathcal{A} : \mathbb{R}^{n \times n} \to \mathbb{R}^m$ ($m = \mu n^2$), exact recovery via nuclear norm minimization $\min \|X\|_\star$ is characterized by three progressively weaker null-space conditions on $W \in \mathcal{N}(\mathcal{A}) \setminus \{0\}$: (1) Strong recovery of all rank-$r$ matrices iff $2\|W\|_r < \|W\|_\star$ (Lemma 6, Eq. 20); (2) Sectional recovery of all matrices sharing support $\{P, Q\}$ iff $\|(I - P)W(I - Q^\top)\|_\star > \|PWQ^\top\|_\star$ (Lemma 10, Eq. 46); and (3) Weak recovery of a fixed $X = U\Sigma V^\top$ iff $\operatorname{trace}(U^\top WV) + \|\bar{U}^\top W\bar{V}\|_\star > 0$ (Lemma 13, Eq. 78). Combining Gordon''s Escape-Through-a-Mesh theorem (Theorem 1) with quarter-circle tail moments $\gamma(\beta) = \int_{F^{-1}(1 - \beta)}^2 x\frac{\sqrt{4 - x^2}}{\pi}\,dx$ and $\gamma_2(\beta) = \int_{F^{-1}(1 - \beta)}^2 x^2\frac{\sqrt{4 - x^2}}{\pi}\,dx$ yields the sufficient sampling thresholds: (i) Theorem 2 (Eqs. 44-45): $\mu_{\mathrm{strong}}(\beta) = \gamma_2(1 - \delta_s) - \frac{(\gamma(1 - \delta_s) - 2\gamma(\beta))^2}{1 - \delta_s}$ where $\frac{\gamma(1 - \delta_s) - 2\gamma(\beta)}{1 - \delta_s} = F^{-1}(\delta_s)$; (ii) Theorem 3 (Eqs. 76-77): $\mu_{\mathrm{sec}}(\beta) = 1 - (1 - \beta)^2(1 - \gamma_2(1 - \delta_{\mathrm{sec}})) - \frac{((1 - \beta)^{3/2}\gamma(1 - \delta_{\mathrm{sec}}) - \beta^{3/2}\gamma(1))^2}{1 - \delta_{\mathrm{sec}}(1 - \beta)}$ where $\frac{(1 - \beta)^{3/2}\gamma(1 - \delta_{\mathrm{sec}}) - \beta^{3/2}\gamma(1)}{\sqrt{1 - \beta}(1 - \delta_{\mathrm{sec}}(1 - \beta))} = F^{-1}(\delta_{\mathrm{sec}})$; and (iii) Theorem 4 (Eqs. 95-96): $\mu_{\mathrm{weak}}(\beta) = 1 - (1 - \beta)^2(1 - \gamma_2(1 - \delta_w)) - \frac{(1 - \beta)^3\gamma(1 - \delta_w)^2}{1 - \delta_w(1 - \beta)}$ where $\frac{(1 - \beta)\gamma(1 - \delta_w)}{1 - \delta_w(1 - \beta)} = F^{-1}(\delta_w)$.'
