- claim_id: elimination-of-suboptimal-low-rank-sampling-floor-and-three-times-weak-oversampling
  kind: mechanism
  statement: As noted in Section 1 (p. 2) and Section 6 (p. 26), setting the tail-thresholding fractions $\delta_s, \delta_{\mathrm{sec}}, \delta_w$ to $0$ in Lemmas 8, 11, and 15 reproduces the suboptimal thresholds of Recht, Xu, & Hassibi [4] and Oymak, Khajehnejad, & Hassibi [12], which require at least $\mu > 1 - \gamma(1)^2 = 1 - \frac{64}{9\pi^2} \approx 0.2795$ even as $\beta \to 0$. Optimizing $\delta_s, \delta_{\mathrm{sec}}, \delta_w \in (0, 1)$ via Equations (45), (77), and (96) drives all three thresholds to $0$ as $\beta \to 0$ and ensures that the weak threshold $\mu_{\mathrm{weak}}(\beta)$ requires at most $3\times$ the normalized model complexity $\theta(\beta) = \beta(2 - \beta)$ across all $\beta \in (0, 1)$.
  evidence:
  - source_id: oh2010-nnm-pdf
    locator: Section 1, p. 2; Section 6, pp. 26-27, Figure 1
    relation: supports
- claim_id: psd-inertia-null-space-conditions-trace-minimization-thresholds-and-uniqueness-gap
  kind: mechanism
  statement: For symmetric positive semidefinite matrices $X \in \mathbb{S}_+^n$ of rank $r = \beta n$ measured by $m = \mu n(n+1)/2$ Gaussian observations, Lemmas 20 and 21 (pp. 19-20) prove that both weak and sectional recovery via trace minimization (Eq. 113) hold if every Hermitian $W \in \mathcal{N}_s(\mathcal{A}) \setminus \{0\}$ satisfies $\operatorname{trace}(W) > 0$ or $\eta_-(\bar{U}^\top W\bar{U}) > 0$, yielding the Lemma 25 / Theorem 5 threshold (Eqs. 137-138) $\mu_{\mathrm{PSD,weak}}(\beta) = 1 - (1 - \beta)^2\left(1 - \frac{\gamma_2(1 - \delta_{wp})}{2}\right) - \frac{(1 - \beta)^3\gamma(1 - \delta_{wp})^2}{2(1 + \beta - (1 - \beta)\delta_{wp})}$ where $\frac{(1 - \beta)\gamma(1 - \delta_{wp})}{1 + \beta - (1 - \beta)\delta_{wp}} = F^{-1}(\delta_{wp})$. Strong PSD recovery holds iff $\operatorname{trace}(W) > 0$ or $\eta_-(W) > r$ (Lemma 26, p. 24), yielding Theorem 6 (Eqs. 150-151) $\mu_{\mathrm{PSD,strong}}(\beta) = \frac{1}{2}\left[\gamma_2(1 - \delta_{sp}) + \gamma_2(2\beta) - \frac{(\gamma(1 - \delta_{sp}) - \gamma(2\beta))^2}{2\beta + 1 - \delta_{sp}}\right]$ for $\beta < 1/2$ with $\frac{\gamma(1 - \delta_{sp}) - \gamma(2\beta)}{2\beta + 1 - \delta_{sp}} = F^{-1}(\delta_{sp})$. By contrast, uniqueness of a PSD solution without trace minimization (Eq. 115) requires $\eta_-(\bar{U}^\top W\bar{U}) > 0$ (weak, Lemma 28) or $\eta_-(W) \ge r + 1$ (strong, Lemma 30), yielding $\mu_{\mathrm{uniq,weak}}(\beta) = 1 - \frac{(1 - \beta)^2}{2} > \frac{1}{2}$ (Lemma 29, Eq. 152) and $\mu_{\mathrm{uniq,strong}}(\beta) = \frac{1 + \gamma_2(2\beta)}{2}$ (Lemma 31, Eq. 154), proving that trace minimization dramatically reduces required sampling below the $50\%$ uniqueness barrier.
