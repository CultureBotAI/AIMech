  relation: supports
claims:
- claim_id: persistent-markov-step
  kind: mechanism
  statement: From the retained latent state z_(k-1), apply a transition Pi_(theta_k) with invariant target
    p(z|y;theta_k), obtaining z_k. Use it in s_k=s_(k-1)+gamma_k(S(y,z_k)-s_(k-1)), then set theta_(k+1)=theta_hat(s_k).
    The kernel can comprise M Metropolis-Hastings steps. Retain rejected states and accepted updates;
    restart or discarded-rejection variants define different simulation schemes.
  evidence:
  - source_id: mcmc-source
    locator: Sections 2.1-2.2, Eq4-5, pp.118-119 / PDF4-5
    relation: supports
  - source_id: saem-source
    locator: Section 6 Eq30 and exact conditional-draw assumption, pp.107-109 / PDF14-16; baseline statistic
      recursion and simulation assumption replaced by the 2004 Markovian extension
    relation: context
- claim_id: proposal-and-equilibration
  kind: scope
  statement: Metropolis-Hastings acceptance includes the reverse-to-forward proposal ratio. When an independence
    proposal is the current latent prior, prior factors cancel and the observed conditional likelihood
    ratio remains. Invariance of the target does not mean one or finitely many transitions from an arbitrary
    state produce that target distribution. The finite two-state example preserves its target yet has
    a different first-step distribution and nonzero conditional sampling error.
  evidence:
  - source_id: mcmc-source
    locator: Section 2.2 Eq5-6, p.119 / PDF5; Section 3 discussion of Markovian noise, p.120 / PDF6; finite
      kernel calculation in discovery ledger
    relation: supports
- claim_id: conditional-convergence-scope
  kind: limitation
  statement: The published analysis imposes the curved-exponential model and smooth maximizer assumptions,
    stochastic-approximation step sizes, compact latent states, bounded sufficient statistics, parameter
    regularity of transitions, uniform ergodicity and compact statistic iterates. Its stationary-set conclusion
    is conditional on these hypotheses. A fixed number of arbitrary MCMC moves, irreducibility alone or
    bounded latent support alone does not supply them.
  evidence:
  - source_id: mcmc-source
    locator: Section 3 SAEM3-prime and Theorem 1, pp.120-123 / PDF6-9; Appendix pp.129-130 / PDF15-16
    relation: supports
- claim_id: source-proof-boundaries
  kind: limitation
  statement: The stated Lemma 1 uses exponents 1/alpha for alpha in (0,1), whereas its appendix derives
    Holder exponents below one. The subsequent lambda=1 conclusion does not directly follow from the displayed
    weaker estimate. The beta deconvolution example also has log(z) and log(1-z) statistics unbounded
    near the endpoints, despite bounded latent support. These discrepancies limit what is certified from
    the printed proof and example; the record does not supply a repaired general convergence proof.
  evidence:
  - source_id: mcmc-source
    locator: Lemma 1 and proof conclusion, p.123 / PDF9; deconvolution sufficient statistics, p.124 /
      PDF10; Appendix Eq25-26, p.130 / PDF16
    relation: supports
limitations:
- A target-invariant transition can mix poorly or be periodic. A finite irreducible periodic flip chain
  demonstrates why irreducibility alone does not imply convergence to equilibrium.
- Markovian simulation errors are not generally conditionally mean-zero at each iteration. The exact-independent-draw
  martingale argument cannot be transplanted without the additional Markovian-noise analysis.
- The theorem’s bounded-statistic condition is separate from compact support. Truncating a latent law
  may change the statistical model and requires an explicit choice; no automatic equivalence to an unbounded
  original model is asserted.
- The deconvolution coordinate pseudocode ambiguously refers to old coordinates within its sweep, and
  its stated uniform beta initialization is inconsistent with ordinary shape parameters. The record specifies
  persistent transitions and does not reproduce those ambiguous implementation details.
- The source’s simulations can reach different local solutions. Its truth-centered empirical squared-error
  matrix is not generally covariance about the estimator mean when bias is present; no finite-sample interval
  coverage or universal speed guarantee is asserted.
- All 52 pages of the two primary papers were read. Finite kernel and algebra checks are curator examples,
  not source software, a historical model fit or independent validation of the general proof.
