name: Markov Chain Monte Carlo Stochastic Approximation Expectation Maximization
aliases:
- MCMC-SAEM
- SAEM-MCMC
- Markovian SAEM
concept_kind: algorithm
definition: A stochastic approximation EM extension that advances a persistent latent-state Markov chain
  targeting the conditional distribution at the current parameter, updates an averaged sufficient statistic
  from that state, and maximizes the resulting complete-data objective.
identity_notes: MCMC-SAEM replaces exact conditional latent draws in base SAEM by transitions from a carried
  state, often a fixed number of Metropolis-Hastings steps per parameter update. This differs from running
  an independent full equilibrium sampler at every iteration, fresh-batch MCEM and posterior sampling
  of the parameter itself. The Markov kernel changes with the fitted parameter. All 442 pinned AIO labels/scoped
  synonyms and 470 preceding native IDs, names and aliases were compared with no normalized identity match.
  Ignored-inclusive whole-checkout fixed-string searches found 218 matched lines in each checkout; context
  windows for all 41 distinct matched texts were read. BayesianDataAugmentation, HiddenMarkovTree and
  IterativeConditionalEstimation mention applications or adjacent estimators, not these identities. All
  225 semantic label/synonym rows were recomputed and verified identical to the preceding fully read inventory.
  Sixteen annotated AIO nodes and outgoing edges comprise fourteen verified prior readings and two new
  readings. Thirty-four contextual YAMLs comprise twenty-seven byte-verified prior readings and seven
  full new readings. Absence is bounded to this pin, maintained corpus and inspected neighborhood. No
  normalized name/alias matches among 442 pinned and 470 maintained records. BayesianDataAugmentation,
  HiddenMarkovTree and IterativeConditionalEstimation matches are applications or adjacent estimators,
  not duplicate generic MCEM, SAEM or MCMC-SAEM records. The inspected sufficient-statistic maximization
  and fixed-data scope distinguish SAEM from averaged parameter gradients, ICE and sequential-task continual
  learning. Persistent Markovian simulation distinguishes the MCMC extension from the exact-conditional-draw
  base theorem.
