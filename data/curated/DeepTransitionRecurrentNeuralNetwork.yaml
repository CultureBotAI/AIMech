limitations:
- The record denotes the transition-depth architecture criterion in the inspected primary paper, including
  compatible combinations; it is not an exclusive DT-only benchmark configuration.
- Shortcuts are optional and experiments use the shortcut variant. Gating, separate recurrent stacking
  and output depth are different design choices.
- One complete 13-page versioned primary paper was visually inspected and reused with its original download
  timestamp and hash. No author code, training or empirical replication; DRAFT remains.
