id: AIMech:DeepTransitionRecurrentNeuralNetwork
name: Deep Transition Recurrent Neural Network
aliases:
- DT-RNN
concept_kind: architecture
definition: A recurrent neural architecture whose state-transition function uses a multilayer perceptron
  with intermediate nonlinear feedforward layers to compute the current hidden state from the previous
  hidden state and current input.
identity_notes: Compared all 442 pinned AIO and 615 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 51, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 22 AIO and 27 native definitions, with every matched definition
  read. 5 full annotated AIO node/edge/generated contexts and 2 full native records were inspected. DT-RNN
  is defined by an MLP hidden-state transition. DOT additionally constrains the output map, whereas DO
  constrains that output map without requiring deep transition. DT(S) is an optional shortcut variant,
  and stacking is compatible. The record denotes the broader transition-depth architecture criterion,
  not an exclusive DT-only benchmark configuration.
definition_evidence:
- source_id: pascanu2014
  locator: Section 3.2.3, PDF p. 4, Figure 2(b); Section 3.3.1, p. 5, unnumbered transition formula
  relation: supports
claims:
- claim_id: within-step-transition
  kind: mechanism
  statement: The transition first combines the prior hidden state and current input, then applies additional
    nonlinear feedforward transformations before producing the current state. The illustrated DT-RNN uses
    one intermediate layer. This depth is inside one time step and is distinct from the depth obtained
    by unfolding recurrence through time.
  evidence:
  - source_id: pascanu2014
    locator: Sections 2–3.3.1, PDF pp. 2–5, Equations 1 and 4, Figure 2(b) and unnumbered MLP formula
    relation: supports
- claim_id: combinable-architecture-scope
  kind: scope
  statement: Transition depth does not require a shallow output map or exclude recurrent stacking. The
    paper explicitly combines deep transition and deep output as DOT-RNN and describes stacking DT-RNNs
    as an orthogonal possibility that it does not investigate. Intermediate transition activations are
    not, by that fact alone, separately recurrent hidden states. DT-RNN is therefore broader than the
    combined DOT construction, and its shorthand is not an exact synonym for DOT.
  evidence:
  - source_id: pascanu2014
    locator: Sections 3.2.3–3.3.3, PDF pp. 4–6, Figure 2 and formal descriptions
    relation: supports
- claim_id: shortcut-and-gradient-limits
  kind: limitation
  statement: Additional nonlinear transition layers add operations to temporal backpropagation. The optional
    DT(S)-RNN variant inserts shortcuts within the transition to create shorter gradient paths. A shortcut
    is not required by the DT definition and does not guarantee a nonzero full derivative, stable optimization
    or indefinite memory. The illustrated scalar cancellation is a constructed boundary case, not an evaluation
    of the authors’ implementation.
  evidence:
  - source_id: pascanu2014
    locator: Section 3.2.3, PDF p. 4, Figure 2(b*); Discussion, p. 10; constructed transition and shortcut
      derivatives
    relation: supports
- claim_id: reported-shortcut-variant-comparisons
  kind: limitation
  statement: The experiments evaluate DT(S), including transition shortcuts, rather than isolating bare
    DT against the same architecture without shortcuts. Its reported music negative log-probabilities
    are lower than the selected shallow RNN on all three datasets, while stacked RNN is lower on MuseData.
    Its Penn Treebank word perplexity is 112.0 versus 117.7 for the shallow RNN and 107.5 for DOT(S).
    Model sizes, parameter counts and training procedures differ, including pretraining for DOT(S) and
    stacked models. These historical comparisons do not isolate transition depth or prove universal improvement.
  evidence:
  - source_id: pascanu2014
    locator: Sections 5.1–5.3, PDF pp. 7–9, Tables 1–3 and training details; constructed table comparisons
    relation: supports
