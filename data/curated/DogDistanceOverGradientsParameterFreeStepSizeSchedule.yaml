claims:
- claim_id: c-r591-weighted-regret-and-locally-bounded-convergence
  kind: mechanism
  statement: For any DoG-like step size eta_t = r_bar_t / sqrt(G'_t) on a closed convex domain X, the r_bar_k-weighted regret satisfies sum_{k=0}^{t-1} r_bar_k <g_k, x_k - x_*> <= r_bar_t (2 d_bar_t + r_bar_t) sqrt(G'_{t-1}) (Lemma 1), and T-DoG with G'_t = 8^4 theta_{T,delta}^2 log_+^2(1 + t l_bar_t^2 / l_bar_0^2)(G_{t-1} + 16 l_bar_t^2) guarantees P(r_bar_T > 3 d_0) <= delta (Proposition 2) and high-probability O(d_0 L_* / sqrt(T)) optimality up to logarithmic factors assuming only pointwise locally bounded stochastic gradients (Theorem 1).
  evidence:
  - source_id: r591-primary-pdf
    locator: Section 3.1-3.3, Lemma 1-3, Propositions 1-2, Corollary 1 & Theorem 1, pp. 4-9
    relation: supports
- claim_id: c-r591-layerwise-ldog-and-polynomial-averaging
  kind: application
  statement: Applying the DoG formula independently to each network layer l as eta_t^l = max_{i<=t} ||x_i^l - x_0^l|| / sqrt(sum_{i<=t} ||g_i^l||^2 + epsilon) (L-DoG) combined with polynomial decay iterate averaging x_bar_t^gamma = (1 - (1+gamma)/(t+gamma)) x_bar_{t-1}^gamma + ((1+gamma)/(t+gamma)) x_t (gamma = 8) matches or outperforms tuned SGD across 79 of 80 vision and language fine-tuning tasks and narrows the performance gap to instance-tuned Adam.
  evidence:
  - source_id: r591-primary-pdf
    locator: Section 4, p. 9; Section 4.1-4.5, pp. 10-15; Appendix E.5, Eq. (19), p. 38
    relation: supports
- claim_id: c-r591-nemirovski-divergence-and-batchnorm-sensitivity
  kind: limitation
  statement: "Untamed DoG is not universally iterate-bounded \u2014 on a pathological variant of Nemirovski's function in R^m, its displacement grows as r_bar_T / d_0 = sqrt(T) / 10 (Appendix C.3) \u2014 and in deep networks with batch normalization, scale invariance can make DoG sensitive to overly small initial movement sizes r_epsilon."
  evidence:
  - source_id: r591-primary-pdf
    locator: Section 3.2, p. 7; Section 4.3, p. 12; Appendix C.3, pp. 30-31; Appendix F.4, pp. 45-46
    relation: supports
