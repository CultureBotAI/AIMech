id: AIMech:AMCAccelerationAndModelCompressionOnMobileDevicesWithRL
name: AMC (AutoML for Model Compression and Acceleration on Mobile Devices)
concept_kind: algorithm
review_status: DRAFT
definition: AMC (AutoML for Model Compression) is a reinforcement-learning-based neural network pruning framework that processes a pretrained network layer-by-layer using an 11-dimensional layer state vector s_t = (t, n, c, h, w, stride, k, FLOPs[t], reduced, rest, a_{t-1}) and a continuous-action Deep Deterministic Policy Gradient (DDPG) actor-critic agent to predict each layer's channel or fine-grained pruning sparsity ratio a_t in (0, 1], evaluates post-pruning validation accuracy without fine-tuning as a fast delegate reward, and supports both Resource-Constrained Compression (via duty-bounded action clamping W_duty = alpha*W_all - action_max*W_rest - W_reduced with R_err = -Error) and Accuracy-Guaranteed Compression (via R_FLOPs = -Error * log(FLOPs) or R_Param = -Error * log(#Param)).
identity_notes: Distinct from hand-crafted sensitivity pruning heuristics (Li et al., 2016; He et al., 2017) that ignore cross-layer dependencies, distinct from Runtime Neural Pruning (Lin et al., 2017) which selects coarse 4-action dynamic channel groups per input image without reducing static model size, and distinct from HAQ (AIMech:HAQHardwareAwareAutomatedQuantizationWithMixedPrecision) which allocates mixed-precision quantization bitwidths rather than pruning sparsity ratios.
aliases:
- AMC
- AutoML for Model Compression
- AMC Reinforcement Learning Channel and Fine-Grained Pruning
