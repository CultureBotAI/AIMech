claims:
- claim_id: method
  kind: mechanism
  statement: For a finite site set and specified undirected neighborhood graph, assign clique energies
    phi_c(x_c,y_c) and define p(x,y)=Z^(-1)*exp(-sum_c phi_c(x_c,y_c)), with a finite positive partition
    function. At fixed complete y, the posterior p(x|y) retains clique factors on the same graph; fixing
    x likewise gives a local conditional observation field. Summing over one field can introduce dependencies
    beyond that graph, so neither p(x) nor p(y) is required to retain its Markov structure. A classical
    hidden Markov field p(x)*product_s b_(x_s)(y_s) is recovered by selecting label-clique and site-emission
    energies. This construction permits spatially correlated observation models without separately specifying
    a conditional likelihood whose configuration-dependent normalization could destroy locality of the
    label posterior. Local conditional probabilities support Gibbs sampling of hidden labels and approximation
    of sitewise posterior marginals; preserving the exact model factorization does not make finite sampling
    exact.
