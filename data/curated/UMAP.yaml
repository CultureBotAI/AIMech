name: UMAP
definition: A nonlinear embedding algorithm that constructs a locally scaled, symmetrized nearest-neighbor
  similarity graph and places its vertices in a lower-dimensional space using sampled attractive and repulsive
  updates.
concept_kind: algorithm
identity_notes: UMAP denotes the original nonparametric graph-embedding algorithm, not a guarantee of
  topology preservation, the generic dimensionality-reduction task, t-SNE, or the separately proposed
  Parametric UMAP and density-preserving variants. All 442 pinned AIO labels/scoped synonyms and 109 preceding
  native identities were compared, together with hidden/ignored-inclusive searches of both checkouts;
  source citations and pending frontier mentions were distinguished from existing concept identities.
limitations:
- Neighbor count, metric, local scaling, minimum distance, initialization and sampling choices influence
  the embedding; displayed distances and densities do not generally reproduce those in the input space.
- The nominal all-pairs cross-entropy is not the effective objective of the analyzed negative-sampling
  procedure. The original asymmetric expected update need not be a gradient field; the explicit modified
  loss in Damrich and Hamprecht applies to their symmetrized negative update.
- No general topology-preservation or global-optimization guarantee is asserted. Wegmann’s later preprint
  identifies unresolved theoretical links; the complete categorical proofs were not certified here.
- The evidence concerns the specified papers and their described algorithms, not every current implementation
  or a reproduced benchmark.
