definition_evidence:
- source_id: original-paper
  locator: Sections 3.1–3.2 and 4.1, PDF pp. 14–21, especially graph weights, symmetrization, Definition
    11 and Algorithm 5
  relation: supports
claims:
- claim_id: method-scope
  kind: mechanism
  statement: Compute directed nearest-neighbor weights using exponential distance decay after subtracting
    a local connectivity offset and fitting a local scale. Combine reciprocal weights with the probabilistic
    union formula a + b − ab. Initialize embedding coordinates, commonly spectrally, and update them using
    sampled positive edges and negative samples with a smooth low-dimensional similarity function controlled
    by the minimum-distance parameter. The paper motivates the updates through fuzzy-set cross-entropy;
    their actual sampled dynamics require the qualifications in the follow-up analysis.
  evidence:
  - source_id: original-paper
    locator: Sections 3.1–3.2 and 4.1, PDF pp. 14–21, especially graph weights, symmetrization, Definition
      11 and Algorithm 5
    relation: supports
- claim_id: sampled-update-limit
  kind: limitation
  statement: Damrich and Hamprecht show that the analyzed sampling procedure changes repulsive weights
    and that its asymmetric expected update generally does not correspond to a scalar loss. Their explicit
    effective loss is obtained after also updating negative samples, a symmetrized variant they find qualitatively
    similar in their experiments; it is not an exact objective for every original update.
  evidence:
  - source_id: sampling-analysis
    locator: Sections 3–5, equations (5)–(12), PDF pp. 3–6
    relation: supports
- claim_id: theoretical-scope
  kind: limitation
  statement: Wegmann’s thesis-derived preprint treats the finite metric-realization construction separately
    from the empirical algorithm and identifies further work needed to justify local uniformization, edge-probability
    interpretation and topology preservation. This is a qualified critique of the theoretical justification,
    not evidence that the algorithm has no practical use.
  evidence:
  - source_id: theory-analysis
    locator: Section 5.4 and conclusion, printed pp. 73–75 / PDF pp. 79–81
    relation: supports
