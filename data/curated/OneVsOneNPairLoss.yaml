claims:
- claim_id: method
  kind: mechanism
  statement: Given N>=2 positive pairs (x_i,x_i+) from N distinct classes and embeddings f_i,f_i+, define
    L_ovo=(1/N) sum_i sum_(j!=i) log[1+exp(f_i^T f_j+−f_i^T f_i+)]. Other positive-side examples supply
    N−1 different-class negatives to each anchor. The printed divisor is N, not N(N−1), so it averages
    across anchors while summing each anchor’s pairwise comparisons. In contrast, N-pair-mc places the
    sum over negatives inside a single logarithm. The expression uses dot products without an explicit
    temperature or cosine normalization.
