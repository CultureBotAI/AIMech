id: AIMech:GreeDiTwoStageDistributedSubmodularMaximization
name: GreeDi Two-Stage Distributed Greedy Submodular Maximization
concept_kind: algorithm
review_status: DRAFT
definition: 'GreeDi Two-Stage Distributed Greedy Submodular Maximization is a communication-efficient two-round parallel/MapReduce protocol introduced by Mirzasoleiman, Karbasi, Sarkar, and Krause (2013, 2016) for maximizing a submodular function f : 2^V -> R_+ subject to cardinality or general hereditary constraints zeta across m machines. In Stage 1, the ground set V is partitioned into V_1, ..., V_m and each machine i independently runs the standard greedy algorithm (or a tau-approximate black-box solver X) on V_i to select a candidate subset A_i^{gc}[kappa]; in Stage 2, a single reducer merges B = union_{i=1}^m A_i^{gc}[kappa], runs the greedy/black-box solver on B to obtain A_B^{gc}[kappa], and outputs A^{gd}[m, kappa] = argmax{f(A_{max}^{gc}[kappa]), f(A_B^{gc}[kappa])}.'
identity_notes: Distinct from AIMech:StochasticGreedyLinearTimeMonotoneSubmodularMaximization (Round 348), which accelerates centralized sequential greedy selection by random subsampling on a single machine, and from AIMech:SieveStreamingAndSieveStreamingPlusPlusForSubmodularMaximization (Round 350), which processes elements in a single streaming pass using Geometric marginal-gain thresholds. Also distinct from AIMech:ContinuousGreedyAndMultilinearExtensionForMatroidSubmodularMaximization (Round 349), which solves continuous multilinear relaxations over matroid polytopes centrally rather than two-round distributed MapReduce partitioning.
aliases:
- GreeDi Protocol for Distributed Submodular Maximization
- Two-Round MapReduce Greedy Submodular Maximization
- Mirzasoleiman-Karbasi-Sarkar-Krause GreeDi Algorithm
