id: AIMech:FedPopAndFedSoukBayesianHierarchicalPopulationPersonalizedFederatedLearning
name: FedPop and FedSOUK (Bayesian Mixed-Effects Population Personalized Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A Bayesian mixed-effects population modeling framework and stochastic optimization / compressed Langevin Markov chain Monte Carlo algorithm for personalized federated learning (Kotelevskii, Vono, Durmus, & Moulines 2022, Sections 2-3, Equations 3-11, Algorithm 1, Theorem 1) that decomposes each client i's network into a shared high-dimensional fixed-effect representation phi in R^{d_phi} and a low-dimensional client-specific random-effect parameter z_i in R^d (d << d_phi) drawn from a population prior p(z_i | theta) = N(z_0, Gamma) with hyper-parameters theta = (z_0, Gamma), and maximizes the marginal log-posterior log p(theta, phi | D_{1:b}) (Equations 4-8) via parallel local Unadjusted Langevin Algorithm (ULA) steps z_i^{(t, k+1)} = z_i^{(t, k)} - eta nabla_z U_i(theta^{(t)}, phi^{(t)}, z_i^{(t, k)}) + sqrt(2 eta) xi_i^{(t, k)} (Equation 9) and quantized local fixed-effect gradients uploaded to the server to update phi^{(t+1)} and theta^{(t+1)} (Equations 10-11, Algorithm 1, instantiated as FedSOUL and its compressed variant FedSOUK).
identity_notes: Distinct from pFedBayes (AIMech:PFedBayesPersonalizedFederatedLearningViaVariationalBayesianInference, Zhang et al. 2022), which places a full-dimensional diagonal Gaussian variational distribution over all neural network weights (doubling communication cost) rather than a mixed-effects model with deterministic shared representation phi and low-dimensional Langevin-sampled random effects z_i in R^d (d << d_phi); and distinct from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which computes point-estimate local heads z_i without a shared population prior N(z_0, Gamma), empirical Bayes shrinkage on small-sample clients, or posterior uncertainty quantification.
