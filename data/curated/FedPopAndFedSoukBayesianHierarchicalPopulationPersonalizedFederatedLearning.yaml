claims:
- claim_id: r483-mixed-effects-population-prior-and-compressed-langevin-mechanism
  kind: mechanism
  statement: FedPop models client parameters via shared fixed effects phi and low-dimensional random effects z_i ~ p(z_i | theta) = N(z_0, Gamma) (Equation 4); in each round t of FedSOUL/FedSOUK (Algorithm 1), active clients run K local Langevin Monte Carlo steps on z_i (Equation 9) and I local stochastic gradient steps on phi_i, transmitting only the single final sample z_i^{(t, K)} in R^d and compressed fixed-effect update Q(Delta phi_i^{(t)}) to the server, which updates the population prior theta^{(t+1)} and global representation phi^{(t+1)} (Kotelevskii et al. 2022, Section 3, Equations 8-11, Algorithm 1, pp. 4-6).
  evidence:
  - source_id: r483-primary-pdf
    locator: Section 3 (Equations 8-11, Algorithm 1), pp. 4-6
    relation: supports
- claim_id: r483-non-asymptotic-wasserstein-and-iterate-convergence-scope
  kind: scope
  statement: Under strong convexity and L-smoothness of the negative log-posterior potentials U_i (Assumptions H1-H3) and unbiased quantization Q (Assumption H4), Theorem 1 establishes explicit non-asymptotic bounds on both the optimization error E[||theta^{(t)} - theta^*||_2^2 + ||phi^{(t)} - phi^*||_2^2] and the Wasserstein-2 distance W_2^2 between the empirical Langevin distribution and the true conditional posterior (Kotelevskii et al. 2022, Section 3.2, Theorem 1, p. 6).
  evidence:
  - source_id: r483-primary-pdf
    locator: Section 3.2 (Assumptions H1-H4, Theorem 1, Equation 12), p. 6
    relation: supports
- claim_id: r483-uncertainty-calibration-and-new-client-inference-application
  kind: application
  statement: Applied to personalized federated classification, uncertainty calibration (reliability diagrams), and zero-shot / few-shot new-client generalization by sampling z_{b+1} ~ p(z | theta^{T}) on synthetic regression, CIFAR-10, and CIFAR-100 benchmarks (Kotelevskii et al. 2022, Section 5, Tables 1-2, Figures 2-3).
  evidence:
  - source_id: r483-primary-pdf
    locator: Section 5 (Experiments, Tables 1-2, Figures 2-3), pp. 7-9
    relation: supports
- claim_id: r483-unadjusted-langevin-discretization-bias-limitation
  kind: limitation
  statement: Using a fixed local Langevin step size eta > 0 without Metropolis-Hastings correction introduces an O(eta) discretization bias floor in the asymptotic posterior and hyper-parameter estimates (Theorem 1, Equation 12) unless eta is annealed toward zero (Kotelevskii et al. 2022, Section 3.2, p. 6).
  evidence:
  - source_id: r483-primary-pdf
    locator: Section 3.2 (Theorem 1 & discussion of step-size bias), p. 6
    relation: supports
