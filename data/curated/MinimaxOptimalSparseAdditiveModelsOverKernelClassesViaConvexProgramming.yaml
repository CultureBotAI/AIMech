id: AIMech:MinimaxOptimalSparseAdditiveModelsOverKernelClassesViaConvexProgramming
name: Minimax-Optimal Sparse Additive Models Over Kernel Classes via Convex Programming
concept_kind: mathematical_method
aliases:
- Minimax-Optimal Rates for Sparse Additive Models Over Kernel Classes via Convex Programming (Raskutti,
  Wainwright, & Yu 2012)
- Doubly-Penalized (L2(Q_n), 1) and (H, 1) Second-Order Cone Program Sparse Additive Kernel Estimator
- High-Dimensional RKHS Sparse Additive Model Minimax Rate and Global Boundedness Separation Framework
- Raskutti-Wainwright-Yu Sparse Additive Kernel M-Estimator
definition: Minimax-Optimal Sparse Additive Models Over Kernel Classes via Convex Programming is a non-parametric
  high-dimensional estimation and minimax analysis methodology introduced by Raskutti, Wainwright, and
  Yu (2012, Journal of Machine Learning Research 13:389-427, arXiv:1008.3654v2) for estimating s-sparse
  d-variate additive regression functions f*(x_1, ..., x_d) = sum_{j in S} f*_j(x_j) (|S| = s << d) over
  the class F_{d, s, H} = cup_{|S|=s} H(S) where each zero-mean univariate component f*_j belongs to the
  unit ball B_{H_j}(1) of a reproducing kernel Hilbert space (RKHS) H_j subset L^2(Q) with bounded univariate
  functions ||f_j||_infty <= c ||f_j||_H (Equations 5-6, 15). Given n i.i.d. observations y_i = mu + f*(x_i)
  + w_i (x_i ~ P = Q^d, w_i ~ N(0, 1)), the method minimizes the doubly-penalized least-squares cost functional
  L(f) = (1/(2n)) sum_{i=1}^n (y_i - y_bar_n - f(x_i))^2 + lambda_n ||f||_{n, 1} + rho_n ||f||_{H, 1}
  subject to f = sum_{j=1}^d f_j and ||f_j||_H <= 1 (Equations 8-10), combining an empirical (L^2(Q_n),
  1) sparsity penalty ||f||_{n, 1} := sum_{j=1}^d ||f_j||_n with a Hilbert (H, 1) smoothness penalty ||f||_{H,
  1} := sum_{j=1}^d ||f_j||_H, which reduces by the representer theorem to a polynomial-time second-order
  cone program (SOCP) in (R^n)^d over empirical kernel matrices K^j in R^{n x n} (Equation 11). In terms
  of the critical univariate rate nu_n > 0 solving 40 nu_n^2 >= Q_{sigma, n}(nu_n) := (1/sqrt(n)) [sum_{l=1}^infty
  min{nu_n^2, mu_l}]^{1/2} (Equations 12-13) and gamma_n := kappa max{nu_n, sqrt((log d)/n)} (Equation
  14), Theorem 1 (Equation 16) and Theorem 2 (Equations 22-23) establish matching minimax upper and lower
  bounds M_P(F_{d, s, H}) = Theta((s log d)/n + s nu_n^2) in both L^2(P) and L^2(P_n) norms without requiring
  global boundedness of multivariate functions in F_{d, s, H}, while Theorem 3 and Corollary 3 (Equations
  25-27) prove that imposing a global sup-norm bound ||f||_infty <= B over F*_{d, s, H}(B) strictly accelerates
  the minimax rate by a factor K_B(s, n) -> 0 whenever s = Omega(sqrt(n)).
identity_notes: 'Resolved against all 442 pinned AIO records and 624 maintained AIMech records. Distinct
  from AIMech:MinimaxEstimationRatesForHighDimensionalLinearRegressionOverLqBalls (Raskutti, Wainwright,
  & Yu 2011, IEEE Trans. Inf. Theory 57(10):6976-6994, arXiv:0910.2042v1, which analyzes parametric high-dimensional
  linear regression Y = X beta* + w over hard and weak sparsity l_q-balls B_q(R_q) in R^d), from AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework
  (Negahban, Ravikumar, Wainwright, & Yu 2012, Statistical Science 27(4):538-557, arXiv:1010.2731v1/v3,
  which analyzes finite-p parametric M-estimators with single decomposable norms), and from AIO:LassoRegression
  and AIO:SupportVectorMachine: Raskutti, Wainwright, & Yu (2012, JMLR 13:389-427, arXiv:1008.3654v2)
  formulate the non-parametric doubly-penalized (||.||_{n, 1} + ||.||_{H, 1}) RKHS sparse additive M-estimator
  and its SOCP reduction (Equation 11), prove empirical-to-L^2(P) restricted strong convexity for unbounded
  multivariate additive classes via Chung-Lu one-sided concentration and Sudakov minoration (Lemma 3),
  establish matching minimax lower bounds via (N+1)-ary Hamming packings of RKHS balls (Lemma 4, Theorem
  2), and prove the s = Omega(sqrt(n)) minimax separation between univariately bounded and globally bounded
  sparse additive Sobolev classes (Theorem 3, Corollary 3).'
