claims:
- claim_id: doubly-penalized-socp-estimator-and-unbounded-rkhs-minimax-upper-bounds
  kind: mechanism
  statement: 'For any additive function f = sum_{j=1}^d f_j with f_j in B_{H_j}(1) subset L^2(Q), the
    regularized M-estimator (Equations 8-10) minimizes L(f) = (1/(2n)) sum_{i=1}^n (y_i - y_bar_n - f(x_i))^2
    + lambda_n sum_{j=1}^d ||f_j||_n + rho_n sum_{j=1}^d ||f_j||_H subject to ||f_j||_H <= 1 for all j
    = 1, ..., d. By the representer theorem, f_hat(z_1, ..., z_d) = sum_{i=1}^n sum_{j=1}^d alpha_hat_{ij}
    K^j(z_j, x_{ij}), reducing (10) to the polynomial-time second-order cone program (SOCP) in Equation
    (11) over weights alpha_j in R^n with alpha_j^T K^j alpha_j <= 1. Letting nu_n > 0 be the smallest
    positive root of 40 nu_n^2 >= Q_{sigma, n}(nu_n) := (1/sqrt(n)) [sum_{l=1}^infty min{nu_n^2, mu_l}]^{1/2}
    (Equations 12-13) and gamma_n := kappa max{nu_n, sqrt((log d)/n)} (Equation 14), for regularization
    parameters lambda_n >= 16 gamma_n and rho_n >= 16 gamma_n^2: (1) Lemma 1 (p. 15, Equation 30; proved
    via Gaussian concentration and peeling in Appendix B, pp. 24-27) bounds |(1/n) sum_{i=1}^n w_i Delta_hat_j(x_{ij})|
    <= 8 gamma_n^2 ||Delta_hat_j||_H + 8 gamma_n ||Delta_hat_j||_n uniformly over j = 1, ..., d; (2) Lemma
    2 (p. 15, Equation 33; proved in Appendix C, p. 28) exploits decomposability of ||.||_{n, 1} and ||.||_{H,
    1} to restrict the error Delta_hat = f_hat - f* to lambda_n ||Delta_hat||_{n, 1} + rho_n ||Delta_hat||_{H,
    1} <= 4 lambda_n ||Delta_hat_S||_{n, 1} + 4 rho_n ||Delta_hat_S||_{H, 1} + (1/2) s gamma_n^2; and
    (3) Lemma 3 (p. 17, Equation 42; proved in Appendix D, pp. 29-31, by bounding E[g^4(x)] <= 4 delta_tilde_n^2
    + 6 delta_tilde_n^4 <= 10 delta_tilde_n^2 across independent zero-mean components and applying Chung-Lu
    one-sided concentration with Sudakov minoration) certifies ||g||_n^2 >= ||g||_2^2 / 2 without global
    boundedness. Theorem 1 (p. 8, Equation 16) proves P[max{||f_hat - f*||_2^2, ||f_hat - f*||_n^2} >=
    C(s lambda_n^2 + s rho_n)] <= c_1 exp(-c_2 n gamma_n^2), yielding O((s log d)/n + s m / n) for rank-m
    kernels (Corollary 1, Equation 17) and O((s log d)/n + s n^{-2 alpha / (2 alpha + 1)}) for Sobolev
    kernels with mu_k ~ k^{-2 alpha}, alpha > 1/2 (Corollary 2, Equation 18).'
