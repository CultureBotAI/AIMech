- claim_id: sparse-additive-packing-entropy-and-matching-minimax-lower-bounds
  kind: mechanism
  statement: 'For the sparse additive function class F_{d, s, H} with sparsity s <= d/4, Lemma 4 (Section
    4.2.2, p. 19, Equations 45-46; proved in Appendix E, pp. 31-33, by constructing an (N+1)-ary Hamming
    code over S = {u in {0, 1, ..., N}^d : ||u||_0 = s} with pairwise Hamming distance >= s/2 and cardinality
    N* >= (1/2) ((d - s)/(s/2))^{s/2} N^{s/2} where N = M(delta / sqrt(s); B_H(1), ||.||_2) - 1) proves
    that the L^2(P) packing entropy of F_{d, s, H} scales as log M(delta; F_{d, s, H}, ||.||_2) = Theta(s
    log(d/s) + s log M(delta / sqrt(s); B_H(1), ||.||_2)). Combining Lemma 4 with generalized Fano mutual-information
    bounds (for logarithmic univariate metric entropy log M(epsilon; B_H(1), L^2(P)) ~ m log(1/epsilon),
    Equation 20) and Yang-Barron covering-entropy mutual-information bounds (for polynomial univariate
    metric entropy log M(epsilon; B_H(1), L^2(P)) ~ (1/epsilon)^{1/alpha}, Equation 21), Theorem 2 (Section
    3.3, p. 10, Equations 22-23; proved in Sections 4.2.3-4.2.4, pp. 19-21) establishes that with probability
    greater than 1/2, the minimax L^2(P) risk M_P(F_{d, s, H}) := inf_{f_hat} sup_{f* in F_{d, s, H}}
    ||f_hat - f*||_2^2 is lower bounded by C {(s log(d/s))/n + s m / n} for rank-m classes and C {(s log(d/s))/n
    + s (1/n)^{2 alpha / (2 alpha + 1)}} for alpha-smooth Sobolev classes, matching Corollaries 1 and
    2 up to constant factors throughout the sub-linear sparsity regime log d = O(log(d/s)).'
