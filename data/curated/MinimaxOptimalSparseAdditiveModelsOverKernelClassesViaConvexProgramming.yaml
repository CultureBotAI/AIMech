- claim_id: global-boundedness-effective-dimension-reduction-and-minimax-rate-acceleration
  kind: scope
  statement: When the additional global uniform boundedness condition sup_{f in F*_{d, s, H}(B)} ||f||_infty
    <= B (with B independent of s and d, as assumed in Koltchinskii & Yuan 2010) is imposed on sparse
    additive models over a Sobolev RKHS H with eigenvalues mu_k ~ k^{-2 alpha} (alpha > 1/2) and uniformly
    bounded eigenfunctions ||phi_k||_infty <= C, Lemma 10 (Appendix F, p. 33) exploits ||f||_infty = sum_{j
    in S} ||f_j||_infty on product domains to prove that the truncated Fourier coefficients satisfy sum_{j
    in S} sum_{k=1}^M |a_{j, k}| <= B sqrt(M), and Lemma 11 (p. 34, setting M = s^{1/alpha}) bounds the
    local Gaussian complexity over H(S, 2B) by 8 B C sqrt((s^{1/alpha} log s)/n). Defining delta_n :=
    max{sqrt((s log(d/s))/n), B^{1/2} ((s^{1/alpha} log s)/n)^{1/4}} (Equation 25) and K_B(s, n) := B
    sqrt(log s) (s^{-1/(2 alpha)} n^{1/(4 alpha + 2)})^{2 alpha - 1} (Equation 26), Theorem 3 (Section
    3.5, p. 12, Equation 27; proved in Section 4.3, pp. 21-22, via Lemmas 5-6) proves M_P(F*_{d, s, H}(B))
    <= kappa^2 (1 + B) C s n^{-2 alpha / (2 alpha + 1)} (K_B(s, n) + n^{-1/(2 alpha + 1)} log(d/s)) with
    probability at least 1 - 2 exp(-c_1 n delta_n^2). Because K_B(s, n) -> 0 whenever s = Omega(sqrt(n)),
    Corollary 3 (p. 13) proves M_P(F_{d, s, H}) / M_P(F*_{d, s, H}(B)) -> +infty (for example, when alpha
    = 2 and s = Theta(n^{4/5}), M_P(F_{d, s, H}) = Omega(1) fails to vanish whereas M_P(F*_{d, s, H}(B))
    = O(n^{-1/5} sqrt(log n)) -> 0), demonstrating that global boundedness is a stringent high-dimensional
    restriction.
