id: AIMech:SomeInvalidSomeValidInstrumentalVariablesEstimatorAndMajorityRuleIdentifiability
name: Some Invalid Some Valid Instrumental Variables Estimator (sisVIVE) and 50% Majority-Rule Identifiability
concept_kind: algorithm
review_status: DRAFT
definition: 'An $\ell_1$-penalized instrumental variables methodology and structural identifiability theory (introduced by Hyunseung Kang, Anru Zhang, T. Tony Cai, and Dylan S. Small in 2016) that estimates the causal effect $\beta^*$ of an endogenous exposure $D_i$ on an outcome $Y_i$ in the presence of potentially invalid instruments $\mathbf{Z}_{i.} \in \mathbb{R}^L$ without prior knowledge of which instruments are valid. Under the Additive Linear, Constant Effects (ALICE) potential outcomes model, the observed outcome satisfies $Y_i = \mathbf{Z}_{i.}^T\boldsymbol{\alpha}^* + D_i\beta^* + \epsilon_i$ with $\mathbb{E}(\epsilon_i | \mathbf{Z}_{i.}) = 0$ (Equation 3), where $\boldsymbol{\alpha}^* = \boldsymbol{\phi}^* + \boldsymbol{\psi}^*$ aggregates direct pleiotropic effects ($\boldsymbol{\phi}^*$) and unmeasured confounder associations ($\boldsymbol{\psi}^*$), so instrument $j \in \{1, \dots, L\}$ is valid if and only if $\alpha_j^* = 0$ (Definition 1, p. 10). Given the reduced-form moment equations $\boldsymbol{\Gamma}^* = \boldsymbol{\alpha}^* + \boldsymbol{\gamma}^*\beta^*$ (Equation 7) and a sparsity bound $s = \|\boldsymbol{\alpha}^*\|_0 < U$, Theorem 1 (p. 13) and Corollary 1 (p. 14) establish that $(\boldsymbol{\alpha}^*, \beta^*)$ is uniquely identified without knowing the valid subset whenever $U \le L/2$ (the 50% majority rule: strictly more than half of the instruments are valid). The sisVIVE estimator (Equation 10, p. 15) solves the convex program $(\hat{\boldsymbol{\alpha}}_\lambda, \hat{\beta}_\lambda) \in \arg\min_{\boldsymbol{\alpha}, \beta} \frac{1}{2}\|\mathbf{P}_{\mathbf{Z}}(\mathbf{Y} - \mathbf{Z}\boldsymbol{\alpha} - \mathbf{D}\beta)\|_2^2 + \lambda\|\boldsymbol{\alpha}\|_1$ where $\mathbf{P}_{\mathbf{Z}} = \mathbf{Z}(\mathbf{Z}^T\mathbf{Z})^{-1}\mathbf{Z}^T$, which reduces algebraically to a two-step Lasso on $\mathbf{P}_{\hat{\mathbf{D}}^\perp}\mathbf{Z}$ followed by linear projection onto $\hat{\mathbf{D}} = \mathbf{P}_{\mathbf{Z}}\mathbf{D}$ (Theorem 3, Equation 17, p. 21) and is solvable along the entire regularization path in $O(nL^2)$ via LARS.'
identity_notes: Resolved against all 442 pinned AIO concepts and 666 maintained AIMech concepts. Distinct from `AIMech:SelfTuningPivotalHighDimensionalInstrumentalVariablesAndSensitivityConfidenceSets` (Gautier & Rose 2011/2021, which solves a self-normalized conic program for high-dimensional endogenous structural parameters $\beta \in \mathbb{R}^{d_X}$ and scale $\sigma$ rather than proving the Theorem 1 / Corollary 1 50% majority-rule combinatorial identifiability criterion on $\boldsymbol{\Gamma}^* = \boldsymbol{\alpha}^* + \boldsymbol{\gamma}^*\beta^*$ and the Theorem 3 exact two-step orthogonal-projection Lasso reduction $\mathbf{P}_{\hat{\mathbf{D}}^\perp}\mathbf{Z}$ for a scalar exposure with invalid instruments), distinct from `AIMech:SelfNormalizedLassoOptimalInstrumentEstimationAndSupNormWeakIdentificationTesting` (Belloni, Chen, Chernozhukov, & Hansen 2012, which assumes all instruments satisfy the exclusion restriction $\mathbb{E}[\epsilon_i | Z_i] = 0$ and uses first-stage Lasso to select strong instruments from a large valid set rather than penalizing structural exclusion-restriction violations $\boldsymbol{\alpha}^*$), and distinct from `AIMech:PenalizedFocusedGeneralizedMethodOfMomentsForHighDimensionalEndogenousRegression` (Fan & Liao 2014, which estimates high-dimensional sparse structural regressors under valid over-identifying moments via nonconcave penalized Focused GMM).
