claims:
- claim_id: combinatorial-consistency-criterion-and-fifty-percent-majority-rule
  kind: mechanism
  statement: 'Given reduced-form moments $\boldsymbol{\Gamma}^* = E(\mathbf{Z}^T\mathbf{Z})^{-1}E(\mathbf{Z}^T\mathbf{Y}) = \boldsymbol{\alpha}^* + \boldsymbol{\gamma}^*\beta^*$ and $\boldsymbol{\gamma}^* = E(\mathbf{Z}^T\mathbf{Z})^{-1}E(\mathbf{Z}^T\mathbf{D})$ with $\gamma_j^* \ne 0$ ($j = 1, \dots, L$) and at most $s = \|\boldsymbol{\alpha}^*\|_0 < U$ invalid instruments (Equation 7), Theorem 1 (Section 3.1, p. 13) proves that $(\boldsymbol{\alpha}^*, \beta^*)$ has a unique solution in $\mathcal{C}_U = \{(\boldsymbol{\alpha}, \beta) : \|\boldsymbol{\alpha}\|_0 < U\}$ if and only if there do not exist two subsets $C_m, C_{m''} \subseteq \{1, \dots, L\}$ of size $|C_m| = |C_{m''}| = L - U + 1$ with constants $q_m \ne q_{m''}$ such that $\gamma_j^* q_m = \Gamma_j^*$ for $j \in C_m$ and $\gamma_j^* q_{m''} = \Gamma_j^*$ for $j \in C_{m''}$. By pigeonhole overlap $|C_m \cap C_{m''}| \ge 2(L - U + 1) - L = L - 2U + 2 \ge 2$ whenever $U \le L/2$, Corollary 1 (p. 14) establishes that $s < U \le L/2$ is a universal sufficient condition for unique identifiability of $(\boldsymbol{\alpha}^*, \beta^*)$ without knowing which instruments are valid.'
  evidence:
  - source_id: kzcs2016-sisvive-pdf
    locator: Section 3.1, pp. 10-15, Equations (7)-(9), Theorem 1, Corollary 1; Appendix E.1-E.2, pp. 61-63
    relation: supports
- claim_id: two-step-orthogonal-projection-lasso-reduction-and-lars-homotopy
  kind: mechanism
  statement: 'Theorem 3 (Section 3.4, p. 21, Equation 17) proves that minimizing the joint sisVIVE criterion $\frac{1}{2}\|\mathbf{P}_{\mathbf{Z}}(\mathbf{Y} - \mathbf{Z}\boldsymbol{\alpha} - \mathbf{D}\beta)\|_2^2 + \lambda\|\boldsymbol{\alpha}\|_1$ (Equation 10) is algebraically equivalent to the two-step estimator: Step 1 solves the standard Lasso problem $\hat{\boldsymbol{\alpha}}_\lambda \in \arg\min_{\boldsymbol{\alpha} \in \mathbb{R}^L} \frac{1}{2}\|\mathbf{P}_{\hat{\mathbf{D}}^\perp}\mathbf{P}_{\mathbf{Z}}\mathbf{Y} - \mathbf{P}_{\hat{\mathbf{D}}^\perp}\mathbf{Z}\boldsymbol{\alpha}\|_2^2 + \lambda\|\boldsymbol{\alpha}\|_1$, and Step 2 computes $\hat{\beta}_\lambda = \frac{\hat{\mathbf{D}}^T(\mathbf{Y} - \mathbf{Z}\hat{\boldsymbol{\alpha}}_\lambda)}{\|\hat{\mathbf{D}}\|_2^2}$ where $\hat{\mathbf{D}} = \mathbf{P}_{\mathbf{Z}}\mathbf{D}$ and $\mathbf{P}_{\hat{\mathbf{D}}^\perp} = \mathbf{I} - \hat{\mathbf{D}}\hat{\mathbf{D}}^T / \|\hat{\mathbf{D}}\|_2^2$, enabling the entire regularization path $(\hat{\boldsymbol{\alpha}}_\lambda, \hat{\beta}_\lambda)$ for all $\lambda > 0$ to be computed in $O(nL^2)$ via LARS.'
  evidence:
  - source_id: kzcs2016-sisvive-pdf
    locator: Section 3.2, p. 15, Equations (10)-(11); Section 3.4, p. 21, Theorem 3, Equation (17)
    relation: supports
- claim_id: nonasymptotic-causal-effect-bounds-under-restricted-isometry-and-mutual-incoherence
  kind: scope
  statement: "Let $\\delta_{2s}^-(\\mathbf{Z}), \\delta_{2s}^+(\\mathbf{Z})$ and $\\delta_{2s}^+(\\mathbf{P}_{\\hat{\\mathbf{D}}}\\mathbf{Z})$ denote the restricted isometry constants of $\\mathbf{Z}$ and $\\mathbf{P}_{\\hat{\\mathbf{D}}}\\mathbf{Z}$ (Equation 12). Under the condition $2\\delta_{2s}^-(\\mathbf{Z}) > \\delta_{2s}^+(\\mathbf{Z}) + 2\\delta_{2s}^+(\\mathbf{P}_{\\hat{\\mathbf{D}}}\\mathbf{Z})$ and regularization $\\lambda \\ge 3\\|\\mathbf{Z}^T\\mathbf{P}_{\\hat{\\mathbf{D}}^\\perp}\\boldsymbol{\\epsilon}\\|_\\infty$, Theorem 2 (Section 3.3, pp. 18\u201319, Equation 13) establishes the non-asymptotic causal-effect error bound $|\\hat{\\beta}_\\lambda - \\beta^*| \\le \\frac{|\\hat{\\mathbf{D}}^T\\boldsymbol{\\epsilon}|}{\\|\\hat{\\mathbf{D}}\\|_2^2} + \\frac{1}{\\|\\hat{\\mathbf{D}}\\|_2}\\frac{(4/3\\sqrt{5})\\lambda\\sqrt{s\\delta_{2s}^+(\\mathbf{P}_{\\hat{\\mathbf{D}}}\\mathbf{Z})}}{2\\delta_{2s}^-(\\mathbf{Z}) - \\delta_{2s}^+(\\mathbf{Z}) - 2\\delta_{2s}^+(\\mathbf{P}_{\\hat{\\mathbf{D}}}\\mathbf{Z})}$. Under pairwise instrument coherence $\\mu = \\max_{i \\ne j}|\\mathbf{Z}_{.i}^T\\mathbf{Z}_{.j}| / (\\|\\mathbf{Z}_{.i}\\|_2\\|\\mathbf{Z}_{.j}\\|_2)$ and instrument-strength balancing $\\rho = \\max_j \\|\\hat{\\mathbf{D}}^T\\mathbf{Z}_{.j}\\|_2 / (\\|\\hat{\\mathbf{D}}\\|_2\\|\\mathbf{Z}_{.j}\\|_2)$ (Equation 14) with $s < \\min(\\frac{1}{12\\mu}, \\frac{1}{10\\rho^2})$ (Equation 15), Corollary 2 (pp. 19\u201320, Equation 16) proves $|\\hat{\\beta}_\\lambda - \\beta^*| \\le \\frac{|\\hat{\\mathbf{D}}^T\\boldsymbol{\\epsilon}|}{\\|\\hat{\\mathbf{D}}\\|_2^2} + \\frac{1}{\\|\\hat{\\mathbf{D}}\\|_2}\\frac{(4\\sqrt{105}/9)\\lambda s\\rho}{1 - s(5\\rho^2 + 6\\mu)}$."
  evidence:
  - source_id: kzcs2016-sisvive-pdf
    locator: Section 3.3, pp. 16-20, Equations (12)-(16), Theorem 2, Corollary 2; Appendix E.3-E.4, pp. 64-72
    relation: supports
