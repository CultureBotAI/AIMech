aio_mappings:
- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: For a given length, the observed-word variables have ordered directed conditional factors,
    giving a fully visible Bayesian network. The AIO target is broader than this shared additive-embedding
    and tree-output architecture. Deterministic topic features do not add stochastic latent nodes.
- target: AIO:ProbabilisticTopicModel
  relation: related_match
  rationale: The source explicitly develops a probabilistic document/topic representation model, matching
    the topical-analysis context. The pinned AIO target lies in a task hierarchy and mentions themes and
    temporal changes, whereas this native identity specifies one architecture without requiring temporal
    modeling. A related match preserves that abstraction difference without forcing an architecture-to-task
    subclass or equating hidden features with normalized topic distributions.
