claims:
- claim_id: method
  kind: mechanism
  statement: 'For a document of given length D, form h_i=sigmoid(c+sum_(k<i) W[:,v_k]); the same word
    embedding and output parameters are reused across positions, and the preactivation is updated by adding
    the newly observed word’s embedding. A flat softmax can normalize the next-word distribution. The
    paper’s final model replaces it with a binary tree whose leaves are vocabulary words: each internal
    node predicts the probability of taking its right branch, and a word probability is the product of
    its observed left/right branch probabilities. Multiply all observed-word conditionals to obtain a
    normalized probability over length-D sequences. Train by differentiating their negative log likelihood.
    After all words, h(v)=sigmoid(c+sum_i W[:,v_i]) is an order-invariant document representation; tanh
    is also tested. For count-vector input, the paper samples word occurrences without replacement to
    produce uniformly random distinct orderings and trains on those sequences. Its separate symmetrized
    sequence model averages probabilities over distinct permutations; training on sampled order log losses
    is a surrogate for that log mixture. A count-vector probability instead sums the unsymmetrized sequence
    probabilities over its distinct permutations.'
