name: Document NADE
definition: A neural autoregressive document model that predicts successive words from shared additive
  embeddings of the preceding words, using normalized word conditionals and a deterministic document representation.
concept_kind: architecture
identity_notes: 'This is Larochelle and Lauly’s original Document NADE. The final construction uses binary-tree
  word probabilities, with a flat-softmax intermediate derivation. It is inspired by Replicated Softmax
  but is a separately normalized directed model with deterministic hidden features, not the same undirected
  latent-variable model. Its full-document representation is invariant to word permutation, while its
  unsymmetrized sequence probability need not be. Supervised and distributional-prior extensions require
  separate scope decisions. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 349 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 5 and 5 lines respectively. All 3 unique matched line
  contents were inspected in full: the prior NADE-variant lead, RNADE source URL and previous review exclusion,
  not existing candidate records. Exact checkout counts and differences are retained in the ledger. Seventeen
  exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Order invariance of the summed document representation does not imply exchangeability of the sequence
  likelihood. The symmetrized probability of each sequence differs from its count-vector probability by
  the number of distinct permutations; duplicate words change that number.
- For a word whose tree path has length L, conditional output work is O(HL). The claimed logarithmic vocabulary
  scaling requires suitable tree depth or average depth; a full binary tree alone can have linear depth.
  The record does not assert a logarithmic worst case for every full tree.
- The main paper’s text below Equation (11) retains vi=1 in the joint product although words are categorical.
  The curated likelihood uses the observed word and its branch path, consistent with Equations (9) and
  (11) and the supplement’s probability computation.
- For Bernoulli tree training, the negative-log-likelihood derivative is the probability of the right
  branch minus the observed branch indicator. The supplement’s p(actual branch)-indicator notation must
  not be read literally as the probability of the observed left branch when that indicator is zero. No
  author implementation behavior is inferred.
- The stated model is conditional on document length and does not supply a learned document-length distribution.
  Shared additive prefix features discard order within the observed prefix. Hidden topic features are
  deterministic representations, not posterior latent-topic probabilities.
- No classification/retrieval advantage, semantic quality guarantee, exact symmetrized-mixture training
  gradient or implementation certification is asserted.
