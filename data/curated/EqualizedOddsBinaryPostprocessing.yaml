name: Equalized-odds postprocessing for binary predictors
definition: A randomized postprocessing algorithm that uses a binary predictor and protected-group membership
  to minimize expected label loss subject to equal false-positive and true-positive rates across groups,
  within predictors derived from those inputs.
concept_kind: algorithm
identity_notes: This record selects the Section 4.1 binary-input linear program. It is distinct from the
  EqualizedOdds criterion and from the continuous-score threshold construction in Section 4.2. Equal-opportunity-only
  constraints define a relaxation, not an alias here. All 442 pinned AIO labels/scoped synonyms and 99
  preceding native identities were compared, together with hidden/ignored-inclusive searches of both checkouts;
  source citations and pending frontier mentions were distinguished from existing concept identities.
limitations:
- Optimality is over randomized predictors derived from the supplied binary prediction and group for the
  specified distribution and loss, not every possible predictor using raw features.
- Fitting needs target labels and group information; deployment needs group membership. Empirical estimates
  and distribution changes can invalidate population parity.
- The four-parameter statement assumes two groups and binary predictions; it does not assert that a general
  score-valued postprocessor has four parameters.
- Equal conditional error rates do not establish equal accuracy, individual fairness or a universal fairness
  judgment. The printed proof is not reproduced as implementation code.
