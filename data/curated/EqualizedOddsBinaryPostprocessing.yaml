claims:
- claim_id: method-scope
  kind: mechanism
  statement: For binary groups and binary predictions, optimize four probabilities of outputting one,
    indexed by the original prediction and group. The joint distribution of original prediction, group
    and target supplies linear loss and parity constraints. The feasible group error-rate pairs form the
    convex hull of the original classifier, its complement and the two constant classifiers; their intersection
    supplies equalized-odds solutions. Prediction uses the original output and group, with randomization
    as needed.
