claims:
- claim_id: learning-method
  kind: mechanism
  statement: The practical method estimates a surrogate objective from sampled trajectories and constrains
    the average divergence from the old policy, using an approximate constrained update rather than evaluating
    a maximum-divergence constraint at every state.
