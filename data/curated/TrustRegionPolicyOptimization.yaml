name: Trust region policy optimization
aliases:
- TRPO
definition: A policy-optimization method that optimizes a surrogate objective while constraining the change
  in policy by a trust region based on Kullback–Leibler divergence.
concept_kind: algorithm
identity_notes: TRPO's constrained policy update differs from PPO's clipped surrogate or adaptive penalty
  variants. It is an optimization procedure, not a trained policy instance.
limitations:
- The paper distinguishes its theoretical improvement scheme from practical approximations; this record
  does not guarantee monotonic improvement for every practical update.
- Single-path and vine sampling have different access requirements; the latter assumes the ability to
  restore sampled states.
