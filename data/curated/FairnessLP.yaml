name: Fairness LP
definition: A finite-population optimization procedure that assigns outcome distributions to individuals
  to minimize expected loss under pairwise Lipschitz similarity constraints, expressible as a linear program
  for the total-variation or relative-infinity distribution distances used by Dwork et al.
concept_kind: algorithm
identity_notes: The source names this optimization formulation Fairness LP. It is a procedure enforcing
  LipschitzIndividualFairness, not the criterion itself, a generic linear-program solver or a learned
  similarity metric. The two documented distribution-distance choices are retained as configurations of
  one formulation. All 442 pinned AIO labels/scoped synonyms and 99 preceding native identities were compared,
  together with hidden/ignored-inclusive searches of both checkouts; source citations and pending frontier
  mentions were distinguished from existing concept identities.
limitations:
- The individual metric and utility loss are inputs; solving the program does not establish that either
  is normatively appropriate.
- The cited polynomial-size result concerns a finite set of individuals and outcomes with the specified
  distribution distances, not arbitrary metrics on output distributions or an unrestricted population.
- Extrapolating from sampled individuals to unseen individuals is a separate challenge explicitly noted
  in Remark 2.1.
- Individual constraints do not automatically imply demographic parity without additional assumptions
  about the population and metric.
