claims:
- claim_id: method-scope
  kind: mechanism
  statement: Choose a probability vector for each individual and minimize the supplied expected loss.
    Enforce normalization, nonnegativity and distribution distances bounded by the supplied task metric
    for every individual pair. Total-variation constraints admit a linear-program formulation; the relative-infinity
    choice yields pairwise linear probability-ratio bounds with fixed metric-dependent coefficients.
