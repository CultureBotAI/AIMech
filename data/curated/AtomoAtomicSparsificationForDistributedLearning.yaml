claims:
- claim_id: r420-kkt-water-filling-variance-minimization-and-s-balanced-closed-form
  kind: mechanism
  statement: Minimizing E[||g - g_hat||^2] = sum_{i=1}^n lambda_i^2 (1 / p_i - 1) (Lemma 2) subject to 0 < p_i <= 1 and sum_{i=1}^n p_i <= s yields p_i = min(1, |lambda_i| s / ||lambda||_1) with minimum variance ||lambda||_1^2 / s - ||lambda||_2^2 whenever lambda is s-balanced (s <= ||lambda||_1 / ||lambda||_infty, Lemma 4), and otherwise solves the exact water-filling active set in O(n log n) time by sorting |lambda_{(1)}| >= ... >= |lambda_{(n)}| and capping leading atoms at p_i = 1 (Algorithm 1, Theorem 5).
  evidence:
  - source_id: r420-primary-pdf
    locator: Section 3.1 Minimizing Variance (Lemmas 2-4, Theorem 5, Algorithm 1) & Appendix A.1-A.4
    relation: supports
- claim_id: r420-spectral-atomo-nuclear-norm-dominance-over-entrywise-sparsification
  kind: mechanism
  statement: For a matrix gradient X in R^{n x m} with singular value decomposition X = sum_{i=1}^{min(n,m)} sigma_i u_i v_i^T, Spectral-Atomo achieves variance ||X||_*^2 / s_2 - ||X||_F^2 (Theorem 7), and Lemma 8 proves ||X||_* <= ||X||_{1,1} <= sqrt(n m) ||X||_* with equality ||X||_* = ||X||_{1,1} / sqrt(n + m) on rank-1 flat matrices, establishing up to an O(n + m) communication reduction at equal estimator variance over Entry-wise Atomo.
  evidence:
  - source_id: r420-primary-pdf
    locator: Section 5 Entry-wise vs. SVD Sparsification (Theorem 7, Lemma 8) & Appendix A.6
    relation: supports
- claim_id: r420-svd-decomposition-computational-overhead-limitation
  kind: limitation
  statement: Spectral-Atomo requires computing the singular value decomposition of each layer's gradient matrix on every worker at each iteration, incurring O(min(m n^2, m^2 n)) local computation overhead.
  evidence:
  - source_id: r420-primary-pdf
    locator: Section 5-6 Discussion of SVD Overhead and Truncated SVD
    relation: supports
- claim_id: r420-distributed-resnet18-vgg11-and-svm-training-application
  kind: application
  statement: Applied to distributed synchronous SGD training of ResNet-18, VGG-11, and multi-class SVMs on CIFAR-10, CIFAR-100, SVHN, and ImageNet, reducing communication time and faster wall-clock convergence than QSGD and TernGrad.
  evidence:
  - source_id: r420-primary-pdf
    locator: Section 6 Experiments (Figures 1-4, Table 1), pp. 9856-9859
    relation: supports
