id: AIMech:AtomoAtomicSparsificationForDistributedLearning
name: ATOMO (Atomic Sparsification for Communication-Efficient Distributed Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A general unbiased gradient sparsification framework (Wang et al. 2018, Section 3, Algorithm 1) that expresses a gradient tensor g in R^d in an atomic basis A = {a_i}_{i=1}^n (||a_i|| = 1) as g = sum_{i=1}^n lambda_i a_i (covering entry-wise coordinate bases, singular-value rank-1 outer-product bases, and Fourier/wavelet bases), samples each atom independently via t_i ~ Bernoulli(p_i) under a total sparsity budget sum_{i=1}^n p_i <= s to form the unbiased estimator g_hat = sum_{i=1}^n (lambda_i t_i / p_i) a_i, and computes the exact variance-minimizing inclusion probabilities p_i^* in closed form via KKT water-filling.
identity_notes: Distinct from deterministic low-rank power-iteration compression PowerSGD (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback, Vogels et al. 2019), which computes a biased fixed-rank approximation via orthogonalized power iteration and requires error feedback, and from coordinate-only quantization QSGD (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding, Alistarh et al. 2017), which is restricted to the standard Euclidean coordinate basis rather than general atomic/spectral decompositions with KKT water-filling probabilities.
aliases:
- ATOMO
- Atomic Sparsification for Distributed Learning
- Spectral-Atomo and Entry-wise Atomo
