name: Hierarchical softmax
definition: A neural categorical-output component that assigns a probability to each vocabulary leaf by
  multiplying normalized branch probabilities along its path through a word tree.
concept_kind: layer
identity_notes: 'This record covers the hierarchical probability output component, including the binary
  sigmoid form described as hierarchical softmax by Mikolov and colleagues. Morin and Bengio’s parameter-sharing
  language model and Mnih and Hinton’s hierarchical log-bilinear model are complete architectures using
  this factorization, not aliases for the component. A Huffman tree, a WordNet-derived tree and a learned
  tree are construction choices with different scope. All 442 pinned AIO labels/scoped synonyms and 352
  preceding native IDs/names/aliases were compared, with no normalized identity match. Both full-checkout
  searches included ignored and hidden files; worktree returned 15 lines and main 19. All 16 unique matched
  contents were read: DocNADE contrasts, frontier and review references, plus four ignored-environment
  Sage/Pygments entries unrelated to AI SAGE. Twenty-one exact AIO nodes and four complete native neighbors
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The tree parameterization defines a normalized distribution of its own. Calling it an approximation
  to full softmax does not assert equality to probabilities from a particular flat-softmax parameter set
  or provide a numerical approximation-error bound.
- 'Logarithmic target cost requires suitable depth or weighted-average code length. A full binary tree
  alone can have linear worst-case depth. Even a Huffman code’s mean length need not be at most log2(vocabulary
  size): three equally frequent words have optimal mean length 5/3, exceeding log2(3). Thus the unqualified
  average-length sentence in Mikolov Section 2.1 is not adopted as a universal bound.'
- Computing every vocabulary probability requires at least linear output work. The short-path calculation
  does not by itself give a logarithmic-time exact top-k or most-probable-word search.
- Shared internal nodes, tree construction and input representation constrain the fitted model. Multiple
  codes per word add paths and require their sum, rather than selecting an arbitrary single leaf or averaging
  leaf probabilities.
- This component is not a whole language model, a hard decision tree, negative sampling, or Gumbel-Softmax
  sampling. No empirical speedup, embedding-quality ranking or author-code behavior is certified.
