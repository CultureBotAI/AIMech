claims:
- claim_id: method
  kind: mechanism
  statement: In a binary tree with one leaf per word, each internal node computes a branch probability
    from the input representation, commonly sigmoid of a node-vector dot product with optional bias. The
    opposite branch has its complement. Multiply the appropriate branch probabilities on the target word’s
    path to obtain its exact probability under this tree-parameterized distribution; probabilities over
    all leaves sum to one. The negative log probability is a sum of binary losses, so only nodes on the
    observed path contribute output-parameter gradients. For a sigmoid node logit and branch indicator
    y, that loss derivative is sigmoid(logit)-y. Computing one target probability and its gradient costs
    work proportional to its path length, in addition to representation computation. The source’s skip-gram
    variant uses internal-node output vectors and frequency-based Huffman codes. Multiple leaves assigned
    to one word require summing their disjoint path probabilities, as in the HLBL extension.
  evidence:
