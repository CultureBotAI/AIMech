aio_mappings:
- target: AIO:OutputLayer
  relation: broad_match
  rationale: The primary hierarchical-softmax description explicitly represents the neural output through
    a word tree. OutputLayer is broader than this particular probability-producing component. The SoftmaxLayer
    target specifically applies the flat softmax function to its inputs and is not asserted equivalent
    or broader merely because the names overlap. HierarchicalLanguageModel is a complete model of multilevel
    representations, while this component does not specify its surrounding language architecture.
