id: AIMech:HeuristicTreeSampling
name: Heuristic tree sampling
aliases:
- Chen heuristic sampling
concept_kind: algorithm
definition: A randomized estimator of additive properties of an implicit rooted tree that processes ordered
  strata using one sampled representative and an accumulated weight per stratum.
identity_notes: 'Compared all 442 pinned AIO and 641 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 29, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 85 AIO and 377 native definitions, with every matched definition
  read. 12 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. Retain
  Chen’s ordered weighted-representative tree-functional estimator. The 2013 heuristic-informed IDA* method
  applies this estimator with cost-aware types and ancestor-pruned search-tree generation; represent it
  as a scoped variant within the general identity. Original CDP and LookupCDP extrapolate a domain model,
  while this procedure samples the query tree. Gumbel configuration sampling and TreeSHAP attributions
  have different sampling laws or target functionals. Bare HS/SS acronyms are not aliases: 1992 SS means
  simple sampling, 2013 SS means stratified sampling.'
definition_evidence:
- source_id: chen1992hs
  locator: Sections2–3, PDF pp.2–3 / printed296–297, Equations 1–2 and Algorithm HS
  relation: supports
claims:
- claim_id: ordered-weighted-representatives
  kind: mechanism
  statement: Start with root weight one and process strata in parent-before-child order. A child inherits
    its parent’s weight. Merge arrivals in the same pending stratum by adding weights, selecting the incoming
    representative with probability equal to its weight divided by the new total. Report the sum of representative
    weights times their node-function values.
  evidence:
  - source_id: chen1992hs
    locator: Section3, PDF pp.2–3 / printed296–297; Algorithm HS
    relation: supports
- claim_id: expectation-and-tree-scope
  kind: scope
  statement: For a finite tree, fixed node functional and valid ordering and random choices, the weighted
    estimator is unbiased. This expectation statement does not make each sample accurate. Repeated graph
    states remain distinct tree-path occurrences unless a separately justified graph-counting method is
    supplied.
  evidence:
  - source_id: chen1992hs
    locator: Sections2–4.3, PDF pp.2–6 / printed296–300, Theorem 4
    relation: supports
- claim_id: strata-and-work-boundaries
  kind: limitation
  statement: Stratum homogeneity can reduce variance, but stratum labels alone do not guarantee accuracy.
    The number of expanded representatives is bounded by the number of strata; generating children and
    evaluating the stratifier still incur work. The source’s stronger variance bounds have additional
    assumptions.
  evidence:
  - source_id: chen1992hs
    locator: Sections3–4.7, PDF pp.3–13 / printed297–307; Section5, pp.14–15 / printed308–309
    relation: supports
- claim_id: ida-star-variant
  kind: scope
  statement: The later IDA* application uses heuristic-informed types and samples the actual bounded search
    tree, including ancestor cutoffs. Its parent, child and grandchild contexts are variants of the weighted-stratum
    estimator, not CDP’s domain-model extrapolation.
  evidence:
  - source_id: lelis2013prediction
    locator: Sections8–10, PDF pp.17–23 / printed68–74
    relation: supports
- claim_id: finite-probe-limitations
  kind: limitation
  statement: An unbiased estimator can miss rare deep branches in every run of a small sample. The reported
    knight-tour experiments include zero estimates at depths with nonzero actual counts. Such observations
    do not establish absence of deep nodes or solutions, and examined-node counts alone do not certify
    runtime gains.
  evidence:
  - source_id: chen1992hs
    locator: Section5, PDF pp.13–17 / printed307–311, Tables 1–2
    relation: supports
