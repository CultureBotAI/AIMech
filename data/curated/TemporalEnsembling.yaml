claims:
- claim_id: method
  kind: mechanism
  statement: Maintain zero-initialized N-by-C arrays Z and target z_tilde for N indexed examples and C
    classes. During epoch t, obtain one stochastic prediction z_i for each example when its minibatch
    is processed. Minimize labeled cross-entropy divided by the full minibatch size plus w(t)/(C|B|) sum
    over all i in B of ||z_i−z_tilde_i||², holding the stored targets constant during differentiation.
    After predictions have been used for that epoch, update each accumulated prediction Z_i←alpha Z_i+(1−alpha)z_i
    and set the next target to Z_i/(1−alpha^t), with fixed 0≤alpha<1 and t starting at 1. Set the first
    epoch’s consistency weight to zero and ramp it up. Algorithm 2 displays the target update after the
    epoch; its caption permits per-example updates within a minibatch after the old target has been used.
    Predictions gathered within an epoch can come from different current parameter states. The exponential
    average is over example predictions, not model parameters.
  evidence:
