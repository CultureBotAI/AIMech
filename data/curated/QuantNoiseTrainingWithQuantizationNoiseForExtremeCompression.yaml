claims:
- claim_id: quant-noise-stochastic-block-distortion-and-unbiased-gradient-flow
  kind: mechanism
  statement: Given a weight matrix partitioned into m x q blocks b_{kl} (Eq. 1) and a scalar or vector quantizer phi (Eqs. 2-4, 9-10), Quant-Noise samples a subset J of block indices at rate p and applies psi(b_{kl} | J) = phi(b_{kl}) if (k, l) in J else b_{kl} (Eqs. 6-7), allowing exact unbiased gradients to flow through the 1 - p fraction of unquantized blocks instead of relying solely on biased STE gradients across a fully quantized network.
  evidence:
  - source_id: r814-primary-pdf
    locator: Section 3.3 (Training with Quant-Noise), Equations 6-7 and Appendix A.1 Equations 9-10, pp. 4-5, 13
    relation: supports
  - source_id: r814-primary-pdf
    locator: apply_quant_noise_blocks and main
    relation: supports
- claim_id: quant-noise-commutative-layerdrop-and-ipq-int8-hybrid-compression
  kind: mechanism
  statement: Quant-Noise composes commutatively with LayerDrop structured pruning via psi = psi_1 o psi_2 (Eq. 8) and combines iterative Product Quantization (iPQ) weight codebooks with int8 quantized centroids, column scales, and activations to achieve a per-layer memory footprint of M = 8*K*d + log_2(K)*m*p + 8*n bits (Eq. 5).
  evidence:
  - source_id: r814-primary-pdf
    locator: Section 3.2 (Equation 5) and Section 3.3 (Composing Noise Functions, Equation 8), pp. 4-5
    relation: supports
  - source_id: r814-primary-pdf
    locator: pq_int8_memory_bits and main
    relation: supports
- claim_id: quant-noise-roberta-and-efficientnet-extreme-compression
  kind: application
  statement: Across RoBERTa on MNLI, WikiText-103 language modeling, and ResNet-50 / EfficientNet-B3 on ImageNet, Quant-Noise consistently outperforms QAT, compressing RoBERTa to 14 MB (82.5% MNLI accuracy via LayerDrop + iPQ + int8) and EfficientNet-B3 to 3.3 MB with 80.0% ImageNet top-1 accuracy.
  evidence:
  - source_id: r814-primary-pdf
    locator: Section 4.1-4.2, Figures 2-4 and Table 1, pp. 6-8
    relation: supports
- claim_id: quant-noise-per-forward-kmeans-overhead-and-noise-rate-tuning-limitation
  kind: limitation
  statement: Exact Product Quantization inside Quant-Noise requires running k-means steps on weight blocks during training (unless approximated by a block-dropout proxy before iPQ fine-tuning), and the quantization noise rate p must be tuned to balance regularization strength against train-test quantization mismatch.
  evidence:
  - source_id: r814-primary-pdf
    locator: Section 3.3 (Proxy for Quantization Function) and Section 5 (Ablations, Figure 5), pp. 5, 8
    relation: supports
