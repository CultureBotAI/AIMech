id: AIMech:QuantNoiseTrainingWithQuantizationNoiseForExtremeCompression
name: Quant-Noise (Training with Quantization Noise for Extreme Model Compression)
concept_kind: algorithm
review_status: DRAFT
definition: Quant-Noise is a quantization-aware neural network training method that partitions each weight matrix W in R^{n x p} into m x q subvector blocks b_{kl} matching a target scalar or vector quantizer phi (such as fixed-point int4/int8 scalar quantization or iterative Product Quantization iPQ), randomly selects a subset of blocks J subset {(k, l)} with probability p at each forward pass to distort via psi(b_{kl} | J) = phi(b_{kl}) for (k, l) in J and b_{kl} otherwise, and backpropagates exact unbiased gradients through the remaining 1 - p fraction of unquantized blocks while quantizing all weights at inference.
identity_notes: Distinct from standard Quantization-Aware Training (QAT) with the Straight-Through Estimator (STE), which quantizes 100% of weights on every forward pass and suffers severe gradient bias under extreme compression (int4 or Product Quantization), distinct from Q-BERT (AIMech:QBERTHessianBasedUltraLowPrecisionQuantizationOfBERT), which uses Hessian-spectrum mixed-precision scalar allocation, and distinct from LayerDrop (AIMech:LayerDropStructuredDropoutForTransformerDepthReduction), which drops entire Transformer layers rather than applying quantizer distortion to random subvector weight blocks.
aliases:
- Quant-Noise
- Training with Quantization Noise for Extreme Model Compression
- Stochastic Block Quantization Noise Training
