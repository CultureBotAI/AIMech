- source_id: method-source
  locator: Section 4, introductory paragraph and Maximum Candidates per Node, printed p. 57 / PDF p. 2
  relation: supports
claims:
- claim_id: method
  kind: mechanism
  statement: Apply the current beam-size cap, then keep at most m candidate continuations for each predecessor
    prefix by score. A candidate is discarded once m better-scoring candidates with that same predecessor
    are in the retained list. This is extra pruning after the initial top-beam selection; it does not
    specify refilling with candidates outside that initial list.
  evidence:
  - source_id: method-source
    locator: Section 4, introductory paragraph and Maximum Candidates per Node, printed p. 57 / PDF p.
      2
    relation: supports
- claim_id: diversity-limit
  kind: limitation
  statement: The source introduced a per-history candidate cap to diversify predecessor coverage, but
    its conclusion states that adding diversity did not improve translation quality in the evaluated settings.
  evidence:
  - source_id: diversity-limit
    locator: Introduction and Section 6, printed pp. 56 and 58 / PDF pp. 1 and 3
    relation: supports
