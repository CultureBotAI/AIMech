name: Maximum candidates per node in sequence beam pruning
definition: A sequence-beam pruning procedure that limits how many retained candidate extensions may come
  from the same predecessor hypothesis, discarding a candidate when the allowed number of better-scoring
  siblings is already retained.
concept_kind: algorithm
identity_notes: This is the Maximum Candidates per Node rule of Freitag and Al-Onaizan. Same history means
  the common predecessor prefix, not arbitrary semantic similarity between full sequences. It differs
  from an additive diversity penalty, grouping beams into separate searches or imposing a global frontier
  capacity. No normalized identity match was found across the 442 AIO and 146 prior native records; both
  checkout text searches included ignored and hidden files and returned no matches for the selected exact
  IDs, full labels, aliases and source titles.
limitations:
- A positive integer per-parent cap and deterministic tie handling must be specified. The source’s prose
  refers to better-scoring candidates without a complete tie policy.
- Limiting sibling extensions can remove the prefix of the best eventual sequence; this is not an exact
  or complete search guarantee.
- More varied parent prefixes do not guarantee semantic diversity or improved translation quality. The
  paper’s conclusion reports no translation-quality improvement from this diversity intervention.
- The inherited decoder determines EOS processing, generation length and changing active-beam width. The
  pruning rule alone is not a complete decoder implementation.
- No specific current library implementation, numeric quality gain or universal runtime benefit is asserted.
id: AIMech:PerNodeCandidateBeamPruning
aliases: []
