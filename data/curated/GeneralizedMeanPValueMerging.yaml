aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Generalized mean p-value merging combines K arbitrarily dependent hypothesis test p-values
    with exact non-asymptotic Type I error control across all copulas, preventing false-positive inflation
    when screening or averaging multiple correlated tests (AIO:DataDredgingBias). AIO:DataDredgingBias
    denotes the multiple-testing bias rather than the p-value merging method.
limitations:
- Because generalized mean p-merging functions guarantee Type I error control over the worst-case dependence
  structure across all joint copulas of (U_1, ..., U_K), their penalty multipliers (such as 2 for arithmetic
  mean, e for geometric mean, and a_K^H ~ ln K for harmonic mean) are substantially more conservative
  than independence-based (Fisher, Stouffer) or bivariate-normal asymptotically robust (Cauchy, Landau
  harmonic mean) calibrations when test statistics are weakly dependent (Fang et al. 2023, Section 3.2
  Remark).
- For finite K >= 2 and integrable exponents r outside [1/(K - 1), K - 1] (or simplex weights with max_k
  w_k > 1/2), the asymptotic multiplier (r + 1)^(1/r) is strictly conservative rather than finite-sample
  precise (Propositions 4 and 4w), and for r in (-1, 1/(K - 1)) the exact finite-K multiplier requires
  solving a non-closed-form dual optimization problem (Proposition 6).
- Selecting the exponent r post hoc after inspecting the observed p-values invalidates Type I error control;
  combining multiple exponents requires an explicit multiplicity penalty such as the factor of 2 in the
  compound Bonferroni-Arithmetic or Bonferroni-Geometric merging functions (Section 6, Proposition 12).
- All 1,046 lines of Vovk & Wang (2020, arXiv:1212.4966) were read. In the ar5iv HTML-to-markdown conversion,
  display-mode equations in Proposition 6 were omitted by the converter while all inline formulas in Propositions
  3–5, 8–10, 4w–5w, 11–12, and Appendix A proofs were preserved verbatim. Constructed numerical checks
  in research/discovery/generalized-mean-pvalue-merging-boundaries.py verify the Proposition 4/5/5w precision
  boundaries, Proposition 8/9 exact harmonic multipliers, and Section 6 Equation 17 compound merging behavior.
