claims:
- claim_id: integrable-exponent-merging-and-finite-sample-precision-interval
  kind: mechanism
  statement: For integrable exponents r in (-1, +infinity], scaling the generalized r-mean M_{r,K} by
    (r + 1)^(1/r) (with continuous limits e * M_{0,K} for the geometric mean at r = 0, 2 * M_{1,K} for
    the arithmetic mean at r = 1, and M_{infinity,K} = max_k p_k at r = +infinity) yields a valid and
    asymptotically precise family of p-merging functions under arbitrary dependence (Proposition 3); the
    multiplier (r + 1)^(1/r) is finite-sample precise (attaining sup P(F <= epsilon) = epsilon for all
    epsilon in (0, 1)) if and only if r in [1/(K - 1), K - 1] (Proposition 4), whereas for all r in [1,
    +infinity) and K >= 2 the sharpened multiplier min(r + 1, K)^(1/r) M_{r,K} is finite-sample precise
    (Proposition 5).
  evidence:
  - source_id: vovk-wang2020
    locator: Section 3.2, lines 76–111, Theorem 2 and Propositions 3–5; Appendix A, lines 860–896
    relation: supports
- claim_id: non-integrable-negative-exponent-and-harmonic-worst-case-multipliers
  kind: mechanism
  statement: For heavy-tailed non-integrable exponents r in [-infinity, -1), scaling M_{r,K} by (r / (r
    + 1)) K^(1 + 1/r) (recovering the Bonferroni correction K * min_k p_k at r = -infinity) is valid and
    asymptotically precise under arbitrary dependence (Proposition 8; Lemma 13 and Proposition 14); minimizing
    (r / (r + 1)) K^(1 + 1/r) over r < -1 yields the optimal exponent r* = ln K / (1 - ln K) < -1 and
    the conservative harmonic bound (e * ln K) M_{-1,K}, while for every K > 2 the exact finite-K precise
    harmonic multiplier is a_K^H = (y_K + K)^2 / ((y_K + 1) K) <= e * ln K (with a_K^H / ln K -> 1 as
    K -> infinity), where y_K > 0 is the unique positive root of y(y + K) / ((y + 1) K) = ln(y + 1) (Proposition
    9; Appendix A, lines 939–955).
  evidence:
  - source_id: vovk-wang2020
    locator: Section 3.2, lines 120–149, Theorem 7 and Propositions 8–10; Appendix A, lines 907–981
    relation: supports
  - source_id: fang-chang-park-tseng2023
    locator: Section 1, lines 17–21; Section 3.2, lines 86–92
    relation: supports
- claim_id: simplex-weighted-generalized-mean-precision-conditions
  kind: mechanism
  statement: For prior weights w = (w_1, ..., w_K) in the probability simplex Delta_K with maximum weight
    w_max = max_k w_k and weighted r-mean M_{r,w}(p_1, ..., p_K) = (sum_{k=1}^K w_k p_k^r)^(1/r), the
    merging function (r + 1)^(1/r) M_{r,w} is valid for all r > -1 and is finite-sample precise if and
    only if w_max <= 1/2 and r in [w_max / (1 - w_max), (1 - w_max) / w_max] (Proposition 4w); for r in
    [1, +infinity), min(r + 1, 1 / w_max)^(1/r) M_{r,w} is finite-sample precise for every weight vector
    w in Delta_K, reducing when r = 1 and w_1 = w_max > 1/2 to p_1 + sum_{k=2}^K (w_k / w_1) p_k (Proposition
    5w).
  evidence:
  - source_id: vovk-wang2020
    locator: Section 4, lines 151–172, Theorem 2w and Propositions 4w–5w; Appendix A, lines 860–896
    relation: supports
- claim_id: power-index-phase-transition-and-compound-bonferroni-averaging
  kind: application
  statement: 'Under exchangeable alternative p-values with power index Pi = sup{m >= 0 : E[p_1^(-m)] <
    infinity} (where Pi = 1 / (1 - rho^2) > 1 for equicorrelated Gaussian z-tests with correlation rho
    in (0, 1), Lemma 15), the unscaled r-mean P_{r,K} converges in probability to 0 if r < -Pi, to a non-zero
    finite limit if r >= -Pi, and the Bonferroni-scaled r-mean K^(1+1/r) P_{r,K} diverges to +infinity
    if r > -Pi (Proposition 11); because selecting r adaptively from data invalidates Type I error, the
    compound Bonferroni-Arithmetic F_K^BA = 2 min(K min_k p_k, 2 M_{1,K}) and Bonferroni-Geometric F_K^BG
    = 2 min(K min_k p_k, e M_{0,K}) merging functions provide asymptotically precise validity across both
    weak and strong correlation regimes (Proposition 12).'
  evidence:
  - source_id: vovk-wang2020
    locator: Section 5, lines 173–220, Proposition 11; Section 6, lines 221–309, Proposition 12 and Equations
      17–18; Appendix A, Lemma 15, lines 983–1024
    relation: supports
  - source_id: gui-jiang-wang2023
    locator: Section 1, lines 50–78
    relation: supports
