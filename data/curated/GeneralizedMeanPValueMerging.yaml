id: AIMech:GeneralizedMeanPValueMerging
name: Generalized mean p-value merging
aliases:
- Power Mean P-Value Combination
- Kolmogorov Generalized Mean P-Merging Function
- Hardy-Littlewood-Polya r-Mean P-Value Merging
- Vovk-Wang Generalized Mean P-Value Combination
concept_kind: mathematical_method
definition: A statistical p-value combination framework (Vovk & Wang 2020) that aggregates K arbitrarily
  dependent hypothesis test p-values p_1, ..., p_K in [0, 1] using calibrated Hardy-Littlewood-Polya (Kolmogorov)
  generalized r-means M_{r,K}(p_1, ..., p_K) = (K^(-1) sum_{k=1}^K p_k^r)^(1/r) (and simplex-weighted
  generalizations M_{r,w}(p_1, ..., p_K) = (sum_{k=1}^K w_k p_k^r)^(1/r) for r in [-infinity, +infinity])
  scaled by optimal worst-case multipliers a_{r,K} derived via dual robust risk-aggregation and joint
  mixability theory so that sup_{U_1, ..., U_K in U} P(a_{r,K} M_{r,K}(U_1, ..., U_K) <= epsilon) <= epsilon
  holds non-asymptotically for all epsilon in (0, 1) without distributional dependence assumptions.
identity_notes: No normalized identity match for Generalized Mean P-Value Merging across all 442 pinned
  AIO records and 568 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches across
  data, sources, research, history, and reviews returned only frontier references in predecessor discovery
  reports and a bibliography mention in AIMech:ExactHarmonicMeanPValueTest. Distinct from AIMech:ExactHarmonicMeanPValueTest
  (Wilson 2019; Fang et al. 2023), which calibrates the unscaled harmonic mean (r = -1) using the Landau
  stable law S(1, 1, pi/2, mu_n) under independence or regularly varying bivariate Gaussian tail asymptotics
  rather than Vovk & Wang's exact finite-K worst-case dependence multiplier a_K^H = (y_K + K)^2 / ((y_K
  + 1) K) <= e * ln K across all joint copulas. Distinct from AIMech:LogarithmicOpinionPool, which aggregates
  probability distributions via geometric means rather than calibrating hypothesis test p-values under
  arbitrary dependence via multiplier e (r = 0).
