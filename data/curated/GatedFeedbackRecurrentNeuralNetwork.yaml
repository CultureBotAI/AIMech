limitations:
- Global layer-pair scalar gates and ordinary unit-wise LSTM/GRU gates have distinct placement and scope
  in the displayed formulation.
- Data-dependent soft weighting does not imply hard routing, normalized attention, a fixed module clock,
  sparse execution or guaranteed separation of timescales.
- Learned matrices and gate derivatives prevent a contraction or gradient-preservation guarantee based
  solely on gate values.
- Tanh deterioration and the negative GRU program-test comparison are retained alongside the reported
  improvements; capacities, metrics and vocabulary affect comparisons.
- All nine primary conference-paper pages were read. No author implementation, supplement, training, runtime
  audit or empirical replication was inspected.
- Displayed equations and a figure that omits skip connections do not certify every implementation detail.
  Constructed scalar checks are not trained-model evidence.
