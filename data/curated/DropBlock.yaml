claims:
- claim_id: method
  kind: mechanism
  statement: During training, sample block seeds within the spatial region whose expanded square blocks
    fit inside the feature map, suppress the union of those blocks, multiply activations by the resulting
    keep mask and normalize using the observed retained-mask fraction. The paper uses a block size and
    a seed probability gamma computed approximately from the desired keep probability, block area and
    number of valid centers. Overlap makes the formula approximate. The author-linked pinned TensorFlow
    implementation confirms gamma as the probability that a valid center becomes a drop seed. It supports
    square feature maps, clamps block size to map width, expands zeros using minimum pooling, and computes
    normalization from the resulting mask tensor as a whole. During ordinary inference, the transformation
    returns its input unchanged. The paper recommends a linear decrease of keep probability from1 to a
    target during training; this schedule is an experimental choice rather than a new learned mask.
