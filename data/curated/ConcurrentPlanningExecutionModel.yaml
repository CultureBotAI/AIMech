definition_evidence:
- source_id: elboher2023
  locator: Official PDF p.4 Definition 1 and action/deadline formalization; pp.4–5
    Section 3.1.
  relation: supports
claims:
- claim_id: formal-input-and-objective
  kind: mechanism
  statement: The CoPE problem supplies a set of base actions with positive durations
    and n planning processes. Each process has a possibly empty known action head
    H_i, a computation-completion performance profile M_i and an induced-deadline
    distribution D_i. A policy allocates computation and legally initiates head actions
    to maximize the probability of executing a timely solution. The model is a static
    decision abstraction rather than a single search procedure.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.4, Definition 1 and surrounding formalization; pp.1–2
      motivation.
    relation: supports
- claim_id: serial-actions-and-prefix-invalidation
  kind: mechanism
  statement: A legal initiated prefix starts no earlier than time zero, starts each
    later action no earlier than the preceding action finishes, and respects operative
    individual action deadlines. Base actions are non-preemptible and cannot execute
    in parallel, while computation can overlap a base action. Executing a prefix invalidates
    a process whose known head is incompatible with that prefix. The unknown suffix
    cannot start before its planning process terminates.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.4, action legality, non-preemption, incompatibility and
      suffix-start paragraphs.
    relation: supports
- claim_id: induced-deadline-construction
  kind: mechanism
  statement: For process i, let X_i be the time by which the complete solution must
    finish and R_i the unknown remainder duration revealed when planning terminates.
    The source defines the induced deadline as D_i=X_i−R_i and writes timely suffix
    initiation as start(beta_i)<=X_i−R_i. This subtraction is meaningful even when
    X_i and R_i are dependent. The later mutual-independence premise for the M_i and
    induced D_i variables is separate from this definition.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.4, induced-deadline derivation preceding Definition 1.
    relation: supports
- claim_id: restricted-analysis-assumptions
  kind: scope
  statement: The analyzed construction assumes discrete time, known action durations,
    mutual independence of all performance-profile and induced-deadline variables,
    and no operative individual base-action deadlines. Positive base-action durations
    are already part of Definition 1. The statement that an implementation can allow
    individual action deadlines does not extend the displayed analyses to all such
    cases.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.4, four simplifying assumptions after Example2, with Definition
      1.
    relation: supports
- claim_id: decision-state-and-computation-transition
  kind: mechanism
  statement: The analyzed MDP records wall time T, computation already allocated to
    each process and its failure state, remaining execution time W for the current
    base action, and the number L of initiated or completed base actions, with terminal
    SUCCESS and FAIL states. A computation action allocates one unit to an eligible
    process; conditional on unfinished positive survival, its termination probability
    is m_i(T_i+1)/(1−M_i(T_i)). Computation advances wall time while an executing
    base action can progress. Base initiation is allowed only when no other base action
    is executing and the action is next in a surviving head. The source assigns reward
    one to SUCCESS and zero elsewhere.
  evidence:
  - source_id: elboher2023
    locator: Official PDF pp.4–5, Section 3.1 state, transition, reward and eligibility
      descriptions.
    relation: supports
  - source_id: elboher2023-arxiv
    locator: arXiv v1 PDF pp.8–9, Appendix A, state variables and computation/base-action
      transition equations.
    relation: supports
- claim_id: known-deadline-policy-results
  kind: scope
  statement: For KID-CoPE, the known-induced-deadline restriction under the stated
    analysis assumptions, the source states that policies are linear and that an optimal
    policy exists which is linear, computation-contiguous and lazy. Contiguity applies
    to the computation subsequence CA(sigma), so base-action initiations may still
    intervene. Laziness delays base initiations until a further adjacent delay would
    be tardy or illegal. These are source-stated restricted existence results, not
    a claim that every policy is optimal or that the general heuristic schemes solve
    all CoPE instances optimally.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.5, Lemma 3, Definitions 2–3 and Theorems 4–5.
    relation: supports
limitations:
- The paper studies a static snapshot with supplied process and deadline distributions.
  Learning accurate profiles online, updating them during execution and integrating
  the abstraction into an operating planner are outside this model assessment; there
  is no calibration or deployment guarantee.
- The physical setting uses deterministic world evolution, positive known base-action
  durations for the analysis, serialized non-preemptible actions and overlap only
  between computation and a base action. Arbitrary parallel robots, uncertain action
  outcomes, preemption and continuous-time extensions do not inherit the stated results.
- Mutual independence of the M_i and induced D_i variables is an analysis premise,
  not an empirical property established for real search subtrees. Product-failure
  calculations and the stated reductions must not be transferred to arbitrary dependencies.
  Independence of X_i and R_i is not needed merely to define their difference.
- With a standard CDF, the background expression 1−D(t) counts deadline>t, whereas
  the induced-deadline derivation allows suffix start<=X−R. Discrete equality mass
  needs an explicit convention. This draft preserves the printed boundary difference
  without a silent off-by-one repair.
- The arXiv Appendix A earliest-time expression adds remaining action time W and one
  new computation unit even though those activities can overlap. In the retained hand
  case T=0, W=1, no unstarted head actions and one computation unit remaining, the
  printed progress updates finish both at time 1 while that expression gives2. A distant
  deadline 3 isolates this issue from deadline equality. It is a source-interface
  discrepancy, not a diagnosed code defect or a proof that all model results fail.
- The conditional termination hazard requires 1−M_i(T_i)>0 for an unfinished eligible
  process. The inherited log-failure utility and LPF/time heuristics also require
  explicit zero/one-probability and positive-allocation-time conventions. These displayed
  formulas do not supply a complete numerically guarded implementation.
- The known-induced-deadline structural results and fixed-initiation reduction have
  their own premises. The source does not claim a polynomial general solver; constant-bounded
  heads or equal slack yield pseudo-polynomial special cases in numeric horizons/explicit
  distributions. The inspected arXiv proof sketches are source evidence, not a formally
  verified proof or an extension to arbitrary dependencies.
- The official paper, author-hosted main paper and arXiv v1 are distinct artifacts
  of one work. The author PDF lacks the appendix it references; official Algorithms
  1–5 and the arXiv IPAE/Refined-Max-LET displays differ. The named algorithm schemas
  and their literal helper-interface questions remain separate from this formal-model
  identity. No code was acquired or executed.
- Reported comparisons use simulated instances based on 15-puzzle search histograms
  and selected process counts/action durations. Ellipses show instance results rather
  than confidence intervals, and small appendix runtimes are rounded for logarithmic
  plotting. These experiments establish neither universal policy superiority, profile
  calibration, statistical significance nor integration overhead in a continuously
  updating planner.
