id: AIMech:ConcurrentPlanningExecutionModel
name: Concurrent planning and execution metareasoning model
definition: A formal metareasoning model that represents competing plan-computation
  processes, their known executable action heads and induced-deadline distributions,
  and poses the problem of selecting a joint computation/execution policy to maximize
  timely solution probability in the source’s concurrent-planning setting.
concept_kind: model_family
aliases: []
identity_notes: The source-specific formal decision model for concurrent planning
  and execution, with planning-process performance profiles, known action heads, induced
  deadlines and a joint computation/execution policy objective. Retain one named formal
  model. Its problem statement and MDP encoding are representations of the same scoped
  subject; do not create separate identities for the encoding or every assumption-restricted
  subcase. General Definition 1, the four simplifying analysis assumptions, and KID-CoPE
  special-case results are distinct layers. This is not a claim that every instance
  has the properties of the restricted MDP analysis. CoPE is used for a broader setting
  and in the 2025 source; omit it as a global alias. The descriptive canonical name
  narrows this proposal to the 2023 metareasoning model. Current insertion identity
  was assessed on 2026-10-16 at merged HEAD 8650bfb55ef0c67902b5a80f1527920c87ad1d9d
  and tree cd6972cabe7b7f1cdf9ca5ee69bd6263a991ba50. The complete inventory contains813
