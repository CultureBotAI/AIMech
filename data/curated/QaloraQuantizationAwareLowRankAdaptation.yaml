claims:
- claim_id: r661-claim-lossless-zero-point-merging-identity
  kind: mechanism
  statement: Because all g = D_in / L rows within group l share the same adapter row vector (L_1 L_2)_{l, j} and the same quantization scale alpha_{l, j} and zero-point beta_{l, j}, the sum of the dequantized linear term and low-rank adapter satisfies x^T (alpha odot (W_hat - beta)) + s A(x)^T L_1 L_2 = x^T (alpha odot (W_hat - (beta - s (L_1 L_2) oslash alpha))), allowing exact lossless integration of the adapter into the zero-point matrix beta^{new} = beta - s (L_1 L_2) oslash alpha without altering the N-bit integer tensor W_hat or incurring any post-training quantization error.
  evidence:
  - source_id: r661-primary-pdf
    locator: Section 3.3, Algorithm 1 (`merge_with_quantization`), p. 5; Appendix B.1-B.3, Equations (2)-(7), p. 15-16
    relation: supports
- claim_id: r661-claim-degree-of-freedom-balance-and-parameter-reduction
  kind: mechanism
  statement: Partitioning each column into L groups increases quantization degrees of freedom from D_out to L D_out pairs of (alpha, beta) factors while reducing low-rank adaptation parameters from D_in D_int + D_int D_out to L D_int + D_int D_out (cutting learnable parameters on LLaMA-7B/13B/33B/65B by ~44% and reducing INT4 fine-tuning time by 1.86x to 2.90x compared to NF4 QLoRA).
  evidence:
  - source_id: r661-primary-pdf
    locator: 'Section 3.3 (The insight of QA-LoRA: balance), p. 5-6; Section 4.2, Table 2, p. 7-8'
    relation: supports
- claim_id: r661-claim-int4-int3-int2-mmlu-and-commonsense-qa-accuracy
  kind: application
  statement: "Across LLaMA-7B/13B/33B/65B and LLaMA2-7B/13B fine-tuned on Alpaca and FLAN v2 under 4-bit, 3-bit, and 2-bit quantization, QA-LoRA consistently outperforms QLoRA followed by GPTQ post-training quantization\u2014improving 0-shot commonsense QA by +15.0% and MMLU 5-shot accuracy by up to +8.2% at 2-bit precision\u2014while executing inference in pure low-bit integer arithmetic."
  evidence:
  - source_id: r661-primary-pdf
    locator: Section 4.2, Figure 1 & Tables 1, 3, 4, p. 2, 6-8
    relation: supports
- claim_id: r661-claim-group-size-tradeoff-and-data-size-limitation
  kind: limitation
  statement: Because input features are summed across windows of size g = D_in / L before entering L_1, setting a large group size g (small L, e.g., g = 128 vs. g = 32) restricts the effective rank and input resolution of the adapter and reduces accuracy in 2-bit quantization, and low-bit (INT2) QA-LoRA requires larger instruction-tuning datasets (e.g., >= 320K FLAN v2 examples) to converge.
  evidence:
  - source_id: r661-primary-pdf
    locator: Section 4.3 (Ablative Studies), Tables 5-6 & Figure 3, p. 8-9
    relation: supports
