claims:
- claim_id: honest-tau-censored-cross-weighting-finite-sample-fdr-control-and-uncensored-counterexample
  kind: mechanism
  statement: Under Assumption 1 (null p-values independent of each other and of non-null p-values given
    covariates X and super-uniform on [0, 1]), partitioning [m] into K disjoint folds I_1, ..., I_K and
    learning honest weights W_i = W_hat^{-ell}(X_i) >= 0 from (P_j, X_j)_{j notin I_ell} normalized within
    each fold (sum_{i in I_ell} W_i = |I_ell|, Specification 1) that are tau-censored (depending on out-of-fold
    p-values only through P_j * 1{P_j > tau}, Specification 2) guarantees finite-sample FDR <= alpha for
    tau-censored weighted Benjamini-Hochberg (Theorem 1, Corollary 1) and for null-proportion-adaptive
    weights W_i / pi_hat'_{0,W,ell} where pi_hat'_{0,W,ell} = (max_{i in I_ell} W_i + sum_{i in I_ell}
    W_i 1{P_i > tau}) / (|I_ell| (1 - tau)) via the Inverse Binomial Lemma (Theorem 2, Supplement S1.2
    and S1.4); in contrast, naive full-sample Grouped BH (Algorithm 1) overfits under the global null
    as the number of groups G grows (Section 2.2, Fig. 2), and omitting tau-censoring allows an m = 4
    adversarial honest cross-weighting rule to achieve exact FDR = alpha * (1 + alpha * (1 - alpha) /
    2) > alpha (Supplement S1.3).
  evidence:
  - source_id: ignatiadis2021-ihw-cross-weighting-ar5iv
    locator: Section 2.2–2.3, lines 166–260, Algorithms 1–2, Figure 2; Section 3.1, lines 296–415, Assumption
      1, Definitions 1–2, Specifications 1–3, Theorems 1–2, Corollary 1; Supplement S1.1–S1.4, lines 960–1255
    relation: supports
  - source_id: ignatiadis2021-ihw-cross-weighting-abs
    locator: Abstract (cross-weighting fold-splitting mechanism and finite-sample FDR guarantees)
    relation: supports
- claim_id: asymptotic-consistency-without-tau-censoring-and-zero-power-loss-from-fold-splitting
  kind: mechanism
  statement: Under the conditional two-groups model (Assumption 3, (X_i, H_i, P_i) i.i.d. with strictly
    positive null proportion pi_0 and continuous conditional CDF F(t | x)), a naive full-sample weighting
    rule taking values in a bounded function class (Specification 7) can overfit small p-values and fail
    to control FDR asymptotically (liminf_{m -> infinity} FDR >= 1 - 2.2 delta / alpha > alpha, Proposition
    1(a), Supplement S2.1), whereas cross-weighted IHW-BH with any Specification-7 weight learner controls
    FDR asymptotically without tau-censoring (tau = 1) via conditional Dvoretzky-Kiefer-Wolfowitz concentration
    (Proposition 1(b), Supplement S2.2), and achieves the exact same asymptotic rejection threshold t^*(W^*)
    and asymptotic power as full-sample or oracle W^* weighting whenever ||W_hat^{([m])} - W^*||_infinity
    -> 0 in probability (Proposition 1(c), Corollary 2, Supplement S2.3–S2.4).
  evidence:
  - source_id: ignatiadis2021-ihw-cross-weighting-ar5iv
    locator: Section 3.2, lines 416–482, Assumption 3, Specifications 6–7, Proposition 1, Corollary 2;
      Supplement S2.1–S2.4, lines 1356–1640
    relation: supports
  - source_id: ignatiadis2021-ihw-cross-weighting-crossref
    locator: JRSS-B 83(4):720–751 publication record
    relation: supports
- claim_id: block-dependent-fold-partitioning-for-finite-sample-kfwer-and-ihw-by-fdr-control
  kind: mechanism
  statement: Under Assumption 2 (where hypotheses are partitioned into K folds I_1, ..., I_K such that
    p-values and covariates in different folds are mutually independent while arbitrary dependence is
    permitted within each fold, e.g., linkage disequilibrium blocks or chromosomes in genomics), honest
    cross-weighting ensures each null p-value P_i (i in H_0 intersect I_ell) is independent of the entire
    in-fold weight vector (W_k)_{k in I_ell} without requiring tau-censoring (Lemma 1(a)), guaranteeing
    finite-sample k-FWER <= alpha for weighted k-Bonferroni (Theorem 3, Supplement S1.6) and finite-sample
    FDR <= alpha for weighted Benjamini-Yekutieli (Theorem 4, Supplement S1.5); conversely, under the
    same block-dependence assumption, dishonest data-driven weighted BY can suffer FDR = 1 (Example 1)
    and AdaPT with BY correction and tau-censoring (tau = 0.45) suffers FDR >= 0.2925 at alpha = 0.10
    (Example 2, Section 3.3).
  evidence:
  - source_id: ignatiadis2021-ihw-cross-weighting-ar5iv
    locator: Section 3.3, lines 483–550, Assumption 2, Lemma 1(a), Theorems 3–4, Examples 1–2; Supplement
      S1.5–S1.6, lines 1256–1355
    relation: supports
- claim_id: grenander-least-concave-majorant-convex-weight-optimization-and-sparse-superuniform-robustness
  kind: mechanism
  statement: To learn informative weights in each out-of-fold training set [m] \ I_ell, IHW discretizes
    X_i into G bins, estimates the conditional p-value CDF F_hat^{-ell}(t | g) in each bin via the nonparametric
    Grenander estimator (the least concave majorant of the empirical CDF, corresponding to the non-increasing
    density NPMLE), and solves a convex linear program (or exact O(m log m) KKT slope-sorting procedure,
    Algorithm 5) with optional total-variation or uniform-deviation regularization to maximize expected
    discoveries subject to the fold budget constraint (Section 4, Equations 8–12; Supplement S4.1–S4.2);
    unlike mirror-reflection masking methods such as AdaPT—which require at least ceil(1 / alpha) rejections
    to make any discovery and lose power when true alternatives are sparse (m_1 < 1 / alpha) or null p-values
    are strictly super-uniform near 1—IHW-Grenander maintains high discovery power in both regimes (Section
    5.2, 'Breaking AdaPT').
  evidence:
  - source_id: ignatiadis2021-ihw-cross-weighting-ar5iv
    locator: Section 4, lines 551–715, Equations 8–12; Section 5.2, lines 755–805 ('Breaking AdaPT');
      Supplement S4.1–S4.2, lines 1675–1835, Equations 47–49, Algorithm 5
    relation: supports
