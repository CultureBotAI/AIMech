  rationale: IHW prevents in-sample weight overfitting and false-discovery inflation (AIO:DataDredgingBias)
    when learning covariate-dependent hypothesis weights by fitting weight functions strictly out of fold
    across K disjoint hypothesis folds.
limitations:
- Finite-sample FDR control in Theorems 1 and 2 requires mutual independence of null p-values and independence
  between null and non-null p-values conditional on covariates (Assumption 1), together with both within-fold
  weight normalization (Specification 1) and tau-censoring of out-of-fold p-values at a pre-specified
  threshold tau (Specification 2); omitting tau-censoring allows adversarial honest weighting rules to
  exceed alpha in finite samples (Supplement S1.3).
- Under dependence (Assumption 2, Theorems 3 and 4), finite-sample k-FWER and IHW-BY FDR guarantees require
  that the fold partition I_1, ..., I_K be constructed from domain knowledge so that hypotheses in different
  folds are genuinely independent (such as separate chromosomes or distant genomic blocks); random fold
  assignment does not decouple dependent p-values across folds (Section 3.3, Section 6.2).
- Out-of-fold Grenander least-concave-majorant weight learning requires partitioning the covariate space
  X into G discrete bins or trees with sufficient hypotheses per bin to estimate the conditional p-value
  distribution accurately, making direct nonparametric estimation challenging for high-dimensional covariates
  without tree or regression-based binning (Section 4, Section 7).
- All 2,154 lines of Ignatiadis & Huber (2021, JRSS-B 83(4):720-751, arXiv:1701.05179v7) were read. Constructed
  numerical checks in research/discovery/covariate-powered-cross-weighted-multiple-testing-boundaries.py
  verify (1) Supplement S1.3 exact uncensored honest counterexample FDR (0.216 vs. Monte Carlo 0.212 >
  0.20, restored to 0.2023 <= 0.20 under tau-censoring), Section 2.2 naive GBH global-null overfitting
  (0.2533 vs. IHW-GBH 0.065 <= 0.10), and Theorem 1/2 power gains (IHW-Storey 0.8891 > IHW-BH 0.8148 >
  unweighted BH 0.7487), (2) Proposition 1(a) full-sample Specification-7 overfitting (FDR = 0.7674 >
  0.15) vs. Proposition 1(b) uncensored cross-weighted FDR control (0.1331 <= 0.15) and Proposition 1(c)/Corollary
  2 convergence to oracle W* power (0.3954 vs. oracle 0.4006, gap 0.00522), (3) Example 1 dishonest wBY
  failure (FDR = 1.0) and Example 2 AdaPT-BY failure (exact bound 0.2925, MC 0.2938 > 0.10) vs. Theorem
  3 IHW-k-Bonferroni k-FWER control (0.016 <= 0.10, power 0.8829 > 0.7881) and Theorem 4 IHW-BY FDR control
  (0.0083 <= 0.10, power 0.8709 > 0.7551), and (4) Section 4/5.2 Grenander KKT concavity (violation 0.0)
  and sparse/super-uniform robustness where IHW-Grenander achieves power 0.8375 (FDR 0.0454 <= 0.05) while
  AdaPT has power 0.0 due to its ceil(1/alpha) = 20 minimum-rejection floor.
