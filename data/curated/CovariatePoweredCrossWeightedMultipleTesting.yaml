id: AIMech:CovariatePoweredCrossWeightedMultipleTesting
name: Covariate-powered cross-weighted multiple testing
aliases:
- Independent Hypothesis Weighting (IHW)
- Cross-Weighted Benjamini-Hochberg Procedure (IHW-BH)
- Cross-Weighted Storey Benjamini-Hochberg Procedure (IHW-Storey)
- IHW-Grenander Covariate-Weighted Multiple Testing
concept_kind: mathematical_method
definition: 'A covariate-assisted multiple-testing methodology (Ignatiadis & Huber 2021, Journal of the
  Royal Statistical Society: Series B 83(4):720-751, arXiv:1701.05179) that learns data-driven hypothesis
  weights W_i >= 0 from side information X_i via K-fold sample splitting across hypotheses (cross-weighting)
  to maximize discovery power while controlling the false discovery rate (FDR) or k-familywise error rate
  (k-FWER). Hypotheses [m] are partitioned into K disjoint folds I_1, ..., I_K; for each i in I_ell, an
  out-of-fold weight function W_hat^{-ell} is fit using only (P_j, X_j)_{j notin I_ell}, evaluated at
  X_i, and normalized within fold I_ell so that sum_{i in I_ell} W_i = |I_ell| (Specification 1, honest
  weighting). Combined with tau-censoring (Specification 2, where weights depend on out-of-fold p-values
  only through P_j * 1{P_j > tau}) and weighted Storey fold null-proportion adjustments, cross-weighting
  guarantees finite-sample FDR control under independence (Theorems 1-2), asymptotic FDR control without
  tau-censoring and zero asymptotic power loss from fold splitting under the conditional two-groups model
  (Proposition 1, Corollary 2), and finite-sample k-FWER and Benjamini-Yekutieli FDR control under block
  dependence when folds align with independent dependence blocks (Theorems 3-4).'
identity_notes: No normalized identity match for covariate-powered cross-weighted multiple testing or
  Independent Hypothesis Weighting (IHW) across all 442 pinned AIO records and 587 maintained IDs, names,
  aliases and scoped synonyms. Fixed-string searches across data, sources, research, history, and reviews
  returned only frontier references in prior discovery reports. Distinct from AIMech:AdaptivePValueThresholding
  (Lei & Fithian 2018, AdaPT), which iteratively shrinks a coordinatewise rejection threshold s_t(x_i)
  using full-sample mirror-masked p-values min(P_i, 1 - P_i) rather than learning out-of-fold cross-weights
  W_i = W_hat^{-ell}(X_i) for weighted Benjamini-Hochberg, weighted Storey, weighted k-Bonferroni, or
  weighted Benjamini-Yekutieli procedures via Grenander least-concave-majorant linear programming; distinct
  from AIMech:SelectivelyTraversedAccumulationRulesForStructuredFDRControl (Lei, Ramdas, & Fithian 2021,
  STAR), which enforces combinatorial structural constraints R_t in K by interactive filtration peeling
  with accumulation functions h(p); and distinct from AIMech:ConditionalCalibrationForFalseDiscoveryRateControl
  (Fithian & Lei 2022, dBH), which calibrates hypothesis-specific thresholds under known conditional null
  distributions rather than learning out-of-fold covariate weights from side information X_i.
