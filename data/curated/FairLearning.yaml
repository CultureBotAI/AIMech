claims:
- claim_id: method-scope
  kind: mechanism
  statement: Given a causal model and each training case, infer the posterior of background variables
    conditioned on observed features and protected attributes. Approximate the expected loss with MCMC
    samples when needed, expand the training cases with these latent samples, and fit a predictor using
    the sampled background variables and observed non-descendants. The paper reports predictions by posterior-averaging
    the fitted latent predictor for a new case.
