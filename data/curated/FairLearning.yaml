name: FAIRLEARNING
definition: A causal-model-dependent learning procedure that minimizes predictive loss averaged over inferred
  background variables, restricting the latent predictor to those variables and observed non-descendants
  of protected attributes.
concept_kind: algorithm
identity_notes: The named training algorithm is distinct from CounterfactualFairness, the causal model
  supplied to it and any particular fitted predictor. The source distinguishes the latent predictor from
  its posterior-averaged reported prediction; this record preserves that distinction. All 442 pinned AIO
  labels/scoped synonyms and 99 preceding native identities were compared, together with hidden/ignored-inclusive
  searches of both checkouts; source citations and pending frontier mentions were distinguished from existing
  concept identities.
limitations:
- A causal model is an input, and compatible observed distributions need not identify its counterfactual
  assumptions.
- Lemma 1 applies to functions of non-descendants in the posited model. This record does not turn that
  lemma into an unconditional guarantee for an arbitrary deployed posterior-mean predictor or a misspecified
  model.
- Posterior inference and Monte Carlo or optimization approximations introduce computational and estimation
  dependencies; no exact finite-sample guarantee is asserted.
- Protected attributes and descendant features can inform latent posterior inference even though the latent
  predictive function is restricted; excluding a raw feature alone is a different procedure.
aliases:
- Kusner counterfactual fair learning
