id: AIMech:SWATS
name: SWATS
concept_kind: algorithm
review_status: DRAFT
definition: A hyperparameter-free hybrid stochastic optimization strategy (Switching from Adam to SGD) that begins training in an Adam phase, estimates a scalar SGD step size gamma_k = (p_k^T p_k) / (-p_k^T g_k) at each step k by solving the projection equation proj_{-gamma_k g_k} p_k = p_k between the Adam step p_k and negative stochastic gradient -g_k, tracks an exponential moving average lambda_k = beta_2 lambda_{k-1} + (1 - beta_2) gamma_k reusing Adam's second-moment decay rate beta_2, and permanently switches to SGD (or SGDM with momentum beta_1 and scale (1 - beta_1) Lambda) with scalar learning rate Lambda = lambda_k / (1 - beta_2^k) as soon as |lambda_k / (1 - beta_2^k) - gamma_k| < epsilon.
identity_notes: Distinct from AdaBound/AMSBound (AIMech:AdaBoundAndAMSBound, which smoothly pinches coordinate-wise step sizes via scheduled upper and lower bounds parameterized by gamma) and from Padam (AIMech:Padam, which maintains a constant partial-adaptivity power p in (0, 1/2] throughout training). SWATS executes a discrete phase switch from Adam to uniform-step-size SGD(M) where both the switchover iteration and the post-switch SGD learning rate Lambda are inferred automatically from the projection of -gamma_k g_k onto p_k.
aliases:
- Switching from Adam to SGD Optimization Strategy
- Gradient-Subspace Projected Adam-to-SGD Hybrid Optimizer
- Automated Adam-to-SGD Switchover Optimization
