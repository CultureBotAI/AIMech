claims:
- claim_id: swats-non-orthogonal-projection-and-rayleigh-quotient-identity
  kind: mechanism
  statement: Given stochastic gradient g_k and Adam step p_k != 0 with p_k^T g_k < 0, SWATS solves proj_{-gamma_k g_k} p_k = -gamma_k ((g_k^T p_k) / (p_k^T p_k)) p_k = p_k in closed form to obtain gamma_k = (p_k^T p_k) / (-p_k^T g_k); when beta_1 = 0 so p_k = -H_k g_k with diagonal preconditioner H_k > 0, gamma_k > 0 equals the reciprocal of the Rayleigh quotient of H_k^{-1} with respect to p_k and avoids the systematic step-size underestimation of the orthogonal projection proj_{p_k}(-g_k).
  evidence:
  - source_id: r615-primary-pdf
    locator: Section 2.1 (Learning rate for SGD after the switch) and Figure 3, p. 3-5
    relation: supports
  - source_id: r615-metadata-cr
    locator: Bibliographic metadata for Keskar & Socher 2017
    relation: supports
- claim_id: swats-bias-corrected-ema-switchover-and-column-space-scope
  kind: scope
  statement: SWATS smooths gamma_k via lambda_k = beta_2 lambda_{k-1} + (1 - beta_2) gamma_k and triggers a permanent switch to SGD(M) with learning rate Lambda = lambda_k / (1 - beta_2^k) and momentum update v_k = beta_1 v_{k-1} + g_k, w_k = w_{k-1} - (1 - beta_1) Lambda v_k when |lambda_k / (1 - beta_2^k) - gamma_k| < epsilon (k > 1), transitioning from non-uniform diagonal scaling to isotropic updates that remain within the gradient column space.
  evidence:
  - source_id: r615-primary-pdf
    locator: Section 2.2 (Switchover Point, Equation 4), Algorithm 1, and Section 4, p. 4-5, 8
    relation: supports
- claim_id: swats-vision-and-language-modeling-generalization-applications
  kind: application
  statement: SWATS closes the test-error generalization gap between Adam and tuned SGD(M) on CIFAR-10 and CIFAR-100 across ResNet-32, DenseNet, PyramidNet, and SENet as well as ResNet-18 on Tiny-ImageNet, while matching Adam's validation perplexity on Penn Treebank and WikiText-2 word-level language modeling with AWD-LSTM and AWD-QRNN.
  evidence:
  - source_id: r615-primary-pdf
    locator: Section 3 (Numerical Results), Table 1 and Figures 4-7, p. 5-9
    relation: supports
- claim_id: swats-hard-switch-transient-degradation-and-irreversibility-limitation
  kind: limitation
  statement: Because SWATS executes an abrupt one-way hard switch from per-coordinate adaptive scaling to a single scalar SGD learning rate and resets the momentum buffer v_k = 0 at switchover, it can induce a sharp temporary drop in test accuracy immediately after the switch (such as dropping from 80% to 52% on Tiny-ImageNet before recovering) and cannot switch back if gradient scales later become ill-conditioned.
  evidence:
  - source_id: r615-primary-pdf
    locator: Section 3 (p. 6, Figure 5) and Section 4 (Discussion and Conclusion, p. 8)
    relation: supports
