claims:
- claim_id: dirac-uniform-aorc-derivation-and-regularized-rejection-curves
  kind: mechanism
  statement: 'Under the limiting Dirac-uniform configuration DU_infty(zeta) with limiting empirical c.d.f.
    F_infty(t | zeta) = (1 - zeta) + zeta*t for zeta in [alpha, 1), setting the asymptotic FDR equal to
    alpha via FDR_zeta(t_zeta) = t_zeta*zeta / ((1 - zeta) + t_zeta*zeta) = alpha yields t_zeta = alpha*(1
    - zeta) / (zeta*(1 - alpha)) and uniquely defines the Asymptotically Optimal Rejection Curve (AORC)
    f_alpha(t) = t / (t*(1 - alpha) + alpha) on [0, 1] with inverse f_alpha^{-1}(u) = alpha*u / (1 - (1
    - alpha)*u) = 1 - f_alpha(1 - u) and critical values alpha_{i:n} = f_alpha^{-1}(i/n) = i*alpha / (n
    - i*(1 - alpha)) (Section 3, pages 599-601, Equation (3.1), Remark 3.1). Because alpha_{n:n} = 1 causes
    an unadjusted step-up procedure to reject all n hypotheses whenever p_{n:n} < 1, Examples 3.1-3.3
    (pages 600-602) construct three regularized AORC families: (1) order-lambda_n(lambda) step-up-down
    (SUD) procedures phi^lambda with lambda_n(lambda)/n -> lambda in [0, 1), (2) linearly adjusted step-up
    procedures based on f^{(1)}_{alpha,kappa} (tangent continuation h_1(x) = f_alpha''(kappa)*(x - kappa)
    + f_alpha(kappa) reaching 1 at x^* = kappa*(1 - alpha)*(2 - kappa) + alpha) and f^{(2)}_{alpha,kappa}
    (secant continuation h_2(x) = x*f_alpha(kappa)/kappa reaching 1 at x^* = kappa*(1 - alpha) + alpha),
    and (3) truncated step-up procedures with critical value curve rho_alpha(x) = min{f_alpha^{-1}(x),
    kappa}.'
  evidence:
  - source_id: finner-dickhaus-roters2009-pdf
    locator: Section 3, pages 599–602, Equation (3.1), Remark 3.1, Examples 3.1–3.3, and Figure 1
    relation: supports
  - source_id: finner-dickhaus-roters2009-abs
    locator: Abstract (derivation of the AORC from Dirac-uniform configurations and adjusted step-up /
      step-up-down procedures)
    relation: supports
- claim_id: finite-sample-fdr-bounds-under-monotonicity-and-isotonic-majorant
  kind: mechanism
  statement: Section 4 (pages 602-606) introduces structural test properties (T1)-(T2), conditional rejection-monotonicity
    conditions (D1)-(D2) (where (D1) requires t -> P_vartheta(R_n >= j | p_i <= t) to be nonincreasing
    on (0, alpha_{j:n}], which is strictly weaker than PRDS by Wijsman's inequality), and independence
    conditions (I1)-(I2). Theorem 4.1 (page 603, Equations (4.1)-(4.5)) proves that any multiple test
    satisfying (T1), (D1), and (D2) with Simes critical values alpha_{i:n} = i*alpha/n satisfies FDR_vartheta(phi_{(n)})
    <= (n_0/n)*alpha. For general critical values alpha_{i:n} = rho(i/n) satisfying regularity assumption
    (A1), Theorem 4.3 (page 605, Equations (4.6)-(4.12)) defines q(x) = rho(x)/x and its least isotonic
    (nondecreasing) majorant q_bar(x) = max_{0 <= t <= x} q(t) on [0, 1] and proves the universal finite-sample
    upper bound FDR_vartheta(phi_{(n)}) <= (n_0/n)*E_{vartheta^{i_0}}[q_bar(R_n/n)] <= (n_0/n)*E_{I_0'}[q_bar(R_n/n)]
    under (T1)-(T2) and (I1)-(I2), with exact equality in the first inequality of Equation (4.7) for step-up
    tests when (A2) holds (i.e., q(x) = rho(x)/x is nondecreasing on [0, 1]).
  evidence:
  - source_id: finner-dickhaus-roters2009-pdf
    locator: Section 4, pages 602–606, Assumptions (T1)–(T2), (D1)–(D2), (I1)–(I2), (A1)–(A2), Theorems
      4.1–4.3, and Equations (4.1)–(4.12)
    relation: supports
- claim_id: glivenko-cantelli-asymptotic-fdr-control-and-aorc-optimality
  kind: mechanism
  statement: Under the asymptotic empirical c.d.f. convergence sup_{t in [0,1]} |F_n(t) - G_vartheta(t)|
    -> 0 a.s. (Equation (5.2)) with G_vartheta(t) = zeta*t + (1 - zeta)*F_1(t), Theorems 5.1-5.4 (Section
    5, pages 606-612, Equations (5.1)-(5.11)) prove that if G_vartheta(rho(x)) has a unique crossing point
    r^* in (0, f_alpha(t_zeta)] with G_vartheta(rho(x)) > x on [0, r^*) and G_vartheta(rho(x)) < x on
    (r^*, 1], then R_n/n -> r^* a.s. and lim_{n->infty} FDR_vartheta(phi_{(n)}) = zeta*rho(r^*)/r^* =
    zeta*q(r^*) <= min{alpha, zeta} (Theorem 5.2), while for r^* = 0 under condition (5.8) or a continuous
    p.d.f. f_1 on [0, x_0], limsup_{n->infty} FDR_vartheta(phi_{(n)}) <= zeta*q(0) <= zeta*alpha (Theorems
    5.3-5.4). Corollary 5.1 (page 611) establishes asymptotic level-alpha FDR control for the SUD procedure
    phi^lambda (attaining limiting FDR = alpha for all DU_infty(zeta) with zeta in [alpha, 1]) and for
    the adjusted and truncated step-up procedures based on f^{(1)}_{alpha,kappa}, f^{(2)}_{alpha,kappa},
    and min{f_alpha^{-1}(x), kappa} (attaining limiting FDR = alpha for zeta >= zeta^*(kappa) = alpha
    / (kappa*(1 - alpha) + alpha)). Theorem 5.5 (pages 613-614, Equations (5.12)-(5.14)) proves that every
    regular rejection curve r in M_1 controlling asymptotic FDR at level alpha satisfies r(t) >= f_alpha(t)
    on [0, lambda] so inf_{r in M_1} r = f_alpha, and consequently f_alpha maximizes the asymptotic power
    beta_bar_vartheta(phi) = liminf_{n->infty} E_vartheta[S_n/n_1].
  evidence:
  - source_id: finner-dickhaus-roters2009-pdf
    locator: Section 5, pages 606–614, Theorems 5.1–5.5, Corollary 5.1, Remarks 5.1–5.2, and Equations
      (5.1)–(5.14)
    relation: supports
  - source_id: finner-dickhaus-roters2009-abs
    locator: Abstract (asymptotic FDR control for SUD and adjusted step-up procedures and asymptotic optimality
      of the AORC)
    relation: supports
- claim_id: finite-sample-dirac-uniform-overshoot-and-beta-adjusted-critical-values
  kind: mechanism
  statement: 'Section 6 (pages 614-616, Figure 2 and Equation (6.1)) evaluates the exact finite-sample
    FDR of the step-up procedure based on the secant-adjusted AORC f^{(2)}_{0.05,kappa_2} (with kappa_2
    = (x^* - alpha)/(1 - alpha) = 9/19 ~= 0.47368421 so f^{(2)}_{0.05,kappa_2}(1/2) = 1) under finite-sample
    Dirac-uniform configurations DU_n(n_0/n) at alpha = 0.05 and n = 100, showing that finite-sample FDR
    exceeds alpha = 0.05 for intermediate n_0 (attaining its maximum of 0.058013 ~= 0.05801 at n_0 = 16).
    To enforce strict finite-sample FDR control while preserving convergence to the AORC as n -> infty
    whenever beta_n = o(n), Equation (6.1) (page 615) introduces the beta_n-adjusted critical values alpha_{i:n}(beta_n)
    = i*alpha / (n + beta_n - i*(1 - alpha)) for i = 1, ..., n: setting beta_n == 1 recovers the Gavrilov-Benjamini-Sarkar
    (2009) step-down critical values i*alpha / (n + 1 - i*(1 - alpha)) (which still exceed alpha = 0.05
    for a step-up procedure at n = 100 with max FDR 0.060123), whereas setting beta_{100} = 1.76 achieves
    strict finite-sample step-up FDR control across all n_0 at n = 100, alpha = 0.05 (max FDR 0.049959
    <= 0.05).'
  evidence:
  - source_id: finner-dickhaus-roters2009-pdf
    locator: Section 6, pages 614–616, Figure 2 and Equation (6.1)
    relation: supports
