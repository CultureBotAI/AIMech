id: AIMech:AsymptoticallyOptimalRejectionCurveFDRControl
name: asymptotically optimal rejection curve false discovery rate control and adjusted step-up-down testing
aliases:
- Finner-Dickhaus-Roters Asymptotically Optimal Rejection Curve (AORC) Framework
- Dirac-Uniform Asymptotically Optimal Rejection Curve f_alpha(t) = t / (t*(1 - alpha) + alpha)
- Adjusted, Truncated, and Step-Up-Down AORC Multiple Testing Procedures
concept_kind: mathematical_method
definition: 'An asymptotic and finite-sample multiple hypothesis testing framework introduced by Helmut
  Finner, Thorsten Dickhaus, and Markus Roters (2009, Annals of Statistics 37(2):596-618, arXiv:0903.5161v1,
  DOI:10.1214/07-AOS569) that derives the Asymptotically Optimal Rejection Curve (AORC) f_alpha(t) = t
  / (t*(1 - alpha) + alpha) for t in [0, 1] with inverse critical value function f_alpha^{-1}(u) = alpha*u
  / (1 - (1 - alpha)*u) = 1 - f_alpha(1 - u) and induced critical values alpha_{i:n} = i*alpha / (n -
  i*(1 - alpha)) (Section 3, Equation (3.1), Remark 3.1) by exhausting the False Discovery Rate (FDR)
  level alpha in (0, 1) across all limiting Dirac-uniform configurations DU_infty(zeta) with limiting
  empirical c.d.f. F_infty(t | zeta) = (1 - zeta) + zeta*t (zeta in [alpha, 1)). Because alpha_{n:n} =
  1 causes an unadjusted step-up procedure based on f_alpha to reject all n hypotheses whenever p_{n:n}
  < 1, the framework introduces three families of regularized AORC procedures (Examples 3.1-3.3): (1)
  step-up-down (SUD) procedures phi^lambda of asymptotic order lambda in [0, 1), (2) linearly adjusted
  step-up procedures based on f^{(1)}_{alpha,kappa} (tangent continuation h_1(x) = f_alpha''(kappa)*(x
  - kappa) + f_alpha(kappa)) and f^{(2)}_{alpha,kappa} (secant continuation h_2(x) = x*f_alpha(kappa)/kappa),
  and (3) truncated step-up procedures with critical value curve rho_alpha(x) = min{f_alpha^{-1}(x), kappa}.
  It establishes general finite-sample FDR upper bounds via conditional rejection-monotonicity conditions
  (D1)-(D2) and the least isotonic majorant q_bar(x) = max_{0 <= t <= x} rho(t)/t (Section 4, Theorems
  4.1-4.3, Equations (4.1)-(4.12)), proves asymptotic FDR control at level alpha with exact limiting FDR
  formulas at nonzero and zero crossing points r^* (Section 5, Theorems 5.1-5.4, Corollary 5.1, Equations
  (5.1)-(5.11)), proves that f_alpha is the pointwise minimal rejection curve and maximizes asymptotic
  power beta_bar_vartheta over the class M_1 of regular asymptotic level-alpha rejection curves (Theorem
  5.5, Equations (5.12)-(5.14)), and introduces the finite-sample beta_n-adjusted critical values alpha_{i:n}(beta_n)
  = i*alpha / (n + beta_n - i*(1 - alpha)) (Section 6, Equation (6.1)).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 599 previously curated AIMech concepts.
  While AIMech:ExactStepUpStepDownFDPMomentsAndLFCAnalysis (Roquain & Villers 2011) uses the Finner-Roters
  order-statistic identity for linear step-down FDR calculations and studies exact finite-sample FDP moments
  and step-down Condition (A), and AIMech:StepUpDownLeastFavorableConfigurationFDRBounds (Blanchard, Dickhaus,
  Roquain, & Villers 2014) analyzes finite-sample upper and lower FDR bounds for general step-up-down
  procedures of order r, neither record defines the Asymptotically Optimal Rejection Curve f_alpha(t)
  = t / (t*(1 - alpha) + alpha) and its critical values alpha_{i:n} = i*alpha / (n - i*(1 - alpha)) (Equation
  (3.1)), the tangent- and secant-adjusted rejection curves f^{(1)}_{alpha,kappa} and f^{(2)}_{alpha,kappa}
  or truncated curve min{f_alpha^{-1}(x), kappa} (Examples 3.1-3.3), the least isotonic majorant finite-sample
  bound FDR_vartheta <= (n_0/n)*E_{I_0'}[q_bar(R_n/n)] under conditions (D1)-(D2) (Theorems 4.1-4.3),
  the Glivenko-Cantelli crossing-point asymptotic FDR theorems and pointwise minimality / asymptotic power
  optimality of f_alpha over M_1 (Theorems 5.1-5.5, Corollary 5.1), or the finite-sample beta_n-adjusted
  critical value family alpha_{i:n}(beta_n) = i*alpha / (n + beta_n - i*(1 - alpha)) (Equation (6.1)).
