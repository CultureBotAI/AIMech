aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Asymptotically optimal rejection curves and regularized step-up-down and step-up critical
    value families control the False Discovery Rate (FDR) in large-scale simultaneous hypothesis testing
    while maximizing asymptotic power, directly addressing multiplicity-induced false positives (AIO:DataDredgingBias).
limitations:
- An unadjusted step-up procedure using the raw AORC critical values alpha_{i:n} = i*alpha / (n - i*(1
  - alpha)) sets alpha_{n:n} = 1 and therefore rejects all n hypotheses with probability 1 whenever p_{n:n}
  < 1, yielding FDR = n_0/n > alpha for n_0/n > alpha; asymptotic FDR control requires step-up-down regularization
  of order lambda < 1, linear tangent/secant adjustment above kappa < 1, or truncation at kappa < 1 (Section
  3, Examples 3.1-3.3, pages 600-602).
- Even after linear secant adjustment f^{(2)}_{alpha,kappa_2} with x^* = 1/2, the resulting step-up procedure
  controls the FDR only asymptotically as n -> infty and exhibits finite-sample FDR overshoot under Dirac-uniform
  configurations (reaching 0.058013 > 0.05 at n_0 = 16 for n = 100, alpha = 0.05 in Figure 2, page 614)
  unless damped by a finite-sample shift beta_n = O(n^{1/2+eps}) in Equation (6.1) (Section 6, pages 614-616).
- At the boundary crossing point r^* = 0 (which corresponds to the global null zeta = 1 or vanishing signal),
  asymptotic FDR control in Theorems 5.3-5.4 requires either the growth condition lim_{n->infty} (1/log
  n) sum_{i=1}^n (q_bar(i/n) - q(0)) ((i/n)/rho(i/n) - 1) = 0 (Equation (5.8)) or a continuous alternative
  density f_1 near zero; for exact AORC critical values below kappa, q_bar(x) - q(0) = alpha*(1 - alpha)*x
  / (1 - (1 - alpha)*x) = O(x) violates Equation (5.8) so a vanishing proportion of Dirac-zero alternatives
  can still cause local overshoot near zeta = 1 unless regularized (Remark 5.1, pages 611-612; Section
  7, pages 616-617).
- All 24 pages of the full-text PDF of Finner, Dickhaus, & Roters (2009, Annals of Statistics 37(2):596-618,
  arXiv:0903.5161v1, DOI:10.1214/07-AOS569) were read. Constructed numerical checks in research/discovery/asymptotically-optimal-rejection-curve-fdr-control-boundaries.py
  verify (1) Section 3 AORC identities and symmetry f_alpha^{-1}(t) = 1 - f_alpha(1 - t), (2) Examples
  3.2-3.3 and Figure 1 tangent and secant adjustment thresholds (kappa_1 = 0.27452375, kappa_2 = 0.47368421
  for x^* = 0.5, alpha = 0.05), (3) Section 6 Figure 2 exact finite-sample Dirac-uniform FDR benchmark
  at n = 100, alpha = 0.05 via high-precision Bolshev/Steck recursion (reproducing argmax n_0 = 16 and
  max FDR = 0.058013 matching the paper's reported 0.05801 to five decimal places), (4) Section 6 Equation
  (6.1) finite-sample beta_n adjustment showing that beta_{100} = 1.76 is the exact two-decimal threshold
  achieving strict step-up FDR control <= 0.05 at n = 100 (max FDR = 0.049959 vs 0.060123 for beta_n =
  1.0), and (5) Corollary 5.1 and Theorem 5.5 asymptotic rejection proportion dominance over Simes LSU
  (0.78947368 vs 0.75949367 at zeta = 0.25, alpha = 0.05).
