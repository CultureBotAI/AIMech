  relation: supports
claims:
- claim_id: generative-mechanism
  kind: mechanism
  statement: A consistency function assigns the same low-noise endpoint to states on the same probability-flow
    trajectory. The paper's skip-connected parameterization combines an input skip term and a learned
    term whose coefficients enforce the identity boundary at the minimum noise level. Generation applies
    the model to high-noise input; multistep generation interleaves model evaluation with noise injection.
    The original paper describes both diffusion-model-assisted distillation and direct consistency training
    with shared-noise adjacent perturbations of a data sample.
  evidence:
  - source_id: original-paper
    locator: Section 3, equation (5), Algorithm 1 and boundary-condition discussion, PDF pp. 3–4; Sections
      4–5, Algorithms 2–3, PDF pp. 4–6
    relation: supports
- claim_id: original-training-theory-limitation
  kind: limitation
  statement: The later paper gives a point-mass-data counterexample in which the limiting consistency-training/matching
    objective with unequal teacher and student parameters loses dependence on the data location. It motivates
    zero teacher EMA decay, with a stop-gradient teacher sharing current student parameters, for consistency
    training; this is distinct from averaging the model used for inference.
  evidence:
  - source_id: training-correction
    locator: Section 2, teacher versus inference EMA, PDF p. 3; Section 3.2, Proposition 1 and equations
      (6)–(7), PDF pp. 5–6
    relation: supports
