name: Consistency model
definition: A generative model family that learns a noise- or time-conditioned function mapping points
  on a probability-flow ODE trajectory to its common low-noise endpoint, enabling a sample to be obtained
  with one model evaluation and allowing optional multistep refinement.
concept_kind: model_family
identity_notes: All 442 pinned AIO labels and scoped synonyms and 90 preceding native identities were
  checked, with ignored-inclusive text searches of both checkouts. The identity is the endpoint-map model
  family introduced by Song and colleagues, not generic logical consistency, a trained checkpoint, or
  one particular training loss. Original consistency distillation, original consistency training and improved
  consistency training are procedures for learning this family and are not aliases for the model family
  itself.
limitations:
- The learned consistency model is not required to be invertible. Ideal probability-flow properties do
  not establish exact data recovery or perfect self-consistency for a finite trained model.
- The original direct consistency-training teacher uses EMA; the later inspected correction identifies
  a failure of its original asymptotic justification when teacher and student parameters differ. This
  record does not endorse that original training argument as generally valid.
- The correction concerns consistency training and does not remove EMA from all distillation procedures
  or from the separate inference-time averaged model.
- One-evaluation generation is an available procedure, not a universal image-quality guarantee. No benchmark
  reproduction or independently verified convergence proof is claimed.
