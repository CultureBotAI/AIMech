claims:
- claim_id: method
  kind: mechanism
  statement: Choose clique energies over T=(X,U,Y) on a finite neighborhood graph and normalize p(x,u,y)
    proportional to exp(-sum_c phi_c(x_c,u_c,y_c)). At observed y, the augmented hidden field V_s=(X_s,U_s)
    has a Gibbs posterior on that graph, even when the marginalized target posterior p(x|y) does not.
    Sample or otherwise infer that augmented posterior, then sum p(X_s=x,U_s=u|y) over u at fixed x to
    obtain the target-site posterior; its maximizer is the sitewise marginal-posterior-mode estimate.
    The paper illustrates a Markov auxiliary field with local conditionally independent X and Y, and experiments
    with a more restricted Markov V field and independent Gaussian site observations. Neither p(x,u) nor
    p(x,y) is required to be Markov in the general joint-triplet definition. The proposed parameter-estimation
    use of ICE averages a chosen complete-data estimator under the current augmented posterior, exactly
    when that expectation is available or approximately from posterior samples.
