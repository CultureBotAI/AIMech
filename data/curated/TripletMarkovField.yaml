name: Triplet Markov field
definition: A latent-variable spatial-model family that introduces an auxiliary field so the complete
  hidden, auxiliary and observed triplet has a normalized Gibbs factorization on a specified neighborhood
  graph, while its hidden–observed projection need not remain Markov on that graph.
concept_kind: model_family
identity_notes: The inspected construction uses finite target labels X_s and auxiliary states U_s with
  observed Y_s, and imposes spatial Markov structure on T_s=(X_s,U_s,Y_s). Triplet refers to three processes
  at each site, not three-site clique size. A pair field embeds through a constant or redundant auxiliary
  coordinate; general triplet fields can have projections outside that pair-field family. This is distinct
  from a triplet Markov chain, a neural hidden layer or an emitted-symbol memory mechanism. No normalized
  identity match was found across all 442 pinned AIO labels and all scoped synonyms and 391 preceding
  native IDs, names and aliases for the three selected concepts. Full-checkout fixed-string searches included
  ignored and hidden files in both worktree and main, yielding 9 and 9 matched lines; all 7 unique contents
  were read. Hits are prior leads and references, not records of the proposed identities. All 89 semantic
  label/synonym hits and 21 fully annotated exact AIO CLASS nodes with outgoing edges were read. Twenty-two
  contextual YAMLs were byte-verified after prior full reading and five freshly read, totaling 21 generated
  and six native contextual records. Short acronym identities were compared across the complete normalized
  inventory. Absence is bounded to the pinned source, maintained collection and inspected semantic neighborhood.
limitations:
- The augmented joint law must be normalizable and the observed evidence positive. A finite-site Gibbs
  factorization does not itself make marginal likelihoods, posterior probabilities or sampling computationally
  easy.
- Marginalizing U can induce additional interactions; an implementation cannot assume p(X|Y) retains the
  original local graph. Maximizing over U before choosing X can disagree with summing over U, and sitewise
  marginal decoding differs from global configuration MAP.
- The experiments restrict the (X,U) prior to a Potts-style field and use sitewise Gaussian observations.
  Those restrictions are examples, not defining requirements of every triplet field. Non-Gaussian and
  broader graphical extensions in the conclusion are follow-up work.
- ICE is conditional expectation of a complete-data estimator, whereas EM optimizes an expected complete
  log likelihood. The interchange needed to identify them is not automatic; likelihood monotonicity and
  global convergence are not guaranteed merely by the ICE name. Gibbs/Metropolis feasibility does not
  establish exact independent finite samples.
- The least-squares spatial estimator used in the example is referenced rather than fully derived here.
  Empty empirical classes, constrained parameter values, initialization and sampling convergence need
  explicit handling in an implementation.
- The synthetic examples and one radar-image grouping compare particular fitted or chosen baselines. They
  do not establish the paper’s broad suggestion of universal superiority, and no numerical performance
  claim or author-code reproduction is curated.
