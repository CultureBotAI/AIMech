id: AIMech:BulyanByzantineResilientGradientAggregation
name: Bulyan (Byzantine-Resilient Gradient Meta-Aggregation Rule)
concept_kind: algorithm
review_status: DRAFT
definition: Bulyan (or Bulyan(A)) is a two-stage Byzantine-resilient gradient meta-aggregation rule for distributed stochastic gradient descent over n >= 4f + 3 workers (up to f Byzantine) that eliminates the high-dimensional coordinate-wise poisoning leeway Omega(d^{1/p}) of l_p-norm distance-based aggregation rules A (such as Krum, Brute, or GeoMed) by (1) recursively invoking A without replacement theta = n - 2f >= 2f + 3 times to build a selection set S = (S_1, ..., S_theta) guaranteed to contain a strict majority of non-Byzantine gradients, and (2) computing each i-th coordinate of the aggregated gradient G[i] = (1/beta) sum_{X in M[i]} X[i] as the average of the beta = theta - 2f >= 3 values in S closest to the coordinate median median[i] = argmin_{m=Y[i], Y in S} sum_{Z in S} |Z[i] - m|.
identity_notes: Introduced by El Mahdi El Mhamdi, Rachid Guerraoui, and Sebastien Rouault in 'The Hidden Vulnerability of Distributed Learning in Byzantium' (ICML 2018, PMLR 80:3518-3527; arXiv:1802.07927). Distinct from Krum and Multi-Krum (Blanchard et al. NeurIPS 2017), which select and average whole vectors using Euclidean pairwise distance scores without coordinate-wise median trimming and thus remain vulnerable to single-coordinate O(sqrt(d)) poisoning; and distinct from Coordinate-Wise Median and Trimmed Mean (Yin et al. ICML 2018), which apply coordinate-wise order statistics directly to all n submitted vectors without a first-stage (alpha, f)-Byzantine-resilient vector selection quorum S.
