claims:
- claim_id: bulyan-high-dimensional-lp-norm-poisoning-leeway-analysis
  kind: mechanism
  statement: In dimension d >> 1, any l_p-norm distance-minimization gradient aggregation rule (including Brute, Krum, and GeoMed) allows an omniscient adversary submitting B(gamma) = (1/(n - f)) sum_{V in Q} V + gamma E on a single coordinate E = (0, ..., 1, ..., 0) to be selected while injecting a coordinate-wise poisoning margin of gamma_m = O(bar_delta d^{1/p}) for Brute and gamma_m = O(bar_delta f^{1/q} d^{1/p}) for Krum (q=2) and GeoMed (q=1), or driving l_infty-norm rules along E = (1, ..., 1) into ineffective non-convex subspaces.
  evidence:
  - source_id: r518-primary-pdf
    locator: Section 3.1-3.3, pages 4-5; Appendix B.1-B.3, pages 12-13
    relation: supports
- claim_id: bulyan-two-stage-selection-and-coordinate-wise-leeway-reduction
  kind: mechanism
  statement: Given n >= 4f + 3 workers and any (alpha, f)-Byzantine-resilient rule A, Bulyan(A) recursively selects theta = n - 2f >= 2f + 3 vectors into S and averages the beta = theta - 2f >= 3 closest values to median[i] on each coordinate i in [1..d]; Proposition 2 proves that every selected coordinate B[i] in M[i] is bracketed by at least two honest workers g_l[i] <= B[i] <= g_r[i], narrowing the expected component-wise attacker leeway to E|Bu_t[i] - g_k[i]| = O(sigma / sqrt(d)) while preserving (alpha, f)-Byzantine-resilience and almost-sure convergence (Corollaries 1-2).
  evidence:
  - source_id: r518-primary-pdf
    locator: Section 4, Proposition 2 and Corollaries 1-2, pages 5-6
    relation: supports
- claim_id: bulyan-amortized-quadratic-complexity-and-empirical-resilience
  kind: application
  statement: Proposition 1 proves that Bulyan(A) has average master complexity O((n - 2f) C + d n) and, by reusing pairwise distance computations across the theta iterations of Krum or GeoMed, achieves the same O(n^2 d) asymptotic complexity as base Krum or GeoMed; on MNIST (d approx 8 x 10^4) and CIFAR-10 (d approx 10^6) with 30 honest and 9 Byzantine workers under the curse-of-dimensionality attack, Bulyan(Krum) matches unattacked honest averaging while standalone Krum and GeoMed degrade or fail to learn (Figures 4-5).
  evidence:
  - source_id: r518-primary-pdf
    locator: Section 4, Proposition 1, page 5; Section 5.2.2, Figures 4-5, pages 7-8
    relation: supports
