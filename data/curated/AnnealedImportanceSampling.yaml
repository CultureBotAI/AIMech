  rationale: AIS uses Markov kernels preserving successive auxiliary distributions to construct weighted
    paths. The local estimation algorithm is related to the target process/model; it is not asserted to
    be a neural network, hidden layer or equivalent Markov-chain class.
limitations:
- The maintained identity is the fixed-sequence weighted-path estimator. Resampling particle systems,
  linked importance sampling, adaptive schedules and full up/down tempered transitions need their own
  definitions and evidence.
- The intermediate-state paragraph on PDF p. 6 says x_j follows T_(j−1), inconsistent with Equation 4.
  For 0<=j<=n−2, x_j follows T_(j+1); the top state x_(n−1) is drawn directly from p_n, with no T_n application.
  The maintained algorithm uses Equations 4–5 and this initial-draw exception.
- Missing support or noninvariant transitions invalidate the weighting identity. Finite precision, underflow
  and practical transition implementations were not audited.
- All 25 source pages were inspected, using images for plot-heavy pages 14–15; method pages 4–6 were visually
  checked. Journal bytes, author software, model fits and benchmark replication were not assessed. DRAFT
  remains.
