claims:
- claim_id: method
  kind: mechanism
  statement: 'For x_i>=0 under product Lebesgue measure, set H(x)=sum_j sum_(ell<=j) <Psi_j^ell,(x^(1/j))^(tensor
    ell)> with finite real super-symmetric tensors zero on repeated indices, and p(x)=exp(H(x))/Z for
    0<Z<infinity. Let L(x)=sum_j <Psi_j^j,(x^(1/j))^(tensor j)> collect the degree-one terms. If L(v)<0
    for every v>=0 with sum_i v_i=1, continuity on this compact simplex yields L(x)<=-c*sum_i x_i for
    some c>0. Each remaining term has degree r=ell/j<1 and is bounded in magnitude by a constant times
    (sum_i x_i)^r. Their finite sum is at most epsilon*sum_i x_i+C for any epsilon>0 with a suitable finite
    C. Choosing epsilon<c gives an integrable product-exponential envelope. This is a sufficient strict
    regime, not a complete characterization: with only negative unary square-root terms the degree-one
    part vanishes but the joint integral is product_i 2/b_i^2 for b_i<0. The site conditional has kernel
    exp[sum_j eta_js*t^(1/j)] on t>=0. Only negative linear unary terms remaining gives independent exponentials
    of rates -Psi_1^1[i]; k=2 recovers exponential SQR.'
