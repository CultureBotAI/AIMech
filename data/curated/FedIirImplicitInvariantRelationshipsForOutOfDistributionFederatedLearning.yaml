claims:
- claim_id: r466-prediction-disagreement-taylor-bound-and-classifier-gradient-alignment-mechanism
  kind: mechanism
  statement: Bounds pairwise client prediction disagreement after one classifier gradient step by sup_z ||nabla_omega w(z; omega)|| * ||nabla_omega R_c(theta) - nabla_omega R_{c'}(theta)|| via a first-order Taylor expansion (Section 3.2, p. 4) and minimizes E_c[R_c(f) + (gamma / 2) ||nabla_omega R_c(f) - g_tilde_omega^t||^2] using a server-maintained exponential moving average g_tilde_omega^t of shallow classifier gradients (Algorithm 1, p. 5).
  evidence:
  - source_id: r466-primary-pdf
    locator: Section 3.2 Implicitly Learn Invariant Relationships & Section 3.3 Algorithm 1, pp. 4-5, and Appendix C, p. 14
    relation: supports
- claim_id: r466-affine-hull-generalization-bound-and-convergence-scope
  kind: scope
  statement: Proves that for any non-participating OOD client P_lambda = sum_{c in C_{par}} lambda_c P_c in the affine hull Lambda_nu = {lambda | lambda_c >= -nu, sum_c lambda_c = 1}, the worst-case risk is bounded by R(f) + M_tilde I(Phi, C_{par}) + M_tilde sup_{(c, c')} rho(P_c(X), P_{c'}(X)) with M_tilde = (1 + |C_{par}| nu) M (Theorem 3, p. 6), and establishes linear convergence under the mu-PL condition (Theorem 4) and O(1 / sqrt(T C K)) non-convex stationarity (Theorem 5).
  evidence:
  - source_id: r466-primary-pdf
    locator: Sections 4.1-4.2 Generalization & Convergence Analysis (Theorems 3-5), pp. 5-7, and Appendices D-E, pp. 15-24
    relation: supports
- claim_id: r466-hessian-vector-product-and-step-size-scaling-limitation
  kind: limitation
  statement: Requires differentiating through the classifier gradient norm ||nabla_omega R_c(theta) - g_tilde_omega^t||^2 (introducing classifier Hessian-vector products H_c(omega)(g_c - g_bar^t) during local backpropagation) and restricts the theoretical local learning rate to eta_l <= 1 / (4 K L sqrt(1 + gamma^2)) under Moral-smoothness (Theorems 4-5, Appendix E.1).
  evidence:
  - source_id: r466-primary-pdf
    locator: Section 4.2 Theorems 4-5, pp. 6-7, and Appendix E.1 Preliminaries, p. 17
    relation: supports
- claim_id: r466-federated-domain-generalization-benchmarks-application
  kind: application
  statement: Applied to federated domain generalization for unseen non-participating clients on RotatedMNIST, ColoredMNIST, PACS, OfficeHome, and DomainNet under partial client participation.
  evidence:
  - source_id: r466-primary-pdf
    locator: Section 5 Experiments (Tables 1-3, Figures 2-4), pp. 7-9
    relation: supports
