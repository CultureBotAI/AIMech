id: AIMech:FedIirImplicitInvariantRelationshipsForOutOfDistributionFederatedLearning
name: FedIIR (Out-of-Distribution Generalization of Federated Learning via Implicit Invariant Relationships)
concept_kind: algorithm
review_status: DRAFT
definition: An out-of-distribution (OOD) federated learning algorithm (Guo et al. 2023, Sections 3.1-4.2, Definition 1, Theorems 2-5, Algorithm 1) that learns domain-invariant input-target relationships E[Y^c | Phi(X^c) = z] across heterogeneous clients without sharing raw data, features, or environment identifiers by quantifying inter-client prediction disagreement I(Phi, C) = sup_z sup_{(c, c')} |w_c^*(z) - w_{c'}^*(z)| (Definition 1, Theorem 2), bounding its first-order parameter-space Taylor expansion by the classifier gradient discrepancy ||nabla_omega R_c(theta) - nabla_omega R_{c'}(theta)|| (Section 3.2), and minimizing the regularizer min_f E_{c ~ Q_{par}}[R_c(f) + (gamma / 2) ||nabla_omega R_c(f) - nabla_omega R(f)||^2] where theta = (phi, omega) separates the feature extractor phi from the shallow classifier omega (|omega| << |theta|) and the server tracks the global classifier gradient via an exponential moving average g_tilde_omega^t = upsilon g_tilde_omega^{t-1} + (1 - upsilon) g_bar_omega (Algorithm 1 & Appendix C).
identity_notes: Distinct from Invariant Risk Minimization (AIMech:InvariantRiskMinimization, Arjovsky et al. 2019), which penalizes per-environment squared gradient norms ||nabla_{w|w=1.0} R^e(w o Phi)||^2 rather than inter-client classifier gradient variance ||nabla_omega R_c(theta) - nabla_omega R(theta)||^2 with server-side EMA tracking; and distinct from FedSR (AIMech:FedSrSimpleAndEffectiveDomainGeneralizationForFederatedLearning, Nguyen et al. 2022), which enforces conditional mutual information and L2-norm representation regularizers rather than classifier-gradient alignment.
aliases:
- FedIIR
- Federated Implicit Invariant Relationships
- Out-of-Distribution Federated Learning via Inter-Client Classifier Gradient Alignment
