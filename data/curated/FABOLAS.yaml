claims:
- claim_id: method
  kind: mechanism
  statement: Model loss and computational cost as functions of configuration and dataset fraction, using
    Gaussian-process surrogates with a kernel over configuration coordinates and a finite-rank basis over
    size. Begin with evaluations of configurations on small subsets. Select the next configuration/size
    pair using an entropy-search acquisition focused on the minimizer at full dataset size; the paper
    divides its information criterion by predicted evaluation cost plus optimization overhead. Evaluate
    the selected pair, observe loss and cost, and update the models. Select the incumbent among configurations
    already evaluated by projecting their predicted loss to the full dataset, rather than requiring each
    candidate to have been evaluated there. The paper integrates surrogate hyperparameters using MCMC
    and describes DIRECT/CMA-ES acquisition optimization; the inspected code has separate implementation
    choices.
  evidence:
  - source_id: method-source
    locator: Sections2–3.4, PDF pp.2–5, especially Section3.1 kernels, Equation7 and Algorithm1 on PDFp.4,
      and incumbent/initialization details on PDFp.5
    relation: supports
- claim_id: pinned-implementation
  kind: mechanism
  statement: In the inspected RoBO revision, dataset counts are mapped to a normalized log2 coordinate
    between the selected minimum and maximum; proposed coordinates are transformed back and rounded to
    integer counts. Quadratic loss and linear cost basis functions operate on that transformed coordinate,
    while both observed objective values and costs are logged. The outer function uses a Latin-hypercube
    initial design and RandomSampling acquisition maximizer. Its marginalized acquisition update passes
    no overhead keyword, so the per-unit-cost estimator sets overhead to zero and divides by the exponentiated
    predicted log-cost mean. These are static observations of this revision, not claims of equality with
    the original experiments or executable compatibility.
  evidence:
  - source_id: implementation-1
    locator: 'fabolas(): transformations lines21–28, kernels/bases lines105–173, initialization and acquisition
      lines180–215, model update and proposal lines234–284'
    relation: supports
