name: FABOLAS
definition: A Bayesian hyperparameter optimization algorithm that jointly chooses a model configuration
  and training-data subset size using surrogate models of loss and evaluation cost, directing evaluations
  toward information about the best configuration on the full dataset.
concept_kind: algorithm
identity_notes: FABOLAS treats dataset size as an environmental evaluation variable while retaining the
  full dataset as the optimization target. It differs from Gaussian-process regression alone, fixed-fidelity
  Bayesian optimization, a discrete multi-task optimizer with manually selected task sizes, and Hyperband’s
  predetermined resource brackets. The paper method and the separately pinned RoBO implementation are
  recorded as distinct source versions. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 262 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in both worktree and main checkout, returning 9 lines in each checkout.
  These were prior candidate leads, source references and neighboring-method mentions, not existing records
  for these identities. Ten exact AIO CLASS nodes with synonyms and outgoing edges and eight neighboring
  native mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- Extrapolation depends on the adequacy of the loss-versus-size and cost models. Small subsets need not
  preserve the ranking at full size, and the returned projected incumbent need not have a confirming full-data
  evaluation or optimal test performance.
- 'The paper’s loss basis (1,(1-s)^2) allows a monotonic latent trend at fixed configuration but does
  not by itself force that trend to decrease when coefficient signs are unconstrained. Its polynomial-cost
  interpretation also depends on the size coordinate: log-cost affine in raw relative size is exponential
  in that coordinate; the pinned code instead uses normalized log dataset counts.'
- The pinned code logs both objective and cost, applies Latin-hypercube initialization and a RandomSampling
  acquisition optimizer, and leaves the acquisition overhead at zero through the inspected call chain.
  Those choices are not silently attributed to the paper’s algorithm. Positive objective/cost values and
  compatible parameter settings are required by that source; static inspection is not a runtime result.
- No universal speedup, exact information-gain computation or independent calibration result is asserted.
  The full entropy-search implementation and the paper’s supplementary experiments were not audited.
