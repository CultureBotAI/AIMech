id: AIMech:PTRPromptTuningWithRules
name: PTR Prompt Tuning with Rules
concept_kind: algorithm
review_status: DRAFT
definition: 'A prompt-tuning method for many-class text and relation classification that decomposes each target class y in Y into a conjunctive normal form (CNF) combination of first-order logic conditional functions f in F (such as unary entity-type predicates f_{e_s}(x, type), f_{e_o}(y, type) and binary relational predicates f_{e_s, e_o}(x, rel, y)), aggregates their sub-prompt templates into a multi-mask prompt T(x) = [T_{f_1}(x); ...; T_{f_n}(x)] optionally augmented with learnable continuous tokens, and optimizes the joint log-likelihood across all n masked positions: (1/|X|) sum_{x in X} log prod_{j=1}^n p([MASK]_j = phi_j(y) | T(x)).'
identity_notes: Distinct from single-mask prompt tuning methods such as PET (AIMech:PatternExploitingTraining), LM-BFF (AIMech:LMBFFBetterFewShotFineTuning), and KPT (AIMech:KPTKnowledgeablePromptTuningVerbalizer), which predict a single [MASK] position and cannot factorize many-class relation labels into composable entity-type and relational sub-prompts, and from TYP MARKER fine-tuning (Zhou & Chen, 2021), which requires gold human entity-type annotations and an extra task-specific classification layer.
aliases:
- PTR
- Prompt Tuning with Rules
- Rule-Based Sub-Prompt Composition for Prompt Tuning
- Conjunctive Normal Form Sub-Prompt Tuning
