claims:
- claim_id: r724-claim-cnf-subprompt-composition
  kind: mechanism
  statement: "PTR formalizes many-class classification as a conjunction of unary and binary conditional functions\u2014for example, decomposing 'person:parent' vs. 'organization:parent' into f_{e_s}(e_s, person/organization) AND f_{e_s,e_o}(e_s, 's parent was, e_o) AND f_{e_o}(e_o, person/organization)\u2014and concatenates their sub-prompts into a template with n = 3 [MASK] tokens whose position-specific verbalizer probabilities phi_j(y) are multiplied: p(y|x) = prod_{j=1}^n p([MASK]_j = phi_j(y) | T(x))."
  evidence:
  - source_id: r724-primary-pdf
    locator: Section 3.1-3.3, Equations 1-6, Figure 2, Table 2, pp. 3-6
    relation: supports
- claim_id: r724-claim-zero-extra-layer-or-type-annotation
  kind: mechanism
  statement: Unlike entity-marker and typed-marker fine-tuning baselines that require gold human entity-type annotations and additional classification head parameters, PTR stimulates latent entity-type and relational knowledge directly through the pretrained MLM head using only PLM vocabulary label words and a small number of learnable continuous template tokens.
  evidence:
  - source_id: r724-primary-pdf
    locator: Section 3.3 & Section 4.4, Table 5, pp. 5, 7-8
    relation: supports
- claim_id: r724-claim-relation-extraction-application
  kind: application
  statement: On four many-class relation classification benchmarks (42-class TACRED, 42-class TACREV, 40-class ReTACRED, and 19-class SemEval 2010 Task 8) with RoBERTa-large, PTR achieves 72.4% (75.9% reversed), 81.4% (83.9% reversed), 90.9% (91.9% reversed), and 89.9% F1 respectively, outperforming knowledge-enhanced PLMs (SpanBERT, KnowBERT, MTB, LUKE) without external pre-training data and surpassing Typed Marker baselines in few-shot (K=8, 16, 32) regimes.
  evidence:
  - source_id: r724-primary-pdf
    locator: Section 4.3-4.4, Tables 4-6, Figure 3, pp. 6-9
    relation: supports
- claim_id: r724-claim-direction-sensitivity-limitation
  kind: limitation
  statement: "PTR performance is highly sensitive to relation directionality and surface phrasing in sub-prompts\u2014reversing inverse relations (such as converting (e_s, org:member_of, e_o) to (e_o, org:member, e_s)) changes TACRED F1 by 3.5 percentage points (from 72.4% to 75.9%) because pretrained language models do not encode bidirectional relations symmetrically\u2014and requires manual domain decomposition of classes into logical predicates."
  evidence:
  - source_id: r724-primary-pdf
    locator: Section 4.2, Section 4.5, and Section 6, Table 7, pp. 6, 9-10
    relation: supports
