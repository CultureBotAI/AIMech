  relation: supports
claims:
- claim_id: method-scope
  kind: mechanism
  statement: Train the adversary to predict the protected attribute from differentiable predictor outputs,
    optionally also using true labels for equalized odds or a label-restricted training subset for equal
    opportunity. For the predictor, remove the component of its task-loss gradient along the adversary-loss
    gradient and subtract a weighted adversary-loss gradient from the update gradient. The source defines
    a zero projection when the adversary gradient is zero.
  evidence:
  - source_id: original-paper
    locator: Section 3 equation (1), PDF pp. 2–3; Section 5 Propositions 1–3 and footnote 4, PDF pp. 3–4;
      Section 8, PDF p. 6
    relation: supports
- claim_id: projection-stability-limit
  kind: limitation
  statement: The FR-Train authors explicitly omit the Zhang et al. projection term, reporting that it
    worsened training stability in their experiments. This is a setting-dependent design observation,
    not evidence that projection-based adversarial debiasing always fails.
  evidence:
  - source_id: stability-followup
    locator: Section 3.1, PDF p. 4, paragraph discussing Adversarial Debiasing immediately before Section
      3.2
    relation: supports
