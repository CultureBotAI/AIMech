id: AIMech:DisPflDecentralizedSparseTrainingForPersonalizedFederatedLearning
name: 'DisPFL: Decentralized Sparse Training for Personalized Federated Learning'
concept_kind: algorithm
review_status: DRAFT
definition: A communication- and computation-efficient peer-to-peer personalized federated learning algorithm (DisPFL / Dis-PFL; Dai, Shen, He, Tian, and Tao, ICML 2022) that optimizes min_{w, m_1, ..., m_K} (1 / K) sum_{k=1}^K E_{(x,y)~D_k}[L(w odot m_k; (x, y))] (Eq. 4) by maintaining a fixed-budget personalized binary mask m_k in {0, 1}^d initialized via the Erdos-Renyi Kernel (ERK) layer-wise sparsity rule on each client k. At communication round t, each client k aggregates sparse models received from its topological neighbors S_{k,t} via coordinate-wise intersection-count normalization masked to its local support, w_{k, t+1/2} = ((w_{k,t} + sum_{j in S_{k,t}} w_{j,t}) / (m_{k,t} + sum_{j in S_{k,t}} m_{j,t})) odot m_{k,t} (Algorithm 1 line 7), executes N local masked SGD steps, and adaptively updates m_{k,t+1} by pruning a cosine-annealed fraction alpha_t = (alpha / 2)(1 + cos(t pi / (N T_end))) of smallest-magnitude active weights per layer and regrowing the exact same number of inactive weights with the largest gradient magnitudes |g(w_{k,t+1})| (Algorithm 2).
identity_notes: Distinct from centralized sparse FL algorithms such as PruneFL (AIMech:PruneFlAdaptiveDistributedParameterPruningForFederatedLearning; Jiang et al., IEEE TNNLS 2023), which maintains a single shared global pruned mask reconfigured by a central server to minimize global empirical risk rather than personalized per-client ERK masks over a decentralized peer-to-peer topology. Distinct from dense decentralized SGD algorithms such as D-PSGD (Lian et al., 2017) and D^2 (AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData; Tang et al., ICML 2018), which communicate and average full dense parameter vectors across all nodes rather than performing support-intersection-normalized averaging combined with local magnitude pruning and gradient-magnitude regrowth.
