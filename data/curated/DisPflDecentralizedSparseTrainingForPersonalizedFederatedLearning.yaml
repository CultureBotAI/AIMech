claims:
- claim_id: dispfl-intersection-normalized-sparse-averaging-and-prune-regrow-mechanism
  kind: mechanism
  statement: In DisPFL (Algorithm 1, p. 4; Algorithm 2, p. 13), each client k initializes a personalized mask m_{k,0} using Erdos-Renyi Kernel (ERK) layer-wise proportions (n_{l-1} + n_l + w_l + h_l) / (n_{l-1} n_l w_l h_l), combines neighbor sparse models via w_{k, t+1/2} = ((w_{k,t} + sum_{j in S_{k,t}} w_{j,t}) / (m_{k,t} + sum_{j in S_{k,t}} m_{j,t})) odot m_{k,t} so active coordinates are normalized solely by the number of neighbors sharing that coordinate, and after N masked SGD steps prunes the bottom alpha_t fraction of active weights by |w_{k,t+1}| and regrows an equal count of inactive weights with largest |g(w_{k,t+1})|.
  evidence:
  - source_id: r507-primary-pdf
    locator: Section 3.2 Proposed DisPFL, Algorithm 1, pp. 4-5; Appendix A Algorithm 2, p. 13
    relation: supports
- claim_id: dispfl-sparse-subspace-compression-generalization-bound-scope
  kind: scope
  statement: Under Assumptions 1-3 (loss bound M, L-smoothness, and union active parameter proportion beta <= 1 across collaborating sparse masks), Theorem 1 (p. 5; proof in Appendix C, pp. 16-18) proves that if a compressed sparse model w_tilde satisfies ||w - w_tilde|| <= eps_tilde / L with gradient displacement bound ||v|| < (1 / tau) beta D_g, then with probability at least 1 - delta - 9 exp(-n eps'^2 / M^2) over sample S of size n, |R_hat_S(A(S)) - R(A(S))| < 9 eps', establishing that smaller union active proportion beta tightens the generalization error bound.
  evidence:
  - source_id: r507-primary-pdf
    locator: Section 3.3 Theoretical Understanding of Generalization, Assumptions 1-3, Theorem 1, p. 5; Appendix C, pp. 16-18
    relation: supports
- claim_id: dispfl-dense-regrowth-gradient-evaluation-and-extreme-sparsity-drop-limitation
  kind: limitation
  statement: Updating the personalized mask via gradient-magnitude regrowth (Algorithm 2 line 11) requires evaluating a full dense stochastic gradient g(w_{k,t+1}) over all d coordinates once per communication round (unless disabled under the fixed-mask variant), and extreme sparsity (e.g., 90% pruned parameters on CIFAR-100) reduces accuracy relative to moderate 50%-80% sparsity (Section 3.2, p. 5; Section 4.3 Figure 4a, p. 7).
  evidence:
  - source_id: r507-primary-pdf
    locator: Section 3.2 Discussion on Extra Resource Cost, p. 5; Section 4.3 Hyper-parameter Sensitivity, Fig. 4(a), p. 7; Appendix A Algorithm 2, p. 13
    relation: supports
- claim_id: dispfl-decentralized-non-iid-image-and-text-classification-application
  kind: application
  statement: Applied to decentralized personalized federated classification across ring, grid, Erdos-Renyi, and fully connected peer-to-peer topologies on CIFAR-10, CIFAR-100, Tiny-ImageNet, and AG News using ResNet-18, VGG-11, and TextCNN.
  evidence:
  - source_id: r507-primary-pdf
    locator: Section 4 Experiments, Tables 1-2, Figures 2-6, pp. 5-8; Appendix B.3-B.4, pp. 14-15
    relation: supports
