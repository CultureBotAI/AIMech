claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'For the entropically regularized transport problem p_lambda(a, b; M) = min_{T in U(a,b)} <T, M> - (1/lambda) h(T), Proposition 2 proves that the Legendre dual d_lambda(a, b; M) is strictly concave on {alpha in R^n : alpha^T 1_n = 0} and its unique maximizer alpha_lambda^* is related to the Sinkhorn-Knopp optimal coupling T_lambda^* = diag(u) exp(-lambda M) diag(v) via alpha_lambda^* = (1/lambda)(log u - (log u^T 1_n / n) 1_n) (Algorithm 3), providing the exact zero-sum tangent gradient of p_lambda(a, b; M) with respect to the barycenter weight vector a in Sigma_n.'
  evidence:
  - source_id: r325-primary-pdf
    locator: Section 5.1, Proposition 2 and Equations 9-10, pp. 6-7; Section 5.2, Algorithm 3, p. 7
    relation: supports
  - source_id: r325-metadata-cr
    locator: Bibliographic metadata and abstract for ICML 2014 PMLR 32(2):685-693
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For squared Euclidean ground cost M_{X Y_i} = [||x_k - y_{ij}||_2^2], Section 4.3 (Equation 8 and Algorithm 2) shows that for fixed transport couplings T_1^*, ..., T_N^* and weight vector a, the objective sum_{i=1}^N <T_i^*, M_{X Y_i}> is a strictly convex quadratic function of the support matrix X whose exact Newton step updates X in closed form via X <- (1/N) sum_{i=1}^N Y_i (T_i^*)^T diag(a^{-1}).
  evidence:
  - source_id: r325-primary-pdf
    locator: Section 4.3, Equation 8 and Algorithm 2, pp. 5-6
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: In the unregularized LP formulation (lambda -> infinity), Proposition 1 establishes that a dual optimal vector alpha^* is a genuine gradient of p(a, b; M) only when the primal optimal coupling T^* has a connected bipartite support graph (a single spanning tree of n + m - 1 positive entries), and in the free-support problem f(X, a) is jointly non-convex in (X, a) so alternating optimization converges only to a stationary point.
  evidence:
  - source_id: r325-primary-pdf
    locator: Section 4.1, Proposition 1, pp. 4-5; Section 3.3, Non-convexity discussion, p. 4
    relation: supports
