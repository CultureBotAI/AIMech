claims:
- claim_id: dc-bert-dual-bert-global-embedding-transformer-interaction
  kind: mechanism
  statement: "DC-BERT decouples lower-layer BERT contextualization into an online question BERT producing T in R^{N x d} and an offline cached document BERT producing T' in R^{M x d}\u2014reducing lower-layer complexity across N_q questions and N_d candidate documents from O(N_q N_d (L_q + L_d)^2) to O(N_q L_q^2) online\u2014and models cross-segment interactions by adding trainable global position embeddings E_{P_i} in R^d and global type embeddings E_Q, E_D in R^d before feeding the combined sequence into K upper Transformer layers and scoring relevance via p(Q_i, D_j) = sigma(MLP([o_[CLS]; o'_[CLS]])) (Equations 1-2)."
  evidence:
  - source_id: r795-primary-pdf
    locator: Section 2 (Methodology), pp. 2-4, Figure 1, Equations (1)-(2)
    relation: supports
  - source_id: r795-primary-pdf
    locator: inject_global_embeddings and dc_bert_reranker_prob verification
    relation: supports
- claim_id: dc-bert-symmetric-pbt-and-ptb-evaluation-metrics
  kind: mechanism
  statement: 'To measure a neural reranker''s semantic retrieval capability relative to an initial TF-IDF retriever, DC-BERT introduces two symmetric metrics: PBT@N (the percentage of questions for which at least one top-N reranked document containing the answer span is not in the TF-IDF top-N documents, higher is better) and PTB@N (the percentage of questions for which at least one TF-IDF top-N document containing the answer span is not in the reranker''s top-N documents, lower is better).'
  evidence:
  - source_id: r795-primary-pdf
    locator: Section 3 (Evaluation metrics & Table 2), pp. 4-5
    relation: supports
  - source_id: r795-primary-pdf
    locator: compute_pbt_and_ptb_at_n verification
    relation: supports
- claim_id: dc-bert-squad-open-and-nq-open-10x-speedup
  kind: application
  statement: With K = 1 interaction Transformer layer, DC-BERT achieves a 10.3x retrieval speedup over BERT-base on both SQuAD Open and Natural Questions Open while retaining 98% of downstream QA Exact Match accuracy (39.2 vs. 40.1 EM on SQuAD Open; 27.4 vs. 28.0 EM on Natural Questions Open) and substantially outperforming 2-layer DistilBERT (34.6 and 25.1 EM, Table 1).
  evidence:
  - source_id: r795-primary-pdf
    locator: "Section 3 (Experiments \u2014 Table 1 & Table 3), pp. 4-6"
    relation: supports
- claim_id: dc-bert-token-level-cache-storage-and-full-upper-attention
  kind: limitation
  statement: Because DC-BERT feeds all M document token vectors into K upper Transformer self-attention layers at query time, its online interaction still scales as O(K (L_q + L_d)^2) per candidate document and requires caching full token-level document matrices T' in R^{M x d} rather than a single pooled document vector.
  evidence:
  - source_id: r795-primary-pdf
    locator: Section 2 (Dual-BERT & Transformer components) & Section 3 (Figure 2b), pp. 2-6
    relation: supports
