id: AIMech:DCBERTDecouplingQuestionAndDocumentForEfficientContextualEncoding
name: DC-BERT (Decoupling Question and Document for Efficient Contextual Encoding)
concept_kind: architecture
review_status: DRAFT
definition: "A decoupled contextual encoding framework for open-domain question answering document retrieval and reranking (Zhang, Nie, Geng, Ramamurthy, Song, & Jiang, SIGIR 2020) that replaces joint lower-layer question-document concatenation with dual BERT encoders\u2014an online BERT that encodes the incoming question once into T in R^{N x d} and an offline BERT that pre-encodes and caches all candidate documents into T' in R^{M x d}\u2014before adding trainable global position embeddings E_{P_i} and global type embeddings (E_Q, E_D), applying K upper Transformer interaction layers, and predicting relevance via a two-layer tanh MLP classifier over the concatenated question and document [CLS] representations p(Q_i, D_j) = sigma(MLP([o_[CLS]; o'_[CLS]]))."
identity_notes: Distinct from MORES (AIMech:MORESModularizedTransformerBasedRankingFramework, which uses asymmetric query-to-document cross-attention Interaction Blocks leaving D unchanged) and from TwinBERT (AIMech:TwinBERTDistillingKnowledgeToTwinStructuredBERTModels, which pools each tower into a single vector before a cosine or max-residual crossing layer). DC-BERT retains token-level encodings T and T' from the dual BERT encoders, re-indexes their concatenation with trainable global position embeddings E_{P_i} and type embeddings E_Q, E_D initialized from pre-trained BERT, passes the sequence through K configurable upper Transformer layers (initialized from the last K layers of BERT), and concatenates both [CLS] outputs [o_[CLS]; o'_[CLS]] for binary reranking.
aliases:
- DC-BERT
- Decoupled Contextual BERT
- DC-BERT Decoupled Question-Document Contextual Encoding Framework
