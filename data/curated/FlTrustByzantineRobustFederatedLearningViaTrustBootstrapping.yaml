id: AIMech:FlTrustByzantineRobustFederatedLearningViaTrustBootstrapping
name: FLTrust (Byzantine-Robust Federated Learning via Trust Bootstrapping)
concept_kind: algorithm
review_status: DRAFT
definition: FLTrust (Byzantine-Robust Federated Learning via Trust Bootstrapping) is a server-bootstrapped Byzantine-robust federated learning algorithm in which the service provider maintains a small clean root dataset D_0 (e.g., 100 examples) and computes a server model update g_0 in each iteration, assigns each client update g_i a trust score equal to its ReLU-clipped cosine similarity TS_i = ReLU(<g_i, g_0> / (||g_i|| ||g_0||)), rescales each client update onto the server update's l2-hypersphere via bar_g_i = (||g_0|| / ||g_i||) g_i, and updates the global model using the trust-weighted average g = (1 / sum_{j=1}^n TS_j) sum_{i=1}^n TS_i bar_g_i.
identity_notes: 'Introduced by Xiaoyu Cao, Minghong Fang, Jia Liu, and Neil Zhenqiang Gong in ''FLTrust: Byzantine-robust Federated Learning via Trust Bootstrapping'' (NDSS 2021, DOI:10.14722/ndss.2021.24434; arXiv:2012.13995). Distinct from client-only statistical outlier defenses (Krum, Blanchard et al. 2017; Coordinate-Wise Median and Trimmed Mean, Yin et al. 2018; Bulyan, El Mhamdi et al. 2018), which have no server root of trust and break down when malicious clients reach >= 50% (or >= 25% for Bulyan) or craft adaptive local model poisoning updates.'
