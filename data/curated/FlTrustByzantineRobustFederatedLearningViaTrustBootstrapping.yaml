claims:
- claim_id: fltrust-relu-cosine-trust-score-and-hypersphere-normalization
  kind: mechanism
  statement: In each global iteration, FLTrust computes the cosine similarity c_i = <g_i, g_0> / (||g_i|| ||g_0||) between client i's update g_i and the server's root-dataset update g_0, clips negative cosine similarities via TS_i = ReLU(c_i) = max(0, c_i) (Equation 2) so updates pointing in the opposite hemisphere are excluded, projects each local update onto the l2-hypersphere of radius ||g_0|| via bar_g_i = (||g_0|| / ||g_i||) g_i (Equation 3) to cap large-norm scaling attacks while amplifying small-norm benign updates, and computes g = (1 / sum_{j=1}^n ReLU(c_j)) sum_{i=1}^n ReLU(c_i) (||g_0|| / ||g_i||) g_i (Equation 4).
  evidence:
  - source_id: r519-primary-pdf
    locator: Section IV-B, Equations (2)-(5) and Figure 2, pages 5-6
    relation: supports
- claim_id: fltrust-convergence-bound-for-arbitrary-malicious-client-fraction
  kind: mechanism
  statement: Lemma 1 (Appendix A, Equations 13-24) proves that for an arbitrary number of malicious clients, positive cosine alignment <bar_g_i, g_0> > 0 for all i in S and norm equality ||bar_g_i|| = ||g_0|| guarantee ||g - nabla F(w)|| <= 3 ||g_0 - nabla F(w)|| + 2 ||nabla F(w)||, and Theorem 1 proves that under mu-strong convexity, L-smoothness, and sub-exponential gradients on root dataset D_0, ||w^t - w^*|| <= (1 - rho)^t ||w^0 - w^*|| + 12 alpha Delta_1 / rho with probability at least 1 - delta.
  evidence:
  - source_id: r519-primary-pdf
    locator: Section IV-D, Theorem 1, page 7; Appendix A, Lemmas 1-4, pages 16-18
    relation: supports
- claim_id: fltrust-resilience-against-poisoning-and-adaptive-attacks-up-to-60-percent-malicious
  kind: application
  statement: Using a root dataset of only |D_0| = 100 examples across six datasets (MNIST-0.1, MNIST-0.5, Fashion-MNIST, CIFAR-10, HAR, and CH-MNIST), FLTrust maintains test error within 0.04 of unattacked FedAvg and backdoor Scaling attack success rate <= 0.03 under Label Flipping, Krum attack, Trim attack, Scaling attack, and zeroth-order adaptive attacks (Algorithm 3), tolerating 40%-60% colluding adaptive malicious clients and up to 90% malicious clients on MNIST-0.5 (Table III and Figures 6-7).
  evidence:
  - source_id: r519-primary-pdf
    locator: Section VI-B, Tables III-IV and Figures 6-7, pages 11-14
    relation: supports
