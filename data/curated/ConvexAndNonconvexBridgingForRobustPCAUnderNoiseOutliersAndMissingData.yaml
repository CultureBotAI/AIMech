claims:
- claim_id: claim-nonconvex-stationary-point-as-primal-dual-certificate-for-convex-pcp
  kind: mechanism
  statement: Proposition 4.1 and Lemma 4.1 prove that whenever a stationary point $(\widehat{\boldsymbol{U}},\widehat{\boldsymbol{S}})$ of the nonconvex factored problem $\min_{\boldsymbol{U}\in\mathbb{R}^{n\times r},\boldsymbol{S}} \frac{1}{2}\|\mathcal{P}_\Omega(\boldsymbol{U}\boldsymbol{U}^\top + \boldsymbol{S} - \boldsymbol{Y})\|_F^2 + \frac{\lambda}{2}\|\boldsymbol{U}\|_F^2 + \tau\|\mathcal{P}_\Omega(\boldsymbol{S})\|_1$ (Equation 3.1) satisfies the spectral norm condition $\|\mathcal{P}_\Omega(\boldsymbol{Y} - \widehat{\boldsymbol{U}}\widehat{\boldsymbol{U}}^\top - \widehat{\boldsymbol{S}})\| < \lambda$, the pair $(\widehat{\boldsymbol{M}}_{\mathrm{cvx}} = \widehat{\boldsymbol{U}}\widehat{\boldsymbol{U}}^\top, \widehat{\boldsymbol{S}}_{\mathrm{cvx}} = \widehat{\boldsymbol{S}})$ is the unique global minimizer of the convex Principal Component Pursuit program (Equation 2.3) and has exact rank $r$ (Sections 3.1 and 4.1, Equation 3.1, Proposition 4.1, Lemma 4.1).
  evidence:
  - source_id: cfmy2021-rpca-pdf
    locator: Section 3.1 (Eq. 3.1, pp. 2955-2956), Section 4.1 (Proposition 4.1, Lemma 4.1, pp. 2959-2960)
    relation: supports
- claim_id: claim-entrywise-linf-and-two-to-inf-accuracy-via-leave-one-out-soft-thresholding
  kind: mechanism
  statement: "Using $n$ leave-one-out auxiliary trajectories $(\\boldsymbol{U}^{t,(m)}, \\boldsymbol{S}^{t,(m)})$ that replace row/column $m$'s random observations, noise, and outlier locations with their population counterparts (Section 4.3, Equation 4.12) together with the non-expansiveness of the soft-thresholding operator $|\\mathcal{S}_\\tau(a) - \\mathcal{S}_\\tau(b)| \\le |a-b|$, Theorem 2.1 and Theorem 3.1 prove that with $\\lambda \\asymp \\sigma\\sqrt{np\\log n}$ and $\\tau \\asymp \\sigma\\sqrt{\\log n} + \\frac{\\sigma\\sqrt{n\\log n}}{p}\\frac{\\mu r}{n}$, both the convex and nonconvex estimators achieve $\\|\\widehat{\\boldsymbol{M}} - \\boldsymbol{M}^\\star\\|_\\infty \\lesssim \\frac{\\sigma\\sqrt{n\\log n}}{p}\\frac{\\mu r}{n}$ and $\\|\\widehat{\\boldsymbol{M}} - \\boldsymbol{M}^\\star\\|_F \\lesssim \\frac{\\sigma\\sqrt{nr\\log n}}{p}$ under outlier fraction $\\alpha \\lesssim 1/(\\kappa^3\\mu r)$ (Sections 2.2, 3.2, and 4.2\u20134.3, Theorems 2.1 and 3.1)."
  evidence:
  - source_id: cfmy2021-rpca-pdf
    locator: Section 2.2 (Theorem 2.1, pp. 2952-2953), Section 3.2 (Theorem 3.1, p. 2957), Sections 4.2-4.3 (pp. 2960-2966)
    relation: supports
- claim_id: claim-exact-outlier-support-recovery-and-sign-consistency
  kind: application
  statement: Because $\|\widehat{\boldsymbol{M}}_{\mathrm{cvx}} - \boldsymbol{M}^\star\|_\infty + \|\mathcal{P}_\Omega(\boldsymbol{E})\|_\infty < \tau$ with high probability and $\widehat{\boldsymbol{S}}_{\mathrm{cvx}} = \mathcal{S}_\tau(\mathcal{P}_\Omega(\boldsymbol{Y} - \widehat{\boldsymbol{M}}_{\mathrm{cvx}}))$, Corollary 2.1 proves that no clean entry $(i,j)\notin\mathrm{supp}(\boldsymbol{S}^\star)$ is falsely flagged ($\mathrm{supp}(\widehat{\boldsymbol{S}}_{\mathrm{cvx}}) \subseteq \mathrm{supp}(\boldsymbol{S}^\star)$) and every observed outlier with $|S_{i,j}^\star| > 2\tau$ is recovered with its exact sign $\mathrm{sign}(\widehat{S}_{\mathrm{cvx},i,j}) = \mathrm{sign}(S_{i,j}^\star)$ (Section 2.2, Corollary 2.1).
  evidence:
  - source_id: cfmy2021-rpca-pdf
    locator: Section 2.2 (Corollary 2.1, pp. 2953-2954)
    relation: supports
