  rationale: The connection is choosing informative queries. The pinned AIO term is a labeling-oriented
    task, while this algorithm adapts the computation used to choose objective and constraint evaluations.
    The mapping is related only, without equivalence, subclass, network or layer inheritance.
limitations:
- The official 2016 paper was read in full native text, with selected method and experiment visuals. Author
  code was read selectively at the November 13, 2016 commit b5722e5134becc10523ff8f4bd8ef453b40faf69.
  It was not imported or executed. This code version is later than the September PDF and is not an author-issued
  erratum or proof of exact reproduction of the published experiments.
- Printed Equation 22 reverses the parameter direction relative to the prose and experimental endpoint
  labels. Algorithm 2 initializes a denominator to zero and records its full-update timer before expensive
  acquisition optimization, contrary to the prose duration definition. The separately pinned code avoids
  these literal forms; the record does not merge the versions into one exact pseudocode claim.
- Full PESC computations already approximate constrained optimizer sampling and conditional observation
  entropy. PESC-F adds stale samples, retained sites and cheaper search. No exact mutual-information,
  approximation-error, global optimizer or EP convergence guarantee follows.
- PESC assumes an attained feasible optimizer with uniqueness or a specified tie policy. The narrow PESC-F
  mechanism does not supply a general policy for empty feasible sets or certify every printed PESC appendix
  formula.
- 'The paper resource graph and Algorithm 1 are surrounding framework context: they greedily choose eligible
  task/input pairs for available resources, with a model update for pending work. They are not a proof
  of jointly optimal scheduling, and multiple simultaneously required resources are left to future work.
  Competitive and non-competitive decoupling are problem configurations, not exact aliases for PESC-F.
  No separate scheduler identity is asserted here.'
- The wall-clock experiment uses one synthetic problem, specified artificial evaluation delays and a particular
  implementation. No universal speedup, quality guarantee, resource fairness or exact time-budget bound
  is claimed. The retained original calculator checks seven finite algebraic and scheduling boundaries,
  not author benchmarks.
