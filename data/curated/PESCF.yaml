id: AIMech:PESCF
name: PESC-F
concept_kind: algorithm
definition: An adaptive computation variant of Predictive Entropy Search with Constraints that alternates
  full inference and acquisition updates with partial updates reusing GP hyperparameter samples, constrained
  optimizer samples and Gaussian site information, while reducing acquisition optimization effort.
definition_evidence:
- source_id: hernandez2016
  locator: Section 5, PDF pp. 22–25; Algorithm 2 on p. 24
  relation: supports
claims:
- claim_id: full-and-partial-update-levels
  kind: mechanism
  statement: PESC-F retains the PESC constrained-optimizer information acquisition and introduces two
    levels of work between function evaluations. A full update refreshes GP hyperparameter samples, approximate
    constrained optimizer samples and EP solutions, then optimizes the acquisition. A partial update incorporates
    new data while reusing selected inference quantities and spending less effort on acquisition optimization.
    This changes the acquisition approximation and its refresh schedule; it is not merely an exact faster
    evaluation of every full PESC update. Algorithm 2 presents the competitive decoupled case, with individual
    objective and constraint tasks sharing one evaluation resource.
  evidence:
  - source_id: hernandez2016
    locator: Sections 5–5.1, PDF pp. 22–24, Algorithm 2
    relation: supports
- claim_id: fixed-hyperparameters-with-new-data
  kind: mechanism
  statement: During a partial update, the earlier GP hyperparameter samples are retained while the GP
    model is conditioned on the new observations. Retaining hyperparameters does not mean freezing predictive
    means and covariances. When appending one input leaves the old covariance block unchanged and the
    enlarged matrix positive definite, the paper describes updating its Cholesky factor using a bordered
    calculation with quadratic work instead of a full cubic factorization. This algebraic possibility
    requires the fixed old block and a positive Schur complement; it is not a general runtime guarantee.
    The inspected author GP cache still calls a full Cholesky factorization, so the proposed saving is
    not asserted to occur in that code path.
  evidence:
  - source_id: hernandez2016
    locator: PDF p. 23, first reduction of update cost; Appendix B.4, PDF pp. 49–50; original bordered-factor
      diagnostic in research/discovery/pesc-fast-boundaries.py
    relation: supports
  - source_id: pesc-gp
    locator: GP.fit lines 517–569 and _prepare_cache lines 271–283 at the pinned commit, read only
    relation: supports
- claim_id: optimizer-and-site-reuse
  kind: mechanism
  statement: Partial updates reuse previously sampled constrained optimizer locations and previously fitted
    EP site parameters. In the inspected author implementation, the fast path recomputes predictive Gaussian
    quantities from the updated models and combines them with the retained sites, without resampling optimizer
    locations or rerunning the complete EP refinement. New objective input positions receive zero entries
    when embedding the retained site parameters. Thus cached site reuse does not freeze the whole Gaussian
    approximation and need not agree with freshly fitted sites. The code requires a preceding full update
    to initialize these caches.
  evidence:
  - source_id: hernandez2016
    locator: PDF p. 23, second reduction of update cost; Algorithm 2, PDF p. 24, lines 9–10 and 15–16
    relation: supports
  - source_id: pesc-acquisition
    locator: updateEPsolution lines 553–639; create_acquisition_function lines 1271–1285; performEPandXstarSamplingForOneState
      lines 1348–1389 at the pinned commit, read only
    relation: supports
- claim_id: reduced-acquisition-search-effort
  kind: mechanism
  statement: The partial computation can reduce acquisition search effort through a coarser stopping tolerance,
    a smaller initial grid or fewer restarts. These changes trade optimization precision for computation
    and do not guarantee the same suggested query as a full update. The inspected chooser selects different
    grid sizes for full and partial updates and, on its NLopt path, different absolute tolerances and
    evaluation limits. Those are configurable implementation choices, not universal numerical settings
    or a guarantee that every backend uses the same stopping rule.
  evidence:
  - source_id: hernandez2016
    locator: PDF p. 23, third reduction of update cost; Algorithm 2, PDF p. 24, lines 13 and 17
    relation: supports
  - source_id: pesc-chooser
    locator: suggest lines 504–536; compute_acquisition_function lines 664–774, especially 723–724 and
      the separate fallback path, at the pinned commit, read only
    relation: supports
- claim_id: versioned-timing-trigger
  kind: mechanism
  statement: For the inspected author-code convention, let e be elapsed time since the previous full update
    completed, s its measured duration and g>=0 the thoughtfulness parameter. With fast updates enabled,
    the chooser uses a partial update when e*g<s and a full update otherwise, including equality. Its
    full-update completion time is recorded after the acquisition-based suggestion. Initial equal start
    and end sentinels give s=0 and select a full update before cached partial updates. Disabling fast
    updates selects full updates directly. This versioned convention agrees with the paper prose that
    larger rationality levels favor more full computation, but differs from its printed Equation 22 and
    Algorithm 2 condition e/s>gamma. The discrepancy and the boundary difference are retained rather than
    silently equated.
  evidence:
  - source_id: hernandez2016
    locator: Section 5.1, PDF p. 23, Equation 22; Algorithm 2, PDF p. 24; Section 7.3, PDF pp. 36–38
    relation: supports
  - source_id: pesc-chooser
    locator: Initialization lines 247–255; fit lines 305–322; suggestion completion lines 653–658 at the
      pinned commit; original exact trigger diagnostic in research/discovery/pesc-fast-boundaries.py
    relation: supports
- claim_id: heuristic-computation-budget
  kind: scope
  statement: The switching rule is a heuristic for balancing decision computation with black-box evaluation
    time. It does not optimize the value of computation or guarantee a fixed upper bound on total BO time
    divided by evaluation time. Partial-update time also contributes to elapsed time, past full-update
    duration need not predict the next duration, and sufficiently cheap evaluations can be dominated even
    by partial updates. PESC-F reduces to the full-update regime when every decision satisfies the chosen
    full-update condition; this is conditional on the timing convention and parameter, not an unconditional
    consequence of one evaluation being slower than a previous update. The paper leaves optimal rationality
    selection and theoretical analysis for future work.
  evidence:
  - source_id: hernandez2016
    locator: Sections 5.1–5.3, PDF pp. 23–25; Table 1 and discussion on p. 38; future work on p. 40; original
      timing-budget counterexample in research/discovery/pesc-fast-boundaries.py
    relation: supports
identity_notes: PESC-F is the named adaptive full/partial PESC computation mechanism, changing cached
  inference refresh and acquisition search effort. Full PESC acquisition, task/resource graph configurations
  and CD-F experimental scheduling are distinct context; no separate scheduler or component identity is
  created. Later pinned author-code timing conventions are distinguished from contradictory printed pseudocode
  and are not called an erratum. No aliases are adopted. Fresh whole-corpus, semantic, ignored-inclusive
  and full-frontier assessments establish bounded distinctness before creation.
