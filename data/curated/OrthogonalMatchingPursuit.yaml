aio_mappings:
- target: AIO:SparseLearning
  relation: related_match
  rationale: The pinned target is a representation-learning network that finds sparse linear representations
    and identifies their elements, with exact sparse-coding and dictionary-learning synonyms. Pursuit
    constructs a representation using a supplied fixed dictionary, so the sparse-representation connection
    is direct. It does not learn dictionary elements or require a neural network; related_match preserves
    those scope differences without a subclass or equivalence assertion. RepresentationLearning and SparseAutoEncoder
    are different neural scopes. LassoRegression, LinearRegression and LeastsquaresAnalysis do not specify
    this atom-selection procedure. FeatureExtraction can be an application, and MathematicalFunction is
    too generic to identify it. MarkovChain is unrelated despite its MP synonym.
