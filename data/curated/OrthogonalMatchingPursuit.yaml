limitations:
- The maintained definition is scoped to supplied finite real unit-norm dictionaries. Complex or infinite
  dictionaries, learned dictionaries, batch methods and recovery theorems need their own conditions and
  evidence.
- Greedy representation is not a universal minimum-support or minimum-L1 solver. Ties, normalization,
  conditioning and stopping criteria can affect the selected representation.
- Both original papers were visually read in full. No author implementation, model training or empirical
  benchmark was run; the rational examples are curator calculations. The record remains DRAFT and this
  work provides no independent scientific approval.
- The apparent strict-inequality printing error is retained explicitly; no publisher erratum was located
  or claimed. Versioned scikit-learn documentation was read as corroboration, without claiming that every
  API option or numerical implementation was audited.
