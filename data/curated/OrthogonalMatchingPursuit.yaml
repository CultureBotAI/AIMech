id: AIMech:OrthogonalMatchingPursuit
name: Orthogonal matching pursuit
aliases:
- OMP
concept_kind: algorithm
definition: A greedy fixed-dictionary approximation algorithm that selects an atom correlated with the
  current residual and recomputes the approximation as the orthogonal projection of the signal onto the
  span of all selected atoms.
identity_notes: The record selects finite real unit-norm dictionaries and exact maximum-correlation selection,
  while describing the original weak-selection formulation separately. Orthogonal refers to the residual
  and selected-span projection; the supplied dictionary need not be orthogonal. It is distinct from single-atom
  matching pursuit, a minimum-L1 principle, and a globally optimal subset search. OMP is a source-supported
  local alias; same-token environment RDF prefixes do not denote this AI concept. All 442 AIO IDs, labels
  and scoped synonyms and 525 preceding native IDs, names and aliases were compared. The only normalized
  hit was MP, an exact MarkovChain synonym; the full MarkovChain record and node distinguish that stochastic
  model from pursuit. Ignored/hidden-inclusive searches of both checkouts found the prior pursuit source
  lead, Markov-chain context, author initials and unrelated environment tokens or RDF prefixes, not an
  existing pursuit record. The semantic comparison read 107 AIO name/synonym/definition rows and 148 native
  name/definition rows; nine full AIO CLASS nodes and incident edges and twelve contextual YAMLs were
  inspected. Basis pursuit specifies exact minimum-L1 reconstruction, least-angle regression follows an
  equiangular path, and NMF fits nonnegative factors. This is a bounded identity assessment of the inspected
  corpus.
definition_evidence:
- source_id: pati1993
  locator: Sections 1–2.2, Equations 1–7 and algorithm Steps I–VII, PDF pp. 1–3 / printed pp. 40–42
  relation: supports
- source_id: sklearn18
