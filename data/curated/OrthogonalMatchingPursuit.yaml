  relation: supports
claims:
- claim_id: select-and-refit
  kind: mechanism
  statement: Starting from an empty selected set and residual y, choose an unselected unit atom maximizing
    absolute correlation with the current residual. Add it to the set, solve least squares over all selected
    columns and recompute the residual from that joint fit. In exact arithmetic the residual is orthogonal
    to the entire selected span. A nonzero correlated atom cannot already lie in that span. The method
    does not require the dictionary atoms to be mutually orthogonal.
  evidence:
  - source_id: pati1993
    locator: Sections 1–2.2, Equations 1–7 and algorithm Steps I–VII, PDF pp. 1–3 / printed pp. 40–42
    relation: supports
- claim_id: recursive-projection-update
  kind: mechanism
  statement: Let x_new=sum_i b_i*x_i+gamma, with gamma orthogonal to the old selected span. For a nonzero
    selected correlation, gamma is nonzero. In the real case the new coefficient is c=(r^T*x_new)/||gamma||^2,
    and each old coefficient changes from a_i to a_i-c*b_i. The squared residual decreases by abs(r^T*x_new)^2/||gamma||^2.
    The source’s recursive Gram-matrix implementation realizes this projection algebra; nearly dependent
    atoms can make finite-precision solves sensitive.
  evidence:
  - source_id: pati1993
    locator: Sections 2.1–2.3, Equations 4–12, PDF pp. 2–4 / printed pp. 41–43
    relation: supports
- claim_id: selected-subset-versus-global-optimum
  kind: limitation
  statement: Optimality of the least-squares fit is conditional on the selected subset; it is not optimal
    selection among all equally sized subsets. A curator example with unit columns [e1,e2,e3,b], b=(8/9,4/9,1/9),
    and y=e1-b selects e2 first, then e1 and e3 under lowest-index ties, requiring three atoms for zero
    residual. Yet e1-b is a two-atom representation, and no single atom is collinear with y. The documented
    fixed-cardinality and residual-tolerance objectives are approximation targets, not unconditional minimum-support
    guarantees.
  evidence:
  - source_id: pati1993
    locator: Section 2 opening paragraph and Section 2.2 remarks, PDF pp. 2–3 / printed pp. 41–42; curator-derived
      exact examples in research/discovery/pursuit-boundaries.py
    relation: supports
  - source_id: sklearn18
    locator: Section 1.1.9, approximate fixed-cardinality and residual-tolerance objectives
    relation: supports
- claim_id: finite-termination-conditions
  kind: limitation
  statement: With exact arithmetic, a finite dictionary and no premature tolerance stop, each nonzero-correlation
    selection adds an independent direction; the process reaches the projection onto the full dictionary
    span in at most its rank steps. This rank bound sharpens the paper’s dictionary-size bound by the
    stated independence argument. Residual zero additionally requires y to lie in that span. Early stopping,
    numerical rank decisions and noisy observations change the practical result and do not establish recovery
    of a generating support.
  evidence:
  - source_id: pati1993
    locator: Section 2.2, Theorem 2.1 and remarks, PDF p. 3 / printed p. 42; curator finite-dimensional
      independence consequence
    relation: supports
- claim_id: weak-selection-and-printing-caveat
  kind: scope
  statement: The original paper introduces a fixed-fraction correlation condition with 0<alpha<=1. Its
    page-3 algorithm box prints strict > against alpha times the supremum even though the earlier condition
    is >=; strict > is impossible at alpha=1. This record uses the consistent non-strict condition and
    exact finite maximum convention, also described in the versioned implementation guide, and preserves
    the apparent source inconsistency. The paper’s selected-correlation threshold delta>0 is an early-stop
    rule. Under weak selection, a selected correlation below delta need not mean that every available
    atom has correlation below delta.
  evidence:
  - source_id: pati1993
    locator: Section 1 correlation condition and Section 2.1 algorithm Steps II–III, PDF pp. 1,3 / printed
      pp. 40,42; curator-derived exact examples in research/discovery/pursuit-boundaries.py
    relation: supports
  - source_id: sklearn18
    locator: Section 1.1.9, maximum-correlation selection
    relation: supports
- claim_id: runtime-and-method-boundaries
  kind: scope
  statement: 'The paper contrasts whole-span refitting with MP and gives selected wavelet-decomposition
    examples. Fewer iterations do not imply universally lower cost: refitting adds work, and the conclusion’s
    speed expectation for highly redundant dictionaries is explicitly a conjecture. The exact selection
    score is absolute residual correlation with the original unit atom. The projection-energy decrease
    derived in the source is instead abs(r^T*x_new)^2/||gamma||^2; its atom-dependent denominator means
    the two scores need not select the same atom. This is an algebraic distinction within the inspected
    OMP formulation, not an attribution to an unaudited external algorithm. An external orthogonal-least-squares
    algorithm and its identity require separate primary-source assessment.'
  evidence:
  - source_id: pati1993
    locator: Sections 2.1–4, Equation 7, Figures 1–5 and conclusion, PDF pp. 3–5 / printed pp. 42–44;
      curator-derived score-ranking example in research/discovery/pursuit-boundaries.py
    relation: supports
  - source_id: mallat1993
    locator: Section III, Equations 11–17 and optional backprojection Equations 18–29, PDF pp. 3–5 / printed
      pp. 3399–3401; MP update contrasted with whole-span refitting
    relation: supports
