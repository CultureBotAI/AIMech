id: AIMech:CoCondenserUnsupervisedCorpusAwareLanguageModelPreTraining
name: coCondenser Unsupervised Corpus-Aware Language Model Pre-Training
concept_kind: algorithm
review_status: DRAFT
definition: A two-stage unsupervised language model pre-training algorithm for dense passage retrieval that warm-starts from a universal Condenser model (whose head takes the late-backbone [CLS] representation h_cls^late and short-circuited early-backbone token representations h^early for masked language modeling) and continues pre-training on a target search corpus by sampling two random spans (s_{i1}, s_{i2}) from each of n documents in a batch and minimizing the average sum of Condenser masked language modeling loss and a corpus-aware span contrastive loss L_{ij}^{co} = -log [exp(<h_{i1}, h_{i2}>) / sum_{k=1}^n sum_{l=1}^2 I_{ij != kl} exp(<h_{ij}, h_{kl}>)], using a Gradient Cache v_{ij} = dL^{co}/dh_{ij} to decouple large-batch contrastive gradient computation from sub-batch encoder backpropagation before discarding the Condenser head for small-batch dense retriever fine-tuning.
identity_notes: Distinct from Condenser (Gao & Callan, EMNLP 2021, AIMech:CondenserPreTrainingArchitectureForDenseRetrieval), which uses the late-early short-circuit MLM architecture without any corpus-level contrastive loss over [CLS] inner products; distinct from RocketQA (Qu et al., NAACL 2021, AIMech:RocketQADenoisedHardNegativeSampling), which relies on supervised cross-batch negatives, cross-encoder hard-negative denoising, and synthetic data augmentation during fine-tuning; and distinct from ICT (Lee et al., ACL 2019, AIMech:InverseClozeTask), which contrasts pseudo-queries against context passages using standard Transformer encoders without Condenser short-circuit heads or gradient-cached skip-span contrastive pre-training.
aliases:
- coCondenser
- Corpus-Aware Condenser Pre-Training
- Unsupervised Corpus-Aware Condenser for Dense Passage Retrieval
