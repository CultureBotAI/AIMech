claims:
- claim_id: r752-claim-corpus-span-contrastive-loss
  kind: mechanism
  statement: Given a random batch of n documents [d_1, ..., d_n] from the target search corpus, coCondenser samples two random text spans (s_{i1}, s_{i2}) per document and trains their late-backbone [CLS] embeddings h_{ij} with the joint word-and-span objective L = (1/2n) sum_{i=1}^n sum_{j=1}^2 [L_{ij}^{mlm} + L_{ij}^{co}], where L_{ij}^{co} = -log(exp(<h_{i1}, h_{i2}>) / sum_{k=1}^n sum_{l=1}^2 I_{ij != kl} exp(<h_{ij}, h_{kl}>)) pulls spans from the same document together and pushes spans from different documents apart in inner-product space.
  evidence:
  - source_id: r752-primary-pdf
    locator: Section 3.2, Equations 6-7, p. 3
    relation: supports
- claim_id: r752-claim-gradient-cache-decoupling
  kind: mechanism
  statement: To execute 2,000-document (4,000-span) contrastive pre-training updates on four 11GB RTX 2080 Ti GPUs without holding the full batch activation graph in memory, coCondenser runs an initial no-grad forward pass to cache all representation gradients v_{ij} = dL^{co}/dh_{ij} in C = [v_{11}, ..., v_{n2}] and then accumulates parameter gradients (1/2n) sum_{i,j} [v_{ij}^T (dh_{ij}/dTheta) + dL_{ij}^{mlm}/dTheta] over small sub-batches.
  evidence:
  - source_id: r752-primary-pdf
    locator: Section 3.3 & Section 4.1, Equations 8-12, pp. 3-5
    relation: supports
- claim_id: r752-claim-small-batch-retrieval-application
  kind: application
  statement: When fine-tuned with batch size 64 on a single RTX 2080 Ti GPU without cross-encoder denoising or data augmentation, coCondenser achieves 38.2 MRR@10 and 98.4 Recall@1000 on MS-MARCO Passage Dev (and 35.7 MRR@10 / 97.8 R@1000 even without hard negatives), 75.8 R@5 / 84.3 R@20 / 89.0 R@100 on Natural Questions test, and 76.8 R@5 / 83.2 R@20 / 87.3 R@100 on TriviaQA test, outperforming RocketQA trained with batch size 4,096 (37.0 MRR@10, 97.9 R@1000).
  evidence:
  - source_id: r752-primary-pdf
    locator: Section 4.2 & Section 5, Tables 1-3, Figure 2, pp. 5-7
    relation: supports
- claim_id: r752-claim-corpus-specific-pretraining-limitation
  kind: limitation
  statement: Unlike stage-one universal Condenser pre-training, stage-two coCondenser pre-training is corpus-specific and requires running large-batch unsupervised contrastive pre-training (2,000 documents per step) separately on each target retrieval corpus (such as Wikipedia or the MS-MARCO web collection), and without second-round hard negative mining its local ranking precision (35.7 MRR@10) lags behind hard-negative-tuned Condenser (36.6 MRR@10).
  evidence:
  - source_id: r752-primary-pdf
    locator: Section 1, Section 4.1, and Section 5, Table 2, pp. 1-2, 4, 7
    relation: supports
