id: AIMech:CurriculumDropout
name: Curriculum Dropout
aliases: []
concept_kind: algorithm
definition: A neural-network training procedure that starts without unit suppression and gradually increases
  Bernoulli dropout by decreasing the probability of retaining each unit toward a specified layer-dependent
  limit.
identity_notes: Compared all 442 pinned AIO and 634 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 16, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 13 AIO and 21 native definitions, with every matched definition
  read. 7 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. Retain
  the explicit increasing-suppression curriculum schedule. Its time-dependent Bernoulli mask distribution
  differs from Gaussian fast-dropout approximation, geometric-ensemble dropout boosting and confidence-filtered
  training-signal annealing. The opposite annealed-dropout direction remains a separate source-access
  lead, not another asserted record.
definition_evidence:
- source_id: morerio2017
  locator: Section 3, main PDF pp.3–4, Definition 1 and Equation 1
  relation: supports
claims:
- claim_id: retention-schedule
  kind: mechanism
  statement: The demonstrated schedule is theta(t)=(1-theta_bar)*exp(-gamma*t)+theta_bar, where theta
    is retention probability, t counts gradient updates and gamma is positive. It starts at one and approaches
    theta_bar; suppression probability is 1-theta(t). The paper uses terminal retention values between
    0.5 and 0.9. Its heuristic gamma=10/T depends on an anticipated training length T and approaches,
    rather than exactly reaches, the limit at finite T.
  evidence:
  - source_id: morerio2017
    locator: Section 3, main PDF pp.3–4, Equations 1–2; direct schedule calculation
    relation: supports
- claim_id: mask-and-scaling-scope
  kind: scope
  statement: Independent Bernoulli masks suppress individual units during training; D units have expected
    retained count D*theta(t). This schedules noise rather than sorting the observed examples or learning
    a separate data-dependent gate. The paper’s mathematical analysis uses unscaled binary masks, with
    prediction scaling described separately. An inverted-dropout implementation rescales retained values
    during training and requires reconciling the convention before transferring the formulas.
  evidence:
  - source_id: morerio2017
    locator: Sections 1–3, main PDF pp.1–4; Section 4, pp.5–6
    relation: supports
  - source_id: morerio2017supp
    locator: Section 1.1, supplemental PDF pp.2–4
    relation: supports
- claim_id: linear-loss-regularization-boundary
  kind: limitation
  statement: For a linear predictor with squared loss and independent unscaled Bernoulli masks, the exact
    expected loss equals the squared loss of the theta-scaled mean prediction plus theta*(1-theta)*sum_j(w_j^2*sum_i
    X_ij^2). Thus the data-fit term also changes. The scalar factor grows along the stated retention path
    above one half; this identity does not establish a fixed additive penalty for every nonlinear deep
    network or guarantee better generalization.
  evidence:
  - source_id: morerio2017
    locator: Section 3, main PDF pp.4–5, Equation 3
    relation: supports
  - source_id: morerio2017supp
    locator: Section 1.1, supplemental PDF pp.2–4, Theorem 1 and Equations 3–19; direct finite-mask enumeration
    relation: supports
- claim_id: curriculum-proof-caveats
  kind: limitation
  statement: The source’s formal curriculum argument needs qualifications. Its binomial coefficient aggregates
    masks with the same zero count, rather than giving the probability of a specific corrupted image.
    The supplement multiplies entropies for an independent product distribution, whose joint entropy instead
    adds. Its proposed ratio Q_lambda/P can exceed the stated unit bound, and zero-valued inputs can make
    different masks yield the same image. These direct counterexamples prevent adopting a general bounded-weight
    or strictly increasing observed-image-entropy theorem; they do not invalidate the explicitly defined
    dropout schedule.
  evidence:
  - source_id: morerio2017
    locator: Section 4, main PDF pp.5–6, Equations 4–9
    relation: supports
  - source_id: morerio2017supp
    locator: Section 1.2, supplemental PDF pp.4–6, Equations 20–27; constructed probability, ratio and
      entropy counterexamples
    relation: supports
- claim_id: evaluation-and-protocol-boundary
  kind: limitation
  statement: The reported evaluation uses selected image-classification datasets, architectures and subsets.
    Results summarize each run’s ten highest observed accuracies and then aggregate ten runs, so they
    are selected trajectory summaries rather than fixed final-checkpoint estimates. Universal improvement
    is not established. The supplement specifies a different CIFAR learning rate from the main text’s
    fixed-rate description; exact reproduction must resolve that discrepancy. Recurrent-network and connection-drop
    extensions remain future work in the inspected paper.
  evidence:
  - source_id: morerio2017
    locator: Section 5 and conclusions, main PDF pp.6–8, Figure 3 and Table 1
    relation: supports
  - source_id: morerio2017supp
    locator: Sections 2.1–2.3, supplemental PDF pp.6–7, Tables 1–5
    relation: supports
