aio_mappings:
- target: AIO:CurriculumLearning
  relation: related_match
  rationale: Both schedule training difficulty, but this algorithm changes Bernoulli corruption rather
    than ordering observed examples. The paper’s formal equivalence proof is qualified; the mapping is
    related, not an equivalence or subclass claim.
- target: AIO:DropoutLayer
  relation: related_match
  rationale: The procedure schedules dropout masks over training, while the pinned class describes a masking
    layer with an inverted-scaling implementation comment. A layer does not by itself identify the schedule
    or its scaling convention.
limitations:
- The local identity is the increasing-suppression curriculum procedure, distinct from decreasing-suppression
  annealed dropout, an abrupt switch schedule, Gaussian fast dropout, ensemble-objective dropout boosting
  and confidence-based training-signal annealing.
- The source’s schedule is retained while probability, entropy and curriculum-weight proof problems are
  explicit. No universal optimization, calibration or generalization guarantee is asserted.
- Finite endpoint, retention-versus-suppression and mask-rescaling conventions must be distinguished.
  The planning horizon T is an input to the demonstrated rate heuristic.
- All nine primary and eight supplementary pages were visually inspected. Author code, other versions,
  training and empirical replication were not inspected or executed.
