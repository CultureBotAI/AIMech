aio_mappings:
- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: The inspected finite-duration model has a normalized directed acyclic representation over
    duration-augmented hidden states and observation children. The Bayesian-network family is broader
    than this explicit-sojourn model.
- target: AIO:MarkovChain
  relation: related_match
  rationale: The embedded state-entry process and the state-plus-residual-duration process are Markov
    representations. The hidden state label at each observation time generally is not first-order Markov,
    so the mapping does not assert that marginal process as a Markov chain.
