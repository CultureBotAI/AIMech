name: Hidden semi-Markov model
definition: A latent-state sequence-model family that assigns explicit distributions to state sojourn
  durations, with state changes governed by an embedded transition process and observations conditioned
  on the hidden states.
concept_kind: model_family
identity_notes: The inspected construction is a discrete-time, finite-state hidden semi-Markov model with
  state-specific duration distributions and conditionally independent emissions. It separates entry into
  a state from persistence within that state, rather than obtaining every dwell time from repeated self-transitions
  of an ordinary time-homogeneous HMM. The record is a model family, not the Yu–Kobayashi forward–backward
  algorithm. General continuous-time, duration-dependent destination and hybrid variants require their
  own evidence; they are not automatically covered by the detailed mechanism here. No normalized identity
  match was found across all 442 pinned AIO labels and all scoped synonyms and 388 preceding native IDs,
  names and aliases for the three selected concepts. Full-checkout fixed-string searches included ignored
  and hidden files in both worktree and main, yielding 8 and 8 matched lines; all 8 unique contents were
  read. Hits are prior pending leads and primary-reference context, not records of these identities. All
  78 semantic label/synonym hits and 22 fully annotated exact AIO CLASS nodes with outgoing edges were
  read. Twenty-six contextual YAMLs were byte-verified after prior full reading and three freshly read,
  totaling 22 generated and seven native contextual records. Short acronym identities were compared across
  the complete normalized record inventory. Absence is bounded to the pinned source, maintained collection
  and inspected semantic neighborhood.
limitations:
- An explicit duration distribution is not required to be non-geometric, but it permits duration laws
  whose exit hazard changes with elapsed dwell time. A finite maximum D is a modeling restriction; truncating
  an unbounded geometric law changes it.
- The new-sojourn initial law is different from sampling at an arbitrary time in a stationary process,
  which needs an appropriate residual-life distribution. Requiring a sojourn to end at T is also a different
  observation/endpoint event from the source’s right-censored window.
- The source excludes self-transitions at segment boundaries. Allowing adjacent same-labeled segments
  changes the interpretation and identifiability of the duration law, and needs explicit conventions.
- The printed parameter re-estimation sums use transition/entry quantities at t=1 although their displayed
  definitions refer to t-1. Initial-sojourn duration responsibilities need a separate boundary term; transitions
  between observed time steps start at t=2. This record does not certify the literal printed re-estimation
  formulas as a complete implementation.
- The statewise posterior maximizer in Equation(14) is marginal decoding, not a globally most probable
  hidden path. Numerical scaling, impossible observations and zero expected-count parameter rows require
  handling in an implementation.
- The paper’s one-day web-traffic example, choices of M and D and reported initialization behavior are
  application-specific. No universal convergence, predictive-accuracy or runtime guarantee for all semi-Markov
  variants is asserted.
