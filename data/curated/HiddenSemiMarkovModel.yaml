claims:
- claim_id: method
  kind: mechanism
  statement: In the inspected formulation, let q_t be one of M hidden states and let r_t be its remaining
    duration, including the current time step. On entry into state m, draw d from a normalized state-specific
    distribution p_m(d), with d in 1,...,D, and set r_t=d. If r_t>1, the next state remains m and the
    residual duration decreases by one. If r_t=1, choose a different state n using the normalized entry-transition
    row a_mn, with a_mm=0, and draw its duration from p_n. Emit each observation independently conditional
    on the hidden path using b_m(o_t). The pair (q_t,r_t) is a first-order Markov state; q_t alone need
    not be. The source starts a new sojourn at t=1, giving alpha_1(m,d)=pi_m*p_m(d)*b_m(o_1). Forward
    recursion sums deterministic countdown paths and new entries; grouping incoming entry mass once per
    state avoids repeating that transition sum for each duration. Its terminal backward value beta_T(m,d)=1
    sums over all remaining durations, so the finite observation window can end inside a sojourn. Likelihoods
    and smoothed state marginals follow by summing duration states with this endpoint convention.
