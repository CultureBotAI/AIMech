definition: An exemplar-based clustering procedure that fixes candidate component centers at every observed
  point, fits their simplex weights through a convex soft information-distortion objective, and derives
  a hard grouping from selected posterior-MAP exemplars.
identity_notes: 'This is the Lashkari-Golland procedure, also described as convex mixture model clustering.
  Its data-derived exemplar dictionary and hard extraction policy specialize fixed-component weight EM
  and finite rate-distortion Blahut-Arimoto. It is distinct from moving-centroid k-means, neural balanced
  transport in SeLa, scale-persistence melting, and fusion-penalty methods also called convex clustering.
  CMM and CCE are searched contextual acronyms, not unqualified identity aliases. No normalized identity
  collision across all 442 pinned AIO IDs, labels/scoped synonyms and 487 maintained IDs, names and aliases.
  Full-checkout searches include ignored and hidden files: 8 matched lines in the worktree and 9 in main.
  All six distinct matched texts were read; they concern the prior exemplar-clustering frontier, its source/query
  URLs and an unrelated FreeFem lexer token. Seven annotated AIO nodes and seven full native neighbors
  were inspected. The same pinned bytes retain the previously read 442 class labels and 138 semantic label/synonym
  rows. Absence is bounded to this snapshot and corpus.'
