claims:
- claim_id: soft-objective-and-update
  kind: mechanism
  statement: For N indexed observations, fixed finite dissimilarities d_ij and beta>=0, set S_ij=exp(-beta*d_ij).
    Minimize J(q)=-(1/N)sum_i log(sum_j q_j S_ij) over simplex weights with positive initialization. With
    z_i=sum_j q_j S_ij, set r_ij=q_j S_ij/z_i and q_j_new=(1/N)sum_i r_ij. Equivalently, the row-conditional
    channel minimizes I(I;J)+beta*E[d_ij] with a uniform data-index source. A valid common-base component
    family additionally gives the stated mixture-likelihood interpretation; Gaussian components use squared
    Euclidean distance.
  evidence:
  - source_id: exemplar-source
    locator: Sections 2-4, PDF pp. 2-4, Equations 2, 4, 6-9; conditional normalization from Equations
      6-8
    relation: supports
- claim_id: convexity-and-support
  kind: scope
  statement: 'For finite positive kernels and positive initialization, the exact unpruned iteration converges
    to a global optimum of the restricted soft weight objective. This is not a global fit of freely moving
    mixture components. Convexity does not imply unique coefficients: at beta=0 every q is fixed and optimal.
    Zero weights stay zero and can exclude useful exemplars; exact positive-kernel finite iterations preserve
    positive weights. At an optimum eta_j=(1/N)sum_i S_ij/z_i equals one on positive weights and is at
    most one on inactive coordinates, rather than necessarily strictly less.'
  evidence:
  - source_id: exemplar-source
    locator: Section 2, PDF p. 3, Equation 4 and positive-support condition; Section 4, PDF p. 4, Equation
      9; curator support and beta-zero checks
    relation: supports
- claim_id: hard-exemplar-extraction
  kind: mechanism
  statement: 'The 2007 visualization policy first selects every exemplar index that maximizes r_ij for
    at least one observation, then assigns each observation to its closest selected exemplar. Tie handling
    is not specified. This differs from the later multiview top-M policy. Beta controls the soft distortion
    tradeoff but does not uniquely determine a universally correct hard cluster count. Hardening does
    not retain the soft optimum guarantee or a general bound I<=log(K_hard): for points (0,1,3), squared
    distance and beta=1/4, the saved near-optimal soft solution has I about 0.03228 nats while this MAP
    policy selects only the middle point.'
  evidence:
  - source_id: exemplar-source
    locator: Section 5, PDF p. 5, hard assignment and loss of optimality; Figure 1 caption; curator finite
      soft-channel/MAP calculation
    relation: supports
- claim_id: approximations-and-cost
  kind: limitation
  statement: The dense exact update uses two matrix-vector operations with O(N^2) work per iteration.
    The paper separately proposes deleting weights below 10^-3/N and renormalizing, and retaining only
    a rowwise subset of large similarities. These approximations can change the feasible set or objective
    and need not preserve the full soft optimum. The saved two-point example shows the stated pruning
    threshold removing a small but useful positive component.
  evidence:
  - source_id: exemplar-source
    locator: Section 4, PDF pp. 4-5, Equation 9, pruning and similarity sparsification; curator finite
      pruning example
    relation: supports
- claim_id: printed-normalization-boundaries
  kind: limitation
  statement: The expression r_ij=q_j S_ij/(N z_i) after Equation 9 is joint data-index/exemplar mass,
    not the row-conditional r defined in Equation 6; the conditional omits N. Literal KL from an atomic
    empirical measure to a continuous density is not finite merely by evaluating that density at data
    points. The finite-index objective and normalized responsibilities above avoid transferring that common-measure
    ambiguity from Equation 3.
  evidence:
  - source_id: exemplar-source
    locator: Section 2, PDF p. 3, Equation 3; Section 3, Equations 6-8; Section 4, PDF p. 4, expression
      after Equation 9; curator normalization checks
    relation: supports
limitations:
- Sparsity at an asymptotic limit, numerical pruning, and the selected hard exemplars are different notions.
  Neither every beta change nor every initialization produces a distinct optimum.
- Natural-log objectives use nats; bit rates require consistent log-base and multiplier conversion. A
  slope statement for the rate-distortion curve needs differentiability or a supporting-slope interpretation.
- Synthetic source comparisons tune beta using class labels and do not establish universal performance
  or a biological application. No historical software or benchmark was reproduced.
