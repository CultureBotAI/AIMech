claims:
- claim_id: r391-biased-recursive-difference-compression-and-lyapunov-descent
  kind: mechanism
  statement: By compressing the consecutive gradient difference nabla f_i(x^{k+1}) - nabla f_i(x^k) with probability 1 - p and resetting g^{k+1} = nabla f(x^{k+1}) with probability p, MARINA's estimator error contracts as E||g^{k+1} - nabla f(x^{k+1})||^2 <= (1 - p)||g^k - nabla f(x^k)||^2 + ((1 - p)*omega*L^2/n) E||x^{k+1} - x^k||^2 (Eq. 8), and Theorem 2.1 / Corollary 2.1 prove that the Lyapunov potential Phi_k = f(x^k) - f_* + (gamma / (2*p)) ||g^k - nabla f(x^k)||^2 decreases monotonically for gamma <= 1 / (L*(1 + sqrt((1 - p)*omega/(p*n)))), achieving E||nabla f(x_hat^K)||^2 <= eps^2 in O((Delta_0 * L / eps^2) * (1 + omega / sqrt(n))) iterations and matching uncompressed gradient descent communication complexity whenever omega <= sqrt(n).
  evidence:
  - source_id: r391-primary-pdf
    locator: Section 2 Algorithm 1, Equation 8, Theorem 2.1, Corollary 2.1, and Table 1, pp. 2-5
    relation: supports
- claim_id: r391-pl-linear-convergence-and-vr-pp-marina-extensions
  kind: mechanism
  statement: Under the Polyak-Lojasiewicz condition ||nabla f(x)||^2 >= 2*mu*(f(x) - f_*), Theorem 2.2 proves linear convergence O(max{1/p, (L/mu)*(1 + sqrt((1 - p)*omega/(p*n)))} log(Delta_0 / eps^2)), while VR-MARINA (Algorithms 2-3, Theorems 3.1-3.2) replaces full local gradients with minibatch difference estimators of size b' (recovering PAGE when n = 1, omega = 0) and PP-MARINA (Algorithm 4, Theorem 4.1) extends MARINA to r-out-of-n partial client participation.
  evidence:
  - source_id: r391-primary-pdf
    locator: Section 2.2 Theorem 2.2, Section 3 Theorems 3.1-3.2, and Section 4 Theorem 4.1, pp. 5-8
    relation: supports
- claim_id: r391-periodic-uncompressed-sync-and-unbiased-quantizer-limitation
  kind: limitation
  statement: Requires an unbiased compression operator Q (so independent worker errors average down by 1/n) and periodic uncompressed gradient broadcasts with probability p = 1/(1 + omega) (or synchronous minibatch resets in VR-MARINA), unlike EF21 which transmits only compressed vectors at every round.
  evidence:
  - source_id: r391-primary-pdf
    locator: Section 1.2 Definition 1.1 and Section 2.1 Algorithm 1 & Remark on communication cost, pp. 2-4
    relation: supports
- claim_id: r391-nonconvex-binary-classification-and-autoencoder-application
  kind: application
  statement: Applied to distributed nonconvex sigmoid binary classification on LIBSVM datasets (mushrooms, w8a, a9a, phishing) and neural network autoencoder training on MNIST with RandK sparsification and natural compression, outperforming DIANA, EF21, and uncompressed GD in total communicated bits.
  evidence:
  - source_id: r391-primary-pdf
    locator: Section 5 Numerical Experiments, Figures 1-2 & Appendix B, pp. 8-9, 14-16
    relation: supports
