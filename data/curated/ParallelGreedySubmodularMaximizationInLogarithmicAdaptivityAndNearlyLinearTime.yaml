claims:
- claim_id: r362-claim-expected-block-density-and-polylog-batch-filtering
  kind: mechanism
  statement: For any monotone submodular function f, current solution S, unfiltered pool U_t, and block size ell <= |U_t|, submodularity and random-permutation coupling imply E_{R~U(U_t, ell)}[f(e | S union (R\{e})) | e in R] >= E_{R~U(U_t, ell)}[f(e | S union (R\{e})) | e notin R], which establishes the deterministic expectation inequality E_{R~U(U_t, ell)}[f(R | S)] >= (ell / |U_t|) * sum_{e in U_t} E[f(e | S union R)] (Claim 6); consequently, if E[f(R | S)] >= (1 - 9*epsilon)*(ell/k)*(M - Old), sampling m = Theta((ln n)^2 / epsilon^4) sets finds R_max with f(R_max | S) >= (1 - 10*epsilon)*(ell/k)*(M - Old) with probability at least 1 - 1/n^2 (Lemma 4), whereas if E[f(R | S)] <= (1 - 9*epsilon)*(ell/k)*(M - Old), then with probability at least 1 - 1/n^3 at least one of Theta(ln n / epsilon) batches satisfies the empirical density conditions and filters out at least an epsilon-fraction |U_t^-| >= epsilon*|U_t| of elements (Lemma 5).
  evidence:
  - source_id: r362-primary-pdf
    locator: Section 2, Algorithm 1, p. 5; Section 2.1, Lemma 4, Lemma 5, and Claim 6, pp. 6-9
    relation: supports
- claim_id: r362-claim-deterministic-aggregate-opt-survival-invariant
  kind: mechanism
  statement: Without requiring per-element marginal gain estimates v_{i,e} to concentrate individually, conditioning on successful batch selection guarantees by deterministic submodularity and monotonicity that in every filtering step t, f(OPT intersect U_{t+1} | S) >= f(OPT intersect U_t | S) - (ell/k)*(M - Old) - |OPT intersect U_t^-|*(1 - 7*epsilon)*(M - Old)/k, maintaining the phase invariant f((OPT intersect U_t) union S) >= M - ((t - 1)*ell/k)*(M - Old) - (|OPT \ (U_t union S)| / k)*(1 - 7*epsilon)*(M - Old) (Claim 9); combined with at most 6*ln(n)/epsilon gain iterations per phase (Claim 8), this invariant forces f((OPT intersect U_t) union S) - f(S) > 0 and bounds the number of filtering iterations per phase by at most 2*ln(n)/epsilon (Claim 10, Lemma 7).
  evidence:
  - source_id: r362-primary-pdf
    locator: Section 2.1, Lemma 7, Claim 8, Claim 9, and Claim 10, pp. 9-11
    relation: supports
- claim_id: r362-claim-nearly-optimal-adaptivity-and-nearly-linear-query-complexity
  kind: mechanism
  statement: Across O(1/epsilon) outer phases and 2*epsilon^{-1}*ln(n) parallel geometric guesses for M in [f(OPT)/(1 + epsilon), f(OPT)], every gain step satisfies M - f(S union R_max) <= (M - f(S))*exp(-(1 - 11*epsilon)*|R_max|/k), inductively ensuring M - f(S) <= M*exp(-(1 - 11*epsilon)*|S|/k) and feasibility |S| <= k (Lemma 12), achieving a (1 - 1/e - epsilon) approximation with high probability in O(ln(n)/epsilon^2) adaptive rounds and O(n*poly(log n, 1/epsilon)) total function evaluations and additional running time (Theorem 2, Lemma 11).
  evidence:
  - source_id: r362-primary-pdf
    locator: Section 1, Theorem 2, p. 2; Section 2, p. 4; Section 2.1, Lemmas 11 and 12, pp. 11-12
    relation: supports
