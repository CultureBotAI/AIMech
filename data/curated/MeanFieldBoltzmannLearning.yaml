name: Mean-field Boltzmann learning
definition: A deterministic approximation to Boltzmann-machine parameter learning that substitutes mean-field
  phase statistics for stochastic equilibrium correlations in the positive-minus-negative weight update.
concept_kind: algorithm
identity_notes: This record covers the Peterson–Anderson mean-field learning procedure, especially the
  implemented product-of-means correlation approximation. Its supervised formulation clamps input and
  output in the positive phase and input alone in the negative phase. It differs from inference at fixed
  parameters, contrastive divergence with data-restarted sampling, persistent negative-phase sampling
  and variational-positive/stochastic-negative hybrid learning. The term mean field here denotes a particular
  deterministic phase approximation, not every method using a variational bound. No normalized identity
  match was found across all442 pinned AIO labels and scoped synonyms and385 preceding native IDs/names/aliases
  for the four researched candidates. Full-checkout fixed-string searches included ignored and hidden
  files in both worktree and main, yielding78 and83 matched lines; all44 unique contents were read. Hits
  concern prior source citations, pending leads, neighboring HME records and unrelated Python-license
  authors, not existing records of the three selected identities. All76 semantic label/synonym hits and22
  exact fully annotated AIO CLASS nodes with outgoing edges were read. Twenty-five contextual YAMLs were
  byte-verified after prior full reading and eight freshly read, totaling22 generated and11 native neighbors.
  Adaptive local experts substantially overlaps represented MDN/HME scope and receives no duplicate ID.
  Bare context-sensitive HMM and csHMM are searched homonyms, not unconditional aliases. Absence is bounded
  to the pin and inspected semantic neighborhood.
limitations:
- A difference of variational lower bounds for the clamped and free log partitions is not generally a
  lower bound on their difference. Approximating both phases therefore does not by itself guarantee monotonic
  conditional likelihood or an exact likelihood gradient.
- Mean-field fixed points may depend on initialization and schedule; simultaneous updates need not converge
  or improve a bound. The source’s infinite-network exactness wording is not a theorem for arbitrary graph
  sequences.
- Product-of-means correlations discard connected correlations. The source acknowledges finite-size discrepancies;
  its stronger pair approximation is not the approximation used in the reported application studies.
- For the stated binary energy, the consistent heatbath probability is sigmoid(2*effective_field/tau).
  The sign and factor in the displayed baseline Equation(2.7) are inconsistent with that energy; AppendixA’s
  flip-rate convention is consistent. The baseline display is not adopted as a verified implementation.
- The XOR, encoder and line-symmetry studies have task-specific schedules, learning rates and stopping
  rules. The line-symmetry footnote explicitly excludes unseen-pattern generalization. No speedup, accuracy,
  generalization guarantee or training reproduction is curated.
