claims:
- claim_id: method
  kind: mechanism
  statement: For symmetric zero-diagonal weights T and binary spins s_i in {-1,+1}, use energy E=-sum_(i<j)
    T_ij s_i s_j+sum_i I_i s_i, with thresholds representable by a fixed bias unit. At temperature tau,
    approximate the unclamped means in each phase by m_i=tanh((sum_j T_ij m_j-I_i)/tau), keeping clamped
    means at their observed spin values. The source solves these equations by iterative updates or a continuous
    relaxation, usually over an annealing schedule. Its application studies approximate distinct-unit
    correlations by rho_ij≈m_i m_j, including fixed clamped values, although Equation(3.14) discusses
    a more involved correlation approximation. For a supervised example, calculate these moments once
    with inputs and outputs clamped and once with only inputs clamped. Update a weight proportionally
    to rho_ij_positive-rho_ij_negative; the inverse-temperature factor in the likelihood gradient may
    be absorbed into the learning rate at a fixed final temperature. These are approximate learning statistics
    and generally differ from exact conditional-likelihood derivatives.
