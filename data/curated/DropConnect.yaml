claims:
- claim_id: method
  kind: mechanism
  statement: 'For each training example, draw independent Bernoulli keep masks for the layer’s weights
    and biases with a chosen retention probability p. Multiply the parameters elementwise by this mask,
    compute the affine preactivation and apply the nonlinear activation. Backpropagate through the masked
    connections, using the same mask for the weight gradients and for gradients passed to earlier layers.
    The original inference procedure approximates each preactivation by a Gaussian matched to the masked
    weighted sum’s mean and variance: p times the ordinary weighted sum, and p(1−p) times the sum of squared
    weight-input products, including the constant input used for bias. Draw samples from these Gaussians,
    apply the activation to each sample and average the resulting activations before passing them to the
    next layer. The paper’s sample count and p=0.5 experiments are configuration choices.'
