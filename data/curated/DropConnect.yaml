name: DropConnect
definition: A stochastic neural-network layer that masks individual weights and biases during training,
  so each example is processed through a randomly selected subset of the layer’s connections.
concept_kind: layer
identity_notes: This record denotes the original fully connected DropConnect layer and its training/inference
  conventions. Dynamic connection masking differs from dropping activation units, removing whole residual
  branches, masking spatial blocks and permanently pruning a weight matrix. The surrounding feature extractor
  and classifier are not part of the layer identity. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 276 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 5 and 5 lines respectively.
  Every text hit was a prior candidate lead or a closely related variant lead. Nine exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and three native neighboring mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The original layer uses per-example masks, including biases. Shared minibatch masks, unmasked biases,
  inverted training rescaling and later structured weight-masking variants are not silently substituted
  for this source version.
- Gaussian moment matching is an approximation to the finite Bernoulli sum; averaging sampled nonlinear
  activations is also approximate. Passing an averaged activation through a nonlinear downstream network
  is not exact averaging of full network predictions. Applying the activation to the mean generally differs
  from averaging activations.
- The equal-mask paragraph uses 1/|M| while also describing 2^|M| masks. Exact averaging requires normalized
  mask probabilities; the record follows the weighted expectation in Equation4 rather than propagating
  that inconsistent displayed factor. No full proof audit of the source’s generalization bound is claimed.
- Dense connection-mask storage and sampling can be costly; dynamic sparsity alone does not guarantee
  faster execution. Fully connected-layer evidence does not establish arbitrary convolutional/recurrent
  implementations, universal generalization improvement or a calibrated Bayesian posterior. No benchmark
  result or author code execution is asserted.
