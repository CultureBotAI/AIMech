claims:
- claim_id: criterion-scope
  kind: scope
  statement: Compare the prediction distributions conditional on each protected group without conditioning
    on the target outcome. In binary classification the condition reduces to equality of P(prediction=1
    | A=a) across groups. For the statistical-parity formulation of Dwork and colleagues, exact parity
    is the zero-tolerance case in which the total-variation distance between group output distributions
    vanishes.
  evidence:
  - source_id: original-paper
    locator: Section 1, demographic-parity definition and limitations, PDF pp. 1–2
    relation: supports
  - source_id: statistical-parity-formulation
    locator: Section 3, Definition 3.1, printed p. 7 / PDF p. 8; Section 3.1 examples, printed p. 8 /
      PDF p. 9
    relation: supports
- claim_id: group-parity-boundary
  kind: scope
  statement: The statistical-parity formulation compares group output distributions by total variation
    with a stated tolerance; exact parity is its zero-tolerance case. The accompanying examples show that
    group parity can coexist with unequal treatment within groups and does not imply parity for all subgroups.
  evidence:
  - source_id: statistical-parity-formulation
    locator: Section 3, Definition 3.1, printed p. 7 / PDF p. 8; Section 3.1 examples, printed p. 8 /
      PDF p. 9
    relation: supports
- claim_id: causal-equivalence-assumptions
  kind: limitation
  statement: Rosenblatt and Witter derive connections with counterfactual fairness using their Criteria
    3 independence assumption. Their conversion from demographic parity introduces a causal model and
    latent-variable construction of their choice; they explicitly distinguish that setting from checking
    a predictor against a fixed causal model. These results do not justify treating the two criterion
    identities as synonyms.
  evidence:
  - source_id: causal-parity-analysis
    locator: Related Work distinction between a fixed and freely constructed causal model, PDF p. 3; Criteria
      3 and Theorems 4–5, PDF p. 4
    relation: supports
