name: Demographic parity
definition: A group-level prediction criterion requiring the distribution of a decision or prediction
  to be independent of a specified protected attribute; for a binary decision, the positive-decision rate
  is equal across the compared groups.
concept_kind: evaluation_criterion
identity_notes: The record denotes exact distributional parity, also called statistical parity in the
  inspected fairness literature. It is not equalized odds, equality of true-positive rates, an approximate
  disparity tolerance, or a complete fairness judgment. All 442 AIO identities/scoped synonyms, 94 native
  identities and ignored-inclusive text in both checkouts were searched. Conditional parity and parity
  for selected subgroups require separately stated conditioning and scope.
limitations:
- Matching group output rates does not ensure similar individuals receive similar treatment or that parity
  holds within every subgroup.
- If target outcomes have different prevalences by group, a perfectly accurate predictor can violate demographic
  parity. This statistical observation does not by itself choose which fairness criterion a domain should
  use.
- Exact independence is distinct from approximate parity within a specified tolerance; an empirical estimate
  needs uncertainty and population context.
- Connections to counterfactual fairness depend on causal-model assumptions and how the predictor/model
  is constructed. Shared population statistics do not make the two definitions interchangeable for a fixed
  causal model.
aliases:
- Statistical parity
