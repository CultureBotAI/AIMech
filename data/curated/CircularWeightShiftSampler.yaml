id: AIMech:CircularWeightShiftSampler
name: Circular weight-shift sampler
concept_kind: algorithm
definition: A finite-state Markov transition construction that partitions a circle into intervals with
  target-weight lengths and derives each transition from the overlap of a positively shifted current-state
  interval with destination intervals.
definition_evidence:
- source_id: suwa2023v2
  locator: Section III, PDF pp. 3–4, Figure 1 and Equations 10–13; Appendix A, p. 8, Equations A1–A5
  relation: supports
claims:
- claim_id: ordered-circular-overlap-kernel
  kind: mechanism
  statement: Take finitely many strictly positive weights w_i in one specified state order, let W=sum_i
    w_i, F_i=sum_{j<=i} w_j and F_0=0, and choose 0<s<W. The target probabilities are w_i/W. Shift the
    source interval [F_{i-1},F_i) forward by s modulo W. Let v_ij be the total length of its intersection
    with destination interval [F_{j-1},F_j), and set P(i,j)=v_ij/w_i. Equivalently, with Delta=F_i-F_{j-1}+s,
    the flow is max(0,min(Delta,w_i+w_j-Delta,w_i,w_j)) plus max(0,min(Delta-W,w_i+w_j+W-Delta,w_i,w_j)).
    Sampling a fresh uniform point within the source interval, shifting it forward and reading its destination
    interval gives the same transition law. The half-open interval convention specifies boundaries for
    this mathematical construction.
  evidence:
  - source_id: suwa2023v2
    locator: Section III, PDF p. 3, Equations 10–12 and Figure 1; Appendix A, p. 8, interval-overlap derivation
    relation: supports
- claim_id: balanced-flows-and-conditional-use
  kind: mechanism
  statement: Translation around the circle preserves length. The destination intervals partition the circle,
    so sum_j v_ij=w_i; the shifted source intervals also partition it, so sum_i v_ij=w_j. The transition
    rows sum to one and w/W is invariant. The ordering and shift specify the same kernel for every current
    state of this target. For a full-conditional update they may depend on the fixed conditioning environment,
    but an arbitrary current-label-dependent choice is not this balanced construction. Updating a valid
    full conditional with this kernel preserves the joint target. Fixed mixtures and fixed sequential
    compositions of target-preserving updates preserve it as well; a composition need not be reversible.
  evidence:
  - source_id: suwa2023v2
    locator: Section III, PDF pp. 3–4, Equations 11–14
    relation: supports
  - source_id: neal2024
    locator: Section 2, PDF pp. 2–3, Equations 1–4 and update compositions
    relation: supports
- claim_id: maximum-and-half-shift-policies
  kind: scope
  statement: The shift parameter is part of the construction. With at least two positive-weight states,
    s=max_i w_i gives the Suwa–Todo maximum-weight policy in Suwa’s source-shift orientation. The choice
    s=W/2 is the half-shift policy and has symmetric flows, hence detailed balance. Both policies attain
    stationary self-transition probability max(0,2*max_i(w_i)/W-1). If max_i(w_i)<=W/2, every shift in
    [max_i(w_i),W-max_i(w_i)] has zero diagonal. When one weight exceeds W/2, some self probability is
    unavoidable. Arbitrary interior shifts need not minimize self transitions. ST and HST name specific
    policies in Neal’s shifted-tower presentation, not exact aliases for the entire parameterized construction.
  evidence:
  - source_id: suwa2023v2
    locator: Section III, PDF pp. 3–4, Figure 1(c), maximum and half-shift discussion
    relation: supports
  - source_id: suwa-todo2010
    locator: PDF pp. 2–3, allocation construction and Equations 5–10
    relation: supports
  - source_id: neal2024
    locator: Section 10, PDF pp. 36–40, ST/HST definitions and Figure 7
    relation: supports
- claim_id: orientation-order-and-mixture-boundaries
  kind: scope
  statement: This record shifts the source interval by +s. Neal’s Equation 98 and Algorithm 7 instead
    move a source point by -s, equivalently shifting the destination tower forward. For the same order
    and shift their flow matrices are transposes, generally giving different kernels; at half shift they
    agree. For weights (2/5,3/10,1/10,1/5) and s=2/5, the positive-shift first row is (0,3/4,1/4,0), whereas
    Neal’s is (0,1/4,1/4,1/2). Suwa’s formula agrees with Suwa’s stated source geometry, so Neal’s footnote
    18 allegation of a reversed-order formula error is not adopted. UST, DST and OHST specify ordering
    policies within the tower framework, including tie choices. Neal’s UDST explicitly mixes paired reverse
    UST and DST kernels equally; that mixture is outside this single-order, single-shift identity and
    is a separate mixture construction. No general equivalence of that mixture to one circle shift is
    asserted.
  evidence:
  - source_id: suwa2022v1
    locator: Section III, PDF p. 3, Figure 1 and Equations 12–13
    relation: supports
  - source_id: suwa2023v2
    locator: Section III, PDF p. 3, Equations 11–12; Appendix A, p. 8
    relation: supports
  - source_id: neal2024
    locator: Section 10, PDF pp. 37–41, footnote 18, Equations 98–104, Figures 7–9 and Algorithm 7; original
      orientation comparison in research/discovery/tower-boundaries.py
    relation: supports
- claim_id: reversibility-and-exploration-limits
  kind: limitation
  statement: Half shift is sufficient for reversibility, but non-half shifts are not necessarily nonreversible.
    For weights (3/5,2/5) and s=1/10, the matrix has rows (5/6,1/6) and (1/4,3/4), with equal opposing
    stationary flows. This qualifies the source’s blanket non-half nonreversibility statement. Invariance
    and minimum self probability also do not establish irreducibility or aperiodicity. Half shift on four
    equally weighted states gives two disjoint deterministic two-cycles; maximum shift on three equally
    weighted states gives a deterministic three-cycle. No universal variance, burn-in, finite-run accuracy
    or runtime advantage is claimed.
  evidence:
  - source_id: suwa2023v2
    locator: Section III, PDF p. 4, half-shift and non-half reversibility discussion
    relation: supports
  - source_id: suwa-todo2010
    locator: PDF p. 3, ergodicity caveat after Equation 10
    relation: supports
  - source_id: neal2024
    locator: Section 13, PDF p. 49, uniform-target comparisons; original non-half and periodicity calculations
      in research/discovery/tower-boundaries.py
    relation: supports
- claim_id: printed-sampler-boundaries
  kind: limitation
  statement: 'The overlap formula defines the maintained transition. Neal’s Algorithm 6 dominant-current
    shortcut is valid for its minimum-self ST/HST choices but not for arbitrary shifts: with weights (3/5,2/5),
    current state 1 and s=1/10, it returns (1/3,2/3) instead of the overlap row (5/6,1/6). Algorithm 7
    also does not satisfy its printed nonzero-output guarantee at every closed-uniform endpoint. With
    weights (1/5,3/10,1/2), current state 1, half shift and r=0, its printed traversal returns state 2
    although the row is (0,0,1). This endpoint has probability zero under an ideal continuous uniform
    law and does not invalidate that law. These are explicit mathematical counterexamples, not an author-issued
    correction or a claim to have executed author software.'
  evidence:
  - source_id: neal2024
    locator: Section 10, PDF pp. 39–41, Algorithms 6–7 and shortcut discussion; original shortcut and
      endpoint calculations in research/discovery/tower-boundaries.py
    relation: supports
