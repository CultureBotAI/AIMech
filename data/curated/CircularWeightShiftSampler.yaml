    a stochastic process/model; this method-to-process association does not assert equivalence, subclass
    membership or inheritance of Network and ProbabilisticHiddenLayer assertions.
limitations:
- The maintained scope uses exact finite strictly positive weights, one consistent state order and an
  interior shift. A one-state distribution stays under every interior shift; its maximum-weight shift
  equals W and lies outside that interior parameter domain. Zero-weight current rows require a separate
  completion and are not specified here.
- The descriptive record label covers Suwa’s parameterized overlap construction. It does not make the
  narrower ST/HST policies, ordered specializations or the UDST mixture broad exact aliases. Agreement
  with another sampler on a particular target does not establish identity of the full constructions.
- The half-open interval convention and exact flow formula are mathematical specifications, not a verified
  finite-precision implementation. Countably infinite extensions, adaptive order selection and author
  code are outside this maintained scope.
- Pinned arXiv and author-report versions are used with their distinct source conventions and caveats
  retained. No publisher-PDF equivalence, full Neal 84-page empirical review, benchmark reproduction or
  source-family exhaustion is claimed.
