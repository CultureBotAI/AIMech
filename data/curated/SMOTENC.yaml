id: AIMech:SMOTENC
name: SMOTE-NC
concept_kind: preprocessing_method
aliases: []
definition: The original mixed nominal/continuous extension of SMOTE that synthesizes minority-class training
  examples by finding minority neighbors with a continuous-distance and nominal-mismatch rule, interpolating
  their continuous coordinates and assigning nominal coordinates through neighbor votes.
definition_evidence:
- source_id: chawla2002
  locator: Section 6.1 introduction and steps 1–3, including Table 6, PDF pp. 28–29 / printed pp. 348–349;
    continuous synthesis referred to Section 4.2, PDF pp. 8–10 / printed pp. 328–330.
  relation: supports
claims:
- claim_id: mixed-feature-minority-synthesis
  kind: scope
  statement: The original SMOTE-NC procedure extends continuous-feature SMOTE to training examples with
    both continuous and nominal features. It creates additional examples assigned to the minority class
    by using minority-class neighbors, continuous interpolation and nominal-feature votes. The procedure
    is training-data preprocessing rather than a fitted classifier. Its mixed-feature construction is
    distinct from the original continuous-only method and from the separately proposed nominal-only SMOTE-N
    construction.
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 introduction and steps 1–3, PDF pp. 28–29 / printed pp. 348–349; Section 4.2,
      PDF p. 8 / printed p. 328; Section 6.2 opening, PDF p. 29 / printed p. 349.
    relation: supports
- claim_id: minority-continuous-standard-deviation-median
  kind: mechanism
  statement: Compute the standard deviation of each continuous feature using the minority-class examples,
    then take the median M across those feature-wise standard deviations. This single scale supplies the
    nominal-mismatch penalty in neighbor distance. It is not a median of raw feature values, a median
    of variances, or a statistic pooled across all classes.
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 step 1 and the definition of Med in Table 6, PDF p. 28 / printed p. 348.
    relation: supports
- claim_id: mixed-distance-with-squared-nominal-penalty
  kind: mechanism
  statement: For minority examples x and y, the displayed distance rule is d(x,y)=sqrt(sum_continuous
    (x_j-y_j)^2 + M^2*sum_nominal 1[x_j!=y_j]). Each differing nominal coordinate contributes a separate
    M^2 inside the square root. The displayed example has two nominal mismatches and therefore two such
    terms. This rule does not assign numeric interpolation values to category labels and is not the value-difference
    construction discussed for SMOTE-N.
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 step 2 and Table 6, PDF p. 28 / printed p. 348; Section 6.2 opening, PDF p. 29
      / printed p. 349. The mixed-distance example is captioned Table 6, despite the preceding prose reference
      to Table 2.
    relation: supports
- claim_id: minority-neighbors-and-generation-parameters
  kind: mechanism
  statement: For a minority-class seed, identify k nearest neighbors among minority examples using the
    mixed distance, then apply the earlier SMOTE generation procedure with randomly selected members of
    that neighbor set and a requested oversampling amount. The earlier implementation uses k=5, while
    its algorithm takes k and the oversampling percentage as inputs. This does not define five as a universal
    requirement or fully settle ties, self-inclusion and neighbor-reuse conventions.
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 steps 2–3, PDF pp. 28–29 / printed pp. 348–349; Section 4.2 prose and Algorithm
      SMOTE inputs and lines 13–18, PDF pp. 8–9 / printed pp. 328–329.
    relation: supports
- claim_id: shared-scalar-continuous-interpolation
  kind: mechanism
  statement: 'Following the earlier prose and Table 1 formulation, for the seed x and one selected minority
    neighbor y, generate the continuous subvector as x_cont+r*(y_cont-x_cont), using one random scalar
    r between zero and one for that synthetic example. The continuous subvector therefore lies on their
    continuous-coordinate line segment. This record explicitly follows that shared-scalar description:
    the printed pseudocode instead places the gap draw inside its coordinate loop, an unresolved source
    inconsistency.'
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 step 3, PDF p. 29 / printed p. 349, referring to Section 4.2 prose on PDF p.
      8 / printed p. 328 and Table 1 on PDF p. 10 / printed p. 330; compare Algorithm SMOTE lines 19–22,
      PDF p. 9 / printed p. 329.
    relation: supports
- claim_id: coordinate-wise-nominal-neighbor-vote
  kind: mechanism
  statement: For each nominal coordinate, assign the value described as occurring in the majority of the
    k nearest neighbors. This is a vote over feature values within the selected minority-neighbor set,
    not a vote to predict the class of a query example. The printed NC rule does not expressly add the
    seed to this vote. It does not completely specify how to choose a category when frequencies tie or
    when no category has a strict majority.
  evidence:
  - source_id: chawla2002
    locator: Section 6.1 step 3, PDF p. 29 / printed p. 349. The separate Section 6.2 proposal explicitly
      votes over the seed plus its k neighbors, PDF p. 31 / printed p. 351; that voting-set statement
      is not imported into NC.
    relation: supports
