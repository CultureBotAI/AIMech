aio_mappings:
- target: AIO:DataAugmentation
  relation: broad_match
  rationale: SMOTE-NC constructs additional mixed-feature training examples from observed minority examples
    through continuous interpolation and nominal-neighbor voting. The pinned data-augmentation concept
    is broader than this particular preprocessing method. This is a local-to-broader mapping, not equivalence,
    an upstream ontology edit, a neural preprocessing layer or a guarantee of improved robustness or predictive
    accuracy.
limitations:
- The continuous mechanism follows the shared-scalar prose and Table 1 interpretation. Algorithm SMOTE
  line 21 draws gap inside the attribute loop; independent coordinate draws generally yield a point in
  the coordinate-wise rectangle rather than on the line segment. The source descriptions are not certified
  as identical executable code, and Section 6.1 does not resolve this inherited conflict.
- 'The nominal rule says majority among the k neighbors. It does not completely specify ties, categories
  lacking a strict majority, equal distances, duplicate observations, adequate neighbor counts, self-inclusion
  or neighbor reuse. The SMOTE-N proposal explicitly includes the seed in its vote; that distinct statement
  is not asserted for NC. Oversampling-percentage conventions also require care: the earlier pseudocode
  handles percentages below 100 by selecting a subset and otherwise assumes integral multiples of 100.'
- Without a continuous feature the median scale is undefined, so this rule is not an all-nominal method.
  If the median standard deviation is zero, all nominal mismatch penalties vanish. Distinct vectors with
  equal continuous coordinates can then have zero distance, even though some nominal coordinates differ.
  A zero median does not require every continuous feature to be constant. These are direct formula boundaries,
  not reported experiments; no fallback is printed.
- Raw continuous squared differences and a median across feature-wise standard deviations depend on feature
  units. Independent rescaling can change neighbor selection; this is not feature-wise standardization
  or arbitrary-unit invariance. The method description does not fix sample versus population standard-deviation
  denominators or missing and nonfinite-value handling.
- Continuous interpolation and coordinate-wise nominal votes do not guarantee a distinct synthetic record,
  a plausible joint feature combination or a point in the true minority support. The minority label is
  assigned by the synthesis model rather than newly observed. Nominal votes may select categories from
  neighbors other than the one selected for the continuous interpolation.
- Section 6.1 reports one mixed-feature dataset, Adult, and describes unfavorable comparison with plain
  undersampling. Its explanation involving overlap with majority space is a hypothesis, not a demonstrated
  general cause. No numerical performance comparison, plot quantification, benchmark reproduction, universal
  benefit or calibration guarantee is asserted here.
- This record is scoped to the original 2002 construction. Later one-hot encodings, category penalties,
  voting sets and zero-scale or missing-value fallbacks need separate versioned evidence. SMOTE-N remains
  a separately described potential nominal-only proposal, not an alias. The retained 37-page journal PDF
  was acquired on 11 October 2026 and reused after byte verification. Research read the defining core
  and extensions with selected formula visuals, not the complete paper or benchmark. No author code, later
  library implementation or original VDM paper was inspected or executed. The mixed-distance example is
  Table 6 despite the preceding prose reference to Table 2.
