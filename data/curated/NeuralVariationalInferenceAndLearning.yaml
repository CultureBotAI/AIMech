claims:
- claim_id: method
  kind: mechanism
  statement: Let P_theta(x,h) be the generative joint model and Q_phi(h|x) an inference-network distribution
    that can be sampled and evaluated efficiently. For each observed x, maximize the bound E_Q[log P_theta(x,h)-log
    Q_phi(h|x)]. Draw latent samples from Q. The raw model-gradient estimator averages d log P_theta(x,h)/d
    theta; the raw inference-gradient estimator averages the learning signal l=log P_theta(x,h)-log Q_phi(h|x)
    times d log Q_phi(h|x)/d phi. Its score expectation is zero, so baselines independent of the current
    latent sample conditional on x can be subtracted without changing the raw gradient expectation. The
    method fits an input-dependent neural baseline and maintains a scalar running center. It also divides
    the centered signal by max(1,sqrt(v)), where v is a running variance estimate, to adapt the update
    scale. In the supplement’s concrete minibatch ordering, subtract the input baseline, compute batch
    signal mean and variance, update the running center and variance using those batch statistics, then
    form centered/scaled inference updates and baseline updates; the model gradient remains unweighted
    by this signal. For layered factorizations, local learning signals omit terms that are independent
    of the relevant sampled descendants under the conditional score expectation, with separate baselines
    and variance estimates.
  evidence:
  - source_id: method-source
    locator: Sections 2.1–2.3, Equations (1)–(12), PDF pp.2–4; Sections 3.3–3.4, pp.5–6
    relation: supports
  - source_id: nvil-supplement
    locator: Sections A–B, Algorithm 1 and inference-gradient derivation, PDF p.1
    relation: supports
- claim_id: batch-ordering
  kind: scope
  statement: The supplementary algorithm first samples the minibatch and computes baseline-adjusted learning
    signals, then updates the running mean and variance from that same minibatch before using them to
    center and scale its inference gradients. This practical order is distinct from the main-text identity
    for a baseline independent of the sampled latent value.
  evidence:
  - source_id: nvil-supplement
    locator: Section A, Algorithm 1, PDF p.1
    relation: supports
- claim_id: objective-distinction
  kind: scope
  statement: The inference network is trained from observations and its own latent samples toward the
    variational objective. The source contrasts this with wake-sleep’s recognition update from model-generated
    samples and with pathwise gradients for continuous-variable variational methods. These distinctions
    do not make NVIL synonymous with every use of REINFORCE.
  evidence:
  - source_id: method-source
    locator: Sections 3.1–3.4, PDF pp.4–6
    relation: supports
