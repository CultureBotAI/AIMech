name: Neural variational inference and learning
definition: A method for jointly training a directed latent-variable model and an amortized stochastic
  inference network by maximizing a variational log-likelihood bound, using score-function inference gradients
  with learned baselines and adaptive learning-signal normalization.
concept_kind: algorithm
identity_notes: 'This is Mnih and Gregor’s NVIL method, not all variational inference, a particular trained
  belief network, the wake-sleep recognition update, or the reparameterization-gradient approach used
  in stochastic gradient variational Bayes. It uses a shared feedforward inference model across observations
  and does not require a separate optimized set of local variational parameters for every observation.
  Exact sampling refers to its chosen variational distribution, not automatically to the true posterior.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 334 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 66 and 66 lines respectively. Match-centered excerpts from all 41 unique hit contents
  were inspected: ordinary verb reinforce in existing ant/search/pseudo-label records and calculations,
  plus neighboring Gumbel straight-through discussions and the new gradient-estimator discovery lead,
  not existing candidate records. Exact checkout counts and differences are retained in the ledger. Ten
  exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- A sample from Q is exact for Q while posterior inference remains approximate unless Q matches the model
  posterior. The variational-family capacity and optimization outcome affect the gap to the marginal log
  likelihood.
- Unbiasedness of the raw score estimator and subtraction of a conditionally sample-independent baseline
  do not automatically certify the final adaptive update. The supplement updates running statistics with
  the same minibatch before applying them, and normalization changes the update scale. Current-batch centering
  can introduce finite-sample bias; no blanket unbiasedness claim is made for that full practical procedure.
- The input baseline is trained using a squared-signal objective, which the source explicitly distinguishes
  from maximum variance reduction that accounts for score magnitude. A learned baseline need not improve
  variance in every setting.
- The method needs tractable sampling and evaluation of Q, evaluation of the joint P and differentiable
  log-probability parameters. It does not require differentiating the sampled discrete latent value, but
  support, zero probabilities and differentiation-under-expectation conditions still matter.
- Local-signal simplifications require the stated conditional independences. Arbitrarily dropping latent-dependent
  log terms can change the expected gradient.
- The variational bound and stochastic gradient formulation do not guarantee global optimization, exact
  posterior recovery or universally faster inference. Reported dataset comparisons and the complete author
  implementation are not certified here.
