claims:
- claim_id: method
  kind: mechanism
  statement: Choose a finite value set L_k for each of K hyperparameters. Form candidate configurations
    from the Cartesian product of these sets, giving product_k |L_k| combinations. Train/evaluate the
    candidates under the chosen validation protocol and select the configuration with favorable validation
    loss. The finite set of configuration locations is specified without fitting a proposal model from
    earlier scores. The paper’s Figure 1 shows why varying irrelevant coordinates can repeatedly evaluate
    the same values along a relevant coordinate. That coverage property does not prescribe the optimizer
    used inside each training run, a worker schedule, or a particular cross-validation fold count.
