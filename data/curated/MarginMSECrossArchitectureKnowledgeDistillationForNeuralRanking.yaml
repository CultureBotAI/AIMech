claims:
- claim_id: margin-mse-pairwise-margin-invariance-to-architecture-score-offset
  kind: mechanism
  statement: Given a training triple (Q, P^+, P^-) with raw teacher scores M_t(Q, P^+) and M_t(Q, P^-) (without output activation), Margin-MSE minimizes L_MMSE(Q, P^+, P^-) = MSE(M_s(Q, P^+) - M_s(Q, P^-), M_t(Q, P^+) - M_t(Q, P^-)) (Equation 11) with bidirectional student gradients dL_MMSE/dM_s(Q, P^+) = 2 * [(M_s(Q, P^+) - M_s(Q, P^-)) - (M_t(Q, P^+) - M_t(Q, P^-))] and dL_MMSE/dM_s(Q, P^-) = -dL_MMSE/dM_s(Q, P^+) (Equation 12), making the loss invariant to constant architecture-specific score offsets between BERT_CAT, BERT_DOT, ColBERT, and TK while reversing the update direction when the teacher detects a false negative (M_t(Q, P^+) - M_t(Q, P^-) < 0).
  evidence:
  - source_id: r793-primary-pdf
    locator: Section 4.1 (Score Scale Analysis) & Section 4.2 (Margin-MSE Loss), pp. 3-4, Figure 1, Equations (11)-(13)
    relation: supports
  - source_id: r793-primary-pdf
    locator: margin_mse_loss vs pointwise_mse_loss verification
    relation: supports
- claim_id: margin-mse-multi-teacher-ensemble-distillation
  kind: mechanism
  statement: "Margin-MSE supports zero-extra-student-cost multi-teacher ensemble distillation by averaging the raw scores of heterogeneous large cross-encoder teachers\u2014specifically an ensemble T2 of BERT-Base, BERT-Large-Whole-Word-Masking, and ALBERT-Large\u2014before computing the target pairwise margin M_t(Q, P^+) - M_t(Q, P^-)."
  evidence:
  - source_id: r793-primary-pdf
    locator: Section 6.1 (Transferring Knowledge from Ensembles), pp. 5-6, Table 1
    relation: supports
  - source_id: r793-primary-pdf
    locator: ensemble_teacher_margins verification
    relation: supports
- claim_id: margin-mse-ms-marco-and-trec-dl-gains-across-architectures
  kind: application
  statement: On MS MARCO Passage Ranking and TREC DL 2019 using a 6-layer DistilBERT backbone, Margin-MSE with the T2 teacher ensemble improvesTK from 0.652 to 0.686 nDCG@10 (+5.2%) on TREC DL 2019, BERT_DOT full-corpus retrieval from 0.311 to 0.329 MRR@10 on MS MARCO Dev (and 0.668 to 0.697 nDCG@10 on TREC DL 2019), and ColBERT from 0.355 to 0.370 MRR@10 on MS MARCO Dev (and 0.693 to 0.728 nDCG@10 on TREC DL 2019), allowing a 6-layer ColBERT student to outperform its 12-layer BERT-Base and 24-layer BERT-Large cross-encoder teachers.
  evidence:
  - source_id: r793-primary-pdf
    locator: Section 6 (Results), pp. 5-7, Tables 1-3
    relation: supports
- claim_id: margin-mse-offline-teacher-inference-overhead
  kind: limitation
  statement: Training with Margin-MSE requires running one or more heavy cross-encoder teacher models (such as 12-layer BERT-Base, 24-layer BERT-Large, and 24-layer ALBERT-Large) over millions of training query-passage triples (e.g., 40M triples from the MS MARCO training set) to pre-compute soft margin labels.
  evidence:
  - source_id: r793-primary-pdf
    locator: "Section 5 (Experiment Design \u2014 Training), p. 5"
    relation: supports
