claims:
- claim_id: method
  kind: mechanism
  statement: Let p_ki be the network softmax probability for class k on image i, for N images and K classes.
    At a self-labelling step hold model parameters fixed and form P_ki=p_ki/N. Approximately minimize
    <Q,−log P>+(1/lambda) KL(Q||r c^T), lambda>0, over nonnegative K-by-N Q with row masses r_k=1/K and
    column masses c_i=1/N. With A=P^lambda, obtain Q=diag(alpha) A diag(beta) by alternating alpha=r/(A
    beta) and beta=c/(A^T alpha), using elementwise division. A conditional soft code would be N Q_:i;
    the pinned author implementation instead takes y_i=argmax_k Q_ki, without gradients through assignment,
    and trains the encoder and head on these hard pseudo-labels using cross-entropy and image augmentation
    until the next global reassignment. This practical hardening need not preserve exact equal class counts.
    Multiple heads can supply separate self-labellings sharing one feature extractor.
