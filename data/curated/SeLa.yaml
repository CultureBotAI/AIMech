name: SeLa
definition: A self-supervised representation-learning procedure that alternates neural pseudo-label prediction
  and dataset-wide self-labelling through an entropy-regularized balanced optimal-transport assignment.
concept_kind: algorithm
identity_notes: SeLa denotes Asano et al.’s simultaneous clustering and representation-learning procedure.
  It differs from k-means-based DeepCluster and online cross-view SwAV. Its global transport formulation
  and the author implementation’s hardening of soft assignments are distinguished explicitly. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 195 prior native IDs/names/aliases.
  Ignored-inclusive, word-delimited searches of both full checkouts found nine prior discovery/review
  references in each plus six unrelated language-stemmer tokens in the main environment. An initial substring
  search also matched unrelated layer-name suffixes. Neighboring k-means, SwAV, Barlow Twins and VICReg
  mechanisms and exact AIO definitions/edges were inspected; shared components do not establish identity.
limitations:
- The paper’s displayed reciprocal Sinkhorn updates omit marginal factors; this record states the 1/K
  and 1/N factors required by its constraints and confirmed in the pinned CPU and GPU implementations.
  Probabilities, log probabilities and mass-normalized joint matrices must not be conflated.
- 'The original hard equal-size partition assumes K divides N. For other N≥K it needs integer count capacities
  differing by at most one. With integer count capacities, the unregularized transport problem admits
  an extreme optimum for which NQ is an integral one-hot assignment matrix: the mass-normalized Q has
  entries 0 or 1/N. Arbitrary tied optimal mixtures and entropy-regularized plans need not be hard assignments.'
- Finite regularization and finite iteration approximate the original combinatorial assignment. Columnwise
  argmax can destroy balance; uniform soft plans are feasible. The paper’s ideal alternating-objective
  convergence claim is not a guarantee for this approximate hard-label/SGD implementation or against every
  collapsed state.
- The mutual-information interpretation concerns labels and data indices under the stated marginal and
  fitted-model assumptions, not a measured mutual information between continuous embeddings.
- Global prediction storage and reassignment scale with images and classes. Cluster count, augmentation,
  optimization and the balanced-class prior affect the learned grouping; semantic labels and universal
  benchmark improvements are not guaranteed.
