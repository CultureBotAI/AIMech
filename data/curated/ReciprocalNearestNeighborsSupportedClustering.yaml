limitations:
- This record covers the main clustering construction, with Euclidean representative geometry. The paper’s
  network extension adds pseudoinverse distances, infinite nonadjacent distances, stopping/attachment
  rules and betweenness-based postprocessing; that extension is outside the maintained core claim scope.
- The described random tie perturbation does not fully specify its distribution, seed, symmetric treatment
  or zero-distance handling. No author implementation was inspected; no deterministic tie convention is
  silently supplied.
- Finite curator checks illustrate a seven-point chain, depth thresholds for alpha 2 and 1.5, a supporting
  midpoint that differs from a retained-member centroid, and Euclidean midpoint identities. They are not
  a complete RS implementation or benchmark replication.
- A separate four-cycle metric makes the unrestricted midpoint-pair formula negative, but its chosen endpoint
  pairs are not reciprocal in that input. This is only a counterexample to an unrestricted geometric identity,
  not an actual RS-execution failure.
- The evaluation descriptions contain provenance ambiguities, including the group-average baseline citing
  Ward 1963 and unusual iris/glass table entries. The exact historical datasets, implementations, preprocessing,
  repetitions and corresponding 2020 journal revision were not reproduced or equated with current versions.
- All 13 pages of arXiv1907.04915v1 were visually read, including five main figures, three supplementary
  figures and two tables. The record remains DRAFT; no author code, model fitting or performance experiment
  was executed.
