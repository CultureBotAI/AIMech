name: CHAMELEON clustering
definition: A graph-clustering procedure that first partitions a sparse neighbor graph into small subclusters
  and then agglomerates them using interconnectivity and closeness normalized by their internal bisection
  statistics.
concept_kind: algorithm
identity_notes: This record covers the two-phase CHAMELEON procedure in Technical Report 99-007, including
  the two merge-selection alternatives described there. Dynamic modeling means recomputing cluster-relative
  graph statistics, not learning a neural representation. The inspected source is the 22-page report,
  not the eight-page final Computer article. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 218 preceding native IDs/names/aliases. Word-delimited fixed-string searches
  of both full checkouts, including ignored and hidden files, returned 15 lines each in existing discovery/review
  context. Five neighboring native records and five exact AIO nodes with scoped synonyms and outgoing
  edges were inspected.
limitations:
- Meaningful nonzero internal cut statistics and nonempty cross-edge sets are needed to evaluate the ratios.
  Very small or disconnected subclusters can make the estimates unstable or undefined; a zero-denominator
  policy is not supplied by this record.
- Neighbor size, similarity, initial granularity, bisection balance and merge parameters influence results.
  The initial partition and later merges may cross desired cluster boundaries; the procedure does not
  establish semantic recovery.
- The product-score and threshold-based schemes have different selection and stopping behavior; they are
  documented alternatives within the original named procedure, not assumed identical algorithms.
- Internal cuts are computed by graph-partitioning software; describing the min-cut objective does not
  certify a global exact cut solver. Runtime depends in part on neighbor search and data dimension. No
  implementation or reported benchmark was reproduced.
