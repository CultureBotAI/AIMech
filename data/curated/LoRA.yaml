id: AIMech:LoRA
name: Low-rank adaptation
definition: A parameter-efficient adaptation method that freezes pretrained weights and learns additive
  low-rank matrix updates.
concept_kind: algorithm
identity_notes: A method for adapting model parameters, not a pretrained checkpoint or the LoRA software
  package. AIO:TransferLearning is a broader task description and does not specify this weight-update
  factorization.
definition_evidence:
- source_id: original-paper
  locator: Section 4.1, equation 3, PDF/printed p. 4
  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: An adapted linear transformation uses W0x + BAx, with W0 fixed and the lower-rank factors
    A and B trainable.
  evidence:
  - source_id: original-paper
    locator: Section 4.1, equation 3, PDF/printed p. 4
    relation: supports
- claim_id: merged-adapter-batching
  kind: limitation
  statement: Merging a task-specific BA update into the base weights complicates batching inputs requiring
    different adapters in one forward pass.
  evidence:
  - source_id: original-paper
    locator: Section 4.2, Practical Benefits and Limitations, PDF/printed p. 5
    relation: supports
