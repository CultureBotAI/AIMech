aio_mappings:
- target: AIO:MathematicalFunction
  relation: broad_match
  rationale: For fixed parameters the unit defines a scalar mathematical function of its input; the pinned
    mathematical-function class is broader.
- target: AIO:ReLUFunction
  relation: related_match
  rationale: Scalar ReLU is a particular two-piece construction, whereas general maxout has learned affine
    pieces and may be negative. This is a special-case relationship, not equivalence or a claim that ReLU
    is broader.
limitations:
- Maxout here denotes the learned affine-maximum unit. A complete architecture, a channel-grouping layer
  and spatial max pooling are not interchangeable identities.
- A fixed finite set of pieces has finite representational capacity. Almost-everywhere differentiability
  does not guarantee nonzero derivatives or use of every piece.
- The followup evaluates rectifier networks and informs the averaging boundary; its numerical outcomes
  are not attributed to maxout networks. Weight and bias scaling must follow the chosen dropout convention.
- Two complete primary papers were visually inspected, including figures and references. Constructed examples
  only; no author implementation, training or empirical replication. The cited separate piecewise-linear
  representation proof was not independently inspected.
