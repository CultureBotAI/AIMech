name: Beam search using limited discrepancy backtracking
definition: A memory-bounded beam search that explores heuristic-ranked slices using increasing limited-discrepancy
  budgets and removes backtracked slices so that alternative beams can be examined.
concept_kind: algorithm
identity_notes: BULB denotes Furcy and Koenig’s Beam search Using Limited discrepancy Backtracking. A
  discrepancy selects a nonpreferred successor slice; it is not a numerical heuristic error or an action
  cost. The inspected algorithm is presented for unit-cost state-space search and seeks a path, not necessarily
  a shortest path. No normalized identity match was found across the 442 AIO and 130 prior native records;
  ignored-inclusive text hits in the main checkout were prior discovery leads, source citations and search-order
  contrasts, plus incidental lightbulb and wet-bulb dependency substrings, not existing concept records.
limitations:
- Completeness is conditional on enough memory to store a beam along a solution path. A fixed memory budget
  and arbitrary beam width do not guarantee solving every instance.
- The method need not return a shortest path. An anytime extension is discussed separately from the base
  procedure.
- The O(B*d) storage statement concerns retained slices along the active search; temporary successor generation,
  heuristic data and other implementation storage need separate accounting.
- The active hash table prevents cycles involving retained states and some transpositions, but it is not
  a permanent global closed list of every state ever visited.
- 'Figure 4 has an apparent depth-label inconsistency: nextSlice labels a successor with depth although
  the caller next probes depth+1. The prose describes a next-level slice. This record follows that described
  mechanism and does not certify the literal pseudocode as executable.'
id: AIMech:BULB
aliases:
- BULB
