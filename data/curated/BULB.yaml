  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Keep one slice of up to the beam width at each active depth. Rank eligible successors by
    heuristic value and divide them into slices. A probe follows the preferred slice without spending
    discrepancy allowance and explores nonpreferred slices with a reduced allowance, removing slices from
    the active hash table on backtracking. Outer iterations increase the allowance; a full table causes
    the current probe to stop and backtrack.
  evidence:
  - source_id: method-source
    locator: Sections 2–3.3, PDF pp. 2–4; Figure 4 on PDF p. 3
    relation: supports
- claim_id: memory-qualified-completeness
  kind: limitation
  statement: The paper qualifies completeness by the memory needed to retain a beam to a solution and
    describes the base method as approximate in solution length. Its conclusion discusses conversion to
    an anytime algorithm as an extension, not an automatic guarantee of the presented stopping rule.
  evidence:
  - source_id: conditional-properties
    locator: Section 3.4, PDF p. 4; Conclusion, PDF p. 7
    relation: supports
- claim_id: depth-label-inconsistency
  kind: limitation
  statement: Visual inspection identifies an apparent inconsistency between the recursive depth increment
    and the depth label assigned to generated successors. The next-level interpretation comes from the
    adjacent prose; no corrected reference implementation or author erratum was established by this review.
  evidence:
  - source_id: pseudocode-caveat
    locator: 'Figure 4, PDF p. 3: recursive depth increment and nextSlice depth assignment; Section 3.3
      prose, PDF p. 4'
    relation: supports
