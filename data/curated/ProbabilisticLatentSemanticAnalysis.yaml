claims:
- claim_id: method
  kind: mechanism
  statement: For finite document indices d, vocabulary items w and K latent classes z, choose normalized
    nonnegative distributions pi_z, a_z(d) and b_z(w), and define p(d,w)=sum_z pi_z*a_z(d)*b_z(w). Given
    z, d and w are independent. Equivalently, for p(d)>0, p(w|d)=sum_z theta_dz*b_z(w), where theta_dz=pi_z*a_z(d)/p(d).
    Fit observed counts n(d,w) with sum_dw n(d,w)*log p(d,w). An exact EM E-step computes r_dwz=pi_z*a_z(d)*b_z(w)/p(d,w);
    M-steps normalize the corresponding count-weighted responsibilities over words, documents and classes.
    Each conditional document word distribution is an arithmetic convex combination of topic probabilities.
    In the original fold-in procedure, keep b_z(w) fixed and fit a new query or document’s mixture weights.
    This introduces new fitted weights rather than integrating over a population prior as in LDA.
