name: Probabilistic latent semantic analysis
definition: A latent-class model of document–word or other dyadic co-occurrences that represents their
  joint probability as a mixture of conditionally independent distributions over the two observed entities.
concept_kind: model_family
identity_notes: PLSA denotes the aspect-model probability construction, also called the probabilistic
  latent semantic indexing model in the LDA comparison. A document can mix several aspects because each
  co-occurrence has its own latent class. It differs from an SVD reconstruction, a single class for a
  whole document, and LDA’s prior over document-specific topic weights. The alias PLSI identifies this
  underlying model, not every cosine, interpolation or model-averaging choice in a retrieval pipeline.
  Tempered EM is one fitting procedure rather than part of the model’s defining probability law. Compared
  all 442 pinned AIO labels and scoped synonyms and 418 preceding native IDs, names and aliases. The initial
  normalized LDA hit denotes LinearDiscriminantAnalysis, whose full Gaussian-classifier record was read;
  the bare LDA alias is omitted from the new topic-model record. No normalized identity match remains
  for the final candidate names/aliases. Final full-checkout fixed-string searches, including ignored
  and hidden files in both worktree and main, return two lines each; both unique contents are existing
  frontier references. An additional broad LDA search returned 289 worktree and 237 main lines before
  the preceding batch merged; all 84 distinct contents were read, covering the existing classifier, topic-context
  references, unrelated programming mnemonics and namespace abbreviations. All 188 semantic label/synonym
  hits were read. Nineteen exact annotated AIO CLASS nodes and outgoing edges were inspected (18 verified
  unchanged from prior reading, Biclustering read here), along with their generated records and 16 native
  neighbors. The 35 contextual YAMLs were read or byte-verified after documented full reading. Absence
  is bounded to this snapshot, maintained corpus and inspected semantic neighborhood.
limitations:
- The base construction is a normalized distribution of indexed co-occurrences. It has no LDA-style population
  prior on new document mixtures; fold-in estimation is possible, so this is not a claim that unseen documents
  cannot be represented at all.
- Training-document mixture parameters grow with the corpus. Maximum-likelihood or tempered fitting can
  overfit; local EM optimization, initialization and rank selection do not guarantee global optimality
  or unique factors. Permuting topic labels preserves the law, and linearly dependent topic distributions
  can yield nonunique mixture weights.
- The bag-of-words representation omits token order and explicit within-topic word interactions. It is
  not a raw-count Poisson MRF, a canonical-parameter admixture, or a neural density estimator. Topic labels
  and selected high-probability words are interpretations, not verified semantic or causal categories.
- Positive-count cells require positive modeled mass. Responsibility updates need nonzero denominators;
  unused components require a specified handling convention. Zero-count terms use the standard zero-contribution
  convention.
- Historical retrieval experiments use particular corpora, ranks, held-out tempering and cosine interpolation.
  No universal retrieval advantage, exact new-document marginal likelihood or author implementation is
  certified.
