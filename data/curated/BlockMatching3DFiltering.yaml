identity_notes: At the actual merged cohort338 base 09cd8b8d5cc8b6d4098c149cbdea12e797468811, the 2026-10-15
  current collection covers all 751 native and 442 AIO record identity fields and byte hashes, plus all
  909 main and 393 nested frontier objects mechanically. Four ignored-inclusive, hidden-inclusive, case-insensitive
  whole-word searches retain 13654 occurrences in 1679 exact content groups. Root read all 29 non-domain
  candidate-bearing contents and all 19 selected current frontier objects; 1145 NLM-domain-only groups
  were mechanically separated, not manually read as complete bodies. The 22 NLM catalog/namespace groups
  refer to the National Library of Medicine, while seven candidate-bearing groups preserve existing source
  leads or research notes. Same-team context audit reads 35 maintained-record matching strings, 13 current
  definitions and matching windows in 55 long groups among the 505 context-only groups; its scope is attributed,
  not exhaustive manual reading. No candidate normalized identity collision was found. This is bounded
  current identity clearance, not ontology-wide semantic exhaustion. The two-stage BM3D procedure groups
  similar image patches, applies collaborative transform-domain shrinkage and aggregates overlaps; the
  pilot supplies second-stage grouping and Wiener gains while original noisy groups are filtered. It is
  distinct from NLM pixel averaging, learned NonLocalBlock and fixed-prior IteratedWienerFilter. BM3D
  remains an accepted alias. Resolve existing owner239 using Dabov et al. 2007; the 2018 neural-network
  URL remains discovery provenance. Retain the individually assessed fifteen-target AIO no-match decision;
  no exact, broad or related target is forced.
