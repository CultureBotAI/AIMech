name: Submodular pick LIME
definition: A method selecting a budgeted set of local LIME explanations by greedily increasing weighted
  coverage of explanatory features.
concept_kind: algorithm
identity_notes: SP-LIME selects representative local explanations; it is separate from fitting each LIME
  surrogate and does not produce a globally faithful surrogate model.
limitations:
- Coverage depends on the candidate instances, local explanations, interpretable features and importance
  weights.
- The greedy coverage objective is not a guarantee of overall model trustworthiness; cross-image feature
  comparability requires additional choices.
aliases:
- SP-LIME
