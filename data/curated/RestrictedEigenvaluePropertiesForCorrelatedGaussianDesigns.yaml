id: AIMech:RestrictedEigenvaluePropertiesForCorrelatedGaussianDesigns
name: Restricted Eigenvalue Properties for Correlated Gaussian Designs
concept_kind: mathematical_method
aliases:
- Restricted Eigenvalue Properties for Correlated Gaussian Designs (Raskutti, Wainwright, & Yu 2010)
- Gordon-Slepian Restricted Eigenvalue Lower Bound for Correlated Gaussian Random Designs
- Raskutti-Wainwright-Yu Restricted Eigenvalue Transfer Theorem for Correlated Gaussian Ensembles
- Restricted Nullspace and Restricted Eigenvalue Guarantee for Correlated Gaussian Designs
definition: 'Restricted Eigenvalue Properties for Correlated Gaussian Designs is a high-dimensional random
  matrix and sparse recovery analysis framework introduced by Raskutti, Wainwright, and Yu (2010, Journal
  of Machine Learning Research 11:2241-2259) that establishes high-probability uniform lower bounds on
  the empirical quadratic form ||X v||_2 / sqrt(n) of n x p design matrices X with independent rows X_i
  ~ N(0, Sigma) having arbitrary correlation structure Sigma. Using Gordon''s Gaussian comparison inequality
  on the doubly-indexed min-max Gaussian process Y_{u, v} = u^T W Sigma^{1/2} v over S^{n-1} x V(r) (Equations
  5-6, Lemma 1), Lipschitz concentration of Gaussian measure in Frobenius norm (Lemma 2), and geometric
  peeling over dyadic l_1 shells (Section 4.4, Lemma 3), Theorem 1 (Equation 3) proves that with probability
  at least 1 - c'' exp(-c n), ||X v||_2 / sqrt(n) >= (1/4) ||Sigma^{1/2} v||_2 - 9 rho(Sigma) sqrt((log
  p)/n) ||v||_1 simultaneously for all v in R^p, where rho^2(Sigma) := max_{j=1,...,p} Sigma_{jj}. Consequently,
  Corollary 1 (Equation 4) proves that whenever the population covariance Sigma satisfies the Restricted
  Eigenvalue (RE) condition of order k with parameters (alpha, gamma) on the cone C(S; alpha) := {theta
  in R^p : ||theta_{S^c}||_1 <= alpha ||theta_S||_1} (|S| = k) and n > c'''' rho^2(Sigma) (1 + alpha)^2
  k (log p) / gamma^2, the sample covariance matrix Sigma_hat = X^T X / n satisfies the RE condition of
  order k with parameters (alpha, gamma / 8) (and hence the Restricted Nullspace property when alpha >=
  1) with probability at least 1 - c'' exp(-c n), improving entrywise l_infinity coherence bounds from
  n = Omega(k^2 log p) to the minimax-optimal linear scaling n = Omega(k log p) while encompassing strongly
  correlated Toeplitz, spiked-identity, and rank-degenerate covariance structures that violate the Restricted
  Isometry Property (RIP).'
identity_notes: 'Resolved against all 442 pinned AIO records and 625 maintained AIMech records. Distinct
  from AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework (Negahban, Ravikumar,
  Wainwright, & Yu 2012, Statistical Science 27(4):538-557, arXiv:1010.2731v1/v3, which formulates general
  decomposable regularizer M-estimation under Restricted Strong Convexity and invokes Raskutti, Wainwright,
  & Yu 2010 in Proposition 1 for linear regression), from AIMech:MinimaxEstimationRatesForHighDimensionalLinearRegressionOverLqBalls
  (Raskutti, Wainwright, & Yu 2011, IEEE Trans. Inf. Theory 57(10):6976-6994, arXiv:0910.2042v1, which
  derives information-theoretic minimax lower and upper bounds over l_q-balls), from AIMech:RandomizedSketchesOfConvexProgramsWithTangentConeGaussianWidthGuarantees
  (Pilanci & Wainwright 2015, IEEE Trans. Inf. Theory 61(9):5096-5115, which studies randomized sketches
  S X of convex programs over tangent cones of fixed datasets), and from AIO:LassoRegression and AIO:LinearRegression:
  Raskutti, Wainwright, & Yu (2010, JMLR 11:2241-2259) establish the Gordon-Slepian min-max comparison,
  Frobenius-Lipschitz concentration, and dyadic l_1 peeling proof of Theorem 1 (Equation 3) and Corollary
  1 (Equation 4), and prove via Examples 1-3 that Toeplitz, spiked-identity, and rank-degenerate population
  covariance matrices satisfy RE at sample size n = Omega(k log p) even when RIP and full-rank positive
  definiteness fail.'
