limitations:
- 'Gaussian Design Distribution Requirement: Theorem 1 and Corollary 1 rely on the rows of X being drawn
  from a multivariate Gaussian distribution N(0, Sigma) so that Gordon''s Gaussian comparison inequality
  (Lemma 1) and Gaussian concentration of Lipschitz functions (Lemma 2) apply directly; as noted in Section
  5 (p. 2255), extending sharp n = Omega(k log p) Restricted Eigenvalue guarantees to general non-Gaussian
  or heavy-tailed correlated designs requires different small-ball or multiplier-process arguments.'
- 'Conservative Universal Constants: The prefactor 1/4 in Theorem 1 (and gamma / 8 in Corollary 1) together
  with the l_1 penalty multiplier 9 rho(Sigma) are chosen for analytical transparency of the three-step
  Gordon comparison and dyadic peeling proof rather than sharp numerical constants.'
- 'Primary-Source Typographical Notes in Raskutti, Wainwright, & Yu (2010, JMLR 11:2241-2259): Verified
  four self-correcting typographical details during full-text inspection: (1) Section 2.1 (p. 2244, Equation
  2) prints the basis pursuit objective as beta_hat in arg min_{beta_hat in R^p} ||beta||_1 with a hat
  on the minimization variable beta_hat under arg min; (2) Section 3.1 (p. 2247, Remark (a)) prints the
  Restricted Nullspace condition as C(S, 1) cap (X) = {0}, omitting the word null before (X) (i.e., C(S;
  1) cap null(X) = {0}); (3) Section 4.2 (p. 2251, bottom display) writes E[M(r, X)] = 1 + E[sup_{v in
  V(r)} inf_{u in S^{n-1}} Y_{u, v}] <= 1 + E[sup_{v in V(r)} inf_{u in S^{n-1}} Z_{u, v}], omitting the
  factor 1/sqrt(n) before both expectations (which is present in Equation 5 on p. 2251 and restored on
  p. 2253 when dividing by sqrt(n)); and (4) Section 4.4 (pp. 2254-2255) vs. Appendix A (p. 2256, Lemma
  3) defines the bad event T on p. 2254 with f(v; X) >= g(||v||_1) whereas Lemma 3 (p. 2256) bounds E
  := {exists v in A s.t. f(v; X) >= 2 g(h(v))} with factor 2 g(h(v)) = 3 t(||v||_1), which matches the
  top of p. 2255 writing 1 - ||X v||_2 / sqrt(n) <= 3 t(||v||_1) = 3/4 + 9 rho(Sigma) sqrt((log p)/n)
  ||v||_1 and Theorem 1''s constants 1 - 3/4 = 1/4 and 9.'
- All 19 pages of Raskutti, Wainwright, & Yu (2010, JMLR 11:2241-2259) were read. Constructed numerical
  checks in research/discovery/restricted-eigenvalue-properties-correlated-gaussian-designs-boundaries.py
  verify (1) the Gordon-Slepian variance identity and inequality in Equation (6) (max identity error 2.66e-15,
  min variance gap 0.4526 >= 0, exact equality when v = v') and the Corollary 1 RE transfer constant >=
  gamma / 8; (2) Example 2 spiked-identity submatrix condition number growth [13.0, 49.0, 193.0, 769.0]
  violating RIP while satisfying RE with gamma = 0.5, and Example 3 rank-degenerate covariance (n = 14
  < p = 28) having a non-trivial nullspace vector outside C(S; 1) (ratio 12.68 > 1) while maintaining
  positive gain >= 0.615 on C(S; 1); and (3) Lemma 2 Frobenius-Lipschitz scaling <= 1/sqrt(n) and Lemma
  3 dyadic peeling geometric series bound (0.047036 <= 0.048168).
