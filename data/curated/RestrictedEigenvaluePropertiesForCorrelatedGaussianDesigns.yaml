claims:
- claim_id: uniform-empirical-l2-lower-bound-and-restricted-eigenvalue-transfer-theorem
  kind: mechanism
  statement: 'For any n x p Gaussian random design matrix X with independent rows X_i ~ N(0, Sigma) and
    maximal diagonal variance rho^2(Sigma) := max_{j=1,...,p} Sigma_{jj}, Theorem 1 (Section 3.1, p. 2246,
    Equation 3) proves that there exist universal positive constants c, c'' such that with probability
    at least 1 - c'' exp(-c n), ||X v||_2 / sqrt(n) >= (1/4) ||Sigma^{1/2} v||_2 - 9 rho(Sigma) sqrt((log
    p)/n) ||v||_1 simultaneously for all v in R^p. Consequently, Corollary 1 (p. 2246, Equation 4) shows
    that if the population covariance Sigma satisfies the Restricted Eigenvalue (RE) condition of order
    k with parameters (alpha, gamma) on the cone C(S; alpha) := {theta in R^p : ||theta_{S^c}||_1 <= alpha
    ||theta_S||_1} (meaning ||Sigma^{1/2} theta||_2 >= gamma ||theta||_2 for all theta in cup_{|S|=k}
    C(S; alpha)) and the sample size satisfies n > c'''' rho^2(Sigma) (1 + alpha)^2 k (log p) / gamma^2,
    then because ||theta||_1 <= (1 + alpha) sqrt(k) ||theta||_2 on C(S; alpha), the empirical design X
    satisfies ||X theta||_2 / sqrt(n) >= (gamma / 8) ||theta||_2 for all theta in cup_{|S|=k} C(S; alpha)
    (the RE condition of order k with parameters (alpha, gamma / 8), and the Restricted Nullspace property
    C(S; 1) cap null(X) = {0} when alpha >= 1) with probability at least 1 - c'' exp(-c n), reducing the
    sample complexity required by entrywise l_infinity bounds ||X^T X / n - Sigma||_infty = O(sqrt((log
    p)/n)) (Section 3.2, pp. 2247-2248) from n = Omega(k^2 log p) to the minimax-optimal linear scaling
    n = Omega(k log p).'
  evidence:
  - source_id: raskutti2010-re-gaussian-pdf
    locator: Sections 2.1-2.2 and 3.1-3.2, pp. 2243-2248, Equations (1)-(4), Theorem 1, Corollary 1
    relation: supports
- claim_id: separation-from-restricted-isometry-and-rank-degenerate-covariance-structures
  kind: scope
  statement: 'Section 3.3 (pp. 2248-2250, Examples 1-3) proves that the Restricted Eigenvalue condition
    on Sigma is strictly weaker than both the Restricted Isometry Property (RIP) and full-rank positive
    definiteness: (1) for Toeplitz covariance matrices Sigma_{ij} = a^{|i-j|} with a in [0, 1) (Example
    1) and spiked identity covariance matrices Sigma = (1 - a) I_{p x p} + a 1 1^T with a in (0, 1) (Example
    2), every k x k principal submatrix Sigma_{SS} of the spiked covariance has minimum eigenvalue lambda_min(Sigma_{SS})
    = 1 - a and maximum eigenvalue lambda_max(Sigma_{SS}) = 1 + a(k - 1), so the empirical submatrix condition
    number lambda_max(Sigma_hat_{SS}) / lambda_min(Sigma_hat_{SS}) >= (1/4) (1 + a(k - 1)) / (1 - a) diverges
    as k -> infinity (violating the RIP bounded-condition-number requirement with high probability), whereas
    Sigma has bounded minimum eigenvalue 1 - a > 0 and rho^2(Sigma) = 1 so Corollary 1 guarantees RE of
    order k for n = Omega(k log p); and (2) Example 3 (p. 2250) shows that setting Sigma_deg = Sigma_hat
    = X^T X / n for an initial sample of size n < p yields a population covariance matrix with p - n zero
    eigenvalues (a (p - n)-dimensional nullspace) that nonetheless satisfies the RE condition of order
    k, so resampled designs X_tilde_i ~ N(0, Sigma_deg) satisfy RE of order k for n = Omega(k log p).'
  evidence:
  - source_id: raskutti2010-re-gaussian-pdf
    locator: Section 3.3, pp. 2248-2250, Examples 1, 2, and 3
    relation: supports
- claim_id: gordon-slepian-minmax-comparison-lipschitz-concentration-and-dyadic-l1-peeling
  kind: mechanism
  statement: 'Writing X = W Sigma^{1/2} with standard normal W in R^{n x p} and rescaling by ||Sigma^{1/2}
    v||_2 = 1 onto V(r) := {v in R^p : ||Sigma^{1/2} v||_2 = 1, ||v||_1 <= r}, Section 4.1 (p. 2251, Equation
    5) expresses M(r, X) := 1 - inf_{v in V(r)} ||X v||_2 / sqrt(n) = 1 + (1/sqrt(n)) sup_{v in V(r)}
    inf_{u in S^{n-1}} u^T W Sigma^{1/2} v and controls it in three steps: (1) Lemma 1 (Section 4.2, pp.
    2251-2253) compares Y_{u, v} = u^T W v_tilde (v_tilde = Sigma^{1/2} v in S^{p-1}) against the separable
    Gaussian process Z_{u, v} = g^T u + h^T Sigma^{1/2} v by verifying Equation (6), E[(Y_{u, v} - Y_{u'',
    v''})^2] = |||u v_tilde^T - u'' (v_tilde'')^T|||_F^2 = ||u - u''||_2^2 + ||v_tilde - v_tilde''||_2^2
    - 2(1 - u^T u'')(1 - v_tilde^T v_tilde'') <= E[(Z_{u, v} - Z_{u'', v''})^2] with equality when v =
    v'', yielding via Gordon''s inequality E[M(r, X)] <= t(r) := 1/4 + 3 rho(Sigma) sqrt((log p)/n) r
    for n >= 19; (2) Lemma 2 (Section 4.3, pp. 2253-2254) proves that h(W) := M(r, X) - 1 is (1/sqrt(n))-Lipschitz
    in W under the Frobenius norm because |u^T (W - W'') v_tilde| <= |||u v_tilde^T|||_F |||W - W''|||_F
    = |||W - W''|||_F, giving P[M(r, X) >= (3/2) t(r)] <= 2 exp(-n t^2(r) / 8); and (3) Section 4.4 and
    Lemma 3 (pp. 2254-2256, Appendix A) partition V = {v : ||Sigma^{1/2} v||_2 = 1} into dyadic shells
    A_m = {v in A : 2^{m-1} mu <= g(h(v)) <= 2^m mu} with g(r) = (3/2) t(r) >= mu = 3/8 and sum the tail
    probabilities sum_{m=1}^infty 2 exp(-c n 2^{2m} mu^2) <= 2 exp(-4 c n mu^2) / (1 - exp(-4 c n mu^2))
    to establish Theorem 1 uniformly over all r > 0.'
  evidence:
  - source_id: raskutti2010-re-gaussian-pdf
    locator: Sections 4.1-4.4 and Appendices A-B, pp. 2250-2257, Equations (5)-(6), Lemmas 1, 2, and 3
    relation: supports
