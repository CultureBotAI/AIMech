aio_no_match:
  search_scope: Compared all 442 pinned AIO and 691 preceding native identities, including full ignored-
    and hidden-inclusive checkout searches. Semantic context covers 154 AIO and 535 native definitions;
    seven new AIO and eleven new native rows were read and earlier rows verified unchanged. Ten complete
    AIO contexts and six full native neighbors were assessed.
  rationale: No examined AIO target denotes this static progressive shortest-path fraction algorithm.
    Statistical learning theory supplies a concentration bound, but shared statistical, sampling and graph
    language does not identify the procedure with clustering, a language model, data preparation or a
    bias concept.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: A centrality vector assigns scores without grouping vertices into clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Absence of labels does not turn structural score computation into clustering.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity is a particular progressive shortest-path fraction estimator and stopping
      procedure, not solely an input-output function.
  - target: AIO:DataPreparation
    rejection_reason: Computing network prominence is the defined result; incidental downstream feature
      use does not establish a preprocessing identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The static graph sampling and concentration method has no language-model objective
      or training mechanism.
  - target: AIO:RankingBias
    rejection_reason: A structural graph score is not the belief that high-ranked information is necessarily
      relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Uniform pair sampling and its confidence bound define an algorithm, not selection
      or sampling bias.
  - target: AIO:RepresentationBias
    rejection_reason: A graph centrality computation is not subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: Neither labels nor a deep neural network are acquired or fitted.
  - target: AIO:DataDredgingBias
    rejection_reason: Correcting repeated-stage error probabilities does not make the algorithm itself
      a bias concept.
limitations:
- The record uses the revised fixed-schedule static algorithm. The earlier adaptive schedule, dynamic
  updates and relative top-k procedure are separate cases, not covered by the maintained guarantee.
- Unreachable pairs remain in the population with zero contribution. Endpoint exclusion does not change
  the denominator from n(n-1) to (n-1)(n-2).
- Strictly positive weighted edges or unweighted graphs are used here. Zero-length cycles, numerical distance
  ties and inexact path counts require separate conventions despite the source’s broader nonnegative-weight
  wording.
- The confidence guarantee requires independent uniform pair draws, a schedule fixed independently of
  them, stage-wise failure allocation and conservative evaluation of the Rademacher bound. It does not
  imply termination for every increasing schedule or unbiased stopped estimates.
- The author manuscript retains placeholder journal metadata; no publisher-layout byte equivalence is
  asserted. Earlier arXiv text was read for version comparison. No author software, raw experiments or
  historical benchmark was executed.
- Some source performance prose and derived percentages need separate qualification; no numerical speedup
  or general error-scaling result is imported. DRAFT remains after author self-review.
