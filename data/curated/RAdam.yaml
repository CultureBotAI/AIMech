id: AIMech:RAdam
name: Rectified Adam
definition: An Adam-family optimizer that rectifies its adaptive update using a time-dependent estimate
  of the effective history of the second-moment statistic.
concept_kind: algorithm
identity_notes: RAdam's rectification and early-step branch distinguish it from unmodified Adam and from
  weight-decay decoupling alone.
definition_evidence:
- source_id: pytorch-docs
  locator: RAdam.__doc__, algorithm lines 176–218 and weight-decay note lines 220–225
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The cited implementation computes a rectification term when its effective-history statistic
    exceeds five; before that threshold it takes a bias-corrected first-moment step without adaptive second-moment
    scaling.
  evidence:
  - source_id: pytorch-docs
    locator: RAdam.__doc__, algorithm lines 176–218 and weight-decay note lines 220–225
    relation: supports
