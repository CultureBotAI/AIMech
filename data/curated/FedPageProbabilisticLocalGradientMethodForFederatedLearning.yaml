claims:
- claim_id: fedpage-probabilistic-full-client-reset-and-local-recursive-gradient-step-mechanism
  kind: mechanism
  statement: At round r (Algorithm 1), FedPAGE samples q ~ Bernoulli(p_r) with p_0 = 1 and p_r = S/N; when q = 1, all N clients compute minibatch gradients nabla_{I_1} f_i(x^r) to reset g^r = (1/N) sum_{i=1}^N nabla_{I_1} f_i(x^r); when q = 0, S sampled clients receive (x^r, x^{r-1}, g^{r-1}), form the initial local recursive gradient g_{i,0}^r = nabla_{I_2} f_i(x^r) - nabla_{I_2} f_i(x^{r-1}) + g^{r-1}, execute K - 1 local steps y_{i,k+1}^r = y_{i,k}^r - eta_l g_{i,k}^r with g_{i,k}^r = nabla_{I_3} f_i(y_{i,k}^r) - nabla_{I_3} f_i(y_{i,k-1}^r) + g_{i,k-1}^r, and return Delta y_i^r = x^r - y_{i,K}^r for server aggregation g^r = (1 / (K eta_l S)) sum_{i in S^r} Delta y_i^r.
  evidence:
  - source_id: r563-primary-pdf
    locator: Section 3 Algorithm 1 pp. 6-7 & Appendix D Lemmas D.1-D.2 pp. 23-25
    relation: supports
- claim_id: fedpage-nonconvex-and-convex-communication-complexity-improvement-scope
  kind: scope
  statement: Under L-smoothness (Assumption 2.1) and bounded local variance sigma^2 (Assumption 2.3), with p = S/N and Expected communicated clients per round p N + (1 - p) S < 2 S, FedPAGE achieves E[||nabla f(x)||_2] <= eps in R = O(L(sqrt(N) + S) / (S eps^2)) communication rounds in the nonconvex setting (Theorem 4.2) and E[f(x) - f^*] <= eps in R = O(N^{3/4} L / (S eps)) rounds for S <= sqrt(N) in the convex setting (Theorem 5.2), without requiring bounded inter-client gradient dissimilarity.
  evidence:
  - source_id: r563-primary-pdf
    locator: Table 1 p. 2, Section 4.2 Theorem 4.2 p. 8 & Section 5.2 Theorem 5.2 p. 10
    relation: supports
  - source_id: r563-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: fedpage-occasional-full-client-broadcast-and-triple-vector-downlink-limitation
  kind: limitation
  statement: Requires occasional full-client synchronization rounds (with probability p_r = S/N) to reset the global gradient estimator g^r, and during partial-participation rounds (q = 0) the server broadcasts three d-dimensional vectors (x^r, x^{r-1}, g^{r-1}) to each selected client.
  evidence:
  - source_id: r563-primary-pdf
    locator: Section 3 Algorithm 1 Lines 3-4 & Line 11 p. 6
    relation: supports
- claim_id: fedpage-nonconvex-robust-linear-regression-and-regularized-logistic-regression-application
  kind: application
  statement: Applied to federated nonconvex robust linear regression and logistic regression with nonconvex regularizers across thousands of partitioned LIBSVM client datasets.
  evidence:
  - source_id: r563-primary-pdf
    locator: Section 6 Numerical Experiments pp. 11-14
    relation: supports
