name: Hungry Hungry Hippos layer
definition: A sequence layer that combines projected queries, keys and values with shift and diagonal
  state-space models, using multiplicative interactions to associate and retrieve sequence information.
concept_kind: layer
identity_notes: H3 is the layer defined in Fu and colleagues' Algorithm 1. Networks interleave H3 with
  MLP layers; the paper's hybrid H3-attention model additionally uses attention layers. Those complete
  networks and the FlashConv execution algorithm are not identical to this component.
limitations:
- The scalar-head elementwise formula is a special case; general heads use outer products and matrix-vector
  contractions.
- The complete H3 language model and hybrid attention architecture require additional blocks beyond this
  layer. No universal language-model performance or recall guarantee is asserted.
aliases:
