claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Project the input to Q, K and V; pass K through a shift state-space model. Within each head,
    feed the outer product of shifted keys and values through a diagonal state-space model, multiply by
    Q, then concatenate heads and apply an output projection.
  evidence:
  - source_id: original-paper
    locator: Section 3.2, Algorithm 1 and the surrounding H3 Layer paragraph, PDF/printed p. 5
