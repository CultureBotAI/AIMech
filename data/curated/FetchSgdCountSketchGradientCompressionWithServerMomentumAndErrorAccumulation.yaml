claims:
- claim_id: r409-sketch-linearity-server-momentum-and-error-feedback-commutativity
  kind: mechanism
  statement: 'Because the Count Sketch compression operator S: R^d -> R^{r x c} is linear (S(g_1 + g_2) = S(g_1) + S(g_2)) and bias is introduced only at the server during Top-k(U(S_e^t)) extraction, carrying out momentum S_u^t = rho S_u^{t-1} + S^t and error accumulation S_e^{t+1} = eta S_u^t + S_e^t - S(Delta^t) inside server-side sketches is mathematically equivalent to maintaining momentum and error feedback before compression across all clients while keeping clients completely stateless and invariant to partitioning N samples across 1 client or N single-sample clients.'
  evidence:
  - source_id: r409-primary-pdf
    locator: Section 3.2 Algorithm (Algorithm 1), Section 5 Evaluation, and Appendix B.1 (Virtual Sequence Proof), pp. 4-5, 7, 21-22
    relation: supports
- claim_id: r409-nonconvex-smooth-convergence-under-heavy-hitter-and-sliding-window-regimes
  kind: mechanism
  statement: For L-smooth nonconvex objectives with bounded stochastic gradient norm G on non-IID client distributions, Theorem 1 proves that under Scenario 1 (tau-heavy hitters in q^t = eta(rho u^{t-1} + g^{t-1}) + e^{t-1}, Assumption 1) FetchSGD with step size eta = (1 - rho)/(2 L sqrt(T)) and O(log(dT/delta)/tau)-byte sketches achieves min_{t in [T]} E||nabla f(w^t)||^2 <= (4 L (f(w^0) - f^*) + G^2)/sqrt(T) + 2(1+tau)^2 G^2 / ((1-tau) tau^2 T), while Theorem 2 proves O(T^{-1/3}) convergence under Scenario 2 ((I, tau)-sliding heavy gradients, Definition 1 and Assumption 2) using sliding-window error accumulation sketches of size Theta(log(dT/delta)/tau^2).
  evidence:
  - source_id: r409-primary-pdf
    locator: Section 4.1-4.2 (Assumption 1, Theorem 1, Definition 1, Assumption 2, Theorem 2) & Appendix B.1-B.2, pp. 5-7, 21-27
    relation: supports
- claim_id: r409-heavy-hitter-assumption-and-unsketch-variance-limitation
  kind: limitation
  statement: Dimension-free O(T^{-1/2}) and O(T^{-1/3}) convergence rates in Theorems 1 and 2 rely on the existence of (tau, l_2^2)-heavy hitters along the optimization trajectory (without heavy hitters, worst-case unsketching variance scales as Theta(d), yielding O(d / sqrt(T)) in Appendix B.3), and practical deployment uses momentum factor masking and zeroing of extracted coordinates in S_e^t to stabilize ReLU networks.
  evidence:
  - source_id: r409-primary-pdf
    locator: Section 4.1-4.2, Section 5 Evaluation, and Appendix B.3, pp. 5-7, 27
    relation: supports
- claim_id: r409-non-iid-cifar10-cifar100-femnist-and-personachat-gpt2-application
  kind: application
  statement: Evaluated on extreme non-IID single-class-per-client CIFAR-10 (10,000 clients, ResNet9) and CIFAR-100 (50,000 clients, 1 image/client), FEMNIST (3,500 clients, 40M-parameter ResNet101), and one-shot PersonaChat language modeling (17,568 clients, 124M-parameter GPT2-small), achieving 3.9x-7.3x overall compression and 10x-100x upload compression while outperforming FedAvg and local Top-k.
  evidence:
  - source_id: r409-primary-pdf
    locator: Section 5.1-5.3 (Figures 3-5) & Appendix A (Table 1, Figures 6-9), pp. 7-9, 14-20
    relation: supports
