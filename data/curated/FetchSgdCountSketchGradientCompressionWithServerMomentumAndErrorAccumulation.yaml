id: AIMech:FetchSgdCountSketchGradientCompressionWithServerMomentumAndErrorAccumulation
name: FetchSGD (Count-Sketch Gradient Compression with Server Momentum and Error Accumulation)
concept_kind: algorithm
review_status: DRAFT
definition: A stateless communication-efficient federated optimization algorithm (FetchSGD, Algorithm 1) in which each participating client i in [W] computes a local stochastic gradient g_i^t in R^d and uploads a linear Count Sketch S_i^t = S(g_i^t) (Algorithm 2); by exploiting the exact linearity S(g_1 + g_2) = S(g_1) + S(g_2), the central aggregator combines client sketches S^t = (1/W) sum_{i=1}^W S(g_i^t) = S((1/W) sum_i g_i^t) and maintains both heavy-ball momentum S_u^t = rho S_u^{t-1} + S^t and biased-compression error accumulation S_e^t = eta S_u^t + S_e^{t-1} directly inside server-side Count Sketches before extracting a k-sparse model update Delta^t = Top-k(U(S_e^t)) via median unsketching U, updating S_e^{t+1} = S_e^t - S(Delta^t) and w^{t+1} = w^t - Delta^t.
identity_notes: Distinct from client-stateful error-feedback compression methods such as Sparsified SGD with Error Memory (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression), PowerSGD (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback), and EF21 (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization), which apply a non-linear biased compressor on each client and therefore must store per-client error accumulation vectors that are never re-introduced when federated clients participate only once, and from multi-step local update methods such as FedAvg and MIME (AIMech:MimeMimickingCentralizedStochasticAlgorithmsInFederatedLearning, which transmit uncompressed full-dimensional parameter vectors).
aliases:
- FetchSGD
- FedSketchedSGD
- Communication-Efficient Federated Learning with Count Sketching
- Stateless Sketched SGD with Server-Side Momentum and Error Feedback
