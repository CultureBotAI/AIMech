name: Parametric UMAP
definition: A parametric dimensionality-reduction algorithm that trains a neural mapping from input points
  to embedding coordinates using sampled attractive and repulsive losses derived from a UMAP neighborhood
  graph.
concept_kind: algorithm
identity_notes: The core distinction from AIMech:UMAP is optimization of a shared neural input-to-coordinate
  mapping, rather than one free coordinate vector per training point. A parametric t-SNE objective and
  a generic autoencoder are different constructions; the UMAP/autoencoder and supervised hybrids are optional
  variants. All 442 pinned AIO labels/scoped synonyms and 114 preceding native identities were compared,
  together with hidden/ignored-inclusive searches of both checkouts; source citations and pending frontier
  mentions were distinguished from existing concept identities.
limitations:
- The graph metric, neighborhood structure, network capacity, optimization and sampling affect the learned
  representation; a reusable mapping does not ensure reliable extrapolation to new distributions.
- Minibatch negative sampling changes the effective loss relative to the nominal all-pairs fuzzy cross-entropy.
  The analyzed parametric loss has batch-size and degree-product factors, distinct from the nonparametric
  symmetrized loss.
- A classifier regularized by graph structure requires a graph relevant to its labels; the paper does
  not establish universal semi-supervised improvement.
- The specified paper and sampling analysis were inspected; current software, all supplementary results
  and universal topology preservation were not certified.
