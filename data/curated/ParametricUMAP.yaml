claims:
- claim_id: method-scope
  kind: mechanism
  statement: Construct locally scaled UMAP graph affinities, then optimize neural-network weights so the
    network outputs serve as embedding coordinates. Positive graph edges and sampled negative pairs supply
    a minibatch binary cross-entropy-style training loss; the learned mapping can embed new inputs by
    a forward pass. Reconstruction, classification or global-distance regularizers are optional extensions
    rather than necessary parts of the base algorithm.
  evidence:
  - source_id: original-paper
    locator: Sections 2.1–2.4, PDF pp. 4–10; Section 4 and Figure 2, pp. 11–14; discussion, pp. 36–37
    relation: supports
- claim_id: parametric-sampling-scope
  kind: limitation
  statement: The sampling analysis distinguishes Parametric UMAP’s within-batch negative samples and gives
    a batch-size-dependent effective objective with degree-product repulsive weights. This differs from
    its nonparametric symmetrized objective and from nominal all-pairs cross-entropy; the result concerns
    the analyzed procedure, not every implementation.
  evidence:
  - source_id: sampling-analysis
    locator: Section 5, footnote 3 and Theorem 5.1, equation (13), PDF pp. 6–7
    relation: supports
