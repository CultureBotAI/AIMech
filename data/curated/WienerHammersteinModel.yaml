limitations:
- This maintained record selects real-valued scalar discrete-time deterministic cascades. Noise models,
  multivariable, parallel, feedback, time-varying and neural variants require explicit additional scope.
  Finite examples use causal FIR blocks and zero prehistory; general linear blocks may have infinite impulse-response
  memory or specified nonzero initial states.
- A memoryless function is a single-valued map on its stated domain. Forward composition does not in itself
  require inverse functions, monotonicity, Gaussian inputs, polynomial parameterization or a GP prior.
  Any use of inverse-coordinate predictors must state the valid domain and stronger assumptions.
- Representation, minimality, internal identifiability, stable simulation and estimation accuracy are
  separate questions. Internal gain normalizations alone do not settle all ambiguities; overlapping special
  cases do not establish family equivalence.
- The source’s phase-coupled-multisine initialization method has separate excitation, odd-term, steady-state
  and noise assumptions. Its higher-degree combinatorial formulas need a separate audit; they are not
  used as model-definition evidence. The reported electronics experiment was not replicated.
- All pages of the cited version were visually read. No model was trained, no empirical result was replicated
  and no paid provider was run. This record remains DRAFT; author self-review is not independent scientific
  approval.
