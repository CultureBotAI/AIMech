claims:
- claim_id: linear-static-linear
  kind: mechanism
  statement: For zero-state linear operators R and S and a memoryless function f, the response is y=S(f(Ru)).
    The first block mixes input history, f acts pointwise on the resulting internal signal, and S filters
    that nonlinear signal. With causal finite filters R=(1,2), S=(1,3), inputs (1,2,-1), zero prehistory
    and f(v)=v², the first three outputs are (1,19,57). This is an exact curator example of the specified
    composition, not a fitted benchmark.
  evidence:
  - source_id: tiels-schoukens2015
    locator: Section 2.2, Figure 1 and Equations 3–4, PDF/printed pp. 2–3; curator calculation in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: two-block-special-cases
  kind: scope
  statement: An identity input block R gives the Hammerstein order, and an identity output block S gives
    the Wiener order. If f is the identity, the cascade reduces to the linear composition SR. The families
    therefore overlap through degenerate or linear special cases; their different ordered structures are
    not interchangeable names, and a three-block representation need not be minimal.
  evidence:
  - source_id: tiels-schoukens2015
    locator: Introduction and Figure 1, PDF/printed pp. 1–2; direct algebraic specializations of Equation
      3 on p. 3, checked in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: internal-gain-ambiguity
  kind: limitation
  statement: For nonzero a and b in the zero-state deterministic formulation, replacing R by aR, f(v)
    by b*f(v/a), and S by S/b leaves the external response unchanged on the corresponding signal domains.
    The finite example with a=2,b=3 still gives (1,19,57). External data alone therefore cannot fix these
    two internal scale choices without normalization or other information; this is not a complete classification
    of all ambiguities.
  evidence:
  - source_id: tiels-schoukens2015
    locator: Direct curator reparameterization of Section 2.2, Equation 3, PDF/printed p. 3; exact check
      in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: linear-approximation-boundary
  kind: limitation
  statement: 'The source’s Gaussian best-linear approximation exposes a scalar multiple of the product
    RS rather than uniquely assigning dynamics to R and S. An informative nonzero gain is an additional
    requirement: non-evenness of f alone does not suffice. For iid standard Gaussian input, R=(1,2) gives
    internal variance 5, and f(q)=q³-15q has zero first input/output correlations despite being a nonconstant
    odd function. The curator counterexample qualifies the source text after Theorem 1. Estimating or
    separating blocks is a distinct identification problem.'
  evidence:
  - source_id: tiels-schoukens2015
    locator: Section 3.2, Equations 8–10 and text after Theorem 1, PDF/printed p. 4; Section 4.3, p. 7;
      curator exact Gaussian moments in research/discovery/three-block-cascade-boundaries.py
    relation: supports
