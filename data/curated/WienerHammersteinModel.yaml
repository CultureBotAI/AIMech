id: AIMech:WienerHammersteinModel
name: Wiener–Hammerstein model
concept_kind: model_family
definition: A real-valued, single-input single-output, discrete-time deterministic dynamical model family
  formed by a causal linear time-invariant block, a memoryless static nonlinear function, and a second
  causal linear time-invariant block in that order.
identity_notes: 'Compared all 442 pinned AIO IDs, labels and scoped synonyms and 536 native IDs, names
  and aliases against both cascade names, punctuation variants, expanded descriptions and IDs: no normalized
  identity match. Ignored- and hidden-inclusive searches of the accessible recovery and previous worktrees
  returned 746 and zero lines. All 22 distinct matched texts were inspected; they concern existing two-block
  records and their review/report paths, or the pending combined-cascade cohort. Original Documents files
  were inaccessible during the initial search. After access returned, a full ignored- and hidden-inclusive
  search there at 2026-10-12T14:36:27Z found no candidate-name, expanded-description or reference hits;
  all 11 user files matched their preserved hashes. Read all 41 semantic AIO rows, 65 native name/definition
  neighbors, nine complete annotated CLASS nodes with incident edges, nine generated records and eight
  complete native neighbors. The existing Wiener/Hammerstein families have two blocks, their correlation
  records specify estimators, and NARX/NARMAX specify observed-history recurrences. A linear state-space
  layer is a neural component; GPR conditions a process prior. None supplies the proposed three-block
  identity. AIO GLM specifies a statistical link/variance structure, ARDL lag structure and ETS smoothing/trend/seasonality;
  neural layer/network classes require different scope. Shared linear special cases do not make the families
  equivalent. This is bounded to the inspected pin and accessible records.'
