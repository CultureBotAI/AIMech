    locator: Section 1.2.2, Equations (1.3)-(1.5), pages 3-4; Section 2.7-2.8, Theorems 8-9 and Equations (2.22)-(2.27), pages 14-16; Section 8, Definition 5 and Lemma 10, pages 25-27
    relation: supports
