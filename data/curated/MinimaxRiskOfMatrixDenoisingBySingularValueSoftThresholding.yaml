claims:
- claim_id: sure-quasiconvex-decomposition-anderson-sv-monotonicity-and-least-favorable-matrix-at-infinity
  kind: mechanism
  statement: 'For Y = X_0 + n^{-1/2} Z with Z_{i,j} i.i.d. N(0, 1), the SVST risk R(hat_X_lambda, X_0) = (1/m) E||hat_X_lambda(Y) - X_0||_F^2 = (1/m) E[SURE_lambda(Y)] decomposes via Stein''s Unbiased Risk Estimate (Lemma 3, p. 20) into the expectation of a finite sum of bounded, orthogonally invariant, quasi-convex functions on M_{m x n}. By Anderson''s (1955) theorem on integrals of symmetric unimodal densities over symmetric convex level sets (Definitions 1-3, Lemmas 1-2, pp. 18-19), X_0 |-> R(hat_X_lambda, X_0) is singular-value-monotone nondecreasing (A <=_{SV} B => R(hat_X_lambda, A) <= R(hat_X_lambda, B), Lemma 4, Eq. 4.2, p. 20), so the worst-case risk over rank(X_0) <= r is achieved as the r nonzero singular values tend to +infty: sup_{rank(X_0) <= r} R(hat_X_lambda, X_0) = lim_{mu -> infty} R(hat_X_lambda, mu C) = M_n(lambda / sqrt(1 - r/n); r, m, alpha) = r/m + r/n - r^2/(mn) + (1 - r/n)[(r/m) Lambda^2 + alpha E_{W_{m-r,n-r}}(1/m) sum_{i=1}^{m-r} (sigma_i - Lambda)_+^2] with alpha = 1 for Mat_{m,n} and alpha = 1/2 for Sym_n (Theorems 1-2, Eqs. 2.1-2.4, pp. 7-8; Lemmas 5-6, p. 22).'
  evidence:
  - source_id: dg2014-svst-minimax-pdf
    locator: Section 2.1-2.2, Theorems 1-2 and Equations (2.1)-(2.4), pages 7-8; Section 4, Definitions 1-3, Lemmas 1-4, and Equations (4.1)-(4.3), pages 18-21; Section 5, Lemmas 5-6, page 22
    relation: supports
- claim_id: proportional-rank-marcenko-pastur-minimax-optimality-and-trigonometric-quarter-circle-curve
  kind: mechanism
  statement: In the proportional-rank asymptotic limit r_n / m_n -> rho in (0, 1) and m_n / n -> beta in (0, 1] (with tilde_rho = beta rho for Mat and tilde_rho = rho for Sym, and compressed noise aspect ratio gamma = (tilde_rho - rho tilde_rho)/(rho - rho tilde_rho)), M_n(Lambda; r_{m_n}, m_n, alpha) converges uniformly on compact intervals to M(Lambda; rho, tilde_rho, alpha) = rho + tilde_rho - rho tilde_rho + (1 - tilde_rho)[rho Lambda^2 + alpha(1 - rho)(P_gamma(Lambda^2; 1) - 2 Lambda P_gamma(Lambda^2; 1/2) + Lambda^2 P_gamma(Lambda^2; 0))], where P_gamma(x; k) = int_x^{gamma_+} t^k p_gamma(t) dt are the complementary incomplete moments of the Marcenko-Pastur density (Eqs. 2.7-2.9, Lemmas 7-8, pp. 9-10, 22-24). Minimizing over Lambda in [0, sqrt(gamma_+)] yields the unique root Lambda_*(rho, beta, alpha) of the optimality equation P_gamma(Lambda^2; 1/2) - Lambda P_gamma(Lambda^2; 0) = Lambda rho / (alpha(1 - rho)) with lim_{rho->0} Lambda_* = 1 + sqrt(beta) and lim_{rho->1} Lambda_* = 0, and minimax threshold n^{-1/2} lambda_*(m, n, r | Mat) -> sqrt(1 - beta rho) Lambda_*(rho, beta, 1) (Theorems 3, 4, 6, Eqs. 2.10-2.15, pp. 10-13; Lemma 9, pp. 24-25). In the square case beta = 1, the quarter-circle moments Q_0, Q_1, Q_2 (Eqs. 2.17-2.19) yield Lambda_*(rho, rho, alpha) = 2 sin(theta_alpha(rho)) where theta_alpha(rho) in [0, pi/2] solves theta + cot(theta)(1 - (1/3) cos^2(theta)) = pi(1 + alpha^{-1} rho - rho) / (2(1 - rho)), giving an exact trigonometric parameterization (rho(theta), M(theta)) of the asymptotic minimax MSE curve (Theorems 5 and 7, Eqs. 2.16-2.21, pp. 11-14).
