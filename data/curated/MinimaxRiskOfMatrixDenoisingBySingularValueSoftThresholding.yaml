- claim_id: low-rank-slope-and-factor-of-three-global-minimax-suboptimality-bound
  kind: scope
  statement: 'As rho -> 0, the proportional-rank SVST minimax risk satisfies M(rho, beta | Mat) = 2(1 + sqrt(beta) + beta) rho + o(rho), so M(rho, 1 | Mat) = 6 rho + o(rho) and M(rho | Sym) = 6 rho + o(rho) (Theorem 8, Eq. 2.22, p. 14). Over all measurable matrix denoisers hat_X: M_{m x n} -> M_{m x n}, restricting to permutation- and sign-invariant singular-value denoisers D (Definition 5, Lemma 10, pp. 25-26) establishes the finite-sample global minimax lower bound M^*_{m,n}(r | X) >= r/m + r/n - (r^2 + r)/(mn) and asymptotic lower bound M^*(rho, beta | X) >= M^-(rho, beta) := rho + beta rho - beta rho^2, proving that SVST is never worse than a factor 2(1 + sqrt(beta)/(1 + beta)) <= 3 times the global minimax risk across all (rho, beta) in (0, 1) x (0, 1], with equality as rho -> 0 and beta = 1 (Theorem 9, Eqs. 2.23-2.27, pp. 15-16, 26-27).'
  evidence:
