id: AIMech:MinimaxRiskOfMatrixDenoisingBySingularValueSoftThresholding
name: Minimax Risk and Least-Favorable Subspace Characterization of Matrix Denoising by Singular Value Soft Thresholding
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Minimax Risk of Singular Value Soft Thresholding (SVST)
- Donoho-Gavish Proportional-Rank SVST Minimax AMSE M(rho, beta)
- Least-Favorable Rank-r Matrix at Infinity for SVST
- Trigonometric Quarter-Circle Parameterization of SVST Minimax Risk
definition: A high-dimensional statistical decision-theoretic methodology introduced by Donoho and Gavish (2014, The Annals of Statistics 42(6):2413-2440, arXiv:1304.2085v4) for characterizing the finite-sample and proportional-rank asymptotic minimax risk of Singular Value Soft Thresholding (SVST) hat_X_lambda(Y) = arg min_X {(1/2)||Y - X||_F^2 + lambda ||X||_*} = sum_{i=1}^m (y_i - lambda)_+ u_i v_i' under white Gaussian matrix noise Y = X_0 + n^{-1/2} Z. Representing the MSE risk R(hat_X_lambda, X_0) = (1/m) E||hat_X_lambda(Y) - X_0||_F^2 = (1/m) E[SURE_lambda(Y)] as the expectation of a sum of bounded orthogonally invariant quasi-convex functions and applying Anderson's unimodal integral theorem, the method proves that R(hat_X_lambda, X_0) is singular-value-monotone nondecreasing (Lemmas 1-4), so the worst-case risk over rank(X_0) <= r is achieved in the limit as the r nonzero singular values tend to infinity, decoupling the signal subspace from an (m-r) x (n-r) pure-noise subspace (Theorems 1-2). In the proportional-rank asymptotic regime r_n / m_n -> rho in (0, 1) and m_n / n -> beta in (0, 1], minimizing the Marcenko-Pastur incomplete-moment risk functional M(Lambda; rho, tilde_rho, alpha) yields the unique optimal rescaled threshold Lambda_*(rho, beta, alpha) solving P_gamma(Lambda^2; 1/2) - Lambda P_gamma(Lambda^2; 0) = Lambda rho / (alpha(1 - rho)), a closed-form trigonometric parameterization Lambda_* = 2 sin(theta_alpha(rho)) in the square case beta = 1, the low-rank slope 2(1 + sqrt(beta) + beta) rho, and a universal factor-of-3 worst-case suboptimality bound relative to the global minimax risk over all measurable matrix denoisers (Theorems 3-9).
identity_notes: Checked against all 442 pinned AIO concepts and 648 maintained AIMech concepts. Distinct from AIMech:LossSpecificOptimalSingularValueShrinkageForMatrixDenoising (Gavish & Donoho 2017) and AIMech:OptimalSingularValueHardThresholdingAtFourOverSqrtThree (Gavish & Donoho 2014), which analyze fixed low-rank r << m_n, n spiked matrix asymptotics via Benaych-Georges-Nadakuditi singular vector rotation cosines c(x), tilde_c(x), whereas Donoho & Gavish (2014) analyze the proportional-rank regime r_n / m_n -> rho in (0, 1) where the signal subspace has macroscopic dimension and the residual (m-r) x (n-r) noise block follows a compressed Marcenko-Pastur law with effective aspect ratio gamma = (tilde_rho - rho tilde_rho)/(rho - rho tilde_rho); and distinct from AIMech:SingularValueThresholdingForMatrixCompletion (Cai, Candes, & Shen 2010), which introduces iterative Uzawa singular value soft thresholding for incomplete matrix completion without SURE singular-value monotonicity or minimax risk curves.
