- target: AIO:TrainingStrategy
  relation: related_match
  rationale: NovoGrad directly controls machine-learning parameter training, the central context named
    by TrainingStrategy. The pinned target has a preprocessing genus and learning-task examples, so contextual
    relatedness does not assert optimizer equivalence, subclass membership or that the algorithm is preprocessing.
limitations:
- The v3 PDF title differs from the arXiv landing title. Its Equation 5, initialization and loop indexing
  contain inconsistencies or omissions; the identity follows Section 3 Equation 6 with explicit convention
  boundaries.
- Basic SGD-style momentum, the averaged variant and direct shrinkage alternatives differ unless rate
  and state conventions are reconciled. The later TensorFlow Addons dense implementation invokes a rate-inside-velocity
  kernel.
- The theoretical fresh-gradient normalization bound is not a bound on full momentum, decay or parameter-relative
  displacement and does not establish convergence or generalization.
- The approximate half-memory comparison concerns mathematical moment arrays with few blocks and equal
  precision, excluding parameters, gradients, activations and other training storage. Implementation variants
  can allocate other state.
- The complete seven-page v3 preprint, complete pinned TensorFlow Addons optimizer file and the cited
  TensorFlow API section were inspected. The library revision postdates the paper; dependency helpers,
  compiled kernels and runtime were not executed or fully audited, and sparse behavior is not claimed
  equivalent to dense updates.
- Experiments use differing configurations and include warm-up; source table/rate differences remain in
  the discovery notes. No benchmark values, universal superiority, independent proof certification or
  training result are imported.
