id: AIMech:NovoGrad
name: NovoGrad
concept_kind: algorithm
review_status: DRAFT
definition: A layer-wise adaptive stochastic gradient optimization algorithm that computes a single scalar second-moment exponential moving average per network layer l from the squared Euclidean norm of the layer gradient, v_t^l = beta_2 v_{t-1}^l + (1 - beta_2) ||g_t^l||_2^2 (initialized directly at v_1^l = ||g_1^l||_2^2), normalizes the current layer gradient by sqrt(v_t^l) + epsilon and adds decoupled weight decay d * w_t^l prior to first-moment accumulation m_t^l = beta_1 m_{t-1}^l + (g_t^l / (sqrt(v_t^l) + epsilon) + d * w_t^l), and updates layer weights via w_{t+1}^l = w_t^l - alpha_t m_t^l.
identity_notes: Distinct from Adam and AdamW (which maintain a full per-parameter second-moment tensor v_t of dimension p^l per layer and normalize the first moment after accumulation), from LaProp (AIMech:LaProp, which normalizes coordinates before momentum using per-coordinate second moments), and from LARS/LAMB (AIMech:LARSAndLAMBLayerWiseAdaptiveRateScaling, which rescale updates by the weight-to-update trust ratio ||w^l||_2 / ||u^l||_2). NovoGrad requires only one scalar v_t^l per layer, reducing optimizer state memory from 2P to P + L floats.
aliases:
- Layer-Wise Adaptive Moments for Deep Network Training
- Stochastic Gradient Methods with Layer-wise Adaptive Moments
- Layer-Wise Normalized Adam with Decoupled Weight Decay
