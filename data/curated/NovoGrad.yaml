claims:
- claim_id: novograd-layerwise-second-moment-and-pre-momentum-normalization
  kind: mechanism
  statement: For each layer l with stochastic gradient g_t^l at iteration t, NovoGrad updates a single scalar second moment v_t^l = beta_2 v_{t-1}^l + (1 - beta_2) ||g_t^l||_2^2 initialized at v_1^l = ||g_1^l||_2^2, normalizes the gradient and adds decoupled weight decay d * w_t^l inside the momentum recurrence m_t^l = beta_1 m_{t-1}^l + (g_t^l / (sqrt(v_t^l) + epsilon) + d * w_t^l), and updates weights via w_{t+1}^l = w_t^l - alpha_t m_t^l, reducing to Stochastic Normalized Gradient Descent when beta_2 = 0 and d = 0.
  evidence:
  - source_id: r611-primary-pdf
    locator: Section 1 (Algorithm), Equations 1-3, p. 1-2
    relation: supports
  - source_id: r611-metadata-cr
    locator: Bibliographic metadata for Ginsburg et al. 2019
    relation: supports
- claim_id: novograd-memory-footprint-and-outlier-gradient-robustness
  kind: scope
  statement: Because NovoGrad stores only one scalar second-moment estimate v_t^l per layer instead of one float per parameter, it cuts auxiliary optimizer state memory in half compared to Adam/AdamW (from 2P to P + L floats for a model with P parameters and L layers) while bounding any single-step pre-momentum gradient contribution in Euclidean norm by at most 1 / sqrt(1 - beta_2).
  evidence:
  - source_id: r611-primary-pdf
    locator: Abstract and Section 1, p. 1-2
    relation: supports
  - source_id: r611-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: novograd-large-batch-vision-speech-and-translation-applications
  kind: application
  statement: NovoGrad is applied to large-batch and mixed-precision training of ResNet-50 on ImageNet (reaching 76.94% top-1 accuracy at batch size 1024 and 76.36% at batch size 32K), Jasper speech recognition on LibriSpeech (11.9% WER on test-other, outperforming SGD by 1.3% relative), Transformer neural machine translation on WMT 2014 English-to-German (28.3 BLEU without warmup), and OpenAI GPT-2 language modeling on WikiText-103.
  evidence:
  - source_id: r611-primary-pdf
    locator: Section 2 (Experiments), Tables 1-4 and Figures 1-2, p. 2-4
    relation: supports
- claim_id: novograd-within-layer-isotropic-scaling-limitation
  kind: limitation
  statement: Because NovoGrad normalizes all parameters within a layer l by a single shared scalar sqrt(v_t^l), it does not adaptively rescale individual coordinates within the same layer that have heterogeneous curvature or sparse feature frequencies, and its effective update scale depends on how parameters are partitioned into layers or parameter groups.
  evidence:
  - source_id: r611-primary-pdf
    locator: Section 1 (Algorithm), Equations 1-2, p. 1-2
    relation: supports
