id: AIMech:TiedLoRA
name: Tied-LoRA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning algorithm that enhances low-rank adaptation by sharing low-rank projection matrices across transformer layers while pairing them with diagonal scaling vectors and selectively freezing or updating subsets of the projection matrices and scaling vectors.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which assigns independent untied projection matrices B_i and A_i to every adapted layer without diagonal scaling vectors), from VeRA (AIMech:VeRA, which freezes untied randomly initialized matrices B_i and A_i and trains only scaling vectors, a special case termed LoRA_vbuA in the Tied-LoRA taxonomy), and from PRoLoRA (AIMech:PRoLoRA, which tiles intra-layer chunks via roll-based partial rotation and block-shared submatrices rather than tying full low-rank projection matrices across transformer layers with selective training of {v, B, u, A}). Formulated by Renduchintala, Konuk, and Kuchaiev (NAACL 2024, arXiv:2311.09578).
aliases:
- Tied Low-Rank Adaptation
- Weight-Tied Selective Low-Rank Adaptation
- Tied-LoRA Weight-Tied PEFT
