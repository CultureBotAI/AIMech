claims:
- claim_id: tiedlora-unified-scaling-projection-formulation
  kind: mechanism
  statement: Tied-LoRA parameterizes the adaptation update of the i-th pretrained weight matrix W_0^i in R^{d x k} as W^i = W_0^i + (alpha / r) Diagonal(v_i) B_i Diagonal(u_i) A_i, where A_i in R^{r x k} and B_i in R^{d x r} are low-rank projection matrices of rank r << min(d, k), u_i in R^r and v_i in R^d are scaling vectors, and each group of parameters in {v, B, u, A} can be independently tied across all L layers or kept untied and independently set as trainable or frozen.
  evidence:
  - source_id: r677-primary-pdf
    locator: Section 2 Methodology, Eq. 2 and Table 1, p. 2-3
    relation: supports
- claim_id: tiedlora-tl6-parameter-count-scaling
  kind: mechanism
  statement: In the Tied-LoRA TL6 configuration (Tied-LoRA_vbua), the low-rank projection matrices A and B are shared across all L transformer layers and trained jointly with untied layer-specific scaling vectors v_i and u_i, reducing the total number of trainable parameters across L adapted linear layers of square dimension d from 2 L d r in standard LoRA to 2 d r + L d + L r, so that cross-layer rank increases scale independently of the layer count L for the shared projection matrices.
  evidence:
  - source_id: r677-primary-pdf
    locator: Section 2.1 Configuration Parameter Counts, Table 1, p. 2-3
    relation: supports
- claim_id: tiedlora-multi-task-language-adaptation
  kind: application
  statement: Tied-LoRA is applied to parameter-efficient fine-tuning of large language models across extractive question answering, summarization, natural language inference, commonsense reasoning, arithmetic reasoning, and translation tasks, where the TL6 configuration retains comparable accuracy to standard LoRA across low and high ranks while requiring approximately 12.5% to 13% of the trainable parameters.
  evidence:
  - source_id: r677-primary-pdf
    locator: Section 3 Experiments & Section 4 Results and Analysis, Table 2, p. 3-6
    relation: supports
- claim_id: tiedlora-dimension-matching-and-frozen-projection-degradation
  kind: limitation
  statement: Cross-layer weight tying in Tied-LoRA requires adapted weight matrices within a tied group to share identical input and output dimensions, and configurations that freeze randomly initialized tied projection matrices while training only scaling vectors degrade sharply on complex generation tasks such as arithmetic reasoning (GSM8k) and machine translation.
  evidence:
  - source_id: r677-primary-pdf
    locator: Section 4 Results and Analysis & Limitations, p. 4-6
    relation: supports
