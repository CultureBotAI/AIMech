- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Projected Hotelling T^2 divide-and-combine confidence regions yield valid simultaneous confidence
    intervals across arbitrary linear contrasts b^T theta and correlated sub-studies without post-hoc
    selection inflation (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the multiple-testing bias
    rather than the multivariate confidence-region methodology.
limitations:
- 'Convexity of each sub-study''s composed Half-Cauchy–Hotelling T^2 objective requires degrees of freedom
  k_j >= d_j + 1 (so sample size n >= d_j + 2 when k_j = n - 1), and boundedness (compactness) of the
  combined confidence region C_alpha(theta) requires that the union of row spaces {Row(P_j) : w_j > 0}
  spans R^d (Theorem 3.2 and Lemma D.4).'
- When sub-study estimates exhibit strong heterogeneity or model misspecification, min_{theta in R^d}
  T_HCCT(theta) can exceed F_{HC,w}^(-1)(1 - alpha), yielding an empty initial confidence region R^(0);
  resolving emptiness via Proposition 3.3 sequential outlier downweighting requires specifying a weight-decay
  schedule gamma in (0, 1) and can widen the resulting region toward the remaining studies (Section 3.3,
  lines 401–427).
- Because the critical value F_{HC,w}^(-1)(1 - alpha) ~ 2 / (pi * alpha) is calibrated for asymptotic
  tail validity as alpha -> 0+ under arbitrary dependence, coverage at moderate nominal levels (such as
  1 - alpha = 0.90 or 0.95) and larger subspace counts m can be slightly conservative or require small-m
  / finite-alpha adjustments when sub-studies are strongly positively correlated (Section 4.2–4.3).
- All 2,200 lines of Liu, Meng, & Pillai (2025, arXiv:2501.01065v1) were read. Constructed numerical checks
  in research/discovery/projected-hotelling-t2-divide-and-combine-boundaries.py verify Section 2.2 Example
  1 (1 convex HCCT interval vs. 3 disconnected CCT intervals), Theorem 3.2 / Section 4 small-n (d = 6,
  n = 4 < d + 1) divide-and-combine convexity and simultaneous contrast intervals, and Section 3.3 Inequality
  (3.7) and Proposition 3.3 stopping-time outlier downweighting.
