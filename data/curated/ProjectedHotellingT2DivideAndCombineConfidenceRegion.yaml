id: AIMech:ProjectedHotellingT2DivideAndCombineConfidenceRegion
name: Projected Hotelling T-squared divide-and-combine confidence region
aliases:
- Half-Cauchy Divide-and-Combine Multivariate Confidence Region
- Projected Hotelling's T^2 Half-Cauchy Confidence Region
- Divide-and-Combine Subspace Hotelling T-Squared Confidence Set
- HCCT Divide-and-Combine Confidence Region
concept_kind: mathematical_method
definition: A multivariate statistical inference and meta-analysis method (Liu, Meng, & Pillai 2025) that
  constructs a guaranteed convex, bounded joint confidence region C_alpha(theta) in R^d for a d-dimensional
  parameter vector theta by projecting or partitioning study estimators into m lower-dimensional linear
  subspaces P_j * theta in R^{d_j} (where P_j in R^{d_j x d} has full row rank d_j <= d), calibrating
  each sub-study's quadratic pivot ||Sigma_hat_j^(-1/2)(xi_hat_j - P_j * theta)||^2 against a finite-sample
  Hotelling's T^2(d_j, k_j) distribution (or chi^2_{d_j} when k_j = infinity) with CDF F^(j), and inverting
  the simplex-weighted Half-Cauchy combination statistic T_HCCT(theta) = sum_{j=1}^m w_j tan((pi / 2)
  * F^(j)(||Sigma_hat_j^(-1/2)(xi_hat_j - P_j * theta)||^2)) <= F_{HC,w}^(-1)(1 - alpha) across arbitrarily
  dependent sub-studies without estimating or inverting the global d x d covariance matrix.
identity_notes: No normalized identity match for Projected Hotelling T-Squared Divide-and-Combine Confidence
  Region across all 442 pinned AIO records and 569 maintained IDs, names, aliases and scoped synonyms.
  Fixed-string searches across data, sources, research, history, and reviews returned only cross-references
  in AIMech:HalfCauchyCombinationTest and predecessor discovery reports. Distinct from AIMech:HalfCauchyCombinationTest,
  which defines the scalar heavy-tailed p-value combination test T_HC(p; w) = sum_{j=1}^m w_j tan((pi/2)(1
  - p_j)) for global null hypothesis testing rather than the multivariate subspace-projection Hotelling
  T^2(d_j, k_j) test-inversion geometry (Theorem 3.2 convexity under k_j >= d_j + 1, n < d high-dimensional
  divide-and-combine mean inference in Section 4, network meta-analysis contrast synthesis in Section
  5, and Proposition 3.3 adaptive stopping-time conflict downweighting). Distinct from AIMech:CauchyCombinationTest,
  whose two-sided test inversion diverges to -infinity at each sub-study estimate and fragments into up
  to m + 1 disconnected confidence regions (Example 1, Section 2.2).
