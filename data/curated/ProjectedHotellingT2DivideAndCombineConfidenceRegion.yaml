claims:
- claim_id: hotelling-t2-half-cauchy-composition-convexity-and-compactness
  kind: mechanism
  statement: 'For m sub-studies estimating P_j * theta in R^{d_j} via xi_hat_j and positive-definite covariance
    estimator Sigma_hat_j with k_j degrees of freedom, calibrating ||Sigma_hat_j^(-1/2)(xi_hat_j - P_j
    * theta)||^2 via Hotelling''s T^2(d_j, k_j) ~ (d_j k_j / (k_j + 1 - d_j)) F(d_j, k_j + 1 - d_j) (or
    chi^2_{d_j} for k_j = infinity) with CDF F^(j) and composing with the Half-Cauchy quantile function
    F_HC^(-1)(u) = tan(pi * u / 2) yields a strictly convex objective T_HCCT(theta) on R^d whenever k_j
    >= d_j + 1 for all 1 <= d_j <= d (Theorem 3.2 and Lemma D.3, proven via curvature dominance T_{F_HC}(u)
    >= T_{H_{d_j,k_j}}(u) >= T_{H_{d_j}}(u)), whereas inverting the standard two-sided Cauchy combination
    test produces up to m + 1 disconnected confidence intervals because F_C^(-1)(1 - p_j(theta)) -> -infinity
    at theta = theta_hat_j (Section 2.2, Example 1); furthermore, C_alpha(theta) is compact (bounded)
    whenever the row spaces {Row(P_j) : w_j > 0} span R^d (Lemma D.4).'
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 2.2, lines 294–318, Example 1; Section 3.2, lines 384–393, Theorem 3.2; Appendix
      D, lines 2032–2140, Lemmas D.1–D.4 and Proof of Theorem 3.2
    relation: supports
- claim_id: high-dimensional-small-sample-divide-and-combine-without-global-covariance-inversion
  kind: mechanism
  statement: For a single d-dimensional sample X_1, ..., X_n of size n where classical d-dimensional Hotelling's
    T^2 requires n >= d + 1 and full d x d sample covariance inversion, projecting the sample into m virtual
    sub-studies of dimension d_j << d via P_j * X_i requires only n >= max_j d_j + 2 (specifically n >=
    3 for coordinate or 1D random projections d_j = 1 even when d >> n) and remains valid under rank-deficient
    global covariance Sigma provided each projected covariance P_j Sigma P_j^T is positive definite (Section
    4.1–4.3); simultaneous (1 - alpha) confidence intervals for any linear contrast b^T theta are recovered
    without Bonferroni multiplicity penalties by minimizing and maximizing b^T theta over the convex set
    C_alpha(theta) (Section 3.2, lines 394–399).
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 3.2, lines 394–399; Section 4.1–4.3, lines 429–449
    relation: supports
- claim_id: inter-study-conflict-lower-bound-and-stopping-time-downweighting-coverage
  kind: mechanism
  statement: Because T_HCCT(theta) >= 0 on R^d, severe inter-study conflict can cause min_theta T_HCCT(theta)
    > F_{HC,w}^(-1)(1 - alpha) and produce an empty confidence region, diagnostic of study heterogeneity
    or model misspecification and lower-bounded in 1D by min_theta T_HCCT(theta) >= sum_{j=1}^m w_j |theta_hat_j
    - theta_hat_med| / sigma_hat_j (Section 3.3, Inequality 3.7); for any adaptive sequence of simplex
    weights w^(0), w^(1), ... that iteratively downweights the study with the largest summand by a factor
    gamma in (0, 1) until the stopping time tau of the first non-empty region R^(tau), the union confidence
    region R* = union_{k=0}^tau R^(k) preserves valid coverage P(theta_0 in R*) >= 1 - alpha because R^(0)
    subset R* (Section 3.3, Proposition 3.3; Appendix D, lines 2142–2146).
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 3.3, lines 401–427, Inequality 3.7 and Proposition 3.3; Appendix D, lines 2142–2146
    relation: supports
- claim_id: network-meta-analysis-and-exact-harmonic-mean-divide-and-combine-extension
  kind: application
  statement: In network meta-analysis comparing d + 1 treatments across m head-to-head or multi-arm trials
    with design matrix Omega in R^{m x d} whose j-th row omega_j^T encodes the active treatment contrast
    P_j = omega_j^T, Projected Hotelling T^2 divide-and-combine synthesis combines trial-level summary
    statistics (xi_hat_j, sigma_hat_j^2) into joint convex confidence regions and simultaneous pairwise
    treatment contrast intervals without knowing within-trial or cross-trial correlations (Section 5,
    lines 450–466); replacing F_HC^(-1) with the exact harmonic mean p-value calibration 1 / (1 - F^(j))
    similarly yields convex divide-and-combine confidence regions under k_j >= d_j + 1 (Appendix A, Theorem
    A.3, lines 1677–1680).
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 5, lines 450–466; Appendix A, lines 1677–1680, Theorem A.3
    relation: supports
  - source_id: fang-chang-park-tseng2023
    locator: Section 3.2, lines 79–95, Theorem 2 (exact Landau harmonic mean p-value calibration)
    relation: supports
