id: AIMech:RandomizedBlockKrylovMethodsForApproximateSingularValueDecomposition
name: Randomized Block Krylov Iteration for Gap-Independent Approximate SVD and Principal Component Analysis
concept_kind: algorithm
review_status: DRAFT
definition: Randomized Block Krylov Iteration for Gap-Independent Approximate SVD and Principal Component Analysis is a randomized matrix-decomposition algorithm introduced and analyzed by Cameron Musco and Christopher Musco (2015) that computes an approximate rank-k singular value decomposition of any matrix A in R^{n x d} by drawing a random sketching matrix Pi ~ N(0, 1)^{d x k}, explicitly forming the block Krylov subspace K = [A Pi, (A A^T) A Pi, ..., (A A^T)^q A Pi] in R^{n x (q+1)k} for q = Theta(log(d) / sqrt(epsilon)) iterations, orthonormalizing the columns of K into Q in R^{n x (q+1)k}, computing the top k singular vectors U_bar_k of the projected matrix M = Q^T A A^T Q, and returning Z = Q U_bar_k, achieving (1 + epsilon) spectral-norm and Frobenius-norm low-rank approximation error as well as epsilon * sigma_{k+1}^2 per-vector principal component variance accuracy in O(nnz(A) k log(d) / sqrt(epsilon)) gap-independent time.
identity_notes: Distinct from generic PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) and DimensionalityReduction (AIO:DimensionalityReduction), which do not specify randomized block Krylov subspace construction or Chebyshev polynomial spectral tail suppression. Distinct from AIMech:CountSketchInputSparsitySubspaceEmbeddingAndRegression (Round 331) and AIMech:RelativeErrorCURMatrixDecompositionViaSubspaceLeverageSampling (Round 332), which are non-iterative input-sparsity sketching and column-row subset selection methods providing Frobenius-norm low-rank approximation rather than gap-independent O(log(d)/sqrt(epsilon)) spectral-norm and per-vector PCA variance bounds. Also distinct from AIMech:ShiftAndInvertPreconditioningForFasterEigenvectorComputation (Round 354), which accelerates top-1 eigenvector computation under an explicit relative eigengap via SVRG linear system solves on (lambda I - A)^{-1} rather than gap-independent rank-k block Krylov subspace projection.
aliases:
- Musco-Musco Randomized Block Krylov Iteration
- Gap-Independent Randomized Block Lanczos SVD
- Chebyshev-Accelerated Randomized Subspace Iteration for SVD and PCA
