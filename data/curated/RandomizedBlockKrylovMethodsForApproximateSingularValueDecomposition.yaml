claims:
- claim_id: r355-claim-chebyshev-minimizing-polynomial-and-subspace-error-lemma
  kind: mechanism
  statement: For any threshold alpha > 0, gap gamma in (0, 1], and odd degree q >= 1, the rescaled Chebyshev polynomial p(x) = (1 + gamma)*alpha * T_q(x/alpha) / T_q(1 + gamma) contains only odd-degree monomials and satisfies p((1+gamma)alpha) = (1+gamma)alpha, p(x) >= x for all x >= (1+gamma)alpha, and |p(x)| <= alpha / 2^{q*sqrt(gamma) - 1} for all x in [0, alpha] (Lemma 5), which implies that with probability 99/100 over Pi ~ N(0, 1)^{d x k}, the rank-l Frobenius residual error E(Z_l, A) = ||A_l||_F^2 - ||Z_l Z_l^T A||_F^2 of Block Krylov Iteration (Algorithm 2) after q = Theta(log(d/epsilon)/sqrt(epsilon)) iterations satisfies (1) E(Z_l, A) <= (epsilon/2) * sigma_{k+1}^2 for all l <= m (where m is the count of singular values >= (1+epsilon/2)sigma_{k+1}), (2) E(Z_l, A) <= E(Z_{l-1}, A) + 3*epsilon*sigma_{k+1}^2 for all l <= k, and (3) E(Z_l, A) <= (w + 1)*3*epsilon*sigma_{k+1}^2 where w counts singular values in [sigma_k/(1+epsilon/2), sigma_k) (Lemma 9).
  evidence:
  - source_id: r355-primary-pdf
    locator: Section 2.1, Algorithm 2, p. 3; Section 4.4, Lemma 5, p. 8; Section 6.1, Definition 8 and Lemma 9, pp. 10-14; Appendix A, pp. 19-21
    relation: supports
- claim_id: r355-claim-gap-independent-spectral-frobenius-and-per-vector-pca-bounds
  kind: mechanism
  statement: With probability at least 99/100, Randomized Block Krylov Iteration (Algorithm 2) in q = O(log(d)/sqrt(epsilon)) iterations and total runtime O(nnz(A) k log(d)/sqrt(epsilon) + n k^2 log^2(d)/epsilon + k^3 log^3(d)/epsilon^{3/2}) (Theorem 7) returns orthonormal columns Z = [z_1, ..., z_k] simultaneously achieving gap-independent (1 + epsilon) spectral-norm error ||A - Z Z^T A||_2 <= (1 + epsilon)||A - A_k||_2 (Theorem 10), (1 + epsilon) Frobenius-norm error ||A - Z Z^T A||_F <= (1 + epsilon)||A - A_k||_F (Theorem 11), and per-vector principal component variance accuracy |u_i^T A A^T u_i - z_i^T A A^T z_i| <= epsilon * sigma_{k+1}^2 for every i in {1, ..., k} (Theorem 12).
  evidence:
  - source_id: r355-primary-pdf
    locator: Section 2.3, Theorem 1, p. 4; Section 5.2, Theorem 7, pp. 9-10; Section 6.2, Theorems 10, 11, and 12, pp. 14-15; Appendix A, Lemma 15, pp. 21-22
    relation: supports
- claim_id: r355-claim-oversampled-gap-dependent-convergence-with-spectral-decay
  kind: mechanism
  statement: When initialized with an oversampled Gaussian matrix Pi ~ N(0, 1)^{d x p} for any p >= k, Block Krylov Iteration achieves all three approximation guarantees (1), (2), and (3) with probability at least 99/100 in q = Theta(log(d/epsilon) / sqrt(min{1, sigma_k / sigma_{p+1} - 1})) iterations (Theorem 13), replacing dependence on the adjacent singular value gap sigma_k / sigma_{k+1} - 1 with the larger oversampled spectral decay ratio sigma_k / sigma_{p+1} - 1.
  evidence:
  - source_id: r355-primary-pdf
    locator: Section 7, Theorem 13, pp. 15-16
    relation: supports
