name: Sublinear Poisson graphical model
definition: A finite-graph model for unbounded nonnegative integer counts that retains factorial base
  measures while replacing counts in unary and pairwise interactions by a specified bounded, saturating
  sufficient statistic.
concept_kind: model_family
identity_notes: 'SPGM denotes the particular sublinear Poisson graphical construction in Yang et al. Its
  sufficient statistic is linear for small counts, bends quadratically over an interval and is constant
  for large counts. Counts remain unbounded: the model saturates their interaction statistic rather than
  truncating their values. The full conditional is a transformed-statistic count distribution, not an
  ordinary Poisson law, a generic arbitrary sublinear exponential family or a neural activation layer.
  No normalized identity match was found across all 442 pinned AIO labels and all scoped synonyms and
  406 preceding native IDs, names and aliases. Fixed-string full-checkout searches included ignored and
  hidden files in worktree and main, yielding six and six matched lines; all five unique contents were
  read. Hits are the prior publication lead and source URLs, not existing records of these identities.
  All 185 semantic label/synonym hits were read. Forty-five fully annotated exact CLASS nodes and outgoing
  edges were inspected: 43 byte-equivalent to prior inspected nodes and two freshly read. Fifty-nine contextual
  YAMLs comprise 45 generated and 14 native records: 54 byte-verified after prior reading and five freshly
  read. Acronyms were included in normalized identity comparison and the text-search terms. Absence is
  bounded to the pinned snapshot, maintained corpus and inspected semantic neighborhood.'
limitations:
- Finite distinct thresholds with R0<R are required by the stated formula. B is bounded; a general unbounded
  function called sublinear need not inherit the same normalization result.
- Neighbor values above the plateau threshold have identical effects through B. This suppresses sensitivity
  to large-count differences and changes the conditional family; exp(eta_i) is not generally its conditional
  mean.
- The Poisson log-partition upper bound requires nonnegative eta. For negative eta the underlying termwise
  inequality reverses, so unconstrained regression updates cannot blindly use the same bound as a certificate.
- The supplement illustrates its normalization proof with two variables and a threshold construction that
  can fail when a unary coefficient is zero. The direct bounded-statistic domination argument stated here
  supplies the finite-graph justification without dividing by unary parameters.
- Exact conditional normalization still involves an infinite sum or a justified tail calculation. Existence
  for all finite parameters does not establish numerical accuracy, sampler mixing or recovery of the graph
  from finite data.
- The finite graph and the symmetric once-counted edge parameters must be specified. Independently fitted
  node regressions do not automatically agree on a compatible joint parameterization. Model definition,
  numerical estimation and graph selection are distinct.
- The source sketches l1-penalized neighborhood fitting, but explicitly leaves extensions of statistical
  graph-recovery guarantees to future work. A model existence result is not a sparsistency theorem or
  a guarantee that a chosen approximate optimizer finds the intended fit.
- The reported network experiments are contextual evidence, not a universal performance guarantee. The
  processed breast-cancer microRNA data and cited biological associations do not establish causal regulation
  or clinical predictive validity. No author implementation, empirical fit or benchmark was reproduced.
