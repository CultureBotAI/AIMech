claims:
- claim_id: method
  kind: mechanism
  statement: 'Choose finite 0<=R0<R and set B(x)=x for x<=R0; B(x)=-x^2/[2*(R-R0)]+R*x/(R-R0)-R0^2/[2*(R-R0)]
    for R0<x<=R; and B(x)=(R+R0)/2 for x>R. On a finite graph define p(x)=Z^(-1)*exp[sum_i a_i*B(x_i)+sum_(i<j)
    b_ij*B(x_i)*B(x_j)-sum_i log(x_i!)], with symmetric edge parameters. The site conditional is proportional
    to exp[eta_i*B(k)]/k!, where eta_i=a_i+sum_(j!=i) b_ij*B(x_j). Since B is globally bounded, all finite
    unary and edge parameters give a finite positive Z: bound the parameter-dependent factor by a constant
    and sum the product of reciprocal factorials. This argument includes zero unary parameters. The conditional
    log partition D(eta)=log sum_(k>=0) exp[eta*B(k)]/k! satisfies D(eta)<=exp(eta) when eta>=0 because
    B(k)<=k; this bound is not asserted for negative eta. Once both k and k+1 lie on the plateau, the
    successive conditional mass ratio is 1/(k+1).'
