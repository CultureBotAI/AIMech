limitations:
- This local identity denotes the IA3 adaptation parameterization, not the T-Few composite recipe, a T0
  checkpoint, FiLM conditioning or ordinary speaker-specific LHUC.
- One initialization is an identity transformation, not a permanent positivity or magnitude constraint.
  Freezing weights does not eliminate base-network computation or activation memory.
- Fixed-task scale absorption requires the appropriate linear adjacency and layout. It is not a universal
  mixed-task merging or latency guarantee.
- All sixteen main-paper and eight supplemental pages were visually inspected. The supplement specifies
  differing comparator settings and a Banking77 exception to the broader T-Few recipe. No author implementation,
  model fitting, hardware test or empirical replication was executed.
