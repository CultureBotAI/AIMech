id: AIMech:NoisyPowerMethodForStreamingAndDifferentiallyPrivatePCA
name: Noisy Power Method for Perturbed Subspace Iteration, Streaming PCA, and Differentially Private Spectral Analysis
concept_kind: algorithm
review_status: DRAFT
definition: The Noisy Power Method (NPM) for Perturbed Subspace Iteration, Streaming PCA, and Differentially Private Spectral Analysis is a meta-algorithm and principal-angle convergence framework introduced by Hardt and Price (2014) that computes the dominant k eigenvectors U in R^{d x k} of a symmetric matrix A in R^{d x d} from an initial random orthonormal subspace X_0 in R^{d x p} (p >= k) via L iterations of noisy matrix-block products Y_ell = A X_{ell-1} + G_ell followed by QR orthonormalization Y_ell = X_ell R_ell, proving multiplicative contraction of the k-th principal angle tangent tan theta_k(U, X_ell) whenever both the total spectral norm ||G_ell|| and the target-subspace projection ||U^T G_ell|| of the adaptive perturbation G_ell are bounded relative to the eigengap sigma_k - sigma_{k+1}.
identity_notes: Distinct from generic PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) and DimensionalityReduction (AIO:DimensionalityReduction), which do not model adversarial or stochastic per-step perturbations G_ell in QR subspace iteration or differential privacy. Distinct from AIMech:RandomizedBlockKrylovMethodsForApproximateSingularValueDecomposition (Round 355), which analyzes exact noise-free block Krylov iterations using Chebyshev polynomials rather than perturbed block power iterations under adaptive noise. Also distinct from AIMech:ShiftAndInvertPreconditioningForFasterEigenvectorComputation (Round 354), which pre-inverts (lambda I - A) via SVRG rather than analyzing principal-angle tangent contraction and Gram-Schmidt sign-symmetry coherence preservation.
aliases:
- Hardt-Price Noisy Power Method (NPM)
- Streaming Power Method (SPM) and Private Power Method (PPM)
- Coherence-Preserving Differentially Private Subspace Iteration
