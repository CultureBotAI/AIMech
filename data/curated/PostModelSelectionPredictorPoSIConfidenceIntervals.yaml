claims:
- claim_id: full-and-active-covariate-predictor-posi-constant-hierarchy
  kind: mechanism
  statement: 'For fixed-design homoscedastic Gaussian regression Y ~ N(mu, sigma^2 I_n) with candidate
    model set M_cal subset 2^{{1, ..., p}}, rank d = rank(X), and variance estimator sigma_hat^2 independent
    of X''Y distributed as (sigma^2 / r) chi^2_r (including r = infty when sigma is known), the post-model-selection
    predictor confidence interval CI(x_0) = x_0''[M_hat] beta_hat_{M_hat} +- K(x_0, M_hat) * ||s_{M_hat}||
    * sigma_hat (Equations 5-6) covers the design-dependent in-sample optimal target x_0''[M_hat] beta_{M_hat}^{(n)}
    with probability >= 1 - alpha for every model selector M_hat whenever K(x_0, M_hat) >= K_1(x_0), where
    K_1(x_0) is the (1 - alpha)-quantile of max_{M in M_cal} |bar{s}_M''(Y - mu)| / sigma_hat =^d G *
    max_{M in M_cal} |bar{s}_M'' V| with G ~ sqrt(d/r) * sqrt(chi^2_d / chi^2_r) independent of V ~ Unif(S^{d-1})
    (Equation 10, Proposition 2.1, Corollary 2.2, Equation 23). When only active covariates x_0[M_hat]
    are observed, Proposition 2.3 and Corollary 2.4 (pages 9-10, Equations 11-17) establish the valid
    constant hierarchy K_naive = q_{r, 1-alpha/2} <= K_1(x_0) <= K_2(x_0[M], M) <= K_3(x_0[M], M) <= K_4
    <= K_5 and the anti-monotonicity K_i(x_0[M_2], M_2) <= K_i(x_0[M_1], M_1) for M_1 subset M_2 (i =
    2, 3), where K_2(x_0[M], M) = sup{K_1(x) : x[M] = x_0[M]} (Equation 11) and K_3(x_0[M], M) is the
    (1 - alpha)-quantile of F_{M, x_0}(t) = E_G[F^*_{M, x_0}(t/G)] with F^*_{M, x_0}(t) = 1 - min(1, P(max_{M_*
    in M_cal, M_* subset M} |bar{s}_{M_*}'' V| > t) + c(M, M_cal) * (1 - F_{Beta, 1/2, (d-1)/2}(t^2)))
    (Equations 12-14).'
  evidence:
