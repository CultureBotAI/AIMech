id: AIMech:PostModelSelectionPredictorPoSIConfidenceIntervals
name: Post-model-selection predictor PoSI confidence intervals under full and active-only covariate observation
concept_kind: mathematical_method
aliases:
- Bachoc-Leeb-Pötscher post-model-selection predictor confidence intervals
- Active-covariate partial-union-bound predictor PoSI hierarchy (K_1, K_2, K_3, K_4, K_5)
- Design-dependent in-sample and random-design out-of-sample post-selection prediction intervals
- Post-selection linear predictor simultaneous coverage calibration
definition: A post-model-selection inference methodology for linear regression predictors x_0'[M_hat]
  beta_hat_{M_hat} +- K(x_0, M_hat) * ||s_{M_hat}|| * sigma_hat (Equation 5), where s_M' = x_0'[M] (X[M]'
  X[M])^{-1} X[M]' (Equation 6) and bar{s}_M = s_M / ||s_M||, guaranteeing coverage >= 1 - alpha simultaneously
  over all candidate models M in M_cal and any data-driven model selector M_hat without requiring the
  true mean mu to be linear. In fixed-design homoscedastic Gaussian regression Y ~ N(mu, sigma^2 I_n)
  targeting the in-sample optimal linear predictor x_0'[M_hat] beta_{M_hat}^{(n)} with beta_M^{(n)} =
  (X[M]' X[M])^{-1} X[M]' mu (Equations 3-4, Remark 2.8), observing the full regressor vector x_0 in R^p
  yields the exact full-information constant K_1(x_0, r), the (1 - alpha)-quantile of max_{M in M_cal}
  |bar{s}_M' (Y - mu)| / sigma_hat =^d G * max_{M in M_cal} |bar{s}_M' V| (Equation 10, Proposition 2.1,
  Equation 23). When only the selected covariates x_0[M_hat] are observed at prediction time, K_1(x_0)
  is infeasible and is replaced by the active-covariate hierarchy K_naive <= K_1(x_0) <= K_2(x_0[M], M)
  <= K_3(x_0[M], M) <= K_4 <= K_5 (Equations 11-15, Proposition 2.3, Corollary 2.4), where K_2(x_0[M],
  M) = sup_{x[M] = x_0[M]} K_1(x), K_3(x_0[M], M) is the (1 - alpha)-quantile of the partial spherical-cap
  union-bound distribution F_{M, x_0}(t) = E_G[1 - min(1, P(max_{M_* subset M} |bar{s}_{M_*}' V| > t/G)
  + c(M, M_cal) * (1 - F_{Beta, 1/2, (d-1)/2}((t/G)^2)))] separating nested submodels M_* subset M from
  the c(M, M_cal) non-nested models (Equations 12-14), K_4 = K_3(x_0[emptyset], emptyset) is the full
  union-bound constant, and K_5 is the Scheffé constant. In random-design regression Y = X beta + U with
  second-moment matrix Sigma, the same intervals (with either full-model or post-selection variance estimator
  sigma_hat_{M_hat}^2) asymptotically uniformly cover the design-independent out-of-sample optimal linear
  predictor x_0'[M_hat] beta_{M_hat}^{(*)} with beta_M^{(*)} = beta[M] + (Sigma[M, M])^{-1} Sigma[M, M^c]
  beta[M^c] (Section 3, Remark 3.2, Theorem 3.6, Lemma C.2, Theorem D.6).
identity_notes: Distinct from AIMech:ValidPostSelectionInferencePoSIConstant (Berk, Brown, Buja, Zhang,
  & Zhao 2013, The Annals of Statistics 41(2):802-837, arXiv:1206.6451), which constructs simultaneous
  confidence intervals for individual submodel regression coefficients beta_{j, M} (corresponding to the
  sparse unit-vector special case x_0 = e_j) and shows that the coefficient PoSI constant scales as O(sqrt(log
  p)) under orthogonal designs. Bachoc, Leeb, & Pötscher (2019, The Annals of Statistics 47(3):1475-1504,
  arXiv:1412.4605v3, DOI:10.1214/18-AOS1721) formulate post-selection inference for general linear predictors
  x_0'[M_hat] beta_{M_hat} under both full observation of x_0 (K_1(x_0)) and active-only observation of
  x_0[M_hat] (K_2, K_3, K_4), prove exact tightness of the partial union bound in Lemma B.4, establish
  that even under orthogonal designs the predictor constants K_1(x_0, infty) and K_2(x_0[M], M, infty)
  grow at the polynomial rate Theta(sqrt(p)) with explicit lower-bound constant xi = sup_{b > 0} phi(b)/sqrt(1
  - Phi(b)) approx 0.6363 (Proposition 2.9) while K_3(x_0[M], M, infty) / K_4(infty) -> 1 and K_4(infty)/sqrt(p)
  -> sqrt(3)/2 approx 0.866 < 1 (Proposition 2.10, Corollary 2.12), and prove uniform asymptotic validity
  for the random-design out-of-sample projection target x_0'[M_hat] beta_{M_hat}^{(*)} (Theorem 3.6, Theorem
  D.6). Also distinct from AIMech:RestrictedIsometryPostSelectionInferenceConstantBounds (Bachoc, Blanchard,
  & Neuvial 2018), which bounds the regression-coefficient PoSI constant under s-sparse Restricted Isometry
  Property assumptions.
