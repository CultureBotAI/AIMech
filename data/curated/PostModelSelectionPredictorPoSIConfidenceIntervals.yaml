- claim_id: exact-union-bound-geometry-and-monte-carlo-quantile-algorithms
  kind: mechanism
  statement: 'Lemma B.4 (Appendix B.1, page 34) proves that the spherical union bounds defining K_3(x_0[M],
    M) and K_4 can hold with exact equality: for p = d = 2, n >= 2, M_cal = 2^{{1, 2}}, X^{(2)} = [[1,
    cos(2*pi/3)], [0, sin(2*pi/3)]], and x_0'' = (cos(4*pi/3), sin(4*pi/3)) X^{(2)}, the three unit vectors
    bar{s}_{{1}}'' = -(1, 0), bar{s}_{{2}}'' = -(cos(2*pi/3), sin(2*pi/3)), and bar{s}_{{1,2}}'' = (cos(4*pi/3),
    sin(4*pi/3)) have spherical caps {|bar{s}_{M_*}'' V| > c} that are pairwise disjoint on S^1 for c
    >= sqrt(3)/2 and cover S^1 for 0 <= c <= sqrt(3)/2, yielding F^*_{M, x_0}(t) = P(max_{M_* in M_cal}
    |bar{s}_{M_*}'' V| <= t) and K_1(x_0) = K_2(x_0[M], M) = K_3(x_0[M], M) = K_4 < K_5 for every M in
    M_cal. Appendix E (pages 48-53, Equations 37-42, Algorithms E.1-E.3) provides exact 1D numerical integration
    for K_4 (Equation 37) and conditional Monte Carlo integration over V ~ Unif(S^{d-1}) and V_tilde ~
    Unif(S^{|M|-1}) for K_1(x_0) and K_3(x_0[M], M), reducing the inner nested maximization in K_3 from
    dimension d to dimension |M| via QR orthogonalization of X[M] (Equation 40, Algorithm E.2).'
  evidence:
  - source_id: blp2019-pdf
    locator: Section 2.3, Pages 9-12; Appendix B.1, Page 34, Lemma B.4; Appendix E, Pages 48-53, Equations
      (37)-(42), Algorithms E.1-E.3
    relation: supports
- claim_id: orthogonal-design-sqrt-p-scaling-and-universal-k3-k4-asymptotics
  kind: mechanism
  statement: 'Whereas the Berk-Brown-Buja-Zhang-Zhao (2013) PoSI constant for individual regression coefficients
    scales as sqrt(2 log p) under orthogonal designs, Proposition 2.9 and Lemma B.6 (Section 2.4.1, pages
    12-13, Appendix B.2, pages 35-36) prove that for any orthogonal design X(p) in X_sf(p) with M_cal
    = 2^{{1, ..., p}} and r = infty, choosing dense x_0 proportional to (1, ..., 1)'' yields liminf_{p
    -> infty} K_1(x_0, infty) / sqrt(p) >= xi = sup_{b > 0} phi(b) / sqrt(1 - Phi(b)) approx 0.6363 (while
    sparse x_0 with sup_p ||x_0||_0 < infty satisfies K_1(x_0, infty) = O(1)), and for any 0 <= gamma
    < 1, liminf_{p -> infty} inf_{x_0, X in X_sf(p), |M| <= gamma * p} K_2(x_0[M], M, infty) / sqrt(p)
    >= xi * sqrt(1 - gamma). Furthermore, Proposition 2.10 and Corollaries 2.11-2.12 (Section 2.4.2, pages
    13-14, Appendix B.2, pages 36-38) prove that whenever c(M, M_cal) >= tau * |M_cal| (holding with tau
    = 1/3 for all M != {1, ..., p} when M_cal = {M : |M| <= m_p}), K_3(x_0[M], M, r_p) / K_4(r_p) -> 1
    uniformly over design X, x_0, and M, and K_4(infty) ~ sqrt(min(n(p), p) * (1 - |M_cal|^{-2/(min(n(p),
    p) - 1)})), which for M_cal = 2^{{1, ..., p}} and n(p) >= p gives lim_{p -> infty} K_4(infty) / sqrt(p)
    = sqrt(3)/2 approx 0.866 < 1 = lim_{p -> infty} K_5(infty) / sqrt(p).'
  evidence:
