- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Calibrates predictor confidence intervals via the PoSI hierarchy (K_1, K_2, K_3, K_4, K_5)
    to guarantee coverage >= 1 - alpha across all data-driven model selection procedures, preventing post-selection
    data-snooping invalidation (AIO:DataDredgingBias).
limitations:
- Unlike the Berk-Brown-Buja-Zhang-Zhao (2013) PoSI constant for individual regression coefficients, which
  scales as sqrt(2 log p) under orthogonal designs, the predictor PoSI constants K_1(x_0) (for dense x_0)
  and K_2(x_0[M], M), K_3(x_0[M], M), K_4 grow at rate Theta(sqrt(p)) even under orthogonal designs when
  M_cal = 2^{{1, ..., p}}, because the predictor vectors bar{s}_M depend continuously on x_0 across all
  2^p - 1 submodels (Proposition 2.9, Proposition 2.10, Corollary 2.12).
- In the random-design setting (Section 3, Condition 3.5, Remark 3.7, and Appendix D Condition D.4), uniform
  asymptotic validity over misspecified submodels |M_hat| < p requires spherical invariance of the standardized
  covariate vector Sigma^{-1/2} x_i (such as elliptical / Gaussian designs) to ensure that the omitted-variable
  projection residual x_i'[M^c] beta[M^c] - x_i'[M] (Sigma[M, M])^{-1} Sigma[M, M^c] beta[M^c] is uncorrelated
  with x_i[M] and conditionally homoscedastic.
- 'Four minor typographical or corrigendum notes in arXiv:1412.4605v3 were identified and verified during
  full-text inspection: (1) Section 2.4.1 (page 13, line 6) explicitly notes a corrigendum to Berk et
  al. (2013a) Proposition 5.5, pointing out that the remainder term printed as ''o(d)'' in Berk et al.
  (2013a) should read ''o(1)''; (2) in Appendix B.2 (page 37, proof of Proposition 2.10, line 6), ''K(|M|
  - 1, min(n(p).p), alpha)'' prints a period instead of a comma inside ''min(n(p), p)''; (3) in Appendix
  E (page 49, paragraph preceding Algorithm E.2, line 4), ''\tilde{\bar{s}}_Minstead of \bar{s}_M'' omits
  the space before ''instead''; and (4) in the References (page 56, Tian & Taylor 2015), ''selective inferene''
  is printed for ''selective inference''.'
- All 56 pages of the full-text PDF of Bachoc, Leeb, & Pötscher (2019, The Annals of Statistics 47(3):1475-1504,
  arXiv:1412.4605v3, DOI:10.1214/18-AOS1721) were read. Constructed numerical checks in research/discovery/post-model-selection-predictor-posi-confidence-intervals-boundaries.py
  verify (1) Lemma B.4 exact union-bound geometry on S^1 where K_1(x_0) = K_2 = K_3 = K_4 < K_5, (2) the
  strict hierarchy and anti-monotonicity K_naive < K_1 < K_3(M_2) < K_3(M_1) = K_4 < K_5 for |M_1| = 1
  < |M_2| = 2, (3) Proposition 2.9's orthogonal-design constant xi approx 0.636328 and Corollary 2.12's
  limit K_4(infty)/sqrt(p) -> sqrt(3)/2 approx 0.866025, and (4) Section 3's random-design coverage of
  the out-of-sample projection target beta_M^{(*)} using the post-selection variance estimator sigma_hat_{M_hat}^2.
