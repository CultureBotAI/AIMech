    relation: supports
- claim_id: random-design-uniform-asymptotic-validity-for-out-of-sample-predictors
  kind: mechanism
  statement: In the random-design regression model Y = X beta + U where (y_i, x_i') are i.i.d. with E[x_i
    x_i'] = Sigma and E[u_i | x_i] = 0, Remark 2.8 and Section 3 (pages 11-12, 15-19, Equation 18, Remark
    3.2) distinguish the design-dependent in-sample projection parameter beta_M^{(n)} = (X[M]' X[M])^{-1}
    X[M]' E[Y | X] from the design-independent out-of-sample optimal linear projection parameter beta_M^{(*)}
    = argmin_{gamma} E[(y_0 - x_0'[M] gamma)^2] = beta[M] + (Sigma[M, M])^{-1} Sigma[M, M^c] beta[M^c].
    Under Conditions 3.3-3.5 (moment bounds on X, U and spherical invariance of X Sigma^{-1/2} when |M_hat|
    < p), Theorem 3.6 and Lemmas C.1-C.2 (Section 3, pages 17-19, Appendix C, pages 38-42) prove that
    the confidence intervals CI(x_0) calibrated with K(x_0, M_hat) in {K_1, K_2, K_3, K_4, K_5} and either
    the full-model variance estimator sigma_hat_OLS^2 or the post-selection variance estimator sigma_hat_{M_hat}^2
    = ||Y - X[M_hat] beta_hat_{M_hat}||^2 / (n - |M_hat|) achieve uniform asymptotic coverage P(x_0'[M_hat]
    beta_{M_hat}^{(*)} in CI(x_0) | x_0) >= (1 - alpha) + o_p(1) uniformly over model selectors M_hat
    and spherical error-plus-design laws (extended to growing dimension p(n) -> infty with p(n) = o(n^{1/2})
    in Appendix D, Theorem D.6, pages 42-48).
