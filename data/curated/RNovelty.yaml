name: R-Novelty SAT heuristic
definition: A Novelty-derived SAT heuristic whose choice between the best and second-best flips depends
  on their objective-score gap when the best variable was most recently flipped; its original 1997 search
  strategy also includes a periodic random clause-variable move.
concept_kind: algorithm
identity_notes: 'This record follows the full 1997 R-Novelty parameterization and its stated every-100-flip
  random override, retaining the distinction from the core score-gap selector and from the 1999 R-Novelty+
  extension. The 2004 solver description instead labels a periodic-override configuration Rnovelty+ and
  describes only the p=0.5 selector case. Those differing source conventions are not treated as exact
  synonyms or interchangeable completeness guarantees. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 322 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 52 and 53 lines respectively.
  All twenty unique hit contents were inspected: neighboring variant references, saved reviews and discovery
  leads, generic novelty wording and an ignored Sphinx comment, not existing candidate records. The checkout
  differences are retained in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments and
  outgoing edges and five full native neighboring records were inspected. Absence is bounded to this snapshot
  and semantic neighborhood.'
limitations:
- Hoos1999 Theorem 4 and its continuation show that the unrestarted R-Novelty strategy is essentially
  incomplete for arbitrary noise settings even with its every-100-step override. A periodic random move
  can occur at phases that never expose a needed variable; its mere presence does not establish asymptotic
  success.
- The 1999 R-Novelty+ method removes the periodic override and adds a positive random-walk probability
  at each step. Its guarantee relies on possible arbitrarily long random-walk sequences, not a deterministic
  schedule. The 2004 source uses the plus name differently and its cycling-prevention statement is not
  adopted as a guarantee.
- The d>=1 branch formulation uses age-based score tie breaking. Initial timestamp ties, unit clauses
  with no second candidate, empty clauses and exact counter/reset conventions need explicit implementation
  decisions; a d=0 probability rule is not invented here.
- Parameters p and the periodic schedule have different roles. Score gaps are in unweighted clause counts;
  changing them to weighted or real-valued objectives requires a new specification. Finite failure is
  not an UNSAT proof, and no author solver or benchmark was executed.
