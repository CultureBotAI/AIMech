claims:
- claim_id: method
  kind: mechanism
  statement: Use Novelty’s randomly selected unsatisfied clause, post-flip total-violation ranking and
    oldest-variable tie break. If the best candidate is not the most recently flipped variable in that
    clause, select it. Otherwise let d be the second-best post-flip violation count minus the best count;
    the 1997 rule assumes d>=1. If p<0.5 and d>1, choose the best. If p<0.5 and d=1, choose the second-best
    with probability 2p and otherwise the best. If p>=0.5 and d=1, choose the second-best. If p>=0.5 and
    d>1, choose the second-best with probability 2(p−0.5) and otherwise the best. Independently of this
    ordinary selection rule, the 1997 strategy specifies that every 100 flips it chooses a random variable
    from the selected clause instead. Update the chosen variable’s flip timestamp. At p=0.5 the recency-triggered
    rule picks second-best for gap one and best for a larger gap; that special case is not the full parameterized
    method.
  evidence:
  - source_id: method-source
    locator: PDF2 / printed322, R-NOVELTY four-case selector; PDF3 / printed323, every-100-flip random
      override and intuition
    relation: supports
- claim_id: incompleteness-and-version-boundary
  kind: scope
  statement: Hoos1999 proves essential incompleteness of unrestarted R-Novelty even with scheduled random
    flips every 100 steps, then defines R-Novelty+ by replacing that periodic escape with a positive per-step
    random-walk branch. The 2004 competition report uses the plus name for a periodic configuration and
    claims cycling prevention. This record preserves the discrepancy and follows the explicit 1997 method
    and 1999 theorem, without endorsing the conflicting guarantee.
  evidence:
  - source_id: additional-1
    locator: PDF3, no-restart scope; PDF4–5, Theorem 4 and phase-locking explanation; PDF5–6, random-walk
      extension and removal of periodic override
    relation: supports
  - source_id: additional-2
    locator: PDF/printed2, Rnovelty p=0.5 and Rnovelty+ naming/cycling statement
    relation: context
