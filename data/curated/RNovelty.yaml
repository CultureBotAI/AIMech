aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 322 preceding maintained IDs/names/aliases;
    ignored/hidden-inclusive full text in both checkouts; semantic labels/scoped synonyms for search,
    satisfiability, heuristics, reasoning, novelty, memory and recurrence; nine exact AIO CLASS nodes
    and five complete native neighbors.
  rationale: No suitable AIO target was established in this pinned snapshot and inspected semantic neighborhood.
    Search memory, novelty naming and stochastic exploration do not justify forced neural-memory, language-model
    or learning-task mappings.
  examined_targets:
  - target: AIO:ReasoningLLM
    rejection_reason: Selecting Boolean variable flips is not a language model performing reasoning in
      language tasks.
  - target: AIO:TrainingStrategy
    rejection_reason: The method searches a supplied formula rather than prescribing preprocessing or
      training a machine-learning model.
  - target: AIO:MachineLearningTask
    rejection_reason: Remembering a move timestamp does not itself turn fixed-formula search into development
      of a method that learns from data.
  - target: AIO:ReinforcementLearning
    rejection_reason: Age-based move selection and a noise parameter do not require a learned reward policy
      or action-value function.
  - target: AIO:MarkovChain
    rejection_reason: An augmented state could include timestamps and step phase, but that representation
      alone does not identify the named SAT heuristic with the pinned stochastic network/model class.
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: Boolean assignments, clause scores and flip timestamps are not a network of artificial
      neurons.
  - target: AIO:MemoryAugmentedLLM
    rejection_reason: External memory in a language model is different from retaining SAT variable ages;
      the related external-memory synonym does not broaden the target to every algorithm using memory.
  - target: AIO:MemoryCellLayer
    rejection_reason: A neural layer of cells with internal state or weights is not a variable-age table.
  - target: AIO:LongShortTermMemory
    rejection_reason: A recurrent neural architecture processing sequences is not a SAT move-history heuristic.
