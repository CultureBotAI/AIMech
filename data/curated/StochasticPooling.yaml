aio_mappings:
- target: AIO:PoolingLayer
  relation: broad_match
  rationale: The original construction aggregates spatial regions into smaller feature maps, placing this
    particular stochastic layer within the broader spatial-pooling scope.
- target: AIO:MaxPooling2DLayer
  relation: related_match
  rationale: Both select a regional activation and route a gradient through a selected location, but stochastic
    pooling samples from activation-dependent probabilities rather than always selecting the largest value.
limitations:
- This record denotes the Zeiler–Fergus convolutional pooling construction, not every method called stochastic
  pooling, a complete convolutional classifier, channel maxout or random connection masking.
- The probability formula requires nonnegative activations and positive total. No undocumented all-zero
  sampling fallback or author implementation behavior is asserted.
- Local conditional expectations and fixed-routing derivatives have narrower scope than complete-network
  predictive expectations and expected-objective gradients.
- One complete nine-page versioned primary paper was visually inspected. Constructed calculations only;
  no author code, supplementary video, training, timing or benchmark replication.
