claims:
- claim_id: r478-consensus-logit-digest-and-private-revisit-protocol-mechanism
  kind: mechanism
  statement: By communicating only class score vectors f_k(x_i^0) evaluated on a shared public dataset D_0 and alternating between a Digest stage (distilling the server-averaged consensus logits f_tilde(x_i^0) = (1/m) sum_{k=1}^m f_k(x_i^0) into each client's model f_k on D_0) and a Revisit stage (fine-tuning f_k on private labeled data D_k), FedMD enables collaborative learning across clients whose neural network depths, channel widths, and architectures differ arbitrarily without revealing model weights or architecture intellectual property (Li & Wang 2019, Section 3, Algorithm 1).
  evidence:
  - source_id: r478-primary-pdf
    locator: Section 3 (Algorithm 1, Figure 2), p. 3
    relation: supports
- claim_id: r478-transfer-learning-initialization-and-architecture-agnostic-scope
  kind: scope
  statement: Initializing each heterogeneous client model via transfer learning (training to convergence on public dataset D_0 before fine-tuning on small private dataset D_k) combined with iterative Digest-and-Revisit consensus distillation achieves up to ~20 percentage points higher test accuracy than isolated private training across 10 structurally distinct 2-layer and 3-layer CNN architectures under both IID and non-IID class partitions (Li & Wang 2019, Section 4, Tables 1-2, Figures 3-6).
  evidence:
  - source_id: r478-primary-pdf
    locator: Section 4 (Tables 1-2, Figures 3-6), pp. 4-6
    relation: supports
- claim_id: r478-cross-architecture-emnist-and-cifar-federated-distillation-application
  kind: application
  statement: Applied to heterogeneous cross-architecture federated classification using public MNIST with private EMNIST letters and public CIFAR-10 with private CIFAR-100 subsets across 10 distinct CNN architectures (Li & Wang 2019, Section 4, Tables 1-2, Figures 3-6).
  evidence:
  - source_id: r478-primary-pdf
    locator: Section 4 (Experiments, Tables 1-2, Figures 3-6), pp. 4-6
    relation: supports
- claim_id: r478-shared-public-dataset-and-per-sample-logit-communication-limitation
  kind: limitation
  statement: Requires a task-relevant shared public dataset D_0 accessible to all clients and incurs per-round communication proportional to |D_0| times the number of classes C (Li & Wang 2019, Sections 3 & 5, pp. 3 & 7).
  evidence:
  - source_id: r478-primary-pdf
    locator: Section 3 (Algorithm 1), p. 3, and Section 5 (Conclusion and Future Works), p. 7
    relation: supports
