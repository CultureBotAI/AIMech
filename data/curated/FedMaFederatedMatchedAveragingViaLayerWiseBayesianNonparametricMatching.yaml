id: AIMech:FedMaFederatedMatchedAveragingViaLayerWiseBayesianNonparametricMatching
name: FedMA (Federated Matched Averaging via Layer-Wise Bayesian Nonparametric Matching)
concept_kind: algorithm
review_status: DRAFT
definition: 'A layer-wise permutation-aware federated learning algorithm (FedMA, Algorithm 1) for modern neural networks (FC layers, CNN channels, and RNN/LSTM hidden states) that accounts for neuron permutation invariance W_1 Pi_j, Pi_j^T W_2 by matching and averaging hidden elements (neurons, convolutional channels, or recurrent states) bottom-up one layer at a time: at layer n, the server solves a Bayesian nonparametric Beta-Bernoulli Process MAP (BBP-MAP, Eq. 6) assignment problem via iterative Hungarian bipartite matching to align client weights {W_{j,n}}_{j=1}^J into global weights W_{G,n} = (1/J) sum_j W_{j,n} Pi_{j,n} (adaptively expanding layer width L in [max_j L_j, sum_j L_j] when distances exceed threshold epsilon), broadcasts W_{G,n}, and has clients permute layer n+1 via Pi_{j,n}^T W_{j,n+1} and retrain remaining layers n+1,...,N with layers 1,...,n frozen.'
identity_notes: Distinct from coordinate-wise parameter averaging (FedAvg, FedProx) which ignores the permutation invariance of neural network hidden units and averages misaligned neurons, from single-round one-shot Probabilistic Federated Neural Matching (PFNM, which applies only to shallow fully connected networks without layer-wise freezing and retraining), and from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning, which fuses models in output logit space using unlabeled server data rather than matching weights layer-by-layer via Hungarian assignment).
aliases:
- FedMA
- Federated Matched Averaging
- Federated Learning with Matched Averaging
