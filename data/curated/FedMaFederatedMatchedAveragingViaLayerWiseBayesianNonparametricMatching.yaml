claims:
- claim_id: r408-permutation-invariance-of-fc-cnn-and-lstm-layers-and-hungarian-matching
  kind: mechanism
  statement: Section 2 establishes exact permutation invariance across fully connected layers (W_1 Pi_j, Pi_j^T W_2, Eq. 2), convolutional channels Conv(x, Pi_{j,n-1}^T W_{j,n}) Pi_{j,n} (Eq. 3), and recurrent hidden-to-hidden matrices Pi^T H Pi (Eq. 4), and formulates matched averaging (Eq. 5) as minimizing sum_{i=1}^L sum_{j,l} pi_{li}^j c(w_{jl}, theta_i) via coordinate-descent Hungarian bipartite matching with MAP solutions theta_i = (1/J) sum_{j,l} pi_{li}^j w_{jl}.
  evidence:
  - source_id: r408-primary-pdf
    locator: Section 2.1-2.3 (Eqs. 1-5), pp. 2-5
    relation: supports
- claim_id: r408-bbp-map-nonparametric-adaptive-width-and-bottom-up-layer-freezing
  kind: mechanism
  statement: Using the Beta-Bernoulli Process MAP objective (Eq. 6) with distance threshold epsilon and size penalty f(L'), FedMA dynamically adapts each global layer width L in [max_j L_j, sum_j L_j] by spawning new global neurons for unmatched client features, while Algorithm 1 matches and freezes layers bottom-up from n = 1 to N-1 so deeper layers retrain on aligned representations before being matched.
  evidence:
  - source_id: r408-primary-pdf
    locator: Section 2.1 Eq. 6 & Section 2.4 Deep Architectures (Algorithm 1, Figure 1), pp. 3, 5-6
    relation: supports
- claim_id: r408-layer-wise-communication-rounds-and-cubic-hungarian-matching-complexity-limitation
  kind: limitation
  statement: FedMA requires N-1 sequential layer-wise matching-and-retraining rounds per global pass and incurs Hungarian matching complexity between O(D L^2 + L^3) in the best case and O(D (J L)^2 + (J L)^3) in the worst case per layer (Appendix E), and cannot directly match across residual skip connections without architectural constraints.
  evidence:
  - source_id: r408-primary-pdf
    locator: Section 2.4 Algorithm 1 & Appendix E Practical Considerations, pp. 5-6, 15
    relation: supports
- claim_id: r408-heterogeneous-vgg9-cifar10-and-lstm-shakespeare-application
  kind: application
  statement: Evaluated on heterogeneous CIFAR-10 with VGG-9, MNIST with CNNs, and Shakespeare next-character prediction with LSTM models, outperforming FedAvg and FedProx in test accuracy, communication efficiency (bits vs. accuracy), and skewed domain-bias handling.
  evidence:
  - source_id: r408-primary-pdf
    locator: Section 4 Experiments (Figures 2-4, Tables 1-3), pp. 6-9
    relation: supports
