id: AIMech:AdamW
name: AdamW
definition: An Adam optimization variant that applies weight decay directly to parameters separately from
  gradient moment estimation.
concept_kind: algorithm
identity_notes: Decoupled weight decay distinguishes AdamW from Adam with a penalty included in its gradient
  moments. It is an optimization algorithm, not a new model architecture.
