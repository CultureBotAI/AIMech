name: DeepLIFT
definition: A neural-network attribution method that distributes an output's difference from a reference
  activation to input differences using backward contribution propagation.
concept_kind: algorithm
identity_notes: This record covers the 2017 DeepLIFT method including distinct local rules; it is not
  identical to gradients, integrated gradients, Deep SHAP or the earlier Rescale-only formulation.
limitations:
- Reference and local-rule choices affect attribution. The paper discusses cases favoring Rescale or RevealCancel
  rather than one universally superior rule.
- Contribution conservation is not a proof of causal feature importance or exact Shapley values for an
  arbitrary network.
