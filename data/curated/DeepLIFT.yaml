claims:
- claim_id: attribution-method
  kind: mechanism
  statement: Reference inputs determine reference activations. Local contribution multipliers compose
    backward subject to summation-to-delta; Linear, Rescale and RevealCancel rules determine local allocation,
    with RevealCancel treating positive and negative differences separately.
