  relation: supports
claims:
- claim_id: method-scope
  kind: mechanism
  statement: Map an individual to softmax probabilities over learned prototypes using negative distances.
    Optimize prototype locations and bounded prototype label probabilities with a weighted sum of squared
    reconstruction loss, predictive cross-entropy and absolute differences of mean assignment probabilities
    between two protected groups. The paper also learns feature-distance weights separately by group and
    uses L-BFGS for its optimization.
  evidence:
  - source_id: original-paper
    locator: Sections 2.1–2.3, equations (1)–(12), PDF pp. 2–4; Section 4.1, PDF p. 6 for optimization
    relation: supports
- claim_id: representation-distribution-limit
  kind: limitation
  statement: 'Louizos and colleagues identify a higher-order-distribution limitation of matching average
    LFR assignment probabilities: groups can have the same average assignment while the distribution of
    those probability values differs. This concerns the exposed probability-vector representation, not
    a refutation of parity of an exactly matched sampled prototype index.'
  evidence:
  - source_id: representation-critique
    locator: Related Work, Section 4, PDF pp. 8–9, paragraph beginning with the comparison to Zemel et
      al.
    relation: supports
