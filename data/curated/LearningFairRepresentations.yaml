name: Learning Fair Representations
definition: A prototype-based representation-learning algorithm that jointly balances reconstruction,
  supervised prediction and differences between group-average prototype assignment probabilities.
concept_kind: algorithm
identity_notes: The named LFR algorithm learns a prototype representation and a prediction rule. It is
  distinct from the general aim of learning fair representations, the finite-population FairnessLP formulation,
  and the later Variational Fair Autoencoder. The learned metric variant does not make it identical to
  AIO MetricLearning, which denotes a deep neural network in this pin. All 442 pinned AIO labels/scoped
  synonyms and 104 preceding native identities were compared, together with hidden/ignored-inclusive searches
  of both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- Fairness, reconstruction and predictive utility are weighted objectives; finite training and a nonzero
  penalty weight do not guarantee exact population parity.
- Equal group means of assignment probabilities do not imply equality of the distributions of the full
  assignment-probability vectors. Arbitrary nonlinear downstream processing or thresholding requires a
  separate fairness assessment.
- The method encourages local similarity; it does not certify the full supplied-metric pairwise Lipschitz
  criterion for every pair of individuals.
- The group-specific distance variant uses group membership for its mapping. Out-of-sample representation
  availability is not a proof of out-of-sample fairness.
aliases:
