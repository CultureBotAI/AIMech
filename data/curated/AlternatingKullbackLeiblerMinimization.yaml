name: Alternating Kullback-Leibler Minimization
aliases:
- Alternating I-Divergence Minimization
- Alternating Information Projection
concept_kind: algorithm
definition: A paired-distribution optimization procedure that alternately minimizes Kullback-Leibler divergence
  in its first and second arguments over specified convex probability families.
identity_notes: 'Scoped to the exact two-family KL procedure analyzed by Csiszar and Tusnady. The information-projection
  alias is qualified here by KL direction and the two-family objective. It is not all block coordinate
  descent, arbitrary Bregman projection, or the later GAM framework permitting inexact parameter/distribution
  steps. Iterative proportional fitting and Sinkhorn scaling have their own margin constraints; sharing
  a projection interpretation does not identify the complete algorithms. No normalized identity collision
  across all 442 pinned AIO IDs, labels/scoped synonyms and 483 maintained IDs, names and aliases. Full-checkout
  searches in the worktree and main included ignored and hidden files: 8 and 9 matched lines, respectively,
  reduce to six distinct matched texts, all inspected. Hits concern existing discovery leads and the unrelated
  assembler mnemonic AAM. The fixed-family exact KL projection procedure is narrower than generalized
  alternating minimization; weight-only EM fixes component laws rather than fitting a full mixture model;
  rate-distortion BA minimizes information plus distortion with a fixed source, whereas the IM algorithm
  maximizes a variational information bound; adaptive alternating minimization changes the feasible families
  at each iteration. Qualified AAM and descriptive weight-only names avoid unsupported acronym or historical
  naming claims. Absence is bounded to this snapshot and inspected corpus. Identity-search counts: 8 worktree
  and 9 main matched lines, all six distinct texts read, including ignored and hidden files.'
