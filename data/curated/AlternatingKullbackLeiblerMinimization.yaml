claims:
- claim_id: two-directed-minima
  kind: mechanism
  statement: Start with Q_0 in the second family. At each iteration choose P_n minimizing D(P||Q_(n-1))
    over the first family, then Q_n minimizing D(P_n||Q) over the second. For probability laws, D(P||Q)=integral
    log(dP/dQ)dP, with infinity when absolute continuity fails. The two coordinate projections have different
    directions. Each displayed argmin must exist and be finite along the realized sequence; this is not
    supplied by the algorithm name. Exact steps cannot increase the paired objective.
  evidence:
  - source_id: projection-source
    locator: Section1 Eq1.1, pp205-208 / PDF1-4; Section3 Eq3.1 and Lemmas2-3, pp214-218 / PDF10-14
    relation: supports
- claim_id: accessible-infimum
  kind: scope
  statement: 'The convex-family KL construction has the three-point and four-point inequalities used to
    prove a five-point descent inequality. The objective tends to the infimum over the initialization-accessible
    first-family laws: those with finite D(P||Q_n) for some iterate. Equality of that infimum with the
    unrestricted one is an additional support/accessibility condition. Objective convergence is distinct
    from convergence of the distributions. In finite probability spaces, closed families are compact;
    analogous arguments for unnormalized measures need their own boundedness or compactness justification.'
  evidence:
  - source_id: projection-source
    locator: Sections1-2, Theorems1-2, pp207-213 / PDF3-9; Section3 Theorem3 and subsequent proof, pp217-218
      / PDF13-14
    relation: supports
- claim_id: finite-measure-extension
  kind: limitation
  statement: The paper also uses uncorrected D(P||Q) for finite measures, which can be negative when their
    masses differ. Its nonnegative auxiliary is D(P||Pprime)+Pprime(X)-P(X). That extension must not be
    silently treated as probability KL. The stopping-bound step that integrates log(dQ_n/dQ_(n-1)) against
    a minimizing P requires its total-mass factor unless P is normalized. A convergent Q sequence alone
    also does not force successive density ratios to approach one at coordinates whose limit is zero.
    The saved finite examples exhibit both issues.
  evidence:
  - source_id: projection-source
    locator: Section3 Eq3.1-3.3 and Eq3.11 discussion, pp214-219 / PDF10-15; curator finite-measure scaling
      and vanishing-coordinate examples
    relation: supports
- claim_id: likelihood-lifting
  kind: scope
  statement: For incomplete-data fitting, a family of complete laws with prescribed observed marginal
    can be paired with a model-distribution family. Projection onto the prescribed marginal rescales the
    current joint law by the observed-to-current marginal ratio; the other projection fits the model to
    the completed law. A convex model-distribution family can inherit the global accessible-infimum result.
    Jointly parameterized nonconvex mixture or neural families do not become convex merely because they
    use EM.
  evidence:
  - source_id: projection-source
    locator: Section4 Theorem4 and Eq4.1-4.6, pp220-221 / PDF16-17; Section5A, pp226-230 / PDF22-26
    relation: supports
limitations:
- The maintained identity uses probability families; finite-measure formulas in the source are explicitly
  separated. On infinite spaces, positivity alone does not ensure finite KL or compactness.
- The unbounded off-support Q example challenges a compactness step in the finite-measure proof, not the
  theorem for closed finite probability families. No blanket theorem refutation is asserted.
- Finite curator calculations check selected support, normalization and convergence boundaries. They are
  not author software, historical experiments or a proof of every source theorem.
