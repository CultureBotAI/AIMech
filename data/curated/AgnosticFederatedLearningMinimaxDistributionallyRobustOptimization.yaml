claims:
- claim_id: r398-proposition1-uniform-mixture-excess-agnostic-risk-and-good-intent-fairness
  kind: mechanism
  statement: Proposition 1 proves that even in the infinite-sample limit m_k -> infinity with equal domain weights on two binary distributions D_1(x, 1) = 1 and D_2(x, 1) = D_2(x, 0) = 1/2, the uniform-mixture predictor h_U(x) = 3/4 incurs strictly higher worst-case cross-entropy risk than the agnostic minimax predictor h_{D_Lambda}(x) = 1/2 by a constant gap (1/2) log(4/3) > 0, motivating good-intent fairness across protected or heterogeneous domains.
  evidence:
  - source_id: r398-primary-pdf
    locator: Section 3.2 Comparison with Standard Federated Learning (Proposition 1) & Section 3.3 Fairness in Learning, pp. 3-4
    relation: supports
- claim_id: r398-skewness-weighted-rademacher-generalization-and-stochastic-afl-convergence
  kind: mechanism
  statement: Theorem 2, Lemma 3, and Corollary 4 bound the uniform generalization gap between expected and empirical agnostic risk in terms of the weighted Rademacher complexity R_m(G, Lambda), the chi-squared skewness s(Lambda || m_bar) = 1 + max_{lambda in Lambda} chi^2(lambda || m_bar) = max_{lambda in Lambda} sum_{k=1}^p lambda_k^2 / m_bar_k, and an l_1 epsilon-cover Lambda_epsilon, while Theorem 5 and Lemmas 6, 8, and 9 prove O(1/sqrt(T)) saddle-point convergence for Stochastic-AFL under PerDomain and Weighted stochastic gradients.
  evidence:
  - source_id: r398-primary-pdf
    locator: Section 4 Learning Guarantees (Theorem 2, Lemma 3, Corollary 4) & Section 5 Algorithm (Theorem 5, Lemmas 6, 8, 9), pp. 4-7
    relation: supports
- claim_id: r398-large-domain-count-skewness-and-lambda-gradient-variance-limitation
  kind: limitation
  statement: When the number of domains p is large and Lambda = Delta_p is the full simplex, the skewness parameter s(Delta_p || m_bar) = max_k (m / m_k) grows inversely with the smallest client sample fraction, weakening generalization unless Lambda is constrained near m_bar or clients are grouped into clusters, and single-domain sampling for delta_lambda L has O(p M^2) variance (Lemma 6).
  evidence:
  - source_id: r398-primary-pdf
    locator: Section 4 Discussion after Lemma 3, Section 5 Lemma 6, and Section 7 Discussion, pp. 5-8
    relation: supports
- claim_id: r398-adult-fashion-mnist-and-language-modeling-fairness-application
  kind: application
  statement: Applied to federated income classification (Adult), image classification across clothing categories (Fashion-MNIST), and multi-domain language modeling (Cornell Movie + Penn Treebank), consistently reducing worst-domain test loss and perplexity compared to uniform FedAvg.
  evidence:
  - source_id: r398-primary-pdf
    locator: Section 6 Experiments (Tables 1-3, Figure 5), pp. 7-8
    relation: supports
