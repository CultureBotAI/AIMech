id: AIMech:AgnosticFederatedLearningMinimaxDistributionallyRobustOptimization
name: Agnostic Federated Learning via Minimax Distributionally Robust Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A distributionally robust federated learning framework and stochastic minimax optimization algorithm (Agnostic Federated Learning, AFL) that replaces fixed empirical sample-proportion risk minimization with the agnostic minimax objective min_{h in H} L_{D_Lambda}(h) = min_{h in H} max_{lambda in Lambda} sum_{k=1}^p lambda_k L_{D_k}(h) over a subset Lambda of the domain mixture simplex Delta_p. AFL controls generalization via the weighted Rademacher complexity R_m(G, Lambda) and the chi-squared skewness parameter s(Lambda || m_bar) = 1 + max_{lambda in Lambda} chi^2(lambda || m_bar), and optimizes the empirical saddle-point objective via Stochastic-AFL projected gradient descent-ascent w_{t+1} = Pi_W(w_t - gamma_w * delta_w L(w_t, lambda_t)), lambda_{t+1} = Pi_Lambda(lambda_t + gamma_lambda * delta_lambda L(w_t, lambda_t)) using unbiased PerDomain or Weighted stochastic gradients.
identity_notes: Distinct from q-Fair Federated Learning (AIMech:QFairFederatedLearningAlphaFairResourceAllocation, which minimizes a smooth alpha-fair sum of (1/(q+1)) F_k^{q+1}(w) without maintaining dual simplex mixture weights lambda in Delta_p or solving a saddle-point problem) and from standard FedAvg (AIMech:FederatedAveragingCommunicationEfficientDecentralizedDeepLearning, which minimizes the fixed empirical sample-weighted mixture sum_k (m_k / m) L_k(w) and can suffer a constant excess agnostic risk even as m_k -> infinity by Proposition 1).
aliases:
- Agnostic Federated Learning
- AFL
- Stochastic-AFL
- Minimax Agnostic Federated Optimization
