name: AMSGrad
definition: An Adam variant that normalizes first-moment updates with the coordinatewise historical maximum
  of second-moment estimates.
identity_notes: The historical maximum distinguishes AMSGrad from Adam and from weight-decay decoupling
  in AdamW. It can be combined with other optimizer choices without becoming identical to them.
limitations:
- The paper's convergence analysis imposes assumptions and schedules; no unconditional convergence or
  benchmark advantage is claimed here.
- The record describes the original formulation; implementation-specific bias correction and numerical
  stabilizers require separate comparison.
