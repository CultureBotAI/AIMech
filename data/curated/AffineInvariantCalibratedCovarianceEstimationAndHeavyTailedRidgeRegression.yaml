limitations:
- 'Sample-Splitting Logarithmic Factor in Critical Sample Size and Lack of RKHS Extension: Because Algorithm
  1 splits the first half of the sample across q = ceil(log_2(L/lambda)) + 1 dyadic regularization halving
  stages, the critical sample size in Theorem 7 and Corollary 8 carries a logarithmic factor O(kappa^4
  log(L/lambda) df_lambda(S) log(d log(L/lambda)/delta)) even though the final estimation error bound
  uses the unsplit second half of size r >= n/2 and avoids the q factor. Furthermore, the matrix Bernstein
  concentration bounds depend logarithmically on the ambient dimension d (Remark 4), leaving infinite-dimensional
  reproducing kernel Hilbert space (RKHS) extensions open (Section 1.2).'
- 'Requirement of Fourth-Moment Kurtosis Equivalence and Initial Spectral Norm Bound L >= ||S||: The calibrated
  Loewner-order guarantees require directional fourth-moment equivalence E^{1/4}[<X, u>^4] <= kappa E^{1/2}[<X,
  u>^2] uniformly over u in R^d (excluding distributions with infinite fourth moments) and an initial
  upper bound L >= ||S|| to initialize the dyadic halving schedule lambda_0 = L.'
- 'Primary-Source Typographical Notes in Ostrovskii & Rudi (2019, COLT PMLR 99:2531-2550, arXiv:1902.03086v2):
  Verified five minor typographical/notational details in the published manuscript: (1) Abstract (p. 1)
  and Section 1 (p. 2) print ''statistically interesing regime'' instead of ''statistically interesting
  regime''; (2) Section 2.1 (p. 3) prints ''Goldon-Thompson inequality'' instead of ''Golden-Thompson
  inequality''; (3) Section 2.3 (p. 5) prints ''asymtptocially minimax-optimal'' instead of ''asymptotically
  minimax-optimal''; (4) Section 5 (pp. 10-11) prints ''Later on we will we show'', ''stastistical guarantee'',
  and ''a reasonables choice'', while Appendix B (p. 16) prints ''Wei-Misnker estimator'' instead of ''Wei-Minsker
  estimator''; and (5) Section 6.2 (p. 12, Eq. 33) writes rho_{theta_bar}(||Z_hat_i||^{1/2}) Z_hat_i where,
  because rho_theta(x) := psi_theta(x^2)/x^2 (Eq. 7) and Hermitian dilation psi_{theta_bar}(H(Z_hat_i))
  truncates singular values ||Z_hat_i|| at theta_bar (Appendix D, p. 19, Eq. 50), passing ||Z_hat_i||^{1/2}
  into rho_{theta_bar}(.) is the exact algebraic device that makes rho_{theta_bar}(||Z_hat_i||^{1/2})
  = psi_{theta_bar}(||Z_hat_i||) / ||Z_hat_i||.'
- All 20 pages of the full-text PDF of Ostrovskii & Rudi (2019, COLT PMLR 99:2531-2550, arXiv:1902.03086v2)
  were read. Constructed numerical checks in research/discovery/affine-invariant-heavy-tailed-covariance-estimation-boundaries.py
  verify (1) Lemma 14 dyadic effective-dimension doubling df_{lambda/2}(S) <= 2 df_lambda(S) and Lemma
  6 similarity eigenvalue bounds [2/3, 2] and trace surrogate control, (2) Algorithm 1 calibrated relative
  spectral error (0.1238 vs. 1.2996 for uncalibrated Wei-Minsker clipping on an ill-conditioned heavy-tailed
  Student-t_5 covariance) and Algorithm 2 Lepskii adaptive selection (0.1577), and (3) Theorem 13 / Appendix
  D ridge regression excess-risk decomposition.
