id: AIMech:AffineInvariantCalibratedCovarianceEstimationAndHeavyTailedRidgeRegression
name: Affine-Invariant Calibrated Covariance Estimation and Heavy-Tailed Ridge Regression
concept_kind: mathematical_method
aliases:
- Calibrated Heavy-Tailed Covariance Estimation via Dyadic Regularization Halving (Ostrovskii & Rudi 2019)
- Affine-Invariant Iterative Norm-Truncated Covariance Estimator
- Lepskii-Adaptive Calibrated Heavy-Tailed Covariance Estimator
- Heavy-Tailed Ridge Regression via Calibrated Covariance Preconditioning
definition: 'Affine-Invariant Calibrated Covariance Estimation and Heavy-Tailed Ridge Regression is a
  non-asymptotic statistical estimation and regression methodology introduced by Ostrovskii and Rudi (2019,
  COLT PMLR 99:2531-2550, arXiv:1902.03086v2) for estimating a population second-moment matrix S = E[X
  otimes X] in R^{d x d} from n independent copies of a heavy-tailed random vector X satisfying the directional
  fourth-moment kurtosis condition E^{1/4}[<X, u>^4] <= kappa E^{1/2}[<X, u>^2] for all u in R^d (Condition
  HT). Given a target regularization parameter lambda > 0 and regularized covariance S_lambda := S + lambda
  I_d, the methodology seeks a calibrated covariance estimate S_hat satisfying the affine-invariant relative
  Loewner-order approximation (1 - varepsilon) S_lambda <= S_hat_lambda <= (1 + varepsilon) S_lambda,
  equivalently ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}|| <= varepsilon, with error governed by the
  effective degrees of freedom df_lambda(S) := Tr(S S_lambda^{-1}) <= min{rank(S), Tr(S)/lambda} rather
  than ambient dimension d. Whereas standard norm-clipped estimators S_hat^WM = (1/n) sum_{i=1}^n rho_theta(||X_i||)
  X_i otimes X_i with rho_theta(x) = psi_theta(x^2)/x^2 break affine equivariance and fail to achieve
  calibrated accuracy when lambda << ||S||, Algorithm 1 approximates the unobservable oracle estimator
  S_hat^o = (1/n) sum_{i=1}^n rho_theta(||S_lambda^{-1/2} X_i||) X_i otimes X_i through a multi-stage
  dyadic regularization halving scheme: starting from lambda_0 = L >= ||S|| across T = ceil(log_2(L/lambda))
  halving steps (lambda_{t+1} = lambda_t / 2, q = T + 1) on disjoint sample-split batches of size m =
  floor(n / (2(T + 1))), it computes Cholesky factors R_t = Cholesky(S_hat_{lambda_t}^{(t)}) and reweights
  batch t+1 by alpha_i^{(t+1)} = rho_theta(||R_t^{-1} X_i^{(t+1)}||), followed by a final refinement on
  the remaining r >= n/2 samples in O(d^2 n + d^3 log(L/lambda)) time and O(d^2) space. Theorem 7 and
  Corollary 8 establish that for n >= 96^2 kappa^4 q df_lambda(S) log(4 q d/delta), S_hat achieves ||S_lambda^{-1/2}(S_hat
  - S)S_lambda^{-1/2}|| <= 48 kappa^2 sqrt(df_lambda(S) log(4d/delta) / n); Algorithm 2 and Theorem 10
  combine Algorithm 1 with Lepskii''s adaptive grid search over truncation levels theta_j = 2^j theta_min
  to adapt to unknown kappa and df_lambda(S); and Section 6 (Corollary 12 and Theorem 13) yields relative
  eigenvalue guarantees and optimal O(df_lambda(S) log(d/delta)/n + lambda^2 ||S_lambda^{-1/2} w^*||^2)
  excess risk for heavy-tailed ridge regression.'
identity_notes: Resolved against all 442 pinned AIO records and 617 maintained AIMech records. Distinct
  from AIMech:CatoniInfluenceFunctionTailRobustMeanAndGramMatrixEstimation (which studies Catoni M-estimator
  influence functions and matrix Catoni estimators achieving operator-norm bounds ||S_hat - S|| scaled
  by ||S|| or Tr(S) rather than affine-invariant calibrated bounds ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}||
  governed by df_lambda(S) via dyadic regularization halving), from AIMech:SubGaussianTournamentAndMedianOfMeansEmpiricalRiskMinimization
  (which studies tournament and median-of-means empirical risk minimization rather than iterative Cholesky-preconditioned
  norm-truncated covariance estimation and Lepskii adaptation), and from AIMech:SelfConcordantAndPseudoSelfConcordantFiniteSampleMEstimation
  (which studies self-concordant M-estimators under sub-Gaussian calibrated-design conditions rather than
  heavy-tailed fourth-moment covariance estimation).
