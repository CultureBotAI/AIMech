claims:
- claim_id: calibrated-covariance-problem-and-failure-of-uncalibrated-norm-clipping
  kind: mechanism
  statement: Under the fourth-moment kurtosis assumption Condition (HT) (E^{1/4}[<X, u>^4] <= kappa E^{1/2}[<X,
    u>^2] for all u in R^d), calibrated covariance estimation requires (1 - varepsilon) S_lambda <= S_hat_lambda
    <= (1 + varepsilon) S_lambda, equivalently ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}|| <= varepsilon,
    which simultaneously guarantees entrywise variance recovery (1 - varepsilon) S_{ii} <= S_hat_{ii}
    <= (1 + varepsilon) S_{ii} when lambda <= min_i S_{ii} and directional variance control uniformly
    over u in R^d with complexity governed by the effective degrees of freedom df_lambda(S) := Tr(S S_lambda^{-1})
    <= min{rank(S), Tr(S)/lambda}. Standard norm-truncated covariance estimators S_hat^WM = (1/n) sum_{i=1}^n
    rho_theta(||X_i||) X_i otimes X_i (Wei & Minsker 2017, Equations 6-8) achieve operator-norm error
    ||S_hat^WM - S|| = O(kappa^2 sqrt(||S|| Tr(S) log(d/delta) / n)), which provides calibrated guarantees
    only for lambda >= ||S|| because non-linear truncation of ||X_i|| breaks affine equivariance; whereas
    the idealized affine-invariant oracle estimator S_hat^o = (1/n) sum_{i=1}^n rho_theta(||S_lambda^{-1/2}
    X_i||) X_i otimes X_i achieves ||S_lambda^{-1/2}(S_hat^o - S)S_lambda^{-1/2}|| <= 6 kappa^2 sqrt(df_lambda(S)
    log(2d/delta) / n) for all lambda > 0 (Equations 10-13) since E[||S_lambda^{-1/2} X||^2 (S_lambda^{-1/2}
    X otimes S_lambda^{-1/2} X)] <= kappa^4 Tr(S S_lambda^{-1}) S_lambda^{-1/2} S S_lambda^{-1/2} <= kappa^4
    df_lambda(S) I_d.
  evidence:
  - source_id: ostrovskii2019-affine-invariant-cov-pdf
    locator: Section 1, pp. 1-3, Condition (HT), Equations (1)-(5); Section 2.3, pp. 4-6, Lemma 5, Equations
      (6)-(13)
    relation: supports
- claim_id: dyadic-regularization-halving-single-step-and-multistage-calibrated-bounds
  kind: mechanism
  statement: 'Lemma 14 establishes the dyadic effective-dimension doubling property df_{lambda/2}(S) <=
    2 df_lambda(S) for any positive semidefinite matrix S and lambda > 0. Lemma 6 proves that if a preliminary
    estimate S_hat satisfies ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}|| <= 1/2 (Event E), then (2/3)
    I_d <= S_lambda^{1/2} S_hat_lambda^{-1} S_lambda^{1/2} <= 2 I_d (Equation 35), |Tr(S S_hat_lambda^{-1})
    - df_lambda(S)| <= 3 df_lambda(S) (Equation 37), and reweighting an independent sample X_1^+,...,X_m^+
    via S_hat^{(+)} = (1/m) sum_{i=1}^m rho_theta(||S_hat_lambda^{-1/2} X_i^+||) X_i^+ otimes X_i^+ achieves
    calibrated accuracy at the halved regularization scale lambda/2: ||S_{lambda/2}^{-1/2}(S_hat^{(+)}
    - S)S_{lambda/2}^{-1/2}|| <= 6 theta log(2d/delta) / m with probability at least 1 - delta for theta
    >= 2 kappa^2 sqrt(m df_lambda(S) / log(2d/delta)) (Equations 16-17, Appendix B pp. 15-16). Algorithm
    1 iterates this halving step across T = ceil(log_2(L/lambda)) stages (q = T + 1) on disjoint batches
    of size m = floor(n / (2(T + 1))) using Cholesky factors R_t = Cholesky(S_hat_{lambda_t}^{(t)}) in
    O(d^2 n + d^3 log(L/lambda)) time and O(d^2) space, and Theorem 7 and Corollary 8 prove that for theta
    = theta_* := 2 kappa^2 sqrt(n df_lambda(S) / (q log(4 q d/delta))) and n >= 96^2 kappa^4 q df_lambda(S)
    log(4 q d/delta), the final refined estimator S_hat satisfies ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}||
    <= 48 kappa^2 sqrt(df_lambda(S) log(4d/delta) / n) with probability at least 1 - delta.'
  evidence:
