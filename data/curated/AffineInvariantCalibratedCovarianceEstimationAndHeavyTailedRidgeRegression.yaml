    locator: Sections 3-4, pp. 6-10, Algorithm 1, Lemma 6, Theorem 7, Corollary 8, Remark 9, Equations
      (15)-(26); Appendices A-B, pp. 15-16, Lemma 14, Equations (35)-(38)
    relation: supports
- claim_id: lepskii-adaptive-threshold-selection-for-unknown-kurtosis-and-effective-dimension
  kind: mechanism
  statement: To eliminate the dependence of the optimal truncation threshold theta_* on the unknown kurtosis
    parameter kappa and effective dimension df_lambda(S), Algorithm 2 (Section 5) runs Algorithm 1 over
    a geometric grid of candidate thresholds theta_j = 2^j theta_min for j in J = {0, 1, ..., ceil(log_2(theta_max
    / theta_min))} with theta_min = 2 sqrt(n / (q log(4 q d / delta))) and candidate error radii varepsilon_j
    = 12 theta_j log(4d/delta) / n, and selects the smallest index j_hat in J such that every finer candidate
    j' in J with j' >= j_hat satisfies the empirical calibrated compatibility condition ||S_hat_{j',lambda}^{-1/2}(S_hat_{j'}
    - S_hat_{j_hat})S_hat_{j',lambda}^{-1/2}|| <= 2(varepsilon_{j'} + varepsilon_{j_hat}) (Equation 28).
    Theorem 10 and Corollary 11 (Appendix C, pp. 16-17, Equations 39-43) prove that whenever theta_* in
    [theta_min, theta_max] and n >= 192^2 kappa^4 q df_lambda(S) log(4 q d |J| / delta), the selected
    estimator S_hat_{j_hat} achieves ||S_lambda^{-1/2}(S_hat_{j_hat} - S)S_lambda^{-1/2}|| <= 720 kappa^2
    sqrt((1 + rho) df_lambda(S) log(4 d |J| / delta) / n) with probability at least 1 - delta in total
    time O(|J|(d^2 n + d^3 log(L/lambda))).
  evidence:
  - source_id: ostrovskii2019-affine-invariant-cov-pdf
    locator: Section 5, pp. 10-11, Algorithm 2, Theorem 10, Corollary 11, Equations (27)-(30); Appendix
      C, pp. 16-17, Equations (39)-(43)
    relation: supports
- claim_id: relative-eigenvalue-recovery-and-heavy-tailed-ridge-regression-excess-risk
  kind: scope
  statement: As a consequence of calibrated covariance estimation, Corollary 12 (Section 6.1) shows via
    the Courant-Fischer minimax characterization that ||S_lambda^{-1/2}(S_hat - S)S_lambda^{-1/2}|| <=
    varepsilon implies relative eigenvalue bounds (1 - varepsilon) lambda_i - varepsilon lambda <= lambda_hat_i
    <= (1 + varepsilon) lambda_i + varepsilon lambda for all i in {1,...,d}, and hence (1 - 2 varepsilon)
    lambda_i <= lambda_hat_i <= (1 + 2 varepsilon) lambda_i for every eigenvalue lambda_i >= lambda. In
    heavy-tailed random-design linear regression (Section 6.2, Theorem 13, Appendix D pp. 17-20) where
    w^* = argmin_{w in R^d} L(w) with L(w) = E[(<X, w> - Y)^2], v^2 := L(w^*), and E[(<X, w^*> - Y)^4]
    <= varkappa^4 v^4, constructing S_hat via Algorithm 1 on a hold-out half X_{n+1},...,X_{2n} and forming
    the truncated pseudo-decorrelated response vector Z_bar = (1/n) sum_{i=1}^n rho_{theta_bar}(||Z_hat_i||^{1/2})
    Z_hat_i with Z_hat_i = S_hat_lambda^{-1/2} X_i Y_i and theta_bar = 2 sqrt(6) kappa varkappa v sqrt(n
    df_lambda(S) / log(2d/delta)) yields the ridge estimator w_bar_lambda = S_hat_lambda^{-1/2} Z_bar
    satisfying L(w_bar_lambda) - L(w^*) <= O(1) ((kappa^4 + kappa^2 varkappa^2) v^2 df_lambda(S) log(2d/delta)
    / n + lambda^2 ||S_lambda^{-1/2} w^*||^2) whenever n >= C kappa^4 log(L/lambda) df_lambda(S) log(2d
    log(L/lambda) / delta) (Equation 34).
  evidence:
  - source_id: ostrovskii2019-affine-invariant-cov-pdf
    locator: Section 6, pp. 11-12, Corollary 12, Theorem 13, Equations (31)-(34); Appendix D, pp. 17-20,
      Equations (44)-(50)
    relation: supports
