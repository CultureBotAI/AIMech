claims:
- claim_id: method
  kind: mechanism
  statement: For a fixed K, positive alpha_i and normalized topic-word probability rows B_i, draw theta_d~Dirichlet(alpha)
    independently for each document. Given a document length N_d, draw z_dn~Categorical(theta_d) and w_dn~Categorical(B_zdn)
    for each token. Conditional on theta_d and B, token probabilities are sum_i theta_di*B_iw and tokens
    are independent; integrating theta_d gives p(w_d|alpha,B)=integral Dir(theta_d;alpha)*product_n(sum_i
    theta_di*B_i,w_dn)dtheta_d. This is an exchangeable document distribution, generally with dependent
    tokens after integration. An unordered count vector additionally includes its multinomial multiplicity.
    The paper’s Poisson length law is optional to this conditional construction. For fixed B, its mean-field
    approximation is q(theta,z)=Dir(theta;gamma)*product_n Cat(z_n;phi_n), with phi_ni proportional B_i,w_n*exp[digamma(gamma_i)-digamma(sum_j
    gamma_j)] and gamma_i=alpha_i+sum_n phi_ni. Variational EM optimizes the evidence lower bound, updating
    B from expected topic-word counts and alpha numerically. Section 5.4 separately places Dirichlet priors
    on B; then the assignment update uses expected log topic probabilities, not fixed B values.
