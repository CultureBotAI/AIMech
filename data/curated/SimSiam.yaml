name: SimSiam
definition: A self-supervised representation-learning procedure that trains a shared encoder and predictor
  to match the encoder output of another augmented view using symmetric negative cosine similarity with
  stopped gradients on each target output.
concept_kind: algorithm
identity_notes: This is Chen and He’s SimSiam procedure, not generic Siamese-network architecture or a
  checkpoint. The two views share encoder weights directly; the target output is detached only for its
  directional loss. There is no separately averaged target encoder or explicit negative-pair term. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 191 prior native
  IDs/names/aliases. Ignored-inclusive searches of both full checkouts found only prior discovery leads
  (four hits per checkout) and one unrelated main-environment DFSWAVE token. Neighboring SimCLR, MoCo,
  BYOL and DINO procedures and exact AIO definitions/edges were inspected; shared components do not establish
  identity.
limitations:
- Stop-gradient changes the optimization dynamics but does not remove constant representations from the
  numerical loss’s minimizers. Section 5.3 explicitly treats noncollapse as empirical and says the alternating-optimization
  hypothesis does not explain its prevention.
- The predictor is trained; removing it or fixing random predictor weights is not the defined procedure.
  A symmetric target stop does not mean a branch never receives gradients.
- Batch normalization, augmentation, architecture, optimizer and scheduling affect the reported results.
  Absence of explicit negative pairs does not imply independent per-example learning when batch statistics
  are used.
- The record covers the original symmetric cosine formulation. Asymmetric, cross-entropy and multistep-alternation
  experiments are not silently made equivalent. Nonzero-norm handling is required; no universal performance
  or convergence guarantee is asserted.
