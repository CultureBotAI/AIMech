claims:
- claim_id: method
  kind: mechanism
  statement: Generate two augmented views v1 and v2 of each image. A shared encoder f, including backbone
    and projection MLP, produces z1=f(v1) and z2=f(v2); a shared prediction MLP h produces p1=h(z1) and
    p2=h(z2). For nonzero vectors let D(p,z)=−(p/||p||)·(z/||z||). Average [D(p1,stopgrad(z2))+D(p2,stopgrad(z1))]/2
    over images and update f and h by gradients. Each view’s encoder output is constant on its target
    side but receives gradients through its prediction side in the opposite term. The original procedure
    uses no momentum-averaged encoder, negative dictionary or clustering assignment step.
