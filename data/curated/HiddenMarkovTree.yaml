claims:
- claim_id: method
  kind: mechanism
  statement: Specify a normalized root law pi(x_r), normalized transitions A_s(x_s|x_parent(s)) and normalized
    local emissions b_s(y_s|x_s). Then p(x,y)=pi(x_r)*product_nonroot A_s*product_s b_s. At a site without
    an observation use emission factor1. For finite hidden states, an upward likelihood message is L_s(x_s)=b_s(y_s|x_s)*product_child_t
    sum_(x_t) A_t(x_t|x_s)*L_t(x_t). The root posterior is proportional to pi*L_r, and each child posterior
    conditional is proportional to A_t*L_t for fixed parent. Propagating the root posterior downward gives
    node and edge marginals. Replacing child sums with maxima and retaining maximizing states yields joint
    MAP by backtracking; independently maximizing node marginals gives MPM and can select a different
    configuration. Exact node and edge posterior expectations permit an EM parameter update for a specified,
    properly normalized tree model. The source instantiates the tree as a quadtree, with optional observation
    levels and optional parameter tying across scales.
