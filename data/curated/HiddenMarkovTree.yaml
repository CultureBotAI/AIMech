name: Hidden Markov tree
definition: A latent-variable model on a fixed rooted tree in which hidden states factor into a root distribution
  and conditionally independent parent-to-child transitions, with observations emitted independently by
  their corresponding hidden states.
concept_kind: model_family
identity_notes: This record uses the classical independent-emission meaning of hidden Markov tree, exemplified
  by the inspected quadtree image model. The tree describes stochastic dependencies between sites or scales;
  it is not a decision tree, a hierarchical mixture-of-experts gate tree or the within-time hierarchy
  of a hidden Markov decision tree. It is a restricted pairwise Markov tree with kernels A(x_child|x_parent)*b(y_child|x_child).
  Some pairwise-tree literature uses hidden Markov tree more broadly for a Markov hidden marginal with
  correlated observations; that broader usage is not equated with this independent-emission definition.
  A path is an HMM special case; branching is permitted. No normalized identity match was found across
  all 442 pinned AIO labels and all scoped synonyms and 394 preceding native IDs, names and aliases for
  these three concepts. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, yielding 64 and 64 matched lines; all 44 unique contents were read. Hits represent neighboring
  records, citations and discovery leads rather than records of these identities. All 97 semantic label/synonym
  hits were read. Twenty-one fully annotated exact CLASS nodes and outgoing edges were verified identical
  to the preceding inspection, and three additional nodes were read. Twenty-eight contextual YAMLs were
  byte-verified after prior full reading and four freshly read, totaling 24 generated and eight native
  contextual records. Short acronyms were included in the complete normalized identity comparison. The
  absence assessment is bounded to the pin, native collection and inspected semantic neighborhood.
limitations:
- The record is scoped to independent child transitions and independent site emissions on a fixed finite
  rooted tree. Coupled siblings, loopy graphs, correlated emissions and learned topology require additional
  constructions. A causal tree factorization here expresses conditional probability, not intervention
  semantics.
- Generic dense transitions with K hidden states require O(number_of_edges*K^2) arithmetic for the sum-product
  pass; linearity in sites assumes a fixed state count. Source complexity statements linear in K are not
  adopted for arbitrary dense kernels. Positive evidence and careful support handling are required; numerical
  scaling reduces but does not eliminate all numerical risks.
- The source’s Equation(10) omits the complement needed for a minimized Hamming loss, and Figure4 prints
  argmin where Equation(11) correctly uses argmax of a posterior. Its preliminary prior pass requires
  root-to-leaf order. This record uses consistent sum-product/max-product semantics rather than those
  literal displays.
- For Equation(17)’s shared same-state transition probability theta, the unconstrained EM update is expected
  same-state edge count divided by edge count. Equations(26)–(27) print an extra state-count divisor,
  conflicting with the earlier theta>1/K restriction. Active parameter constraints, zero expected counts
  and emission degeneracy need separate treatment.
- The exact posterior factorization in Equation(29) supports ancestral sampling after subtree messages.
  The experimental H-MCEM uses a local-observation conditioning shortcut and constructed coarse observations;
  those samples are not certified exact draws from the original posterior. SMAP is a different loss with
  an approximate procedure, not an alias for exact joint MAP or MPM.
- Quadtree image priors can create location-dependent block artifacts. EM remains initialization-sensitive
  and need not find a global optimum. The selected synthetic, flood and microscopy examples establish
  application context, not universal segmentation superiority, a modern benchmark or a reproduced implementation.
