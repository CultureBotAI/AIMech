claims:
- claim_id: method
  kind: mechanism
  statement: On a finite graph with X_i>=0, choose alpha_i>0 and symmetric gamma_ij=gamma_ji>=0, with
    gamma_ij=0 on nonedges. The full-conditional density is r_i*exp(-r_i*x_i), where r_i=alpha_i+sum_(j!=i)
    gamma_ij*x_j and the conditional mean is 1/r_i. Combining this conditional form with the source pairwise
    representation gives p(x)=Z^(-1)*exp[-sum_i alpha_i*x_i-sum_(i<j) gamma_ij*x_i*x_j]. Each edge is
    counted once. The nonnegative interaction penalty bounds the unnormalized joint density by the product
    of integrable exp(-alpha_i*x_i) terms, establishing a finite positive Z in this regime. Increasing
    a neighbor value cannot increase the site conditional mean with other neighbors fixed. Zero interactions
    reduce the law to independent exponentials.
