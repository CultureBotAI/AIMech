name: Interpolation consistency training
definition: A semi-supervised training procedure that encourages a student’s prediction at an interpolated
  pair of unlabeled inputs to match the same interpolation of predictions from a moving-average teacher,
  while also fitting labeled examples.
concept_kind: algorithm
identity_notes: The original IJCAI2019 procedure uses interpolated unlabeled inputs and interpolated EMA-teacher
  probabilities. Mean Teacher compares perturbed versions of one input; MixUp interpolates observed targets;
  MixMatch builds sharpened guesses and a combined mixing pool. These are related components and procedures,
  not equivalent names. This record uses the five-author conference version and does not import theory
  claims from the later expanded seven-author version. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 234 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main checkout, returning 21 lines in
  each from prior discovery and the related MixMatch record. Twelve exact AIO CLASS nodes, their scoped
  synonyms and outgoing edges, plus six neighboring native mechanisms were inspected. This absence assessment
  is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- Low-density boundary motivation depends on cluster and interpolation assumptions and is not a universal
  guarantee that arbitrary input mixtures lie in low-density regions.
- Incorrect teacher targets can be propagated by interpolation; the EMA and consistency ramp do not establish
  target correctness.
- The published pre-step EMA order is recorded explicitly; initialization, normalization and alternative
  implementation scheduling require version-specific evidence.
- The paper’s general discrepancy and mixing distribution permit variants, but the cited experimental
  choices are MSE and a symmetric Beta distribution. No benchmark or implementation reproduction is claimed.
