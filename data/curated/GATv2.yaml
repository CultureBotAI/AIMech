claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: Concatenate query and neighbor features, apply a learned affine transformation and LeakyReLU,
    and then project to an attention score; normalize scores over the neighborhood with softmax and use
    them to aggregate transformed neighbor features.
