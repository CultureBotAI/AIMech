name: Graph attention network v2
definition: A graph neural architecture whose neighborhood attention scorer applies a learned scalar projection
  after a nonlinear transformation of the query-neighbor pair, allowing attention rankings to depend on
  the query node.
concept_kind: architecture
identity_notes: GATv2 changes the scoring-function operation order of the original GAT. It is a distinct
  architecture, not a software version label or a synonym for every graph attention network.
limitations:
- Dynamic attention is an expressiveness property of the parameterized scorer, not a guarantee that any
  trained instance learns useful node-specific rankings.
- This record supports the architecture and operation order, not universal benchmark superiority or a
  causal interpretation of attention coefficients.
