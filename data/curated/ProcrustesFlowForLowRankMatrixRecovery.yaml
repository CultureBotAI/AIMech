claims:
- claim_id: claim-procrustes-distance-spectral-alignment-and-lifted-symmetric-perturbation
  kind: mechanism
  statement: For the orthogonal Procrustes distance $d(U,X_0) = \min_{R\in O(r)}\|U - X_0 R\|_F$ with optimal aligner $R = A B^\top$ from the SVD $X_0^\top U = A\Sigma B^\top$ (so $U^\top X_0 R \succeq 0$ is symmetric PSD), Lemma 5.4 establishes the key quadratic perturbation bound $\|U U^\top - X_0 X_0^\top\|_F^2 \ge 2(\sqrt{2}-1)\sigma_r^2(X_0)\|\Delta\|_F^2$ ($\Delta = U - X_0 R$); for rectangular factors $W = [U;V]$ and $W_0 = [X_0;Y_0]$ ($X_0^\top X_0 = Y_0^\top Y_0 = \Sigma_0$), decomposing $W W^\top - W_0 W_0^\top$ shows that off-diagonal product error $\|U V^\top - X^*\|_F^2$ controls $\|W W^\top - W_0 W_0^\top\|_F^2$ once the factor imbalance $\|U^\top U - V^\top V\|_F^2$ is penalized via the algebraic identity $\|W^\top W\|_F^2 - 4\|U V^\top\|_F^2 = \|U^\top U - V^\top V\|_F^2$ (Lemma 5.3, Section 5.6.2).
  evidence:
  - source_id: tbssr2016-procrustesflow-pdf
    locator: Section 2.2 & Section 5.1, Equations 2.4 & 5.2, pp. 4, 9; Section 5.4-5.6, Lemmas 5.3 & 5.4, pp. 13-16
    relation: supports
  - source_id: tbssr2016-procrustesflow-abs
    locator: Abstract
    relation: supports
- claim_id: claim-balanced-objective-local-regularity-condition-and-linear-contraction
  kind: mechanism
  statement: Under the rank-$6r$ Restricted Isometry Property $\delta_{6r} \le 1/25$ (Definition 2.1), Lemma 5.10 proves that the balanced rectangular objective $F(W) = \frac{1}{2}\|\mathcal{A}(U V^\top) - b\|_2^2 + \frac{1}{16}\|U^\top U - V^\top V\|_F^2$ satisfies the local regularity condition $\langle\nabla F(W),\Delta\rangle \ge \alpha\|\Delta\|_F^2 + \beta\|\nabla F(W)\|_F^2$ with $\alpha = \frac{\sigma_r(X^*)}{5}$ and $\beta = \frac{1}{100\sigma_1(X^*)}$ for all $d(W,W_0) \le \frac{1}{4}\sigma_r(X^*)^{1/2}$, which implies $d^2(W_{\tau+1},W_0) \le (1 - 2\alpha\mu)d^2(W_\tau,W_0)$ for step size $\mu \le \beta = \frac{1}{100\sigma_1(X^*)}$, giving linear convergence $d(W_\tau,W_0) \le (1 - \frac{1}{500\kappa})^{\tau/2} d(W_0^{\mathrm{init}},W_0)$ and $\|U_\tau V_\tau^\top - X^*\|_F \le \frac{5}{4}\sigma_1(X^*)^{1/2} d(W_\tau,W_0)$ (Theorems 2.3 & 5.2).
  evidence:
  - source_id: tbssr2016-procrustesflow-pdf
    locator: Section 2.2, Theorem 2.3, p. 5; Section 5.1 & 5.3-5.6, Theorem 5.2 & Lemmas 5.8-5.10, pp. 10-16
    relation: supports
  - source_id: tbssr2016-procrustesflow-cr
    locator: PMLR Volume 48 (ICML 2016) metadata and abstract pp. 964-973
    relation: supports
- claim_id: claim-svp-initialization-sample-complexity-saving-kappa-squared-factor
  kind: scope
  statement: Whereas single-shot spectral initialization $P_r(\mathcal{A}^*(b))$ requires $m \ge C \kappa^2 r(n_1+n_2)$ Gaussian measurements to enter the $O(\sigma_r^{1/2})$ Procrustes contraction basin, running $T = O(\log(r\kappa))$ iterations of Singular Value Projection (projected gradient descent) $Z_{t+1} = P_r(Z_t - \tau_t\mathcal{A}^*(\mathcal{A}(Z_t)-b))$ in Phase I enters the basin using only $m \ge C r(n_1+n_2)$ measurements independent of condition number $\kappa = \sigma_1(X^*)/\sigma_r(X^*)$ (Theorems 3.1, 3.2, 5.1 & Lemma 5.1).
  evidence:
  - source_id: tbssr2016-procrustesflow-pdf
    locator: Section 3, Theorems 3.1 & 3.2, pp. 5-7; Section 5.1-5.2, Theorem 5.1 & Lemma 5.1, pp. 10-12
    relation: supports
- claim_id: claim-limitation-condition-number-kappa-dependence-in-iteration-complexity
  kind: limitation
  statement: Although Phase I projected gradient initialization removes $\kappa^2$ from the sample complexity $m = O(r(n_1+n_2))$, the Phase II Procrustes Flow step size $\mu \le \frac{c}{\sigma_1(X^*)}$ and regularity parameter $\alpha = \frac{\sigma_r(X^*)}{5}$ yield a per-iteration contraction factor $1 - O(1/\kappa)$, requiring $O(\kappa\log(1/\epsilon))$ iterations that slows down on severely ill-conditioned matrices.
  evidence:
  - source_id: tbssr2016-procrustesflow-pdf
    locator: Section 2.2, Theorem 2.3, p. 5; Section 3.1, Remark on computational complexity, p. 7
    relation: supports
