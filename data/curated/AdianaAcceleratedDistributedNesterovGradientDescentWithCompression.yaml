claims:
- claim_id: r390-single-node-acgd-sqrt-kappa-and-sqrt-eps-rates
  kind: mechanism
  statement: Theorem 2 proves that coupling Nesterov momentum x^k = theta_k y^k + (1 - theta_k) z^k with an omega-unbiased compressor C(nabla f(x^k)) in ACGD (Algorithm 1) reduces single-node compressed gradient descent complexity from O((1 + omega) * (L/mu) log(1/eps)) to O((1 + omega) * sqrt(L/mu) log(1/eps)) for mu-strongly convex objectives, and Theorem 3 proves an O((1 + omega) * sqrt(L/eps)) rate for general smooth convex objectives.
  evidence:
  - source_id: r390-primary-pdf
    locator: Section 3 Algorithm 1, Theorem 2, and Theorem 3, pp. 4-5
    relation: supports
- claim_id: r390-distributed-adiana-accelerated-complexity-and-free-compression-regime
  kind: mechanism
  statement: "By decoupling gradient difference compression at x^k from shift-memory updates at the loopless reference w^k (Lemmas 2-3: E_k||g^k - nabla f(x^k)||^2 <= (2*omega/n)*(2*L*D_f(x^k, w^k) + H^k) and E_k[H^{k+1}] <= (1 - alpha) H^k), Theorem 4 proves that ADIANA (Algorithm 2) converges in O((omega + sqrt(L/mu) + sqrt((omega/n + sqrt(omega/n)) * omega * L / mu)) log(1/eps)) communication rounds\u2014matching uncompressed Nesterov accelerated gradient descent O(sqrt(L/mu) log(1/eps)) whenever the compression variance satisfies omega <= O(min{n^{1/3}, sqrt(L/mu)})."
  evidence:
  - source_id: r390-primary-pdf
    locator: Section 4 Algorithm 2, Theorem 4, Table 1, and Section 5 Lemmas 2-5, pp. 2, 5-8
    relation: supports
- claim_id: r390-dual-compression-and-convexity-requirement-limitation
  kind: limitation
  statement: ADIANA requires each worker i to evaluate two gradients (nabla f_i(x^k) and nabla f_i(w^k)) and transmit two compressed difference vectors (m_i^k and c_i^k) per iteration, and its Nesterov three-sequence coupling relies on convexity (mu >= 0) and exact/full-batch local gradients.
  evidence:
  - source_id: r390-primary-pdf
    locator: Section 4 Algorithm 2 Steps 4-6 and Theorem 4 assumptions, pp. 6-7
    relation: supports
- claim_id: r390-ill-conditioned-distributed-regularized-classification-application
  kind: application
  statement: Applied to ill-conditioned distributed L2-regularized logistic regression on LIBSVM benchmarks (a9a, w8a, mushrooms, phishing) with natural dithering and random sparsification compressors, achieving orders-of-magnitude faster convergence than DIANA, QSGD, TernGrad, and EF-SGD.
  evidence:
  - source_id: r390-primary-pdf
    locator: Section 6 Experiments, Figures 1-2, pp. 8-9
    relation: supports
