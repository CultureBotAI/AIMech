claims:
- claim_id: udapter-uriel-typology-mlp-and-contextual-parameter-generator
  kind: mechanism
  statement: UDapter maps a 289-dimensional binary URIEL typology vector l_t (103 syntactic, 28 phonological, and 158 phonetic inventory features) through a two-layer ReLU network l_e = MLP^(lang)(l_t) in R^M (M=32) and generates all frozen-mBERT adapter weights theta^(ad) in R^{P^(ad)} and biaffine parser weights theta^(bf) in R^{P^(bf)} via the linear contraction g^(m)(l_e) = (W^(ad), W^(bf)) . l_e.
  evidence:
  - source_id: r714-primary-pdf
    locator: Section 3.3-3.4, Equations (6)-(7), Figure 1, p. 4
    relation: supports
- claim_id: udapter-language-count-independent-parameter-complexity
  kind: mechanism
  statement: Because the Contextual Parameter Generator matrices W^(ad) in R^{P^(ad) x M} and W^(bf) in R^{P^(bf) x M} depend only on the language embedding dimension M=32 and not on the number of languages, UDapter's total parameter count remains constant at 550M (302M for adapters and 248M for biaffine attention) regardless of the number of languages, compared to 2.5B (13 x 191M) for 13 monolingual UDify models.
  evidence:
  - source_id: r714-primary-pdf
    locator: Appendix A.1, p. 13
    relation: supports
- claim_id: udapter-high-resource-and-zero-shot-universal-dependency-parsing
  kind: application
  statement: On Universal Dependencies parsing across 13 typologically diverse high-resource languages and 30 zero-shot low-resource languages, UDapter achieves 87.3 average high-resource LAS (outperforming multi-udify at 83.0, mono-udify at 86.0, and adapter-only at 85.0) and 36.5 average zero-shot LAS, whereas replacing URIEL typological features with a centroid of learned language embeddings collapses zero-shot LAS from 36.5 to 9.0.
  evidence:
  - source_id: r714-primary-pdf
    locator: Section 4.1 & Section 5.2, Tables 1-2 & Figure 4a, pp. 5-7, 13
    relation: supports
  - source_id: r714-metadata-cr
    locator: EMNLP 2020 bibliographic record
    relation: supports
- claim_id: udapter-cpg-tensor-memory-and-knn-imputed-typology-limitation
  kind: limitation
  statement: Multiplying the adapter and biaffine parameter tensors by the language embedding dimension M=32 in the ungrouped CPG formulation increases the single-model parameter footprint from 191M (UDify) to 550M, and zero-shot languages with missing URIEL database entries rely on k-nearest-neighbor imputed typological features.
  evidence:
  - source_id: r714-primary-pdf
    locator: Section 3.3-3.4 & Appendix A.1, Footnotes 3-4, pp. 4-5, 13
    relation: supports
