limitations:
- Generating unfactored adapter and biaffine weights via CPG multiplies the trainable parameter tensor size by the language embedding dimension M (32 x 9.4M = 302M for adapters and 32 x 7.8M = 248M for biaffine attention).
- Zero-shot transfer quality depends on the completeness and accuracy of URIEL typological features, requiring k-NN imputation across genetic, geographical, and feature distances when database features are missing.
- Without CPG and typological conditioning, simply doubling adapter bottleneck size from 1024 to 2048 degrades zero-shot cross-lingual transfer due to overfitting to in-training languages.
