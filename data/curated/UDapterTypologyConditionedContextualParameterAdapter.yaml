id: AIMech:UDapterTypologyConditionedContextualParameterAdapter
name: UDapter Typology-Conditioned Contextual Parameter Adapter
concept_kind: architecture
review_status: DRAFT
definition: A multilingual language-adaptation architecture that freezes a pre-trained multilingual Transformer encoder (mBERT) and generates both layer-wise bottleneck adapter parameters theta^(ad) and top-level biaffine attention parser parameters theta^(bf) via a linear Contextual Parameter Generator g^(m)(l_e) = (W^(ad), W^(bf)) . l_e conditioned on a language embedding l_e = MLP^(lang)(l_t) in R^M projected from a 289-dimensional URIEL typological feature vector l_t comprising syntactic, phonological, and phonetic inventory features.
identity_notes: Introduced by Ahmet Ustun, Arianna Bisazza, Gosse Bouma, and Gertjan van Noord (EMNLP 2020, pp. 2302-2315, arXiv:2004.14327) as UDapter. Distinct from MAD-X (AIMech:MADXMultipleAdaptersForCrossLingualTransfer), which trains separate per-language MLM adapters rather than generating adapter and parser weights from URIEL typological features via a Contextual Parameter Generator; and from HyperFormer (AIMech:HyperFormerSharedHypernetworkAdapter), which generates multi-task NLU adapters from learned task/layer embeddings without linguistic typology vectors or biaffine head generation.
aliases:
- UDapter
- UDapter Contextual Parameter Generator Adapter
- Typology-Conditioned Contextual Parameter Generation Adapter
