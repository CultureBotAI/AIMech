claims:
- claim_id: method
  kind: mechanism
  statement: For an observed configuration x and a compatible family p_theta with well-defined full conditionals,
    form PL(theta;x)=product_i p_theta(x_i|x_(-i)) and maximize sum_i log p_theta(x_i|x_(-i)) over the
    admissible parameter space. In a Markov field, each factor depends only on the site’s neighbors; a
    global joint partition function cancels from that factor, although its local normalizer still must
    be evaluated. If the sites are partitioned into nonneighbor coding sets, the log pseudolikelihood
    is the sum of their conditional log likelihoods. This identity combines objectives, not the separately
    fitted parameter values. For the source’s proper common-conditional-variance Gaussian model with mean
    D*a, symmetric B=I-phi*H and variance sigma^2, the residual term is (x-D*a)^T B^2(x-D*a)/sigma^2.
    Its joint Gaussian likelihood instead includes log|B| and a single-B quadratic. Complete independence
    is a special case in which the product of full conditionals equals the joint likelihood.
