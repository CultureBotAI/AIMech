claims:
- claim_id: method
  kind: mechanism
  statement: Choose minimum and maximum resources r and R, a reduction factor eta, and starting-level
    offset s. Resource at rung k is r*eta^(s+k). Dispatch work to free workers and record completed rung
    losses. In the author dissertation’s Algorithm 3, scan promotable rungs from the highest eligible
    level downward, stopping below the maximum-resource rung. At each level, consider the currently best
    approximately 1/eta fraction of completed configurations and select an eligible one that has not already
    been promoted. If the entire scan yields none, sample a new configuration for the base rung. Thus
    the starting cohort can grow and promotions do not wait for every job at a rung. Promoted configurations
    may later fall outside the hindsight top fraction as additional results arrive. Checkpointing can
    reuse a trial’s previous training; it is distinct from copying weights between different configurations.
    The maximum resource limits promotion depth in this bounded version.
