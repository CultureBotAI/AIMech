name: Asynchronous Successive Halving
definition: An asynchronous resource-allocation algorithm that promotes promising completed hyperparameter
  trials through increasing resource levels as workers become available and starts new trials when no
  eligible promotion is available, without waiting for an entire evaluation stage to finish.
concept_kind: algorithm
identity_notes: ASHA is the asynchronous promotion procedure, not every early-stopping scheduler, the
  complete distributed training system, or a synonym for Hyperband or BOHB. A rung contains evaluations
  at one resource level; a bracket sets the starting resource and rung schedule. Multiple ASHA brackets
  can implement asynchronous Hyperband, while a single ASHA bracket does not include that wrapper. The
  source’s bounded promotion variant is the primary scope here. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 259 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  26 lines in each checkout. These were prior candidate leads, source references and neighboring-method
  mentions, not existing records for these identities. Nine exact AIO CLASS nodes with synonyms and outgoing
  edges and six neighboring native mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.
limitations:
- The MLSys PDF’s Algorithm 2 places the new-trial fallback inside its descending-rung loop. The author’s
  dissertation Algorithm 3 places it after that loop, consistent with the method prose. The record follows
  the latter and retains the discrepancy; it does not claim byte-equivalent pseudocode or an author-issued
  erratum.
- The top-fraction notation does not specify every discrete rounding, tie or failed-job policy. The literal
  schedule reaches r*eta^floor(log_eta(R/r)), which equals R only when the ratio aligns with a power of
  eta; implementations must define any terminal-budget adjustment.
- Early rankings and completion order can affect promotions. The paper’s discussion of vanishing mispromotions
  is not imported as an unconditional theorem for dependent upper-rung observations. No universal parallel
  speedup or finite-budget optimum is asserted.
- Only the declared methods and dissertation pages were inspected. System-specific scheduling, autoscaling,
  benchmark results and executable implementations are outside this record’s claims.
