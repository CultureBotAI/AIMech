claims:
- claim_id: matdot-column-row-block-polynomial-encoding-and-systematic-lagrange-construction
  kind: mechanism
  statement: MatDot splits A vertically into m column-blocks A_i in F^{N x (N/m)} and B horizontally into m row-blocks B_j in F^{(N/m) x N}, encodes p_A(x) = sum_{i=0}^{m-1} A_i x^i and p_B(x) = sum_{j=0}^{m-1} B_j x^{m-1-j}, and recovers AB = sum_{i=0}^{m-1} A_i B_i as the coefficient of x^{m-1} in the degree-(2m - 2) polynomial p_C(x) = p_A(x) p_B(x) from any 2m - 1 workers (Construction 1, Theorem 1); Systematic MatDot (Construction 2, Lemma 1, Theorem 2) uses Lagrange basis polynomials L_i(x) so the first m workers directly output A_{r-1} B_{r-1} while retaining the 2m - 1 worst-case recovery threshold.
  evidence:
  - source_id: r541-primary-pdf
    locator: Section III, Construction 1, Equations (2)-(4) & Theorem 1, pp. 4-5; Section IV, Construction 2, Equations (6)-(8), Lemma 1 & Theorem 2, pp. 7-8
    relation: supports
- claim_id: polydot-communication-recovery-threshold-interpolation-and-n-matrix-theorems
  kind: scope
  statement: For any factorization st = m dividing N, PolyDot(m, s, t) splits A into a t x s grid and B into an s x t grid and uses the bijection f(alpha, beta, gamma) = alpha + t beta + t(2s - 1) gamma (Lemma 2, Equation 13) to achieve recovery threshold k = t^2(2s - 1) with per-worker communication O(N^2 / t^2) (Theorem 3), interpolating between MatDot (s = m, t = 1, k = 2m - 1) and Polynomial Codes (s = 1, t = m, k = m^2); Theorems 4-6 extend this construction to one-round coded multiplication of n >= 3 matrices with recovery threshold 2m^{n/2} - 1 for even n and (m + 1)m^{floor(n/2)} - 1 for odd n.
  evidence:
  - source_id: r541-primary-pdf
    locator: Section V, Construction 3, Lemma 2, Theorem 3 & Table I, pp. 9-11; Section VI, Constructions 4-5 & Theorems 4-6, pp. 12-17
    relation: supports
- claim_id: matdot-worker-to-fusion-communication-expansion-and-tensor-product-decoding-limitation
  kind: limitation
  statement: Reducing the recovery threshold from m^2 to 2m - 1 in MatDot increases the per-worker output dimension from (N/m) x (N/m) to a full N x N matrix (increasing total worker-to-fusion communication from O(N^2) to O(m N^2)), and when coded computing is applied to operations whose output size matches their O(N^4) computational complexity (such as Kronecker tensor products A otimes B), fusion-node decoding overhead Theta(N^4 log^2 m) becomes a bottleneck (Section VII-A).
  evidence:
  - source_id: r541-primary-pdf
    locator: Section III-B & III-C, p. 6; Section VII-A, pp. 18-19
    relation: supports
- claim_id: matdot-polydot-fault-tolerant-distributed-linear-algebra-and-deep-network-application
  kind: application
  statement: Applied to straggler- and fault-tolerant distributed matrix-matrix multiplication, chained multi-matrix products D^(1) D^(2) ... D^(n), and coded deep neural network training on unreliable compute clusters.
  evidence:
  - source_id: r541-primary-pdf
    locator: Section I, pp. 1-2; Section V, Figure 6, p. 10; Section VI, pp. 12-17
    relation: supports
