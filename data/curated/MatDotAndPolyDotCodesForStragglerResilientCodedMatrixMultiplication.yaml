id: AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication
name: MatDot and PolyDot Codes for Straggler-Resilient Coded Matrix Multiplication
concept_kind: algorithm
review_status: DRAFT
definition: "A family of algebraic coded matrix-multiplication schemes proposed by Dutta, Fahim, Haddadpour, Jeong, Cadambe, and Grover (2017/2020) that reduces the straggler recovery threshold for distributed multiplication AB of N x N matrices under a 1/m per-worker storage constraint from m^2 (in Polynomial Codes) down to 2m - 1 in MatDot Codes\u2014by partitioning A vertically into m column-blocks [A_0, ..., A_{m-1}] and B horizontally into m row-blocks [B_0^T, ..., B_{m-1}^T]^T, encoding p_A(x) = sum_{i=0}^{m-1} A_i x^i and p_B(x) = sum_{j=0}^{m-1} B_j x^{m-1-j}, and recovering AB = sum_{i=0}^{m-1} A_i B_i as the coefficient of x^{m-1} in p_A(x) p_B(x)\u2014and unifies MatDot and Polynomial Codes via PolyDot(m, s, t) Codes (with st = m) to trade off worker-to-fusion communication cost O(N^2 / t^2) against recovery threshold k = t^2(2s - 1)."
identity_notes: 'Distinct from Polynomial Codes (AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication, which split A horizontally and B vertically into outer-product blocks requiring recovery threshold m^2 with O(N^2 / m^2) per-worker output communication). Dutta et al. (Allerton 2017 / IEEE Trans. Inf. Theory 2020 / arXiv:1801.10292, Constructions 1-5 & Theorems 1-6, pp. 4-17) introduce four coupled constructions: (1) MatDot Codes (Construction 1, Theorem 1), which encode column-blocks of A as p_A(x) = sum_{i=0}^{m-1} A_i x^i and row-blocks of B as p_B(x) = sum_{j=0}^{m-1} B_j x^{m-1-j} so that AB = sum_{i=0}^{m-1} A_i B_i is the coefficient of x^{m-1} in the degree-(2m-2) product polynomial p_C(x) = p_A(x) p_B(x), achieving recovery threshold k = 2m - 1; (2) Systematic MatDot Codes (Construction 2, Lemma 1, Theorem 2), which encode p_A(x) = sum_{i=1}^m A_{i-1} L_i(x) and p_B(x) = sum_{i=1}^m B_{i-1} L_i(x) using Lagrange basis polynomials L_i(x) so the first m workers output uncoded A_{r-1} B_{r-1} while any 2m - 1 workers suffice for interpolation; (3) PolyDot(m, s, t) Codes (Construction 3, Lemma 2, Theorem 3), which partition A into a t x s block grid and B into an s x t block grid (st = m) to achieve recovery threshold t^2(2s - 1) (improved to t^2 s + s - 1 under generalized substitution x = y^t, z = y^{st}, Table I); and (4) n-Matrix Multiplication Codes (Constructions 4-5, Theorems 4-6).'
