claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any matrix Y = U Sigma V^* and threshold tau >= 0, Theorem 2.1 proves that the singular value soft-thresholding operator D_tau(Y) = U D_tau(Sigma) V^* with D_tau(Sigma) = diag(max(sigma_i - tau, 0)) is the unique global minimizer of the proximal nuclear-norm functional (1/2)||X - Y||_F^2 + tau ||X||_* because Y - D_tau(Y) = tau(U_0 V_0^* + W) with U_0^* W = 0, W V_0 = 0, and ||W||_2 <= 1 lies in the subdifferential tau * partial ||D_tau(Y)||_*.
  evidence:
  - source_id: r317-primary-pdf
    locator: Section 2.1, Definitions and Theorem 2.1, Equations 2.1-2.6, pp. 4-5
    relation: supports
  - source_id: r317-metadata-cr
    locator: Bibliographic metadata for SIAM Journal on Optimization 20(4):1956-1982
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: 'Theorem 3.1 proves that the unique solution Z_tau of the strongly convex surrogate min_X {tau ||X||_* + (1/2)||X||_F^2 : P_Omega(X) = P_Omega(M)} converges as tau -> infinity to the minimum-Frobenius-norm solution X_hat of the pure nuclear-norm problem min_X {||X||_* : P_Omega(X) = P_Omega(M)} (and coincides with X_hat for finite tau > tau_0 when Omega is finite), while Theorem 4.1 establishes that the Uzawa iterates X^k = D_tau(Y^{k-1}), Y^k = Y^{k-1} + delta_k P_Omega(M - X^k) converge globally to Z_tau whenever the step sizes satisfy 0 < inf_k delta_k <= sup_k delta_k < 2.'
  evidence:
  - source_id: r317-primary-pdf
    locator: Section 3, Theorem 3.1 and Lemma 3.2, pp. 7-9; Section 4.1, Lemma 4.2 and Theorem 4.1, pp. 9-12
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Selecting a large threshold tau is required so that the regularized optimum Z_tau closely approximates the pure nuclear-norm minimizer and keeps intermediate iterates low rank, but large tau slows down asymptotic convergence; conversely, step sizes delta_k violating the theoretical stability condition delta_k < 2 (outside the empirical undersampled scaling delta = 1.2 * n_1 n_2 / |Omega|) can cause the dual updates to diverge.
  evidence:
  - source_id: r317-primary-pdf
    locator: Section 1.2, Parameter selection discussion, p. 3; Section 5.1, Step size and threshold trade-offs, pp. 15-17
    relation: supports
