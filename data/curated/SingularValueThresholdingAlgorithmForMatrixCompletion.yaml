id: AIMech:SingularValueThresholdingAlgorithmForMatrixCompletion
name: Singular Value Thresholding Algorithm for Matrix Completion
concept_kind: algorithm
review_status: DRAFT
definition: Singular Value Thresholding Algorithm for Matrix Completion (SVT) is a first-order primal-dual Uzawa/linearized-Bregman optimization method introduced by Cai, Candes, and Shen (2010) for large-scale low-rank matrix completion from a sampled entry subset Omega subset {1,...,n_1} x {1,...,n_2}. Rather than solving the unregularized nuclear-norm program directly via interior-point semidefinite programming, SVT solves the Moreau-Yosida regularized problem min_X tau ||X||_* + (1/2) ||X||_F^2 subject to P_Omega(X) = P_Omega(M) by alternating a singular value shrinkage step X^k = D_tau(Y^{k-1}) and a sparse dual ascent step Y^k = Y^{k-1} + delta_k P_Omega(M - X^k), where D_tau(Y) = U diag(max(sigma_i - tau, 0)) V^* is the closed-form proximal operator of tau ||.||_* (Theorem 2.1). Because Y^k is supported exclusively on Omega and only singular values exceeding tau are needed, SVT maintains both sparse dual matrices and low-rank primal iterates throughout execution.
identity_notes: Distinct from exact nuclear-norm theoretical duality certificates (AIMech:ExactMatrixCompletionViaConvexOptimizationNuclearNorm), Grassmannian manifold alternating minimization OptSpace (AIMech:OptSpaceDegreeTrimmingSpectralProjectionAndGrassmannManifoldMatrixCompletion), and Hard-Thresholded AltMinComplete (AIMech:AltMinSenseAndAltMinCompleteAlternatingMinimizationForLowRankMatrixSensingAndCompletion). Specifically captures the Cai-Candes-Shen (2010) SVT algorithm (Equations 1.4-1.5 and Algorithm 1), the nuclear-norm proximal shrinkage theorem D_tau(Y) = argmin_X {(1/2)||X - Y||_F^2 + tau ||X||_*} (Theorem 2.1), the equivalence between the regularized objective min tau ||X||_* + (1/2)||X||_F^2 and the nuclear-norm solution as tau -> infinity (Theorem 3.1), and global convergence under 0 < inf delta_k <= sup delta_k < 2 (Theorem 4.1).
