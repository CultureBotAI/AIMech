id: AIMech:SemidefiniteMaximumMarginClustering
name: Semidefinite Maximum Margin Clustering
aliases:
- Xu2004 Maximum Margin Clustering
concept_kind: algorithm
definition: A binary clustering procedure that relaxes latent label-equivalence matrices to a convex semidefinite
  program for a fixed-kernel soft-margin objective and recovers soft assignments from the leading matrix
  eigenvector.
identity_notes: This is the Xu-Neufeld-Larson-Schuurmans2004 unlabeled semidefinite procedure, not every
  method called maximum-margin clustering. Its label matrix and convex relaxation differ from direct nonconvex
  cutting-plane fits, multiple-kernel weight learning, kernel k-means and the same paper variant with
  observed-label constraints. The general MMC acronym is therefore not a unique alias. Compared all 442
  pinned AIO IDs, labels and scoped synonyms with all 498 prior native IDs, names and aliases; no normalized
  identity collision. Full searches of both checkouts include ignored and hidden files, returning 57 worktree
  and 57 main matched lines. All 41 distinct matched texts were inspected as multiple-kernel neighbors,
  bibliographic/query/frontier references or their rendered copies. Fifteen annotated AIO nodes and outgoing
  edges, fifteen generated YAMLs and six native neighbors were examined. Thirteen annotated targets, their
  generated records, all 442 class labels and 152 semantic rows reuse byte-verified prior readings; two
  additional annotated targets and one new semantic row were read (153 rows total). Absence is bounded
  to this pin and corpus.
