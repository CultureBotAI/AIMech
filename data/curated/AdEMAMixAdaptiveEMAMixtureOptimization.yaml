claims:
- claim_id: c-r597-fast-slow-ema-mixture-and-linear-halflife-scheduler
  kind: mechanism
  statement: Because an EMA with parameter beta has cumulative half-weight horizon t_half(beta) = ln(0.5)/ln(beta) - 1 (approx 6 steps for beta = 0.9 vs 6930 steps for beta = 0.9999), AdEMAMix combines a fast EMA m_hat_1^(t) with a slow EMA alpha^(t) m_2^(t) and schedules beta_3^(t) = f^{-1}((1 - mu) f(beta_start) + mu f(beta_3)) (Eq. f_{beta_3}, Appendix A.1) so that t_half increases linearly with mu = t / T_{beta_3}, preventing early training divergence while damped orthogonal updates accelerate progress along narrow nonconvex valleys (Figures 2, 13-14, 18, 27).
  evidence:
  - source_id: r597-primary-pdf
    locator: Figure 2, p. 3; Section 3, Equations (AdEMAMix), (f_alpha), (f_{beta_3}) & Algorithm 1, pp. 4-6; Appendix A.1, p. 18; Appendix C.1.4-C.1.9, pp. 29-37
    relation: supports
- claim_id: c-r597-llm-token-efficiency-and-reduced-batch-forgetting
  kind: application
  statement: "On RedPajama Transformer language models (110M, 330M, 1.3B parameters), Mamba (168M on FineWeb), and ImageNet-21k ViTs (24M, 86M), AdEMAMix consistently outperforms tuned AdamW \u2014 matching a 1.3B AdamW model trained on 197B tokens using only 101B tokens (a 49% token reduction) \u2014 and exhibits significantly slower forgetting of held-out injected training batches over tens of thousands of steps (Figures 1, 3-4, 6, 9-10)."
  evidence:
  - source_id: r597-primary-pdf
    locator: Figure 1, p. 2; Figures 3-6 & Section 4.1-4.3, pp. 5-10; Appendix C.1.1-C.1.2, Table 7 & Figures 8-10, pp. 25-27
    relation: supports
- claim_id: c-r597-memory-overhead-short-horizon-and-distribution-shift-limitations
  kind: limitation
  statement: When beta_1 != 0, AdEMAMix allocates a third parameter-sized optimizer buffer m_2 (33% more optimizer state memory than AdamW unless beta_1 = 0 is used at the cost of noisier loss spikes), and retaining very old gradients is less effective in short-horizon or high-epoch overfitting regimes (such as 320-epoch ImageNet-1k ViT) or under sudden distribution shifts.
  evidence:
  - source_id: r597-primary-pdf
    locator: Section 3, Computational overheads & Limitations, pp. 6-7; Section 4.3, Figure 6c, p. 10; Appendix C.1.5 & C.1.7, pp. 31, 34
    relation: supports
