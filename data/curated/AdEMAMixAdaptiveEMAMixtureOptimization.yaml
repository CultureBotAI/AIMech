id: AIMech:AdEMAMixAdaptiveEMAMixtureOptimization
name: AdEMAMix (Adaptive EMA Mixture Optimizer)
concept_kind: algorithm
review_status: DRAFT
definition: An AdamW-based adaptive optimization algorithm (Algorithm 1) that replaces the single first-moment exponential moving average with a linear combination of a bias-corrected fast-changing EMA m_hat_1^(t) = m_1^(t) / (1 - beta_1^t) (typically beta_1 = 0.9, half-life t_half approx 6 steps) and an uncorrected slow-changing EMA m_2^(t) = beta_3^(t) m_2^(t-1) + (1 - beta_3^(t)) g^(t) (typically beta_3 = 0.9999, half-life t_half approx 6930 steps), updating parameters via theta^(t) = theta^(t-1) - eta^(t) [(m_hat_1^(t) + alpha^(t) m_2^(t)) / (sqrt(nu_hat^(t)) + epsilon) + lambda theta^(t-1)] with warmup schedulers f_alpha and f_{beta_3} that increase alpha^(t) and the EMA half-life t_half(beta_3^(t)) = ln(0.5)/ln(beta_3^(t)) - 1 linearly over T_{alpha,beta_3} steps.
identity_notes: Distinct from standard AdamW in that a single EMA cannot simultaneously assign high weight to recent gradients and non-negligible weight to gradients thousands of steps old; AdEMAMix maintains two separate first-moment buffers m_1 and m_2 (or sets beta_1 = 0 so m_hat_1^(t) = g^(t) without extra memory) and schedules beta_3^(t) = exp(ln(beta_start) ln(beta_3) / ((1 - t/T) ln(beta_3) + (t/T) ln(beta_start))). Distinct from nested-EMA methods (DEMA, AdMeta) which attenuate rather than preserve very old gradients.
aliases:
- AdEMAMix Optimizer
- Adaptive Exponential Moving Average Mixture Optimizer
- Dual-EMA AdamW (AdEMAMix)
