id: AIMech:KBoundedCoPE
name: K-Bounded CoPE scheduling
definition: An execution-focused CoPE scheduling schema that enumerates placements
  of a bounded prefix of each candidate action head, completes the remainder with
  latest-time placement, and compares combined policies obtained from a supplied computation-allocation
  algorithm.
concept_kind: algorithm
aliases: []
identity_notes: The official K-Bounded_A policy-construction schema that enumerates
  placements of the first K head actions, combines them with latest-time treatment
  of remaining head actions, and evaluates reduced instances using supplied A. Retain
  the explicitly named enumeration/control schema separately from Max-LET. K and the
  supplied solver A are parameters; K=2 is a reported configuration, not a new concept.
  No exact K=0 equivalence is asserted from an incomplete printed interface. Truncating
  the enumerated prefix in general uncertain instances is heuristic. The full bounded-prefix,
  known-deadline, feasible-schedule result has additional premises. Strictly increasing
  start indices alone do not explicitly enforce nonoverlap for durations above one.
  K-Bounded is generic outside this work; retain the CoPE-qualified name and aliases[].
  Refined-Max-LET/IPAE remain a version question, not aliases. Current insertion identity
  was assessed on 2026-10-16 at merged HEAD 8650bfb55ef0c67902b5a80f1527920c87ad1d9d
  and tree cd6972cabe7b7f1cdf9ca5ee69bd6263a991ba50. The complete inventory contains813
  maintained and442 pinned AIO records,1255 total, with no normalized collision among
  the four candidates. Eight ignored- and hidden-inclusive searches across data/,
  research/, sources/ and docs/ account for167 distinct matching contents and856 match
  events. Of these,105 groups retain exact historical scoped-event attribution and62
  contents received fresh semantic reading with complete relevant parent context.
  The newly added manufacturing record was fully compared;22 prior native contexts
  are byte-identical and retain attributed semantic comparisons. The current mapping
  assessment read21 complete pinned AIO nodes and72 incident edges. The peer independently
  checked the current-state work with original scientific authorship disclosed. This
  is bounded identity clearance for the selected corpus and pin, not universal novelty
  or source exhaustion. Historical131-content/588-occurrence searching used four whole
  checkouts and included review/vendor contexts; it is retained by attribution rather
  than described as the current four-root search. The existing main911 source coordinator
  is accepted for this insertion without merging method identities or closing source
  questions.
definition_evidence:
- source_id: elboher2023
  locator: Official PDF p.6 Section 6 K-Bounded paragraph; p.7 Algorithm 2 with Algorithms
    3–4.
  relation: supports
claims:
- claim_id: bounded-prefix-placement-enumeration
  kind: mechanism
  statement: K-Bounded_A takes a CoPE instance, a prefix parameter K and a supplied
    S(AE)^2 algorithm A. For each candidate head it starts from the latest-time schedule
    under the displayed minimum-support induced deadline, then considers placements
    of the first K actions while retaining latest-time treatment for the remaining
    head actions. The source explicitly calls this an execution-focused general-case
    schema.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6, Section 6 K-Bounded paragraph; p.7 Algorithm 2.
    relation: supports
- claim_id: reduced-instance-policy-comparison
  kind: mechanism
  statement: For each considered head/initiation function, the schema invokes the
    effective-deadline reduction and supplied algorithm A, combines the returned computation
    policy with the chosen base initiations, and retains a policy when its returned
    success probability strictly improves the current best. The fixed-head reduction
    can still allocate computation to other compatible processes before they become
    invalid or tardy.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.5, fixed-head reduction and Eq.7; p.7 Algorithms 2–3.
    relation: supports
- claim_id: exact-special-case-versus-truncation
  kind: scope
  statement: For known induced deadlines and a constant bound K on the full length
    of every head, the source describes enumeration of initiation functions followed
    by allocation optimization as a pseudo-polynomial special case. If a head is longer
    than the enumerated prefix and the rest is completed by a default scheme, the
    source explicitly says optimality is given up. Thus the general K-Bounded heuristic
    with truncated heads is not certified optimal by the bounded-full-head result.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6, Bounded Length Prefixes and Section 6; Section 5 premises
      on pp.5–6.
    relation: supports
- claim_id: parameter-and-procedure-identity
  kind: scope
  statement: K and solver A parameterize the named placement-enumeration procedure.
    Its additional initiation search distinguishes it from selecting only latest head
    placements in Max-LET, while both remain execution-focused schemas. A reported
    K value or a different supplied solver does not automatically define another algorithm
    identity, and this record does not identify the official procedure with the version-specific
    arXiv Refined-Max-LET display.
  evidence:
  - source_id: elboher2023
    locator: Official PDF pp.6–7, Max-LET/K-Bounded contrast and Algorithm 2.
    relation: supports
limitations:
- The algorithm is presented for a static supplied-distribution CoPE instance with
  the source action/model restrictions. It does not supply online estimation, a complete
  operating planner, arbitrary parallel base actions or stochastic action outcomes.
- Independent performance/deadline calculations require the stated premises. The strict
  1−D(t) survival convention and inclusive induced-deadline inequality differ at discrete
  atoms; the draft does not repair or merge those conventions.
- Algorithm 2 enumerates strictly increasing action-start values but does not explicitly
  filter duration-dependent nonoverlap. For durations greater than one, increasing
  starts alone do not ensure legal execution. The intended enumeration must remain
  scoped to feasible initiation functions; no repaired loop is claimed.
- The display uses I_i[K] and the first K head positions without fully stating short-head,
  empty-head or out-of-range conventions. Its latest-time helper subtracts H[j] as
  shorthand for duration and does not fully guard missing support minima or negative
  schedules. No exact K=0/Max-LET equivalence is inferred from these incomplete interfaces.
- The shared reduction helper lacks an explicit common-prefix-loop increment, second-head-length
  check and complete all-compatible or empty-head convention. Effective deadlines
  likewise need mismatch-sentinel and empty-set handling.
- Induced-deadline distributions are absent from the explicit reduction argument list
  despite being needed by effective deadlines. Ambient access, policy combination,
  returned probability semantics and all-zero-success fallback remain helper-contract
  questions. The printed best value begins at0 and changes only on a strict improvement.
- A supplied allocation routine retains its own hazard/logarithm/time-denominator
  domain restrictions and possible approximation errors. K-Bounded does not establish
  those numerical conventions or certify its returned success probabilities.
- General initiation enumeration can be exponential. The cited exact results are pseudo-polynomial
  in numeric horizons and explicit distributions with their known-deadline, feasible-schedule
  and bounded-head or equal-slack assumptions. Truncating a longer head or using a
  heuristic A does not inherit exactness; the proof sketches were not formally verified.
- Official Algorithm 2 supplies this version of K-Bounded. The author/main and arXiv
  artifacts have different displays, and arXiv Refined-Max-LET/IPAE plus the2021 IPAE
  route remain unresolved lineage. Neither those names nor a particular K/A configuration
  is accepted as an alias. No author code was acquired or executed.
- The reported evaluation is a configured simulation over sampled15-puzzle-derived
  profiles and deadlines. It supplies no universal improvement from increasing K,
  profile calibration guarantee, operational planning overhead bound or statistical-significance
  result. Rounded small runtimes and instance ellipses retain their stated meanings.
