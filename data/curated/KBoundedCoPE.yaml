aio_no_match:
  search_scope: 'Historical prospective2026-10-16 capture: all 442 pinned AIO IDs/labels/scoped
    synonyms screened,21relevant full nodes with definitions/annotations and72 distinct
    incident edges read, with the current native context separately compared. This
    is not a future canonical-insertion clearance or absence from every ontology.'
  rationale: No inspected target identifies or usefully subsumes this named CoPE algorithm
    schema. A formal model, probability formula, learning task or planner application
    is not its control identity.
  examined_targets:
  - target: AIO:BayesianNetwork
    rejection_reason: The target requires a directed acyclic conditional-dependency
      representation. Competing process outcomes and deadline profiles do not supply
      that defining representation.
  - target: AIO:CausalGraphicalModel
    rejection_reason: The target concerns assumptions about a data-generating process
      represented as a probabilistic graph. Action-prefix invalidation is a model
      transition rule, not evidence of the specified causal-inference model.
  - target: AIO:DecisionTree
    rejection_reason: The selected node is under Classification and its definition
      frames a classification tree. A policy tree or branching proof construction
      is not the same classifier, despite broader decision-tool commentary.
  - target: AIO:EmbodiedLLM
    rejection_reason: Executing base-level actions does not make the formal controller
      or model an embodied large language model.
  - target: AIO:EnsembleLearning
    rejection_reason: Allocating effort among alternative plan computations is not
      combining learning algorithms to improve prediction. No ensemble learner is
      specified.
  - target: AIO:GraphConvolutionalPolicyNetwork
    rejection_reason: The target combines graph convolution, reinforcement learning
      and adversarial graph-generation context. No corresponding architecture or training
      rule defines these CoPE subjects.
  - target: AIO:MachineLearningTask
    rejection_reason: The target is a process for building methods that learn from
      data. The formal model and three schemas can consume supplied performance/deadline
      distributions without learning them. Offline empirical profile estimation in
      one evaluation does not define these subjects as learning tasks.
  - target: AIO:MarkovChain
    rejection_reason: The pinned node is a stochastic sequence/network context, with
      Network parent and probabilistic-layer relation. The controlled decision model
      has action choices and an objective; neither its MDP encoding nor a resulting
      policy is automatically the pinned chain-network identity.
  - target: AIO:MathematicalFunction
    rejection_reason: The target is a rule assigning a dependent value from independent
      values. A full decision-model tuple or policy-control procedure is not merely
      one scalar or function-valued rule. This rejects transfer of the 2025 functional-specific
      broad_match.
  - target: AIO:MetaLearning
    rejection_reason: The definition concerns learning from metadata about machine-learning
      experiments. Metareasoning about computation and execution is not that learning
      mechanism.
  - target: AIO:Model
    rejection_reason: The pinned definition covers an abstract logical, mathematical
      or conceptual representation of a complex system. The source-defined CoPE decision
      model is such a representation, so broad_match is defensible for the model only.
      Named executable-control schemas are not themselves this model; sharing a model
      input is not class identity.
  - target: AIO:Network
    rejection_reason: A collection of processes and an MDP transition graph do not
      by themselves identify the subject with the pinned interconnected-node network
      architecture. Model is the defensible broad target for the formal representation.
  - target: AIO:PolicyLayer
    rejection_reason: The target is a neural-network layer producing action probabilities.
      The model and supplied-solver policy constructors have no such required layer.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The target explicitly models conditional dependencies with a
      graph in a machine-learning task context. The CoPE state/transition representation
      is not thereby the specified graphical-inference task.
  - target: AIO:ProportionalHazardsModel
    rejection_reason: Multiplicative covariate hazard regression is not a premise
      or mechanism of the source CoPE model or schedulers.
  - target: AIO:ReasoningLLM
    rejection_reason: These subjects do not require a large language model or its
      specialized reasoning behavior.
  - target: AIO:ReinforcementLearning
    rejection_reason: The target is a learning task balancing exploration and exploitation
      to maximize performance. An MDP encoding or a solver-produced policy with supplied
      distributions does not establish reinforcement learning or a learned controller.
  - target: AIO:SurvivalAnalysis
    rejection_reason: This ML task analyzes duration until events. Deadline/computation
      distributions are supplied model inputs here; their use does not constitute
      fitting or evaluating a survival-analysis method.
  - target: AIO:TimeSeriesAnalysis
    rejection_reason: A time clock and completion profiles are not a method for analyzing
      ordered data series for statistics or characteristics as required by the target
      task.
  - target: AIO:TrainingStrategy
    rejection_reason: No specified model-training or preprocessing strategy defines
      the four subjects; estimating evaluation inputs is distinct from their control
      logic.
  - target: AIO:ActiveLearning
    rejection_reason: The target is interactive querying to label new data points
      with desired outputs. Allocating computation and dispatching actions for timely
      planning success is not that task, even though both can value information.
