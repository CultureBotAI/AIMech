claims:
- claim_id: claim-glr-reparameterization-equivariance-and-scaled-procrustes-alignment-metric
  kind: mechanism
  statement: Under the ScaledGD update $\boldsymbol{L}_{t+1} = \boldsymbol{L}_t - \eta\nabla_{\boldsymbol{L}}f(\boldsymbol{L}_t\boldsymbol{R}_t^\top)(\boldsymbol{R}_t^\top\boldsymbol{R}_t)^{-1}$ and $\boldsymbol{R}_{t+1} = \boldsymbol{R}_t - \eta\nabla_{\boldsymbol{R}}f(\boldsymbol{L}_t\boldsymbol{R}_t^\top)(\boldsymbol{L}_t^\top\boldsymbol{L}_t)^{-1}$ (Equation 3), replacing $(\boldsymbol{L}_t,\boldsymbol{R}_t)$ by $(\boldsymbol{L}_t\boldsymbol{Q},\boldsymbol{R}_t\boldsymbol{Q}^{-\top})$ for any invertible $\boldsymbol{Q}\in\mathrm{GL}(r)$ yields $(\boldsymbol{L}_{t+1}\boldsymbol{Q},\boldsymbol{R}_{t+1}\boldsymbol{Q}^{-\top})$ and leaves the product $\boldsymbol{X}_{t+1} = \boldsymbol{L}_{t+1}\boldsymbol{R}_{t+1}^\top$ exactly invariant (Section 2.1), while Lemma 10 proves that the minimizer $\boldsymbol{Q}$ of the $\boldsymbol{\Sigma}_\star$-weighted distance $\mathrm{dist}^2(\boldsymbol{Z},\boldsymbol{Z}_\star)$ (Equation 11) exists and satisfies the exact alignment equation $(\boldsymbol{L}\boldsymbol{Q})^\top(\boldsymbol{L}\boldsymbol{Q} - \boldsymbol{L}_\star)\boldsymbol{\Sigma}_\star = \boldsymbol{\Sigma}_\star(\boldsymbol{R}\boldsymbol{Q}^{-\top} - \boldsymbol{R}_\star)^\top(\boldsymbol{R}\boldsymbol{Q}^{-\top})$ (Section 2.1, Equation 3; Section 2.3, Equation 11; Appendix A.2, Lemma 10).
  evidence:
  - source_id: tmc2021-scaledgd-pdf
    locator: Section 2.1 (Eq. 3, pp. 6-8), Section 2.3 (Eq. 11, pp. 10-12), Appendix A.2 (Lemma 10, pp. 26-28)
    relation: supports
- claim_id: claim-condition-number-free-linear-contraction-for-matrix-sensing-and-robust-pca
  kind: mechanism
  statement: Theorem 1 and Theorem 3 prove that for rank-$r$ matrix sensing under the Restricted Isometry Property $\delta_{2r} \le c_0$ ($m \gtrsim nr\log n$) and for Robust PCA with sparsity fraction $\alpha \lesssim 1/(\mu^2 r^{3/2}\kappa)$ via entrywise sparsification $\mathcal{S}_\zeta$, spectral initialization followed by ScaledGD with constant step size $\eta \in (0, 2/3]$ satisfies $\|\boldsymbol{L}_t\boldsymbol{R}_t^\top - \boldsymbol{X}_\star\|_F \le 1.5\,\mathrm{dist}(\boldsymbol{Z}_t,\boldsymbol{Z}_\star) \le 1.5(1 - 0.6\eta)^t \epsilon_0\sigma_r(\boldsymbol{X}_\star)$ for all $t\ge 0$, achieving $\epsilon$-accuracy in $O(\log(1/\epsilon))$ iterations independent of $\kappa = \sigma_1(\boldsymbol{X}_\star)/\sigma_r(\boldsymbol{X}_\star)$ (Section 2.2, Theorems 1 and 3; Section 3, Proof of Theorem 1).
  evidence:
  - source_id: tmc2021-scaledgd-pdf
    locator: Section 2.2 (Theorem 1, p. 8; Theorem 3, pp. 9-10), Section 3 (pp. 12-16)
    relation: supports
- claim_id: claim-projected-scaled-gd-for-matrix-completion-and-tucker-tensor-estimation
  kind: application
  statement: "Combining ScaledGD with row-wise incoherence projection $\\mathcal{P}_B$ on $\\|\\boldsymbol{L}_{i,\\cdot}\\boldsymbol{\\Sigma}_\\star^{-1/2}\\|_2$ for matrix completion (Theorem 2, Equations 6\u20137) and extending to mode-wise Gram-inverse updates $\\boldsymbol{U}_k^{(t+1)} = \\boldsymbol{U}_k^{(t)} - \\eta\\nabla_{\\boldsymbol{U}_k}f(\\mathcal{X}_t)(\\breve{\\boldsymbol{U}}_k^{(t)\\top}\\breve{\\boldsymbol{U}}_k^{(t)})^{-1}$ and core-tensor update $\\mathcal{G}_{t+1} = \\mathcal{G}_t - \\eta\\nabla_{\\mathcal{G}}f(\\mathcal{X}_t)\\times_1(\\boldsymbol{U}_1^{(t)\\top}\\boldsymbol{U}_1^{(t)})^{-1}\\cdots\\times_3(\\boldsymbol{U}_3^{(t)\\top}\\boldsymbol{U}_3^{(t)})^{-1}$ for Tucker tensor recovery (Section 4, Equation 16, Theorems 4\u20137) yields condition-number-free linear convergence across matrix completion, tensor sensing, tensor completion, and tensor robust PCA (Section 2.2, Theorem 2; Section 4, Equations 16\u201320, Theorems 4\u20137)."
  evidence:
  - source_id: tmc2021-scaledgd-pdf
    locator: Section 2.2 (Theorem 2, pp. 8-9), Section 4 (Eqs. 16-20, Theorems 4-7, pp. 16-22)
    relation: supports
