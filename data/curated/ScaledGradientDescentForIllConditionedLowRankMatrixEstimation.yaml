id: AIMech:ScaledGradientDescentForIllConditionedLowRankMatrixEstimation
name: Scaled Gradient Descent (ScaledGD) for Ill-Conditioned Low-Rank Matrix and Tensor Estimation
concept_kind: algorithm
review_status: DRAFT
definition: "A right-preconditioned nonconvex factored optimization methodology (introduced by Tian Tong, Cong Ma, and Yuejie Chi in 2021) that eliminates the condition-number $\\kappa = \\sigma_1(\\boldsymbol{X}_\\star)/\\sigma_r(\\boldsymbol{X}_\\star)$ iteration slowdown of Burer\u2013Monteiro gradient descent across low-rank matrix sensing, matrix completion, robust PCA, and Tucker low-multilinear-rank tensor estimation. Given a loss $f(\\boldsymbol{L}\\boldsymbol{R}^\\top)$ over factors $\\boldsymbol{L}\\in\\mathbb{R}^{n_1\\times r}$ and $\\boldsymbol{R}\\in\\mathbb{R}^{n_2\\times r}$, ScaledGD updates $\\boldsymbol{L}_{t+1} = \\boldsymbol{L}_t - \\eta\\,\\nabla_{\\boldsymbol{L}} f(\\boldsymbol{L}_t\\boldsymbol{R}_t^\\top)(\\boldsymbol{R}_t^\\top\\boldsymbol{R}_t)^{-1}$ and $\\boldsymbol{R}_{t+1} = \\boldsymbol{R}_t - \\eta\\,\\nabla_{\\boldsymbol{R}} f(\\boldsymbol{L}_t\\boldsymbol{R}_t^\\top)(\\boldsymbol{L}_t^\\top\\boldsymbol{L}_t)^{-1}$ (Equation 3), where the $r\\times r$ Gram inverses $(\\boldsymbol{R}_t^\\top\\boldsymbol{R}_t)^{-1}$ and $(\\boldsymbol{L}_t^\\top\\boldsymbol{L}_t)^{-1}$ cost only $O(r^3)$ flops and make the trajectory invariant under arbitrary invertible factor transformations $(\\boldsymbol{L}_t\\boldsymbol{Q}, \\boldsymbol{R}_t\\boldsymbol{Q}^{-\\top})$ ($\\boldsymbol{Q}\\in\\mathrm{GL}(r)$). By analyzing iterates in the $\\boldsymbol{\\Sigma}_\\star$-scaled distance $\\mathrm{dist}^2(\\boldsymbol{Z},\\boldsymbol{Z}_\\star) = \\inf_{\\boldsymbol{Q}\\in\\mathrm{GL}(r)}(\\|(\\boldsymbol{L}\\boldsymbol{Q} - \\boldsymbol{L}_\\star)\\boldsymbol{\\Sigma}_\\star^{1/2}\\|_F^2 + \\|(\\boldsymbol{R}\\boldsymbol{Q}^{-\\top} - \\boldsymbol{R}_\\star)\\boldsymbol{\\Sigma}_\\star^{1/2}\\|_F^2)$ (Equation 11), where the optimal alignment $\\boldsymbol{Q}$ satisfies the cross-symmetry identity $(\\boldsymbol{L}\\boldsymbol{Q})^\\top(\\boldsymbol{L}\\boldsymbol{Q} - \\boldsymbol{L}_\\star)\\boldsymbol{\\Sigma}_\\star = \\boldsymbol{\\Sigma}_\\star(\\boldsymbol{R}\\boldsymbol{Q}^{-\\top} - \\boldsymbol{R}_\\star)^\\top(\\boldsymbol{R}\\boldsymbol{Q}^{-\\top})$ (Lemma 10), Theorems 1\u20134 prove that ScaledGD contracts at rate $\\mathrm{dist}(\\boldsymbol{Z}_t,\\boldsymbol{Z}_\\star) \\le (1 - 0.6\\eta)^t \\epsilon_0\\sigma_r(\\boldsymbol{X}_\\star)$ in $O(\\log(1/\\epsilon))$ iterations completely independent of $\\kappa$."
identity_notes: Resolved against all 442 pinned AIO concepts and 693 maintained AIMech concepts. Distinct from `AIMech:ImplicitRegularizationInNonconvexStatisticalEstimationByLeaveOneOutTrajectoryAnalysis` (Ma, Wang, Chi, & Chen 2020) and `AIMech:ConvexAndNonconvexBridgingForRobustPCAUnderNoiseOutliersAndMissingData` (Chen, Fan, Ma, & Yan 2021), which analyze unpreconditioned factored gradient descent whose iteration complexity scales linearly or quadratically with the matrix condition number $\kappa = \sigma_1(\boldsymbol{X}_\star)/\sigma_r(\boldsymbol{X}_\star)$ and requires explicit balancing regularizers $\|\boldsymbol{L}^\top\boldsymbol{L} - \boldsymbol{R}^\top\boldsymbol{R}\|_F^2$, whereas ScaledGD uses right Gram-inverse preconditioning $(\boldsymbol{R}_t^\top\boldsymbol{R}_t)^{-1}$ to achieve $\mathrm{GL}(r)$ equivariance and $\kappa$-free contraction without balancing penalties.
