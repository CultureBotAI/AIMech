claims:
- claim_id: r631-adaptive-variance-freezing-and-linear-momentum-reconstruction
  kind: mechanism
  statement: Because adjacent Adam variance updates ||v_t - v_{t-1}|| decay smoothly and roughly exponentially while local and global optimizer states ||v_t^{(0)} - v_t|| and ||m_t^{(0)} - m_t|| remain separated by a constant gap without synchronization (Figure 1), 0/1 Adam freezes v_t between scheduled variance updates k_j in T_v (with k_{j+1} - k_j = 2^{floor(j/kappa)}, kappa = 16) so that all workers share an identical denominator sqrt(v_t + eps); over local steps between synchronizations t' and t in T_u, the model displacement x_t^{(i)} - x_{t'}^{(i)} is strictly linear in the accumulated buffer u_{t+1/2}^{(i)} = sum_{k=t'}^t gamma_k m_k^{(i)}, allowing a single error-compensated 1bit-AllReduce(u_{t+1/2}^{(i)}) to both synchronize parameters x_{t+1}^{(i)} = x_{t'}^{(i)} - u_bar_{t+1/2} / sqrt(v_t + eps) and linearly reconstruct synchronized momentum m_{t+1}^{(i)} = u_bar_{t+1/2} / sum_{h=t'}^t gamma_h (Algorithm 1 Lines 5-11).
  evidence:
  - source_id: r631-primary-pdf
    locator: Section 3 Figure 1, Section 4 Algorithm 1 & Section 6 Policy for T_v and T_u, pp. 3-5, 8
    relation: supports
- claim_id: r631-nonconvex-convergence-without-uniform-variance-lower-bound
  kind: scope
  statement: 'Under L-Lipschitz gradients, bounded stochastic variance sigma^2, bounded gradient infinity norm ||g_t||_inf <= G_inf (eliminating 1-bit Adam''s restrictive uniform coordinate variance lower bound v_min > 0 via Lemma 2: beta_2^{m/2} sqrt(v_1 + eps) <= sqrt(v_t + eps) <= sqrt(G_inf^2 + eps)), bounded compressor error Delta^2, and maximum local-step interval H (Assumptions 1-5), if m = |T_v| <= log(1 - beta_1) / log(beta_2) and gamma_t = min{sqrt(n / (sigma^2 T)), 1 / (4 L sqrt(G_inf^2 + eps)), 2 sqrt(G_inf^2 + eps) / L, 1/6}, Theorem 1 proves (1/T) sum_{t=0}^{T-1} E||grad f(x_tilde_t)||^2 <= O(sigma / sqrt(n T) + H^2 Delta^2 (m + n) / T + 1 / T), where compression (Delta) and local steps (H) affect only non-dominating O(1/T) terms.'
  evidence:
  - source_id: r631-primary-pdf
    locator: Section 5 Assumptions 1-5, Theorem 1 & Appendix D.2-D.3 Lemmas 2, 4, 8-10, pp. 6, 18-34
    relation: supports
- claim_id: r631-sub-1bit-volume-reduction-and-gpt2-bert-throughput-gain
  kind: application
  statement: On up to 128 V100 GPUs across BERT-Base, BERT-Large, GPT-2 (117M parameters, 48 layers), and ResNet-18 on ImageNet, 0/1 Adam reduces average per-parameter communication volume to 0.42 bits on BERT-Large and 0.48 bits on GPT-2 (up to 87% data volume reduction and 54% fewer communication rounds compared to 1-bit Adam's 3.27 and 3.8 bits/parameter, Figure 4) and achieves up to 2x higher training throughput and wall-clock time reduction over 1-bit Adam while matching GLUE average accuracy (81.6 on BERT-Base, 83.6 on BERT-Large), ImageNet Top-1 accuracy (69.88% vs 69.93%), and GPT-2 zero-shot WikiText-103 perplexity (28.07 vs 28.37) and LAMBADA accuracy (33.51% vs 33.21%).
  evidence:
  - source_id: r631-primary-pdf
    locator: Section 6.1-6.2 Tables 1-2 & Figures 2-5, pp. 7-9
    relation: supports
  - source_id: r631-metadata-cr
    locator: ICLR 2023 bibliographic record (conf/iclr/LuLZSH23)
    relation: supports
- claim_id: r631-variance-update-budget-and-local-step-freezing-coupling
  kind: limitation
  statement: 0/1 Adam's convergence guarantee requires the total number of full-precision variance updates m = |T_v| to satisfy m <= log(1 - beta_1) / log(beta_2) so that beta_2^m >= 1 - beta_1 in Lemmas 2, 9, and 10, and requires stopping variance updates whenever the local-step synchronization interval exceeds 1 (t_{j+1} - t_j > 1) because local momentum approximation noise scales with the learning rate and requires a frozen variance denominator across local steps.
  evidence:
  - source_id: r631-primary-pdf
    locator: Section 5 Theorem 1, Section 6 Policy for T_v and T_u & Section 6.2 Figure 5, pp. 6, 8-9
    relation: supports
