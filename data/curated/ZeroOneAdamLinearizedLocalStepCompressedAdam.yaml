  rationale: 0/1 Adam is a distributed communication-efficient adaptive optimizer for pre-training large transformer and convolutional neural networks.
limitations:
- Requires the total number of variance updates m = |T_v| to be bounded by log(1 - beta_1) / log(beta_2) (approx. 2301 updates for beta_1 = 0.9, beta_2 = 0.999) and requires halting variance updates once local steps are active (t_{j+1} - t_j > 1).
- Without local steps (setting T_u = {0, ..., T-1}), adaptive variance freezing alone reduces data volume toward 1 bit per parameter (~1.02-1.04 bits/param) but yields only 1.2x-1.3x wall-clock speedup because fixed per-round communication initialization and compression latencies dominate at 64-128 GPUs (Table 3, Figure 5).
- Local-step intervals t_{j+1} - t_j must be kept at 1 during learning-rate warmup and grown inversely proportional to the decaying learning rate (clipped at H = 16) to bound linear momentum approximation error.
