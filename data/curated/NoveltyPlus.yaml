name: Novelty+ SAT heuristic
definition: A Novelty extension that, at each SAT search step, chooses a random variable from a randomly
  selected unsatisfied clause with a fixed walk probability and otherwise uses Novelty’s recency-conditioned
  best/second-best selector.
concept_kind: algorithm
identity_notes: 'This is Hoos’s 1999 Novelty+ random-walk extension. The plus sign identifies an additional
  per-step random-walk branch, distinct from Novelty’s conditional noise parameter and from later adaptive,
  diversification or look-ahead variants. It does not require a periodic schedule or an SKC zero-break
  priority. The theorem concerns asymptotic model finding on satisfiable formulas, not probably-approximately-correct
  learning or a finite UNSAT decision. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 325 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 90 and 90 lines respectively. All
  64 unique hit contents were inspected: neighboring variant and source references, saved reviews and
  candidate leads, not existing candidate records. Exact checkout counts and differences are retained
  in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five
  full native neighboring records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The asymptotic guarantee requires a strictly positive walk probability at every step, bounded below
  independently of elapsed search history. A scheduled-only override or a probability that tends to zero
  does not automatically satisfy that premise. At w=0 the random-walk argument no longer applies.
- The guarantee concerns finding a model on a finite satisfiable formula in the limit of continued search.
  A finite budget can miss an existing model and cannot certify UNSAT. The source’s lower bound can be
  extremely small; no polynomial or practical runtime follows.
- The walk probability w is separate from the inner selector’s noise parameter p. The reported experimental
  w=0.01 is not a defining or universally optimal constant. Optional outer restarts and cutoffs must be
  specified separately.
- Empty clauses, unit clauses lacking a second candidate, initial age ties, duplicate literals and timestamp/reset
  conventions require a well-defined implementation. The general random-walk proof does not certify undocumented
  choices in the short selector description. No author solver or benchmark was executed.
