claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a complete truth assignment and variable flip timestamps. If the formula is not
    satisfied, randomly choose an unsatisfied clause. With fixed probability w in [0,1], choose a variable
    uniformly from that clause and flip it. Otherwise rank clause variables by the global post-flip violation
    count, breaking score ties in favor of the least recently flipped variable. If the best is not the
    most recently flipped variable in the clause, select it; otherwise select second-best with probability
    p and best with probability 1−p, where p is in [0,1]. Update the flipped variable’s timestamp and
    continue under the declared stopping policy. The walk branch is available regardless of scores, recency
    or zero-break candidates. With w=1 this is the pure clause-first random walk; with w=0 it is the underlying
    Novelty selector. Any fixed w>0 satisfies the source’s random-walk premise once all remaining move
    cases are well-defined.
  evidence:
  - source_id: method-source
    locator: PDF5–6, Improving SLS Performance, per-step random-walk extension and naming; PDF2, WalkSAT/Novelty
      context; PDF3–4, asymptotic scope and Theorem 2
    relation: supports
  - source_id: additional-1
    locator: PDF2 / printed322, Novelty and R-Novelty selector definitions; PDF3 / printed323, original
      periodic R-Novelty override
    relation: supports
- claim_id: asymptotic-model-finding
  kind: scope
  statement: For a finite satisfiable CNF and a well-defined remaining move policy, a fixed positive lower
    bound on the probability of a uniform random-clause/random-variable step at every search step gives
    success probability approaching one as the number of steps tends to infinity. Hoos1999 Theorem 2 establishes
    this via a positive probability of a sequence reducing Hamming distance to a model. The conclusion
    does not give a polynomial or practically small runtime, a finite-run guarantee, or an UNSAT certificate.
  evidence:
  - source_id: method-source
    locator: PDF3, Definition 2 and no-restart scope; PDF3–4, Lemma 1 and Theorem 2; PDF5–6, application
      to the plus extensions
    relation: supports
