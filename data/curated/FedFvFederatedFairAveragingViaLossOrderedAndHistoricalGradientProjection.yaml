claims:
- claim_id: r494-claim-1
  kind: mechanism
  statement: Under pairwise cosine bounds eps_1 <= |cos(g_i^{(t_i)}, g_j^{(t_j)})| <= eps_2 (0 < eps_1 <= eps_2 <= 1), iteratively projecting client gradients onto the normal plane of g_k in ascending index order k = 1, ..., m bounds the residual conflict with the projected average g_bar' by |g_k . g_bar'| <= ((m - 1) / m) (max_i ||g_i||)^2 f(m, k, eps_1, eps_2) where f(m, k, eps_1, eps_2) = eps_2^2 (1 - eps_1^2)^{1/2} (1 - (1 - eps_1^2)^{(m-k)/2}) / (1 - (1 - eps_1^2)^{1/2}), which decreases monotonically with k so that placing higher-loss clients later in PO_t guarantees them smaller upper-bounded conflict with g_bar' (Theorems 1-2, Appendix A.1-A.2).
  evidence:
  - source_id: r494-primary-pdf
    locator: Sections 3.2 & 3.4, pp. 3-4, Theorems 1-2; Appendix A.1-A.2, p. 7, Equations 2-8
    relation: supports
- claim_id: r494-claim-2
  kind: mechanism
  statement: To mitigate external conflicts against unselected or dropped-out clients h not in S_t, FedFV maintains a server trace GH of each client's most recent update g_k^{t_k} and sequentially projects g^t onto the normal plane of the sum g_con of conflicting historical gradients from round t - i in chronological order i = tau, tau - 1, ..., 1 before rescaling ||g^t|| to ||(1/m) sum_{k in S_t} g_k^t|| (Definition 3, Algorithm 3, Algorithm 1 line 10).
  evidence:
  - source_id: r494-primary-pdf
    locator: Section 3.3, pp. 3-4, Definition 3, Algorithm 3, Algorithm 1 line 10
    relation: supports
- claim_id: r494-claim-3
  kind: limitation
  statement: Setting alpha = 0 (forcing all selected clients, including highest-loss clients, to project their gradients) can increase test accuracy variance when all clients participate (e.g., variance 13.76 on 3-client Fashion-MNIST versus 1.77 at alpha = 2/3), and Theorem 4's multi-client Pareto stationarity guarantee on L-smooth convex objectives requires cos(g_bar, g_bar') >= 1/2 and ||g_bar|| >= ||g_bar'|| with step size eta <= 1 / L.
  evidence:
  - source_id: r494-primary-pdf
    locator: Section 3.4, p. 4, Theorems 3-4; Section 5.2, pp. 5-6, Table 3
    relation: supports
- claim_id: r494-claim-4
  kind: application
  statement: Evaluated on non-IID shard-partitioned CIFAR-10 (100 clients, 10% participation), MNIST (200 clients), and class-partitioned Fashion-MNIST (3 clients), outperforming FedAvg, q-FedAvg, FedMGDA+, and FedFA in average accuracy, worst-5% accuracy (32.24% vs. 19.84% for FedAvg on CIFAR-10 at alpha = 0.1, tau = 10), and convergence speed.
  evidence:
  - source_id: r494-primary-pdf
    locator: Section 5, pp. 5-6, Tables 2-4, Figure 2
    relation: supports
