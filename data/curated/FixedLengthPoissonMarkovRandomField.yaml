claims:
- claim_id: method
  kind: mechanism
  statement: For finite p, a nonnegative integer L and X_L={x in N0^p:sum_i x_i=L}, define p_L(x)=Z_L^(-1)*exp[theta^T
    x+x^T Phi x]/product_i x_i!, with finite real theta and symmetric Phi. Z_L is the finite sum over
    X_L and A_L=log Z_L. Off-diagonal matrix entries contribute twice. At Phi=0, Z_L=(sum_i exp(theta_i))^L/L!
    and p_L is Multinomial(L,softmax(theta)); at L=0 it is the point mass at zero. Adding a common constant
    to theta does not change the normalized law. An exchangeable sequence of L token labels with count
    vector x assigns each ordering probability p_L(x)/(L! / product_i x_i!), so token reassignment can
    sample the count law while preserving the total. Given all other count coordinates, one count coordinate
    is fixed by L; ordinary Poisson count full conditionals are not a property of this support.
