id: AIMech:IPOPCMAES
name: IPOP-CMA-ES
concept_kind: algorithm
aliases: []
definition: The original increasing-population restart CMA-ES algorithm, which independently restarts
  its weighted, rank-mu covariance-matrix-adaptation inner optimizer with doubled population size after
  local termination, using fresh initialization, inherited cumulative step-size adaptation and separate
  overall stopping conditions.
definition_evidence:
- source_id: auger2005ipop
  locator: Section 2, PDF pp. 2–3 / paper pp. 1–2, specified inner CMA-ES and increasing-population restart
    procedure.
  relation: supports
- source_id: hansen2004
  locator: Section 2, PDF pp. 3–4 / article pp. 2–3, Equations 1–8 and initialization.
  relation: supports
claims:
- claim_id: weighted-gaussian-cma-inner-search
  kind: mechanism
  statement: The original IPOP procedure uses the cited 2004 weighted, rank-mu CMA-ES as its inner optimizer.
    At each generation it draws lambda independent candidates from a Gaussian with mean m and covariance
    sigma squared C, evaluates the objective for minimization, and sets the new mean to a positive weighted
    combination of the best mu candidates, with weights summing to one. The covariance rule combines a
    rank-one evolution-path contribution with a rank-mu contribution from selected displacements. The
    method uses objective evaluations rather than objective derivatives; the Gaussian is a search distribution,
    not a predictive model of objective values.
  evidence:
  - source_id: auger2005ipop
    locator: Section 2, PDF p. 2 / paper p. 1, the (mu_W,lambda)-CMA-ES subsection and explicit reference
      to the 2004 base.
    relation: supports
  - source_id: hansen2004
    locator: Section 2, PDF pp. 3–4 / article pp. 2–3, Equations 1–3 and weighted recombination.
    relation: supports
- claim_id: inherited-cumulative-step-size-adaptation
  kind: mechanism
  statement: The fixed inner routine adapts its scalar step size using a conjugate evolution path. With
    old-generation covariance C=B*D^2*B^T, it accumulates the normalized mean displacement after whitening
    by B*D^(-1)*B^T into p_sigma. It then uses sigma_new=sigma*exp((c_sigma/d_sigma)*(norm(p_sigma_new)/E_norm_standard_normal-1)),
    where the expectation is the length of an n-dimensional standard-normal vector. This scalar exponential
    is inherited cumulative step-size adaptation, distinct from the population-doubling restart rule.
    A positive initial sigma remains positive for finite exponents in exact real arithmetic; this does
    not guarantee objective improvement or floating-point stability.
  evidence:
  - source_id: auger2005ipop
    locator: Section 2, PDF p. 2 / paper p. 1, reference to the base Equations 4–5 for cumulative step-size
      adaptation.
    relation: supports
  - source_id: hansen2004
    locator: Section 2, PDF p. 4 / article p. 3, Equations 4–5, covariance eigendecomposition and expected
      standard-normal length.
    relation: supports
- claim_id: independent-population-doubling-restarts
  kind: mechanism
  statement: 'When an inner attempt meets a local stopping criterion, launch an independent restart with
    twice its population size. The original procedure starts with lambda_0=4+floor(3 ln n), so the population
    of an actually launched attempt indexed k from zero is lambda_k=2^k*lambda_0. Each attempt uses the
    default parameter formulas for its population: mu=floor(lambda/2), positive recombination weights
    and dependent effective-selection and learning-rate parameters are recomputed accordingly. Reusing
    default formulas does not mean freezing every derived numerical constant. The doubling occurs between
    attempts, not every generation, and no indefinitely continuing sequence is implied under a finite
    overall budget.'
  evidence:
  - source_id: auger2005ipop
    locator: 'Section 2, PDF p. 2 / paper p. 1, the IPOP-CMA-ES restart subsection: independent restart,
      factor 2 and initial default population.'
    relation: supports
  - source_id: hansen2004
    locator: Section 2, PDF p. 4 / article p. 3, Equations 6–8; Section 3.2, PDF p. 5 / article p. 4,
      footnote 6 on parameter dependence.
    relation: supports
- claim_id: corrected-local-restart-triggers
  kind: mechanism
  statement: 'The stated local termination categories are a stagnant or sufficiently small function-value
    range, small coordinate spread and evolution-path scale, finite-precision no-effect tests, or a covariance
    condition number above 10^14. For the no-effect-coordinate test, apply the explicit author correction:
    restart if adding 0.2 times the coordinate standard deviation leaves at least one coordinate of the
    mean unchanged. The uncorrected does-change wording is not the rule. These triggers indicate stagnation
    or numerical limits; they are not certificates that the global optimum has been reached.'
  evidence:
  - source_id: auger2005ipop
    locator: PDF p. 1, explicit erratum; Section 2, PDF p. 3 / paper p. 2, stopping bullets and no-effect-axis
      footnote 3.
    relation: supports
  - source_id: ipop-author-errata
    locator: ERRATA, correction to the end-of-Section-2 noeffectcoord criterion.
    relation: supports
- claim_id: fresh-initialization-and-overall-stopping
  kind: scope
  statement: In the evaluated 2005 configuration, each restart samples a fresh initial mean uniformly
    in the prescribed box [A,B]^n and sets sigma_0=(B-A)/2; the cited base starts C at the identity and
    both evolution paths at zero. The benchmark specifies an overall allowance of n*10^4 function evaluations
    or termination when the objective error relative to the known optimum is below 10^-8. These overall
    conditions are separate from the local restart triggers. The box, initial scale, target, budget and
    boundary policy are configuration choices, not a requirement that an arbitrary black-box problem have
    a known optimum or this exact budget.
  evidence:
  - source_id: auger2005ipop
    locator: Section 2, PDF pp. 2–3 / paper pp. 1–2, independent restarts and problem-dependent initialization;
      Section 3, PDF p. 3 / paper p. 2, experimental initialization and overall stopping.
    relation: supports
  - source_id: hansen2004
    locator: Section 2, PDF p. 4 / article p. 3, initialization paragraph following Equation 5; cover
      erratum specifies the starting point as the recombination mean.
    relation: supports
- claim_id: original-whole-method-and-local-comparator-boundary
  kind: scope
  statement: The named original IPOP algorithm comprises its increasing-population restart policy and
    specified weighted, rank-mu, evolution-path and step-size-adapting CMA base. It is not every restart
    controller or an exact alias of all CMA-ES versions. The companion local-restart CMA-ES keeps the
    same small default population across independent attempts. Its evaluated initial scale is 10^-2*(B-A)/2,
    one hundredth of the IPOP setting, so their reported comparison does not isolate population growth
    as the only changed factor.
  evidence:
  - source_id: auger2005ipop
    locator: Section 2, PDF p. 2 / paper p. 1, fixed inner method and growing-population restart; Section
      3, PDF p. 3 / paper p. 2, initial scale.
    relation: supports
  - source_id: auger2005local
    locator: Section 3, PDF pp. 3–4 / paper pp. 2–3, the local-restart (mu_W,lambda)-CMA-ES subsection;
      Section 4, PDF p. 4 / paper p. 3, experimental initialization.
    relation: supports
