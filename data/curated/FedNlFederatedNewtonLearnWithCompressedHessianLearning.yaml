id: AIMech:FedNlFederatedNewtonLearnWithCompressedHessianLearning
name: FedNL (Federated Newton Learn)
concept_kind: algorithm
review_status: DRAFT
definition: FedNL (Federated Newton Learn) is a family of communication-efficient second-order federated optimization algorithms for solving general finite-sum problems min_{x in R^d} f(x) = (1/n) sum_{i=1}^n f_i(x) that progressively learns the local optimal Hessians grad^2 f_i(x^*) and their global average grad^2 f(x^*) via compressed matrix difference updates H_i^{k+1} = H_i^k + alpha * C_i^k(grad^2 f_i(x^k) - H_i^k) and H^{k+1} = (1/n) sum_{i=1}^n H_i^{k+1}. Supporting both unbiased matrix compressors B(omega) and deterministic contractive compressors C(delta) (such as Rank-R and Top-K) without error feedback or raw data transmission, the server updates the global model either via cone projection x^{k+1} = x^k - [H^k]_mu^{-1} grad f(x^k) (Option 1) or Frobenius compression-error shift x^{k+1} = x^k - [H^k + l^k I]^{-1} grad f(x^k) with l_i^k = ||H_i^k - grad^2 f_i(x^k)||_F (Option 2), with extensions to partial participation (FedNL-PP), backtracking line search (FedNL-LS), cubic regularization (FedNL-CR), bidirectional model/gradient compression (FedNL-BC), and initial-Hessian Newton Zero (N0).
identity_notes: Distinct from Newton Learn (NL1/NL2, Islamov et al., 2021), which is restricted to generalized linear models f_i(x) = (1/m) sum_{j=1}^m phi_{ij}(a_{ij}^T x), requires transmitting private training vectors a_{ij} to the server, only supports unbiased compressors, and has local convergence dependent on the number of data points m. Also distinct from first-order compressed federated methods such as DIANA (Round 389) and ADIANA (Round 390), whose rates depend on the condition number kappa = L/mu.
