claims:
- claim_id: fednl-condition-number-independent-local-linear-and-superlinear-rates
  kind: mechanism
  statement: 'Under mu-strong convexity of f and (L_*, L_F, L_infinity)-Lipschitz continuity of local Hessians grad^2 f_i, FedNL (Algorithm 1) initialized in the local neighborhood ||x^0 - x^*|| <= mu / sqrt(2*D) and H^k = (1/n) sum_{i=1}^n ||H_i^k - grad^2 f_i(x^*)||_F^2 <= mu^2 / (4*C) achieves: (1) a universal local linear rate ||x^k - x^*||^2 <= (1/2^k)||x^0 - x^*||^2 (also achieved by Newton Zero N0 with C_i^k = 0, alpha = 0, H_i^0 = grad^2 f_i(x^0)), (2) linear Hessian-learning Lyapunov contraction E[Phi^k] <= (1 - min{A, 1/3})^k Phi^0, and (3) local superlinear convergence E[||x^{k+1} - x^*||^2 / ||x^k - x^*||^2] <= (1 - min{A, 1/3})^k * (C + D/(12*B*L_F^2)) * Phi^0 / mu^2, all independent of the condition number kappa and the number of local data points m.'
  evidence:
  - source_id: r574-primary-pdf
    locator: Section 3.4 Theorem 3.6, Lemmas 3.7-3.8, Eqs. (5)-(9), pp. 12-13; Section 3.5 Eq. (10), p. 14; Appendix C Lemma C.1, pp. 33-38
    relation: supports
- claim_id: fednl-extensions-partial-participation-globalization-and-bidirectional-compression
  kind: mechanism
  statement: 'FedNL extends to: (i) partial participation of tau out of n clients (FedNL-PP, Algorithm 2, Theorem D.1) via Hessian-corrected local gradients g_i^k = (H_i^k + l_i^k I)w_i^k - grad f_i(w_i^k) with rate E[W^k] <= (1 - 3*tau/(4*n))^k W^0; (ii) global linear convergence via backtracking line search (FedNL-LS, Algorithm 3, Theorem E.1); (iii) global O(1/k) convex and linear strongly convex convergence via cubic regularization (FedNL-CR, Algorithm 4, Theorem F.1); and (iv) bidirectional contractive/unbiased model and Bernoulli gradient compression (FedNL-BC, Algorithm 5, Theorem G.4).'
  evidence:
  - source_id: r574-primary-pdf
    locator: Table 3, p. 9; Section 4, p. 15; Appendices D, E, F, and G, pp. 39-62
    relation: supports
- claim_id: fednl-federated-logistic-regression-application
  kind: application
  statement: Applied to heterogeneous L2-regularized logistic regression on LIBSVM datasets (a1a, a9a, w7a, w8a, phishing, madelon) with Rank-1, Top-d, and PowerSGD Hessian compressors at O(d) communication per round, FedNL and FedNL-LS reduce total communicated bits per node by orders of magnitude relative to ADIANA, DIANA, S-Local-GD, DINGO, DORE, Artemis, and NL1.
  evidence:
  - source_id: r574-primary-pdf
    locator: Section 5 Experiments, Figure 2, pp. 16-17; Appendix B Figures 3-14, pp. 24-33
    relation: supports
- claim_id: fednl-limitations
  kind: limitation
  statement: FedNL requires computing exact local gradients grad f_i(x^k) and d x d local Hessians grad^2 f_i(x^k) on participating clients and solving a d x d linear system (or eigenvalue projection in Option 1) on the server at each round, making per-iteration local and server computation O(d^2) to O(d^3); moreover, its theoretical guarantees cover convex and strongly convex objectives without stochastic local gradient/Hessian oracles or formal differential privacy.
  evidence:
  - source_id: r574-primary-pdf
    locator: Section 3.3, p. 12; Appendix I Limitations, p. 64
    relation: supports
