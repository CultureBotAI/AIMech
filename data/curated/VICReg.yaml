claims:
- claim_id: method
  kind: mechanism
  statement: Encode paired augmented views and pass their representations through expander networks to
    obtain n-by-d embeddings Z and Z′, n≥2. In the paper’s Equations (1)–(6), define s(Z,Z′)=sum_i||z_i−z′_i||^2/n;
    v(Z)=sum_j max(0,gamma−sqrt(Var(Z_:j)+epsilon))/d with epsilon>0 and a target gamma>0; and c(Z)=sum_(j≠k)
    C(Z)_jk^2/d, where C(Z)=sum_i(z_i−mean(Z))(z_i−mean(Z))^T/(n−1). Use sample variance consistent with
    the covariance diagonal and the supplement’s variance call. Minimize lambda s+mu[v(Z)+v(Z′)]+nu[c(Z)+c(Z′)]
    for positive weights, differentiating through both branches without target stop-gradient. Branches
    must produce matching embedding dimensions but can have different encoder architectures or weights.
    The loss requires no output normalization, negative-pair dictionary or momentum teacher. After pretraining
    discard the expanders and retain encoder representations.
