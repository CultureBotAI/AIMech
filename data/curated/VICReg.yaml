name: VICReg
definition: A self-supervised joint-embedding procedure that combines a paired-view invariance loss with
  separate per-branch penalties for insufficient coordinate standard deviation and off-diagonal covariance.
concept_kind: algorithm
identity_notes: This is VICReg as defined by Bardes et al., not a generic covariance penalty, Barlow Twins
  cross-correlation loss, VICRegL or a checkpoint. Both branches are optimized through their outputs;
  shared weights and identical backbones are supported but are not requirements of the general construction.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 191 prior
  native IDs/names/aliases. Ignored-inclusive searches of both full checkouts found only prior discovery
  leads (four hits per checkout) and one unrelated main-environment DFSWAVE token. Neighboring SimCLR,
  MoCo, BYOL and DINO procedures and exact AIO definitions/edges were inspected; shared components do
  not establish identity.
limitations:
- The pinned author code uses element-averaged F.mse_loss and averages the two variance penalties with
  an additional factor 1/2. The main equations instead use a per-image squared Euclidean sum and a sum
  of branch variance penalties; coefficient values are not interchangeable without corresponding rescaling.
- A hinge on regularized standard deviation stops penalizing values above its threshold; it does not enforce
  equality to gamma or a hard variance constraint. A positive penalty at zero sample variance requires
  gamma>sqrt(epsilon), as in the reported gamma=1 and epsilon=0.0001 setting. A positive penalty at a
  collapsed output does not prove that every optimizer can escape it.
- The loss does not require batch normalization, but the reported expander architecture uses it internally.
  Absence of output normalization is not a claim that every layer is normalization-free.
- Covariance decorrelation does not establish statistical independence. With centered n-sample embeddings,
  rank limits can make simultaneous positive variance in all d coordinates and exactly zero off-diagonal
  covariance unattainable when d>n−1.
- The pinned distributed implementation gathers embeddings with backward support and uses the configured
  global batch size in the covariance denominator. Framework defaults, batch composition, augmentation,
  dimensions and coefficients matter to reproduction. No historical runtime execution, general noncollapse
  guarantee or numerical benchmark is asserted.
