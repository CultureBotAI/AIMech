name: Temporal-difference learning
definition: A family of prediction-learning methods that assign temporal credit using discrepancies between
  successive, recursively related predictions of future outcomes, with intervening costs or rewards included
  when the target is cumulative.
concept_kind: learning_paradigm
identity_notes: 'This family-level record covers temporal-difference prediction and the original TD(lambda)
  construction, including TD(0) and TD(1) endpoints. It is not a policy optimizer, the GAE advantage estimator,
  backpropagation as a way to compute derivatives, a Markov-chain model, or every sequential prediction
  problem. TD(lambda) is treated here as a specified family member rather than a synonym for the whole
  paradigm. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  298 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 20 and 20 lines respectively. All 17 unique hit contents were
  inspected: prior TD(lambda) and Q-routing leads, GAE and AntNet boundary statements, and their saved
  reports/reviews. These were references to methods rather than existing candidate records. Six exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The prediction targets must obey the declared temporal recursion. Consecutive forecasts of different
  future events cannot simply be subtracted; Section 5.3 embeds fixed-horizon forecasts in a larger set
  of related predictions. Terminal-outcome and cumulative-outcome formulations use different terminal
  conventions.
- The original linear TD(0) theorem is convergence in expected value for an absorbing Markov setting,
  linearly independent state observation vectors, and sufficiently small constant step size, with weight
  changes after each sequence. It is not an almost-sure convergence theorem for arbitrary online nonlinear
  networks or a finite-data guarantee; the proof appendix was not independently audited.
- TD(1)’s fixed-weight per-sequence equivalence does not make all TD methods identical to Monte Carlo
  or supervised learning. Updating weights within a sequence changes predictions and traces; Section 5.2
  warns against mixing predictions computed with inconsistent parameter versions.
- Temporal credit assignment and structural backpropagation are compatible but distinct. The method family
  alone supplies neither a control policy nor an exploration strategy. No claim of universal accuracy,
  lower computation, or benchmark superiority is curated.
