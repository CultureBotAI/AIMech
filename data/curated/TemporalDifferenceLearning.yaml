claims:
- claim_id: method
  kind: mechanism
  statement: For the original terminal-outcome problem, predictions P_t=P(x_t,w) estimate the same eventual
    scalar outcome z and P_(m+1)=z. With weights held fixed within a sequence, compute increments Delta
    w_t=alpha*(P_(t+1)−P_t)*e_t, where e_t=sum_(k=1..t) lambda^(t−k)*grad_w P_k and 0<=lambda<=1; apply
    their sum after the sequence. The trace can be maintained recursively as e_t=grad_w P_t+lambda*e_(t−1).
    TD(0) uses only the current prediction gradient, whereas TD(1) gives the same per-sequence changes
    as the corresponding supervised outcome-error update under the fixed-weight convention. In the cumulative-outcome
    extension, replace the difference with c_(t+1)+P_(t+1)−P_t and set the terminal remaining prediction
    to zero. This is the source’s undiscounted cumulative formulation, not an implicit insertion of a
    discount factor. Intra-sequence weight updates are a separate extension requiring consistent parameter
    timing; simple algebraic equivalence at fixed weights does not establish equality of online trajectories.
  evidence:
  - source_id: method-source
    locator: Sections 2.1–2.3, PDF pp.5–8 / journal pp.13–16, Equations 1–4 and trace recursion; Theorem
      2 statement, PDF pp.16–17; Sections 5.1–5.3, PDF pp.25–28 / journal pp.33–36; Section 6.2, PDF pp.29–30
    relation: supports
- claim_id: control-application
  kind: scope
  statement: TD prediction can supply value estimates in a reinforcement-learning control procedure. The
    author exposition estimates the current behavior policy’s action values using TD updates while improving
    that policy toward greedy choices. Prediction alone does not specify the action-selection and policy-improvement
    components of a complete control algorithm.
  evidence:
  - source_id: author-book-draft
    locator: Section 6.4, PDF pp.155–156 / printed pp.137–138, TD prediction applied to on-policy control
      and Sarsa pseudocode
    relation: supports
