id: AIMech:ProdigyExpeditiouslyAdaptiveParameterFreeOptimization
name: Prodigy (Expeditiously Adaptive Parameter-Free Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: "A parameter-free adaptive optimization algorithm that estimates the initial distance to the solution D = ||x_0 - x_*|| online via a monotonically non-decreasing lower bound d_{k+1} = max(d_k, d_hat_{k+1}) and places d_i^2-weighted gradient norms inside the AdaGrad/Adam step-size denominator \u2014 setting eta_k = d_k^2 lambda_k / sqrt(d_k^2 G^2 + sum_{i=0}^k d_i^2 lambda_i^2 ||g_i||^2) in Gradient Descent (Algorithm 1), gamma_{k+1} = 1 / sqrt(lambda_{k+1} G^2 + sum_{i=0}^k lambda_i ||g_i||^2) with lambda_k = d_k^2 in Dual Averaging (Algorithm 2), and scaling moments by d_k and d_k^2 with sqrt(beta_2) EMA tracking of r_{k+1} and s_{k+1} in Adam (Algorithm 3) \u2014 improving the worst-case non-asymptotic convergence rate of D-Adaptation by a factor of O(sqrt(log(D / d_0)))."
identity_notes: Distinct from standard D-Adaptation in that Prodigy weights each historical squared gradient norm in the step-size denominator by d_i^2 rather than unweighted ||g_i||^2, yielding a provably larger step size d_k^2 / sqrt(sum_{i=0}^k d_i^2 ||g_i||^2) >= d_k / sqrt(sum_{i=0}^k ||g_i||^2) and reducing the dependence on the initial distance underestimate D / d_0 from O(log(D / d_0)) to the optimal O(sqrt(log(D / d_0))). Distinct from DoG in that Prodigy estimates D via a dual lower bound d_hat_{k+1} rather than the maximum iterate displacement max_{i<=k} ||x_i - x_0|| and naturally supports coordinatewise Adam preconditioning.
