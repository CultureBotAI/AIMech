claims:
- claim_id: c-r590-d2-weighted-stepsize-and-sqrt-log-rate
  kind: mechanism
  statement: By weighting historical squared gradients in the denominator by d_i^2 (and optional non-decreasing weights lambda_i), Prodigy produces step sizes eta_k = d_k^2 / sqrt(sum_{i=0}^k d_i^2 ||g_i||^2) that are provably larger than D-Adaptation's d_k / sqrt(sum_{i=0}^k ||g_i||^2) and bounds min_{t<N} d_{t+1} / sqrt(sum_{k=0}^t d_k^2) <= 4 sqrt(log_{2+}(d_N / d_0)) / sqrt(N) (Lemma 1), achieving O(G D sqrt(log_{2+}(D / d_0)) / sqrt(n)) convergence in Dual Averaging (Theorem 2) and improving upon D-Adaptation by O(sqrt(log(D / d_0))).
  evidence:
  - source_id: r590-primary-pdf
    locator: Section 2, pp. 2-4; Lemma 1 & Theorems 1-2, pp. 3-4; Appendix A.2-A.4, pp. 15-21
    relation: supports
- claim_id: c-r590-adam-exponential-weighting-derivation
  kind: mechanism
  statement: Setting exponential weights lambda_k = beta_2^{-k/2} in Prodigy's step-size identity yields the Adam variant (Algorithm 3), which scales first and second moment updates by d_k and d_k^2 (m_{k+1} = beta_1 m_k + (1 - beta_1) d_k g_k, v_{k+1} = beta_2 v_k + (1 - beta_2) d_k^2 g_k^2) and tracks numerator r_{k+1} and l_1-norm denominator s_{k+1} using exponential moving average factor sqrt(beta_2) to update d_hat_{k+1} = r_{k+1} / ||s_{k+1}||_1.
  evidence:
  - source_id: r590-primary-pdf
    locator: Algorithm 3, p. 6; Section 5, pp. 6-7; Appendix A.5, Algorithm 4 & Theorem 7, pp. 22-25
    relation: supports
- claim_id: c-r590-exponentially-bounded-lower-complexity
  kind: scope
  statement: D-Adaptation, DoG, and Prodigy all belong to the class of exponentially bounded optimization algorithms satisfying ||x_k - x_0|| <= 2^k d_0 for G-bounded gradients (Definition 1, Theorem 3), for which any algorithm without problem constants G and D suffers a worst-case lower bound min_{k<=n} f(x_k) - f_* >= D G sqrt(log_2(D / x_1)) / (2 sqrt(n + 1)) (Theorem 4), proving that Prodigy's sqrt(log(D / d_0)) dependence is optimal within this class.
  evidence:
  - source_id: r590-primary-pdf
    locator: Section 3, Definition 1 & Theorems 3-4, pp. 4-5; Appendix B, Theorems 8-9, pp. 25-27
    relation: supports
- claim_id: c-r590-fast-growing-weights-and-da-limitation
  kind: limitation
  statement: Prodigy's Dual Averaging convergence analysis requires monotonically decreasing step sizes gamma_{k+1} and therefore only holds for fixed weights lambda_k = d_k^2, while in the Gradient Descent variant choosing exponentially growing weights lambda_k = beta_2^{-k^p} requires p < 1/3 to guarantee worst-case convergence.
  evidence:
  - source_id: r590-primary-pdf
    locator: Section 2, p. 4
    relation: supports
