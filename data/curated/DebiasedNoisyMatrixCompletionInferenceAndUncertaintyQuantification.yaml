claims:
- claim_id: claim-equivalence-of-debiased-matrix-and-deshrunken-factor-estimators
  kind: mechanism
  statement: For regularization parameter $\lambda = C_\lambda\sigma\sqrt{np}$, Lemma 3 proves that the convex de-biased estimator $\boldsymbol{M}^{\text{cvx,d}} = \mathcal{P}_{\text{rank-}r}[\boldsymbol{Z}^{\text{cvx}} - p^{-1}\mathcal{P}_\Omega(\boldsymbol{Z}^{\text{cvx}} - \boldsymbol{M})]$, the nonconvex de-biased estimator $\boldsymbol{M}^{\text{ncvx,d}}$, the tangent-space linearized estimator $\boldsymbol{Z} - p^{-1}\mathcal{P}_T\mathcal{P}_\Omega(\boldsymbol{Z} - \boldsymbol{M})$, and the de-shrunken factor product $\boldsymbol{X}^{\text{ncvx,d}}\boldsymbol{Y}^{\text{ncvx,d}\top}$ coincide within $O(n^{-4}\sigma\sqrt{n/p})$ in Frobenius norm and obey the exact Gram de-shrinking identity $\boldsymbol{Y}^{\text{d}\top}\boldsymbol{Y}^{\text{d}} = \boldsymbol{Y}^\top\boldsymbol{Y} + \frac{\lambda}{p}\boldsymbol{I}_r$ (Sections 3.2 and 5.1, Lemma 3, Appendix C, Equation D.4).
  evidence:
  - source_id: cfmy2019-mcinf-pdf
    locator: Section 3.2 (Eqs. 3.7-3.9, pp. 6-7), Section 5.1 (Lemma 3, p. 19), Appendix C & D.1 (pp. 28-34)
    relation: supports
- claim_id: claim-nonasymptotic-gaussian-factor-and-entrywise-confidence-intervals
  kind: mechanism
  statement: "Under $np \\gtrsim \\kappa^8\\mu^3 r^3\\log^3 n$ and $\\sigma/\\sigma_{\\min} \\lesssim \\sqrt{p/(\\kappa^8\\mu r n\\log^2 n)}$, Theorems 1\u20132 and 5\u20136 prove that $\\boldsymbol{X}^{\\text{d}}\\boldsymbol{H}^{\\text{d}} - \\boldsymbol{X}^\\star = \\boldsymbol{Z}_X + \\boldsymbol{\\Psi}_X$ with i.i.d. rows $\\boldsymbol{Z}_X^\\top\\boldsymbol{e}_j \\sim \\mathcal{N}(\\boldsymbol{0}, \\frac{\\sigma^2}{p}(\\boldsymbol{\\Sigma}^\\star)^{-1})$ and negligible residual $\\|\\boldsymbol{\\Psi}_X\\|_{2,\\infty} = o(\\sigma\\sqrt{r/(p\\sigma_{\\max})})$, while each entry satisfies $M_{ij}^{\\text{d}} - M_{ij}^\\star = g_{ij} + \\Delta_{ij}$ with $g_{ij} \\sim \\mathcal{N}(0, v_{ij}^\\star)$, $|\\Delta_{ij}| = o(\\sqrt{v_{ij}^\\star})$, and plug-in variance $v_{ij} = \\frac{\\sigma^2}{p}(\\boldsymbol{X}_{i,\\cdot}^{\\text{d}}(\\boldsymbol{X}^{\\text{d}\\top}\\boldsymbol{X}^{\\text{d}})^{-1}\\boldsymbol{X}_{i,\\cdot}^{\\text{d}\\top} + \\boldsymbol{Y}_{j,\\cdot}^{\\text{d}}(\\boldsymbol{Y}^{\\text{d}\\top}\\boldsymbol{Y}^{\\text{d}})^{-1}\\boldsymbol{Y}_{j,\\cdot}^{\\text{d}\\top})$ achieving asymptotically exact $(1-\\alpha)$ coverage matching the oracle Cram\xE9r\u2013Rao lower bounds of Lemmas 1\u20132 (Sections 3.3\u20133.4 and 5.2\u20135.5)."
  evidence:
  - source_id: cfmy2019-mcinf-pdf
    locator: Sections 3.3-3.4 (Theorems 1-2, Corollary 1, Lemmas 1-2, pp. 7-11), Sections 5.2-5.5 (Theorems 5-6, pp. 20-23)
    relation: supports
- claim_id: claim-exact-frobenius-estimation-optimality-including-preconstant
  kind: application
  statement: "Summing the de-biased factor decompositions over all $n^2$ entries, Theorem 3 proves that $\\|\\boldsymbol{M}^{\\text{d}} - \\boldsymbol{M}^\\star\\|_F^2 = \\frac{(2+o(1))nr\\sigma^2}{p}$ with probability at least $1 - O(n^{-3})$, matching the oracle tangent-space lower bound $\\mathbb{E}[\\|\\widehat{\\boldsymbol{M}} - \\boldsymbol{M}^\\star\\|_F^2 \\mid \\Omega] \\ge \\frac{(1-\\varepsilon)2nr\\sigma^2}{p}$ of Theorem 4 with the exact pre-constant 2 (Section 3.5, Theorems 3\u20134, Appendix G)."
  evidence:
  - source_id: cfmy2019-mcinf-pdf
    locator: Section 3.5 (Theorems 3-4, p. 11), Appendix G (pp. 53-55)
    relation: supports
