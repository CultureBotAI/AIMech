id: AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization
name: signSGD and Majority-Vote Compressed Non-Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A 1-bit gradient-compression and non-convex stochastic optimization framework (Bernstein, Wang, Azizzadenesheli, & Anandkumar 2018) that updates model parameters using only the coordinate-wise sign of the stochastic minibatch gradient, x_{k+1} = x_k - delta_k * sign(gtilde_k) (signSGD, Algorithm 1), or the sign of an exponential moving-average momentum buffer, x_{k+1} = x_k - delta_k * sign(m_k) where m_k = beta * m_{k-1} + (1 - beta) * gtilde_k (Signum, Algorithm 3), and in M-worker distributed data-parallel training aggregates 1-bit worker signs at the parameter server via a 1-bit majority vote x_{k+1} = x_k - delta * sign(sum_{m=1}^M sign(gtilde_{m,k})) (Algorithm 2), establishing non-convex stationarity in the l_1-norm E||g_k||_1 at rate O(1 / K^{1/4}) (or O(1 / N^{1/4}) total samples with large minibatch n_k = K) under coordinate-wise smoothness vector Lvec and coordinate-wise noise vector sigmavec.
identity_notes: Distinct from randomized unbiased multi-level l_2-norm quantization QSGD (Alistarh et al. 2017, Round 378), which preserves unbiasedness E[Q_s(v)] = v via stochastic rounding and transmits ||v||_2 plus Elias-coded integer levels; from deterministic Rprop (Riedmiller & Braun 1993), which adapts per-coordinate step sizes heuristic-ally across epochs based on consecutive sign agreement without stochastic minibatch convergence guarantees or M-worker majority voting; and from Adam (Kingma & Ba 2015), which divides momentum by the root-mean-square gradient second moment rather than transmitting pure 1-bit signs.
aliases:
- signSGD
- Majority-Vote signSGD
- Signum
- Sign-Based Stochastic Gradient Descent
