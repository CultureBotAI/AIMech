claims:
- claim_id: r377-claim-l1-geometry-descent-and-sign-error-probability-bound
  kind: mechanism
  statement: Under coordinate-wise smoothness |f(y) - f(x) - g(x)^T (y - x)| <= 1/2 * sum_{i=1}^d L_i (y_i - x_i)^2 (Assumption 2) and coordinate-wise variance E[(gtilde_i - g_i)^2] <= sigma_i^2 (Assumption 3), a sign step x_{k+1} = x_k - delta * sign(gtilde_k) satisfies E[f(x_{k+1}) - f(x_k) | x_k] <= -delta * ||g_k||_1 + 2 * delta * sum_{i=1}^d |g_{k,i}| * P(sign(gtilde_{k,i}) != sign(g_{k,i})) + (delta^2 / 2) * ||Lvec||_1; bounding the sign flip probability via Cantelli's inequality P(sign(gtilde_{k,i}) != sign(g_{k,i})) <= 1 / (1 + S_i^2) (or 2 / (9 * S_i^2) for unimodal symmetric noise by Gauss's inequality) where S_i = |g_{k,i}| / (sigma_i / n_k^{1/2}) proves |g_{k,i}| * P(sign(gtilde_{k,i}) != sign(g_{k,i})) <= sigma_i / n_k^{1/2} and yields (1/K) sum_{k=0}^{K-1} E||g_k||_1 <= O((||Lvec||_1 * Delta_f)^{1/2} / N^{1/4} + ||sigmavec||_1 / N^{1/4}) when n_k = K = N^{1/2} (Lemma 1, Theorem 1).
  evidence:
  - source_id: r377-primary-pdf
    locator: Section 2-3, Assumptions 1-3, Lemma 1, Theorem 1; Appendix B-C, Proof of Lemma 1 and Theorem 1
    relation: supports
- claim_id: r377-claim-distributed-1bit-majority-vote-variance-reduction
  kind: mechanism
  statement: In M-worker parameter-server training where each worker transmits only the 1-bit vector sign(gtilde_{m,k}) and the server broadcasts back only the 1-bit aggregated majority vote sign(sum_{m=1}^M sign(gtilde_{m,k})) (Algorithm 2), whenever single-worker noise is unimodal and symmetric (so single-worker sign accuracy 1 - p_i > 1/2), the M-worker majority vote drives the sign-error term down by O(1 / M^{1/2}), achieving (1/K) sum_{k=0}^{K-1} E||g_k||_1 <= O((||Lvec||_1 * Delta_f + ||sigmavec||_1 / M^{1/2}) / K^{1/2}) with 32x less bidirectional communication than 32-bit distributed SGD and zero floating-point parameter server traffic (Theorem 2).
  evidence:
  - source_id: r377-primary-pdf
    locator: Section 3.2, Algorithm 2, Theorem 2; Appendix D, Proof of Theorem 2
    relation: supports
- claim_id: r377-claim-signum-momentum-convergence-and-adam-connection
  kind: application
  statement: Signum (Algorithm 3), which takes the sign of the exponential moving-average momentum m_k = beta * m_{k-1} + (1 - beta) * gtilde_k (equivalent to Adam with beta_2 -> 1), achieves non-convex stationarity min_{0 <= k <= K} E||g_k||_1^2 <= O(1 / N^{1/2}) under increasing minibatch schedule n_k = k^2 via a Martingale difference variance decomposition and Taylor Hessian-sign bias bound (Theorem 3, Lemmas F.1-F.3), and matches SGD/Adam test accuracy on CIFAR-10 and ImageNet ResNet-50 while compressing gradients to 1 bit.
  evidence:
  - source_id: r377-primary-pdf
    locator: Section 4-5, Algorithm 3, Theorem 3, Figures 2-4; Appendix E-F, Lemmas E.1 and F.1-F.3
    relation: supports
