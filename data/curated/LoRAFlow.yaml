claims:
- claim_id: loraflow-layerwise-token-conditioned-fusion-gate
  kind: mechanism
  statement: At decoding step t and transformer layer l, LoRA-Flow computes a k-dimensional fusion weight vector w^l = softmax(W^l_gate x^l_t) + b^l from the layer input hidden state x^l_t in R^d using learnable gate parameters W^l_gate in R^{k x d} and bias b^l in R^{k x 1} (accounting for roughly 0.2% of the parameters of a rank-64 LoRA), where the additive bias b^l permits negative fusion weights for specific tokens.
  evidence:
  - source_id: r685-primary-pdf
    locator: Section 3.1 Calculating Fusion Weights, Eq. 5 & Section 5.3, p. 3, 6
    relation: supports
- claim_id: loraflow-output-level-heterogeneous-rank-integration
  kind: mechanism
  statement: Rather than averaging internal A_i and B_i factor matrices, LoRA-Flow treats each of the k frozen LoRAs as a complete module and combines their output vectors Delta h = [Delta h_1; ...; Delta h_k] in R^{d x k} within every adapted linear projection of layer l via h' = h + Delta h w^l, enabling seamless fusion of LoRA modules trained with different middle ranks (such as rank 64 language LoRAs and rank 256 code LoRAs).
  evidence:
  - source_id: r685-primary-pdf
    locator: Section 3.2 Integrating Fusion Weights, Eq. 6 & Section 4.1 Setup, p. 3-4
    relation: supports
- claim_id: loraflow-multilingual-math-and-code-generation-application
  kind: application
  statement: LoRA-Flow is applied to few-shot cross-lingual mathematical reasoning (MGSM) and code generation (multilingual HumanEval) on Llama-2-7B and Llama-2-13B by dynamically fusing target-language chat LoRAs (Chinese, Russian, Spanish) with English math or code LoRAs using 200 few-shot examples, consistently outperforming static task-level fusion methods including LoraHub and uniform averaging.
  evidence:
  - source_id: r685-primary-pdf
    locator: Section 4.2-4.3 Main Results, Tables 1-2 & Section 6.1-6.2 Tables 3-4, p. 5-7
    relation: supports
- claim_id: loraflow-unmerged-multi-lora-inference-and-supervised-gate-training
  kind: limitation
  statement: Because fusion weights w^l_t vary dynamically across every generated token, the k LoRA modules cannot be statically merged into the base weight matrix W prior to inference, requiring k parallel low-rank adapter evaluations per adapted module during decoding and gradient-based training of the gate parameters on labeled target-task examples.
  evidence:
  - source_id: r685-primary-pdf
    locator: Section 3.2-3.3, Eq. 5-8 & Figure 2, p. 3-4
    relation: supports
