id: AIMech:LoRAFlow
name: LoRA-Flow
concept_kind: algorithm
review_status: DRAFT
definition: A dynamic multi-LoRA fusion algorithm for autoregressive language generation that computes token-step and layer-specific fusion weights w^l_t = softmax(W^l_gate x^l_t) + b^l from each transformer layer's input hidden state x^l_t and aggregates the output vectors Delta h_i = B_i A_i x of k frozen pre-trained LoRA modules (including modules with heterogeneous ranks) as h' = h + Delta h w^l_t.
identity_notes: Distinct from LoraHub (AIMech:LoraHub, which learns static task-level scalar weights shared across all layers and tokens and composes internal factors (sum_i w_i A_i)(sum_i w_i B_i) requiring identical rank r across all modules), from HydraLoRA (AIMech:HydraLoRA, which jointly trains a shared down-projection A and multiple up-projection heads B_i from scratch rather than fusing independently pre-trained, frozen skill and language LoRAs), and from standard LoRA (AIMech:LoRA). Formulated by Wang et al. (ACL 2024, pages 12871-12882; arXiv:2402.11455).
aliases:
- LoRA-Flow Dynamic LoRA Fusion
- Token- and Layer-Level Dynamic LoRA Fusion (LoRA-Flow)
- LoRA-Flow Context-Gated Multi-LoRA Integration
