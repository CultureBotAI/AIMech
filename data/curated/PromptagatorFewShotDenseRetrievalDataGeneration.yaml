id: AIMech:PromptagatorFewShotDenseRetrievalDataGeneration
name: Promptagator Few-Shot Dense Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: "A few-shot dense retrieval training method (Prompt-based Query Generation for Retriever) that prompts a large language model with task-specific document and query role descriptions alongside a small set (2 to 8) of in-domain relevant query-document pairs to generate synthetic queries across a target document corpus, trains an initial dual-encoder retriever on the noisy synthetic pairs to apply round-trip consistency filtering\u2014retaining a synthetic pair only if its source passage is ranked in the top-K retrieved passages\u2014and fine-tunes a compact task-specific dual encoder and optional cross-attention reranker (Promptagator++) on the filtered data."
identity_notes: Distinct from InPars (AIMech:InParsInContextDataAugmentationForInformationRetrieval), which filters synthetic queries by length-normalized generation log-probability and trains only a second-stage cross-encoder reranker over BM25 candidates, whereas Promptagator conditions on task-specific search-intent role prefixes (e.g., counter-argument vs. fact-check claim), performs round-trip retrieval consistency filtering using a self-trained initial dual encoder without external QA models, and produces a standalone first-stage dense dual encoder. Also distinct from zero-shot hypothetical document embedding at query time (AIMech:HyDEHypotheticalDocumentEmbeddings), which calls an LLM online for every test query rather than distilling synthetic queries offline into a fast 110M dual encoder.
aliases:
- Promptagator
- Prompt-based Query Generation for Retriever
- Promptagator Few-Shot Dense Retrieval and Round-Trip Filtering
