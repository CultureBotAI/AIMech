claims:
- claim_id: promptagator-intent-conditioned-query-generation
  kind: mechanism
  statement: Promptagator constructs a prompt of the form (e_doc(d_1), e_query(q_1), ..., e_doc(d_k), e_query(q_k), e_doc(d)) using task-specific document and query role prefixes and at most k=8 examples to sample synthetic queries q_hat from a large language model across target corpus passages d in D_T, capturing task-specific search intents such as counter-argument retrieval or claim verification.
  evidence:
  - source_id: r740-primary-pdf
    locator: Section 2.1 & Section 3.1, pp. 3-4, Table 4
    relation: supports
- claim_id: promptagator-self-supervised-round-trip-consistency-filter
  kind: mechanism
  statement: Without relying on an external supervised question-answering model, Promptagator trains an initial dual-encoder retriever on the raw synthetic (q, d) pairs and filters the synthetic dataset by keeping (q, d) only when the initial retriever ranks the source passage d within the top-K (with K=1) passages for q.
  evidence:
  - source_id: r740-primary-pdf
    locator: Section 3.2 & Section 4.1, pp. 4 & 6
    relation: supports
- claim_id: promptagator-beir-dual-encoder-and-reranker-application
  kind: application
  statement: Evaluated across 11 heterogeneous retrieval datasets in BEIR, a 110M-parameter Promptagator dual encoder trained from at most 8 examples without MS MARCO supervision outperforms MS MARCO-supervised ColBERT v2 and SPLADE v2 by over 1.2 nDCG@10 on average, and adding a 110M Promptagator++ cross-attention reranker yields an additional 5.0 nDCG@10 gain.
  evidence:
  - source_id: r740-primary-pdf
    locator: Section 4.2, pp. 6-7, Table 2
    relation: supports
  - source_id: r740-metadata-cr
    locator: DBLP bibliographic record Zhuyun Dai et al. ICLR 2023
    relation: supports
- claim_id: promptagator-small-corpus-filtering-overfitting-limitation
  kind: limitation
  statement: On very small target corpora (such as NFCorpus and SciFact), aggressive top-1 round-trip consistency filtering can discard too many synthetic pairs and cause subsequent dual-encoder fine-tuning to overfit, slightly reducing retrieval accuracy.
  evidence:
  - source_id: r740-primary-pdf
    locator: Section 4.3, p. 7, Figure 2(a)
    relation: supports
