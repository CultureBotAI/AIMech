id: AIMech:ConvPass
name: Convpass
concept_kind: architecture
review_status: DRAFT
definition: 'A vision-oriented parameter-efficient transfer learning architecture (Convolutional Bypasses) for Vision Transformers that inserts trainable ResNet-style convolutional bottleneck modules in parallel with the frozen Multi-Head Self-Attention (MHSA) and Multi-Layer Perceptron (MLP) blocks: X'' <- X + MHSA/MLP(LN(X)) + s * Convpass(LN(X)). Each Convpass module consists of a 1x1 channel-reducing convolution (d -> h, where h << d, followed by GELU), a 2D spatial reconstruction step that reshapes the flattened 1D patch sequence back to a 2D grid while treating the [cls] token as an individual 1x1 image for a 3x3 spatial convolution (h -> h, followed by GELU), and a 1x1 channel-expanding convolution (h -> d), introducing 2*L*((2*h + 1)*d + 9*h^2 + 2*h) trainable parameters across L layers to inject 2D spatial locality and token-mixing inductive bias.'
identity_notes: Distinct from language-oriented channel-wise MLP adapters such as Bottleneck Adapters (AIMech:BottleneckAdapter) and AdaptFormer (AIMech:AdaptFormer), whose 1x1 linear projections cannot mix information across spatial neighbors without relying on the frozen MHSA block, and from LoRA (AIMech:LowRankAdaptation) and VPT (AIMech:VisualPromptTuning), which lack 2D neighborhood inductive bias.
aliases:
- Convolutional Bypasses
- Convpass_attn
- Convpass_CLIP
- Convolutional Bypass Vision Transformer Adapter
