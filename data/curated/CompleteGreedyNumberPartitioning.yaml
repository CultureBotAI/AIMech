      the curated deterministic procedure.
limitations:
- The bins are interchangeable, empty bins are allowed, and the objective is load range. Capacity constraints,
  equal cardinalities, bin-dependent costs and alternative objectives are outside this identity.
- The multiway average-based lower bound is generally optimistic; it is not an attainable solution or
  an optimality certificate by itself.
- Exact certification assumes exact arithmetic or conservative bounds. Integer divisibility supplies a
  lower bound, not a promise of perfect balance.
- The complete primary manuscript was read. The later final journal text and author implementation were
  not inspected; constructed arithmetic is not a performance replication.
