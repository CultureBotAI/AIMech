id: AIMech:CompleteGreedyNumberPartitioning
name: Complete greedy number partitioning
aliases:
- CGA
- Complete greedy algorithm for number partitioning
concept_kind: algorithm
definition: A complete anytime number-partitioning search that assigns weights in decreasing order to
  a fixed number of bins, explores the currently lightest-bin choices first, and retains the smallest
  load range while pruning by valid bounds and bin symmetry.
identity_notes: Compared all 442 pinned AIO and 589 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 63, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 67 AIO and 96 native definitions, with every matched definition
  read. 6 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. The
  named CGA performs complete item-to-bin assignment with a greedy successor order. It is distinct from
  generic DFS, discrepancy ordering and KK/CKK residual composition. Its two-way and multiway forms share
  this item-assignment mechanism and are retained in one range-minimization record; k-way bounds are not
  asserted to be attainable. Existing hits are neighboring records, rendered text and discovery leads.
  No suitable pinned AIO counterpart was identified.
definition_evidence:
- source_id: korf1997
  locator: Sections 2.5 and 2.7, manuscript PDF/printed pp. 7–8 and 11–12; Sections 7.1–7.2, pp. 19–20
  relation: supports
claims:
- claim_id: greedy-first-assignment
  kind: mechanism
  statement: Sort a finite nonempty multiset of nonnegative weights in decreasing order. Search assignments
    of each next weight to k interchangeable bins, with k>=2, visiting bins in increasing current-load
    order. The first complete preferred path is sorted greedy partitioning. Keep the best complete assignment
    found under the range objective max(loads)-min(loads). This assigns original items one at a time,
    unlike KK or CKK composition of residual subpartitions.
  evidence:
  - source_id: korf1997
    locator: Sections 2.5 and 2.7, pp. 7–8 and 11–12; Sections 7.1–7.2, pp. 19–20
    relation: supports
- claim_id: symmetry-scope
  kind: mechanism
  statement: For the unconstrained objective, bins with equal current loads give equivalent remaining
    load-search problems, so only one such choice needs exploration at that node. This includes the initial
    empty-bin symmetry. It preserves the best objective value but need not enumerate every distinct item-membership
    partition. Extra bin-specific restrictions or cardinality constraints require a new symmetry argument;
    equality of loads alone would not justify ignoring them.
  evidence:
  - source_id: korf1997
    locator: Section 2.7, pp. 11–12; Section 7.2, p. 19; direct scope interpretation of bin-exchange symmetry
    relation: supports
- claim_id: optimistic-range-bound
  kind: mechanism
  statement: Let smax be the largest current bin load and R the sum of unassigned nonnegative weights.
    A lower bound on final range is max(0, smax-(sum(other current loads)+R)/(k-1)). If it is at least
    the best complete range, the subtree cannot improve that incumbent. For k>2 the average in this bound
    need not be attainable with indivisible weights. With current loads (10,0,0) and remaining item 4,
    the bound is 8 but the minimum attainable range is 10. In the special two-way case, a current load
    difference at least R is solved by placing all remaining items in the lighter bin.
  evidence:
  - source_id: korf1997
    locator: Section 2.7, pp. 11–12; Section 7.2, pp. 19–20; constructed exact-rational bound example
    relation: supports
- claim_id: complete-versus-interrupted
  kind: limitation
  statement: On a finite instance, exhaustive search with sound pruning can certify an optimum, but a
    limited run can return only its feasible incumbent. Exact integer loads have theoretical minimum range
    0 when the total is divisible by k and otherwise at least 1; attaining the applicable lower bound
    permits immediate certification, but divisibility does not ensure it is attainable. The search is
    exponential in the worst case. In a constructed two-way example with weights 8,7,6,5,4, the greedy
    range is 4, a one-node run remains uncertified at 4, and complete search reaches 0.
  evidence:
  - source_id: korf1997
    locator: Section 2.7, pp. 11–12; Sections 7.2 and 7.5, pp. 19–20 and 24–25; constructed enumeration
      and interruption example
    relation: supports
- claim_id: range-is-not-makespan
  kind: limitation
  statement: The multiway formulation curated here minimizes load range. For k>=3 this does not ensure
    that the returned solution also minimizes the largest load, despite the source’s introductory equivalence
    statement. For weights 4,4,4,6,6,9 in three bins, loads (10,10,13) attain the minimum range 3, while
    the minimum achievable largest load is 12, attained by (9,12,12), also with range 3. Thus a range-optimal
    tie can have a worse makespan. No lexicographic makespan tie-break is part of this record.
  evidence:
  - source_id: korf1997
    locator: Section 7 opening objective, p. 19; curator exhaustive assignment-state counterexample qualifies
      the source’s equivalence assertion
    relation: supports
  - source_id: korf1997
    locator: 'Section 7 opening, p. 19: claim that range minimization also minimizes the largest subset
      sum; qualified by the explicit constructed counterexample'
    relation: contradicts
- claim_id: reported-comparisons
  kind: scope
  statement: The source compares C implementations of CGA and CKK on uniformly sampled integer inputs,
    with implementation-specific small-state termination and node-accounting choices. Its two-way and
    three-way results favor CKK in the studied regimes but do not establish an input-independent runtime
    ordering. Complete search does not imply that every additional node improves the incumbent, nor does
    a small average runtime imply a polynomial worst-case bound.
  evidence:
  - source_id: korf1997
    locator: Sections 4–6, pp. 14–19; Section 7.5 and Figure 8, pp. 24–25
    relation: supports
