limitations:
- Connected simple undirected positive-conductance graphs with n>=3, distinct pair endpoints and endpoint-excluded
  normalization only. Disconnected components, signed weights, endpoint inclusion and edge centrality
  need separate conventions.
- Independent uniform pair sampling and exact electrical currents are assumptions of the estimator and
  concentration analysis. Dependence between vertex estimates is allowed by the union bound; biased pair
  sampling or approximate solves require separate analysis.
- Absolute-error probability does not guarantee relative accuracy at near-zero scores, deterministic accuracy
  or preserved rankings. Estimates above one are possible; no clipping, resampling or fallback is introduced.
- The chapter has a current-versus-potential cycle equation discrepancy and inconsistent incidence dimensions
  and intermediate normalization in its separate exact computation. This record uses its explicit weighted
  Laplacian, Ohm law, throughput definition and Algorithm 3. It does not adopt the separate closeness
  normalization or claim a corrected source edition.
- The complete twelve-page chapter was read, including mathematical renderings and Figure 1; no author
  implementation, raw results or benchmark replication. Finite rational examples check selected boundaries
  rather than proving every graph or numerical solver. DRAFT remains after author self-review.
