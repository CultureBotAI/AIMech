id: AIMech:QGaLoreQuantizedLowRankGradientProjection
name: Q-GaLore (Quantized GaLore with INT4 Projection and Layer-Adaptive Low-Rank Gradients)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient quantized low-rank gradient-projection optimization algorithm for pre-training and fine-tuning large language models that stores model weights and low-rank first- and second-order optimizer moments in INT8, quantizes the low-rank singular-vector projection matrices to INT4, accumulates low-magnitude weight updates into INT8 master weights via unbiased stochastic rounding, and dynamically doubles each layer's SVD subspace update interval whenever consecutive projection matrices exceed a cosine similarity threshold.
identity_notes: Distinct from GaLore (AIMech:GaLoreGradientLowRankProjection), which maintains full BF16/FP16 master weights, stores projection matrices in 16-bit floating point (or 8-bit in Q-GaLore baseline), and recomputes SVD projections at a fixed uniform interval across all layers. Distinct from QLoRA (AIMech:QloraQuantizedLowRankAdaptation), which freezes 4-bit NormalFloat base weights and optimizes only additive low-rank adapter matrices rather than updating the full-rank weight matrix in INT8 via quantized low-rank gradient projections.
aliases:
- Q-GaLore
- Quantized GaLore
- INT4-Projection Quantized Low-Rank Gradient Optimizer
- Layer-Adaptive Quantized Gradient Low-Rank Projection
