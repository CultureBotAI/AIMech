claims:
- claim_id: qgalore-layer-adaptive-subspace-cosine-schedule-mechanism
  kind: mechanism
  statement: Rather than recomputing SVD projections at a fixed uniform step interval across all layers, Q-GaLore evaluates the subspace cosine similarity CosSim(P_t, P_{t - Delta_t}) = (1/r) sum_{i=1}^r sigma_i(P_t^T P_{t - Delta_t}) between consecutive rank-r singular-vector projection matrices and doubles the layer's update interval Delta_t <- 2 * Delta_t whenever CosSim(P_t, P_{t - Delta_t}) > gamma (default gamma = 0.4), reducing SVD overhead by over 80%.
  evidence:
  - source_id: r641-primary-pdf
    locator: Section 3.1 Theorem 3.1, Equation (5), Figure 2, and Algorithm 1 lines 5-13, pages 3-5
    relation: supports
- claim_id: qgalore-int4-projection-and-int8-stochastic-rounding-mechanism
  kind: mechanism
  statement: Exploiting the low kurtosis and outlier-free range of unitary singular vectors in P_t, Q-GaLore quantizes the projection matrix P_t to 4-bit integers (INT4, cutting projection memory by 75% vs BF16), maintains low-rank first and second moments (M_t^Q, V_t^Q) in INT8, and updates INT8 master weights via W_t^Q <- W_{t-1}^Q + xi(alpha * P_t^Q * G_tilde_t) using unbiased stochastic rounding xi(.) to preserve small-gradient update information.
  evidence:
  - source_id: r641-primary-pdf
    locator: Section 3.2, Figure 3, and Algorithm 1 lines 7-8, 12, 16-20, pages 4-5
    relation: supports
- claim_id: qgalore-stationary-gradient-subspace-convergence-scope
  kind: scope
  statement: Theorem 3.1 establishes that for linear layers y = W x with batch input X and output gradient D_y, once weights enter a stationary region W_{t+T_1} approx W_{t+T_2}, the weight gradient G = (1/B) D_y X^T decomposes as A B C^T in the principal singular-vector subspaces of X X^T and D_y D_y^T, explaining why different layers converge to stable low-rank gradient subspaces at heterogeneous rates during training.
  evidence:
  - source_id: r641-primary-pdf
    locator: Section 3.1 Theorem 3.1 and Equations (3)-(4), pages 3-4
    relation: supports
- claim_id: qgalore-llama7b-single-16gb-gpu-pretraining-application
  kind: application
  statement: Q-GaLore enables pre-training a LLaMA-7B language model from scratch on a single NVIDIA RTX 4060 Ti GPU with 16 GB VRAM, reducing total weight and optimizer-state memory by up to 61.9% compared to BF16 Adam and 30.0% compared to GaLore while matching full-precision perplexity across LLaMA-60M to LLaMA-7B on C4 and fine-tuning benchmarks on GLUE and MMLU.
  evidence:
  - source_id: r641-primary-pdf
    locator: Abstract, Section 1 Figure 1, and Section 4.1-4.3 Tables 1-3, pages 1-2, 5-7
    relation: supports
- claim_id: qgalore-simulated-weight-quantization-throughput-limitation
  kind: limitation
  statement: Because Q-GaLore retains activations in 16-bit floating point and dequantizes INT8 weights during forward and backward passes (simulated weight-only quantization), its end-to-end training throughput depends on fused dequantization kernel efficiency and does not yet accelerate activation-weight matrix multiplications using native INT8 tensor cores.
  evidence:
  - source_id: r641-primary-pdf
    locator: Section 3.2 and Section 4.4 Figure 4, pages 4-5, 8
    relation: supports
