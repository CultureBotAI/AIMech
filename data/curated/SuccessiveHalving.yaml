claims:
- claim_id: method
  kind: mechanism
  statement: Start with a finite candidate set and a total allocation budget, divide effort across elimination
    rounds, evaluate the current survivors, retain their better-performing subset, and repeat with fewer
    candidates and more effort per survivor. The original stochastic Sequential Halving allocates floor(T/(|S|*ceil(log2(n))))
    samples per surviving arm in a round, ranks stage empirical reward averages, and keeps ceil(|S|/2)
    arms with the highest averages. The non-stochastic hyperparameter formulation instead allocates additional
    training pulls and compares current validation losses at cumulative training progress; it minimizes
    these losses rather than averaging raw observations as if they were i.i.d. rewards. Its analysis assumes
    fixed loss sequences with limits but does not require the convergence envelopes as inputs. Randomly
    sampled or prespecified configurations can supply the finite cohort. Resume within a candidate’s own
    training trajectory; the mechanism does not copy weights between candidates.
