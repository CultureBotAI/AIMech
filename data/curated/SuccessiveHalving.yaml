name: Successive Halving
definition: A staged best-candidate selection algorithm that divides a resource budget across elimination
  rounds, evaluates surviving candidates with comparable within-round effort, removes approximately the
  poorer-performing half, and allocates more effort per remaining candidate in later rounds.
concept_kind: algorithm
identity_notes: This record retains the common staged-halving algorithm with explicitly separated stochastic
  and non-stochastic realizations. Jamieson and Talwalkar identify their Successive Halving as the algorithm
  of Karnin et al., whose source calls it Sequential Halving. That attribution supports a shared identity,
  not equality of every printed rounding or score formula. One fixed-cohort halving run differs from Hyperband’s
  bracket hedge, ASHA’s growing asynchronous cohort, BOHB’s learned proposals and PBT’s cross-model weight
  inheritance. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 259 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout, returning 26 lines in each checkout. These were prior
  candidate leads, source references and neighboring-method mentions, not existing records for these identities.
  Nine exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring native mechanisms were
  inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The 2016 Figure 3 prints a floor-half threshold and a fixed ceil(log2(n)) round count. Literal application
  to non-power-of-two counts can reach an empty set; ties at its non-strict threshold can retain more
  than half. The 2013 cardinality rule uses a ceiling instead. These are source conventions requiring
  explicit implementation choices, not silently equivalent formulas or an author-issued erratum.
- The non-stochastic guarantees assume convergent, action-independent loss sequences and sufficient problem-dependent
  budget. Unknown convergence envelopes prevent a finite observed ranking alone from certifying the eventual
  best candidate. No universal speedup or finite-budget optimum is asserted.
- The budget, cohort and evaluation statistic must be specified. The paper’s doubling construction can
  remove a prespecified horizon, but does not eliminate all modeling or resource choices. The 2016 PDF
  footer says volume 41; bibliographic metadata follows the publisher’s volume 51.
