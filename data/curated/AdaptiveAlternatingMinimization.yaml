name: Adaptive Alternating Minimization
aliases:
- AAM (adaptive alternating minimization)
concept_kind: algorithm
definition: A two-coordinate minimization procedure that performs one exact alternating sweep over a newly
  supplied pair of feasible sets at each iteration, aiming at the optimum of their limiting sets.
identity_notes: 'This is Niesen-Shah-Wornell’s changing-domain AAM, not adaptive step-size selection,
  arbitrary online EM, a fully solved inner optimization at every time point, or a generic nonstationary
  tracking guarantee. Fixed families recover exact alternating minimization. The2009KL mixture application
  adds coefficient floors and an empirical-marginal correction, so it is not identical to unconstrained
  fixed-component weight EM. No normalized identity collision across all 442 pinned AIO IDs, labels/scoped
  synonyms and 483 maintained IDs, names and aliases. Full-checkout searches in the worktree and main
  included ignored and hidden files: 8 and 9 matched lines, respectively, reduce to six distinct matched
  texts, all inspected. Hits concern existing discovery leads and the unrelated assembler mnemonic AAM.
  The fixed-family exact KL projection procedure is narrower than generalized alternating minimization;
  weight-only EM fixes component laws rather than fitting a full mixture model; rate-distortion BA minimizes
  information plus distortion with a fixed source, whereas the IM algorithm maximizes a variational information
  bound; adaptive alternating minimization changes the feasible families at each iteration. Qualified
  AAM and descriptive weight-only names avoid unsupported acronym or historical naming claims. Absence
  is bounded to this snapshot and inspected corpus. Identity-search counts: 8 worktree and 9 main matched
  lines, all six distinct texts read, including ignored and hidden files.'
