name: FixMatch
definition: A semi-supervised classifier-training procedure that fits labeled examples and trains on strongly
  augmented unlabeled inputs using hard pseudo-labels retained only when the corresponding weakly augmented
  prediction reaches a confidence threshold.
concept_kind: algorithm
identity_notes: FixMatch’s defining combination is weak-to-strong consistency with confidence-masked hard
  pseudo-labels. It differs from MixMatch’s soft guessed targets and interpolation, ReMixMatch’s distribution
  alignment and anchored soft targets, and an EMA-target Mean Teacher. AIO SemiSupervisedLLM is a narrower,
  differently structured LLM model class, not this classifier-training algorithm. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 234 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 21 lines in each from prior discovery and the related MixMatch record. Twelve exact AIO CLASS
  nodes, their scoped synonyms and outgoing edges, plus six neighboring native mechanisms were inspected.
  This absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- High confidence need not mean correctness; the threshold trades target coverage against potential confirmation
  errors rather than proving label quality.
- The denominator includes masked-out inputs, so changing the retained fraction changes the effective
  contribution at fixed lambda_u.
- Class-preserving augmentations and labeled/unlabeled distribution assumptions affect applicability.
  Strong-augmentation extensions and distribution alignment are separate variants.
- Published source notation differs at the threshold boundary; the record follows the inclusive main-paper
  and pinned-code convention. No performance score is asserted.
