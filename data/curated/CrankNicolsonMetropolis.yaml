claims:
- claim_id: method
  kind: mechanism
  statement: For finite-dimensional pi(u) proportional to exp(−Phi(u)) Normal(u;0,C), with fixed symmetric
    positive-definite C, choose delta>0 and draw w from Normal(0,C). Solve (2C+delta I)v=(2C−delta I)u+sqrt(8
    delta C)w, where the square root is the symmetric matrix square root. Accept v with min(1,exp(Phi(u)−Phi(v)));
    otherwise retain u. Equivalently, with L=C inverse, (I+delta L/2)v=(I−delta L/2)u+sqrt(2 delta)xi
    for standard Gaussian xi. The proposal is reversible with respect to the Gaussian reference, so the
    Gaussian factors cancel in Metropolis acceptance even though the proposal need not be symmetric in
    Euclidean coordinates.
  evidence:
