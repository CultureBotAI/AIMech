claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Maintain a best-first frontier ranked by the cost already incurred plus a fixed amplified
    heuristic estimate, g+w h. The weight changes the tradeoff in node ordering while graph duplicate
    handling, tie-breaking and stopping rules must still be specified.
  evidence:
  - source_id: method-source
    locator: 'Introduction, PDF p. 1: f-prime(n)=g(n)+w h(n), w in (1,infinity)'
    relation: supports
- claim_id: original-scope
  kind: scope
  statement: The original paper combines cost-to-date and heuristic terms with complementary weights.
    Its basic graph model counts edges; it separately describes HPA+ updates that revise an open node
    or reopen an expanded node after a better route. These distinctions prevent treating every weighted
    priority implementation as the same graph algorithm.
  evidence:
  - source_id: original-weighted-search
    locator: Heuristic Path Algorithm, printed p. 196 / PDF p. 4; HPA+ update, printed p. 199 / PDF p.
      7; Final Observations, printed p. 202 / PDF p. 10
    relation: supports
- claim_id: duplicate-bound-caveat
  kind: limitation
  statement: The comparison paper distinguishes the advertised weighted-search quality bound from its
    own duplicate-discarding experimental implementation, noting that ignoring duplicate improvements
    can relax the bound.
  evidence:
  - source_id: comparison-paper
    locator: Weighted A-star and Ignoring Duplicates, PDF p. 2
    relation: supports
