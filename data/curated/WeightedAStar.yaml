name: Weighted A-star search
definition: A heuristic best-first search algorithm that orders open nodes by g+w h using a fixed finite
  weight w greater than one, where g is path cost so far and h estimates remaining cost.
concept_kind: algorithm
identity_notes: The record concerns fixed-weight Weighted A-star, not a depth-dependent weight schedule,
  an anytime schedule of repeated searches, or weighted IDA-star. Pohl’s original expression (1−omega)g+omega
  h uses a different parameterization; for omega less than one, dividing by the positive factor (1−omega)
  gives w=omega/(1−omega), so w>1 corresponds to omega>1/2. This algebraic equivalence concerns priority
  ordering, not duplicate-policy equivalence. No normalized identity match was found across the 442 AIO
  and 124 prior native records; ignored-inclusive text hits in the main checkout were prior discovery
  leads, source citations and search-order contrasts, plus incidental dependency substrings, not existing
  concept records.
limitations:
- Increasing the weight does not guarantee faster search or fewer expansions. The cited study’s empirical
  conditions are not asserted as necessary-and-sufficient conditions on all search spaces.
- A w-suboptimality guarantee requires an admissible heuristic and appropriate graph-search and termination
  conditions. It must not be inferred from the priority formula alone or an implementation that indiscriminately
  drops improved duplicates.
- The weight is finite and fixed in this record; w=1 gives the A-star priority, while a heuristic-only
  priority is curated separately.
