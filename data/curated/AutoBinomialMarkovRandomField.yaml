name: Auto-binomial Markov random field
definition: A finite pairwise Markov-field model for bounded site counts whose full conditionals are binomial
  with fixed trial counts and log odds linear in neighboring counts, using symmetric interaction coefficients.
concept_kind: model_family
identity_notes: 'The classical auto-binomial construction specifies a joint law for mutually dependent
  counts, not a collection of independent binomial regressions. Trial counts m_i are fixed nonnegative
  integer bounds; nondegenerate sites have m_i at least one. When every m_i is one, the model reduces
  to the binary auto-logistic special case. The general bounded-count family is not identical to that
  special case, a classification task, a sigmoid activation or a Boltzmann neural architecture with a
  specified visible/hidden partition. The binomial property is a full-conditional statement; it does not
  assert binomial marginal laws for interacting sites. No normalized identity match was found across all
  442 pinned AIO labels and all scoped synonyms and 403 preceding native IDs, names and aliases. Fixed-string
  full-checkout searches included ignored and hidden files in worktree and main, yielding 37 and 37 matched
  lines; all 20 unique contents were read. Hits are citations, contextual statements and discovery leads
  rather than records of these identities. All 185 semantic label/synonym hits were read. Forty-three
  fully annotated exact CLASS nodes and outgoing edges were inspected: 38 byte-equivalent to prior inspected
  nodes and five freshly read. Fifty-four contextual YAMLs comprise 43 generated and 11 native records:
  46 byte-verified after prior reading and eight freshly read. Absence is bounded to the pinned snapshot,
  maintained corpus and inspected semantic neighborhood.'
limitations:
- The combinatorial factors choose(m_i,x_i) are essential when m_i exceeds one. Dropping them changes
  the site conditionals; a bounded geometric-type energy is not automatically auto-binomial.
- Finite support permits either sign of a symmetric interaction coefficient, but does not guarantee that
  a chosen parameterization fits observed counts. Changing trial counts, aggregation scale or support
  changes the model.
- The source develops the count construction formally. Its two detailed ecological examples concern binary
  and Gaussian data, so they are not empirical validation of arbitrary auto-binomial count models.
- The graph, site supports and any conditioning boundary values must be specified. The construction assumes
  compatible positive full conditionals on the stated Cartesian support; arbitrary separately fitted regressions
  or asymmetric neighbor coefficients do not automatically define a joint model.
- The finite fixed-site model does not by itself specify a random-location point process, temporal causal
  mechanism, hidden observation layer or infinite-lattice existence theorem. Conditional association does
  not establish causation.
- A closed-form site conditional does not make the joint partition function, maximum-likelihood fit or
  uncertainty calculation trivial. Estimation, sampling and model diagnostics require their own procedures.
  No author implementation, empirical fit or benchmark was reproduced.
