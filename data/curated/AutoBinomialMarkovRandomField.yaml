claims:
- claim_id: method
  kind: mechanism
  statement: On a finite graph, take X_i in {0,...,m_i}, finite real alpha_i and symmetric beta_ij=beta_ji,
    with beta_ij=0 on nonedges. The site full conditional is Binomial(m_i,theta_i), where log(theta_i/(1-theta_i))=alpha_i+sum_(j!=i)
    beta_ij*x_j. Substituting the binomial base measure into the source pairwise representation gives
    p(x)=Z^(-1)*product_i choose(m_i,x_i)*exp[sum_i alpha_i*x_i+sum_(i<j) beta_ij*x_i*x_j]. Each undirected
    edge occurs once. Its finite support gives a finite positive Z for finite coefficients of either sign.
    Conditioning on all other sites yields the stated binomial law, with conditional mean m_i*theta_i.
    Setting every m_i=1 removes the combinatorial factors and recovers the auto-logistic family; setting
    all interactions to zero gives independent binomials.
