name: Variational Fair Autoencoder
definition: A variational autoencoder architecture for learning representations with reduced sensitive
  or nuisance information, combining sensitive-variable-conditioned inference and generation with an MMD
  penalty on group-conditional aggregated latent distributions and a semi-supervised predictive component.
concept_kind: architecture
identity_notes: VFAE denotes the MMD-regularized semi-supervised variational architecture introduced by
  Louizos et al. It is distinct from the paper’s unregularized VAE baseline, prototype-based LFR, ordinary
  autoencoding and the model-dependent FAIRLEARNING algorithm. Prior independence and aggregated-posterior
  matching do not establish causal counterfactual fairness. All 442 pinned AIO labels/scoped synonyms
  and 104 preceding native identities were compared, together with hidden/ignored-inclusive searches of
  both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- Independence in the generative prior does not alone ensure independence of inferred representations;
  the MMD regularizer addresses remaining group dependence.
- Finite data, optimization, kernel choice and random-feature approximation limit how strongly matching
  can be claimed; no exact population independence or universal fairness guarantee is asserted.
- The encoder conditions on the sensitive variable. Semi-supervised here allows missing task labels, not
  arbitrary absence of sensitive-attribute information.
- The paper reports sampling the inferred latent representation for prediction rather than replacing it
  by its mean. Numerical objective-sign and bandwidth conventions are not certified by this conceptual
  record.
