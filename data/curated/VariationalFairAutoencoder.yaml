claims:
- claim_id: method-scope
  kind: mechanism
  statement: Use neural inference and generative models conditioned on the observed sensitive variable,
    with latent structure separating that variable from the representation in the generative model. In
    the semi-supervised construction, introduce a second latent layer and label variable and jointly train
    the inference, reconstruction and predictive components. Penalize differences between aggregated latent
    distributions across sensitive groups with maximum mean discrepancy, approximated using random Fourier
    features in the reported implementation.
