claims:
- claim_id: r446-pocs-quasi-projection-and-adaptive-extrapolation-step-size
  kind: mechanism
  statement: In overparameterized convex settings where clients share a common global minimizer w* with F_i(w*) = 0, Lemma 1 (Section 3, p. 4) proves that tau steps of local gradient descent with eta_l <= 1/L satisfy the quasi-projection inequality <Delta_i^(t), w^(t) - w*> >= 0.5 ||Delta_i^(t)||^2; minimizing the resulting upper bound on ||w^(t) - eta_g^(t) bar_Delta^(t) - w*||^2 yields the extrapolated step size eta_g^(t) = (sum_{i=1}^M ||Delta_i^(t)||^2) / (2 M ||bar_Delta^(t)||^2), which is larger whenever client pseudo-gradients point in diverse directions and automatically decays toward 1 near the optimum.
  evidence:
  - source_id: r446-primary-pdf
    locator: Section 3 Motivation & Lemma 1 (Equations 4-6), pp. 3-5
    relation: supports
- claim_id: r446-convex-and-nonconvex-convergence-rates
  kind: mechanism
  statement: Theorems 1 and 2 (Section 4, pp. 5-6) establish general convex and non-convex convergence bounds for FedExP where the optimality residual is inversely weighted by the harmonic or arithmetic average of the adaptive server step sizes eta_g^(t) >= 1, guaranteeing progress at least as fast as FedAvg (eta_g = 1).
  evidence:
  - source_id: r446-primary-pdf
    locator: Section 4 Convergence Analysis (Theorems 1-2, Corollaries 1-2), pp. 5-6
    relation: supports
- claim_id: r446-stochastic-client-noise-floor-and-epsilon-stabilization-limitation
  kind: limitation
  statement: Under high stochastic mini-batch variance or small client participation M, the denominator ||bar_Delta^(t)||^2 can become dominated by sampling noise near stationarity, requiring a positive stabilization constant epsilon > 0 and decaying local step size eta_l to prevent over-extrapolation (Section 3.2, Section 4).
  evidence:
  - source_id: r446-primary-pdf
    locator: Section 3.2 Practical Considerations & Section 4 Discussion, pp. 5-6
    relation: supports
- claim_id: r446-cifar-cinic-and-shakespeare-federated-benchmark-application
  kind: application
  statement: Applied to federated image classification and language modeling on CIFAR-10, CIFAR-100, CINIC-10, and Shakespeare, accelerating convergence over FedAvg and tuned server-momentum/adaptive baselines without server step-size tuning.
  evidence:
  - source_id: r446-primary-pdf
    locator: Section 5 Experiments (Figures 2-4, Tables 1-2), pp. 7-9
    relation: supports
