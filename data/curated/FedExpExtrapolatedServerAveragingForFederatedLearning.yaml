id: AIMech:FedExpExtrapolatedServerAveragingForFederatedLearning
name: FedExP (Federated Extrapolation for Speeding Up Federated Averaging)
concept_kind: algorithm
review_status: DRAFT
definition: A hyperparameter-free adaptive server step-size method for federated optimization (Jhunjhunwala, Wang, & Joshi 2023, Section 3, Equations 4-6, Algorithm 1) that interprets client local SGD displacements Delta_i^(t) = w^(t) - w_i^(t, tau) in overparameterized federated learning as approximate projections onto client solution manifolds S_i^* and updates the global model via w^(t+1) = w^(t) - eta_g^(t) bar_Delta^(t) with the Projection Onto Convex Sets (POCS) extrapolated step size eta_g^(t) = max(1, (sum_{i=1}^M ||Delta_i^(t)||^2) / (2 M (||bar_Delta^(t)||^2 + epsilon))).
identity_notes: Distinct from FedOpt (AIMech:FedOptAdaptiveFederatedOptimization, Reddi et al. 2021), which requires tuning both the client learning rate eta_l and server learning rate eta_g via grid search or second-moment accumulators (FedAdam, FedYogi, FedAdagrad), and from FedNova (AIMech:FedNovaNormalizedAveragingForFederatedOptimization, Wang et al. 2020), which normalizes heterogeneous local step counts tau_i rather than extrapolating the server step size via the ratio of average squared pseudo-gradient norms to the squared norm of the averaged pseudo-gradient.
aliases:
- FedExP
- Federated Extrapolation
- Extrapolated Federated Averaging
