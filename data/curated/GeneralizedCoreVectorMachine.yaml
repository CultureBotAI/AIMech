id: AIMech:GeneralizedCoreVectorMachine
name: Generalized core vector machine
aliases:
- Generalized CVM
- Generalized core vector machines
concept_kind: algorithm
definition: A kernel optimization algorithm that converts a quadratic program with a positive-semidefinite
  Gram matrix and simplex constraints into a center-constrained minimum enclosing ball, then approximates
  its solution by repeatedly enlarging and reoptimizing a core subset.
identity_notes: This record denotes the Tsang-Kwok-Zurada generalized CVM solver, including its linear-term
  and nonconstant-diagonal reduction. The CVR formulation is a specific application; original CVM and
  BVM remain separate algorithms. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all
  515 preceding native IDs, names and aliases. No normalized identity collision was found for either candidate.
  Fixed-string whole-word searches of both checkouts included ignored and hidden files, expanded names,
  CVR/GCVM/CVM acronyms and source identifiers. All 147 distinct matched-text windows were read; the post-merge
  repeat has the same distinct windows in both checkouts. Hits describe original CVM/BVM, their reviews
  and unresolved extensions, not an existing generalized-CVM or CVR record. All 93 semantic AIO rows were
  reused after exact equality checks, and all 44 native name/definition matches were read. Fifteen annotated
  AIO CLASS nodes and outgoing edges plus 22 contextual YAMLs were inspected or reused after unchanged-byte
  checks. This assessment is bounded to the pinned and maintained corpus.
