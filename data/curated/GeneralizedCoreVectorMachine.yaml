aio_mappings:
- target: AIO:SupportVectorMachine
  relation: related_match
  rationale: This training algorithm has a direct relationship to support-vector formulations. AIO:SupportVectorMachine
    is a related model/network target whose definition covers supervised classification and regression,
    with Network ancestry and layer relations. It is not equivalent to this solver or an is-a assertion
    about the algorithm. RegressionAnalysis, Classification, BinaryClassification, SupervisedLearning
    and UnsupervisedLearning describe task scope; they do not identify the optimization procedure. LinearRegression,
    Least-squares Analysis and RidgeRegression do not encode the source-specific paired-slack CVR objective.
    KernelLayer is a component and TrainingStrategy is defined as preprocessing. Original CVM requires
    a constant-diagonal reduction, BVM uses different center updates, SVDD estimates a sphere and SVC
    adds cluster labeling; shared kernels, spheres or output tasks do not establish identity.
limitations:
- The source assumes valid positive-semidefinite kernels and particular simplex-compatible formulations.
  Approximation guarantees depend on the additive objective shift, exact inner optimization and exhaustive
  violation checking.
- All23 pages of the two primary PDFs were visually read. Source-specific claims are retained with their
  versions; historical software access failed, and no optimizer, training or benchmark was executed.
- Exact rational calculations test negative learned width, primal-dual scaling and shift-sensitive termination.
  They are curator derivations from the displayed mathematics, not reproduced implementation behavior.
- The record remains a native DRAFT with a related AIO model mapping. Later core-vector, soft-margin,
  multiview, ranking and data-description extensions remain unresolved.
