claims:
- claim_id: upr-bayesian-question-likelihood-mechanism
  kind: mechanism
  statement: Given top-K retrieved passages Z = {z_1, ..., z_K} for a query q, UPR decomposes log p(z_i | q) = log p(q | z_i) + log p(z_i) + c via Bayes' rule, assumes a uniform passage prior log p(z_i), appends a zero-shot instruction prompt (such as 'Please write a question based on this passage') to each passage z_i, and ranks passages by the average token log-likelihood log p(q | z_i) = (1 / |q|) sum_t log p(q_t | q_{<t}, z_i; Theta), forcing token-level cross-attention to explain every token in q.
  evidence:
  - source_id: r744-primary-pdf
    locator: Section 2.2 (Unsupervised Passage Re-ranking (UPR)) & Figure 2, pp. 2-3
    relation: supports
  - source_id: r744-primary-pdf
    locator: upr_question_log_likelihood & main
    relation: supports
- claim_id: upr-question-vs-passage-generation-asymmetry
  kind: scope
  statement: Re-ranking top-1000 retrieved passages with UPR (using T0-3B) improves unsupervised retrievers (MSS, BM25, Contriever) by 6% to 18% absolute and supervised retrievers (DPR, MSS-DPR) by up to 12% in top-20 accuracy across SQuAD-Open, TriviaQA, Natural Questions, and WebQuestions, whereas the reverse conditional score log p(z_i | q; Theta) = (1 / |z_i|) sum_t log p(z_{i,t} | z_{i,<t}, q; Theta) degrades accuracy below the first-stage retriever.
  evidence:
  - source_id: r744-primary-pdf
    locator: Section 4.1 (Table 2) & Section 4.2.1 (Importance of Question Generation, Figure 3), pp. 4-6
    relation: supports
  - source_id: r744-primary-pdf
    locator: passage_generation_log_likelihood & main
    relation: supports
- claim_id: upr-cross-attention-latency-and-claim-query-limitation
  kind: limitation
  statement: UPR incurs inference latency that scales linearly with the number of re-ranked candidate passages K and proportionally to the product of question length, passage length, and PLM layer count (reaching 11.6 seconds per question on an A100 GPU for K = 1000 with T0-3B), is upper-bounded by the recall of the first-stage top-K retrieval pool, and can degrade nDCG@10 on fact-verification datasets (such as FEVER and Climate-FEVER in BEIR) where queries are declarative claims rather than questions.
  evidence:
  - source_id: r744-primary-pdf
    locator: Section 4.2.3 (Figure 4), p. 6; Limitations, pp. 9-10; Appendix A.4 (Table 10), pp. 14, 18
    relation: supports
