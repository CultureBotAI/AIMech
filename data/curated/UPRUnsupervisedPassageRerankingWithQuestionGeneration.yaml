id: AIMech:UPRUnsupervisedPassageRerankingWithQuestionGeneration
name: UPR (Unsupervised Passage Re-ranking with Zero-Shot Question Generation)
concept_kind: algorithm
review_status: DRAFT
definition: An unsupervised zero-shot passage re-ranking algorithm for information retrieval and open-domain question answering that re-orders top-K candidate passages Z = {z_1, ..., z_K} from any first-stage retriever by applying Bayes' rule under a uniform passage prior and using an off-the-shelf pre-trained language model Theta with an appended natural-language instruction prompt to compute the length-normalized conditional log-likelihood of generating the input question tokens given each passage, log p(q | z_i) = (1 / |q|) sum_{t=1}^{|q|} log p(q_t | q_{<t}, z_i; Theta).
identity_notes: Introduced by Sachan, Lewis, Joshi, Aghajanyan, Yih, Pineau, and Zettlemoyer (EMNLP 2022, pp. 3781-3797, arXiv:2204.07496). Distinguished from classical unigram query-likelihood language models (Ponte & Croft, 1998; Zhai & Lafferty, 2001), from supervised relevance-token cross-encoders such as monoT5 (Nogueira et al., 2020), and from synthetic query-generation dataset augmentation methods such as Doc2Query, InPars, or Promptagator that train a downstream retriever rather than re-scoring test queries zero-shot via p(q | z_i).
aliases:
- Unsupervised Passage Re-ranker
- Unsupervised Passage Re-ranking
- UPR Zero-Shot Question Generation Re-Ranker
