id: AIMech:ScsgStochasticallyControlledStochasticGradientForNonconvexOptimization
name: SCSG (Stochastically Controlled Stochastic Gradient) for Non-Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A variance-reduced stochastic optimization algorithm (Lei, Ju, Chen, & Jordan 2017) for smooth non-convex finite-sum and online optimization min_x f(x) = (1/n) sum_{i=1}^n f_i(x) that replaces SVRG's full-dataset outer gradient pass with a subsampled without-replacement batch I_j subset {1, ..., n} of size B_j <= n, sets the anchor gradient g_j = (1/B_j) sum_{i in I_j} nabla f_i(xtilde_{j-1}), draws a geometrically distributed number of inner-loop steps N_j ~ Geom(B_j / (B_j + b_j)) (so E[N_j] = B_j / b_j), performs b_j-minibatch variance-reduced updates v_{k-1}^{(j)} = nabla f_{I'_{k-1}}(x_{k-1}^{(j)}) - nabla f_{I'_{k-1}}(xtilde_{j-1}) + g_j, and sets xtilde_j = x_{N_j}^{(j)}, achieving E||nabla f(xhat)||_2^2 <= varepsilon in O(min{varepsilon^{-5/3}, n^{2/3} varepsilon^{-1}} + min{varepsilon^{-1}, n}) (equivalently O(min{varepsilon_g^{-10/3}, n^{2/3} varepsilon_g^{-2}} + min{varepsilon_g^{-2}, n}) for E||nabla f(xhat)||_2 <= varepsilon_g) stochastic gradient evaluations.
identity_notes: Distinct from classical SVRG (Johnson & Zhang 2013; Reddi et al. 2016; Allen-Zhu & Hazan 2016), which computes a full n-sample gradient at every outer epoch (incurring an unavoidable O(n + n^{2/3} / varepsilon_g^2) cost even when n >> varepsilon_g^{-2}) and uses a fixed deterministic epoch length m with uniform random iterate selection; from SAGA (Defazio et al. 2014, AIMech:SagaFastIncrementalGradientMethodWithSupportForNonStronglyConvexCompositeObjectives), which stores O(n*d) gradient tables; and from recursive path-integrated estimators (SARAH, SPIDER, SNVRG, STORM, PAGE), which update the gradient estimate incrementally from x_{t-1} rather than from a geometrically terminated epoch anchor xtilde_{j-1}.
aliases:
- SCSG
- Non-Convex SCSG
- Stochastically Controlled Stochastic Gradient
