claims:
- claim_id: r375-claim-geometric-epoch-telescoping-and-one-epoch-bound
  kind: mechanism
  statement: 'For any sequence {D_k}_{k >= 0} and geometric stopping time N_j ~ Geom(gamma) on {0, 1, 2, ...} with P(N_j = k) = gamma^k (1 - gamma) and gamma = B_j / (B_j + b_j), the exact expectation identity E_{N_j}[D_{N_j} - D_{N_j + 1}] = (1 / E[N_j]) * E_{N_j}[D_0 - D_{N_j}] = (b_j / B_j) * (D_0 - E_{N_j}[D_{N_j}]) (Lemma A.2) telescopes single-step descent directly into an epoch-level bound on the terminal iterate xtilde_j = x_{N_j}^{(j)} without storing intermediate inner-loop iterates: for step size eta_j * L * (B_j / b_j)^{2/3} <= c_0, E||nabla f(xtilde_j)||_2^2 <= (2 / (eta_j * (1 - 2 * eta_j * L))) * (b_j / B_j) * E[f(xtilde_{j-1}) - f(xtilde_j)] + (I(B_j < n) / B_j) * (6 / (1 - 2 * eta_j * L)) * S^2 (Theorem 3.1).'
  evidence:
  - source_id: r375-primary-pdf
    locator: Section 3, Theorem 3.1; Appendix A, Lemma A.2; Appendix B, Lemma B.1 and Theorem B.1
    relation: supports
- claim_id: r375-claim-sample-size-independent-and-finite-sum-complexity-regimes
  kind: mechanism
  statement: Setting step size eta_j = (b_j / B_j)^{2/3} / (6L) and outer batch size B_j = min{n, S^2 / varepsilon} (where varepsilon denotes target squared gradient norm E||nabla f(xhat)||_2^2 <= varepsilon, i.e., varepsilon = varepsilon_g^2) gives total expected stochastic gradient complexity O(B^{-1/3} * L * Delta_f / (varepsilon * b^{1/3}) + B) = O((min{S^2 / varepsilon, n})^{2/3} * (L * Delta_f / (S^2 * b^{1/3})) + min{S^2 / varepsilon, n}) = O(min{varepsilon^{-5/3}, n^{2/3} * varepsilon^{-1}}) (Theorem 3.2, Corollary 3.3, Table 1), strictly dominating both SGD O(varepsilon^{-2}) when varepsilon << 1 and SVRG O(n + n^{2/3} * varepsilon^{-1}) in the practical large-data regime where varepsilon^{-1} < n without ever computing a full pass over all n examples.
  evidence:
  - source_id: r375-primary-pdf
    locator: Section 1, Table 1; Section 3.2, Theorem 3.2, Corollaries 3.1-3.3, Figure 1
    relation: supports
- claim_id: r375-claim-polyak-lojasiewicz-and-dnn-warm-start-applications
  kind: application
  statement: Under the mu-Polyak-Lojasiewicz condition 1/2 * ||nabla f(x)||_2^2 >= mu * (f(x) - f^*), SCSG achieves E[f(xhat) - f^*] <= varepsilon in O((min{L/mu * (L / (mu * b))^{1/3}, n^{2/3} * L / (mu * b^{1/3})} + min{n, S^2 / (mu * varepsilon)}) * log(1/varepsilon)) gradient evaluations (Theorem 4.3, Table 2); on MNIST 3-layer fully connected and LeNet convolutional neural networks, SCSG with polynomially growing batch sizes B_j propto j^{3/2} outperforms mini-batch SGD from random initialization without needing an SGD warm-start.
  evidence:
  - source_id: r375-primary-pdf
    locator: Section 4, Table 2, Theorem 4.3; Section 5, Experiments, Figures 2-3
    relation: supports
