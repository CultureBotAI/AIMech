claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: The invariant construction applies a shared neural transformation to each element, sums the
    transformed representations, and processes the sum with an output network. The equivariant construction
    combines an element's features with a shared pooled summary using tied parameters, and such layers
    can be composed.
