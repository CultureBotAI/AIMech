name: Deep Sets
definition: A neural architecture family for unordered collections that combines shared element transformations
  with symmetric aggregation for invariant outputs, or shared element and pooled-context computations
  for permutation-equivariant outputs.
concept_kind: architecture
identity_notes: Deep Sets denotes the architecture family defined by Zaheer and colleagues, including
  invariant and equivariant constructions. It is not a synonym for all set functions, PointNet, Set Transformer
  or graph neural networks.
limitations:
- The source's exact set-function representation theorem treats a countable universe; its uncountable-domain
  discussion establishes a fixed-size case and states a broader conjecture. No unrestricted universality
  claim is curated.
- Permutation invariance and equivariance are different output properties. The selected architecture,
  aggregation and finite neural representation determine its actual scope.
