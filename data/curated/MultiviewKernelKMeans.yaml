limitations:
- The input must provide aligned views and valid PSD kernels. An arbitrary similarity matrix is not automatically
  an RKHS Gram matrix. Kernel selection, requested cluster count and p remain modeling choices.
- Dense Gram matrices require storage quadratic in N per view; the source uses repeated clustering or
  eigensolutions, with additional initialization cost. No general scalability or global-optimum guarantee
  is curated.
- Source experiments use known class counts, parameter sweeps, selected digit/image subsets and specific
  preprocessing; their NMI results do not establish universal superiority or label-free model selection.
  No historical software or benchmark was reproduced.
