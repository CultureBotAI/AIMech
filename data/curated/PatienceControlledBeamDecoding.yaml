name: Patience-controlled FCFS beam decoding
definition: A generalization of first-come, first-served sequence beam decoding that retains beam width
  k for continuing hypotheses but uses a positive patience factor p to stop when the accumulated completed-hypothesis
  count reaches at least k·p.
concept_kind: algorithm
identity_notes: This is the algorithmic stopping-policy variant introduced by Kasai and colleagues, not
  a standalone model, learned parameter or generic training patience rule. Setting p=1 recovers their
  FCFS baseline; changing p separates its finished-output threshold from its continuing-beam width. No
  normalized identity match was found across the 442 AIO and 141 prior native records; ignored-inclusive
  text hits in the main checkout were prior discovery leads and incidental substrings such as builds in
  records, source text and dependencies, not existing concept records.
limitations:
- The finite maximum length can end decoding before the completion threshold is reached. Empty finished
  sets and exhausted candidate pools need an implementation-specific outcome.
- Increasing patience can expose more completions but does not guarantee better task quality, a globally
  optimal sequence, or equivalence to vanilla beam search.
- The parameter is a stopping threshold, not a score upper bound or a proof that no unfinished hypothesis
  can improve the incumbent.
- The source evaluates specific translation and news-summarization settings. English news summarization
  does not establish benefits for all languages, domains or tasks.
- No current library default, runtime gain, numerical quality improvement or trained-model execution is
  claimed.
id: AIMech:PatienceControlledBeamDecoding
