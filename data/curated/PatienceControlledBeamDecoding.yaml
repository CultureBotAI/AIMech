    79 / PDF p. 3
  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Keep the FCFS candidate selection and separate persistent finished set, but replace the termination
    threshold k with k·p. Return the highest-scoring stored completion once that threshold is reached,
    subject to the method’s maximum-length limit. With integer completion counts, the displayed inequality
    corresponds mathematically to reaching ceil(k·p); this is an interpretation of the paper’s inequality,
    not a claim about rounding in any software library.
  evidence:
  - source_id: method-source
    locator: Figure 1 line 13, printed p. 77 / PDF p. 1; Patience Factor for FCFS, Section 2, printed
      p. 79 / PDF p. 3
    relation: supports
- claim_id: patience-scope
  kind: limitation
  statement: The paper separates stopping depth from beam breadth and reports task-dependent behavior;
    its limitations explicitly restrict summarization evidence to English news. More extensive search
    and better generated-text quality are not equivalent claims.
  evidence:
  - source_id: patience-scope
    locator: Section 2, Section 3.3 and Limitations, printed pp. 79–81 / PDF pp. 3–5
    relation: supports
