claims:
- claim_id: method
  kind: mechanism
  statement: At state x draw Z from a fixed increment density f and set y=x+Z, so q(y|x)=f(y−x). Accept
    with min(1,pi(y)f(x−y)/(pi(x)f(y−x))) where the ratio is defined; retain x on rejection. For f(z)=f(−z),
    the increment-density terms cancel and acceptance is min(1,pi(y)/pi(x)). The formula is the substitution
    of Tierney’s random-walk proposal into his general Metropolis ratio. The proposal scale and shape
    determine which candidate movements are attempted.
  evidence:
