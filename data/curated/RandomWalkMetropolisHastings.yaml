name: Random-walk Metropolis–Hastings sampling
definition: A Metropolis–Hastings sampler that proposes a new state by adding an increment drawn from
  a fixed distribution independent of the current state.
concept_kind: algorithm
identity_notes: The random walk describes the proposal Y=x+Z, not an assertion that accepted chain increments
  are independent or target-free. The increment density may be asymmetric; the common symmetric random-walk
  Metropolis case is included. This differs from a fixed independence proposal g(Y), which does not center
  on x, and from gradient-directed Langevin proposals. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive full-checkout
  searches found prior discovery leads for Gibbs and slice sampling plus unrelated environment substring
  hits, not existing concept records. Existing HMM/MRF models and general Metropolis–Hastings were inspected
  to distinguish model, general transition and specialized algorithm scope.
limitations:
- The simplification to the target-density ratio requires a symmetric increment law, not merely an additive
  proposal.
- Proposal and target support determine irreducibility. An invariant kernel is not a guarantee of rapid
  convergence or movement between separated modes.
- Accepted-state increments and retained draws are generally dependent. Rejected states remain in the
  chain.
- This definition uses a fixed increment distribution; adaptive scales and state-dependent covariance
  require their own proposal ratios and validity analysis.
- No universal acceptance-rate target, optimal scale, dimension-scaling law or benchmark advantage is
  asserted.
