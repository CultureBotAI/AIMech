id: AIMech:TwinBERTDistillingKnowledgeToTwinStructuredBERTModels
name: TwinBERT (Distilling Knowledge to Twin-Structured BERT Models for Efficient Retrieval)
concept_kind: architecture
review_status: DRAFT
definition: A twin-structured dual-encoder Transformer architecture and teacher-student knowledge distillation framework for low-latency retrieval and relevance ranking (Lu, Jiao, & Zhang, CIKM 2020) that decouples query and keyword/document inputs into two 6-layer Transformer encoders using 50K-vocabulary character tri-letter embeddings and learned weighted-average token pooling to produce single-vector sentence representations q and k, combined via either a logistic-aligned cosine similarity crossing layer (TwinBERT_cos) for approximate nearest neighbor (ANN) retrieval or an elementwise-max residual network crossing layer y = F(max(q, k), W, b) + max(q, k) (TwinBERT_res) for relevance prediction, trained via temperature-scaled soft-label distillation from a 12-layer BERT-Base teacher.
identity_notes: Distinct from Sentence-BERT (AIMech:SentenceBERT, which fine-tunes pre-trained WordPiece BERT towers with mean/max/[CLS] pooling on NLI/STS labels) and from MORES/DC-BERT (which retain token-level document matrices for upper-layer Transformer attention). TwinBERT replaces recursive WordPiece tokenization with independent 50K character tri-letter embeddings, pools each 6-layer encoder output into a single vector via learned per-position weighted-average pooling, defines both TwinBERT_cos (logistic regression over cos(q, k), Eq. 1) and TwinBERT_res (elementwise max x = max(q, k) followed by residual block y = F(x, W, b) + x, Eq. 2), and distills a 12-layer BERT teacher on 500M search impressions using temperature T=2 soft targets followed by actual-label fine-tuning and asymmetric encoder training.
aliases:
- TwinBERT
- Twin-Structured BERT for Efficient Retrieval
- TwinBERT_cos and TwinBERT_res
