claims:
- claim_id: twinbert-triletter-weighted-pooling-and-dual-crossing-layers
  kind: mechanism
  statement: TwinBERT encodes decoupled query and keyword/document inputs without [SEP] or segment embeddings using 50K character tri-letter embeddings plus position embeddings, aggregates each encoder's L=6, H=512 token vectors into a single sentence vector via learned weighted-average pooling, and combines query vector q and keyword vector k via either TwinBERT_cos (applying logistic regression to cos(q, k) = (q . k)/(||q|| ||k||), Equation 1, supporting Euclidean ANN indexing) or TwinBERT_res (computing elementwise max x = max(q, k), residual mapping y = F(x, W, b) + x, Equation 2, and logistic regression classification).
  evidence:
  - source_id: r796-primary-pdf
    locator: Section 4.1-4.4 (Model Architecture, Input Representation, Pooling Layer, Crossing Layer), pp. 3-4, Figure 1, Equations (1)-(2)
    relation: supports
  - source_id: r796-primary-pdf
    locator: weighted_average_pooling, twinbert_cos_score, and twinbert_res_score verification
    relation: supports
- claim_id: twinbert-temperature-distillation-and-asymmetric-finetuning
  kind: mechanism
  statement: TwinBERT trains its student encoders by minimizing binary cross-entropy loss = -sum_{i=1}^N (y_i log p_i + (1 - y_i) log(1 - p_i)) against temperature-softened teacher probabilities y_i = exp(z_i / T) / sum_j exp(z_j / T) with T = 2 from a 12-layer BERT-Base teacher over 500M impressed query-keyword pairs, followed by two-epoch actual-label fine-tuning (FT) on editorial labels and asymmetric (unshared) query/keyword encoder parameter training (ASYM).
  evidence:
  - source_id: r796-primary-pdf
    locator: Section 4.5 (Knowledge Distillation) & Section 5.4 (Effective Training Strategies), pp. 4, 6, Table 4
    relation: supports
  - source_id: r796-primary-pdf
    locator: soft_target_temperature verification
    relation: supports
- claim_id: twinbert-cpu-latency-and-roc-auc-performance
  kind: application
  statement: With pre-computed keyword embeddings cached in memory, TwinBERT_cos and TwinBERT_res score 100 candidate keywords per query in 14 ms and 22 ms on CPU (663x and 422x faster than BERT_12's 9,282 ms, Table 5), while TwinBERT_res with ASYM+FT achieves 0.9033 AUC_1 and 0.9127 AUC_2, outperforming C-DSSM by 3.7% and BERT_3 by 0.42% and matching or exceeding the 12-layer BERT_12 teacher (Table 2 & Table 4).
  evidence:
  - source_id: r796-primary-pdf
    locator: Section 5.2-5.6 (Tables 1-5), pp. 5-7
    relation: supports
- claim_id: twinbert-cosine-vs-residual-ann-tradeoff
  kind: limitation
  statement: While TwinBERT_cos supports sub-linear approximate nearest neighbor (ANN) retrieval, its simple cosine crossing layer exhibits a 1.27%-3.70% ROC-AUC gap below TwinBERT_res before post-distillation fine-tuning (0.8883 vs. 0.9010 AUC_1 and 0.8743 vs. 0.9113 AUC_2, Table 2), whereas the higher-accuracy nonlinear residual crossing layer TwinBERT_res cannot be directly indexed with standard Euclidean/cosine ANN search.
  evidence:
  - source_id: r796-primary-pdf
    locator: Section 4.4 (Crossing Layer) & Section 5.2.3 (Model accuracy, Table 2), pp. 4-6
    relation: supports
