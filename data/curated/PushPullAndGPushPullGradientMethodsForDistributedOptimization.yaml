id: AIMech:PushPullAndGPushPullGradientMethodsForDistributedOptimization
name: Push-Pull and G-Push-Pull Gradient Methods for Distributed Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A directed-graph distributed gradient tracking method and its asynchronous gossip extension (Pu, Shi, Xu, & Nedic 2021, Section II, Algorithm 1, Equation 2; Section IV, Algorithm 2) that updates decision variables via a row-stochastic pull matrix R (R 1 = 1) and gradient trackers via a column-stochastic push matrix C (1^T C = 1^T) according to x_{k+1} = R (x_k - alpha y_k) and y_{k+1} = C y_k + nabla F(x_{k+1}) - nabla F(x_k) with y_0 = nabla F(x_0) and uncoordinated diagonal step-size matrix alpha = diag(alpha_1, ..., alpha_n) >= 0.
identity_notes: Distinct from Push-DIGing (AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs, Nedic, Olshevsky, & Shi 2017), which uses only column-stochastic matrices C(k) for both state and tracker updates and requires maintaining and inverting an auxiliary Push-Sum eigenvector estimate V(k) = diag(v(k)) at every step, whereas Push-Pull combines row-stochastic R (pulling states) and column-stochastic C (pushing trackers) to eliminate eigenvector estimation altogether.
aliases:
- Push-Pull and G-Push-Pull
- Push-Pull Distributed Gradient Method
- G-Push-Pull
