claims:
- claim_id: r438-spanning-tree-root-unification-and-linear-convergence-theorem
  kind: mechanism
  statement: "Under Assumptions 1-4 \u2014 requiring only that the induced digraphs G_R and G_{C^T} share at least one common spanning-tree root i in R_R cap R_{C^T} with positive local step size alpha_i > 0 rather than strong connectivity \u2014 the left Perron eigenvector u^T R = u^T and right Perron eigenvector C v = v satisfy u^T v > 0 and effective step size alpha' = (1/n) sum_{i=1}^n u_i v_i alpha_i > 0 (Lemma 1, Remark 4), proving global linear convergence O(rho(A)^k) of both ||bar_x_k - x^*||_2 and ||x_k - 1 bar_x_k||_R while unifying peer-to-peer decentralized, master-slave centralized, and leader-follower semi-centralized architectures (Section II-B, Theorem 1)."
  evidence:
  - source_id: r438-primary-pdf
    locator: Section II-B Unification of Different Types of Architecture & Section III Convergence Analysis (Lemma 1, Remark 4, Theorem 1), pp. 3-7
    relation: supports
- claim_id: r438-g-push-pull-asynchronous-edge-gossip-linear-convergence
  kind: mechanism
  statement: In G-Push-Pull (Section IV, Algorithm 2), randomly waking agents pull state variables from in-neighbors and push scaled tracker updates along active outgoing links using random matrices R_k and C_k with row-stochastic E[R_k] and column-stochastic E[C_k], achieving linear convergence in expectation for strongly convex smooth objectives (Theorem 2).
  evidence:
  - source_id: r438-primary-pdf
    locator: Section IV Gossip-like Push-Pull (G-Push-Pull, Algorithm 2, Theorem 2), pp. 8-11
    relation: supports
- claim_id: r438-out-degree-knowledge-and-deterministic-gradient-limitation
  kind: limitation
  statement: Constructing the column-stochastic push matrix C requires each agent i to know its out-degree |N_{C,i}^{out}| (or broadcast weights summing to 1 across out-neighbors), and the exact linear convergence rate O(rho(A)^k) requires deterministic local gradients.
  evidence:
  - source_id: r438-primary-pdf
    locator: Section II-A Equation 1 & Section VI Conclusions
    relation: supports
- claim_id: r438-directed-network-ridge-and-logistic-regression-application
  kind: application
  statement: Applied to distributed ridge regression and l_2-regularized logistic regression over directed cyclic and random networks under decentralized and semi-centralized leader-follower topologies.
  evidence:
  - source_id: r438-primary-pdf
    locator: Section V Numerical Examples (Figures 3-6), pp. 11-13
    relation: supports
