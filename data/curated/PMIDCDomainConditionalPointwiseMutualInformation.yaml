claims:
- claim_id: r730-claim-surface-form-competition-and-symmetry
  kind: mechanism
  statement: Because generative LMs allocate probability mass across all valid surface paraphrases of a concept (e.g., 'Bathtub' vs. 'Whirlpool bath', or 'it was 3 AM' vs. 'it was 3:30AM'), direct scoring P(y_i | x) penalizes rare surface forms; by Bayes' rule symmetry arg max_i [P(y_i | x, domain) / P(y_i | domain)] = arg max_i P(x | y_i, domain), PMI_DC simulates scoring-by-premise without requiring the question and options to be manually inverted.
  evidence:
  - source_id: r730-primary-pdf
    locator: Section 1, Section 3.2, and Section 5.1-5.2, Figures 1-3, Table 5, pp. 1-2, 4, 7-8
    relation: supports
- claim_id: r730-claim-copa-flipped-eradication-proof
  kind: mechanism
  statement: "On 'COPA Flipped'\u2014where cause and effect clauses are swapped with inverted connectives ('because' <-> 'so') so that the LM scores a single fixed premise continuation given each candidate option as context\u2014surface form competition is completely removed, causing uncalibrated LM and AVG scoring to jump to the exact same accuracy as PMI_DC across all 8 GPT-2 and GPT-3 model scales."
  evidence:
  - source_id: r730-primary-pdf
    locator: Section 5.1, Table 5, Figure 3, pp. 7-8
    relation: supports
- claim_id: r730-claim-zero-and-few-shot-benchmark-application
  kind: application
  statement: Across 16 splits of 13 open-set and closed-set multiple-choice benchmarks (COPA, StoryCloze, HellaSwag, RACE-M/H, ARC-E/C, OpenBookQA, CommonsenseQA, BoolQ, RTE, CB, SST-2, SST-5, AG's News, TREC) and 8 model sizes (GPT-2 125M-1.6B and GPT-3 2.7B-175B), PMI_DC wins or ties on 62.5% to 86.7% of datasets per model scale (outperforming LM, AVG, and Contextual Calibration by >40 percentage points in win rate).
  evidence:
  - source_id: r730-primary-pdf
    locator: Section 4.3-4.5, Tables 1-4 and Table 6, pp. 5-7, 13
    relation: supports
- claim_id: r730-claim-internal-coherence-and-joint-option-limitation
  kind: limitation
  statement: PMI_DC underperforms AVG on HellaSwag (where adversarial machine-generated distractors test internal continuation coherence rather than premise-hypothesis mutual information) and underperforms direct LM scoring on ARC Easy (which favors a priori likely stock textbook phrases), and PMI_DC still scores each option y_i independently rather than jointly reasoning over the entire set of candidate options (e.g., failing on meta-options like 'all of the above').
  evidence:
  - source_id: r730-primary-pdf
    locator: Section 6 & Section 7, Table 1, pp. 6, 8-9
    relation: supports
