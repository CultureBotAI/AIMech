id: AIMech:PMIDCDomainConditionalPointwiseMutualInformation
name: Domain Conditional Pointwise Mutual Information (PMI_DC) Scoring
concept_kind: evaluation_method
review_status: DRAFT
definition: "A zero-shot and few-shot multiple-choice scoring method for generative language models that compensates for surface form competition\u2014the rationing of finite probability mass across distinct strings representing the same concept\u2014by selecting the candidate hypothesis y_i that maximizes Domain Conditional Pointwise Mutual Information: arg max_i PMI_DC(x, y_i, domain) = arg max_i log [P(y_i | x) / P(y_i | x_domain)], where P(y_i | x_domain) is the a priori probability of hypothesis y_i within the task domain estimated by conditioning on a short task-specific domain premise string x_domain (typically the trailing cue of the prompt template x, such as 'because' or 'the answer is:')."
identity_notes: Distinct from standard direct probability arg max_i P(y_i | x) and length-normalized average log-likelihood AVG = (1/l_i) sum_j log P(y_i^j | x, y_i^{<j}), which do not factor out surface-form rarity, and from Contextual Calibration (Zhao et al., ICML 2021, AIMech:CalibrateBeforeUseContextualCalibration), which fits an affine matrix over a fixed closed label set using multiple content-free inputs rather than computing the symmetric log-probability difference log P(y_i | x) - log P(y_i | x_domain) for arbitrary open-set per-question answer options.
aliases:
- Domain Conditional Pointwise Mutual Information
- PMI_DC
- Domain Conditional PMI Scoring
- Surface Form Competition PMI_DC Scoring
