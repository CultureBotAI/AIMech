claims:
- claim_id: fedweit-three-way-parameter-decomposition-and-attention-transfer
  kind: mechanism
  statement: FedWeIT decomposes client c_c's neural network weights at task t across L layers into theta_c^{(t)} = B_c^{(t)} odot m_c^{(t)} + A_c^{(t)} + sum_{i in C \ {c}} sum_{j < |t|} alpha_{i,j}^{(t)} A_i^{(j)} (Equation 1), where B_c^{(t)} in {R^{I_l x O_l}}_{l=1}^L captures generic knowledge across tasks and is selectively filtered by the sparse vector mask m_c^{(t)} in {R^{O_l}}_{l=1}^L, A_c^{(t)} in {R^{I_l x O_l}}_{l=1}^L captures client-specific residual knowledge for task t, and alpha_{i,j}^{(t)} allocates learned attention weights over other clients' sparse task-adaptive parameters A_i^{(j)} sampled from the server knowledge base kb.
  evidence:
  - source_id: r512-primary-pdf
    locator: Section 3.3, Equation (1) and Figure 3, pages 4-5
    relation: supports
- claim_id: fedweit-sparsity-and-retroactive-update-regularization
  kind: mechanism
  statement: During local continual training on task T_c^{(t)}, FedWeIT minimizes L(theta_c^{(t)}; T_c^{(t)}) + lambda_1 Omega({m_c^{(t)}, A_c^{(1:t)}}) + lambda_2 sum_{i=1}^{t-1} ||Delta B_c^{(t)} odot m_c^{(i)} + Delta A_c^{(i)}||_2^2 (Equation 2), where Omega(.) is an l1-norm sparsity regularizer on masks and task-adaptive parameters, and the lambda_2 retroactive-update penalty adjusts previous task-adaptive parameters Delta A_c^{(i)} to compensate for drift Delta B_c^{(t)} = B_c^{(t)} - B_c^{(t-1)} in the masked base parameter, preventing catastrophic forgetting of past tasks i < t.
  evidence:
  - source_id: r512-primary-pdf
    locator: Section 3.3, Equation (2), page 5; Section B.3, Table B.8, page 13
    relation: supports
- claim_id: fedweit-sparse-masked-communication-complexity
  kind: application
  statement: At each communication round r, client c_c transmits only the sparsified base parameter B_hat_c^{(t)} = B_c^{(t)} odot m_c^{(t)} (~30% non-zero entries) and, once per task, the sparse task-adaptive parameter A_c^{(t)} (~2-3% non-zero entries), reducing client-to-server communication from |C| x R x |theta| (1.22 GB) to |C| x (R x |B_hat| + |A|) (0.37 GB) and achieving 84.11% average accuracy with 0.00 forgetting on NonIID-50 across 8 benchmark datasets.
  evidence:
  - source_id: r512-primary-pdf
    locator: Section 3.4, Algorithm 1, page 5; Section 4.1, Tables 1-3, pages 6-8
    relation: supports
- claim_id: fedweit-task-boundary-and-knowledge-base-broadcast-limitation
  kind: limitation
  statement: FedWeIT assumes explicit task boundaries t = 1, 2, ... with task-specific mask and adapter allocation (m_c^{(t)}, A_c^{(t)}) per task, and server-to-client distribution scales with the number of sampled task-adaptive parameters in the knowledge base kb^{(t)}, requiring random subsampling of kb when the number of clients or tasks grows large.
  evidence:
  - source_id: r512-primary-pdf
    locator: Section 3.1, page 3; Section 3.3-3.4, pages 4-5
    relation: supports
