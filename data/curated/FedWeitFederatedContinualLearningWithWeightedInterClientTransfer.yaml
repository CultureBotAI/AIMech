id: AIMech:FedWeitFederatedContinualLearningWithWeightedInterClientTransfer
name: FedWeIT (Federated Weighted Inter-Client Transfer)
concept_kind: algorithm
review_status: DRAFT
definition: FedWeIT (Federated Weighted Inter-Client Transfer) is a parameter-decomposed federated continual learning algorithm that enables distributed clients learning private task streams {T_c^{(1)}, ..., T_c^{(t)}} to transfer relevant cross-client task knowledge while suppressing inter-client interference and catastrophic forgetting by decomposing each client's task-t parameters across L layers as theta_c^{(t)} = B_c^{(t)} odot m_c^{(t)} + A_c^{(t)} + sum_{i in C \ {c}} sum_{j < |t|} alpha_{i,j}^{(t)} A_i^{(j)}, where B_c^{(t)} is a dense local base parameter initialized from the non-zero entries of the server-aggregated parameter theta_G, m_c^{(t)} is a learned sparse channel-selection vector mask, A_c^{(t)} is a sparse local task-adaptive parameter, and alpha_{i,j}^{(t)} are learned attention weights over past task-adaptive parameters broadcast from the server knowledge base.
identity_notes: Introduced by Jaehong Yoon, Wonyong Jeong, Giwoong Lee, Eunho Yang, and Sung Ju Hwang in 'Federated Continual Learning with Weighted Inter-client Transfer' (ICML 2021, PMLR 139:12073-12086; arXiv:2003.03196). Distinct from single-machine Additive Parameter Decomposition (APD, Yoon et al. ICLR 2020), which has no cross-client attention transfer term sum_{i != c} alpha_{i,j}^{(t)} A_i^{(j)} nor sparse masked base-parameter aggregation theta_G = (1/|C^{(r)}|) sum_c B_c^{(t,r)} odot m_c^{(t,r)}; distinct from FedCurv (Shoham et al. 2019) and FedProx (Li et al. 2018), which store all task knowledge in a single shared parameter vector theta_G without task-adaptive decomposition; and distinct from GLFC (Dong et al. CVPR 2022), which addresses class-incremental federated learning via gradient compensation and relation distillation rather than task-incremental parameter decomposition.
aliases:
