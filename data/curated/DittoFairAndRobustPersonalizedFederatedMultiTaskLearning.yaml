claims:
- claim_id: r397-bayes-optimal-fair-and-robust-lambda-characterization
  kind: mechanism
  statement: In the hierarchical Bayesian linear/point estimation setting where benign parameters follow v_k ~ N(theta, tau^2), K_a corrupted devices follow v_k ~ N(theta, tau_a^2) with tau_a^2 > tau^2, and n local samples have noise variance sigma^2, Theorem 8 (and Lemmas 4, 6, 7) proves that the exact Bayes-optimal and maximally fair (zero cross-device test-error variance) regularization parameter is lambda^* = (sigma^2 K) / (tau^2 K + (tau_a^2 - tau^2) K_a + sigma^2 / n), showing that lambda^* decreases monotonically with stronger heterogeneity tau^2 or stronger corruption (K_a, tau_a^2).
  evidence:
  - source_id: r397-primary-pdf
    locator: Section 3.3 Theoretical Analysis of Ditto (Lemmas 4, 6, 7 and Theorem 8) and Appendix A, pp. 5-6, 13-17
    relation: supports
- claim_id: r397-modularity-and-linear-speedup-convergence
  kind: mechanism
  statement: Because the global subproblem w^* in argmin_w G(F_1(w),...,F_K(w)) is completely decoupled from {v_k}, Ditto preserves the exact communication footprint and privacy/robust-aggregation compatibility of the base global solver G, and Theorem 1 (Appendix B) proves that when w^t converges at rate O(1/t) on strongly convex F_k, the personalized iterates v_k^t converge to v_k^* at rate E||v_k^t - v_k^*||^2 = O(1/t) with linear speedup in local steps.
  evidence:
  - source_id: r397-primary-pdf
    locator: 'Section 3.2 Solver: Modularity and Efficiency (Algorithm 1, Theorem 1) and Appendix B, pp. 4-5, 19-21'
    relation: supports
- claim_id: r397-local-state-persistence-and-lambda-tuning-limitation
  kind: limitation
  statement: Requires each participating device k to maintain a persistent local personalized model state v_k across rounds (or warm-start from w^*) and to tune the regularization hyperparameter lambda >= 0 based on the unknown degree of statistical heterogeneity and adversarial corruption.
  evidence:
  - source_id: r397-primary-pdf
    locator: Section 3.2 Algorithm 1, Section 3.3 Theorem 8, and Appendix C.2 Tuning lambda, pp. 4-6, 22
    relation: supports
- claim_id: r397-fairness-and-byzantine-defense-benchmarks-application
  kind: application
  statement: Evaluated on FEMNIST, CelebA, StackOverflow, and Fashion-MNIST under benign heterogeneity and three Byzantine attacks (A1 label poisoning, A2 random Gaussian updates, A3 model replacement), simultaneously reducing benign device test-accuracy variance (improving fairness) and boosting robust test accuracy by up to 40% when paired with Krum, Multi-Krum, or median aggregation.
  evidence:
  - source_id: r397-primary-pdf
    locator: Section 4 Experiments (Figures 3-8, Tables 1-2), pp. 6-9
    relation: supports
