id: AIMech:DittoFairAndRobustPersonalizedFederatedMultiTaskLearning
name: Ditto Fair and Robust Personalized Federated Multi-Task Learning
concept_kind: algorithm
review_status: DRAFT
definition: 'A decoupled bi-level personalized federated multi-task learning framework (Ditto) that resolves the tension between cross-device performance fairness (uniformity/low variance of benign device test errors) and Byzantine robustness (resistance to data/model poisoning) under statistical heterogeneity: min_{v_k in R^d} h_k(v_k; w^*) := F_k(v_k) + (lambda / 2) ||v_k - w^*||^2 subject to w^* in argmin_w G(F_1(w), ..., F_K(w)). Unlike coupled personalization schemes, the global objective G(.) is optimized for w^t completely independently of the local personalized models {v_k^t} while each device k interleaves local stochastic gradient steps on h_k(v_k; w^t) = F_k(v_k) + (lambda / 2)||v_k - w^t||^2, interpolating between pure local training (lambda = 0) and the global model (lambda -> infinity).'
identity_notes: Distinct from pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes, where the global model w minimizes the sum of Moreau envelopes F_i(w) and therefore depends directly on the local personalized iterates theta_i, making w vulnerable to local personalization state changes and requiring extra inner-loop steps before updating w) and from q-FFL (AIMech:QFairFederatedLearningAlphaFairResourceAllocation, which learns a single global model w whose fairness-oriented reweighting of high-loss devices degrades robustness under Byzantine corruption).
aliases:
- Ditto
- Ditto Personalized Federated Learning
- Global-Regularized Personalized Federated Multi-Task Learning
