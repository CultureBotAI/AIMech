  relation: supports
claims:
- claim_id: criterion-scope
  kind: scope
  statement: Condition on the factual context X=x,A=a to infer background-variable uncertainty; replace
    the protected-attribute structural assignment by a counterfactual value and propagate that intervention
    through the causal model. Compare the resulting prediction distributions for all attainable protected
    values while retaining the same factual conditioning context. The criterion is distributional, and
    the paper gives using non-descendants of the protected attributes as a sufficient construction, not
    a necessary restriction on all possible predictors.
  evidence:
  - source_id: original-paper
    locator: Section 2.2 and Section 3, Definition 5/equation (1), PDF p. 3; Section 3.2, Lemma 1 and
      its qualification, PDF p. 5; Sections 4.2–4.3, causal assumptions and interpretive limits, PDF p.
      7
    relation: supports
- claim_id: causal-model-misspecification
  kind: limitation
  statement: The sensitivity study distinguishes a guessed model used to construct a fair predictor from
    a model allowing additional unobserved confounding through correlated errors. Fairness in the guessed
    model does not guarantee fairness under the alternative data-generating assumptions; the paper frames
    this as sensitivity analysis rather than identification of a uniquely correct hidden model.
  evidence:
  - source_id: confounding-sensitivity
    locator: Section 2.1, PDF pp. 2–3 (volume pp. 617–618); Section 3.1 and Figure 1, PDF p. 4 (volume
      p. 619)
    relation: supports
- claim_id: parity-relation-scope
  kind: limitation
  statement: Rosenblatt and Witter's parity connections use their explicit independence criterion for
    latent and protected variables, and the demographic-parity-to-counterfactual-fairness direction constructs
    a causal model and latent representation. The paper distinguishes that setting from assessment with
    a fixed causal model; the relationship is not an unrestricted synonym assertion.
  evidence:
  - source_id: causal-parity-analysis
    locator: Related Work distinction between a fixed and freely constructed causal model, PDF p. 3; Criteria
      3 and Theorems 4–5, PDF p. 4
    relation: supports
