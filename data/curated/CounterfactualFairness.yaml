name: Counterfactual fairness
definition: A fairness criterion in a specified causal model requiring a predictor's conditional output
  distribution, given an individual's observed attributes and protected-attribute value, to remain unchanged
  under counterfactual interventions that assign other attainable protected-attribute values.
concept_kind: evaluation_criterion
identity_notes: This is Kusner and colleagues' Definition 5, an equality of conditional counterfactual
  distributions. It is not merely changing an input feature while freezing its causal descendants, a group-level
  observational equality, the FAIRLEARNING algorithm, or a generic guarantee of social fairness. All 442
  pinned AIO labels/scoped synonyms, 94 preceding native identities and ignored-inclusive text in both
  checkouts were searched. Later parity connections do not establish identity under an arbitrary fixed
  causal model.
limitations:
- The comparison depends on causal and counterfactual assumptions that observational data alone generally
  cannot establish. Specifying protected attributes and meaningful interventions requires domain interpretation.
- Ignoring protected attributes as explicit inputs is insufficient when other inputs carry their causal
  effects. Conversely, using a descendant is not categorically excluded if the relevant total dependence
  cancels, as the source qualifies its sufficient construction.
- A predictor satisfying the condition in an assumed model need not satisfy it under a model with omitted
  confounding; the inspected sensitivity paper studies this vulnerability in additive-noise models.
- The criterion constrains conditional output distributions, not necessarily pointwise equality for every
  unobserved state or usefulness of a predictor. Connections to demographic parity retain their model/independence
  assumptions.
aliases:
- CF (counterfactual fairness)
