  rationale: No examined AIO target denotes this iid-source closeness approximation algorithm. Shared
    words concerning functions, sampling, rankings or graphs do not establish equivalence or a supported
    task hierarchy.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: The procedure estimates a structural score per vertex without assigning groups.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Unlabeled graph input alone does not make score estimation a grouping task.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity includes a randomized source experiment and repeated shortest-path
      computation, rather than merely a mathematical function.
  - target: AIO:DataPreparation
    rejection_reason: The defined objective is estimating graph closeness, not preparing machine-learning
      data. Possible feature use is insufficient.
  - target: AIO:GraphLanguageModel
    rejection_reason: No language-model architecture, token prediction or language training is defined.
  - target: AIO:RankingBias
    rejection_reason: A structural centrality estimator is not the belief that high-ranked information
      is necessarily more relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Uniform independent sampling and estimator error are method properties; they do
      not identify a bias caused by nonrandom selection.
  - target: AIO:RepresentationBias
    rejection_reason: The algorithm is not the bias concept concerning nonrepresentative subgroups.
  - target: AIO:DeepActiveLearning
    rejection_reason: Sampling source vertices requires no training labels or deep-network fitting.
limitations:
- The explicit record is restricted to connected undirected graphs with positive edge lengths and n>1.
  Disconnected distances, negative or zero lengths, directed conventions and alternative centrality normalizations
  need separate evidence.
- Formal source support uses the two-page author-hosted SODA manuscript. The seven-page journal version
  was read as web-extracted text only; local download returned HTTP 403 and mathematical page images were
  not available to inspect. Exact equivalence between versions is not asserted.
- The source’s informal equivalence between constant diameter and a bounded minimum/maximum distance ratio
  is not adopted as a general theorem for arbitrary positive weighted graphs. Relative centrality guarantees
  here require the stated mean-to-diameter or relative-error condition.
- The source’s page 2 bound prose writes d(i,u); Algorithm RAND defines sampled vertices v_i. The maintained
  contribution is d(v_i,u), consistent with its stated random experiment.
- Finite arithmetic illustrates error and degeneracy; it is not a replication of author software, a new
  empirically established confidence guarantee, or proof by enumerating all possible graphs. No model
  fitting, paid service or data upload was used. DRAFT remains after author self-review.
