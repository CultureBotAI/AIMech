name: Rectified flow
definition: A transport-learning method that regresses a velocity field on endpoint differences along
  straight interpolations of coupled samples and uses the resulting ordinary differential equation to
  transport the source distribution, optionally repeating rectification using the learned endpoint coupling.
concept_kind: algorithm
identity_notes: The ignored-inclusive identity search covered both checkouts, all 442 AIO labels and scoped
  synonyms, and 90 preceding native identities. This record denotes the straight-interpolation regression
  and rectification procedure of Liu, Gong and Liu, including optional reflow. It overlaps with particular
  conditional flow-matching objectives, but does not denote every probability-path choice in flow matching,
  a particular trained image generator, or mandatory distillation.
limitations:
- Marginal preservation and transport-cost statements concern ideal regression with a well-posed ODE,
  not arbitrary finite neural estimates or numerical solvers.
- Straight training interpolations do not make the learned marginal trajectories exactly straight; one-step
  accuracy is not universal. Reflow and distillation are optional.
- The original paper explicitly does not guarantee a globally cost-optimal coupling in general. Later
  analysis also gives nonoptimal zero-loss fixed points for a gradient-constrained rectification variant
  when required support or regularity assumptions are absent.
- The later optimal-transport counterexamples limit stronger equivalence claims; they do not refute the
  original least-squares construction. No executable solver, numerical benchmark or full proof verification
  is supplied.
