claims:
- claim_id: generative-mechanism
  kind: mechanism
  statement: Given coupled endpoints X0 and X1, training samples t and regresses v((1−t)X0+tX1,t) toward
    X1−X0 using squared error. The ideal minimizer is the conditional mean endpoint difference at the
    interpolated state. Integrating dZt/dt=v(Zt,t) from the source sample induces a new endpoint coupling.
    Reflow optionally trains another rectified flow on that coupling; endpoint-map distillation is a separate
    optional step.
  evidence:
  - source_id: original-paper
    locator: Sections 2.1–2.2, equations (1)–(2), Algorithm 1 and transport-cost discussion, PDF pp. 4–6
    relation: supports
- claim_id: optimal-transport-boundary
  kind: limitation
  statement: A later analysis of gradient-constrained rectification exhibits nonoptimal zero-loss fixed
    points with disconnected intermediate supports; its corrected equivalence theorem additionally requires
    full intermediate support, rectifiability and smooth potential fields. Straightness or imposing a
    potential alone does not establish globally optimal transport.
  evidence:
  - source_id: optimal-transport-analysis
    locator: Sections 3.1–3.2, PDF pp. 5–6; Section 4.1, Proposition 10, Theorem 11 and Remark 12, PDF
      pp. 7–8
    relation: supports
