aio_mappings:
- target: AIO:MarkovChain
  relation: related_match
  rationale: Rank Centrality defines item scores as the stationary distribution of a reversible random-walk Markov chain over the comparison graph.
- target: AIO:LogisticRegression
  relation: related_match
  rationale: Estimates parameters of the Bradley-Terry-Luce / Multinomial Logit model and is compared directly against pairwise logistic regression MLE (Section 3.5, Theorem 4).
- target: AIO:RankingBias
  relation: related_match
  rationale: Eliminates the non-vanishing degree-heterogeneity ranking bias of Borda Count and MC1-MC4 random walks on irregular comparison graphs.
limitations:
- Unregularized Rank Centrality (epsilon = 0) can overfit when a node participates in very few comparisons and wins all of them (producing a sink or near-sink in the Markov chain, as illustrated by drivers with 1 race in Table 1 for the NASCAR 2002 dataset), requiring Beta(epsilon, epsilon) Laplace smoothing (Equation 5) on sparse irregular graphs.
- Theorem 1's upper bound scales as b^{5/2} where b = max_{i,j} w_i / w_j is the dynamic range of BTL weights; when b grows rapidly with n, the reversible chain's spectral gap 1 - lambda_max(P_tilde) >= (d_min / (b^2 d_max)) xi can become small.
