claims:
- claim_id: claim-uniform-dmax-scaling-reversibility-and-self-adjoint-contraction
  kind: mechanism
  statement: "Scaling off-diagonal comparison ratios by the global maximum degree $1/d_{\\max}$ in $P_{ij} = \\frac{1}{d_{\\max}}A_{ij}$ (Equation 1) makes the population BTL chain $\\tilde{P}$ reversible with respect to $\\tilde{\\pi}_i = w_i / \\sum_l w_l$ ($\\tilde{\\pi}_i\\tilde{P}_{ij} = \\tilde{\\pi}_j\\tilde{P}_{ji}$) and self-adjoint in $L^2(\\tilde{\\pi})$ on any connected graph $G$, whereas degree-normalized chains ($P_{ij}^{\\text{(MC3)}} = A_{ij}/d_i$) and unnormalized Borda Count remain asymptotically biased as $k \\to \\infty$ on non-regular graphs; Lemma 2 proves geometric contraction $\\frac{\\|p_t - \\tilde{\\pi}\\|_2}{\\|\\tilde{\\pi}\\|_2} \\le \\rho^t\\frac{\\|p_0 - \\tilde{\\pi}\\|_2}{\\|\\tilde{\\pi}\\|_2}\\sqrt{\\frac{\\tilde{\\pi}_{\\max}}{\\tilde{\\pi}_{\\min}}} + \\frac{1}{1-\\rho}\\|\\Delta\\|_2\\sqrt{\\frac{\\tilde{\\pi}_{\\max}}{\\tilde{\\pi}_{\\min}}}$ (Sections 2.2, 3.3, and 4.1, Equations 1\u20132 and 11, Lemma 2)."
  evidence:
  - source_id: nos2017-rankcent-pdf
    locator: Section 2.2 (Eqs. 1-2, pp. 9-10), Section 3.3 (pp. 14-16), Section 4.1 (Lemma 2, pp. 24-26)
    relation: supports
- claim_id: claim-dirichlet-form-laplacian-spectral-gap-comparison-and-general-graph-bound
  kind: mechanism
  statement: "By comparing the Dirichlet forms $\\mathcal{E}^{\\tilde{P}}(\\phi,\\phi)$ and $\\mathcal{F}^{\\tilde{P}}(\\phi,\\phi)$ of $(\\tilde{P},\\tilde{\\pi})$ with those of the simple random walk $Q = D^{-1}B$ with stationary distribution $\\mu(i) = d_i/\\sum_l d_l$ and spectral gap $\\xi = 1 - \\lambda_{\\max}(D^{-1}B)$, Lemma 6 proves $\\frac{1 - \\lambda_{\\max}(\\tilde{P})}{1 - \\lambda_{\\max}(Q)} \\ge \\frac{\\alpha}{\\beta} \\ge \\frac{d_{\\min}}{b^2 d_{\\max}}$ (Equations 26\u201327), which combined with matrix Bernstein concentration $\\|P - \\tilde{P}\\|_2 \\le C\\sqrt{\\log n/(k d_{\\max})}$ (Lemma 3) yields Theorem 1: $\\frac{\\|\\pi - \\tilde{\\pi}\\|_2}{\\|\\tilde{\\pi}\\|_2} \\le \\frac{C b^{5/2}\\kappa}{\\xi}\\sqrt{\\frac{\\log n}{k d_{\\max}}}$ and Lemma 1's weighted ranking error bound $D_w(\\sigma) \\le \\frac{\\|w - \\pi\\|_2}{\\|w\\|_2}$ (Sections 3.1, 3.3, and 4.1.2\u20134.1.4, Theorem 1, Lemmas 1, 3, 4, and 6)."
  evidence:
  - source_id: nos2017-rankcent-pdf
    locator: Sections 3.1 & 3.3 (Theorem 1, Lemma 1, pp. 11-13), Sections 4.1.2-4.1.4 (Lemmas 3, 4, 6, pp. 27-32)
    relation: supports
- claim_id: claim-erdos-renyi-minimax-optimality-and-simplex-fano-lower-bound
  kind: application
  statement: "When $G \\sim G(n, d/n)$ is an Erd\u0151s\u2013R\xE9nyi graph with $d \\ge 10 C^2\\log n$ and $k d \\ge 128 C^2 b^5\\log n$, Lemma 7 proves $\\xi \\ge 1/2$ and Theorem 2 establishes $\\frac{\\|\\pi - \\tilde{\\pi}\\|_2}{\\|\\tilde{\\pi}\\|_2} \\le 8 C b^{5/2}\\sqrt{\\frac{\\log n}{k d}}$, while Theorem 3 constructs an $e^{n/128}$-packing of the bounded-dynamic-range simplex $\\mathcal{S}_b$ (Lemma 8) and applies Fano's inequality to prove the minimax lower bound $\\inf_{\\mathcal{A}}\\sup_{\\tilde{\\pi}\\in\\mathcal{S}_b}\\frac{\\mathbb{E}[\\|\\pi^{\\mathcal{A}} - \\tilde{\\pi}\\|_2]}{\\|\\tilde{\\pi}\\|_2} \\ge \\frac{b-1}{240\\sqrt{10}(b+1)}\\frac{1}{\\sqrt{kd}}$ (Sections 3.2, 3.4, 4.2, and 4.3, Theorems 2\u20133, Lemmas 7\u20138)."
  evidence:
  - source_id: nos2017-rankcent-pdf
    locator: Sections 3.2 & 3.4 (Theorems 2-3, pp. 12, 18-19), Sections 4.2-4.3 (Lemmas 7-8, pp. 32-36)
    relation: supports
