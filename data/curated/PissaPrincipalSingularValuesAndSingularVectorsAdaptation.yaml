aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: related_match
  rationale: PiSSA adapts linear layers of deep neural networks and large language models by fine-tuning their principal singular subspace.
- target: AIO:DimensionalityReduction
  relation: related_match
  rationale: PiSSA uses truncated Singular Value Decomposition (SVD) or randomized Fast SVD to partition weight matrices into a low-rank principal subspace and an orthogonal residual subspace.
limitations:
- Requires an upfront SVD or randomized Fast SVD decomposition of every target weight matrix prior to training.
- Because the frozen base matrix is modified to W^{res} = W - A_{init} B_{init}, hot-swapping multiple task adapters on an unmodified base weight W requires storing or subtracting the initial low-rank product A_{init} B_{init}.
