id: AIMech:PissaPrincipalSingularValuesAndSingularVectorsAdaptation
name: Principal Singular Values and Singular Vectors Adaptation (PiSSA)
concept_kind: algorithm
review_status: DRAFT
definition: 'Principal Singular Values and Singular Vectors Adaptation (PiSSA) is a parameter-efficient fine-tuning (PEFT) method that shares the exact architecture of Low-Rank Adaptation (LoRA), Y = X W = X (W^{res} + A B), but initializes the trainable low-rank matrices A in R^{m x r} and B in R^{r x n} using the top-r principal singular values and singular vectors of the pretrained weight matrix W = U diag(S) V^T: A = U_{:,:r} diag(S_{:r}^{1/2}) and B = diag(S_{:r}^{1/2}) V_{:,:r}^T, while freezing the residual matrix W^{res} = W - A B = U_{:,r:} diag(S_{r:}) V_{:,r:}^T. Because A and B start aligned with the dominant singular directions of W rather than at zero, PiSSA preserves the exact initial forward pass W = W^{res} + A B while yielding non-zero, high-magnitude initial gradients along the principal subspace and substantially reducing base-model quantization error when quantizing only W^{res} (QPiSSA).'
identity_notes: Distinct from standard LoRA (Hu et al., 2022), which freezes the entire pretrained matrix W and initializes A with Gaussian noise and B = 0, resulting in a zero initial gradient for A (partial L / partial A = X^T (partial L / partial Y) B^T = 0) and slow early-stage optimization. Also distinct from LoftQ (Li et al., 2024), which iteratively alternates quantization and SVD to approximate W with Q + A B where A B corrects quantization residuals rather than containing the principal singular components of W.
aliases:
- PiSSA
- Principal Singular Values and Singular Vectors Adaptation
- QPiSSA
- Quantized Principal Singular Values and Singular Vectors Adaptation
