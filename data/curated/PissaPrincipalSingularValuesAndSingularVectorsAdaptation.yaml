claims:
- claim_id: r652-claim-principal-svd-partition-and-exact-init
  kind: mechanism
  statement: Given the SVD W = U diag(S) V^T with singular values sorted in descending order, PiSSA sets A = U_{:,:r} diag(S_{:r}^{1/2}), B = diag(S_{:r}^{1/2}) V_{:,:r}^T, and frozen W^{res} = U_{:,r:} diag(S_{r:}) V_{:,r:}^T, guaranteeing exact initial model equivalence W^{res} + A B = W while ensuring both initial factor gradients partial L / partial A = X^T (partial L / partial Y) B^T and partial L / partial B = A^T X^T (partial L / partial Y) are immediately non-zero and aligned with the top-r singular directions.
  evidence:
  - source_id: r652-primary-pdf
    locator: Section 3.1, Equations (3)-(6) and Figure 1, p. 2-4
    relation: supports
- claim_id: r652-claim-qpissa-quantization-error-reduction
  kind: mechanism
  statement: "In QPiSSA, removing the top-r principal singular components from W before quantizing the residual matrix W^{res} to 4-bit NormalFloat (NF4) strips away the largest singular values and narrows the outlier distribution of the matrix being quantized, while keeping the dominant principal components A and B in full precision\u2014substantially reducing quantization error ||W - (nf4(W^{res}) + A B)||_* compared to QLoRA's ||W - nf4(W)||_*."
  evidence:
  - source_id: r652-primary-pdf
    locator: 'Section 3.2 (QPiSSA: Quantizing the Residual Matrix), Equation (7), Figure 2 & Table 2, p. 4-6'
    relation: supports
- claim_id: r652-claim-fast-svd-initialization-and-llm-benchmarks
  kind: application
  statement: By employing randomized Fast SVD (Halko et al., 2011) with n_iter power iterations, PiSSA reduces initialization overhead to a few seconds and significantly outperforms LoRA, QLoRA, and LoftQ on mathematical reasoning (GSM8K, MATH), code generation (HumanEval, MBPP), and GLUE tasks across LLaMA-2-7B/13B/70B, Mistral-7B, Gemma-7B, and DeBERTa-v3-large.
  evidence:
  - source_id: r652-primary-pdf
    locator: Section 3.3 (Fast SVD), Table 3, and Section 4.1-4.4, Tables 4-7, p. 6-9
    relation: supports
- claim_id: r652-claim-per-adapter-modified-base-matrix-limitation
  kind: limitation
  statement: Because PiSSA subtracts A_{init} B_{init} from W to form W^{res}, switching among multiple task-specific PiSSA adapters on a shared frozen base model requires either storing A_{init} B_{init} alongside each adapter (updating W^{res} + A B = W + (A B - A_{init} B_{init})) or folding the adapter back into W, and computing exact SVD on massive weight matrices without Fast SVD incurs O(min(m, n) * m * n) initialization time.
  evidence:
  - source_id: r652-primary-pdf
    locator: Section 3.3 (Fast SVD initialization cost), p. 6; Appendix A (Switching adapters / PEFT integration), p. 15
    relation: supports
