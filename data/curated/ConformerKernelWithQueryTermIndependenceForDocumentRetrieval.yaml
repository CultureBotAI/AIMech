id: AIMech:ConformerKernelWithQueryTermIndependenceForDocumentRetrieval
name: Conformer-Kernel with Query Term Independence for Document Retrieval
concept_kind: architecture
review_status: DRAFT
definition: "An efficient neural document retrieval and ranking architecture (Mitra, Hofst\xE4tter, Zamani, & Craswell, 2020) that modifies the Transformer-Kernel (TK) model along three axes: (1) replacing quadratic O(|d|^2) self-attention with linear-complexity separable self-attention Out = Phi(Q)*(Phi(K^T)*V) to process documents thousands of tokens long without sliding windows, (2) combining windowed convolutional layers and separable self-attention in a hybrid Conformer layer, and (3) enforcing a Query Term Independence (QTI) assumption by encoding query terms solely with context-free embeddings while combining an implicit Conformer-Kernel soft-match score and an explicit batch-scaled BM25-like lexical sub-model so that per-(term, document) impact scores can be pre-computed offline and stored in a standard inverted index for full-collection retrieval."
identity_notes: Distinct from TK (AIMech:TKTransformerKernelRankingModel, which contextualizes both query and document with quadratic self-attention) and TKL (AIMech:TKLTransformerKernelForLongDocuments, which applies TK over overlapping sliding windows of long documents). Conformer-Kernel replaces quadratic self-attention with separable self-attention (Equations 5-6) inside a parallel Convolution+Transformer (Conformer) block and optionally enforces Query Term Independence (CK with QTI) by combining a learned explicit batch-scaled BM25 sub-model s_{t,d}^{(explicit)} (Equations 9-10) with an implicit Conformer-Kernel sub-model s_{t,d}^{(implicit)} (Equations 11-16) whose non-negative combined scores s_{t,d} = ReLU(alpha * s_{t,d}^{(explicit)} + (1 - alpha) * s_{t,d}^{(implicit)} + b_comb) can be pre-computed offline for top-k vocabulary terms per document.
aliases:
- Conformer-Kernel with Query Term Independence
- Conformer-Kernel
- CK with QTI
- Conformer-Kernel Document Retrieval Architecture
