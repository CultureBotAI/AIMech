claims:
- claim_id: conformer-kernel-separable-self-attention-and-hybrid-layer
  kind: mechanism
  statement: To scale document contextualization to thousands of tokens without quadratic O(n^2) intermediate attention matrices, Conformer-Kernel factorizes self-attention into separable self-attention A = Phi(K^T) V in R^{d_key x d_val} and Out = Phi(Q) A in R^{n x d_val} (Equations 5-6, where Phi(.) is row-wise softmax) with O(n * d_key) intermediate memory, and combines a windowed 1D convolution layer and separable Transformer layer in parallel inside a Conformer block (Figure 1c).
  evidence:
  - source_id: r792-primary-pdf
    locator: Section 3.2 (Separable Self-Attention) & Section 3.3 (Conformer Layer), pp. 3-4, Figure 1, Equations (5)-(6)
    relation: supports
  - source_id: r792-primary-pdf
    locator: separable_self_attention verification
    relation: supports
- claim_id: conformer-kernel-query-term-independence-and-explicit-implicit-scoring
  kind: mechanism
  statement: Under Query Term Independence (QTI), Conformer-Kernel leaves query terms context-free and decomposes document scoring into S_{q,d} = sum_{t in q} s_{t,d}, where s_{t,d} = ReLU(alpha * s_{t,d}^{(explicit)} + (1 - alpha) * s_{t,d}^{(implicit)} + b_comb) combines a learned explicit BM25-like sub-model s_{t,d}^{(explicit)} = IDF_t * BS(TF_{t,d}) / (BS(TF_{t,d}) + ReLU(w_dlen * BS(|d|) + b_dlen) + eps) using batch scaling BS(x) = x / (E[x] + eps) (Equations 9-10) with a length-normalized Conformer-Kernel RBF soft-match sub-model s_{t,d}^{(implicit)} (Equations 11-16), allowing all s_{t,d} values to be pre-computed offline and indexed for retrieval.
  evidence:
  - source_id: r792-primary-pdf
    locator: Section 3.4 (Enforcing Query Term Independence), pp. 4-6, Figure 2, Equations (7)-(16)
    relation: supports
  - source_id: r792-primary-pdf
    locator: explicit_bm25_submodel and batch_scale verification
    relation: supports
- claim_id: conformer-kernel-trec-dl-empirical-performance
  kind: application
  statement: On the TREC 2019 Deep Learning Track document ranking task (with documents up to |d| = 2000 tokens), Conformer-Kernel achieves 0.680 NDCG@10 and 0.371 MRR (and 0.629 NDCG@10 under QTI) compared to 0.525 NDCG@10 for BM25, while reducing training memory from 10.61 GB (TK at |d|=2000, batch size 8) to 0.83 GB at batch size 32.
  evidence:
  - source_id: r792-primary-pdf
    locator: Section 5 (Results), pp. 7-8, Tables 2-3
    relation: supports
- claim_id: conformer-kernel-qti-query-context-tradeoff
  kind: limitation
  statement: Enforcing Query Term Independence (QTI) removes cross-term query contextualization, reducing NDCG@10 on the TREC DL 2019 test set from 0.680 (full Conformer-Kernel) to 0.629 (CK with QTI), and full-collection inverted-index retrieval requires sparsifying offline document scores to top-k vocabulary terms per document to bound index size.
  evidence:
  - source_id: r792-primary-pdf
    locator: Section 3.4 (Figure 2c) & Section 5 (Table 2 & Discussion), pp. 5-8
    relation: supports
