claims:
- claim_id: sledge-two-stage-asymmetric-field-and-scibert-transfer
  kind: mechanism
  statement: SLEDGE indexes concatenated scientific article titles, abstracts, full-text paragraphs, and headings (preferring cleaner PubMed XML over PDF text) to retrieve the top 500 candidates using BM25 (tuned via grid search to k_1 = 3.9, b = 0.55 with a >= Jan 1, 2020 date filter in run1), and re-ranks candidates using a Vanilla SciBERT cross-encoder trained on MS MARCO via pairwise cross-entropy L(q, d^+, d^-) = -log(R(q, d^+)) - log(1 - R(q, d^-)) (Equation 1) by scoring the topic's natural-language question field against each candidate's title and abstract.
  evidence:
  - source_id: r799-primary-pdf
    locator: Section 3.1-3.2 (First-Stage Retrieval & Neural Re-Ranking) & Section 5.1, pp. 2-4, Equation (1)
    relation: supports
  - source_id: r799-primary-pdf
    locator: bm25_score and pairwise_cross_entropy_loss verification
    relation: supports
- claim_id: sledge-med-msmarco-lexicon-filtered-zero-shot-transfer
  kind: mechanism
  statement: In the fully automatic zero-shot setting without human judgments or hyperparameter tuning (run2), SLEDGE mitigates domain shift by filtering the 808,531 MS MARCO training queries with the MedSyn medical terminology lexicon (excluding ambiguous common words such as gas, card, bing, died, map, and fall) to construct Med-MSMARCO (78,895 queries, 9.7% of MS MARCO) for training the SciBERT re-ranker.
  evidence:
  - source_id: r799-primary-pdf
    locator: Section 5.2 (Ranking without hyperparameter tuning & Footnote 5), p. 5
    relation: supports
  - source_id: r799-primary-pdf
    locator: filter_med_msmarco_queries verification
    relation: supports
- claim_id: sledge-trec-covid-leaderboard-performance
  kind: application
  statement: On Round 1 of the TREC-COVID shared task (51,045 CORD-19 articles, 56 participating teams), SLEDGE run1 tops the manual-run leaderboard with 0.6844 nDCG@10 and 0.6533 P@5 (fully relevant) (and reaches 0.7733 nDCG@10 when using the question field in both stages, Table 3), while automatic SLEDGE run2 achieves 0.6032 nDCG@10 and 0.5667 P@5 (fully relevant, Tables 1-2).
  evidence:
  - source_id: r799-primary-pdf
    locator: Section 5.1-5.3 (Tables 1-3), pp. 4-6
    relation: supports
- claim_id: sledge-incidental-mention-and-term-count-limitation
  kind: limitation
  statement: Failure analysis on queries such as Query 23 (coronavirus hypertension) shows that Vanilla SciBERT can rank documents with incidental single mentions of a query term above documents with frequent term repetition that BM25 ranks highly, and applying a hard publication-date filter improves top-rank precision but caps total system recall by discarding pre-2020 coronavirus literature (Section 5.3).
  evidence:
  - source_id: r799-primary-pdf
    locator: Section 5.3 (Topic fields and date filtering & Failure cases), pp. 6-7, Figure 3
    relation: supports
