id: AIMech:SLEDGESciBERTZeroShotScientificLiteratureSearch
name: SLEDGE (SciBERT Zero-Shot Domain-Transfer Scientific Literature Search)
concept_kind: architecture
review_status: DRAFT
definition: A two-stage zero-shot domain-transfer scientific literature retrieval and neural re-ranking methodology (MacAvaney, Cohan, & Goharian, EMNLP 2020) that combines first-stage BM25 candidate generation over concatenated scientific article title, abstract, full-text paragraphs, and headings (with optional publication-date filtering and high-k_1 term-saturation tuning k_1 = 3.9, b = 0.55) with a second-stage SciBERT cross-encoder re-ranker trained in a zero-shot transfer regime on general-domain MS MARCO passage ranking pairs (or the MedSyn-filtered 78,895-query Med-MSMARCO medical subset in the fully automatic setting) to score natural-language topic questions against article titles and abstracts.
identity_notes: Distinct from general-domain BERT passage rerankers (Nogueira & Cho, 2019) and from CEDR (AIMech:CEDRContextualizedEmbeddingsForDocumentRanking). SLEDGE bridges emerging scientific domains lacking in-domain relevance judgments by pairing a scientific pre-trained language model (SciBERT) with out-of-domain relevance supervision transferred from MS MARCO (or lexicon-filtered Med-MSMARCO via the MedSyn layperson medical lexicon) and asymmetric field routing (searching full text with keyword queries or natural-language questions in Stage 1 while re-ranking title+abstract with natural-language questions in Stage 2).
aliases:
- SLEDGE
- SLEDGE Scientific Knowledge Search
- SLEDGE Zero-Shot SciBERT Scientific Literature Reranking Pipeline
