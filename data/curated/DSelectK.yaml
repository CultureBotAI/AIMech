id: AIMech:DSelectK
name: DSelect-k
definition: >-
  A differentiable mixture-of-experts gate that combines k binary-encoded
  selectors through softmax weights and relaxes their bits with a smooth-step
  function; binary selectors yield at most k selected experts.
concept_kind: mathematical_method
identity_notes: >-
  The gate of Hazimeh and colleagues (2021), not a complete mixture model or
  a trained checkpoint. Ignored-inclusive identity searches found no exact
  record; the separate discovery ledger records scope and nearby concepts.
definition_evidence:
  - source_id: hazimeh-2021
    locator: Sections 3.1.1-3.1.3, pages 5-7, equation (6)
    relation: supports
claims:
  - claim_id: conditional-sparsity
    kind: limitation
    statement: >-
      Fractional relaxed bits can activate more than k experts. Entropy
      regularization encourages one-hot selectors; sparsity must be checked.
    evidence:
      - source_id: hazimeh-2021
        locator: Section 3.1.3, page 7, opening paragraph and entropy regularization
        relation: supports
  - claim_id: input-conditioning
    kind: mechanism
    statement: >-
      The per-example version makes selector codes and combination weights
      functions of the input. Binary selector outputs give the k-expert bound
      for that example; an average bound is weaker than an every-example bound.
    evidence:
      - source_id: hazimeh-2021
        locator: Section 3.2, page 8
        relation: supports
evidence_sources:
  - source_id: hazimeh-2021
    title: 'DSelect-k: Differentiable Selection in the Mixture of Experts with Applications to Multi-Task Learning'
