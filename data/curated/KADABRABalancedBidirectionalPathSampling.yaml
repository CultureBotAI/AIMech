aio_no_match:
  search_scope: Compared all 442 pinned AIO and 694 preceding native identities with ignored- and hidden-inclusive
    searches of three checkouts. A broad KADABRA search term also matches the enclosing estimator, whose
    complete definition and scope were read to distinguish the subroutine. Semantic assessment covers155
    AIO and539 native definitions; eleven complete AIO contexts and five full native neighbors assessed.
  rationale: No examined AIO target denotes the conditional uniform shortest-path sampler. In particular,
    BidirectionalLayer is an RNN wrapper, not a bidirectional graph search.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: Sampling a path does not group vertices into clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Uniformly sampling a conditional shortest path does not group vertices into clusters,
      whether or not labels are available.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity is a randomized graph-search and path-sampling procedure, not merely
      an input-output function.
  - target: AIO:DataPreparation
    rejection_reason: The defined output is a sampled shortest path; incidental downstream feature use
      does not establish a data-preparation identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The conditional graph-path sampler has no language-model objective, training mechanism
      or learned representation.
  - target: AIO:RankingBias
    rejection_reason: A sampled graph path is not a belief about the relevance of highly ranked information.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: A specified uniform conditional path law is an algorithm, not a selection-bias concept.
  - target: AIO:RepresentationBias
    rejection_reason: A graph-path sampling procedure is not subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: Neither labels nor a deep neural network are acquired or fitted.
  - target: AIO:DataDredgingBias
    rejection_reason: Conditional shortest-path sampling does not itself define a data-dredging bias.
  - target: AIO:BidirectionalLayer
    rejection_reason: This AIO class wraps recurrent neural networks; forward and reverse graph searches
      do not instantiate that layer.
limitations:
- Exact simple unweighted graph paths and exact counts are assumed. Weighted shortest paths, multiedge
  conventions, finite-precision sampling and approximate count correction require separate analysis.
- The conditional endpoint sampler does not by itself define a centrality estimator or its accuracy, confidence,
  stopping rule or endpoint population.
- Uniformity requires processing the full chosen frontier and count-weighted meeting-edge and segment
  choices. A generic bidirectional search that returns its first meeting path is not equivalent.
- Finite exact calculations and source interpretation are curator checks, not execution or verification
  of the authors’ implementation. Some random-graph proof displays were read only as extracted text.
- No universal runtime improvement, current-software comparison or proof of every reported random-graph
  bound is asserted. DRAFT remains after author self-review.
