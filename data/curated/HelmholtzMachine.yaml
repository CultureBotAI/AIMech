name: Helmholtz machine
definition: A hierarchical probabilistic neural model that pairs a top-down generative model with a separately
  parameterized bottom-up recognition model approximating the distribution of hidden causes given observed
  input.
concept_kind: architecture
identity_notes: 'This record covers the original paired generative/recognition model family in Dayan and
  colleagues’ paper. Its original layered binary construction admits both a deterministic mean-field-inspired
  training approximation and a stochastic wake-sleep procedure; the architecture is not synonymous with
  either training rule. The generative and recognition parameters are separate, rather than tied symmetric
  connections of a Boltzmann machine. Related later variational autoencoders and deep belief networks
  are not treated as identity aliases. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 340 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 24 and 24 lines respectively. All
  17 unique matched line contents were inspected in full: NVIL method distinctions, source-reading scopes,
  prior reviews and the carried wake-sleep discovery lead, not existing candidate records. Exact checkout
  counts and differences are retained in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- The tractable recognition family need not contain the true posterior, even when the directed generative
  model factors locally. Explaining-away dependencies can obstruct exact posterior matching.
- The deterministic substitution of mean activations is an additional approximation, not exact evaluation
  of every nonlinear expectation in the stochastic model. The exact free-energy identity does not validate
  all approximation formulas or practical training updates.
- Wake-sleep is a training option, and its sleep recognition step is not generally the data-ELBO gradient.
  A shared variational motivation does not establish a single objective decreased by all model variants.
- The inspected author manuscript’s Equation (16) prints negative free energy as a positive sum of Bernoulli
  KL terms, conflicting with the preceding sign convention. The curated identity uses the explicit Section
  2 decomposition; Appendix B derivative implementation was not audited and that printed approximate formula
  is not adopted.
- The record describes a reusable architecture family, not a trained density estimator or a verified biological
  explanation. No exact posterior, universal compression gain or empirical ranking is asserted.
