claims:
- claim_id: method
  kind: mechanism
  statement: 'A top-down directed model p_theta(x,h) assigns probabilities to observed inputs and hidden
    configurations; a separately parameterized bottom-up model q_phi(h|x) produces a tractable approximate
    posterior. In the original layered binary construction, unit states in a layer are conditionally independent
    given the adjacent driving layer, with independent top-layer generative priors. Recognition proceeds
    through an acyclic bottom-up pass. The variational free energy is E_q[log q(h|x)-log p(x,h)], and
    log p(x) equals its negative plus KL(q(h|x)||p(h|x)); the negative free energy is therefore a lower
    bound under the normalized-model and support conditions. The paper describes stochastic recognition
    samples and, separately, a deterministic approximation that substitutes recognition means for sampled
    binary activities and neglects associated correlations. Its stochastic training alternative uses wake-sleep.
    The generative conditional need not be sigmoid: Appendix A considers noisy-or and other imaging rules.
    These choices do not change the defining presence of distinct generative and recognition models.'
