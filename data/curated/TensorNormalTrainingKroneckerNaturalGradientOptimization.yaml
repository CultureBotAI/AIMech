claims:
- claim_id: tnt-tensor-normal-kl-minimization-theorem1-mechanism
  kind: mechanism
  statement: Theorem 1 proves that for a zero-mean k-way gradient tensor G in R^{d_1 x ... x d_k}, the Kullback-Leibler divergence D_KL(p(G) || TN(0, U_1, ..., U_k)) between the true gradient distribution and a Tensor Normal distribution with Kronecker covariance Sigma = U_k (x) ... (x) U_1 is minimized if and only if U_j = (1 / prod_{l != j} d_l) E[G_{(j)} (bigotimes_{l != j} U_l^{-1}) G_{(j)}^T] for all j = 1, ..., k, which TNT simplifies by setting U_l = I_{d_l} inside the expectation to obtain the decoupled mode-j matricization estimator U_j = (1 / prod_{l != j} d_l) E[G_{(j)} G_{(j)}^T].
  evidence:
  - source_id: r642-primary-pdf
    locator: Section 2.2 Theorem 1, Equation (7), and Appendix A, pages 3-4, 15
    relation: supports
- claim_id: tnt-sampled-fisher-and-inverse-mode-contraction-mechanism
  kind: mechanism
  statement: To approximate the true Fisher information matrix (equivalent to the generalized Gauss-Newton matrix) rather than the empirical Fisher, TNT samples auxiliary outputs y ~ p(y | x, theta) from the model's predictive distribution, computes the per-layer auxiliary gradient G, updates exponential moving averages of U_j = (1 / prod_{l != j} d_l) G_{(j)} G_{(j)}^T every T_1 steps, inverts (U_j + epsilon I)^{-1} every T_2 steps, and preconditions the momentum tensor M via mode-1 through mode-k tensor-matrix products.
  evidence:
  - source_id: r642-primary-pdf
    locator: Section 2.2-2.3 and Section 3 Algorithm 1, pages 4-6
    relation: supports
- claim_id: tnt-architecture-agnostic-tensor-parameter-scope
  kind: scope
  statement: Because TNT constructs its Kronecker factors solely from the mode unfoldings G_{(j)} of each parameter gradient tensor (requiring only O(sum_{j=1}^k d_j^2) memory and O(sum_{j=1}^k d_j^3) inversion cost per tensor), it applies uniformly to convolutional filters (3D tensors after merging spatial dimensions), bias vectors (reshaped as 2D matrices), batch normalization weights, and attention layers without layer-type-specific activation hooks.
  evidence:
  - source_id: r642-primary-pdf
    locator: Section 1, Section 2.3, and Section 3 Implementation Details, pages 2, 4-6
    relation: supports
- claim_id: tnt-autoencoder-and-cnn-generalization-application
  kind: application
  statement: On deep autoencoder optimization benchmarks (MNIST, FACES, CURVES) and image classification tasks (VGG16 and ResNet-32/34/50 on CIFAR-10, CIFAR-100, SVHN, and ImageNet), TNT achieves faster per-epoch and wall-clock convergence than SGD, Adam, Shampoo, and K-FAC while reaching comparable or higher validation accuracy.
  evidence:
  - source_id: r642-primary-pdf
    locator: Section 4.1-4.2 Figures 1-4 and Table 1, pages 7-9
    relation: supports
- claim_id: tnt-per-sample-gradient-and-extra-backward-pass-limitation
  kind: limitation
  statement: Exact evaluation of the Tensor Normal statistics requires per-datapoint gradients G_{(j)} from an additional backward pass on model-sampled labels (or rank-1 mini-batch approximations hat{G} hat{G}^T across sub-batches), adding extra backpropagation overhead at steps where curvature statistics are updated.
  evidence:
  - source_id: r642-primary-pdf
    locator: Section 3 Algorithm 1 and Computational Cost discussion, pages 5-7
    relation: supports
