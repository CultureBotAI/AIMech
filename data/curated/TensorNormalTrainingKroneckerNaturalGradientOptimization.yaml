id: AIMech:TensorNormalTrainingKroneckerNaturalGradientOptimization
name: Tensor Normal Training (TNT Kronecker-Factored Natural Gradient Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A structure-aware second-order natural gradient optimization algorithm for deep neural networks that approximates each layer's block-diagonal Fisher information matrix by fitting a zero-mean Tensor Normal distribution TN(0, U_1, ..., U_k) to the model-sampled gradient tensor G via Kullback-Leibler divergence minimization, estimating each mode-j Kronecker covariance factor as U_j = (1 / prod_{l != j} d_l) E[G_{(j)} G_{(j)}^T] from the mode-j matricization G_{(j)} and preconditioning momentum updates by the Kronecker product of damped inverse covariance factors.
identity_notes: Distinct from Shampoo (AIMech:ShampooPreconditionedStochasticTensorOptimization), which accumulates unnormalized empirical-gradient outer products E[G_{(j)} G_{(j)}^T] on dataset labels without dividing by prod_{l != j} d_l and preconditions via fractional matrix powers L_j^{-1/(2k)} (an upper bound approximating the square root of the empirical Fisher rather than the true Fisher). Distinct from K-FAC (AIMech:KfacKroneckerFactoredApproximateCurvature), which factors layer curvature into forward activation covariance A A^T and backpropagated pre-activation gradient covariance E_F E_F^T and requires architecture-specific derivations and approximations for convolutional and attention layers, whereas TNT operates directly on the parameter gradient tensor G of any layer shape.
aliases:
- Tensor Normal Training
- TNT Optimizer
- Tensor Normal Natural Gradient Method
- Simulation-Based Tensor-Normal Fisher Preconditioning
