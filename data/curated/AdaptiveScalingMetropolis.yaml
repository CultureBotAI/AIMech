claims:
- claim_id: method
  kind: mechanism
  statement: Fix shape Sigma positive definite and use a spherical proposal W. From retained x with pi(x)>0
    and log scale S, propose Y=x+exp(S)Sigma^(1/2)W. Compute alpha=min(1,pi(Y)/pi(x)), accept Y with that
    probability or retain x, then update S_new=S+eta_n(alpha−alpha_star). Adapt after either outcome,
    using the acceptance probability rather than its Bernoulli realization. Choose alpha_star in (0,1)
    and positive step sizes with divergent sum and convergent sum of squares for the stated stochastic-approximation
    setting. The shape remains fixed; exp(S) multiplies standard deviation, so the covariance multiplier
    is exp(2S).
