name: Adaptive scaling Metropolis
definition: A random-walk Metropolis algorithm that adapts its proposal scale through stochastic approximation
  driven by the proposal acceptance probability relative to a chosen target rate.
concept_kind: algorithm
identity_notes: The source’s ASM has fixed positive-definite shape and an adaptive scalar scale. This
  is distinct from covariance-shape adaptation and from RAM’s direction-dependent matrix update. The record
  uses the exponential-scale specialization of the source’s more general increasing scale map. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 181 prior native IDs/names/aliases.
  Ignored-inclusive searches of both full checkouts found prior discovery leads, neighboring sampler discussions
  and unrelated author-name/environment substrings. Existing random-walk Metropolis, delayed-rejection,
  fixed symmetric delayed-rejection and RAM records were inspected; shared components do not make these
  procedures equivalent.
limitations:
- The stability and strong-law theorems in this version restrict alpha_star to (0,1/2), beyond the broader
  algorithm definition. Larger targets are discussed as expected extensions, not proved here.
- Compact-support regularity or the stated unbounded-target tail/contour assumptions and admissible proposal
  conditions are needed for the corresponding results. Positive step sizes alone are insufficient.
- The strong-law statements concern sample averages. The source explicitly distinguishes them from convergence
  in distribution of the adaptive sampled states.
- A target rate such as 0.234 is not a universal optimum, evidence of convergence or guarantee of good
  multimodal exploration.
- The inspected arXiv v3 submission date and later PDF footer differ; no later journal PDF inspection
  or numerical validation is claimed.
