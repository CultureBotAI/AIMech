claims:
- claim_id: ssf-reparameterization-zero-inference-overhead
  kind: mechanism
  statement: During fine-tuning, SSF inserts SSF-ADA modules after K backbone operations to compute y = gamma (*) x + beta with input-independent scale gamma in R^d and shift beta in R^d (initialized with normal distributions centered at 1 and 0, respectively); during inference, when preceded by a linear or convolutional operation x = w * t + b, SSF re-parameterizes the weights as w' = gamma (*) w and b' = gamma (*) b + beta (Equation 5), incurring m*L*d trainable parameters during training and exactly zero extra parameters and zero extra FLOPs at inference time (Table 2).
  evidence:
  - source_id: r692-primary-pdf
    locator: Section 3.2-3.3, Equations 4-5, Table 2, pp. 5-6; Section 4.3, Table 6c-6d, p. 9
    relation: supports
- claim_id: ssf-fgvc-vtab-and-ood-generalization
  kind: application
  statement: On ViT-B/16 pre-trained on ImageNet-21K, SSF achieves 90.72% mean Top-1 accuracy across five FGVC datasets (0.39M trainable parameters vs. 85.98M for full fine-tuning at 88.54% and 0.85M for VPT-Deep at 89.11%) and 73.10% mean Top-1 accuracy across the 19-task VTAB-1k benchmark (0.24M trainable parameters vs. 65.57% for full fine-tuning and 69.43% for VPT-Deep), while improving out-of-distribution robustness on ImageNet-A (45.88% vs. 34.49%), ImageNet-R (56.77% vs. 51.29%), and ImageNet-C (41.47 mCE vs. 46.47 mCE).
  evidence:
  - source_id: r692-primary-pdf
    locator: Section 4.2, Tables 3-5, pp. 7-8; Section 4.4, Table 7, p. 9
    relation: supports
- claim_id: ssf-dense-prediction-and-independent-task-limitation
  kind: limitation
  statement: On dense prediction tasks such as COCO object detection and instance segmentation with Mask R-CNN (34.9 AP^b / 33.5 AP^m vs. 43.7 AP^b / 39.8 AP^m for full fine-tuning) and ADE20K semantic segmentation with UPerNet (38.9 mIoU vs. 44.5 mIoU for full fine-tuning), modulating only linear scale and shift features leaves a substantial accuracy gap relative to full backbone fine-tuning, and SSF treats each downstream task independently without modeling cross-task correlations.
  evidence:
  - source_id: r692-primary-pdf
    locator: Appendix A.3 & B, Table 9, p. 18; Appendix D, p. 20
    relation: supports
