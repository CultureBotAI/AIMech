id: AIMech:SSFScaleAndShiftFeatures
name: Scaling & Shifting Your Features
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning algorithm (SSF) for pre-trained deep neural networks (including Vision Transformers, hierarchical Transformers, convolutional networks, and MLPs) that freezes all pre-trained backbone weights and inserts lightweight linear feature modulation modules (SSF-ADA) after backbone operations (such as multi-head self-attention, MLP, convolution, and normalization layers) to alleviate upstream-to-downstream distribution mismatch. Given an intermediate feature tensor x in R^{(N^2+1) x d}, each SSF-ADA module applies an input-independent, channel-wise Hadamard scale vector gamma in R^d (initialized from a normal distribution with mean 1) and additive shift vector beta in R^d (initialized with mean 0) via y = gamma (*) x + beta. Because SSF-ADA is a purely linear affine transformation, at inference time gamma and beta are algebraically absorbed into the frozen preceding linear or convolutional weights w and biases b via structural re-parameterization y = (gamma (*) w) * t + (gamma (*) b + beta), yielding zero extra inference parameters and zero extra inference FLOPs.
identity_notes: 'Distinct from Batch Normalization (AIO:BatchNormalizationLayer), Layer Normalization, FiLM, and AdaIN: SSF-ADA modulates outputs of general backbone operations (MSA, MLP, and normalization layers) rather than only normalization layers, and uses task-level input-independent parameters (gamma, beta) so they can be folded into preceding linear weights at inference time without conditional generator networks or nonlinear activations. Distinct from BitFit (AIMech:BitFit), which only tunes existing bias terms without multiplicative channel scaling or post-operation residual shifts, and from Adapter / VPT methods that retain unmergeable modules or extra tokens at inference time.'
aliases:
- SSF
- SSF-ADA
- Scaling and Shifting Your Features
- Scale and Shift Features Fine-Tuning
