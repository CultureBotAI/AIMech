claims:
- claim_id: r719-claim-two-pole-regression-and-mlm
  kind: mechanism
  statement: LM-BFF casts classification as masked token prediction p(y|x_in) = exp(w_{M(y)} . h_{[MASK]}) / sum_{y'} exp(w_{M(y')} . h_{[MASK]}) without adding new classification head parameters, and casts bounded-interval regression over [v_l, v_u] as a two-pole mixture interpolation y = v_l p(y_l|x_in) + v_u p(y_u|x_in) trained by minimizing the KL divergence between inferred p(y_u|x_in) and observed mixture weight (y - v_l)/(v_u - v_l).
  evidence:
  - source_id: r719-primary-pdf
    locator: Section 4.1-4.2, Equations 1-2, pp. 4-5
    relation: supports
- claim_id: r719-claim-t5-template-and-label-search
  kind: mechanism
  statement: To automate prompt design from only K=16 examples per class, LM-BFF prunes candidate label words per class via zero-shot conditional likelihood Top-k_{v in V} sum_{x_in in D_train^c} log P_L([MASK]=v|T(x_in)) followed by fine-tuning re-ranking on D_dev, and decodes diverse natural templates via wide-beam search over a pretrained T5 span-infilling model maximizing sum_{j=1}^{|T|} sum_{(x_in,y) in D_train} log P_T5(t_j | t_{1..j-1}, T_g(x_in,y)).
  evidence:
  - source_id: r719-primary-pdf
    locator: Section 5.1-5.2, Equations 3-4, Figure 2, pp. 5-6
    relation: supports
- claim_id: r719-claim-selective-demonstration-sampling
  kind: application
  statement: By concatenating one filled template demonstration T_tilde(x_in^(c), y^(c)) per class sampled from the top r=50% most cosine-similar training examples cos(e(x_in), e(x)) in SBERT embedding space, LM-BFF with RoBERTa-large (K=16 per class) outperforms standard few-shot fine-tuning by 11% on average and up to 30% absolute on SNLI (reaching 79.7% vs. 48.4%) across 15 classification and regression benchmarks.
  evidence:
  - source_id: r719-primary-pdf
    locator: Section 6.1-6.2 & Section 7.1-7.3, Tables 3 and 7, pp. 6-9
    relation: supports
- claim_id: r719-claim-context-length-and-cola-limitation
  kind: limitation
  statement: Because LM-BFF concatenates one demonstration per class into the input context, it is constrained by the model's maximum sequence length (e.g., 512 tokens in RoBERTa) when input sequences are long or the number of classes |Y| is large, and prompt-based fine-tuning underperforms standard fine-tuning on linguistic acceptability (CoLA, 21.8 vs. 33.9 Matthews correlation) where ungrammatical inputs lie out of the masked language model's pretraining distribution.
  evidence:
  - source_id: r719-primary-pdf
    locator: Section 7.1 & Section 8, Table 3, pp. 7-9
    relation: supports
