id: AIMech:LMBFFBetterFewShotFineTuning
name: LM-BFF Better Few-Shot Fine-Tuning of Language Models
concept_kind: algorithm
review_status: DRAFT
definition: A few-shot fine-tuning framework for moderately sized pretrained masked language models that reformulates classification and bounded-interval regression (via two-pole mixture interpolation y = v_l p(y_l|x_in) + v_u p(y_u|x_in)) as cloze auto-completion p(y|x_in) = p([MASK]=M(y)|T(x_in)), automates prompt construction by pruning and re-ranking conditional label-word assignments M(Y) alongside beam-search span-infilling template generation with a pretrained T5 text-to-text model maximizing sum_{(x_in,y) in D_train} log P_T5(T|T_g(x_in,y)), and dynamically concatenates one demonstration example per class sampled from the top-r% most semantically similar training instances cos(e(x_in), e(x)) under a sentence encoder.
identity_notes: "Distinct from Pattern-Exploiting Training (PET, Schick & Sch\xFCtze, EACL 2021, AIMech:PatternExploitingTraining), which uses manually crafted patterns and unlabeled data distillation, from AutoPrompt (Shin et al., EMNLP 2020, AIMech:AutoPromptGradientGuidedDiscretePromptSearch), which performs gradient-guided discrete trigger token search on frozen MLMs requiring large training sets, and from frozen GPT-3 In-Context Learning (AIMech:InContextLearning), which concatenates up to 32 random examples without parameter updates or class-balanced similarity filtering."
aliases:
- LM-BFF
- Better Few-Shot Fine-Tuning of Language Models
- Language Models Best Friends Forever Few-Shot Fine-Tuning
- LM-BFF Automated Prompt and Demonstration Fine-Tuning
