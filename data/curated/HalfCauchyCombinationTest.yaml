aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: The Half-Cauchy combination test aggregates multiple hypothesis test p-values across dependent
    studies, features, or submodels to control global Type I error and prevent false-positive inflation
    from multiple testing (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the use-and-interpretation
    bias rather than the statistical combination method.
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: In Bayesian directed acyclic graphical evidence synthesis (Yang, Nott, & Presanis, 2026),
    heavy-tailed Cauchy and Half-Cauchy p-value combination rules aggregate dependent node-level conflict
    p-values into a global model-checking statistic without requiring an explicit joint correlation matrix.
limitations:
- Because the individual Half-Cauchy terms X_j = tan((1 - p_j) * pi / 2) are strictly positive with infinite
  mean, the finite-sample null distribution of T_HC(p) shifts upward at rate (2 / pi) * log m as the number
  of combined tests m grows; applying the unadjusted single HC(0, 1) tail 1 - (2 / pi) * arctan(t) at
  moderate thresholds t without the finite-m convolution or Landau location shift A_m inflates Type I
  error when m is large.
- Asymptotic tail equivalence under arbitrary dependence holds in the extreme right tail (t -> infinity,
  or significance level alpha -> 0); at conventional significance levels (such as alpha = 0.05) and large
  dimension m, strong positive dependence or heavy-tailed copulas outside pairwise asymptotic independence
  can cause finite-threshold size distortion.
- When inverting T_HC(p(theta)) <= c_{m, 1 - alpha} to form a confidence set for a shared parameter theta,
  severe inter-study conflict where T_HC(p(hat_theta_HC)) > c_{m, 1 - alpha} yields an empty confidence
  set, signaling violation of the common-parameter assumption rather than providing a pooled interval
  estimate.
- All 2,200 lines of Liu, Meng, & Pillai (2025, arXiv:2501.01065v1) and all 52 pages of Yang, Nott, &
  Presanis (2026, arXiv:2511.02977v2) were read. Note that the first author name in arXiv:2501.01065v1
  is Kairong Liu; both are noted in provenance. No author R package or empirical GWAS/meta-analysis pipeline
  was executed; constructed numerical checks in research/discovery/half-cauchy-combination-test-boundaries.py
  verify large-p insensitivity, exact m = 2 convolution, Example 1 confidence-set convexity, and Landau
  location shifts only.
