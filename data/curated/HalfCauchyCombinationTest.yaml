claims:
- claim_id: half-cauchy-tangent-map-and-large-p-insensitivity
  kind: mechanism
  statement: For individual p-values p_j in (0, 1] and non-negative weights w_j summing to 1, HCCT defines
    T_HC(p) = sum_{j=1}^m w_j tan((1 - p_j) * pi / 2), where each X_j = tan((1 - p_j) * pi / 2) follows
    a standard Half-Cauchy distribution HC(0, 1) on [0, infinity) under Uniform(0, 1); because tan((1
    - p_j) * pi / 2) -> 0 as p_j -> 1, p-values near 1 contribute negligible non-negative mass and cannot
    cancel strong evidence from small p-values, unlike the two-sided Cauchy transformation tan((0.5 -
    p_j) * pi) -> -infinity.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 1.1, Equations 1.2–1.4, lines 109–166; Section 1.2, lines 167–205
    relation: supports
- claim_id: exact-convolution-and-landau-domain-of-attraction-null
  kind: mechanism
  statement: Under independent Uniform(0, 1) p-values, T_HC(p) has an exact finite-sample null distribution
    given by the m-fold weighted Half-Cauchy convolution (with closed-form density f_{m=2}(t) = (4 / (pi^2
    * (t^2 + 4))) * [pi/2 + (t/2) log(t^2 / 4) + ((t^2 - 4)/(4t)) * arctan(t/2)] for m = 2 equal weights
    in Theorem 2.3), and as m -> infinity with max_j w_j -> 0, (pi / 2) * (T_HC(p) - A_m) converges in
    distribution to the standard Landau law Stable(1, 1, 1, 0), where A_m = (2 / pi) * (1 - gamma - sum_{j=1}^m
    w_j log w_j) and gamma is the Euler-Mascheroni constant.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 2, Theorem 2.1, Theorem 2.3, and Equations 2.1–2.10, lines 302–385; Appendix B.1–B.2,
      lines 1681–1785
    relation: supports
- claim_id: convex-confidence-regions-and-inconsistency-lower-bound
  kind: mechanism
  statement: When combining two-sided normal test p-values p_j(theta) = 2 * Phi(-||A_j(hat_theta_j - theta)||_2)
    for a shared parameter vector theta in R^d, each composite function tan((1 - p_j(theta)) * pi / 2)
    is strictly convex on R^d, so inverting T_HC(p(theta)) <= c_{m, 1 - alpha} yields a bounded, connected,
    convex confidence set I_{1 - alpha}^HC and a unique minimizer hat_theta_HC = arg min_theta T_HC(p(theta))
    whose minimum value satisfies T_HC(p(hat_theta_HC)) >= (4 / (m * pi)) * sum_{1 <= k < j <= m} ||Sigma_{kj}^(-1/2)(hat_theta_k
    - hat_theta_j)||_2 for equal weights, providing an intrinsic inter-study inconsistency check that
    rejects all theta (producing an empty confidence set) when between-study conflict is severe.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 1.2, Example 1 and Figure 2, lines 206–299; Section 3, Theorems 3.1–3.2 and Equation
      3.7, lines 387–485; Appendix C, lines 1786–1985
    relation: supports
- claim_id: asymptotic-validity-under-dependent-test-statistics
  kind: application
  statement: For fixed m as threshold t -> infinity, P(T_HC(p) > t) / P(HC(0, 1) > t) -> 1 whenever the
    transformed variables X_j are pairwise quasi-asymptotically independent or when underlying test statistics
    follow a multivariate normal distribution with any non-unit pairwise correlations, enabling valid
    global combination of dependent conflict or association p-values across high-dimensional studies and
    Bayesian evidence-synthesis submodels.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 4, Theorems 4.1–4.5, lines 486–575; Appendix D, lines 1986–2147
    relation: supports
  - source_id: yang2026
    locator: Section 4.1, PDF p. 25
    relation: supports
