id: AIMech:HalfCauchyCombinationTest
name: Half-Cauchy combination test
aliases:
- HCCT
- Heavily right Half-Cauchy p-value combination test
concept_kind: mathematical_method
definition: A statistical p-value combination method that transforms m individual hypothesis test p-values
  p_1, ..., p_m in (0, 1] into non-negative standard Half-Cauchy random variables X_j = tan((1 - p_j)
  * pi / 2), forms the non-negatively weighted sum T_HC(p) = sum_{j=1}^m w_j tan((1 - p_j) * pi / 2) with
  sum_{j=1}^m w_j = 1, and evaluates global significance using the exact finite-sample Half-Cauchy convolution
  null distribution (or its location-shifted Landau domain-of-attraction approximation as m -> infinity),
  thereby remaining insensitive to large p-values near 1, guaranteeing strictly convex confidence regions
  under linear-Gaussian test inversion, and preserving asymptotic valid tail control under pairwise asymptotically
  independent or bivariate normal test statistics.
identity_notes: No normalized identity match for the Half-Cauchy combination test across all 442 pinned
  AIO records and 565 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches across
  data, sources, research, history, and reviews returned only frontier-tracking references in prior discovery
  reports noting Liu, Meng, & Pillai (2025) as a pending concept. Distinct from the standard Cauchy Combination
  Test (CCT) of Liu & Xie (2020), which maps p_j to full-support Cauchy variables tan((0.5 - p_j) * pi)
  that diverge to -infinity as p_j -> 1, allowing a single large p-value to cancel a small p-value and
  producing disconnected confidence sets when inverted. Distinct from the Harmonic Mean P-Value (HMP)
  and Exact Harmonic Mean P-Value (EHMP), which transform p_j via reciprocal Pareto variables 1/p_j rather
  than the Half-Cauchy tangent map tan((1 - p_j) * pi / 2).
