name: Conjugate-gradient Monte Carlo
definition: A population Markov sampler that obtains a local-optimization anchor from one population member
  and updates another member along the anchor line with a multiple-try transition targeting a radial-Jacobian-adjusted
  density.
concept_kind: algorithm
identity_notes: This is Liu–Liang–Wong Section 4.2 CGMC, not the conjugate-gradient linear solver or direct
  optimization as a substitute for sampling. Its anchor comes from a different stream. The product target
  is an invariant population law, not a statement that transient streams are independent. No normalized
  match was found across all 442 pinned AIO labels/scoped synonyms and 175 prior native IDs/names/aliases.
  Full-checkout searches included ignored and hidden files in both worktrees; the only text hit was an
  unrelated installed-package checksum substring. Existing general Metropolis-Hastings, Metropolis-within-Gibbs
  and random-walk records were inspected to resolve these specialization boundaries.
limitations:
- The factor |r|^(d−1) is essential for an anchor line selected through the current point. Replacing the
  line target with pi(A+r e) alone is not this construction.
- The optimization anchor must be independent of the moved member under the product stationary law. Optimizing
  that same member and copying this acceptance scheme is not justified.
- The zero-length line A=x_c requires a defined degenerate-case policy; the displayed normalized direction
  is not evaluated at zero. Differentiability and the chosen deterministic optimization procedure have
  their own requirements.
- The compatible scalar-proposal statement is an explicit implementation constraint inferred from reversing
  the unoriented line, not a new algorithm attributed to the source.
- Invariance does not guarantee population exploration, convergence, independent transient streams or
  universally reliable convergence diagnostics. Optimization and multiple trials add cost.
