claims:
- claim_id: method
  kind: mechanism
  statement: Maintain m≥2 population members targeting a product of pi. Choose a reference member x_r
    uniformly at random, and deterministically optimize along a gradient or conjugate-gradient direction
    of log pi to obtain anchor A=g(x_r). Choose x_c uniformly among the other members. For A≠x_c, define
    e=(A−x_c)/||A−x_c|| and the scalar line target f(r) proportional to |r|^(d−1)pi(A+r e), r on the whole
    real line. Apply a valid MTM transition along this line, starting at the scalar coordinate of x_c,
    and replace x_c by A+r_new e while retaining the other members. A scalar proposal and weight construction
    must respect the same unoriented line when traversed in reverse; a centered Gaussian scalar random-walk
    proposal of fixed variance with MTM-II target-density selection weights is a concrete compatible choice.
    The source’s product-invariance argument uses the anchor’s independence from the moved member under
    the product target.
