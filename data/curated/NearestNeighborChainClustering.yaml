aio_mappings:
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: The procedure builds an agglomerative hierarchy. The pinned target denotes a clustering task;
    this algorithm is related without asserting task/algorithm equivalence or subclass membership.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The selected setting groups unlabeled objects using dissimilarities. The AIO task does not
    specify reciprocal chains, admissible update laws or stepwise output.
limitations:
- Scope is finite symmetric nonnegative dissimilarities and appropriate linkage updates. General dissimilarity
  matrices need not be metric, while Ward’s Euclidean ESS interpretation requires its geometry and distance-scale
  conventions. No automatic cluster-count selection or class-label prediction is implied.
- Theorem 1 supplies sufficient update-law conditions; this record does not claim they are necessary or
  certify every proof. A five-point sum-of-three-distances update satisfies reducibility but fails the
  disjoint-merge condition and yields a different invalid stepwise result.
- Figure 4 prints length(chain) ≤3, consistent with the pinned implementation; its three-entry restart
  does not access chain[-4]. An earlier curator reading incorrectly substituted <3 and is explicitly rejected
  in the discovery correction. Separate Figure 5 root/union notation and Figure 2 Ward/centroid/median
  scaling still require care. No claim is made that the printed pseudocode was executed unchanged.
- The original French batch and chain sources have different output and tie conventions. De Rham’s displayed
  equality of nearest-distance minima is not itself a sufficient definition of reciprocity, and its all-pairs
  batch instruction needs tie handling. These are retained as source boundaries, not adopted as chain
  instructions.
- All 29 pages of Müllner 2011 v1, 11 of Benzécri 1982, 8 of Juan 1982 and 11 of de Rham 1980 were visually
  read. Only named ranges of the pinned C++ files and the complete README, NEWS and license were statically
  inspected. No author program, package or historical benchmark was executed.
- Finite curator calculations check 11,664 four-object matrix/start/linkage cases and 324 one-dimensional
  Ward/start cases, predecessor tie handling, discovery-order sorting, the published reducibility counterexample
  and the actual ≤3 restart guard and safe longer-chain indexing. They are not a universal proof, floating-point
  audit or benchmark replication.
