id: AIMech:NearestNeighborChainClustering
name: Nearest-neighbor-chain clustering
aliases:
- Nearest neighbor chain algorithm
- NN-chain clustering
concept_kind: algorithm
definition: An agglomerative clustering algorithm that follows a chain of nearest clusters until its last
  pair are reciprocal nearest neighbors, merges that pair, and reuses the remaining chain; for suitable
  distance updates, sorting and relabeling the recorded merges produces a valid stepwise hierarchy.
identity_notes: Compared all 442 pinned AIO and 651 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 21, 0, 0 lines. All distinct match contents were
  read, including generated index rows repeating the fully read Ward record. Recovery hits concern Ward
  implementation context, its saved review or pending discovery/source notes; none identifies an existing
  standalone chain record. Both other checkouts returned no matches including ignored and hidden files.
  Semantic matching covered 26 AIO and 168 native definitions, all read; unchanged definitions were byte-compared
  with the preceding full assessment. 9 full annotated AIO node/edge/generated contexts and 4 full native
  records were inspected. The chain is an agglomerative merge-search procedure parameterized by linkage.
  It differs from the Ward ESS criterion, centroid reassignment in k-means, CURE representatives, BIRCH
  compression, nearest-neighbor label voting and batch reciprocal-neighbor passes. Retain the conditional
  stepwise-output identity rather than treating all nearest-neighbor algorithms or all fastcluster entrypoints
  as aliases.
