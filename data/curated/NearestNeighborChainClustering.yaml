claims:
- claim_id: reciprocal-chain
  kind: mechanism
  statement: Begin with a current cluster and repeatedly find a nearest distinct cluster. Prefer the preceding
    chain member when it is tied for nearest, so a reciprocal pair terminates the chain. Merge that pair,
    update distances and cluster sizes, and continue from the retained prefix or restart when it is exhausted.
    The chain avoids restarting a full global pair search after every merge.
  evidence:
  - source_id: benzecri1982
    locator: Sections2.2–2.5 and3, printed pp.211–218 / PDF pp.4–11
    relation: supports
  - source_id: juan1982
    locator: Sections1–2, printed pp.219–220 / PDF pp.2–3; CADENA listing, printed pp.223–224 / PDF pp.6–7
    relation: supports
  - source_id: mullner2011
    locator: Section3.2 and Figure 4, PDF pp.11–16
    relation: supports
- claim_id: update-law-conditions
  kind: scope
  statement: The cited sufficient conditions require reducibility and invariance of the distance between
    two disjoint merged pairs to their merge order. Reducibility means d(A,B)≤min(d(A,C),d(B,C)) implies
    min(d(A,C),d(B,C))≤d(A∪B,C). Reducibility alone is insufficient for arbitrary history-dependent updates.
    The paper establishes the conditions for single, complete, average, weighted and Ward linkage; centroid
    and median updates are outside this guarantee.
  evidence:
  - source_id: mullner2011
    locator: Section3.2, Equation1, Theorem 1, Proposition2 and footnote1, PDF pp.12–16
    relation: supports
- claim_id: stepwise-output-and-ties
  kind: mechanism
  statement: A reciprocal pair need not be the globally closest current pair, so discovery-order merge
    heights can be unsorted. To obtain the stated stepwise dendrogram, stably sort the recorded merges
    by height and relabel their cluster representatives while preserving the dependency order of tied
    merges. Under the stated conditions, this yields a valid greedy stepwise hierarchy; it need not reproduce
    one particular arbitrary global tie convention or a unique tree.
  evidence:
  - source_id: mullner2011
    locator: Section2.2 and Section3.2, Figures4–5, PDF pp.4–5,11–16
    relation: supports
  - source_id: fastcluster-wrapper
    locator: generate_SciPy_dendrogram, src/fastcluster_python.cpp lines108–145 at the pinned commit
    relation: supports
  - source_id: fastcluster-core
    locator: node comparator, lines225–232; union_find, lines366–403 at the pinned commit
    relation: supports
- claim_id: matrix-complexity
  kind: scope
  statement: In the stored-dissimilarity setting with constant-time scalar distance updates, the chain
    algorithm takes quadratic time in the number of observations and linear auxiliary space beyond the
    writable quadratic-size distance matrix. This is not a linear-total-memory claim or a guarantee for
    arbitrary high-dimensional distance evaluation; vector implementations require a separate analysis.
  evidence:
  - source_id: mullner2011
    locator: Section4.1, PDF p.20
    relation: supports
  - source_id: benzecri1982
    locator: Section2.5, printed p.214 / PDF p.7
    relation: supports
- claim_id: procedure-versus-linkage
  kind: scope
  statement: The chain specifies how merge candidates are found; the chosen linkage defines cluster dissimilarity.
    It can implement the Ward ESS criterion but is not identical to Ward clustering, a nearest-neighbor
    classifier, or the earlier procedure that repeatedly finds and merges batches of reciprocal pairs.
    The cited correctness result establishes valid stepwise output; it does not assert globally optimal
    fixed-count partitions.
  evidence:
  - source_id: mullner2011
    locator: Sections2 and3.2, PDF pp.3–8,11–16
    relation: supports
  - source_id: benzecri1982
    locator: Section1, printed pp.209–210 / PDF pp.2–3
    relation: supports
  - source_id: derham1980
    locator: Introduction and Sections3.2 and4.2, printed pp.135–136,140–142 / PDF pp.2–3,7–9
    relation: supports
- claim_id: implementation-boundaries
  kind: limitation
  statement: Both Figure 4 of the 2011 paper and the later pinned fastcluster matrix implementation restart
    at a chain length or tip count of at most three. The pinned code retains premerge cluster sizes, uses
    explicit root handling and stable output sorting, and its Ward matrix wrapper squares inputs and square-roots
    output heights. These inspected details clarify the implemented conventions without certifying every
    printed listing or floating-point variant. The same repository uses a generic algorithm for vector
    Ward input and documents removal of its earlier vector chain implementation.
  evidence:
  - source_id: mullner2011
    locator: 'Figure4, NN-CHAIN-CORE line6, PDFp13: length(chain) ≤3'
    relation: supports
  - source_id: fastcluster-core
    locator: NN_chain_core lines574–778; f_ward lines530–545; union_find lines366–403
    relation: supports
  - source_id: fastcluster-wrapper
    locator: Matrix dispatch/preprocessing/postprocessing lines290–353; vector dispatch lines1164–1193;
      dendrogram output lines108–145
    relation: supports
  - source_id: fastcluster-news
    locator: Version1.1.2 entry dated 11 October 2011
    relation: supports
