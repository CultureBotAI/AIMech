claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any full-column-rank matrix A in C^{m x n} and any vector z in C^n, the unit direction vectors z_j = a_j / ||a_j||_2 weighted by p_j = ||a_j||_2^2 / ||A||_F^2 satisfy sum_{j=1}^m p_j |<z, z_j>|^2 = ||A z||_2^2 / ||A||_F^2 >= kappa(A)^{-2} ||z||_2^2 (Equation 9), which by the Pythagorean identity ||x_k - x||_2^2 = ||x_{k-1} - x||_2^2 - |<x_{k-1} - x, z_{r(k)}>|^2 implies the exact one-step conditional expectation contraction E_{r(k)} ||x_k - x||_2^2 <= (1 - kappa(A)^{-2}) ||x_{k-1} - x||_2^2 and E ||x_k - x||_2^2 <= (1 - kappa(A)^{-2})^k ||x_0 - x||_2^2 (Theorem 2).
  evidence:
  - source_id: r323-primary-pdf
    locator: Section 2, Theorem 2 and Proof (Equations 8-10), pp. 4-6
    relation: supports
  - source_id: r323-metadata-cr
    locator: Bibliographic metadata for Journal of Fourier Analysis and Applications 15(2):262-278
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: The convergence rate 1 - kappa(A)^{-2} of Theorem 2 is attained with exact equality E ||x_k - x||_2^2 = (1 - kappa(A)^{-2})^k ||x_0 - x||_2^2 whenever A^T A = (||A||_F^2 / n) I_n is a tight frame (so kappa(A)^2 = n, Section 3.2), and Theorem 3 establishes a general high-probability lower bound ||x_k - x||_2^2 >= (1 - (2 k / sigma) kappa(A)^{-2}) ||x_0 - x||_2^2 holding with probability at least 1 - sigma; moreover, because kappa(A)^2 <= n R^2 for subgaussian or Gaussian measurement matrices with m >= C n, Randomized Kaczmarz solves least-squares systems in O(n^2) operations, faster than O(m n^2) QR/SVD solvers and O(m n) per-step Conjugate Gradient when m > n (Section 2.1 and Section 4.1).
  evidence:
  - source_id: r323-primary-pdf
    locator: Section 2.1, pp. 4-5; Section 3.2, Theorem 3, pp. 7-8; Section 4.1, Proposition 4, pp. 8-9
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Whereas sampling rows with probability proportional to ||a_j||_2^2 makes the algorithm invariant to multiplying a single row by a small scalar epsilon -> 0, sampling rows uniformly at random can be slowed down arbitrarily by near-zero rows (Section 2.2); furthermore, the unmodified Kaczmarz iteration assumes a consistent linear system A x = b and oscillates within a noise ball around the least-squares solution if b is corrupted by inconsistent additive noise.
  evidence:
  - source_id: r323-primary-pdf
    locator: Section 1, Equation 1, p. 1; Section 2.2, Remark on Why Not Sample Rows Uniformly, p. 6
    relation: supports
