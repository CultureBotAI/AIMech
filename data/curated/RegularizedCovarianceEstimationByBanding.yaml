id: AIMech:RegularizedCovarianceEstimationByBanding
name: Regularized Covariance Estimation by Banding
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Bickel-Levina Banded Sample Covariance and Modified Cholesky Inverse Estimator
- Banding the Sample Covariance Matrix and Cholesky Factor of the Inverse
- Operator-Norm Consistent Covariance and Cholesky Factor Banding
definition: 'Regularized Covariance Estimation by Banding is a high-dimensional covariance and precision matrix estimation methodology for ordered p-variate variables X_1, ..., X_n with sample covariance Sigma_hat_p = (1/n) sum_{i=1}^n (X_i - X_bar)(X_i - X_bar)^T that regularizes Sigma_p either by applying the banding operator Sigma_hat_{k,p} = B_k(Sigma_hat_p) = [sigma_hat_{ij} 1(|i - j| <= k)] (and its positive-definiteness-preserving Schur-product tapering extension R_sigma(Sigma_hat_p) = Sigma_hat_p * R_sigma with r_sigma(a, b) = g(rho(a, b)/sigma)) or by banding the modified Cholesky decomposition of the inverse covariance Sigma_tilde_{k,p}^{-1} = (I - A_tilde_k)^T D_tilde_k^{-1} (I - A_tilde_k) obtained from ordinary least squares regressions of each variable X_j on its closest k predecessors Z_j^{(k)} = (X_{max(j-k,1)}, ..., X_{j-1})^T. Uniformly over the polynomial off-diagonal tail-decay classes U(eps_0, alpha, C) = {Sigma : max_j sum_{i:|i-j|>k} |sigma_{ij}| <= C k^{-alpha}, 0
  < eps_0 <= lambda_min(Sigma) <= lambda_max(Sigma) <= 1/eps_0} and U^{-1}(eps_0, C, alpha) = {Sigma : 0 < eps_0 <= lambda_min(Sigma) <= lambda_max(Sigma) <= 1/eps_0, max_i sum_{j<i-k} |t_{ij}(Sigma)| <= C k^{-alpha}} under Gaussian or subexponential-squared tails (as long as (log p)/n -> 0), choosing bandwidth k_n asymp (n^{-1} log p)^{-1/(2(alpha+1))} yields uniform operator-norm convergence ||Sigma_hat_{k_n,p} - Sigma_p||_2 = O_P(((log p)/n)^{alpha/(2(alpha+1))}) = ||Sigma_hat_{k_n,p}^{-1} - Sigma_p^{-1}||_2 (Theorem 1) and ||Sigma_tilde_{k_n,p}^{-1} - Sigma_p^{-1}||_2 = O_P(((log p)/n)^{alpha/(2(alpha+1))}) = ||Sigma_tilde_{k_n,p} - Sigma_p||_2 (Theorem 3), consistent spectral-measure and isolated-eigenspace approximations (Theorems 4-5), and practical bandwidth selection via a random-split resampling risk estimator k_hat = argmin_k (1/N) sum_{nu=1}^N ||B_k(Sigma_hat_1^{(nu)}) - Sigma_hat_2^{(nu)}||_{(1,1)}.'
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Bickel and Levina (2008a, The Annals of Statistics 36(1):199-227; arXiv:0803.1909v1, DOI:10.1214/009053607000000758). Distinct from AIMech:MinimaxOptimalTaperingForHighDimensionalCovarianceMatrixEstimation (Cai, Zhang, & Zhou 2010, The Annals of Statistics 38(4):2118-2144), which proves that Bickel and Levina's (2008a) rate O_P(((log p)/n)^{alpha/(2(alpha+1))}) over row-sum/entry-decay classes is sub-optimal because of the l1-to-l2 norm bound ||B_k(Sigma_hat) - B_k(Sigma)||_2 <= k ||B_k(Sigma_hat) - B_k(Sigma)||_infty (Eq. A3) and introduces the two-parameter piecewise-linear trapezoid taper w_{ij} to establish the sharp minimax rate n^{-2 alpha /(2 alpha+1)} + (log p)/n via delta-net quadratic-form discretization and Assouad's lemma. Also distinct from AIMech:HighDimensionalCovarianceRegularizationByHardThresholding (Bickel & Levina 2008b, The Annals of Statistics 36(6):2577-2604), which applies permutation-invariant
  entrywise hard thresholding T_s(M) = [m_{ij} 1(|m_{ij}| >= s)] over weak l_q row-sparsity balls without requiring a natural index ordering, and from AIMech:SparsePermutationInvariantCovarianceEstimation (Rothman, Bickel, Levina, & Zhu 2008), which minimizes an off-diagonal l1-penalized Gaussian log-likelihood.
