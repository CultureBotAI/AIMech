claims:
- claim_id: uniform-operator-norm-rates-for-sample-covariance-banding-and-schur-tapering
  kind: scope
  statement: 'Over the well-conditioned polynomial tail-decay class U(eps_0, alpha, C) = {Sigma : max_j sum_{i:|i-j|>k} |sigma_{ij}| <= C k^{-alpha} for all k > 0, 0 < eps_0 <= lambda_min(Sigma) <= lambda_max(Sigma) <= 1/eps_0} (Eq. 5, p. 204 / PDF p. 6; including Toeplitz spectral-density classes L(eps_0, m, C) and trace-class perturbations T(eps_0, m_1, m_2, C_1, C_2), Eqs. 6-9), Theorem 1 (Eq. 10, p. 206 / PDF p. 8; Proof in Appendix, Eqs. A1-A6, p. 219 / PDF p. 21) proves via the symmetric matrix norm bound ||M||_2 <= ||M||_{(1,1)} = max_j sum_i |m_{ij}| (Eq. A2) and the Saulis-Statulevicius large-deviation inequality (Lemma A.3, Eq. A12) that for Gaussian or subexponential-squared variables (Extension I, Eq. 11) with bandwidth k_n asymp (n^{-1} log p)^{-1/(2(alpha+1))}, the banded sample covariance estimator Sigma_hat_{k_n,p} = B_{k_n}(Sigma_hat_p) satisfies ||Sigma_hat_{k_n,p} - Sigma_p||_2 = O_P(((log p)/n)^{alpha/(2(alpha+1))}) = ||Sigma_hat_{k_n,p}^{-1} - Sigma_p^{-1}||_2 uniformly
    on U (and O_P((n^{-1/2} p^{2/beta})^{alpha/(1+alpha+2/beta)}) under beta > 2 finite moments, Extension II, Eqs. 12-13). Furthermore, replacing hard banding by Schur-product tapering R_sigma(Sigma_hat_p) = Sigma_hat_p * R_sigma with a symmetric positive-definite taper r_sigma(a, b) = g(rho(a, b)/sigma) (e.g., (1 - |i-j|/sigma)_+ or exp(-|i-j|/sigma)) preserves positive definiteness by Schur''s theorem and achieves the same uniform operator-norm rate when Delta(sigma) = sum_{l=1}^L g_sigma(rho_l) asymp (n^{-1} log p)^{-1/(2(alpha+1))} (Theorem 2 and Lemma A.1, pp. 207-208, 220 / PDF pp. 9-10, 21-22).'
  evidence:
  - source_id: bl2008a-banding-pdf
    locator: Sections 3.1-3.3, Equations (5)-(15), Theorems 1-2, Corollary 1, pp. 204-208 (PDF pp. 6-10); Appendix, Equations (A1)-(A7) and Lemmas A.1, A.3, pp. 218-221 (PDF pp. 20-23)
    relation: supports
- claim_id: modified-cholesky-k-predecessor-regression-banding-of-inverse-covariance
  kind: mechanism
  statement: 'To regularize the inverse covariance Sigma_p^{-1} directly when p > n, Section 2.2 (Equations 2-4, pp. 203-204 / PDF pp. 5-6) regresses each centered variable X_j on its closest k predecessors Z_j^{(k)} = (X_{max(j-k,1)}, ..., X_{j-1})^T via empirical ordinary least squares a_tilde_j^{(k)} = (Var_hat(Z_j^{(k)}))^{-1} Cov_hat(X_j, Z_j^{(k)}) and residual variances d_tilde_{j,k}^2 = Var_hat(X_j - (Z_j^{(k)})^T a_tilde_j^{(k)}), forming the k-banded strictly lower triangular factor A_tilde_k and diagonal matrix D_tilde_k = diag(d_tilde_{1,k}^2, ..., d_tilde_{p,k}^2) to define Sigma_tilde_{k,p}^{-1} = (I - A_tilde_k)^T D_tilde_k^{-1} (I - A_tilde_k) and Sigma_tilde_{k,p} = (I - A_tilde_k)^{-1} D_tilde_k [(I - A_tilde_k)^{-1}]^T (well-defined and nonnegative definite for any k < n even when p > n). Over the Cholesky tail-decay class U^{-1}(eps_0, C, alpha) = {Sigma : 0 < eps_0 <= lambda_min(Sigma) <= lambda_max(Sigma) <= 1/eps_0, max_i sum_{j<i-k} |t_{ij}(Sigma)| <= C k^{-alpha}},
    Theorem 3 (p. 208 / PDF p. 10; Proof and Lemma A.2 on pp. 220-223 / PDF pp. 22-25, Eqs. A9-A22) proves that for k_n asymp (n^{-1} log p)^{-1/(2(alpha+1))} and n^{-1} log p = o(1), ||Sigma_tilde_{k_n,p}^{-1} - Sigma_p^{-1}||_2 = O_P(((log p)/n)^{alpha/(2(alpha+1))}) = ||Sigma_tilde_{k_n,p} - Sigma_p||_2 uniformly on U^{-1}, and Corollary 2 (p. 209 / PDF p. 11; Lemma A.4 and Eqs. A23-A27, pp. 223-225 / PDF pp. 25-27) establishes the rate O_P(((log p)/n)^{(m-1)/(2m)}) uniformly over Toeplitz matrices L(eps_0, m, C) for m >= 2.'
  evidence:
  - source_id: bl2008a-banding-pdf
    locator: Section 2.2, Equations (2)-(4), pp. 203-204 (PDF pp. 5-6); Section 3.4, Theorem 3 and Corollary 2, pp. 208-209 (PDF pp. 10-11); Appendix, Lemmas A.2, A.4 and Equations (A8)-(A27), pp. 220-225 (PDF pp. 22-27)
    relation: supports
- claim_id: eigenstructure-perturbation-consistency-and-resampling-bandwidth-selection
  kind: mechanism
  statement: For population covariances embedded in the space B(l_2, l_2) of bounded self-adjoint operators as Sigma = S + K (Toeplitz S with bounded positive spectral density and trace-class K), Theorem 4 (Eq. 17, p. 210 / PDF p. 12) proves pointwise convergence in probability of the spectral measure E_hat_p = E(Sigma_hat_{k_n,p}) to E_p = E(Sigma_p), while on the class G(eps, alpha, C, Delta, m) of matrices whose top m eigenvalues are separated by at least Delta (Eq. 18), Theorem 5 (Eq. 19, p. 210 / PDF p. 12; Proof via the Kato-Sz.-Nagy contour resolvent integral E_0(x) = (2 pi i)^{-1} int_Gamma R(lambda, M) d lambda, Eqs. A28-A32, pp. 225-226 / PDF pp. 27-28) bounds the eigenvalue and eigenspace projection errors ||E_j(Sigma_hat_{k,p}) - E_j(Sigma_p)||_2. For finite-sample tuning, Section 5 (Equations 22-26, pp. 211-212 / PDF pp. 13-14) estimates the oracle risk R(k) = E||Sigma_hat_k - Sigma||_{(1,1)} via N random sample splits (n_1, n_2 = n - n_1) by R_hat(k) = (1/N) sum_{nu=1}^N ||B_k(Sigma_hat_1^{(nu)})
    - Sigma_hat_2^{(nu)}||_{(1,1)} and selects k_hat = argmin_k R_hat(k).
  evidence:
  - source_id: bl2008a-banding-pdf
    locator: Section 4, Theorems 4-5 and Equations (16)-(21), pp. 209-211 (PDF pp. 11-13); Section 5, Equations (22)-(26), pp. 211-212 (PDF pp. 13-14); Appendix, Proof of Theorem 5, Equations (A28)-(A32), pp. 225-226 (PDF pp. 27-28)
    relation: supports
