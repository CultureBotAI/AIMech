id: AIMech:EfBvUnifiedErrorFeedbackAndVarianceReductionWithBiasVarianceDecomposition
name: EF-BV Unified Error Feedback and Variance Reduction with Bias-Variance Decomposition
concept_kind: algorithm
review_status: DRAFT
definition: A unified distributed compressed proximal gradient algorithm (Algorithm 1) operating over the two-parameter bias-variance compressor class C(eta, omega) (where ||E[C(x)] - x|| <= eta ||x|| and E[||C(x) - E[C(x)]||^2] <= omega ||x||^2, with parallel average variance omega_av <= omega) that decouples the worker control-variate scaling parameter lambda in h_i^{t+1} = h_i^t + lambda C_i^t(nabla f_i(x^t) - h_i^t) from the master gradient-estimate scaling parameter nu in g^{t+1} = h^t + nu (1/n) sum_i C_i^t(nabla f_i(x^t) - h_i^t), recovering EF21 when nu = lambda and DIANA when nu = 1 while achieving faster convergence with optimal lambda^* = min((1 - eta)/((1 - eta)^2 + omega), 1) and nu^* = min((1 - eta)/((1 - eta)^2 + omega_av), 1).
identity_notes: Distinct from standalone DIANA (Mishchenko et al., 2019; restricted to unbiased compressors eta = 0 with nu = 1) and standalone EF21 (Richtarik et al., NeurIPS 2021; restricted to nu = lambda and unable to exploit 1/n parallel variance reduction when omega_av = omega/n < omega). EF-BV (Condat, Yi, & Richtarik, NeurIPS 2022, arXiv:2205.04180) unifies both mechanisms and introduces the C(eta, omega) compressor class including mix-(k, k') and comp-(k, k').
aliases:
