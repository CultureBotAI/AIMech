claims:
- claim_id: ef-bv-bias-variance-compressor-class-and-dual-scaling-parameters-mechanism
  kind: mechanism
  statement: For compressors C_i^t in C(eta, omega) with relative bias eta in [0, 1), individual variance omega >= 0, and parallel aggregated variance omega_av <= omega (Equation 6), EF-BV (Algorithm 1) updates each worker's control variate as h_i^{t+1} = h_i^t + lambda d_i^t with d_i^t = C_i^t(nabla f_i(x^t) - h_i^t) and forms the master gradient estimator g^{t+1} = h^t + nu d^t before taking x^{t+1} = prox_{gamma R}(x^t - gamma g^{t+1}), where Proposition 2 yields optimal contraction factors r = (1 - lambda^* + lambda^* eta)^2 + (lambda^*)^2 omega and r_av = (1 - nu^* + nu^* eta)^2 + (nu^*)^2 omega_av.
  evidence:
  - source_id: r564-primary-pdf
    locator: Section 2.3-2.5 Proposition 1-2 pp. 4-6 & Section 3 Algorithm 1 p. 7
    relation: supports
- claim_id: ef-bv-kurdyka-lojasiewicz-linear-and-nonconvex-sublinear-convergence-scope
  kind: scope
  statement: Under the Polyak-Lojasiewicz or Kurdyka-Lojasiewicz condition with constant mu > 0 (Theorems 1-2), EF-BV with step size gamma = 1 / (L + tilde{L} sqrt(r_av / r) / s^*) (or 2L in the composite case) achieves linear convergence E[Psi^t] <= (max(1 - gamma mu, (r+1)/2))^t Psi^0, improving over EF21's complexity O((tilde{L}/mu)(1/(1-r)) log(1/eps)) by the parallel variance reduction factor sqrt(r_av / r) in Eq. (12), and achieves O(1/t) stationarity in smooth nonconvex optimization (Theorem 3).
  evidence:
  - source_id: r564-primary-pdf
    locator: Section 4 Theorems 1-2 & Remark 3 Eq. (12) p. 8, Section 5 Theorem 3 p. 10
    relation: supports
  - source_id: r564-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: ef-bv-strictly-less-than-unit-relative-bias-and-full-worker-participation-limitation
  kind: limitation
  statement: Requires the compressor relative bias to satisfy eta < 1 (since scaling lambda in (0, 1] reduces variance quadratically as lambda^2 omega but cannot reduce relative bias below eta) and maintains a d-dimensional control variate h_i^t at every worker.
  evidence:
  - source_id: r564-primary-pdf
    locator: Section 2.3 p. 4, Section 2.5 Proposition 1-2 pp. 5-6 & Algorithm 1 p. 7
    relation: supports
- claim_id: ef-bv-distributed-optimization-with-hybrid-comp-and-mix-compressors-application
  kind: application
  statement: Applied to distributed convex and nonconvex regularized logistic regression using hybrid biased-and-random compressors such as comp-(k, k') (composition of Top-k' and Rand-k) and mix-(k, k') (mixture of Top-k and Rand-k').
  evidence:
  - source_id: r564-primary-pdf
    locator: Section 6 p. 10 & Appendices A & C Propositions 4-5 pp. 15-18
    relation: supports
