id: AIMech:AlphaEntmax
name: Alpha-entmax
aliases:
- Entmax transformation
- Tsallis entmax
concept_kind: mathematical_method
definition: >-
  A score-to-probability transformation for alpha at least one that maximizes the score
  inner product plus Tsallis alpha-entropy over the probability simplex, with
  Shannon entropy defining the alpha=1 case.
identity_notes: >-
  This record denotes the transformation family, not a complete sequence model,
  its associated training loss, or a particular implementation. Entmax and
  DSelect-k name different constructions. Softmax and Sparsemax are special
  cases, rather than aliases for the whole family. The ignored-inclusive
  repository identity search and open-PR inspection are recorded in the
  accompanying discovery ledger. AIO:SoftmaxFunction covers only one case;
  AIO:MathematicalFunction supplies the broader mapping.
definition_evidence:
- source_id: peters-2019-entmax
  locator: Section 3.2, equations 9-10, printed pp. 1506-1507 (PDF pp. 3-4)
  relation: supports
claims:
- claim_id: thresholded-probabilities
  kind: mechanism
  statement: >-
    For alpha greater than one, a shared threshold truncates low scores to zero;
    positive residuals are raised to 1/(alpha-1), with the threshold chosen so
    probabilities sum to one. Alpha=2 recovers Sparsemax and alpha=1 recovers Softmax.
  evidence:
  - source_id: peters-2019-entmax
    locator: Sections 3.2-3.3, equations 10 and 13, printed p. 1507 (PDF p. 4)
    relation: supports
- claim_id: computation-scope
  kind: limitation
  statement: >-
    The paper gives an exact sorting algorithm for alpha=1.5 and a finite-iteration
    bisection approximation for general alpha greater than one. Sparse outputs
    are possible; not every input must have a zero component.
  evidence:
  - source_id: peters-2019-entmax
    locator: Section 3.3, algorithms 1-2 and Figure 3, printed pp. 1507-1508 (PDF pp. 4-5)
    relation: supports
