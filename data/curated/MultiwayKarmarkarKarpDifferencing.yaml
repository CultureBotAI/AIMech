  rationale: No inspected AIO class denotes normalized arithmetic subpartition composition. A shared graph,
    heuristic or partitioning word does not identify a learned model, learning task or function entity.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: Graph-structured language modeling is distinct from arithmetic subpartition manipulation.
  - target: AIO:ReasoningLLM
    rejection_reason: A language model with explicit reasoning is not a number-partitioning algorithm.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: A neural-symbolic language-model architecture is not this nonlearning search or
      heuristic.
  - target: AIO:MachineLearningTask
    rejection_reason: Balancing a given multiset does not learn a method from data.
  - target: AIO:MathematicalFunction
    rejection_reason: An algorithm evaluating differences and choosing a partition is distinct from the
      mathematical functions it uses.
  - target: AIO:ReinforcementLearning
    rejection_reason: There is no reward-based learned policy or exploration/exploitation learning in
      the curated deterministic procedure.
limitations:
- The scope is unconstrained range partitioning into k>=3 interchangeable bins. Equal cardinality, nonempty-bin
  requirements and bin-dependent restrictions are not imposed.
- Tie choices can affect the constructed trace or memberships. The curator calculation declares its policy
  and does not assert identity with an uninspected author implementation.
- Normalization preserves differences but discards an absolute common offset unless separate membership
  or offset data are retained. A zero component need not denote an unused bin.
- A heuristic result is not an optimality certificate, and even a range optimum need not be a minimum-makespan
  partition.
- All 31 pages of the Korf manuscript and all 30 pages of the original report were read; constructed exact-integer
  examples do not establish typical performance or replace complete search.
