claims:
- claim_id: exponential-decay-of-gradient-stable-rank-in-reversible-and-transformer-networks
  kind: mechanism
  statement: Theorem 3.2 and Lemma 3.3 (Equations 6-9, Appendix B.1-B.2) prove that for chained reversible networks whose layer gradients follow the parametric form G_t = (1/N) sum_{i=1}^N (A_i - B_i W_t C_i) with positive semidefinite B_i, C_i and Kronecker operator S = (1/N) sum_{i=1}^N (C_i^T otimes B_i) having two smallest distinct eigenvalues lambda_1 < lambda_2, the vectorized gradient satisfies g_t = (I - eta S) g_{t-1} and the stable rank sr(G_t) = ||G_t||_F^2 / ||G_t||_2^2 decays exponentially via sr(G_t) <= sr(G_{t_0}^||) + ((1 - eta lambda_2)/(1 - eta lambda_1))^{2(t - t_0)} ||G_{t_0} - G_{t_0}^|| ||_F^2 / ||G_{t_0}^|| ||_2^2.
  evidence:
  - source_id: r584-primary-pdf
    locator: Section 3.2, Theorem 3.2, Lemma 3.3, Corollaries 3.4-3.5, pp. 3-4; Appendix B.1-B.3, pp. 13-18
    relation: supports
- claim_id: fixed-subspace-contraction-and-multi-subspace-full-rank-weight-composition
  kind: mechanism
  statement: Theorem 3.8 (Equation 11, Appendix B.4) proves that under L_A, L_B, L_C Lipschitz continuity of A_i, B_i, C_i and bounded weights ||W_t||_F <= D, projected gradient descent in a fixed subspace R_t = P^T G_t Q contracts at the linear rate ||R_t||_F <= [1 - eta (kappa_{t-1} - L_A - 2 L_B L_C D^2)] ||R_{t-1}||_F where kappa_t = (1/N) sum_i lambda_min(P^T B_{it} P) lambda_min(Q^T C_{it} Q), while periodic SVD re-initialization every T steps (Equation 14) accumulates W_t = W_0 + sum_k Delta W_{T_k} across distinct rank-r subspaces to learn full-rank weights.
  evidence:
  - source_id: r584-primary-pdf
    locator: Section 3.3, Theorem 3.8, Equations (11)-(14), Figure 2, pp. 4-5; Appendix B.4, Equations (55)-(70), pp. 18-19
    relation: supports
  - source_id: r584-metadata-cr
    locator: Bibliographic record (ICML 2024, PMLR 235:61121-61143)
    relation: supports
- claim_id: sublinear-optimizer-state-memory-and-8bit-per-layer-llm-pretraining
  kind: application
  statement: For an m x n weight matrix with m <= n and rank r, one-sided GaLore (Algorithm 2, Table 1) stores W_t in R^{m x n}, P_t in R^{m x r}, and Adam moments M_t, V_t in R^{r x n} for a total of mn + mr + 2nr parameters (strictly smaller than LoRA's mn + 3mr + 3nr and full-rank Adam's 3mn), reducing optimizer state memory by up to 65.5% (BF16 GaLore) and 82.5% (8-bit GaLore) during LLaMA 1B and 7B pre-training on C4.
  evidence:
  - source_id: r584-primary-pdf
    locator: Section 4.2-4.3, Algorithm 2, Table 1, p. 6; Section 5.1-5.5, Tables 2-4, Figures 1 and 4, pp. 6-9
    relation: supports
- claim_id: periodic-svd-computation-and-subspace-switching-frequency-tradeoff
  kind: limitation
  statement: GaLore incurs periodic SVD computation overhead every T steps to update the projection matrix P_t (inducing ~8.8%-17% throughput overhead on LLaMA 1B), and switching subspaces either too frequently (which corrupts accumulated momentum/variance fidelity in M_t, V_t) or too infrequently (which stalls optimization in a stale rank-r subspace) degrades convergence.
  evidence:
  - source_id: r584-primary-pdf
    locator: Section 4.1, p. 5; Section 5.5 and Section 6, Figure 5, p. 9; Appendix E, Table 11, p. 23
    relation: supports
