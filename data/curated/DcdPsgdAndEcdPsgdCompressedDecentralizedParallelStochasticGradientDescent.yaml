id: AIMech:DcdPsgdAndEcdPsgdCompressedDecentralizedParallelStochasticGradientDescent
name: DCD-PSGD and ECD-PSGD (Difference-Compression and Extrapolation-Compression Decentralized Parallel SGD)
concept_kind: algorithm
review_status: DRAFT
definition: 'A pair of communication-compressed decentralized parallel stochastic gradient descent algorithms over doubly stochastic gossip graphs W (Tang et al. 2018, Section 4, Algorithms 1-2) that overcome the divergence of naive model-compression gossip by maintaining local neighbor replicas x_tilde_t^{(j)} and compressing either: (1) the iterate difference z_t^{(i)} = x_{t+1/2}^{(i)} - x_t^{(i)} via x_{t+1}^{(i)} = x_t^{(i)} + C(z_t^{(i)}) in Difference Compression D-PSGD (DCD-PSGD, Algorithm 1), or (2) the time-extrapolated state z_t^{(j)} = (1 - 0.5 t) x_{t-1}^{(j)} + 0.5 t x_t^{(j)} reconstructed as x_tilde_t^{(j)} = (1 - 2 / t) x_tilde_{t-1}^{(j)} + (2 / t) C(z_t^{(j)}) in Extrapolation Compression D-PSGD (ECD-PSGD, Algorithm 2).'
identity_notes: Distinct from Choco-SGD and Choco-Gossip (AIMech:ChocoSgdAndChocoGossipDecentralizedCompressedOptimization, Koloskova, Stich, & Jaggi 2019), which introduce a consensus stepsize gamma in (0, 1] on the gossip step x_{t+1} = x_t - eta g_t + gamma sum_j w_{ij} (x_hat_j - x_hat_i) to support biased contractive compressors, whereas DCD-PSGD applies full-weight gossip W to unbiasedly compressed differences and ECD-PSGD uses harmonic O(1/t) extrapolation-averaging.
aliases:
- DCD-PSGD and ECD-PSGD
- Difference Compression D-PSGD and Extrapolation Compression D-PSGD
- Communication-Compressed Decentralized Parallel SGD
