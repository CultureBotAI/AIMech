claims:
- claim_id: r425-dcd-psgd-spectral-compression-threshold-and-linear-speedup
  kind: mechanism
  statement: In DCD-PSGD (Algorithm 1), compressing the model difference z_t^{(i)} = sum_j x_t^{(j)} W_{ij} - gamma g_t^{(i)} - x_t^{(i)} causes the compression error to vanish as x_{t+1/2}^{(i)} - x_t^{(i)} -> 0, achieving the O(1 / sqrt(n T)) non-convex linear speedup rate whenever the relative compression noise ratio alpha satisfies the spectral stability condition (1 - rho)^2 - 4 mu^2 alpha^2 > 0 (where rho = max_{i>=2} |lambda_i(W)| and mu = max_{i>=2} |1 - lambda_i(W)|, Theorem 1, Corollary 2).
  evidence:
  - source_id: r425-primary-pdf
    locator: Section 4.1 DCD-PSGD (Algorithm 1, Theorem 1, Corollary 2, Remark 1) & Supplementary Material (Lemmas 5-10)
    relation: supports
- claim_id: r425-ecd-psgd-harmonic-extrapolation-arbitrary-compression-convergence
  kind: mechanism
  statement: When compression is too aggressive for DCD-PSGD ((1 - rho)^2 - 4 mu^2 alpha^2 <= 0), ECD-PSGD (Algorithm 2) compresses z_t^{(j)} = (1 - 0.5 t) x_{t-1}^{(j)} + 0.5 t x_t^{(j)} and updates x_tilde_t^{(j)} = (1 - 2/t) x_tilde_{t-1}^{(j)} + (2/t) C(z_t^{(j)}), which satisfies the exact noiseless identity x_tilde_t^{(j)} = x_t^{(j)} when C(z) = z (Lemma 11) and damps compression noise variance by O(1 / t) (E||x_tilde_t^{(j)} - x_t^{(j)}||^2 <= O(1 / t), Lemma 12), guaranteeing O(1 / sqrt(n T)) convergence for arbitrarily large compression noise (Theorem 3, Corollary 4).
  evidence:
  - source_id: r425-primary-pdf
    locator: Section 4.2 ECD-PSGD (Algorithm 2, Theorem 3, Corollary 4) & Supplementary Material (Lemmas 11-12)
    relation: supports
- claim_id: r425-neighbor-replica-memory-and-unbiased-compressor-limitation
  kind: limitation
  statement: Both DCD-PSGD and ECD-PSGD assume unbiased stochastic compression operators (E[C(z)] = z) and require each worker i to store local replicas x_tilde_t^{(j)} (or their weighted sum) for its connected graph neighbors j.
  evidence:
  - source_id: r425-primary-pdf
    locator: Section 3-4 Assumption 1 & Algorithms 1-2
    relation: supports
- claim_id: r425-decentralized-resnet20-cifar10-ring-topology-training-application
  kind: application
  statement: Applied to decentralized ring-topology training of ResNet-20 on CIFAR-10 with stochastic quantization, outperforming naive model-compression D-PSGD and centralized QSGD at low network bandwidth.
  evidence:
  - source_id: r425-primary-pdf
    locator: Section 5 Experiments (Figures 3-6), pp. 7658-7660
    relation: supports
