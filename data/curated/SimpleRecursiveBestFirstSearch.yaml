claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Initialize each child’s stored value from its static evaluation and keep the children ordered
    by those values. Recurse into the best child with the smaller of the current bound and the next-best
    sibling’s value, then replace that child’s stored value with the returned value and reorder. Backtrack
    when the best available child exceeds the bound; a dead end returns infinity.
  evidence:
  - source_id: method-source
    locator: Simple Recursive Best-First Search, printed pp. 534–535 / PDF pp. 2–3; SRBFS pseudocode and
      Figure 3
    relation: supports
- claim_id: refinement-boundary
  kind: scope
  statement: The full RBFS refinement preserves previously backed-up information when regenerating children.
    The paper distinguishes ordering all SRBFS expansions from ordering first-time RBFS expansions, because
    RBFS traverses previously expanded paths in depth-first order.
  evidence:
  - source_id: full-refinement
    locator: Full Recursive Best-First Search, printed p. 535 / PDF p. 3; Theoretical Results, printed
      p. 536 / PDF p. 4
    relation: supports
