name: Simple recursive best-first search
definition: A recursive best-first search procedure that initializes generated children from their static
  evaluation values, explores the best child within an alternative-derived bound, and backs up returned
  values to decide which subtree to revisit.
concept_kind: algorithm
identity_notes: SRBFS is Korf’s simple recursive algorithm, not an alias for the full RBFS refinement.
  It resets regenerated children to their static values instead of conditionally inheriting a previously
  backed-up parent value. This distinction can cause additional regeneration. No normalized identity match
  was found across the 442 AIO and 124 prior native records; ignored-inclusive text hits in the main checkout
  were prior discovery leads, source citations and search-order contrasts, plus incidental dependency
  substrings, not existing concept records.
limitations:
- Resetting regenerated child values can repeat already explored work before reaching a previously established
  frontier. Full RBFS adds a conditional inheritance rule to mitigate this.
- Path cycles and termination require appropriate graph and evaluation assumptions or explicit path checks;
  the displayed procedure is not a complete production implementation for every graph.
- The recursive representation retains the path and sibling alternatives. Linear-in-depth memory is conditional
  on bounded branching and fixed-size node information; it is not full-frontier storage.
