claims:
- claim_id: r367-claim-complement-marginal-nonnegativity-and-deterministic-one-third-guarantee
  kind: mechanism
  statement: Because (X_{i-1} + u_i) cup (Y_{i-1} - u_i) = Y_{i-1} and (X_{i-1} + u_i) cap (Y_{i-1} - u_i) = X_{i-1}, submodularity of f implies that the marginal gains a_i = f(X_{i-1} + u_i) - f(X_{i-1}) and b_i = f(Y_{i-1} - u_i) - f(Y_{i-1}) satisfy a_i + b_i >= 0 at every iteration 1 <= i <= n (Lemma 2.1); tracking the hybrid optimal sequence OPT_i = (OPT cup X_i) cap Y_i from OPT_0 = OPT to OPT_n = X_n = Y_n yields f(OPT_{i-1}) - f(OPT_i) <= [f(X_i) - f(X_{i-1})] + [f(Y_i) - f(Y_{i-1})] (Lemma 2.2), telescoping to f(X_n) >= f(OPT) / 3 in O(n) oracle queries (Algorithm 1, Theorem 1.1), which is tight up to 1/3 + varepsilon on a 5-vertex weighted directed cut instance (Theorem 2.3, Figure 1).
  evidence:
  - source_id: r367-primary-pdf
    locator: Section 1.1-1.2, Theorem 1.1, pp. 1385-1386; Section 2-2.1, Algorithm 1, Lemmas 2.1-2.2, Theorem 2.3, and Figure 1, pp. 1387-1389
    relation: supports
- claim_id: r367-claim-randomized-and-multilinear-tight-half-approximation
  kind: mechanism
  statement: In Randomized USM (Algorithm 2), choosing to include u_i with probability a_i' / (a_i' + b_i') and exclude u_i with probability b_i' / (a_i' + b_i') (where a_i' = max{a_i, 0} and b_i' = max{b_i, 0}) ensures that when a_i, b_i > 0, E[f(X_i) - f(X_{i-1}) + f(Y_i) - f(Y_{i-1})] = (a_i^2 + b_i^2) / (a_i + b_i) (Eq. 3.2) and E[f(OPT_{i-1}) - f(OPT_i)] <= (a_i * b_i) / (a_i + b_i) (Eq. 3.3); since a_i * b_i / (a_i + b_i) <= (1/2) * (a_i^2 + b_i^2) / (a_i + b_i), every step satisfies E[f(OPT_{i-1}) - f(OPT_i)] <= (1/2) * E[f(X_i) - f(X_{i-1}) + f(Y_i) - f(Y_{i-1})] (Lemma 3.1), telescoping to the information-theoretically optimal E[f(X_n)] >= f(OPT) / 2 in O(n) value-oracle queries (Theorem 1.2), and the fractional counterpart Multilinear USM (Algorithm 3) achieves the same F(x_n) = F(y_n) >= f(OPT) / 2 guarantee on the multilinear extension F (Theorem 4.1, Lemmas 4.2-4.3).
  evidence:
  - source_id: r367-primary-pdf
    locator: Section 1.1, Theorem 1.2, p. 1385; Section 3, Algorithm 2, Lemma 3.1, and Equations (3.1)-(3.3), pp. 1389-1392; Section 4, Algorithm 3, Theorem 4.1, Lemmas 4.2-4.3, and Equations (4.1)-(4.3), pp. 1392-1394
    relation: supports
- claim_id: r367-claim-linear-time-three-quarters-submodular-max-sat-and-two-player-welfare
  kind: application
  statement: "Extending Double Greedy to extended truth assignments X_i subseteq Y_i subseteq N x {0, 1} initialized at X_0 = emptyset and Y_0 = N x {0, 1} yields Randomized SSAT (Algorithm 4), which satisfies E[g(OPT_{i-1}) - g(OPT_i)] <= (1/2) * E[g(X_i) - g(X_{i-1}) + g(Y_i) - g(Y_{i-1})] (Lemma 5.2) and\u2014because Y_0 satisfies all clauses so g(Y_0) >= g(OPT)\u2014telescopes to E[g(X_n)] >= g(OPT)/2 + g(Y_0)/4 >= (3/4) * g(OPT) in O(|Psi|) linear time using clause-literal linked lists and satisfaction counters (Theorem 1.3, Theorem 5.3), directly implying a tight linear-time (3/4)-approximation for 2-player Submodular Welfare via g(N_1) = f_1(N_1) + f_2(N \\ N_1) where g(emptyset) + g(N) >= g(OPT) (Theorem 1.4, Section 5.2)."
  evidence:
  - source_id: r367-primary-pdf
    locator: Section 1.1, Theorems 1.3-1.4, p. 1386; Section 5.1-5.2, Algorithm 4, Lemmas 5.1-5.2, Equations (5.1)-(5.3), and Theorem 5.3, pp. 1394-1399
    relation: supports
