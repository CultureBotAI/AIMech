claims:
- claim_id: method
  kind: mechanism
  statement: Predict a target length from the input using the paper’s encoder-state length predictor.
    For a nonempty hypothesis of length n, combine average log probability S/n with log brevity penalty
    min(1−Lpred/n,0). For decoding with a genuine finite maximum output length R, a current raw log score
    S_t≤0 yields an upper bound S_t/R on descendant BP-Norm scores. Compare the maximum active-prefix
    bound with the best completed BP-Norm score before stopping.
  evidence:
  - source_id: method-source
    locator: Section 4.2.3 Equation (12), transformed score and Section 5.2 Equation (13), printed pp.
      3056–3057 / PDF pp. 3–4
    relation: supports
- claim_id: predicted-versus-maximum
  kind: limitation
  statement: Equation (13) defines R as a maximum generation length, whereas the experiments identify
    it with predicted length. The bound is curated only when that value truly bounds the permitted completion
    lengths; prediction alone is not a mathematical upper bound.
  evidence:
  - source_id: predicted-versus-maximum
    locator: Sections 5.2 and 6.1, printed pp. 3057–3058 / PDF pp. 4–5
    relation: supports
