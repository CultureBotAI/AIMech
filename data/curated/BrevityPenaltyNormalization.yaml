name: Brevity-penalty normalization for sequence scoring
definition: 'A sequence rescoring rule that adds a predicted-length brevity penalty in log space to average
  token log probability: S(x,y)/|y| + min(1−Lpred(x)/|y|,0).'
concept_kind: mathematical_method
identity_notes: BP-Norm is Yang et al.’s predicted-length decoding score. It resembles the algebraic structure
  of BLEU’s brevity penalty but does not compute n-gram precision, use an actual reference translation
  at inference, or equal the BLEU evaluation metric. It differs from plain average log probability and
  additive word rewards. No normalized identity match was found across the 442 AIO and 146 prior native
  records; both checkout text searches included ignored and hidden files and returned no matches for the
  selected exact IDs, full labels, aliases and source titles.
limitations:
- Lpred is a prediction, not a reference length or a proven upper bound on output length. The S_t/R stopping
  bound requires that admissible completions actually have length at most R.
- The experiments set R to the predicted length. This supports the stopping guarantee only under an enforced
  length cap or another justification that all allowed completions obey that bound; a forecast alone is
  insufficient.
- The formula requires nonempty hypotheses and a valid length prediction. A BOS-only prefix needs separate
  handling; length and EOS conventions must be specified.
- The score is neither a normalized probability nor BLEU itself. Improved search score does not imply
  better human translation quality.
- The source’s hyperparameter-free comparison concerns removal of a separately tuned reward constant,
  not absence of trained models, a length predictor or decoding choices. Finite beam pruning remains approximate.
