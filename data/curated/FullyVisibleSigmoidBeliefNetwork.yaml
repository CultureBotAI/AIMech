name: Fully visible sigmoid belief network
definition: A fully observed binary autoregressive probabilistic model whose conditional probability at
  each position is a logistic function of a bias and a weighted sum of preceding visible variables.
concept_kind: architecture
identity_notes: 'This is the fully visible sigmoid model discussed by Larochelle and Murray, with no stochastic
  hidden variables. Frey and colleagues call their binary logistic special case a fully visible belief
  network; that local usage does not make all fully visible Bayesian networks synonyms of the sigmoid
  family. The record specializes the broader sigmoid-belief-network family and is distinct from NADE’s
  nonlinear deterministic hidden features and DARN’s stochastic latent architecture. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 346 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  23 and 23 lines respectively. All 17 unique matched line contents were inspected in full: SBN source
  metadata, NADE and DARN scope distinctions, their saved review and the carried noisy-OR discovery lead,
  not existing candidate records. Exact checkout counts and differences are retained in the ledger. Seventeen
  exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The chain-rule factorization is general, but restricting each conditional to a logistic-linear function
  limits the distribution family. A given fixed-order conditional table with a nonzero logit interaction
  cannot be represented by that affine logit; this is not a claim about every alternative ordering or
  latent extension.
- Exact complete-observation likelihood and forward generation do not provide arbitrary missing-variable
  posteriors for free. Conditioning on a suffix while earlier variables are unknown still requires inference
  or summation.
- Changing the variable order changes the restricted model family and can affect fitting. The absence
  of stochastic latent variables is part of this specialization, not a property of all sigmoid belief
  networks.
- The source’s FVBN label is interpreted within its binary logistic model setting. No assertion that every
  fully visible Bayesian model uses logistic factors, no universal performance ranking and no trained-model
  result is included.
