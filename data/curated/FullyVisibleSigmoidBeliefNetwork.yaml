claims:
- claim_id: method
  kind: mechanism
  statement: Fix an ordering of D binary visible variables. Parameterize P(x_i=1|x_<i)=sigmoid(b_i+sum_(j<i)
    w_ij x_j). Multiply the corresponding Bernoulli probabilities over positions to evaluate the normalized
    observed joint. All variables in that product are visible, so complete-data likelihood evaluation
    has no hidden-state marginalization or recognition-model posterior approximation. Its negative log
    likelihood is the sum of the positionwise binary logistic losses. Generate a sample by drawing each
    bit from the conditional determined by already drawn predecessors. Full connectivity makes all earlier
    visible variables available as parents; zero coefficients can remove particular dependencies. A fixed-order
    conditional’s log odds are affine in its predecessors, unlike the more general nonlinear neural conditional
    used by NADE.
