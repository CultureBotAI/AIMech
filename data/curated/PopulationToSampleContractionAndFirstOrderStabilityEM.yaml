- Balakrishnan-Wainwright-Yu Population-to-Sample EM Framework
- First-Order Stability (FOS) and Gradient Stability (GS) EM Contraction Analysis
- Population and Sample-Based EM and Gradient EM Non-Asymptotic Guarantees
