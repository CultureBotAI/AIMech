claims:
- claim_id: claim-self-consistency-and-first-order-gradient-stability-population-contraction
  kind: mechanism
  statement: By combining the self-consistency optimality condition $\langle\nabla Q(\theta^*\mid\theta^*),\theta' - \theta^*\rangle \le 0$ (Equation 26) with $\lambda$-strong concavity of $q(\cdot) = Q(\cdot\mid\theta^*)$ (Equation 25) and the First-Order Stability condition $\|\nabla Q(M(\theta)\mid\theta^*) - \nabla Q(M(\theta)\mid\theta)\|_2 \le \gamma\|\theta - \theta^*\|_2$ on $\mathbb{B}_2(r;\theta^*)$ (Definition 1, Equation 29), Theorem 1 proves that the population EM map $M$ is strictly contractive with factor $\kappa = \gamma/\lambda < 1$, while Theorem 3 proves that under $\mu$-smoothness and Gradient Stability $\|\nabla Q(\theta\mid\theta^*) - \nabla Q(\theta\mid\theta)\|_2 \le \gamma\|\theta - \theta^*\|_2$ (Definition 2, Equation 46), population gradient EM $G(\theta) = \theta + \frac{2}{\mu+\lambda}\nabla Q(\theta\mid\theta)$ contracts with factor $1 - \frac{2(\lambda-\gamma)}{\mu+\lambda}$.
  evidence:
  - source_id: bwy2017-emguarantees-pdf
    locator: Section 3.1.1, Definition 1 & Theorem 1, pp. 9-10; Section 3.2.1, Definition 2 & Theorem 3, pp. 13-15
    relation: supports
  - source_id: bwy2017-emguarantees-abs
    locator: Abstract
    relation: supports
- claim_id: claim-sample-based-sample-splitting-and-stochastic-gradient-em-error-recursion
  kind: mechanism
  statement: When the population EM or gradient EM operator is $\kappa$-contractive on $\mathbb{B}_2(r;\theta^*)$ and the uniform empirical perturbation satisfies $\varepsilon^{\mathrm{unif}}(n,\delta) \le (1-\kappa)r$, Theorems 2 and 4 establish that all sample iterates remain inside $\mathbb{B}_2(r;\theta^*)$ and satisfy $\|\theta^t - \theta^*\|_2 \le \kappa^t\|\theta^0 - \theta^*\|_2 + \frac{1}{1-\kappa}\varepsilon^{\mathrm{unif}}(n,\delta)$ (Equations 35b, 51b), while projected single-sample stochastic gradient EM with decaying step size $\alpha^t = \frac{3}{2\xi(t+2)}$ ($\xi = \frac{2\mu\lambda}{\lambda+\mu} - \gamma > 0$) achieves $\mathbb{E}[\|\theta^t - \theta^*\|_2^2] \le \frac{9\sigma_G^2}{\xi^2(t+2)} + (\frac{2}{t+2})^{3/2}\|\theta^0 - \theta^*\|_2^2$ (Theorem 5, Equation 54).
  evidence:
  - source_id: bwy2017-emguarantees-pdf
    locator: Section 3.1.2, Theorem 2, pp. 11-13; Section 3.2.2-3.2.3, Theorems 4 & 5, pp. 15-18
    relation: supports
  - source_id: bwy2017-emguarantees-cr
    locator: Crossref metadata and published abstract for Ann. Statist. 45(1):77-120
    relation: supports
- claim_id: claim-canonical-latent-variable-models-and-missing-covariate-upper-snr-regime
  kind: scope
  statement: "For two-component symmetric Gaussian mixtures and mixtures of linear regressions with signal-to-noise ratio $\\|\\theta^*\\|_2/\\sigma > \\eta$ sufficiently large, Corollaries 1\u20135 prove local contraction over $\\mathbb{B}_2(c\\|\\theta^*\\|_2;\\theta^*)$ with contraction rate $\\kappa(\\eta) \\le e^{-c\\eta^2}$ (for mixtures of Gaussians) and minimax $O(\\sqrt{d/n})$ sample error; in contrast, for linear regression with covariates missing completely at random with probability $\\rho$, Corollary 6 proves that contractivity requires an *upper* bound on SNR $\\|\\theta^*\\|_2/\\sigma \\le \\xi_1$ such that $\\rho < \\frac{1}{1 + 2\\xi(1+\\xi)}$ ($\\xi = (\\xi_1+\\xi_2)^2$, Equation 67), because missing-covariate imputation variance scales with $\\|\\theta_{\\mathrm{mis}}\\|_2^2$."
  evidence:
  - source_id: bwy2017-emguarantees-pdf
    locator: Section 4.1-4.3, Corollaries 1-8 & Figure 7, pp. 18-26; Appendices B-D, pp. 28-51
    relation: supports
- claim_id: claim-limitation-local-initialization-and-well-specified-strong-concavity
  kind: limitation
  statement: "The guarantees of Theorems 1\u20135 are local to the basin $\\mathbb{B}_2(r;\\theta^*)$ (requiring a pilot initializer such as spectral/method-of-moments estimation) and rely on $\\lambda$-strong concavity of the population oracle function $Q(\\cdot\\mid\\theta^*)$ and well-specified model structure, which break down in singular over-specified mixture models where the Fisher information matrix vanishes at $\\theta^*$."
  evidence:
  - source_id: bwy2017-emguarantees-pdf
    locator: Section 3.1.1, Equation 25, p. 9; Section 5 Discussion, p. 26
    relation: supports
