name: Principal Curves
aliases:
- Hastie–Stuetzle Principal Curves
concept_kind: mathematical_method
definition: 'A nonlinear statistical summary defined by a smooth curve that is self-consistent for a data
  distribution: almost every point on the curve equals the conditional mean of observations whose nearest-point
  projection lands there.'
identity_notes: Scoped to the Hastie-Stuetzle population self-consistency construction and its original
  finite-data projection/smoothing estimator. A principal curve is not merely any smooth regression fit,
  a principal-component eigenvector, a normalized generative density, a probabilistic principal curve,
  or a higher-dimensional principal surface. The population object and its smoothed sample estimate have
  different guarantees. Three candidate identities were compared against all 442 pinned AIO IDs, labels
  and scoped synonyms and 457 preceding native IDs, names and aliases, with no normalized collision. Full
  searches of both checkouts included ignored and hidden files and returned the same 32 matching excerpts
  across nine paths. All excerpts were read; frontier leads and neighboring-model comparisons are not
  duplicate records. Historical ledgers were not reread in full solely because an excerpt matched. All
  219 semantic-search rows were read, including six additional adaptive-pooling rows. Nineteen annotated
  AIO nodes and their outgoing edges were byte-verified against previous complete readings. Twenty-eight
  contextual YAMLs, including nine native neighbors, comprise 25 unchanged prior readings and three complete
  current readings. The identity and mapping assessment is bounded to this snapshot and maintained corpus.
