aio_mappings:
- target: AIO:MarkovChain
  relation: related_match
  rationale: The one-step conditional child-heuristic table acts as a transition law on heuristic contexts;
    richer parent-history contexts enlarge that state description. This is a curator-inferred component
    relationship. The complete estimator multiplies by offspring counts and applies threshold pruning,
    so it is not equivalent to a probability-preserving Markov chain or an asserted subclass of the pinned
    network class. The mapping does not certify that real search states are Markov under a chosen compressed
    context.
limitations:
- The identity is the CDP count estimator, not IDA* itself, IDA*IM threshold selection, a hidden Markov
  tree, or wall-clock performance prediction. CDP1 and CDP2 are conditioning variants within this record.
- Complete-iteration counting, root initialization, reverse-operator pruning and the definition of expansion
  must be fixed. Equation 8 sums from depth zero despite its displayed child-level base case; the printed
  recurrences are not certified here as executable pseudocode.
- Conditional table construction needs matching population weights, especially with unequal degrees and
  rare-context enrichment. Sampled transition laws and mean branching need not describe every start or
  every sibling order.
- BPMX survival powers assume the modeled dependence and generation-order conditions. Noninteger average
  branching requires an interpretation beyond using it literally as a finite sum limit.
- All 43 pages of the author-hosted journal PDF were visually inspected. Other PDF versions, the 2008
  conference full text, author software and benchmark replication were not inspected or executed. Constructed
  examples test boundaries only.
