id: AIMech:ConditionalDistributionPredictionIDAStar
name: Conditional Distribution Prediction for IDA*
aliases:
- Conditional Distribution Prediction
concept_kind: algorithm
definition: A search-effort estimation procedure that predicts the number of expanded nodes in a complete
  IDA* threshold iteration by recursively propagating conditional heuristic-value frequencies and branching
  counts while excluding pruned ancestor paths.
identity_notes: Compared all 442 pinned AIO and 638 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 4, 0, 1 lines. All distinct match contents were
  inspected. Semantic matching covered 63 AIO and 302 native definitions, with every matched definition
  read. 9 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. Retain
  the recursive expanded-node estimator for a complete IDA* threshold iteration. It is distinct from the
  solution-returning IDA* search, IDA*IM online threshold-control integration, and latent-state tree models
  with observation emissions. The generic acronym CDP is not adopted as a global alias.
definition_evidence:
- source_id: zahavi2010cdp
  locator: Sections 3–4.4, PDF pp. 9–19, especially Equations 5–10
  relation: supports
claims:
- claim_id: complete-contour-counting
  kind: scope
  statement: The basic formulation estimates expanded nodes for a complete fixed-threshold IDA* iteration
    with unit-cost edges and nonnegative discrete heuristic values. A node must satisfy the evaluation
    threshold and be generated through expanded ancestors. Counting every node whose own depth plus heuristic
    meets the threshold can overcount when an inconsistent heuristic prunes an ancestor. The estimate
    is neither a solution-returning search procedure nor the expansion count before an early goal stop.
  evidence:
  - source_id: zahavi2010cdp
    locator: Sections 2.2 and 3, PDF pp. 3–4 and 9–15; Section 4.1, pp. 15–17
    relation: supports
- claim_id: conditional-count-recurrence
  kind: mechanism
  statement: Starting from the root or a specified initial frontier, the recurrence multiplies eligible
    parent counts by conditional branching factors and child-heuristic probabilities, discards ineligible
    child counts at each depth, and sums expanded counts across depths. CDP1 conditions on parent heuristic;
    richer variants include grandparent heuristic and node type to represent effects such as reverse-operator
    pruning. Transition probabilities are normalized conditional frequencies, whereas propagated quantities
    are expected node counts and need not sum to one. Unequal parent degrees require matching the weighting
    of branching estimates and conditional probabilities.
  evidence:
  - source_id: zahavi2010cdp
    locator: Sections 4.1–4.5.1, PDF pp. 15–20, Equations 5–12; conditional-frequency estimation on p.
      16
    relation: supports
- claim_id: context-and-exactness-boundary
  kind: limitation
  statement: Accurate pooled conditional tables alone do not guarantee accurate predictions for every
    start. Exact counting requires a context that preserves the relevant branching and successor-type
    frequencies, pruning rules and initialization. The source gives failure examples and special sufficient
    conditions for exactness; enriching context can also increase sampling sparsity. Thus exhaustive parameter
    estimation does not by itself certify the estimator on heterogeneous search trees.
  evidence:
  - source_id: zahavi2010cdp
    locator: Sections 4.5–4.5.3, PDF pp. 19–22; Sections 6–8, pp. 24–29
    relation: supports
- claim_id: shallow-search-and-bpmx
  kind: mechanism
  statement: An enhanced variant explicitly searches a shallow region and extrapolates from the reached
    frontier using the remaining threshold, trading extra work for more start-specific information. The
    BPMX extension models later-sibling suppression from earlier-child upward heuristic propagation for
    undirected unit-cost search with one-level propagation. Its power expression for sibling survival
    needs the corresponding conditional independence and ordering assumptions; correlated siblings require
    a joint survival calculation. These extensions are not unconditional exactness guarantees.
  evidence:
  - source_id: zahavi2010cdp
    locator: Section 8, PDF pp. 29–31; Section 10, pp. 34–37, Equations 18–20
    relation: supports
- claim_id: evaluation-and-boundary-estimates
  kind: limitation
  statement: The finite Rubik’s Cube and sliding-tile studies use particular heuristic contexts, sampling
    procedures and threshold-specific start sets. More conditioning or a shallow prefix does not improve
    every reported case. Exact potential-node counts provide an upper bound on actual expansions, but
    sampled approximations are not certified upper bounds. The independence-based lower estimate is empirical
    rather than a universal lower bound. Arbitrary edge-cost handling and A* graph-search duplicate effects
    require additional treatment beyond the basic depth-indexed recurrence.
  evidence:
  - source_id: zahavi2010cdp
    locator: Sections 5–9, PDF pp. 23–34, Tables 4–15; Section 9 footnote 7; Sections 11.2–12, pp. 38–40
    relation: supports
