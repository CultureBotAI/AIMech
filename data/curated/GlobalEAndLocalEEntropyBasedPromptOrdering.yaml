id: AIMech:GlobalEAndLocalEEntropyBasedPromptOrdering
name: GlobalE and LocalE Entropy-Based Prompt Ordering
concept_kind: algorithm
review_status: DRAFT
definition: A validation-free prompt ordering method for few-shot in-context learning that first generates an unlabeled probing set directly from the pretrained language model conditioned on the available training demonstrations, and then selects high-performing permutations of those demonstrations by maximizing either the global Shannon entropy of hard class predictions across the probing set (GlobalE) or the mean local predictive entropy per probing instance (LocalE).
identity_notes: Distinct from post-hoc output probability calibration methods such as Contextual Calibration (AIMech:CalibrateBeforeUseContextualCalibration) and Domain-Conditional PMI (AIMech:PMIDCDomainConditionalPointwiseMutualInformation), which rescale label probabilities for a fixed prompt rather than ranking and selecting optimal permutations of in-context demonstrations. Also distinct from retrieval-based example selection methods that choose which examples to include per test query rather than ordering a fixed few-shot support set without any labeled development data.
aliases:
- GlobalE and LocalE Prompt Ordering
- GlobalE / LocalE Entropy-Based Demonstration Ordering
- Entropy-Based Few-Shot Prompt Permutation Selection
