claims:
- claim_id: globale-locale-generative-probing-set-construction
  kind: mechanism
  statement: To evaluate candidate prompt permutations without access to a labeled development set, the method prompts the pretrained language model with concatenated training demonstrations to sample artificial unlabeled probing inputs from the target task distribution.
  evidence:
  - source_id: r733-primary-pdf
    locator: Section 3.1, p. 8089, Figure 2
    relation: supports
- claim_id: globale-and-locale-entropy-scoring-equations
  kind: mechanism
  statement: For each candidate permutation of the K demonstrations, GlobalE computes the Shannon entropy of the empirical distribution of argmax class predictions across the probing set to eliminate permutations that suffer from degenerate single-class collapse, whereas LocalE computes the average predictive distribution entropy across individual probing inputs.
  evidence:
  - source_id: r733-primary-pdf
    locator: Section 3.2, pp. 8089-8090, Equations 2-5
    relation: supports
- claim_id: globale-locale-few-shot-order-sensitivity-application
  kind: application
  statement: GlobalE and LocalE are applied to few-shot text classification across GPT-2, GPT-3, and RoBERTa models, improving accuracy by an average of 13% over random orderings and drastically reducing variance across demonstration permutations without using labeled validation examples.
  evidence:
  - source_id: r733-primary-pdf
    locator: Section 4 & Section 5, pp. 8090-8094, Tables 1-4
    relation: supports
  - source_id: r733-metadata-cr
    locator: DBLP bibliographic record conf/acl/LuBMRS22
    relation: supports
- claim_id: globale-locale-factorial-permutation-cost-limitation
  kind: limitation
  statement: Exhaustively scoring all K! permutations scales factorially with the number of in-context examples K, requiring Monte Carlo subsampling of permutations when K is large and assuming that the true target class distribution is approximately balanced.
  evidence:
  - source_id: r733-primary-pdf
    locator: Section 3.2 & Section 5, pp. 8089-8095
    relation: supports
