identity_notes: The selected source-defined linear off-policy prediction algorithm combines inverse feature-usage
  main step sizes, an ordinary importance-weighted accumulating trace and a scalar auxiliary GTD update.
  Its complete update differs from WIS-TD with provisional weights, the three-trace true-online GTD host
  and the two on-policy usage-based methods. Conditional reductions do not make those algorithms exact
  aliases. Existing eligibility owner 264 retains seven earlier IDs and five resolutions; its historical
  Sutton pointer is discovery context, while Mahmood and Sutton 2015 supplies this method. The fresh collection
  after PR389 merged, on 15 October 2026 at 18:42:28–18:45:19 UTC, covered 775 maintained native and 442
  pinned AIO records. IDs, local IDs, names, aliases and scoped synonyms supplied 4,843 identity fields.
  Canonical names and explicit source spellings, including Greek lambda, produced no normalized candidate
  collision. Four fixed-string searches included ignored and hidden paths and retained 6,064 occurrences
  in 1,351 distinct content groups. Two supporting agents read all grouped contents in disjoint partitions;
  root read all 37 filtered candidate-named groups, twelve normalized neighbor definitions, 29 fields
  and full owners 264,265,266 and269. Candidate-named matches are source-lead, history, review and existing-neighbor
  context. All 1,216 pre-WIS-TD inventory rows and the newly merged WIS-TD record were reconciled at the
  actual base. Historical research snapshots remain separately dated. This supports a bounded identity
  decision for these roots, probes and pinned AIO snapshot; it does not claim a manual semantic reading
  of every corpus record or worldwide absence.
