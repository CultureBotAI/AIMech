- target: AIO:ActiveLearning
  relation: related_match
  rationale: The pinned class describes interactive querying of an information source for outputs. This
    algorithm chooses informative objective evaluations to update its surrogate and optimizer belief.
    The relation records that query-learning association. It does not equate black-box optimization with
    annotation or pool-based classification, assert subclass membership, or identify the specific acquisition
    with the broad AIO class.
limitations:
- This record denotes the original representer-point and expectation propagation algorithm, not all information-based
  Bayesian optimization. Predictive Entropy Search uses different optimizer sampling and predictive-entropy
  approximations. Shared ideal information does not imply identical acquisitions on every problem or justify
  a claim that their selected points always differ.
- Figure 2 on PDF p. 7 explicitly allows atoms at a domain boundary. An optimizer law with such atoms
  is not a Lebesgue density, and its KL divergence to a purely continuous uniform base is infinite. The
  ideal density-entropy calculation requires appropriate measures and finite quantities; the finite discretized
  loss is an approximation. Appendix A does not provide a general existence or convergence theorem for
  every objective prior. Degenerate priors, singular finite covariances and tied optimizer values require
  explicit handling beyond the ordinary no-tie Gaussian calculation.
- Section 2.4 on PDF p. 11 and Equation 6 on PDF p. 13 leave literal signed covariance innovation, noise
  placement and second-mean-derivative coefficient questions for implementation audit. This record neither
  silently repairs those expressions nor claims to reproduce them numerically.
- The expected-improvement comparator on PDF p. 4 prints min{0,eta-f} although its closed form is the
  nonnegative improvement expression. The optional logarithmic-likelihood discussion on PDF p. 17 calls
  logarithm convex and prints a positive second derivative where the stated likelihood gives -y^2/sigma^2
  at g=log(y). Those contextual discrepancies are not adopted as core Entropy Search formulas.
- The retained curator calculator checks 27 small positive binary channels and separate constructed boundary
  examples. Probability masses use exact rational arithmetic; entropy uses floating logarithms. These
  checks illustrate information identities and limitations. They do not run Gaussian-process fitting,
  expectation propagation, acquisition optimization or author code, and establish no general accuracy,
  runtime, regret or global convergence guarantee.
