claims:
- claim_id: mora-square-matrix-rank-amplification-under-equal-budget
  kind: mechanism
  statement: Given a pretrained weight matrix W_0 in R^{d x k} and a LoRA parameter budget of (d + k) r trainable weights, MoRA parameterizes the adapter as a single square matrix M in R^{r_hat x r_hat} with r_hat = floor(sqrt((d + k) r)), raising the maximum achievable rank of the weight update from r to r_hat (or up to d under chunk decoupling) without increasing trainable parameter count.
  evidence:
  - source_id: r667-primary-pdf
    locator: Section 1 & Section 4 (Method), pp. 2, 4, Equations (2)-(3)
    relation: supports
- claim_id: mora-nonparameterized-sharing-and-rotational-decoupling-operators
  kind: mechanism
  statement: "MoRA pairs M with linear non-parameterized compression and decompression operators\u2014either summing input coordinates within predefined groups g and broadcasting outputs across groups g' (Delta_W_{i,j} = M_{g'_i, g_j}) or reshaping x into n chunks of size r_hat rotated by 2D block-diagonal rotation matrices R_{theta_j, i} before multiplying by M\u2014such that f_decomp(M f_comp(x)) = Delta_W x merges losslessly into W_0."
  evidence:
  - source_id: r667-primary-pdf
    locator: Section 4 (Method), pp. 4-5, Equations (3)-(11)
    relation: supports
- claim_id: mora-application-knowledge-memorization-and-continual-pretraining
  kind: application
  statement: On memory-intensive UUID pair memorization, biomedical and financial continual pretraining of LLaMA-2-7B, and C4 transformer pretraining from scratch (including periodic merge-and-reinit ReMoRA with alternating group patterns), MoRA achieves substantially higher singular-value spectra and outperforms LoRA and ReLoRA while matching LoRA on instruction tuning and mathematical reasoning.
  evidence:
  - source_id: r667-primary-pdf
    locator: Section 5 (Experiment) & Section 6 (Analysis), Tables 1-4 & Figures 3-5, pp. 5-8
    relation: supports
- claim_id: mora-limitation-compression-information-loss-or-reshape-overhead
  kind: limitation
  statement: When r_hat is small relative to d and k, row/column group sharing averages many input coordinates into each entry of M and degrades accuracy due to compression information loss, whereas the chunk-reshaping and rotation operators avoid compression loss at the cost of applying M across n = k / r_hat chunks during training and producing a block-diagonal Delta_W.
  evidence:
  - source_id: r667-primary-pdf
    locator: Section 4 & Section 6.2 (Influence of Decompression and Compression), pp. 4-5, 8, Table 4
    relation: supports
