claims:
- claim_id: r471-generalization-bound-optimal-mixing-weight-mechanism
  kind: mechanism
  statement: Theorem 1 bounds the target risk of the interpolated hypothesis h_{alpha_i} = alpha_i h_{i,S_i} + (1 - alpha_i) h_{D_bar,S} by 2 alpha_i^2 (hat{L}_{D_i}(h_{i,S_i}) + O(sqrt((d log(m_i/d)) / m_i))) + 2 (1 - alpha_i)^2 (hat{L}_{D_bar}(h_{D_bar,S}) + B_i + d_H(D_i, D_bar) + O(sqrt((d log(m/d)) / m))), showing that the optimal mixing weight alpha_i^* increases toward 1 as the distribution divergence (B_i + d_H(D_i, D_bar)) or local sample size m_i increases, and decreases toward 0 when client distributions are homogeneous (Deng et al. 2020, Section 3, Theorem 1).
  evidence:
  - source_id: r471-primary-pdf
    locator: Section 3 (Generalization Guarantee, Theorem 1 & Remark 1), pp. 4-5
    relation: supports
- claim_id: r471-coupled-local-update-and-alpha-projection-mechanism
  kind: mechanism
  statement: By chain rule on the composite objective F_i(v_i; w_i^{(t-1)}) = f_i(alpha_i v_i + (1 - alpha_i) w_i^{(t-1)}), APFL updates v_i^{(t)} using alpha_i nabla f_i(v_hat_i^{(t-1)}) and adapts alpha_i^{(t)} online via projected gradient descent using the inner product <v_i^{(t-1)} - w_i^{(t-1)}, nabla f_i(v_hat_i^{(t-1)}; xi_i^t)> without additional gradient evaluations beyond nabla f_i(v_hat_i^{(t-1)}) (Deng et al. 2020, Section 4, Equations 6-10, Algorithm 1).
  evidence:
  - source_id: r471-primary-pdf
    locator: Section 4 (Adaptive Personalized Federated Learning, Equations 6-10, Algorithm 1), pp. 5-7
    relation: supports
- claim_id: r471-non-iid-classification-and-regression-application
  kind: application
  statement: Applied to personalized logistic regression and deep neural network classification on synthetic non-IID data, MNIST, CIFAR-10, and EMNIST with automatic per-client adaptation of alpha_i (Deng et al. 2020, Section 6, Figures 1-4).
  evidence:
  - source_id: r471-primary-pdf
    locator: Section 6 (Experiments, Figures 1-4), pp. 8-10
    relation: supports
- claim_id: r471-double-local-memory-and-forward-backward-cost-limitation
  kind: limitation
  statement: Requires each client to store both the local model v_i and the local copy of the global model w_i and to compute two separate stochastic gradients per local step (nabla f_i(w_i^{(t-1)}) and nabla f_i(v_hat_i^{(t-1)})), doubling per-step local gradient computation compared to standard FedAvg (Deng et al. 2020, Algorithm 1).
  evidence:
  - source_id: r471-primary-pdf
    locator: Section 4 (Algorithm 1, lines 6-9), p. 6
    relation: supports
