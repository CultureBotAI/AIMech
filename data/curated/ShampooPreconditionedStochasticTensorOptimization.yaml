claims:
- claim_id: c-r588-kronecker-preconditioning-equivalence
  kind: mechanism
  statement: By Lemma 4 and Lemma 12, preconditioning an order-k gradient tensor G_t along each mode i via the mode-i tensor-matrix product G_t x_1 (H_t^1)^{-1/(2k)} ... x_k (H_t^k)^{-1/(2k)} is algebraically equivalent on the vectorized parameter wt = vec(W_t) to a preconditioned gradient step wt+1 = wt - eta H_t^{-1} gt with Kronecker preconditioner H_t = bigotimes_{i=1}^k (H_t^i)^{1/(2k)}, reducing matrix-case memory from m^2 n^2 to m^2 + n^2 and SVD/inversion work from O(m^3 n^3) to O(m^3 + n^3).
  evidence:
  - source_id: r588-primary-pdf
    locator: Section 1.1, p. 3; Lemma 4, p. 6; Section 4.2-4.3 & Lemma 12, pp. 11-12
    relation: supports
- claim_id: c-r588-loewner-dominance-and-regret-bound
  kind: mechanism
  statement: Under operator monotonicity of the geometric mean of commuting positive semidefinite matrices (Lemma 5, Lemma 8, Lemma 11), the Kronecker product of Shampoo's mode preconditioners upper-bounds the full-matrix AdaGrad covariance in Loewner order, epsilon I_n + sum_{t=1}^T g_t g_t^T <= r bigotimes_{i=1}^k (epsilon I_{n_i} + sum_{t=1}^T G_t^{(i)})^{1/k}, yielding an O(sqrt(T)) online convex optimization regret bound sum_{t=1}^T (f_t(W_t) - f_t(W^*)) <= sqrt(2r) D prod_{i=1}^k Tr((H_T^i)^{1/(2k)}) (Theorem 7 and Theorem 10).
  evidence:
  - source_id: r588-primary-pdf
    locator: Lemma 5-6, p. 6; Theorem 7 & Lemma 8-9, pp. 6-8; Theorem 10 & Lemma 11, pp. 11-12
    relation: supports
- claim_id: c-r588-delayed-roots-and-diagonal-fallback
  kind: application
  statement: Recomputing the fractional matrix roots (H_t^i)^{-1/(2k)} via SVD once every 20 to 100 steps amortizes per-step runtime to be comparable to SGD, AdaGrad, and Adam on deep CNNs and Transformer attention models, while dimensions exceeding a size threshold (e.g. 1200) can independently fall back to diagonal preconditioning (Algorithm 3, Theorem 13).
  evidence:
  - source_id: r588-primary-pdf
    locator: Section 5-6, pp. 12-14; Appendix A, Theorem 13, pp. 16-17
    relation: supports
- claim_id: c-r588-block-diagonal-and-large-dimension-limitation
  kind: limitation
  statement: Shampoo treats each parameter tensor independently as a block-diagonal preconditioner that ignores inter-tensor parameter correlations, and storing full n_i x n_i mode preconditioners or computing their SVDs becomes prohibitively expensive when individual tensor dimensions n_i are very large.
  evidence:
  - source_id: r588-primary-pdf
    locator: Section 5, p. 12; Appendix A, p. 16
    relation: supports
