id: AIMech:ShampooPreconditionedStochasticTensorOptimization
name: Shampoo (Preconditioned Stochastic Tensor Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A structure-aware preconditioned stochastic optimization algorithm over order-k tensor parameter spaces R^{n_1 x ... x n_k} that maintains a separate positive-definite preconditioning matrix H_t^i in R^{n_i x n_i} for each tensor mode i in [k] by accumulating mode-i gradient contractions H_t^i = H_{t-1}^i + mat_i(G_t) mat_i(G_t)^T (with H_0^i = epsilon I_{n_i}) and updates parameters by multiplying the gradient tensor along every mode i by (H_t^i)^{-1/(2k)}, yielding W_{t+1} = W_t - eta L_t^{-1/4} G_t R_t^{-1/4} in the matrix case (k = 2).
identity_notes: Distinct from diagonal AdaGrad and Adam in that Shampoo maintains full per-mode covariance matrices H_t^i rather than purely elementwise diagonal accumulators, and distinct from full-matrix AdaGrad in that it implicitly preconditions the vectorized gradient via the Kronecker product bigotimes_{i=1}^k (H_t^i)^{1/(2k)} with O(sum_i n_i^2) storage and O(sum_i n_i^3) inversion cost instead of O(prod_i n_i^2) and O(prod_i n_i^3). Distinct from K-FAC in that Shampoo is model-oblivious and relies solely on tensor-contracted outer products of observed gradients rather than architecture-specific activation/backpropagation Fisher factorizations.
aliases:
