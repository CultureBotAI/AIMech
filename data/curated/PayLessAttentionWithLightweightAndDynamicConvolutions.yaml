claims:
- claim_id: lightconv-channel-group-weight-sharing-and-temporal-softmax
  kind: mechanism
  statement: "LightConv ties depthwise convolution parameters across every group of d/H contiguous channels\u2014reducing kernel parameters from d^2 * k (standard convolution) and d * k (depthwise convolution) to H * k (e.g., from 7,340,032 to 112 parameters for d = 1024, k = 7, H = 16)\u2014and normalizes weights across the temporal window k via softmax(W)_{h,j} = exp(W_{h,j}) / sum_{j'=1}^k exp(W_{h,j'}) so that LightConv(X, W_{ceil(cH/d),:}, i, c) = DepthwiseConv(X, softmax(W_{ceil(cH/d),:}), i, c)."
  evidence:
  - source_id: r820-primary-pdf
    locator: Section 3 (Lightweight Convolutions), p. 3
    relation: supports
  - source_id: r820-primary-pdf
    locator: conv_parameter_counts and lightconv_step
    relation: supports
- claim_id: dynamicconv-timestep-dependent-linear-kernel-prediction
  kind: mechanism
  statement: DynamicConv predicts a separate H x k convolution kernel at each time step i solely from the current token representation X_i via a learned linear module f(X_i)_{h,j} = sum_{c=1}^d W^Q_{h,j,c} X_{i,c} and computes DynamicConv(X, i, c) = LightConv(X, f(X_i)_{h,:}, i, c), achieving position-varying context weights with O(n) complexity in sequence length n.
  evidence:
  - source_id: r820-primary-pdf
    locator: Section 4 (Dynamic Convolutions), p. 4
    relation: supports
  - source_id: r820-primary-pdf
    locator: dynamicconv_step and main
    relation: supports
- claim_id: dynamicconv-translation-summarization-and-runtime-speedup
  kind: application
  statement: Without using self-attention in either encoder or decoder, DynamicConv achieves 29.7 BLEU on WMT'14 En-De (+0.4 BLEU over Transformer-Big), 43.2 BLEU on WMT'14 En-Fr, +0.8 BLEU on IWSLT'14 De-En, 20% faster inference throughput than self-attention, 26.67 test perplexity on Billion Word language modeling, and higher ROUGE on CNN-DailyMail summarization.
  evidence:
  - source_id: r820-primary-pdf
    locator: Section 6.1-6.4, Tables 1-5, pp. 6-8
    relation: supports
- claim_id: dynamicconv-softmax-normalization-stability-and-receptive-field-limitation
  kind: limitation
  statement: Removing temporal softmax normalization (or replacing it with unnormalized, L1-normalized, squared, or abs weights) causes DynamicConv training to diverge (Table 3 and Appendix A Table 6), and each layer's receptive field is bounded by its fixed kernel width k rather than attending globally in a single hop.
  evidence:
  - source_id: r820-primary-pdf
    locator: Section 6.2 (Table 3, p. 7) and Appendix A (Table 6, p. 13)
    relation: supports
