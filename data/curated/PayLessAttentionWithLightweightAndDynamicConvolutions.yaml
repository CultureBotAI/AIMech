id: AIMech:PayLessAttentionWithLightweightAndDynamicConvolutions
name: Lightweight and Dynamic Convolutions (LightConv and DynamicConv)
concept_kind: layer
review_status: DRAFT
definition: 'Lightweight Convolution (LightConv) and Dynamic Convolution (DynamicConv) are linear-time O(n k d) sequence modeling primitives that replace quadratic O(n^2 d) content-based self-attention: LightConv applies a depthwise separable 1D convolution (preceded by a d -> 2d linear projection and Gated Linear Unit) whose kernel weights W in R^{H x k} are tied across every group of d/H contiguous channels, normalized across the temporal dimension k via softmax(W)_{h,j} = exp(W_{h,j}) / sum_{j''=1}^k exp(W_{h,j''}), and regularized with DropConnect; DynamicConv extends LightConv by predicting time-step-dependent convolution kernels f(X_i) = W^Q X_i in R^{H x k} as a learned linear function of the current time-step input X_i alone.'
identity_notes: Distinct from standard 1D or depthwise separable convolutions (Kaiser et al., 2018), which neither tie weights across d/H channel groups nor apply temporal softmax normalization or per-timestep kernel prediction, and distinct from Lite Transformer (AIMech:LiteTransformerWithLongShortRangeAttention), which combines a self-attention global branch and a convolution local branch in parallel rather than replacing self-attention across all encoder and decoder layers.
aliases:
- LightConv and DynamicConv
- Pay Less Attention with Lightweight and Dynamic Convolutions
- Softmax-Normalized Lightweight and Dynamic Sequence Convolutions
