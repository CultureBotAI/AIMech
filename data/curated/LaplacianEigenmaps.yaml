claims:
- claim_id: method-scope
  kind: mechanism
  statement: Connect nearby observations by an epsilon or symmetrized nearest-neighbor rule, assign Gaussian
    heat-kernel or unit edge weights, form D from weighted degrees and L = D − W, and solve Ly = λDy.
    On a connected component, discard the constant zero mode and use the smallest nonzero modes as coordinates.
    This minimizes weighted squared separations along graph edges subject to degree-weighted normalization
    and exclusion of the constant mode.
  evidence:
  - source_id: original-paper
    locator: Section 1, steps 1–3, and Section 2, equations (1)–(2), PDF pp. 2–4
    relation: supports
- claim_id: convergence-assumptions
  kind: limitation
  statement: The convergence study assumes i.i.d. uniform sampling on a compact infinitely differentiable
    embedded manifold without boundary and establishes the existence of a bandwidth sequence tending to
    zero for spectral convergence in probability. Its analyzed heat-kernel operator does not certify arbitrary
    finite graphs or noisy data.
  evidence:
  - source_id: convergence-analysis
    locator: Sections 1.1–2 and Theorem 2.1, PDF pp. 2–3
    relation: supports
- claim_id: sampling-density-limit
  kind: limitation
  statement: Coifman and Lafon distinguish ordinary isotropic graph normalization, whose continuum behavior
    depends on nonuniform sampling density, from alpha-normalized constructions. Their alpha = 1 construction
    removes density dependence in the stated continuum limit; this is not an unconditional property of
    every Laplacian embedding.
  evidence:
  - source_id: density-analysis
    locator: Sections 3.1–3.4, printed pp. 14–16 / PDF pp. 10–12
    relation: supports
