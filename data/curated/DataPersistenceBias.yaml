id: AIMech:DataPersistenceBias
name: Data Persistence Bias
concept_kind: bias
review_status: DRAFT
definition: A systematic dataset representation and survivorship bias that arises when user-generated or web data is collected retrospectively at a time later than its creation, causing deleted, moderated, or suspended accounts and posts to be selectively omitted and thereby distorting class priors, feature distributions, and interaction graphs relative to real-time collection.
identity_notes: No AIO class represents Data Persistence Bias from retrospective dataset collection; RankingBias (AIO:RankingBias) is a verified existing AIO bias class in data/aio/ representing systematic distortion in retrieved web and information system data.
aliases:
- Retrospective Data Persistence Bias
- Social Media Data Persistence Bias
- Dataset Content Persistence Bias
definition_evidence:
- source_id: r826-primary-pdf
  locator: Full-text primary paper (all sections and appendices verified)
  relation: supports
- source_id: r826-arxiv-abs
  locator: arXiv abstract page
  relation: supports
- source_id: r826-metadata-cr
  locator: Crossref DOI bibliographic metadata
  relation: supports
claims:
- claim_id: retrospective-attrition-class-prior-distortion
  kind: mechanism
  statement: When data is collected retrospectively at T_collect > T_create, differential attrition from account suspensions, moderation, and user deletions alters the observed class prior P(Y=1 | persisted) relative to the true generation-time prior P(Y=1), shifting the optimal classifier decision threshold.
  evidence:
  - source_id: r826-primary-pdf
    locator: Section 1, pp. 1-2; Section 3, Figures 1-3, pp. 3-5
    relation: supports
- claim_id: interaction-graph-and-popularity-metric-distortion
  kind: mechanism
  statement: Selective removal of ephemeral or suspended nodes and edges before retrospective collection alters observed retweet/interaction network degree distributions, centrality rankings, and engagement counts.
  evidence:
  - source_id: r826-primary-pdf
    locator: Section 4-5, pp. 5-8
    relation: supports
- claim_id: social-media-moderation-and-bot-detection-audit-application
  kind: application
  statement: Auditing for data persistence bias is applied to social media machine learning benchmarks for bot detection, hate speech classification, and coordinated manipulation analysis to prevent training on survivorship-skewed datasets.
  evidence:
  - source_id: r826-primary-pdf
    locator: Section 5-6, pp. 7-10
    relation: supports
- claim_id: irreversibility-without-realtime-archival-limitation
  kind: limitation
  statement: Once non-persistent posts or accounts have been permanently deleted from platform APIs prior to collection, data persistence bias cannot be corrected purely by post-hoc reweighting unless an auxiliary real-time stream or archive recorded the missing data.
  evidence:
  - source_id: r826-primary-pdf
    locator: Section 6-7, pp. 9-11
    relation: supports
