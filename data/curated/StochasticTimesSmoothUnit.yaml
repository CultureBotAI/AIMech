name: Stochastic-times-smooth unit
definition: A stochastic activation that sets p=sigmoid(a), samples a Bernoulli gate with success probability
  sqrt(p), and outputs the gate multiplied by sqrt(p).
concept_kind: mathematical_method
identity_notes: 'This record covers Bengio et al.’s Section 2.2 STS construction and its smooth-amplitude
  training path. The Bernoulli gate and nonzero amplitude are both sqrt(p); it is neither an ordinary
  Bernoulli(p) output nor fixed-rate dropout. The source’s Figure 2 uses the reversed wording Smooth Times
  Stoch. for this experimental unit family. The identity is not the generic straight-through estimator
  or stochastic depth. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 337 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 22 and 22 lines respectively. All 15 unique matched
  line contents were inspected in full: the preceding gradient-estimator records, their cited Bengio source,
  saved source-reading scopes, reviews and open discovery leads, not existing candidate records. Exact
  checkout counts and differences are retained in the ledger. Thirteen exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and six full native neighboring records were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.'
limitations:
- The smooth-amplitude backward path is not generally an unbiased gradient of the expected stochastic
  loss. An estimator for changes in the gate probability would require an additional treatment.
- Matching the mean to p does not preserve a nonlinear downstream function. For example, at p=1/4 the
  second moment is 1/8 while the squared mean is 1/16; this is a curator calculation from the source’s
  distribution.
- The asymptotic small-p statement is not a uniform finite-p error bound, a guarantee about optimization,
  or a theorem that the stochastic network equals a deterministic sigmoid network.
- The conditional-computation motivation does not establish a universal speed or accuracy improvement.
  No author implementation or trained model was run.
