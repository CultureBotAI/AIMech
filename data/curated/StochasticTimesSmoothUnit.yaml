claims:
- claim_id: method
  kind: mechanism
  statement: 'Compute p=sigmoid(a), draw b in {0,1} with P(b=1)=sqrt(p), and return h=b*sqrt(p). Conditional
    on a, E[h]=p, P(h>0)=sqrt(p), and the nonzero output is sqrt(p). Backpropagation through the smooth
    multiplier can hold the discrete gate fixed. This path does not include the derivative of the gate’s
    probability law: as a curator consequence of the displayed rule, its expected derivative for the loss
    h is p-prime/2, while d E[h]/d a=p-prime. Proposition 2 gives an asymptotic relationship E[f(h)]=f(p)+o(sqrt(p))
    as p tends to zero for the stated differentiable-function setting; it does not state equality at a
    finite activation probability.'
  evidence:
