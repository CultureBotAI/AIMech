name: Auto-Poisson Markov random field
definition: A finite pairwise Markov-field model for unbounded nonnegative integer counts whose full conditionals
  are Poisson with log means linear in neighboring counts and whose symmetric interaction coefficients
  are nonpositive.
concept_kind: model_family
identity_notes: 'This record denotes the classical unbounded auto-Poisson joint model. A regression using
  neighboring counts can resemble its site formula while failing joint compatibility or normalizability.
  Truncated, Winsorized, transformed-statistic and other modified count graphical models require separate
  identities; the broad phrase Poisson graphical model is therefore not used as an exact alias. Poisson
  refers to each full conditional, not necessarily each marginal distribution. A finite count field is
  also distinct from a Poisson point process with random locations. No normalized identity match was found
  across all 442 pinned AIO labels and all scoped synonyms and 403 preceding native IDs, names and aliases.
  Fixed-string full-checkout searches included ignored and hidden files in worktree and main, yielding
  37 and 37 matched lines; all 20 unique contents were read. Hits are citations, contextual statements
  and discovery leads rather than records of these identities. All 185 semantic label/synonym hits were
  read. Forty-three fully annotated exact CLASS nodes and outgoing edges were inspected: 38 byte-equivalent
  to prior inspected nodes and five freshly read. Fifty-four contextual YAMLs comprise 43 generated and
  11 native records: 46 byte-verified after prior reading and eight freshly read. Absence is bounded to
  the pinned snapshot, maintained corpus and inspected semantic neighborhood.'
limitations:
- The nonpositive-interaction restriction concerns this unbounded pairwise model and its conditional dependence.
  It is not a theorem that every marginal pairwise correlation in every count graphical model must be
  negative.
- A finite cutoff makes the state space summable but changes the support and site conditionals to truncated
  laws. A successful truncated calculation or finite Gibbs run cannot certify the original unbounded positive-interaction
  model.
- The factorial base measure is part of the model. Omitting it changes conditional count laws and their
  existence conditions.
- The source presents a formal validity restriction, not a generic accuracy or efficiency result for ecological
  or genomic count prediction. Later modified Poisson families are research leads, not silently absorbed
  into this record.
- The graph, site supports and any conditioning boundary values must be specified. The construction assumes
  compatible positive full conditionals on the stated Cartesian support; arbitrary separately fitted regressions
  or asymmetric neighbor coefficients do not automatically define a joint model.
- The finite fixed-site model does not by itself specify a random-location point process, temporal causal
  mechanism, hidden observation layer or infinite-lattice existence theorem. Conditional association does
  not establish causation.
- A closed-form site conditional does not make the joint partition function, maximum-likelihood fit or
  uncertainty calculation trivial. Estimation, sampling and model diagnostics require their own procedures.
  No author implementation, empirical fit or benchmark was reproduced.
