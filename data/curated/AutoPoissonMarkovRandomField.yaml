claims:
- claim_id: method
  kind: mechanism
  statement: For finite real alpha_i and symmetric beta_ij=beta_ji, the full conditional is X_i|X_(-i)~Poisson(mu_i),
    where mu_i=exp[alpha_i+sum_(j!=i) beta_ij*x_j]. The compatible pairwise mass is p(x)=Z^(-1)*exp[sum_i(alpha_i*x_i-log(x_i!))+sum_(i<j)
    beta_ij*x_i*x_j] on all nonnegative integer configurations, with zero coefficients on nonedges. For
    this unrestricted Cartesian support and finite site set, Z is finite if and only if every off-diagonal
    beta_ij is nonpositive. Sufficiency follows by bounding the interaction factor by one and summing
    the independent Poisson kernels. A positive coefficient fails summability along a two-site growing-count
    slice even though every proposed site Poisson conditional is individually normalized. With valid beta_ij,
    increasing a neighbor count cannot increase the site conditional mean when other neighbors are held
    fixed; zero interactions yield independent Poisson variables.
  evidence:
