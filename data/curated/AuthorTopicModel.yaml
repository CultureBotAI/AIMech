name: Author-topic model
definition: A generative document model in which each author has a shared topic-proportion distribution
  and each word is produced by uniformly selecting an author from the document's observed author set,
  selecting a topic from that author, and selecting a word from that topic.
concept_kind: model_family
identity_notes: 'Scoped to Rosen-Zvi, Griffiths, Steyvers and Smyth''s UAI 2004 author-topic model, whose
  arXiv deposit occurred in 2012. It conditions on a document''s authors and pools topic preferences across
  their documents. It is distinct from document-specific LDA, a pure author-word mixture, author-recipient-topic
  models and personalized large language models. Latent token-author assignments are model variables,
  not observed intellectual contributions. No normalized identity match was found across all 442 pinned
  AIO labels and scoped synonyms and 423 preceding native IDs, names and aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main. Ten matched lines in each checkout
  reduce to nine unique line contents: prior frontier references, copied discovery context and cached
  web-result mentions. Every matching concept excerpt was inspected; these are not maintained or imported
  identities. All 200 semantic label/synonym hits were read. Eighteen exact annotated AIO CLASS nodes
  and outgoing edges were inspected, including 14 verified unchanged from prior reading and four newly
  read. Thirty contextual YAMLs comprise those 18 AIO records and 12 native neighbors: six fully read
  here, 23 byte-verified after prior reading and the updated APM verified against its fully reviewed round100
  bytes. Absence is bounded to the pinned snapshot, maintained corpus and inspected semantic neighborhood.'
limitations:
- Known author sets, uniform token-level author choice, fixed topic count, bag-of-words observations and
  stationary author preferences constrain the model. The author set is conditioned on, not generated.
  Coauthors with indistinguishable participation can be unidentifiable, and inferred assignments do not
  establish actual authorship contributions or expertise.
- Topic and author probability vectors are conditionally independent given assignments under the conjugate
  construction, but their marginal posterior is generally coupled. The product of separate marginal posterior
  factors displayed in Equation (8) must not be taken as a general exact factorization. Reported prediction
  averages plug-in conditional means, which need not equal integrated multiword probabilities.
- The historical held-out NIPS split ensures test authors already occur in training and can incorporate
  observed words from each test document. It does not demonstrate cold-start prediction for unseen authors.
  LDA overtakes the author-topic model in reported settings as more document words become available; no
  blanket superiority is asserted.
- Symmetric-KL author similarity and topic entropy are descriptive applications. They do not validate
  reviewer selection, establish causal collaboration or supply calibrated measures of author competence.
  Finite Gibbs runs and restarts do not prove mixing, and no author software or benchmark was executed.
