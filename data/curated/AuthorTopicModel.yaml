claims:
- claim_id: author-conditioned-law
  kind: mechanism
  statement: For fixed topic count T, draw each author topic vector theta_a from a symmetric Dirichlet(alpha)
    and each topic word vector phi_t from a symmetric Dirichlet(beta). Given a nonempty observed author
    set A_d, each token draws x uniformly from A_d, z from theta_x, and w from phi_z. Conditional on theta,
    the document-topic mixture is the arithmetic mean of its authors' topic vectors. Ordinary smoothed
    LDA is recovered when every document is assigned its own distinct single author and the priors match;
    sharing one author across documents instead pools their proportions. The author-word model requires
    deterministic unique topic assignment per author, a constrained degenerate case rather than a typical
    positive-Dirichlet draw.
  evidence:
  - source_id: method-source
    locator: Sections 2.1-2.3, printed pp.488-489 / PDF pp.2-3, including smoothed-LDA footnote and special
      cases
    relation: supports
- claim_id: collapsed-sampling
  kind: mechanism
  statement: The published Gibbs sampler jointly updates each token's author-topic pair after integrating
    theta and phi. For observed word v, eligible author a in A_d and topic t, the conditional weight is
    proportional to (n_vt^(-i)+beta)/(n_.t^(-i)+V*beta) times (n_at^(-i)+alpha)/(n_a.^(-i)+T*alpha). Counts
    exclude the current token; assignments outside A_d have zero weight. The uniform author-selection
    factor is constant among eligible pairs and cancels in normalization. Dirichlet posterior means conditional
    on sampled assignments estimate the author-topic and topic-word vectors; averaging across sampled
    assignments approximates marginal inference. Finite sampling and posterior-mean plug-ins are not exact
    multiword posterior predictive integration.
  evidence:
  - source_id: method-source
    locator: Section 3, printed pp.489-490 / PDF pp.3-4, Equations (4)-(6); Section 4.2, p.492 / PDF p.6,
      Equation (8)
    relation: supports
