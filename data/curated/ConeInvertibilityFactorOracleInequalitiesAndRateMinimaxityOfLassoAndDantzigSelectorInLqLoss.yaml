claims:
- claim_id: universal-design-free-minimax-lower-bounds-in-l0-and-lr-balls
  kind: mechanism
  statement: 'For any design matrix $X \in \mathbb{R}^{n \times p}$ normalized to $\max_{j \le p} \|X_j\|_2^2 / n \le 1$ under $\varepsilon \sim \mathcal{N}(0, \sigma^2 I_n)$, the minimax $\ell_q$ risk ($1 \le q \le \infty$) over the $\ell_0$ ball $\mathscr{B}_0(k) = \{\beta : \|\beta\|_0 \le k\}$ ($1 \le k < p/2$) is bounded below for every $X$ by $\inf_{\hat{\beta}} \sup_{\beta \in \mathscr{B}_0(k)} \mathbb{E}_{\beta}\|\hat{\beta} - \beta\|_q^q \ge a_q k(\sigma^2\log(p/k - 1)/n)^{q/2}$ with explicit constant $a_q = \sup_{0 < \varepsilon < 1} \left[(1 - \varepsilon)(1 - \sqrt{\varepsilon})^q / 2^{q/2 + 1}\right]$ ($a_2 = 1/4$ at $\varepsilon = 1/4$), and over $\ell_r$ balls $\mathscr{B}_r(\rho) = \{\beta : \|\beta\|_r \le \rho\}$ ($0 < r \le 1$) by $\inf_{\hat{\beta}} \sup_{\beta \in \mathscr{B}_r(\rho)} \mathbb{E}_{\beta}\|\hat{\beta} - \beta\|_q^q \ge a_q\min\left\{\rho^{q(1-1/t)}(\sigma^2\log(p/\tau_* - 1)/n)^{q/(2t)} + o(1),\, \rho^q\right\}$ where $1/t = 1 - r/q$ and $\tau_* = \rho^r(\sigma^2\log p / n)^{-r/2}$ (Theorem 1, Eqs. 7-8, p. 3522; Corollary 1, Eqs. 9-10, p. 3523; Appendix A, pp. 3532-3535).'
  evidence:
  - source_id: yz2010-cif-pdf
    locator: Section 2, pp. 3521-3523, Equations (7)-(10), Theorem 1 and Corollary 1; Appendix A, pp. 3532-3535, Lemma 1 and Proof of Theorem 1
    relation: supports
- claim_id: sign-restricted-cone-invertibility-factor-and-unified-lasso-dantzig-oracle-inequalities
  kind: mechanism
  statement: 'On the noise domination event $\|z^*\|_\infty \le \eta$ ($z^* = X^\top(y - X\beta^*)/n$), the estimation error $u = \hat{\beta} - \beta^*$ of both the LASSO ($\lambda > \eta$, $\xi = (\lambda + \eta)/(\lambda - \eta)$) and the Dantzig selector ($\lambda_D > 0$, $\xi = (\lambda_D + \eta)/\lambda_D$) belongs to the sign-restricted cone $\mathscr{C}_-(\xi, S) = \{u : \|u_{S^c}\|_1 \le \xi\|u_S\|_1,\, u_j(\Sigma u)_j \le 0\, \forall j \notin S\}$ and satisfies $\|\Sigma u\|_\infty \le \lambda + \eta$ (for LASSO) or $\lambda_D + \eta$ (for Dantzig), yielding the unified $\ell_q$ oracle inequality $\|\hat{\beta} - \beta^*\|_q \le \frac{(\lambda + \eta)|S|^{1/q}}{SCIF_q(\xi, S)}$ (Theorem 3, Eq. 20, p. 3526). Because $SCIF_q(\xi, S) \ge F_q(\xi, S)$ for all $q \ge 1$ and $SCIF_2(\xi, S) \ge \psi(\xi, S)^2$ where $\psi(\xi, S) = \inf_{u \in \mathscr{C}_-(\xi, S)} \sqrt{|S| u^\top \Sigma u}/(\|u_S\|_1 \|u\|_2)^{1/2}$ exceeds the Bickel-Ritov-Tsybakov restricted eigenvalue $\kappa(S, \xi)$ (Proposition 1, Eq. 18, p. 3525), Theorem 3 strictly improves upon two-factor RE bounds and extends to weak/strong $\ell_r$ balls with many small nonzero entries via the interpolation function $g_q(u; \xi) = \frac{(1 - u_S^\top \Sigma u / \|u\|_\Sigma^2)_+}{(\xi\|u_S\|_1/\|u_{S^c}\|_1 - 1)_+}$ and $CIF_q^*(\xi, S)$ (Theorem 4, Eqs. 33-34, p. 3529; Theorem 5, Eqs. 36-39, p. 3530).'
  evidence:
  - source_id: yz2010-cif-pdf
    locator: Section 3.1-3.2, pp. 3523-3527, Equations (11)-(26), Proposition 1, Theorems 2-3; Section 4, pp. 3528-3531, Equations (29)-(39), Theorems 4-5; Appendix B, pp. 3535-3538, Proofs of Proposition 1 and Theorems 3-4
    relation: supports
- claim_id: linfinity-cif-variable-selection-consistency-of-thresholded-lasso-and-gauss-dantzig
  kind: mechanism
  statement: 'Setting $q = \infty$ in Theorem 3 yields the $\ell_\infty$ error bound $\|\hat{\beta} - \beta^*\|_\infty \le \frac{\lambda + \eta}{SCIF_\infty(\xi, S)}$ without assuming the strong irrepresentable condition $\|\Sigma_{S^c, S}\Sigma_{S,S}^{-1}\operatorname{sign}(\beta_S^*)\|_\infty < 1$. Consequently, for any threshold level $t_* \ge \frac{\lambda + \eta}{SCIF_\infty(\xi, S)}$ and minimum signal strength $\min_{j \in S} |\beta_j^*| > t_* + \frac{\lambda + \eta}{SCIF_\infty(\xi, S)}$, both the Thresholded LASSO ($\hat{\beta}_j^{TL} = \hat{\beta}_j^L\mathbf{1}_{|\hat{\beta}_j^L| > t_*}$), the Thresholded Dantzig Selector ($\hat{\beta}_j^{TD} = \hat{\beta}_j^D \mathbf{1}_{|\hat{\beta}_j^D| > t_*}$), and the two-step Gauss-Dantzig estimator ($\hat{\beta}^{GD} = \arg\min_{\beta : \beta_j = 0 \forall j \notin \hat{S}^{TD}} \|y - X\beta\|_2^2$) achieve exact sign recovery $\operatorname{sign}(\hat{\beta}) = \operatorname{sign}(\beta^*)$ and exact oracle OLS refitting on $S$ (Section 3.3, Corollary 2, Eqs. 27-28, pp. 3527-3528).'
  evidence:
  - source_id: yz2010-cif-pdf
    locator: Section 3.3, pp. 3527-3528, Equations (27)-(28), Corollary 2
    relation: supports
