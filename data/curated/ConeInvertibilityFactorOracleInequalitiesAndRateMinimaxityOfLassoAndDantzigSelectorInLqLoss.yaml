id: AIMech:ConeInvertibilityFactorOracleInequalitiesAndRateMinimaxityOfLassoAndDantzigSelectorInLqLoss
name: Cone Invertibility Factor Oracle Inequalities and Rate Minimaxity of LASSO and Dantzig Selector in Lq Loss
concept_kind: mathematical_method
review_status: DRAFT
definition: 'A sharp non-asymptotic Gram-matrix invertibility and minimax estimation framework (introduced by Fei Ye and Cun-Hui Zhang in 2010) that unifies and sharpens $\ell_q$-loss ($1 \le q \le \infty$) oracle inequalities for the LASSO and Dantzig selector across $\ell_0$ and weak/strong $\ell_r$ balls ($0 \le r \le 1$) via the Cone Invertibility Factor (CIF) $F_q(\xi, S) = \inf\left\{\frac{|S|^{1/q}\|\Sigma u\|_\infty}{\|u\|_q} : u \in \mathscr{C}(\xi, S) \setminus \{0\}\right\}$ and the Sign-Restricted Cone Invertibility Factor (SCIF) $SCIF_q(\xi, S) = \inf\left\{\frac{|S|^{1/q}\|\Sigma u\|_\infty}{\|u\|_q} : u \in \mathscr{C}_-(\xi, S) \setminus \{0\}\right\}$ on the sign-restricted cone $\mathscr{C}_-(\xi, S) = \{u : \|u_{S^c}\|_1 \le \xi\|u_S\|_1,\, u_j(\Sigma u)_j \le 0\, \forall j \notin S\}$ ($\Sigma = X^\top X / n$). Because the KKT and Dantzig score-dominance condition $\|z^*\|_\infty \le \eta$ ($z^* = X^\top(y - X\beta^*)/n$) automatically forces the estimation error $\delta = \hat{\beta} - \beta^*$ of both LASSO (with $\xi = (\lambda + \eta)/(\lambda - \eta)$) and the Dantzig selector (with $\xi = (\lambda_D + \eta)/\lambda_D$) into $\mathscr{C}_-(\xi, S)$ while bounding $\|\Sigma\delta\|_\infty \le \lambda + \eta$, SCIF yields the direct single-factor oracle bound $\|\hat{\beta} - \beta^*\|_q \le \frac{(\lambda + \eta)|S|^{1/q}}{SCIF_q(\xi, S)}$ (Theorem 3, Eq. 20) without squaring a restricted eigenvalue or multiplying two separate Gram invertibility constants, and matches the universal design-independent minimax lower bound $R_q^*(\mathscr{B}_r(\rho)) \asymp \rho^{q(1-1/t)}(\sigma^2\log(p/\tau_*)/n)^{q/(2t)}$ ($1/t = 1 - r/q$) across all $0 \le r \le 1 \le q \le \infty$ alongside thresholded LASSO ($\hat{\beta}^{TL}$) and Gauss-Dantzig ($\hat{\beta}^{GD}$) sign consistency under $q = \infty$.'
identity_notes: Resolved against all 442 pinned AIO concepts and 659 maintained AIMech concepts. Distinct from `AIMech:RestrictedEigenvalueConditionAndBickelRitovTsybakovSimultaneousLassoDantzigOracleBounds` (Bickel, Ritov, & Tsybakov 2009, which defines the $\ell_2$ quadratic-form Restricted Eigenvalue $\kappa(s, c_0) = \min_{\delta \in \mathscr{C}(c_0, S)} \|X\delta\|_2 / (\sqrt{n}\|\delta_S\|_2)$ whose $\ell_q$ error bounds scale with $1/\kappa^2$ and an extra $(1+c_0)^{2-2/q}$ factor, whereas Ye & Zhang 2010 introduce the $\ell_\infty$-score-to-$\ell_q$ Cone Invertibility Factor $F_q(\xi, S)$ and Sign-Restricted Cone Invertibility Factor $SCIF_q(\xi, S)$ on $\mathscr{C}_-(\xi, S)$, proving $SCIF_2(\xi, S) \ge \psi(\xi, S)^2 \ge \kappa^2$ and eliminating the two-factor product gap as well as establishing universal design-free minimax lower bounds in $\ell_r$ balls for $0 \le r \le 1 \le q \le \infty$), distinct from `AIMech:CompatibilityConditionAndOracleInequalitiesForLassoInHighDimensionalGeneralizedLinearModels` (van de Geer 2007/2008, which introduces the $\ell_1$ compatibility constant $\phi_{\mathrm{comp}}(S)$ for empirical-process excess risk and $\ell_1$ loss), and distinct from `AIMech:DantzigSelectorLinearProgrammingSparseEstimator` (Candes & Tao 2007, which relies on uniform uncertainty principle / restricted isometry constants $\delta_{2s} + \theta_{s,2s} < 1$).
