claims:
- claim_id: method
  kind: mechanism
  statement: On a finite graph, choose a proper hidden prior p(x)=Z^(-1)*exp(-sum_c V_c(x_c)) and normalized
    site emission laws b_i(y_i|x_i). Their joint law is p(x,y)=p(x)*product_i b_i(y_i|x_i). At fixed observed
    y with positive evidence, p(x|y) is proportional to the same clique prior times the local emission
    factors. Its negative log density is the prior energy plus sum_i[-log b_i(y_i|x_i)] up to a constant,
    preserving the hidden neighborhood graph. A local conditional label update conditions on neighboring
    hidden labels and the local observation. A site posterior marginal instead sums over all other labels
    given the complete observation field. With independent hidden labels and common class weights the
    model reduces to independent finite-mixture observations. MAP estimates a joint labeling. In loopy
    graphs these inference objectives need not admit the exact noniterative recursions available for a
    tree.
