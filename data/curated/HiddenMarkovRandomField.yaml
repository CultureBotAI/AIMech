name: Hidden Markov random field
definition: A latent-variable graphical-model family whose unobserved label field has the Markov property
  on a specified neighborhood graph, with observations conditionally independent across sites given the
  labels and each depending only on its corresponding hidden state.
concept_kind: model_family
identity_notes: 'The classical independent-emission construction specifies a hidden label field X and
  observed field Y, rather than only a generic MRF. It is a restricted hidden–observed pair Markov field:
  its hidden prior must retain the stated graph and its conditional observation law factors by site. A
  chain-shaped hidden graph recovers an ordinary HMM, but general spatial graphs are not subtypes of sequential
  Markov chains. A Gaussian observation distribution does not make the discrete hidden label field a continuous
  Gaussian random field. This model identity is separate from Gibbs sampling, ICM, EM and the paper’s
  HMRF-EM fitting framework. No normalized identity match was found across all 442 pinned AIO labels and
  all scoped synonyms and 394 preceding native IDs, names and aliases for these three concepts. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, yielding 64 and 64 matched
  lines; all 44 unique contents were read. Hits represent neighboring records, citations and discovery
  leads rather than records of these identities. All 97 semantic label/synonym hits were read. Twenty-one
  fully annotated exact CLASS nodes and outgoing edges were verified identical to the preceding inspection,
  and three additional nodes were read. Twenty-eight contextual YAMLs were byte-verified after prior full
  reading and four freshly read, totaling 24 generated and eight native contextual records. Short acronyms
  were included in the complete normalized identity comparison. The absence assessment is bounded to the
  pin, native collection and inspected semantic neighborhood.'
limitations:
- The finite-state Gibbs prior needs a finite positive partition function, and emissions must be normalized
  with valid support. Gaussian emissions require positive variance. Conditional independence is a modeling
  restriction, not a demonstrated property of every image or downsampled observation.
- The report’s Equation(2) gives independence across paired sites for its finite-mixture setup; applying
  that product to an interacting HMRF would discard the defining label dependencies. The later Equation(8)
  and Section2.3 joint factorization specify the supported HMRF model.
- The expanded Gaussian likelihood on PDF p.8 contains a quadratic-sign inconsistency. Equation(18) gives
  the consistent negative log-emission energy. Figure5 step4 adds likelihood and prior although MAP requires
  their product, or a sum of log terms as in Equation(14). These printed algorithm displays are not certified
  implementations.
- The report’s fitted HMRF-EM uses ICM-estimated neighboring labels in local responsibilities. Those plug-in
  responsibilities generally differ from exact full-field posterior marginals. Ideal EM monotonicity and
  exact global MAP are not guaranteed for this approximation. ICM can stop at a local optimum; initialization,
  empty classes and vanishing Gaussian variances require care.
- The bias-field correction framework adds assumptions and alternating updates beyond the generic model.
  A positive multiplicative bias before logarithms and an additive log-bias must be distinguished. No
  clinical validity, universal segmentation advantage, runtime guarantee or author-code reproduction is
  asserted.
- The inspected source is the 20-page FMRIB technical report TR00YZ1, not the later 2001 journal article.
  Its self-description as novel does not establish first invention; earlier hidden-field literature and
  the existing pair-field record supply historical context.
