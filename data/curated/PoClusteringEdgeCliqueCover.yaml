- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: The retained cluster sets form a partial order extending tree-based clustering. The AIO target
    is a related grouping task rather than an identity with this greedy algorithm.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The generic heuristic groups objects from pairwise dissimilarities without class-label supervision.
    Its directional reference-set metric is an evaluation choice.
limitations:
- This is the Liu et al. PoClustering ECC heuristic, not arbitrary edge-clique-cover optimization, exact
  PoClustering, or error-correcting coding.
- The record does not certify a minimum cover, an approximation ratio, order independence or literal pseudocode
  correctness. Coverage preservation requires the stated threshold/diameter information.
- The conference paper’s broader bijection proof and real-data experiments are deferred to an unread technical
  report; no universal lossless-family or biological performance claim is adopted.
- The synthetic generator leaves some details, including the treatment of normally distributed overlap
  probabilities outside [0,1], unspecified. No author code or experimental data were inspected or executed.
- All six pages of the primary 2007 paper were read, including figures, algorithm and references; the
  2006 exact method was read as context. Finite constructed checks are not author implementation runs
  or benchmark replication. This record remains DRAFT.
