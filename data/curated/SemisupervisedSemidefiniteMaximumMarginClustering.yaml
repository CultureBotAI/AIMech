id: AIMech:SemisupervisedSemidefiniteMaximumMarginClustering
name: Semisupervised Semidefinite Maximum Margin Clustering
aliases:
- Xu2004 Semisupervised Maximum Margin Clustering
concept_kind: algorithm
definition: A semisupervised binary margin-learning procedure that adds observed-label pair constraints
  and labeled-to-unlabeled linkage constraints to the Xu2004 semidefinite label-matrix relaxation.
identity_notes: This is the explicit Section5 observed-label extension of Xu-Neufeld-Larson-Schuurmans2004.
  It jointly uses labeled and unlabeled training inputs. The observed-label constraints distinguish it
  from the wholly unlabeled SDP; the record does not represent generic supervised SVM training or every
  transductive SVM solver. Its additional linear constraints define a distinct complete learning procedure;
  a shared margin objective does not equate these methods. Compared all 442 pinned AIO IDs, labels and
  scoped synonyms with all 498 prior native IDs, names and aliases; no normalized identity collision.
  Full searches of both checkouts include ignored and hidden files, returning 57 worktree and 57 main
  matched lines. All 41 distinct matched texts were inspected as multiple-kernel neighbors, bibliographic/query/frontier
  references or their rendered copies. Fifteen annotated AIO nodes and outgoing edges, fifteen generated
  YAMLs and six native neighbors were examined. Thirteen annotated targets, their generated records, all
  442 class labels and 152 semantic rows reuse byte-verified prior readings; two additional annotated
  targets and one new semantic row were read (153 rows total). Absence is bounded to this pin and corpus.
definition_evidence:
- source_id: sdp-source
  locator: Section5, PDF p.6, S1-S2, together with the Section3 SDP on PDF pp.4-5
  relation: supports
claims:
- claim_id: label-matrix-relaxation
  kind: mechanism
  statement: For N observations with fixed PSD kernel matrix K, the hard binary label matrix is M=y*y^T
    with y_i in {-1,+1}. Replace its integer entries by a symmetric PSD matrix with diagonal 1 and entries
    in [-1,1], retaining m_ik>=m_ij+m_jk-1 and m_jk>=-m_ij-m_ik-1 for every triple, and |sum_i m_ij|<=ell
    for every column. The first two linear families preserve constraints satisfied by binary equivalence
    relations; PSD and these constraints do not force rank one after relaxation. In the integer case the
    column bound equals a bound on the difference in class counts; ell<N excludes assigning everything
    to one class, subject to feasibility.
  evidence:
  - source_id: sdp-source
    locator: Section3, PDF pp.3-5, L1-L4 and Equations4-6
    relation: supports
- claim_id: semidefinite-margin-objective
  kind: mechanism
  statement: Minimize over the feasible label matrix M the convex objective max_{0<=lambda_i<=C} [2*sum_i
    lambda_i-lambda^T*(K elementwise M)*lambda], with C>0. The paper equivalent SDP minimizes delta over
    M, delta and nonnegative mu,nu, requiring the block matrix with upper-left K elementwise M, off-diagonal
    1+mu-nu and bottom-right delta-2*C*sum_i nu_i to be PSD. This optimizes a relaxation for a fixed input
    kernel; it does not learn a combination of input kernels. The derivation fixes the classifier intercept
    to zero, which centering does not make identical to freely optimizing an intercept.
  evidence:
  - source_id: sdp-source
    locator: Sections2-3, PDF pp.3-5, Equations3-7
    relation: supports
- claim_id: spectral-recovery-boundary
  kind: limitation
  statement: The stated recovery is the soft vector sqrt(lambda_max(M))*v_max(M), not necessarily a binary
    partition or probabilities. A global SDP solution need not solve the discrete clustering problem.
    The source mentions randomized rounding without specifying a complete rounding policy or balance certificate.
    A feasible convex mixture of three balanced six-point label matrices can have a unique leading eigenvector
    whose signs split the data 4-to-2 despite zero column sums. These matrix constraints therefore do
    not alone guarantee count balance after sign rounding. Eigenvector sign, zero entries and repeated
    top eigenvalues require conventions.
  evidence:
  - source_id: sdp-source
    locator: Section3, PDF p.5 after Equation7 and footnote2; curator exact Gram-mixture example
    relation: supports
- claim_id: soft-margin-normalization
  kind: limitation
  statement: The record uses the displayed dual and SDP convention. The printed Equation3 norm-squared
    primal has slack coefficient C, but its displayed dual bound lambda<=C corresponds to slack coefficient
    2*C under alpha=2*lambda. With two zero-feature observations of opposite labels and C=1, the displayed
    primal optimum is 2 while the printed dual optimum is 4. Thus those displays should not be treated
    as numerically identical with the same C. A soft-margin regularized objective with nonzero slacks
    is also not simply the reciprocal squared geometric margin.
  evidence:
  - source_id: sdp-source
    locator: Section2, PDF pp.2-3, Equations1-3; curator dual-scaling derivation and zero-feature check
    relation: supports
- claim_id: observed-label-constraints
  kind: mechanism
  statement: For n_labeled observed binary labels, fix M_ij=y_i*y_j for every pair of labeled observations.
    For each unlabeled j also require sum_{i labeled} M_ij>=2-n_labeled. In an integer label matrix the
    latter requires each unlabeled observation to share a class with at least one labeled observation.
    Add these linear constraints to the same semidefinite relaxation and margin objective. In the relaxed
    problem they constrain correlations; they do not directly assign a discrete class to each unlabeled
    datum.
  evidence:
  - source_id: sdp-source
    locator: Section5, PDF p.6, S1-S2
    relation: supports
- claim_id: label-orientation-and-decoding
  kind: limitation
  statement: 'Observed label relations fix a labeled block of M, while leading-eigenvector recovery approximates
    M by rank one. The matrix constraints alone do not guarantee usable labeled signs in that vector:
    an exact six-point mixture satisfying the balance and observed-label constraints has a unique leading
    soft vector (0,0,1,1,-1,-1), even though the first two observed labels are opposite. For a zero input
    kernel this feasible M can also be an SDP optimum. Orientation by observed labels therefore needs
    nonzero informative recovered scores or a separate decoding policy. Inconsistent labels or balance
    requirements can make the constrained problem infeasible.'
  evidence:
  - source_id: sdp-source
    locator: Section5, PDF p.6, S1-S2 and Section3 recovery on PDF p.5; curator labeled-block Gram-mixture
      example
    relation: supports
