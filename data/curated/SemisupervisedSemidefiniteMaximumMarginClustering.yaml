limitations:
- The method targets binary clustering with a supplied PSD kernel, penalty and feasible balance constraints,
  and fixes the classifier intercept to zero. The continuous matrix problem is convex; its rounded discrete
  output has no asserted global-optimality or approximation guarantee.
- The formulation maintains an N-by-N label matrix and constraints indexed by triples, in addition to
  conic constraints. Kernel construction, solver tolerances and recovery policies affect cost and results.
  No unconditional linear-time or large-scale efficiency claim is made.
- 'All eight source pages, figures and tables were read. The clustering experiments use selected RBF widths,
  C=100 and majority labels per cluster. The semisupervised experiments are transductive: unlabeled input
  points participate in fitting while their labels are withheld. The finite comparisons do not establish
  universal superiority or inductive generalization. No historical code, benchmark or model training was
  executed.'
