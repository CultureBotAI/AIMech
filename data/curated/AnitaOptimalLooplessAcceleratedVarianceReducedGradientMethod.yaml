id: AIMech:AnitaOptimalLooplessAcceleratedVarianceReducedGradientMethod
name: ANITA Optimal Loopless Accelerated Variance-Reduced Gradient Method
concept_kind: algorithm
review_status: DRAFT
definition: A loopless (single-loop) accelerated variance-reduced gradient method introduced by Li (2021) for solving general convex (mu = 0) and mu-strongly convex (mu > 0) finite-sum optimization problems min_{x in R^d} f(x) = (1/n) sum_{i=1}^n f_i(x). At each iteration t, ANITA computes the first momentum interpolation x_under_t = theta_t x_t + (1 - theta_t) w_t, samples i in [n] uniformly at random to form the SVRG gradient estimator nabla_tilde_t = nabla f_i(x_under_t) - nabla f_i(w_t) + nabla f(w_t), updates x_{t+1} = (1 / (1 + mu eta_t))(x_t + mu eta_t x_under_t) - (eta_t / alpha_t) nabla_tilde_t and the second interpolation x_bar_{t+1} = theta_t x_{t+1} + (1 - theta_t) w_t, and probabilistically refreshes the snapshot point w_{t+1} = x_bar_{t+1} with probability p_t (or retains w_{t+1} = w_t with probability 1 - p_t) using a dynamic multi-stage probability schedule {p_t}.
identity_notes: 'Distinct from double-loop accelerated variance-reduced methods such as Katyusha (Allen-Zhu 2017) and Varag (Lan et al. 2019), and distinct from fixed-probability loopless Katyusha (L-Katyusha, Kovalev et al. 2020, which only handles strongly convex objectives mu > 0 with constant p_t = p): ANITA uses a single-loop structure with a dynamic three-stage snapshot probability schedule {p_t} in the general convex regime (mu = 0), achieving the first optimal O(n) stochastic gradient complexity matching the Woodworth-Srebro Omega(n) lower bound when n >= 1/epsilon^2.'
