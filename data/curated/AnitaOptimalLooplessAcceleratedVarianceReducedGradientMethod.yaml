claims:
- claim_id: anita-dynamic-three-stage-loopless-general-convex-convergence
  kind: mechanism
  statement: 'For L-smooth general convex finite-sum objectives (mu = 0), Theorem 1 sets a three-stage target-error-free schedule: Stage 1 (0 <= t <= t_1, where t_1 ~ Geom(1/(n+1)) is the first snapshot update) uses p_t = 1/(n+1), theta_t = 1 - 1/(2 sqrt(n)), eta_t <= 1/(L(1 + 1/(1 - theta_t))), alpha_t = theta_t; Stages 2 and 3 (t > t_1) set p_t = max{4/(t - t_1 + 3 sqrt(n)), 4/(n + 3)}, theta_t = 2/(p_t(t - t_1 + 3 sqrt(n))), eta_t <= 1/(3L), and alpha_t = theta_t, satisfying the recursion (1 - p_t theta_t) eta_t / (p_t theta_t^2) <= eta_{t-1} / (p_{t-1} theta_{t-1}^2) (Eq. 40) and guaranteeing last-iterate convergence E[f(w_t) - f(x*)] <= 32 ||x_0 - x*||^2 / (eta_{t-1} p_{t-1} (t - t_1 + 3 sqrt(n))^2).'
  evidence:
  - source_id: r570-primary-pdf
    locator: Section 4.1, Theorem 1, Corollary 1 & Remark, pp. 7-8; Appendix A.1, Lemmas 5-7 & Equations (40)-(47), pp. 17-21
    relation: supports
- claim_id: anita-optimal-general-convex-and-large-scale-gradient-complexity
  kind: mechanism
  statement: By Corollary 1 and Table 2, ANITA finds an epsilon-approximate solution E[f(w_T) - f(x*)] <= epsilon in O(n min{1 + log(1/(epsilon sqrt(n))), log sqrt(n)} + sqrt(n L / epsilon)) stochastic gradient computations without requiring epsilon in advance, achieving the exact optimal O(n + sqrt(n L / epsilon)) complexity matching the Woodworth-Srebro lower bound Omega(n + sqrt(n L / epsilon)) for both large-scale problems (n >= 1/epsilon^2, where complexity is O(n)) and small-error regimes (epsilon <= L / (n log^2 sqrt(n))).
  evidence:
  - source_id: r570-primary-pdf
    locator: Section 2, Tables 1-2, pp. 3-5; Section 4.1, Corollary 1, pp. 7-8; Appendix A.1.2, Equations (48)-(54), pp. 21-22
    relation: supports
- claim_id: anita-strongly-convex-constant-parameter-optimal-linear-rate
  kind: scope
  statement: For L-smooth mu-strongly convex finite-sum objectives (mu > 0), Theorem 2 uses constant parameters p_t = p = 1/n, theta_t = theta = (1/2) min{1, sqrt(mu / (p L))}, eta_t = eta <= 1 / (L theta (1 + 1/(1 - theta))), and alpha_t = 1 + mu eta, proving that the Lyapunov function Phi_t := f(w_t) - f(x*) + ((1 + mu eta) p theta / (2 eta)) ||x_t - x*||^2 contracts as E[Phi_t] <= (1 - 4 p theta / 5)^t Phi_0 and achieves optimal O(max{n, sqrt(n L / mu)} log(1/epsilon)) stochastic gradient complexity (Corollary 2).
  evidence:
  - source_id: r570-primary-pdf
    locator: Section 4.2, Theorem 2 & Corollary 2, pp. 8-9; Appendix A.2, Lemma 8 & Equations (55)-(59), pp. 22-23
    relation: supports
- claim_id: anita-intermediate-error-logarithmic-gap-and-full-snapshot-limitation
  kind: limitation
  statement: In the intermediate error regime 1/sqrt(n) > epsilon > L / (n log^2 sqrt(n)), ANITA's general convex complexity O(n min{1 + log(1/(epsilon sqrt(n))), log sqrt(n)}) retains a logarithmic factor up to log sqrt(n) above the Omega(n + sqrt(n L / epsilon)) lower bound (Table 2), and every probabilistic snapshot update w_{t+1} = x_bar_{t+1} requires a full gradient evaluation nabla f(w_{t+1}) over all n components.
  evidence:
  - source_id: r570-primary-pdf
    locator: Section 2, Table 2 & Section 2.1, pp. 4-6
    relation: supports
