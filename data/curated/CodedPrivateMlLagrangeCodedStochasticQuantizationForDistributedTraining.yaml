claims:
- claim_id: codedprivateml-independent-stochastic-weight-quantization-and-lagrange-encoding-mechanism
  kind: mechanism
  statement: At each training iteration t, the master generates r independent unbiased stochastic quantizations w_bar^(t),j = Q_j(w^(t); l_w) in F_p^d so that the multilinear polynomial evaluation s_bar(X_bar, W_bar^(t)) = sum_{i=0}^r c_i prod_{j <= i} (X_bar * w_bar^(t),j) is an exact unbiased estimator E[s_bar(X_bar, W_bar^(t))] = s_hat(X_bar * w^(t)) of the degree-r sigmoid polynomial, encodes both the K data blocks X_bar_k and W_bar^(t) with T uniform random masks over F_p via degree-(K + T - 1) Lagrange polynomials, and recovers the exact sub-gradient sum_{k=1}^K X_bar_k^T s_bar(X_bar_k, W_bar^(t)) via polynomial interpolation from any (2*r + 1)*(K + T - 1) + 1 worker evaluations.
  evidence:
  - source_id: r550-primary-pdf
    locator: Section III-A..D Equations (3)-(24) & Algorithm 1, pp. 3-6
    relation: supports
- claim_id: codedprivateml-information-theoretic-privacy-and-convergence-scope
  kind: scope
  statement: For any N >= (2*r + 1)*(K + T - 1) + 1 workers and constant step size eta = 1/L, CodedPrivateML guarantees strictly zero mutual-information leakage I(X; X_tilde_T, {W_tilde_T^(t)}_{t in [J]}) = 0 against any subset T of at most T colluding workers while converging at rate O(1/J) up to a quantization variance floor eta * sigma^2 <= eta * ||X_bar||_F^2 / (2^(-2*l_w) * m^2).
  evidence:
  - source_id: r550-primary-pdf
    locator: Section IV Theoretical Results, Lemma 1-2 & Theorem 1, pp. 6-7, 12-14
    relation: supports
- claim_id: codedprivateml-prime-modulus-overflow-and-worker-threshold-limitation
  kind: limitation
  statement: Requires the prime field modulus p to satisfy d*(p - 1)^2 <= 2^64 - 1 and p >= 2^(l_x + 1 + r*(l_x + l_w)) to prevent modular wrap-around overflow during degree-(2*r + 1) polynomial evaluation, and requires at least N >= (2*r + 1)*(K + T - 1) + 1 workers, which scales linearly with the polynomial approximation degree r.
  evidence:
  - source_id: r550-primary-pdf
    locator: Section III-A Quantization, Section IV Theorem 1, & Section VI Conclusion, pp. 4, 6, 9
    relation: supports
- claim_id: codedprivateml-cloud-distributed-logistic-regression-application
  kind: application
  statement: Applied to privacy-preserving distributed logistic and linear regression training across up to N = 50 cloud workers on CIFAR-10 and GISETTE, achieving 4.4x to 22.5x training speedups over Shamir-secret-sharing MPC protocols (BGW and BH08).
  evidence:
  - source_id: r550-primary-pdf
    locator: Section V Experiments, Table II & Figures 3-5, pp. 7-9
    relation: supports
