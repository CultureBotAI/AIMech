aio_mappings:
- target: AIO:LogisticRegression
  relation: related_match
  rationale: AIO:LogisticRegression denotes the statistical classification model, whereas CodedPrivateML is an information-theoretically private Lagrange-coded distributed gradient-descent protocol with multi-column stochastic weight quantization for training logistic and linear regression models.
- target: AIO:FederatedLearning
  relation: related_match
  rationale: AIO:FederatedLearning covers collaborative distributed training, whereas CodedPrivateML offloads Lagrange-coded finite-field sub-gradient computations to untrusted cloud workers with T-colluding information-theoretic privacy.
limitations:
- Restricted to polynomial loss gradients or polynomial activation approximations (such as least-squares polynomial approximations of the sigmoid).
- Quantization precision parameters (l_x, l_w) are constrained by finite-field modulus p to avoid modular wrap-around overflow.
