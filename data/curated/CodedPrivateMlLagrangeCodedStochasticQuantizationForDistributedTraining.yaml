id: AIMech:CodedPrivateMlLagrangeCodedStochasticQuantizationForDistributedTraining
name: CodedPrivateML Lagrange-Coded Stochastic Quantization for Distributed Training
concept_kind: algorithm
review_status: DRAFT
definition: A privacy-preserving distributed gradient-descent training protocol (CodedPrivateML) that deterministically quantizes a training dataset X in R^(m x d) into a prime finite field F_p, generates r independent unbiased stochastic quantizations W_bar^(t) = [w_bar^(t),1, ..., w_bar^(t),r] of the model weight vector w^(t) at each iteration t to evaluate a degree-r polynomial approximation of the logistic sigmoid without quantization-product bias, encodes the K dataset partitions and quantized weights with T uniform random finite-field masks via Lagrange interpolation polynomials, and decodes the exact sub-gradient over F_p from any (2*r + 1)*(K + T - 1) + 1 workers while guaranteeing zero mutual-information leakage I(X; X_tilde_T, {W_tilde_T^(t)}) = 0 against any T colluding workers.
identity_notes: Introduced by Jinhyun So, Basak Guler, and A. Salman Avestimehr (IEEE Journal on Selected Areas in Information Theory, Vol. 2, No. 1, pp. 441-451, 2021; arXiv:1902.00641). Distinct from general Lagrange Coded Computing (Yu et al., AISTATS 2019, Round 536), which is a one-shot finite-field polynomial evaluation primitive that does not include multi-column independent stochastic weight quantization W_bar^(t) = [w_bar^(t),1, ..., w_bar^(t),r] or unbiased polynomial sigmoid gradient updates; and distinct from Analog Lagrange Coded Computing (Soleymani et al., IEEE JSAIT 2021, Round 548), which operates over complex floating-point roots of unity with Gaussian masks rather than prime finite fields F_p with stochastic rounding.
aliases:
- CodedPrivateML
- Coded Privacy-Preserving Machine Learning
- CodedPrivateML Distributed Logistic Regression Protocol
