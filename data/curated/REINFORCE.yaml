name: REINFORCE
definition: A family of stochastic reinforcement-learning update rules that multiply a sampled reward
  relative to an admissible baseline by the derivative of the log probability of the sampled action or
  unit output, with a nonnegative learning-rate factor.
concept_kind: algorithm
identity_notes: 'This record covers Williams’s REINFORCE update family, including its basic immediate-reward
  rule and the stated fixed-episode extension. The characteristic eligibility is a score-function derivative.
  This is not the entire reinforcement-learning task, an action-value bootstrapping rule, PPO’s clipped
  surrogate, a generic optimizer, or every estimator that uses random perturbations. The acronym names
  the update structure; no trained policy instance is represented. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 334 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 66 and 66 lines
  respectively. Match-centered excerpts from all 41 unique hit contents were inspected: ordinary verb
  reinforce in existing ant/search/pseudo-label records and calculations, plus neighboring Gumbel straight-through
  discussions and the new gradient-estimator discovery lead, not existing candidate records. Exact checkout
  counts and differences are retained in the ledger. Ten exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- The score identity requires valid differentiable probabilities or densities and conditions permitting
  differentiation of the expectation. Parameter-dependent support or extra direct reward dependence requires
  additional analysis; a discrete black-box reward need not itself have a derivative with respect to the
  action.
- A baseline that depends on the same sampled action or its current reward does not automatically preserve
  the unbiased score identity. An input-dependent baseline or a statistic based on past trials can satisfy
  the stated conditional-independence requirement.
- Baseline choice changes variance and can increase it. The mean reward is not generally the minimum-variance
  baseline, and low variance is not guaranteed simply by naming a baseline.
- Expected gradient alignment is not monotonic improvement of each sampled update, a global optimum guarantee,
  or a convergence theorem for arbitrary step sizes. Zero coordinate rates can prevent movement even at
  a nonzero gradient.
- The original episodic construction assumes a declared finite episode and parameters fixed throughout
  it. It is not a blanket justification for arbitrary online bootstrapping, truncation, discounting, off-policy
  sample reuse or action-dependent baselines.
- The primary journal paper was read through a public third-party copy and checked against publisher metadata.
  Only the declared method pages were inspected; its full proof appendix and empirical literature were
  not independently audited.
