claims:
- claim_id: method
  kind: mechanism
  statement: For a stochastic unit with conditional mass or density g_i(y_i;w_i,x_i), sample its output
    y_i, receive scalar reinforcement r and update weight w_ij by alpha_ij*(r-b_ij)*d log(g_i)/d w_ij.
    The baseline b_ij is conditionally independent of the current unit output given the weights and unit
    inputs; it may depend on permitted input context or past experience. In the original immediate-reward
    formulation, the nonnegative rate factor may depend at most on the unit’s parameter vector and trial
    index; it is not chosen from the current sampled output. Under the stated differentiability and environmental
    assumptions, the baseline-centered score product estimates the corresponding expected-reward gradient
    component. A common scalar rate gives an expected update proportional to that gradient; differing
    nonnegative coordinate rates generally rescale its components and need not preserve collinearity.
    For a Bernoulli-logistic unit with probability p and input x_j, the eligibility is (y-p)*x_j. In the
    fixed-length episodic extension, hold parameters fixed during the episode, sum each parameter’s score
    eligibilities over time, and multiply that sum by terminal reward minus an admissible episode baseline
    when updating at the end.
  evidence:
  - source_id: method-source
    locator: Sections 2–4, PDF pp.2–8 / journal pp.230–236, especially Theorem 1 and Equations (5)–(10);
      Section 5, PDF pp.8–9 / journal pp.236–237, Equation (11) and Theorem 2
    relation: supports
- claim_id: baseline-timing
  kind: scope
  statement: Williams’s reinforcement-comparison example computes the reward baseline from past experience
    and explicitly excludes the current output or current reward from its computation. The expected-update
    theorem distinguishes a common scalar step size from nonnegative coordinate-dependent rates.
  evidence:
  - source_id: method-source
    locator: Section 4, PDF pp.6 and 8 / journal pp.234 and 236, Theorem 1 and Equations (9)–(10)
    relation: supports
- claim_id: baseline-variance
  kind: limitation
  statement: For the Bernoulli-logistic score h-p, Bengio and colleagues derive the variance-minimizing
    constant baseline as the score-squared-weighted mean of the loss, rather than its ordinary mean. This
    is a minimum within the specified constant-baseline family, not among all possible gradient estimators.
  evidence:
  - source_id: bernoulli-baseline-source
    locator: Section 3, Corollary 1, Equation (10) and proof, PDF/printed pp.6–7
    relation: supports
