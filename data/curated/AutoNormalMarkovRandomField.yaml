name: Auto-normal Markov random field
definition: A proper finite Gaussian Markov-field model specified by linear full-conditional means and
  positive, value-independent site conditional variances, with compatibility enforced by a symmetric positive-definite
  joint precision matrix.
concept_kind: model_family
identity_notes: 'The record is scoped to the proper finite auto-normal construction. It is a Gaussian
  conditional-autoregressive representation of a multivariate normal law with a specified conditional-dependence
  graph. Intrinsic improper Gaussian fields and infinite-lattice extensions require separate existence
  or constraint conditions and are not exact aliases here. Spatial conditional autoregression is not temporal
  autoregression and is not the simultaneous autoregressive model obtained by treating the same local
  residual equations as independent noise equations. Gaussian-process regression conditions a process
  prior on training observations for prediction; this record specifies the finite graphical joint law
  itself. It can be used as a prior but does not inherently introduce hidden labels or independent observation
  emissions. No normalized identity match was found across all 442 pinned AIO labels and all scoped synonyms
  and 400 preceding native IDs, names and aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, yielding 35 and 35 matched lines; all 23 unique contents were
  read. Hits are citations, contextual statements and discovery leads rather than records of these identities.
  All 182 semantic label/synonym hits were read. Thirty-one fully annotated exact CLASS nodes and outgoing
  edges were inspected: 23 byte-equivalent to prior inspected nodes and eight freshly read. Thirty-nine
  contextual YAMLs comprise 31 generated and eight native records: 29 byte-verified after prior reading
  and 10 freshly read. Short acronyms were included in the normalized identity comparison. Absence is
  bounded to the pinned snapshot, maintained corpus and inspected semantic neighborhood.'
limitations:
- Every site conditional can be individually normalized while the proposed collection fails to define
  a proper joint law. Weighted symmetry and positive definiteness must both hold. With unequal conditional
  variances, raw beta coefficients need not be symmetric.
- A singular precision can describe an intrinsic improper construction only with additional interpretation
  or constraints; it is not the ordinary normalized Gaussian density stated here. An indefinite precision
  gives a nonintegrable quadratic model. Positive diagonal entries alone are insufficient.
- Finite-graph eigenvalue bounds depend on the actual graph and boundary conditions. Infinite-lattice
  stationarity criteria are not automatically necessary finite-graph conditions. The source’s stationary
  or homogeneous examples do not require every finite auto-normal model to share those assumptions.
- Missing precision edges encode conditional independence, not marginal independence or causal effects.
  A sparse simultaneous-equation matrix can induce additional precision edges.
- Unconstrained conditional least-squares, coding-likelihood or pseudolikelihood estimates may leave the
  proper joint parameter domain. The Gaussian fitting objective and parameter identifiability depend on
  the specified mean, graph and interaction parameterization; existence of a covariance representation
  does not ensure identifiable scientific parameters.
- The source’s wheat and plant examples expose aggregation, nonstationarity and model-fit concerns; a
  fitted Gaussian field does not establish a causal spatial mechanism or universal predictive adequacy.
  The record does not certify source implementations, empirical fits or infinite-system convergence.
