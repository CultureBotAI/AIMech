claims:
- claim_id: method
  kind: mechanism
  statement: For site i, specify X_i given all other sites as normal with mean mu_i+sum_(j!=i) beta_ij*(x_j-mu_j)
    and variance v_i>0 independent of the conditioning values. Let B have diagonal 1 and off-diagonal
    -beta_ij, and let Lambda=diag(v_i). These conditionals define the proper finite joint model when Q=Lambda^(-1)*B
    is symmetric positive definite. Symmetry requires beta_ij*v_j=beta_ji*v_i. The joint law is N(mu,Q^(-1)),
    with density proportional to |Q|^(1/2)*exp[-(x-mu)^T Q(x-mu)/2]. A zero off-diagonal precision entry
    denotes conditional independence given the other sites; marginal covariance need not vanish. With
    common v_i=sigma^2, compatibility reduces to symmetric positive-definite B and covariance sigma^2*B^(-1).
    In contrast, the simultaneous equations B*(X-mu)=epsilon with independent epsilon~N(0,Lambda) imply
    covariance B^(-1)*Lambda*B^(-T) and precision B^T*Lambda^(-1)*B. For the proper conditional model,
    a factorization Q=C^T*C allows exact Gaussian sampling as mu+C^(-1)*z with independent standard-normal
    z.
