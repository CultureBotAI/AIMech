claims:
- claim_id: claim-rank-two-l1-isometry-concentration-for-symmetric-hermitian-matrices
  kind: mechanism
  statement: "For any unit-Frobenius-norm Hermitian rank-2 matrix $\\boldsymbol{X} = \\lambda_1\\boldsymbol{u}_1\\boldsymbol{u}_1^* + \\lambda_2\\boldsymbol{u}_2\\boldsymbol{u}_2^*$ ($\\lambda_1^2 + \\lambda_2^2 = 1$), Lemmas 3.1 and 3.2 prove that under uniform spherical or Gaussian sensing vectors $\\boldsymbol{a}_k$, the expected $\\ell_1$ measurement energy $\\mathbb{E}|\\langle\\boldsymbol{a}_k\\boldsymbol{a}_k^*, \\boldsymbol{X}\\rangle|$ satisfies the exact closed-form bounds $\\min_{t\\in[0,1]} f_{\\mathbb{R}}(t) \\approx 0.941 \\le n\\mathbb{E}|\\langle\\boldsymbol{a}_k\\boldsymbol{a}_k^*, \\boldsymbol{X}\\rangle| \\le \\sqrt{2}$ in the real case and $2(\\sqrt{2}-1) \\approx 0.8284 \\le n\\mathbb{E}|\\langle\\boldsymbol{a}_k\\boldsymbol{a}_k^*, \\boldsymbol{X}\\rangle| \\le 1$ in the complex case, yielding uniform $\\ell_1$-isometry over all rank-at-most-2 perturbations $\\boldsymbol{H}$ once $m \\ge c_0 n$ (Section 3.1, Lemmas 3.1\u20133.3)."
  evidence:
  - source_id: csv2013-phaselift-pdf
    locator: Section 3.1 (Lemmas 3.1, 3.2, and 3.3, pp. 14-18)
    relation: supports
- claim_id: claim-inexact-dual-certificate-from-fourth-moment-operator-inversion
  kind: mechanism
  statement: "Using the fourth-moment operator $\\mathcal{S}(\\boldsymbol{X}) = \\mathbb{E}[(\\boldsymbol{z}^*\\boldsymbol{X}\\boldsymbol{z})\\boldsymbol{z}\\boldsymbol{z}^*]$, which evaluates to $\\boldsymbol{X} + \\mathrm{Tr}(\\boldsymbol{X})\\boldsymbol{I}$ with inverse $\\mathcal{S}^{-1}(\\boldsymbol{X}) = \\boldsymbol{X} - \\frac{1}{n+1}\\mathrm{Tr}(\\boldsymbol{X})\\boldsymbol{I}$ in the complex case and $2\\boldsymbol{X} + \\mathrm{Tr}(\\boldsymbol{X})\\boldsymbol{I}$ with inverse $\\frac{1}{2}(\\boldsymbol{X} - \\frac{1}{n+2}\\mathrm{Tr}(\\boldsymbol{X})\\boldsymbol{I})$ in the real case, Section 3.2 constructs the truncated dual certificate $\\boldsymbol{Y} = \\frac{1}{m}\\sum_{k=1}^m [n(n+1)|z_{k,1}|^2\\mathbb{I}_{\\{|z_{k,1}|\\le \\sqrt{2\\beta\\log n}\\}} - (n+1)]\\boldsymbol{z}_k\\boldsymbol{z}_k^*$ satisfying $\\|\\boldsymbol{Y}_T\\|_F \\le 1/5$ and $\\boldsymbol{Y}_{T^\\perp} \\preceq -\\frac{1}{2}\\boldsymbol{I}_{T^\\perp}$ with probability at least $1 - O(n^{-2})$ for $m \\ge c_0 n\\log n$ (Section 3.2, Lemmas 3.4\u20133.6)."
  evidence:
  - source_id: csv2013-phaselift-pdf
    locator: Section 3.2 (Eqs. 3.11-3.17, Lemmas 3.4, 3.5, and 3.6, pp. 18-23)
    relation: supports
- claim_id: claim-exact-and-noise-stable-phaselift-recovery-via-trace-minimization
  kind: application
  statement: Combining the rank-2 $\ell_1$ covariance lower bound on $T$ with the dual certificate negativity on $T^\perp$, Theorems 1.1 and 1.2 prove that for any real or complex signal $\boldsymbol{x}_0$ and noisy quadratic observations $b_k = |\langle\boldsymbol{a}_k,\boldsymbol{x}_0\rangle|^2 + w_k$ with $\|\boldsymbol{w}\|_1 \le \varepsilon$, the solution $\widehat{\boldsymbol{X}}$ of the convex SDP $\min_{\boldsymbol{X}\succeq\boldsymbol{0}}\mathrm{Tr}(\boldsymbol{X})$ subject to $\|\mathcal{A}(\boldsymbol{X}) - \boldsymbol{b}\|_1 \le \varepsilon$ satisfies $\|\widehat{\boldsymbol{X}} - \boldsymbol{x}_0\boldsymbol{x}_0^*\|_F \le C_0 \varepsilon / m$, and its leading eigenvector $\widehat{\boldsymbol{x}}$ scaled by $\sqrt{\lambda_1(\widehat{\boldsymbol{X}})}$ obeys $\|\widehat{\boldsymbol{x}} - e^{i\phi}\boldsymbol{x}_0\|_2 \le C_0\min(\|\boldsymbol{x}_0\|_2, \frac{\varepsilon}{m\|\boldsymbol{x}_0\|_2})$ (Section 1.3, Theorems 1.1 and 1.2; Section 3.3, Proof of Theorem 1.2).
  evidence:
  - source_id: csv2013-phaselift-pdf
    locator: Section 1.3 (Theorems 1.1-1.2, pp. 5-7), Section 3.3 (pp. 23-25)
    relation: supports
