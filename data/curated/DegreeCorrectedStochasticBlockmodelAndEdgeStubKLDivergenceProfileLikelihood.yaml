claims:
- claim_id: poisson-multigraph-degree-corrected-likelihood-closed-form-mles-and-exact-degree-preservation
  kind: mechanism
  statement: In an $n$-vertex undirected multigraph $G$ with adjacency matrix $A_{ij}$ (where $A_{ii}$ is twice the number of self-edges at vertex $i$), group assignments $g_i \in \{1, \dots, K\}$, symmetric group affinity matrix $\omega_{rs}$, and vertex degree parameters $\theta_i$ normalized within each community via $\sum_i \theta_i \delta_{g_i, r} = 1$ (Eq. 15), modeling off-diagonal edge counts as independent $\operatorname{Poisson}(\theta_i \theta_j \omega_{g_i g_j})$ and self-edge counts as $\operatorname{Poisson}(\frac{1}{2}\theta_i^2 \omega_{g_i g_i})$ yields the factorized graph probability $P(G \mid \theta, \omega, g) = \frac{1}{\prod_{i<j} A_{ij}! \prod_i 2^{A_{ii}/2} (A_{ii}/2)!} \prod_i \theta_i^{k_i} \prod_{rs} \omega_{rs}^{m_{rs}/2}\exp(-\frac{1}{2}\omega_{rs})$ (Eqs. 14, 16). Maximizing $\log P(G \mid \theta, \omega, g) = 2\sum_i k_i \log \theta_i + \sum_{rs}(m_{rs}\log \omega_{rs} - \omega_{rs})$ (Eq. 17) subject to Eq. (15) gives the closed-form maximum-likelihood estimates $\hat{\theta}_i = \frac{k_i}{\kappa_{g_i}}$ and $\hat{\omega}_{rs} = m_{rs}$ where $\kappa_r = \sum_s m_{rs} = \sum_i k_i \delta_{g_i, r}$ is the total number of stubs in group $r$ (Eqs. 12, 18), under which the fitted ensemble preserves both expected inter-group edges $\sum_{ij} \langle A_{ij}\rangle \delta_{g_i, r}\delta_{g_j, s} = m_{rs}$ (Eq. 19) and every vertex's expected degree $\sum_j \langle A_{ij}\rangle = k_i$ (Eq. 20), whereas the uncorrected stochastic blockmodel $\hat{\omega}_{rs} = m_{rs}/(n_r n_s)$ (Eq. 5) assigns every vertex in group $r$ the uniform expected degree $\kappa_r / n_r$.
  evidence:
  - source_id: kn2011-dcsbm-pdf
    locator: Section II, pp. 2-3, Equations (1)-(5); Section III, p. 4, Equations (14)-(20)
    relation: supports
- claim_id: edge-stub-kullback-leibler-divergence-profile-log-likelihood-and-local-vertex-move-identity
  kind: mechanism
  statement: Substituting the closed-form MLEs $(\hat{\theta}_i, \hat{\omega}_{rs})$ into Eq. (17) and dropping assignment-independent constants $2\sum_i k_i \log k_i - 2m$ (Eqs. 21-22) yields the unnormalized profile log-likelihood $\mathcal{L}_{\text{DC}}(G \mid g) = \sum_{r,s=1}^K m_{rs} \log \frac{m_{rs}}{\kappa_r \kappa_s}$ (Eq. 23), which replaces the vertex counts $n_r n_s$ of the uncorrected SBM objective $\mathcal{L}_{\text{SBM}}(G \mid g) = \sum_{r,s} m_{rs} \log \frac{m_{rs}}{n_r n_s}$ (Eq. 6) with stub counts $\kappa_r \kappa_s$ and is affine-equivalent to the Kullback-Leibler divergence $\sum_{r,s} p_K(r,s)\log \frac{p_K(r,s)}{p_{\text{degree}}(r,s)}$ (and mutual information) between empirical edge-end group probabilities $p_K(r,s) = m_{rs}/(2m)$ and the degree-preserving configuration-model null $p_{\text{degree}}(r,s) = \frac{\kappa_r}{2m}\frac{\kappa_s}{2m}$ (Eqs. 11, 24). Moving a single vertex $i$ (with self-edge count $u_i = A_{ii}/2$ and non-self edge counts $k_{it}$ to group $t$) from group $r$ to group $s$ updates only $\kappa_r, \kappa_s, m_{rt}, m_{st}$, allowing $\Delta \mathcal{L}$ to be evaluated in $O(K + \langle k\rangle)$ average time via Eq. (25) within a Kernighan-Lin-style greedy sweep algorithm (Section III, pp. 5-6).
  evidence:
  - source_id: kn2011-dcsbm-pdf
    locator: Section II, p. 3, Equations (6)-(13); Section III, pp. 4-6, Equations (21)-(25)
    relation: supports
  - source_id: kn2011-dcsbm-abs
    locator: Abstract
    relation: supports
- claim_id: degree-split-distortion-in-uncorrected-sbm-versus-degree-corrected-recovery-on-heterogeneous-networks
  kind: scope
  statement: In networks with broad or bimodal degree distributions, the uncorrected SBM objective $\mathcal{L}_{\text{SBM}}$ fits degree variation $P_{ij} \propto k_i k_j$ by partitioning vertices into high-degree and low-degree groups whenever the degree-split likelihood exceeds the community-split likelihood, failing on empirical heterogeneous graphs (splitting Zachary's karate club into high- and low-degree groups and achieving $\operatorname{NMI} = 0.0001$ vs. $0.72$ for DC-SBM on the 1222-vertex political blogs network, Section IV.A, Figs. 1-2, pp. 6-7) and failing on two-group bimodal-degree synthetic benchmarks $\omega_{rs} = \lambda \omega_{rs}^{\text{planted}} + (1 - \lambda) \frac{\kappa_r \kappa_s}{2m}$ (Eqs. 27-28, degrees 10 and 30) for all $\lambda \lesssim 0.6$ even when initialized at the true planted assignment (whereas DC-SBM achieves $\operatorname{NMI} > 0.7$ at $\lambda = 0.5$ from both random and planted initializations, Section IV.C, Fig. 3, pp. 8-9).
  evidence:
  - source_id: kn2011-dcsbm-pdf
    locator: Section IV, pp. 6-9, Equations (26)-(30), Figures 1-3
    relation: supports
