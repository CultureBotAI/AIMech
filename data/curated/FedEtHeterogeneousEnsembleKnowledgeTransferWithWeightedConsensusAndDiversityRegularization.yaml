claims:
- claim_id: r492-claim-1
  kind: mechanism
  statement: 'Fed-ET weights each client k''s soft prediction s(w_k^{(t,tau)}, x) on unlabeled server sample x in P by its normalized intra-logit variance alpha_k^{(t,tau)}(x) = sigma_s^2(w_k^{(t,tau)}, x) / sum_{l in S^{(t,0)}} sigma_s^2(w_l^{(t,tau)}, x) to derive consensus pseudo-label y_s^{(t,tau)}(x) (Equations 2-4), while regularizing the large server model w_bar with lambda KL(s_{div}^{(t,tau)}(x), s(w_bar, x)) computed over the dissenting client subset S_{div}^{(t,0)}(x) = {l in S^{(t,0)} : y_s^{(t,tau)}(x) != argmax s(w_l^{(t,tau)}, x)} and exchanging a shared u-dimensional representation layer h_bar bidirectionally between w_bar and the small models in M (Equations 6-12, Algorithm 1).'
  evidence:
  - source_id: r492-primary-pdf
    locator: Section 3.2, pp. 3-5, Equations 1-12, Algorithm 1
    relation: supports
- claim_id: r492-claim-2
  kind: mechanism
  statement: Theorem 1 (Section 3.3, Equation 13; Appendix A, Lemmas 1-2) bounds the target-distribution risk of any convex ensemble sum_{i=1}^K alpha_i h_{D_hat_i} with probability at least 1 - delta by L_D(sum_{i=1}^K alpha_i h_{D_hat_i}) <= sum_{i=1}^K alpha_i L_{D_hat_i}(h_{D_hat_i}) + sqrt(log delta^{-1}) sum_{i=1}^K (alpha_i / sqrt(|B_i|)) + (1/2) sum_{i=1}^K alpha_i d(D_i, D) + sum_{i=1}^K alpha_i nu_i, motivating confidence-weighted down-weighting of high-discrepancy non-expert clients and size-proportional client sampling.
  evidence:
  - source_id: r492-primary-pdf
    locator: Section 3.3, p. 5, Equation 13, Theorem 1; Appendix A, p. 8, Equations 14-19
    relation: supports
- claim_id: r492-claim-3
  kind: limitation
  statement: Fed-ET requires an unlabeled public dataset P at the server and requires all heterogeneous client architectures and the server model to share a representation layer h_i in R^u of identical dimension u prior to the classification layer, and an overly large diversity weight lambda can degrade accuracy when dissenting clients are noisy.
  evidence:
  - source_id: r492-primary-pdf
    locator: Sections 3.1 & 4, pp. 3 & 6, Table 4
    relation: supports
- claim_id: r492-claim-4
  kind: application
  statement: Applied to heterogeneous client pools (CNN, ResNet8, ResNet18 training a VGG19 server model on Dirichlet-partitioned CIFAR-10 and CIFAR-100; Tiny-BERT and LSTM training a Mini-BERT server model on Sent140), achieving higher accuracy and ~3x lower parameter communication cost than homogeneous and KD baselines under high data heterogeneity (alpha = 0.1).
  evidence:
  - source_id: r492-primary-pdf
    locator: Section 4, pp. 5-6, Tables 2-4; Appendix B-C, pp. 8-9, Tables 5-6
    relation: supports
