id: AIMech:LTSFTLotteryTicketSparseFineTuning
name: Lottery Ticket Sparse Fine-Tuning
concept_kind: algorithm
review_status: DRAFT
definition: A modular two-phase sparse fine-tuning algorithm for pretrained language models inspired by the Lottery Ticket Hypothesis that first performs full fine-tuning from pretrained parameters theta^(0) on task or language data to obtain theta^(1) and selects a binary mask mu over the K parameters with greatest absolute deviation |theta_i^(1) - theta_i^(0)|, then resets the model to its original pretrained initialization theta^(0) (without zeroing unselected weights) and re-trains only the masked parameters via masked gradients mu odot nabla_theta L to produce a sparse difference vector phi = theta^(2) - theta^(0) that can be composed additively across languages and tasks as F(.; theta^(0) + phi_T + phi_L) without modifying model architecture or increasing inference cost.
identity_notes: Introduced by Alan Ansell, Edoardo Maria Ponti, Anna Korhonen, and Ivan Vulic (ACL 2022, pp. 1778-1796, arXiv:2110.07560) as Lottery Ticket Sparse Fine-Tuning (LT-SFT). Distinct from DiffPruning (AIMech:DiffPruning), which learns continuous L0-relaxed binary masks end-to-end in a single training phase; from FISH Mask (AIMech:FISHMask), which selects sparse masks before training using empirical Fisher information without Phase-1 magnitude-change selection and rewinding; and from MAD-X / AdapterFusion (AIMech:AdapterFusion), which insert serial bottleneck adapter layers that increase inference latency.
aliases:
- LT-SFT
- Composable Lottery-Ticket Sparse Fine-Tuning
- Composable Sparse Fine-Tuning for Cross-Lingual Transfer
