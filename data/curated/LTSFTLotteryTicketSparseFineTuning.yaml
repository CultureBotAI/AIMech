claims:
- claim_id: ltsft-two-phase-rewinding-and-sparse-difference-vector
  kind: mechanism
  statement: In Phase 1, LT-SFT fully fine-tunes pretrained parameters theta^(0) on dataset D (optionally with L1 regularization J(theta) = (lambda/N) sum_i |theta_i - theta_i^(0)|) to obtain theta^(1) and sets a binary mask mu_i = 1 for the top-K parameters ranked by |theta_i^(1) - theta_i^(0)|; in Phase 2, it resets parameters to theta^(0) without zeroing frozen weights and applies masked gradient updates mu odot nabla_theta L(F(.; theta), D) to obtain theta^(2) and sparse difference vector phi = theta^(2) - theta^(0).
  evidence:
  - source_id: r710-primary-pdf
    locator: Section 3.1 & Algorithm 1, pp. 3-4, 15
    relation: supports
- claim_id: ltsft-zero-shot-cross-lingual-functional-composition
  kind: mechanism
  statement: For zero-shot cross-lingual transfer from source language s to target language l on task t, LT-SFT learns language SFTs phi_L^(s) and phi_L^(l) via masked language modeling on theta^(0), learns task SFT phi_T^(t) = theta' - (theta^(0) + phi_L^(s)) by running LT-SFT atop source-adapted parameters theta^(0) + phi_L^(s) and subtracting phi_L^(s), and composes them at inference as F_{t,l} = F(.; theta^(0) + phi_T^(t) + phi_L^(l)) with zero additional parameters or latency.
  evidence:
  - source_id: r710-primary-pdf
    locator: Section 3.1-3.2 & Algorithm 1, pp. 4, 15
    relation: supports
- claim_id: ltsft-multilingual-pos-dp-ner-nli-and-xquad-transfer
  kind: application
  statement: Evaluated across 35 typologically diverse languages on Universal Dependencies POS tagging and dependency parsing, MasakhaNER, and AmericasNLI, LT-SFT outperforms MAD-X across all four tasks (+2.5 POS accuracy, +2.5/+3.7 DP UAS/LAS, +1.8 NER F1, and +1.9 NLI accuracy), and with multi-source training on XLM-R Base surpasses full fine-tuning of XLM-R Large on XQuAD.
  evidence:
  - source_id: r710-primary-pdf
    locator: Section 5, Tables 2-4, pp. 6-8
    relation: supports
  - source_id: r710-metadata-cr
    locator: ACL 2022 bibliographic record
    relation: supports
- claim_id: ltsft-two-phase-training-and-density-interference-limitation
  kind: limitation
  statement: LT-SFT requires two sequential training phases (a full fine-tuning pass followed by a sparse fine-tuning pass), decoupling input and output embeddings while freezing output embeddings and layer normalization during language adaptation, and degrades markedly when mask density exceeds approximately 30% due to parameter overlap and interference.
  evidence:
  - source_id: r710-primary-pdf
    locator: Section 4.2 & Section 5.2, Figure 3, pp. 5, 8-9
    relation: supports
