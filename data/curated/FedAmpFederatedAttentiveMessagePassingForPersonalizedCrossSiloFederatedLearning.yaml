claims:
- claim_id: r465-concave-attention-inducing-cloud-model-and-proximal-update-mechanism
  kind: mechanism
  statement: Computes each client's personalized cloud model u_i^k via gradient descent on the concave pairwise regularizer A(W), yielding the convex combination u_i^k = (1 - alpha_k sum_{j != i} A'(||w_i^{k-1} - w_j^{k-1}||^2)) w_i^{k-1} + alpha_k sum_{j != i} A'(||w_i^{k-1} - w_j^{k-1}||^2) w_j^{k-1} (Equations 5 & 7) where non-increasing slope A'(t) assigns strictly larger collaboration weights to clients with closer parameter vectors, followed by local proximal minimization of F_i(w) + (lambda / (2 alpha_k)) ||w - u_i^k||^2 (Equation 6).
  evidence:
  - source_id: r465-primary-pdf
    locator: Section 3 Definition 1 & Equations 1-2, pp. 2-3, and Section 4 Method of FedAMP (Equations 3-7, Algorithm 1), pp. 3-4
    relation: supports
- claim_id: r465-convex-and-nonconvex-convergence-and-heurfedamp-scope
  kind: scope
  statement: Establishes O(1 / sqrt(K)) convergence to the global minimum for convex objectives (Theorem 1, O(epsilon^{-2}) iterations) and O(1 / sqrt(K)) squared-gradient stationarity min_{0 <= k <= K} ||nabla G(W^k)||^2 for smooth non-convex objectives under incremental alternating optimization with inexact local proximal steps e_i^k (Theorem 2, O(epsilon^{-4}) iterations), and introduces softmax cosine-similarity weights xi_{i,j} propto exp(sigma cos(w_i, w_j)) in HeurFedAMP (Equation 8) to prevent Euclidean distance saturation in deep neural networks.
  evidence:
  - source_id: r465-primary-pdf
    locator: Section 5 Convergence of FedAMP (Theorems 1-2), pp. 4-5, and Section 6 Heuristic Improvement of FedAMP on Deep Neural Networks (Equation 8), p. 5
    relation: supports
- claim_id: r465-cross-silo-server-memory-and-pairwise-distance-limitation
  kind: limitation
  statement: Requires the cloud server to store all m client parameter vectors W = [w_1, ..., w_m] in R^{d x m} and compute O(m^2 d) pairwise distances or cosine similarities per round, making it tailored to cross-silo federated learning with stateful clients rather than massive stateless cross-device federations.
  evidence:
  - source_id: r465-primary-pdf
    locator: Section 1 Introduction & Section 4 Algorithm 1, pp. 1, 3-4
    relation: supports
- claim_id: r465-personalized-cross-silo-benchmark-application
  kind: application
  statement: Applied to personalized cross-silo federated learning under pathological and cluster-skewed non-IID partitions on MNIST, FMNIST, EMNIST, and CIFAR-100, outperforming FedAvg, FedProx, and pFedMe in personalized client test accuracy.
  evidence:
  - source_id: r465-primary-pdf
    locator: Section 7 Experiments (Tables 1-2, Figures 2-3), pp. 5-7
    relation: supports
