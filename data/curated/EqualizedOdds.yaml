name: Equalized odds
definition: A fairness criterion requiring a predictor's output to be conditionally independent of a specified
  protected attribute given the target outcome; for binary predictions and outcomes, it requires equal
  true-positive and false-positive rates across the compared groups.
concept_kind: evaluation_criterion
identity_notes: This is the distributional criterion in Hardt, Price and Srebro's Definition 2.1, not
  their postprocessing algorithm, a bias type, demographic parity or a claim of overall social fairness.
  Equal opportunity is a weaker positive-outcome-only constraint. All 442 pinned AIO labels/scoped synonyms
  and 94 preceding native identities were compared, with ignored-inclusive text searches in both checkouts.
limitations:
- The conditioning outcome and protected groups must be specified, with estimable nonzero-probability
  conditioning strata for rate comparisons. Biased or unreliable outcome labels can undermine interpretation.
- Equal true-positive and false-positive rates do not require identical overall accuracy when group outcome
  prevalences differ. The record uses the formal conditional-independence definition, not the source's
  informal equal-accuracy wording.
- 'This is an oblivious distributional test: identical prediction/outcome/group statistics can arise from
  different underlying dependency structures. Satisfaction or violation alone is not conclusive evidence
  of overall fairness or unfairness.'
- Finite-sample uncertainty, a tolerance and domain-specific interpretation are needed in an application;
  no empirical result, universal fairness guarantee or legal-compliance claim is asserted.
