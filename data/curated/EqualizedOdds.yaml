claims:
- claim_id: criterion-scope
  kind: scope
  statement: Assess whether the conditional distribution of the prediction given the outcome is the same
    across protected groups. In the binary case, test both P(prediction=1 | A=a,Y=1) and P(prediction=1
    | A=a,Y=0) across a. The general independence definition also applies to scores and nonbinary variables;
    thresholding an equalized-odds score by a common rule preserves the property.
