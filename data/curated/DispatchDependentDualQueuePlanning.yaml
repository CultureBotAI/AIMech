aio_no_match:
  search_scope: All 442 pinned AIO IDs, labels and scoped synonyms were screened;
    20 relevant full nodes, annotations and all 62 incident edges were freshly read.
    Selection follows planning, control, probability/time scoring and the most plausible
    generic type confusions, not a prescribed target count. These are the inspected
    targets, not all conceivable ontology classes. This is the historical 2026-10-16
    prospective snapshot at HEAD 7991f0c2fdc71e461117fc598529a2678ea8ef7f, with 807
    native and 442 AIO records; it is not a future insertion clearance.
  rationale: No examined target identifies or usefully subsumes the two-queue temporal-planning
    procedure. Generic task overlap, robot applications and a mathematical component
    are insufficient mappings of the whole algorithm.
  examined_targets:
  - target: AIO:MachineLearningTask
    rejection_reason: The subject is a temporal-planning control procedure. Updating
      search-time estimates is a component, not evidence that this entire procedure
      is a process for building methods that learn from data. The source does not
      establish a specific learning-task identity or an informative method-level related
      mapping.
  - target: AIO:Model
    rejection_reason: The complete subject is an executable-style search and dispatch
      procedure, not merely an abstract representation of a complex system. Its embedded
      probability estimates and action model do not identify the planner as this generic
      model class.
  - target: AIO:MathematicalFunction
    rejection_reason: The complete planner maintains and alternates two open lists,
      expands nodes and interacts with dispatch decisions. Its functional score is
      a component; mapping that component does not map the entire algorithm to a mathematical
      rule.
  - target: AIO:ReasoningLLM
    rejection_reason: Explicit planning and deadline reasoning here do not use a large
      language model or language-task inference. The related synonym reasoning cannot
      expand this LLM class into all symbolic planning.
  - target: AIO:EmbodiedLLM
    rejection_reason: The robot benchmark does not make this symbolic temporal planner
      a language-grounded multimodal model. Application overlap is insufficient.
  - target: AIO:ReinforcementLearning
    rejection_reason: The inspected procedure searches a supplied temporal model and
      uses deadline/search-time estimates; it does not define reward-driven policy
      learning. Goal progress and information gathering are not by themselves reinforcement
      learning.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: There is no language-model reward fine-tuning or generated-text
      objective in the proposed procedure.
  - target: AIO:PolicyLayer
    rejection_reason: A planner deciding when to expand or dispatch is not a neural-network
      layer predicting an action distribution. Its probability is a timely-search
      estimate, not the output distribution of the described layer.
  - target: AIO:GraphConvolutionalPolicyNetwork
    rejection_reason: The subject neither uses graph convolution nor trains graph-generation
      policies with rewards and adversarial loss.
  - target: AIO:ActiveLearning
    rejection_reason: Expanding a node to improve dispatch information does not query
      an annotator for labels of new training points. Information gathering alone
      does not supply the target class identity.
  - target: AIO:TimeSeriesAnalysis
    rejection_reason: The algorithm is not a task of extracting characteristics from
      time-series observations; wall-clock dependence and refreshed estimates do not
      establish that task relation.
  - target: AIO:TimeSeriesForecasting
    rejection_reason: Estimated remaining search time guides planning, but the full
      algorithm is not a procedure for forecasting a time-series sequence from previous
      values.
  - target: AIO:SurvivalAnalysis
    rejection_reason: A tail probability of estimated search completion relative to
      a deadline is a scoring component. The complete planner is not the described
      time-to-event analysis task, and mere use of a probability tail is too generic
      for a useful related mapping.
  - target: AIO:ProportionalHazardsModel
    rejection_reason: The source does not impose a proportional-hazards regression
      model or multiplicative covariate effect on a hazard rate.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The search tree is a space of partial action plans, not a graph
      specifying conditional dependence among random variables. A probability estimate
      at a search node does not turn the controller into this target task.
  - target: AIO:MarkovChain
    rejection_reason: The queue procedure is not a stochastic transition model whose
      next-event law depends only on the preceding state; the source score alone does
      not establish a Markov-chain identity.
  - target: AIO:BayesianNetwork
    rejection_reason: No directed acyclic conditional-dependence network is specified
      as the algorithm identity.
  - target: AIO:DecisionTree
    rejection_reason: A search tree of possible plans is not the pinned classification/decision-support
      tree model. Branching does not establish classifier or predictor identity.
  - target: AIO:ContinualLearning
    rejection_reason: Continued search and distribution refresh do not constitute
      the target deep neural network learning sequential tasks without access to old
      task data.
  - target: AIO:EnsembleLearning
    rejection_reason: Alternating two priorities on one shared search frontier is
      not a predictive ensemble of learned algorithms.
