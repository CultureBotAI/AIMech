claims:
- claim_id: method
  kind: mechanism
  statement: 'In the linear categorical case, for fixed length L and inverse temperature beta, assign
    joint probability proportional to exp(beta[Pi_(s_1)+sum_(t=1)^(L-1) A_(s_t,s_(t+1))+sum_(t=1)^L B_(s_t,y_t)]),
    normalized over all hidden paths and observation sequences by Z_L. A and B are tied across time and
    need not themselves be log-normalized transition or emission probabilities. Observed likelihood is
    the ratio of a clamped and a free partition function. A log-likelihood derivative with respect to
    a tied interaction is beta times its expected count under the clamped distribution minus its expected
    count under the free distribution. For the selected tractable graphs, exact variable elimination computes
    these quantities: pruning sums out leaves, decimation sums over an intermediate state, and parallel
    interactions combine additively in the energy. The paper uses particular coupled chains at different
    time resolutions and selected loops that preserve an eliminable structure; tractability depends on
    intermediate state-space size, not merely the presence of temporal edges.'
  evidence:
  - source_id: method-source
    locator: Sections 2.1–2.3, Equations (1)–(5), printed pp.436–438 / PDF pp.2–4; Section 3, Figure 2,
      pp.438–439 / PDF pp.4–5; Sections 4.1–4.2 and Figures 3–5, pp.439–442 / PDF pp.5–8
    relation: supports
- claim_id: linear-hmm-boundary
  kind: scope
  statement: For the strictly linear finite-energy model, a positive eigenvector of the transfer matrix
    allows interaction weights to be transformed into normalized HMM parameters. A remaining factor depends
    only on the final hidden state. Conditioning both models on the same fixed terminal state removes
    that factor from normalized relative probabilities; more complex architectures are outside this equivalence
    result.
  evidence:
  - source_id: linear-equivalence
    locator: Abstract and Equations (1)–(4), printed/PDF pp.1–2; positive-matrix proof and terminal pseudo-prior
      discussion, p.2; architectural scope discussion, p.3
    relation: supports
