name: Boltzmann chain
definition: A family of tied-weight undirected Boltzmann sequence models with hidden temporal variables,
  observed variables and chain-derived connectivity chosen to permit exact elimination.
concept_kind: model_family
identity_notes: 'The Saul–Jordan construction includes a strictly linear categorical chain and specified
  coupled-parallel or looped variants. It denotes an energy parameterization and temporal graph family,
  not a sampled Monte Carlo chain, an RBM without hidden-hidden connections, or a generic directed factorial
  HMM. The linear positive-potential case overlaps HMM distributions under the terminal conditions established
  by MacKay; different parameter names alone do not establish additional distributional expressiveness.
  More complex source architectures are not automatically covered by that linear equivalence. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 379 preceding native IDs/names/aliases
  for the four researched candidate names. Both full-checkout fixed-string searches included ignored and
  hidden files, with 7 and 7 matching lines. All 6 unique matched contents were read: pending leads and
  preceding source/review context, not existing records of these three new identities. Expanded source
  IDs, plurals, Gibbs-machine and mixture-transition terminology were included. All 63 semantic label/synonym
  hits, 17 exact fully annotated AIO CLASS nodes with outgoing edges, their generated YAMLs and six native
  neighbors were read or byte-verified after prior complete reading. Markov mixtures of experts substantially
  overlaps the existing IOHMM family, so no fourth ID or unconditional alias is created. Absence is bounded
  to the pinned vocabulary and inspected neighborhood.'
limitations:
- The model is globally normalized at each sequence length. Separately normalizing each energy table is
  generally not an equivalent model transformation.
- MacKay’s positive-matrix gauge transformation produces normalized HMM parameters plus a final-state
  factor. Equivalence requires the same constrained final state and normalization over that constrained
  sample space, or explicit handling of the terminal factor. It is not evidence that every unrestricted-terminal
  HMM and linear energy parameterization agree.
- The inspected equivalence proof assumes strictly positive transfer entries from finite energies. Reducible
  or zero-support cases need separate conditions. It does not cover every coupled or looped graph.
- Exact elimination can become exponential in graph width or state size. The source’s chosen chain/loop
  motifs do not establish efficient exact inference for arbitrary Boltzmann networks.
- First-order hidden dynamics can retain long-lag statistical correlations. The source’s wording about
  absent long-term dependence is not interpreted as zero correlation at all nonadjacent times; extra direct
  long-range links are a different structural property.
- The synthetic learning curves do not certify universal gains, real-data effectiveness or scalability.
  No author implementation, model fitting or benchmark was executed.
