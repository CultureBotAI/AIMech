aio_mappings:
- target: AIO:BoltzmannMachineNetwork
  relation: broad_match
  rationale: The source explicitly defines the temporal model as a tied-weight Boltzmann machine with
    categorical units and undirected pair interactions. The AIO target describes the broader symmetrically
    connected stochastic network/Markov-random-field family; the selected temporal graphs are a narrower
    construction.
- target: AIO:MarkovChain
  relation: related_match
  rationale: The strictly linear hidden-chain structure has a qualified relation to HMMs and their latent
    Markov transitions. Coupled and looped energy graphs, plus terminal normalization conditions, preclude
    treating the whole family or its observations as the pinned first-order process.
