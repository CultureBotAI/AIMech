  relation: related_match
  rationale: LARC controls parameter-update rates during machine-learning training. The pinned TrainingStrategy
    target names this context but has a preprocessing genus, so this mapping expresses relatedness without
    asserting equivalence, subclass membership or that LARC is preprocessing.
limitations:
- The identity here is the documented clipping form. The named historical wrapper also supports scaling
  mode; clipping and global-rate multiplication must not be conflated.
- The parameter-relative norm bound concerns the fresh vanilla-SGD increment with the stated signs and
  nonzero/defined denominators, not every wrapped optimizer final displacement or a convergence guarantee.
- Zero norms, missing gradients, tensor grouping and coupled decay have explicit historical implementation
  policies that differ from a direct extension of the ideal equation.
- The historical wrapper configuration is not fully represented by its delegated optimizer state serialization;
  trust coefficient, clip mode and epsilon must be retained separately.
- Both pinned NVIDIA method documentation and complete historical Apex wrapper were inspected statically.
  No PyTorch execution, dependency audit, mixed-precision experiment or current installation compatibility
  is claimed.
- No empirical training speed, accuracy, stability advantage or universal batch-size scaling rule is imported;
  constructed examples demonstrate algebraic boundaries only.
