name: PaCMAP
definition: A nonlinear dimensionality-reduction algorithm that embeds neighbor, mid-near and farther
  point pairs using separate attractive and repulsive losses whose relative weights change through three
  optimization phases.
concept_kind: algorithm
identity_notes: PaCMAP uses three classes of pair losses and a changing phase schedule, rather than TriMap’s
  coupled triplet loss or UMAP’s fuzzy graph construction. The graph-sampling rules and phase weights
  are defining components, not a proof of universal local/global preservation. All 442 pinned AIO labels/scoped
  synonyms and 114 preceding native identities were compared, together with hidden/ignored-inclusive searches
  of both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- Random sampling and the initial coordinates affect the result. The authors explicitly state that robustness
  to initialization is incomplete and that initialization scale matters.
- A mid-near partner is selected by a six-point sample rule, not an exact global distance quantile; the
  method does not guarantee that every such partner is outside the nearest-neighbor set.
- Locally scaled distances select neighbor pairs, while optimization uses embedded distances and pair-class
  weights; the original distances are not fitted as an all-pairs metric.
- The three-phase procedure seeks a useful nonconvex layout. No global optimum, exact topology preservation,
  density preservation or universal performance advantage is asserted.
aliases:
- Pairwise Controlled Manifold Approximation Projection
