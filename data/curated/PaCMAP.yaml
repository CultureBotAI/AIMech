claims:
- claim_id: method-scope
  kind: mechanism
  statement: Choose neighbors from a Euclidean-neighbor candidate pool using locally scaled distances,
    choose mid-near partners as the second closest among six sampled observations, and sample non-neighbors
    for farther pairs. With d̃=||y_a−y_b||²+1, use d̃/(10+d̃) for neighbors, d̃/(10000+d̃) for mid-near
    pairs and 1/(1+d̃) for farther pairs. Optimize with Adam, ordinarily from PCA initialization, first
    emphasizing mid-near attraction, then reducing it and finally setting its weight to zero while refining
    local structure.
  evidence:
  - source_id: original-paper
