      for prediction-rule distinction
    relation: supports
- claim_id: source-convention-check
  kind: limitation
  statement: 'Curator calculation: for one-dimensional points 0,1,2 and M=1, d_M(0,2)=4 exceeds d_M(0,1)+d_M(1,2)=2.
    The squared expression used for training therefore need not satisfy a metric triangle inequality.
    The exact calculation is saved in research/discovery/metric-source-boundaries.py.'
