name: Large margin nearest neighbor
definition: A supervised metric-learning method that fits a positive-semidefinite distance matrix by pulling
  fixed same-class target neighbors together while penalizing margin violations by differently labeled
  observations.
concept_kind: algorithm
identity_notes: The core single-metric LMNN formulation fixes directed target-neighbor assignments before
  fitting and uses a convex objective in a positive-semidefinite matrix. It is not NCA’s stochastic classification
  objective, a generic triplet loss, or a deep embedding network. Iteratively reassigning targets, learning
  local metrics, kernelization and rank constraints are distinct extensions; their behavior is not inferred
  from the core convex program. The energy-based prediction rule in Section 3.5 is separate from ordinary
  k-nearest-neighbor voting. No normalized identity match for this candidate was found across all 442
  pinned AIO labels/scoped synonyms and 227 preceding native IDs/names/aliases. The same search identified
  BIRCH as an existing native record and excluded it from additions. Full-checkout word-delimited fixed-string
  searches included ignored and hidden files, with 79 worktree and 79 main-checkout matching lines; these
  concern BIRCH identity/proposal/review context and discovery leads. Ten exact AIO CLASS nodes with scoped
  synonyms and outgoing edges, and nine neighboring native records, were inspected.
limitations:
- Each point needs enough other same-class observations for its chosen target count. Target selection,
  labels, weighting, feature scale and the solver affect the learned representation; training margins
  do not certify held-out accuracy.
- The source uses metric terminology for quadratic distances. The displayed d_M is a squared distance
  and does not itself generally satisfy the triangle inequality; its square root is a pseudometric when
  M is positive semidefinite and may collapse distinct points if M is rank deficient.
- Convexity applies to the fixed-target optimization over M, not to arbitrary factorized, rank-constrained
  or target-reassignment extensions. Convexity also does not imply a unique optimum, perfect training
  separation or a certified result from every numerical solver.
- The endpoints of the stated weight interval can remove one training term; mu=0 permits the collapsed
  M=0 solution. The paper’s unit margin is a scale convention. No benchmark, special-purpose solver implementation
  or extension was reproduced.
