claims:
- claim_id: method
  kind: mechanism
  statement: For labeled vectors choose k other same-class target neighbors T_i for each training point,
    usually using Euclidean distance before fitting; these directed sets remain fixed in the core method.
    Let d_M(i,j)=(x_i-x_j)^T M(x_i-x_j), with M positive semidefinite. Minimize (1-mu)sum_i sum_(j in
    T_i)d_M(i,j)+mu sum_i sum_(j in T_i)sum_(l:y_l!=y_i)max(0,1+d_M(i,j)-d_M(i,l)), with mu in [0,1].
    The pull term concerns target neighbors, not all same-class pairs, and the hinge is not squared. Introducing
    nonnegative slack variables for the margin violations yields a semidefinite program. After learning,
    factor M=L^T L and use the learned distances for k-nearest-neighbor classification. The matrix-variable
    objective is convex for fixed target sets; optimizing directly in L is not generally convex.
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF pp. 3–4 (printed 209–210), squared-distance parameterization; Sections 3.1–3.4,
