  rationale: The method estimates a fixed policy’s state values from reward transitions and supplies prediction
    machinery used within reinforcement learning. The pinned target is a broader learning task involving
    exploration and performance optimization; this related association asserts neither exact identity
    nor that the prediction algorithm itself chooses actions, optimizes a policy or guarantees convergence.
