name: Gumbel-Top-k trick
definition: A categorical sampling construction that adds independent standard Gumbel noise to each category’s
  log weight and returns the indices of the k largest perturbed values in descending order, producing
  an ordered sample without replacement under successive renormalization of the remaining weights.
concept_kind: mathematical_method
identity_notes: 'This is the finite categorical Gumbel-Top-k construction formalized by Kool and colleagues,
  who credit an earlier observation by Vieira. The k=1 case is the Gumbel-Max trick. It is distinct from
  truncating a language model to its k most probable tokens and then sampling, from a continuous Gumbel-Softmax
  relaxation, and from the separate stochastic beam algorithm that applies the construction implicitly
  to sequences. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 328 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in worktree and main, returning 49 and 49 lines respectively. All 2 unique hit contents
  were inspected: a saved stochastic-beam/Gumbel discovery lead and a search-result title about coalition-formation
  scatter search, not existing candidate records. Exact checkout counts and differences are retained in
  the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and four full
  native neighboring records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The ordered sampling probabilities differ from marginal inclusion probabilities; inclusion is not generally
  proportional to the original weight or equal to k times its normalized probability. At k=n every supported
  category is included.
- The stated construction assumes positive finite weights and k no larger than the positive support. Zero
  weights require exclusion or a declared limiting convention; invalid weights and k beyond support are
  not covered.
- Exactness assumes the specified independent continuous noise and exact ranking. Finite precision, random-number
  endpoints and numerical ties require implementation policies; no software implementation was certified.
- Direct finite-domain application perturbs all n category scores. It does not by itself supply an efficient
  algorithm for exponentially many complete sequences, a differentiable relaxation, or an unbiased sample-mean
  estimator for arbitrary without-replacement outputs.
