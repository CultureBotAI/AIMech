aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 328 preceding maintained IDs/names/aliases;
    ignored/hidden-inclusive full text in both checkouts; semantic labels/scoped synonyms for Gumbel,
    beam, sampling, autoregression, inference, decoding, sequence, categorical, reparameterization, temperature,
    search and reasoning; nine exact AIO CLASS nodes and four complete native beam-search neighbors.
  rationale: No suitable target for the generic ordered categorical sampling procedure was established
    in this inspected snapshot and semantic neighborhood. Shared probability, categorical and sampling
    terminology does not justify a forced model, function, bias or task mapping.
  examined_targets:
  - target: AIO:AutoregressiveLanguageModel
    rejection_reason: A language model supplying next-token probabilities is different from this generic
      finite categorical sampling rule; it does not define the rule’s identity or required application.
  - target: AIO:NaturalLanguageProcessing
    rejection_reason: The generic categorical rule is not restricted to natural-language data; its sequence-model
      application is curated separately.
  - target: AIO:SoftmaxFunction
    rejection_reason: Softmax normalizes scores to probabilities; Gumbel-Top-k returns discrete ordered
      random indices. Their mathematical relationship does not make the sampling operation the normalization
      function.
  - target: AIO:MathematicalFunction
    rejection_reason: This record specifies an ordered stochastic sampling procedure and its distributional
      identity, not a deterministic input-output function class.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Sampling without replacement from a specified categorical distribution is not the
      ontology’s nonrepresentative-selection bias concept.
  - target: AIO:CategoricalFeaturesPreprocessingLayer
    rejection_reason: Categorical random outcomes do not make the sampling rule a neural feature-preprocessing
      layer.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The finite categorical trick requires no graphical conditional-dependence representation;
      the tree-based sequence construction is a separate concept.
  - target: AIO:MachineLearningTask
    rejection_reason: Drawing random indices from supplied weights does not itself learn from data.
  - target: AIO:TrainingStrategy
    rejection_reason: No model training or training-data preprocessing is required by the sampling identity.
