claims:
- claim_id: method
  kind: mechanism
  statement: For n categories with positive finite weights w_i and 1≤k≤n, draw independent G_i with the
    standard Gumbel distribution, equivalently G_i=−log(−log U_i) for independent U_i uniform on (0,1).
    Rank log(w_i)+G_i and return the first k distinct indices in that perturbed order. The probability
    of an ordered distinct tuple (i_1,…,i_k) is the product over j of w_i_j divided by the total weight
    remaining after indices i_1,…,i_(j−1) are removed. Common weight normalization is unnecessary because
    it adds only a common shift to all log scores. This is an exact distributional statement for the specified
    random variables, not an assertion that the selected indices are the highest-probability unperturbed
    categories.
  evidence:
  - source_id: method-source
    locator: Section 2.1–2.4, Theorem 1 and footnote 1, PDF p.2; Section 1 attribution, PDF p.1
    relation: supports
  - source_id: sampling-proof
    locator: Appendix A, Theorem 1 and Equations (15)–(19), supplement PDF p.1
    relation: supports
- claim_id: inclusion-boundary
  kind: limitation
  statement: Without replacement here means sequential categorical sampling with the remaining weights
    renormalized after every selected index. It does not mean that each category’s probability of appearing
    anywhere in the k-sample is proportional to its original probability. The source explicitly distinguishes
    these quantities.
  evidence:
  - source_id: method-source
    locator: Section 2.4, footnote 1 and Equation (4), PDF p.2
    relation: supports
