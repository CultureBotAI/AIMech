id: AIMech:RAMRandomAcceleratedMotionMultidimensionalTimeSeriesGenerator
name: RAM Random Accelerated Motion Multidimensional Time Series Generator
concept_kind: algorithm
review_status: DRAFT
definition: A synthetic multidimensional time series generation algorithm that models a D-dimensional time series as the trajectory of a point mass undergoing random piecewise-constant acceleration within a bounded D-dimensional hyper-rectangle with elastic boundary reflection and optional damped harmonic oscillation around attractors to produce controllable multidimensional motifs and ground-truth anomalies.
identity_notes: No AIO class represents the Random Accelerated Motion (RAM) synthetic time series generator; TimeSeriesAnalysis (AIO:TimeSeriesAnalysis) is the closest broad match covering multidimensional time series benchmarking and analysis.
aliases:
- RAM Time Series Generator
- Random Accelerated Motion Time Series Generator
- RAM Multidimensional Synthetic Time Series Generator
