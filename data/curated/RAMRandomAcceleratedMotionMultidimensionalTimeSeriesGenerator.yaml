- source_id: r830-primary-pdf
  locator: Full-text primary paper (all sections and appendices verified)
  relation: supports
- source_id: r830-arxiv-abs
  locator: arXiv abstract page
  relation: supports
- source_id: r830-metadata-cr
  locator: Crossref DOI bibliographic metadata
  relation: supports
claims:
- claim_id: kinematic-random-acceleration-hyperrectangle-reflection
  kind: mechanism
  statement: RAM generates D-dimensional trajectories by updating velocity v(t + dt) = v(t) + a(t) dt and position s(t + dt) = s(t) + v(t) dt + 0.5 a(t) dt^2 under random acceleration vectors a(t), elastically reflecting position coordinates and reversing velocity components whenever the point crosses the bounding hyper-rectangle walls.
  evidence:
  - source_id: r830-primary-pdf
    locator: Section 3.1, Equations 1-2 and Algorithm 1, pp. 4-5
    relation: supports
- claim_id: damped-harmonic-attractor-motif-injection
  kind: mechanism
  statement: To synthesize recurring multidimensional patterns and controlled anomalies, RAM switches selected dimensions into damped harmonic oscillation around an attractor point in R^D before resuming random accelerated motion.
  evidence:
  - source_id: r830-primary-pdf
    locator: Section 3.2, Algorithm 2, pp. 5-6
    relation: supports
- claim_id: multidimensional-time-series-benchmarking-application
  kind: application
  statement: RAM is used to generate scalable multidimensional time series datasets with configurable dimensionality D, length, sampling rate, and ground-truth motif/anomaly annotations for benchmarking data mining and time series analysis algorithms.
  evidence:
  - source_id: r830-primary-pdf
    locator: Section 1, pp. 1-2; Section 4, pp. 6-7
    relation: supports
- claim_id: isotropic-kinematic-physics-process-limitation
  kind: limitation
  statement: Because RAM trajectories are governed by continuous Newtonian kinematics with symmetric hyper-rectangle reflections, the generated series exhibit smooth second-order differentiability and do not directly capture heavy-tailed jump processes or regime-switching discrete state transitions without external modification.
  evidence:
  - source_id: r830-primary-pdf
    locator: Section 3.1-3.2, pp. 4-6; Section 5, p. 7
    relation: supports
