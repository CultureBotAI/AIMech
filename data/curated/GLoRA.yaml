claims:
- claim_id: glora-five-support-tensor-unified-formulation
  kind: mechanism
  statement: GLoRA formulates the adapted linear transformation of frozen weights W_0 in R^{d_2 x d_1} and bias b_0 in R^{d_2 x 1} as f(x) = (W_0 + W_0 A + B) x + C W_0 + D b_0 + E + b_0, where each layer's trainable support tensors are independently chosen from discrete search spaces A, B in {LoRA, vector, scalar, none}, C in {LoRA, vector, none}, and D, E in {vector, scalar, none} (432 configurations per linear layer) using weight-entangled sub-tensor indexing across a multi-path supernet.
  evidence:
  - source_id: r683-primary-pdf
    locator: Section 2.2 A Unified Formulation of One-for-All, Eq. 10-11 & Appendix E, p. 4, 15
    relation: supports
- claim_id: glora-structural-reparameterization-zero-inference-cost
  kind: mechanism
  statement: Because GLoRA eliminates non-linear activations between adjacent support tensor operations, all trained support tensors are absorbed post-training into a single unified weight matrix W_uni = W_0 + W_0 A + B and unified bias vector b_uni = C W_0 + D b_0 + E + b_0 so that inference executes f(x) = W_uni x + b_uni with zero additional parameters or FLOPs.
  evidence:
  - source_id: r683-primary-pdf
    locator: Section 2.3 Structural Re-parameterization Design, Eq. 12-14 & Table 4, p. 5, 8
    relation: supports
- claim_id: glora-vision-and-llm-transfer-application
  kind: application
  statement: GLoRA is applied to parameter-efficient transfer learning, few-shot recognition, and out-of-domain generalization on ViT-B and Swin-B across VTAB-1K and ImageNet variants as well as instruction tuning of LLaMA-1-7B and LLaMA-2-7B on the Open LLM Leaderboard, outperforming LoRA, VPT, Adapter, and NOAH while maintaining identical inference throughput to the unadapted backbone.
  evidence:
  - source_id: r683-primary-pdf
    locator: Section 3 Experiments, Tables 1-4 and Figures 2-3, p. 5-8
    relation: supports
- claim_id: glora-supernet-training-and-evolutionary-search-overhead
  kind: limitation
  statement: Training the multi-path weight-entangled supernet followed by evolutionary subnet search on a validation set requires substantially more training epochs (e.g., 5x the training epochs of single-configuration LoRA) and additional validation evaluations before the final re-parameterized model is deployed.
  evidence:
  - source_id: r683-primary-pdf
    locator: Section 2.4, Appendix A, Appendix B, and Appendix D, p. 5, 14-15
    relation: supports
