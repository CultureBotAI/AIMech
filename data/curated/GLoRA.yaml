id: AIMech:GLoRA
name: Generalized LoRA
concept_kind: algorithm
review_status: DRAFT
definition: A unified parameter-efficient fine-tuning framework that adapts each pretrained linear layer f(x) = W_0 x + b_0 using five configurable support tensors (A, B, C, D, E) spanning weight scaling, weight shifting, layer-wise prompt tuning, and bias scaling and shifting, selects optimal per-layer tensor structures from a weight-entangled supernet via evolutionary search, and structurally re-parameterizes all learned tensors into a single unified weight matrix W_uni and bias vector b_uni for zero-overhead inference.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which tunes only an additive low-rank weight residual B without weight scaling A, layer-wise prompt vector C, or bias scale/shift tensors D and E), from DoRA (AIMech:DoraWeightDecomposedLowRankAdaptation, which normalizes column-wise weight directions and learns a magnitude vector rather than searching heterogeneous support tensor types {LoRA, vector, scalar, none} in a multi-path supernet), and from DyLoRA (AIMech:DyLoRADynamicSearchFreeLowRankAdaptation, which orders ranks within a single LoRA pair via nested dropout rather than searching across five distinct support tensor roles). Formulated by Chavan et al. (arXiv:2306.07967).
aliases:
- GLoRA
- One-for-All Generalized Low-Rank Adaptation
- GLoRA Structural Re-Parameterization Supernet PEFT
