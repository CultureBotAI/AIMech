id: AIMech:OptimalMultiWeightedStepUpProcedureForFDRControl
name: Optimal multi-weighted step-up procedure for false discovery rate control
aliases:
- Optimal Multi-Weighted Step-Up Procedure SU(W*)
- Damped Multi-Weighted Step-Up and Step-Down Procedures SU(W_tilde) and SD(W_tilde)
- Roquain-van de Wiel Optimal P-Value Weighting
- Multi-Weighted Benjamini-Hochberg Procedure
concept_kind: mathematical_method
definition: 'A step-wise multiple hypothesis testing methodology (Roquain & van de Wiel 2009, Electronic
  Journal of Statistics 3:678-711, arXiv:0807.4081v3, DOI:10.1214/09-EJS430) that generalizes the weighted
  Benjamini-Hochberg linear step-up procedure LSU(w) by replacing a single static weight vector w = (w_1,
  ..., w_m) with a rejection-proportion-indexed weight function W(u) = (W_i(u))_{i=1}^m defined across
  all candidate rejection proportions u in {1/m, 2/m, ..., 1} subject to budget conservation sum_{i=1}^m
  W_i(u) = m and threshold monotonicity Delta_i(u) = alpha u W_i(u) non-decreasing in u. Because the optimal
  static weight vector maximizing expected discovery power Pow_w(u) = m^{-1} sum_{i in H_1} F_i(alpha
  w_i u) depends on the unknown rejection proportion u = |R|/m, Roquain & van de Wiel (2009) solve the
  constrained Lagrangian maximization simultaneously at every u in (0, 1], yielding the unique optimal
  weight function W_i^*(u) = (alpha u)^{-1} f_i^{-1}(y^*(u)) under strictly concave alternative CDFs F_i
  with densities f_i = F_i'', where y^*(u) is chosen so that sum_{i=1}^m W_i^*(u) = m (reducing in the
  one-sided Gaussian model F_i(x) = Phi_bar(Phi_bar^{-1}(x) - mu_i) to alpha u W_i^*(u) = Phi_bar(mu_i
  / 2 + c(u) / mu_i), Proposition 3.2, Eq. 11). The multi-weighted step-up procedure SU(W) rejects {i
  : p_i <= alpha u_hat W_i(u_hat)} at u_hat = max{u in {0, 1/m, ..., 1} : G_hat_W(u) >= u}, while the
  damped procedures SU(W_tilde) with W_tilde_i(u) = W_i(u) / (1 + alpha W_i(1)) and SD(W_tilde) with W_tilde_i(u)
  = W_i(u) / (1 + alpha u W_i(u)) guarantee exact finite-sample FDR control <= m_0 alpha / m <= alpha
  under arbitrary deterministic weight functions or misspecified prior parameters (Theorem 4.1), and unmodified
  SU(W^*) achieves asymptotic FDR = pi_0 alpha and asymptotic power at least as large as every static
  weighted linear step-up procedure LSU(w) (Theorems 4.2-4.3).'
identity_notes: No normalized identity match for optimal multi-weighted step-up procedure for false discovery
  rate control or Roquain-van de Wiel optimal p-value weighting across all 442 pinned AIO records and
  589 maintained IDs, names, aliases and scoped synonyms. Only frontier reference matches in Round 194
  discovery artifacts were found. Distinct from AIMech:AdaptiveDataDrivenOptimalPValueWeighting (Durand
  2019, ADDOW / crADDOW), which estimates group null proportions pi_hat_{g,0} and Grenander least-concave-majorant
  CDFs D_tilde_g directly from the observed p-values over the null-proportion-weighted budget K_hat =
  {sum_g (m_g/m) pi_hat_{g,0} w_g <= 1}, whereas Roquain & van de Wiel (2009) establish the foundational
  deterministic individual-hypothesis multi-weighting framework W(u) over sum_{i=1}^m W_i(u) = m, derive
  the exact closed-form Lagrangian optimal weight function W_i^*(u) = (alpha u)^{-1} f_i^{-1}(y^*(u))
  (Proposition 3.2, Eq. 11), prove the m = 2 finite-sample adversarial counterexample for unmodified SU(W)
  (Lemma C.1), and prove exact non-asymptotic FDR control via damped step-up and step-down weights W_tilde_i(u)
  (Theorem 4.1) and non-asymptotic Hoeffding oracle inequalities (Theorem 4.2, Proposition 8.3); and distinct
  from AIMech:CovariatePoweredCrossWeightedMultipleTesting (Ignatiadis & Huber 2021, IHW), which learns
  static covariate-dependent weights via out-of-fold size-investing.
