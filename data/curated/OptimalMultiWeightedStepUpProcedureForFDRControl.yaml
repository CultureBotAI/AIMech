- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Multi-weighted step-up SU(W*) and step-down SD(W*) procedures control the false discovery
    rate across heterogeneous hypothesis tests to prevent false-positive inflation (AIO:DataDredgingBias)
    while optimizing threshold-indexed p-value weights to maximize discovery power.
limitations:
- Unmodified multi-weighted step-up SU(W) guarantees FDR control only asymptotically as m -> infinity
  (Theorem 4.3); in finite samples, an adversarial weight function can inflate FDR(SU(W)) up to alpha
  + alpha^2 / 4 when m = m_0 = 2 (Lemma C.1), requiring the damping factor (1 + alpha W_i(1))^{-1} in
  SU(W_tilde) or (1 + alpha u W_i(u))^{-1} in SD(W_tilde) for exact non-asymptotic finite-sample FDR control
  (Theorem 4.1).
- Although finite-sample FDR control of damped SU(W_tilde) and SD(W_tilde) holds unconditionally under
  arbitrary misspecification of the prior alternative distributions F_i, substantial misspecification
  of the guessed effect sizes mu_tilde_i (large noise sigma) can reduce empirical power below that of
  the unweighted Benjamini-Hochberg LSU procedure (Section 5.3).
- The theoretical FDR bounds and oracle power inequalities (Theorems 4.1–4.3) assume independent p-values
  and deterministic (prior-specified) weight functions W(u); data-driven estimation of group alternative
  distributions and null proportions directly from the observed p-values requires the adaptive multi-weighted
  framework of Durand (2019) (Section 7).
- All 829 lines of Roquain & van de Wiel (2009, Electronic Journal of Statistics 3:678-711, arXiv:0807.4081v3,
  DOI:10.1214/09-EJS430) were read. Constructed numerical checks in research/discovery/optimal-multi-weighted-step-up-procedure-for-fdr-control-boundaries.py
  verify (1) Proposition 3.2 and Eq. 11 Lagrangian optimal weight function W^*(u) budget conservation
  (max error = 8.881784197001252e-16), KKT equal marginal power spread (2.1316282072803006e-14), strict
  threshold monotonicity (threshold_monotone = True), small-u weight concentration on the largest effect
  size (W_max(0.02) = 2.383683 vs. W_max(1.00) = 0.564465), and strict optimality over simplex perturbations
  (0.374161 > 0.372535), (2) Lemma C.1 m = 2 counterexample at alpha = 0.2 where unmodified SU(W) has
  exact analytical FDR = 0.21 > 0.2 (Monte Carlo 0.20968) while Theorem 4.1 damped SU(W_tilde) has exact
  FDR = 0.160839 <= 0.2 (Monte Carlo 0.16146) and SD(W) has Monte Carlo FDR = 0.19892 <= 0.2, (3) Theorems
  4.2-4.3 power dominance of multi-weighted SU(W^*) (0.68644) and damped SD(W_tilde^*) (0.67778 > damped
  SU 0.67072) over unweighted BH (0.51428) and fixed-u_0 static weightings (max static = 0.68356), and
  (4) Section 5.3 prior misspecification robustness where finite-sample FDR remains controlled at 0.02943
  <= 0.05 under severe noise sigma = 3.50 while power drops from 0.70655 (sigma = 0.20) to 0.35119 (sigma
  = 3.50).
