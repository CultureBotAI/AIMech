claims:
- claim_id: lagrangian-optimal-weight-function-and-threshold-monotonicity
  kind: mechanism
  statement: Under strictly concave twice-differentiable alternative p-value cumulative distribution functions
    F_i with decreasing densities f_i = F_i' (Assumptions A1-A3), maximizing the expected discovery power
    Pow_w(u) = m^{-1} sum_{i in H_1} F_i(alpha w_i u) at each rejection proportion u in (0, 1] subject
    to sum_{i=1}^m w_i = m yields a unique, continuous optimal weight function W^*(u) = (W_i^*(u))_{i=1}^m
    given in the unconditional model by W_i^*(u) = (alpha u)^{-1} f_i^{-1}(y^*(u)) (and in the conditional
    model when alpha < pi_1 by W_i^*(u) = (alpha u)^{-1} f_i^{-1}(y^*(u)) 1{H_i = 1}), where y^*(u) is
    the unique Lagrange multiplier satisfying sum_{i=1}^m W_i^*(u) = m and the resulting threshold collection
    Delta_i^*(u) = alpha u W_i^*(u) is strictly increasing in u (Definition 3.1, Proposition 3.2, Section
    8.6); in the one-sided Gaussian shift model F_i(x) = Phi_bar(Phi_bar^{-1}(x) - mu_i), the optimal
    threshold takes the closed form alpha u W_i^*(u) = Phi_bar(mu_i / 2 + c(u) / mu_i) where c(u) in R
    satisfies m^{-1} sum_{i=1}^m Phi_bar(mu_i / 2 + c(u) / mu_i) = alpha u (Eq. 11), concentrating weight
    on the largest effect sizes as u -> 0+ and spreading weight across smaller effect sizes as u increases.
  evidence:
  - source_id: roquain2009-mwsu-ar5iv
    locator: Section 3.1–3.2, lines 126–164, Definition 3.1, Proposition 3.2, Eq. 8–12; Section 8.6, lines
      403–408
    relation: supports
  - source_id: roquain2009-mwsu-abs
    locator: Abstract (optimal step-wise weighting for heterogeneous p-value distributions)
    relation: supports
- claim_id: finite-sample-step-up-counterexample-and-damped-fdr-control
  kind: mechanism
  statement: For m = m_0 = 2 true null hypotheses in the conditional model, the unmodified multi-weighted
    step-up procedure SU(W) has exact analytical false discovery rate FDR(SU(W)) = alpha + alpha^2 (1
    - W_1(1)) (W_1(1) - W_1(1/2)), which attains a maximum of alpha + alpha^2 / 4 > alpha for the valid
    weight function W_1(1/2) = 0, W_2(1/2) = 2, W_1(1) = 0.5, W_2(1) = 1.5 (Appendix C.1, Lemma C.1),
    whereas the unmodified step-down procedure SD(W) controls FDR at level alpha whenever m = 2 or m_0
    = m (Appendix C.2, Lemma C.2). For arbitrary m >= 1 and any deterministic weight function W, the damped
    multi-weighted step-up procedure SU(W_tilde) with W_tilde_i(u) = W_i(u) / (1 + alpha W_i(1)) and the
    damped multi-weighted step-down procedure SD(W_tilde) with W_tilde_i(u) = W_i(u) / (1 + alpha u W_i(u))
    guarantee exact non-asymptotic finite-sample FDR <= m_0 alpha / m <= alpha in the conditional model
    and FDR <= pi_0 alpha <= alpha in the unconditional model under independent p-values, even when the
    alternative distributions F_i used to construct W are arbitrarily misspecified (Section 4.1, Theorem
    4.1, Eq. 13–14; Section 8.1–8.3, Lemmas 8.1–8.2).
  evidence:
  - source_id: roquain2009-mwsu-ar5iv
    locator: Section 4.1, lines 165–176, Theorem 4.1, Eq. 13–14; Section 8.1–8.3, lines 266–325, Lemmas
      8.1–8.2; Appendix C.1–C.2, lines 453–474, Lemmas C.1–C.2
    relation: supports
- claim_id: finite-sample-oracle-inequality-and-asymptotic-power-dominance
  kind: mechanism
  statement: In the unconditional model under strictly concave alternative CDFs F_i, the optimal weight
    function W^* maximizes the expected rejection curve G_W(u) = pi_0 alpha u + pi_1 Pow_W(u) pointwise
    at every u in [0, 1], so its fixed point u^* = I(G_{W^*}) satisfies u^* >= u_w = I(G_w) for every
    static weight vector w; Proposition 8.3 and Theorem 4.2 establish a non-asymptotic finite-sample oracle
    inequality lower-bounding Pow(SU(W^*)) - max_w Pow(LSU(w)) up to exponentially small Hoeffding concentration
    terms in m (Eq. 15, Eq. 22–23), and Theorem 4.3 and Proposition 8.4 prove that for any converging
    weight sequence in W, unmodified SU(W^{*,(m)}) achieves exact asymptotic FDR control lim_{m -> infinity}
    FDR(SU(W^{*,(m)})) = pi_0 alpha (Eq. 17) and asymptotic power dominance liminf_{m -> infinity} [Pow(SU(W^{*,(m)}))
    - max_{w^{(m)} in W} Pow(LSU(w^{(m)}))] >= 0 (Eq. 16), automatically matching or exceeding the power
    of every fixed-u_0 static linear step-up procedure LSU(W^{*,(m)}(u_0)).
  evidence:
  - source_id: roquain2009-mwsu-ar5iv
    locator: Section 4.2–4.3, lines 177–193, Theorems 4.2–4.3, Eq. 15–17; Section 8.4–8.5 and 8.7, lines
      326–402 and 409–413, Propositions 8.3–8.4
    relation: supports
  - source_id: roquain2009-mwsu-crossref
    locator: Electronic Journal of Statistics 3:678–711 publication record
    relation: supports
- claim_id: prior-effect-size-misspecification-tradeoff-and-step-down-advantage
  kind: mechanism
  statement: In finite-sample Gaussian testing with m hypotheses, the damped multi-weighted step-down
    procedure SD(W_tilde^*) incurs a strictly smaller damping penalty (1 + alpha u W_i^*(u))^{-1} at rejection
    proportion u < 1 than the damped step-up procedure SU(W_tilde^*)'s uniform penalty (1 + alpha W_i^*(1))^{-1},
    yielding higher finite-sample power for SD(W_tilde^*) while outperforming both unweighted LSU and
    location-only uniform oracle weighting (Section 5.2, Figure 2); under noisy prior effect-size guesses
    mu_tilde_i = (mu_i + varepsilon_i)_+ with varepsilon_i ~ N(0, sigma^2), both SU(W_tilde(mu_tilde))
    and SD(W_tilde(mu_tilde)) maintain exact finite-sample FDR <= alpha for all sigma >= 0 and achieve
    higher power than LSU for moderate misspecification (sigma in [0, 1.2]), but can lose power relative
    to unweighted LSU when prior misspecification sigma is large (Section 5.3, Figure 3).
  evidence:
  - source_id: roquain2009-mwsu-ar5iv
    locator: Section 5.1–5.3, lines 194–253, Figures 2–3
    relation: supports
