claims:
- claim_id: empirical-baseline-concave-bernstein-loglikelihood-and-multiplicative-fixed-point
  kind: mechanism
  statement: Choosing the baseline covariate x_0 to satisfy gamma^T x_0 <= min_{1<=i<=n} gamma^T x_i ensures eta_i = exp(gamma^T (x_i - x_0)) >= 1 for all subjects, making all entries of the Hessian H(gamma, p) = d^2 ell_m(gamma, p) / (dp dp^T) nonpositive and H(gamma, p) negative semi-definite on the simplex S_{m*} (Lemma 1), so the multiplicative fixed-point iteration p_j^{[s+1]} = p_j^{[s]} Psi_bar_j(gamma, p^{[s]}) with lambda_n(gamma) = sum_{i=1}^n exp(gamma^T x_tilde_i) remains nonnegative and converges globally to the maximizer p_tilde(gamma) (Equations 10-13, Theorems 1-2).
  evidence:
  - source_id: r834-primary-pdf
    locator: Section 2.2, Equations 10-13, Lemmas 1-2 and Theorems 1-2, pp. 6-7; Appendix 7.1, Equation 20, pp. 18-19
    relation: supports
- claim_id: changepoint-degree-selection-and-asymptotic-normality
  kind: mechanism
  statement: MABLE selects the optimal Bernstein polynomial degree m_hat by maximizing the change-point log-likelihood increment ratio statistic R(m_i) over candidate degrees {m_0, ..., m_k} (Section 2.3) and achieves almost-sure consistency ||gamma_hat - gamma_0||^2 <= C n^{-1+epsilon} and D_i^2(p_hat; x_hat_0) <= C n^{-1+epsilon} (Theorem 4) alongside root-n asymptotic normality sqrt(n)(gamma_tilde - gamma_0) -> N(0, I^{-1}) when m >= C n^{1/rho} (Theorem 5).
  evidence:
  - source_id: r834-primary-pdf
    locator: Section 2.3, p. 8; Section 3.1-3.2, Theorems 4-5, pp. 9-11
    relation: supports
- claim_id: smooth-survival-and-hazard-estimation-under-interval-censoring-application
  kind: application
  statement: MABLE is applied to estimate smooth baseline survival curves, hazard rates, and covariate hazard ratios from interval-censored and right-censored clinical survival data (such as the Stanford Heart Transplant and Ovarian Cancer studies), avoiding the jagged step-function artifacts of Turnbull's NPMLE.
  evidence:
  - source_id: r834-primary-pdf
    locator: Section 4-5, Table 1 and Figures 1-4, pp. 12-17
    relation: supports
- claim_id: right-tail-unidentifiability-and-high-degree-simplex-nonuniqueness-limitation
  kind: limitation
  statement: When the largest observed time tau_n is right-censored with F(tau_n|x_0) < 1, the baseline density on (tau_n, infinity) is nonparametrically unidentifiable and requires an external tail specification alpha(t - tau_n) (Section 2.1-2.2, Equations 4-5); moreover, if the Bernstein degree m exceeds the number of distinct Turnbull inspection endpoints, the maximizer p_hat on the simplex may not be unique even when the fitted survival curve at the endpoints is invariant (Theorem 1, Section 5.1).
  evidence:
  - source_id: r834-primary-pdf
    locator: Section 2.1-2.2, pp. 4-6; Theorem 1, p. 6; Section 5.1, Figure 2, p. 14
    relation: supports
