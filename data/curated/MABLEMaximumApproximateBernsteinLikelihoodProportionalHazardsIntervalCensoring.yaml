id: AIMech:MABLEMaximumApproximateBernsteinLikelihoodProportionalHazardsIntervalCensoring
name: MABLE Maximum Approximate Bernstein Likelihood Estimation in Proportional Hazards Model for Interval-Censored Data
concept_kind: mathematical_method
review_status: DRAFT
definition: A semiparametric survival regression method for Cox's proportional hazards model under interval-censored data that parameterizes the baseline density on [0, tau_n] as a degree-m Bernstein polynomial mixture of Beta densities f_m(t|x_0; p) = tau_n^{-1} sum_{i=0}^m p_i beta_{mi}(t/tau_n) and maximizes the resulting full approximate log-likelihood ell_m(gamma, p) over regression coefficients gamma and simplex weights p in S_{m*} using an alternating Newton-Raphson and multiplicative fixed-point iteration anchored at the empirical baseline covariate x_hat_0(gamma) = argmin_{x_i} gamma^T x_i.
identity_notes: No AIO class represents Maximum Approximate Bernstein Likelihood Estimation (MABLE) for interval-censored proportional hazards models; RegressionAnalysis (AIO:RegressionAnalysis) is the closest broad match covering semiparametric regression estimation.
aliases:
- MABLE Proportional Hazards Estimator
- Maximum Approximate Bernstein Likelihood Estimator for Interval-Censored Data
- Bernstein Polynomial Cox Proportional Hazards Estimator
