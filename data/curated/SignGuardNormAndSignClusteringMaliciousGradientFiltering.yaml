claims:
- claim_id: signguard-collaborative-norm-threshold-and-sign-clustering-intersection
  kind: mechanism
  statement: 'In each communication round t, SignGuard computes the median client gradient norm M = med({||g_t^(i)||_2}_{i=1}^n) to form a norm-filtered candidate set S_1 = {i : L <= ||g_t^(i)||_2 / M <= R} and independently clusters clients using normalized coordinate sign-proportion vectors (p_i^+, p_i^0, p_i^-) via Mean-Shift or 2-cluster K-Means to identify the majority cluster S_2, then aggregates only the intersection S_t'' = S_1 cap S_2 with median-norm clipping tilde{g}_t = (1 / |S_t''|) sum_{i in S_t''} g_t^(i) min(1, M / ||g_t^(i)||_2).'
  evidence:
  - source_id: r533-primary-pdf
    locator: Section IV-B, Algorithm 2, Lines 1-11 and pp. 4-5
    relation: supports
- claim_id: signguard-convergence-and-byzmean-resilience-under-non-iid-data
  kind: scope
  statement: Under L-smooth objectives and bounded honest gradient variance with fraction alpha < 1/2 of Byzantine workers, Lemma 1 and Theorem 1 prove that SignGuard bounds the expected squared deviation E||tilde{g}_t - bar{g}_t||^2 between the filtered aggregate and the true honest mean gradient and achieves O(1/sqrt(T)) stationarity convergence while resisting the hybrid ByzMean attack (Equation 8) that simultaneously manipulates gradient norms and inner products.
  evidence:
  - source_id: r533-primary-pdf
    locator: Section III-C, Equation (8), p. 3; Section IV-C, Lemma 1 & Theorem 1, Equation (12), p. 6
    relation: supports
- claim_id: signguard-honest-majority-and-clustering-hyperparameter-limitation
  kind: limitation
  statement: SignGuard requires an honest majority (alpha < 0.5) so that both the median gradient norm M and the largest sign-feature cluster S_2 reflect benign gradients, and its filtering sensitivity depends on tuning the norm thresholds (L, R) and Mean-Shift bandwidth on non-IID client distributions.
  evidence:
  - source_id: r533-primary-pdf
    locator: Section II-B, p. 2; Section IV-B, p. 5; Section V-E, pp. 8-9
    relation: supports
- claim_id: signguard-byzantine-resilient-deep-federated-classification-application
  kind: application
  statement: Applied to Byzantine-robust federated training of deep neural networks on MNIST, Fashion-MNIST, and CIFAR-10 against random, noise, sign-flipping, ALIE, Inner Product Manipulation (IPM), and ByzMean attacks.
  evidence:
  - source_id: r533-primary-pdf
    locator: Section V, Tables I-III and Figures 4-8, pp. 6-9
    relation: supports
