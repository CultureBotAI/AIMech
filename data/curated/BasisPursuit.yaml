aio_mappings:
- target: AIO:SparseLearning
  relation: related_match
  rationale: The pinned target denotes a representation-learning network that finds sparse linear representations
    and identifies their elements, with exact synonyms sparse coding and sparse dictionary learning. BP
    supplies a particular fixed-dictionary coefficient optimization principle, without learning atoms
    or requiring a network. The sparse-representation relationship is direct, but these differences rule
    out exact identity or an asserted network subclass. RepresentationLearning and SparseAutoEncoder likewise
    denote different neural scopes. LassoRegression, LeastsquaresAnalysis, RegularizationLayer and MathematicalFunction
    do not identify the exact-equality minimum-L1 principle; incidental use as FeatureExtraction is not
    its defining role.
limitations:
- The record is limited to real finite dictionaries and exact equality. Complex coefficients, analysis
  sparsity, weighted/group norms, noisy constrained forms and dictionary-learning algorithms need their
  own evidence and identity decisions.
- Optimal L1 need not recover the fewest atoms or a unique representation. Sparse exact-recovery theorems
  require additional dictionary/signal assumptions; their external proofs were not audited.
- All 31 pages of the 2001 reprint were visually read. External primary sources, the 1995 precursor and
  the separate 1998 version remain uninspected in full. The image example in Section 7.2 is expressly
  a modified BP-inspired method, not validation of this exact implementation.
- Exact rational examples are curator calculations, not historical experiments. No optimizer, learned
  model, benchmark or paid provider was run. The record remains DRAFT and has no independent scientific
  approval.
