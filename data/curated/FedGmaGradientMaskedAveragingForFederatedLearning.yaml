id: AIMech:FedGmaGradientMaskedAveragingForFederatedLearning
name: Gradient Masked Averaging for Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A server-side federated aggregation algorithm (FedGMA / GMA; Tenison, Sreeramadas, Mugunthan, Oyallon, Rish, and Belilovsky, TMLR 2023) that replaces sign-agnostic parameter averaging with an elementwise soft agreement mask over client multi-step pseudo-gradient updates. At communication round t, after each participating client n in C performs K local gradient steps from w_{t-1} to produce sample-weighted update Delta_t^n = (s_n / sum_{k in C} s_k)(w_t^n - w_{t-1}) and aggregate update Delta_t = sum_{n in C} Delta_t^n, the server computes for each coordinate j the directional agreement score A_j = |(1 / |C|) sum_{n in C} sign(Delta_{t,j}^n)| in [0, 1] and applies the soft mask [m_tilde_tau]_j = 1 if A_j >= tau else A_j (with threshold tau in [0, 1]) to update w_t = w_{t-1} + eta_g (m_tilde_tau odot Delta_t).
identity_notes: Distinct from centralized sample-level hard binary AND-Mask (Parascandolo et al., 2020) and SAND-Mask (Shahtalebi et al., 2021), which mask single-step sample or environment gradients with hard zeroing or tanh-based magnitude scaling in centralized training; FedGMA operates at the federated server aggregation stage across client multi-step pseudo-gradients Delta_t^n and uses a piecewise-linear soft agreement mask [m_tilde_tau]_j = 1 if A_j >= tau else A_j compatible with non-adaptive (FedAvg, FedProx) and adaptive (FedAdam, FedYogi) server optimizers. Distinct from FedAvg (AIMech:FederatedAveraging), which corresponds to the unmasked degenerate limit tau = 0 where m_tilde_0 = 1.
aliases:
- FedGMA
- Gradient Masked Averaging
- Gradient Masked FedAvg
- GMA Federated Aggregation
