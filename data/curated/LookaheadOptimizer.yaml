claims:
- claim_id: lookahead-fast-slow-ema-and-quadratic-optimal-step-size
  kind: mechanism
  statement: After k inner-loop updates from theta_{t,0} = phi_{t-1} to theta_{t,k}, Lookahead updates slow weights via phi_t = phi_{t-1} + alpha * (theta_{t,k} - phi_{t-1}) = alpha * sum_{j=1}^t (1 - alpha)^{t-j} theta_{j,k} + (1 - alpha)^t phi_0, and on a quadratic objective L(x) = 0.5 x^T A x - b^T x with minimizer theta^* = A^{-1} b, the exact loss-minimizing slow-weight step size is alpha^* = ((theta_{t,0} - theta^*)^T A (theta_{t,0} - theta_{t,k})) / ((theta_{t,0} - theta_{t,k})^T A (theta_{t,0} - theta_{t,k})) (Proposition 1).
  evidence:
  - source_id: r614-primary-pdf
    locator: Section 2, Algorithm 1, Equations 1-3, Proposition 1, and Appendix B.2 (Equations 12-13), p. 2-3, 16
    relation: supports
  - source_id: r614-metadata-cr
    locator: Bibliographic metadata for Zhang, Lucas, Ba, & Hinton (NeurIPS 2019, pp. 9593-9604)
    relation: supports
- claim_id: lookahead-noisy-quadratic-steady-state-variance-reduction
  kind: scope
  statement: Under Proposition 2 and Lemma 1 on the noisy quadratic model L_hat(x) = 0.5 (x - c)^T A (x - c) with c ~ N(0, Sigma) and inner SGD learning rate 0 < gamma < 2 / max_i a_i, Lookahead's slow weights converge in expectation to 0 and in variance to the fixed point V^*_LA = [alpha^2 (I - (I - gamma A)^{2k}) / (alpha^2 (I - (I - gamma A)^{2k}) + 2 alpha (1 - alpha) (I - (I - gamma A)^k))] V^*_SGD, which is strictly smaller than V^*_SGD = gamma^2 A^2 Sigma (I - (I - gamma A)^2)^{-1} for all alpha in (0, 1).
  evidence:
  - source_id: r614-primary-pdf
    locator: Section 3.1 (Noisy quadratic analysis), Proposition 2 (Equations 4-7), and Appendix A (Lemma 1, Equations 8-11), p. 4, 13-14
    relation: supports
- claim_id: lookahead-vision-lm-and-nmt-benchmark-applications
  kind: application
  statement: Lookahead wrapped around SGD or Adam accelerates convergence and improves validation performance on CIFAR-10 and CIFAR-100 (ResNet-18, PreResNet-110, Wide-ResNet-28-10), ImageNet (ResNet-50 reaching 75.49% top-1 in 60 epochs and ResNet-152 reaching 77.96% top-1 in 60 epochs), Penn Treebank LSTM language modeling (57.72 test perplexity with LA(Adam) vs 59.33 for Adam), and WMT 2014 English-to-German Transformer translation.
  evidence:
  - source_id: r614-primary-pdf
    locator: Section 5 (Experiments), Tables 1-5 and Figures 5-10, p. 6-9
    relation: supports
- claim_id: lookahead-extra-parameter-copy-and-overdamped-regime-limitation
  kind: limitation
  statement: Lookahead requires storing one full additional copy of the model's learnable parameters in memory for the slow weights phi and slows deterministic contraction in the over-damped regime where the inner momentum coefficient is set too low and the inner optimizer already converges monotonically without oscillation (1 - alpha + alpha (I - gamma A)^k > (I - gamma A)^k for alpha < 1).
  evidence:
  - source_id: r614-primary-pdf
    locator: Section 2 (Computational complexity), Section 3.2 (Figure 4), and Appendix A, p. 3, 5, 14
    relation: supports
