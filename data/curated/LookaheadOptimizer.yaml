id: AIMech:LookaheadOptimizer
name: Lookahead Optimizer
concept_kind: algorithm
review_status: DRAFT
definition: "An orthogonal outer-loop optimization wrapper algorithm that maintains two sets of parameters\u2014slow weights phi and fast weights theta\u2014by synchronizing theta_{t,0} <- phi_{t-1} at each outer step t, executing k inner-loop updates theta_{t,i} <- theta_{t,i-1} + A(L, theta_{t,i-1}, d_i) using any base optimizer A (such as SGD or Adam), and updating the slow weights via linear interpolation in parameter space phi_t <- phi_{t-1} + alpha * (theta_{t,k} - phi_{t-1}) with step size alpha in (0, 1], forming an exponentially decayed moving average of the k-step fast-weight endpoints."
identity_notes: Distinct from Stochastic Weight Averaging (AIMech:StochasticWeightAveraging, which forms an arithmetic tail average of checkpoints at the end of training without resetting the active optimizer trajectory) and from Reptile (AIMech:Reptile, which samples distinct tasks across outer steps for few-shot meta-learning initialization). Lookahead resets the fast weights to the interpolated slow weights phi_t every k steps during single-task optimization, incurring O((k+1)/k) amortized compute and one extra parameter copy.
aliases:
- Lookahead k Steps Forward 1 Step Back Optimization
- Fast-and-Slow Weights Linear Interpolation Optimizer
- Lookahead Wrapper Optimization Algorithm
