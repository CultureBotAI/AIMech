id: AIMech:FedBeFederatedBayesianModelEnsembleViaStochasticWeightAverageDistillation
name: FedBE (Federated Bayesian Model Ensemble via Stochastic Weight Average Distillation)
concept_kind: algorithm
review_status: DRAFT
definition: "A Bayesian server-side model aggregation algorithm for multi-round federated learning (Chen & Chao 2021, Sections 3-4, Equations 3-9, Algorithm 1) that treats client-updated models {w_i; i in S} as stochastic gradient trajectories to construct an approximate global model posterior p(w | D) on the server \u2014 either by fitting a SWAG-style diagonal Gaussian N(mu, Sigma_diag) with mu = sum_i (|D_i|/|D|) w_i and Sigma_diag = diag(sum_i (|D_i|/|D|) (w_i - mu)^2) (Equation 5) or a Dirichlet simplex convex-combination distribution w^{(m)} = sum_i (gamma_i^{(m)} |D_i| / sum_{i'} gamma_{i'}^{(m)} |D_{i'}|) w_i with gamma^{(m)} ~ Dir(alpha) (Equations 6-7) \u2014 samples M global models {w^{(m)} ~ p(w | D)}_{m=1}^M to form a Bayesian model ensemble {w_bar} U {w_i} U {w^{(m)}} that generates ensemble pseudo-labels p_hat_j = (1/M') sum_{m'=1}^{M'} p(y | x_j; w^{(m')}) (Equation 4) on an unlabeled server dataset U = {x_j}_{j=1}^J, and distills the pseudo-labeled set T = {(x_j, p_hat_j)}_{j=1}^J into a single student global model w using Stochastic Weight Averaging (SWA) with a cyclical learning rate schedule eta_SWA (Algorithm 1)."
identity_notes: Distinct from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning, Lin et al. 2020), which distills only the direct average of client logits without fitting a Gaussian or Dirichlet global parameter posterior p(w | D), sampling additional higher-quality global models w^{(m)} ~ p(w | D), or applying cyclical Stochastic Weight Averaging (SWA) during server distillation; and distinct from FedPA (AIMech:FedPaFederatedPosteriorAveragingViaLocalMcmcAndShrinkageCovariance, Al-Shedivat et al. 2021), which estimates local client posteriors via MCMC and shrinkage covariance on clients rather than server-side Bayesian ensemble distillation.
aliases:
