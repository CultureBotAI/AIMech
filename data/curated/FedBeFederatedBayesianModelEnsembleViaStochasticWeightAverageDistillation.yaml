claims:
- claim_id: r475-gaussian-and-dirichlet-posterior-ensemble-curvature-mechanism
  kind: mechanism
  statement: FedBE constructs p(w | D) from uploaded client weights {w_i} via either a diagonal Gaussian N(mu, Sigma_diag) (Equation 5) or a Dirichlet simplex distribution over convex client combinations (Equations 6-7), and shows via second-order linearization around w_bar (Equations 8-9) that the Bayesian ensemble prediction (1/M) sum_m p(y | x; w^{(m)}) differs from p(y | x; w_bar) by O(Omega^2) where Omega = max_m ||w^{(m)} - w_bar||, improving calibration and accuracy under non-IID client drift (Chen & Chao 2021, Section 3.3, Figure 1).
  evidence:
  - source_id: r475-primary-pdf
    locator: Section 3.3 (Equations 5-9, Figure 1), pp. 4-5
    relation: supports
- claim_id: r475-swa-ensemble-knowledge-distillation-mechanism
  kind: mechanism
  statement: To summarize the Bayesian model ensemble {w_bar} U {w_i; i in S} U {w^{(m)}}_{m=1}^M into a single global model w for multi-round communication without overfitting to noisy early-round ensemble pseudo-labels p_hat_j on unlabeled server data U, FedBE minimizes the cross-entropy distillation loss -(1/J) sum_j p_hat_j^T log p(y | x_j; w) using Stochastic Weight Averaging (SWA) with a cyclical learning rate schedule eta_SWA and averages traversed student checkpoints (Chen & Chao 2021, Section 4, Algorithm 1, & Appendix C.4 Figure 11).
  evidence:
  - source_id: r475-primary-pdf
    locator: Section 4 (Algorithm 1), pp. 5-6, and Appendix C.4 (Figure 11), p. 19
    relation: supports
- claim_id: r475-deep-network-non-iid-federated-classification-application
  kind: application
  statement: Applied to non-IID and partial-participation federated image classification with deeper neural networks (ConvNet, ResNet-20/32/44/56, MobileNetV2) on CIFAR-10, CIFAR-100, and Tiny-ImageNet, including out-of-domain unlabeled server datasets and compatibility with FedProx, FedAvgM, and SCAFFOLD (Chen & Chao 2021, Section 5, Tables 1-6).
  evidence:
  - source_id: r475-primary-pdf
    locator: Section 5 (Experiments, Tables 1-6, Figures 2-5), pp. 6-9
    relation: supports
- claim_id: r475-unlabeled-server-data-and-server-distillation-compute-limitation
  kind: limitation
  statement: Requires access to an unlabeled dataset U at the server and incurs extra server-side forward inference passes across M' ensemble models plus SWA knowledge distillation epochs at every communication round (Chen & Chao 2021, Sections 4, 6, & Appendix D.1).
  evidence:
  - source_id: r475-primary-pdf
    locator: Section 4, p. 5, Section 6, p. 9, and Appendix D.1, p. 20
    relation: supports
