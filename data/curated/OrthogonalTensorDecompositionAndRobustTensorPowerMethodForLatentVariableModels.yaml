claims:
- claim_id: claim-uniqueness-of-orthogonal-third-order-tensor-eigenvectors-and-whitening-reduction
  kind: mechanism
  statement: "For an orthogonally decomposable third-order symmetric tensor $T = \\sum_{i=1}^k \\lambda_i v_i^{\\otimes 3}$ ($\\lambda_i > 0$, $\\{v_i\\}_{i=1}^k$ orthonormal), Theorem 4.1 proves that the stable fixed points of the tensor power map $\\theta \\mapsto T(I,\\theta,\\theta)/\\|T(I,\\theta,\\theta)\\|_2$ (equivalently, the isolated local maximizers of $T(u,u,u)$ on $\\|u\\|_2 = 1$) are uniquely $\\{\\pm v_1,\\dots,\\pm v_k\\}$ whereas every non-zero combination $\\sum_{i\\in A} c_i v_i$ with $|A| \\ge 2$ is an unstable stationary point; furthermore, whitening $M_2 = \\sum_{i=1}^k \\omega_i \\mu_i^{\\otimes 2}$ by $W$ ($W^\\top M_2 W = I_k$) reduces $M_3 = \\sum_{i=1}^k \\omega_i \\mu_i^{\\otimes 3}$ to $T = M_3(W,W,W) = \\sum_{i=1}^k \\omega_i^{-1/2} v_i^{\\otimes 3}$, allowing exact un-whitening $\\mu_i = (W^\\top)^\\dagger \\tilde{\\omega}_i v_i$ (Equations 4.3\u20134.5)."
  evidence:
  - source_id: aghkt2014-tensordecomp-pdf
    locator: Section 4.1-4.3, Theorem 4.1, Proposition 4.1, & Theorem 4.3, pp. 2790-2799
    relation: supports
  - source_id: aghkt2014-tensordecomp-abs
    locator: Abstract
    relation: supports
- claim_id: claim-quadratic-contraction-and-robust-tensor-power-method-perturbation-bound
  kind: mechanism
  statement: Undernoiseless updates $\bar{\theta}_{t+1} = T(I,\theta_t,\theta_t)/\|T(I,\theta_t,\theta_t)\|_2$, the coordinate weights verify $\langle v_i,\bar{\theta}_{t+1}\rangle \propto \lambda_i\langle v_i,\theta_t\rangle^2$, so the ratio $\max_{i\ne 1}|\lambda_i\langle v_i,\theta_t\rangle|/|\lambda_1\langle v_1,\theta_t\rangle|$ squares at every step (Lemma 5.1); for a perturbed tensor $\hat{T} = T + E$ with $\|E\| \le \epsilon \le c\lambda_{\min}/k$, Theorem 5.1 proves that Algorithm 1 with $L = \mathrm{poly}(k)\log(1/\eta)$ restarts and $N = O(\log k + \log\log(\lambda_{\max}/\epsilon))$ iterations recovers every pair $(\lambda_i,v_i)$ up to permutation with $\|\hat{v}_i - v_i\|_2 \le 8\epsilon/\lambda_i$, $|\hat{\lambda}_i - \lambda_i| \le 5\epsilon$, and residual tensor norm $\|\hat{T} - \sum_{i=1}^k \hat{\lambda}_i\hat{v}_i^{\otimes 3}\| \le 55\epsilon$.
  evidence:
  - source_id: aghkt2014-tensordecomp-pdf
    locator: Section 5.1-5.2, Algorithm 1, Theorem 5.1, & Lemma 5.1, pp. 2799-2805; Appendices B & C, pp. 2811-2827
    relation: supports
  - source_id: aghkt2014-tensordecomp-cr
    locator: JMLR Volume 15 (2014) metadata and abstract pp. 2773-2832
    relation: supports
- claim_id: claim-unified-moment-reductions-for-gmm-lda-ica-and-hmms
  kind: scope
  statement: 'Section 3 proves that modified empirical second- and third-order moments have rank-$k$ symmetric CP form across four canonical latent variable families: exchangeable single-topic and multi-view mixture models (Theorems 3.1, 3.6), spherical Gaussian mixtures $\sum_{i=1}^k \omega_i\mathcal{N}(\mu_i,\sigma^2 I)$ after subtracting $\sigma^2 I$ from $M_2$ and $\sigma^2\sum_{r=1}^d(\mathbb{E}[x]\otimes e_r\otimes e_r + \text{perm})$ from $M_3$ (Theorem 3.2), Independent Component Analysis fourth-order cumulant slices (Theorem 3.3), and Dirichlet topic models (LDA) with concentration parameter $\alpha_0$ via Cross-Moment corrections (Theorem 3.5).'
  evidence:
  - source_id: aghkt2014-tensordecomp-pdf
    locator: Section 3.1-3.6, Theorems 3.1-3.6, pp. 2781-2790
    relation: supports
- claim_id: claim-limitation-non-degeneracy-rank-k-bound-and-sample-perturbation-threshold
  kind: limitation
  statement: The whitening-and-tensor-power pipeline requires the $k$ component vectors $\{\mu_1,\dots,\mu_k\}\subset\mathbb{R}^d$ to be linearly independent (restricting latent dimension to the undercomplete or complete regime $k \le d$) and requires empirical moment perturbation $\|E\| \le c\lambda_{\min}/k$ so that sequential deflation errors do not amplify across components.
  evidence:
  - source_id: aghkt2014-tensordecomp-pdf
    locator: Section 4.3.1, Condition 4.1, p. 2796; Section 5.1, Theorem 5.1 & Remark 5.2, pp. 2800-2802
    relation: supports
