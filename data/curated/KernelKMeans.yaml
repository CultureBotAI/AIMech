id: AIMech:KernelKMeans
name: Kernel K-Means
aliases:
- Kernelized K-Means
concept_kind: algorithm
definition: A clustering algorithm that alternates nearest-feature-mean assignments and mean updates to
  minimize within-cluster squared distances in a kernel-defined feature space, with an observation-weighted
  extension.
identity_notes: This record covers the fixed-kernel Lloyd procedure and its positive observation-weight
  parameterization. Linear kernels with unit weights recover input-space k-means; general valid kernels
  need not give the same partition. It does not specify the incremental global, fast or CMM seed-selection
  procedures, learn multiview kernel weights, or perform kernel PCA. Weighted and unit-weight cases share
  the same parameterized update rather than receiving duplicate local IDs. Compared all 442 pinned AIO
  IDs, labels and scoped synonyms with all 492 prior native IDs, names and aliases; no normalized identity
  collision. Full searches of both checkouts include ignored and hidden files, returning 62 worktree and
  62 main matched lines. All 47 distinct matched texts were inspected as neighboring method mentions,
  query/frontier references or rendered copies. Eleven annotated AIO nodes, eleven generated YAMLs and
  seven native neighbors were examined. Nine unchanged annotated nodes, their generated YAMLs, all 442
  class labels and 139 semantic rows reuse byte-verified earlier readings; two additional annotated targets
  and eight new semantic rows were read (147 rows total). Absence is bounded to this pin and corpus.
definition_evidence:
- source_id: core-source
  locator: Section 2.1, PDF p. 2, Equations 1-2 and Algorithm 1
  relation: supports
claims:
- claim_id: weighted-kernel-local-fit
  kind: mechanism
  statement: For a fixed PSD Gram matrix K, supplied cluster count M and positive observation weights
    a_i, represent each center as the weighted mean of its assigned RKHS features. For cluster C with
    A_C=sum_j_in_C a_j, compute squared distance K_ii - 2*sum_j_in_C a_j*K_ij/A_C + sum_j,l_in_C a_j*a_l*K_jl/A_C^2.
    Alternate synchronous nearest-center assignments and mean recomputation. Unit observation weights
    give unweighted kernel k-means. Scaling every a_i by the same positive constant preserves distances
    and fits while scaling the objective; these weights are not learned view weights.
  evidence:
  - source_id: global-source
    locator: Section II-B, PDF pp. 2-3 / printed pp. 1182-1183, Algorithm 1; Section V-A, PDF p. 6 / p.
      1186, Equations 12-13
    relation: supports
- claim_id: discrete-versus-spectral-relaxation
  kind: scope
  statement: With W=diag(a), the objective is tr(W*K)-tr(Y^T*W^(1/2)*K*W^(1/2)*Y), where the nonzero indicator
    entries are Y_ij=sqrt(a_i)/sqrt(A_Cj). Replacing that discrete indicator constraint by arbitrary orthonormal
    columns yields a leading-eigenvector relaxation. Discretizing its solution need not attain the best
    discrete objective; the resulting partition can instead initialize further kernel k-means. An objective
    connection is not equality of all spectral and kernel-k-means algorithms.
  evidence:
  - source_id: core-source
    locator: Sections 3-4, PDF pp. 3-4
    relation: supports
- claim_id: graph-objective-specializations
  kind: scope
  statement: For a symmetric nonnegative graph affinity A, ratio association uses unit observation weights
    and K=A. Normalized-cut optimization uses positive degrees d_i=sum_j A_ij as observation weights and
    K=D^(-1) A D^(-1). For fixed M these choices identify partition objective orderings, not all graph
    algorithms or their outputs. A sufficiently large shift lambda*I for ratio association, or lambda*D^(-1)
    for normalized cut, can ensure PSD. Either adds the partition-independent lambda*(N-M) to the corresponding
    weighted kernel objective while potentially changing local update paths. Zero-degree vertices require
    a convention. The source graph experiments used small shifts not necessarily ensuring PSD, so their
    observed convergence is not a general guarantee for indefinite similarities.
  evidence:
  - source_id: global-source
    locator: Section VI, PDF pp. 7-8 / printed pp. 1187-1188, Equations 20-21; Section VII-C, PDF p. 11
      / p. 1191; curator fixed-count shift calculation
    relation: supports
- claim_id: descent-and-cost
  kind: limitation
  statement: Exact assignment and mean updates do not increase the nonnegative PSD-kernel objective, but
    initialization can lead to different fixed points and need not yield a global optimum. Unspecified
    tie and empty-cluster handling prevents an unconditional termination or unique-result claim. With
    a dense Gram matrix and cached cluster terms, the source describes quadratic work per local pass in
    addition to kernel construction; spectral initialization and optional triangle-distance pruning are
    separate choices.
  evidence:
  - source_id: core-source
    locator: Section 2.1, PDF p. 2; Sections 4.2 and 5, PDF p. 4; Section 8, PDF p. 6
    relation: supports
