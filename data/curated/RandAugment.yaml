claims:
- claim_id: method
  kind: mechanism
  statement: For each training image, sample N operations uniformly with replacement from the selected
    transformation set and apply them in the sampled order, using the same magnitude parameter M with
    each operation’s own magnitude scale. The paper’s Figure3 uses 14 operations, including identity,
    geometric and appearance transformations, and permits repeated choices. The sequence therefore has
    K^N possible operation choices for a K-operation set, rather than sampling N distinct operations.
    Tune N and M using target-task validation, for example with the reported simple grid search, instead
    of a separate proxy-task controller search. The source also investigates different schedules for the
    shared magnitude. Its nominal magnitude scale and exploratory ranges are protocol choices; a shared
    M does not mean the same physical transformation strength across operation types.
