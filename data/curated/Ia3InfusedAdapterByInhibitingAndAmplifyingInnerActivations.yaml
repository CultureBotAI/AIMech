id: AIMech:Ia3InfusedAdapterByInhibitingAndAmplifyingInnerActivations
name: Infused Adapter by Inhibiting and Amplifying Inner Activations ((IA)^3)
concept_kind: algorithm
review_status: DRAFT
definition: "Infused Adapter by Inhibiting and Amplifying Inner Activations ((IA)^3) is a parameter-efficient fine-tuning (PEFT) method for Transformer architectures that introduces three learned element-wise rescaling vectors per Transformer block\u2014l_k in R^{d_k} on attention keys, l_v in R^{d_v} on attention values, and l_ff in R^{d_ff} on intermediate point-wise feed-forward activations\u2014while keeping all pretrained model weights frozen. Specifically, (IA)^3 computes scaled dot-product attention as softmax((Q (l_k odot K^T)) / sqrt(d_k)) (l_v odot V) and feed-forward hidden states as (l_ff odot gamma(W_1 x)) W_2, where odot denotes broadcasted element-wise multiplication and all scaling vectors are initialized to ones (1) so the initial model function is unchanged. After fine-tuning, l_k, l_v, and l_ff are absorbed into the rows/columns of W_K, W_V, and W_1 (or W_2), incurring zero additional inference latency or memory overhead."
identity_notes: Distinct from LoRA (Hu et al., 2022) and Compacter (Karimi Mahabadi et al., 2021), which add low-rank matrix updates Delta W to weight matrices using O(r d) parameters per layer rather than element-wise rescaling inner activations with only d_k + d_v + d_ff parameters per block (~0.01% of total parameters). Also distinct from VeRA (Kopiczko et al., 2024), which scales frozen random projection matrices B and A rather than directly rescaling attention key/value and FFN hidden activations.
aliases:
- (IA)^3
- IA3 Adapter
- Infused Adapter by Inhibiting and Amplifying Inner Activations
