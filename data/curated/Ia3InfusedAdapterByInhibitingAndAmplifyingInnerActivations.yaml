claims:
- claim_id: r657-claim-weight-absorption-and-mixed-task-batching
  kind: mechanism
  statement: Because element-wise multiplication by a static vector l is associative with preceding linear projections (l odot (W x) = (diag(l) W) x), (IA)^3's learned vectors l_k, l_v, and l_ff can be permanently folded into the frozen weight matrices W_K, W_V, and W_1 for single-task deployment with zero inference cost, or kept separate to enable mixed-task inference batching where each example i in a batch applies its own tiny task vector l^{(i)} to the shared frozen backbone activations.
  evidence:
  - source_id: r657-primary-pdf
    locator: Section 2.2 (Desiderata for Few-Shot PEFT), p. 3; Section 3.2, p. 4-5
    relation: supports
- claim_id: r657-claim-parameter-efficiency-and-t-few-recipe
  kind: application
  statement: On T0-3B and T0-11B, (IA)^3 updates only L (d_k + d_v + d_ff) parameters (~0.01% to 0.02% of model weights, 10x to 40x fewer than LoRA and Adapter) and, when combined with length-normalized and unlikelihood auxiliary losses in the T-Few recipe, outperforms full fine-tuning, 9 other PEFT methods, and 175B GPT-3 in-context learning on RAFT and held-out T0 tasks at over 1,000x lower inference FLOPs than few-shot ICL.
  evidence:
  - source_id: r657-primary-pdf
    locator: Section 3.2-3.5, Figures 1 & 3, Table 1, p. 1, 5-8; Appendix D, Table 4, p. 17-18
    relation: supports
- claim_id: r657-claim-diagonal-expressivity-ceiling-limitation
  kind: limitation
  statement: Because (IA)^3 restricts each adapted projection to a rank-preserving diagonal rescaling diag(l) W rather than an arbitrary rank-r update W + B A, it cannot rotate feature subspaces or increase the rank of frozen projection matrices and relies on strong pretrained multi-task representations (such as T0) or auxiliary pretraining of the (IA)^3 vectors.
  evidence:
  - source_id: r657-primary-pdf
    locator: Section 3.2-3.4, p. 4-6; Appendix E (Ablation Studies), p. 19-20
    relation: supports
