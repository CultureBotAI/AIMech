claims:
- claim_id: r444-balanced-softmax-bayes-optimality-under-identical-class-conditionals
  kind: mechanism
  statement: When clients share class-conditional feature distributions P_m(x | y = c) = P(x | y = c) but differ in skewed class priors P_m(y = c) propto N_{m,c}, Theorem 1 (Section 4.1) proves that minimizing the Balanced Softmax loss l_BSRM (Eq. 7 with gamma = 1) on every client m makes the local optimal logit vector g_m^*(x) = log P(x | y = c) + const identical across all clients and equal to the centralized class-balanced Bayes-optimal classifier, eliminating label-skew client drift during local updates.
  evidence:
  - source_id: r444-primary-pdf
    locator: Section 4.1 Balanced Risk Minimization for the Generic Model (Equations 6-7, Theorem 1) & Appendix A Proof
    relation: supports
- claim_id: r444-additive-personalized-logit-residual-and-hypernetwork-unseen-adaptation
  kind: mechanism
  statement: Combining the generic logit vector g(x; theta, W_G) with an additive local head h^P(f(x; theta); v_m) via hat_y^P = g(x; theta, W_G) + h^P(f(x; theta); v_m) (Section 4.2, Eq. 8) allows the personalized head to learn the log-prior offset log P_m(y = c) under empirical cross-entropy while keeping W_G shared; in Fed-RoD (Hyper) (Section 4.3, Eq. 9), a lightweight shared hypernetwork generates v_m = H(q_m; phi) from client m's normalized class-distribution vector q_m = [N_{m,1}, ..., N_{m,C}] / N_m, enabling zero-shot personalization for new clients from unlabeled or few-shot prior estimates.
  evidence:
  - source_id: r444-primary-pdf
    locator: Section 4.2 Personalized Model via Two Predictors (Equation 8) & Section 4.3 Adaptive Personalization via Hypernetworks (Equation 9)
    relation: supports
- claim_id: r444-label-shift-conditional-invariance-assumption-limitation
  kind: limitation
  statement: The theoretical consensus optimality of the Balanced Softmax generic objective (Theorem 1) relies on the label-shift assumption that class-conditional distributions P_m(x | y = c) are consistent across clients and does not directly remove severe covariate/domain shift across P_m(x | y).
  evidence:
  - source_id: r444-primary-pdf
    locator: Section 4.1 Assumption and Theorem 1 Discussion
    relation: supports
- claim_id: r444-simultaneous-generic-and-personalized-cifar-emnist-femnist-application
  kind: application
  statement: Applied to simultaneous generic and personalized federated image classification on Dirichlet-partitioned CIFAR-10, CIFAR-100, EMNIST, and FMNIST, outperforming both generic FL baselines on balanced test sets and personalized FL baselines on local client test distributions.
  evidence:
  - source_id: r444-primary-pdf
    locator: Section 3 Empirical Study (Table 1, Figure 1) & Section 5 Experiments (Tables 2-5, Figures 3-5)
    relation: supports
