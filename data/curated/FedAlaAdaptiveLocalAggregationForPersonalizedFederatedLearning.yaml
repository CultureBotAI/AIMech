claims:
- claim_id: r455-layer-split-elementwise-clipped-aggregation-mechanism
  kind: mechanism
  statement: Combines layer-wise overwriting of the lower |Theta_i| - p generic layers (using fixed ones mask 1^{|Theta_i|-p}) with fine-grained element-wise interpolation of the top p higher layers via learnable weights W_i^p constrained to [0, 1] by element-wise clipping sigma(w) = max(0, min(1, w)) (Equation 4), and updates W_i^p via the chain-rule Hadamard gradient dL_i^t/dW_i^p = (dL_i^t/dTheta^hat_i^{t,p}) odot (Theta^{t-1} - Theta_i^{t-1})^p (Equation 5, Appendix A Equation 7) while freezing both Theta^{t-1} and Theta_i^{t-1}.
  evidence:
  - source_id: r455-primary-pdf
    locator: Section 3.2 Fine-Grained Model Aggregation & Weight Learning (Equations 2-5, Algorithm 1) and Appendix A Equation 7, pp. 11239-11240
    relation: supports
- claim_id: r455-plug-and-play-personalized-initialization-scope
  kind: scope
  statement: Operates purely as a client-side pre-training initialization step before local empirical risk minimization, requiring zero extra communication payload beyond standard global model broadcast/upload and functioning as a plug-and-play personalization module for existing federated optimizers (such as FedAvg, FedProx, andDitto).
  evidence:
  - source_id: r455-primary-pdf
    locator: Section 3.2 Discussion & Section 4.3 Applicability of ALA (Table 3), pp. 11240-11243
    relation: supports
- claim_id: r455-stateful-client-storage-and-warmup-cost-limitation
  kind: limitation
  statement: Requires clients to remain stateful across communication rounds to store their previous local model parameters Theta_i^{t-1} and persistent top-p aggregation weight tensor W_i^p, and incurs extra local gradient steps in the second round until W_i^p converges (typically ~10 epochs in round 2 followed by 1-2 epochs in subsequent rounds).
  evidence:
  - source_id: r455-primary-pdf
    locator: Section 3.2 Weight Learning & Appendix B Computation and Communication Overhead (Table 5), pp. 11240-11244
    relation: supports
- claim_id: r455-personalized-heterogeneous-vision-and-text-application
  kind: application
  statement: Applied to personalized federated image and text classification under pathological class-subset and Dirichlet label heterogeneity on MNIST, CIFAR-10, CIFAR-100, Tiny-ImageNet, and AG News.
  evidence:
  - source_id: r455-primary-pdf
    locator: Section 4 Experiments (Tables 1-4, Figures 3-5), pp. 11240-11243
    relation: supports
