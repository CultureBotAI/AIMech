id: AIMech:FedAlaAdaptiveLocalAggregationForPersonalizedFederatedLearning
name: FedALA (Adaptive Local Aggregation for Personalized Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: 'A personalized federated learning algorithm (Zhang et al. 2023, Section 3, Equations 1-6, Algorithm 1) whose Adaptive Local Aggregation (ALA) module initializes each client i''s local model Theta^hat_i^t before local training in iteration t by copying the lower |Theta_i| - p generic feature-extractor layers directly from the server-broadcast global model Theta^{t-1} while element-wise interpolating the top p task-specific layers between the client''s previous local model Theta_i^{t-1} and the global model Theta^{t-1} via learnable client-specific aggregation weights W_i^p clipped to [0, 1] by sigma(w) = max(0, min(1, w)): Theta^hat_i^t := Theta_i^{t-1} + (Theta^{t-1} - Theta_i^{t-1}) odot [1^{|Theta_i|-p}; sigma(W_i^p)] (Equation 4), where W_i^p is trained on an s% random subset D~_i^t of local data via W_i^p <- W_i^p - eta * (dL_i^t / dTheta^hat_i^{t,p}) odot (Theta^{t-1} - Theta_i^{t-1})^p with Theta^{t-1} and Theta_i^{t-1} frozen (Equation 5, Appendix A Equation 7).'
identity_notes: Distinct from APFL (Adaptive Personalized Federated Learning, Deng et al. 2020), which mixes a separately trained local model and global model using a single scalar mixing coefficient alpha_i in [0, 1] after or parallel to full-model training; and distinct from FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers) and FedRep (AIMech:FedRepSharedRepresentationPersonalizedFederatedLearning, Collins et al. 2021), which hard-code binary layer splits (sigma in {0, 1}) and discard all global information in the personalized head layers rather than learning element-wise [0, 1]-clipped pre-training initialization masks W_i^p.
aliases:
- FedALA
- Federated Learning with Adaptive Local Aggregation
- Adaptive Local Aggregation for Personalized Federated Learning
