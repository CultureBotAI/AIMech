id: AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding
name: QSGD (Quantized Stochastic Gradient Descent) with Elias Coding
concept_kind: algorithm
review_status: DRAFT
definition: A communication-efficient family of unbiased stochastic gradient quantization and lossless prefix-coding schemes (Alistarh, Grubic, Li, Tomioka, & Vojnovic 2017) for distributed data-parallel optimization on R^n that, given a number of quantization levels s >= 1 and a vector v != 0, maps each coordinate v_i to Q_s(v)_i = ||v||_2 * sgn(v_i) * xi_i(v, s) where xi_i(v, s) is independently rounded to (l_i + 1)/s with probability p_i = s * |v_i| / ||v||_2 - l_i and to l_i/s with probability 1 - p_i (for l_i = floor(s * |v_i| / ||v||_2)), and encodes the resulting sparse integer tuple (||v||_2, signs, non-zero run-length gaps, and quantization levels k_i = s * xi_i) via Elias recursive gamma/omega integer coding, guaranteeing unbiasedness E[Q_s(v)] = v, variance E[||Q_s(v) - v||_2^2] <= min(n / s^2, n^{1/2} / s) * ||v||_2^2, and expected communication <= (3/2 + 1/2 * log_2(2(s^2 + n)/s)) * s(s + n^{1/2}) + F bits per step (<= 2.818 * n + 32 bits when s = n^{1/2} with only 2x variance blowup).
identity_notes: Distinct from biased 1-bit sign compression signSGD (Bernstein et al. 2018, AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization), which discards the l_2 norm ||v||_2 and uses deterministic sign(v_i) without unbiased stochastic rounding or Elias run-length coding; from 1-bit SGD with error feedback (Seide et al. 2014; Karimireddy et al. 2019), which maintains a local residual memory e_t; and from post-training neural weight quantization (such as GPTQ or AWQ), which quantizes trained model weights for inference rather than stochastically quantizing and Elias-coding gradients during distributed SGD/SVRG training.
aliases:
- QSGD
- Quantized SGD
- Quantized Stochastic Gradient Descent
- QSVRG (Quantized SVRG)
