claims:
- claim_id: r378-claim-unbiased-stochastic-quantization-variance-and-sparsity-bounds
  kind: mechanism
  statement: For any v in R^n and quantization level count s >= 1, the stochastic rounding operator Q_s(v) satisfies E[Q_s(v)] = v (unbiasedness), E[||Q_s(v) - v||_2^2] = (||v||_2^2 / s^2) * sum_{i=1}^n p_i * (1 - p_i) <= min(n / s^2, n^{1/2} / s) * ||v||_2^2 (since sum_i p_i(1 - p_i) <= min(n, sum_i p_i) and sum_i p_i <= s * ||v||_1 / ||v||_2 <= s * n^{1/2}), and expected support size (induced sparsity) E[||Q_s(v)||_0] <= s^2 + s * n^{1/2} (Lemma 3.1, Lemma A.5).
  evidence:
  - source_id: r378-primary-pdf
    locator: Section 3.1, Lemma 3.1; Appendix A, Proof of Lemma 3.1 and Lemma A.5
    relation: supports
- claim_id: r378-claim-elias-coding-communication-complexity-tradeoff
  kind: mechanism
  statement: By encoding the index gaps between non-zero coordinates of Q_s(v) and their non-zero integer quantization levels k_i in {1, ..., s} with Elias recursive prefix codes (which use log_2(k) + O(log log k) bits for integer k >= 1 and satisfy Jensen's inequality on concave code-length upper bounds), QSGD transmits at most (3/2 + 1/2 * log_2(2(s^2 + n) / s)) * s * (s + n^{1/2}) + F bits in expectation (where F = 32 is float precision for ||v||_2); in particular, at s = n^{1/2}, QSGD increases gradient second-moment variance by at most 1 + min(n/s^2, n^{1/2}/s) = 2 while transmitting <= 2.818 * n + 32 bits per step instead of 32*n bits (~11.3x compression) (Theorem 3.4, Corollary 3.3, Theorem A.6).
  evidence:
  - source_id: r378-primary-pdf
    locator: Section 3.1-3.2, Theorem 3.2, Corollary 3.3, Theorem 3.4; Appendix A, Lemmas A.1-A.5 and Theorem A.6
    relation: supports
- claim_id: r378-claim-qsvrg-nonconvex-and-multi-gpu-bucketed-training
  kind: application
  statement: Extending Q_{n^{1/2}} to variance-reduced finite-sum optimization in Quantized SVRG (QSVRG, Theorem B.2 / G.2) achieves linear convergence E[f(y^{(P+1)}) - f(x^*)] <= (1/2)^P * (f(x_0) - f(x^*)) using <= P * (F + 2.8*n) * (T + 1) bits per processor, matching optimal communication lower bounds up to constants; in smooth non-convex and asynchronous optimization (Theorems C.1 and D.1) and bucketed d-block quantization (Section 3.3, variance min(d/s^2, d^{1/2}/s)) on 16-GPU ImageNet AlexNet, CIFAR-10 ResNet-110, and AN4 speech LSTM, 4-bit and 2-bit QSGD achieve 2.5x-3x end-to-end training speedups without accuracy loss.
  evidence:
  - source_id: r378-primary-pdf
    locator: Section 3.3-5, Table 1, Figures 1-2; Appendix B-D, Theorems B.2, C.1, D.1, and G.2
    relation: supports
