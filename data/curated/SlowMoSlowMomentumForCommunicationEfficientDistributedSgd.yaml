id: AIMech:SlowMoSlowMomentumForCommunicationEfficientDistributedSgd
name: SlowMo (Slow Momentum for Communication-Efficient Distributed SGD)
concept_kind: algorithm
review_status: DRAFT
definition: A general two-timescale distributed optimization wrapper (Wang et al. 2020, Section 2, Algorithm 1) in which m workers independently execute tau local steps of an arbitrary base optimizer x_{t,k+1}^{(i)} = x_{t,k}^{(i)} - gamma_t d_{t,k}^{(i)} (such as Local SGD, local momentum, or decentralized SGP/OSGP) starting from x_{t,0}^{(i)} = x_{t,0}, compute the exact global average x_{t,tau} = (1/m) sum_{i=1}^m x_{t,tau}^{(i)} every tau steps via AllReduce, and update the outer model via a slow momentum buffer u_{t+1} = beta u_t + (1 / gamma_t)(x_{t,0} - x_{t,tau}), x_{t+1,0} = x_{t,0} - alpha gamma_t u_{t+1} with slow learning rate alpha > 0 and slow momentum factor beta in [0, 1).
identity_notes: Distinct from standard Local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent, Stich 2019), which corresponds to the memoryless special case alpha = 1, beta = 0 without outer slow momentum u_t, and from FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam, Reddi et al. 2021), which focuses on adaptive second-moment server preconditioners (FedAdagrad, FedYogi, FedAdam) under partial client participation rather than wrapping decentralized gossip/SGP and local base optimizers with outer Polyak momentum and proving BMUF/Lookahead non-convex convergence.
