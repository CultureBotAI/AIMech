claims:
- claim_id: r426-auxiliary-extrapolated-sequence-and-nonconvex-convergence-theorem
  kind: mechanism
  statement: Defining the extrapolated auxiliary sequence y_{t,0} = x_{t,0} + (beta / (1 - beta)) (x_{t,0} - x_{t-1,0}) converts the outer momentum recurrence into the exact step y_{t+1,0} - y_{t,0} = -gamma_eff sum_{k=0}^{tau-1} (1/m) sum_{i=1}^m d_{t,k}^{(i)} with effective learning rate gamma_eff = alpha gamma / (1 - beta) (Appendix D.1, Eqs. 16-22), proving smooth non-convex convergence at rate O(1 / sqrt(m T tau)) whenever the base optimizer's local drift and bias are bounded (Section 5, Theorem 1).
  evidence:
  - source_id: r426-primary-pdf
    locator: Section 5 Convergence Analysis (Theorem 1, Corollaries 1-2) & Appendix D.1-D.3 (Equations 16-22, Proof of Theorem 1)
    relation: supports
- claim_id: r426-unification-of-bmuf-and-lookahead-nonconvex-guarantees
  kind: mechanism
  statement: Specializing SlowMo's base optimizer and hyperparameters (Section 3, Table 1) provides the first smooth non-convex convergence proofs for Blockwise Model-Update Filtering (BMUF, beta > 0 with Local SGD base, Corollary 1) and Lookahead (m = 1, beta = 0, alpha in (0, 1), Corollary 2), while wrapping Overlap-SGP (OSGP-SlowMo) reduces steady-state validation loss without increasing per-step communication latency.
  evidence:
  - source_id: r426-primary-pdf
    locator: Section 3 Relation to Existing Methods (Table 1) & Section 5 Corollaries 1-2
    relation: supports
- claim_id: r426-periodic-exact-allreduce-and-outer-hyperparameter-tuning-limitation
  kind: limitation
  statement: Requires an exact AllReduce synchronization across all m workers every tau steps to compute x_{t,tau} and introduces two additional outer hyperparameters (slow learning rate alpha and slow momentum beta).
  evidence:
  - source_id: r426-primary-pdf
    locator: Section 2-4 Algorithm 1 & Hyperparameter Sensitivity Analysis
    relation: supports
- claim_id: r426-imagenet-resnet50-and-wmt16-transformer-distributed-training-application
  kind: application
  statement: Applied to distributed training of ResNet-50 on ImageNet and Transformer neural machine translation models on WMT'16 En-De across up to 64 GPUs, consistently improving validation accuracy and training speed over Local SGD, BMUF, and SGP.
  evidence:
  - source_id: r426-primary-pdf
    locator: Section 4 Empirical Results (Tables 2-3, Figures 1-4), pp. 4-7
    relation: supports
