id: AIMech:BaikSilversteinSpikedPopulationCovarianceEigenvalueSeparation
name: Baik-Silverstein Eigenvalue Separation for High-Dimensional Spiked Population Covariance Matrices
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Baik-Silverstein Spiked Population Covariance Eigenvalue Limit Theorem
- Non-Gaussian Spiked Sample Covariance Outlier Eigenvalue Separation
- Baik-Silverstein Supercritical and Subcritical Spiked Eigenvalue Mapping
- Silverstein-Choi Companion Stieltjes Transform Spiked Eigenvalue Analysis
definition: Baik-Silverstein Eigenvalue Separation for High-Dimensional Spiked Population Covariance Matrices is a random-matrix spectral analysis methodology introduced by Baik and Silverstein (2006) that characterizes the exact almost-sure limits of extreme sample eigenvalues for general non-Gaussian real or complex spiked population covariance models B_p = (1/n) T_p^{1/2} Z_p Z_p' T_p^{1/2} as p, n -> infinity with p/n -> c > 0. Assuming independent and identically distributed standardized entries Z_{ij} with E[Z_{11}] = 0, E[|Z_{11}|^2] = 1, and E[|Z_{11}|^4] < infinity, and a population covariance matrix T_p having p - r unit eigenvalues and r = k_1 + ... + k_M fixed non-unit spike eigenvalues alpha_1 > ... > alpha_M > 0, the method analyzes the critical points of the finite-rank perturbed Silverstein-Choi companion inverse Stieltjes transform z_p(m) via Rouche's theorem and the Bai-Silverstein (1999) exact eigenvalue separation theorem. It proves that population spikes pull sample
  eigenvalues outside the Marcenko-Pastur bulk support [(1 - sqrt(c))^2, (1 + sqrt(c))^2] to the shifted asymptotic location psi(alpha_j) = alpha_j + c * alpha_j / (alpha_j - 1) with multiplicity k_j if and only if |alpha_j - 1| > sqrt(c) when 0 < c < 1, or alpha_j > 1 + sqrt(c) when c >= 1, while subcritical spikes collapse almost surely to the bulk edges.
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Baik & Silverstein (2006, Journal of Multivariate Analysis 97(6):1382-1408; arXiv:math/0408165v1, DOI:10.1016/j.jmva.2005.08.003). Distinct from AIMech:MarcenkoPasturConvexOptimizationSpectrumEstimation (El Karoui 2008, Ann. Statist. 36(6):2757-2790), which estimates the global limiting spectral distribution H via convex optimization of the unperturbed Silverstein-Choi equation without isolating finite-rank outlier spikes, from AIMech:SparsePrincipalComponentsAnalysisViaCoordinateVarianceSelectionAndThresholding (Johnstone & Lu 2009, JASA 104(486):682-693), which proves l2 eigenvector consistency of coordinate-variance selection and wavelet thresholding under sparsity, and from AIMech:DiagonalThresholdingAndSemidefiniteRelaxationSupportRecoveryForSparsePCA (Amini & Wainwright 2009, Ann. Statist. 37(5B):2877-2921), which analyzes signed support recovery via diagonal thresholding and semidefinite relaxation.
