claims:
- claim_id: companion-stieltjes-rouche-critical-point-perturbation
  kind: mechanism
  statement: For the companion sample covariance matrix underline(B)_n = (1/n) Z_p' T_p Z_p, Section 3 (Equations 3.1-3.26, Lemmas 3.1-3.4, pp. 11-14) writes the finite-rank perturbed Silverstein-Choi inverse Stieltjes transform z_p(m) = -1/m + c_p/(1 + m) + (1/n) [sum_{j=1}^M k_j alpha_j / (1 + alpha_j m) - r / (1 + m)] (with c_p = (p - r)/n -> c) and factors its derivative as z_p'(m) = [f(m) + (1/n) g(m)] / [m^2 (1 + m)^2 prod_{l=1}^M (1 + alpha_l m)^2] (eqs. 3.3-3.5). Applying Rouche's theorem perturbation lemmas (Lemmas 3.2-3.4), near each spike pole m = -1/alpha_j the local ratio G_j(-1/alpha_j) = -g(-1/alpha_j) / f_j(-1/alpha_j) = k_j (alpha_j - 1)^2 / [(alpha_j - 1)^2 - c_p] is strictly positive if and only if |alpha_j - 1| > sqrt(c_p), splitting the double root of f(m) at m = -1/alpha_j into two real critical points m_{j,+/-}^{(n)} = -1/alpha_j +- (1/(alpha_j sqrt(n))) sqrt(G_j(-1/alpha_j)) + O(1/n) where z_p'(m) > 0 on the intervals between poles and critical points, thereby generating
    an excluded spectral interval around z_p(-1/alpha_j) -> alpha_j + c alpha_j / (alpha_j - 1) into which exactly k_j sample eigenvalues separate by Proposition 2.1 (Bai-Silverstein 1999).
  evidence:
  - source_id: bs2006-spiked-pdf
    locator: Section 2, Proposition 2.1, pp. 8-11; Section 3, Equations (3.1)-(3.26) and Lemmas 3.1-3.4, pp. 11-14
    relation: supports
- claim_id: almost-sure-outlier-separation-and-subcritical-collapse-across-aspect-ratios
  kind: scope
  statement: 'Under fourth-moment standardization E[Z_{11}] = 0, E[|Z_{11}|^2] = 1, and E[|Z_{11}|^4] < infinity, Theorem 1.1 (0 < c < 1, pp. 3-4) proves that if M_0 population spikes satisfy alpha_j > 1 + sqrt(c) and M - M_1 spikes satisfy alpha_j < 1 - sqrt(c), then almost surely as n -> infinity with p/n -> c: (i) for 1 <= j <= M_0 and 1 <= i <= k_j, the top outlier sample eigenvalues satisfy s_{k_1 + ... + k_{j-1} + i}^{(p)} -> alpha_j + c alpha_j / (alpha_j - 1) > (1 + sqrt(c))^2 (eq. 1.10); (ii) the upper and lower bulk-edge sample eigenvalues satisfy s_{k_1 + ... + k_{M_0} + 1}^{(p)} -> (1 + sqrt(c))^2 (eq. 1.11) and s_{p - r + k_1 + ... + k_{M_1}}^{(p)} -> (1 - sqrt(c))^2 (eq. 1.12); and (iii) for M_1 + 1 <= j <= M and 1 <= i <= k_j, the bottom outlier sample eigenvalues satisfy s_{p - r + k_1 + ... + k_{j-1} + i}^{(p)} -> alpha_j + c alpha_j / (alpha_j - 1) < (1 - sqrt(c))^2 (eq. 1.13). When c > 1 (Theorem 1.2, pp. 4-5) or c = 1 (Theorem 1.3, p. 5), only supercritical upper spikes
    alpha_j > 1 + sqrt(c) separate above (1 + sqrt(c))^2 (eq. 1.17), while small population eigenvalues alpha_j < 1 have no asymptotic outlier effect outside the bulk, with s_n^{(p)} -> (1 - sqrt(c))^2 and s_{n+1}^{(p)} = ... = s_p^{(p)} = 0 for c > 1 (eqs. 1.19-1.20).'
