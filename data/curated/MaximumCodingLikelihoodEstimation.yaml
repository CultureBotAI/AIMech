claims:
- claim_id: method
  kind: mechanism
  statement: For a compatible positive Markov-field model with observed configuration x, choose a nonempty
    set S containing no neighboring pair and let C be its complement. Conditional on X_C=x_C, the variables
    in S are mutually independent, so L_S(theta;x_S|x_C)=product_(i in S) p_theta(x_i|x_(-i)). Maximize
    its log over valid theta. The complement supplies conditioning values even though its own site likelihood
    factors are omitted. A rectangular four-neighbor graph admits checkerboard coding; adding diagonal
    interactions requires another independent-set design, such as the source’s four shifted patterns.
    Changing the selected set changes the conditional likelihood. The full-site pseudolikelihood equals
    the product of coding likelihoods for a partition into independent sets, but maximizing that product
    differs in general from averaging separately fitted parameters.
