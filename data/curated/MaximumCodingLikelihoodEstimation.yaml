name: Maximum coding likelihood estimation
definition: A conditional parameter-estimation method that selects mutually non-neighboring sites in a
  Markov field and maximizes their joint conditional likelihood, which factors into sitewise full conditionals
  given the remaining observed sites.
concept_kind: algorithm
identity_notes: 'This record uses the classical independent-site coding method of Besag. Coding selects
  a graph-independent subset; it does not encode features, compress data or learn sparse representations.
  Shifted or alternative coding sets can give additional dependent estimates. Extensions using conditionally
  dependent blocks require their joint conditional likelihoods rather than this independent-singleton
  product. The method is distinct from multiplying all site conditionals as pseudolikelihood and from
  state updates in ICM or Gibbs sampling. No normalized identity match was found across all 442 pinned
  AIO labels and all scoped synonyms and 400 preceding native IDs, names and aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, yielding 35 and 35 matched lines; all
  23 unique contents were read. Hits are citations, contextual statements and discovery leads rather than
  records of these identities. All 182 semantic label/synonym hits were read. Thirty-one fully annotated
  exact CLASS nodes and outgoing edges were inspected: 23 byte-equivalent to prior inspected nodes and
  eight freshly read. Thirty-nine contextual YAMLs comprise 31 generated and eight native records: 29
  byte-verified after prior reading and 10 freshly read. Short acronyms were included in the normalized
  identity comparison. Absence is bounded to the pinned snapshot, maintained corpus and inspected semantic
  neighborhood.'
limitations:
- The factorization needs a valid graph and the stated joint conditional-independence property. It is
  not justified by spatial distance alone or by arbitrary, incompatible local distributions. Hard support
  constraints require separate treatment beyond the positive-model construction.
- Choosing a large independent set need not yield a unique selection or the most informative estimator.
  Conditioning omits some likelihood information while retaining the complement as covariates; it does
  not literally discard all white-site observations.
- Estimates and tests from shifted coding patterns reuse the same configuration and are generally dependent.
  Combining them requires a justified procedure; neither naive independent-test calibration nor an arithmetic
  average of estimates is automatically optimal.
- Conditional likelihood-ratio comparisons require comparable selected dependent sites and conditioning
  sets. The source warns against comparing fits based on different codings as if they were the same likelihood.
  Ordinary asymptotic approximations still require identifiability, information and regularity conditions.
- The source’s unconstrained coding estimates can violate the intended joint-model parameter restrictions.
  A conditional objective may be finite where the full Gaussian field is invalid, so the parameter domain
  must be enforced. Averaging happened to yield admissible values in some reported examples and is not
  a general repair.
- The inspected plant and wheat data illustrate estimation and model diagnostics, while exposing model
  inadequacy and aggregation effects. They do not prove general efficiency or spatial prediction accuracy.
  No empirical data fitting, author implementation or benchmark was reproduced.
