aio_mappings:
- target: AIO:ExponentialFunction
  relation: related_match
  rationale: The mandatory scalar exponential global-scale update is a defining component related to the
    pinned exp/e^x function. The optimizer is neither equivalent to nor a subclass of that function. This
    relation does not interpret the matrix exponential as elementwise scalar exponentiation and does not
    introduce neural activation or layer semantics.
limitations:
- The evidence owner is the eight-page 2010 author manuscript associated with the GECCO paper. Research
  read native text on PDF pages 1–6 and 8 and visuals 4–6; root reading has its own ledger and visually
  checked Algorithm 1. The alternate author-hosted PDF has different bytes and metadata but identical
  extracted text on all eight pages. This is not a benchmark replication, full implementation audit or
  author-issued erratum.
- Use Algorithm 1 consistently with covariance A*A^T, samples mu+A*z, mean transport A and a right factor
  exponential. The source Equation 8 on page 5 omits that mean transport. Equation 6 on page 4 displays
  the ordinary Frobenius matrix score with a factor 1/2, whereas Algorithm 1 and expanded page-5 updates
  use the unhalved natural-score sum. In ordinary symmetric-matrix coordinates the Fisher bilinear form
  is tr(U*V)/2; its inverse accounts for this factor. The notation should not be mixed without that metric
  qualification.
- The displayed local log density on page 4 contains -tr(A), lacks the mean-offset dependence and the
  trace-M normalizer, and its intermediate mean derivative does not consistently carry the local coordinate
  transport. The coherent Algorithm 1 and its Gaussian score interpretation are used; these intermediate
  displays are not certified. Section 4.2 also places the factor in the positive-definite symmetric cone,
  although its general right update need not preserve factor symmetry. Positive definiteness concerns
  the covariance.
- The source prose assumes det(B)=1, while the Algorithm 1 initialization uses abs(det(A)). A positive-determinant
  factor satisfies the prose convention; arbitrary nonsingular input instead preserves abs(det(B))=1.
  The method requires a valid nonsingular initial factor and finite updates. Matrix exponential domain
  preservation in exact arithmetic does not prevent numerical collapse or guarantee a useful search distribution.
- 'Retained comparison context: Wierstra et al. 2014, Algorithm 5 at PDF page 16/printed 964, samples
  using B^T but transports the mean with B and right-multiplies the factor. Its displayed covariance update
  on PDF page 18/printed 966 also does not follow that right update under its A^T*A convention for a general
  nonsymmetric factor. The 2011 SNES paper repeats this mixed convention in its xNES background. These
  contextual discrepancies are not silently imported into the 2010 algorithm, and no repaired or executable
  author-code version is claimed.'
- The exact utility curve, population size, learning rates, tie handling, constraint policy and stopping
  rule remain configuration choices. Table 1 supplies empirical defaults, not defining constants or optimality
  guarantees. Rank shaping and centered utility baselines alter the finite sampled update; they should
  not be described as unbiased raw-fitness gradients. A constant or uninformative ranking need not yield
  useful progress.
- Full-factor sampling and weighted outer-product accumulation require O(n*d^2) arithmetic for n offspring,
  while a dense matrix exponential commonly costs O(d^3); sorting and objective evaluations add costs.
  This loop accounting is not a runtime measurement. No dimension-independent whole-generation cost, universal
  superiority, monotonic fitness improvement, finite-budget global optimum or general convergence rate
  is asserted.
- Generic NES, diagonal Gaussian SNES, full CMA-ES and the separately assessed IGO flow/Euler framework
  remain distinct. Unequal block learning rates rescale natural-gradient components. The finite exponential
  retraction is not an exact finite-time solution of a general IGO flow, and the first-order covariance
  comparison does not equate default signed xNES utilities with every CMA-ES weighting scheme. Heavy-tailed,
  hill-climber, adaptation-sampling and importance-mixing variants are not silently added.
- Both discovered standalone author Python URLs returned HTTP 500 during this research. No author code
  was acquired, executed or verified. The initial primary-download DNS failure and successful retry, publisher
  access failures, exact PDF versions and hand-derived transpose witnesses remain in the research provenance.
  This draft does not replace those failures with a successful implementation claim.
