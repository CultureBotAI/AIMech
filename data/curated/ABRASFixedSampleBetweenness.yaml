  rationale: No examined AIO target denotes this fixed-sample shortest-path fraction estimator and its
    returned concentration bound. Statistical-learning tools and shared graph or sampling terminology
    do not establish an identity with clustering, language modeling, preprocessing or bias concepts.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: A centrality vector assigns scores without grouping vertices into clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Absence of labels does not turn structural score computation into clustering.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity is a particular fixed-sample shortest-path fraction estimator and error-bound
      computation, not solely an input-output function.
  - target: AIO:DataPreparation
    rejection_reason: Computing network prominence is the defined result; incidental downstream feature
      use does not establish a preprocessing identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The static graph sampling and concentration method has no language-model objective
      or training mechanism.
  - target: AIO:RankingBias
    rejection_reason: A structural graph score is not the belief that high-ranked information is necessarily
      relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Uniform pair sampling and its confidence bound define an algorithm, not selection
      or sampling bias.
  - target: AIO:RepresentationBias
    rejection_reason: A graph centrality computation is not subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: Neither labels nor a deep neural network are acquired or fitted.
  - target: AIO:DataDredgingBias
    rejection_reason: Returning a one-shot concentration bound does not make the algorithm itself a data-dredging
      bias concept.
limitations:
- Fixed positive S is independent of sampled values. Adaptive selection of the final count requires a
  different validity argument.
- Unreachable pairs contribute zero without being removed from the population; endpoints do not contribute,
  but the denominator remains n(n-1).
- Strict positive edge lengths or unweighted graphs and exact path counts are maintained. Zero-weight
  cycles, approximate distances/counts and numerical ties need separate conventions.
- The first-stage delta/2 allocation and one-shot delta allocation are distinguished. Any numerical Rademacher
  upper bound must remain conservative. No preselected accuracy, rank preservation or generally useful
  bound at small S is promised.
- The author manuscript retains placeholder journal fields; no publisher-byte identity is asserted. Full
  text, selected mathematical pages and all figures were inspected, but not every proof equation visually
  checked. No author software or benchmark was executed.
- The finite calculations test selected mathematical boundaries. The record remains DRAFT after author
  self-review.
