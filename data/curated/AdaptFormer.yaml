claims:
- claim_id: adaptformer-parallel-relu-bottleneck-and-zero-up-initialization
  kind: mechanism
  statement: AdaptFormer's AdaptMLP module computes x_tilde_l = ReLU(LN(x'_l) * W_down) * W_up in parallel with the frozen MLP block via x_l = MLP(LN(x'_l)) + s * x_tilde_l + x'_l (Equations 3-4), adding 2*d*d_hat + d_hat + d parameters per layer, and initializes W_down with Kaiming Normal/Uniform while zero-initializing W_up and all adapter biases so the adapted block exactly matches the pre-trained identity function at the start of fine-tuning (Algorithm 1).
  evidence:
  - source_id: r696-primary-pdf
    locator: Section 3.2-3.3, Equations 3-4, pp. 4-5; Section 4.1, p. 6; Appendix A.8, Algorithm 1, p. 21
    relation: supports
- claim_id: adaptformer-image-and-video-recognition-scalability
  kind: application
  statement: "With d_hat = 64 (1.26M trainable parameters, 1.46% of ViT-Base), AdaptFormer-64 achieves 59.02% Top-1 accuracy on Something-Something v2 and 55.69% on HMDB51 with self-supervised VideoMAE pre-training\u2014outperforming 100% full fine-tuning (53.97% and 46.41%) by +5.05% and +9.28% and VPT (43.73% and 52.67%) by +15.29% and +3.02%\u2014while parallel insertion outperforms sequential insertion (59.02% vs. 58.17%) and top-layer placement (layers 7-12: 57.99%) outperforms bottom-layer placement (layers 1-6: 50.48%)."
  evidence:
  - source_id: r696-primary-pdf
    locator: Section 4.2 & 4.5, Tables 1 & 3, pp. 6-9; Figure 6, p. 9
    relation: supports
- claim_id: adaptformer-scaling-factor-and-in-domain-subset-limitation
  kind: limitation
  statement: AdaptFormer requires a small scaling factor s < 1 (optimal s = 0.10) on vision tasks because large scaling factors (such as s = 4 used in NLP) cause unstable fine-tuning, and when fine-tuning on ImageNet-1K using ImageNet-21K pre-trained weights (where the target dataset is a subset of the pre-training dataset), increasing the middle dimension from d_hat = 1 (82.33%) to d_hat = 64 (81.86%) degrades accuracy due to over-perturbing the pre-trained model.
  evidence:
  - source_id: r696-primary-pdf
    locator: Section 4.5, Table 3c, pp. 8-9; Appendix A.4, Table 9, pp. 19-20
    relation: supports
