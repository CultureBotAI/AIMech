id: AIMech:AdaptFormer
name: AdaptFormer
concept_kind: architecture
review_status: DRAFT
definition: A parameter-efficient Vision Transformer adaptation architecture that replaces each encoder block's feed-forward network (MLP) with a dual-branch AdaptMLP module consisting of the frozen pre-trained MLP in the left branch and a lightweight trainable down-ReLU-up bottleneck in the right branch connected in parallel via a scaling factor s (default s = 0.10). Given post-attention tokens x'_l in R^{N x d}, the right branch computes adapted features x_tilde_l = ReLU(LN(x'_l) * W_down) * W_up with W_down in R^{d x d_hat}, W_up in R^{d_hat x d} (d_hat << d), and fuses them with the frozen MLP branch via residual connection x_l = MLP(LN(x'_l)) + s * x_tilde_l + x'_l, introducing 2*d*d_hat + d_hat + d trainable parameters per layer while keeping all pre-trained weights frozen.
identity_notes: Distinct from sequential bottleneck adapters (AIMech:BottleneckAdapter; Houlsby et al., 2019), which insert adapters sequentially after MHSA and/or MLP sub-layers, and from Visual Prompt Tuning (AIMech:VisualPromptTuning), which prepends learnable tokens into the attention sequence (and suffers optimization instability when token counts scale up on video tasks or under hierarchical shifted-window attention in Swin Transformers). Also distinct from SSF (AIMech:SSFScaleAndShiftFeatures), which applies channel-wise linear scale/shift modulation rather than a parallel nonlinear ReLU bottleneck.
