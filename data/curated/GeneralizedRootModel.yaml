claims:
- claim_id: method
  kind: mechanism
  statement: Choose finite p and a finite maximum interaction order k, a scalar nonnegative sufficient
    statistic T, a base log measure B and a product reference measure. Let s_j(t) be the specified j-th-root
    statistic. Normally s_j=T^(1/j); the paper explicitly uses s_j=f^c when T=f^(c*j) for a positive integer
    c, allowing the signed Gaussian convention s_2(x)=x when T=x^2. For 1<=ell<=j<=k, let Psi_j^ell be
    a finite real super-symmetric order-ell tensor with zero entries whenever indices repeat. Define H(x)=sum_j
    sum_(ell<=j) <Psi_j^ell,s_j(x)^(tensor ell)> using all ordered indices, and p(x)=Z^(-1)*exp[H(x)+sum_i
    B(x_i)], requiring 0<Z<infinity. The site-s conditional has kernel exp[sum_j eta_js*s_j(t)+B(t)],
    where eta_js=sum_(ell<=j) ell*<the slice of Psi_j^ell with one index fixed at s,s_j(x_-s)^(tensor
    (ell-1))>. Zero repeated-index entries remove terms with the site occurring more than once. At k=1
    the law is an independent base family at valid parameters. At k=2 it recovers SQR with Psi_1^1=diag(Phi),
    Psi_2^1=theta and Psi_2^2 equal to off-diagonal Phi. Higher-order terms can encode interactions not
    representable by a pairwise log potential.
