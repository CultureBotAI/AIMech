claims:
- claim_id: r659-claim-linear-sum-parameter-complexity-reduction
  kind: mechanism
  statement: By sharing the n matrices {A_i}_{i=1}^n in R^{n x n} (n^3 parameters total) across all layers and parameterizing each down- and up-projection's B_i via rank-one vectors s_i in R^{k/n} and t_i in R^{d/n} (n(k/n + d/n) = k + d parameters per projection), Compacter reduces total adapter weight parameters for an L-layer encoder-decoder Transformer from 4 L k d (O(k d)) in standard adapters and 4 L (k d / n + n^3) (O(k d / n)) in PHM-Adapters to 4 L (k + d) + n^3 (O(k + d)), and to 2 L (k + d) + n^3 in Compacter++.
  evidence:
  - source_id: r659-primary-pdf
    locator: Section 4 (Parameter Efficiency), p. 5; Appendix B, Table 6, p. 16
    relation: supports
- claim_id: r659-claim-glue-superglue-and-low-resource-generalization
  kind: application
  statement: On T5-base (222M parameters), Compacter (0.073% trainable parameters) and Compacter++ (0.047% trainable parameters, 2127.66x fewer than full fine-tuning) match or outperform full fine-tuning and prior PEFT baselines (Adapter, Pfeiffer-Adapter, AdapterDrop, Prompt Tuning, Intrinsic-SAID, BitFit) on GLUE (86.62 and 86.47 vs. 86.50 average) and SuperGLUE (71.57 and 71.82 vs. 70.06 average) as well as low-resource GLUE subsamples of 100 to 4000 examples while reducing peak GPU training memory by 41.94% and epoch time by 26.51%.
  evidence:
  - source_id: r659-primary-pdf
    locator: Section 5.3-5.6, Tables 1-3 & Figure 4, p. 7-10
    relation: supports
- claim_id: r659-claim-nonlinear-bottleneck-unmergeable-inference-limitation
  kind: limitation
  statement: Because Compacter inserts serial adapter blocks A^l(x) = LPHM^{U^l}(GeLU(LPHM^{D^l}(x))) + x containing a nonlinear GeLU activation after attention and feed-forward sublayers, its learned weights cannot be algebraically folded into the frozen backbone weight matrices at inference time, and on small backbones such as T5-small (60M) all parameter-efficient methods including Compacter underperform full fine-tuning.
  evidence:
  - source_id: r659-primary-pdf
    locator: Section 2.2 & 3.2, Equation (2) & p. 5; Appendix E (Impact of Model Size), Table 9, p. 18
    relation: supports
