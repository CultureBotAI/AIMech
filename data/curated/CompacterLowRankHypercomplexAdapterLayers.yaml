id: AIMech:CompacterLowRankHypercomplexAdapterLayers
name: Compacter (Low-Rank Hypercomplex Adapter Layers)
concept_kind: algorithm
review_status: DRAFT
definition: 'Compacter (Compact Adapter) is a parameter-efficient fine-tuning method for pretrained Transformer models that replaces the dense down-projection D^l in R^{k x d} and up-projection U^l in R^{d x k} of bottleneck adapter modules A^l(x) = U^l(GeLU(D^l(x))) + x with Low-rank Parameterized Hypercomplex Multiplication (LPHM) layers: A^l(x) = LPHM^{U^l}(GeLU(LPHM^{D^l}(x))) + x. For a user-specified hyperparameter n dividing input dimension k and bottleneck dimension d, each LPHM weight matrix W in R^{k x d} is synthesized as the sum of n Kronecker products between shared "slow" weights A_i in R^{n x n} (shared across all adapter layers and positions in the network) and adapter-specific "fast" rank-r matrices B_i = s_i t_i^T in R^{(k/n) x (d/n)} with s_i in R^{(k/n) x r} and t_i in R^{r x (d/n)} (typically r = 1): W = sum_{i=1}^n A_i (x) (s_i t_i^T). Its variant Compacter++ retains only the post-feed-forward Compacter module per Transformer block.'
identity_notes: Distinct from standard bottleneck adapters (Houlsby et al., 2019), which parameterize U^l and D^l as unconstrained dense matrices costing 4 L k d parameters across L encoder-decoder layers, and from PHM-Adapter, which does not share A_i across layers or factorize B_i into rank-one outer products (costing 4 L (k d / n + n^3) parameters). Also distinct from LoRA (Hu et al., 2022), which adds parallel low-rank updates directly to frozen attention weights without a nonlinear GeLU bottleneck or Kronecker hypercomplex multiplication.
aliases:
- Compacter
- Compacter++
- Low-Rank Parameterized Hypercomplex Multiplication Adapter
- LPHM Adapter
