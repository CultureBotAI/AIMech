  rationale: The algorithm predicts scalar responses from training input/response pairs using query-local
    probabilistic regression. RegressionAnalysis denotes the general task, not this neighborhood selection
    and refitting procedure, so the relation is related without equivalence or subclass assertion.
limitations:
- The distance is a pseudometric when one or more mean-derived weights vanish, and all inputs tie if every
  weight vanishes. No universal tie-break, minimum effective neighborhood size, rescaling convention or
  fallback for invalid local fits is specified here. Small neighborhoods and poorly scaled or irrelevant
  inputs can impair fitting.
- The neighborhood rule uses only squared posterior means. It does not propagate the first fit’s full
  lengthscale uncertainty into neighbor selection, nor does a small weight establish exact posterior variable
  exclusion. Sign changes leave this diagonal distance unchanged; this does not assert sign invariance
  of every finite-feature model at fixed spectral draws.
- Nonconjugate variational fixed-point updates can have local optima or fail to improve the bound; the
  source explicitly does not guarantee convergence. Half-Cauchy scale-factor normalizers require one-dimensional
  integration. Detailed adaptive-step initialization/rollback notation and an executable author implementation
  remain separate pending audits; the neighborhood rule is not presented as a verified fitting implementation.
- Query-specific finite spectral fits need not equal conditioning a single coherent nonstationary GP.
  The variational predictive mixture is generally not Gaussian; moment-based evaluation does not establish
  exact mixture shape or calibrated intervals. Neighbor search, preprocessing, failed fits and repeated
  query fits prevent inferring constant total cost from a fixed k.
- The source’s spectral-density covariance prose below Equation 3 conflicts with its displayed kernel
  and subsequent reparameterization; this record follows Equations 1, 4 and 16. The predictive-variance
  display has a feature-transpose inconsistency, so no unqualified copy of that display is used as mechanism
  evidence.
- All preprint pages were read; the publisher page supplied bibliographic confirmation and a subscription
  preview, not the complete journal text. The author page returned HTTP 502. No author implementation
  was located in the bounded code-search queries, which is not an exhaustive absence claim. No author
  code, model fitting, training, paid access or benchmark was run. Exact finite curator arithmetic checks
  only the distance boundary at supplied illustrative parameters. The record remains DRAFT.
