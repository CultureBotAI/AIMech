id: AIMech:TwoStageAdaptiveNeighborhoodSparseSpectrumRegression
name: Two-stage adaptive-neighborhood sparse-spectrum regression
aliases: []
concept_kind: algorithm
definition: A query-specific sparse-spectrum regression procedure that fits a variational model to Euclidean
  neighbors, reselects neighbors from the full training set using squared posterior-mean inverse-lengthscales,
  and refits a second local model for prediction.
identity_notes: 'Compared all 442 pinned AIO IDs, names and scoped synonyms and 549 maintained IDs, names
  and aliases; no normalized match for this identity. Full-text fixed-string searches of the recovery,
  older discovery and original Documents checkouts included hidden and ignored files, with 6, 0 and 0
  matched lines. All five distinct matched contents were read: source leads and source-reading context,
  not existing records. Assessed 40 semantic AIO rows, 155 maintained names/definitions, eight full annotated
  AIO CLASS nodes with incident edges and generated YAML, and six complete native context records. This
  query-specific neighborhood-selection and refitting algorithm differs from the generic GP and SSGP model
  families, Gal–Turner global spectral inference, neighbor-response averaging, and the NCA, LMNN and RCA
  representation-learning procedures. Its descriptive local name denotes the variational two-stage method
  in Tan et al. Section 6; the point-estimate SSGP adaptation is contextual. Absence is bounded to the
  searched pin and corpus.'
definition_evidence:
- source_id: tan2015
  locator: Section 6, two-stage adaptive-neighborhood procedure and Equation 16, PDF p. 8
  relation: supports
claims:
- claim_id: local-fitting-context
  kind: mechanism
  statement: For scalar responses y_i at inputs x_i in R^d, Tan et al. use m fixed standard-normal spectral
    draws s_r and paired features cos((s_r elementwise x_i)^T*lambda) and sin((s_r elementwise x_i)^T*lambda).
    The 2m coefficients have a conditional Gaussian prior and observations have Gaussian noise. A shared
    vector lambda controls all features; its Gaussian variational factor has mean mu_lambda and may have
    full covariance. The local models in Section 6 use the paper’s adaptive nonconjugate variational message-passing
    Algorithm 2. This is a specified approximate fitting routine, without a convergence or exact-posterior
    guarantee.
  evidence:
  - source_id: tan2015
    locator: Sections 2–4, Equations 4–5 and variational family, PDF pp. 3–7; Section 6 local fits, PDF
      p. 8
    relation: supports
- claim_id: two-stage-selection
  kind: mechanism
  statement: Given N finite training pairs D={(x_i,y_i)}, a fixed query x_star and an integer neighborhood
    size k with 1<=k<=N, select the k closest training inputs by Euclidean distance, forming index set
    N1. Fit local model M1 to the pairs indexed by N1. Let mu_lambda be the posterior-mean vector from
    M1 and define d_mu(x_star,x_i)=sqrt(sum_l mu_lambda_l^2*(x_star_l-x_i_l)^2). Select k nearest inputs
    from the entire original training set D using this weighted distance, forming N2; N2 is not restricted
    to N1. Fit a fresh local model M2 to the pairs indexed by N2 and use its variational posterior for
    prediction at x_star. These steps assume the local fits produce valid finite variational parameters;
    neighbor ties require a specified implementation convention.
  evidence:
  - source_id: tan2015
    locator: Section 6, two numbered stages and Equation 16, PDF p. 8
    relation: supports
- claim_id: distance-interpretation
  kind: mechanism
  statement: The weights in Equation 16 are squares of the first fit’s posterior means, (E_q[lambda_l])^2,
    rather than posterior second moments E_q[lambda_l^2]. The latter would add Var_q(lambda_l) and generally
    select different neighbors. Although the source calls lambda a lengthscale, Equation 1 uses exp(-0.5*sum_l
    lambda_l^2*h_l^2), so its magnitude is an inverse-lengthscale parameter. Larger magnitude makes a
    fixed input displacement farther in the adapted distance; a zero posterior mean removes that coordinate
    from this distance even if its posterior variance is large. This is a plug-in neighborhood rule, not
    Bayesian averaging of neighborhood memberships.
  evidence:
  - source_id: tan2015
    locator: Section 2, Equation 1, PDF p. 3; signed lambda and relevance discussion, PDF p. 4; Section
      6, Equation 16 and interpretation, PDF p. 8
    relation: supports
- claim_id: query-specific-prediction
  kind: scope
  statement: Repeat the two local fits separately for each requested prediction location. The second fitted
    variational distribution, not the first fit or an average of neighboring responses, supplies the predictive
    inference. The source uses approximate integration of the Gaussian observation model under variational
    factors for coefficients, lambda and noise scale. Query-local fitting allows different neighborhoods
    and smoothing/noise estimates at different locations; the construction does not itself provide a single
    joint posterior covariance across all query locations.
  evidence:
  - source_id: tan2015
    locator: Section 5, Equation 15, PDF pp. 7–8; Section 6, PDF p. 8
    relation: supports
- claim_id: two-stage-boundary
  kind: limitation
  statement: The published neighborhood procedure stops after two fits. The authors advise against repeatedly
    adapting the neighborhood because expansion and contraction can cycle; there is no asserted fixed-point
    guarantee. Their experiments also apply the same neighborhood construction to point-estimate SSGP
    fits by replacing mu_lambda with fitted lambda estimates. That comparator does not possess the variational
    posterior over lambda and is distinguished from this record’s variational instantiation.
  evidence:
  - source_id: tan2015
    locator: Section 6, summary after the two numbered stages, PDF p. 8
    relation: supports
