  relation: supports
claims:
- claim_id: factored-temporal-connections
  kind: mechanism
  statement: For a source hidden unit j and destination i, the displayed lag-k connection has spatial
    weight W_(j,i) multiplied by lambda_j^(k-1). Input units use a separate set of temporal parameters.
    Hidden-state computation combines these weighted histories before applying the nonlinearity; it does
    not average separately evolved nonlinear trajectories. Source-specific factors tie lag weights rather
    than learning an unrelated full matrix for each lag. This mechanism differs from discrete clock schedules
    or input-dependent gate values.
  evidence:
  - source_id: sutskever2009
    locator: Section 3, Equations 6–7 and footnote 1, manuscript/PDF pp. 6–7
    relation: supports
- claim_id: recursive-traces-and-time-indexing
  kind: mechanism
  statement: The source initializes its traces at zero and rewrites each hidden trace as S_y(t)=y(t-1)+lambda_y*S_y(t-1),
    with an analogous input trace S_x(t)=x(t-1)+lambda_x*S_x(t-1). These recurrences reproduce the displayed
    finite exponential sums without explicitly revisiting all previous times. The kernel equations use
    delayed inputs, whereas the background ordinary-RNN equation uses current input. Setting lambda to
    zero selects the most recent term under the chosen indexing convention; a literal comparison to the
    background equation must account for that input-time alignment.
  evidence:
  - source_id: sutskever2009
    locator: Equations 1 and 6–11, manuscript/PDF pp. 3, 6–7; Section 3.1, p. 8; curator indexing consequence
    relation: supports
- claim_id: unnormalized-memory-and-stability
  kind: limitation
  statement: The displayed traces are unnormalized sums, without a (1-lambda) multiplier. For a fixed
    bounded driving sequence of magnitude at most M and 0<=lambda<1, their magnitude is at most M/(1-lambda),
    so the bound grows as lambda approaches one. Decay of a trace does not ensure contraction of the coupled
    learned recurrent system, permanent memory, or nonvanishing gradients. Learned spatial weights and
    nonlinear derivatives also enter the full transition Jacobian.
  evidence:
  - source_id: sutskever2009
    locator: Equations 8–11 and Section 3.1, manuscript/PDF pp. 7–8; curator geometric-sum and derivative
      consequences
    relation: supports
- claim_id: learned-timescales-and-multiple-kernels
  kind: scope
  statement: The positive-decay configuration learns a time-shared unconstrained parameter ell through
    lambda=sigmoid(ell); it is not a gate recomputed from each input. The source discusses negative lambda
    as a mathematical extension outside that positive-sigmoid parameterization. It also defines TKRNN+n
    by summing multiple exponentially factored connection components with different scales and weights.
    Those components combine before the state nonlinearity, rather than constituting an ensemble of independently
    run networks. Their learned coefficients need not define nonnegative normalized attention weights.
  evidence:
  - source_id: sutskever2009
    locator: Section 3 and Section 3.1, manuscript/PDF pp. 5–9
    relation: supports
- claim_id: timescale-and-computation-boundaries
  kind: limitation
  statement: The authors note that direct influence at long lags becomes small, that unsuitable initial
    decay scales can impede learning, and that very slow traces provide coarse temporal summaries. Recursive
    traces make a fixed-component forward computation linear in sequence length for fixed network dimensions,
    but this does not imply constant total training memory or a hardware-independent speed guarantee.
    Adding kernel components increases the maintained traces and arithmetic. The author manuscript supplies
    figure captions without the corresponding artwork, and no implementation or runtime was inspected.
  evidence:
  - source_id: sutskever2009
    locator: Section 3 and Section 3.1, manuscript/PDF pp. 5–9; curator recurrence-cost consequence
    relation: supports
- claim_id: conditional-recall-and-negative-result
  kind: limitation
  statement: The main experiment uses a selected multiple-kernel model on cued serial recall with a small
    alphabet, chosen word length and variable delay, truncated long sequences, and specified capacities
    and optimization settings. Its top-one and top-two character predictions during the second occurrence
    measure partial next-symbol recall, not perfect reconstruction of every whole sequence or universal
    memory capacity. The manuscript also reports failure on a multiple quadratic-function prediction task
    where the cited LSTM comparison succeeded. The suggestion that a different optimizer should resolve
    this is not a demonstrated result. No numerical benchmark, historical priority, universal LSTM equivalence
    or independent reproduction is asserted.
  evidence:
  - source_id: sutskever2009
    locator: Sections 5–5.1 and conclusion, manuscript/PDF pp. 10–13
    relation: supports
