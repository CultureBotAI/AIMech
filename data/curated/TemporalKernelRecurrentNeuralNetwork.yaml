id: AIMech:TemporalKernelRecurrentNeuralNetwork
name: Temporal-kernel recurrent neural network
aliases:
- TKRNN
concept_kind: architecture
definition: A recurrent architecture that factors connections across time into learned spatial weights
  and source-specific exponential temporal kernels, maintaining recursive traces of past inputs and hidden
  activations before the nonlinear state update.
identity_notes: Compared all 442 pinned AIO and 578 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 3, 0, 0 lines. All distinct match contents were
  read and concern discovery leads and reviewed context, not an existing exact record. Semantic matching
  inspected 63 AIO and 150 native definitions, with unchanged preceding rows verified and new matches
  read. Four full annotated AIO node/edge/generated contexts and four full native records were inspected.
  The temporal-kernel architecture factors lag weights and filters past input and hidden activities before
  its nonlinear state computation. SCRN has a separate context trace and constrained recurrent block;
  Clockwork uses prescribed module ticks; GF-RNN uses input-dependent pair gates. The existing NARX record
  denotes a generic finite-lag input-output model family, not this source-specific exponential neural
  realization. Fast persistent contrastive divergence is a training algorithm and Oja is a weight update.
  Multiple exponential components remain configurations; no priority for leaky recurrence is asserted.
  RecurrentNeuralNetwork is the selected broader architecture mapping; none of the three other full AIO
  contexts establishes exact identity or a better broader target.
