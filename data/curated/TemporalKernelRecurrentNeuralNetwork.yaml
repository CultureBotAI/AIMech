limitations:
- The inspected source is the author manuscript dated 30 July 2009, not the final 2010 journal layout.
  All fifteen manuscript pages were read, but the two figure artworks are absent; captions alone do not
  establish graphical details.
- The delayed-input indexing in the kernel equations is retained explicitly. No silent substitution of
  current input or claim of unqualified literal equality to the background update is made.
- Exponential traces are not normalized attention or an automatic whole-network stability guarantee. Learned
  timescales are time-shared parameters, not input-dependent gates.
- Multiple kernels are configurations of this family. Negative decay is a discussed mathematical extension
  outside the positive-sigmoid configuration; neither is assumed to have all the properties of a single
  positive kernel.
- Selected serial-recall metrics and the reported quadratic-task failure qualify empirical conclusions.
  An architectural special case does not guarantee optimization success, and the number of possible strings
  alone does not prove absence of overfitting.
- The published version, figure artwork, author implementation, backward routine, training and hardware
  runtime were not inspected. Earlier related work is acknowledged without a priority claim; no numerical
  benchmark is curated.
