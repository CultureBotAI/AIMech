name: Beam-stack search
definition: A layer-based beam search augmented with a stack of admitted evaluation ranges so that backtracking
  systematically revisits successors previously discarded by beam-width pruning.
concept_kind: algorithm
identity_notes: Beam-stack search combines breadth-first beam expansion with chronological backtracking
  and an incumbent solution-cost bound. It is distinct from permanent beam pruning, limited-discrepancy
  beam backtracking, and the separately named iterative-deepening BSIDA-star variant. No normalized identity
  match was found across the 442 AIO and 130 prior native records; ignored-inclusive text hits in the
  main checkout were prior discovery leads, source citations and search-order contrasts, plus incidental
  lightbulb and wet-bulb dependency substrings, not existing concept records.
limitations:
- The paper’s termination and optimality argument assumes finite branching, a positive lower bound on
  operator cost and a finite initial upper bound supplied by an actual solution, together with admissible
  pruning. It is not a guarantee for arbitrary zero-cost cycles, an infinite bound or arbitrary duplicate
  policies.
- Ties require a consistent ordering, or enough beam capacity to retain the unbroken tie group; a bare
  numeric range with unresolved ties is insufficient.
- The baseline retains up to a beam of nodes per depth layer plus the beam stack. O(w*d) node storage
  does not mean a fixed total-memory cap independent of search depth.
- The initially supplied solution must remain available if no improvement is found. An upper-bound number
  alone is not a returned path; this record does not certify the displayed pseudocode as a complete implementation.
