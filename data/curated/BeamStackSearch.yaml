claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Use an admissible cost estimate f=g+h and an incumbent upper bound U. For each expanded layer,
    store a range of successor evaluations admitted to the next beam. Width pruning records the smallest
    rejected evaluation as the upper endpoint. On backtracking, advance the deepest unfinished range and
    regenerate that layer’s successors. Improved solutions lower U; exhaustion of the stack ends the improvement
    search.
  evidence:
  - source_id: method-source
    locator: Beam-stack search, PDF pp. 2–3; Theorem 1, PDF pp. 3–4
    relation: supports
- claim_id: bound-and-incumbent-scope
  kind: limitation
  statement: The basic method starts from a bound corresponding to an actual solution, while the paper
    introduces a separate iterative-deepening version when such a bound is unavailable. As an implementation
    obligation inferred from the displayed initialization and return logic, a wrapper must preserve the
    initial incumbent when the improvement search finds no better path.
  evidence:
  - source_id: memory-and-implementation
    locator: Memory efficiency, PDF p. 4; Figure 1, PDF p. 5, initialization and return path; Beam-stack
      iterative-deepening A-star, PDF p. 6
    relation: supports
