claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Complete a depth-limited depth-first search, discard its generated search tree, increase
    the depth limit, and restart from the initial state. The procedure repeats shallow expansions while
    retaining only the current depth-first traversal state rather than the complete breadth-first frontier.
  evidence:
  - source_id: method-source
    locator: Section 4, printed pp. 100–102 / PDF pp. 4–6; procedure and exponential-tree analysis
    relation: supports
- claim_id: depth-threshold-distinction
  kind: mechanism
  statement: The later primary paper identifies depth-first iterative deepening by a depth-based cutoff,
    in contrast to IDA-star’s g+h cutoff, and describes repeated depth-first passes that keep the current
    search path.
  evidence:
  - source_id: later-primary-paper
    locator: 'Previous Work: Iterative Deepening, printed p. 533 / PDF p. 1'
    relation: supports
