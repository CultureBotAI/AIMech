name: Depth-first iterative deepening
definition: A search algorithm that repeatedly performs depth-first searches from the start with successively
  larger depth limits, redoing shallower work until it reaches a goal.
concept_kind: algorithm
identity_notes: This record denotes single-agent depth-bounded iterative deepening, also called iterative
  deepening depth-first search. It differs from IDA-star, whose limits apply to estimated path cost, and
  from time-managed minimax iterations in game-playing applications. No normalized identity match was
  found across the 442 AIO and 119 prior native records; ignored-inclusive text hits in the main checkout
  were dependency-package documentation and an unrelated package-metadata substring, not existing concept
  records.
limitations:
- Depth measures operator count, not arbitrary accumulated edge cost. Finite branching is needed for each
  bounded iteration to finish.
- Repeated shallow work remains real. The paper’s exponential-tree analysis is conditional and does not
  establish uniform efficiency on graphs with many duplicate paths or near-unit branching.
- The 1986 erratum to the original journal paper was identified but its text could not be accessed. The
  procedure is corroborated by the 1992 primary paper; this record does not assert the original global
  time-and-space optimality theorem.
