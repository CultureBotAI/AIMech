- claim_id: minimax-localized-gaussian-width-statistical-optimality-and-applications
  kind: scope
  statement: 'Under the noisy model y = A x^* + w with x^* in C and transformed truth tangent cone K^*
    := cl conv{t A(x - x^*) : t >= 0, x in C}, let varepsilon_n(K^*) := argmin_{eps >= 0} { sigma W(K^*
    cap B_2(eps sqrt(n))) <= n eps^2 / 8 } be the localized Gaussian width critical radius (Equation 27a).
    Proposition 2 (p. 15, Equation 27b) shows that E_w[||x^{LS} - x^*||_A^2] <= c_1 {varepsilon_n^2(K^*)
    + sigma^2 / n}. Combining Proposition 2 with Theorem 2 via triangle inequality (Appendix C, Equations
    40-41b), Corollary 1 (p. 15, Equation 28) proves that running IHS for N >= ceil(log(c_0 ||x^{LS}||_A
    / varepsilon_n(K^*)) / log(1/rho)) iterations with m >= (c_0 / rho^2) W^2(K^{LS}) achieves E_w[||x^N
    - x^*||_A^2] <= c_1'' {varepsilon_n^2(K^*) + sigma^2 / n} with probability at least 1 - N c_1 e^{-c_2
    m rho^2} over the sketches. Specializing to concrete constraint sets in Section 3 yields minimax-optimal
    prediction error in N = O(log n) rounds with sketch dimension m = (c_0 / rho^2) min{n, d} for unconstrained
    OLS (Corollary 2, Total Flops O(N n d log m + d^3) with Fast Hadamard sketch vs. O(n d^2)), m = (c_0
    / rho^2) (max_j ||a_j||_2^2 / (n gamma_s^-(A))) s log(ed/s) for l_1-constrained s-sparse regression
    (Corollary 3, Lemma 7, Equation 31), and m = (c_0 / rho^2) (|||A|||_op^2 / gamma_{2r}^-(A)) r(d_1
    + d_2) for nuclear-norm constrained rank-r matrix estimation (Corollary 4, Equation 33).'
  evidence:
  - source_id: pilanci2016-ihs-pdf
    locator: Section 2.4.2, pp. 14-15, Proposition 2, Corollary 1, Equations (27a)-(28); Sections 3.1-3.3,
      pp. 15-20, Corollaries 2-4, Equations (29)-(33); Appendix C, pp. 25-26, Equations (40)-(41b); Appendix
      D.2.2, pp. 29-30, Lemma 7, Equations (46a)-(48)
    relation: supports
