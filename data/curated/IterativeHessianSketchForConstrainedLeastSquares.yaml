claims:
- claim_id: fano-information-theoretic-lower-bound-for-classical-sketching
  kind: mechanism
  statement: Consider the noisy linear model y = A x^* + w with w ~ N(0, sigma^2 I_n) and x^* in C_0 subseteq
    C, where accuracy is measured in the normalized prediction semi-norm ||x - x^*||_A^2 := (1/n) ||A(x
    - x^*)||_2^2 (Equations 3 and 7). For any random sketching matrix S in R^{m x n} independent of w
    whose projection expectation satisfies ||E[S^T (S S^T)^{-1} S]||_op <= eta (m/n) (Equation 9; satisfied
    with equality eta = 1 for Gaussian and Hadamard/Fourier ROS sketches because E[S^T (S S^T)^{-1} S]
    = (m/n) I_n, and with eta = alpha for alpha-balanced row-sampling sketches, Appendix A.1), Lemma 2
    (Appendix A.2, p. 24) bounds the conditional Kullback-Leibler divergence between P_{x^j} and P_{x^k}
    given S by E_S[D(P_{x^j} || P_{x^k} | S)] <= (n eta m / (2 sigma^2 min{m, n})) ||x^j - x^k||_A^2.
    Applying Fano's inequality over a delta/2-packing of A(C_0) cap B_2(delta sqrt(n)) of cardinality
    M_{1/2} >= 4, Theorem 1 (Equation 11a) proves that any estimator (S A, S y) |-> x^dagger satisfies
    sup_{x^* in C_0} E_{S,w}[||x^dagger - x^*||_A^2] >= (sigma^2 / (128 eta)) * log(M_{1/2} / 2) / min{m,
    n}. Consequently, any one-shot classical sketch incurs risk lower bounds c (sigma^2 / eta) min{d,
    n} / min{m, n} for unconstrained least squares (Example 1, Equation 12), c (sigma^2 / eta) s log(ed/s)
    / min{m, n} for s-sparse l_1-constrained regression (Example 2, Equation 14), and c (sigma^2 / eta)
    r(d_1 + d_2) / min{m, n} for rank-r nuclear-norm matrix regression (Example 3, Equation 15b), all
    multiplied by n/m relative to the minimax rate of x^{LS}.
  evidence:
  - source_id: pilanci2016-ihs-pdf
    locator: Section 2.2, pp. 6-9, Theorem 1, Examples 1-3, Equations (8)-(15b); Appendix A, pp. 23-24,
      Lemma 2, Equations (34)-(36)
    relation: supports
- claim_id: hessian-sketch-tangent-cone-contraction-and-iterative-hessian-sketch
  kind: mechanism
  statement: 'Let K^{LS} := {t A(x - x^{LS}) : t >= 0, x in C} cap R^n be the transformed tangent cone
    at the exact constrained least-squares solution x^{LS} (Equation 17), and define Z_1(S) := inf_{v
    in K^{LS} cap S^{n-1}} (1/m) ||S v||_2^2 and Z_2(S) := sup_{v in K^{LS} cap S^{n-1}} |<u, ((1/m) S^T
    S - I_n) v>| for any fixed unit vector u in S^{n-1} (Equations 18a-18b). Proposition 1 (p. 10, Equation
    19) proves that the single-step Hessian sketch x_hat = argmin_{x in C} { (1/(2m)) ||S A x||_2^2 -
    <A^T y, x> } deterministically satisfies ||x_hat - x^{LS}||_A <= (Z_2(S) / Z_1(S)) ||x^{LS}||_A. In
    the Iterative Hessian Sketch (IHS, Equation 24), starting from x^0 = 0 and solving x^{t+1} = argmin_{x
    in C} { (1/(2m)) ||S^{t+1} A (x - x^t)||_2^2 - <A^T(y - A x^t), x> } with independent sketches S^1,
    ..., S^N, Appendix C (Equations 38-39) establishes the per-step contraction ||x^{t+1} - x^{LS}||_A
    <= (Z_2(S^{t+1}) / Z_1(S^{t+1})) ||x^t - x^{LS}||_A for u_t = A(x^{LS} - x^t) / ||A(x^{LS} - x^t)||_2,
    yielding Theorem 2 (Equations 26a-26b): ||x^N - x^{LS}||_A <= (prod_{t=1}^N Z_2(S^t) / Z_1(S^t)) ||x^{LS}||_A.
    By Lemma 1 (p. 11, Equations 22a-22b), for any rho in (0, 1/2), sketch size m >= (c_0 / rho^2) W^2(K^{LS})
    for sub-Gaussian sketches (or m >= (c_0 / rho^2) log^4(n) W^2(K^{LS}) for ROS sketches over self-bounding
    cones) ensures Z_1(S^t) >= 1 - rho >= 1/2 and Z_2(S^t) <= rho/2, so ||x^N - x^{LS}||_A <= rho^N ||x^{LS}||_A
    with probability at least 1 - N c_1 e^{-c_2 m rho^2}.'
  evidence:
  - source_id: pilanci2016-ihs-pdf
    locator: Sections 2.3-2.4, pp. 9-14, Proposition 1, Lemma 1, Theorem 2, Equations (16)-(26b); Appendices
      B-D, pp. 25-29, Lemmas 3-6, Equations (37a)-(45b)
