id: AIMech:IterativeHessianSketchForConstrainedLeastSquares
name: Iterative Hessian Sketch for Constrained Least-Squares and Information-Theoretic Classical Sketching
  Lower Bounds
concept_kind: mathematical_method
aliases:
- Iterative Hessian Sketch (IHS, Pilanci & Wainwright 2016)
- Hessian Sketch for Constrained Least-Squares
- Tangent-Cone Gaussian-Width Sketched Least-Squares Iteration
- Fano Information-Theoretic Classical Sketching Lower Bound
definition: 'Iterative Hessian Sketch for Constrained Least-Squares and Information-Theoretic Classical
  Sketching Lower Bounds is a randomized sketching and statistical optimization methodology introduced
  by Pilanci and Wainwright (2016, Journal of Machine Learning Research 17(53):1-38, arXiv:1411.0347v1)
  for solving large-scale convex-constrained least-squares problems x^{LS} := argmin_{x in C} (1/2) ||A
  x - y||_2^2 with data matrix A in R^{n x d}, response y in R^n, and convex constraint set C subseteq
  R^d. First, under noisy observations y = A x^* + w with w ~ N(0, sigma^2 I_n) and any sketching matrix
  S in R^{m x n} satisfying ||E[S^T (S S^T)^{-1} S]||_op <= eta (m/n) (with eta = 1 for Gaussian and randomized
  orthonormal system sketches and eta = alpha for alpha-balanced row sampling), Theorem 1 proves via Fano''s
  inequality that any estimator (S A, S y) |-> x^dagger constructed from classically sketched data suffers
  worst-case prediction risk sup_{x^* in C_0} E[||x^dagger - x^*||_A^2] >= (sigma^2 / (128 eta)) * log(M_{1/2}
  / 2) / min{m, n} (where ||u||_A^2 := (1/n)||A u||_2^2 and M_{1/2} is the 1/2-packing cardinality of
  A(C_0) cap B_2(delta sqrt(n))), showing that one-shot classical sketching requires m asymp n to match
  the statistical rate of x^{LS}. Second, to eliminate this statistical sub-optimality without forming
  A^T A, the Iterative Hessian Sketch (IHS) sketches only the quadratic Hessian term while retaining exact
  residual inner products with y: starting from x^0 = 0, iteration t + 1 draws an independent isotropic
  sketch matrix S^{t+1} in R^{m x n} with E[(S^{t+1})^T S^{t+1} / m] = I_n and updates x^{t+1} = argmin_{x
  in C} { (1/(2m)) ||S^{t+1} A (x - x^t)||_2^2 - <A^T (y - A x^t), x> } (Equation 24). Over the transformed
  tangent cone K^{LS} := {t A(x - x^{LS}) : t >= 0, x in C}, Theorem 2 proves the deterministic contraction
  ||x^N - x^{LS}||_A <= (prod_{t=1}^N Z_2(S^t) / Z_1(S^t)) ||x^{LS}||_A and shows that sketch dimension
  m >= (c_0 / rho^2) W^2(K^{LS}) (scaling with the squared Gaussian width of K^{LS}, such as O(d), O(s
  log(ed/s)) for s-sparse l_1 balls, or O(r(d_1 + d_2)) for rank-r nuclear-norm balls) yields geometric
  convergence ||x^N - x^{LS}||_A <= rho^N ||x^{LS}||_A in N = O(log n) rounds.'
identity_notes: Resolved against all 442 pinned AIO records and 620 maintained AIMech records. Distinct
  from AIMech:NewtonSketchRandomizedHessianProjectedOptimization (Pilanci & Wainwright 2017, SIAM J. Optim.
  27(1):205-245, arXiv:1505.02250v1, which develops general second-order Newton Sketch updates using state-dependent
  Hessian square roots nabla^2 f(x^t)^{1/2} for general twice-differentiable convex objectives and self-concordant
  interior-point barrier methods, whereas Pilanci & Wainwright 2016 establishes the Fano information-theoretic
  lower bound for any estimator based on classically sketched pairs (S A, S y), the deterministic tangent-cone
  directional contraction ratio Z_2(S)/Z_1(S) around the constrained least-squares estimator x^{LS}, and
  minimax statistical risk matching via localized Gaussian widths varepsilon_n^2(K^*) in O(log n) constrained
  least-squares rounds), from AIMech:CountSketchLeveragedHybridRandomizedConstrainedAndRidgeRegression
  (Wang, Gittens, & Mahoney 2018, which studies single-pass CountSketch-plus-leverage-score preconditioners
  for unconstrained/ridge/L1-L2 regression), and from AIMech:StatisticallyPreconditionedAcceleratedIterativeSketchingLeastSquaresAndRidge
  (Dereziński et al. 2025, which analyzes heavy-ball momentum and DPP/leverage-score preconditioning for
  unconstrained/ridge linear systems).
