name: Dual-averaging step-size adaptation for Hamiltonian samplers
definition: A warmup procedure that tunes the logarithm of a Hamiltonian sampler’s integration step size
  using cumulative discrepancy from a target acceptance statistic, a shrinkage point and a smoothed sequence
  of iterates.
concept_kind: algorithm
identity_notes: This is Hoffman and Gelman’s adaptation of dual averaging to HMC/NUTS step-size tuning.
  It is not the general Nesterov optimization algorithm, trajectory-length adaptation, mass-matrix estimation,
  or an acceptance test for retaining each NUTS output. The HMC and original NUTS acceptance statistics
  differ. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  153 prior native IDs/names/aliases. Both checkout text searches included ignored and hidden files and
  returned no matches for the selected exact IDs, full labels, aliases and source titles. Existing HMM
  and Markov random field records describe probability models, not these sampling or tuning procedures.
limitations:
- The convergence discussion assumes suitable regularity, including the relevant expected acceptance statistic
  decreasing with step size. The update formula alone does not prove convergence on every target.
- The target delta, warmup duration, initialization and shrinkage controls remain choices. The paper’s
  experimental defaults are not universal optimal values or current-library defaults.
- For NUTS the statistic averages potential HMC acceptances over explored states in the final doubling;
  it is not the proportion of returned positions that changed.
- Adapting throughout retained sampling requires a separate adaptive-MCMC argument. This record follows
  the paper’s finite-warmup/freeze practice.
- The procedure tunes epsilon, not a mass matrix or the complete distribution geometry, and does not guarantee
  independent samples or adequate posterior exploration.
