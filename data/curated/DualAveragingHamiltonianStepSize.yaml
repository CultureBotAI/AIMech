claims:
- claim_id: method
  kind: mechanism
  statement: At warmup iteration m form Hbar_m=(1−1/(m+t0))Hbar_(m−1)+(delta−a_m)/(m+t0), then log epsilon_m=mu−sqrt(m)Hbar_m/gamma.
    Smooth with log epsilonbar_m=m^(−kappa)log epsilon_m+(1−m^(−kappa))log epsilonbar_(m−1). Here gamma>0,
    t0≥0 and 1/2<kappa≤1; initialize Hbar_0=0 and the step-size/shrinkage values as specified by the chosen
    implementation. HMC uses its proposed trajectory’s Metropolis acceptance probability a_m. Original
    NUTS uses the mean hypothetical Metropolis acceptance probability over states explored in the final
    doubling, not a binary acceptance of its selected output. Adapt during a finite warmup, then use the
    averaged step size without continued adaptation for retained sampling.
