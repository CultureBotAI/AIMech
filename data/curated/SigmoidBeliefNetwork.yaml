claims:
- claim_id: method
  kind: mechanism
  statement: Choose a topological ordering of binary nodes and directed connections from earlier parents
    to later nodes. In zero/one encoding let a_i=b_i+sum_j w_ij s_j over parents; then P(s_i=1|parents)=sigmoid(a_i)
    and P(s_i=0|parents)=1-sigmoid(a_i). Multiplying these locally normalized factors gives the joint
    distribution without an undirected global partition function. Ancestral sampling visits nodes in topological
    order. For the equivalent minus-one/plus-one encoding, divide each non-bias weight by two and add
    half the original incoming-weight sum to the original bias. Marginalizing hidden variables still requires
    a sum over their configurations, and a Gibbs full conditional uses both the node factor and factors
    of its children, rather than merely its forward conditional. In the inspected maximum-likelihood learning
    derivation, gradients of a visible-data log likelihood are posterior expectations of joint log-probability
    scores; Gibbs sampling is one approximation for those expectations, not a mandatory part of the architecture.
