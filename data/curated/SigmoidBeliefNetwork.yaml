name: Sigmoid belief network
definition: A directed acyclic probabilistic network of binary variables whose forward conditional probabilities
  are logistic functions of weighted parent states and a bias.
concept_kind: architecture
identity_notes: 'This is the sigmoid conditional family defined by Neal, including equivalent zero/one
  and minus-one/plus-one encodings. It is not a symmetric Boltzmann machine, a sigmoid activation function
  alone, or an arbitrary neural network containing sigmoid units. Hidden variables are permitted but not
  required; the fully visible autoregressive specialization is not treated as an alias for the whole family.
  Wake-sleep and other inference or learning procedures do not define the model identity. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 343 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  7 and 7 lines respectively. All 6 unique matched line contents were inspected in full: RWS component-model
  distinctions, its saved review and the carried sigmoid/autoregressive discovery lead, not existing candidate
  records. Exact checkout counts and differences are retained in the ledger. Thirteen exact AIO CLASS
  nodes with scoped synonyms/comments and outgoing edges and six full native neighboring records were
  inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Local normalization and exact ancestral draws do not make arbitrary posterior inference or hidden-variable
  marginal likelihood tractable. Clamping later observed nodes and using only forward conditionals does
  not generally sample the desired posterior.
- The two binary encodings require the stated weight and bias transformation; copying identical numerical
  parameters between them changes the distribution.
- The gradient identity requires appropriate posterior expectations. A finite Gibbs run need not provide
  exact equilibrium samples, rapid mixing or an unbiased implemented learning update.
- Acyclic probabilistic dependence is not by itself evidence for intervention-level causal interpretation,
  and the learned units need not represent human-interpretable propositions.
- No global training optimum, biological implementation or benchmark ranking is asserted. Only the declared
  portions of the 43-page source were inspected.
