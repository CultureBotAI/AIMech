id: AIMech:BinaryMultipleKernelMaximumMarginClustering
name: Binary Multiple Kernel Maximum Margin Clustering
aliases:
- Two-Class Multiple Kernel Clustering
concept_kind: algorithm
definition: A two-class unsupervised clustering procedure that jointly fits a nonnegative multiple-kernel
  combination and absolute-margin classifier using cutting-plane constraints and constrained concave-convex
  updates.
identity_notes: This record denotes the binary Zhao-Kwok-Zhang2009 procedure with an intercept and aggregate
  score balancing. It differs from the same paper multiclass winner-versus-runner-up procedure, supervised
  multiple-kernel SVM training, fixed-kernel maximum-margin solvers and variance-minimizing multiview
  kernel k-means. The paper uses MKC for both variants, so that ambiguous acronym is not a unique alias.
  Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 496 prior native IDs, names and
  aliases; no normalized identity collision. Full searches of both checkouts include ignored and hidden
  files, returning 16 worktree and 16 main matched lines. All 11 distinct matched texts were inspected
  as bibliographic, query or frontier references, not existing identities. Thirteen annotated AIO nodes
  and outgoing edges, thirteen generated YAMLs and five native neighbors were examined. Nine unchanged
  annotated targets, their generated records, all 442 class labels and 147 semantic rows reuse byte-verified
  earlier readings; four additional annotated targets and five new semantic rows were read (152 rows total).
  Absence is bounded to this pin and corpus.
