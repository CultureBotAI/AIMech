  relation: supports
claims:
- claim_id: kernel-weight-geometry
  kind: mechanism
  statement: Given supplied PSD base kernels K_k and feature maps Phi_k, learn nonnegative weights beta_k
    with sum_k beta_k^2<=1, not a simplex constraint. The resulting mixed kernel is sum_k beta_k*K_k,
    consistently represented by concatenated sqrt(beta_k)*Phi_k blocks. The paper introductory sum of
    feature maps must not be read as an arbitrary vector sum that adds cross terms, especially when feature
    dimensions differ. Its reparameterization v_k=beta_k*w_k gives a quadratic-over-linear regularizer.
    At beta_k=0 the closed perspective has cost zero for v_k=0 and infinite cost otherwise. Kernel scaling
    affects the optimization.
  evidence:
  - source_id: mkc-source
    locator: PDF pp. 1-3 / printed pp. 638-640, Equations 1.1 and 2.4-2.6; PDF pp. 8-10 / pp. 645-647,
      Equations 4.30-4.32 and Section 5.2; curator mixed-kernel and cone checks
    relation: supports
- claim_id: binary-objective
  kind: mechanism
  statement: Let f_i=sum_k v_k^T*Phi_k(x_i)+b. Minimize 0.5*sum_k ||v_k||^2/beta_k+(C/n)*sum_i xi_i with
    |f_i|>=1-xi_i, xi_i>=0, nonnegative L2-bounded beta and |sum_i f_i|<=l. Assign labels by the sign
    of the fitted scores under an explicit zero-score convention. This optimizes an absolute-margin relaxation
    of latent-label clustering, not supervised fitting to given labels.
  evidence:
  - source_id: mkc-source
    locator: Section 2.1, PDF pp. 1-3 / pp. 638-640, Equations 2.2-2.6
    relation: supports
- claim_id: working-set-and-inner-fit
  kind: mechanism
  statement: Replace individual slacks by a shared xi with all binary masks c in {0,1}^n constrained by
    mean_i c_i*|f_i|>=mean_i c_i-xi. The maximal violation selects c_i=1 where |f_i|<1 and zero otherwise,
    giving mean_i max(0,1-|f_i|). Starting with an empty working set, alternate restricted fitting
    and adding this most violated constraint until its violation is at most epsilon. Within a restricted
    fit, freeze z_i as an absolute-value subgradient at the previous score, replace |f_i| by z_i*f_i and
    solve the convex perspective problem as an SOCP; repeat subject to the chosen stopping rule. For each
    kernel its epigraph is ||(2*v_k,t_k-beta_k)||<=t_k+beta_k.
  evidence:
  - source_id: mkc-source
    locator: Sections 2.2-2.3, PDF pp. 3-5 / pp. 640-642, Theorems 2.1-2.2, Algorithms 1-2 and Equations
      2.7-2.17
    relation: supports
- claim_id: balance-is-a-relaxation
  kind: limitation
  statement: 'The source replaces |sum_i y_i|<=l with |sum_i f_i|<=l. The latter does not guarantee the
    former despite nearby equivalence language: with four zero-feature observations, l=1 and b=1/4, all
    scores are positive and sum to 1, while all predicted labels are +1 and sum to 4. With C=1 this feasible
    relaxed solution has objective 3/4, whereas every count-balanced labeling has minimum objective 1.
    Thus the score-balanced formulation and the original hard count-balanced objective are not generally
    equivalent.'
  evidence:
  - source_id: mkc-source
    locator: Section 2.1, PDF pp. 1-2 / pp. 638-639, Equations 2.2-2.3; curator exact zero-feature derivation
      and finite checks
    relation: supports
- claim_id: stopping-and-guarantee-boundary
  kind: limitation
  statement: 'The epsilon test bounds omitted constraint violation: increasing the shared slack by epsilon
    makes the current score solution feasible for the full mask set. It does not bound label error or
    distance from a global optimum. At zero scores, choosing the valid subgradient zero can make the inner
    problem return the same zero-scoring point, even though a small feasible bias lowers the actual hinge
    objective; initialization and tie conventions therefore qualify local-optimum language. The source
    complexity discussion treats an empirically small CCCP iteration count as constant and contains a
    linear beta-sum term in Equation 3.21 despite the squared beta constraint in the stated primal. No
    unconditional end-to-end linear-time or convergence certificate is asserted here.'
  evidence:
  - source_id: mkc-source
    locator: PDF pp. 4-8 / pp. 641-645, Algorithms 1-2, Theorem 2.3 and Section 3, especially Equations
      3.21-3.22; curator zero-subgradient example
    relation: supports
