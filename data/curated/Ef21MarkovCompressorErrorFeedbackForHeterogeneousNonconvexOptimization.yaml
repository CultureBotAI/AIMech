  rationale: EF21 is a communication-compressed distributed optimization method designed for arbitrarily heterogeneous client data distributions in federated and distributed learning.
- target: AIO:SparseLearning
  relation: related_match
  rationale: EF21 operates with biased contractive sparsification operators such as deterministic Top-k.
limitations:
- Each worker must store a d-dimensional gradient estimator g_i^t in memory across iterations.
- Under stochastic mini-batch gradients without variance reduction, compression of noisy gradient differences introduces an asymptotic noise floor unless combined with PAGE-style variance reduction.
