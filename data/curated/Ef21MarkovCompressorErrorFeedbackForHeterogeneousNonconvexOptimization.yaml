id: AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization
name: EF21 Markov-Compressor Error Feedback for Heterogeneous Nonconvex Distributed Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A communication-compressed distributed optimization algorithm (EF21) in which each worker i in [n] maintains a local gradient estimator g_i^t, applies a biased contractive compressor C in B(alpha) satisfying E ||C(x) - x||^2 <= (1 - alpha) ||x||^2 directly to the gradient difference c_i^t = C_i(grad f_i(x^{t+1}) - g_i^t), and updates g_i^{t+1} = g_i^t + c_i^t while the server updates the global gradient estimate g^{t+1} = g^t + (1/n) sum_{i=1}^n c_i^t = (1/n) sum_{i=1}^n g_i^{t+1} and steps x^{t+1} = x^t - gamma * g^t, achieving O(1 / (alpha * T)) nonconvex stationarity and linear Polyak-Lojasiewicz convergence under standard smoothness alone without bounded gradients or bounded client dissimilarity.
identity_notes: Distinct from classical error-compensated SGD (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression, which compresses step-scaled gradients plus residual memory m_t + eta_t * g_t, requires bounded gradient norms, and suffers an O(1/alpha^2) dependence in heterogeneous distributed settings), from unbiased stochastic quantization (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding), and from uncompressed variance-reduced nonconvex optimizers (AIMech:PageProbabilisticGradientEstimatorForNonconvexOptimization). No pinned AIO class covers EF21 or Markov gradient-difference error feedback.
