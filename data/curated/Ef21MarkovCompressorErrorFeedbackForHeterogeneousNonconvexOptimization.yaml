claims:
- claim_id: r380-markov-compressor-distortion-contraction-lemma
  kind: mechanism
  statement: By compressing the increment grad f_i(x^{t+1}) - g_i^t via c_i^t = C_i(grad f_i(x^{t+1}) - g_i^t) with C_i in B(alpha), Lemma 2 and Lemma 3 establish the distortion recursion E[||g_i^{t+1} - grad f_i(x^{t+1})||^2 | W^t] <= (1 - theta) ||g_i^t - grad f_i(x^t)||^2 + beta ||grad f_i(x^{t+1}) - grad f_i(x^t)||^2 where optimizing Young's parameter at s* = 1/sqrt(1 - alpha) - 1 yields theta* = 1 - sqrt(1 - alpha), beta* = (1 - alpha)/(1 - sqrt(1 - alpha)), and sqrt(beta*/theta*) = sqrt(1 - alpha)/(1 - sqrt(1 - alpha)) <= 2/alpha - 1.
  evidence:
  - source_id: r380-primary-pdf
    locator: Section 3.4 Lemma 1, Section 4.1 Lemma 2, and Section 4.2 Lemma 3, pp. 5-7
    relation: supports
- claim_id: r380-nonconvex-and-pl-convergence-without-bounded-gradients
  kind: mechanism
  statement: Under L_i-smoothness alone (with L_tilde = sqrt((1/n) sum_{i=1}^n L_i^2)) and stepsize 0 < gamma <= 1 / (L + L_tilde * sqrt(beta / theta)), Theorem 1 proves that the Lyapunov functional Psi^t = f(x^t) - f^inf + (gamma / (2 * theta)) G^t decreases monotonically to yield E ||grad f(x_hat^T)||^2 <= (2 * Psi^0) / (gamma * T) = O(L_tilde / (alpha * T)), and Theorem 2 proves linear convergence at rate (1 - min(gamma * mu, theta / 2))^T under the mu-Polyak-Lojasiewicz inequality without bounded gradient or data-similarity assumptions.
  evidence:
  - source_id: r380-primary-pdf
    locator: Section 4.2 Theorem 1, Theorem 2, and Corollary 1, pp. 6-8
    relation: supports
- claim_id: r380-full-worker-gradient-and-state-memory-limitation
  kind: limitation
  statement: Baseline EF21 requires each worker i to maintain a d-dimensional gradient state vector g_i^t and evaluate exact local gradients grad f_i(x^{t+1}) unless extended with stochastic variance reduction or momentum (such as EF21-SGD or EF21-PAGE in Appendix F).
  evidence:
  - source_id: r380-primary-pdf
    locator: Algorithm 1, Section 4.3 Table 2, and Appendix F, pp. 4, 8, 25-32
    relation: supports
- claim_id: r380-heterogeneous-distributed-nonconvex-training-application
  kind: application
  statement: Applied to heterogeneous distributed optimization of nonconvex logistic regression with nonconvex regularizers and deep learning models using biased Top-k sparsification.
  evidence:
  - source_id: r380-primary-pdf
    locator: Section 5 Experiments, Figures 1-2, pp. 8-9
    relation: supports
