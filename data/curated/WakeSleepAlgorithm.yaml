name: Wake-sleep algorithm
definition: An alternating learning procedure that trains a generative network from observed data and
  recognition-sampled hidden states during wake, and trains a recognition network from generative-model
  samples during sleep.
concept_kind: algorithm
identity_notes: 'This is the original wake-sleep procedure with separate generative and recognition parameters.
  It is a training algorithm for a paired probabilistic model, distinct from the Helmholtz-machine architecture,
  exact EM, joint ELBO-gradient training in NVIL, and reweighted wake-sleep. The original binary-sigmoid
  construction supplies local delta rules; the general phase distinction does not require every later
  model variant to use those same units. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 340 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 24 and 24 lines respectively. All
  17 unique matched line contents were inspected in full: NVIL method distinctions, source-reading scopes,
  prior reviews and the carried wake-sleep discovery lead, not existing candidate records. Exact checkout
  counts and differences are retained in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- Recognition samples are exact for q, not necessarily the model posterior. The generative wake update
  need not be an unbiased marginal-likelihood gradient or even have the same direction; a curator binary
  example demonstrates this distinction.
- The sleep input distribution is the current model distribution rather than the empirical data distribution.
  Poor model samples can therefore allocate recognition capacity differently from data-conditioned training.
- The original recognition distribution factors within each layer conditional on the preceding layer.
  This can miss explaining-away dependencies in the posterior; it does not assert unconditional independence
  of every hidden variable across layers.
- The original paired-model sources explicitly do not establish a common descent objective for both phases.
  Exact posterior recovery, global convergence and monotonic likelihood improvement are not guaranteed.
- Local binary-sigmoid rules depend on the stated conditional parameterization. No biological implementation,
  author-code execution or benchmark advantage is certified.
