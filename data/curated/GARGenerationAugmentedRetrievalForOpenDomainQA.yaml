claims:
- claim_id: gar-multi-target-query-context-generation-and-fusion
  kind: mechanism
  statement: "GAR trains seq2seq generators using freely available in-domain supervision to generate three distinct query contexts\u2014(1) Answer, (2) Sentence containing the answer, and (3) Title of a positive passage\u2014appends each to the question to form generation-augmented queries, and fuses their separate BM25 retrieval lists (Sections 3.2-3.3), substantially increasing query-passage ROUGE-1/2/L overlap on Natural Questions from 6.00/2.36/5.01 to 13.21/6.99/10.27 (sentence) and mitigating hallucinated answers via complementary contexts (Tables 2-3, Figure 1)."
  evidence:
  - source_id: r769-primary-pdf
    locator: Sections 3.2-3.3 & Sections 6.1-6.2, Tables 2-4, Figure 1, pp. 3-4, 6-7
    relation: supports
  - source_id: r769-primary-pdf
    locator: main() verification of multi-target query expansion recovering ground-truth passage when generated answer is wrong
    relation: supports
- claim_id: gar-passage-level-span-voting
  kind: mechanism
  statement: For extractive reading over retrieved passages D = [d_1, ..., d_k] with passage relevance logits D and top-N span logits S_i per passage, GAR computes normalized span probabilities p(S_i[j]) = softmax(D)[i] * softmax(S_i)[j] and sums them across all candidate spans sharing the same surface string across all retrieved passages (Passage-level Span Voting, Section 4.1).
  evidence:
  - source_id: r769-primary-pdf
    locator: 'Section 4.1 Extractive Reader: Passage-level Span Voting, p. 4'
    relation: supports
  - source_id: r769-primary-pdf
    locator: main() verification of passage_level_span_voting outvoting a noisy single-passage span
    relation: supports
- claim_id: gar-openqa-benchmark-applications
  kind: application
  statement: On Natural Questions (NQ) and TriviaQA, GAR with BM25 outperforms DPR at Top-500/1000 on NQ and at all k >= 5 on TriviaQA while training and indexing at a fraction of DPR's compute cost (Tables 4 and 8), and fusing GAR with DPR (GAR^+) reaches 88.9% Top-100 retrieval accuracy on NQ and 43.8 extractive EM / 45.3 generative EM (Tables 4, 6, and 7).
  evidence:
  - source_id: r769-primary-pdf
    locator: Sections 6.2-6.4, Tables 4-8, pp. 6-9
    relation: supports
  - source_id: r769-metadata-cr
    locator: BibTeX citation record for arXiv:2009.08553 (ACL 2021)
    relation: supports
- claim_id: gar-small-k-and-multi-generator-overhead-limitation
  kind: limitation
  statement: 'Because GAR relies on sparse BM25 matching over queries expanded with potentially noisy PLM-generated contexts, standalone GAR underperforms dense retrieval (DPR) on Natural Questions at very small retrieval cutoffs (Top-5: 60.9% vs. 68.3% in Table 4, which also limits generative reader EM when only 10 passages are read in Table 6) and requires training and running three separate BART-large generators for the three context types.'
  evidence:
  - source_id: r769-primary-pdf
    locator: Sections 6.2-6.4, Tables 4, 6 & 8, pp. 6-9
    relation: supports
