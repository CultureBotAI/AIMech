id: AIMech:GARGenerationAugmentedRetrievalForOpenDomainQA
name: GAR Generation-Augmented Retrieval for Open-Domain Question Answering
concept_kind: algorithm
review_status: DRAFT
definition: "A query-expansion and retrieval algorithm for open-domain question answering that trains sequence-to-sequence pre-trained language models (such as BART) via standard seq2seq supervision to generate three complementary in-domain query contexts from an input question q\u2014(1) the default target answer, (2) the passage sentence containing the answer, and (3) the title of a passage containing the answer\u2014appends each generated context to q to form separate generation-augmented queries, retrieves top candidate passages for each augmented query using sparse lexical retrieval (BM25) and fuses the retrieved rankings (or fuses them with DPR dense retrieval rankings as GAR^+), and aggregates candidate answer spans across retrieved passages in the extractive reader via Passage-level Span Voting by summing normalized span probabilities p(S_i[j]) = softmax(D)[i] * softmax(S_i)[j] over all spans sharing the same surface string."
identity_notes: Distinct from RM3 pseudo-relevance feedback, which expands queries using terms from initially retrieved passages rather than parametric knowledge generated by a seq2seq PLM; distinct from HyDE (AIMech:HyDEHypotheticalDocumentEmbeddings), which encodes zero-shot LLM-generated hypothetical documents into dense vectors with an unsupervised contrastive encoder; and distinct from RAG and FiD, which use a generator as the downstream reader over DPR-retrieved passages rather than generating multi-target query expansions prior to retrieval.
aliases:
- GAR
- Generation-Augmented Retrieval
- GAR and GAR+ Multi-Context Query Expansion for Open-Domain QA
