id: AIMech:MADXMultipleAdaptersForCrossLingualTransfer
name: MAD-X Multiple Adapters for Cross-Lingual Transfer
concept_kind: architecture
review_status: DRAFT
definition: 'A modular adapter-based architecture and transfer framework for pre-trained multilingual Transformers that combines three distinct adapter modules while keeping backbone parameters frozen: (1) language adapters LA_l(h_l, r_l) = U_l(ReLU(D_l(h_l))) + r_l trained via masked language modeling (MLM) on unlabeled monolingual corpora, (2) task adapters TA_l(h_l, r_l) = U_l(ReLU(D_l(LA_l))) + r_l stacked atop the fixed source-language adapter during downstream task training, and (3) NICE-coupled invertible adapters A_inv and A_inv^{-1} wrapping tied input and output token embeddings, enabling zero-shot cross-lingual transfer by substituting target-language invertible and language adapters at inference.'
identity_notes: Introduced by Jonas Pfeiffer, Ivan Vulic, Iryna Gurevych, and Sebastian Ruder (EMNLP 2020, pp. 7654-7673, arXiv:2005.00052) as MAD-X (Multiple ADapters for Cross-lingual transfer). Distinct from AdapterFusion (AIMech:AdapterFusion), which combines multiple task adapters via a softmax attention layer rather than stacking language, task, and invertible adapters for cross-lingual transfer; and from LT-SFT (AIMech:LTSFTLotteryTicketSparseFineTuning), which composes sparse parameter difference vectors in weight space without adding adapter layers.
aliases:
- MAD-X
- Multiple Adapters for Cross-Lingual Transfer
- MAD-X Invertible Adapter Framework
