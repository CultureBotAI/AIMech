claims:
- claim_id: madx-stacked-language-and-task-bottleneck-adapters
  kind: mechanism
  statement: At each Transformer layer l, MAD-X inserts a language adapter LA_l(h_l, r_l) = U_l(ReLU(D_l(h_l))) + r_l after the feed-forward layer normalization (with FFN residual r_l) and stacks a task adapter TA_l(h_l, r_l) = U_l^TA(ReLU(D_l^TA(LA_l))) + r_l on top, training LA_l via MLM on unlabeled language data and TA_l on labeled source-language task data while keeping LA_l fixed, then swapping LA_l^src with LA_l^trg at inference for zero-shot transfer.
  evidence:
  - source_id: r713-primary-pdf
    locator: Section 4.1-4.2, Equations (1)-(2), Figure 1, pp. 3-4
    relation: supports
- claim_id: madx-nice-coupled-invertible-embedding-adapters
  kind: mechanism
  statement: To adapt tied input and output token embeddings without overfitting output embeddings to MLM, MAD-X splits each h-dimensional token embedding e = [e_1, e_2] into e_1, e_2 in R^{h/2} and applies an exactly invertible NICE coupling layer o_1 = F(e_2) + e_1, o_2 = G(o_1) + e_2 after the input embeddings and its exact inverse e_2 = o_2 - G(o_1), e_1 = o_1 - F(e_2) before the tied output embeddings, where F and G are ReLU bottleneck projections with hidden dimension h/4.
  evidence:
  - source_id: r713-primary-pdf
    locator: Section 4.3, Equations (3)-(5), Figure 2, p. 4
    relation: supports
- claim_id: madx-cross-lingual-ner-xcopa-xquad-transfer
  kind: application
  statement: Adding only 3.05% parameters per language (8.25M parameters on XLM-R Base), MAD-X improves average cross-lingual WikiANN NER F1 across all 16x16 source-target language pairs (including 8 unseen low-resource languages) from 32.6 to 38.2 (+5.6 F1) and zero-shot transfer from English from 41.6 to 53.2 (+11.6 F1), while outperforming XLM-R on XCOPA causal commonsense reasoning (61.5 vs. 59.7).
  evidence:
  - source_id: r713-primary-pdf
    locator: Section 6-7, Tables 2-6, pp. 6-8, 12
    relation: supports
  - source_id: r713-metadata-cr
    locator: EMNLP 2020 bibliographic record
    relation: supports
- claim_id: madx-task-only-unseen-language-and-monolingual-corpus-limitation
  kind: limitation
  statement: Using task adapters alone without language and invertible adapters (MAD-X - LAD - INV) degrades significantly on unseen languages (29.8 vs. 38.2 average NER F1), and MAD-X requires unlabeled monolingual corpora in each target language to pretrain its language and invertible adapters via MLM.
  evidence:
  - source_id: r713-primary-pdf
    locator: Section 6-8, Table 2, pp. 6-9
    relation: supports
