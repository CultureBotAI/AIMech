claims:
- claim_id: exact-empirical-distance-lower-bound-and-asymptotic-constant-guarantee
  kind: mechanism
  statement: Lemmas 5 and 6 and Theorem 7 (Section 2, Appendix A, pp. 24-25, and Appendix E.1, p. 44) prove that for any convex function f with minimizer x_* and D = ||x_0 - x_*||, the iterates of Algorithm 1 satisfy sum_{k=0}^n d_k (f(x_k) - f_*) <= D ||s_{n+1}|| - sum_{k=0}^n d_k gamma_k langle g_k, s_k rangle <= D ||s_{n+1}|| + sum_{k=0}^n (gamma_k / 2) d_k^2 ||g_k||^2 - (gamma_{n+1} / 2) ||s_{n+1}||^2, which guarantees hat{d}_{n+1}^{(I)} <= tilde{d}_{n+1}^{(II)} <= D at every step whenever d_0 <= D; furthermore, Theorem 24 (Appendix E, p. 43) proves that if ||x_n - x_*|| -> 0, then lim_{n -> infty} d_n >= D / (1 + sqrt{3}).
  evidence:
  - source_id: r586-primary-pdf
    locator: Section 2, p. 3; Section 4.1, p. 7; Appendix A, Lemmas 5-8 and Theorem 7, pp. 24-26; Appendix E, Theorem 24, pp. 43-44
    relation: supports
- claim_id: log-free-asymptotic-and-non-asymptotic-convex-lipschitz-convergence
  kind: mechanism
  statement: Theorem 1 (Section 2, p. 3, and Appendix A.1, pp. 27-29) proves that for any convex G-Lipschitz function f and any initial guess d_0 <= D, Dual Averaging with D-Adaptation (Algorithm 1) satisfies f(hat{x}_n) - f_* <= 12 D G / sqrt{n+1} + 8 D G^2 / ((n+1)||g_0||) = O(D G / sqrt{n+1}) as n -> infty with no multiplicative logarithmic factors, while Theorem 2 (Appendix A.2, pp. 29-31) establishes the finite-step guarantee f(hat{x}_t) - f_* <= 16 D G log_{2+}(D / d_0) / sqrt{n+1} for n >= 2 log_2(D / d_0).
  evidence:
  - source_id: r586-primary-pdf
    locator: Section 2, Theorems 1 and 2, pp. 3-4; Appendix A.1-A.2, Lemma 11, pp. 27-32
    relation: supports
  - source_id: r586-metadata-cr
    locator: Bibliographic record (ICML 2023, PMLR 202:7449-7479)
    relation: supports
- claim_id: coordinate-wise-d-adapted-adagrad-sgd-and-adam-extensions
  kind: application
  statement: Section 3 (Algorithm 3, Theorem 4, Appendix C) extends D-Adaptation to coordinate-wise preconditioning in the l_infty norm D_infty = ||x_0 - x_*||_infty via hat{d}_{k+1} = (||s_{k+1}||_{A_{k+1}^{-1}}^2 - sum_{i=0}^k d_i^2 ||g_i||_{A_i^{-1}}^2) / (2 ||s_{k+1}||_1) achieving f(hat{x}_n) - f_* = O(p G_infty D_infty / sqrt{n+1}), and Section 6 (Algorithms 4 and 5, Appendix F) derives practical stochastic D-Adapted SGD and D-Adapted Adam rules using exponentially weighted moving averages s_{k+1} = sqrt{beta_2} s_k + (1 - sqrt{beta_2}) d_k gamma_k g_k and r_{k+1} = sqrt{beta_2} r_k + (1 - sqrt{beta_2}) d_k gamma_k langle g_k, s_k rangle_{A_{k+1}^{-1}}.
  evidence:
  - source_id: r586-primary-pdf
    locator: Section 3, Algorithm 3, Theorem 4, pp. 5-6; Section 6, Algorithms 4-5, pp. 9-10; Appendices C and F, pp. 35-39, 44-46
    relation: supports
- claim_id: deterministic-convex-theory-scope-and-float16-initial-d0-underflow-limitation
  kind: limitation
  statement: The theoretical convergence guarantees of D-Adaptation (Theorems 1-4) are proven for deterministic convex Lipschitz objectives with d_0 <= D, and in 16-bit floating-point (float16) training, initializing d_0 below 10^{-8} can cause numerical underflow in the initial weighted gradient accumulator s_k.
  evidence:
  - source_id: r586-primary-pdf
    locator: Section 4.2, p. 7; Section 7.7, p. 15
    relation: supports
