claims:
- claim_id: method
  kind: mechanism
  statement: Add r·min(l,n) to cumulative log probability S(y), where n is the hypothesis length and r≥0.
    The 2017 method estimates l from a development-set target/source length ratio times the input length.
    For a current prefix at depth i, all remaining reward is bounded by r·max(l−i,0). Its total completion-score
    bound simplifies to S(prefix)+r·l. A beam decoder may stop once the maximum such active-prefix bound
    is no greater than the best completed adjusted score.
  evidence:
  - source_id: method-source
    locator: Section 4, score definition and Equations (3)–(4), printed pp. 2136–2137 / PDF pp. 3–4
    relation: supports
- claim_id: later-name-and-scope
  kind: scope
  statement: The 2018 paper calls the fixed-rate capped rule bounded word-reward and distinguishes it
    from its predicted-length and adaptive-reward variants.
  evidence:
