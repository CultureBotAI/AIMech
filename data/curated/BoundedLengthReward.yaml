name: Bounded length reward for sequence scoring
definition: A sequence scoring rule that adds a fixed nonnegative reward per generated position up to
  a finite length cap, giving score S(y)+r·min(l,|y|) instead of rewarding every additional position without
  bound.
concept_kind: mathematical_method
identity_notes: The cap limits how much reward can accumulate; it is not itself a maximum allowed output
  length. This is the bounded reward in Huang et al. 2017, called bounded word-reward by Yang et al. 2018.
  It differs from division by output length, an uncapped word reward and a reward rate recomputed from
  beam statistics. No normalized identity match was found across the 442 AIO and 146 prior native records;
  both checkout text searches included ignored and hidden files and returned no matches for the selected
  exact IDs, full labels, aliases and source titles.
limitations:
- The score is a decoding preference, not a probability distribution or an intrinsic translation-quality
  measure.
- The reward rate and length-cap estimate require specification. A development-set average length ratio
  need not transfer to every sentence or domain.
- The stopping bound assumes non-increasing log probability, nonnegative fixed reward and a fixed finite
  cap for the input; its beam-relative guarantee does not undo finite-width pruning.
- Reward saturation does not prohibit outputs longer than the cap. Tokenization, length counting and EOS
  handling must be specified in an implementation.
- No numerical BLEU improvement, universal quality advantage or current implementation behavior is asserted.
