name: Multi-label text mixture model
definition: A generative multi-label document model that selects a label subset and a mixture supported
  on that subset, then generates each word through one of the selected labels and its class-specific word
  distribution.
concept_kind: model_family
identity_notes: Scoped to McCallum's 1999 mixture model for multi-label text classification, whose training
  observes document label sets while token labels are latent. The maintained name describes this source
  construction; no source acronym is invented. It differs from independent binary classifiers, mutually
  exclusive multiclass classification and unsupervised topic discovery. The uniform author-word comparator
  cited by later author-topic papers is a simplified case, not an alias for the full learned label-mixture
  construction. No normalized candidate identity matched all 442 pinned AIO IDs, labels and scoped synonyms
  or 429 preceding native IDs, names and aliases. Full-checkout searches included ignored and hidden files
  in both checkouts; 23 matching lines per checkout came from four unique file contents containing prior
  frontier leads and contextual distinctions. All matching excerpts were inspected. The semantic search
  returned 205 label/synonym hits, with 204 unchanged from prior reading and one newly read. Eighteen
  annotated AIO CLASS nodes and outgoing edges were byte-verified against prior inspected versions. Twenty-six
  contextual YAMLs comprise 24 unchanged prior readings and two final round102 records verified against
  their fully read scientific-review inputs. No candidate record is present within this bounded pinned-snapshot
  and maintained-corpus search.
limitations:
- The prior-mode substitution is not generally the integrated likelihood or the posterior mode of lambda
  given the document. Per-subset parameters and label-subset search become difficult with many labels;
  the source uses backoff and heuristic search.
- The reported additive estimate (count+m)/(D+m*number_of_subsets) is a posterior mean under symmetric
  Dirichlet(m), or an interior MAP estimate under Dirichlet(m+1). With positive m it is not generally
  MAP under a flat Dirichlet(1), despite the source wording. The m=1 Laplace estimator can be retained
  without adopting that prior interpretation.
- Experiments use Reuters-21578 ModApte and particular preprocessing; the ten-class binary naive-Bayes
  baseline vocabulary was selected on test data, explicitly noted by the author. Preliminary 90-label
  results report improved macro F1 with unchanged micro F1 and precision/recall tradeoffs. No universal
  advantage or modern comparative claim follows.
- Background and uniform components are smoothing/modeling devices, not evidence that every document belongs
  to a real semantic background class. The original PostScript and converted PDF are separately hashed.
  No author code or benchmark was executed.
