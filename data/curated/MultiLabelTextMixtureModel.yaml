claims:
- claim_id: label-subset-word-mixture
  kind: mechanism
  statement: A document first chooses a label subset c with prior P(c), then a mixing vector lambda from
    P(lambda|c) with zero mass outside that subset. For each word, a label is sampled from lambda and
    the word from that label's categorical distribution. Training supplies document label subsets and
    leaves token-label assignments unobserved. Classifying a new document compares subset scores containing
    P(c) and the word likelihood integrated over lambda. The presented implementation approximates that
    integral by evaluating one prior-mode mixture for each subset, rather than fitting or integrating
    an arbitrary full mixing distribution. The source's first displayed document probability omits P(c);
    Equation (1) includes it consistently with the generative description.
  evidence:
  - source_id: method-source
    locator: Section 2, converted PDF pp.2-3, first document-probability display and Equation (1)
    relation: supports
- claim_id: estimation-and-subset-search
  kind: mechanism
  statement: The fitting procedure assigns posterior label responsibilities to words, pools class-word
    counts across documents, and pools mixture weights over documents with the same observed label subset.
    Unseen subsets use an overlap-weighted backoff from observed subset mixtures. The reported modifications
    include leave-one-document-out responsibility estimation, a shared learned background component and
    a uniform word component. Prediction combines two greedy searches over label subsets; annealing is
    suggested as another search approach. These approximations and modifications do not establish exact
    marginalization, globally optimal subset selection, or ordinary full-data EM monotonicity.
  evidence:
  - source_id: method-source
    locator: Section 2 Parameter Estimation and Additional Features, converted PDF pp.3-4
    relation: supports
