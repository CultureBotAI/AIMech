claims:
- claim_id: shared-label-coupling
  kind: mechanism
  statement: The model shares word/image parameters across classes and adds label biases tau_t and label-topic
    couplings V_tk. Given h, words and labels have independent Bernoulli logits alpha+Wh and tau+Vh, while
    image features have Gaussian mean beta+Uh and identity covariance. Given all x,z,y, hidden variables
    are independent unit Gaussians with mean W^T x+U^T z+V^T y. As in FoH, the unbounded image/hidden
    joint requires I-UU^T positive definite; finite binary words and labels do not remove this requirement.
  evidence:
  - source_id: method-source
    locator: Section 3.3, PDF pp.5-6, Equations 3.8-3.11; inherited Gaussian specification in Section
      3.2, p.5
    relation: supports
- claim_id: label-support-and-posterior
  kind: mechanism
  statement: For observed x,z, write a=W^T x+U^T z. Integrating hidden variables gives p(y|x,z) proportional
    to exp(tau dot y+||a+V^T y||^2/2) over all binary label vectors. Labels generally become dependent
    after hidden marginalization; exact summation over 2^T configurations is possible in principle. Restricting
    support to exactly one active label would define a different model with categorical, rather than independent
    Bernoulli, h-conditioned labels. The reported single-label classifier chooses the largest posterior
    marginal P(Y_t=1|x,z); this decision does not enforce one-hot support in the joint.
  evidence:
  - source_id: method-source
    locator: Section 3.3, PDF p.6, Equations 3.8-3.12; Section 6, p.11
    relation: supports
- claim_id: missing-label-inference
  kind: mechanism
  statement: When labels are unknown, the simple all-observed hidden Gaussian is replaced by a mixture
    over label configurations. Substituting the posterior mean hidden vector into a logistic label conditional
    is not generally the exact label marginal. The source explores fully factorized mean field and finite-chain
    approximations for prediction and learning, and compares CD with a noisy parameter-gradient procedure.
    These approximations are distinguished from exact finite label enumeration and from an independently
    verified posterior sampler over model parameters.
  evidence:
  - source_id: method-source
    locator: Sections 4.1-4.4, PDF pp.7-8; Section 5.2, pp.9-11
    relation: supports
