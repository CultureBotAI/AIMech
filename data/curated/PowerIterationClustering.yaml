claims:
- claim_id: method
  kind: mechanism
  statement: For a symmetric nonnegative similarity matrix A with zero diagonal and positive row sums,
    form D_ii=sum_j A_ij and W=D^−1 A. Starting with a nonnegative nonzero vector v, iterate v_next=Wv/||Wv||_1.
    Use an intermediate vector before convergence to the constant dominant right eigenvector. Following
    Algorithm 1 and the released pic.m, monitor d_next=abs(v_next−v) componentwise and stop when max_i
    abs(d_next_i−d_i) is sufficiently small, subject to an iteration cap. Apply k-means to the scalar
    coordinates v_i for the requested k clusters. Degree-proportional initialization is described, and
    multiple random initial vectors may supply several embedding coordinates. Section 2.4 prose instead
    writes signed differences; the absolute-change convention here is explicitly the pseudocode/implementation
    convention.
  evidence:
  - source_id: method-source
    locator: Sections 2.1–2.4, PDF pp. 1–4; Algorithm 1 and experimental stopping threshold on p. 4
    relation: supports
  - source_id: author-code
    locator: icml2010/pic.m complete function; x_clusterembed_icml2010.m baseconv, maxit and pic case;
      readme.txt attribution
    relation: supports
- claim_id: stopping-convention
  kind: limitation
  statement: The stopping convention follows the paper pseudocode and released code, which use componentwise
    absolute first changes. The surrounding prose uses signed first changes. The released driver also
    uses a tolerance 100 times the paper’s stated experimental tolerance. These source differences are
    preserved rather than silently reconciled.
  evidence:
  - source_id: method-source
    locator: Section 2.4 and Algorithm 1, PDF pp. 3–4; p. 4 experimental threshold
    relation: supports
  - source_id: author-code
    locator: pic.m and x_clusterembed_icml2010.m, complete files inspected
    relation: supports
