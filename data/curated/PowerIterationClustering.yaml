name: Power iteration clustering
definition: A clustering algorithm that uses an early-stopped power iteration of a normalized similarity
  matrix to embed observations and then applies k-means to their embedding coordinates.
concept_kind: algorithm
identity_notes: 'This is the Lin and Cohen ICML 2010 algorithm. Its qualified PIC alias is distinct from
  path integral clustering: it truncates a matrix iteration to form coordinates instead of merging clusters
  by resolvent descriptors. It is not a generic eigensolver or a claim that converging to the dominant
  eigenvector finds clusters. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 218 preceding native IDs/names/aliases. Word-delimited fixed-string searches of both full
  checkouts, including ignored and hidden files, returned 15 lines each in existing discovery/review context.
  Five neighboring native records and five exact AIO nodes with scoped synonyms and outgoing edges were
  inspected.'
limitations:
- The stopping test is a heuristic for a useful intermediate embedding, not a certificate of cluster recovery.
  A regular graph with degree-proportional initialization starts at a constant vector and can yield no
  separating coordinates.
- Positive row sums are required for the stated row-stochastic normalization. Disconnected graphs, negative
  eigenmodes and collisions in a one-dimensional embedding limit a blanket spectral or convergence interpretation.
- The paper reports experimental tolerance 1e−5/n. The released experiment driver sets baseconv=0.001
  and uses baseconv/n, with maxit=5000. These are different settings, not an asserted benchmark reproduction
  or proof that either setting is wrong.
- Choice of similarity, initialization, stopping rule and k-means solution affects the partition. No code
  was executed, and no runtime, accuracy or global-optimum claim is made.
