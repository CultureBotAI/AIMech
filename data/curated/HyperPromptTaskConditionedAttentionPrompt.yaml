id: AIMech:HyperPromptTaskConditionedAttentionPrompt
name: HyperPrompt (HyperNetwork-Generated Task-Conditioned Self-Attention Prompts)
concept_kind: architecture
review_status: DRAFT
definition: "A multi-task Transformer architecture that initializes a trainable global task prompt P_tau in R^{l x d} for each task tau and applies local bottleneck projection networks (D^m_{tau,k/v}, U^m_{tau,k/v})\u2014either shared across tasks (HyperPrompt-Share), separate per task (HyperPrompt-Sep), or generated from a layer-aware task embedding I^m_tau = h_t(k_tau, z_m) via shared global HyperNetworks H_k and H_v (HyperPrompt-Global)\u2014to produce layer-specific key and value hyper-prompts P^m_{tau,k}, P^m_{tau,v} prepended directly to the multi-head self-attention keys and values at every Transformer block."
identity_notes: Introduced by Yun He, Huaixiu Steven Zheng, Yi Tay, Jai Gupta, Yu Du, Vamsi Aribandi, Zhe Zhao, YaGuang Li, Zhao Chen, Donald Metzler, Heng-Tze Cheng, and Ed H. Chi (ICML 2022, PMLR 162:8678-8690, arXiv:2203.00759). Distinct from Prefix-Tuning (Li & Liang, ACL 2021; AIMech:PrefixTuning), which optimizes single-task per-layer prefixes without cross-task hypernetworks or global-to-local bottleneck projections, and distinct from HyperFormer (Karimi Mahabadi et al., ACL 2021; AIMech Round 703), which generates post-FFN sequential adapter layers rather than self-attention key/value memory tokens. All three architectural variants (HyperPrompt-Share, HyperPrompt-Sep, and HyperPrompt-Global) are covered within this single record.
aliases:
- HyperPrompt
- HyperPrompt-Global
- HyperPrompt-Share
- HyperPrompt-Sep
- MTL-Prompt-Share
- MTL-Prompt-Sep
