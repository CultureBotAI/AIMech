name: R-Novelty+ SAT heuristic
definition: The 1999 R-Novelty extension that replaces its periodic random override with a fixed per-step
  probability of a random clause-variable flip and otherwise uses the recency- and score-gap-dependent
  R-Novelty selector.
concept_kind: algorithm
identity_notes: 'The record is scoped to Hoos’s 1999 R-Novelty+ definition. It removes the original every-100-step
  override, rather than adding a random-walk branch while silently retaining that schedule. The 2004 competition
  report uses Rnovelty+ for a periodic configuration; that differently specified variant is not the present
  identity. At zero walk probability this method reduces to the core R-Novelty selector without the 1997
  periodic escape, not the entire original 1997 strategy. No normalized identity match was found across
  all 442 pinned AIO labels/scoped synonyms and 325 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 90 and 90 lines
  respectively. All 64 unique hit contents were inspected: neighboring variant and source references,
  saved reviews and candidate leads, not existing candidate records. Exact checkout counts and differences
  are retained in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges
  and five full native neighboring records were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.'
limitations:
- The asymptotic guarantee requires a strictly positive walk probability at every step, bounded below
  independently of elapsed search history. A scheduled-only override or a probability that tends to zero
  does not automatically satisfy that premise. At w=0 the random-walk argument no longer applies.
- The guarantee concerns finding a model on a finite satisfiable formula in the limit of continued search.
  A finite budget can miss an existing model and cannot certify UNSAT. The source’s lower bound can be
  extremely small; no polynomial or practical runtime follows.
- The walk probability w is separate from the inner selector’s noise parameter p. The reported experimental
  w=0.01 is not a defining or universally optimal constant. Optional outer restarts and cutoffs must be
  specified separately.
- Empty clauses, unit clauses lacking a second candidate, initial age ties, duplicate literals and timestamp/reset
  conventions require a well-defined implementation. The general random-walk proof does not certify undocumented
  choices in the short selector description. No author solver or benchmark was executed.
- The asymptotic guarantee for the 1999 per-step extension must not be transferred to the 2004 periodic
  configuration merely because both use a plus label. The previously proved trapping example shows why
  scheduled random steps can miss an essential variable.
id: AIMech:RNoveltyPlus
