definition_evidence:
- source_id: method-source
  locator: PDF5–6, random-walk extension and explicit removal of R-Novelty’s periodic override; PDF3–4,
    asymptotic scope and Theorem 2; PDF4–5, periodic strategy incompleteness
  relation: supports
claims:
- claim_id: method
  kind: mechanism
  statement: 'Randomly select an unsatisfied clause. With fixed walk probability w in [0,1], choose a
    variable uniformly from that clause and flip it. Otherwise apply the core R-Novelty selector: rank
    candidates by global post-flip violation count with oldest-variable tie breaks. Choose the best if
    it is not the most recently flipped variable in the clause. If it is most recent, let d be the second-best
    count minus the best count, with d>=1 under the stated age/score assumptions, and use inner noise
    p in [0,1]. For p<0.5 choose second-best with probability 2p when d=1 and with probability zero when
    d>1. For p>=0.5 choose second-best with probability one when d=1 and with probability 2(p−0.5) when
    d>1. Choose best otherwise. Update the timestamp of the flipped variable. Omit the periodic every-100-step
    override: the new walk coin is evaluated at each step. A fixed w>0 supports the source’s asymptotic
    result; w=1 gives pure clause-first random walk and w=0 retains only the core selector.'
  evidence:
  - source_id: method-source
    locator: PDF5–6, random-walk extension and explicit removal of R-Novelty’s periodic override; PDF3–4,
      asymptotic scope and Theorem 2; PDF4–5, periodic strategy incompleteness
    relation: supports
  - source_id: additional-1
    locator: PDF2 / printed322, Novelty and R-Novelty selector definitions; PDF3 / printed323, original
      periodic R-Novelty override
    relation: supports
- claim_id: asymptotic-model-finding
  kind: scope
  statement: For a finite satisfiable CNF and a well-defined remaining move policy, a fixed positive lower
    bound on the probability of a uniform random-clause/random-variable step at every search step gives
    success probability approaching one as the number of steps tends to infinity. Hoos1999 Theorem 2 establishes
    this via a positive probability of a sequence reducing Hamming distance to a model. The conclusion
    does not give a polynomial or practically small runtime, a finite-run guarantee, or an UNSAT certificate.
  evidence:
  - source_id: method-source
    locator: PDF3, Definition 2 and no-restart scope; PDF3–4, Lemma 1 and Theorem 2; PDF5–6, application
      to the plus extensions
    relation: supports
- claim_id: plus-source-version-boundary
  kind: scope
  statement: Hoos1999 explicitly removes the periodic escape when defining R-Novelty+, while the 2004
    competition report calls an every-100-step configuration Rnovelty+. This record follows the former
    definition and does not treat the latter’s cycling-prevention statement as its theorem.
  evidence:
  - source_id: method-source
    locator: PDF5–6, per-step walk and omission of periodic override
    relation: supports
  - source_id: additional-2
    locator: PDF/printed2, periodic configuration and plus naming
    relation: context
