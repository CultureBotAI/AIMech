claims:
- claim_id: alcc-complex-roots-of-unity-lagrange-encoding-mechanism
  kind: mechanism
  statement: ALCC encodes K real-valued dataset blocks X_1, ..., X_K in R^(m x d) together with T i.i.d. Gaussian noise matrices Z_1, ..., Z_T ~ N(0, sigma_n^2) into the complex Lagrange polynomial u(z) = sum_{j=1}^K X_j l_j(z) + sum_{j=K+1}^{K+T} Z_{j-K} l_j(z) using evaluation points beta_j = gamma * exp(2*pi*i*(j-1)/(K+T)) on a circle of radius gamma in C and worker points alpha_r = exp(2*pi*i*r/N) on the unit circle, so that any subset of at least D*(K + T - 1) + 1 workers evaluating a degree-D polynomial f(u(alpha_r)) suffices to interpolate f(X_j) with well-conditioned complex Vandermonde matrices.
  evidence:
  - source_id: r548-primary-pdf
    locator: Section III-A Encoding and Decoding & Lemma 1, pp. 3-5
    relation: supports
- claim_id: alcc-analog-privacy-leakage-tradeoff-scope
  kind: scope
  statement: Against any subset T_c of at most T colluding workers in the analog floating-point domain, ALCC bounds the mutual-information leakage I(X; U_{T_c}) and provides (epsilon, delta)-differential privacy guarantees as an explicit function of the noise variance sigma_n^2, the circle radius ratio gamma, and the singular values of the complex Cauchy-Vandermonde submatrices.
  evidence:
  - source_id: r548-primary-pdf
    locator: Section III-B Privacy Analysis & Theorem 1-3, pp. 5-8
    relation: supports
- claim_id: alcc-accuracy-privacy-floating-point-precision-limitation
  kind: limitation
  statement: Unlike finite-field Lagrange coding which achieves zero mutual information (perfect information-theoretic privacy) over F_p, ALCC over floating-point numbers exhibits a fundamental accuracy-privacy trade-off because increasing the Gaussian mask standard deviation sigma_n to strengthen privacy amplifies floating-point roundoff error in the decoded polynomial evaluation.
  evidence:
  - source_id: r548-primary-pdf
    locator: Section IV Accuracy Analysis & Theorem 4, pp. 8-10
    relation: supports
- claim_id: alcc-privacy-preserving-distributed-polynomial-inference-application
  kind: application
  statement: Applied to privacy-preserving straggler-resilient distributed matrix multiplication and polynomial kernel classification over floating-point datasets without finite-field quantization.
  evidence:
  - source_id: r548-primary-pdf
    locator: Section V Experimental Results, pp. 10-11
    relation: supports
