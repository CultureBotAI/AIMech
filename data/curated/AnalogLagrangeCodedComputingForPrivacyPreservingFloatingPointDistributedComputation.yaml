id: AIMech:AnalogLagrangeCodedComputingForPrivacyPreservingFloatingPointDistributedComputation
name: Analog Lagrange Coded Computing for Privacy-Preserving Floating-Point Distributed Computation
concept_kind: algorithm
review_status: DRAFT
definition: An analog coded distributed computing algorithm that extends Lagrange Coded Computing from finite fields to real and complex floating-point domains by embedding K real-valued dataset partitions X_1, ..., X_K and T zero-mean Gaussian random noise masks Z_1, ..., Z_T into a degree-(K + T - 1) Lagrange interpolation polynomial u(z) evaluated at complex roots of unity beta_j = gamma * omega^(j-1) and distributed to N worker nodes at unit-circle roots of unity alpha_i = omega_N^i, enabling numerically stable recovery of degree-D polynomial evaluations f(X_j) from any D*(K + T - 1) + 1 surviving workers while bounding mutual-information and differential-privacy leakage against up to T colluding workers.
identity_notes: Introduced as Analog Lagrange Coded Computing (ALCC) by Mahdi Soleymani, Hessam Mahdavifar, and A. Salman Avestimehr (IEEE Journal on Selected Areas in Information Theory, Vol. 2, No. 1, pp. 283-295, 2021; arXiv:2008.08565). Distinct from finite-field Lagrange Coded Computing (Yu et al., AISTATS 2019, Round 536), which requires fixed-point quantization into F_p and suffers from modular overflow on multi-term products; distinct from Berrut Approximated Coded Computing (Jahani-Nezhad & Maddah-Ali, IEEE TPAMI 2023, Round 547), which uses barycentric rational interpolation for non-polynomial functions without T-colluding Gaussian privacy masks; and distinct from CodedPrivateML (So, Guler, & Avestimehr, IEEE JSAIT 2021, Round 550), which uses stochastic rounding into a prime finite field F_p rather than analog floating-point complex roots of unity.
aliases:
- Analog Lagrange Coded Computing
- ALCC
- Complex Roots-of-Unity Analog Lagrange Coded Computing
