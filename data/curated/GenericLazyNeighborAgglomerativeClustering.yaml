limitations:
- This record covers the stored-matrix generic procedure of Section3.1. Section6’s fresh-lowest-label
  variant and vector-data implementations require separate implementation assessments; they are not asserted
  as interchangeable APIs.
- A valid greedy hierarchy is the output contract. The method does not infer a cluster count or establish
  globally optimal fixed-count partitions. Linkage geometry and admissible dissimilarities remain requirements
  of the chosen criterion.
- The paper’s generic applicability concerns distance-update formulas in its symmetric-dissimilarity setting.
  The inspected fastcluster implementation dispatches a fixed set of linkage rules; no arbitrary callback
  API is claimed.
- A finite centroid/median example merges points (−1,0) and (1,0) at squared height 4, then merges (0,9/5)
  at height 81/25. Sorting those heights would violate the dependency on the earlier union.
- All 29 pages of the primary paper were visually read. The complete matrix generic_linkage and indexed
  heap, relevant distance updates and specified wrapper passages were statically inspected at the pinned
  commit; no author code, empirical timing or floating-point behavior was executed.
- Curator calculations verify the lower-bound/equality invariant and global merge admissibility for 3,645
  four-object matrix/linkage cases and 243 Euclidean cases, plus inversion, history-dependent-update and
  one/two-object boundaries. Their reference implementation uses linear queue selection and does not measure
  the paper’s time or memory bounds.
