  relation: supports
claims:
- claim_id: candidate-lower-bounds
  kind: mechanism
  statement: For each active row except the largest index, keep a candidate neighbor among higher-index
    clusters and a lower bound on that row’s minimum dissimilarity. Initialize the bounds by row scans
    and index them in a minimum-priority queue. Symmetry ensures these upper-triangular rows collectively
    contain a globally closest pair.
  evidence:
  - source_id: mullner2011
    locator: Section3.1, Figure3 lines5–9, PDF pp.8–10
    relation: supports
  - source_id: fastcluster-core
    locator: generic_linkage initialization, src/fastcluster.cpp lines940–1000 at the pinned commit
    relation: supports
- claim_id: deferred-rescan-and-certification
  kind: mechanism
  statement: Take a row with smallest queued bound. If its bound equals the actual distance to its candidate,
    the pair attains a global minimum. Otherwise rescan that row, raise its bound to the true row minimum,
    update the queue and reconsider the smallest entry. Candidate invalidation can therefore remain unresolved
    while its lower bound is larger than the current global minimum.
  evidence:
  - source_id: mullner2011
    locator: Section3.1, Figure3 lines11–20 and explanation, PDF pp.9–11
    relation: supports
  - source_id: fastcluster-core
    locator: generic_linkage invariant comments and stale-minimum loop, src/fastcluster.cpp lines1000–1060
    relation: supports
- claim_id: merge-and-cache-maintenance
  kind: mechanism
  statement: After accepting a pair, record the merge, remove its smaller row index and reuse the larger
    index for the union. Update distances under the selected linkage using the premerge cluster sizes.
    Redirect references to the removed representative, lower bounds when a new distance is smaller, and
    recompute the merged row’s higher-index minimum when such a row exists. These updates preserve the
    lower-bound and attained-bound invariants.
  evidence:
  - source_id: mullner2011
    locator: Section3.1, Figure3 lines21–40 and explanation, PDF pp.9–11
    relation: supports
  - source_id: fastcluster-core
    locator: generic_linkage merge and per-method updates, src/fastcluster.cpp lines1060–1348
    relation: supports
- claim_id: inversions-and-linkage-scope
  kind: scope
  statement: The method certifies a globally closest pair at each step without the nearest-neighbor-chain
    reducibility condition. It accommodates the paper’s centroid and median linkages, whose merge heights
    can decrease. Preserve their chronological merge dependencies rather than sorting those heights. Ties
    may select any valid closest pair; agreement with one fixed arbitrary tie convention is not required.
  evidence:
  - source_id: mullner2011
    locator: Section2.2 and Section3.1, PDF pp.4–5,8–11
    relation: supports
  - source_id: fastcluster-wrapper
    locator: Matrix dispatch and generate_SciPy_dendrogram<true> for centroid/median, src/fastcluster_python.cpp
      lines313–353
    relation: supports
- claim_id: time-and-memory-boundaries
  kind: scope
  statement: For the stored-matrix setting and constant-time scalar distance updates, the paper gives
    quadratic best-case time and a cubic worst-case upper bound because stale row minima may require repeated
    scans. The algorithm retains a writable quadratic-size distance matrix plus linear auxiliary storage
    for candidates, bounds and the indexed queue. Empirically near-quadratic timing does not establish
    a universal quadratic guarantee.
  evidence:
  - source_id: mullner2011
    locator: Section3.1 and Section4.1, PDF pp.10–11,20–21
    relation: supports
  - source_id: fastcluster-core
    locator: binary_min_heap and generic_linkage storage, src/fastcluster.cpp lines779–1000
    relation: supports
- claim_id: literal-source-and-implementation-limits
  kind: limitation
  statement: The printed Figure3 updates the retained cluster size before passing sizes to its update
    formula and requests a higher-index minimum even at the terminal boundary. The later pinned matrix
    implementation saves both old sizes and guards that row update. Its lower-bound prose and operations
    imply bound≤true minimum despite a reversed sign in a comment. This record uses the supported invariant
    and those explicit boundaries rather than treating every printed line or code comment as an executable
    specification.
  evidence:
  - source_id: mullner2011
    locator: Section3.1, Figure3 lines23–26,39–40 and invariant explanation, PDF pp.9–11
    relation: supports
  - source_id: fastcluster-core
    locator: generic_linkage comments, saved sizes and idx2<N_1 guards, src/fastcluster.cpp lines1000–1348
    relation: supports
