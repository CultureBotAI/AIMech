id: AIMech:GenericLazyNeighborAgglomerativeClustering
name: Generic lazy-neighbor agglomerative clustering
aliases:
- Generic linkage algorithm (Müllner)
- GENERIC_LINKAGE
concept_kind: algorithm
definition: An agglomerative clustering algorithm that caches candidate nearest neighbors and lower bounds
  on row-minimum dissimilarities in a priority queue, rescanning a stale row only when necessary to certify
  the next globally closest pair before merging it.
identity_notes: Compared all 442 pinned AIO and 652 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 38, 0, 0 lines. All distinct match contents were
  read, including generated index rows repeating the fully read corrected nearest-neighbor-chain record.
  Recovery hits concern shared primary-source references, chain implementation context or pending generic-procedure
  discovery notes; none identifies an existing standalone cached-bound record. Both other checkouts returned
  no matches including ignored and hidden files. Semantic matching covered 26 AIO and 169 native definitions,
  all read; unchanged definitions were byte-compared with the preceding full assessment. 9 full annotated
  AIO node/edge/generated contexts and 4 full native records were inspected. Retain Mullner’s stored-matrix
  generic linkage with deferred candidate-neighbor rescans and a lower-bound priority queue. It is not
  a generic label for every agglomerative algorithm, a linkage criterion, reciprocal-chain search or neighbor-voting
  classification. The Section6 alternative and vector implementations are not silently asserted as identical
  interfaces.
