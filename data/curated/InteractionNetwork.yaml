aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: Shared learned multilayer relation and object functions make this a particular artificial
    neural architecture. The target is broader. The graph-convolutional target references a distinct named
    GCN construction; graph use alone does not establish equivalence. Temporal recurrence and probabilistic
    graphical-model tasks are not required identities.
limitations:
- The primary proceedings-hosted nine-page PDF retains anonymous submission placeholders and line numbers.
  Authors and NIPS 2016 identity come from the primary proceedings metadata; no unidentified PDF revision
  is equated with an inspected author implementation.
- The matrix receiver-first convention is explicit. Earlier sender/receiver notation is inconsistent;
  the record does not silently claim all source expressions use the same order.
- Supplied binary relations, shared functions and summation define the scoped neural architecture. Higher-order
  relations, perceptual front ends and probabilistic inference are discussed as future work.
- All nine main-paper pages were read; supplementary material, other versions and author code were not
  inspected. Constructed algebra examples do not train a network, simulate the reported physics or replicate
  benchmarks. DRAFT remains.
