name: Unadjusted Langevin algorithm
definition: An approximate sampling algorithm that discretizes overdamped Langevin dynamics by an explicit
  gradient drift and Gaussian noise without a Metropolis acceptance correction.
concept_kind: algorithm
identity_notes: This is the full-gradient Euler discretization for a differentiable continuous target.
  It is not deterministic gradient descent, stochastic-gradient Langevin dynamics, the exact continuous-time
  diffusion or Metropolis-adjusted Langevin sampling. A fixed-step chain generally has a different invariant
  law from its intended target. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive full-checkout searches found prior
  discovery leads for Gibbs and slice sampling plus unrelated environment substring hits, not existing
  concept records. Existing HMM/MRF models and general Metropolis–Hastings were inspected to distinguish
  model, general transition and specialized algorithm scope.
limitations:
- At a fixed positive step size, a stationary distribution, when it exists, generally differs from pi.
  Running longer does not by itself remove that discretization bias.
- The paper’s convergence results have regularity, drift and step-size assumptions. Merely taking gamma
  to zero does not establish convergence for every target or schedule.
- Discrete Euler dynamics can be unstable even when the continuous diffusion is well behaved. Gradients
  and noise scaling both depend on the step-size convention.
- Roberts and Tweedie’s introductory ULA display on printed p. 345 / PDF p. 6 appears to omit h in the
  drift. This record uses the unambiguous Durmus–Moulines Equation (2), consistent with the h-scaled drift
  in the older paper’s later analysis; it does not claim a published erratum was found.
- No minibatch gradient approximation, preconditioning, projection, taming or empirical accuracy bound
  is included in this record.
