claims:
- claim_id: method
  kind: mechanism
  statement: For a proper target pi(x) proportional to exp(−U(x)), with differentiable U, update X_(k+1)=X_k−gamma_(k+1)
    grad U(X_k)+sqrt(2 gamma_(k+1)) Z_(k+1), where the Z values are independent standard Gaussian vectors
    and gamma is positive. There is no accept/reject step. Constant and predetermined decreasing step-size
    schedules are both covered by the source. Equivalently, writing h=2 gamma and grad log pi=−grad U
    gives mean x+(h/2)grad log pi(x) and noise covariance hI. This equivalence is an explicit change of
    notation, not a separate sampling method.
  evidence:
  - source_id: method-source
    locator: Introduction, Equations (1)–(2) and constant/decreasing step-size discussion, PDF/printed
      pp. 1–2; Section 2, assumptions and kernel, pp. 3–4
    relation: supports
- claim_id: discrete-bias-and-instability
  kind: limitation
  statement: Roberts and Tweedie distinguish ULA’s generally biased stationary law from the intended continuous-diffusion
    target and show that discretization can qualitatively change recurrence and convergence behavior.
    These are conditional results, not a blanket claim that every ULA run is unstable.
  evidence:
  - source_id: discrete-bias-and-instability
    locator: Section 3.1, printed pp. 351–354 / PDF pp. 12–15
    relation: supports
