claims:
- claim_id: method
  kind: mechanism
  statement: For fixed observed y and model parameters theta, start at a configuration x with a defined
    positive posterior. In a sequential sweep, replace x_i by an element of argmax_u p(x_i=u | x_(-i),y,theta),
    using already updated values at earlier sites. Equivalently maximize the joint posterior with all
    other coordinates held fixed. For an MRF prior and independent local emissions the score is b_i(y_i|u)*p_i(u|x_neighbors);
    shared observation factors require every factor affected by the coordinate. Each exact update cannot
    decrease the fixed joint objective. On a finite configuration space, requiring strict improvement
    for a changed value, or retaining the current value on a tie, yields finite termination at a coordinatewise
    mode. This need not be a global joint MAP solution. Joint updates on conditionally independent coding
    sets can be parallelized; simultaneously updating interacting sites from stale neighbors has no such
    monotonicity guarantee. A block extension maximizes over a selected block given its complement.
  evidence:
  - source_id: method-source
    locator: Section 2.5, printed pp. 264–266 / PDF pp. 7–9, especially Equation (5); Section 2.6, pp.
      266–267 / PDF pp. 9–10; Sections 4–5, pp. 273–279 / PDF pp. 16–22, conditional dependence and parameter
      estimation
    relation: supports
- claim_id: local-optimality-limits
  kind: limitation
  statement: ICM can remain at an initialization-dependent local mode and does not generally quantify
    uncertainty or guarantee the globally optimal segmentation; the source’s illustrative parameter settings
    are not universal prescriptions.
  evidence:
  - source_id: author-reply
    locator: Author’s reply, printed pp. 298–299 / PDF pp. 41–42
    relation: supports
