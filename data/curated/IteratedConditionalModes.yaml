name: Iterated conditional modes
definition: A deterministic conditional-mode optimization algorithm that repeatedly updates one variable
  to a mode of its conditional distribution given the current values of the remaining variables, seeking
  a coordinatewise mode of a fixed joint distribution.
concept_kind: algorithm
identity_notes: ICM is a label or state optimization procedure, not the hidden Markov random field it
  can optimize and not iterative conditional estimation of model parameters. It is a probability-based
  coordinate-ascent instance related to hill climbing; Gibbs sampling instead draws a conditional random
  value. The classical image implementation uses local Markov neighbors and site emissions, but the conditional-mode
  principle also applies when an observation affects several sites or when the posterior neighborhood
  is wider. Single-site ICM is the defining scope; joint block updates are a stated extension. The paper
  credits earlier work and does not establish a 1986 first-invention claim. No normalized identity match
  was found across all 442 pinned AIO labels and all scoped synonyms and 397 preceding native IDs, names
  and aliases for these three concepts. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, yielding 12 and 12 matched lines; all 9 unique contents were read. Hits
  represent citations and discovery leads rather than records of these identities. All 161 semantic label/synonym
  hits were read. Forty fully annotated exact CLASS nodes and outgoing edges were inspected:24 byte-verified
  after prior full reading and 16 freshly read. Fifty contextual YAMLs comprise 40 generated and 10 native
  records:28 byte-verified after prior reading and 22 freshly read. Any truncated display was reread in
  smaller batches. Short acronyms were included in the complete normalized identity comparison. Absence
  is bounded to the pin, native collection and inspected semantic neighborhood.
limitations:
- Initialization and update order can change the resulting mode. A coordinatewise optimum can have lower
  posterior probability than another configuration. ICM does not provide posterior uncertainty or the
  sitewise marginal posterior mode merely by returning a joint labeling.
- The monotonicity and finite-state termination statements require a fixed objective, valid exact conditionals
  and the stated tie policy. Arbitrary switching among tied states can cycle; continuous-valued coordinate
  ascent need not terminate in finitely many steps.
- The source’s simultaneous image updates and its changing interaction parameter are practical variants,
  not a proof for fully synchronous updates or a changing posterior. Alternating estimated labels and
  fitted parameters, especially pseudolikelihood fitting, does not inherit exact EM monotonicity.
- For independent site observations, the local emission factor is sufficient for a coordinate update.
  Correlated observations, blur, tomography and shared likelihood factors can enlarge the required conditional
  neighborhood. A product containing only the updated site’s emission would then generally be wrong.
- Strong coupling and fine structures can produce initialization dependence and artifacts. The illustrative
  interaction strength 1.5 and a few reported sweeps are not universal defaults or convergence bounds.
  The author’s reply explicitly limits optimality and empirical claims.
- The paper’s main image examples and discussion establish method context, not universal segmentation
  superiority. No author code, image benchmark or parameter fitting was reproduced. A separate finite
  probability witness tests update order, synchronous oscillation and tie behavior.
