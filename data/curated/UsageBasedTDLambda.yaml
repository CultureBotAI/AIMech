  inverse feature-usage step sizes outside an ordinary accumulating TD trace. It differs from usage-based
  true online TD, whose Dutch trace contains the step vector and whose update corrects changing predictions,
  and from the broader temporal-difference family and off-policy WIS hosts. Special cases do not identify
  complete algorithms. Existing owner 264 retains seven prior IDs and five resolutions; the source is
  Mahmood and Sutton 2015. The fresh collection after PR389 merged, on 15 October 2026 at 18:42:28–18:45:19
  UTC, covered 775 maintained native and 442 pinned AIO records. IDs, local IDs, names, aliases and scoped
  synonyms supplied 4,843 identity fields. Canonical names and explicit source spellings, including Greek
  lambda, produced no normalized candidate collision. Four fixed-string searches included ignored and
  hidden paths and retained 6,064 occurrences in 1,351 distinct content groups. Two supporting agents
  read all grouped contents in disjoint partitions; root read all 37 filtered candidate-named groups,
  twelve normalized neighbor definitions, 29 fields and full owners 264,265,266 and269. Candidate-named
  matches are source-lead, history, review and existing-neighbor context. All 1,216 pre-WIS-TD inventory
  rows and the newly merged WIS-TD record were reconciled at the actual base. Historical research snapshots
  remain separately dated. This supports a bounded identity decision for these roots, probes and pinned
