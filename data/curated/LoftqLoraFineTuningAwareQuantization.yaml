claims:
- claim_id: r658-claim-alternating-quantization-and-svd-error-reduction
  kind: mechanism
  statement: Even a single step (T = 1) of LoftQ exactly captures the top-r singular components of the quantization error W - q_N(W) via Eckart-Young-Mirsky truncated SVD, and alternating for T >= 2 steps further adjusts the quantization grid inputs W - A_{t-1} B_{t-1}^T so outliers are absorbed into the low-rank branch A_t B_t^T, monotonically reducing the Frobenius and spectral norm approximation errors ||W - Q_t - A_t B_t^T||_F and ||W - Q_t - A_t B_t^T||_2 compared to QLoRA.
  evidence:
  - source_id: r658-primary-pdf
    locator: Section 2.3, Figures 1-2, p. 3; Section 3.2, Equations (4)-(6), Algorithm 1 & Figure 3, p. 4-5
    relation: supports
- claim_id: r658-claim-sub-4bit-extreme-low-bit-fine-tuning-recovery
  kind: application
  statement: On DeBERTaV3-base (GLUE), BART-large (XSum/CNN-DailyMail summarization), and LLaMA-2-7B/13B/70B (GSM8K and WikiText-2), LoftQ consistently outperforms QLoRA across 4-bit, 3-bit, 2.5-bit, and 2-bit NF4 and uniform quantization regimes, recovering downstream fine-tuning accuracy in 2-bit quantization where standard QLoRA fails to converge.
  evidence:
  - source_id: r658-primary-pdf
    locator: Section 4.1-4.3, Tables 1-6 & Figure 4, p. 5-9
    relation: supports
- claim_id: r658-claim-unmerged-inference-and-svd-precomputation-limitation
  kind: limitation
  statement: Because Q_T is stored in low-bit quantized format while A and B are stored and updated in high precision (FP16/BF16), the low-rank adapter A B^T cannot be folded into Q_T without dequantizing Q_T to full precision, and running T alternating steps requires T truncated SVDs per weight matrix during one-time model initialization.
  evidence:
  - source_id: r658-primary-pdf
    locator: Section 3.2-3.3 (Applying to LoRA Fine-Tuning), p. 4-5; Appendix D (Computational Cost), p. 15
    relation: supports
