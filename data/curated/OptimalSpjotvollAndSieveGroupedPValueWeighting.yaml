- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Optimal Spjøtvoll and sieve-grouped p-value weighting allocates differential per-hypothesis
    significance thresholds alpha w_j / m using external priors or low-dimensional group mixtures while
    maintaining family-wise error rate control against multiplicity-induced false positives (AIO:DataDredgingBias).
limitations:
- By Lemma 3.6, the unsmoothed Spjøtvoll optimal weight functional Q -> rho_Q(xi) is discontinuous in
  the Kolmogorov-Smirnov distance and assigns zero weight w(xi_hat_k) = 0 whenever an estimated effect
  size is zero or near zero (|xi_hat_k| < delta), which can prevent any hypothesis in a down-weighted
  group from being rejected unless weights are regularized via linear smoothing w_hat_k = (1 - gamma)
  w(xi_hat_k) + gamma K^{-1} sum w(xi_hat_{k'}) with gamma > 0 (Section 3 Property II and Section 5).
- Sieve-principle grouped method-of-moments weighting (Section 5, Equations 12–13) uses the same test
  statistics T_{ik} both to estimate the group-level mixture parameters (pi_hat_k, xi_hat_k) and to perform
  the weighted tests, so its approximate FWER validity relies on the sieve condition K << m with sufficiently
  large group sizes (r_k >= 20–30); if groups are very small or chosen post-hoc to isolate individual
  extreme statistics, family-wise error rate can be inflated (Section 5 and Section 6.2).
- All optimality and worst-case robustness derivations (Theorems 3.1–4.3) are formulated for weighted
  Bonferroni FWER control under Gaussian shift models T_j ~ N(xi_j, 1) (or chi_1^2 mixtures in Equation
  13) rather than step-up false discovery rate (FDR) procedures or general non-Gaussian monotone likelihood
  ratio families.
- 'All 818 lines of Roeder & Wasserman (2009, Statistical Science 24(4):398-413, arXiv:1010.4637v1, DOI:10.1214/09-STS289)
  were read. Constructed numerical checks in research/discovery/optimal-spjotvoll-and-sieve-grouped-p-value-weighting-boundaries.py
  verify (1) Theorem 3.1 & Lemma 3.2 one-parameter Spjøtvoll oracle weights and power identity (c^* =
  3.6167495309, budget error = 2.22e-16, max KKT stationarity error = 6.592e-17, max Lemma 3.2 power identity
  error = 3.608e-16, average oracle power = 0.53897493 > 0.39544288 unweighted Bonferroni), (2) Theorem
  3.4 & Lemma 3.5 sparse-weight robustness at b = 0 and B = 4.0 (Mill''s-ratio sufficient threshold =
  1.18817712 < exact zero-crossing xi_* = 2.41591146 < z_{alpha/m} = 4.41717341, with R_{B,0} = +0.00051182
  > 0), (3) Section 3 Property II & Lemma 3.6 Kolmogorov-Smirnov discontinuity (at gamma = 0.1, K = 1000,
  c = 0.1: u = 0.030529, xi = 9.763185, weight reduced from rho(xi) = 10.0 to rho_tilde(xi) = 0.00999001,
  ratio = 0.000999 = 1/1001) versus Theorems 3.7–3.8 worst-case power at xi = 4.2 < xi_* = 5.91887833
  (least-favorable u_* = 3.44915472 gives worst-case power 0.75292715 > 0.62149445 unweighted Bonferroni),
  and (4) Theorems 4.1–4.2 optimal binary weights (unique mode B^* = 9.459504, turnaround B_0 = 111.65303,
  and maximin weights w_1 = 9.183082, w_0 = 0.569311 achieving exact target power 0.7) and Section 5 Equation
  (12) sieve-principle grouped method-of-moments estimation (max parameter recovery errors 5.551e-17 and
  4.441e-16, smoothed weights [2.875555, 0.969733, 0.104712, 0.05]).'
