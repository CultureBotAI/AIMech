id: AIMech:OptimalSpjotvollAndSieveGroupedPValueWeighting
name: Optimal Spjøtvoll and sieve-grouped p-value weighting
aliases:
- Roeder-Wasserman Optimal and Grouped P-Value Weighting
- Sieve-Principle Method-of-Moments Grouped P-Value Weighting
- Maximin Binary and Oracle Spjøtvoll P-Value Weighting
- Worst-Case Robust Weighted Bonferroni Testing
concept_kind: mathematical_method
definition: 'A frequentist family-wise error rate (FWER) p-value weighting and robustness framework developed
  by Kathryn Roeder and Larry Wasserman (2009, Statistical Science 24(4):398-413, arXiv:1010.4637v1, DOI:10.1214/09-STS289)
  for testing m hypotheses H_j: xi_j = 0 versus xi_j > 0 with standardized statistics T_j ~ N(xi_j, 1)
  and one-sided p-values P_j = Phi_bar(T_j), rejecting H_j when P_j <= alpha w_j / m (equivalently T_j
  > z_{alpha w_j / m}) for weights w_j >= 0 satisfying m^{-1} sum_{j=1}^m w_j = 1 (Lemma 2.1) or E_H[W_j]
  <= 1 for random auxiliary weights W_j = g(V_j, c) independent of P_j under H_j (Lemma 2.2). Maximizing
  average power m_1^{-1} sum_{j: xi_j > 0} Phi_bar(z_{alpha w_j / m} - xi_j) yields the one-parameter
  Spjøtvoll/Rubin-Dudoit-van der Laan oracle weight family w_j = rho_c(xi_j) = (m/alpha) Phi_bar(xi_j/2
  + c/xi_j) for xi_j > 0 (and 0 for xi_j = 0), where c = c(theta) solves m^{-1} sum_{j=1}^m rho_c(xi_j)
  = 1 and gives test-specific critical cutoffs T_j > xi_j/2 + c/xi_j and oracle power Phi_bar(c/xi_j -
  xi_j/2) (Theorem 3.1, Lemma 3.2). Roeder and Wasserman prove two fundamental robustness properties explaining
  why poorly specified weights still outperform unweighted Bonferroni: (Property I) for worst-case binary
  weights B = min{w_j : w_j > 1} and b = min{w_j}, the robustness function (power gain minus power loss)
  R(xi) = [pi(xi, B) - pi(xi, 1)] - [pi(xi, 1) - pi(xi, b)] is positive iff Phi_bar(z_{B alpha/m} - xi)
  + Phi_bar(z_{b alpha/m} - xi) > 2 Phi_bar(z_{alpha/m} - xi) (Theorem 3.4) and remains positive on a
  non-empty safe zone [0, xi_*] even when b = 0 and B >= 2 (Lemma 3.5); and (Property II) although the
  optimal weight functional Q -> rho_Q(xi) is discontinuous in Kolmogorov-Smirnov distance d(Q, Q_tilde)
  = gamma when a fraction gamma of nulls are misspecified as positive mean u > 0 (Lemma 3.6), the worst-case
  power inf_{u >= 0} pi_u(xi) occurs at the least-favorable false-positive mean u_* = sqrt(2 c_*) solving
  gamma Phi_bar(sqrt(2 c_*)) + a Phi_bar(xi/2 + c_*/xi) = alpha/m and equals Phi_bar(c_*/xi - xi/2), which
  still beats unweighted Bonferroni for xi < xi_* and has asymptotic power deficit bounded by gamma/(1
  - a) + O(a) (Theorems 3.7-3.8). To construct practical weights, the method provides both closed-form
  maximin binary external weights (Theorems 4.1-4.3) and a sieve-principle data-driven grouped estimator
  that partitions tests into K << m prior groups G_k of size r_k >= 20-30, estimates group mixture parameters
  (pi_k, xi_k) under T_{ik} ~ (1 - pi_k) N(0, 1) + pi_k N(xi_k, 1) via method of moments pi_hat_k = Y_k^2
  / (Y_k^2 + S_k^2 - 1) and xi_hat_k = Y_k / pi_hat_k (Equation 12; or Equation 13 for two-sided chi_1^2
  mixtures), and forms linearly smoothed group weights w_hat_k = (1 - gamma) w(xi_hat_k) + gamma K^{-1}
  sum_{k''} w(xi_hat_{k''}) with gamma in {0.01, 0.05} (Section 5).'
identity_notes: No normalized identity match for Optimal Spjøtvoll and sieve-grouped p-value weighting
  across all 442 pinned AIO records and 592 maintained IDs, names, aliases and scoped synonyms. Only frontier
  reference matches in Round 194-197 discovery artifacts were found. Distinct from AIMech:ConstrainedConvexPValueWeightingInMonotoneLikelihoodRatioFamilies
  (Dobriban 2018), which solves an order- and box-constrained convex ROC optimization across general monotone
  likelihood ratio families via an O(J) tridiagonal-plus-rank-1 interior-point solver; distinct from AIMech:BayesOptimalPValueWeightingUnderGaussianPrior
  (Dobriban, Fortney, Kim, & Owen 2015), which integrates over heterogeneous Gaussian prior uncertainty
  mu_i ~ N(eta_i, sigma_i^2); distinct from AIMech:OptimalMultiWeightedStepUpProcedureForFDRControl (Roquain
  & van de Wiel 2009), which optimizes multi-weighted step-up critical values for false discovery rate
  (FDR) control; and distinct from AIMech:AdaptiveDataDrivenOptimalPValueWeighting (Durand 2019), which
  adapts multi-weighted step-up FDR procedures via group-ordered isotonic optimization, whereas Roeder
  and Wasserman (2009) establish the worst-case robustness function R(xi) (Theorems 3.3-3.4, Lemma 3.5),
  the Kolmogorov-Smirnov discontinuity of optimal weights vs. least-favorable worst-case power at u_*
  = sqrt(2 c_*) (Lemma 3.6, Theorems 3.7-3.8), closed-form maximin binary external weights (Theorems 4.1-4.3),
  and sieve-principle method-of-moments grouped p-value weighting (Section 5, Equations 12-13).
