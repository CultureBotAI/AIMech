id: AIMech:ProxSkipAndScaffnewProbabilisticProximalSkippingForAcceleratedLocalGradientDescent
name: ProxSkip and Scaffnew Probabilistic Proximal Skipping for Accelerated Local Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A randomized composite first-order optimization algorithm (ProxSkip) and its federated consensus instantiation (Scaffnew) for minimizing f(x) + psi(x) where f is L-smooth and mu-strongly convex and psi is a proper closed convex function with an expensive proximity operator prox_{(gamma/p) psi}. At each step t, the algorithm forms a shifted gradient iterate x_hat_{t+1} = x_t - gamma * (nabla f(x_t) - h_t), draws theta_t ~ Bernoulli(p), evaluates x_{t+1} = prox_{(gamma/p) psi}(x_hat_{t+1} - (gamma/p) h_t) with probability p (and skips the prox via x_{t+1} = x_hat_{t+1} with probability 1 - p), and updates the control variate h_{t+1} = h_t + (p / gamma) * (x_{t+1} - x_hat_{t+1}) so h_t -> nabla f(x_*). Setting gamma = 1/L and p = 1/sqrt(kappa) (kappa = L/mu) achieves O(kappa log(1/eps)) gradient steps and O(sqrt(kappa) log(1/eps)) expected prox/communication evaluations without any data-similarity assumption.
identity_notes: Distinct from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, which uses deterministic K-step local schedules and requires O(kappa log(1/eps)) communication rounds under arbitrary heterogeneity) and from FedProx (AIMech:FedProxProximalFederatedOptimization, which adds a static proximal penalty (mu/2)||w - w^t||^2 without control variates or O(sqrt(kappa)) communication acceleration). Scaffnew is the exact consensus-splitting specialization of ProxSkip where psi is the indicator of x_1 = ... = x_n and prox_{(gamma/p) psi} reduces to exact model averaging across clients.
aliases:
- ProxSkip
- Scaffnew
- SProxSkip
- Probabilistic Proximal Skipping
