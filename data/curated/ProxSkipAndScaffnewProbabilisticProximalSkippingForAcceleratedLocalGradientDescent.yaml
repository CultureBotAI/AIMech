claims:
- claim_id: r392-firm-nonexpansiveness-and-lyapunov-contraction
  kind: mechanism
  statement: 'Using firm nonexpansiveness of P(x) = prox_{(gamma/p) psi}(x) and Q(x) = x - P(x) (Lemma 3.3: ||P(x) - P(y)||^2 + ||Q(x) - Q(y)||^2 <= ||x - y||^2), Lemmas 3.4-3.5 and Theorem 3.6 prove that the Lyapunov potential Psi_t = ||x_t - x_*||^2 + (gamma^2 / p^2)||h_t - h_*||^2 with h_* = nabla f(x_*) satisfies E[Psi_{t+1}] <= (1 - zeta) Psi_t for any 0 < gamma <= 1/L and 0 < p <= 1, where zeta = min{gamma * mu, p^2}.'
  evidence:
  - source_id: r392-primary-pdf
    locator: Section 3 Lemmas 3.3, 3.4, 3.5, Theorem 3.6, and Corollary 3.7, pp. 6-7
    relation: supports
- claim_id: r392-scaffnew-accelerated-communication-complexity
  kind: mechanism
  statement: 'When applied to the consensus reformulation min_{x_1,...,x_n} (1/n) sum_{i=1}^n f_i(x_i) + psi(x_1,...,x_n) where psi is the indicator of x_1 = ... = x_n, ProxSkip yields Scaffnew (Algorithm 2): with gamma = 1/L and communication probability p = 1/sqrt(kappa), Corollary 4.2 proves O(kappa log(1/eps)) local gradient steps and O(sqrt(kappa) log(1/eps)) expected communication rounds under arbitrary client heterogeneity, and Theorem 5.7 achieves O(sqrt(kappa / delta) log(1/eps)) decentralized mixing steps over a graph with spectral gap delta.'
  evidence:
  - source_id: r392-primary-pdf
    locator: Section 4 Algorithm 2, Theorem 4.1, Corollary 4.2, and Section 5.4 Algorithm 3 & Theorem 5.7, pp. 7-11
    relation: supports
- claim_id: r392-strong-convexity-and-stochastic-neighborhood-limitation
  kind: limitation
  statement: The O(sqrt(kappa) log(1/eps)) communication acceleration requires mu-strong convexity of f (mu > 0) and full client participation during the Bernoulli(p) synchronization rounds; under stochastic gradients with expected smoothness constants (A, B, C), SProxSkip (Theorem 5.5) converges to an O((gamma / mu) C) variance neighborhood unless step size gamma is reduced.
  evidence:
  - source_id: r392-primary-pdf
    locator: Section 3 Assumption 3.1, Section 5.3 Assumption 5.3 & Theorem 5.5, pp. 5, 9-10
    relation: supports
- claim_id: r392-federated-and-decentralized-regularized-logistic-regression
  kind: application
  statement: Applied to federated and decentralized L2-regularized logistic regression on LIBSVM datasets (w8a, mushrooms) and synthetic heterogeneous quadratic problems, empirically confirming the 1/sqrt(kappa) optimal communication probability scaling.
  evidence:
  - source_id: r392-primary-pdf
    locator: Section 6 Experiments, Figures 1-2, pp. 11-12
    relation: supports
