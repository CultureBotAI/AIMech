- target: AIO:TrainingStrategy
  relation: related_match
  rationale: The method directly controls parameter updates during neural-network training, the central
    context named by TrainingStrategy. Its pinned preprocessing genus and learning-task examples do not
    make it an optimizer superclass or equivalent identity. The mapping expresses contextual training
    relatedness without classifying CLARS as preprocessing.
limitations:
- This record follows the unsquared individual-gradient norm denominator in published Equation 5. The
  squared-norm line in Algorithm 1 and differing experimental approximations are disclosed rather than
  silently treated as identical.
- The ideal formula has no specified all-zero denominator fallback. Epsilon, clipping, decay, parameter
  grouping, excluded tensors and paired-iterate initialization require implementation-specific choices.
- The coherence ratio is not an exact variance estimator; a fresh-increment bound is not a bound on extrapolated
  momentum or a general convergence result. The stated theorems have stronger step-size and smoothness
  conditions than an arbitrary adaptive ratio.
- The author code was inspected statically at an August 22, 2020 revision. Its small-batch norm approximation,
  coupled decay, offsets, cap, parameter exclusions, non-Nesterov script setting and optional warm-up
  are not assumed identical to the 2021 paper equations or experimental configuration.
- The published experiment prose, figure labels and table captions contain discrepancies preserved in
  the discovery notes. No numerical accuracy, speed, generalization or universal no-warm-up claim is imported.
- All eight pages of the 2021 proceedings paper and selected versioned author files were read. Earlier
  arXiv full text, dissertation proofs, model implementations and complete experimental command provenance
  remain unverified. No downloaded code was executed and no model was trained.
