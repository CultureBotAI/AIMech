claims:
- claim_id: combinatorial-closed-walk-beta-sparsity-and-algebraic-stability-properties
  kind: mechanism
  statement: "To capture spectral compatibility that naive nonzero entry counting misses\u2014illustrated by p x p matrices E_1 (arrowhead/star graph) and E_2 (tridiagonal path graph) having identical nonzero counts 3p - 2 and entry values 1/sqrt(p) yet extreme eigenvalues 1 +- sqrt((p-1)/p) versus 1 + 2 cos(k pi/(p+1))/sqrt(p) (Section 2, pp. 2720-2721 / PDF pp. 4-5)\u2014Definition 1 (p. 2722 / PDF p. 6) associates to Sigma_p the adjacency matrix A_p(i, j) = 1_{sigma(i,j) != 0} and defines {Sigma_p} to be beta-sparse (0 <= beta <= 1) if the number of closed walks of even length k satisfies phi_p(k) = trace(A_p^k) <= f(k) p^{beta(k-1)+1} for all k in 2N. Beta-sparsity is invariant under variable permutations P' Sigma_p P (Section 2.2, p. 2723 / PDF p. 7), is closed under matrix addition via Lidskii eigenvalue majorization lambda^down(A_tilde_2) prec lambda^down(A_tilde_0) + lambda^down(A_1) (Fact 1, p. 2724 / PDF p. 8), is not closed under matrix multiplication or inversion (Fact 2, p.\
    \ 2725 / PDF p. 9), and satisfies the operator-norm trace bound |||M|||_2 <= |trace(M^k)|^{1/k} <= m p^{beta(1-1/k)+1/k} f(k)^{1/k} (Lemma A.1, p. 2754 / PDF p. 38) and Hadamard modulus monotonicity |||A|||_2 <= ||| |A|_Had |||_2 <= |||B|||_2 (Lemma A.2, p. 2755 / PDF p. 39)."
  evidence:
  - source_id: ek2008-betasparse-pdf
    locator: Section 2, Definitions 1-2 and Facts 1-2, pp. 2720-2725 (PDF pp. 4-9); Appendix A.3, Lemmas A.1-A.2, pp. 2754-2756 (PDF pp. 38-40)
    relation: supports
- claim_id: almost-sure-operator-norm-eigenvalue-and-eigenspace-consistency-for-beta-below-one-half
  kind: scope
  statement: When p asymp n as n -> infty and Sigma_p is beta-sparse with beta = 1/2 - eta < 1/2 (eta > 0), under finite 4k(eta)-th moments of X_{i,j} (or 8k(eta)-th moments for the sample correlation matrix) with k(eta) >= (1.5 + eps + eta)/(2 eta), Theorems 1, 2, 3, and 4 (pp. 2726-2742 / PDF pp. 10-26) prove via Holder's inequality on closed-walk weights |E(w_{gamma(2k)})| = O(n^{-k}), expected trace bounds E(trace(Xi_p^{2k})) = O(p^{1+beta(2k-1)} n^{-k}) = O(n^{1/2+eta-2k eta}) on the oracle error Xi_p = oracle(S_p) - Sigma_p, Borel-Cantelli control of false positive/negative thresholding events B_p, and Corollary 3 sparse operator-norm approximation |||Sigma_p - T_{beta+eps}(Sigma_p)|||_2 -> 0 that entrywise hard thresholding T_alpha(S_p) at level K n^{-alpha} (with alpha = beta + eps_0/2 in Theorem 4, removing any minimum nonzero signal assumption) satisfies |||T_alpha(S_p) - Sigma_p|||_2 -> 0 almost surely; by Propositions 1-2 (pp. 2735-2739 / PDF pp. 19-23) this extends to nonsparse
    matrices approximable by beta-sparse matrices (such as permuted Toeplitz matrices), and by Weyl's theorem (Fact 4, p. 2748 / PDF p. 32) and the Davis-Kahan sin(theta) theorem (Theorem 5 and Corollary 4, pp. 2748-2749 / PDF pp. 32-33) implies almost-sure consistency of all eigenvalues and canonical angles of isolated eigenspaces.
  evidence:
  - source_id: ek2008-betasparse-pdf
    locator: Sections 3.1-3.2 and 3.5, Theorems 1-5, Propositions 1-2, Corollaries 1-4, and Fact 4, pp. 2726-2742, 2748-2749 (PDF pp. 10-26, 32-33)
    relation: supports
- claim_id: sharp-oracle-inestimability-phase-transition-at-beta-one-half
  kind: scope
  statement: 'Section 3.3 and Appendix A.1 (pp. 2742-2745, 2752-2753 / PDF pp. 26-29, 36-37) prove that the sparsity threshold beta < 1/2 is sharp: for the 1/2-sparse arrowhead covariance matrix Sigma_p with 1s on the diagonal and (alpha_2, ..., alpha_p) in the first row and column (where phi_p(2k) = 2(p - 1)^k), even the oracle estimator Sigma_hat_p that knows the diagonal 1s and the exact support of nonzero entries has error matrix Sigma_p - Sigma_hat_p with characteristic polynomial p(lambda) = lambda^{p-2}(lambda^2 - sum_{i=2}^p (alpha_i - alpha_hat_i)^2) and squared spectral norm |||Sigma_hat_p - Sigma_p|||_2^2 = sum_{i=2}^p (alpha_i - alpha_hat_i)^2 converging in probability to (p - 1 + sum_{i>=2} alpha_i^2)/n >= l > 0 as p/n -> l > 0, while for alpha_i = 1/sqrt(p) the inner product between the population and oracle top eigenvectors converges in probability to <u_+, u_hat_+> -> (1/2)(1 + 1/sqrt(1 + l)) < 1.'
  evidence:
  - source_id: ek2008-betasparse-pdf
    locator: Section 3.3 and Section 3.3.1, pp. 2742-2745 (PDF pp. 26-29); Appendix A.1, pp. 2752-2753 (PDF pp. 36-37)
    relation: supports
