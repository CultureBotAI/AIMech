identity_notes: 'This is the classical finite-action probability-update learning family; LRI is one member.
  It is not a universal fixed optimizer, neural architecture, Q-learning, REINFORCE, temporal-difference
  learning, ACO, AntNet or QRouting. Fresh postmerge collection on 15 October 2026 at base a80a4e53097977b397421562fb1169aa1426dc8b
  inspected 757 maintained and 442 pinned AIO identities, including 4,789 identity-field occurrences and
  3,661 normalized values. Four fixed-string, word-boundary searches included ignored and hidden files
  in the original checkout and three discovery/recovery checkouts: 8,131, 7,634, 18,826 and 22,178 occurrences,
  grouped into 3,163 exact contents. Candidate identities had no collision; the four PSO self-matches
  were explicitly retained for enrichment. Root read 159 decoded candidate contexts (including a separately
  retained two-context key/value projection correction), all 30 normalized match fields and relevant frontier
  fields/selected full owner objects. Supporting agents assessed the disjoint candidate and two contextual
  partitions; full raw-content reconstruction is separate from semantic assessment and is not a claim
  that root read all raw containers. Existing unrelated definitions, rendered mirrors, historical report/review
  contexts and incidental substrings do not establish equivalence. The frontier has 909 main and 393 nested
  objects; only owners 243, 258, 260 and 261 change. This is bounded to the inspected pin, inventories
  and contexts, not all AI literature or saturation. Owner 261 retains its historical ACO discovery pointer.
  The Narendra–Thathachar survey supports the family and qualified LRI illustration; literal LRP formula/proof
  reconciliation and separately defined automata variants remain residual.'
