limitations:
- The record covers the source-defined relaxed greedy and relaxed sample-based variants of the named training
  method; it does not rename the reusable Gumbel-Softmax distribution or every differentiable decoder.
- Finite positive alpha smooths the feedback operator under differentiable surrounding computations. Numerical
  policies, ties, embedding degeneracy and limiting sharpness can affect gradients.
- The sampled variant remains stochastic. A derivative of its relaxed objective is not automatically an
  unbiased derivative of the discrete objective, and no universal variance-reduction bound is asserted.
- Reference-target compatibility and the relaxation-to-hard-decoding gap remain potential limitations.
  Smooth credit assignment is not a proof of a correct generative distribution or successful optimization.
- All six primary pages were read. Constructed score/embedding calculations were executed without fitting;
  no author code, model training or empirical replication was performed.
