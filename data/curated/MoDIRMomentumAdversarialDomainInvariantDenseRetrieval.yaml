claims:
- claim_id: modir-momentum-queue-domain-boundary-estimation
  kind: mechanism
  statement: Because dense retrieval embedding spaces prioritize local nearest-neighbor clusters over global class manifolds (Figure 1), single-batch domain classifier updates yield inaccurate domain boundaries; MoDIR stabilizes boundary estimation by training f(e) = softmax(W_f e) on a momentum queue Q_k of stop-gradient detached source and target embeddings from the past n batches (Equations 3-7), closing the gap between Local and Global Domain Classification Accuracy (Section 4.3, Figure 3).
  evidence:
  - source_id: r763-primary-pdf
    locator: Section 2.2 & Section 4.3, Equations 3-7, Figures 1-3, Table 2, pp. 2-4, 6-7
    relation: supports
  - source_id: r763-primary-pdf
    locator: main() verification of momentum queue domain boundary alignment vs noisy single-batch estimation
    relation: supports
- claim_id: modir-adversarial-confusion-loss-alignment
  kind: mechanism
  statement: Freezing the domain classifier f and minimizing the adversarial confusion loss L_M(x; g, f) = -1/2 (log f(g(q)) + log(1 - f(g(q))) + log f(g(d)) + log(1 - f(g(d)))) alongside the source ranking loss L_R (Equations 8-11) drives target-domain embeddings into the source-domain manifold (increasing KNN-Source% on TREC-COVID from 5.2% to 17.2% in Table 3 and Figure 4).
  evidence:
  - source_id: r763-primary-pdf
    locator: Section 2.3 & Section 4.4, Equations 8-11, Table 3, Figures 4-5, pp. 4, 7-8
    relation: supports
  - source_id: r763-primary-pdf
    locator: main() verification of confusion_loss_pair global minimum at f=0.5 and gradient step toward domain invariance
    relation: supports
- claim_id: modir-beir-zero-shot-applications
  kind: application
  statement: Evaluated across 15 zero-shot target domains from the BEIR benchmark without target relevance labels, MoDIR consistently improves over its base ANCE model, including gains on TREC-COVID (0.654 to 0.676 at 10k steps and 0.724 at 50k steps), Touche-2020 (+10.9%, 0.284 to 0.315), BioASQ (+4.6%), and Climate-FEVER (+4.0%) (Tables 1-3).
  evidence:
  - source_id: r763-primary-pdf
    locator: Section 4.1-4.4, Tables 1-3, pp. 5-7
    relation: supports
  - source_id: r763-metadata-cr
    locator: BibTeX citation record for arXiv:2110.07581
    relation: supports
- claim_id: modir-per-target-model-and-coverage-limitation
  kind: limitation
  statement: MoDIR trains a separate adapted encoder for each target domain using unlabeled target queries and documents, and its zero-shot transfer gains depend on the source domain containing overlapping information needs (failing to improve queries about novel concepts absent from the source corpus, such as 'mRNA vaccine' in Table 4).
  evidence:
  - source_id: r763-primary-pdf
    locator: Section 3 Experimental Setups & Section 4.5 Case Study, Table 4, pp. 4-5, 8-9
    relation: supports
