id: AIMech:MoDIRMomentumAdversarialDomainInvariantDenseRetrieval
name: MoDIR Momentum Adversarial Domain Invariant Representation Learning for Zero-Shot Dense Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: 'An unsupervised domain adaptation algorithm for zero-shot dense text retrieval (ZeroDR) that transfers a dual-encoder g(; theta_g) from a labeled source domain x^s = (q^s, d^s) to an unlabeled target domain x^t = (q^t, d^t) by maintaining a momentum queue Q_k = {e_{q^s}, e_{d^s}, e_{q^t}, e_{d^t} | (q^s, d^s, q^t, d^t) in B_{k-n+1:k}} of stop-gradient detached embeddings e = Phi(g(; theta_g)) across the most recent n batches (with 1:1 source-to-target and 1:1 positive-to-negative ratios) to train a linear domain classifier f(e) = softmax(W_f e) via binary cross-entropy L_D(e; f) = -log f(e) for source embeddings and -log(1 - f(e)) for target embeddings, while adversarially updating the dense retrieval encoder g with f frozen to minimize the sum of the source ranking loss and the domain confusion loss: min_{theta_g} sum_{x^{s+}, x^{s-}} L_R(r(x^{s+}), r(x^{s-})) + lambda sum_{x in {x^s, x^t}} L_M(x; g, f), where L_M(x; g, f) = -1/2 (log f(g(q)) + log(1 - f(g(q))) + log f(g(d)) + log(1 - f(g(d)))).'
identity_notes: Distinct from COCO-DR (AIMech:COCODRDenseRetrievalDistributionallyRobustContrastiveLearning), which adapts to unlabeled target corpora via implicit Continuous Contrastive Learning and queries clustered by source task without a target domain during fine-tuning; distinct from GPL (AIMech:GPLGenerativePseudoLabelingForDenseRetrieval), which generates synthetic target-domain queries and distills a cross-encoder rather than aligning source and target embedding spaces via adversarial domain confusion; and distinct from standard single-batch DANN/ADDA, which update the domain discriminator on only the current mini-batch without a multi-batch stop-gradient momentum queue Q_k and fail to capture the scattered locality of dense retrieval spaces (Table 2, Figure 3).
