id: AIMech:GradientNormClipping
name: Gradient norm clipping
aliases:
- Global gradient norm clipping
concept_kind: algorithm
definition: A gradient transformation that bounds the Euclidean norm of a chosen joint parameter-gradient
  vector by uniformly scaling it down to a positive threshold when its norm exceeds that threshold, while
  retaining smaller gradients.
identity_notes: 'Compared all 442 pinned AIO and 568 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 7, 0, 0 lines. All seven recovery matching lines
  were read and identify the preceding LARC report query and pending lead, not a maintained clipping record.
  The semantic search covered ten AIO rows and 93 native definitions: ten AIO and 91 native rows were
  verified unchanged, and the new LARC and rejection-driven independence Metropolis definitions were read.
  The latter uses a clipped proposal distribution rather than clipping a training gradient. Three complete
  AIO node/edge/generated contexts were verified unchanged from earlier full reading; ten full native
  optimization context records were read or verified unchanged. Joint Euclidean gradient clipping has
  a fixed chosen gradient-norm threshold, unlike parameter-relative LARC/LARS, CLARS mean-individual-gradient
  normalization, LAMB normalized adaptive directions and NovoGrad scalar second moments. Element-wise
  value clipping and separate per-tensor clipping are distinct transformations, so the generic phrase
  Gradient clipping is not asserted as an exact alias.'
