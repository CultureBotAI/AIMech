- source_id: pascanu2013
  locator: Section 3.2, Algorithm 1, PDF p. 6
  relation: supports
- source_id: authorcode
  locator: jobman, norm_theta and clipstyle=rescale branch
  relation: supports
claims:
- claim_id: finite-gradient-rule
  kind: mechanism
  statement: For a finite joint gradient vector g and threshold tau>0, the rule retains g when norm(g)<=tau
    and otherwise returns tau*g/norm(g). Equivalently it multiplies a nonzero g by min(1,tau/norm(g)),
    with zero explicitly retained. Algorithm 1 uses a >= comparison, which gives the same vector at a
    positive equality threshold. The resulting norm is at most tau and the direction of every nonzero
    input is preserved. These are finite-arithmetic identities; the formula does not itself repair a nonfinite
    gradient or norm overflow.
  evidence:
  - source_id: pascanu2013
    locator: Section 3.2 Algorithm 1 and following discussion, PDF p. 6; algebraic consequence
    relation: supports
- claim_id: joint-norm-versus-value-clipping
  kind: mechanism
  statement: One common multiplier is computed for the chosen joint parameter-gradient vector. The pinned
    author implementation sums squared gradients for the recurrent, input and output weight matrices and
    both bias vectors before taking one square root, then applies the same factor to all five groups.
    Independently clipping each coordinate to an interval, or independently clipping separate tensor norms,
    generally changes the joint direction and has a different norm bound. The paper separately discusses
    earlier element-wise temporal-component clipping; that is not made an exact alias of this joint rule.
  evidence:
  - source_id: pascanu2013
    locator: Sections 3.1–3.2, PDF pp. 5–6
    relation: supports
  - source_id: authorcode
    locator: jobman, norm_theta and five TT.switch rescaling assignments
    relation: supports
- claim_id: projection-and-update-bound
  kind: mechanism
  statement: As a curator algebraic interpretation, the Euclidean clipping map is the projection of the
    gradient vector onto the closed radius-tau Euclidean ball centered at zero. This projects a gradient,
    not model parameters onto a feasible parameter set. With vanilla SGD rate alpha>=0, the fresh displacement
    norm is bounded by alpha*tau. That bound does not automatically constrain a final update after momentum
    accumulation, adaptive coordinate rescaling, additional decay or other transformations.
  evidence:
  - source_id: pascanu2013
    locator: Algorithm 1, PDF p. 6; algebraic interpretation
    relation: supports
  - source_id: authorcode
    locator: train_step direct parameter updates after rescaling
    relation: supports
- claim_id: aggregation-and-stochastic-bias
  kind: limitation
  statement: 'Clipping is nonlinear: clipping an averaged gradient generally differs from averaging separately
    clipped gradients. It preserves each selected nonzero vector direction, but the expectation of clipped
    stochastic gradients need not preserve the direction of the expectation before clipping or remain
    an unbiased gradient estimator. Threshold interpretation therefore depends on the loss scale and reduction,
    selected parameter grouping and the point at which gradients are aggregated. These are algebraic consequences
    of the rule, not empirical bias estimates or a claim about every stochastic distribution.'
  evidence:
  - source_id: pascanu2013
    locator: Algorithm 1, PDF p. 6; curator aggregation counterexample
    relation: supports
  - source_id: supplement
    locator: Section 2.1, printed/PDF pp. 2–3
    relation: supports
- claim_id: author-code-order-and-rescue
  kind: limitation
  statement: The pinned historical author code optionally adds the separate soft-regularizer contribution
    to the recurrent-weight gradient before computing the joint norm. Its rescale branch uses norm_theta>cutoff.
    After ordinary rescaling, a separate emergency branch replaces the recurrent-weight gradient by 0.02
    times the recurrent matrix and sets the other four gradients to zero if the computed norm is NaN,
    infinite, negative or above 1e10. This rescue rule need not preserve the original direction or the
    clipping norm bound. It is a versioned implementation choice, not part of the ordinary finite-gradient
    clipping identity, and the file was inspected without executing Theano.
  evidence:
  - source_id: authorcode
    locator: jobman, alpha contribution, norm_theta, new_cond and subsequent assignments
    relation: supports
  - source_id: supplement
    locator: Section 2.1, printed/PDF p. 3, numerical rescue discussion
    relation: supports
- claim_id: exploding-versus-vanishing-gradient
  kind: scope
  statement: The paper motivates gradient norm clipping as a response to exploding gradients and steep
    regions of a recurrent-network objective. Its soft constraint for vanishing gradients is a separate
    regularization method in Section 3.3, not an effect supplied by clipping alone. The geometric rationale
    depends on assumptions about gradient/curvature alignment and a sufficiently wide low-error region;
    it is not a universal convergence or long-term dependency guarantee.
  evidence:
  - source_id: pascanu2013
    locator: Sections 2.3, 3.2–3.3 and conclusions, PDF pp. 4–6 and 8
    relation: supports
- claim_id: threshold-and-evaluation-scope
  kind: limitation
  statement: The threshold remains a chosen hyperparameter. The paper suggests inspecting historical gradient-norm
    statistics and reports experiments under specified initialization, minibatch-SGD and regularization
    settings. Those observations do not establish a universal threshold, eliminate all numerical instability,
    or isolate a general accuracy advantage of clipping across tasks and optimizers. This record imports
    no numerical benchmark and makes no claim of training or runtime reproduction.
  evidence:
  - source_id: pascanu2013
    locator: Section 3.2 threshold discussion and Section 4 experimental setup/results, PDF pp. 6–8
    relation: supports
  - source_id: supplement
    locator: Section 2.1, printed/PDF pp. 2–3
    relation: supports
