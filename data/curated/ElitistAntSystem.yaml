claims:
- claim_id: method
  kind: mechanism
  statement: Use the ant-cycle construction rule and calculate all current tour lengths. Retain the shortest
    tour found so far with length L_best. For each edge, update tau_new=rho*tau+sum_k Q/L_k over every
    current ant whose tour used that edge, plus e*Q/L_best if the archived best tour uses the edge. Edges
    not used by a current ant receive no corresponding current deposit, and edges outside the archived
    tour receive no extra elite deposit. Rho is retention. The parameter e is interpreted in the original
    paper as the number of additional elitist ants; it weights an extra contribution without requiring
    those fictitious ants to construct new tours. A current best tour can receive both its ordinary all-ant
    contribution and the archive term. Repeat construction and reinforcement with declared parameters
    and stopping.
