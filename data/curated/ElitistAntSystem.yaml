name: Elitist Ant System
definition: An Ant System variant that retains the standard all-ant pheromone deposits and adds extra
  reinforcement to edges of the best-so-far tour after each construction cycle.
concept_kind: algorithm
identity_notes: The defining change is active extra reinforcement of the best-so-far tour, beyond merely
  remembering or returning it. The original Ant System paper describes the elitist strategy and the 1997
  rank-based study names it ASelite with an explicit equation. It differs from rank selection, which can
  omit lower-ranked current contributions, and from single-best-only updates. Zero elite weight recovers
  the base update as a limiting configuration. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 291 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 61 and 71 lines respectively. Text
  hits were prior candidate leads, citations to a reused Ant System source, neighboring mechanism distinctions,
  saved review/report material, and unrelated PBIL strings in ignored HOGENOM prefix-map URLs. Eight exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The method assumes valid positive-cost tours and well-defined inverse-distance construction weights.
  Extra elite reinforcement biases future sampling; it does not force future ants to take the archived
  tour or guarantee that its edges are globally optimal.
- The original study explicitly reports premature concentration when elite reinforcement is too strong
  in its tested setting. A favorable elite count on one TSP instance is not a universal parameter recommendation
  or a convergence theorem.
- This mechanism is not the same as copying a best chromosome unchanged into a genetic population, nor
  merely storing a best-so-far output. It retains every ant’s ordinary deposit; rank-based selection can
  truncate current contributions and single-best-only reinforcement omits the all-ant term.
- Initialization, nonnegative elite weight, heuristic exponents, tour ties, constraints, randomization,
  stopping and floating-point behavior require a declared implementation. No benchmark outcome or universal
  superiority is curated.
