claims:
- claim_id: r417-unbiased-ternary-rounding-and-infinity-l1-variance-identity
  kind: mechanism
  statement: Conditioned on g_t, TernGrad satisfies E[g_tilde_{tk} | g_t] = s_t sign(g_{tk}) (|g_{tk}| / s_t) = g_{tk} and coordinate second moment E[g_tilde_{tk}^2 | g_t] = s_t |g_{tk}| = ||g_t||_infty |g_{tk}|, yielding total quantization variance E[||g_tilde_t - g_t||_2^2 | g_t] = ||g_t||_infty ||g_t||_1 - ||g_t||_2^2 and almost-sure convergence under light-tailed bounded-variance assumptions (Section 4, Theorem 1).
  evidence:
  - source_id: r417-primary-pdf
    locator: Section 3.1 Ternary Quantization (Eqs. 4-6) & Section 4 Convergence Analysis (Assumption 3, Theorem 1, Appendix A)
    relation: supports
- claim_id: r417-layer-wise-quantization-and-sigma-gradient-clipping-variance-reduction
  kind: mechanism
  statement: Replacing a single model-wide scalar s_t = ||g_t||_infty with per-layer scalars s_t^{(l)} = ||g_t^{(l)}||_infty (Section 3.2) and clipping coordinate outliers to [-c sigma_t, +c sigma_t] with c = 2.5 before quantization (Section 3.3, Eq. 7) shrinks the maximum scalar s_t and reduces the variance inflation factor kappa = max(|g_t|) / |g_t| across heterogeneous network layers.
  evidence:
  - source_id: r417-primary-pdf
    locator: Section 3.2 Layer-wise Ternarizing & Section 3.3 Gradient Clipping (Eq. 7, Figures 2-3), pp. 1512-1514
    relation: supports
- claim_id: r417-parameter-localization-for-unshared-random-seeds-and-clipping-bias-limitation
  kind: limitation
  statement: In parameter-server topologies where parameters are evenly sharded across workers, sharing a random seed for b_t allows floating-point scalars s_t to be omitted during worker-to-server push only if each parameter tensor is localized to a single server shard (Section 3.1); additionally, pre-quantization gradient clipping introduces a small truncation bias when |g_{tk}| > c sigma_t.
  evidence:
  - source_id: r417-primary-pdf
    locator: Section 3.1 Parameter Localization & Section 3.3 Gradient Clipping
    relation: supports
- claim_id: r417-alexnet-googlenet-and-vgg-imagenet-distributed-training-application
  kind: application
  statement: Applied to distributed synchronous SGD training of LeNet, CifarNet, AlexNet, GoogLeNet, and VGG-A on MNIST, CIFAR-10, and ImageNet, achieving 3.04x communication speedup without accuracy loss.
  evidence:
  - source_id: r417-primary-pdf
    locator: Section 5 Experiments (Tables 1-3, Figures 4-6), pp. 1515-1518
    relation: supports
