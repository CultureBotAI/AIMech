id: AIMech:TernGradTernaryGradientsForDistributedDeepLearning
name: TernGrad (Stochastic Ternary Gradient Quantization for Distributed Deep Learning)
concept_kind: algorithm
review_status: DRAFT
definition: An unbiased stochastic ternary gradient quantization scheme for distributed synchronous SGD (Wen et al. 2017, Section 3, Equations 4-7) that compresses each worker's gradient vector g_t into ternary levels {-1, 0, +1} scaled by s_t = max_k |g_{tk}| = ||g_t||_infty via g_tilde_t = s_t * sign(g_t) o b_t where each coordinate Bernoulli mask b_{tk} in {0, 1} is sampled independently with probability P(b_{tk} = 1 | g_t) = |g_{tk}| / s_t, combined with layer-wise scalars and coordinate clipping |g_{tk}| <= c * sigma_t to bound the maximum magnitude s_t.
identity_notes: Distinct from deterministic sign-based compression SignSGD (AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization, Bernstein et al. 2018), which maps coordinates deterministically to {-1, +1} without zero level or unbiased probabilistic rounding, and from multi-level L2-norm quantized SGD QSGD (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding, Alistarh et al. 2017), which normalizes by the Euclidean norm ||g_t||_2 rather than the infinity norm s_t = ||g_t||_infty with layer-wise sigma-clipping.
aliases:
