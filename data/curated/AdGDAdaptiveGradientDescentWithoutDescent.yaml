id: AIMech:AdGDAdaptiveGradientDescentWithoutDescent
name: AdGD (Adaptive Gradient Descent without Descent)
concept_kind: algorithm
review_status: DRAFT
definition: "A line-search-free, function-value-free adaptive gradient descent algorithm (Algorithm 1) that updates iterates via x^{k+1} = x^k - lambda_k nabla f(x^k) using a step size governed by two rules \u2014 bounded growth lambda_k <= sqrt(1 + theta_{k-1}) lambda_{k-1} (or sqrt(1 + theta_{k-1}/2) lambda_{k-1}) where theta_k = lambda_k / lambda_{k-1}, and inverse local curvature bounding lambda_k <= ||x^k - x^{k-1}|| / (2 ||nabla f(x^k) - nabla f(x^{k-1})||) \u2014 guaranteeing global convergence on any convex function with locally Lipschitz gradients without enforcing monotonic decrease of f(x^k)."
identity_notes: Distinct from backtracking line search (Armijo/Goldstein) in that AdGD never evaluates f(x) or backtracks with extra gradient evaluations per step. Distinct from Polyak's step size in that it requires no knowledge or estimate of f_*. Distinct from the Barzilai-Borwein method in that AdGD caps step-size growth by sqrt(1 + theta_{k-1}) lambda_{k-1} and uses the l2 ratio ||x^k - x^{k-1}|| / (2 ||nabla f(x^k) - nabla f(x^{k-1})||), providing provable convergence for arbitrary locally smooth convex functions where Barzilai-Borwein can diverge.
aliases:
