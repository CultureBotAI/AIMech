claims:
- claim_id: c-r595-two-step-lyapunov-without-descent-and-local-lipschitz-rate
  kind: mechanism
  statement: Without requiring global smoothness L < infinity or monotonic objective descent f(x^{k+1}) <= f(x^k), AdGD (Algorithm 1) decreases the two-step Lyapunov energy ||x^{k+1} - x^*||^2 + (1/2)||x^{k+1} - x^k||^2 + 2 lambda_k (1 + theta_k)(f(x^k) - f_*) at every iteration (Lemma 1, Eq. 5), ensuring bounded iterates, convergence x^k -> x^*, and an ergodic rate f(x_hat^k) - f_* <= D / (2 S_k) = O(1/k) depending only on the local Lipschitz constant L over conv{x^*, x^0, x^1, ...} (Theorem 1).
  evidence:
  - source_id: r595-primary-pdf
    locator: Section 2.2, Lemma 1, Eq. (5) & Theorem 1, Eq. (11), pp. 4-6; Appendix Section 6, pp. 15-16
    relation: supports
- claim_id: c-r595-locally-strongly-convex-linear-rate-and-extensions
  kind: mechanism
  statement: When f is locally strongly convex and locally smooth on conv{x^*, x^0, x^1, ...} with local condition number kappa = L / mu, replacing sqrt(1 + theta_{k-1}) by sqrt(1 + theta_{k-1}/2) yields linear energy contraction Psi^{k+1} <= (1 - 1/(4 kappa)) Psi^k and O(kappa log(1/epsilon)) iteration complexity (Theorem 2, Eq. 16), while dual-space curvature estimation Lambda_k = min{sqrt(1 + Theta_{k-1}/2) Lambda_{k-1}, ||nabla f(x^k) - nabla f(x^{k-1})|| / (2 ||x^k - x^{k-1}||)} yields the Nesterov-accelerated heuristic AdGD-accel (Algorithm 2).
  evidence:
  - source_id: r595-primary-pdf
    locator: Section 2.3, Theorem 2 & Algorithm 2, pp. 7-8; Appendix Section 6, Eq. (16), p. 16
    relation: supports
- claim_id: c-r595-stochastic-adsgd-and-empirical-performance
  kind: application
  statement: In the stochastic setting (Algorithm 3, AdSGD), estimating L_k = ||nabla f_{xi^k}(x^k) - nabla f_{xi^k}(x^{k-1})|| / ||x^k - x^{k-1}|| achieves O((kappa^2 / epsilon) log(kappa / epsilon)) complexity with an independent curvature sample and O(kappa^2 log(1/epsilon)) on overparameterized models (Theorem 3, Theorems 6-7), outperforming GD, Nesterov AGD, Armijo line search, and Barzilai-Borwein on logistic regression, cubic regularization, and matrix factorization, and exceeding tuned SGD test accuracy on CIFAR-10 ResNet-18 and DenseNet-121.
  evidence:
  - source_id: r595-primary-pdf
    locator: Section 3.2, Theorem 3 & Algorithm 3, pp. 8-9; Section 4, Figures 1-6, pp. 9-12; Appendix Section 8, Theorems 6-7, pp. 20-22
    relation: supports
- claim_id: c-r595-nonconvex-composite-and-kappa2-stochastic-limitations
  kind: limitation
  statement: AdGD's two-step Lyapunov proof does not directly extend to general nonconvex objectives or proximal composite minimization, and its stochastic complexity bound incurs an extra factor of kappa (O(kappa^2) vs O(kappa)), while neural network training exhibits noisy early-stage progress during the first 75 epochs and plummeting step sizes once training loss becomes small.
  evidence:
  - source_id: r595-primary-pdf
    locator: Section 3.2, p. 9; Section 4-5, Perspectives 1, 3, & 4, pp. 11-12
    relation: supports
