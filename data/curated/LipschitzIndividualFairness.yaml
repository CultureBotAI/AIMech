name: Lipschitz individual fairness
definition: An individual-fairness criterion requiring the distance between the output distributions assigned
  by a randomized classifier to any two individuals to be no greater than their task-specific similarity
  distance.
concept_kind: evaluation_criterion
identity_notes: The record is the explicit (D,d)-Lipschitz condition in Dwork and colleagues' framework.
  It is narrower than every possible notion of individual fairness and separate from their loss-minimizing
  linear-program construction, metric-learning algorithms, differential privacy and group parity. Identity
  assessment covered 442 AIO labels/scoped synonyms, 94 preceding native identities and ignored-inclusive
  searches of both checkouts.
limitations:
- The task-specific distance and output-distance choice determine the constraint. The framework does not
  certify that a chosen similarity metric represents an appropriate social or domain judgment.
- A constant output distribution satisfies the condition; useful predictions require a separate utility
  objective. Criterion satisfaction alone does not guarantee predictive quality.
- The formulation over an inspected finite population does not itself guarantee generalization to unobserved
  individuals. Group-parity implications require additional conditions on the metric and group distributions.
- This record does not equate the criterion with all individual-fairness notions, certify the paper's
  full optimization/theorem results, or assert legal compliance.
aliases:
