claims:
- claim_id: criterion-scope
  kind: scope
  statement: Given a mapping M from individuals to distributions over outcomes, an externally specified
    task distance d and an output-distribution distance D, require D(M(x),M(y)) <= d(x,y) for every compared
    pair. The criterion constrains permissible mappings; choosing among them requires a separate utility
    objective. The paper studies total-variation and relative-l-infinity output distances as particular
    choices.
