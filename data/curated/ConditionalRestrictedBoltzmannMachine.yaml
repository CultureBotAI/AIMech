claims:
- claim_id: method
  kind: mechanism
  statement: Hold conditioning vector u fixed. In the paper’s binary affine-bias specialization, set a(u)=b_v+(W_uv)^T
    u and c(u)=b_h+(W_uh)^T u, with visible-by-hidden interaction matrix W_vh. Define E(v,h;u)=-v^T W_vh
    h-a(u)^T v-c(u)^T h. Marginalizing binary h gives F(v,u)=-a(u)^T v-sum_j log(1+exp(c_j(u)+(W_vh^T
    v)_j)). Normalize exp(-F(v,u)) over output configurations v to obtain p(v|u), with a partition depending
    on u. Hidden units given v,u and visible units given h,u have factorial logistic conditionals, but
    outputs after hidden marginalization can be dependent. Conditional likelihood gradients contrast data-posterior
    and model expectations at the same u. The paper discusses finite CD as an approximation and separate
    alternatives for restricted output support or prediction-based training. Prediction may seek the joint
    conditional mode or coordinate-wise marginal modes according to the loss; those are different decisions.
