name: Conditional restricted Boltzmann machine
definition: A conditional neural probability model that represents an output vector with an RBM whose
  biases or interactions are determined by a supplied conditioning vector.
concept_kind: architecture
identity_notes: 'This is the general input-conditioned RBM family described by Mnih, Larochelle and Hinton,
  with their affine-bias binary formulation as the explicitly curated mechanism. The conditioning vector
  need not be temporal history. Autoregressive CRBM fixes it to earlier frames and RNN-RBM derives it
  from a recurrent state; these are narrower constructions, not aliases for the entire family. HashCRBM
  and CD-PercLoss are separate training or prediction constructions and do not define every conditional
  RBM. All 442 pinned AIO labels/scoped synonyms and 364 preceding native IDs/names/aliases were compared,
  with no normalized identity match. Full-checkout fixed-string searches included ignored and hidden files
  in both worktree and main, returning 129 lines each. All 91 unique matched contents were read, including
  58 initial contents and 33 additional saved-review contents: prior model contrasts, evidence references
  and discovery leads, rather than existing candidate identities. All 52 semantic label/synonym hits and
  22 exact annotated AIO nodes were inspected, alongside corresponding generated records and four complete
  native neighbors. Previously read contextual files were checked for byte identity. Absence is bounded
  to this snapshot and inspected neighborhood.'
limitations:
- The model specifies p(v|u), not the input marginal p(u). Normalizing outputs for one conditioning vector
  does not supply a shared partition for every other input or a joint model over arbitrary inputs.
- Factorial block conditionals do not make the output marginal factorial or its partition, joint mode
  and coordinate marginals generally tractable. Tiny output spaces or deliberately restricted support
  are special cases.
- A small data-started CD update can reflect poor mixing near the observed output rather than accurate
  predictions from u alone. Finite CD is not generally the exact conditional likelihood gradient or the
  gradient of a single fixed objective.
- Persistent samples from one conditioning input cannot simply be treated as equilibrium samples for another.
  The paper’s discussion of persistent-chain impracticality is scoped to its input-specific distributions
  and training setting; it is not a proof that every conditional persistent method is impossible.
- The general family can condition biases or interactions, while the displayed mechanism holds W_vh fixed
  and changes biases affinely. Gaussian outputs, input-dependent interactions, retrieved-support HashCRBM
  and perceptron-style training need separate conventions. No historical-priority, universal prediction-quality
  or author-code claim is asserted.
