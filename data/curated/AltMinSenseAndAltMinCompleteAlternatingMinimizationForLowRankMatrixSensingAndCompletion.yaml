claims:
- claim_id: claim-perturbed-power-method-identity-and-rip-geometric-contraction-for-altminsense
  kind: mechanism
  statement: "For rank-$k$ matrix sensing $\\mathcal{A}(M) = b$, the exact least-squares update $\\widehat{V}^{t+1} = \\arg\\min_V \\|\\mathcal{A}(U^t V^\\top) - b\\|_2^2$ obeys the perturbed power identity $\\widehat{V}^{t+1} = V^*\\Sigma^*(U^*)^\\top U^t - B^{-1}((U^t)^\\top U^* B - C)V^*\\Sigma^*$ (Equations 4 and 6), where $B$ and $C$ are $n k \\times n k$ block operators formed from $A_i^\\top U^t$ and $A_i^\\top U^*$; under $(2k,\\delta_{2k})$-RIP with $\\delta_{2k} < \\sigma_k^*/(100 k \\sigma_1^*)$, Lemmas 4.3\u20134.4 and Theorem 4.2 prove $\\|B^{-1}((U^t)^\\top U^* B - C)V^*\\Sigma^*\\|_2 \\le \\frac{\\delta_{2k}\\sqrt{k}\\sigma_1^*}{1-\\delta_{2k}} \\mathrm{dist}(U^t,U^*)$, yielding geometric subspace contraction $\\mathrm{dist}(V^{t+1}, V^*) \\le \\frac{1}{2}\\mathrm{dist}(U^t, U^*)$ and $\\epsilon$-recovery in $O(\\log(1/\\epsilon))$ steps (Theorem 2.2)."
  evidence:
  - source_id: jns2013-altmin-pdf
    locator: Section 2.1, Algorithm 1 & Theorem 2.2, pp. 4-5; Section 3-4.2, Equation (4), Equation (6), Theorem 4.2, & Lemmas 4.3-4.4, pp. 7-11
    relation: supports
  - source_id: jns2013-altmin-abs
    locator: Abstract
    relation: supports
- claim_id: claim-incoherence-preserving-clipping-and-altmincomplete-sample-complexity
  kind: mechanism
  statement: For rank-$k$ $\mu$-incoherent matrix completion (Definition 2.3), Algorithm 3 (*AltMinComplete*) initializes $U^0$ by zeroing entries of the top-$k$ singular vectors of $\frac{1}{p}P_{\Omega_0}(M)$ exceeding $\frac{2\mu\sqrt{k}}{\sqrt{m}}$ in magnitude and re-orthonormalizing; Lemma C.2 proves this clipping produces a $4\mu\sqrt{k}$-incoherent subspace within distance $1/2$ of $U^*$, and Theorem 2.5 (via Lemma 5.3) proves that alternating least squares across $2T+1$ independent sample partitions with total sample complexity $|\Omega| = O((\sigma_1^*/\sigma_k^*)^4 \mu^2 k^{4.5} n \log n \log(k\|M\|_F/\epsilon))$ preserves iterate incoherence and contracts $\mathrm{dist}(U^t,U^*) \le (1/2)^t$.
  evidence:
  - source_id: jns2013-altmin-pdf
    locator: Section 2.2, Definition 2.3, Algorithm 3, & Theorem 2.5, pp. 5-7; Section 5.1, Lemmas 5.1-5.4, pp. 11-12; Appendix C, pp. 23-35
    relation: supports
  - source_id: jns2013-altmin-cr
    locator: STOC 2013 proceedings metadata pp. 665-674
    relation: supports
- claim_id: claim-scope-inductive-stagewise-altmin-reduces-condition-number-dependence
  kind: scope
  statement: Algorithms 2 and 4 (*Stage-AltMinSense* and *Stage-AltMinComplete*) apply alternating minimization inductively in $r \le k$ stages with threshold singular-value gaps $\sigma_{i_s}^* > 4 k \sigma_{i_s+1}^*$, eliminating the $(\sigma_1^*/\sigma_k^*)^2$ factor from the RIP constant of matrix sensing (Theorem 2.3) and reducing the condition-number dependence of matrix completion from $(\sigma_1^*/\sigma_k^*)^4$ to $(\sigma_1^*/\sigma_k^*)^2$ (Theorem 2.6).
  evidence:
  - source_id: jns2013-altmin-pdf
    locator: Section 2.1-2.2, Algorithms 2 & 4, Theorems 2.3 & 2.6, pp. 5-7; Section 4.3 & 5.2, pp. 11-12
    relation: supports
- claim_id: claim-limitation-sample-splitting-across-iterations-and-spectral-basin-requirement
  kind: limitation
  statement: The theoretical convergence analysis of AltMinComplete partitions $\Omega$ into $2T+1$ independent subsets of size $\Omega(n\log n \log(1/\epsilon))$ to decouple $U^t$ from $\Omega_{2t+1}$, and requires an initial subspace $U^0$ with non-singular projection $(U^*)^\top U^0$ inside the contraction basin $\mathrm{dist}(U^0, U^*) < 1/2$.
  evidence:
  - source_id: jns2013-altmin-pdf
    locator: Section 2.2, Algorithm 3 & Theorem 2.5, pp. 6-7; Section 3, Equation (4), p. 8
    relation: supports
