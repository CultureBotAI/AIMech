claims:
- claim_id: r402-smoothed-weiszfeld-surrogate-convergence-and-secure-aggregation-privacy
  kind: mechanism
  statement: Algorithm 2 derives the Smoothed Weiszfeld update as exact alternating minimization of the jointly convex surrogate G(v, eta) = (1/2) sum_{i=1}^m alpha_i (||v - w_i||_2^2 / eta_i + eta_i) over v in R^d and eta_i >= nu, with Proposition 2 proving O(1 / (nu_bar R)) convergence to the geometric median objective and Proposition 3 bounding each device's normalized weight beta_i^{(r)} / sum_j beta_j^{(r)} <= (1 + (m - 1) nu_bar / B)^{-1} across R linear Secure Average oracle calls.
  evidence:
  - source_id: r402-primary-pdf
    locator: Section IV The RFA Algorithm and Convergence (Algorithm 2, Propositions 2 and 3), pp. 1144-1146
    relation: supports
- claim_id: r402-corruption-tolerance-up-to-half-and-heterogeneous-local-sgd-convergence
  kind: mechanism
  statement: For corruption level rho < 1/2 (measuring the total weight of corrupted devices), Theorem 4 proves that RFA with tail-averaged local SGD on strongly convex least-squares objectives achieves linear convergence in communication rounds T up to a neighborhood controlled by geometric median tolerance epsilon^2 / m^2, local SGD noise sigma^2 / N_0, and bounded input/output heterogeneity Omega^2 = Omega_X^2 * Omega_{Y|X}^2, amplified by (1 - 2*rho)^{-2} (or (1 - 2*rho)^{-4} when rho > 1/3).
  evidence:
  - source_id: r402-primary-pdf
    locator: Section IV-A Convergence Analysis (Assumptions 1-3, Theorem 4, Corollary 5), pp. 1146-1148
    relation: supports
- claim_id: r402-r-round-secure-average-communication-overhead-and-heterogeneity-amplification-limitation
  kind: limitation
  statement: Executing R steps of the Smoothed Weiszfeld algorithm increases per-round communication and cryptographic Secure Average invocations by a factor of R (unless approximated by One-Step RFA with R = 1), and the heterogeneity neighborhood in Theorem 4 scales with (1 - 2*rho)^{-4} as the corruption fraction rho approaches the 1/2 breakdown point.
  evidence:
  - source_id: r402-primary-pdf
    locator: Section IV Proposition 3, Section IV-A Theorem 4, and Section IV-B Practical Extensions (Algorithms 3-4), pp. 1145-1148
    relation: supports
- claim_id: r402-femnist-sent140-and-shakespeare-corruption-defense-application
  kind: application
  statement: Evaluated on federated character recognition (EMNIST), sentiment analysis (Sent140), and character-level language modeling (Shakespeare) under data poisoning, label flipping, and omniscient parameter corruption up to rho < 1/2, outperforming FedAvg and Coordinate-wise Median with 3 steps of Smoothed Weiszfeld or One-Step RFA.
  evidence:
  - source_id: r402-primary-pdf
    locator: Section V Numerical Experiments (Figures 2-6, Table I), pp. 1148-1152
    relation: supports
