id: AIMech:RfaRobustFederatedAggregationSmoothedWeiszfeldGeometricMedian
name: RFA Robust Federated Aggregation via Smoothed Weiszfeld Geometric Median
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-robust and secure-aggregation-compatible federated learning algorithm (RFA, Algorithm 1) that replaces the weighted arithmetic mean in FedAvg with an approximate weighted l_2 geometric median (GM) argmin_{v in R^d} sum_{i in S_t} alpha_i ||v - w_i^{(t)}||_2 computed via R steps of the Smoothed Weiszfeld algorithm (Algorithm 2). At each inner iteration r = 0,...,R-1, the server and clients execute a linear Secure Average oracle call to form v^{(r+1)} = (sum_{i in S_t} beta_i^{(r)} w_i^{(t)}) / (sum_{i in S_t} beta_i^{(r)}) with smoothed inverse-distance weights beta_i^{(r)} = alpha_i / max(nu, ||v^{(r)} - w_i^{(t)}||_2) for smoothing parameter nu > 0, alongside communication-reduced One-Step RFA (R = 1, Algorithm 3) and Personalized RFA (Algorithm 4).
identity_notes: Distinct from Coordinate-wise Median and Trimmed Mean (AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustDistributedLearning, which compute coordinate-separable l_1 medians or trimmed means that cannot be implemented via a small number of linear Secure Aggregation sum queries and lack rotation equivariance) and from Krum (AIMech:KrumAndMultiKrumByzantineTolerantGradientDescent, which requires server inspection of all O(m^2) pairwise client model distances, incompatible with cryptographic Secure Average oracles).
aliases:
- RFA
- Robust Federated Aggregation
- Smoothed Weiszfeld Geometric Median Federated Aggregation
- One-Step RFA
