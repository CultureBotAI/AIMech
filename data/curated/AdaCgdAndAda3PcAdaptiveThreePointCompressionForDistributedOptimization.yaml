id: AIMech:AdaCgdAndAda3PcAdaptiveThreePointCompressionForDistributedOptimization
name: AdaCGD and Ada3PC Adaptive Three-Point Compression for Distributed Optimization
concept_kind: algorithm
review_status: DRAFT
definition: "An adaptive communication compression framework and family of distributed optimization methods introduced by Makarenko, Gasanov, Islamov, Sadiev, and Richt\xE1rik (2022) that dynamically select the compression operator or compression level at every iteration and worker. Given a bank of m Three Point Compressors (3PC) {C_{h,y}^j}_{j=1}^m with parameters {(A_j, B_j)}_{j=1}^m and arbitrary user-specified trigger predicates {P_j(h, y, x)}_{j=1}^{m-1}, the Adaptive Three Point Compressor (Ada3PC, Definition 3) selects C_{h,y}^{ad}(x) = C_{h,y}^j(x) for the first index j where P_j(h, y, x) holds (or C_{h,y}^m(x) otherwise), and Adaptive Compressed Gradient Descent (AdaCGD, Definition 4) instantiates Ada3PC with m sorted EF21 contractive compressors (alpha_1 <= ... <= alpha_m) and lazy relative-variation predicates ||x - C_{h,y}^{EF,j}(x)||^2 <= zeta ||x - y||^2 to adaptively adjust the transmitted message size."
identity_notes: "Distinct from fixed-parameter Three Point Compressors (3PC, Richt\xE1rik et al. 2022, which use a single static 3PC operator or a single binary lazy-aggregation threshold) and distinct from heuristic adaptive gradient compression schemes lacking error-feedback convergence guarantees: Ada3PC proves closure of the 3PC class under arbitrary data-dependent switching among m distinct 3PC compressors with worst-case constants A_min = min_j A_j and B_max = max_j B_j (Lemma 2), and further extends 3PC to convex objectives (Theorem 5) and bidirectional server-and-worker 3PC compression (3PC-BD, Algorithm 2, Theorem 6)."
aliases:
- Ada3PC
- AdaCGD
- 3PC-BD
- Adaptive Three Point Compressor
- Adaptive Compressed Gradient Descent
