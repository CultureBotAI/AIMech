claims:
- claim_id: ada3pc-closure-under-arbitrary-predicate-switching
  kind: mechanism
  statement: Given m Three Point Compressors {C_{h,y}^j}_{j=1}^m satisfying E[||C_{h,y}^j(x) - x||^2] <= (1 - A_j)||h - y||^2 + B_j||x - y||^2 with A_j in (0, 1] and B_j >= 0, Lemma 2 proves that the adaptive selector C_{h,y}^{ad}(x) (Definition 3) is itself a valid Three Point Compressor for any choice of switching predicates {P_j(h, y, x)}_{j=1}^{m-1}, with parameters A_min = min_{j in [m]} A_j and B_max = max_{j in [m]} B_j.
  evidence:
  - source_id: r568-primary-pdf
    locator: Section 4, Definition 3 & Lemma 2, p. 5; Appendix B.2, Proof of Lemma 2, p. 16
    relation: supports
- claim_id: adacgd-multi-level-ef21-lazy-variation-trigger-design
  kind: mechanism
  statement: AdaCGD (Definition 4) orders m contractive compressors {C_j}_{j=1}^m by increasing contractivity 0 < alpha_1 <= alpha_2 <= ... <= alpha_m <= 1, wraps each into an EF21 compressor C_{h,y}^{EF,j}(x) = h + C_j(x - h), first tests the zero-communication skip condition ||x - h||^2 <= zeta ||x - y||^2, and otherwise selects the most aggressive (smallest j) compressor satisfying ||x - C_{h,y}^{EF,j}(x)||^2 <= zeta ||x - y||^2 (defaulting to C_{h,y}^{EF,m}(x) if none satisfies the threshold), which by Corollary 1 is a 3PC compressor with A_min = 1 - sqrt(1 - alpha_1) and B_max = max(zeta, (1 - alpha_1)/(1 - sqrt(1 - alpha_1))).
  evidence:
  - source_id: r568-primary-pdf
    locator: Section 4, Definition 4 & Corollary 1, pp. 5-6
    relation: supports
- claim_id: three-pc-convex-and-bidirectional-nonconvex-convergence-theorems
  kind: scope
  statement: Theorem 5 establishes the first general convex convergence rate E[f(x^T) - f(x*)] = O(1/T) for 3PC methods under L_i-smooth convex functions with step size gamma in (0, 1/(L + L_max sqrt(B/A))), while Algorithm 2 (3PC-BD) applies 3PC compressors C^w on workers (A_w, B_w) and C^M on the master broadcast (A_M, B_M), achieving O(1/T) nonconvex stationarity E[||nabla f(hat{x}^T)||^2] = O(1/T) under Theorem 6.
  evidence:
  - source_id: r568-primary-pdf
    locator: Section 5.1, Theorem 5, p. 7; Section 5.2, Algorithm 2 (3PC-BD) & Theorem 6, pp. 8-9
    relation: supports
- claim_id: adacgd-trial-compression-overhead-and-worst-case-step-size-limitation
  kind: limitation
  statement: Evaluating the AdaCGD trigger condition ||x - C_{h,y}^{EF,j}(x)||^2 <= zeta ||x - y||^2 requires computing candidate compressed vectors across up to m compression levels locally on each worker (though for Top-k families a single coordinate-magnitude sort suffices for all k_1 < ... < k_m), and the theoretical step-size bound in Lemma 2 depends on the worst-case constants A_min = min_j A_j and B_max = max_j B_j across the compressor bank.
  evidence:
  - source_id: r568-primary-pdf
    locator: Section 4, Lemma 2, Corollary 1 & discussion of Top-k / Sparsified-k implementation, pp. 5-6
    relation: supports
