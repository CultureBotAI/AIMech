  rationale: 1-bit LAMB is a large-batch communication-compressed adaptive optimizer for distributed pre-training of deep transformer neural networks.
limitations:
- Introduces additional GPU memory overhead during the compression stage because each worker must store one persistent copy of the fresh variance v_t^{(l)} and one temporary copy of the previous step's compressed momentum m_{t-1}^{(l)} to reconstruct global gradients.
- Requires an uncompressed LAMB warmup phase (e.g., 16.7% of steps for sequence length 128 and 19.3% of steps for sequence length 512) until LAMB's layerwise scaling coefficients reach a stable plateau.
- Requires PyTorch distributed with NCCL >= v2.7 (for Alltoall support) or an MPI-based collective backend to execute the three-phase compressed allreduce.
