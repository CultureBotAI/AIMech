id: AIMech:OneBitLambAdaptiveLayerwiseCompressedTraining
name: 1-bit LAMB (Error-Compensated LAMB-Preconditioned Large-Batch Compressed Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A two-stage communication-efficient large-batch distributed optimization algorithm that runs uncompressed LAMB for T_w warmup steps while tracking an exponential moving average c_avg^{(l)} = beta_3 c_avg^{(l)} + (1 - beta_3) c_t^{(l)} of each layer's trust-ratio scaling coefficient and storing the warmup-end variance v_{T_w}^{(l)} as a frozen preconditioner, then transitions to two-pass error-compensated 1-bit momentum compression where each worker reconstructs the global layerwise gradient g_t^{(l)} = (m_t^{(l)} - beta_1 m_{t-1}^{(l)}) / (1 - beta_1) from compressed momentum to update a fresh variance estimate v_t^{(l)} and scales the frozen-preconditioned layer update by c_t^{(l)} = r_t^{(l)} c_avg^{(l)} using the double-clipped infinity-norm ratio r_t^{(l)} = clip(clip(||v_{T_w}^{(l)} / v_t^{(l)}||_inf, (1 - r_threshold) r_{t-1}^{(l)}, (1 + r_threshold) r_{t-1}^{(l)}), r_min, r_max).
identity_notes: Distinct from uncompressed LAMB (AIMech:LAMBLayerwiseAdaptiveMomentsBatchOptimization, You et al. 2020), which requires full-precision gradient allreduce and up-to-date uncompressed momentum and variance to compute layerwise trust ratios c_t^{(l)} = clip(||x_{t-1}^{(l)}|| / ||u_t^{(l)}||, c_min, c_max). Distinct from 1-bit Adam (AIMech:OneBitAdamErrorCompensatedPreconditionedMomentum, Tang et al. 2021), which freezes variance globally without layerwise scaling or fresh-variance tracking and suffers convergence degradation at large batch sizes (16K-64K), and from naive 'LAMB + basic 1-bit' (Section 3.4), which freezes both variance and c_t^{(l)} and degrades accuracy because LAMB's per-layer variance norms decay by up to two orders of magnitude during training.
aliases:
- 1-bit LAMB
- One-Bit LAMB
- 1-bit LAMB Optimizer
- Error-Compensated LAMB-Preconditioned Momentum SGD
