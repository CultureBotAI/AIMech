id: AIMech:ForkConvexExchangeabilityTestingBySafeEProcesses
name: Fork-convex exchangeability testing via universal safe e-processes
aliases:
- Fork-Convex Hull Characterization of Composite Test Supermartingales
- Jeffreys'-Mixture Universal-Inference Safe E-Process for Exchangeability
- Context-Tree Krichevsky-Trofimov Exchangeability E-Processes
- Running-Maximum Adjuster E-Processes for Exchangeability Testing
concept_kind: mathematical_method
definition: 'A sequential hypothesis testing and game-theoretic probability framework (Ramdas, Ruf, Larsson,
  & Koolen 2022, International Journal of Approximate Reasoning 141:83-109, arXiv:2102.00630) for testing
  whether an observed data stream X_1, X_2, ... is exchangeable (H_0: bar{Q} = convex hull of i.i.d. distributions
  Q = {Ber(p)^infty : p in [0, 1]} in the canonical filtration (F_t)_{t>=1}) that proves every nonnegative
  supermartingale (NSM) under Q remains an NSM under the closed fork-convex hull tilde{Q} (which for exchangeable
  binary laws equals the set of all probability measures on {0, 1}^infty, rendering every canonical-filtration
  Q-NSM pathwise nonincreasing and powerless), characterizes when a Q-safe e-process E_t satisfying sup_{Q
  in bar{Q}, tau} E_Q[E_tau] <= 1 is dominated by a Q-NSM via the composite Q-Snell envelope under fork-convexity,
  and constructs powerful bar{Q}-safe e-processes R_t = inf_{p in [0, 1]} R_t^{JP, p} by dividing k-th
  order Markov Jeffreys''-prior (Krichevsky-Trofimov) mixtures, countable context-tree double mixtures,
  or predictable non-anticipating betting likelihoods by the composite i.i.d. maximum likelihood sup_p
  L_p(X^t).'
identity_notes: No normalized identity match for fork-convex exchangeability testing via universal safe
  e-processes across all 442 pinned AIO records and 583 maintained IDs, names, aliases and scoped synonyms.
  Fixed-string searches across data, sources, research, history, and reviews returned only prior discovery
  frontier entries where Ramdas, Ruf, Larsson, & Koolen (2022, IJAR 141:83-109, arXiv:2102.00630) was
  tracked as a pending frontier lead. Distinct from AIMech:UniversalInferenceSplitLikelihoodRatioTest
  (Wasserman, Ramdas, & Balakrishnan 2020), which tests parametric/nonparametric composite nulls under
  i.i.d. data rather than testing the composite exchangeability null bar{Q} or characterizing fork-convex
  hulls and composite Snell envelopes; distinct from AIMech:ReverseSubmartingaleConvexDivergenceConfidenceSequences
  (Manole & Ramdas 2023), which operates in the reverse exchangeable filtration (E_t)_{t>=1} under the
  assumption of i.i.d. sampling to estimate convex divergences; and distinct from AIMech:SequentialKernelizedIndependenceTestingByBetting
  (Podkopaev et al. 2023), which pairs i.i.d. bivariate observations (X_{2t-1}, Y_{2t-1}), (X_{2t}, Y_{2t})
  to test independence rather than testing exchangeability of a single sequence in its canonical filtration.
