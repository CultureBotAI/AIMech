claims:
- claim_id: fork-convex-hull-composite-snell-envelope-and-exchangeable-nsm-impossibility
  kind: mechanism
  statement: 'For two locally dominated laws Q, Q'' with density processes Z_t, Z_t'' wrt a reference
    measure R, a fork-convex combination at fork time s in N_0 with F_s-measurable weight h in [0, 1]
    is defined by Z_t'''' = Z_t for t <= s and Z_t'''' = h Z_t + (1 - h) Z_s (Z_t'' / Z_s'') for t > s
    (Section 3.1, Definition 10, Equation 13); every nonnegative supermartingale (NSM) under Q remains
    an NSM under its fork-convex hull and sequential closure tilde{Q} (Lemma 12, Theorem 13), and when
    Q is locally dominated and fork-convex the composite Q-Snell envelope L_t := ess sup_{tau >= t, Q
    in Q} E_Q[E_tau | F_t] is the smallest Q-NSM dominating a Q-safe e-process E_t (Theorem 14), so E_t
    is dominated by a Q-NSM if and only if E_t is already tilde{Q}-safe (Corollary 16); because the closed
    fork-convex hull of the i.i.d. Bernoulli family Q = {Ber(p)^infty : p in (0, 1)} equals the set of
    all probability measures on {0, 1}^infty (Theorem 17), every canonical-filtration Q-NSM (and hence
    every bar{Q}-NSM) is pathwise nonincreasing (L_t <= L_{t-1} <= 1) and the only Q-martingale is M_t
    == 1 (Section 1.6 Proposition 5, Section 3.2 Theorem 17), proving that any powerful canonical-filtration
    test of exchangeability must use e-processes that are not supermartingales.'
  evidence:
  - source_id: ramdas2022-exchangeability-ar5iv
    locator: Section 1.6, lines 185–218, Proposition 5; Section 3.1–3.2, lines 476–675, Definitions 10–11,
      Lemma 12, Theorems 13–14, Corollary 16, Theorem 17, Equations 13–15; Appendix A.1, lines 912–980
    relation: supports
  - source_id: ramdas2022-exchangeability-abs
    locator: Abstract (fork-convexity, powerlessness of canonical-filtration nonnegative supermartingales
      for exchangeability, and necessity of e-processes)
    relation: supports
- claim_id: jeffreys-mixture-universal-inference-safe-e-process-and-krichevsky-trofimov-regret
  kind: mechanism
  statement: 'Dividing the first-order Markov factorized Jeffreys'' prior Beta(1/2, 1/2) x Beta(1/2, 1/2)
    marginal likelihood R_t^{JP} = (1 / (2 pi^2)) [Gamma(n_{0|0} + 1/2) Gamma(n_{1|0} + 1/2) / Gamma(n_{0|0}
    + n_{1|0} + 1)] [Gamma(n_{0|1} + 1/2) Gamma(n_{1|1} + 1/2) / Gamma(n_{0|1} + n_{1|1} + 1)] (equivalently
    updated sequentially in O(1) time via the Krichevsky-Trofimov predictive rule q_t(1) = (n_{1|X_{t-1}}(t-1)
    + 1/2) / (n_{0|X_{t-1}}(t-1) + n_{1|X_{t-1}}(t-1) + 1), Equations 5–6) by the composite i.i.d. Bernoulli
    maximum likelihood sup_{p in [0, 1]} L_p(X^t) = (n_1(t)/t)^{n_1(t)} (n_0(t)/t)^{n_0(t)} yields the
    statistic R_t = inf_{p in [0, 1]} R_t^{JP, p} (Section 1.4 Equation 7, Section 2.2), where each R_t^{JP,
    p} = R_t^{JP} / L_p(X^t) is an exact nonnegative Ber(p)^infty-martingale (Proposition 4); consequently,
    by de Finetti''s theorem and convex closure (Proposition 2), (R_t)_{t>=1} is a bar{Q}-safe e-process
    satisfying sup_{Q in bar{Q}} sup_tau E_Q[R_tau] <= 1 and P_Q(exists t >= 1 : R_t >= 1/alpha) <= alpha
    for every exchangeable law Q in bar{Q} (Theorem 6) while achieving the Krichevsky-Trofimov universal
    coding regret bound ln R_t >= ln(sup_{p_{1|0}, p_{1|1}} L_{p_{1|0}, p_{1|1}}(X^t) / sup_p L_p(X^t))
    - ln t - ln(2 pi) (Section 2.1, Equation 8).'
  evidence:
  - source_id: ramdas2022-exchangeability-ar5iv
    locator: Section 1.2–1.4, lines 68–165, Propositions 1–2, Proposition 4, Equations 1–7; Section 2.1–2.3,
      lines 219–298, Theorem 6, Equation 8
    relation: supports
