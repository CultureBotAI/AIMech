    locator: IJAR 141:83–109 publication record
    relation: supports
- claim_id: pathwise-exponential-growth-rate-and-context-tree-countable-double-mixtures
  kind: mechanism
  statement: For any binary sequence whose empirical transition proportions converge to alpha = lim n_{1|1}/t,
    beta = lim n_{0|0}/t, gamma = lim n_{1|0}/t = lim n_{0|1}/t, and p = lim n_1/t = alpha + gamma, the
    asymptotic per-step log-growth rate of R_t is lim_{t->infty} (ln R_t)/t = r^* = h(p) + alpha ln(alpha
    / (alpha + gamma)) + beta ln(beta / (beta + gamma)) + gamma ln(gamma^2 / ((alpha + gamma)(beta + gamma)))
    >= 0, where r^* > 0 if and only if alpha (1 - p) != gamma p and lim_{t->infty} R_t = 0 almost surely
    under every exchangeable law Q in bar{Q} (Section 2.4, Theorem 7, Equations 9–12); because first-order
    transition counts are blind to higher-order dependencies where alpha (1 - p) = gamma p — such as the
    deterministic 2nd-order cycle 00110011... where alpha = beta = gamma = 1/4, p = 1/2, r^* = 0, and
    R_t^{1, 2} -> 0 (Example 9) — extending the numerator to k-th order d-ary Dirichlet(1/2, ..., 1/2)
    context-tree mixtures R_t^{k, d} with regret (d^k(d - 1)/2) ln t + O(1) (Section 2.5) and countable
    double mixtures E_t = sum_{k=1}^infty w_k R_t^{k, d} or active-prefix mixtures tilde{E}_t = sum_{k=1}^{f(t)}
    w_k R_t^{k, d} guarantees power-one consistency against all stationary k-th order Markov chains outside
    bar{Q} (Section 2.6), while replacing the mixture numerator by any predictable non-anticipating product
    prod_{s=1}^t g_s(X_s) preserves bar{Q}-safety (Section 2.7).
  evidence:
  - source_id: ramdas2022-exchangeability-ar5iv
    locator: Section 2.4–2.7, lines 299–475, Theorem 7, Remark 8, Example 9, Equations 9–12
    relation: supports
- claim_id: empty-intersection-confidence-sequence-duality-and-running-maximum-adjuster
  kind: mechanism
  statement: 'Defining the level-(1 - alpha) confidence set C_t := {p in [0, 1] : R_t^{JP, p} < 1/alpha}
    yields exact pathwise stopping-time equivalence inf{t >= 1 : C_t = emptyset} = inf{t >= 1 : R_t >=
    1/alpha} (Section 4.6, Equation 16), while rejecting when the running intersection becomes empty at
    tau_{cap} := inf{t >= 1 : cap_{s<=t} C_s = emptyset} remains a valid level-alpha test of i.i.d. Bernoulli
    exchangeability that can stop strictly earlier than inf{t >= 1 : R_t >= 1/alpha} under regime shifts;
    furthermore, when departure from exchangeability is transient (Section 4.4, Section 4.7) so that R_t
    peaks above 1/alpha and subsequently decays toward zero, applying a p-to-e calibrator f to the running-minimum
    p-process p_t = 1 / max_{s<=t} R_s or an adjuster F: [1, infty) -> [0, infty) satisfying int_1^infty
    F(y) y^{-2} dy = 1 (such as F(y) = y / (1 + ln y)^2) yields a nondecreasing bar{Q}-safe e-process
    A_t = F(max_{s<=t} R_s) = Theta((max_{s<=t} R_s) / (ln max_{s<=t} R_s)^2) that permanently retains
    peak evidence (Section 4.7).'
  evidence:
  - source_id: ramdas2022-exchangeability-ar5iv
    locator: Section 4.4, lines 755–788; Section 4.6–4.7, lines 805–872, Equation 16
    relation: supports
