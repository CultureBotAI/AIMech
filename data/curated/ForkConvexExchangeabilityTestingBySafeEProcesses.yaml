limitations:
- As proven in Proposition 5 and Theorem 17, no nontrivial canonical-filtration nonnegative supermartingale
  exists for testing i.i.d. or exchangeable binary sequences (every Q-NSM is almost surely nonincreasing),
  so safe e-processes R_t cannot be combined with supermartingale-only constructions that require E_Q[E_t
  | F_{t-1}] <= E_{t-1}.
- For any fixed order k >= 1 and alphabet size d >= 2, the k-th order context-tree Jeffreys'-mixture e-process
  R_t^{k, d} incurs universal coding regret ((d^k(d - 1)) / 2) ln t + O(1) that scales exponentially in
  the Markov order k and linearly in d^k (Section 2.5), and a fixed-order R_t^{k, d} has zero asymptotic
  growth rate against stationary non-exchangeable processes whose k-th order transition marginals match
  an i.i.d. law (such as 00110011... for k=1, Example 9).
- Under transient departures from exchangeability (such as a single changepoint between two i.i.d. regimes
  or a temporary Markov burst followed by i.i.d. data, Section 4.4 & Section 4.7), the unadjusted universal-inference
  e-process R_t eventually decays toward 0 as t -> infty  unless wrapped in a running-maximum adjuster
  F(max_{s<=t} R_s), which pays an unavoidable O((ln max_{s<=t} R_s)^2) logarithmic divisor penalty.
- 'All 1,263 lines of Ramdas, Ruf, Larsson, & Koolen (2022, International Journal of Approximate Reasoning
  141:83-109, arXiv:2102.00630v4) were read. Constructed numerical checks in research/discovery/fork-convex-exchangeability-testing-by-safe-e-processes-boundaries.py
  verify (1) Section 3.1 Definition 10 exact fork-convex martingale identity (max diff 4e-16) and Section
  3.2 Theorem 17 / Corollary 16 composite Q-Snell envelope exceeding 1 (R_8 = 10.9375 > 1 on alternating
  path 01010101, proving impossibility of dominating Q-NSMs), (2) Section 1.4 Equations 5-6 exact agreement
  between sequential Krichevsky-Trofimov updates and closed-form Gamma-function R_t^{JP} across all {0,1}^7
  sequences (max diff 0.0), Section 2.1 Equation 8 universal coding regret bound (max excess -1.457486
  <= 0), and Theorem 6 exact optimal-stopping safety sup_tau E_Q[R_tau] = 1.0 under a Beta(2,2) Polya
  urn exchangeable law, (3) Section 2.4 Theorem 7 asymptotic log-growth rate on 010101... (empirical 0.678431
  vs. r^* = ln 2 = 0.693147) and Example 9 decay of first-order R_t^{1,2} = 0.002552 on 2nd-order cycle
  00110011... vs. exponential growth 0.665104 of the Section 2.6 context-tree double mixture, and (4)
  Section 4.6 Equation 16 exact stopping-time equality inf{t: C_t = empty} == inf{t: R_t >= 1/alpha} (0
  mismatches), earlier stopping of running intersection tau_intersection = 41 < tau_R = 43 under a regime
  shift, and Section 4.7 running-maximum adjuster retention A_T = 246.022558 > 20 vs. decayed unadjusted
  R_T = 0.024891 after a transient Markov burst.'
