claims:
- claim_id: c1-mechanism-training-parameter-clipping-and-perturbation
  kind: mechanism
  statement: During federated training rounds t = 1, ..., T, the central server aggregates client model updates w_t <- w_tilde_{t-1} + sum_{i=1}^N p_i (w_{t*tau_i}^i - w_tilde_{t-1}), clips the global parameter vector via Clip_{rho_t}(w_t) = w_t / max(1, ||w_t||_2 / rho_t), and for t <= T - 1 adds isotropic Gaussian noise epsilon_t ~ N(0, sigma_t^2 I) to broadcast w_tilde_t = Clip_{rho_t}(w_t) + epsilon_t to clients, outputting M(D) = Clip_{rho_T}(w_T) at round T.
  evidence:
  - source_id: r528-primary-pdf
    locator: Section 4.1, Algorithm 1, p. 3
    relation: supports
- claim_id: c2-mechanism-test-time-parameter-smoothing-and-kl-certificate
  kind: mechanism
  statement: At test time, CRFL constructs a parameter-smoothed classifier h_s(w; x_test) = argmax_{c in Y} P_{W ~ N(w, sigma_T^2 I)}[h(W; x_test) = c] estimated via M Monte Carlo parameter samples w_tilde_T^k = Clip_{rho_T}(w_T) + epsilon_T^k with Hoeffding confidence bounds p_A_under and p_B_over, guaranteeing h_s(w'; x_test) = h_s(w; x_test) for all w whose Gaussian parameter distribution satisfies D_KL(N(w, sigma_T^2 I) || N(w', sigma_T^2 I)) <= -log(1 - (sqrt(p_A_under) - sqrt(p_B_over))^2).
  evidence:
  - source_id: r528-primary-pdf
    locator: Section 4.2 Algorithm 2 and Section 5.3 Theorem 3, pp. 3-4, 6
    relation: supports
- claim_id: c3-scope-markov-kernel-contraction-and-certified-radius
  kind: scope
  statement: Under beta-smooth convex losses with L_Z-data-Lipschitz gradients and local learning rate eta_i <= 1/beta, each post-attack federated round t > t_adv acts as a Markov kernel with total-variation contraction coefficient eta_TV(K_t) <= 2*Phi(rho_t / sigma_t) - 1, yielding certified prediction consistency against R coordinated model-replacement attackers for all backdoor patterns ||delta||_2 < RAD given in closed form by Theorem 1 and Corollary 1 Eq. (2).
  evidence:
  - source_id: r528-primary-pdf
    locator: Section 5.1-5.2 Theorem 1, Corollary 1 Eq. (2), Theorem 2, and Appendix B.4 Lemma 10, pp. 5-6, 18
    relation: supports
- claim_id: c4-limitation-noise-utility-tradeoff-and-lipschitz-constant
  kind: limitation
  statement: Increasing training-time parameter noise sigma_t or decreasing the clipping norm rho_t expands the certified radius RAD but degrades clean base-classifier accuracy, and computing a tight closed-form data-Lipschitz gradient constant L_Z (derived in Lemma 1 for multi-class logistic regression) remains an open problem for deep multi-layer neural networks.
  evidence:
  - source_id: r528-primary-pdf
    locator: Section 5.1 Remarks 1 and 5, Lemma 1, and Section 6.2 Figure 2, pp. 5-6, 8
    relation: supports
