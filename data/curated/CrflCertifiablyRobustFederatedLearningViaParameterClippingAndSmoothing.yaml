id: AIMech:CrflCertifiablyRobustFederatedLearningViaParameterClippingAndSmoothing
name: CRFL Certifiably Robust Federated Learning via Parameter Clipping and Smoothing
concept_kind: algorithm
review_status: DRAFT
definition: A certifiably backdoor-robust federated learning framework that clips the l2 norm of the server-aggregated global model parameters Clip_{rho_t}(w_t) = w_t / max(1, ||w_t||_2 / rho_t) and injects isotropic Gaussian parameter noise epsilon_t ~ N(0, sigma_t^2 I) at each training communication round t < T to contract the Markov-kernel KL divergence between clean and poisoned model distributions, and applies Monte Carlo randomized parameter smoothing w_tilde_T^k = Clip_{rho_T}(w_T) + epsilon_T^k at test time to certify sample-wise prediction invariance against bounded-magnitude backdoor triggers.
identity_notes: Introduced by Xie, Chen, Chen, and Li (ICML 2021, PMLR 139:11372-11382, arXiv:2106.08283). Distinct from input-space randomized smoothing (Cohen et al. 2019), which perturbs test inputs rather than model parameters, and from centralized bagged backdoor certification RAB (Weber et al. 2020), which trains M separate models on M noise-corrupted datasets rather than a single federated model evaluated under M parameter-smoothed copies. Also distinct from heuristic norm-clipping and DP-FL defenses (Sun et al. 2019; Geyer et al. 2017), which lack test-time parameter smoothing and pointwise backdoor radius certificates.
aliases:
- CRFL
- Certifiably Robust Federated Learning against Backdoor Attacks
- CRFL Parameter Clipping and Randomized Parameter Smoothing
