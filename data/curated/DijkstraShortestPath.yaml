name: Dijkstra shortest-path algorithm
definition: A shortest-path algorithm for nonnegative edge weights that repeatedly settles the unsettled
  vertex with the smallest tentative distance from a source and relaxes its outgoing edges.
concept_kind: algorithm
identity_notes: The shortest-path method in Problem 2 of Dijkstra’s 1959 paper is curated here. Problem
  1 in the same paper constructs a minimum spanning tree and is a distinct algorithm. A shortest-path
  tree need not be a minimum spanning tree; cost-prioritized search is distinct from breadth-first edge-count
  traversal and heuristic A-star search. No normalized identity match was found across the 442 AIO and
  119 prior native records; ignored-inclusive text hits in the main checkout were dependency-package documentation
  and an unrelated package-metadata substring, not existing concept records.
limitations:
- Nonnegative edge weights are a precondition of the standard method; the record does not extend its settling
  rule to graphs with negative edges.
- The 1959 presentation assumes a connected graph. The cited implementation documents source-unreachable
  vertices separately; reaching an arbitrary node does not establish a path to every node.
- No particular heap implementation, asymptotic runtime, or universal advantage over other shortest-path
  algorithms is asserted.
