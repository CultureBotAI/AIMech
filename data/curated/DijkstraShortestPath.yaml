claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Maintain settled vertices and tentative source distances. A shorter route through the most
    recently settled vertex replaces a tentative distance and predecessor; the next vertex settled is
    the one with minimum tentative source distance. For a specified destination, the original method stops
    when that destination is settled.
  evidence:
  - source_id: method-source
    locator: Problem 2, printed pp. 270–271 / PDF pp. 2–3, Steps 1–2 and Remarks 1–2; connected-graph
      setup on p. 269 / PDF p. 1
    relation: supports
- claim_id: weights-and-output
  kind: scope
  statement: The versioned implementation applies to directed or undirected graphs with nonnegative weights,
    maintains tentative labels in a minimum-priority queue, and returns source distances or predecessor
    data. Its shortest-path tree is not guaranteed to be a minimum spanning tree.
  evidence:
  - source_id: versioned-documentation
    locator: Algorithm description and DIJKSTRA pseudocode; weight_map, predecessor_map and distance_map
      parameters; Notes [1]
    relation: supports
