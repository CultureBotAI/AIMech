claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a finite table Q(x,a). On a sampled transition with current state x, action a, reward
    r and next state y, change only that entry to (1−alpha)*Q(x,a)+alpha*(r+gamma*max_b Q(y,b)), using
    the pre-update table for the target; leave other entries unchanged. Repeated samples supply rewards
    and next states without requiring an explicit estimated transition model. The maximum defines a greedy
    target even when behavior chooses an exploratory action; the update itself does not prescribe an exploration
    policy. In the paper’s discounted finite Markov setting, 0<gamma<1. Its theorem reports almost-sure
    convergence to optimal action values under bounded rewards, table representation, infinitely many
    samples of each state-action pair, and per-pair learning-rate sequences whose sum diverges while their
    squared sum converges, with 0<=alpha<1. This is an asymptotic, assumption-dependent statement, not
    a finite-sample stopping certificate.
