name: Q-learning
definition: A model-free reinforcement-learning method that incrementally updates action-value estimates
  toward an observed reward plus the discounted maximum estimated value of the next state’s actions.
concept_kind: algorithm
identity_notes: The record captures one-step Q-learning through the original finite tabular formulation
  and its explicitly conditional convergence statement. It is distinct from a learned Q table, a generic
  reinforcement-learning task, the complete deep Q-network procedure with replay and target networks,
  and Ant-Q’s edge-based constructive search. Maximizing the next-state estimate distinguishes its target
  from simply evaluating the next action chosen by the behavior policy. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 295 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 57 and 57 lines
  respectively. Text hits were prior candidate leads and neighboring-method mentions in maintained records,
  saved reviews and discovery reports; they did not identify an existing record for these candidates.
  Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six native neighboring
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The state representation and sampling process must support the controlled Markov assumptions. Partial
  observability, changing dynamics, biased sample reuse or unvisited actions prevent importing the stated
  theorem unchanged. Infinite visits alone are insufficient without the learning-rate conditions.
- A fixed positive learning rate violates the finite squared-sum condition; neural or other function approximation
  is not covered by the tabular theorem. The record does not claim all such variants fail, only that this
  particular guarantee does not establish their convergence.
- The action-replay process in the proof is an analytical construction, not a required replay-buffer implementation.
  Section 4 separately discusses reusing empirical samples and warns that repeated reuse can favor the
  observed empirical environment. DQN’s additional machinery is not silently included.
- The paper sketches undiscounted absorbing and multiple-entry extensions but does not establish every
  multi-step variant under the displayed theorem. Discounting, available actions, ties, terminal representation
  and initialization need a declared application. The proof’s full appendix was not independently audited;
  no benchmark claim is curated.
