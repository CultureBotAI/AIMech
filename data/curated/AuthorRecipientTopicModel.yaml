claims:
- claim_id: ordered-pair-mixture
  kind: mechanism
  statement: For a fixed topic count and vocabulary, each topic has a categorical word distribution phi_z
    with a Dirichlet prior, and each ordered sender-recipient pair (a,r) has a topic vector theta_ar with
    a Dirichlet prior. Given sender a_d and nonempty observed recipient set R_d, each token selects x
    uniformly from R_d, z from theta_(a_d,x), and w from phi_z. Conditional on these parameters, the message
    topic mixture averages the eligible pair vectors. The reversed pair can have a different vector. Sender
    identity, recipient sets and message lengths are conditioned on; this direction-sensitive content
    model does not itself generate network edges or establish causal influence.
  evidence:
  - source_id: method-source
    locator: Section 2, printed/PDF pp.3-4, Figure 1 and conditional joint
    relation: supports
  - source_id: conference-source
    locator: Section 2, PDF p.2
    relation: supports
- claim_id: collapsed-pair-inference
  kind: mechanism
  statement: Integrating the shared pair-topic and topic-word vectors gives a collapsed token update.
    For eligible recipient r, topic z and observed word v, its weight is proportional to (n_(a_d,r),z^(-i)+alpha_z)/(n_(a_d,r),.^(-i)+sum(alpha))
    times (n_zv^(-i)+beta_v)/(n_z.^(-i)+sum(beta)). Counts exclude the token and pool the corpus; the
    uniform recipient factor cancels among eligible choices. Joint recipient/topic sampling or compatible
    separate conditional updates target the collapsed assignment posterior. Finite samples approximate
    posterior summaries and do not certify convergence. Sharing random parameters across messages requires
    joint corpus integration; a product of separately integrated message marginals is generally different.
  evidence:
  - source_id: method-source
    locator: Section 2.1, printed/PDF pp.4-6; compare final corpus display p.4 with global count integration
      p.5
    relation: supports
