name: Author-recipient-topic model
definition: A generative message model with a topic distribution for each ordered sender-recipient pair,
  in which each word selects a recipient uniformly from the message's observed recipient set, a topic
  from that pair, and a word from the selected topic.
concept_kind: model_family
identity_notes: 'Scoped to McCallum, Corrada-Emmanuel and Wang''s ART model in the December 2004 technical
  report and IJCAI 2005 paper. Sender and recipient have distinct roles in selecting a pair-specific topic
  vector. The model differs from author-topic modeling over undifferentiated participants, document-specific
  LDA, network-edge generation and the later latent-role RART variants. ART is a source acronym within
  this scope, not a universal expansion of that acronym. No normalized candidate identity matched all
  442 pinned AIO IDs, labels and scoped synonyms or 426 preceding native IDs, names and aliases. Both
  full-checkout searches included ignored and hidden files; 13 matching lines in each checkout came from
  four unique file contents containing prior frontier leads, contextual distinctions and a cached bibliography
  mention. Matching concept excerpts were inspected; the long cached web transcript was not reread in
  full. Semantic search returned 204 label/synonym hits: 200 verified unchanged from prior reading and
  four newly read. Eighteen annotated AIO CLASS nodes and outgoing edges comprise 16 verified unchanged
  and two newly read; 30 contextual YAMLs comprise 25 unchanged prior readings, two newly read AIO records
  and three final records verified against the round101 scientific-review inputs. No candidate identity
  is present within this bounded pinned-snapshot and maintained-corpus search.'
limitations:
- The corpus-probability display on report p.4 factors separately integrated document marginals despite
  shared random parameters. The subsequent corpus-count derivation on p.5 preserves sharing. The record
  uses the shared model and qualifies that display; no failure of unseen implementation is inferred.
- Pair-specific parameters can be weakly informed for sparse or unobserved pairs. Fixed topic count, uniform
  recipient selection, stationary pair preferences, finite vocabulary and bag-of-words emissions constrain
  the model. Suggestions to smooth toward sender-only vectors are not part of the basic specification.
- Reported role similarities use descriptive topic distributions, divergence matrices and selected email
  examples with manual entity resolution and heuristic text cleaning. They do not establish universal
  predictive superiority, actual job roles, expertise or causal social relationships. Topic and role labels
  remain interpretations.
- RART introduces additional latent sender/recipient roles and has token-level and message-level variants.
  It is a distinct extension; preliminary staged fitting after fixing an ART sample is not full joint
  posterior inference. No author code, email corpus or benchmark was executed.
