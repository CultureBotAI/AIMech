name: Noisy-OR belief network
definition: A directed acyclic binary probabilistic network that models a node’s inactivity as the product
  of a leak-failure factor and failure factors for its active parents.
concept_kind: architecture
identity_notes: 'The core record denotes the noisy-OR conditional model described by Neal, with zero/one
  variables and failure factors between zero and one. It is a probabilistic conditional family, not additive
  input noise, a deterministic OR gate or a sigmoid function. Neal also studies a signed-weight exponential
  extension; its distinct validity condition and loss of an individual failure-probability interpretation
  are stated explicitly rather than silently treating negative weights as ordinary noisy-OR failures.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 346 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 23 and 23 lines respectively. All 17 unique matched line contents were inspected
  in full: SBN source metadata, NADE and DARN scope distinctions, their saved review and the carried noisy-OR
  discovery lead, not existing candidate records. Exact checkout counts and differences are retained in
  the ledger. Seventeen exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six
  full native neighboring records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- A negative weighted input gives an invalid negative activation probability. The signed extension therefore
  needs explicit constraints and is not an unconstrained sigmoid parameterization.
- Zero failure probabilities yield deterministic activation contributions and infinite log-failure weights;
  the probability-product form still defines the boundary, but the finite-weight reparameterization excludes
  those endpoints.
- The independent-failure interpretation concerns contributions conditional on parent states, not a proof
  that the parent variables are independent or that the model’s edges identify interventions in real data.
- Local normalization and ancestral generation do not remove hidden-variable marginalization or guarantee
  Gibbs mixing. Boundary zero probabilities can also obstruct positivity conditions used by sampling arguments.
- Neal’s constraint-projection and learning discussion was inspected, but its appendix proofs and executable
  implementations were not audited. No projection-optimality theorem, general convergence or empirical
  advantage is certified.
