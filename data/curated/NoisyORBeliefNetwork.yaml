claims:
- claim_id: method
  kind: mechanism
  statement: For node i, let q_i0 be the failure probability for an always-on bias or leak source and
    q_ij the failure probability associated with active parent j. Set P(s_i=0|parents)=q_i0 times the
    product of q_ij over parents with state1, and set P(s_i=1|parents) to its complement. This corresponds
    to independently failing activation contributions; it does not require the parent variables themselves
    to be independent. Multiply normalized node factors in a topological order to obtain the joint model
    and sample it ancestrally. For strictly positive failure factors, define w_ij=-log(q_ij), including
    the bias; then P(s_i=1|parents)=1-exp(-a_i), with a_i=w_i0+sum_j w_ij s_j and nonnegative standard
    weights. Neal’s separate signed-weight extension retains this exponential formula if a_i is nonnegative
    for every binary parent configuration, equivalently w_i0+sum_(j:w_ij<0) w_ij>=0. Negative weights
    in that extension need not correspond to failure probabilities in[0,1]. Parameter updates must preserve
    validity; the architecture itself does not specify a unique learning algorithm.
