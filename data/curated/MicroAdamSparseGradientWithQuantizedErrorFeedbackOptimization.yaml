id: AIMech:MicroAdamSparseGradientWithQuantizedErrorFeedbackOptimization
name: MicroAdam (Sparse-Gradient Adaptive Optimization with Quantized Error Feedback)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient adaptive optimization algorithm that replaces dense first- and second-moment optimizer states with a circular sliding window of m Top-k sparse error-compensated gradients (storing block-relative int16 indices and bfloat16 values) alongside a 4-bit quantized error-feedback accumulator, dynamically reconstructing bias-corrected Adam statistics at each step with provable AMSGrad-rate non-convex convergence.
identity_notes: Distinct from 8-bit Adam (AIMech:EightBitOptimizerBlockwiseQuantization), which quantizes dense first- and second-moment vectors m_t, v_t in R^d to 8 bits (2d bytes total); MicroAdam stores a circular window of m = 10 Top-k sparse gradients (k = d/100) plus a 4-bit quantized error-feedback vector e_t (0.5d + 4mk = 0.9d bytes, less than half of 8-bit Adam). Distinct from GaLore (AIMech:GaLoreGradientLowRankProjection), which projects gradients into a low-rank SVD subspace without error feedback.
aliases:
- MicroAdam
- MicroAdam Optimizer
- MicroAdamW
- Top-k Sparse Sliding-Window Adam with Quantized Error Feedback
