aio_mappings:
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: PERCH constructs a hierarchy through online insertions and rotations. The AIO target denotes
    the task, not this algorithm or an equivalent implementation.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The merge and rotation construction uses observations and distances without class labels;
    reference labels enter the reported external quality evaluation.
limitations:
- Exact separation theorems, practical geometric summaries, beam search and collapsed representations
  have distinct conditions. No unconditional purity, order-invariance or logarithmic-runtime guarantee
  is asserted.
- Geometric checks evaluate standalone scalar expressions on explicit point sets. They do not construct
  an insertion history, establish reachability, execute PERCH or measure clustering quality.
- The Python implementation retains leaf objects and features after collapse; paper storage claims are
  not silently assigned to that version. Retaining all point IDs also has a cost that grows with the observation
  count.
- The pruning-cost checks distinguish linear-distance heuristics from squared error. No exact optimal
  k-means pruning or universally valid SSE upper bound is inferred.
- The2017 arXivv1 and pinned2019 author implementation were inspected. The conference typeset version
  and complete Scala core were not compared; only the cited Scala entrypoint was fully read.
- All20 paper pages and all cited implementation files were read. Static inspection and curator arithmetic
  only; no author code, model training, data upload or benchmark replication.
