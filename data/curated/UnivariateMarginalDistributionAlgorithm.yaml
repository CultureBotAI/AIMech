id: AIMech:UnivariateMarginalDistributionAlgorithm
name: Univariate marginal distribution algorithm
concept_kind: algorithm
aliases: []
definition: The original unsmoothed binary population optimizer that selects a nonempty set of evaluated
  bit strings, replaces each coordinate probability by its frequency in that selected set, and generates
  the next population from the product of those Bernoulli marginals before repeating selection and refitting.
definition_evidence:
- source_id: muhlenbein1996
  locator: Section 3, PDF pp. 3–4, binary domain, marginal frequencies and UMDA Steps 0–3.
  relation: supports
- source_id: muhlenbein-mahnig-chapter
  locator: Section 3, internal/PDF pp. 9–10, Equation 13 and UMDA Steps 0–3.
  relation: supports
claims:
- claim_id: selected-binary-frequency-refit
  kind: mechanism
  statement: For bit strings x in {0,1}^n, an iteration selects M candidates from an evaluated population
    of N candidates, with positive integers 1<=M<=N. The next probability p_i of bit i being one is its
    empirical frequency in that selected set, counting the selected occurrences. Each zero probability
    is 1-p_i. The algorithm directly refits these univariate marginals rather than preserving pairwise
    parental chromosomes or estimating a full joint table. The nonempty-selection condition is necessary
    for the frequency estimate.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF pp. 3–4, Equation 7 and UMDA Step 1.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 3, internal/PDF p. 10, UMDA Step 1 and the n versus 2n parameter discussion.
    relation: supports
- claim_id: product-bernoulli-resampling
  kind: mechanism
  statement: The next population consists of N newly generated candidates from the product of the fitted
    binary marginals. Within a generated string, coordinate i is Bernoulli(p_i), independently of the
    other coordinates under the sampling law. Thus the fitted law discards dependencies not determined
    by univariate frequencies. For example, the selected sets {00,11} and {01,10} both give p_1=p_2=1/2
    and hence the same uniform law over all four strings. This direct consequence of the product rule
    does not assert exact empirical independence in every finite sampled population.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF pp. 3–4, product form and UMDA Step 2. The two selected-set example is a direct
      deduction from the displayed rule.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 3, internal/PDF pp. 9–10, Equation 13 and UMDA Step 2.
    relation: supports
- claim_id: selection-and-stopping-remain-explicit
  kind: scope
  statement: The original skeleton begins with a randomly generated population, repeats selection, marginal
    estimation and resampling, and stops according to a termination criterion. It leaves the selection
    schedule and stopping details open. The later chapter discusses proportionate, truncation and tournament
    selection as different policies. The generic skeleton does not impose one elite fraction, a universal
    tie convention or a certified global-optimum stopping test; these choices must be specified for a
    particular run.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF p. 4, UMDA Steps 0–3.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 3, internal/PDF p. 10, UMDA steps; Section 3.2, internal/PDF p. 13, selection alternatives.
    relation: supports
- claim_id: unsmoothed-update-versus-sumda
  kind: scope
  statement: Original UMDA replaces the coordinate probability by the selected frequency r_i. The separately
    described smoothed update is p_i,new=p_i+lambda*(r_i-p_i), which recovers that replacement when lambda=1.
    For 0<lambda<1 it retains part of the preceding parameter value. This distinction identifies the original
    unsmoothed mechanism; it does not make SUMDA, all full PBIL implementations or every modern UMDA variant
    exact aliases of this record.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF p. 4, UMDA; Section 4, PDF p. 6, Equation 14 and SUMDA.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 4, internal/PDF p. 16, Equations 38–39 and lambda=1 boundary.
    relation: supports
- claim_id: ideal-proportionate-selection-recurrence
  kind: mechanism
  statement: For an exact product-Bernoulli population law, nonnegative fitness f and positive mean W=E[f(X)],
    ideal proportionate selection gives p_i,new=p_i*E[f(1,X_-i)]/W, where the expectation is over the
    remaining coordinates under the product law. Equivalently, p_i,new-p_i=p_i*(1-p_i)*(partial W/partial
    p_i)/W. The later chapter states this result for infinite populations. It is not the exact update
    of each realized finite sampled generation, not the formula for arbitrary truncation or tournament
    selection, and not a guarantee of reaching a global optimum.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF p. 4, Theorem 3 and Equations 8–10.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 2, internal/PDF p. 3, nonnegative fitness convention; Section 3, internal/PDF pp.
      10–11, Theorem 5, Equations 15–17 and proof.
    relation: supports
- claim_id: finite-population-support-loss
  kind: limitation
  statement: Without mutation, probability margins or another support-restoring operation, a selected
    coordinate frequency of zero or one is absorbing for subsequent product sampling and refitting. More
    specifically, if a coordinate has probability p strictly between zero and one and N candidates are
    independently sampled, the event that every candidate has zero at that coordinate has probability
    (1-p)^N>0. Every nonempty selection from that population then sets the fitted coordinate probability
    to zero. This is a possible fixation event, not a quantified overall failure probability or a claim
    that every run fails.
  evidence:
  - source_id: muhlenbein1996
    locator: Section 3, PDF p. 4, UMDA selection and resampling steps; absorption and the displayed event
      probability are direct deductions under independent sampling.
    relation: supports
  - source_id: muhlenbein-mahnig-chapter
    locator: Section 8, internal/PDF pp. 32–34, finite-population fixation discussion.
    relation: supports
limitations:
- This record covers the original unsmoothed binary procedure. Probability margins, mutation, smoothing,
  restarts, nonbinary distribution families and later runtime-analysis variants change or supplement that
  procedure. The skeleton does not completely specify selection multiplicities, tie handling, initialization
  probabilities or termination.
- A product sampling law does not guarantee independence of the empirical coordinates in every finite
  sample, or preserve dependencies in selected candidates. More expressive conditional models are separate
  constructions; the original article expressly leaves CDA incomplete.
- 'The proportionate-selection equations require nonnegative fitness and positive mean fitness. They cannot
  be applied unchanged to arbitrary signed objectives, zero mean fitness, truncation selection or a particular
  finite sampled generation. The chapter’s continuous expected-fitness interpretation does not certify
  global optimization: on a two-bit landscape with f(00)=f(11)=2 and f(01)=f(10)=1, p_1=p_2=1/2 is stationary
  under the ideal recurrence despite a larger attainable mean fitness at a maximizer. That stationary
  law still samples optimal strings with positive probability.'
- The 1996 SUMDA fixed-selected-frequency result assumes r(t)=c; it is not a general adaptive-convergence
  theorem when selected frequencies change. The basic blend is cited from its update equation. The later
  chapter’s function-specific finite-population examples and conjectural sample-size discussion are not
  universal bounds.
- Formula-level overlap does not establish full-method equivalence. Under matching selection and tie policies,
  an unsmoothed Bernoulli cross-entropy refit can produce the same next distribution. Full incremental
  PBIL with mutation, natural evolution strategies and information-geometric optimization have distinct
  maintained scopes. No benchmark, author implementation or optimizer run was used to establish superiority
  or a convergence rate.
- The primary 1996 paper was read from an author-hosted ten-page copy using OCR and selected formula visuals;
  its file build date is separate from publication. The later 39-page author manuscript is indexed as
  2000 but associated with the 2001 published chapter. Its reading PDF is an explicitly documented derivative
  of the retained original PostScript after removal of a trailing MIME delimiter following the document
  EOF. The source hashes and conversion failures preserve that distinction; publisher-byte equivalence
  is not asserted.
aio_no_match:
  search_scope: On 2026-10-15, the fresh merged-base inventory covered all 739 maintained and 442 pinned
    AIO identities, with IDs, names, aliases and scoped synonyms; the 31 exact/related probes had no normalized
    identity collision. Four full-checkout fixed-string word searches included ignored and hidden files
    and produced 280, 283, 787 and 829 occurrences, representing ten distinct matching contents. Root
    read all ten complete content strings, the collection and selected owner context; exact reconstruction
    accounts for all 2179 occurrences, without claiming individual manual reading of every duplicate line.
    Hits are existing candidate leads and the continuous-SMOTE record or its derived historical representations,
    not existing records for these three identities. The earlier research separately inspected 159 selected
    semantic definitions and four full optimizer neighbors, and thirteen exact AIO CLASS nodes with all
    47 incident edges; root additionally read selected identity, definition, claim and limitation fields
    of PBIL, cross-entropy optimization, NES, IGO and continuous SMOTE. This is bounded snapshot and neighborhood
    evidence, not exhaustive equivalence testing across all possible methods or ontologies.
  rationale: The selected AIO targets describe learning tasks, particular models or mathematical components
    rather than this whole binary selection, refitting and product-resampling algorithm. Optional applications,
    graphical representations or scalar formulas do not justify a forced mapping. This no-match applies
    only to the inspected snapshot and targets.
  examined_targets:
  - target: AIO:EvolutionaryLLM
    rejection_reason: The exact class is an evolutionary large language model; its related evolutionary-algorithms
      synonym is not an exact/broad identity for general distribution-based optimization.
  - target: AIO:TrainingStrategy
    rejection_reason: General objective search need not preprocess or train a machine-learning model.
  - target: AIO:MachineLearningTask
    rejection_reason: Fitting search distributions is an internal optimization operation; the general
      optimizer is not identified with the pinned task of building methods that learn from data.
  - target: AIO:MetaLearning
    rejection_reason: Neither family nor UMDA inherently learns from metadata about machine-learning experiments.
  - target: AIO:ActiveLearning
    rejection_reason: Evaluating black-box objective values is not necessarily querying labels for data
      points.
  - target: AIO:ReinforcementLearning
    rejection_reason: A policy/environment learning problem is not required; an application to it would
      not identify the general optimizer.
  - target: AIO:RandomForest
    rejection_reason: Regression trees are mentioned only in the incompletely specified CDA extension;
      no predictive tree ensemble is required by the family or UMDA.
  - target: AIO:ContinualLearning
    rejection_reason: The target is a deep network learning sequential tasks without forgetting, not updating
      a search distribution.
  - target: AIO:MarkovChain
    rejection_reason: An optional stochastic-state representation does not ground the optimization identity
      in the target network/model or make it a target-invariant Monte Carlo sampler.
  - target: AIO:MathematicalFunction
    rejection_reason: The concepts are iterative selection/model-estimation/sampling procedures, not a
      stand-alone mathematical function or covariance/acquisition component; the generic availability
      of a formula is insufficient.
  - target: AIO:BayesianNetwork
    rejection_reason: FDA/LFDA use graphical representations, and a product law may be represented by
      an edgeless network, but this does not make the general optimization family or whole UMDA algorithm
      a Bayesian network.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The pinned graph-expressed conditional-dependence task is optional model structure,
      not the whole optimizer; an explicit graph is not a mandatory mechanism of UMDA.
  - target: AIO:ExponentialFunction
    rejection_reason: Boltzmann selection is one studied policy; exponential weighting or scalar exponential
      adaptation is not mandatory for the family or UMDA.
review_status: DRAFT
identity_notes: Fresh identity inventory and ignored/hidden-inclusive searches at merged base 50d9a115a61f9a8d40db79fef421ce23c3409bd9
  covered 739 maintained and 442 pinned AIO records. There was no normalized identity collision for the
  candidate probes. All ten distinct hit contents were read and identify prior leads or existing continuous-SMOTE
  context, not a canonical record for this identity. The scoped no-match rationale and thirteen exact
  AIO target assessments remain those established from the pinned source and primary method evidence.
  This record denotes the original binary unsmoothed selected-frequency refit and product-Bernoulli resampling
  procedure. It is narrower than the EDA family and distinct from smoothed SUMDA and incremental/mutated
  PBIL. A specifically matched unsmoothed Bernoulli CEM update can coincide under matching selection and
  tie choices; this is not general whole-method synonymy. Selection, initialization, ties and stopping
  remain choices and no modern margins or mutation are silently imported. The corrected fixed-frequency
  source limitation does not change identity or mappings.
