aio_no_match:
  search_scope: Historical prospective collection on 2026-10-16 from 05:11:39 to 05:12:47
    UTC, branch goal/discover-ai-concepts-round361, HEAD add2c806f6729c8599f4d5cfd6d75c7decde006c.
    Compared all 1,243 record identities (801 native and 442 pinned AIO; 4,927 field
    occurrences and 3,766 normalized values). All 18 normalized probes, including
    the proposed local ID, were clear. Four ignored- and hidden-inclusive fixed-string,
    case-insensitive, word-delimited searches produced 10 distinct matching contents
    and 14 occurrences; every content and occurrence binding was read. The complete
    identity DATA matched the previously read INS/DUAL snapshot exactly. Fresh semantic
    context covered 114 native identity/definition projections, 12 selected native
    definitions and all their claim statements, 30 complete annotated AIO nodes and
    97 incident triples, and the prospective INS/DUAL drafts. The three actual records
    added afterward were read in a separate bounded supplement; their addition was
    reported to bring native counts to 804. No later whole-inventory clearance, global
    source exhaustion or future ownership is claimed.
  rationale: No suitable positive AIO mapping was identified for this source-specific
    partial NegaScout procedure. The inspected targets concern learned models, learning
    tasks, tensor layers or broad mathematical/representational classes. Shared memory,
    recursion, tree shape, adversarial terminology or game applications alone do not
    establish an informative source-backed relation. This is a bounded curator assessment
    of the pinned snapshot, not an upstream ontology assertion.
  examined_targets:
  - target: AIO:ActiveLearning
    rejection_reason: Acquiring bounds during game-tree search is not interactively
      querying labels for training data. The 1985 title does not establish the pinned
      active-learning task.
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: PNS specifies no artificial-neuron architecture or neural training;
      its stored search information is not a neural network.
  - target: AIO:CausalGraphicalModel
    rejection_reason: An alternating game tree is not a causal probabilistic representation
      of a data-generating process.
  - target: AIO:Classification
    rejection_reason: PNS searches values/moves in a supplied game tree; it does not
      classify observations into learned classes.
  - target: AIO:DecisionTree
    rejection_reason: The pinned node is a Classification subclass. Its broader decision-support
      comment does not identify a partial NegaScout game-tree search algorithm with
      a classification tree.
  - target: AIO:GenerativeAdversarialNetwork
    rejection_reason: Adversarial game-tree evaluation does not imply competing generative/discriminative
      neural networks or GAN training.
  - target: AIO:GraphConvolutionalPolicyNetwork
    rejection_reason: PNS uses neither graph convolutions nor a trained goal-directed
      graph-generation policy network.
  - target: AIO:GraphLanguageModel
    rejection_reason: A game-tree representation is not a graph language model; the
      source supplies no language-model mechanism.
  - target: AIO:HashingLayer
    rejection_reason: Partial search-information storage does not establish categorical
      feature hashing or a preprocessing layer. The PNS storage contract is itself
      incompletely specified.
  - target: AIO:HierarchicalClassification
    rejection_reason: Successive game moves form a search hierarchy, not a hierarchy
      of classification labels.
  - target: AIO:MachineLearningTask
    rejection_reason: Retaining already computed search bounds is not on its own a
      task of building methods that learn from data. No such learning task is defined
      for this PNS.
  - target: AIO:MathematicalFunction
    rejection_reason: Generic score arithmetic does not supply an informative relation
      from the operational partial NegaScout algorithm to the pinned scalar-function
      class.
  - target: AIO:MaximumLayer
    rejection_reason: The pinned operation merges tensors elementwise. Bound comparisons
      in game-tree re-search do not constitute that layer.
  - target: AIO:MemoryAugmentedLLM
    rejection_reason: PNS is not a language model and its retained bounds/principal
      variation do not establish external-memory LLM identity.
  - target: AIO:MemoryCellLayer
    rejection_reason: Selective retention of search information is not a layer made
      of neural memory cells.
  - target: AIO:MinimumLayer
    rejection_reason: The pinned tensor minimum merge is distinct from search-window
      control and alternating-player value propagation.
  - target: AIO:Model
    rejection_reason: The very broad representation class does not identify the source
      operational procedure or supply a defensible informative mapping merely because
      a search tree represents a game.
  - target: AIO:Network
    rejection_reason: Interconnected search nodes do not make the algorithm itself
      the pinned generic Network concept; topology alone is insufficient.
  - target: AIO:NeuralTuringMachineNetwork
    rejection_reason: The source PNS has no differentiable neural memory controller;
      using memory does not establish this architecture.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: No neural language model or neural-symbolic integration appears
      in the selected PNS procedure.
  - target: AIO:PolicyLayer
    rejection_reason: The PNS description does not define a neural layer outputting
      a probability distribution over actions.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: Its game tree contains alternatives and score bounds, not a
      model of random-variable conditional dependencies.
  - target: AIO:RandomForest
    rejection_reason: PNS is not an ensemble of learned classification/regression
      trees. Generated experimental trees are inputs, not trained forest estimators.
  - target: AIO:ReasoningLLM
    rejection_reason: Game-tree reasoning does not establish a large language model
      or the pinned reasoning architecture.
  - target: AIO:RecursiveLLM
    rejection_reason: Search recursion is a control convention, not a recursive language-model
      architecture.
  - target: AIO:RecursiveLanguageModel
    rejection_reason: The selected source does not build recursive representations
      for language modeling.
  - target: AIO:RecursiveNeuralNetwork
    rejection_reason: Recursive game-tree traversal does not apply learned neural
      weights over structured inputs.
  - target: AIO:ReinforcementLearning
    rejection_reason: The described finite game-tree search with supplied scores and
      retained bounds does not learn a policy from reward interactions. A game application
      alone does not justify even an algorithm-to-task related mapping.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: PNS is not a language model fine-tuned through reinforcement
      learning.
  - target: AIO:TrainingStrategy
    rejection_reason: The source controls search and information retention, not preprocessing
      or model-training strategy.
