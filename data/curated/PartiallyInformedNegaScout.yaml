definition: A NegaScout variant for adversarial game-tree search that retains prove-best
  information near the root of each subtree and the principal variation from an initial
  search to guide a later re-search, as the particular partial-information policy
  described in the 1985 paper.
definition_evidence:
- source_id: reinefeld1985
  locator: Introduction, printed p.1040 / PDF p.1; Section 3, PNS paragraph, printed
    p.1041 / PDF p.2
  relation: supports
concept_kind: algorithm
claims:
- claim_id: near-root-prove-best-retention
  kind: mechanism
  statement: The described PNS version retains information for prove-best cutoffs
    near the root of each subtree. Section 2 explains the relevant information as
    successor upper bounds from an initial traversal that examined every descendant
    without a beta cutoff; Section 3 selects only part of that information for PNS.
    The paper does not specify a numerical retention depth.
  evidence:
  - source_id: reinefeld1985
    locator: Section 2, Figure 3, and Section 3, printed p.1041 / PDF p.2
    relation: supports
- claim_id: initial-principal-variation
  kind: mechanism
  statement: PNS also maintains the principal variation, defined here as the path
    to the terminal node that the initial search considered best. This identifies
    the retained path; the paper does not give a separate PNS procedure specifying
    its later updates.
  evidence:
  - source_id: reinefeld1985
    locator: Section 3, PNS paragraph, printed p.1041 / PDF p.2
    relation: supports
- claim_id: particular-partial-information-policy
  kind: scope
  statement: The authors introduce PNS as a particular compromise between baseline
    NegaScout and the complete-information INS subtree map. They explicitly allow
    other possible compromise policies. The PNS description therefore identifies this
    retention policy rather than every method that saves some NegaScout search information.
  evidence:
  - source_id: reinefeld1985
    locator: Introduction, printed p.1040 / PDF p.1; Section 3, printed p.1041 / PDF
      p.2
    relation: supports
- claim_id: reported-comparison-design
  kind: scope
  statement: The paper includes PNS in comparisons with AB, NS, INS and SSS* on generated
    trees with random ordering or a 60% probability that the first descendant is best.
    Each plotted point averages twenty runs, and terminal-node counts are normalized
    to minimal game-tree size. Figures 4 and 5 show width-5 and width-20 settings;
    INS and SSS* results at depths 7 and 8 in Figure 5 are unavailable because of
    memory constraints. This describes the study design, not a numeric performance
    guarantee.
  evidence:
  - source_id: reinefeld1985
    locator: Section 4 and Figures 4–5, printed p.1042 / PDF p.3
    relation: supports
limitations:
- PNS is described in prose, while Figure 1 lists NS and the appendix lists INS. No
  complete PNS listing, exact near-root retention depth, principal-variation update
  rule, bound-storage interface, eviction policy or cache lifetime is supplied. These
  details must not be filled in by silently copying INS.
- The prove-best explanation depends on valid successor upper bounds and distinguishes
  those bounds from a true value obtained during re-search. It does not establish
  that all failed-window returns are exact values or that every complete INS guard
  and cutoff is retained by PNS. The descriptive PNS policy is not a certified executable
  implementation or an independently proved optimality theorem.
- The displayed base procedures use integer scores, adjacent-value windows and a tree
  of supplied width and depth. This draft does not extend PNS to arbitrary real-valued
  window tolerances, cyclic graphs, transposition handling, stochastic games, quiescence
  search or unspecified early-terminal conventions.
- The source does not supply a precise PNS space formula or a hard total-memory cap.
  The partly ambiguous summation on p.1041 concerns retention of all INS information,
  and the later hash-table suggestion also concerns INS. Neither is a specified PNS
  storage implementation or a bound covering its entire stack and data structures.
- The 1985 description combines near-root prove-best information with principal-variation
  retention; the later 1987 journal describes PNS using first-level upper bounds.
  Their exact implementation, retention-depth and path-management correspondence remains
  a version question, rather than an established equivalence or demonstrated contradiction.
- The terminal-count comparisons depend on the generated trees, width, depth parity,
  ordering and twenty-run samples. The paper says further variability measurements
  are in progress. No curve digitization, runtime reproduction or universal node-dominance
  claim is made here.
- The reported preferences for PNS and execution-overhead observations describe the
  authors’ implementations and cost model. They do not establish portable speedups,
  byte budgets or that fewer terminal visits always yield lower running time; timing
  claims about INS or SSS* must not be reassigned to PNS.
- The defining artifact is the inspected official-hosted four-page 1985 publication
  reconstructed by ABBYY in 2006. Extracted text omits listings and parts of the bibliography;
  all four page images were inspected, but some formula and reference characters remain
  ambiguous. The seven cited originals were not inspected for this draft and are retained
  as source questions rather than imported proof evidence.
