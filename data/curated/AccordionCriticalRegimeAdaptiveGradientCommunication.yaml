claims:
- claim_id: r633-gradient-norm-critical-regime-detection-and-switching-rule
  kind: mechanism
  statement: "Over-compressing gradients during critical training regimes\u2014specifically the initial epochs and the epochs immediately following scheduled learning-rate decays where top Hessian eigenvalues and layer gradient norms drop rapidly\u2014causes irrecoverable generalization loss even if full-precision gradients are communicated everywhere else (Figure 2b); Accordion detects these critical regimes without Hessian eigenanalysis by evaluating | ||Delta_prev|| - ||Delta_curr|| | / ||Delta_prev|| >= eta (with eta = 0.5 evaluated every 10 epochs) or gamma_next < gamma_curr, selecting l_low (or B_low) in critical regimes and l_high (or B_high) otherwise (Algorithm 1)."
  evidence:
  - source_id: r633-primary-pdf
    locator: Section 4.1-4.2 Figures 2-3 & Algorithm 1, pp. 4-6
    relation: supports
- claim_id: r633-sparse-mean-dense-noise-equivalence-of-compression-and-batch-size
  kind: scope
  statement: Under the sparse-mean plus dense-noise stochastic gradient decomposition grad_w l(w; x_i, y_i) = E_j[grad_w l(w; x_j, y_j)] + (grad_w l(w; x_i, y_i) - E_j[grad_w l(w; x_j, y_j)]) (Eq. 1, justified empirically by >90% support overlap among Top-10% gradient coordinates in Figure 4a and proved with high probability for LASSO in Appendix B Lemma 1 where E[grad_w l] = w + lambda sign(w) + mu(mu^T w) is (k_1 + k_2)-sparse), a large-batch gradient and a heavily compressed gradient both recover only the sparse large-magnitude mean, explaining why both hurt generalization in critical regimes and enabling Algorithm 1 to schedule batch size between B_low and B_high.
  evidence:
  - source_id: r633-primary-pdf
    locator: Section 4.3 Eq. (1), Figure 4 & Appendix B Lemma 1, pp. 6-7, 15-16
    relation: supports
- claim_id: r633-powersgd-topk-and-batch-size-communication-reductions
  kind: application
  statement: Across ResNet-18, VGG-19bn, SENet, DenseNet, and GoogLeNet on CIFAR-10/100 and a 2-layer LSTM on WikiText-2, Accordion with PowerSGD (switching per layer between Rank 2/4 and Rank 1) and Top-K (switching between K = 99% and K = 10%/25%/2%) reduces communication volume by up to 3.7x and wall-clock training time by up to 3.8x without accuracy degradation (Tables 1-4, Figure 11), while Accordion batch-size switching between B_low = 512 and B_high = 4096 achieves up to 5.6x communication reduction and 4.1x wall-clock speedup at baseline small-batch accuracy (Tables 5-6).
  evidence:
  - source_id: r633-primary-pdf
    locator: Sections 5.3-5.5 Tables 1-6 & Appendix D.1 Figure 11, pp. 8-9, 17
    relation: supports
  - source_id: r633-metadata-cr
    locator: DBLP bibliographic record (journals/corr/abs-2010-16248)
    relation: supports
- claim_id: r633-manual-endpoint-selection-and-extreme-compression-floor
  kind: limitation
  statement: "Accordion does not automatically select the endpoint levels {l_low, l_high} or {B_low, B_high}, and if the high-compression endpoint l_high or B_high is overly aggressive for a given architecture\u2014such as PowerSGD Rank 1 on VGG-19 for CIFAR-100 (which drops to 50% standalone accuracy and caps Accordion Rank 4-1 at 63% vs 68% for Rank 4-2, Figure 9) or B_high = 16,384 on ResNet-18 (which loses 1.6% accuracy, Figure 10)\u2014switching cannot fully recover the baseline accuracy."
  evidence:
  - source_id: r633-primary-pdf
    locator: Section 6 Figures 9 & Appendix C Figure 10, pp. 11, 16
    relation: supports
