id: AIMech:AccordionCriticalRegimeAdaptiveGradientCommunication
name: Accordion (Critical-Regime Adaptive Gradient Communication and Batch-Size Scheduler)
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive communication scheduling algorithm for synchronous data-parallel distributed training that detects critical learning regimes at epoch boundaries whenever the relative change between previously accumulated and current accumulated gradient norms satisfies | ||Delta_prev|| - ||Delta_curr|| | / ||Delta_prev|| >= eta (with default threshold eta = 0.5) or a scheduled learning-rate decay occurs (gamma_next < gamma_curr), dynamically selecting a low-compression level l_low (or small mini-batch size B_low) during critical regimes to prevent irrecoverable trajectory drift and switching to a high-compression level l_high (or large mini-batch size B_high with proportionally scaled learning rate) outside critical regimes.
identity_notes: Distinct from static gradient compressors such as PowerSGD (AIMech:PowerSGDLowRankGradientCompression, Vogels et al. 2019), Top-K sparsification (AIMech:TopKGradientSparsification, Aji & Heafield 2017), and QSGD (AIMech:QSGDQuantizedStochasticGradientDescent, Alistarh et al. 2017), which use a fixed compression ratio throughout training. Distinct from AdaComp (AIMech:AdaCompAdaptiveResidualGradientCompression, Chen et al. 2018), which is a specific bin-level residual sparsifier/quantizer rather than a critical-regime controller that wraps arbitrary compressors (PowerSGD, Top-K) and batch-size schedules.
aliases:
- Accordion
- Accordion Adaptive Gradient Communication
- Accordion Critical-Regime Compression Scheduler
- Accordion Adaptive Compression and Batch-Size Scheduler
