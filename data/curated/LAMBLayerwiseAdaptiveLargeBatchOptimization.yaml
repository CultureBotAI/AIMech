id: AIMech:LAMBLayerwiseAdaptiveLargeBatchOptimization
name: LAMB (Layer-wise Adaptive Moments Optimizer for Batch Training)
concept_kind: algorithm
review_status: DRAFT
definition: 'A layerwise adaptive large-batch stochastic optimization algorithm (Algorithm 2) that instantiates layerwise unit-l2 update normalization and parameter-norm trust scaling phi(||x_t^(i)||) on top of Adam: at iteration t, it computes bias-corrected first and second gradient moments m_hat_t = m_t / (1 - beta_1^t) and v_hat_t = v_t / (1 - beta_2^t), forms the coordinatewise Adam ratio r_t = m_hat_t / (sqrt(v_hat_t) + epsilon), and updates each layer i in [h] via x_{t+1}^(i) = x_t^(i) - eta_t [phi(||x_t^(i)||) / ||r_t^(i) + lambda x_t^(i)||] (r_t^(i) + lambda x_t^(i)).'
identity_notes: 'Distinct from LARS (Algorithm 1) in that LAMB uses Adam rather than heavy-ball momentum as the base algorithm, providing two-fold adaptivity: coordinatewise normalization by the square root of the second moment sqrt(v_hat_t) plus layerwise l2 trust-ratio normalization phi(||x_t^(i)||) / ||r_t^(i) + lambda x_t^(i)||. Distinct from Adam and AdamW in that each layer''s update vector is normalized to unit l2 norm and scaled by phi(||x_t^(i)||), preventing large-batch divergence up to batch size 64K/32K on BERT.'
aliases:
- LAMB Optimizer
- Layer-wise Adaptive Large Batch Optimization
- N-LAMB and NN-LAMB
