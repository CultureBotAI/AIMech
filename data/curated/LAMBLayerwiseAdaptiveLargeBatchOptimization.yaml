claims:
- claim_id: c-r593-twofold-adaptivity-and-nonconvex-convergence
  kind: mechanism
  statement: LAMB combines per-dimension normalization by sqrt(v_hat_t) with layerwise trust-ratio rescaling phi(||x_t^(i)||) / ||r_t^(i) + lambda x_t^(i)|| (Algorithm 2), reducing to layer-scaled SignSGD when beta_1 = beta_2 = 0 and achieving nonconvex stationarity rates that depend on average layer smoothness L_avg = (1/h) sum_{i=1}^h L_i rather than worst-case L_infinity = max_i L_i (Theorem 3, pp. 5, 12-14).
  evidence:
  - source_id: r593-primary-pdf
    locator: Section 3.2, Algorithm 2 & Theorem 3, p. 5; Appendix B-C, Eqs. (7)-(10), pp. 12-14
    relation: supports
- claim_id: c-r593-nesterov-and-warmup-correction-variants
  kind: mechanism
  statement: Replacing regular momentum in LAMB's first moment (or both first and second moments) with Nesterov momentum yields N-LAMB (Algorithm 3) and NN-LAMB (Algorithm 4), while Adam bias-correction sqrt(1 - beta_2^t) / (1 - beta_1^t) acts equivalently to gradual learning-rate warmup and can be omitted when warmup is present without accuracy loss (Appendix D-E, pp. 14-16).
  evidence:
  - source_id: r593-primary-pdf
    locator: Algorithms 3-4 & Appendix D-E, Figures 1-2, pp. 14-16
    relation: supports
- claim_id: c-r593-bert-76min-and-resnet50-scaling
  kind: application
  statement: Using square-root learning-rate scaling and linear warmup without hyperparameter tuning across batch sizes, LAMB scales BERT-Large pre-training to batch size 32768 (91.475 SQuAD-v1 F1 in 101.2 minutes) and mixed 65536/32768 batches (90.584 F1 in 76.19 minutes on 1024 TPUv3 chips, down from 3 days), while achieving 76.66% top-1 accuracy on ImageNet ResNet-50 at batch size 16K where tuned Adam/AdamW reach only 73.48%/73.07%.
  evidence:
  - source_id: r593-primary-pdf
    locator: Section 4.1-4.3, Tables 1-5, pp. 6-8
    relation: supports
- claim_id: c-r593-batch-decrease-instability-and-beta2-bound-limitation
  kind: limitation
  statement: Decreasing the batch size from 65536 to 32768 when transitioning from sequence length 128 to 512 in two-stage BERT training destabilizes optimization and can cause divergence unless a second-stage learning-rate re-warmup is applied, and the theoretical bound for beta_2 > 0 in Theorem 3(2) incurs an extra O(sqrt(G^2 d / (h (1 - beta_2)))) factor relative to beta_2 = 0.
  evidence:
  - source_id: r593-primary-pdf
    locator: Theorem 3 & Discussion on convergence rates, p. 5; Section 4.1, p. 7
    relation: supports
