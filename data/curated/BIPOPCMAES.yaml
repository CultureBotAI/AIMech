aio_mappings:
- target: AIO:ExponentialFunction
  relation: related_match
  rationale: The specified base of the original whole algorithm requires the scalar exponential in cumulative
    step-size adaptation, Table 1 Equation 6. This inherited component supports the related mapping; budget
    balancing and population doubling are not its basis. The optimizer is neither equivalent to nor a
    subclass of the scalar function, and no neural activation or elementwise matrix-exponential interpretation
    is asserted.
limitations:
- This is the original 2009 positive-weight whole method, with the separately cited correction to its
  recombination weights. The maintained 2001 rank-one base, original 2003 equal-weight rank-mu component,
  2006 active signed-moment component and 2005 increasing-population-only procedure are different scopes.
  Later active-BIPOP combinations, noisy-objective extensions, alternative restart controllers and current
  software are not exact aliases of this record.
- The paper defines cumulative spent-evaluation accounts but does not fully settle the executable meaning
  of half the recent large budget, partial-generation cap enforcement or budget overshoot. Equal-budget
  language does not guarantee finite exact equality. The configured first/last-large schedule is qualified
  by possible early target stopping.
- Section 2.2 prints the small-path test without explicit absolute-value syntax and does not completely
  specify fitness-tie handling. No executable repair is asserted. The initialization box, scale choices,
  finite thresholds and known-target benchmark conditions are configuration choices, not assumptions satisfied
  by every black-box problem or proofs of invariance of the whole stopped run.
- Table 1 gives the update equations, while Section 4, Equation 7 on PDF p. 3, describes delayed eigendecompositions
  and slightly outdated factors in the evaluated implementation. Exact refreshed factors at every generation,
  numerical conditioning, stable floating-point behavior and complete implementation fidelity are not
  certified here.
- Section 3 reports no thorough parameter study and describes the small-regime settings as ad hoc. The
  reported evaluation totals and selected population/scale outcomes do not establish a universal hard
  evaluation cap, optimal budget allocation, global convergence or superiority over every restart policy.
  No performance number, speedup or author-code benchmark reproduction is curated.
- The author erratum states that Table 2 RT_succ averages Nsucc arbitrary trials rather than necessarily
  successful trials, and that its final unsuccessful-trial median entry can be up to 12 percent too small.
  These corrections are retained without inventing repaired results or treating them as a failure of every
  method equation.
- The primary bytes are a seven-page university-hosted proceedings copy, with printed pages 2389–2395;
  byte identity to a publisher or HAL copy is not certified. The author bibliography and erratum agree
  with those pages, while an archive listing gives 2389–2396. File build dates are distinct from publication
  metadata. Supporting research read all seven native-text pages and method/discussion visuals on pages
  1–3, plus the complete author erratum. Empirical plots, unread bibliographic dependencies and the separate
  noisy companion were not audited. No author implementation, calculator, optimizer or benchmark was run.
