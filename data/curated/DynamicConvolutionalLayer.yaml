aio_mappings:
- target: AIO:Layer
  relation: broad_match
  rationale: This is a reusable neural input-to-output layer with feature and kernel inputs, rather than
    an entire weather-prediction architecture.
- target: AIO:ConvolutionalLayer
  relation: related_match
  rationale: It applies convolution, but the pinned target describes filters as trained parameters; here
    the applied sample-specific kernels are generated activations. The related mapping preserves that
    distinction without silently equating the definitions.
limitations:
- This record denotes the input-generated-filter layer of Klein and colleagues, not every later use of
  dynamic convolution, the complete weather network, or a trained checkpoint.
- Generic generated filters need not be softmax-normalized or separable; the specific weather application
  imposes those constraints. Spatial separability is distinct from depthwise-plus-pointwise channel factorization.
- An input-dependent generator makes the overall transformation nonlinear in general, even though convolution
  with a held-fixed filter is linear.
- Year-separated filtered datasets, architecture selection, Euclidean loss and the nonsignificant Tel
  Aviv comparison bound the empirical evidence.
- All nine CVPR2015 PDF pages visually read, including formulas, figures, tables and references. No author
  code, data, model fitting or benchmark replication inspected or executed; DRAFT remains.
