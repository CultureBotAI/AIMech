claims:
- claim_id: r474-heterogeneous-architecture-prototype-aggregation-mechanism
  kind: mechanism
  statement: By exchanging only d_c-dimensional class prototype vectors C_i^{(j)} rather than gradients or model weights omega_i, FedProto allows clients with distinct neural architectures F_i (e.g., different convolutional channel widths or strides in FedProto-mh) and partially overlapping class subsets to align their embedding spaces around global class centroids C_bar^{(j)} while reducing communicated parameters by orders of magnitude (Tan et al. 2022, Methodology & Experiments, Equations 3-8, Table 1).
  evidence:
  - source_id: r474-primary-pdf
    locator: Methodology (Equations 3-8, Algorithm 1), pp. 3-4, and Experiments (Table 1), pp. 6-7
    relation: supports
- claim_id: r474-nonconvex-one-round-deviation-and-convergence-rate-mechanism
  kind: mechanism
  statement: Under L_1-Lipschitz smoothness of local objectives, bounded stochastic gradient variance sigma^2 and norm G, and L_2-Lipschitz continuity of local embedding functions f_i(phi_i) (Assumptions 1-4), Theorem 1 bounds the one-round expected loss change by E[L_{(t+1)E+1/2}] <= L_{tE+1/2} - (eta - L_1 eta^2 / 2) sum_{e=1/2}^{E-1} ||nabla L_{tE+e}||_2^2 + (L_1 E eta^2 / 2) sigma^2 + lambda L_2 eta E G, and Theorem 2 establishes non-convex convergence to an epsilon-stationary point in T = 2 Delta / (E epsilon (2 eta - L_1 eta^2) - E eta (L_1 eta sigma^2 + 2 lambda L_2 G)) rounds (Tan et al. 2022, Convergence Analysis, Equations 9-19).
  evidence:
  - source_id: r474-primary-pdf
    locator: Convergence Analysis (Assumptions 1-4, Theorems 1-2, Corollary 1, Equations 9-19), pp. 4-5, and Supplement pp. 12-16
    relation: supports
- claim_id: r474-few-shot-non-iid-and-model-heterogeneous-fl-application
  kind: application
  statement: Applied to n-way k-shot statistically and architecturally heterogeneous federated classification on MNIST, FEMNIST, and CIFAR-10 (Tan et al. 2022, Experiments, Tables 1-4, Figures 2-4).
  evidence:
  - source_id: r474-primary-pdf
    locator: Experiments (Tables 1-4, Figures 2-4), pp. 6-7 & 10-11
    relation: supports
- claim_id: r474-shared-embedding-dimension-and-lambda-tuning-limitation
  kind: limitation
  statement: Requires all heterogeneous client encoders f_i to map into a common prototype dimension d_c and requires tuning the prototype regularization weight lambda (Corollary 1 requires lambda < ||nabla L_{tE+1/2}||_2^2 / (L_2 E G) to prevent server prototype aggregation from increasing the local objective) (Tan et al. 2022, Corollary 1, Figure 4, & Supplement p. 12).
  evidence:
  - source_id: r474-primary-pdf
    locator: Corollary 1 (Equation 17), p. 5, Figure 4, p. 7, and Additional Notation, p. 12
    relation: supports
