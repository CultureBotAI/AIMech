id: AIMech:FedProtoFederatedPrototypeLearningAcrossHeterogeneousClients
name: FedProto (Federated Prototype Learning across Heterogeneous Clients)
concept_kind: algorithm
review_status: DRAFT
definition: A gradient-free and parameter-free heterogeneous federated learning framework (Tan, Long, Liu, Zhou, Lu, Jiang, & Zhang 2022, Sections Problem Setting & Methodology, Equations 2-8, Algorithm 1, Theorems 1-2) in which each client i with potentially heterogeneous model architecture F_i(phi_i, nu_i) = g_i(nu_i) o f_i(phi_i) computes local class prototypes C_i^{(j)} = (1 / |D_{i,j}|) sum_{(x,y) in D_{i,j}} f_i(phi_i; x) in a shared d_c-dimensional embedding space (Equation 3), transmits only its local prototype set C_i to the central server, receives back global class prototypes C_bar^{(j)} aggregated across the subset of clients N_j holding class j via sample-weighted averaging (Equation 6), and updates its local model parameters omega_i = (phi_i, nu_i) by minimizing the prototype-regularized local objective L(D_i, omega_i) = L_S(F_i(omega_i; x), y) + lambda sum_j d(C_i^{(j)}, C_bar_i^{(j)}) (Equations 7-8).
identity_notes: Distinct from FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers, Arivazhagan et al. 2019) and FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which exchange and average homogeneous base-layer weight tensors in parameter space; and distinct from FedGen (AIMech:FedGenDataFreeFederatedKnowledgeDistillationViaServerLatentGenerator, Zhu, Hong, & Zhou 2021), which trains a conditional generator on the server from uploaded classifier heads rather than aggregating mean class feature prototypes C_bar^{(j)} across architecturally heterogeneous encoders.
aliases:
