claims:
- claim_id: r495-claim-1
  kind: mechanism
  statement: FedAlign reuses penultimate feature maps f_{theta_{L-1}} as input to a temporarily uniformly pruned sub-block F_{theta_L^{omega_S}} of fractional channel width omega_S (default omega_S = 0.25), forms transmitting matrices X_F = f_{theta_{L-1}}^T f_{theta_L} and X_S = f_{theta_{L-1}}^T f_{theta_L^{omega_S}} (with adaptive average pooling when spatial dimensions differ), and penalizes the mean squared error L_{Lip}(K_S, K_F) between their Power-Iteration spectral norms K_F = ||X_F||_{SN} and K_S = ||X_S||_{SN} (Equations 5-7, Algorithm 1, Supplementary Section E).
  evidence:
  - source_id: r495-primary-pdf
    locator: Section 4, p. 7, Equations 5-7, Algorithm 1, Figure 2; Supplementary Section E, p. 12
    relation: supports
- claim_id: r495-claim-2
  kind: mechanism
  statement: Second-order analysis across clients using top Hessian eigenvalue lambda_max, Hessian trace H_T, cross-client diagonal Hessian norm difference H_N^{k,j} = (||Diag(H_k)||_F - ||Diag(H_j)||_F)^2 (Equation 3), and directional cosine similarity H_D^{k,j} = (Diag(H_k) . Diag(H_j)) / (||Diag(H_k)||_F ||Diag(H_j)||_F) (Equation 4) shows that FedAlign achieves the lowest top Hessian eigenvalue (lambda_max = 143 vs. 297 for FedAvg and 252 for MOON on CIFAR-100) and highest directional alignment (H_D = 0.99) while adding only 2% forward-pass FLOPs (89.1 vs. 87.3 MFLOPs) and 0 additional stored parameters.
  evidence:
  - source_id: r495-primary-pdf
    locator: Section 3.4, pp. 4-5, Equations 3-4, Table 1; Section 4, pp. 6-8, Table 5; Supplementary Sections A-B, p. 11, Tables 8-9
    relation: supports
- claim_id: r495-claim-3
  kind: limitation
  statement: While FedAlign strongly reduces the top Hessian eigenvalue lambda_max and improves cross-client Hessian directional similarity H_D, it does not directly penalize cross-client Hessian diagonal norm differences, resulting in a higher H_N (9655 on CIFAR-100) than full-network multi-pass GradAug (2924) and MOON (5712) (Supplementary Section B, Table 9).
  evidence:
  - source_id: r495-primary-pdf
    locator: Supplementary Section B, p. 11, Table 9
    relation: supports
- claim_id: r495-claim-4
  kind: application
  statement: Evaluated on Dirichlet-partitioned CIFAR-100 (ResNet56), CIFAR-10 (ResNet56), and ImageNet-200 (ResNet18) across varying heterogeneity levels (Dir(alpha) with alpha in {0.1, 0.5, 2.5} and homogeneous), local epochs E in {10, 20, 30}, and partial client participation, reaching 60% accuracy on CIFAR-100 in 37 rounds (3297 MFLOPs, 11.56 Gb) compared to 84 rounds for FedAvg and 55 rounds for MOON.
  evidence:
  - source_id: r495-primary-pdf
    locator: Section 4.1, pp. 6-8, Tables 5-7; Supplementary Section A, p. 11, Table 8
    relation: supports
