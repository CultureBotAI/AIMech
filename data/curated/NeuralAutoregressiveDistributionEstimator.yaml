claims:
- claim_id: method
  kind: mechanism
  statement: Fix an ordering of D binary observations. For each position i compute h_i=sigmoid(c+W[:,<i]
    x_<i) and r_i=P(x_i=1|x_<i)=sigmoid(b_i+V[i,:] h_i). The original motivation ties V to the transpose
    of W, while the paper explicitly also learns separate output weights V; sharing W and c across positions
    is retained. The joint probability is the product over i of r_i raised to x_i times (1-r_i) raised
    to (1-x_i). Initialize the hidden preactivation accumulator a_1=c and update a_(i+1)=a_i+W[:,i] x_i
    after evaluating position i. This reuses prefix work and supports O(DH) evaluation for the original
    one-hidden-layer construction with H hidden units. Train by differentiating the exact average negative
    log joint probability. Generate by sampling each visible bit from its prefix conditional in order;
    no stochastic hidden-state inference or RBM partition function is needed for these operations.
