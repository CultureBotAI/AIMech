name: Neural autoregressive distribution estimator
definition: A fully visible autoregressive density model whose ordered variable conditionals are computed
  by neural networks that share input-to-hidden parameters and recursively reuse prefix computations.
concept_kind: architecture
identity_notes: 'This record covers the original binary NADE construction of Larochelle and Murray. Its
  neural hidden activations are deterministic functions of the visible prefix, not stochastic latent variables
  to be summed out. Mean-field RBM calculations motivate the parameterization; NADE is a separately normalized
  directed model and does not require a pretrained RBM. Later order-agnostic, real-valued, document and
  conditional variants need their own scope assessments. No normalized identity match was found across
  all 442 pinned AIO labels/scoped synonyms and 343 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 7 and 7 lines
  respectively. All 6 unique matched line contents were inspected in full: RWS component-model distinctions,
  its saved review and the carried sigmoid/autoregressive discovery lead, not existing candidate records.
  Exact checkout counts and differences are retained in the ledger. Thirteen exact AIO CLASS nodes with
  scoped synonyms/comments and outgoing edges and six full native neighboring records were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Exact joint evaluation and ancestral generation are properties of the specified NADE distribution, not
  evidence that it equals an RBM distribution or the data-generating distribution. Arbitrary missing-variable
  conditionals are not all directly available as forward prefix conditionals.
- The variable ordering, hidden capacity and optimization affect the fitted model. Original single-hidden-layer
  complexity does not automatically apply to deeper or order-agnostic variants.
- 'The inspected publisher PDF contains inconsistent executable-looking notation: Algorithm 1 initializes
  a multiplicatively updated probability to zero and places a plus between the two Bernoulli factors;
  the displayed accumulator-difference equation on printed p.31 uses i+1 where the prefix difference requires
  i. The curated formulas follow the chain-rule definition, Equations (9)–(11), and the accumulator update
  in Algorithm 1. These are disclosed mathematical interpretations, not an audit of author software.'
- The nonlinear hidden computation distinguishes NADE from a fully visible sigmoid belief network with
  only a logistic-linear conditional. Sigmoid hidden activations are the original choice, not a necessity
  for every valid neural conditional family.
- No universal density-estimation advantage, fitted-model accuracy or training convergence guarantee is
  asserted.
