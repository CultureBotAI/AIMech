name: Topical n-gram model
definition: A topic-conditioned sequence model that chooses whether each word uses a topic-specific unigram
  distribution or a topic-and-previous-word bigram distribution, with that choice depending on the preceding
  word and its topic.
concept_kind: model_family
identity_notes: Scoped to Wang, McCallum and Wei's ICDM2007 TNG model in Figure 1(c). The Bernoulli gate
  uses the previous token's topic and word; the emission uses the current topic. Consecutive bigram choices
  form longer phrases, but the local generative law remains first order. This differs from the always-bigram
  topic model, the topic-independent LDA collocation components and generic tokenization. TNG is the source
  acronym. Topic assignments need not be identical within an extracted phrase. No normalized candidate
  identity matched all 442 pinned AIO IDs, labels and scoped synonyms or 432 preceding native IDs, names
  and aliases. Full-checkout searches included ignored and hidden files in both checkouts; six matching
  lines per checkout came from three unique file contents containing prior frontier leads, bibliography
  context and a cached publication-list mention. All candidate-matching excerpts were read; the long cached
  browser transcript was not reread in full. All 205 semantic label/synonym hits were byte-verified unchanged
  from prior reading. Eighteen annotated AIO CLASS nodes and outgoing edges comprise 17 verified prior
  inspections and one fresh reading. Twenty-seven contextual YAMLs comprise 25 unchanged prior readings,
  one fresh generated AIO reading and one final round102 native record verified against its fully read
  review inputs. No candidate record is present within this bounded pinned-snapshot and maintained-corpus
  search.
limitations:
- The model represents long phrases through successive first-order bigrams, not an unrestricted higher-order
  n-gram table. Fixed topic count, vocabulary, boundary rules and many topic/word parameter rows constrain
  the model and require smoothing.
- The optional same-topic phrase modification on p.4 has an if/else inconsistent with its verbal intention.
  The record follows the main Figure 1(c) construction. Printed minus-one counts must be interpreted as
  removing the old assignment, not subtracting one from every candidate category.
- The retrieval section uses a plug-in first-order query score that averages the previous-topic gate under
  document weights. It is not generally exact filtering or posterior prediction for the full latent sequence.
  Query-level mixture and term-level interpolation are different scoring rules; the reported study uses
  term-level interpolation.
- The NIPS/TREC experiments use selected preparations, fixed hyperparameters and model-specific interpolation
  weights selected for best performance. Topic/phrase labels and retrieval comparisons do not establish
  linguistic ground truth or universal superiority. The finite counterexample audits a printed equation,
  not source implementation or benchmark execution.
