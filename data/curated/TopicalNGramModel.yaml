claims:
- claim_id: topic-conditioned-gate
  kind: mechanism
  statement: Each document has a Dirichlet topic vector theta. Each topic has a categorical unigram vector
    phi, each topic/previous-word pair has a categorical bigram vector sigma, and each previous-topic/previous-word
    pair has a Bernoulli gate psi with a Beta prior. At position i, x_i is drawn from psi_(z_(i-1),w_(i-1)),
    z_i from theta, and w_i from phi_z_i if x_i=0 or sigma_(z_i,w_(i-1)) if x_i=1. Initial and other specified
    boundaries constrain gates to unigrams. Runs of bigram choices induce phrases; the paper labels a
    phrase by its last word's topic as an output convention. This does not impose a shared latent topic
    across the phrase.
  evidence:
  - source_id: method-source
    locator: Sections 2.2-2.3, PDF pp.2-4, boundary handling, Figure 1(c) and topic-consistency discussion
    relation: supports
- claim_id: next-gate-inference-boundary
  kind: mechanism
  statement: The generative law makes z_i a parent of the next gate x_(i+1). Consequently a topic update
    conditioned on the other assignments must account for that outgoing gate as well as the current emission
    and document mixture. The full joint in Appendix A includes those factors, but the printed joint/topic
    conditional displays on pp.4 and10 omit the next-gate contribution. A collapsed implementation must
    remove all affected factors and preserve shared-parameter count corrections before evaluating candidates.
    A finite integrated example yields a topic conditional of (2/3,1/3), whereas dropping that contribution
    gives (4/7,3/7). This qualifies the printed inference expression, without asserting that uninspected
    author software used it.
  evidence:
  - source_id: method-source
    locator: Figure 1(c), PDF p.3; Section 2.3 p.4; Appendix A joint p.9 and conditionals p.10
    relation: supports
