claims:
- claim_id: method
  kind: mechanism
  statement: For a minibatch of N≥2 images, independently augment each image twice to obtain 2N views.
    Encode each with the same f and nonlinear projection head g, giving z_i=g(f(v_i)). With nonzero projected
    vectors and temperature tau>0, set s_ik=z_i^T z_k/(||z_i|| ||z_k||). For anchor i and its paired view
    j, use loss ell(i,j)=−log[exp(s_ij/tau)/sum_(k≠i) exp(s_ik/tau)]. The denominator contains the positive
    j and the 2N−2 other-image views, while excluding i itself. Average over all 2N directed positive
    pairs and update both f and g by gradients. After pretraining, discard g and use the representation
    before projection from f for downstream learning.
  evidence: *id001
