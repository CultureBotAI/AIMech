claims:
- claim_id: tart-instruction-conditioned-scoring-and-unfollowing-negatives
  kind: mechanism
  statement: Given a query q, document d, and natural-language instruction t encoding retrieval intent, domain, and unit, TART-dual scores relevance via inner product s(t, q, d) = E([t; q])^T E(d) trained with in-batch softmax cross-entropy loss, while TART-full scores top-K candidates via s(t, q, d) = FFN(E([t; q; d])) trained with binary cross-entropy over positive documents d^+, denoised in-domain hard negatives d^HD (cross-encoder score < 0.1), and instruction-unfollowing negatives d^UF mined from other tasks' corpora that match q topically but violate t.
  evidence:
  - source_id: r746-primary-pdf
    locator: Section 4.1-4.2 (Negative documents selection, Figure 3) & Section 5.1-5.2 (Equations 1-2), pp. 3-6
    relation: supports
  - source_id: r746-primary-pdf
    locator: filter_denoised_hard_negatives, tart_dual_inbatch_loss, tart_full_bce_loss & main
    relation: supports
- claim_id: tart-zero-shot-and-cross-task-pooled-retrieval
  kind: scope
  statement: Trained on 37 instruction-annotated BERRI datasets, TART-full (initialized from T0-3B or FLAN-T5-XL encoders, 1.5B parameters) achieves 44.8 average nDCG@10 on BEIR and 75.7 Success@5 on LOTTE-pooled without task-specific parameter updates or synthetic target-corpus data generation, and reaches 59.1 average nDCG@10 on X^2-Retrieval (3.7M pooled cross-domain documents), outperforming Contriever+CE by +8.2 points.
  evidence:
  - source_id: r746-primary-pdf
    locator: Section 6.2 (X^2-Retrieval), Section 7.1-7.2 (Tables 3-4), & Section 8.4 (Figure 8), pp. 7-11
    relation: supports
  - source_id: r746-primary-pdf
    locator: main (X^2-Retrieval instruction routing check)
    relation: supports
- claim_id: tart-dual-encoder-capacity-and-misleading-instruction-limitation
  kind: limitation
  statement: The 110M-parameter BERT-base bi-encoder variant (TART-dual) exhibits degraded zero-shot nDCG@10 compared to non-instructed Contriever-MS MARCO on several BEIR tasks (such as Touche-2020 and Climate-FEVER, 37.4 vs. 38.0 average) due to limited model capacity and lack of token-level query-document cross-attention, and providing inaccurate or mismatched domain/unit instructions at test time degrades TART-full accuracy.
  evidence:
  - source_id: r746-primary-pdf
    locator: Section 7.1 (Table 3), pp. 8-9; Section 9, p. 11; Appendix D.2 (Table 16), pp. 21, 25
    relation: supports
