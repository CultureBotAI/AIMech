id: AIMech:TARTTaskAwareRetrievalWithInstructions
name: TART (Task-Aware Retrieval with Instructions)
concept_kind: algorithm
review_status: DRAFT
definition: A multi-task instruction-following information retrieval methodology that conditions document relevance scoring on both the user query q and an explicit natural-language task instruction t (specifying intent, domain, and retrieval unit), training either a dual-encoder s(t, q, d) = E([t; q])^T E(d) (TART-dual) or an encoder-only cross-encoder s(t, q, d) = FFN(E([t; q; d])) (TART-full) across diverse instruction-annotated tasks using random negatives, cross-encoder-denoised hard negatives d^HD, and cross-corpus instruction-unfollowing negatives d^UF.
identity_notes: Introduced by Asai, Schick, Lewis, Chen, Izacard, Riedel, Hajishirzi, and Yih (Findings of ACL 2023, pp. 3994-4022, arXiv:2211.09260). Distinguished from standard zero-shot dense retrievers (such as Contriever or GTR) that condition only on the query q, from UPR (Sachan et al., 2022) which uses a fixed question-generation prompt to compute log p(q | d) rather than adapting relevance to arbitrary task instructions t, and from Promptagator (Dai et al., 2023) which trains separate task-specific retrievers on LLM-generated synthetic queries.
aliases:
- Task-Aware ReTriever
- Task-Aware Retrieval with Instructions
- TART Multi-Task Instructed Retriever
