claims:
- claim_id: method
  kind: mechanism
  statement: At node x, maintain Q_x(d,y), the estimated time to deliver a packet to destination d through
    neighbor y, including waiting in x’s queue. Route using the neighbor with the smallest current estimate.
    Upon sending the packet to y, obtain its estimate t=min_z Q_y(d,z). With observed waiting time q at
    x and link-transmission time s from x to y, update the used table entry by Q_x(d,y)_new=Q_x(d,y)+eta*(q+s+t−Q_x(d,y)).
    This is an asynchronous local cost backup; it uses a minimum because delivery times are costs and
    the displayed target has no discount factor. The baseline only updates the selected neighbor entry.
    The full-echo extension separately queries all neighbors and updates their estimates, under a simulation
    assumption that the extra queries do not themselves congest the network.
