name: Q-routing
definition: A distributed adaptive packet-routing algorithm that learns destination-specific delivery-time
  estimates by combining observed local queue and transmission delays with a neighboring node’s estimate
  of remaining delivery time.
concept_kind: algorithm
identity_notes: 'This record denotes Boyan and Littman’s original tabular Q-routing method. It minimizes
  predicted delivery time using local bootstrapped information, unlike AntNet’s measured complete forward-trip
  feedback and probabilistic routing-table reinforcement. The exploratory full-echo scheme is a distinct
  variant, not an unmentioned mandatory part of the baseline. A neural approximation was explored but
  is not the defining original representation. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 298 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 20 and 20 lines respectively. All
  17 unique hit contents were inspected: prior TD(lambda) and Q-routing leads, GAE and AntNet boundary
  statements, and their saved reports/reviews. These were references to methods rather than existing candidate
  records. Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six native neighboring
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The greedy baseline has no deliberate exploration once its initial policy is established. Overestimated
  unused alternatives can remain stale, impeding rediscovery of shortcuts when load decreases; the source
  explicitly reports this weakness. Full echo changes the information and update scheme and may introduce
  oscillation under heavy traffic.
- Queue-dependent delays, other adaptive routers and changing traffic make the environment nonstationary
  relative to a destination/neighbor table. The record imports no stationary tabular Q-learning convergence
  theorem, optimality certificate, loop-freedom guarantee or universal routing superiority.
- The displayed interior-node update needs declared destination-boundary, initialization, tie-breaking,
  disconnected-network and message-delay conventions in an executable implementation. The method text
  does not fully specify all these cases, and a simulator or complete protocol is not supplied by this
  conceptual record.
- Results come from a simplified discrete-event network simulation; the paper explicitly says it is not
  fully realistic. The neural-network experiments were inconclusive. No empirical performance claim or
  deployment validation is curated.
