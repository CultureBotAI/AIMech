claims:
- claim_id: multilevel-time-factors
  kind: mechanism
  statement: In four-level PAMTOT each document draws root and supertopic routing vectors, while subtopic
    word vectors are shared across the corpus. Each token chooses a supertopic/subtopic path, emits a
    word and generates separate timestamps from Beta densities at both topic levels. Fitting repeats the
    observed document timestamp in all these time slots. With fixed parameters, the collapsed path weight
    is the three PAM leave-one-out count factors multiplied by supertopic and subtopic time densities;
    a common root time factor cancels from assignment odds.
  evidence:
  - source_id: method-source
    locator: Combining PAM and TOT, PDF pp.2-3; Figure 1 and Inference and Parameter Estimation p.3
    relation: supports
- claim_id: repeated-time-law
  kind: mechanism
  statement: The source acknowledges that forward generation yields distinct times even though fitting
    repeats one document time. Restricting a product of timestamp densities to a shared time is not automatically
    a normalized single-time model. Its integral can depend on the chosen path, and can even diverge for
    otherwise valid individual Beta shapes. A finite two-path example gives assignment probabilities (1/4,3/4)
    for repeated time factors versus (1/7,6/7) after separately normalizing each path as a single-time
    density. These are different model interpretations. A coherent general marginal sums complete paths
    while retaining the product of all their time factors; the printed marginal display on p.2 has inconsistent
    indexing.
  evidence:
  - source_id: method-source
    locator: Combining PAM and TOT, PDF p.2, joint and marginal displays; acknowledgment of multiple generated
      timestamps p.3
    relation: supports
- claim_id: moment-fitted-parameters
  kind: mechanism
  statement: The experimental fitting updates Dirichlet and Beta parameters by empirical moments during
    Gibbs-style assignment updates. This differs from fixed-target posterior sampling with all parameters
    integrated. The printed Beta exponent order is (1-t)^(psi1-1)*t^(psi2-1), so a chosen estimator must
    use a consistent shape convention. This workshop paper does not print its moment formulas; the notation
    conflict in the separate TOT paper is not asserted as a demonstrated implementation defect here.
  evidence:
  - source_id: method-source
    locator: Inference and Parameter Estimation, PDF p.3; Experimental Results p.5
    relation: supports
