name: Pachinko allocation topics over time model
definition: A topic-model family combining pachinko allocation paths with topic-specific continuous timestamp
  densities at multiple path levels, so that words and observed times jointly inform topics and their
  co-occurrence structure.
concept_kind: model_family
identity_notes: Scoped to the 2006 Li, Wang and McCallum workshop model combining PAM and Topics over
  Time, particularly the demonstrated four-level PAMTOT construction. Both supertopics and subtopics supply
  time factors, whereas subtopics supply corpus-shared word distributions. This differs from plain PAM,
  single-topic-level TOT, and dynamic topic models with evolving word probabilities. PAMTOT is the source
  acronym. The construction models observed timestamp/content associations, not a continuous-time Markov
  process or causal event graph. No normalized candidate identity matched all 442 pinned AIO IDs, labels
  and scoped synonyms or 435 preceding native IDs, names and aliases. Full-checkout searches included
  ignored and hidden files in both checkouts; two matching lines per checkout came from one unique prior
  discovery-ledger content with a source URL and pending extension cohort. All matching excerpts were
  read. All 205 semantic label/synonym hits and 18 annotated AIO nodes with outgoing edges were byte-verified
  unchanged from prior readings. Twenty-six contextual YAMLs comprise 24 unchanged prior readings and
  two fully read final round104 native targets verified against saved review inputs. No candidate record
  is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- Fixed topic-word vectors do not represent changing word meanings. Topic correlations and manually labeled
  temporal plots do not establish causality, future extrapolation or automatic topic birth and death.
- Repeated timestamps and density products require explicit interpretation. Moment fitting also needs
  policies for empty groups, zero or invalid variance, valid positive Beta shapes, time normalization
  and endpoints. The general document-local and experimental corpus-shared emission formulations require
  different corpus marginalization.
- The experiment uses 4454 selected Rexa documents from 1991-2005, near-uniform year subsampling, 50 supertopics
  and 100 subtopics. The timestamp-prediction comparison lacks an explicit held-out split and complete
  scoring derivation in this short paper; it is not certified forecasting evidence.
- Selected KL-matched topic examples and reported timestamp metrics are source results with bounded scope.
  Finite curator calculations distinguish probability laws, not historical software behavior. No author
  code or benchmark was executed.
