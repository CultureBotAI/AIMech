id: AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes
name: pFedMe Personalized Federated Learning with Moreau Envelopes
concept_kind: algorithm
review_status: DRAFT
definition: A bi-level personalized federated learning algorithm (pFedMe) that formulates global coordination as minimizing the average Moreau envelope F(w) = (1/N) sum_{i=1}^N F_i(w) where each client's outer objective is F_i(w) = min_{theta_i in R^d} { f_i(theta_i) + (lambda / 2) ||theta_i - w||^2 } and its optimal personalized model is the proximal operator theta_hat_i(w) = prox_{f_i / lambda}(w). Using the exact envelope gradient identity nabla F_i(w) = lambda * (w - theta_hat_i(w)), each client i alternates across R local steps between computing a delta-approximate personalized solution theta_tilde_i(w_{i,r}^t) via K inner first-order steps and updating its local reference model w_{i,r+1}^t = w_{i,r}^t - eta * lambda * (w_{i,r}^t - theta_tilde_i(w_{i,r}^t)), followed by server interpolation w_{t+1} = (1 - beta) w_t + (beta / S) sum_{i in S^t} w_{i,R}^t.
identity_notes: Distinct from FedProx (AIMech:FedProxProximalFederatedOptimization, which solves the same proximal subproblem to update a single shared global model w without decoupling a persistent personalized model theta_i from the global reference parameter w), from Per-FedAvg (AIMech:PerFedAvgModelAgnosticMetaLearningForPersonalizedFederatedLearning, which minimizes one-step MAML adaptation loss f_i(w - alpha nabla f_i(w)) requiring Hessian-vector products rather than first-order Moreau envelopes), and from Ditto (AIMech:DittoFairAndRobustPersonalizedFederatedMultiTaskLearning, where global optimization of w^* is completely independent of the personalized models v_k, whereas in pFedMe the outer global update depends directly on lambda * (w_{i,r}^t - theta_tilde_i)).
