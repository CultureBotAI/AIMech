claims:
- claim_id: r395-moreau-envelope-smoothness-and-strong-convexity-transfer
  kind: mechanism
  statement: Proposition 1 proves that if f_i is L-smooth (and optionally mu-strongly convex, or nonconvex with lambda > 2L), then the Moreau envelope F_i(w) is L_F-smooth with L_F = lambda (and L_F = lambda * L / (lambda - L) < lambda for lambda > 2L) and mu_F-strongly convex with mu_F = lambda * mu / (lambda + mu), with exact gradient nabla F_i(w) = lambda * (w - theta_hat_i(w)), while Lemma 1 shows that K = O(kappa_h log(d / delta)) inner gradient steps suffice to compute a delta-accurate proximal iterate without second-order derivatives.
  evidence:
  - source_id: r395-primary-pdf
    locator: Section 3.1 Problem Formulation & Section 3.2 Algorithm (Proposition 1, Lemma 1, Eqs. 3-5), pp. 3-5
    relation: supports
- claim_id: r395-strongly-convex-and-nonconvex-convergence-rates
  kind: mechanism
  statement: Using the Moreau-envelope bounded diversity bound (Lemma 2), Theorem 1 and Corollary 1 establish O(1 / (T R N)^2) quadratic convergence speedup in total rounds T, local steps R, and clients N for mu-strongly convex objectives, while Theorem 2 and Corollary 2 establish O(1 / (T R S)^{2/3}) stationarity convergence for L-smooth nonconvex objectives when lambda >= sqrt(8 L^2 + 1).
  evidence:
  - source_id: r395-primary-pdf
    locator: Section 4 Convergence Analysis (Lemma 2, Theorems 1-2, Corollaries 1-2, Table 1), pp. 5-7
    relation: supports
- claim_id: r395-inner-loop-computational-overhead-and-lambda-threshold-limitation
  kind: limitation
  statement: Each outer local step r = 1,...,R requires solving an inner K-step proximal minimization subproblem (multiplying local gradient evaluations by K), and theoretical nonconvex smoothness of the Moreau envelope requires choosing the regularization parameter lambda > 2L (or lambda >= sqrt(8 L^2 + 1) in Theorem 2).
  evidence:
  - source_id: r395-primary-pdf
    locator: Section 3.1 Proposition 1, Section 3.2 Lemma 1, and Section 4.2 Theorem 2, pp. 3-7
    relation: supports
- claim_id: r395-heterogeneous-mnist-and-synthetic-personalization-application
  kind: application
  statement: Applied to non-i.i.d. MNIST and synthetic federated tasks with both strongly convex L2-regularized multinomial logistic regression and nonconvex 2-layer DNN models, outperforming FedAvg and Per-FedAvg in personalized test accuracy.
  evidence:
  - source_id: r395-primary-pdf
    locator: Section 5 Experimental Results and Discussion (Figures 1-2, Table 2), pp. 7-9
    relation: supports
