claims:
- claim_id: method
  kind: mechanism
  statement: For each input x, aggregate expert probabilities as pbar(y|x)=product_m p_m(y|x)^w_m/Z(x),
    with w_m>=0 and sum_m w_m=1. Omit zero-weight factors, and require 0<Z(x)<infinity. On a common support
    where the divergences are finite, pbar minimizes sum_m w_m KL(r||p_m) over normalized r, with the
    candidate r in the first KL argument. For a target distribution q, KL(q||pbar)=sum_m w_m KL(q||p_m)-sum_m
    w_m KL(pbar||p_m); the subtracted term is -log Z at a fixed input, or its expectation over inputs.
    Thus the pool is no worse in that KL direction than the weighted average of experts, not necessarily
    the best expert. A common likelihood update commutes with pooling when the same fixed normalized weights
    are retained and normalization exists. For binary logistic probabilities this rule averages logits;
    for equal-variance Gaussian experts it averages means while preserving that shared variance.
