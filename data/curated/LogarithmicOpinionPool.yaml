name: Logarithmic opinion pool
definition: A probability-aggregation method that forms a normalized weighted geometric mean of expert
  distributions over the same outcomes, using nonnegative exponent weights that sum to one.
concept_kind: mathematical_method
identity_notes: This record uses the normalized-weight convention inspected in Heskes and Hinton. It combines
  probability assessments, possibly conditional on an input, rather than spatially pooling neural activations.
  It is distinct from a linear opinion pool, a unit-exponent product learned cooperatively, and a particular
  algorithm for estimating the exponent weights. Broader log-linear combinations without the sum-to-one
  constraint require separate qualifications. All 442 pinned AIO labels/scoped synonyms and 373 preceding
  native IDs/names/aliases were compared. The sole normalized hit is Product of experts as a related synonym
  of FactorizedLLM; its language-specific definition and parent distinguish it from the generic candidate.
  Both full-checkout fixed-string searches included ignored and hidden files and returned 59 lines each.
  All 29 unique matched contents were read; other hits concern citations, training components, prior boundary
  discussions or pending leads. All 88 semantic label/synonym hits, 20 exact fully annotated AIO nodes
  with outgoing edges, their generated records and four complete native neighbors were inspected or verified
  unchanged after previous full reading. Absence is bounded to this pin and inspected semantic neighborhood.
limitations:
- An outcome assigned zero probability by any positively weighted expert receives zero pooled probability.
  Disjoint positively weighted supports can yield Z=0. Zero-weight experts are excluded from this veto;
  finite-divergence identities require compatible support.
- The weighted-average KL bound is not a guarantee of improvement over every expert, calibrated uncertainty
  or empirical predictive superiority. It depends on nonnegative weights summing to one, and does not
  transfer unchanged to arbitrary unit-exponent products.
- Pooling does not specify how expert models or their weights are trained. Heskes’s quadratic weight-selection
  objective is an approximation obtained by neglecting KL asymmetry terms for nearby distributions; it
  is not the exact general weight-optimization objective. Finite-data divergence estimates may be biased
  by fitting and overfitting.
- The Heskes display following Equation (3) prints ambiguity A as positive log Z, conflicting with its
  nonnegative weighted-KL definition and the preceding prose. The consistent identity is A=-log Z. The
  normalization constraint there also integrates over x where conditional normalization requires y; these
  display slips are not adopted.
- The variance example on printed p.270 reverses the precision ratio for the displayed KL argument order.
  The record relies on the probability-pool definition and the equal-variance example, not that reversed
  formula. No general weight-selection implementation or empirical result is certified.
