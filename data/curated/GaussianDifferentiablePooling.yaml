limitations:
- The local name specifies the 2012 Zeiler–Fergus Gaussian spatial method. It is not a blanket identity
  for graph differentiable pooling, Gaussian receptive-field readouts or all differentiable aggregation
  methods.
- The inverse relation is conditional on fixed nonoverlapping unit-norm unpooling columns and applies
  to generated unpoolings. It does not invert an arbitrary image or convolutional network.
- The inspected source has normalization-derivative and indexing discrepancies. No implementation, precision-domain
  safeguards, optimizer edge-case handling, other source version or empirical replication was inspected.
- The complete twelve-page arXiv1207.0151v1 paper was visually inspected; constructed calculations test
  stated mathematical boundaries without training a model.
