- target: AIO:LogisticRegression
  relation: related_match
  rationale: Accelerates finite-sum l_1/l_2-regularized logistic regression solvers (SAG, SAGA, SVRG, SDCA, MISO) to optimal tilde{O}(n + sqrt(n L / mu)) complexity.
- target: AIO:LassoRegression
  relation: related_match
  rationale: Handles composite non-smooth l_1 regularizers psi(x) = lambda ||x||_1 via inexact proximal subproblems.
- target: AIO:RidgeRegression
  relation: related_match
  rationale: Adds quadratic proximal regularization (kappa/2)||x - y_{k-1}||_2^2 at every outer step to improve the subproblem condition number.
limitations:
- Incurs a logarithmic inner-loop factor log(L / mu) in total complexity due to solving sequence of auxiliary subproblems G_k(x), and requires tuning the smoothing parameter kappa and inner stopping criterion.
