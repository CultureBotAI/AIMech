claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any sequence {x_k} and parameter q = mu / (mu + kappa), the canonical estimate sequence defined by gamma_k = (1 - alpha_{k-1}) gamma_{k-1} + alpha_{k-1} mu (Equation 20) and v_k = ((1 - alpha_{k-1}) gamma_{k-1} v_{k-1} + alpha_{k-1} mu x_k - alpha_{k-1} kappa (y_{k-1} - x_k)) / gamma_k (Equation 21) under the Algorithm 1 recurrence alpha_k^2 = (1 - alpha_k) alpha_{k-1}^2 + q alpha_k and y_k = x_k + beta_k (x_k - x_{k-1}) with beta_k = alpha_{k-1}(1 - alpha_{k-1}) / (alpha_{k-1}^2 + alpha_k) satisfies the exact algebraic identities gamma_k = (kappa + mu) alpha_{k-1}^2 (Equation 27), v_k = (x_k - (1 - alpha_{k-1}) x_{k-1}) / alpha_{k-1} (Equation 28), and (1 - alpha_k) gamma_k v_k - alpha_k kappa y_k + alpha_k(1 - alpha_k)(kappa + mu) x_k = 0 (Lemma A.8).
  evidence:
  - source_id: r340-primary-pdf
    locator: Appendix A.1, Lemmas A.6, A.7, and A.8 (Equations 20-28), pp. 11-14
    relation: supports
  - source_id: r340-arxiv-abs
    locator: 'Abstract: Generic acceleration scheme based on inexact accelerated proximal point iterations'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: When F is mu-strongly convex and each inner subproblem G_k(x) is solved to accuracy G_k(x_k) - G_k^* <= epsilon_k = (2/9)(F(x_0) - F^*)(1 - rho)^k with rho < sqrt(q) = sqrt(mu / (mu + kappa)), Theorem 3.1 guarantees F(x_k) - F^* <= (8 / (sqrt(q) - rho)^2)(1 - rho)^{k+1}(F(x_0) - F^*); when mu = 0 (convex F) and alpha_0 = (sqrt(5) - 1)/2, the multiplier sequence lambda_k = prod_{i=0}^{k-1}(1 - alpha_i) satisfies 2 / (k + 2)^2 <= lambda_k <= 4 / (k + 2)^2 for all k >= 0 (Lemma B.3), yielding O(1 / k^2) outer convergence for decaying errors epsilon_k = 2(F(x_0) - F^*) / (9(k + 2)^{4 + eta}) (Theorem 3.3).
  evidence:
  - source_id: r340-primary-pdf
    locator: Section 3.2-3.4, Theorems 3.1 and 3.3, pp. 4-5; Appendix A.2, Lemma A.10 and Proof of Theorem 3.1, pp. 14-16; Appendix B, Lemma B.3, p. 19
    relation: supports
  - source_id: r340-metadata-cr
    locator: 'Abstract: Catalyst achieves optimal convergence rates in strongly convex and convex settings with explicit control of inexactness'
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: If the inner-loop optimization error epsilon_k fails to decay fast enough (e.g., constant non-decaying inner error epsilon_k = epsilon_0 > 0), the error accumulation term sum_{j=1}^k sqrt(2 lambda_k / lambda_j * epsilon_j) in Proposition A.9 prevents convergence to F^* and causes the outer iterate sequence to stall above an error floor.
  evidence:
  - source_id: r340-primary-pdf
    locator: Appendix A.2, Proposition A.9 (Equation 29), p. 14; Appendix B, Proposition B.2 (Equation 35), p. 18
    relation: supports
