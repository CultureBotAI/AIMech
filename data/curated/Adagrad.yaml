id: AIMech:Adagrad
name: Adagrad
definition: An adaptive gradient optimization method that scales each coordinate's update using accumulated
  squared gradients.
concept_kind: algorithm
identity_notes: This record covers the commonly implemented diagonal Adagrad algorithm. Its cumulative
  accumulator differs from the exponentially decayed squared-gradient estimate in RMSprop.
definition_evidence:
- source_id: pytorch-docs
  locator: Adagrad.__doc__, diagonal update algorithm lines 193–218
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The diagonal variant accumulates squared gradients over iterations and divides the current
    gradient by the square root of that accumulator plus a numerical stabilizer.
  evidence:
  - source_id: pytorch-docs
    locator: Adagrad.__doc__, diagonal update algorithm lines 193–218
    relation: supports
