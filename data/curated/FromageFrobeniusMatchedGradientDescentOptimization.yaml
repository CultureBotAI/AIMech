  relation: related_match
  rationale: Fromage is a layerwise relative-trust gradient descent algorithm derived from compositional perturbation bounds on deep artificial neural networks.
- target: AIO:BatchNormalizationLayer
  relation: related_match
  rationale: Fromage's 1 / sqrt(1 + eta^2) prefactor specifically corrects the compounding weight-norm growth caused by orthogonal gradients in batch-normalized and spectrally normalized neural network layers.
limitations:
- Deep Relative Trust is a modelling assumption that sets nonlinearity transmission parameters alpha = beta = 1/2, matrix condition numbers kappa = 1, and omits the output loss derivative dL/df.
- Without bounding layer Frobenius norms by their initial values, Fromage can severely overfit training sets on ResNet-18 CIFAR-10 and WikiText-2 Transformer tasks.
