claims:
- claim_id: c-r599-compositional-perturbation-bound-and-deep-relative-trust-lemma
  kind: mechanism
  statement: For an L-layer multilayer perceptron with (alpha, beta)-transmitting nonlinearity and matrices of condition number at most kappa, Theorem 1 bounds relative functional change by ((beta / alpha) kappa^2)^L [prod_{k=1}^L (1 + ||Delta W_k||_F / ||W_k||_F) - 1] and relative Jacobian change analogously (Section 3 & Appendix B, pp. 4, 14-17), which under Deep Relative Trust guarantees loss descent for layerwise perturbations ||Delta W_l||_F / ||W_l||_F <= eta whenever eta < (1 + cos theta_l)^{1/L} - 1 (Lemma 2, pp. 6, 13).
  evidence:
  - source_id: r599-primary-pdf
    locator: Section 3-4, Theorem 1, Lemma 1-2, & Modelling Assumption 1, pp. 4-6; Appendix A-B, pp. 13-17
    relation: supports
- claim_id: c-r599-pythagorean-prefactor-stability-on-scale-invariant-layers
  kind: mechanism
  statement: In batch-normalized or spectrally normalized layers that are invariant to W_l -> (1 + alpha) W_l, the gradient g_l is orthogonal to W_l, so unregularized LARS updates Delta W_l = -eta (||W_l||_F / ||g_l||_F) g_l compound weight norms by ||W_l + Delta W_l||_F^2 = (1 + eta^2) ||W_l||_F^2 at every step; Fromage's prefactor 1 / sqrt(1 + eta^2) exactly cancels this Pythagorean growth without a weight-decay hyperparameter (Section 5 & Figure 2, p. 7).
  evidence:
  - source_id: r599-primary-pdf
    locator: Section 5, Eq. (5)-(6), Algorithm 1, & Figure 2, p. 7
    relation: supports
- claim_id: c-r599-deep-mlp-and-single-lr-benchmark-training
  kind: application
  statement: Fromage trains vanilla ReLU multilayer perceptrons (without batch normalization or skip connections) up to depth L = 50 on MNIST where SGD and Adam fail beyond depth 25 (Figure 3, p. 8), and using a single untuned default learning rate eta = 0.01 across CIFAR-10 ResNet-18, ImageNet ResNet-50, CIFAR-10 cGAN (FID 16 +/- 1 vs Adam 23.7 +/- 0.7), and WikiText-2 Transformer matches or outperforms tuned SGD and Adam baselines (Section 6, Table 1-2, pp. 8-9, 18).
  evidence:
  - source_id: r599-primary-pdf
    locator: Section 6, Figures 3-4 & Table 1, pp. 8-9; Appendix C & Table 2, pp. 18-19
    relation: supports
- claim_id: c-r599-depth-dependent-step-size-and-norm-cap-regularization
  kind: limitation
  statement: On very deep skip-free multilayer perceptrons, Lemma 2 and Figure 3 require decreasing eta as depth L grows (since (1 + cos theta_l)^{1/L} - 1 = O(1 / L)), and on CIFAR-10 ResNet-18 and WikiText-2 Transformer benchmarks Fromage heavily overfits the training set unless each layer's Frobenius norm is constrained not to exceed its initial norm.
  evidence:
  - source_id: r599-primary-pdf
    locator: Section 6-7, Figure 3, pp. 8-9; Appendix C, p. 19
    relation: supports
