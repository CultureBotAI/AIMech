id: AIMech:FromageFrobeniusMatchedGradientDescentOptimization
name: Fromage (Frobenius Matched Gradient Descent)
concept_kind: algorithm
review_status: DRAFT
definition: A layerwise relative-trust optimization algorithm for deep neural networks (Algorithm 1) derived from the deep relative trust gradient breakdown model and neural network descent lemma (Lemma 2) that updates each layer's weight matrix W_l (l = 1, ..., L) with gradient g_l = grad_{W_l} L(W) via W_l <- (1 / sqrt(1 + eta^2)) [W_l - eta (||W_l||_F / ||g_l||_F) g_l], inducing a fixed relative Frobenius perturbation ||Delta W_l||_F / ||W_l||_F = eta per step while preventing compounding norm growth in scale-invariant layers.
identity_notes: 'Distinct from LARS (Round 594) and LAMB (Round 593) by deriving layerwise relative step scaling from a multiplicative compositional perturbation bound on multilayer perceptrons and their layer-to-output Jacobians (Theorem 1 & Modelling Assumption 1: Deep Relative Trust) together with the exact Pythagorean normalization prefactor 1 / sqrt(1 + eta^2), eliminating weight-decay hyperparameter tuning for rescaling-invariant layers.'
aliases:
- Fromage Optimizer
- Frobenius Matched Gradient Descent
- Deep Relative Trust Gradient Descent (Fromage)
