claims:
- claim_id: r371-claim-one-step-error-contraction-and-lyapunov-potential
  kind: mechanism
  statement: Writing the estimation error as epsilon_t = d_t - nabla F(x_t) for L-smooth individuated objectives f(x, xi), the STORM update d_t = nabla f(x_t, xi_t) + (1 - a_t)*(d_{t-1} - nabla f(x_{t-1}, xi_t)) satisfies the one-step variance contraction E[||epsilon_t||^2 / eta_{t-1}] <= E[(1 - a_t)^2 * ||epsilon_{t-1}||^2 / eta_{t-1} + 2*(1 - a_t)^2 * L^2 * eta_{t-1} * ||d_{t-1}||^2 + 2 * a_t^2 * eta_{t-1}^{-1} * ||nabla f(x_t, xi_t) - nabla F(x_t)||^2] (Lemma 2, Lemma 5); combining this with the descent bound F(x_{t+1}) - F(x_t) <= (-eta_t/2 + L*eta_t^2)*||nabla F(x_t)||^2 + (-eta_t/4 + L*eta_t^2)*||d_t||^2 + eta_t * ||epsilon_t||^2 (Lemma 1) in the Lyapunov potential Phi_t = F(x_t) + (1 / (32 * L^2)) * (||epsilon_t||^2 / eta_{t-1}) with a_{t+1} = c * eta_t^2 eliminates the positive L^2 * eta_t * ||d_t||^2 error growth against the negative (-eta_t/4)*||d_t||^2 descent term without requiring checkpoints.
  evidence:
  - source_id: r371-primary-pdf
    locator: Section 3-4, Equations (1)-(2), Algorithm 1, and Lemmas 1, 2, 4, and 5, pp. 3-7; Appendix, Proofs of Lemmas 2 and 5, pp. 11-12
    relation: supports
- claim_id: r371-claim-adaptive-smoothness-and-noise-interpolating-convergence-rate
  kind: mechanism
  statement: With w = max((4*L*k)^3, 2*G^2, (c*k / (4*L))^{3/2}) and c = 100*L^2 + G^2/(7*k^3) where ||nabla f(x, xi)|| <= G, STORM guarantees for x_hat chosen uniformly from x_1, ..., x_T that E[||nabla F(x_hat)||] <= sqrt(E[(1/T)*sum_{t=1}^T ||nabla F(x_t)||^2]) <= O((w^{1/6}*sqrt(M)/T^{1/2} + M^{3/4}/T^{1/2}) + sigma^{1/3} * ln(T)^{2/3} / T^{1/3}) where M = O(F(x_1) - F^* + k^2*c^2*ln(T)) (Theorem 1), automatically interpolating between the deterministic gradient descent rate O(1/sqrt(T)) when noise sigma = 0 and the optimal non-convex stochastic rate O(sigma^{1/3} * ln(T)^{2/3} / T^{1/3}) = O_tilde(1/T^{1/3}) (equivalently O_tilde(sigma/varepsilon^3 + 1/varepsilon^2) oracle queries to reach E[||nabla F(x_hat)||] <= varepsilon) without prior knowledge of sigma (Section 4, Corollary of Theorem 1).
  evidence:
  - source_id: r371-primary-pdf
    locator: Section 1, Table 1, p. 3; Section 4, Theorem 1, Lemmas 3-5, and Proof of Theorem 1, pp. 5-8; Appendix, Proof of Theorem 1, pp. 12-14
    relation: supports
- claim_id: r371-claim-non-adaptive-unbounded-gradient-and-convex-convergence
  kind: scope
  statement: When the noise variance sigma^2 is known, removing the bounded-gradient assumption ||nabla f(x, xi)|| <= G by setting G_t = sigma, w = k^3*(2*L + sigma)^3, and c = 28*L^2 + sigma^2/(7*k^3) yields the non-adaptive bound E[||nabla F(x_hat)||] <= O((k*L + (F(x_1) - F^*)/(k*L))/T^{1/2} + ((F(x_1) - F^*)*sigma/(k*L) + k^2*sigma^2*ln(T + 2))^{1/2} / T^{1/3}) (Theorem 2); furthermore, when F is convex with ||x_1 - x^*|| <= D and a_{t+1} <= 1/2, the same algorithm achieves E[F(x_bar_T) - F(x^*)] = O(1/T^{1/3}) for the iterate average x_bar_T = (1/T)*sum_{t=1}^T x_t (Theorem 3, Appendix C).
  evidence:
  - source_id: r371-primary-pdf
    locator: Section 4, Theorem 2, p. 8; Appendix B-C, Proof of Theorem 2 and Theorem 3, pp. 14-15
    relation: supports
