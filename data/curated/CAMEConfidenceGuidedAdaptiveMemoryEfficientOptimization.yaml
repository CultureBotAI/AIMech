claims:
- claim_id: c-r598-confidence-guided-instability-nmf-scaling
  kind: mechanism
  statement: By measuring the squared deviation U_t = (u_hat_t - m_t)^2 between the current clipped Adafactor update u_hat_t and its EMA m_t and factorizing U_t into rank-1 moving averages R_t = beta_3 R_{t-1} + (1 - beta_3)(U_t + epsilon_2 1_n 1_m^T) 1_m and C_t = beta_3 C_{t-1} + (1 - beta_3) 1_n^T (U_t + epsilon_2 1_n 1_m^T) with S_t = R_t C_t / (1_n^T R_t) (Algorithm 2), CAME suppresses steps when update error is large (low confidence 1 / sqrt(S_t)) and amplifies steps when u_hat_t closely matches m_t, requiring only O(n + m) additional memory over Adafactor.
  evidence:
  - source_id: r598-primary-pdf
    locator: Section 3.2-3.3, Figure 3, Equation (3), & Algorithm 2, pp. 3-5
    relation: supports
- claim_id: c-r598-bert-gpt2-t5-convergence-and-memory-reduction
  kind: application
  statement: CAME reduces optimizer state memory by 47% on BERT-4B (from 30.6 GB for Adam to 16.3 GB, within 1% of Adafactor's 15.9 GB; Figure 7 & Table 1), improves BERT-Large masked LM validation accuracy over Adafactor from 63.1% to 66.5% at batch size 8K and from 61.9% to 68.0% at batch size 32K (improving GLUE/SQuAD average by +0.7/+0.5 points, Table 2), and matches Adam validation perplexity on GPT-2 (50.1 vs Adafactor's 56.9) and T5-Base.
  evidence:
  - source_id: r598-primary-pdf
    locator: Section 4.2-4.5, Figures 5-11 & Tables 1-2, pp. 6-9
    relation: supports
- claim_id: c-r598-extra-nmf-cost-and-missing-formal-proof-limitation
  kind: limitation
  statement: CAME incurs additional per-step computation for the second rank-1 non-negative matrix factorization over U_t compared with Adafactor, exhibits minor accuracy degradation on 32K-batch BERT-Large relative to full-matrix LAMB, and lacks a formal theoretical convergence rate proof.
  evidence:
  - source_id: r598-primary-pdf
    locator: Section 6, Limitations, p. 9
    relation: supports
