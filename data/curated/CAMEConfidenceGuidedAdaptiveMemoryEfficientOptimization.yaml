id: AIMech:CAMEConfidenceGuidedAdaptiveMemoryEfficientOptimization
name: CAME (Confidence-guided Adaptive Memory Efficient Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient adaptive optimization algorithm (Algorithm 2) that extends Adafactor by computing the elementwise squared residual instability matrix U_t = (u_hat_t - m_t)^2 between the RMS-clipped rank-1 second-moment update u_hat_t and its exponential moving average m_t = beta_1 m_{t-1} + (1 - beta_1) u_hat_t, factorizing U_t into row and column moving-average vectors R_t in R^n and C_t in R^m via generalized Kullback-Leibler rank-1 non-negative matrix factorization S_t = R_t C_t / (1_n^T R_t), and scaling the momentum step by the confidence factor 1 / sqrt(S_t) via theta_t = theta_{t-1} - (eta / sqrt(S_t)) m_t.
identity_notes: Distinct from Adafactor (Algorithm 1) in that Adafactor directly applies theta_t = theta_{t-1} - eta m_t without accounting for the deviation between m_t and u_hat_t caused by rank-1 second-moment NMF errors, whereas CAME divides m_t by sqrt(S_t) where S_t is a rank-1 NMF reconstruction of the instability matrix U_t = (u_hat_t - m_t)^2. Distinct from Adam and AdaBelief in that both the second moment v_t and the instability matrix S_t are stored as rank-1 vector factors (r_t, c_t, R_t, C_t) in O(n + m) auxiliary second-order memory rather than O(n m) full matrices.
aliases:
