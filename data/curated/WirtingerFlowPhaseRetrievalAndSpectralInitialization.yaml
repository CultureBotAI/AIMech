claims:
- claim_id: claim-spectral-initialization-weighted-empirical-covariance
  kind: mechanism
  statement: For Gaussian designs $\boldsymbol{a}_r \sim \mathcal{N}(\boldsymbol{0},\boldsymbol{I})$ or admissible Coded Diffraction Patterns satisfying $\mathbb{E}[d]=0$ and $\mathbb{E}[|d|^4] = 2(\mathbb{E}[|d|^2])^2$ (Equation 2.3), the population weighted covariance matrix satisfies $\mathbb{E}[\frac{1}{m}\sum_{r=1}^m y_r\boldsymbol{a}_r\boldsymbol{a}_r^*] = \|\boldsymbol{x}\|^2\boldsymbol{I}_n + \boldsymbol{x}\boldsymbol{x}^*$, and Lemma 7.8 proves that the scaled top eigenvector $\boldsymbol{z}_0$ of $\boldsymbol{Y}$ satisfies $\mathrm{dist}(\boldsymbol{z}_0, \boldsymbol{x}) \le \delta_0\|\boldsymbol{x}\|$ with $\delta_0 \le 1/8$ with high probability once $m \ge c_0 n\log n$ (Gaussian) or $L \ge c_1\log^4 n$ (CDP) (Sections 2.1, 4, and 7.1, Algorithm 1, Equation 2.3, Lemma 7.8).
  evidence:
  - source_id: cls2015-wf-pdf
    locator: Section 2.1 (Algorithm 1, Eq. 2.3, pp. 4-5), Section 4 (pp. 8-9), Section 7.1 (Lemma 7.8, p. 17)
    relation: supports
- claim_id: claim-local-regularity-condition-via-cubic-smoothness-and-curvature
  kind: mechanism
  statement: "Inside the local neighborhood $E(\\boldsymbol{x}) = \\{\\boldsymbol{z} : \\mathrm{dist}(\\boldsymbol{z},\\boldsymbol{x}) \\le \\frac{1}{8}\\|\\boldsymbol{x}\\|\\}$, Lemmas 7.3\u20137.7 prove that uniform concentration of the fourth-moment operator $\\|\\frac{1}{m}\\sum_{r=1}^m |\\boldsymbol{a}_r^*\\boldsymbol{u}|^2\\boldsymbol{a}_r\\boldsymbol{a}_r^* - (\\boldsymbol{I}+2\\boldsymbol{u}\\boldsymbol{u}^*)\\| \\le \\delta$ (Condition 7.9) implies both local smoothness $\\|\\nabla f(\\boldsymbol{z})\\| \\le (1+\\delta)C_{\\max}\\|\\boldsymbol{z}-\\boldsymbol{x}\\|$ and local curvature $\\mathrm{Re}(\\langle\\nabla f(\\boldsymbol{z}), \\boldsymbol{z}-\\boldsymbol{x}\\rangle) \\ge ((1-\\delta)C_{\\min} - \\delta C_{\\max})\\|\\boldsymbol{z}-\\boldsymbol{x}\\|^2$, establishing the Regularity Condition $RC(\\alpha,\\beta,\\frac{1}{8})$ with $\\frac{1}{\\alpha} + \\frac{1}{\\beta}(1+\\delta)^2 C_{\\max}^2 \\le (1-\\delta)C_{\\min} - \\delta C_{\\max}$ (Sections 7.2\u20137.7, Condition 7.9, Lemmas 7.2\u20137.7)."
  evidence:
  - source_id: cls2015-wf-pdf
    locator: Sections 7.2-7.7 (Condition 7.9, Lemmas 7.2-7.7, pp. 17-22)
    relation: supports
- claim_id: claim-geometric-contraction-of-wirtinger-flow
  kind: application
  statement: 'Whenever $f$ satisfies $RC(\alpha,\beta,\frac{1}{8})$ on $E(\boldsymbol{x})$ and $\boldsymbol{z}_0 \in E(\boldsymbol{x})$, Lemma 7.1 and Theorem 3.3 prove that Wirtinger Flow iterates $\boldsymbol{z}_{\tau+1} = \boldsymbol{z}_\tau - \frac{\mu}{\|\boldsymbol{x}\|^2}\nabla f(\boldsymbol{z}_\tau)$ with step size $0 < \mu \le \frac{2}{\beta}$ contract geometrically at every step: $\mathrm{dist}^2(\boldsymbol{z}_{\tau+1}, \boldsymbol{x}) \le (1 - \frac{2\mu}{\alpha})\mathrm{dist}^2(\boldsymbol{z}_\tau, \boldsymbol{x})$ (Section 3, Theorem 3.3, Section 7.2, Lemma 7.1).'
  evidence:
  - source_id: cls2015-wf-pdf
    locator: Section 3 (Theorem 3.3, pp. 6-7), Section 7.2 (Lemma 7.1, pp. 17-18)
    relation: supports
