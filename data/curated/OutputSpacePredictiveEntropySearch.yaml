id: AIMech:OutputSpacePredictiveEntropySearch
name: Output-space Predictive Entropy Search
concept_kind: algorithm
definition: A Bayesian global optimization algorithm that selects evaluations using an approximation to
  information about the latent maximum function value, combining Gaussian expectation-propagation constraints
  at observed inputs with candidate truncation, moment matching and predictive observation entropy.
definition_evidence:
- source_id: hoffman2015
  locator: Sections 2–2.1, PDF pp. 1–3, Equations 2–7
  relation: supports
claims:
- claim_id: maximum-value-information-target
  kind: mechanism
  statement: For a model and domain with a finite attained latent maximum M=max_x f(x), the method targets
    information between M and a prospective observation Y at candidate x. At fixed data and model hyperparameters,
    its ideal acquisition is I(M;Y|D,x)=H(Y|D,x)-E_M[H(Y|D,x,M)] when those entropy terms are well-defined.
    This targets the maximum value rather than the maximizer location used by Predictive Entropy Search.
    Max-value Entropy Search later uses the same ideal value-information target but a different operational
    approximation; shared ideal information does not identify their evaluated acquisitions.
  evidence:
  - source_id: hoffman2015
    locator: Section 2, PDF pp. 1–2, Equations 1–2
    relation: supports
  - source_id: wang2017
    locator: PDF p. 2 acknowledgement of Hoffman and Ghahramani; Section 3, PDF pp. 2–3, Equations 5–6
    relation: supports
- claim_id: observed-latent-ep-constraints
  kind: mechanism
  statement: In the Gaussian-observation formulation, a zero-mean Gaussian-process model gives a Gaussian
    posterior over latent function values at previously queried inputs. For each sampled maximum value
    m, the method applies step factors requiring every one of these latent values to be at most m. Expectation
    propagation replaces the factors with Gaussian site approximations having diagonal site covariance,
    which are combined with the posterior. The finite collection of inequalities is a necessary condition
    for a global maximum m, not the exact event that the function maximum equals m. The source uses these
    constraints as an approximation to that conditioning.
  evidence:
  - source_id: hoffman2015
    locator: Section 2.1, PDF p. 2, the unnumbered observed-latent factorization and Gaussian combination;
      PDF p. 3, Comparison with PES paragraph
    relation: supports
- claim_id: candidate-truncation-and-moment-matching
  kind: mechanism
  statement: The approximate constrained latent Gaussian is propagated to a candidate using Gaussian-process
    prediction, giving mean mu_bar and variance v_bar. For v_bar>0, the method then truncates that scalar
    Gaussian above at m and moment-matches it to a Gaussian. With alpha=(m-mu_bar)/sqrt(v_bar) and r=phi(alpha)/Phi(alpha),
    the matched moments are mu_hat=mu_bar-sqrt(v_bar)*r and v_hat=v_bar*(1-r*(r+alpha)). Here phi and
    Phi denote the standard-normal density and cumulative distribution. These are moments of the selected
    local truncation, not exact global-maximum-conditioned moments. A nondegenerate moment-matched Gaussian
    itself retains positive probability above the truncation threshold.
  evidence:
  - source_id: hoffman2015
    locator: Section 2.1, PDF pp. 2–3, Equations 3–6; original scalar moment and support diagnostic in
      research/discovery/opes-boundaries.py
    relation: supports
- claim_id: noisy-gaussian-entropy-acquisition
  kind: mechanism
  statement: Let v(x|D) be the ordinary posterior latent variance, sigma^2 the independent Gaussian observation-noise
    variance, and m_1,...,m_K a positive number K of approximate maximum samples. Equation 7 computes
    0.5*(log(v(x|D)+sigma^2) - (1/K)*sum_j log(v_hat(x|D,m_j)+sigma^2)). Observation noise is added after
    the latent moment matching. The score uses Gaussian observation entropies and remains an approximation
    to noisy maximum-value information. Its fixed-threshold expression can differ from the local truncated-latent
    entropy expression of Max-value Entropy Search even without observed-latent EP sites. A difference
    in one term does not imply different selected queries for every data set.
  evidence:
  - source_id: hoffman2015
    locator: PDF p. 3, Equation 7; original one-threshold comparison at two noise variances in research/discovery/opes-boundaries.py
    relation: supports
  - source_id: wang2017
    locator: Section 3, PDF p. 3, Equation 6 and its local truncation approximation
    relation: supports
- claim_id: maximum-sampling-and-hyperparameter-averaging
  kind: mechanism
  statement: The finite average requires approximate draws of the latent maximum value. The report refers
    to a sampling strategy similar to Predictive Entropy Search rather than specifying a new exact maximum
    sampler. It also describes sampling Gaussian-process hyperparameters and using a maximum sample for
    each setting. These sampling and model approximations remain part of the acquisition. Averaging fixed-hyperparameter
    information approximations does not in general give exact information under a fully marginalized hyperparameter
    model. The abbreviated report does not establish exact maximum sampling or universal acquisition accuracy.
  evidence:
  - source_id: hoffman2015
    locator: PDF p. 2, acquisition-evaluation step 2 and the opening note of Section 2.1; PDF p. 3, paragraph
      following Equation 7
    relation: supports
- claim_id: bernoulli-observation-extension
  kind: scope
  statement: The paper sketches an extension for binary observations with a logistic or probit link to
    a latent Gaussian process. Laplace or expectation-propagation inference provides Gaussian latent approximations,
    with maximum constraints incorporated into the candidate prediction. Integrating the link against
    the approximate latent distribution gives an observation success probability, whose Bernoulli entropy
    is used in the acquisition. This is observation entropy, not the differential entropy of the latent
    Gaussian. The source describes closed-form probit integration and approximate logistic integration.
    This extension sketch does not guarantee exact inference or the same treatment for every non-conjugate
    likelihood.
  evidence:
  - source_id: hoffman2015
    locator: PDF p. 3, An extension to non-conjugate likelihoods subsection and its final entropy expression
    relation: supports
identity_notes: The pinned author-hosted OPES report defines observed-latent upper constraints via EP,
  candidate truncation and moment matching, then approximate noisy predictive entropy for a finite attained
  maximum value. MES shares its ideal target but not this conditional-inference pathway and entropy approximation;
  PES targets a maximizer location. A one-threshold diagnostic distinguishes formulas without proving
  different decisions for all data. The 2015 catalog attribution and 2016 PDF build are separately retained.
  No acronym alias is adopted; current canonical, frontier and ignored-inclusive evidence is refreshed
  before creation.
