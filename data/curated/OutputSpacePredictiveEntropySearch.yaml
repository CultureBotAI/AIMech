aio_mappings:
- target: AIO:ActiveLearning
  relation: related_match
  rationale: The relationship is through choosing informative queries and obtaining their outputs. The
    pinned AIO term describes a labeling-oriented machine-learning task, whereas this algorithm selects
    objective evaluations for optimization. This is a related mapping, not exact equivalence or an asserted
    subclass, neural-network or layer relationship.
limitations:
- The source is the pinned five-page author-hosted report. The author catalog cites a December 2015 workshop,
  while the PDF has an embedded February 28, 2016 build timestamp. Its advertised longer derivation was
  not located in bounded primary-source searches.
- Finite upper constraints, Gaussian EP sites, candidate moment matching and maximum sampling are separate
  approximations. They do not establish exact conditioning on a global maximum or exact noisy mutual information.
- The displayed matrix formulas use inverse noise variance and matrix inverses. Literal zero noise, singular
  matrices, zero candidate variance and extreme inverse-Mills ratios need separate numerical or limiting
  treatment. The retained zero-noise scalar diagnostic only evaluates the entropy-stage limit, not those
  matrix formulas at zero noise.
- Output-value targeting can avoid a single coordinate-space entropy representation on a disjoint domain.
  The source statement that PES cannot apply to differently dimensional domains is not adopted as an impossibility
  result for mutual information under suitable probability measures.
- The final binary-entropy formula concerns the induced Bernoulli observation distribution. The source
  wording about entropy of the latent Gaussian approximation is not interpreted literally as equality
  of those two entropies.
- The preliminary experiments and unresolved Figure ?? reference do not support a general performance,
  convergence or efficiency claim here. The retained original arithmetic diagnostic does not implement
  EP, optimize an acquisition, fit a model, or reproduce author benchmarks.
