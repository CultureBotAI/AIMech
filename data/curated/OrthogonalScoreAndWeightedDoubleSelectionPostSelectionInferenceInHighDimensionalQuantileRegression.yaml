claims:
- claim_id: density-weighted-instrument-neyman-orthogonality-and-semiparametric-efficiency
  kind: mechanism
  statement: "For the quantile score $\\psi_i(\\alpha, \\beta, v_i) = (\\tau - \\mathbb{I}\\{y_i \\le d_i\\alpha + x_i'\\beta + r_{i\\tau}\\})v_i$, the Gateaux derivative with respect to the nuisance vector $\\beta$ at $(\\alpha_\\tau, \\beta_\\tau)$ is $-\\mathrm{E}[f_\\tau(0 \\mid z_i, d_i)v_i x_i]$. Setting $v_i = w_{i\\tau}(d_i - x_i'\\theta_\\tau)$ with minimax weight $w_{i\\tau} = f_\\tau(0 \\mid z_i, d_i)$ and $\\theta_\\tau = \\arg\\min_\\theta \\mathrm{E}[f_\\tau^2(0 \\mid z_i, d_i)(d_i - x_i'\\theta)^2]$ (Section 2.1, pp. 6\u20137, Equations 2.7\u20132.9) satisfies the exact orthogonality condition $\\mathrm{E}[f_\\tau(0 \\mid z_i, d_i)v_i x_i] = \\mathrm{E}[f_\\tau^2(0 \\mid z_i, d_i)(d_i - x_i'\\theta_\\tau)x_i] = 0$ and minimizes the asymptotic variance $\\sigma_\\tau^2 = \\tau(1-\\tau)\\mathrm{E}[v_i^2] / (\\mathrm{E}[f_\\tau(0 \\mid z_i, d_i)d_i v_i])^2 = \\tau(1-\\tau) / \\mathrm{E}[v_i^2]$ (Equation 2.6, Comment 2.2), whereas an unweighted residual $d_i - x_i'\\vartheta$ fails orthogonality under heteroscedasticity unless multiplied by $f_\\tau^{-1}(0 \\mid z_i, d_i)$ at the cost of strictly larger asymptotic variance."
  evidence:
  - source_id: bck2019-psqr-pdf
    locator: Section 2.1, pp. 5-7, Equations (2.6)-(2.9); Section 2.2, pp. 9-10, Comment 2.2, Equation (2.14)
    relation: supports
- claim_id: first-order-equivalence-of-orthogonal-score-and-weighted-double-selection-under-approximate-sparsity
  kind: mechanism
  statement: "Under Conditions R.1\u2013R.6 (allowing $s^2\\log^3(p \\vee n) = o(n)$ and density estimation error $\\bar{\\mathcal{E}}_f^2\\sqrt{s\\log(p \\vee n)} + s\\bar{\\mathcal{E}}_f\\sqrt{\\log(p \\vee n)} = o(1)$, Section 3.1, pp. 13\u201314), Theorem 1 (Section 3.2, p. 14, Equation 3.22) proves that the Orthogonal Score Estimator $\\widehat{\\alpha}_\\tau$ (Algorithm 2.1) and the Weighted Double-Selection Quantile Estimator $\\widecheck{\\alpha}_\\tau$ (Algorithm 2.2, which refits $\\widehat{f}_i$-weighted quantile regression on $\\widecheck{T} = \\widehat{S}_y \\cup \\widehat{S}_d$ without forming the score criterion $L_n(\\alpha)$) satisfy the identical first-order Bahadur expansion $\\sigma_n^{-1}\\sqrt{n}(\\widehat{\\alpha}_\\tau - \\alpha_\\tau) = \\frac{\\sigma_n^{-1}}{\\mathrm{E}[v_i^2]}\\frac{1}{\\sqrt{n}}\\sum_{i=1}^n \\psi_i(\\alpha_\\tau, \\beta_\\tau, v_i) + o_P(1) \\xrightarrow{d} N(0, 1)$ and $\\sigma_n^{-1}\\sqrt{n}(\\widecheck{\\alpha}_\\tau - \\alpha_\\tau) = \\frac{\\sigma_n^{-1}}{\\mathrm{E}[v_i^2]}\\frac{1}{\\sqrt{n}}\\sum_{i=1}^n \\psi_i(\\alpha_\\tau, \\beta_\\tau, v_i) + o_P(1) \\xrightarrow{d} N(0, 1)$, so $\\sqrt{n}(\\widehat{\\alpha}_\\tau - \\widecheck{\\alpha}_\\tau) = o_P(1)$."
  evidence:
  - source_id: bck2019-psqr-pdf
    locator: Section 2.2, pp. 7-9, Algorithms 2.1-2.2; Section 3.1-3.2, pp. 13-16, Conditions R.1-R.6, Theorem 1, Corollaries 1-2, Equations (3.22)-(3.23); Appendix A, pp. 21-27
    relation: supports
- claim_id: pivotal-self-normalized-penalties-and-higher-order-quantile-quotient-density-estimation
  kind: scope
  statement: "Comment 2.1 (Section 2.2, p. 9, Equations 2.11\u20132.12) specifies pivotal penalty levels $\\lambda_\\tau = 1.1\\sqrt{n\\tau(1-\\tau)}\\,\\Phi^{-1}(1 - \\gamma / (2p))$ with standardized loadings $\\widehat{\\gamma}_{\\tau,j} = \\sqrt{\\mathrm{E}_n[x_{ij}^2]}$ for outcome $\\ell_1$-QR and $\\lambda = 1.1\\sqrt{n}\\,2\\Phi^{-1}(1 - \\gamma / (2p))$ with self-normalized heteroscedastic loadings $\\widehat{\\Gamma}_{\\tau,j} = \\sqrt{\\mathrm{E}_n[\\widehat{f}_i^2 x_{ij}^2(\\widehat{f}_i d_i - \\widehat{f}_i x_i'\\widehat{\\theta}_\\tau)^2]}$ for the auxiliary treatment projection. To satisfy the density rate condition R.6 when $s$ grows with $n$, Section 2.2 (pp. 10\u201311, Equations 2.15\u20132.16) estimates $f_i = 1 / Q^{(1)}(\\tau \\mid z_i, d_i)$ from finite-difference quotients of neighboring conditional quantile fits $\\widehat{Q}(\\tau \\pm h \\mid z_i, d_i)$, reducing bias from $O(h^2)$ for the second-order central difference $2h / \\{\\widehat{Q}(\\tau + h) - \\widehat{Q}(\\tau - h)\\}$ (Equation 2.15) to $O(h^4)$ via fourth-order Richardson extrapolation $h / \\left[\\frac{2}{3}\\{\\widehat{Q}(\\tau + h) - \\widehat{Q}(\\tau - h)\\} - \\frac{1}{12}\\{\\widehat{Q}(\\tau + 2h) - \\widehat{Q}(\\tau - 2h)\\}\\right]$ with bandwidth $h = O(s^{1/2}(\\log p)^{1/2}n^{-1/2} \\wedge s^{1/10}(\\log p)^{1/10}n^{-1/10})$."
  evidence:
  - source_id: bck2019-psqr-pdf
    locator: Section 2.2, pp. 9-11, Comments 2.1-2.3, Equations (2.11)-(2.16); Supplementary Appendix Section 2, pp. 34-43, Lemma 8
    relation: supports
