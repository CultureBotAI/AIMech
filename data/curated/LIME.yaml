name: Local interpretable model-agnostic explanations
definition: A prediction-explanation method fitting an interpretable surrogate to locally weighted samples
  of a model's behavior.
concept_kind: algorithm
identity_notes: LIME is a local surrogate explanation procedure, not an inherently explainable model,
  a guarantee of global fidelity, or the separate SP-LIME representative-selection method.
aio_mappings:
- target: AIO:ExplainableLLM
  relation: related_match
  rationale: Both concern explaining predictions, but LIME is a general post-hoc algorithm rather than
    a language-model class; the mapping makes no LLM-specific efficacy assertion.
limitations:
- The source explicitly distinguishes local fidelity from global fidelity.
- Choice of interpretable representation, neighborhood and surrogate family is part of the method's scope;
  explanations are not a general certification of trustworthiness.
