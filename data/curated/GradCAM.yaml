name: Gradient-weighted class activation mapping
definition: A convolutional-network localization method weighting activation maps by spatially averaged
  gradients of a selected target output.
concept_kind: algorithm
identity_notes: Grad-CAM computes a coarse activation-space localization map. It differs from architecture-restricted
  CAM and from Guided Grad-CAM's additional input-space fusion.
limitations:
- Map resolution follows the selected convolutional layer, and ReLU retains positive weighted contributions.
- A localization map is not a proof of causal influence or universal faithfulness; evaluation claims are
  not curated here.
aliases:
- Grad-CAM
