claims:
- claim_id: fedkd-adaptive-mutual-distillation-and-hidden-alignment-mechanism
  kind: mechanism
  statement: On each client i, FedKD trains the local teacher T_i and shared student S simultaneously using unified losses L_{t,i} = L_{t,i}^d + L_{t,i}^h + L_{t,i}^t and L_{s,i} = L_{s,i}^d + L_{s,i}^h + L_{s,i}^t, where both the mutual soft-label KL divergence terms KL(y_i^s, y_i^t), KL(y_i^t, y_i^s) and the hidden-state and self-attention MSE alignment term MSE(H_i^t, W_i^h H^s) + MSE(A_i^t, A^s) are scaled by 1 / (L_{t,i}^t + L_{s,i}^t) so that distillation weight is suppressed when task cross-entropy losses are large and amplified as predictions become accurate.
  evidence:
  - source_id: r504-primary-pdf
    locator: Section 3.2 Federated Knowledge Distillation, Eqs. (1)-(7), p. 4; Appendix A.3 Algorithm 1 lines 25-31, p. 12
    relation: supports
- claim_id: fedkd-dynamic-svd-gradient-approximation-and-complexity-scope
  kind: scope
  statement: Before uploading or broadcasting student gradients g_i in R^{P x Q} (with P >= Q), FedKD factorizes g_i approx U_i Sigma_i V_i retaining the smallest number K of singular values satisfying (sum_{m=1}^K sigma_m^2) / (sum_{m=1}^Q sigma_m^2) > T(t) with linear energy schedule T(t) = T_start + (T_end - T_start) t for t in [0, 1]; whenever P K + K^2 + K Q < P Q, communication cost scales as O(R |Theta^s| / rho) with compression ratio rho = P Q / (P K + K^2 + K Q) > 1 and |Theta^s| << |Theta^t|, while total client/server computation scales as O(R D |Theta^t| + R D |Theta^s| + R P Q^2).
  evidence:
  - source_id: r504-primary-pdf
    locator: Section 3.3 Dynamic Gradients Approximation, Eqs. (8)-(9), and Section 3.4 Complexity Analysis, p. 5
    relation: supports
- claim_id: fedkd-local-teacher-compute-and-energy-threshold-sensitivity-limitation
  kind: limitation
  statement: Each client must locally store and backpropagate through both the full-size teacher model T_i and the student model S plus compute per-round SVD factorizations (incurring O(R D |Theta^t| + R D |Theta^s| + R P Q^2) local compute), and setting the starting SVD energy threshold T_start < 0.95 causes a sharp drop in downstream model accuracy due to excessive early gradient truncation (Section 3.4, p. 5; Section 4.5, Fig. 5, p. 8).
  evidence:
  - source_id: r504-primary-pdf
    locator: Section 3.4 Complexity Analysis, p. 5; Section 4.5 Impact of Energy Threshold, Fig. 5, p. 8
    relation: supports
- claim_id: fedkd-pretrained-language-model-news-and-biomedical-nlp-application
  kind: application
  statement: Applied to federated fine-tuning and distillation of pre-trained Transformer language models (12-layer UniLM local teachers with 2-layer and 4-layer student submodels) for personalized news recommendation (MIND) and adverse drug reaction tweet classification (SMM4H).
  evidence:
  - source_id: r504-primary-pdf
    locator: Section 4 Experiments, Tables 1-3, Figs. 2-7, pp. 5-8
    relation: supports
