id: AIMech:FedKdCommunicationEfficientFederatedLearningViaKnowledgeDistillation
name: 'FedKD: Communication-Efficient Federated Learning via Knowledge Distillation'
concept_kind: algorithm
review_status: DRAFT
definition: "A communication-efficient federated learning algorithm (FedKD; Wu, Wu, Lyu, Huang, and Xie, Nature Communications 2022) in which each client i maintains a large local private teacher (mentor) model T_i with parameters Theta_i^t and a smaller shared student (mentee) model S with parameters Theta^s that are trained reciprocally on private local data via task-loss-gated adaptive mutual distillation\u2014combining cross-entropy task losses L_{t,i}^t and L_{s,i}^t with soft-label KL losses L_{t,i}^d = KL(y_i^s, y_i^t) / (L_{t,i}^t + L_{s,i}^t), L_{s,i}^d = KL(y_i^t, y_i^s) / (L_{t,i}^t + L_{s,i}^t) and hidden-state/attention alignment loss L_{t,i}^h = L_{s,i}^h = (MSE(H_i^t, W_i^h H^s) + MSE(A_i^t, A^s)) / (L_{t,i}^t + L_{s,i}^t)\u2014while communicating only the student gradients g_i = dL_{s,i} / dTheta^s compressed by dynamic truncated SVD g_i approx U_i Sigma_i V_i under a linearly increasing singular-value energy threshold T(t) = T_start + (T_end - T_start) t."
identity_notes: Distinct from proxy-dataset federated ensemble distillation methods such as FedMD (AIMech:FedMdHeterogeneousFederatedLearningViaPublicDatasetModelDistillation; Li & Wang, 2019) and FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning; Lin et al., NeurIPS 2020), which require a shared or unlabeled public dataset to exchange or ensemble logits; FedKD requires no shared dataset and instead exchanges SVD-factorized gradients of a compact local student model that mutually distills with each client's private large teacher model. Distinct from FedGKT (AIMech:FedGktGroupKnowledgeTransferForEdgeFederatedLearning; He et al., 2020), which offloads a large classifier to the server and exchanges intermediate feature maps and logits.
aliases:
- FedKD
- Adaptive Mutual Distillation with Dynamic SVD Gradient Compression Federated Learning
- Communication-Efficient Federated Learning via Knowledge Distillation
