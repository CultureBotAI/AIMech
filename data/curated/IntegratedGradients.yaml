name: Integrated gradients
definition: A feature-attribution method that integrates a prediction's input gradients along the straight
  path from a chosen baseline to the input.
concept_kind: mathematical_method
identity_notes: Straight-path gradient integration differs from a gradient at one input, layer-wise contribution
  propagation and Shapley averaging across feature orderings.
limitations:
- Attributions depend on the baseline; an arbitrary zero-score baseline need not give a meaningful absence
  of signal.
- Numerical integration is approximate. This record makes no universal causal-faithfulness or superiority
  claim.
