limitations:
- Requires dedicating the initial gradient evaluation g_0 to initializing the second-moment state v_0 = g_0 circ g_0 before normalized momentum updates begin at t = 1.
- Unclipped ADOPT (Algorithm 3) relies on bounded stochastic gradients (Assumption 4) for worst-case theoretical guarantees unless augmented with the c_t = c_0 t^{1/4} clipping operator of Clipped ADOPT (Algorithm 2).
