claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: Encoder blocks add an unmodified input to a transformed branch using learned linear maps,
    ReLU and set normalization. Set normalization uses a mean and variance over each set's elements and
    feature coordinates, followed by feature-specific scale and bias.
  evidence:
  - source_id: original-paper
    locator: Section 4 opening and Sections 4.1–4.3, Figure 2 and the DS++ block equation, PDF pp. 4–6
