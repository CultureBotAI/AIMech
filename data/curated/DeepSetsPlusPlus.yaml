name: Deep Sets++
definition: A Deep Sets architecture revision whose encoder combines identity residual paths with set
  normalization while retaining the original aggregation and decoder.
concept_kind: architecture
identity_notes: Deep Sets++ is the encoder revision defined by Zhang and colleagues, not an alternate
  spelling of Deep Sets or a claim that every deeper set network uses this construction.
limitations:
- The written standardization assumes a nonzero denominator; this record does not specify numerical handling
  of degenerate or padded sets.
- The change concerns the encoder. Its construction does not guarantee improved training or accuracy for
  every task.
