name: Deep deterministic policy gradient
aliases:
- DDPG
definition: An off-policy actor–critic method for continuous control using neural function approximators
  and deterministic policy gradients.
concept_kind: algorithm
identity_notes: DDPG combines deterministic policy gradients with deep actor/critic approximators, replay
  and target networks. It is distinct from stochastic maximum-entropy SAC and discrete-action DQN.
limitations:
- Exploration in the original algorithm adds noise to the actor's action; a deterministic actor does not
  remove the need for exploration.
- The source's simulated-control results do not establish universal stability or performance in every
  continuous-action environment.
