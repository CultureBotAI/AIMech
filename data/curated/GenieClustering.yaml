claims:
- claim_id: inequality-triggered-merging
  kind: mechanism
  statement: Start with singleton clusters. If the current cluster-size inequality is at or below a threshold
    g, choose a minimum single-link-distance pair. Otherwise, restrict eligible pairs to those containing
    at least one cluster of globally minimum size, then minimize the same distance. The paper allows an
    inequality index such as normalized Gini or Bonferroni; its implementation study uses Gini. For the
    paper’s g in (0,1], g=1 recovers single linkage.
  evidence:
  - source_id: genie2016
    locator: Sections2.2–3.1, PDF pp.5–8, Equations1–2
    relation: supports
  - source_id: genie-merge
    locator: HClustMSTbasedGini::compute, conditional edge exclusion
    relation: supports
- claim_id: mst-and-conditional-edge-selection
  kind: mechanism
  statement: The method can operate on a minimum spanning tree of the complete dissimilarity graph. Maintain
    component sizes and select a minimum eligible remaining tree edge; an edge skipped during a small-cluster
    correction must remain available when eligibility changes. The inspected implementation caches skipped
    edges and restores them when the minimum component size changes or the inequality condition no longer
    requires correction.
  evidence:
  - source_id: genie2016
    locator: Section4, Theorem1 and Figure5, PDF pp.14–17
    relation: supports
  - source_id: genie-merge
    locator: HClustMSTbasedGini::compute, pq_cache restoration
    relation: supports
- claim_id: distance-and-storage-scope
  kind: scope
  statement: The base linkage requires symmetric nonnegative dissimilarities with zero self-distance.
    The inspected Prim-style tree builder computes each unordered point-pair distance once and maintains
    linear auxiliary arrays without materializing a full distance matrix. The paper’s alternative VP-tree
    acceleration uses the triangle inequality for pruning; it is not a guarantee for every dissimilarity,
    dimension or implementation.
  evidence:
  - source_id: genie2016
    locator: Introduction, PDF p.2; Sections4.1–4.3, Figures6–7, PDF pp.17–22
    relation: supports
  - source_id: genie-merge
    locator: HClustMSTbasedGini::getMST
    relation: supports
- claim_id: threshold-and-height-boundaries
  kind: scope
  statement: The threshold triggers a correction from the current partition; it does not impose a hard
    ceiling or require every corrective merge to lower inequality. Raw merge distances can decrease. The
    pinned Genie1.0.0 implementation marks corrective distances internally, and its R wrapper adjusts
    displayed heights by interpolation and cumulative maxima. Those plotted heights are not identical
    to the raw selected dissimilarities.
  evidence:
  - source_id: genie2016
    locator: Section3.1, PDF p.8; Section4.1, PDF pp.16–17
    relation: supports
  - source_id: genie-merge
    locator: HClustMSTbasedGini::compute, signed res.link distance
    relation: supports
  - source_id: genie-wrapper
    locator: hclust2, final height adjustment
    relation: supports
  - source_id: genie-description
    locator: Package, Version and Date fields
    relation: supports
- claim_id: worked-example-discrepancy
  kind: scope
  statement: The paper’s Example1 states that points 0,1,3,6,10 with Gini threshold 0.3 merge the last
    two singletons at the third step. Its formal rule, Figure5 and inspected original implementation instead
    permit the nearer merge between the size-three cluster and point 6, because one endpoint is a smallest
    cluster. The worked example is therefore retained as a source inconsistency rather than used to redefine
    the algorithm.
  evidence:
  - source_id: genie2016
    locator: Section3.1, PDF pp.7–8; Figure5, PDF p.15; Example1, PDF p.16
    relation: supports
  - source_id: genie-merge
    locator: HClustMSTbasedGini::compute, both-size-greater-than-minimum exclusion
    relation: supports
- claim_id: reported-evaluation
  kind: performance
  statement: The paper reports Fowlkes–Mallows agreement on 29 benchmark datasets, using the known reference
    number of clusters to cut each hierarchy and medians over ten input permutations. Gini threshold 0.2
    has the highest reported aggregate mean and median among the nine compared hierarchical methods, but
    individual datasets favor other methods. These comparisons do not establish universal outlier recovery,
    accuracy or runtime superiority.
  evidence:
  - source_id: genie2016
    locator: Sections3.2–3.3, PDF pp.9–14, Tables1–3
    relation: supports
  evaluation:
    task: External agreement between a hierarchy cut and a reference clustering.
    dataset_and_split: 29 datasets, comprising 21 Euclidean and eight non-Euclidean sets; no held-out
      threshold-selection split established. SIPU selection excludes datasets above 10000 points and cases
      where all methods performed perfectly.
    model_and_version: Original Genie linkage, as described in the 2022 arXiv deposit of the 2016 paper;
      thresholds 0.2 through 0.6. Historical genie and later genieclust are not equated.
    metric_and_units: Fowlkes–Mallows index in [0,1]; per-dataset median over ten randomly permuted input
      orders.
    result: Table2 reports mean 0.850 and median 0.921 for Gini threshold 0.2. These are aggregates over
      the selected 29 datasets, not per-dataset guarantees.
    baseline: Single, complete, average and Ward linkage, with five Genie thresholds; the separate 21-set
      comparison also includes k-means and BIRCH.
    conditions: Each hierarchy is cut at the reference cluster count. Ties can change results with input
      order. Threshold comparisons use the same benchmark collection.
    uncertainty: No datasets or benchmarks were executed. Genuine unequal cluster sizes can make low thresholds
      harmful; neither an unbiased tuning estimate nor a statistical superiority test is established here.
