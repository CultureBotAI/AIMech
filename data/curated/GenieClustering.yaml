aio_mappings:
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: The algorithm constructs nested partitions. The AIO target denotes the task, not this inequality-conditioned
    linkage or an equivalent algorithm.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: Merge selection uses distances and cluster sizes without reference labels. Benchmark labels
    determine evaluation cuts, which is separate from the merge rule.
limitations:
- The record covers the original linkage and inspected Genie1.0.0 source revision. Later genieclust mutual-reachability,
  noise-label, deadwood and other extensions are not aliases or inherited guarantees.
- The current-partition inequality trigger can be exceeded after a merge, and a corrective merge can increase
  it. Outlier resistance is an empirical motivation, not a proof of recovery or an explicit noise classifier.
- Paper Example1 conflicts with the formal OR eligibility rule and inspected merge predicate. Curator
  exact arithmetic makes the distinction explicit without executing the author implementation.
- Finite checks compare full eligible-pair and MST selection on 2880 distinct-weight and 2916 tied four-point
  cases and verify Gini update arithmetic. They do not prove universal tie equivalence, floating-point
  correctness or statistical performance.
- The normalized Gini formula is undefined for one remaining cluster. The curator calculation stops its
  inequality assessment there; the implementation’s final normalization and clamping are not certified
  numerically.
- The paper defines g in (0,1], while the inspected R documentation also permits zero. Distance ties and
  input order can affect the hierarchy. Plot-height adjustment must not be mistaken for raw merge distances.
- Only the Prim route has the stated once-per-unordered-pair property. The paper reports VP-tree cases
  exceeding that pair count, and high-dimensional speedups are conditional. Historical runtime minima
  and individual Ward comparisons are not transferred to present hardware.
- 'All 30 pages of arXiv2209.05757v1 and the cited pinned code files were read. Static inspection and
  curator arithmetic only: no author R/C++ execution, training, benchmark replication or later implementation
  audit.'
