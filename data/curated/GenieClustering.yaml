id: AIMech:GenieClustering
name: Genie clustering
aliases:
- Genie linkage
- Genie hierarchical clustering
concept_kind: algorithm
definition: An agglomerative clustering algorithm that normally selects a nearest pair by single-link
  distance and, when cluster-size inequality exceeds a threshold, restricts that selection to pairs containing
  a globally smallest cluster.
identity_notes: Compared all 442 pinned AIO and 656 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 30, 0, 0 lines. All distinct match contents were
  read, including pending discovery entries and source-reading observations. Recovery hits concern pending
  Genie discovery notes and primary-source context; none identifies an existing standalone Genie record.
  Both other checkouts returned no matches including ignored and hidden files. Semantic matching covered
  26 AIO and 173 native definitions, all read; unchanged definitions were byte-compared with the preceding
  full assessment. 9 full annotated AIO node/edge/generated contexts and 5 full native records were inspected.
  Retain the original inequality-triggered single-link merge rule. It differs from fixed linkage-preserving
  chains, global cached-bound search, Ward variance minimization, BIRCH compression and RS tree pruning.
  Genieclust names a later software package with extensions, not an exact alias for all original-method
  claims.
