id: AIMech:RandProxPrimalDualOptimizationWithRandomizedProximalUpdates
name: RandProx (Primal-Dual Optimization with Randomized Proximal Updates)
concept_kind: algorithm
review_status: DRAFT
definition: A variance-reduced randomized primal-dual proximal splitting algorithm (Condat & Richtarik 2023, Sections 2-3, Equations 4-11, Algorithm 1) for composite monotone inclusion and convex optimization min_x {f(x) + g(x) + h(K x)} that generalizes Primal-Dual Davis-Yin (PDDY) by replacing the deterministic dual proximity step hat_u^{t+1} = prox_{tau h*}(u^t + tau K hat_x^t) with an underrelaxed unbiased randomized operator update u^{t+1} = u^t + (1 / (1 + omega)) R^t(hat_u^{t+1} - u^t) satisfying E[R^t(r)] = r and E[||R^t(r) - r||^2] <= omega ||r||^2, followed by the primal correction x^{t+1} = hat_x^t - gamma (1 + omega) K*(u^{t+1} - u^t).
identity_notes: Distinct from ProxSkip / Scaffnew (AIMech:ProxSkipLocalGradientStepsWithAcceleratedCommunicationSkipping, Mishchenko et al. 2022), which is recovered as the special case of RandProx where g = 0, K = I, h is a single indicator/regularization function, and R^t is a Bernoulli coin flip, whereas RandProx handles a third composite term g(x), arbitrary bounded linear operators K, multi-block separable sum structures h_m(K_m x), and general unbiased stochastic compression/sampling operators R^t.
aliases:
