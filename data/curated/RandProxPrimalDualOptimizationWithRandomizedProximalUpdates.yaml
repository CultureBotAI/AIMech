claims:
- claim_id: r451-randomized-dual-proximal-update-and-variance-reduction-mechanism
  kind: mechanism
  statement: Because the randomized operator R^t is applied to the dual difference hat_u^{t+1} - u^t, which converges to zero as (x^t, u^t) -> (x*, u*) where u* in partial h(K x*) and 0 in nabla f(x*) + partial g(x*) + K* u*, the variance E[||R^t(hat_u^{t+1} - u^t) - (hat_u^{t+1} - u^t)||^2] <= omega ||hat_u^{t+1} - u^t||^2 vanishes automatically at the solution without external control variates, achieving linear convergence E[Psi^t] <= c^t Psi^0 for strongly convex f (Theorems 1-3).
  evidence:
  - source_id: r451-primary-pdf
    locator: Section 3.1 Presentation of RandProx & Section 3.2 Linear Convergence (Theorems 1-3, Equations 5-11), pp. 4-6
    relation: supports
- claim_id: r451-unification-of-point-saga-proxskip-splitskip-and-randprox-fl
  kind: mechanism
  statement: Varying the operator R^t (Bernoulli skip, coordinate/block sampling, unbiased vector quantization/sparsification) and problem splitting (f, g, h, K) unifies Point-SAGA, Stochastic Decoupling Method (SDM), ProxSkip, SplitSkip, and communication-skipped + compressed federated learning (RandProx-FL and RandProx-Minibatch, Section 5, Algorithms 3-4, Theorems 10-11).
  evidence:
  - source_id: r451-primary-pdf
    locator: Section 4 Special Cases of RandProx & Section 5 Application to Federated Learning (Algorithms 3-4, Theorems 10-11), pp. 6-9
    relation: supports
- claim_id: r451-primal-dual-step-size-coupling-and-operator-norm-limitation
  kind: limitation
  statement: Linear convergence requires step sizes gamma in (0, 2/L_f) and tau > 0 to satisfy the coupled stability bound gamma * tau * (1 + omega) * ||K||^2 <= 1 (or block-weighted norms under coordinate sampling), requiring knowledge of the variance factor omega and operator norm ||K||.
  evidence:
  - source_id: r451-primary-pdf
    locator: Section 3.2 Theorem 1 & Theorem 2 Step-Size Conditions, pp. 5-6
    relation: supports
- claim_id: r451-composite-splitting-and-compressed-federated-optimization-application
  kind: application
  statement: Applied to composite convex splitting with costly proximal or linear operators and to federated learning combining local training steps, partial client participation, and uplink communication compression.
  evidence:
  - source_id: r451-primary-pdf
    locator: Section 5 Application to Federated Learning & Appendix Experiments, pp. 8-9
    relation: supports
