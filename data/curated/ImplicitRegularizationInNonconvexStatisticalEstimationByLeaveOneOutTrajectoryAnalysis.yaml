claims:
- claim_id: claim-leave-one-out-trajectory-recipe-in-region-of-incoherence-and-contraction
  kind: mechanism
  statement: "When restricted strong convexity and smoothness hold on a Region of Incoherence and Contraction (RIC) around the ground truth $\\boldsymbol{x}^\\star$ (Conditions 1A\u20131C) and the leave-one-out gradient difference $\\|\\nabla f(\\boldsymbol{x}) - \\nabla f^{(l)}(\\boldsymbol{x})\\|_2$ is small (Condition 2A), Theorem 5 proves by mathematical induction on iteration $t$ that vanilla gradient descent simultaneously contracts linearly in $\\ell_2$ norm and maintains $\\ell_2$ proximity $\\|\\boldsymbol{x}^t - \\boldsymbol{x}^{t,(l)}\\|_2$ to the leave-one-out trajectory $\\boldsymbol{x}^{t,(l)}$, which decouples statistical dependence and preserves incoherence without projection (Section 2, Theorem 5, pp. 466\u2013470)."
  evidence:
  - source_id: mwcc2020-impreg-pdf
    locator: Section 2, Conditions 1A-2B and Theorem 5 (pp. 466-470)
    relation: supports
- claim_id: claim-unregularized-wirtinger-flow-phase-retrieval-linear-convergence
  kind: mechanism
  statement: For Gaussian phase retrieval with $m \ge C n\log n$ measurements, Theorem 1 and Lemma 1 prove that unregularized Wirtinger gradient descent from spectral initialization satisfies $\text{dist}(\boldsymbol{x}^t, \boldsymbol{x}^\star) \le (1 - \eta/2)^t \delta\|\boldsymbol{x}^\star\|_2$, $\max_{1\le l\le m} \|\boldsymbol{x}^t - \boldsymbol{x}^{t,(l)}\|_2 \lesssim \sqrt{(\log n)/m}\|\boldsymbol{x}^\star\|_2$, and $\max_{1\le l\le m}|\boldsymbol{a}_l^*(\boldsymbol{x}^t - \boldsymbol{x}^\star)| \lesssim \sqrt{\log m}\|\boldsymbol{x}^\star\|_2$ across all iterations $0 \le t \le T_0 = n^c$ (Section 1.3.1 Theorem 1, Section 3 Lemma 1).
  evidence:
  - source_id: mwcc2020-impreg-pdf
    locator: Section 1.3.1 (Theorem 1, p. 458), Section 3 (Lemma 1 and Proof, pp. 470-476)
    relation: supports
- claim_id: claim-projection-free-nonconvex-matrix-completion-and-blind-deconvolution
  kind: application
  statement: "For rank-$r$ positive semidefinite matrix completion under sampling rate $p \\gtrsim \\text{poly}(\\mu, r, \\kappa)\\log^3(n)/n$ (Theorem 2) and subspace blind deconvolution under $m \\gtrsim \\mu^2 n\\log^9 m$ (Theorems 3\u20134), vanilla factored gradient descent without projection onto incoherence sets contracts linearly in Frobenius/Euclidean norm and entrywise $\\|\\cdot\\|_{2,\\infty}$ norm down to the optimal noise floor (Sections 1.3.2\u20131.3.3, Theorems 2\u20134, Sections 4\u20135)."
  evidence:
  - source_id: mwcc2020-impreg-pdf
    locator: Sections 1.3.2-1.3.3 (Theorems 2-4, pp. 460-464), Sections 4-5 (pp. 476-491)
    relation: supports
