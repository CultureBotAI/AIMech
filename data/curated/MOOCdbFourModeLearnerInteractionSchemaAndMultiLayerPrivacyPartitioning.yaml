id: AIMech:MOOCdbFourModeLearnerInteractionSchemaAndMultiLayerPrivacyPartitioning
name: MOOCdb Four-Mode Learner Interaction Schema and Multi-Layer Privacy Partitioning
concept_kind: preprocessing_method
review_status: DRAFT
definition: "A cross-platform data standardization, feature-engineering, and privacy-partitioning preprocessing method for Massive Open Online Course (MOOC) behavioral telemetry that transforms heterogeneous raw logs into four relational interaction mode sub-schemas \u2014 observing (many-to-many URL-to-URI resource browsing events), submitting (tree-structured problem hierarchies, multi-attempt submissions, and decoupled multi-grader [0,1]-normalized assessments), collaborating (self-referential forum/wiki interaction trees), and feedback (resource-linked survey responses) \u2014 while decomposing learner identifiers across a three-layer hierarchy (global_user_id -> course_user_id -> four mode-specific user IDs) that defines six access-control data partitions."
identity_notes: No AIO class represents MOOCdb's four-mode behavioral telemetry relational schema or three-layer privacy partitioning; DataPreparation (AIO:DataPreparation) is the closest broad match covering structured preparation, normalization, and anonymization of raw interaction logs for machine learning.
aliases:
- MOOCdb Standardized Relational Learner Telemetry Schema
- MOOCdb Four-Mode Behavioral Interaction and Three-Layer User Anonymization Framework
