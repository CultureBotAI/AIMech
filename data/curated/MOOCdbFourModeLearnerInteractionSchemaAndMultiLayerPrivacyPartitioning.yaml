claims:
- claim_id: four-mode-relational-telemetry-decomposition-and-hierarchical-tree-encoding
  kind: mechanism
  statement: 'MOOCdb normalizes learner interactions across Coursera and edX into four lossless transactional sub-schemas (Section 4.1-4.4, Figures 3-8, 17): (1) observing mode, which decouples webpage container URLs (`urls`) from embedded resource URIs (`resources`) via a many-to-many `resources_urls` join table; (2) submitting mode, which encodes arbitrary module-problem-subproblem hierarchies as trees via `(problem_id, problem_parent_id, order_id)` (Figure 4) and decouples `submissions` from multi-grader [0, 1]-normalized `assessments` (Figure 5); (3) collaborating mode, which stores forum threads, votes, and wiki edits as per-student transactions with self-referential `collaboration_parent_id` links (Figures 6-7); and (4) feedback mode (`surveys`, `questions`, `answers`, `feedbacks`, Figure 8).'
  evidence:
  - source_id: r840-primary-pdf
    locator: Section 2, p. 4; Section 4.1-4.4, Figures 2-8, pp. 6-13; Figure 17, p. 24
    relation: supports
- claim_id: three-layer-localized-user-id-anonymization-and-six-partition-access-control
  kind: mechanism
  statement: To control cross-course and intra-course linkability without mutating interaction tables, MOOCdb separates `user_pii` (`global_user_id`) from `global_user_table` (`global_user_id` -> per-course `course_user_id`) and `course_user_table` (`course_user_id` -> four distinct mode identifiers `observing_user_id`, `submitting_user_id`, `collaborating_user_id`, `feedback_user_id`, Figures 9-10), inducing six access-control partitions (Multi-course, Single-course, and Table/Mode-level, each with or without the `collaborations` table, Figure 11).
  evidence:
  - source_id: r840-primary-pdf
    locator: Section 5, Figures 9-11 and Example 5.1, pp. 13-16
    relation: supports
- claim_id: mitx-6002x-tenfold-compression-mooc-en-images-cube-and-bkt-irt-feature-foundry-application
  kind: application
  statement: Applied to MITx 6.002x (154,763 registrants, 132,286,335 observed events in 6,120 MB and 6,313,050 submissions in 341 MB), MOOCdb reduces storage by over 10x relative to a 70 GB name-value transcription and accelerates behavioral queries by ~10x, powering the MOOC En Images 3-axis analytics framework (Time x Student Cohorts x Space, Figures 13-14) and standardized exports for Bayesian Knowledge Tracing (BKT) and Item Response Theory (IRT).
  evidence:
  - source_id: r840-primary-pdf
    locator: Section 6-7, Figures 12-16, pp. 17-22
    relation: supports
- claim_id: public-forum-timestamp-correlation-and-cross-course-profile-reidentification-limitation
  kind: limitation
  statement: Even when `user_pii` and `course_user_table` are withheld (Partition 4, Mode Table access), releasing the `collaborations` table alongside `observed_events` permits re-identification of forum-posting learners via timestamp correlation between forum post timestamps and forum-visit events in `observed_events`; similarly, multi-course access without `collaborations` (Partition 3) remains vulnerable to profile-intersection de-identification when learners publicly disclose course combinations and grades (Example 5.1, pp. 14-17).
  evidence:
  - source_id: r840-primary-pdf
    locator: Section 3, pp. 5-6; Section 5, Example 5.1 and Figure 11, pp. 14-17
    relation: supports
