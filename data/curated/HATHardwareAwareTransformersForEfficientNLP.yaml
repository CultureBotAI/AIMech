id: AIMech:HATHardwareAwareTransformersForEfficientNLP
name: HAT (Hardware-Aware Transformers for Efficient Natural Language Processing)
concept_kind: architecture
review_status: DRAFT
definition: HAT (Hardware-Aware Transformers) is a hardware-aware Neural Architecture Search (NAS) framework for sequence-to-sequence encoder-decoder Transformers that breaks the information bottleneck between encoder and decoder via Arbitrary Encoder-Decoder Attention (allowing each decoder layer to attend to the concatenated key-value representations of the last 1, 2, or 3 encoder layers with zero extra parameters), enables layer-wise Heterogeneous Transformer Layers (varying embedding dimensions, FFN hidden dimensions, attention head counts, and decoder layer count across ~10^15 candidate SubTransformers), trains a single weight-sharing SuperTransformer by uniformly sampling SubTransformers and slicing front-prefix weight subtensors, and executes evolutionary search guided by a target-device MLP Latency Predictor to extract specialized SubTransformers meeting strict hardware latency constraints.
identity_notes: Distinct from Evolved Transformer (So et al., 2019), which searches homogeneous cell structures without hardware latency feedback at >10,000x higher GPU cost, distinct from Once-for-All (Cai et al., 2020), which targets convolutional neural networks via progressive shrinking rather than encoder-decoder Transformers with arbitrary cross-attention spans, and distinct from DynaBERT (AIMech:DynaBERTDynamicBERTWithAdaptiveWidthAndDepth), which adapts encoder-only BERT width and depth via importance-ordered head/neuron rewiring and distillation.
aliases:
- HAT
- Hardware-Aware Transformers
- HAT SuperTransformer with Arbitrary Encoder-Decoder Attention
