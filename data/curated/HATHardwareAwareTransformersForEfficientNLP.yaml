claims:
- claim_id: hat-arbitrary-encoder-decoder-attention-and-heterogeneous-layers
  kind: mechanism
  statement: HAT defines a heterogeneous design space of ~10^15 encoder-decoder SubTransformers in which each layer independently selects its FFN inner dimension and attention head count while Arbitrary Encoder-Decoder Attention lets each decoder layer attend to the last 1, 2, or 3 encoder layers by concatenating their key and value vectors along the sequence dimension without adding trainable parameters.
  evidence:
  - source_id: r813-primary-pdf
    locator: Section 3.1 (Design Space), Figure 5, Figure 6, and Table 1, pp. 7678-7679
    relation: supports
  - source_id: r813-primary-pdf
    locator: design_space_cardinality and arbitrary_enc_dec_attention
    relation: supports
- claim_id: hat-weight-sharing-supertransformer-and-latency-predictor-search
  kind: mechanism
  statement: HAT trains a single weight-sharing SuperTransformer by uniformly sampling SubTransformers at each step and updating their front-slice weight subtensors, and pairs the SuperTransformer with a 3-layer MLP hardware latency predictor (trained on 2000 measured architecture-latency pairs with ~0.1 ms/0.1 s RMSE) during evolutionary search under a hard hardware latency budget.
  evidence:
  - source_id: r813-primary-pdf
    locator: Section 3.2 (Performance Approximation) and Section 3.3 (Hardware Latency Constraint), Figures 7-8, pp. 7679-7680
    relation: supports
  - source_id: r813-primary-pdf
    locator: extract_front_subtensor and main
    relation: supports
- claim_id: hat-hardware-specialized-machine-translation-speedup
  kind: application
  statement: On WMT'14 En-De, WMT'14 En-Fr, WMT'19 En-De, and IWSLT'14 De-En across Raspberry Pi-4 ARM CPU, Intel Xeon CPU, and Nvidia Titan Xp GPU, HAT achieves up to 3x latency speedup and 3.7x smaller model size over Transformer-Big while cutting NAS search cost by 12,041x compared to Evolved Transformer, automatically discovering deep-and-thin models for ARM CPU versus shallow-and-wide models for GPU.
  evidence:
  - source_id: r813-primary-pdf
    locator: Section 4.2 (Main Results), Table 2, Table 3, and Figure 12, pp. 7681-7684
    relation: supports
- claim_id: hat-post-search-retraining-and-device-profiling-limitation
  kind: limitation
  statement: Although the SuperTransformer ranks candidate SubTransformers accurately, achieving peak final translation BLEU requires retraining the discovered SubTransformer from scratch for 40K steps, and each new target hardware platform requires profiling ~2000 architectures to fit a device-specific latency predictor.
  evidence:
  - source_id: r813-primary-pdf
    locator: Section 3.3 (Latency Predictor) and Section 4.1 (Search Cost / Retraining), pp. 7680-7681
    relation: supports
