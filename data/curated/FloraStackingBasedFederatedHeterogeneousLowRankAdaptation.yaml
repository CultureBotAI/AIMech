claims:
- claim_id: flora-block-matrix-stacking-exact-aggregation-and-rank1-permutation-mechanism
  kind: mechanism
  statement: Given K + 1 participating clients with arbitrary local LoRA ranks r_k and sample-proportion weights p_k = |D_k| / sum_{j=0}^K |D_j| applied to A_k only, FLoRA vertically stacks A = p_0 A_0 (+) ... (+) p_K A_K in R^{(sum_k r_k) x n} and horizontally stacks B = B_0 (+) ... (+) B_K in R^{m x (sum_k r_k)} (Eqs. 9-12, pp. 4-6), guaranteeing the exact noise-free outer-product decomposition B A = sum_{k=0}^K p_k B_k A_k (Eq. 10) while allowing the server to decompose (B, A) into sum_k r_k rank-1 sub-modules and randomly permute their order so clients cannot identify individual peers' adapters (Section 5, p. 9).
  evidence:
  - source_id: r511-primary-pdf
    locator: Section 3.1-3.2, Eqs. (7)-(12), Figures 2-3, pp. 4-6; Section 5 The Privacy Preservation of FLoRA, p. 9
    relation: supports
- claim_id: flora-non-iid-strongly-convex-convergence-rate-scope
  kind: scope
  statement: Under Assumptions 1-5 (L-smoothness, mu-strong convexity, bounded stochastic gradient variance sigma_k^2 and second moment G^2, and unbiased LoRA local update steps B_k^{(t+1)} A_k^{(t+1)} - B_k^{(t)} A_k^{(t)} = eta^{(t)} nabla F_k(W_k^{(t)} | xi_k^{(t)})), Theorem 1 (Appendix B, Eqs. 13-14, p. 14) proves that FLoRA with step size alpha_k / r_k = 2 / (mu (gamma + t)), kappa = L / mu, and gamma = max{8 kappa, E} bounds the expected fine-tuning optimality gap by delta^{(T)} = E[F(w^{(T-1)} + B^{(T)} A^{(T)})] - F* <= (2 kappa / (gamma + T))(M / mu + 2 L ||W^{(1)} - W*||^2) = O(1 / T) where M = sum_{k=1}^K p_k^2 sigma_k^2 + 6 L Gamma + 8 (E - 1)^2 G^2.
  evidence:
  - source_id: r511-primary-pdf
    locator: Appendix B Convergence Analysis, Assumptions 1-5, Theorem 1, Eqs. (13)-(14), pp. 13-14
    relation: supports
- claim_id: flora-downlink-stacked-rank-communication-and-reinitialization-limitation
  kind: limitation
  statement: Because the server broadcasts the stacked matrices A in R^{(sum_k r_k) x n} and B in R^{m x (sum_k r_k)} whose inner dimension equals the sum of all participating clients' ranks sum_{k=0}^K r_k, FLoRA increases per-round downlink communication relative to FedIT (e.g., 0.215 vs 0.177 of full fine-tuning over 3 rounds in Figure 6, p. 9) and requires clients to merge B A into W and re-initialize fresh local LoRA adapters each round (Section 3.2, pp. 5-6; Section 5, pp. 8-9; Appendix C, p. 14).
  evidence:
  - source_id: r511-primary-pdf
    locator: Section 3.2 Local Fine-tuning & Update Local Models, pp. 5-6; Section 5 Figure 6, pp. 8-9; Appendix C Limitation, p. 14
    relation: supports
- claim_id: flora-heterogeneous-rank-federated-llm-instruction-tuning-application
  kind: application
  statement: Applied to homogeneous and rank-heterogeneous (r_k in {4, 8, 16, 32, 64} and dynamic AdaLoRA) federated instruction tuning of TinyLlama-1.1B, LLaMA-7B, and Llama2-7B on Dolly-15K, Alpaca, Wizard, and ShareGPT evaluated on MMLU and MT-bench.
  evidence:
  - source_id: r511-primary-pdf
    locator: Section 4 Experiments, Table 1, Figures 4-5, pp. 6-8; Appendix A.3 Tables 3-4, p. 13
    relation: supports
