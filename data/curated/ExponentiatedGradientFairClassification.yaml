claims:
- claim_id: method-scope
  kind: mechanism
  statement: Express fairness as linear inequalities on conditional prediction moments whose conditioning
    events do not depend on the classifier. Given multiplier values, call a cost-sensitive classification
    oracle with modified per-example label costs. Update multipliers from constraint violations using
    exponentiated gradient, average the classifiers and multipliers, and stop when the computed saddle-point
    gap reaches the chosen tolerance.
