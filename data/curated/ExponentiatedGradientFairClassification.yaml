name: Exponentiated-gradient reduction for fair classification
definition: A cost-sensitive classification reduction that alternates classifier best responses with exponentiated-gradient
  updates of bounded Lagrange multipliers to approximate an error–fairness saddle point and return a randomized
  classifier mixture.
concept_kind: algorithm
identity_notes: This is Algorithm 1 of Agarwal et al., not generic exponentiated-gradient optimization.
  It returns a distribution over classifiers and is distinct from the paper’s deterministic-candidate
  grid-search reduction and from postprocessing a fixed classifier. All 442 pinned AIO labels/scoped synonyms
  and 104 preceding native identities were compared, together with hidden/ignored-inclusive searches of
  both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- The optimization analysis assumes a cost-sensitive best-response oracle; heuristic base learners need
  not realize the exact oracle guarantees.
- Bounds retain optimization tolerance, the multiplier-norm cap and statistical error, including dependence
  on the number of observations in each conditioning event.
- The constraint representation excludes conditioning events that depend on the learned predictor; the
  paper identifies predictive parity and calibration as outside this formulation.
- Protected attributes are required for training constraints. No separate protected-attribute argument
  is needed at prediction time only when the chosen feature vector and base classifier do not require
  it.
