claims:
- claim_id: claim-orthogonality-promoting-initialization-subspace-ratio-and-sample-complexity
  kind: mechanism
  statement: "For unit signal $\\|\\boldsymbol{x}\\|_2 = 1$ and leading unit eigenvector $\\tilde{\\boldsymbol{z}}_0$ of $\\overline{\\boldsymbol{Y}}_0 = \\frac{1}{|\\overline{\\mathcal{I}}_0|}\\overline{\\boldsymbol{S}}_0^\\top\\overline{\\boldsymbol{S}}_0$, Lemma 1 establishes the deterministic subspace perturbation inequality $\\frac{1}{2}\\|\\boldsymbol{x}\\boldsymbol{x}^\\top - \\tilde{\\boldsymbol{z}}_0\\tilde{\\boldsymbol{z}}_0^\\top\\|_F^2 = \\sin^2\\theta \\le \\frac{\\|\\overline{\\boldsymbol{S}}_0\\boldsymbol{x}^\\perp\\|_2^2}{\\|\\overline{\\boldsymbol{S}}_0\\boldsymbol{x}\\|_2^2}$ (Equations 29 and 68), and combining the conditional spherical sub-Gaussian upper bound $\\|\\overline{\\boldsymbol{S}}_0\\boldsymbol{x}^\\perp\\|_2^2 \\le 1.01|\\overline{\\mathcal{I}}_0|/n$ (Lemma 2) with the order-statistic chi-square lower bound $\\|\\overline{\\boldsymbol{S}}_0\\boldsymbol{x}\\|_2^2 \\ge \\frac{0.99|\\overline{\\mathcal{I}}_0|}{2.3n}[1 + \\log(m/|\\overline{\\mathcal{I}}_0|)]$ (Lemma 3) proves Proposition 1: $\\mathrm{dist}(\\boldsymbol{z}_0, \\boldsymbol{x}) \\le \\rho\\|\\boldsymbol{x}\\|_2$ with high probability once $m \\ge c_1|\\overline{\\mathcal{I}}_0| \\ge c_2 n$ (Section V-A, Proposition 1, Lemmas 1\u20133, Appendix A\u2013C)."
  evidence:
  - source_id: wge2018-taf-pdf
    locator: Section II-B (Eqs. 14-23, pp. 8-12), Section V-A (Proposition 1, Lemmas 1-3, pp. 19-20), Appendices A-C (pp. 25-31)
    relation: supports
- claim_id: claim-watershed-sign-truncation-and-local-regularity-condition
  kind: mechanism
  statement: "Decomposing each generalized gradient summand as $\\partial\\ell_i(\\boldsymbol{z}) = \\boldsymbol{a}_i\\boldsymbol{a}_i^\\top\\boldsymbol{h} + (\\frac{\\boldsymbol{a}_i^\\top\\boldsymbol{x}}{|\\boldsymbol{a}_i^\\top\\boldsymbol{x}|} - \\frac{\\boldsymbol{a}_i^\\top\\boldsymbol{z}}{|\\boldsymbol{a}_i^\\top\\boldsymbol{z}|})\\psi_i\\boldsymbol{a}_i$ where $\\boldsymbol{h} = \\boldsymbol{z} - \\boldsymbol{x}$ (Equation 10), Lemma 4 proves that any surviving wrong-sign measurement in $\\mathcal{E}_i \\cap \\mathcal{K}_i$ ($|\\boldsymbol{a}_i^\\top\\boldsymbol{z}|/|\\boldsymbol{a}_i^\\top\\boldsymbol{x}| \\ge \\frac{1}{1+\\gamma}$ and $\\mathrm{sign}(\\boldsymbol{a}_i^\\top\\boldsymbol{z}) \\ne \\mathrm{sign}(\\boldsymbol{a}_i^\\top\\boldsymbol{x})$) must satisfy $|\\boldsymbol{a}_i^\\top\\boldsymbol{h}|/|\\boldsymbol{a}_i^\\top\\boldsymbol{x}| \\ge \\frac{2+\\gamma}{1+\\gamma}$ ($\\mathcal{D}_i$), and Lemmas 5\u20136 bound the Cauchy ratio tail to prove the Local Regularity Condition $\\langle \\boldsymbol{h}, \\frac{1}{m}\\nabla\\ell_{\\mathrm{tr}}(\\boldsymbol{z})\\rangle \\ge (1 - \\zeta_1 - \\zeta_2 - 2\\epsilon)\\|\\boldsymbol{h}\\|_2^2$ with $\\zeta_1 \\approx 0.08$ and $\\zeta_2^\\prime \\approx 0.2463$ at $\\rho = 1/10, \\gamma = 0.7$ (Section V-B, Propositions 2\u20133, Lemmas 4\u20136, Appendices D\u2013E)."
  evidence:
  - source_id: wge2018-taf-pdf
    locator: Section II-A (Eqs. 5-12, pp. 5-8), Section V-B (Propositions 2-3, Lemmas 4-6, pp. 20-24), Appendices D-E (pp. 31-35)
    relation: supports
- claim_id: claim-linear-time-geometric-convergence-and-noise-stability-near-information-limit
  kind: application
  statement: "Theorem 1 and Equation 26 prove that with step size $\\mu \\le \\mu_0 \\approx 0.8388$ and truncation threshold $\\gamma \\ge 1/2$, Truncated Amplitude Flow contracts geometrically as $\\mathrm{dist}(\\boldsymbol{z}_t,\\boldsymbol{x}) \\le \\rho(1-\\nu)^t\\|\\boldsymbol{x}\\|_2$ in $O(mn\\log(1/\\epsilon))$ total flops and satisfies $\\mathrm{dist}(\\boldsymbol{z}_t,\\boldsymbol{x}) \\lesssim (1-\\nu)^t\\|\\boldsymbol{x}\\|_2 + \\frac{1}{\\sqrt{m}}\\|\\boldsymbol{\\eta}\\|_2$ under additive amplitude noise $\\psi_i = |\\boldsymbol{a}_i^\\top\\boldsymbol{x}| + \\eta_i$, achieving 100% empirical recovery at $m = 3n$ and $>50\\%$ recovery at the real-valued information-theoretic limit $m = 2n - 1$ (Sections III\u2013IV, Theorem 1, Equations 24\u201326)."
  evidence:
  - source_id: wge2018-taf-pdf
    locator: Section III (Algorithm 1, Theorem 1, Eqs. 24-26, pp. 12-13), Section IV (Figs. 7-10, pp. 13-17)
    relation: supports
