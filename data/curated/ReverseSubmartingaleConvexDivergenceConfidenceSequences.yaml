claims:
- claim_id: exchangeable-filtration-reverse-submartingale-loo-and-partially-ordered-ville-inequality
  kind: mechanism
  statement: 'For i.i.d. observations X_1, X_2, ... ~ P and Y_1, Y_2, ... ~ Q, the empirical measures
    P_t = (1/t) sum_{i=1}^t delta_{X_i} and Q_s = (1/s) sum_{j=1}^s delta_{Y_j} are measure-valued reverse
    martingales with respect to the exchangeable sigma-fields E_t^X and E_s^Y satisfying P_t(A) = E[P_{t-1}(A)
    | E_t^X] = E[I(X_1 in A) | E_t^X] almost surely (Section 3.1, Appendix B.1 Lemma 27), so for any convex
    functional Phi and convex two-sample functional Psi — or any permutation-invariant sequence satisfying
    the leave-one-out inequality (1/(t+1)) sum_{i=1}^{t+1} f_t(X_{-i}) >= f_{t+1}(X_1, ..., X_{t+1}) (Proposition
    5), including integral probability metrics, phi-divergences, optimal transport costs (Lemma 1), and
    positive-definite V-statistics V_t and sqrt(V_t) (Proposition 16, whereas U-statistics form reverse
    martingales for arbitrary symmetric kernels) — the plug-in process (Phi(P_t))_{t>=1} is a reverse
    submartingale wrt (E_t^X)_{t>=1} and (Psi(P_t, Q_s))_{t,s>=1} is a partially ordered reverse submartingale
    wrt E_{ts} = E_t^X vee E_s^Y (Definition 1, Theorem 4) satisfying Ville''s reverse maximal inequality
    P(exists t >= t_0 : R_t >= u) <= E[R_{t_0}] / u (Theorem 2) and Christofides & Serfling''s partially
    ordered maximal inequality (Proposition 3, Equations 14–15).'
  evidence:
