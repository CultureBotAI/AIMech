aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Plug-in estimators of convex functionals and divergences suffer systematic upward bias E[Phi(P_tau)]
    >= Phi(P) at data-dependent stopping times (Section 3.2 Corollary 10); reverse-submartingale confidence
    sequences remain uniformly valid over all stopping times tau, sigma in N^2 (Section 3.3 Proposition
    12), preventing optional-stopping inflation (AIO:DataDredgingBias).
- target: AIO:TimeSeriesAnalysis
  relation: related_match
  rationale: Reverse-submartingale confidence sequences sequentially track convex functionals and two-sample
    divergences across streaming sample paths indexed by t >= 1 and (t, s) in N^2 with respect to reverse
    exchangeable filtrations (AIO:TimeSeriesAnalysis).
limitations:
- Because plug-in estimators of convex functionals Phi(P_t) are upward biased (E[Phi(P_t)] is nonincreasing
  in t), every lower confidence sequence in Theorem 7 and Corollary 8 requires an explicit upper bound
  on the finite-sample expected bias E[Phi(P_{ceil(t/2)}) - Phi(P)] at half the sample size; for unsmoothed
  optimal transport in dimension d >= 3, this expected bias scales as O((t wedge s)^{-alpha/d}) (Corollary
  17) with leading constants that are often not known in closed form.
- While Gaussian convolution smoothing removes the curse of dimensionality from the O(t^{-1/2}) sample-size
  exponent for smoothed Total Variation and smoothed 1-Wasserstein confidence sequences (Proposition 20),
  the multiplicative prefactors c_d and C_d grow exponentially with dimension d when the smoothing bandwidth
  sigma is fixed (Section 4.5, p. 4651).
- Upper confidence sequences for Phi(P) and Psi(P, Q) cannot be obtained by applying Ville's maximal inequality
  directly to -Phi(P_t) (which is a reverse supermartingale and lacks an infinite-horizon reverse maximal
  inequality), and instead require a variational supremum representation whose supremum is attained at
  an integrable witness function f_Phi or (f_Psi, g_Psi) with controlled tail behavior (Proposition 9,
  Corollary 11, Proposition 29); similarly, while Corollary 22(ii) provides a time-uniform lower bound
  on population Rademacher complexity R_{floor(t/2)}(F) via empirical Rademacher complexity R_hat_t(F),
  deriving a time-uniform upper confidence sequence for R_t(F) to yield a fully empirical stopping-time
  generalization bound remains an open problem (Section 4.6, p. 4652).
- All 2,502 lines of Manole & Ramdas (2023, IEEE Trans. Inf. Theory 69(7):4641-4658, arXiv:2103.09267v4)
  were read. Constructed numerical checks in research/discovery/reverse-submartingale-convex-divergence-confidence-sequences-boundaries.py
  verify (1) Section 2.3 & Section 3.1 exact reverse-martingale identity E[P_t(A) | E_{t+1}^X] = P_{t+1}(A)
  (max diff 0.0), leave-one-out reverse-submartingale nonnegativity for KL divergence (min excess 0.0),
  Total Variation (min excess 0.0), and PSD V-statistics (min excess 0.0) vs. violation for non-PSD hollow-kernel
  V-statistics (min excess -0.04) and exact equality for U-statistics (max diff 0.0), plus Ville's reverse
  maximal inequality (empirical exceed prob 0.042 <= 0.2786), (2) Section 3.2 Corollary 10 & Section 4.1
  Corollary 14 stopping-time upward bias of plug-in KS distance (mean stopped KS 0.6034 vs. true KS 0.25,
  upward bias +0.3534) and 1.0 >= 0.90 simultaneous coverage of the two-sample reverse-stitched KS confidence
  sequence, (3) Section 4.4 Corollary 19 & Section 4.5 Proposition 20(i) discrete TV CS violation rate
  0.0 and continuous Gaussian-smoothed TV decay from 0.1016 (t=10) to 0.0192 (t=200) with 0.0 violation
  rate vs. unsmoothed empirical TV = 1.0, and (4) Section 4.6 Corollary 22(ii) & Appendix E Lemma 32 empirical
  Rademacher complexity leave-one-out nonnegativity (min excess 1e-16 >= 0) and non-vanishing forward
  canonical-filtration supermartingale width limit H(P) = 1.029653 vs. vanishing reverse-submartingale
  KL bound 0.066883 at t=500.
