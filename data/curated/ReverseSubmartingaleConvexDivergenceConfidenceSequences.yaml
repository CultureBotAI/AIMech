id: AIMech:ReverseSubmartingaleConvexDivergenceConfidenceSequences
name: Reverse-submartingale confidence sequences for convex divergences and functionals
aliases:
- Reverse-Submartingale Convex Functional Confidence Sequences
- Exchangeable-Filtration Reverse-Stitched Divergence Confidence Sequences
- Partially Ordered Reverse-Submartingale Two-Sample Divergence Confidence Sequences
- Time-Uniform Plug-In Convex Divergence Estimation
concept_kind: mathematical_method
definition: A sequential nonparametric estimation and inference methodology (Manole & Ramdas 2023, IEEE
  Transactions on Information Theory 69(7):4641-4658, arXiv:2103.09267) that constructs time-uniform confidence
  sequences for convex functionals Phi(P) of a single distribution and convex divergences Psi(P, Q) between
  two distributions — including integral probability metrics (Kolmogorov-Smirnov distance, kernel Maximum
  Mean Discrepancy, positive-definite V-statistics), optimal transport costs (Wasserstein and Gaussian-smoothed
  Wasserstein distances), phi-divergences (Kullback-Leibler divergence, Total Variation, and Gaussian-smoothed
  divergences), classification generalization risks (Rademacher complexity), and general-norm multivariate
  means — by exploiting the property that empirical measures P_t and Q_s are measure-valued reverse martingales
  with respect to the exchangeable filtrations (E_t^X)_{t>=1} and (E_s^Y)_{s>=1}, so plug-in estimators
  Phi(P_t) and Psi(P_t, Q_s) form reverse submartingales (or partially ordered reverse submartingales
  on N^2) to which Ville's reverse maximal inequality and Christofides-Serfling's partially ordered maximal
  inequality are stitched across geometric sample-size epochs while affine variational minorants provide
  matching upper confidence sequences.
identity_notes: No normalized identity match for reverse-submartingale confidence sequences for convex
  divergences and functionals across all 442 pinned AIO records and 581 maintained IDs, names, aliases
  and scoped synonyms. Fixed-string searches across data, sources, research, history, and reviews returned
  only prior discovery frontier entries where Manole & Ramdas (2023, IEEE Trans. Inf. Theory 69(7):4641-4658,
  arXiv:2103.09267) was tracked as a pending frontier lead. Distinct from AIMech:SubPsiUniformBoundaryConfidenceSequences
  (Howard, Ramdas, McAuliffe, & Sekhon 2020/2021), AIMech:BettingConfidenceSequencesForBoundedMeans (Waudby-Smith
  & Ramdas 2024), and AIMech:SequentialNonparametricQuantileConfidenceSequences (Howard & Ramdas 2022),
  which construct forward canonical-filtration supermartingales for linear functionals (means) or scalar
  quantiles — a forward-filtration construction that provably fails to produce vanishing-width confidence
  sequences for nonlinear convex divergences (Manole & Ramdas 2023, Appendix E Lemma 32) — and distinct
  from AIMech:NonparametricTwoSampleTestingByBetting (Shekhar & Ramdas 2023) and AIMech:SequentialKernelizedIndependenceTestingByBetting
  (Podkopaev et al. 2023), which construct forward betting martingales for point-null hypothesis testing
  rather than two-sided exchangeable-filtration reverse-submartingale confidence sequences across one-
  and two-sample index sets.
