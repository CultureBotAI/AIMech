- claim_id: reverse-cramer-chernoff-geometric-epoch-stitching-variational-minorant-and-stopping-time-bias
  kind: mechanism
  statement: 'Exponentiating the centered processes N_t = Phi(P_t) - Phi(P) and M_{ts} = Psi(P_t, Q_s)
    - Psi(P, Q) yields one-sample and two-sample reverse Cramér-Chernoff tail bounds P(exists t >= t_0
    : N_t >= u) <= exp(-psi_{t_0}^*(u)) and P(exists t >= t_0, s >= s_0 : M_{ts} >= u) <= e * exp(-psi_{t_0
    s_0}^*(u)) where psi_t^*(u) = sup_{lambda>=0}{lambda u - psi_t(lambda)} (Proposition 6, Equation 19),
    which when stitched across geometric epochs [2^j, 2^{j+1}) and [2^j, 2^{j+1}) x [2^k, 2^{k+1}) with
    bar{t} = ceil(t/2), bar{s} = ceil(s/2) and stitching functions ell, g produce time-uniform lower confidence
    sequences P(exists t >= 1 : Phi(P_t) >= Phi(P) + gamma_t) <= delta and P(exists t, s >= 1 : Psi(P_t,
    Q_s) >= Psi(P, Q) + gamma_{ts}) <= delta matching the offline concentration rate up to iterated-logarithm
    log ell(log_2 t) factors without knowing finite-sample variance (Theorem 7, Corollary 8, Equations
    20–21); conversely, when Phi(mu) = sup_{f in F} int f dmu and Psi(mu, nu) = sup_{(f,g) in G} (int
    f dmu + int g dnu) attain their suprema at f_Phi and (f_Psi, g_Psi), N_t and M_{ts} are minorized
    by mean-zero sample-average reverse martingales R_t = int f_Phi d(P_t - P) and R_t^X + R_s^Y (Proposition
    9, Equations 22–23), proving nonnegative stopping-time upward bias E[Phi(P_tau)] >= Phi(P) and E[Psi(P_tau,
    Q_sigma)] >= Psi(P, Q) for all stopping times (Corollary 10) and yielding matching upper confidence
    sequences (Corollary 11, Appendix C.3 Proposition 29) and two-sided confidence sequences valid uniformly
    over all stopping times in N^2 (Proposition 12), including sequential Kolmogorov-Smirnov (Corollaries
    13–14) and kernel MMD (Corollary 15).'
