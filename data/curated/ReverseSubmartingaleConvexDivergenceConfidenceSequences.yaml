- claim_id: finite-support-phi-divergences-optimal-transport-and-gaussian-smoothed-parametric-rates
  kind: mechanism
  statement: For discrete distributions on k >= 2 support points, reverse-stitching yields nonasymptotic
    confidence sequences for Kullback-Leibler divergence KL(P_t || P) via the exact polynomial moment
    generating function upper bound G_{k,t}(lambda) of Guo & Richardson (2021) (Proposition 18, Equation
    35) and for Total Variation ||P_t - P||_TV with boundary sqrt((k/(4t)) max(1, 4/pi - 2/t)) + 2 sqrt((1/t)(log
    ell(log_2 t) + log(1/delta))) (Corollary 19); for continuous distributions on R^d where unsmoothed
    empirical phi-divergences are degenerate (||P_t - P||_TV = 1) and unsmoothed alpha-Holder optimal
    transport suffers O((t wedge s)^{-alpha/d}) curse-of-dimensionality bias (Corollary 17, Equations
    33–34), convolving P_t and P with a Gaussian kernel K_sigma of bandwidth sigma > 0 preserves functional
    convexity and restores parametric O(sqrt((log log t)/t)) confidence sequences in arbitrary dimension
    d for Gaussian-smoothed Total Variation ||P_t - P||_TV^sigma under tau^2-sub-Gaussian tails (Proposition
    20(i), Equation 36), Gaussian-smoothed 1-Wasserstein distance W_1^sigma(P_t, P) under Talagrand T_1(tau^2)
    transportation inequalities (Proposition 20(ii), Equation 37, Appendix D.5 Lemma 31), and plug-in
    Gaussian-smoothed differential entropy h(P * K_sigma) on [-1, 1]^d (Corollary 21).
  evidence:
  - source_id: manole2023-reverse-submartingale-ar5iv
    locator: Section 4.3, lines 713–754, Corollary 17, Equations 33–34; Section 4.4, lines 755–805, Proposition
      18, Corollary 19, Equation 35; Section 4.5, lines 806–877, Proposition 20, Corollary 21, Equations
      36–37; Appendix D.3–D.5, lines 1554–1716, Lemma 31
    relation: supports
- claim_id: rademacher-generalization-norm-estimation-upper-lil-and-forward-supermartingale-failure
  kind: mechanism
  statement: Beyond divergences, reverse-submartingale stitching establishes (1) stopping-time-valid uniform
    classification risk bounds sup_{f in F} |R_t(f) - R(f)| <= R_{floor(t/2)}(F) + 2 sqrt((2/t)(log ell(log_2
    t) + log(1/delta))) and the leave-one-out reverse-submartingale property of empirical Rademacher complexity
    R_hat_t(F) wrt E_t^X yielding a time-uniform lower bound on R_{floor(t/2)}(F) (Section 4.6, Corollary
    22, Appendix D.6), (2) general-norm multivariate mean confidence sequences ||mu_t - mu|| via gamma-covering
    numbers N_gamma of the dual unit sphere S_*^{d-1} scaling at O(sqrt((log log t + d)/t)) (Section 4.7,
    Corollary 23, Equations 38–40, Appendix D.7), and (3) a sharp one-sided upper Law of the Iterated
    Logarithm limsup_{t->infty} sqrt(t / (2 sigma^2 log log t)) D(P_t || P) <= 1 almost surely whenever
    E[D(P_t || P)] = o(sqrt((log log t)/t)) (Section 4.8, Corollary 24, Equation 41, Appendix D.8); in
    contrast, Appendix E (Lemma 32, Lemma 33, Theorem 34) proves that forward canonical-filtration supermartingales
    L_t(lambda) = exp(lambda t D(P_t || P) - t psi(lambda)) fail to yield vanishing-width confidence sequences
    because E[D(delta_{X_1} || P)] > 0 (e.g., equal to Shannon entropy H(P) > 0 for discrete KL divergence),
    forcing psi(lambda) to decay only linearly as lambda -> 0+ and leaving a non-vanishing asymptotic
    width floor.
  evidence:
  - source_id: manole2023-reverse-submartingale-ar5iv
    locator: Section 4.6, lines 878–924, Corollary 22; Section 4.7, lines 925–978, Corollary 23, Equations
      38–40; Section 4.8, lines 979–1008, Corollary 24, Equation 41; Appendix D.6–D.8, lines 1717–1800;
      Appendix E, lines 1801–1948, Lemma 32, Lemma 33, Theorem 34, Equations 63–69
    relation: supports
