claims:
- claim_id: method
  kind: mechanism
  statement: For pi(f) proportional to Normal(f;0,Sigma)L(f), draw nu from Normal(0,Sigma), then log y=log
    L(f)+log u for independent u uniform on (0,1). Draw theta uniformly on (0,2pi) and initialize [theta_min,theta_max]=[theta−2pi,theta].
    Test f_prime=f cos(theta)+nu sin(theta); accept when log L(f_prime)>log y. Otherwise shrink the bracket
    at theta on the side determined by its sign relative to zero, redraw theta uniformly from that bracket,
    and repeat with the same nu, f and threshold. The randomly positioned bracket retains the angle zero
    corresponding to the current state. Gaussian rotational invariance and the reversible bracket construction
    give the target-invariant transition.
  evidence:
