name: Elliptical slice sampling
definition: A Markov-chain update for a target factored into a Gaussian prior and a likelihood, which
  performs an angular slice search along the ellipse defined by the current state and an independent prior
  draw.
concept_kind: algorithm
identity_notes: This is the full-circle default algorithm in Murray et al. Figure 2 for a fixed Gaussian
  prior covariance. It differs from a fixed-angle Gaussian autoregressive Metropolis proposal and from
  scalar interval stepping-out or doubling. ESS here denotes this sampler, not the effective-sample-size
  diagnostic. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 167 prior native IDs/names/aliases. Full-checkout searches in both worktrees included ignored and
  hidden files; the 15 lines in each were shared Tierney source-title references or an adaptive-rejection
  discovery lead, not matching records. Existing Gibbs, Metropolis-within-Gibbs, random-walk and independence
  Metropolis mechanisms were inspected to resolve specialization boundaries.
limitations:
- A Gaussian prior draw and likelihood evaluation are required. A nonzero prior mean must be handled by
  centering the ellipse; an arbitrary non-Gaussian prior is outside this formula.
- Fixing the initial bracket deterministically to [−pi,pi] is not the proved algorithm; the paper explicitly
  explains why its random placement matters.
- The algorithm may reject multiple internal angle trials before returning an update. Its lack of an outer
  Metropolis rejection is not a claim of one likelihood evaluation or independent retained states.
- The default full-circle algorithm avoids a user-specified proposal scale, but covariance, model hyperparameters
  and optional narrower angular variants still involve choices.
- Strong offsets, covariance structure and likelihood geometry can impede exploration. No universal mixing
  rate, finite-run accuracy or timing advantage is asserted.
