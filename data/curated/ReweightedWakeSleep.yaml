claims:
- claim_id: method
  kind: mechanism
  statement: For an observed input x and fixed current parameters, draw K independent latent configurations
    h_k from the recognition distribution q_phi(h|x), evaluate p_theta(x,h_k) and q_phi(h_k|x), and compute
    weights w_k=p_theta(x,h_k)/q_phi(h_k|x). Normalize them by their positive sum. Update theta using
    the weighted average of grad_theta log p_theta(x,h_k). The unnormalized average of w_k estimates p_theta(x);
    taking its logarithm gives a distinct, generally biased log-likelihood estimator. For recognition
    training, the wake option uses the same normalized weights to average grad_phi log q_phi(h_k|x), targeting
    KL(p_theta(h|x)||q_phi(h|x)) on observed inputs. The sleep option samples a fresh (x-prime,h-prime)
    from p_theta and ascends log q_phi(h-prime|x-prime). Algorithm 1 permits either recognition option
    or both. These displayed updates weight log-probability scores evaluated at sampled states; they do
    not differentiate through the normalized weights as an extra part of that score update. With K=1 the
    model update becomes the ordinary generative wake update, while the wake recognition score alone has
    zero expectation under normalized q at fixed parameters, as a curator consequence of the score identity.
