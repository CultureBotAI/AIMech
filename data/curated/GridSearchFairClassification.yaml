claims:
- claim_id: method-scope
  kind: mechanism
  statement: Use the same linear conditional-moment constraint formulation and per-example cost-sensitive
    oracle as the exponentiated-gradient reduction, but enumerate candidate multiplier values or equivalent
    cost adjustments. For binary protected groups the paper reduces demographic-parity search to one adjustment
    dimension and equalized-odds search to two, then compares candidate classifiers to select the desired
    tradeoff.
