name: Grid-search reduction for fair classification
definition: A fairness-aware classification reduction that evaluates cost-sensitive classifier best responses
  over a grid of Lagrange-multiplier-derived costs and selects a deterministic candidate with a desired
  empirical accuracy–fairness tradeoff.
concept_kind: algorithm
identity_notes: The paper’s Section 3.4 grid search is a separate reduction producing deterministic candidates.
  It shares a cost-sensitive oracle with the randomized exponentiated-gradient reduction but does not
  inherit that procedure’s mixture or saddle-point stopping rule. It is not generic hyperparameter grid
  search or the bivariate causal-sensitivity grid procedure. All 442 pinned AIO labels/scoped synonyms
  and 104 preceding native identities were compared, together with hidden/ignored-inclusive searches of
  both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- A finite grid and heuristic cost-sensitive learner do not guarantee a globally optimal fair deterministic
  classifier.
- The paper explicitly allows lower accuracy or constraint violation when choosing a deterministic candidate;
  the randomized-mixture guarantees should not be transferred automatically.
- Grid search is intended for small numbers of effective constraint dimensions and scales poorly as that
  dimension grows.
- Fairness is assessed under the specified empirical constraints and sampling context; evaluation on unseen
  or shifted data is separate.
