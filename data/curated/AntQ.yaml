claims:
- claim_id: method
  kind: mechanism
  statement: 'Maintain shared positive AQ(r,s) edge values, a heuristic HE(r,s) such as inverse positive
    distance, and each ant’s set J of unvisited cities. In the pseudo-random-proportional variant, draw
    q uniformly in [0,1]: for q<=q0 choose an eligible edge maximizing AQ^delta*HE^beta, otherwise sample
    with probabilities proportional to those weights over eligible cities. While constructing tours, the
    displayed update is AQ(r,s)_new=(1−alpha)*AQ(r,s)+alpha*(DeltaAQ(r,s)+gamma*max_{z in J(s)} AQ(s,z));
    immediate DeltaAQ is zero in the inspected variants. After completing tours, delayed reinforcement
    is W/L_best on edges of a selected best tour and zero elsewhere. The paper studies both iteration-best
    and best-so-far choices and selects iteration-best for most subsequent experiments. In the 1995 Figure1
    delayed phase, the next-state term is explicitly declared zero, so the per-edge update where applied
    reduces to (1−alpha)*AQ+alpha*DeltaAQ. The 1996 presentation explicitly restricts that global phase
    to the iteration-best tour and resets per-tour ant state each iteration. These are source-scoped formulations;
    terminal handling and the exact edge-update schedule must be declared when implementing a concrete
    member.'
