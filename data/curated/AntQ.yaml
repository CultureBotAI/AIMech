  rationale: Ant-Q explicitly constructs shared action-like values using a Q-learning-inspired discounted
    next-state term and delayed reinforcement. This relates the concrete combinatorial optimizer to the
    pinned learning-task class; it asserts neither identity nor subclass membership. History-dependent
    feasibility and source-specific update schedules prevent importing standard Q-learning guarantees.
