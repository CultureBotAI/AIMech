name: Ant-Q
definition: A family of cooperative ant-based optimization algorithms that learns shared edge desirabilities
  using Q-learning-inspired next-state estimates and delayed reinforcement from completed solutions.
concept_kind: algorithm
identity_notes: This record denotes the Ant-Q family through its traveling-salesman formulations, especially
  pseudo-random-proportional construction and best-tour reinforcement. Its next-state estimate distinguishes
  the nondegenerate Ant-Q update from the selected ACS rule targeting a constant tau0. The authors relate
  Ant System to the broader family; that relationship does not make every Ant-Q configuration identical
  to Ant System. This is an algorithm-family concept, not a trained value function or a proof of Q-learning
  equivalence. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 291 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in worktree and main, returning 61 and 71 lines respectively. Text hits were prior candidate
  leads, citations to a reused Ant System source, neighboring mechanism distinctions, saved review/report
  material, and unrelated PBIL strings in ignored HOGENOM prefix-map URLs. Eight exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The eligible action set depends on an ant’s visited-city history, while AQ is shared per edge. City
  identity alone is therefore not a complete Markov state for tour feasibility. The 1995 conclusion treats
  transfer of Q-learning theory as future work; standard Q-learning convergence is not an established
  Ant-Q guarantee here.
- The 1995 generic diagram loops over edges to compute delayed reinforcement and gives an incompletely
  specified final update domain; its repeat jump omits explicit state reset and its terminal local maximum
  needs a convention. The 1996 method makes best-tour-only global updates and per-tour reset explicit
  but references its update equation without restating the earlier zero-next-state convention. The record
  preserves these version details instead of claiming a fully executable common pseudocode.
- The pseudo-random, pseudo-random-proportional and random-proportional construction rules are distinct
  members. Positive trails alone do not ensure exploration when q0=1, candidates are excluded or weights
  vanish. Empty eligible sets, zero distances, ties, repeated edge updates and numerical underflow require
  explicit handling.
- The learned edge values guide stochastic search rather than certify globally optimal tours. Heuristic
  choice, parameters, number of ants, update ordering and stopping affect results. Neither the paper’s
  observed noncollapse nor its TSP/ATSP comparisons is asserted as a universal guarantee.
