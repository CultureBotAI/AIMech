claims:
- claim_id: criterion-scope
  kind: scope
  statement: For each compared protected group a, evaluate P(prediction=1 | A=a,Y=1) and require equality
    across groups. This constrains true-positive rates and imposes no corresponding equality requirement
    at Y=0. It relaxes the binary equalized-odds criterion by retaining only the designated positive-outcome
    condition.
