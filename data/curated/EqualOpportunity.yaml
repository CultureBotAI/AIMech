name: Equal opportunity in binary classification
definition: A binary-classification fairness criterion requiring equal probabilities of a positive prediction
  across specified protected groups among individuals whose target outcome is the designated positive
  outcome.
concept_kind: evaluation_criterion
identity_notes: The identity is Hardt, Price and Srebro's Definition 2.2, with the positive target designated
  as the advantaged outcome. It is not the wider philosophical meaning of equal opportunity, the full
  equalized-odds condition, or a threshold-adjustment algorithm. Identity searches covered all 442 AIO
  labels and scoped synonyms, 94 preceding native records and ignored/hidden-inclusive text in both checkouts.
limitations:
- The definition depends on which target outcome is designated positive/advantaged; changing that designation
  changes the constrained population.
- Equal opportunity alone does not equalize false-positive rates, selection rates, predictive values or
  individual treatment.
- The criterion requires meaningful target labels and sufficiently supported group/positive-outcome strata.
  Finite-sample uncertainty is not eliminated by writing an equality.
- Like other oblivious criteria, this condition does not determine the causal process or establish overall
  social fairness, empirical utility or legal compliance.
aliases:
- Equal opportunity (true-positive parity)
- Equality of opportunity (true-positive parity)
