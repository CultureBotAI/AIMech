id: AIMech:PACTParameterizedClippingActivationForQuantizedNeuralNetworks
name: PACT (Parameterized Clipping Activation for Quantized Neural Networks)
concept_kind: algorithm
review_status: DRAFT
definition: PACT (Parameterized Clipping Activation for Quantized Neural Networks) is a quantization-aware activation clipping scheme that replaces unbounded ReLU activations with a bounded piecewise linear function y = PACT(x) = 0.5 * (|x| - |x - alpha| + alpha) parameterized by a per-layer learnable clipping threshold alpha, linearly quantizes the clipped output to k bits over [0, alpha] via y_q = round(y * (2^k - 1) / alpha) * alpha / (2^k - 1), and jointly optimizes alpha alongside network weights during backpropagation using the Straight-Through Estimator gradient dy_q / dalpha = I[x >= alpha] with L2 regularization on alpha.
identity_notes: Distinct from fixed-range ReLU clipping (e.g., ReLU6 or fixed [0, 1] clipping in DoReFa-Net, AIMech:DoReFaNetTrainingLowBitwidthConvolutionalNeuralNetworksWithLowBitwidthGradients) where the clipping bound is a hand-tuned hyperparameter rather than a gradient-learned parameter alpha, and distinct from post-training KL-divergence activation calibration in HAQ (AIMech:HAQHardwareAwareAutomatedQuantizationWithMixedPrecision).
aliases:
- PACT
- Parameterized Clipping Activation
- Parameterized Clipping Activation for Quantized Neural Networks
