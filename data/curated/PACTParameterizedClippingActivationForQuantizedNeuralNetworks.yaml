claims:
- claim_id: pact-piecewise-clipping-and-uniform-kbit-quantizer
  kind: mechanism
  statement: PACT clips pre-quantized activations x to the interval [0, alpha] via y = PACT(x) = 0.5 * (|x| - |x - alpha| + alpha) (which equals 0 for x < 0, x for x in [0, alpha), and alpha for x >= alpha, Eq. 1) and uniformly quantizes the clipped activation to k bits via y_q = round(y * (2^k - 1) / alpha) * alpha / (2^k - 1) (Eq. 2).
  evidence:
  - source_id: r821-primary-pdf
    locator: Section 2.1, Equations 1-2, pp. 2-3
    relation: supports
  - source_id: r821-primary-pdf
    locator: pact_clip and pact_quantize
    relation: supports
- claim_id: pact-ste-alpha-gradient-and-l2-regularization
  kind: mechanism
  statement: To avoid cross-layer activation range expansion and balance clipping error against quantization resolution, PACT computes the Straight-Through Estimator derivative dy_q / dalpha = (dy_q / dy) * (dy / dalpha) = 1 for x in [alpha, +infinity) and 0 otherwise (Eq. 3) and applies L2 regularization lambda_alpha * alpha^2 in the training loss.
  evidence:
  - source_id: r821-primary-pdf
    locator: Section 2.1-2.2, Equation 3 and Figure 2, pp. 3-4
    relation: supports
  - source_id: r821-primary-pdf
    locator: pact_grad_alpha and main
    relation: supports
- claim_id: pact-4bit-weight-activation-full-precision-parity-across-cnns
  kind: application
  statement: When combined with DoReFa-Net weight quantization (PACT-SAWB), PACT achieves full-precision accuracy with 4-bit weights and 4-bit activations across CIFAR-10 (ResNet-20, VGG) and ImageNet (AlexNet, ResNet-18, ResNet-50, MobileNet) and reduces multiplication-and-accumulation area and power by ~11x in a 14nm CMOS deep learning accelerator core.
  evidence:
  - source_id: r821-primary-pdf
    locator: Section 3 (Experiments) and Section 4 (System-Performances Gain), Tables 1-2 and Figures 4-7, pp. 5-9
    relation: supports
- claim_id: pact-first-last-layer-8bit-and-batchnorm-fold-requirement
  kind: limitation
  statement: At ultra-low bitwidths (e.g., 2-bit weights and activations), PACT still exhibits an accuracy drop relative to full precision on ResNet-50 and MobileNet and retains 8-bit quantization for the first convolutional and final fully connected layers while keeping batch normalization statistics in high precision during training.
  evidence:
  - source_id: r821-primary-pdf
    locator: Section 2.2 (System-Level Implementation) and Section 3, Table 1, pp. 4-7
    relation: supports
