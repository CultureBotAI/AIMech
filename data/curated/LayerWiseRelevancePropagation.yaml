name: Layer-wise relevance propagation
definition: A prediction-decomposition framework that redistributes relevance backward through a classifier's
  computational layers toward its input features.
concept_kind: mathematical_method
identity_notes: LRP is a family of constrained relevance-propagation constructions, demonstrated for neural
  networks and kernel-based Bag-of-Words classifiers; it is not a single gradient formula or a classifier-training
  algorithm.
limitations:
- Conservation alone does not uniquely determine meaningful attributions; the original paper gives a counterexample.
- Bias terms and epsilon stabilization can absorb relevance, so exact conservation is not asserted for
  every practical rule.
