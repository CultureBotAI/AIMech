id: AIMech:KBfgsKroneckerFactoredQuasiNewtonOptimization
name: K-BFGS and K-BFGS(L) (Kronecker-Factored Quasi-Newton Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: A stochastic Kronecker-factored quasi-Newton optimization method for deep neural networks that approximates each layer's block-diagonal inverse Hessian as the Kronecker product H_l = H_a^l (x) H_g^l of an inverse input-activation second-moment factor H_a^l and an inverse pre-activation Hessian factor H_g^l, updating H_g^l via BFGS (in K-BFGS) or non-loop limited-memory L-BFGS (in K-BFGS(L)) with a two-stage Powell Double Damping (DD) procedure on layer pre-activation secant pairs and updating H_a^l via Levenberg-Marquardt damped Hessian-action BFGS without cubic matrix inversions.
identity_notes: Distinct from K-FAC (AIMech:KfacKroneckerFactoredApproximateCurvature), which approximates the Fisher information matrix using outer products of backpropagated predictive-distribution gradients and requires explicit O(d_i^3 + d_o^3) matrix inversions every T steps; K-BFGS and K-BFGS(L) approximate the true layerwise Hessian inverse via secant updates on pre-activation changes s_g^l = E[h_l^+ - h_l] and gradient changes y_g^l = E[g_l^+ - g_l] and require only O(d_i^2 + d_o^2) matrix-vector and matrix-matrix multiplications. Distinct from standard L-BFGS (AIMech:LimitedMemoryBfgsOptimization), which operates on the unfactored n-dimensional parameter vector rather than layerwise Kronecker factors.
aliases:
- K-BFGS
- K-BFGS(L)
- Kronecker-Factored Block-Diagonal BFGS
- Kronecker-Factored Quasi-Newton Method for Deep Neural Networks
