claims:
- claim_id: kbfgs-powell-double-damping-preactivation-secant-mechanism
  kind: mechanism
  statement: 'To maintain positive definiteness and bounded eigenvalues of the inverse pre-activation Hessian approximation H_g^l under non-convex indefinite curvature without line search, Algorithm 3 (Double Damping) applies two sequential Powell damping steps to the moving-average pre-activation secant pair (s_g^l, y_g^l): first interpolating s_tilde = theta_1 * s + (1 - theta_1) * H * y so s_tilde^T y >= mu_1 * y^T H y, and second interpolating y_tilde = theta_2 * y + (1 - theta_2) * s_tilde with B = I so s_tilde^T y_tilde >= mu_2 * ||s_tilde||^2.'
  evidence:
  - source_id: r644-primary-pdf
    locator: Section 3 Equations (6)-(10), Algorithm 3, and Appendix C, pages 4-5, 15
    relation: supports
- claim_id: kbfgs-hessian-action-bfgs-sherman-morrison-theorem1-mechanism
  kind: mechanism
  statement: Theorem 1 proves that for positive-definite A and H = A^{-1}, updating H via any Broyden-family quasi-Newton formula with the Hessian-action secant pair s = H a and y = A^+ s for A^+ = A + c a a^T (c > 0) produces the exact Sherman-Morrison inverse (A^+)^{-1}; K-BFGS applies this update to the Levenberg-Marquardt damped input-activation covariance A_l^LM = A_l + lambda_A I_A using s_a^l = H_a^l bar{a}_{l-1} and y_a^l = A_l^LM s_a^l.
  evidence:
  - source_id: r644-primary-pdf
    locator: Section 4 Equation (11), Theorem 1, and Appendix A Algorithm 4 lines 18-22, pages 5-6, 12
    relation: supports
- claim_id: kbfgs-nonconvex-stochastic-convergence-rate-scope
  kind: scope
  statement: Under L-Lipschitz gradients, bounded stochastic gradient variance sigma^2, and bounded activations |phi_l(h)| <= varphi (Assumptions AS.1-AS.3), Lemmas 1-3 and Theorem 2 prove that the Kronecker-factored inverse Hessian approximations H_k remain uniformly bounded above and below by positive-definite matrices (underline{kappa} I <= H_k <= bar{kappa} I) and achieve (1/N) sum_{k=1}^N E[||grad f(theta_k)||^2] < epsilon in at most O(epsilon^{-1/(1-beta)}) iterations for step sizes alpha_k propto k^{-beta} with beta in (0.5, 1).
  evidence:
  - source_id: r644-primary-pdf
    locator: Section 5 Lemmas 1-3, Theorem 2, and Appendix B, pages 6, 12-14
    relation: supports
- claim_id: kbfgs-deep-autoencoder-benchmark-application
  kind: application
  statement: On 9-layer and 13-layer ReLU deep autoencoder benchmarks (MNIST, FACES, and CURVES) at mini-batch sizes m = 1000 and m = 100, K-BFGS and K-BFGS(L) substantially outperform Adam, RMSprop, and SGD with momentum in both training loss and test reconstruction error while performing comparably to or better than K-FAC without cubic matrix inversions.
  evidence:
  - source_id: r644-primary-pdf
    locator: Section 6 Tables 1-2, Figure 1, and Appendix D.5 Figures 4-6, pages 7-9, 19-22
    relation: supports
- claim_id: kbfgs-second-forward-backward-pass-per-step-limitation
  kind: limitation
  statement: Computing the pre-activation secant differences s_g^l = E[h_l^+(i) - h_l(i)] and y_g^l = E[g_l^+(i) - g_l(i)] after updating W_l requires an additional forward-backward pass over the current mini-batch M_k at each curvature update step, doubling the per-step propagation cost.
  evidence:
  - source_id: r644-primary-pdf
    locator: Section 2 Algorithm 2 line 5 and Section 6 Table 2, pages 4, 7
    relation: supports
