claims:
- claim_id: r649-locoprop-s-implicit-gradient-and-kfac-recovery
  kind: mechanism
  statement: In LocoProp-S, minimizing the local squared loss 1/2 ||W_tilde y_hat_{m-1} - a_m||^2 + 1/(2 eta) ||W_tilde - W_m||^2 with gradient-descent target a_m = a_hat_m - gamma grad_{a_hat_m} L(y, y_hat) recovers exact BackProp with effective step size eta_e = eta * gamma after a single fixed-point iteration, converges in closed form to the implicit gradient update W_m^{new} = W_m - eta_e grad_{W_m} L(y, y_hat)(I + eta y_hat_{m-1} y_hat_{m-1}^T)^{-1} (Eq. 4), and recovers the full K-FAC update when the target uses the pre-activation Fisher inverse F_m^{-1} (Proposition 1 & Appendix D, Eq. 15).
  evidence:
  - source_id: r649-primary-pdf
    locator: Section 2.1, Eqs. 3-4 & Proposition 1, pp. 3-4; Appendix D, Eqs. 12-15, p. 13
    relation: supports
- claim_id: r649-locoprop-m-convex-bregman-matching-loss-sylvester
  kind: mechanism
  statement: In LocoProp-M, replacing the local squared loss with the Bregman matching loss D_{F_m}(y_m, f_m(W_tilde y_hat_{m-1})) induced by the convex integral F_m of an elementwise non-decreasing transfer function f_m = grad F_m and mirror-descent target y_m = y_hat_m - gamma grad_{a_hat_m} L(y, y_hat) yields a layerwise problem that is convex in W_m (Proposition 2), recovers BackProp at T = 1 iteration, and satisfies a linearized Sylvester equation whose vectorized update delta_m = -eta_e C_m^{-1}(I kron H_{F_m}^{-1}) vec(grad_{W_m} L) with C_m = I kron H_{F_m}^{-1} + eta y_hat_{m-1} y_hat_{m-1}^T kron I preconditions by both input activations and activation-Hessian curvature H_{F_m} = grad^2 F_m (Proposition 3, Eqs. 8-11).
  evidence:
  - source_id: r649-primary-pdf
    locator: Section 2.2.1-2.2.3, Eqs. 5-8 & Propositions 2-4, pp. 4-6; Appendix B, Eqs. 9-11, pp. 11-12
    relation: supports
- claim_id: r649-deep-autoencoder-complexity-and-walltime-application
  kind: application
  statement: LocoProp requires O(prod_i d_i) + O(b sum_i d_i) memory and O(b T prod_i d_i) compute for batch size b and T local iterations (avoiding the O(sum_i d_i^2) memory and O(sum_i d_i^3) matrix-inversion cost of K-FAC and Shampoo), and with T = 10 RMSProp local iterations significantly accelerates training-loss convergence and reduces wall-clock time on standard (2.72M), deep (6.72M), and wide (26M) deep autoencoder benchmarks on MNIST, Fashion-MNIST, and CURVES.
  evidence:
  - source_id: r649-primary-pdf
    locator: Section 3.1-3.5, Table 1 & Figures 3-5, pp. 6-8
    relation: supports
- claim_id: r649-non-strictly-increasing-relu-and-overfitting-limitations
  kind: limitation
  statement: For non-decreasing but not strictly increasing transfer functions such as ReLU, the integral function F is not strictly convex and induces matching losses with flat zero regions where D_F(a_hat, a) = 0 for all a_hat, a <= 0 (so LocoProp-M eventually converges to a similar solution as tuned RMSProp on MNIST-ReLU), and rapid training-loss minimization on deep autoencoders exhibits test-loss overfitting under fixed default weight decay.
  evidence:
  - source_id: r649-primary-pdf
    locator: Section 2.2.2, Figure 2, p. 5; Appendix A, Table 2, p. 11; Appendix G & I, Figures 6 & 8, pp. 15-17
    relation: supports
