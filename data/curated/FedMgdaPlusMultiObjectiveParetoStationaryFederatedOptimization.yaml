claims:
- claim_id: r493-claim-1
  kind: mechanism
  statement: FedMGDA+ normalizes each participating client i's accumulated update g_bar_i = g_i / ||g_i||_2 and computes weights lambda_t^* = argmin_{lambda in Delta, ||lambda - lambda_0||_infty <= epsilon} ||sum_{i in I_t} lambda_i g_bar_i||_2^2 to step along d_t = sum_{i in I_t} lambda_{t,i}^* g_bar_i (Equation 25, Algorithm 1), recovering fixed-weight normalized FedAvg at epsilon = 0 and unconstrained MGDA at epsilon = 1 where d_t is a common descent direction satisfying f(w_{t+1}) <= f(w_t) component-wise for all participating objectives (Equation 24).
  evidence:
  - source_id: r493-primary-pdf
    locator: Section 5, pp. 6-9, Equations 19-25, Algorithm 1
    relation: supports
- claim_id: r493-claim-2
  kind: mechanism
  statement: Function-value centering w_tilde_{t+1} = argmin_w max_{lambda in Delta} lambda^T (f(w) - f(w_tilde_t)) (Equation 19) makes FedMGDA+ invariant to arbitrary additive loss-inflation attacks f_i -> f_i + c_i, unit gradient normalization g_bar_i = g_i / ||g_i||_2 confers invariance to positive multiplicative scaling attacks f_i -> alpha_i f_i, and Theorems 1a, 1b, and 2 prove convergence to Pareto-stationary solutions with min_{0 <= t <= T} E||J_f(w_t) lambda_t||_2^2 -> 0 and E||w_t - w_t^*||_2^2 <= 4 M^2 / (c^2 (t + 3)) (Equations 28-30).
  evidence:
  - source_id: r493-primary-pdf
    locator: Sections 5 & 6.2.2, pp. 6-8 & 13, Equations 19 & 26-30; Appendix A, pp. 17-20, Equations 31-75
    relation: supports
- claim_id: r493-claim-3
  kind: limitation
  statement: When the number of simultaneously participating users exceeds the model dimension d so that the Jacobian J_f has full row rank, unconstrained MGDA can hit trivial Pareto-stationarity in a single step unless user subsampling or epsilon-box constraints are applied; additionally, small-batch stochastic gradient noise can reduce the fraction of participating users whose loss strictly decreases in a single round.
  evidence:
  - source_id: r493-primary-pdf
    locator: Sections 5 & 6.2.3, pp. 7-8 & 14, Figure 4
    relation: supports
- claim_id: r493-claim-4
  kind: application
  statement: Applied to fair and adversary-robust federated learning on CIFAR-10, Fashion-MNIST, Federated EMNIST, Shakespeare, and Adult benchmarks, improving worst-5% user accuracy and percentage of improved participants per round while maintaining accuracy under additive bias and multiplicative scaling attacks that degrade AFL and q-FedAvg.
  evidence:
  - source_id: r493-primary-pdf
    locator: Section 6, pp. 9-14, Tables 1-6, Figures 1-4; Appendix B, pp. 21-31
    relation: supports
