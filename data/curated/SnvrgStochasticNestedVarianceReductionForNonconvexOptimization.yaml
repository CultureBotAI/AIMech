id: AIMech:SnvrgStochasticNestedVarianceReductionForNonconvexOptimization
name: SNVRG (Stochastic Nested Variance Reduction) for Non-Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: 'Stochastic Nested Variance Reduction (SNVRG) is a multi-level hierarchical variance-reduced stochastic gradient algorithm for non-convex finite-sum and online optimization introduced by Zhou, Xu, and Gu (2018, 2020). In each outer epoch of One-Epoch-SNVRG (Algorithm 1), SNVRG maintains K + 1 nested reference points (x_tilde^{(0)}, ..., x_tilde^{(K)}) and nested semi-stochastic gradients (g^{(0)}, ..., g^{(K)}) governed by loop-length multipliers (s_1, ..., s_K) with S_l = prod_{i=l+1}^K s_i and geometric mini-batch sizes B_l. At inner step j in {0, ..., prod_{i=1}^K s_i - 1}, let l = min{i : 0 == j mod S_i} be the deepest triggered level: SNVRG resets reference point x_tilde^{(l)} = x_j, updates level l via the nested control-variate difference g^{(l)} = g^{(l-1)} + nabla f_{B_l}(x_tilde^{(l)}) - nabla f_{B_l}(x_tilde^{(l-1)}) (where g^{(0)} = nabla f_{B_0}(x_tilde^{(0)})), synchronizes all finer levels x_tilde^{(i)} = x_j and g^{(i)} = g^{(l)} for i = l+1, ..., K, and takes an unnormalized constant-step gradient update x_{j+1} = x_j - eta * g^{(K)} with eta = O(1/L).'
identity_notes: Distinct from two-level SVRG (which corresponds to K = 1 in SNVRG and requires O(n^{2/3} * varepsilon^{-2}) or O(varepsilon^{-10/3}) gradient complexity) and distinct from SPIDER (Round 345, Fang et al. 2018), which updates at every step using the immediate predecessor x_{j-1} and requires accuracy-dependent normalized step sizes eta = O(varepsilon / L), whereas SNVRG uses K = O(log n) or O(log(1/varepsilon)) nested reference levels with a large constant step size eta = 1/(6L) and adapts automatically across the full-gradient, Polyak-Lojasiewicz, and non-convex stationary regimes.
