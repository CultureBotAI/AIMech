id: AIMech:YellowFinAutomaticMomentumAndLearningRateTuner
name: YellowFin Automatic Momentum and Learning Rate Tuner
concept_kind: algorithm
review_status: DRAFT
definition: An automatic hyperparameter tuning algorithm for Polyak heavy-ball momentum stochastic gradient descent (x_{t+1} = x_t - alpha_t grad f_{S_t}(x_t) + mu_t (x_t - x_{t-1})) that estimates extremal generalized curvatures (h_max, h_min) over a sliding window of squared gradient norms h_t = ||g_t||^2, total coordinate-wise gradient variance C = 1^T (g^2_bar - (g_bar)^2), and local quadratic distance to optimum D from exponential moving averages of ||g_t|| / ||g_t||^2, and at each iteration solves the SingleStep noisy-quadratic surrogate minimization min_{mu_t, alpha_t} (mu_t D^2 + alpha_t^2 C) subject to mu_t >= ((sqrt(h_max / h_min) - 1) / (sqrt(h_max / h_min) + 1))^2 and alpha_t = (1 - sqrt(mu_t))^2 / h_min in closed form via Vieta's cubic substitution, optionally adjusting algorithmic momentum via a negative-feedback control loop in asynchronous settings.
identity_notes: 'Distinct from per-coordinate adaptive learning-rate methods (AdaGrad, RMSProp, Adam) and from Lookahead or SWATS: YellowFin tunes a single global learning rate alpha_t and a single global Polyak momentum parameter mu_t at every step by enforcing the momentum operator''s robust-region invariants (1 - sqrt(mu_t))^2 <= alpha_t h <= (1 + sqrt(mu_t))^2 across the dynamic range nu = h_max / h_min of generalized curvatures so that the bias operator A_t has homogeneous spectral radius sqrt(mu_t) and the variance operator B_t has spectral radius mu_t.'
aliases:
