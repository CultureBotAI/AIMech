claims:
- claim_id: c-r620-robust-region-homogeneous-spectral-radii
  kind: mechanism
  statement: For any scalar or multidimensional objective whose generalized curvature eigenvalues h satisfy the robust-region inequality (1 - sqrt(mu))^2 <= alpha h <= (1 + sqrt(mu))^2, the Polyak momentum bias operator A_t has complex-conjugate eigenvalues of magnitude sqrt(mu) so its spectral radius is rho(A_t) = sqrt(mu) independent of alpha and h (Lemmas 3 and 7), and under the exact same condition the 3x3 stochastic variance operator B has spectral radius rho(B) = mu (Lemmas 6 and 10), reducing the expected squared distance surrogate to mu^t ||x_0 - x*||^2 + (1 - mu^t) alpha^2 C / (1 - mu).
  evidence:
  - source_id: r620-primary-pdf
    locator: Section 2.2 Lemma 3, Eq. (5)-(9), p. 4-6; Section 3 Lemmas 5-6, Eq. (11)-(14), p. 7; Appendices A-C, p. 17-20
    relation: supports
- claim_id: c-r620-singlestep-cubic-closed-form-and-oracles
  kind: mechanism
  statement: Substituting x = sqrt(mu) in [0, 1) and alpha = (1 - x)^2 / h_min into SingleStep (Eq. 15) yields the unimodal quartic objective p(x) = x^2 D^2 + (1 - x)^4 C / h_min^2, whose unique stationary point x_p in (0, 1) solves the cubic equation 2 x D^2 - (4 C / h_min^2)(1 - x)^3 = 0 in closed form via Vieta's substitution, giving the exact constrained optimizer sqrt(mu_t) = max(x_p, (sqrt(h_max / h_min) - 1) / (sqrt(h_max / h_min) + 1)) from O(d) gradient-only measurement oracles CurvatureRange, Variance, and Distance.
  evidence:
  - source_id: r620-primary-pdf
    locator: Section 3.1-3.2, Eq. (15), Algorithms 1-4, p. 8-9; Appendix D, p. 20
    relation: supports
- claim_id: c-r620-closed-loop-asynchronous-momentum-control
  kind: application
  statement: In asynchronous-parallel training with staleness tau, stale gradients induce extra implicit momentum so total system momentum mu_T exceeds algorithmic momentum mu; Closed-loop YellowFin (Algorithm 5) estimates mu_hat_T = median((x_{t-tau} - x_{t-tau-1} + alpha grad f_{S_{t-tau-1}}(x_{t-tau-1})) / (x_{t-tau-1} - x_{t-tau-2})) and applies negative feedback mu <- mu + gamma (mu* - mu_hat_T), achieving up to 2.69x speedup over Adam on 16-worker asynchronous ResNet training.
  evidence:
  - source_id: r620-primary-pdf
    locator: Section 4 Eq. (16) & Figure 4, p. 10; Section 5.2, p. 12; Appendix G Eq. (36)-(37) & Algorithm 5, p. 22-23
    relation: supports
- claim_id: c-r620-non-smooth-exploding-gradient-limitation
  kind: limitation
  statement: Because YellowFin approximates directional Hessian curvature by squared stochastic gradient norms h_t = ||g_t||^2 under a negative log-likelihood Fisher assumption, abrupt steep slopes and exploding gradients in non-stationary recurrent or sequence-to-sequence landscapes can corrupt the upper curvature envelope h_max unless stabilized by capping envelope growth at 100 * h_max and clipping gradients at threshold sqrt(h_max).
  evidence:
  - source_id: r620-primary-pdf
    locator: Section 3.2-3.3, Table 1, p. 8-10; Appendix E-F, Eq. (35) & Figure 6, p. 20-21
    relation: supports
