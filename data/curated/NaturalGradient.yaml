id: AIMech:NaturalGradient
name: Natural gradient
concept_kind: mathematical_method
aliases: []
definition: A metric-dependent differential method that maps the coordinate derivatives of a differentiable
  objective to a tangent vector by the inverse of a positive-definite Riemannian metric, giving the local
  first-order steepest-descent direction when negated; the model Fisher information supplies its statistical
  specialization.
definition_evidence:
- source_id: amari1998
  locator: Section 2, PDF pp. 2–4 / printed pp. 252–254, Theorem 1 and Equation 2.3; Section 3.1, PDF
    p. 5 / printed p. 255, Equation 3.5.
  relation: supports
claims:
- claim_id: metric-dependent-local-direction
  kind: mechanism
  statement: For a differentiable objective L at an interior parameter w and a symmetric positive-definite
    Riemannian metric G(w), the natural gradient is v=G(w)^(-1)*g, where g is the column of coordinate
    derivatives of L. Its negative is the local first-order steepest-descent direction for the metric
    norm. For g != 0, the unit-metric descent direction is -G^(-1)*g/sqrt(g^T*G^(-1)*g). This minimizes
    the linearized change in L, not generally the nonlinear objective over a finite-radius neighborhood.
    At g=0 the first-order problem supplies no preferred descent direction.
  evidence:
  - source_id: amari1998
    locator: Section 2, PDF pp. 2–4 / printed pp. 252–254, Equations 2.1–2.5 and Theorem 1; normalized
      direction follows from its metric-norm constraint.
    relation: supports
  - source_id: amari1996-nips9
    locator: Section 3, PDF p. 3 / printed p. 129, Riemannian metric and natural-gradient direction.
    relation: supports
- claim_id: model-fisher-statistical-metric
  kind: mechanism
  statement: For a regular differentiable density family p(z;w), the statistical specialization uses the
    model Fisher matrix F(w)=E_{z~p(. ;w)}[s(z,w)*s(z,w)^T], with s=grad_w log p(z;w). Finite score moments
    and a locally nondegenerate parameterization are required for the displayed inverse. In the conditional
    neural example, the expectation includes the fixed input law and the model conditional output law.
    An outer-product average using observed labels is not automatically the same matrix; a generic positive-definite
    preconditioner is not automatically this Fisher.
  evidence:
  - source_id: amari1998
    locator: Section 3.1, PDF p. 5 / printed p. 255, Equations 3.3–3.5; Section 3.2, PDF p. 6; Section
      6 derivation, PDF pp. 15–16 / printed pp. 265–266. Equation 3.11 discrepancy is retained below.
    relation: supports
  - source_id: amari1996-nips9
    locator: Section 4, PDF p. 4 / printed p. 130, Equation 11 uses the outer product of log-density derivatives.
    relation: supports
- claim_id: sampled-loss-gradient-use
  kind: mechanism
  statement: For expected loss L(w)=E_q[l(z,w)] and independent observations from a fixed data law q,
    the source uses w_{t+1}=w_t-eta_t*G(w_t)^(-1)*grad_w l(z_t,w_t). The learning rate and metric construction
    remain separate choices; replacing the sampled derivative by grad L gives the corresponding deterministic
    local direction. This mathematical rule does not alone specify initialization, metric estimation,
    step-size selection or admissible-domain handling. A finite sampled step need not decrease the population
    loss or remain in the domain.
  evidence:
  - source_id: amari1998
    locator: Equation 2.5, PDF p. 4 / printed p. 254; Section 3, Equations 3.1–3.2; Section 3.2, Equation
      3.10, PDF pp. 4–6 / printed pp. 254–256.
    relation: supports
- claim_id: coordinate-direction-and-finite-step-boundary
  kind: scope
  statement: 'Under a smooth coordinate diffeomorphism w=h(theta) with nonsingular Jacobian J, use the
    same metric in the new coordinates: G_theta=J^T*G_w*J and g_theta=J^T*g_w. Then v_theta=J^(-1)*v_w,
    so the natural-gradient direction and its continuous flow transform as a tangent vector. This is a
    curator chain-rule consequence of the source metric definition. For a twice-differentiable nonlinear
    h, mapping an additive step back generally agrees only to first order, with O(eta^2) differences.
    Corresponding affine coordinate changes preserve additive steps exactly; arbitrary nonlinear finite-step
    invariance is not implied.'
  evidence:
  - source_id: amari1998
    locator: Section 2, PDF pp. 2–4 / printed pp. 252–254, metric tensor and Equation 2.3. The transformation
      and finite-step qualification are explicit curator chain-rule/Taylor consequences, not a quoted
      finite-update theorem.
    relation: supports
- claim_id: specified-right-invariant-matrix-geometry
  kind: mechanism
  statement: On nonsingular square matrices W, transport the identity Frobenius inner product through
    dX=dW*W^(-1). This specified right-invariant metric yields the matrix natural gradient (grad_W L)*W^T*W.
    The source applies this geometry in blind signal separation. It is a specialization, not the formula
    for every natural gradient or automatically the exact model Fisher for every unknown source density.
    The differential frame dX need not integrate to global matrix coordinates, and a general finite additive
    update need not preserve nonsingularity.
  evidence:
  - source_id: amari1998
    locator: Section 7, PDF pp. 19–21 / printed pp. 269–271, Equations 7.1–7.10, Theorem 6 and the nonintegrable-frame
      paragraph.
    relation: supports
  - source_id: amari-cichocki-yang1996-nips8
    locator: PDF p. 5 / printed p. 761, Equations 18–19, metric-adjusted matrix direction and the outer-product
      separation update.
    relation: supports
- claim_id: conditional-reported-asymptotic-efficiency
  kind: scope
  statement: 'For the realizable independent-observation log-loss setting, Theorem 2 reports Fisher efficiency
    of the natural-gradient online estimator with learning rate 1/t: the leading asymptotic error second
    moment is F(w*)^(-1)/t. This is a qualified reported result using convergence, regularity and an invertible
    Fisher, not a general convergence or finite-sample guarantee. The displayed proof remainder is not
    certified here. The source separately uses the expected loss Hessian for its misspecified extension
    and excludes generic semiparametric separation and deconvolution from this Fisher-efficiency conclusion.'
  evidence:
  - source_id: amari1998
    locator: Section 4, PDF pp. 10–12 / printed pp. 260–262, Equation 4.4, Theorem 2, Equations 4.5–4.9
      and the semiparametric remark. Proof-rate qualification is retained below.
    relation: supports
