- target: AIO:MathematicalFunction
  relation: related_match
  rationale: For a fixed objective and metric, the construction defines a mathematical rule from parameter
    values to tangent vectors. This broad relationship is not equivalence or an upstream subclass assertion,
    and does not identify the direction with a scalar activation, neural layer or complete optimizer.
limitations:
- The ordinary inverse requires a positive-definite metric on the stated parameter region. Redundant or
  singular statistical parameterizations need additional treatment. Pseudoinverses, damping, quotient
  constructions and numerical approximations are not automatically equivalent to the displayed method.
  Neither a useful local direction nor a valid Fisher guarantees admissible finite steps, monotonic loss
  improvement or convergence.
- Amari 1998 Equation 3.11 (PDF p. 6 / printed p. 256) prints a density derivative rather than a log-density
  derivative in its second factor. The coherent model-score definition used here is Equation 3.5, the
  explicit derivation on PDF p. 16 and the earlier NIPS 9 Equation 11. This visually checked discrepancy
  is not an author-issued erratum. The empirical observed-label outer product and the model expectation
  remain distinct.
- Amari 1998 Equation 7.11 (PDF p. 21 / printed p. 271) prints I-phi(y)^T*y although phi is a column vector.
  Its preceding differential instead yields the matrix outer product and descent (I-phi(y)*y^T)*W; the
  earlier NIPS 8 Equation 19 (PDF p. 5 / printed p. 761) shows that outer product. The general metric
  formula in Theorem 6 is retained without certifying the inconsistent display or an executable blind-separation
  implementation.
- The proof on PDF p. 12 / printed p. 262 displays G(w_t)=G(w*)+O(1/t) after invoking convergence. That
  rate does not follow from generic consistency or root-t parameter error alone, and its necessary extra
  assumptions or error mode have not been established here. Theorem 2 is retained as a conditional reported
  asymptotic result, not a complete proof certification, a global convergence theorem or an efficiency
  claim for arbitrary losses, misspecified models or unknown semiparametric source densities.
- 'The source describes Fisher as the only invariant metric on PDF p. 5 / printed p. 255, citing characterization
  results whose assumptions were not inspected. Coordinate covariance alone does not establish such uniqueness:
  other Riemannian metrics also transform tensorially. No universal uniqueness claim is made. General
  metric geometry is distinguished from the specific statistical model and from finite additive-update
  behavior.'
- Generic natural gradient is distinct from NES, IGO, xNES and SNES, which add particular distribution
  families, objectives or rank utilities, sampling rules and finite updates. Ordinary SGD, trust-region
  policy optimization and concrete variational or blind-separation algorithms also retain their own identities.
  The general direction does not resolve the remaining source-specialization work attached to frontier
  owner 196.
- The 1998 plateau discussion (PDF p. 18 / printed p. 268) is not a universal acceleration guarantee.
  The systems extension on PDF p. 23 / printed p. 273 omits its proof and need not give a causal or finite-impulse-response
  direction. No benchmark, universal speedup, global optimum, complete deconvolution method or historical-priority
  claim is asserted.
- The 26-page RIKEN-hosted journal copy, the seven-page NIPS 9 general article and the seven-page NIPS
  8 separation article are distinct primary versions with retained hashes and acquisition receipts. Source-reading
  scopes and the corrected timing of the root BSS visual assessment remain in the preparation handoff.
  Failed source access is preserved separately. No author code, numerical calculator or empirical replication
  was executed for this draft.
