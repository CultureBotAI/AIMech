name: Diagonal structured state space model
definition: A diagonal state-space sequence-model family that computes its discretized convolution kernel
  by a Vandermonde product, with explicit choices of discretization, state-matrix constraint and initialization.
concept_kind: model_family
identity_notes: S4D is the family defined by Gu and colleagues, distinguished from S4's diagonal-plus-low-rank
  construction. The paper separates the earlier DSS configuration and the S4D-LegS, S4D-Inv and S4D-Lin
  initialization choices rather than treating all diagonal models as identical.
limitations:
- Algebraic diagonalizability does not guarantee numerically stable representation or successful optimization;
  initialization and discretization remain explicit choices.
- S4D-LegS convergence to the corresponding S4 dynamics is an infinite-state-size statement, not exact
  equality of all finite S4D and S4 models.
- The inverse-law spectral asymptotics are presented as Conjecture 4, not a proved theorem. No universal
  performance advantage is asserted.
