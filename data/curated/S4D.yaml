claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Discretize a diagonal continuous-time state model using bilinear or zero-order-hold rules.
    Kernel entries are sums of output and input coefficients multiplied by powers of the discretized diagonal
    state entries. Constrain the continuous state eigenvalue real parts using the chosen parameterization
    and initialize their spectrum according to the selected variant.
