id: AIMech:ClippedGossipSelfCenteredClippingForByzantineRobustDecentralizedLearning
name: ClippedGossip Self-Centered Clipping for Byzantine-Robust Decentralized Learning
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-robust decentralized consensus and stochastic optimization algorithm on an arbitrary communication graph G = (V, E) with regular nodes V_R (whose induced subgraph G_R has spectral gap gamma > 0) and Byzantine nodes V_B controlling adjacent mixing weight delta_i = sum_{j in V_B} W_{ij} <= delta_max around regular node i, in which each regular worker i updates local momentum m_i^{t+1} = (1 - alpha) m_i^t + alpha g_i(x_i^t), takes a half-step x_i^{t+1/2} = x_i^t - eta m_i^{t+1}, and aggregates neighbor models by clipping received vectors around its own local reference iterate x_i^{t+1/2} as x_i^{t+1} = sum_{j=1}^n W_{ij} (x_i^{t+1/2} + CLIP(x_j^{t+1/2} - x_i^{t+1/2}, tau_i^{t+1})) with CLIP(z, tau) = min(1, tau / ||z||_2) z.
identity_notes: 'Distinct from server-based Byzantine clipping and bucketing aggregators (such as AIMech:BucketingForAgnosticByzantineRobustAggregationOnHeterogeneousDatasets and AIMech:CrflCertifiablyRobustFederatedLearningViaParameterClippingAndSmoothing) and from decentralized coordinate-wise trimmed-mean / median / Krum screening in BRIDGE (AIMech:BridgeByzantineResilientDecentralizedGradientDescent): ClippedGossip (also termed Self-Centered Clipping; He, Karimireddy, & Jaggi, 2022) clips each neighbor j''s model relative to node i''s own trusted state x_i^{t+1/2} weighted by doubly stochastic mixing weights W_{ij}, eliminating the requirement of an honest majority in every node''s neighborhood and preserving information diffusion across sparse graph cuts (such as a dumbbell bridge) where coordinate-wise trimmed mean and geometric median stall.'
aliases:
- ClippedGossip
- Self-Centered Clipping
- Byzantine-Robust ClippedGossip Decentralized Optimization
