claims:
- claim_id: clippedgossip-self-centered-consensus-contraction
  kind: mechanism
  statement: By centering the clipping ball of radius tau_i = sqrt((1 / delta_i) sum_{j in V_R} W_{ij} E||x_i - x_j||_2^2) at node i's own model x_i and averaging z_{j->i} = x_i + CLIP(x_j - x_i, tau_i) with mixing weights W_{ij}, ClippedGossip contracts the average consensus variance Xi^t = (1 / |V_R|) sum_{i in V_R} E||x_i^t - x_bar^t||_2^2 <= (1 - gamma + c sqrt(delta_max))^2 rho^2 and bounds the mean shift by E||x_bar^{t+1} - x_bar^t||_2^2 <= c^2 delta_max rho^2 whenever delta_max < gamma^2 / c^2 (Theorem I, Theorem I', Eq. 24).
  evidence:
  - source_id: r545-primary-pdf
    locator: Section 4.1 Theorem I p. 4; Appendix E.2 Lemma 10 & Theorem I' p. 28-30 Eq. 24
    relation: supports
- claim_id: clippedgossip-nonconvex-spectral-gap-convergence-and-impossibility
  kind: scope
  statement: For L-smooth non-convex objectives with bounded stochastic gradient variance sigma^2, inter-worker heterogeneity zeta^2, and Byzantine edge weight delta_max = O(gamma^2), ClippedGossip with local momentum alpha = 3 eta L reaches an O(delta_max zeta^2 / gamma^2) + epsilon stationary point in O((sigma^2 / (n epsilon^2))(1/n + delta_max) + zeta / (gamma epsilon^{3/2}) + sigma^{2/3} / (gamma^{2/3} epsilon^{4/3}) + 1 / (gamma epsilon)) iterations (Theorem III), matching the fundamental Omega(1) consensus impossibility lower bound on sparse cut-set topologies (Theorem II).
  evidence:
  - source_id: r545-primary-pdf
    locator: Section 4.2 Theorem II p. 5; Section 5 Theorem III p. 6; Appendix E.3 Theorem III' p. 33-35
    relation: supports
- claim_id: clippedgossip-spectral-gap-threshold-and-dissensus-limitation
  kind: limitation
  statement: When the communication graph has a small spectral gap gamma relative to the maximum Byzantine edge weight delta_max (such that delta_max >= Omega(gamma^2)), Byzantine nodes launching a topology-aware dissensus attack x_j = x_i - eps_i (sum_{k in N_i cap V_R} W_{ik}(x_k - x_i)) / (sum_{j in N_i cap V_B} W_{ij}) across a graph bottleneck can block global consensus across components.
  evidence:
  - source_id: r545-primary-pdf
    locator: Section 4.1-4.2 p. 4-5; Section 6.3 Definition A p. 9 Eq. 6; Appendix B.2 Proposition IV p. 16-17; Appendix F p. 37
    relation: supports
