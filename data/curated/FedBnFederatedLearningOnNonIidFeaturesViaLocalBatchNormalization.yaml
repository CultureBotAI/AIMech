claims:
- claim_id: r406-ntk-block-diagonal-gram-matrix-and-strictly-faster-convergence-rate
  kind: mechanism
  statement: In the over-parameterized two-layer ReLU network regime with Batch Normalization under heterogeneous client input covariances S_i = E[x^i (x^i)^T] (Assumption 4.1), Lemma 4.3 and Definition 4.2 show that FedBN induces a block-diagonal auxiliary NTK magnitude Gram matrix G^{*infty} = diag(G_1^infty,...,G_N^infty) compared to the full N*M x N*M Gram matrix G^infty of FedAvg, and Theorem 4.4 with Corollaries 4.5-4.6 proves that mu_0^* = lambda_{min}(G^{*infty}) = min_i lambda_{min}(G_i^infty) >= lambda_{min}(G^infty) = mu_0 > 0, yielding a strictly faster exponential convergence factor (1 - eta * mu_0^* / 2)^t <= (1 - eta * mu_0 / 2)^t.
  evidence:
  - source_id: r406-primary-pdf
    locator: Section 4 Convergence Analysis (Assumption 4.1, Definition 4.2, Lemma 4.3, Theorem 4.4, Corollaries 4.5-4.6) & Appendix B, pp. 4-6, 13-15
    relation: supports
- claim_id: r406-zero-overhead-compatibility-with-fedprox-and-domain-adaptation
  kind: scope
  statement: FedBN requires zero additional communication or hyperparameter tuning beyond standard FedAvg (slightly reducing communicated payload by omitting BN parameters), composes orthogonally with optimization regularizers such as FedProx, and enables adaptation to unseen target client domains by recomputing local BN statistics on unlabeled target batches.
  evidence:
  - source_id: r406-primary-pdf
    locator: Section 3.2 Algorithm 1 & Section 5.3-5.4 Experiments and Analysis (Figures 3-4, Table 1), pp. 3-4, 7-8
    relation: supports
- claim_id: r406-batch-normalization-architecture-and-feature-shift-scope-limitation
  kind: limitation
  statement: FedBN applies only to neural architectures equipped with Batch Normalization layers (which require local mini-batches large enough to estimate stable batch statistics) and specifically targets feature-shift non-IID regimes (P_i(x) variation) rather than severe concept-shift where clients have conflicting label assignments P_i(y|x) for identical features.
  evidence:
  - source_id: r406-primary-pdf
    locator: Section 3.1 Problem Statement & Section 4.1 Setup and Key Lemmas, pp. 2-5
    relation: supports
- claim_id: r406-multi-domain-digits-office-caltech-domainnet-and-abide-neuroimaging-application
  kind: application
  statement: 'Evaluated on benchmark multi-domain vision datasets ( five-source Digits: MNIST, SVHN, USPS, SynthDigits, MNIST-M; four-source Office-Caltech10; six-source DomainNet) and multi-site fMRI neuroimaging classification (ABIDE I across 4 clinical institutions), consistently outperforming Single-set, FedAvg, and FedProx.'
  evidence:
  - source_id: r406-primary-pdf
    locator: Section 5 Experiments (Figures 2-4, Tables 1-2), pp. 6-8
    relation: supports
