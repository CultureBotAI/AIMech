id: AIMech:FedBnFederatedLearningOnNonIidFeaturesViaLocalBatchNormalization
name: FedBN (Federated Learning on Non-IID Features via Local Batch Normalization)
concept_kind: algorithm
review_status: DRAFT
definition: A federated learning aggregation modality (FedBN, Algorithm 1) designed for feature-shift non-IID data (covariate shift where marginal input distributions P_i(x) vary across clients with shared conditional P(y|x), or concept shift in P_i(x|y) with shared P(y)), in which every client updates all neural network parameters locally for E steps, but during server-side synchronization at t mod E == 0 all Batch Normalization (BN) layer parameters (affine scale and shift parameters gamma, beta and running mean/variance statistics) are strictly excluded from global averaging and retained locally on each client while all non-BN (convolutional and fully connected) layer weights w_{k,l} are averaged.
identity_notes: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization) and SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning), which synchronize all model layers including Batch Normalization parameters and add proximal or control-variate corrections, and from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, which keeps the top classification head h_i local to address heterogeneous label conditional distributions P_i(y|x) rather than keeping internal Batch Normalization layers local to mitigate feature shift P_i(x)).
aliases:
- FedBN
- Federated Learning with Local Batch Normalization
- Federated Learning on Non-IID Features via Local Batch Normalization
