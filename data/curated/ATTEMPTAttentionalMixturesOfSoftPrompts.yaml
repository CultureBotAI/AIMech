id: AIMech:ATTEMPTAttentionalMixturesOfSoftPrompts
name: ATTEMPT (Attentional Mixtures of Prompt Tuning)
concept_kind: algorithm
review_status: DRAFT
definition: A modular parameter-efficient multi-task language model tuning method that pre-trains reusable soft source prompts on high-resource tasks and adapts a completely frozen language model to one or more target tasks by training a lightweight bottleneck-and-LayerNorm attention module G and a target soft prompt P_target to generate an instance-wise soft prompt P_instance(X) = P_target + sum_{j=1}^{t+1} a_j P_j as an input-conditioned attentional interpolation over the frozen source prompts and target prompt.
identity_notes: Introduced by Akari Asai, Mohammadreza Salehi, Matthew E. Peters, and Hannaneh Hajishirzi (EMNLP 2022, arXiv:2205.11961). Distinct from SPoT (Vu et al., ACL 2022; AIMech Round 698), which uses a single source prompt only as a static initialization and overwrites its parameters during target fine-tuning, and distinct from MPT (Wang et al., ICLR 2023; AIMech Round 702), which learns a single shared prompt factorized with rank-one multiplicative task vectors rather than an instance-wise attention gate over modular frozen source prompts. Both single-target-task ATTEMPT and multi-task ATTEMPT-m (which shares the attention module G across N target tasks) are covered within this single record.
aliases:
- ATTEMPT
- ATTEMPT-m
- ATTEntional Mixtures of Prompt Tuning
- Attentional Mixtures of Soft Prompts for Multi-Task Tuning
