name: Context-sensitive emission hidden Markov model
definition: A hidden-state sequence-model family with a first-order Markov prior whose observation distributions
  depend jointly on hidden states at multiple temporal positions, introducing context beyond the contemporaneous
  hidden state.
concept_kind: model_family
identity_notes: This is the Saul–Jordan context-sensitive emission construction. Its displayed one-sided
  Gaussian example uses states at t and t+Delta, while the reported illustration extends to left and right
  context. The defining distinction is the emission dependency, not a higher-order hidden transition,
  an external stack/queue, mixed-memory predecessor selection, independent factorial chains or the structured
  mean-field algorithm used to approximate its posterior. The descriptive local name disambiguates it
  from Yoon–Vaidyanathan’s auxiliary-memory context-sensitive HMM; the bare acronym csHMM is not asserted
  as an alias. No normalized identity match was found across all442 pinned AIO labels and scoped synonyms
  and385 preceding native IDs/names/aliases for the four researched candidates. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main, yielding78 and83 matched lines;
  all44 unique contents were read. Hits concern prior source citations, pending leads, neighboring HME
  records and unrelated Python-license authors, not existing records of the three selected identities.
  All76 semantic label/synonym hits and22 exact fully annotated AIO CLASS nodes with outgoing edges were
  read. Twenty-five contextual YAMLs were byte-verified after prior full reading and eight freshly read,
  totaling22 generated and11 native neighbors. Adaptive local experts substantially overlaps represented
  MDN/HME scope and receives no duplicate ID. Bare context-sensitive HMM and csHMM are searched homonyms,
  not unconditional aliases. Absence is bounded to the pin and inspected semantic neighborhood.
limitations:
- The source’s Equation(23) omits the initial-state law and Equation(26) suppresses boundary corrections.
  The normalized finite-window convention is stated explicitly here; other endpoint or padding choices
  define different models.
- Equation(26) uses the contemporaneous observation in a combined unary expression. In a general sequence,
  a delayed-state contribution must instead use the corresponding earlier observation; this cannot be
  repaired only by ignoring endpoints.
- The prior remains first-order, but the conditioned hidden distribution generally has long-range interactions.
  A standard HMM forward–backward pass over the original single state is not automatically exact; exact
  inference can require an expanded state with cost growing with context width.
- The Gaussian additive-mean, identity-covariance form is the inspected example, not a claim that every
  contextual emission distribution must have that form. The synthetic Figure1 uses five states and two-sided
  context rather than only the displayed binary one-sided specialization.
- A usual HMM can retain marginal correlations over many time steps. The distinction is added direct conditional
  dependency through emissions, not the existence of any long-lag correlation or a causal interpretation
  of future context. No speech benchmark or accuracy guarantee is asserted.
