id: AIMech:AdanAdaptiveNesterovMomentumAlgorithm
name: Adan (Adaptive Nesterov Momentum Algorithm)
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive first-order stochastic optimization algorithm for deep neural networks that reformulates Nesterov accelerated gradient via Nesterov Momentum Estimation (NME) so that lookahead extrapolation requires zero additional gradient oracle evaluations. At step k, Adan updates a first-order gradient EMA m_k = (1 - beta_1) m_{k-1} + beta_1 g_k, a first-order gradient-difference EMA v_k = (1 - beta_2) v_{k-1} + beta_2 (g_k - g_{k-1}), a second-order composite moment n_k = (1 - beta_3) n_{k-1} + beta_3 [g_k + (1 - beta_2)(g_k - g_{k-1})]^2, an elementwise adaptive step size eta_k = eta / (sqrt(n_k) + eps), and a proximal weight-decay iterate update theta_{k+1} = (1 + lambda_k eta)^{-1} (theta_k - eta_k circ (m_k + (1 - beta_2) v_k)).
identity_notes: 'Distinct from Nadam (Dozat 2016), AdamW (Loshchilov and Hutter 2019), Lion (AIMech:LionEvoSignMomentumOptimizer), and AdEMAMix (AIMech:AdEMAMixDualExponentialMovingAverageOptimizer): Adan derives its update from an algebraic rearrangement of Nesterov''s extrapolated gradient (Lemma 1, Eq. 4) that maintains a dedicated gradient-difference EMA v_k with its own decay coefficient beta_2, preconditioning the combined vector m_k + (1 - beta_2) v_k by the RMS of the composite Nesterov perturbation g_k + (1 - beta_2)(g_k - g_{k-1}) and applying exact proximal scaling (1 + lambda_k eta)^{-1} for decoupled L2 regularization.'
aliases:
- Adan Optimizer
- Adaptive Nesterov Momentum Estimation
- NME Adaptive Nesterov Optimizer
