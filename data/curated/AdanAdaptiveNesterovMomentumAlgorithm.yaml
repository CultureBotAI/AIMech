claims:
- claim_id: nesterov-momentum-estimation-lemma-1-equivalence
  kind: mechanism
  statement: Lemma 1 (Section 2.1, p. 3) proves that the lookahead Nesterov accelerated gradient recursion theta'_k = theta_k - eta (1 - beta_1) m_{k-1}, m_k = (1 - beta_1) m_{k-1} + g'_k, theta_{k+1} = theta_k - eta m_k is algebraically identical to defining u_k := theta'_k with update u_{k+1} = u_k - eta m'_k, where m'_k = (1 - beta_1) m'_{k-1} + [g'_k + (1 - beta_1)(g'_k - g'_{k-1})] = sum_{t=0}^k (1 - beta_1)^t [g'_{k-t} + (1 - beta_1)(g'_{k-t} - g'_{k-t-1})], eliminating the need to compute gradients at a separate extrapolated point.
  evidence:
  - source_id: r602-primary-pdf
    locator: Section 2.1, Eqs. 3-4 and Lemma 1, p. 3
    relation: supports
- claim_id: proximal-weight-decay-fixed-point-and-separability
  kind: mechanism
  statement: Adan derives its weight-decay step theta_{k+1} = (1 + lambda_k eta)^{-1} (theta_k - eta_k circ (m_k + (1 - beta_2) v_k)) as the exact first-order approximation to the scaled proximal operator argmin_theta { (lambda_k eta / 2) ||theta||_2^2 + (1/2) ||theta - (theta_k - eta_k circ u_k)||_{1/sqrt(eta_k)}^2 } (Eq. 5, p. 4), and Proposition 3 (p. 5) proves that every fixed point theta* of Adan satisfies nabla F(theta*) + lambda (c_l + eps) theta* = 0, dynamically decoupling the optimization objective from weight-decay scaling.
  evidence:
  - source_id: r602-primary-pdf
    locator: Section 2.1, Eq. 5, p. 4; Section 2.2, Proposition 3, p. 5
    relation: supports
- claim_id: smooth-and-holder-nonconvex-stochastic-complexity-theorems-1-and-2
  kind: scope
  statement: Under L-smooth nonconvex stochastic objectives with coordinate-wise bounded gradient norms ||g_k||_infty <= c_infty and variance E||g_k - nabla F(theta_k)||_2^2 <= sigma^2 (Assumptions 1-3), Theorem 1 (Section 2.3, p. 5) proves that Adan achieves an epsilon-approximate first-order stationary point in O(c_infty sigma^2 epsilon^{-4}) stochastic gradient evaluations, matching the lower bound under weakened coordinate-wise boundedness, while Theorem 2 (p. 6) establishes convergence under Holder-continuous gradients with parameter nu in (0, 1) without global Lipschitz smoothness.
  evidence:
  - source_id: r602-primary-pdf
    locator: Section 2.3, Assumptions 1-3, Theorem 1, and Theorem 2, p. 5-6
    relation: supports
- claim_id: vision-nlp-and-rl-training-acceleration
  kind: application
  statement: Across ViT, Swin, ConvNeXt, ResNet, MAE, GPT-2, Transformer-XL, BERT, and MuJoCo PPO benchmarks, Adan matches or exceeds the test accuracy and reward of Adam, AdamW, LAMB, and AdaBelief while using half the training epochs on ImageNet vision backbones.
  evidence:
  - source_id: r602-primary-pdf
    locator: Section 3, Tables 2-12, p. 6-11
    relation: supports
- claim_id: extra-gradient-difference-state-and-three-beta-hyperparameters
  kind: limitation
  statement: "Adan stores three running state tensors per parameter (m_k, v_k, n_k) plus the previous step gradient g_{k-1}\u2014increasing optimizer state memory relative to two-state AdamW\u2014and introduces three momentum decay hyperparameters (beta_1, beta_2, beta_3) that require coordinated selection."
  evidence:
  - source_id: r602-primary-pdf
    locator: Section 2.1, Algorithm 1, p. 4
    relation: supports
