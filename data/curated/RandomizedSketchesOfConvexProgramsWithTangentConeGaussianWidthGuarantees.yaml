id: AIMech:RandomizedSketchesOfConvexProgramsWithTangentConeGaussianWidthGuarantees
name: Randomized Sketches of Convex Programs with Tangent-Cone Gaussian-Width Cost-Approximation and Privacy
  Mutual-Information Guarantees
concept_kind: mathematical_method
aliases:
- Randomized Sketches of Convex Programs with Sharp Guarantees (Pilanci & Wainwright 2015)
- Tangent-Cone Gaussian-Width Sketched Convex Programming
- S-Gaussian and Rademacher Width Randomized Orthonormal System Convex Sketching
- Privacy-Preserving Sketched Convex Optimization with Vanishing Mutual Information Rate
- Second-Order Set-Difference Covering Reduction for Sketched Convex Cones
definition: 'Randomized Sketches of Convex Programs with Tangent-Cone Gaussian-Width Cost-Approximation
  and Privacy Mutual-Information Guarantees is a convex-analytic dimensionality-reduction and privacy-preserving
  optimization framework introduced by Pilanci and Wainwright (2015, IEEE Transactions on Information
  Theory 61(9):5096-5115, arXiv:1404.7203v1, DOI:10.1109/TIT.2015.2450722) for approximating constrained
  convex quadratic programs x^* in argmin_{x in C} f(x) := ||A x - y||_2^2 over an arbitrary convex constraint
  set C subseteq R^d by solving the projected program x_hat in argmin_{x in C} g(x) := ||S(A x - y)||_2^2
  with a sketching matrix S in R^{m x n} (m < n). Let K := cl conv {Delta = t(x - x^*) : t >= 0, x in
  C} denote the tangent cone of C at x^* (Equation 4) and AK = {A Delta : Delta in K} its linear image
  with Gaussian width W(AK) := E_g[sup_{z in AK cap S^{n-1}} |<g, z>|] (Equation 5). Lemma 1 (p. 17, Equations
  41a-45) proves that for any deterministic matrix S, the relative cost ratio satisfies f(x_hat) <= {1
  + 2 Z_2(AK) / Z_1(AK)}^2 f(x^*), where Z_1(AK) := inf_{v in AK cap S^{n-1}} (1/m)||S v||_2^2 and Z_2(AK)
  := sup_{v in AK cap S^{n-1}} |<u, (S^T S / m - I) v>| for u = (A x^* - y)/||A x^* - y||_2. For sigma-sub-Gaussian
  sketches (Theorem 1, Equation 7), sketch size m >= (c_0 / delta^2) W^2(AK) guarantees multiplicative
  delta-optimality f(x_hat) <= (1 + delta)^2 f(x^*) with probability at least 1 - c_1 e^{-c_2 m delta^2},
  while Corollary 1 (Equation 8) proves that Gaussian sketching of i.i.d. data matrices with entry variance
  gamma^2 bounds the mutual information per symbol by I(S A; A)/(n d) <= (c_0 / delta^2) (W^2(AK)/n) log(2
  pi e gamma^2), which vanishes whenever W^2(AK) = o(n). For randomized orthonormal system (ROS) sketches
  s_i = sqrt(n) D H^T p_i (Theorem 2, Equation 11) and non-convex set-difference covering reductions (Section
  5, Lemmas 8-13), the framework establishes sharp sketch-dimension bounds for unconstrained least squares,
  l_1-constrained Lasso, compressed sensing with folded noise, simplex-constrained dual SVMs and Markowitz
  portfolios, weighted nuclear-norm matrix approximation, and group-sparse second-order cone programs
  (Corollaries 2-7).'
identity_notes: Resolved against all 442 pinned AIO records and 621 maintained AIMech records. Distinct
  from AIMech:IterativeHessianSketchForConstrainedLeastSquares (Pilanci & Wainwright 2016, JMLR 17(53):1-38,
  arXiv:1411.0347v1, which establishes Fano lower bounds on statistical estimation error ||x^dagger -
  x^*||_A^2 under additive noise y = A x^* + w and introduces the multi-round Iterative Hessian Sketch
  x^{t+1} = argmin_{x in C} {(1/(2m))||S^{t+1} A(x - x^t)||_2^2 - <A^T(y - A x^t), x>} that sketches only
  the Hessian, whereas Pilanci & Wainwright 2015 analyzes one-shot joint sketching min_{x in C} ||S(A
  x - y)||_2^2 for multiplicative cost approximation f(x_hat) <= (1 + delta)^2 f(x^*) via Lemma 1, Corollary
  1 privacy-preserving mutual information rates I(SA; A)/(nd), Theorem 2 S-Gaussian/Rademacher width bounds,
  Lemma 8 second-order set-difference covering, Lemma 13 rank-to-nuclear convex-hull support-function
  inclusion, and Corollaries 4-7 on folded-noise compressed sensing, dual simplex SVMs, Markowitz portfolios,
  and group-sparse SOCPs) and from AIMech:NewtonSketchRandomizedHessianProjectedOptimization (Pilanci
  & Wainwright 2017, which performs iterative second-order Hessian-square-root sketching for general twice-differentiable
  convex and self-concordant barrier objectives).
