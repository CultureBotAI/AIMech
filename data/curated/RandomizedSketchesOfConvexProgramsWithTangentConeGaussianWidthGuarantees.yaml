      A-D, pp. 30-34, Lemma 13, Equations (82)-(86)
    relation: supports
- claim_id: concrete-sketch-dimension-instantiations-across-convex-programs
  kind: scope
  statement: 'Specializing Theorems 1-2 and Lemmas 8-13 yields concrete sketch-dimension bounds for delta-optimal
    cost approximation across six problem families in Section 3: (1) Unconstrained least squares (Corollary
    2, p. 6): m > c_0 rank(A) / delta^2 for sub-Gaussian sketches and m > c_0'' (rank(A) / delta^2) log^4(n)
    for ROS sketches; (2) l_1-constrained least squares / Lasso (Corollary 3, p. 8, Equations 13-20) with
    k-sparse optimum x^*: m >= (c_0 / delta^2) min{rank(A), (max_j ||a_j||_2^2 / gamma_k^-(A)) k log d}
    for sub-Gaussian sketches and m > (c_0'' / delta^2) log^4(n) min{rank(A), ((max_j ||a_j||_2^2 / gamma_k^-(A))
    k log d)^2 / log^4(n), (gamma_k^+(A) / gamma_k^-(A))^2 k log d} for ROS sketches; (3) Compressed sensing
    and noise-folded denoising (Corollary 4, pp. 10-12, Equations 21-25, setting A = I_n in min_{||x||_1
    <= R} ||x - y||_2^2): exact recovery x_hat = x_bar in the noiseless case f(x^*) = 0 and ||x_hat -
    y||_2^2 <= (1 + delta)^2 ||x^* - y||_2^2 under folded noise S y = S x_bar + S w using m >= (c_0 /
    delta^2) ||x^*||_0 log d sub-Gaussian or (c_0 / delta^2) min{||x^*||_0 log^5 d, ||x^*||_0^2 log d}
    ROS projections; (4) Dual squared-hinge support vector machines and Markowitz portfolio allocation
    over the simplex (Corollary 5, pp. 12-14, Equations 26-30): m >= (c_0 / delta^2) ||x^*||_0 log(d)
    max_j ||a_j||_2^2 / gamma_k^-(A) scaling with the number of support vectors ||x^*||_0 on the margin;
    (5) Weighted low-rank nuclear-norm matrix approximation (Corollary 6, pp. 14-16, Equations 31-37):
    m >= (c_0 / delta^2) kappa^2(omega) r (d_1 + d_2) (sub-Gaussian) and with an additional log^4(d_1
    d_2) factor for ROS; and (6) Group-sparse SOCP least squares (Corollary 7, pp. 16-17, Equations 38-40)
    with k active groups and max group size M: O((k log |G| + k M) / delta^2).'
