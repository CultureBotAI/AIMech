  ratio (1.7371), and Corollary 5 dual squared-hinge SVM simplex sketching approximation ratio (1.4377),
  and (3) Lemma 13 support-function inequality phi_1(X) <= 3 phi_0(X) across 90 random matrices (max ratio
  1.9737 <= 2 <= 3) and Lemma 8 Equation (84) convex-hull difference quadratic-form bound across 50 random
  convex combinations.
