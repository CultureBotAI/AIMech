claims:
- claim_id: tangent-cone-cost-approximation-lemma-and-privacy-mutual-information-rate
  kind: mechanism
  statement: 'For the convex program x^* in argmin_{x in C} f(x) := ||A x - y||_2^2 and its sketched counterpart
    x_hat in argmin_{x in C} g(x) := ||S(A x - y)||_2^2 with tangent cone K = cl conv{t(x - x^*) : t >=
    0, x in C} (Equations 1-4), let Z_1(AK) := inf_{v in AK cap S^{n-1}} (1/m) ||S v||_2^2 and Z_2(AK)
    := sup_{v in AK cap S^{n-1}} |<u, (S^T S / m - I) v>| with fixed unit residual u = (A x^* - y)/||A
    x^* - y||_2 (Equations 41a-41b). Using the convex optimality condition <A^T(A x^* - y), x_hat - x^*>
    >= 0 and g(x_hat) <= g(x^*), Lemma 1 (pp. 17-18, Equations 42-45) proves the deterministic inequalities
    ||A(x_hat - x^*)||_2 / ||A x^* - y||_2 <= 2 Z_2(AK) / Z_1(AK) and f(x_hat) <= {1 + 2 Z_2(AK) / Z_1(AK)}^2
    f(x^*). For sigma-sub-Gaussian sketches, Lemmas 2 and 3 (pp. 19-21, Equations 46-55, using orthant
    splitting V_+ cup V_- and Sudakov-Fernique projection comparison) show that m >= (c_0 / delta^2) W^2(AK)
    guarantees Z_1(AK) >= 1 - delta and Z_2(AK) <= delta, establishing Theorem 1 (Equation 7): f(x_hat)
    <= (1 + delta)^2 f(x^*) with probability at least 1 - c_1 e^{-c_2 m delta^2}. When A in R^{n x d}
    has i.i.d. entries of finite variance gamma^2, combining Theorem 1 with the Gaussian mutual-information
    upper bound I(S A; A)/(n d) <= (m / (2n)) log(2 pi e gamma^2) yields Corollary 1 (p. 4, Equation 8):
    m = (c_0 / delta^2) W^2(AK) achieves delta-optimality while bounding per-symbol mutual information
    by (c_0 / delta^2) (W^2(AK)/n) log(2 pi e gamma^2) -> 0 whenever W^2(AK) = o(n).'
  evidence:
  - source_id: pilanci2015-convex-sketches-pdf
    locator: Sections 2.1-2.2, pp. 3-5, Theorem 1, Corollary 1, Equations (1)-(8); Sections 4.1-4.2, pp.
      17-21, Lemmas 1-3, Proposition 1, Equations (41a)-(55)
    relation: supports
- claim_id: ros-s-gaussian-rademacher-width-bounds-and-set-difference-covering-sharpening
  kind: mechanism
  statement: 'For a randomized orthonormal system (ROS) sketch S in R^{m x n} with rows s_i^T = sqrt(n)
    p_i^T H diag(nu) formed in O(d n log m) time from a Hadamard or Fourier matrix H and Rademacher signs
    nu in {-1, +1}^n (Section 2.3, p. 5), define the S-Gaussian width W_S(AK) := E_{g,S}[sup_{z in AK
    cap S^{n-1}} |<g, S z / sqrt(m)>|] and Rademacher width R(AK) := E_eps[sup_{z in AK cap S^{n-1}} |<z,
    eps>|] (Equations 9-10). By conditioning on the high-probability Rademacher truncation events G_1
    cap G_2 (Equations 60-63) and applying Talagrand''s empirical-process concentration and Ledoux-Talagrand
    contraction (Lemmas 4-7, Proposition 2, pp. 21-24 and Appendix B, pp. 31-32), Theorem 2 (Equation
    11) proves that m / log m > (c_0 / delta^2) (R^2(AK) + log n) W_S^2(AK) guarantees delta-optimality
    with probability at least 1 - c_1/(mn)^2 - c_1 exp(-c_2 m delta^2 / (R^2(AK) + log(mn))). Furthermore,
    to eliminate the extra R^2(AK) factor for structured cones, Section 5.2 (p. 26, Lemma 8, Equations
    66-68; proved in Appendix C, pp. 32-33) shows that if 0 in Y_0, Y_1 is convex, Y_1 subseteq cl conv(Y_0),
    partial^2[Y_0] subseteq alpha Y_1, and Pi(partial^2[Y_0]) subseteq alpha Y_1, then any eps-cover {z^1,
    ..., z^M} of partial[Y_0] = Y_0 - Y_0 with eps in (0, 1/(27 alpha^2)] satisfies sup_{z in Y_1} |z^T
    Q z| <= 3 max_{j in [M]} |(z^j)^T Q z^j| for any symmetric matrix Q, which combined with Lemma 13
    (Appendix D, p. 34, Equation 86: B_F(1) cap B_nuc(2 sqrt(r)) subseteq cl conv(B_F(3) cap B_rank(4r))
    via support functions phi_1(X) <= (1 + sqrt(r/floor(r))) phi_0(X) <= 3 phi_0(X)) and Krahmer-Ward
    RIP-to-JL embeddings yields sharpened ROS bounds (Lemmas 9-12).'
  evidence:
