name: Sparse pachinko allocation inference
definition: An approximate pachinko-allocation fitting procedure that restricts token path resampling
  to currently active document topics and word-associated subtopics, interleaving full sampling with pruning
  and optionally growing the training corpus incrementally.
concept_kind: algorithm
identity_notes: Scoped to the sparse PAM inference techniques in Li and McCallum's submitted 2008 manuscript,
  particularly Sections 3.2.2-3.2.3. This is an algorithm for the already represented PAM model, with
  an LDA specialization, rather than a new dense probability-model identity. Sparse count-block storage
  is an exact implementation choice; deleting candidate paths from a Gibbs conditional is an approximation.
  The source calls its settings sparse PAM/sPAM and sparse LDA/sLDA; these names are not asserted aliases
  of every later sparse-LDA algorithm. No normalized candidate identity matched all 442 pinned AIO IDs,
  labels and scoped synonyms or 441 preceding native IDs, names and aliases. Full-checkout searches included
  ignored and hidden files in both checkouts; twelve matching lines per checkout came from five unique
  prior discovery-ledger contents and the existing GCA mapping rationale. All matching excerpts were read.
  All 205 semantic label/synonym hits and 21 annotated AIO nodes with outgoing edges were byte-verified
  against prior readings. Thirty contextual YAMLs comprise 27 unchanged prior readings, two fully read
  final native targets verified against saved review inputs, and a fully read Metropolis-Hastings record.
  No candidate record is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- The complete schedule of full versus pruned updates and all active-set edge cases are not specified.
  Fixed valid hyperparameters permit analysis of the transition rule; corpus growth, empirical-moment
  adaptation and heuristic pruning do not jointly certify an exact stationary posterior sampler.
- The displayed moment update also needs valid variance and logarithm domains. A uniform Beta example
  has moment-consistent alpha=(1,1), whereas the literal displayed aggregation gives (1/8,1/8). This is
  a qualification of the printed formula, not a claim about uninspected author code.
- AP/SJMN retrieval and large Rexa experiments use particular topic counts, chain combinations, initialization
  and hardware. Non-significant tests between best retrieval results do not establish posterior equivalence.
  Dense-PAM human judgment, likelihood and classification experiments are separate from evidence about
  sparse inference.
- The retrieval scorer averages plug-in word probabilities across chains before multiplying query terms
  and mixes them termwise with a smoothed document model. It is not automatically the average whole-query
  posterior predictive law. Finite transition checks do not reproduce the author implementation or benchmark.
aliases:
- pruned PAM Gibbs sampling
