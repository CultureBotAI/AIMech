  relation: supports
claims:
- claim_id: restricted-path-updates
  kind: mechanism
  statement: For a document, collect its currently used supertopics C and subtopics C-prime. Remove a
    token's old assignment, form the union of document subtopics and subtopics with positive corpus counts
    for that token's word, and restrict new paths to C times that union. Renormalize the usual collapsed
    path weights on this candidate set, sample an assignment and update counts and active sets. The source
    initializes document sets before token removal; precise membership maintenance must preserve a defined
    candidate set. Zero count-block storage alone does not remove the positive prior mass of unoccupied
    paths.
  evidence:
  - source_id: method-source
    locator: Section 3.2.1, printed/PDF p.10; Section 3.2.2, pp.10-11, pruning pseudocode
    relation: supports
- claim_id: reachability-versus-invariance
  kind: limitation
  statement: 'Pruned updates cannot introduce a supertopic absent from the document. Alternating with
    full sampling restores possible routes into omitted states, but does not by itself preserve the exact
    target distribution: the pruned kernel need not leave that target invariant. In a two-token, two-supertopic
    PAM special case, the target over assignments is (1/3,1/6,1/6,1/3); one full sweep followed by one
    pruned sweep changes it to (13/27,1/54,1/54,13/27). The reported average 98 percent retained conditional
    mass is a local empirical statistic, not a bound on the final posterior error. No acceptance correction
    is provided.'
  evidence:
  - source_id: method-source
    locator: Section 3.2.2, printed/PDF pp.10-11, retained mass, trapping discussion and alternating sampling
    relation: supports
- claim_id: incremental-initialization-and-adaptation
  kind: mechanism
  statement: Sparse initialization fits a small document subset before gradually adding documents. A new
    document permits all supertopics; an already seen word permits subtopics with positive corpus word
    counts, while a previously unseen word permits all subtopics. The sparse-LDA experiment starts with
    10000 documents and doubles the corpus every five iterations. Multiple chains are also used. Separate
    empirical-moment hyperparameter updates change the sampling target during fitting; the displayed Dirichlet
    formula divides by an aggregated concentration expression rather than following the usual alpha_j=mean_j*concentration
    identity, so that display is not adopted as a verified implementation recipe.
  evidence:
  - source_id: method-source
    locator: Sections 3.2.3-3.2.4, printed/PDF pp.11-12; Section 4.2.1, p.21; Section 2.4, p.8
    relation: supports
