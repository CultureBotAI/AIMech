    locator: Section 1, Theorem 1 and Equation (1), p. 3; Section 3.1, Theorem 2, Lemmas 2-3, and Equations (8)-(16), pp. 6-9; Section 3.2, Theorem 3, Lemmas 4-7, and Equations (18)-(29), pp. 10-14; Section 3.3, pp. 14-15
    relation: supports
- claim_id: frobenius-and-inverse-covariance-minimax-rates-and-bandwidth-dichotomy
  kind: scope
  statement: 'Under the normalized squared Frobenius norm p^{-1} E||Sigma_hat - Sigma||_F^2, the minimax risk over both P_alpha and the power-law off-diagonal decay subclass P''_alpha (defined by |sigma_{ij}| <= M_1 |i-j|^{-(alpha+1)} for i != j, Eq. 30, p. 15) is min{n^{-(2*alpha+1)/(2*(alpha+1))}, p/n} (Theorem 4, Eq. 36, p. 17), attained on P''_alpha by tapering with bandwidth k = min{n^{1/(2*(alpha+1))}, p} (Eqs. 38-39, p. 18), proving that no single tapering bandwidth k is simultaneously rate-optimal across operator and Frobenius norms (Remark 4, p. 18). Furthermore, over P_alpha(M_0, M, rho, delta) = P_alpha(M_0, M, rho) intersect {Sigma : lambda_min(Sigma) >= delta > 0} (Eq. 41, p. 20), the inverse tapering estimator Sigma_hat_k^{-1} with k = n^{1/(2*alpha+1)} achieves the minimax squared operator-norm risk for precision matrix estimation inf_{Sigma_hat} sup E||Sigma_hat^{-1} - Sigma^{-1}||_2^2 asymp min{n^{-2*alpha/(2*alpha+1)} + (log p)/n, p/n} (Theorem 5, Eq. 42, pp. 20-21).'
  evidence:
