claims:
- claim_id: lemma1-block-sum-decomposition-and-lemma2-operator-bound
  kind: mechanism
  statement: For even tapering bandwidth k = 2*k_h, the trapezoidal weights w_{ij} = k_h^{-1}((k - |i-j|)_+ - (k_h - |i-j|)_+) yield the exact algebraic identity Sigma_hat_k = k_h^{-1}(S^{*(k)} - S^{*(k_h)}), where S^{*(m)} = sum_{l=1-m}^p M_l^{*(m)} sums the m x m diagonal block submatrices M_l^{*(m)} = (sigma^*_{ij} I{l <= i < l+m, l <= j < l+m})_{p x p} (Lemma 1, Eq. 6, p. 5; Proof on p. 23). Consequently, by partitioning S^{(m)} into m sums of mutually orthogonal diagonal blocks, the uncentered tapered sample covariance Sigma_breve satisfies the deterministic operator-norm inequality ||Sigma_breve - E[Sigma_breve]||_2 <= 3 max_{1 <= l <= p-k+1} ||M_l^{(k)} - E[M_l^{(k)}]||_2 (Lemma 2, p. 8; Proof on p. 25, Eqs. 44-45).
  evidence:
  - source_id: czz2010-tapering-pdf
    locator: Section 2, Equations (4)-(6) and Lemma 1, pp. 4-5; Section 3.1, Lemma 2, p. 8; Section 7, Proof of Lemma 1 and Proof of Lemma 2, pp. 23, 25
    relation: supports
- claim_id: operator-norm-minimax-rate-and-row-undersmoothing
  kind: scope
  statement: "Over the sub-Gaussian bandable covariance collection P_alpha(M_0, M, rho) with P{|v^T(X_1 - E X_1)| > t} <= exp(-t^2 rho / 2) for ||v||_2 = 1 (Eq. 7, p. 6), a 1/2-net covering argument on S^{m-1} with cardinality <= 5^m (Lemma 3, Eq. 16, p. 8; Proof on pp. 25-26) bounds the variance term by E||Sigma_breve - E[Sigma_breve]||_2^2 <= C(k + log p)/n (Eq. 13) while the matrix l1 bound controls the squared bias by ||E[Sigma_breve] - Sigma||_2^2 <= ||E[Sigma_breve] - Sigma||_1^2 <= M^2 k^{-2*alpha} (Eq. 14). Setting k = min{n^{1/(2*alpha+1)}, p} \u2014 which intentionally undersmooths each row/column relative to its vector l1 rate \u2014 achieves the minimax squared operator-norm risk inf_{Sigma_hat} sup_{P_alpha} E||Sigma_hat - Sigma||_2^2 asymp min{n^{-2*alpha/(2*alpha+1)} + (log p)/n, p/n} for p <= exp(gamma n) (Theorems 1-3, Eqs. 1, 8-9, 18-29, pp. 3, 6-14), strictly improving upon the ((log p)/n)^{alpha/(alpha+1)} bound obtained via the matrix l1 norm in Bickel & Levina (2008a)\
    \ (Section 3.3, pp. 14-15)."
  evidence:
