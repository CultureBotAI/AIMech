name: SamplePairing
definition: An image-classification augmentation procedure that averages an anchor image with a randomly
  selected training image using equal pixel weights and trains against the anchor image’s label, with
  a training schedule that includes phases without pairing.
concept_kind: algorithm
identity_notes: 'SamplePairing is the equal-image-weight, anchor-label procedure of Inoue, distinct as
  a training protocol from the standard Beta-distributed input/target MixUp construction. This distinction
  does not imply that every expected objective differs: under exchangeable pairing and a loss linear in
  targets, averaging the anchor-label losses over both orders matches the half-and-half target loss for
  the same averaged image. The paper itself discusses this relationship. It is also distinct from learned
  Smart Augmentation and from spatial patch replacement in CutMix. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 253 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  27 lines in each checkout. These were neighboring-record and review references or prior candidate leads,
  not existing records for these identities. Twelve exact AIO CLASS nodes with synonyms and outgoing edges
  and six neighboring native mechanisms were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.'
limitations:
- Averaged images can contain incompatible classes; the assigned anchor label is a training convention,
  not a claim that the mixture has a unique correct semantic label.
- The paper’s N-squared count describes ordered pairing choices. Commutativity and duplicate inputs can
  make different pairings produce the same averaged image, so it is not a guarantee of N-squared distinct
  visual samples.
- The expected-loss relation to half-and-half soft labels requires the stated symmetry and loss assumptions.
  It does not equate individual sampled gradients, arbitrary pair distributions, the full training schedules
  or the original randomly weighted MixUp procedure.
- The source’s training-accuracy ceiling discussion is idealized and does not establish a universal bound
  for every finite training run. No benchmark advantage, training-cost equivalence or medical-task result
  is imported.
