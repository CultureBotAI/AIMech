claims:
- claim_id: method
  kind: mechanism
  statement: For a training anchor, randomly select a partner from the training set without requiring
    the same class. Apply ordinary image augmentations to the inputs when used, then average corresponding
    pixels and channels with equal weights. Train on the mixed image using only the anchor label; the
    partner label is not required by this rule. The published training schedule starts without SamplePairing,
    enables it after a warm-up, intermittently disables it during training, and finishes with a no-pairing
    fine-tuning phase. The source uses one warm-up epoch for ILSVRC and 100 for the other datasets, then
    alternates 300,000 paired / 100,000 unpaired images for ILSVRC or eight paired / two unpaired epochs
    otherwise. These numerical intervals are experimental choices, not the identity of every use. A learned
    augmenter, a random mixing ratio, same-class pairing and label interpolation are not required by the
    original procedure.
