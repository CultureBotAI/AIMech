claims:
- claim_id: harmofl-amplitude-normalization-and-weight-perturbation-mechanism
  kind: mechanism
  statement: In each communication round t, client i initializes its running amplitude A_bar_{i,0}^t = A_bar^t from the server-averaged amplitude spectrum, updates A_bar_{i,k}^t = (1 - v) A_bar_{i,k-1}^t + v (1/M) sum_{m=1}^M A_{i,x_m} at batch k (with v = 1 in round 1 and v = 0.1 thereafter), reconstructs amplitude-normalized inputs Psi(x_m) = F^{-1}(A_bar_{i,k}^t, P_{i,x_m}), and performs local gradient descent evaluated at the perturbed weights theta_{i,k-1}^t + delta_k where delta_k = alpha * nabla ell_i(Psi(x), y; theta_{i,k-1}^t) / ||nabla ell_i(Psi(x), y; theta_{i,k-1}^t)||_2, after which the server averages both model weights theta^{t+1} = theta^t - eta_g (1/N) sum_{i=1}^N Delta theta_i^t and amplitude spectra A_bar^{t+1} = (1/N) sum_{i=1}^N A_bar_{i,K}^t.
  evidence:
  - source_id: r501-primary-pdf
    locator: Sections 3.1-3.2, Eqs. (1)-(8), Algorithm 1, pp. 3-4
    relation: supports
- claim_id: harmofl-coupled-drift-bound-and-nonconvex-convergence-rate
  kind: scope
  statement: Under L-smoothness, bounded gradient norm G, bounded Hessian norm B, bounded parameter norm C, and bounded cross-client gradient difference (1/N) sum_{i=1}^N ||nabla ell_i(Psi(x), y; theta) - nabla f(theta)|| <= epsilon (Assumptions B.1-B.4), Theorem B.6 shows that overall client-server drift Gamma = (1/(KN)) sum_{k=1}^K sum_{i=1}^N E[||theta_{i,k}^t - theta^t||^2] satisfies Gamma <= 4 eta_tilde^2 (G^2 + B^2 C^2) / eta_g^2 + 4 eta_tilde^2 epsilon^2 (N-1)^2 / (eta_g^2 N^2) + 2 eta_tilde^2 sigma^2 / (K eta_g^2) with eta_tilde = K eta_g eta_l, and Theorem 3.1 proves non-convex stationarity convergence at rate O(sqrt((f(theta^0) - f(theta^*)) / (K T)) + (f(theta^0) - f(theta^*)) / T).
  evidence:
  - source_id: r501-primary-pdf
    locator: Section 3.3 Theoretical Analysis, Theorem 3.1, Eq. (9), p. 5; Appendix B Assumptions B.1-B.4, Theorem B.5, Theorem B.6, pp. 9-11
    relation: supports
- claim_id: harmofl-double-gradient-evaluation-and-perturbation-radius-limitation
  kind: limitation
  statement: Computing the perturbed gradient nabla ell_i(Psi(x), y; theta_{i,k-1} + delta_k) requires two forward-backward passes per local step (first at theta_{i,k-1} to form delta_k and second at theta_{i,k-1} + delta_k) Plus 2D FFT/IFFT operations on each image batch, and the theoretical convergence guarantee requires the perturbation radius alpha to decay as O(1 / sqrt(K T)) because overly large alpha degrades local optimization stability (Appendix C.2 Figure 6, p. 12).
  evidence:
  - source_id: r501-primary-pdf
    locator: Section 3.2 Eqs. (6)-(7), p. 4; Section 3.3 Theorem 3.1, p. 5; Appendix C.2 Figure 6, p. 12
    relation: supports
- claim_id: harmofl-multi-site-medical-image-classification-and-segmentation-application
  kind: application
  statement: Applied to multi-institution federated medical image classification and segmentation across scanner and staining protocol shifts, including histology nuclei segmentation, prostate MRI segmentation (6 institutions), and Camelyon17 breast cancer lymph-node histology classification (5 hospitals).
  evidence:
  - source_id: r501-primary-pdf
    locator: Section 4 Experiments, Tables 1-2, Figures 3-5, pp. 5-8
    relation: supports
