id: AIMech:HarmoFlHarmonizingLocalAndGlobalDriftsInFederatedLearning
name: 'HarmoFL: Harmonizing Local and Global Drifts in Federated Learning on Heterogeneous Medical Images'
concept_kind: algorithm
review_status: DRAFT
definition: "A federated learning algorithm for feature-heterogeneous multi-institution imaging (HarmoFL; Jiang, Wang, and Dou, AAAI 2022) that jointly mitigates local client drift and global server drift without extra model-parameter communication overhead by combining (1) frequency-domain Amplitude Normalization\u2014where each client i updates a moving-average Fourier amplitude spectrum A_bar_{i,k} = (1 - v) A_bar_{i,k-1} + v (1/M) sum_{m=1}^M A_{i,x_m} (initialized each round from the server-averaged global amplitude A_bar^t = (1/N) sum_{i=1}^N A_bar_{i,K}^{t-1}) and reconstructs harmonized images Psi(x_m) = F^{-1}(A_bar_{i,k}, P_{i,x_m}) preserving local phase P_{i,x_m}\u2014with (2) Client Weight Perturbation, where each local step computes Euclidean-normalized gradient ascent perturbation delta_k = alpha * nabla ell_i(Psi(x), y; theta_{i,k-1}) / ||nabla ell_i(Psi(x), y; theta_{i,k-1})||_2 and updates theta_{i,k} = theta_{i,k-1} - eta_l nabla ell_i(Psi(x), y; theta_{i,k-1} + delta_k) to guide local models into overlapping flat optima prior to server aggregation."
identity_notes: Distinct from FedDG / ELCFS (AIMech:FedDgEpisodicLearningInContinuousFrequencySpaceForFederatedDomainGeneralization; Liu et al., CVPR 2021), which shares per-client frequency amplitude banks for episodic continuous interpolation and boundary-oriented meta-learning; HarmoFL maintains a single server-averaged moving-average amplitude template A_bar^t without sharing individual image amplitude banks and couples frequency harmonization with SAM-style local Euclidean weight perturbation delta_k = alpha * g / ||g||_2. Distinct from FedBN (Li et al., ICLR 2021), which keeps Batch Normalization parameters local without frequency-space amplitude harmonization or local weight perturbation.
aliases:
- HarmoFL
- Harmonizing Local and Global Drifts in Federated Learning
- Amplitude Normalization and Client Weight Perturbation Federated Learning
