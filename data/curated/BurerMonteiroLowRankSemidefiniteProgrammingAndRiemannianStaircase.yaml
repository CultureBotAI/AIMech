claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'Under Assumption 1.1 on the smooth manifold M_p = {Y in R^{n x p} : A(Y Y^T) = b}, Lemma 2.1 and Lemma 2.2 prove that at any first-order Riemannian critical point Y in M_p, the dual slack matrix S(Y) = C - A^*(mu(Y)) satisfies S(Y) Y = 0 and <dot{Y}, Hess g(Y)[dot{Y}]> = <dot{Y}, S(Y) dot{Y}> for all dot{Y} in T_Y M_p; consequently, Lemma 2.4 proves that if Y is column-rank-deficient (exists z in R^p, ||z||_2 = 1 with Y z = 0) and second-order critical (Hess g(Y) >= 0 on T_Y M_p), then dot{Y} = u z^T lies in T_Y M_p for every u in R^n with u^T S(Y) u = <dot{Y}, Hess g(Y)[dot{Y}]> >= 0, certifying S(Y) >= 0 and global optimality of X = Y Y^T for the SDP.'
  evidence:
  - source_id: r336-primary-pdf
    locator: Section 2, Lemmas 2.1, 2.2, 2.3, and 2.4, Equations 4-10, pp. 4-6
    relation: supports
  - source_id: r336-arxiv-abs
    locator: 'Abstract: global optimality of second-order critical points for smooth SDPs when p(p+1)/2 > m'
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Theorem 1.2, Theorem 1.4, and Theorem 3.1 prove that when the factorization rank p satisfies the Barvinok-Pataki inequality p(p+1)/2 > m (where m is the number of linear constraints), the affine space of cost matrices C admitting any full-column-rank first-order critical point has dimension at most m + np - p(p+1)/2 < np = dim M_p + m, which by Sard's theorem has Lebesgue measure zero in S^{n x n}; thus for almost all C, every second-order critical point Y in M_p is rank-deficient (rank(Y) < p) and globally optimal.
  evidence:
  - source_id: r336-primary-pdf
    locator: Section 1.1, Theorems 1.2 and 1.4, Inequality 3, pp. 3-4; Section 3, Theorem 3.1 and Proof, pp. 6-8
    relation: supports
  - source_id: r336-metadata-cr
    locator: Communications on Pure and Applied Mathematics 73(3):581-608 bibliographic record
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: When the factorization rank p lies below the Barvinok-Pataki threshold (p(p+1)/2 <= m, such as p = 2 for the frustrated 5-cycle Max-Cut SDP where m = 5), M_p can possess spurious full-rank critical points where S(Y) has strictly negative eigenvalues lambda_min(S(Y)) < 0, requiring the Riemannian staircase to increment p -> p + 1 and escape along the lifted negative-curvature tangent vector dot{Y} = u e_{p+1}^T.
  evidence:
  - source_id: r336-primary-pdf
    locator: Section 1.1 and Section 2, Discussion of Barvinok-Pataki bound p(p+1)/2 > m and Riemannian staircase escape via Lemma 2.4, pp. 3-5
    relation: supports
