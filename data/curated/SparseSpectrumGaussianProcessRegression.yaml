  relation: related_match
  rationale: The finite Gaussian model estimates a scalar response from observed input/response pairs
    and supplies a predictive distribution. This expresses its regression-task relationship; the AIO task
    does not identify the particular spectral prior, fitting procedure or model family, so no equivalence
    or subclass assertion is made.
limitations:
- The finite-feature prior is a model choice. Exact Gaussian conditioning requires the stated Gaussian
  coefficient and observation-noise assumptions and fixed frequencies/hyperparameters. It is not exact
  inference for an arbitrary original kernel or Bayesian integration over spectral parameters.
- Prior stationarity and a constant prior diagonal do not imply constant posterior variance or universal
  recovery of prior uncertainty far from data. Multiple incommensurate frequencies need not have a common
  finite period, so the source’s broad periodicity wording is not adopted as a property of every model.
- Frequency optimization can overfit and is sensitive to initialization. The cited failure is specific
  to the paper’s Pendulum protocol; no universal ranking, numerical benchmark improvement or calibrated-interval
  claim is asserted.
- The paired independent Gaussian coefficients are essential to the specified prior. A cosine-only representation
  with optimized deterministic phases is not automatically the same probabilistic model; an equivalent
  amplitude/phase change of variables must preserve the induced prior.
- Spectral atoms use the normalization implied by the source’s displayed symmetric sum; ambiguous prose
  about individual atom amplitudes is not copied. Complexity statements in the introductory text are not
  used as a claim about total training cost.
- All 17 original-paper pages and the nine-page later prediction paper were read. Author code and frequency-learning
  implementation were not inspected or run. A fixed finite-matrix curator calculation checks feature/kernel
  algebra only; no fitting pipeline, paid provider, simulation or benchmark was run. The record remains
  DRAFT.
