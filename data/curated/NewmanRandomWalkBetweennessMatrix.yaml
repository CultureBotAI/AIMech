  - target: AIO:MathematicalFunction
    rejection_reason: The identity is a specific inverse-matrix and explicit-pair algorithm, not solely
      an input-output function.
  - target: AIO:DataPreparation
    rejection_reason: Computing network prominence is the defined result; incidental downstream feature
      use does not establish a preprocessing identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The electrical-network computation has no language-model input/output or training
      mechanism.
  - target: AIO:RankingBias
    rejection_reason: A structural graph score is not the belief that high-ranked information is necessarily
      relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: The exact matrix computation is not a sampling-selection bias; its random-walk interpretation
      does not change that identity.
  - target: AIO:RepresentationBias
    rejection_reason: A graph centrality computation is not subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: Neither labels nor a deep neural network are acquired or fitted.
limitations:
- The record restricts the algorithm to connected simple undirected unit-resistance graphs with n>=3.
  General conductance weighting, singleton components and whole-disconnected-graph normalization require
  explicit separate conventions.
- Endpoint inclusion and the n(n-1)/2 unordered-pair denominator are part of the adopted output convention.
  The source’s optional endpoint exclusion does not imply the later (n-1)(n-2) normalization.
- Expected directed edge counts are differenced before absolute values. Ordinary visits and the expected
  absolute signed count of a realized walk are different quantities; the finite example demonstrates that
  distinction.
- The 15-page arXiv v1 manuscript, all 21 references, seven figures and two tables were read. No later
  journal-layout PDF, author software, corrected edition or raw historical data was inspected. The finite
  calculations are mechanism checks, not broad empirical or numerical-solver certification.
- Graph prominence does not by itself establish causal influence or a validated AI predictor. DRAFT remains
  after author self-review.
