id: AIMech:NewmanRandomWalkBetweennessMatrix
name: Newman random-walk betweenness matrix computation
aliases:
- Newman matrix algorithm for random-walk betweenness
concept_kind: algorithm
definition: An exact network-analysis algorithm that computes random-walk betweenness from an embedded
  inverse of a grounded graph Laplacian, explicitly enumerates source–target pairs, and averages their
  incident-current magnitudes with a specified endpoint convention.
definition_evidence:
- source_id: newman2003
  locator: Sections 2.1–2.2, Equations 7–13 and the four-step prescription, PDF/printed pp. 5–9
  relation: supports
claims:
- claim_id: domain-and-grounded-inverse
  kind: scope
  statement: The maintained domain is a simple connected undirected graph with n>=3 and unit edge resistances.
    Form L=D-A, remove one corresponding row and column, invert the reduced matrix, and embed it in T
    by restoring a zero row and column. For source s and target t, p_i=T_is-T_it gives potentials up to
    the chosen ground. The original source treats separate connected components separately; this record
    does not impose a whole-disconnected-graph normalization.
  evidence:
  - source_id: newman2003
    locator: Sections 2.1–2.2, Equations 3–8 and four-step prescription, PDF/printed pp. 5–9
    relation: supports
- claim_id: pair-enumeration-and-endpoints
  kind: mechanism
  statement: For each unordered pair s<t, compute I_i(st)=one half the sum over adjacent j of |T_is-T_it-T_js+T_jt|
    for internal vertices i. Set I_s=I_t=1 using the source’s adopted endpoint convention. Return b_i=2/[n(n-1)]
    times the sum of I_i(st) over unordered pairs. The source also permits endpoints zero; changing that
    choice does not itself change the denominator into the later endpoint-excluded Brandes–Fleischer normalization.
  evidence:
  - source_id: newman2003
    locator: Section 2.1, Equations 9–11, PDF/printed pp. 6–7; Section 2.2 prescription, p. 9
    relation: supports
- claim_id: absorbing-walk-interpretation
  kind: mechanism
  statement: A walk moves uniformly to an adjacent vertex and stops on first reaching t. With transient
    matrix M_t=A_t D_t^(-1), the fundamental matrix (I-M_t)^(-1) gives expected transient visits. The
    method differences expected directed traversals of each edge before taking its absolute value and
    aggregating incident edges. It is not ordinary node occupancy or the expected absolute net count of
    an individual walk. In a unit complete four-vertex graph with source 0 and target 3, expected transitions
    1-to-2 and 2-to-1 are each 1/4, so their difference is zero. Yet the first-hit paths 0-1-2-3 and 0-2-1-3
    each have probability 1/27 and opposite nonzero net counts, proving the expectation of the absolute
    net count is at least 2/27. This is a curator example.
  evidence:
  - source_id: newman2003
    locator: Section 2.2, Equations 12–13 and net-flow discussion, PDF/printed pp. 7–9; curator example
      in research/discovery/newman-randomwalk-boundaries.py
    relation: supports
- claim_id: computation-and-identity
  kind: scope
  statement: The original procedure forms one dense grounded inverse and explicitly evaluates pair currents.
    With ordinary dense inversion its arithmetic cost is O(n^3+mn^2), becoming O(n^3) on sparse graphs,
    and storage is O(n^2+m) with streamed pair accumulation. The source discusses the dense-matrix memory
    burden. This pair-enumeration algorithm is distinct from the later sorted-edge-row algorithm and from
    stochastic pair sampling; neither a random-walk interpretation nor a structural score makes it a simulation
    or a learned predictor.
  evidence:
  - source_id: newman2003
    locator: Section 2.1, runtime paragraph and footnote 6, PDF/printed p. 7; Section 2.2 prescription,
      p. 9; storage with streamed pairs is explicit curator accounting
    relation: supports
- claim_id: normalization-comparison
  kind: limitation
  statement: For matched connected unit-resistance graphs with n>=3, let B_i be the later Brandes–Fleischer
    normalized endpoint-excluded score. Pair counting gives b_i=(n-2)B_i/n+2/n under Newman’s adopted
    endpoint-included convention. This is explicit curator algebra, not identical reported normalizations.
    On a unit three-vertex path, Newman’s scores are (2/3,1,2/3), while B is (0,1,0); on a unit triangle
    they are (7/9,7/9,7/9), while B is (1/3,1/3,1/3). Endpoint contribution must not be interpreted as
    evidence of internal bridging or causal importance.
  evidence:
  - source_id: newman2003
    locator: Section 2.1, Equations 10–11, PDF/printed p. 7; curator pair-counting comparison in research/discovery/newman-randomwalk-boundaries.py
    relation: supports
  - source_id: brandesfleischer2005
    locator: Sections 3.1 and Definition 2, PDF pp. 4–5 / printed pp. 536–537
    relation: supports
- claim_id: evidence-and-application-limits
  kind: limitation
  statement: The inspected manuscript uses synthetic graph examples and contact, intermarriage and collaboration
    networks to illustrate the measure. These illustrations and descriptive comparisons do not validate
    causal transmission, political success or learned predictive accuracy. No historical runtime, numerical
    benchmark or author implementation was reproduced. The 2003 arXiv manuscript is the inspected method
    version; the later 2005 journal publication is bibliographic context, without an assertion of identical
    bytes.
  evidence:
  - source_id: newman2003
    locator: Section 3, Figures 1–7 and Tables 1–2, PDF/printed pp. 2–14; Section 4, p. 14; arXiv version
      identification on p. 1
    relation: supports
identity_notes: 'Compared all 442 pinned AIO and 689 native identities; no normalized match. Ignored-
  and hidden-inclusive searches of three full checkouts returned 88,0,0 lines, all read as prior source
  leads, references, record renderings or query strings. Semantic assessment covered 147 AIO and 523 native
  definitions: all 147 AIO and 522 prior native rows verified unchanged and one newly selected native
  row read. Nine complete AIO contexts and six full native neighbors were assessed. The identity is the
  four-step matrix and explicit-pair procedure in Newman2003, not only the centrality measure. Its unit-resistance
  scope, endpoint convention and pair enumeration distinguish it from the later sorted-row algorithm,
  stochastic pair sampling, shortest-path dependency accumulation and PageRank. It is not a random-walk
  simulation or a learned predictor.'
