name: ReMixMatch
definition: A semi-supervised classifier-training procedure that adjusts weak-view guessed labels toward
  an estimated class prior, sharpens and anchors those soft targets across strong augmentations, and trains
  with interpolated pairs plus unmixed consistency and rotation-prediction losses.
concept_kind: algorithm
identity_notes: This record follows the paper’s distribution-aligned, augmentation-anchored procedure
  and explicitly qualifies author-code conventions. It retains the first unmixed strong view for both
  auxiliary losses and includes the weak view in the mixing pool. It is not an alias for MixMatch, generic
  distribution matching, hard pseudo-label FixMatch, or the separate CTAugment policy-learning component.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 234 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 21 lines in each from prior discovery and the related MixMatch
  record. Twelve exact AIO CLASS nodes, their scoped synonyms and outgoing edges, plus six neighboring
  native mechanisms were inspected. This absence assessment is bounded to the pinned snapshot and inspected
  semantic neighborhood.
limitations:
- The ideal ratio requires defined denominators and a nonzero normalization total; the inspected code
  adds epsilon. A poorly estimated or mismatched class prior can distort pseudo-targets.
- Per-example distribution rescaling encourages class-prior alignment but does not impose an exact equality
  of aggregate predictions and the prior. This follows from the normalization formula and is checked by
  a finite curator example.
- The source calls the input-output information objective fair in a class-balance sense; this is not a
  social-fairness guarantee. Sharpening may reinforce wrong guesses and does not resolve tied maxima into
  a unique class.
- 'The paper and implementation differ in sum-versus-mean loss normalization and rotation sampling: code
  assigns rotations by batch quarters. No bitwise-equivalent training trajectory or universal hyperparameter
  values are claimed.'
- CTAugment is an external strong-augmentation component here. Its complete policy-update algorithm, source
  score convention and variants remain a separate discovery item; no benchmark or source implementation
  was executed.
