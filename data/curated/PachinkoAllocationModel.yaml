claims:
- claim_id: dag-path-generation
  kind: mechanism
  statement: 'In the general Dirichlet formulation, each document draws a categorical child vector for
    each interior node. Each token starts at the root and repeatedly chooses a child until it reaches
    a word leaf. The finite rooted DAG and reachable word leaves ensure termination. In the demonstrated
    four-level variant, root-to-supertopic and supertopic-to-subtopic vectors vary per document, while
    subtopic-to-word vectors are drawn once and shared across the corpus. The latter sharing changes corpus
    marginalization: shared random emissions must be integrated jointly. The product of separately marginalized
    documents written for the fully document-local formulation is not automatically the marginal law of
    this shared-emission variant.'
  evidence:
  - source_id: method-source
    locator: Section 2, PDF p.3, document/corpus probability displays; Section 2.1 pp.3-4 and Figure 2
    relation: supports
- claim_id: collapsed-paths-and-moments
  kind: mechanism
  statement: 'For fixed positive hyperparameters in the four-level variant, a token''s collapsed supertopic/subtopic
    weight multiplies three leave-one-out predictive factors: the document root-to-supertopic count, the
    document supertopic-to-subtopic count, and the corpus subtopic-to-word count, each smoothed and normalized
    by its Dirichlet prior. The source jointly samples both topic levels. Its experimental fitting also
    changes supertopic hyperparameters using smoothed empirical moments and a concentration heuristic,
    rather than exact maximum likelihood or MAP. That changing-parameter procedure is not simply fixed-target
    posterior Gibbs sampling; neither finite samples nor moment updates establish convergence or optimality.'
  evidence:
  - source_id: method-source
    locator: Section 2.2, PDF p.4, collapsed update and moment-based parameter estimates
    relation: supports
