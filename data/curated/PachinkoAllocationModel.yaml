name: Pachinko allocation model
definition: A topic-model family that generates each word by traversing a directed acyclic graph from
  a root through topic nodes to a word leaf, using probability distributions over each node's children.
concept_kind: model_family
identity_notes: Scoped to Li and McCallum's PAM construction, with Dirichlet child-distribution priors
  and the four-level experimental variant in ICML2006. Interior topics can have multiple parents, and
  paths may skip levels. A new path is selected for each token. This differs from a single topic path
  assigned to an entire document, a logistic-normal topic mixture, or a causal graph of semantic concepts.
  PAM is a source acronym within this scope; later hierarchical, nonparametric and scalable variants are
  not asserted as exact aliases. No normalized candidate identity matched all 442 pinned AIO IDs, labels
  and scoped synonyms or 432 preceding native IDs, names and aliases. Full-checkout searches included
  ignored and hidden files in both checkouts; six matching lines per checkout came from three unique file
  contents containing prior frontier leads, bibliography context and a cached publication-list mention.
  All candidate-matching excerpts were read; the long cached browser transcript was not reread in full.
  All 205 semantic label/synonym hits were byte-verified unchanged from prior reading. Eighteen annotated
  AIO CLASS nodes and outgoing edges comprise 17 verified prior inspections and one fresh reading. Twenty-seven
  contextual YAMLs comprise 25 unchanged prior readings, one fresh generated AIO reading and one final
  round102 native record verified against its fully read review inputs. No candidate record is present
  within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- The experiments fix a fully connected four-level structure and topic counts. Learning arbitrary DAG
  structure or a nonparametric number of nodes is prospective in this paper. A DAG can encode nested and
  overlapping mixtures without establishing a universal representation theorem for every correlation structure.
- Dirichlet topic proportions are compositionally dependent, with negative off-diagonal covariances; the
  introductory LDA-independence contrast is not literal independence. Logistic-normal covariance parameters
  likewise do not mean higher-order dependence vanishes. PAM supplies a different mixing construction,
  not proof that CTM is exactly equivalent to a two-child DAG.
- Moment updates require policies for unvisited parent nodes, zero or invalid variances and nonpositive
  concentration estimates. Smoothing child means alone does not specify all edge cases. LDA reductions
  require compatible shared or fixed emissions; redrawing every word-emission vector independently per
  document is a different model.
- Evidence includes selected topics, a small human-judgment study, approximate held-out likelihood and
  five-way newsgroup classification. The prose and Table 2 disagree on majority-vote counts. The generated-document
  likelihood approximation is not exact marginal likelihood, and the reported results do not establish
  universal superiority. No author code or benchmark was executed.
