aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: related_match
  rationale: Uses a pre-trained neural transformer MLM head with log-saturated ReLU pooling to learn sparse high-dimensional representations.
- target: AIO:SparseLearning
  relation: related_match
  rationale: Enforces explicit representation sparsity in the |V|-dimensional vocabulary space via L1 and FLOPS regularization.
limitations:
- Requires separate tuning and quadratic warmup scheduling of query and document regularization weights (lambda_q, lambda_d) to avoid early representation collapse.
- Strong sparsity regularization (e.g., FLOPS = 0.05, 6 non-zero query terms and 18 document terms) incurs a measurable effectiveness drop (MRR@10 from 0.322 to 0.296).
