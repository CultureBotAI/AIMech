claims:
- claim_id: splade-log-saturation-and-flops-regularization-mechanism
  kind: mechanism
  statement: "For an input sequence t = (t_1, ..., t_N) with MLM token-to-vocabulary logits w_{ij} = transform(h_i)^T E_j + b_j (j in {1, ..., |V|}), SPLADE computes vocabulary weights w_j = sum_{i in t} log(1 + ReLU(w_{ij}))\u2014preventing bursty terms from dominating and inducing natural sparsity without fixed binary gates\u2014and jointly minimizes L = L_{rank-IBN} + lambda_q L_reg^q + lambda_d L_reg^d, where the FLOPS regularizer l_FLOPS = sum_{j in V} ((1/N) sum_{i=1}^N w_j^{(d_i)})^2 penalizes high batch-mean term activations to produce evenly distributed posting lists."
  evidence:
  - source_id: r749-primary-pdf
    locator: Section 3.1-3.2 (Equations 1, 4, 5, 6), pp. 2-3
    relation: supports
  - source_id: r749-primary-pdf
    locator: splade_weights, flops_reg, l1_reg & main
    relation: supports
- claim_id: splade-inverted-index-efficiency-and-compression-expansion-balance
  kind: scope
  statement: "Trained end-to-end in a single stage on MS MARCO passage ranking, SPLADE-l_FLOPS achieves 0.322 MRR@10 and 0.955 Recall@1000 on MS MARCO Dev (and 0.665 nDCG@10 on TREC DL 2019) at 0.73 expected FLOPS\u2014a 3.9x FLOPS reduction compared to un-saturated SparTerm-exp-l_FLOPS (2.83 FLOPS, 0.312 MRR@10)\u2014simultaneously dropping an average of 20 uninformative original terms while adding 32 latent expansion terms per document."
  evidence:
  - source_id: r749-primary-pdf
    locator: Section 4 (Table 1, Figure 1, & Table 2), pp. 3-4
    relation: supports
- claim_id: splade-regularization-schedule-and-flops-tradeoff-limitation
  kind: limitation
  statement: SPLADE requires careful tuning and quadratic warmup scheduling (e.g., over 50k steps) of two separate regularization hyperparameters (lambda_q and lambda_d), as aggressive sparsity regularization to match pure bag-of-words retrieval cost (e.g., FLOPS = 0.05) reduces MS MARCO Dev MRR@10 from 0.322 to 0.296.
  evidence:
  - source_id: r749-primary-pdf
    locator: Section 4 (Training, indexing and retrieval & Effectiveness-efficiency trade-off, Figure 1), pp. 3-4
    relation: supports
