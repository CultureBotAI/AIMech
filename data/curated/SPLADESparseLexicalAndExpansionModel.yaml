id: AIMech:SPLADESparseLexicalAndExpansionModel
name: SPLADE (Sparse Lexical and Expansion Model for First Stage Ranking)
concept_kind: architecture
review_status: DRAFT
definition: A learned sparse neural information retrieval architecture for first-stage inverted-index ranking that maps an input query or document token sequence t = (t_1, ..., t_N) into a |V|-dimensional WordPiece vocabulary vector by projecting contextualized BERT hidden states h_i through the Masked Language Modeling (MLM) prediction head w_{ij} = transform(h_i)^T E_j + b_j, aggregating non-negative term importance with logarithmic saturation w_j = sum_{i in t} log(1 + ReLU(w_{ij})), and jointly optimizing in-batch negative ranking loss with asymmetric query and document sparsity regularizers (lambda_q L_reg^q + lambda_d L_reg^d, using l_1 or the batch-squared activation regularizer l_FLOPS).
identity_notes: Introduced by Formal, Piwowarski, and Clinchant (SIGIR 2021, pp. 2288-2292, arXiv:2107.05720). Distinguished from DeepCT (Dai & Callan, 2019), which re-weights only existing document terms without vocabulary expansion, from doc2query/docTTTTTquery (Nogueira et al., 2019), which perform offline sequence-to-sequence text expansion before BM25 indexing, and from SparTerm (Bai et al., 2020), which uses un-saturated ReLU summation with a fixed pre-trained binary gating mask rather than end-to-end log-saturated FLOPS-regularized training.
aliases:
- SParse Lexical AnD Expansion Model
- SPLADE First-Stage Sparse Retriever
- SPLADE-FLOPS Learned Sparse Retrieval
