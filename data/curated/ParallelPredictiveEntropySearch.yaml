id: AIMech:ParallelPredictiveEntropySearch
name: Parallel predictive entropy search
concept_kind: algorithm
definition: A batch Bayesian optimization algorithm that jointly selects parallel evaluations of one scalar
  objective using approximate information gain about its maximizer location, with sampled optimizer locations
  and Gaussian expectation-propagation approximations to conditional batch observation covariance log
  determinants.
definition_evidence:
- source_id: shah2015-ppes
  locator: Sections3–3.3, PDFpp.3–5, joint optimizer-information target, relaxed conditioning, EP, sampling
    and Eq 7.
  relation: supports
claims:
- claim_id: joint-batch-optimizer-information
  kind: mechanism
  statement: Parallel predictive entropy search selects Q input locations together for parallel noisy
    evaluations of one scalar objective. In the source maximization convention, its ideal acquisition
    is I(x_star; Y_S | D), information about the global maximizer location from the joint batch observation
    vector. Assume a posterior over functions with a finite attained maximum on the compact search domain,
    a measurable maximizer selection rule when needed, and finite mutual information. Mutual information
    symmetry rewrites this target as joint predictive entropy minus expected joint entropy conditional
    on the maximizer. It remains a one-step information objective even though the batch is selected jointly.
  evidence:
  - source_id: shah2015-ppes
    locator: Section2, PDFp.2, problem and existence assumption; Section3, PDFp.3, Eqs1–2; Section5, PDFp.8,
      one-step versus within-batch distinction.
    relation: supports
- claim_id: relaxed-maximizer-conditioning
  kind: mechanism
  statement: For a sampled maximizer location, relax the all-domain maximum condition to comparisons f(x_star)
    >= f(x_q) at the Q proposed locations and a soft comparison with the largest observed noisy response
    y_max. For positive observation noise standard deviation sigma and a nonempty observation history,
    the relaxed latent density is proportional to the ordinary GP posterior over batch values and f(x_star),
    multiplied by the Q comparison indicators and Phi((f(x_star) - y_max)/sigma). Normalize this product.
    The noisy incumbent factor is a heuristic restriction; it neither checks every past latent function
    value nor excludes a larger unqueried value, and the result is not exact global-maximizer conditioning.
  evidence:
  - source_id: shah2015-ppes
    locator: Section3.1, PDFpp.3–4, relaxed conditions and Eq 4; Eq 4 omits the required normalization.
    relation: supports
  - source_id: shah2015-ppes-supplement
    locator: PDFp.1, Eq 1 states the relaxed product with proportionality.
    relation: supports
- claim_id: joint-gaussian-ep-projection
  kind: mechanism
  statement: Approximate each hard comparison and the soft incumbent factor with a scaled Gaussian site
    along a linear projection of the Q + 1 latent values. Hard sites use f(x_star) - f(x_q), and the incumbent
    site uses f(x_star). EP updates projected cavity moments and site parameters. A proper resulting Gaussian
    supplies a full conditional covariance across all Q query locations by marginalizing out f(x_star).
    Add independent observation-noise covariance sigma^2 I after latent approximation. This keeps dependence
    among batch locations within the Gaussian approximation; it does not establish exact conditional moments
    or guaranteed EP convergence.
  evidence:
  - source_id: shah2015-ppes
    locator: Section3.1, PDFp.4, site directions, covariance part of Eq 5, Gaussian marginalization and
      observation-noise addition.
    relation: supports
  - source_id: shah2015-ppes-supplement
    locator: PDFpp.1–2, Eqs1–4 and6–14, intended EP site/cavity/moment structure; literal formula defects
      are retained below.
    relation: supports
- claim_id: approximate-maximizer-samples
  kind: mechanism
  statement: For a stationary kernel with a normalized spectral density, form random Fourier features
    with amplitude sqrt(2 alpha / m), sample linear feature weights from their Gaussian posterior and
    optimize the sampled feature function to approximate a posterior maximizer draw. Finite feature counts
    and local numerical maximization introduce approximation. The paper also describes using the maximizer
    of the posterior mean as a single-location plug-in; its identification of that location with the MAP
    of the optimizer distribution is not valid in general. The reported experiments use random features
    and reject draws leading to failed EP runs, a policy that can change the distribution of retained
    optimizer samples.
  evidence:
  - source_id: shah2015-ppes
    locator: Section3.2, PDFpp.4–5, posterior-mean plug-in, Eq 6 and feature posterior; Section4, PDFp.6,
      rejection of failed EP runs. The MAP identification is a source caveat, not adopted as an identity.
    relation: supports
- claim_id: joint-covariance-log-determinant-score
  kind: mechanism
  statement: For each sampled hyperparameter setting and approximate maximizer, compute one half of the
    difference between log det(K + sigma^2 I) and log det(Sigma + sigma^2 I), where K is the ordinary
    latent batch covariance and Sigma is the EP conditional latent batch covariance. Average these differences
    over the samples as in Eq 7, with one half multiplying the whole difference. Positive-definite observation
    covariances are required for these finite Gaussian entropies. The Q-by-Q determinants retain batch
    correlation; they are generally different from a sum of single-query log-variance acquisitions and
    are unchanged by consistent permutation of batch indices. At Q = 1 the determinants reduce to variances.
    Hyperparameter averaging is an average of conditional information approximations, not generally the
    entropy difference of a fully marginalized predictive mixture.
  evidence:
  - source_id: shah2015-ppes
    locator: Section3, PDFp.3, Gaussian predictive entropy; Section3.1, PDFp.4, conditional entropy; Section3.3,
      PDFp.5, Eq 7 and hyperparameter sampling; Section4, PDFp.6, batch permutation symmetry.
    relation: supports
- claim_id: joint-approximate-acquisition-optimization
  kind: mechanism
  statement: Optimize the approximate acquisition jointly over the Q times input dimension coordinates
    rather than filling the batch by independent single-query choices. The published covariance derivative
    in Eq 9 holds the fitted EP site variances fixed while differentiating the GP covariance. It is valid
    under that fixed-site convention; convergence of EP does not generally make the site parameters independent
    of GP parameters, so this expression is not certified as the derivative through refitted EP or of
    exact mutual information. The reported random initialization followed by gradient ascent is local
    numerical optimization and does not guarantee the globally best batch or an optimal multi-step evaluation
    policy.
  evidence:
  - source_id: shah2015-ppes
    locator: Section3.3, PDFp.5, Eqs 8–9 and site-derivative assertion; Section4, PDFp.8, initialization
      and admitted local-optimization limitation; Section5, PDFp.8, one-step information objective.
    relation: supports
identity_notes: The original PPES method seeks joint information from a batch about a single-objective
  maximizer using sampled optimizer locations, EP and full batch predictive covariance. Scalar PES does
  not itself specify that joint-batch acquisition, and constrained multi-objective PPESMOC targets a different
  random object. Historical PPES abstract-only and future-extension mentions were research context, not
  a maintained record.
limitations:
- Compactness alone does not guarantee finite attained maxima for arbitrary sample functions. A posterior
  maximizer target, tie-selection convention and finite information must be well defined. The displayed
  noisy-incumbent factor assumes a nonempty history and positive sigma; the record does not specify a
  general zero-noise, singular-covariance or empty-history implementation.
- Official NIPS 2015 main PDF has 9 pages; its linked ZIP contains a separate 2 page supplement. arXiv
  1511.07130v1 was submitted November 23, 2015 and has 12 pages including the appendix. The checked method
  and appendix displays retain the same substantive caveats; publication, submission and PDF build dates
  are kept distinct. No author implementation was inspected or executed.
- Main Eq 4 on p.4 omits normalization, while supplement Eq 1 uses proportionality. Main Eq 5 and supplement
  Eq 3 give a malformed Gaussian mean update with a vector-plus-matrix sum and inverse. The covariance
  part is the supported precision-addition form. The record does not certify a literal implementation
  of the printed mean formula.
- Supplement p.1 Eq 5 has a site sum stopping at Q despite Q+1 sites and inconsistent parameter notation.
  On p.2, Eq 7 uses projected inverse covariance instead of the projected covariance in the cavity-variance
  calculation; Eq 11 uses squared cavity mean where the derivative identity requires squared cavity variance;
  beta for the soft site contains an extra Phi; Eqs10–11 omit the soft-probit noise-dependent moment factors;
  Eq 13 inverts a natural-mean difference that should be multiplied by the site variance. These are inspected
  source algebra caveats, not a claimed author erratum or complete repaired PPES implementation.
- The posterior-mean maximizer is not generally the posterior mode of the maximizer location. A finite
  three-point Gaussian example with means (1,0,0) and variances (0.01,100,100) gives the first point a
  win probability below one third, despite its uniquely highest mean; symmetry gives each other point
  a larger optimizer probability. The supporting audit uses an analytic upper bound and a differentiable-kernel
  realization, not Monte Carlo estimation.
- Converged EP site parameters can depend on the prior. For one standard zero-threshold Gaussian truncation
  with prior variance v, the projected variance is c v, c = 1 - 2/pi, and site precision is (1/c - 1)/v.
  The derivative through refitting is c, whereas freezing the site gives c^2. This bounded counterexample
  refutes general site constancy; it does not implement the complete PPES acquisition or audit all hypotheses
  of its cited EP references.
- Finite random features, approximate maximizer search, relaxed conditioning, Gaussian EP projection,
  rejected failed EP samples, Monte Carlo hyperparameters and local batch optimization all affect the
  operational approximation. The Figure 1 reference calculation itself uses discretization, rejection
  sampling and a kernel-density entropy estimate. The p.7 experimental prose says 200 random initializations
  while the Figure 3 caption on p.8 says 100; no aggregate empirical count or performance conclusion is
  adopted. No exact noisy information, unbiased accepted-sample, global-optimization, universal accuracy,
  runtime or superiority claim is made.
- The original bounded checks in research/discovery/ppes-boundaries.py use rational matrices and finite
  information channels, plus explicitly floating Gaussian CDF, moment and entropy calculations. They are
  supporting algebra and counterexamples, not full EP inference, external-code execution, a GP benchmark
  or independent scientific approval. Scalar PES, scalar optimum-value MES/OPES and constrained multi-objective
  PPESMOC remain distinct operational identities; the Q = 1 ideal-information overlap does not identify
  their approximations.
