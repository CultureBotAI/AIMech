claims:
- claim_id: r411-cta-lower-bound-and-fedavg-divergence-under-unbounded-non-iid-gradients
  kind: mechanism
  statement: Claim 2.1 (Theorem 2) establishes an Omega(1 / epsilon) communication-round lower bound for any Computation-Then-Aggregation (CTA) algorithm on L-smooth non-convex objectives, and Claim 2.2 (with Claim D.2) proves that FedAvg with Q > 1 local steps diverges on the 1D L-smooth pair f_1(x) = (1/2) x^2, f_2(x) = -(1/2) x^2 without bounded-gradient or bounded-dissimilarity assumptions because the per-round update amplification matrix (1/2) D^{Q-1} 1 1^T D has spectral radius ((1 + eta)^Q + (1 - eta)^Q) / 2 > 1.
  evidence:
  - source_id: r411-primary-pdf
    locator: Section 2 Fundamental Limits of Federated Learning (Definition 2.1, Claims 2.1-2.2) & Appendices C-D
    relation: supports
- claim_id: r411-optimal-nonconvex-rate-and-non-iid-adaptive-communication-skipping
  kind: mechanism
  statement: Theorem 1 proves that for any penalty step size 0 < eta < (sqrt(5) - 1) / (4 L), FedPD with p = 0 converges to an epsilon-stationary and consensus solution in T = O(1 / epsilon) rounds without any data homogeneity or bounded-gradient assumption, while under delta-non-IID gradient dissimilarity ||nabla f_i(x) - nabla f(x)|| <= delta (Assumption A5), choosing communication-skip probability p such that p / (1 - p)^2 = O(epsilon / delta^2) reduces total communication rounds to C = T (1 - p) while preserving O(1 / epsilon) computation complexity.
  evidence:
  - source_id: r411-primary-pdf
    locator: Section 4 Convergence Analysis (Theorem 1, Table 1) & Appendix F
    relation: supports
- claim_id: r411-full-client-participation-and-dual-variable-storage-limitation
  kind: limitation
  statement: Standard FedPD requires clients to maintain persistent local primal-dual iterates (x_i^r, lambda_i^r) across communication rounds and assumes all N clients participate whenever the global aggregation event (Bernoulli(1 - p)) triggers.
  evidence:
  - source_id: r411-primary-pdf
    locator: Section 3 (Algorithm 1, Eq. 9) & Section 4 (Theorem 1)
    relation: supports
- claim_id: r411-non-iid-mnist-and-federated-speech-command-recognition-application
  kind: application
  statement: Applied to non-IID MNIST convolutional classification and Google Speech Commands recognition across distributed clients, outperforming FedAvg, FedProx, and SCAFFOLD in accuracy versus communication rounds.
  evidence:
  - source_id: r411-primary-pdf
    locator: Section 6 Numerical Results (Figures 2-6)
    relation: supports
