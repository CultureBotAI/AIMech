id: AIMech:FedPdFederatedPrimalDualOptimizationWithAdaptivityToNonIidData
name: FedPD (Federated Primal-Dual Optimization with Adaptivity to Non-IID Data)
concept_kind: algorithm
review_status: DRAFT
definition: A primal-dual federated optimization framework (Zhang et al. 2021, Algorithm 1) for smooth possibly non-convex consensus problems min_{x_0, {x_i}} sum_{i=1}^N w_i f_i(x_i) subject to x_i = x_0 that minimizes the separable client augmented Lagrangian L_i(x_i, x_0^r, lambda_i^r) = f_i(x_i) + <lambda_i^r, x_i - x_0^r> + (1 / (2 eta)) ||x_i - x_0^r||^2 via Q local gradient or stochastic-gradient steps (Oracle I or II), and then with probability 1 - p communicates with the server to aggregate x_0^{r+1} = sum_{i=1}^N w_i (x_i^{r+1} + eta lambda_i^r) and update dual variables lambda_i^{r+1} = lambda_i^r + (1 / eta)(x_i^{r+1} - x_0^{r+1}), or with probability p in [0, 1) skips global communication by setting x_0^{r+1} = x_0^r and lambda_i^{r+1} = lambda_i^r.
identity_notes: Distinct from FedDyn (AIMech:FedDynFederatedLearningBasedOnDynamicRegularization, which analyzes convex/strongly convex objectives under partial client participation with a server state vector h^t), from FedSplit (AIMech:FedSplitOperatorSplittingForFastFederatedOptimization, which applies Peaceman-Rachford reflection splitting to convex monotone inclusions without randomized communication skipping p), and from Computation-Then-Aggregation (CTA) primal methods such as FedAvg and FedProx, which diverge on unconstrained non-convex objectives with Q > 1 local steps unless inter-client gradient dissimilarity is bounded (Claim 2.2).
aliases:
- FedPD
- Federated Primal-Dual Optimization
- 'FedPD: A Federated Learning Framework With Adaptivity to Non-IID Data'
