claims:
- claim_id: claim-01
  kind: mechanism
  statement: "For any n x n symmetric positive semidefinite Gram matrix G = X^T X and column sampling-and-rescaling matrix S in R^{n x c}, Lemma 4 proves that the rank-k Nystr\xF6m approximation tilde{G}_k = C W_k^+ C^T = G S (S^T G S)_k^+ S^T G factors exactly as tilde{G}_k = X^T hat{U}_k hat{U}_k^T X where hat{U}_k = X S V_{W,k} Sigma_{W,k}^{-1/2} has orthonormal columns, establishing the exact operator and Frobenius norm identities ||G - tilde{G}_k||_2 = ||X - hat{U}_k hat{U}_k^T X||_2^2 and ||G - tilde{G}_k||_F = ||X^T X - X^T hat{U}_k hat{U}_k^T X||_F, while Section 5.2 (Equation 47) shows that for an invertible k x k principal block A_{11}, the unregularized residual A - tilde{A} vanishes outside the bottom-right block where it equals the Schur complement A_{22} - A_{21} A_{11}^{-1} A_{12}."
  evidence:
  - source_id: r328-primary-pdf
    locator: Section 4.3, Lemma 4 and Proof, pp. 2166-2167; Section 5.2, Equation 47, p. 2168
    relation: supports
  - source_id: r328-metadata-cr
    locator: JMLR Volume 6 abstract and bibliographic record (pp. 2153-2175)
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: "Theorem 3 (together with Lemmas 2 and 3) proves that when c >= 64 k / (beta epsilon^4) columns of G are sampled with probabilities p_i >= beta G_{ii}^2 / sum_{j=1}^n G_{jj}^2, the rank-k Nystr\xF6m approximation tilde{G}_k satisfies ||G - tilde{G}_k||_xi <= ||G - G_k||_xi + epsilon sum_{i=1}^n G_{ii}^2 (both in expectation and with high probability 1 - delta) for xi in {2, F} while requiring only O(n) queries to diagonal entries and O(c n) queries to the sampled columns."
  evidence:
  - source_id: r328-primary-pdf
    locator: Section 3.2, Theorem 3, Equations 8-9, pp. 2160-2161; Section 4.1-4.3, Lemmas 2-3 and Proof of Theorem 3, pp. 2164-2167
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: The additive error term epsilon sum_{i=1}^n G_{ii}^2 in Theorem 3 scales with the squared trace / diagonal norm of G rather than the residual norm ||G - G_k||_F (with sample complexity O(k / epsilon^4)), and uniform column sampling p_i = 1/n (Remark on p. 2162) fails to capture high-leverage columns when diagonal entries G_{ii} are strongly non-uniform.
  evidence:
  - source_id: r328-primary-pdf
    locator: Section 3.2, Discussion of Theorem 3 and Uniform Sampling Remark, pp. 2160-2162
    relation: supports
