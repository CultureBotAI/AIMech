definition: An adversarial game-tree search procedure that augments NegaScout’s minimal-window
  traversal with recursively retained information from an initial search, using remembered
  inferior left regions and successor upper bounds to guide a later re-search.
definition_evidence:
- source_id: marsland1987
  locator: Sections1–2.3, printed pp.186,188–191 / PDF pp.2,4–7
  relation: supports
concept_kind: algorithm
claims:
- claim_id: adjacent-window-probes
  kind: mechanism
  statement: In the displayed integer-score INS procedure, the first successor uses
    the incoming open window and later initial-search successors use an adjacent-value
    minimal window around the current bound. A failed-high probe may require an opened-window
    re-search; the displayed first-successor, fail-low, beta-cutoff, depth-at-most-two
    and remembered PROVEBEST cases determine when that additional search is avoided.
  evidence:
  - source_id: marsland1987
    locator: Section2, printed p.186 / PDF p.2; Figure3, printed p.191 / PDF p.7
    relation: supports
- claim_id: ignore-left-information
  kind: mechanism
  statement: INS retains the path information identifying the leftmost terminal variation
    responsible for the initial failure. During a later re-search, previously examined
    inferior siblings to the left of that variation at even relative levels can be
    skipped. The source presents ignore-left pruning as a special case of prove-best
    pruning using remembered extreme merits and successor ordering.
  evidence:
  - source_id: marsland1987
    locator: Sections2.2–2.3 and Figure2, printed pp.188–190 / PDF pp.4–6
    relation: supports
- claim_id: prove-best-upper-bounds
  kind: mechanism
  statement: At odd levels relative to a re-search root, INS retains successor upper
    bounds from the initial traversal. It uses them to order successors, stop when
    the larger of the current result a and incoming alpha reaches the next remaining
    upper bound, and narrow later search windows. Figure3 tests max(a,alpha)>=merit[i+1]
    and then sets a=max(a,merit[i+1]); the returned result can remain only a fail-low
    bound. The negamax score orientation and validity of the retained bounds are part
    of this source-scoped interpretation.
  evidence:
  - source_id: marsland1987
    locator: Sections2.2–2.3 and Figure2, printed pp.188–190 / PDF pp.4–6; Figure3,
      printed p.191 / PDF p.7
    relation: supports
- claim_id: recursive-information-storage
  kind: mechanism
  statement: 'The complete-information INS presentation saves information recursively
    throughout the initial search subtree: the relevant successor index at ignore-left
    nodes and returned successor merits at prove-best nodes. SaveInfo and GetInfo
    hide its storage management. The reported experiments use a linked tree retaining
    all this information; the paper separately describes a hash-table option that
    can lose information through conflicts.'
  evidence:
  - source_id: marsland1987
    locator: Section2.3, printed p.190 / PDF p.6; Figure3, printed p.191 / PDF p.7
    relation: supports
- claim_id: research-flag-and-unvisited-region
  kind: mechanism
  statement: Figure3 distinguishes the invocation’s research flag from a mutable resflag.
    A re-search invocation retrieves and sorts remembered successor information; when
    the procedure moves beyond remembered ignore-left information, resflag becomes
    false for subsequent recursive calls. The displayed SaveInfo call is guarded by
    research being false, and the procedure returns its current score or bound.
  evidence:
  - source_id: marsland1987
    locator: Figure3, printed p.191 / PDF p.7; storage explanation, printed p.190
      / PDF p.6
    relation: supports
- claim_id: reported-comparison-design
  kind: scope
  statement: The journal compares INS with NS, PNS, SSS* and DUAL* on generated uniform-width,
    fixed-depth trees with random or specified sibling ordering. The plotted terminal-visit
    counts are percentages of a minimal game-tree size, averaged over the same twenty
    sample trees for each displayed setting; they are not wall-clock measurements
    or universal node-dominance guarantees.
  evidence:
  - source_id: marsland1987
    locator: Sections4.1.1–4.1.2, printed pp.193–194 / PDF pp.9–10; Figures5–7, printed
      pp.195–197 / PDF pp.11–13
    relation: supports
limitations:
- The source-scoped procedure and experiments concern finite, fixed-depth alternating
  game trees, with uniform positive branching in the displays. No general cyclic-graph
  duplicate policy, stochastic-game semantics, quiescence treatment or arbitrary early-terminal
  interface is established.
- The adjacent-value window uses integer score units. A failed-window return may be
  a bound rather than an exact minimax value; arbitrary real-valued epsilon rules,
  floating-point tolerances and terminal scoring conventions are not specified.
- Figure3 delegates storage to SaveInfo/GetInfo and does not visibly populate merit
  with each returned v during the initial loop. Array initialization, value capture,
  cache misses, validity and lifetime therefore remain source-presentation questions
  rather than a complete executable contract or a proved algorithm defect.
- The displayed pseudocode uses one-based successor indices and reads merit[i+1].
  Excluding the i==w case is stated in a comment rather than encoded in that Boolean
  guard. The listing is not directly executable C and must not be silently repaired.
- A finite hash table can lose remembered information and potential cutoffs; the reported
  full-information experiment instead retains the generated subtree. Neither establishes
  a hard total byte bound including the recursion stack, successor arrays, cache policy
  and allocator overhead.
- Terminal-count curves are conditional on the supplied tree generator, width, depth
  parity, ordering and twenty shared samples. The paper discusses sampling variability;
  these results do not prove universal dominance over SSS*, DUAL*, NS, PNS or alpha-beta.
- Preliminary execution-time and OPEN-management observations describe the authors’
  implementations, with details deferred to report12. They are not reproduced results,
  hardware-independent speedups or evidence that fewer terminal visits always means
  lower time.
- The paper’s PNS stores relevant upper bounds only at the first level, and its footnote
  discusses NegaScout/PVS lineage. Those descriptions do not by themselves establish
  PNS as this full INS procedure, global PVS aliases, or equivalence to all later
  implementations. The 1985 original has been read separately; its version differences
  and the other cited lineage questions remain separately tracked.
- The defining evidence is the inspected15-page author-hosted1987 journal reproduction.
  The separate18-page author rendering was inspected only in selected regions, and
  the TR85-16 route has a cover/title/page-count discrepancy; neither is treated as
  a wholly equivalent publisher artifact or a fully read independent defining source.
- The draft records the described pruning and recursion mechanism while retaining
  the abbreviated helper and guard conventions. It does not certify a full correctness
  or node-dominance theorem, execute INS, or import uninspected proofs from SSS*,
  NegaScout or alpha-beta references.
