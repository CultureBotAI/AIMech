identity_notes: Current prewrite comparison at merged base b5db0b5d88c5fdc5bdc920dedcb26b9b35af6a4f
  on 2026-10-16 compared 1,246 records (804 native, 442 pinned AIO), 4,937 identity-field
  occurrences and 3,774 normalized values. Candidate identity collisions were empty;
  ITERSSS* was the sole normalized context match. Four explicit roots were searched
  with ignored and hidden files included, using literal source/name probes and separate
  word-bounded INS/PNS context probes. The 328 distinct complete matching contents
  were semantically reviewed, and all 602 occurrence references were mechanically
  reconstructed; the successor collection preserved their exact line multisets. This
  record selects the 1987 complete-information NegaScout procedure with recursive
  retained bounds and ignore-left/prove-best control. It remains distinct from the
  separately defined 1985 partial-information policy, baseline NegaScout/PVS, DUAL*,
  SSS* and memory-controlled ITERSSS*. INS is source-local and is not a global alias.
  The 1985 source has now been read separately; its correspondence to the 1987 helper/storage/retention
  descriptions and the other original lineage sources remain tracked. Main911 carries
  the existing source responsibility while retaining all earlier records and unresolved
  questions. The pinned 30-target AIO no-match assessment is retained with its historical
  reading scope; current identity clearance is bounded to the inspected corpus and
  explicit search roots, not global novelty.
