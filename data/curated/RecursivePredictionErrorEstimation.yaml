- source_id: chen-billings1989
  locator: Section 3, Equations 18–26, PDF pp. 5–6 / printed pp. 572–573
  relation: supports
claims:
- claim_id: prediction-error-update
  kind: mechanism
  statement: For the squared prediction-error criterion, let epsilon_t=y_t-yhat_t and let psi_t denote
    the recursive predictor-sensitivity approximation. The displayed Gauss–Newton form updates R_t=(1-gamma_t)R_(t-1)+gamma_t*psi_t*psi_t^T
    and theta_t=theta_(t-1)+gamma_t*R_t^(-1)*psi_t*epsilon_t, with positive-definite curvature handling
    as needed. The positive update sign corresponds to minus the residual-loss gradient because epsilon=y-yhat.
    R approximates curvature; it is not the exact Hessian of every nonlinear objective. Other search directions
    belong to the broader prediction-error method family.
  evidence:
  - source_id: chen-billings1989
    locator: Section 3, Equations 18–25, PDF p. 5 / printed p. 572
    relation: supports
- claim_id: residual-dependent-sensitivity
  kind: mechanism
  statement: For a fixed parameter theta and predictor theta^T*phi_t(theta) built from past residuals,
    the total sensitivity is psi_t=phi_t-sum_i[theta^T*(partial phi_t/partial epsilon_(t-i))]*psi_(t-i).
    The online algorithm uses previous parameter estimates and stored residuals/sensitivities. This is
    a recursive approximation based on the fixed-parameter derivative, not exact differentiation through
    the entire sequence of changing parameter updates. Treating phi as parameter-independent generally
    changes the direction.
  evidence:
  - source_id: chen-billings1989
    locator: Sections 2–3, Equations 8–12 and 24–25, PDF pp. 3–5 / printed pp. 570–572
    relation: supports
- claim_id: linear-noise-filter
  kind: mechanism
  statement: With a nonlinear process predictor and a constant-coefficient linear lagged-error polynomial
    C(q^-1)=1+sum_i c_i*q^-i, the source writes the sensitivity recursion as filtering the current regressor
    through 1/C. The leading coefficient is 1. Predictor/filter stability concerns residual reconstruction
    and differs from stability of the physical system dynamics. Merely making the noise terms linear in
    past errors does not guarantee a stable filter.
  evidence:
  - source_id: chen-billings1989
    locator: Sections 2–4.1, Equations 15,26–30, PDF pp. 4,6 / printed pp. 571,573
    relation: supports
- claim_id: inverse-curvature-form
  kind: mechanism
  statement: An algebraically equivalent inverse update uses P_t=[P_(t-1)-P_(t-1)*psi_t*psi_t^T*P_(t-1)/(lambda_t+psi_t^T*P_(t-1)*psi_t)]/lambda_t
    and theta_t=theta_(t-1)+P_t*psi_t*epsilon_t, where P_t=gamma_t*R_t^(-1) and lambda_t=gamma_(t-1)*(1-gamma_t)/gamma_t.
    The equivalence requires well-defined inverses and nonzero denominators; the gain and forgetting factors
    are linked rather than arbitrary independent choices. Exact two-dimensional calculations check this
    identity for a specified positive-definite common state.
  evidence:
  - source_id: chen-billings1989
    locator: Section 3, Equations 19–23, PDF p. 5 / printed p. 572; exact curator calculations in research/discovery/recursive-estimation-boundaries.py
    relation: supports
- claim_id: conditional-convergence
  kind: limitation
  statement: The ODE-based convergence discussion assumes a stable predictor domain, admissible parameter
    restrictions, suitable smoothness and data/moment limits, decreasing gains, and positive-definite
    curvature. It concerns local behavior under those conditions, not unconditional global minimization.
    For general nonlinear noise the stable domain can depend on unknown input/output statistics, preventing
    straightforward enforcement. The source’s recommendation to use simpler noise models is not a universal
    convergence proof.
  evidence:
  - source_id: chen-billings1989
    locator: Section 4.1, conditions (a)–(g) and Equations 32–41, PDF pp. 7–8 / printed pp. 574–575; Section
      4.4, PDF p. 15 / printed p. 582
    relation: supports
- claim_id: fixed-structure-identification-use
  kind: application
  statement: The paper applies recursive prediction-error estimation to a simulated closed-loop polynomial
    system and a measured pilot liquid-level system. Model structures are determined beforehand. For the
    liquid-level example, recursive and offline estimators use the same selected NARMAX structure. These
    examples establish a documented parameter-identification use; they are not held-out accuracy, causal
    recovery or universal superiority evidence.
  evidence:
  - source_id: chen-billings1989
    locator: Section 6, Examples 1–2, Tables 1–3 and Figures 1–6, PDF pp. 17–26 / printed pp. 584–593
    relation: supports
