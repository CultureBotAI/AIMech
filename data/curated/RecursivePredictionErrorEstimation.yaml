id: AIMech:RecursivePredictionErrorEstimation
name: Recursive prediction-error estimation
aliases:
- Recursive prediction error method
concept_kind: algorithm
definition: A recursive parameter-estimation method that incrementally adjusts a parameterized predictor
  using prediction errors and search directions based on its parameter sensitivities.
identity_notes: Normalized comparisons covered all 442 pinned AIO IDs, labels and scoped synonyms and
  530 native IDs, names and aliases, including expanded prediction-error and pseudo-linear names. No identity
  match was found. Ignored- and hidden-inclusive full-text searches covered the recovery worktree and
  readable previous worktree, returning five and zero lines; all five concern the pending source cohort,
  not existing estimator records. Original Documents untracked files remain inaccessible and are not claimed
  re-audited. Read all 50 AIO semantic rows and 159 native name/definition neighbors, eight complete annotated
  AIO CLASS nodes with incident edges, and the complete SGD, L-BFGS and orthogonal least-squares records.
  The NARX/NARMAX family records were fully read in the preceding round. Generic optimization and regression
  are related scopes; they do not supply this estimator identity. NARMAX is a model family, forward OLS
  selects structure, and recursive neural networks denote architectures. Recursion in a name is not equivalence.
  These methods overlap in special cases without being identical families. LinearRegression does not specify
  parameter-dependent residual recursion, ARMA is a model family, and TimeSeriesAnalysis/Forecasting and
  SupervisedLearning are task contexts. None is an exact match. SGD can overlap with a simple search-direction
  choice, but its generic sampled-gradient definition does not identify this recursive predictor treatment;
  L-BFGS uses a different curvature-history mechanism.
