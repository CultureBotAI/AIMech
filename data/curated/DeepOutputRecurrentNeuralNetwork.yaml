  rationale: The deep output map uses a feedforward MLP component. This relation does not assert that
    the complete recurrent architecture is feedforward.
limitations:
- The definition is scoped to the paper’s feedforward deep-output construction, not every conditional
  generative output model or every later use of deep output terminology.
- Deep output, deep transition and stacking are compatible properties; DOT is a more specifically constrained
  combination, not an exact alias for DO.
- No DO-only empirical comparison is reported in the inspected tables. Output depth alone provides no
  new recurrent state or universal performance and information-recovery guarantee.
- The complete 13-page primary PDF was visually read and reused with its original access time and hash.
  Constructed examples are not author-code or benchmark replication; DRAFT remains.
