id: AIMech:DeepOutputRecurrentNeuralNetwork
name: Deep Output Recurrent Neural Network
aliases:
- DO-RNN
concept_kind: architecture
definition: A recurrent neural architecture whose hidden-to-output function uses a multilayer perceptron
  with intermediate nonlinear feedforward layers to compute an output from the current recurrent hidden
  state.
identity_notes: Compared all 442 pinned AIO and 616 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 51, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 22 AIO and 28 native definitions, with every matched definition
  read. 5 full annotated AIO node/edge/generated contexts and 2 full native records were inspected. DO-RNN
  is defined by a feedforward MLP hidden-to-output map in the inspected paper. DOT further requires a
  deep transition, while DT alone does not require deep output. DO is not an exclusive DO-only benchmark
  configuration, a conditional generative output model or a separate recurrent hidden stack.
definition_evidence:
- source_id: pascanu2014
  locator: Section 3.2.2, PDF pp. 3–4; Section 3.3.2, p. 5, unnumbered output formula
  relation: supports
claims:
- claim_id: multilayer-output-map
  kind: mechanism
  statement: The current hidden state enters a sequence of learned feedforward transformations and nonlinearities
    before the final output transformation. The paper’s formal DO-RNN description deepens the output function
    rather than requiring additional recurrent state variables. The generic output notation does not by
    itself guarantee normalized probabilities; the final output function and task determine that interpretation.
  evidence:
  - source_id: pascanu2014
    locator: Section 2, PDF p. 2, Equation 2; Sections 3.2.2 and 3.3.2, pp. 3–5, unnumbered MLP output
      formula
    relation: supports
- claim_id: combinable-depth-scope
  kind: scope
  statement: The deep-output criterion does not require a shallow state transition. Combining it with
    a deep transition yields DOT-RNN, whose illustrated version has one intermediate layer in each map.
    Recurrent stacking and transition depth remain separate compatible choices. The paper discusses conditional
    generative output models as related alternatives but restricts its own construction to feedforward
    intermediate layers.
  evidence:
  - source_id: pascanu2014
    locator: Sections 3.2.2–3.3.3, PDF pp. 3–6, Figure 2(c) and formal descriptions
    relation: supports
- claim_id: state-information-and-gradient-boundary
  kind: scope
  statement: A deeper deterministic output map can change predictions and the gradients propagated from
    the output loss while leaving a fixed hidden-state transition unchanged. It adds no recurrent state
    on its own and cannot distinguish two histories already mapped to the same hidden state. The suggested
    benefit of a more compact or disentangled state is a motivation, not a guarantee that arbitrary lost
    historical information is recovered.
  evidence:
  - source_id: pascanu2014
    locator: Section 3.2.2, PDF p. 3; Section 3.3.2, p. 5; constructed fixed-transition, output-derivative
      and state-collision examples
    relation: supports
- claim_id: combined-evaluation-limits
  kind: limitation
  statement: The experimental tables compare shallow RNN, DT(S), combined DOT(S) and stacked RNN; they
    do not contain a separate DO-only model. DOT(S) results consequently do not establish an isolated
    benefit from output depth. The main combined model is worse than the shallow RNN on JSB Chorales,
    while a separate starred music setting changes units, dropout and pretraining together. Reported language-model
    gains remain conditional on the combined architecture and its unequal training and capacity choices.
  evidence:
  - source_id: pascanu2014
    locator: Sections 5.1–5.3, PDF pp. 7–9, Tables 1–3; Discussion, p. 10
    relation: supports
