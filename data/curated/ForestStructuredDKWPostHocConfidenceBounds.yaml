id: AIMech:ForestStructuredDKWPostHocConfidenceBounds
name: Forest-structured Dvoretzky-Kiefer-Wolfowitz post hoc confidence bounds
concept_kind: mathematical_method
aliases:
- Forest-structured reference family post hoc false positive bounds
- Bilinear bottom-up tree interpolation for post hoc false discovery bounds
- Local DKW-Massart quadratic-inversion reference-family calibration
- Simes-DKW hybrid post hoc confidence envelope
definition: 'A multiple-testing post hoc inference methodology that constructs simultaneous (1 - alpha)-confidence
  upper bounds V(S) on the number of false positives |S cap H_0(P)| across all 2^m subsets S subset N_m
  = {1, ..., m} by combining a deterministic forest-structured reference family R_ref = (R_k, zeta_k(X))_{k
  in K} (where any two regions R_k, R_{k''} are either disjoint or nested: R_k cap R_{k''} in {R_k, R_{k''},
  empty}) with random local Dvoretzky-Kiefer-Wolfowitz-Massart (DKW) upper bounds zeta_k(X). Unlike nested
  data-dependent p-value level-set reference families with fixed capacities zeta_k = k - 1, multi-subset
  interpolation V_tilde^q_{R_ref}(S) = min_{Q subset K, |Q| <= q} (sum_{k in Q} (zeta_k wedge |S cap R_k|)
  + |S \ cup_{k in Q} R_k|) is proven to equal the exact combinatorial optimal bound V^*_{R_ref}(S) =
  V_tilde_{R_ref}(S) = V_tilde^d_{R_ref}(S) whenever R_ref has a forest structure (where d is the maximum
  number of pairwise disjoint regions in R_ref, Theorem 3.6) and is computable in O(Hm) (or bilinear O(|K|
  |S|)) time via a bottom-up tree dynamic program over the completed atomic forest R_ref^oplus (Algorithm
  1). Local capacities calibrated via quadratic inversion of the tight Massart-DKW inequality control
  the Joint Error Rate at level alpha under null super-uniformity and independence (Proposition 4.1),
  uniformly dominate the Genovese-Wasserman (2004) DKW bound (Remark 4.3, Lemma A.1), improve Simes and
  Bonferroni post hoc bounds by an asymptotic factor 1 - r on localized signal regions of signal density
  r (Proposition 4.5, Corollary 4.6), and combine with the Simes bound into a hybrid envelope V^gamma_{hybrid}(alpha,
  S) = min(V_{Simes}((1-gamma)alpha, S), V_{tree}(gamma*alpha, S)) (Section 5.3).'
identity_notes: 'Distinct from AIMech:ReferenceFamilyJERPostHocConfidenceBounds (Blanchard, Neuvial, &
  Roquain 2020, The Annals of Statistics 48(3):1281-1303, arXiv:1703.02307), which studies random data-dependent
  p-value level-set reference regions R_k(X) = {i : p_i(X) <= t_k(lambda)} with fixed capacities zeta_k
  = k - 1 calibrated by single-step or step-down lambda-calibration and uses single-region interpolation
  V_bar_{R_ref}(S) = |S| wedge min_k (zeta_k + |S \ R_k|) (exact only for nested families R_1 subset ...
  subset R_K). Durand, Blanchard, Neuvial, & Roquain (2020, Scandinavian Journal of Statistics 47(4):1114-1148,
  arXiv:1807.01470v2, DOI:10.1111/sjos.12453) instead fix deterministic multiscale spatial/hierarchical
  regions R_k satisfying the (Forest) condition (two regions are either disjoint or nested) with random
  local error capacities zeta_k(X), introduce the q-subset interpolation hierarchy V_tilde^q_{R_ref}(S),
  prove exact optimality V^*_{R_ref}(S) = V_tilde_{R_ref}(S) = V_tilde^d_{R_ref}(S) on any forest family
  together with an O(Hm) bottom-up tree dynamic program (Theorem 3.6, Algorithm 1, and Algorithm 2 atomic
  decomposition), derive the quadratic-inversion local DKW-Massart bound zeta_k(X) (Proposition 4.1) and
  its asymptotic 1 - r localized-signal improvement over Simes/Bonferroni (Proposition 4.5, Corollary
  4.6), and introduce the Simes-DKW hybrid bound V^gamma_{hybrid}(alpha, S). Also distinct from AIMech:SimultaneousPathwiseFalseDiscoveryProportionBounds
  (Katsevich & Ramdas 2020), which bounds ordered pathwise sets S_t along a single filtration.'
