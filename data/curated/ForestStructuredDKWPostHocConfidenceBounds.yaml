claims:
- claim_id: multi-subset-interpolation-hierarchy-and-forest-exactness-theorem
  kind: mechanism
  statement: 'For any reference family R_ref = (R_k(X), zeta_k(X))_{k in K} of cardinality K = |K|, Section
    2.3 (Equations 8-9, Lemma 2.1, page 4) defines the q-subset interpolation hierarchy V_tilde^q_{R_ref}(S)
    = min_{Q subset K, |Q| <= q} (sum_{k in Q} (zeta_k wedge |S cap R_k|) + |S \ cup_{k in Q} R_k|) for
    1 <= q <= K and V_tilde_{R_ref}(S) = V_tilde^K_{R_ref}(S), satisfying V^*_{R_ref}(S) <= V_tilde_{R_ref}(S)
    <= V_tilde^q_{R_ref}(S) <= V_tilde^1_{R_ref}(S) = V_bar_{R_ref}(S). On non-forest families, V^*_{R_ref}(S)
    < V_tilde_{R_ref}(S) can be strict (Example 2.2, page 4: m = 4, K = 3, R_1 = {1,2,4}, R_2 = {2,3,4},
    R_3 = {1,3,4}, zeta_1 = zeta_2 = zeta_3 = 1, S = N_4 gives V^*_{R_ref}(S) = 1 < V_tilde_{R_ref}(S)
    = 2). When R_ref satisfies the (Forest) condition (forall k, k'' in K, R_k cap R_{k''} in {R_k, R_{k''},
    empty}, Definition 3.1, page 5), Lemma 3.3 and Algorithm 2 (Appendix B, pages 22-24) construct an
    atomic partition (P_n)_{1 <= n <= N} of N_m such that every R_k = P_{i:j} = cup_{i <= n <= j} P_n;
    completing R_ref to R_ref^oplus by adjoining missing atoms with trivial bounds zeta_{i,i} = |P_i|
    preserves V^*_{R_ref^oplus}(S) = V^*_{R_ref}(S) and V_tilde_{R_ref^oplus}(S) = V_tilde_{R_ref}(S)
    (Definition 3.5, Lemma A.4, pages 6, 22), and Theorem 3.6 (pages 6, 15-17) proves exact equality V^*_{R_ref}(S)
    = V_tilde_{R_ref}(S) = V_tilde^d_{R_ref}(S) where d is the maximum number of pairwise disjoint sets
    in R_ref, recovering V^*_{R_ref} = V_bar_{R_ref} under (Nested) (d = 1) and V^*_{R_ref}(S) = sum_{k=1}^K
    (zeta_k wedge |S cap R_k|) + |S \ cup_{k=1}^K R_k| under (Disjoint) (Corollary 3.7, page 7).'
  evidence:
