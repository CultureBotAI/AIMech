- claim_id: bottom-up-dynamic-programming-algorithm-on-completed-forest
  kind: mechanism
  statement: 'Algorithm 1 (Section 3.2, pages 7-8) computes the exact optimal bound V^*_{R_ref}(S) on
    any forest-structured reference family by first completing R_ref to R_ref^oplus so (All-atoms) holds,
    computing node depths phi(k) = 1 + |{k'' in K : R_{k''} supsetneq R_k}| (Equation 11) and maximal
    forest depth H = max_{k in K} phi(k), forming the level partitions K^h = {(i, j) in K^oplus : phi(i,
    j) = h or (i = j and phi(i, i) <= h)} (which partition N_m for every 1 <= h <= H by Lemma A.2, page
    21), initializing V_k = zeta_k wedge |S cap R_k| for k in K^H, and iterating bottom-up for h = H -
    1, ..., 1 via newV_k = min(zeta_k wedge |S cap R_k|, sum_{k'' in Succ_k} V_{k''}) where Succ_k = {k''
    in K^{h+1} : R_{k''} subset R_k}, returning V^*_{R_ref}(S) = sum_{k in K^1} V_k in O(Hm) time (or
    bilinear complexity in the sizes of the reference hierarchy and selected subset S).'
  evidence:
  - source_id: durand2020-pdf
    locator: Section 3.2, pp. 7-8, Figures 4-5, Algorithm 1; Section 7.2.1, pp. 16-17, Equations 27-31;
      Appendix A, p. 21, Lemma A.2
    relation: supports
  - source_id: durand2020-crossref
    locator: Scandinavian Journal of Statistics 47(4):1114-1148 abstract (bilinear complexity statement)
    relation: supports
- claim_id: local-dkw-massart-quadratic-inversion-calibration-and-gw-dominance
  kind: mechanism
  statement: 'For any K = |K| deterministic reference regions R_k subset N_m with alpha / K < 1/2, under
    (Superunif) and (Indep), Proposition 4.1 and Section 7.4 (pages 9, 18, Equations 16-17 and 32) prove
    that R_ref = (R_k, zeta_k(X))_{k in K} controls the Joint Error Rate at level alpha using local bounds
    obtained by quadratic inversion of the Dvoretzky-Kiefer-Wolfowitz inequality with Massart''s (1990)
    tight constant: |R_k cap H_0| <= |R_k| wedge min_{t in [0, 1)} (C / (2(1 - t)) + sqrt(C^2 / (4(1 -
    t)^2) + sum_{i in R_k} 1{p_i(X) > t} / (1 - t)))^2 where C = sqrt((1/2) log(K / alpha)), computable
    by evaluating the finite minimum over the s + 1 grid points 0 = p_{(0)} <= p_{(1)} <= ... <= p_{(s)}
    of ordered p-values in R_k (Remark 4.2, page 9). Remark 4.3 and Lemma A.1 (Equation 33, page 21: d
    wedge (b/(2a) + sqrt(b^2/(4a^2) + c/a))^2 <= d wedge ((c + d^{1/2}*b)/a)) prove that this quadratic-inversion
    bound is a uniform improvement over the classical Genovese & Wasserman (2004, Equation 16) DKW bound
    zeta^{GW}_k(X) = |R_k| wedge min_{t in [0, 1)} floor((sum_{i in R_k} 1{p_i(X) > t} + |R_k|^{1/2} *
    C) / (1 - t)).'
  evidence:
  - source_id: durand2020-pdf
    locator: Section 4.1, pp. 8-9, Equations 16-17, Proposition 4.1, Remarks 4.2-4.4; Section 7.4, p.
      18, Equation 32; Appendix A, p. 21, Lemma A.1, Equation 33
    relation: supports
- claim_id: localized-signal-asymptotic-improvement-and-simes-dkw-hybrid-envelope
  kind: mechanism
  statement: Under the regular partition R_k = {1 + (k - 1)s, ..., ks} (1 <= k <= K = m/s) where region
    R_1 contains false nulls in proportion r = |R_1 cap H_1| / |R_1| in (0, 1) with independent one-sided
    Gaussian test statistics X_i ~ N(mu, 1) (mu > 0) and R_2, ..., R_K are purely null, Proposition 4.5
    (pages 10, 18-19, Equations 20-23) establishes that E(V_{DKW}(R_1))/|R_1| <= 1 wedge (1 - r + 2*r*Phi_bar(mu)
    + (4*C/sqrt(s))*(1 + C/sqrt(s))), whereas E(V_{Simes}(R_1))/|R_1| >= (1 - r)*(1 - alpha*s/m) + r*Phi_bar(mu
    - Phi_bar^{-1}(alpha*s/m)) and E(V_{Bonf}(R_1))/|R_1| = (1 - r)*(1 - alpha/m) + r*Phi_bar(mu - Phi_bar^{-1}(alpha/m)).
    Corollary 4.6 (page 10) proves that as m -> infty with s >> log K, s << m, mu -> infty, and mu - Phi_bar^{-1}(alpha*s/m)
    -> -infty, limsup_m E(V_{DKW}(R_1))/|R_1| <= 1 - r while limsup_m E(V_{Simes}(R_1))/|R_1| = limsup_m
    E(V_{Bonf}(R_1))/|R_1| = 1, improving Simes and Bonferroni by an asymptotic factor 1 - r. Because
    V_{tree} depends on alpha only through 2*C^2 = log(K / alpha) (Remark 4.4) while paying a minimum
    floor cost zeta_k(X) >= floor(log(K/alpha)/2) >= 1 on small sets, Section 5.3 (pages 12-14, Figure
    10) defines the hybrid post hoc bound V^gamma_{hybrid}(alpha, S) = min(V_{Simes}((1 - gamma)*alpha,
    S), V_{tree}(gamma*alpha, S)) for gamma in [0, 1], which is a valid (1 - alpha) post hoc bound by
    a two-term union bound that matches Simes pinpointing on small p-value level sets S_k and multiscale
    DKW-tree proportion estimation on larger sets.
  evidence:
