id: AIMech:NaturalCompressionAndNaturalDitheringForDistributedOptimization
name: Natural Compression and Natural Dithering for Distributed Optimization
concept_kind: algorithm
review_status: DRAFT
definition: "A family of unbiased power-of-two randomized quantization operators for distributed and in-network gradient aggregation (Horv\xE1th et al. 2022): Natural Compression C_nat (Definition 1) rounds any non-zero scalar t = (-1)^s 2^e (1 + m) stochastically to sign(t) 2^{floor(log_2 |t|)} with probability p(t) = (2^{ceil(log_2 |t|)} - |t|) / 2^{floor(log_2 |t|)} = 1 - m and to sign(t) 2^{ceil(log_2 |t|)} with probability 1 - p(t) = m (dropping the IEEE 754 mantissa and transmitting only the sign and 8-bit exponent), while Natural Dithering D_nat^{p,s} (Definition 6) quantizes normalized vector coordinates |x_i| / ||x||_p onto s exponentially spaced power-of-two levels {0, 2^{1-s}, 2^{2-s}, ..., 2^{-1}, 1}."
identity_notes: Distinct from QSGD / Standard Random Dithering D_sta^{p,s} (AIMech:QSGDQuantizedStochasticGradientDescent, Alistarh et al. 2017, which uses uniformly spaced linear levels {0, 1/s, 2/s, ..., 1} rather than geometric power-of-two levels {2^{1-s}, ..., 1} and requires float multiplication rather than integer bit-shift addition), from TernGrad (AIMech:TernGradTernaryGradientsForDistributedDeepLearning, which uses a single l_infinity ternary level), and from biased Top-k / SignSGD compressors requiring error-feedback memory.
aliases:
- Natural Compression
- Natural Dithering
- C_nat and D_nat Power-of-Two Gradient Quantization
