claims:
- claim_id: r415-c-nat-exact-one-eighth-relative-variance-and-composition-theorem
  kind: mechanism
  statement: Theorem 3 proves that Natural Compression C_nat is unbiased (E[C_nat(x)] = x) and belongs to B(1/8) with tight worst-case relative variance omega = 1/8 attained at |t| = (4/3) 2^a (where E[C_nat(t)^2]/t^2 = max_{1 <= theta <= 2} (3 theta - 2)/theta^2 = 9/8), whereas unbiased integer rounding C_int has omega = infinity (Theorem 4); furthermore, Theorem 5 proves that composing any C_1 in B(omega_1) and C_2 in B(omega_2) yields C_1 o C_2 in B(omega_1 omega_2 + omega_1 + omega_2), so composing C_nat with any compressor C in B(omega) incurs only C_nat o C in B((9/8) omega + 1/8).
  evidence:
  - source_id: r415-primary-pdf
    locator: Section 2.2-2.4 (Theorems 3, 4, and 5) & Appendix C.1-C.3 (Eqs. 6-9)
    relation: supports
- claim_id: r415-natural-dithering-variance-bound-and-exponential-level-efficiency
  kind: mechanism
  statement: Theorem 7 proves that Natural Dithering D_nat^{p,s} with s geometric levels satisfies D_nat^{p,s} in B(omega) with omega = 1/8 + d^{1/r} 2^{1-s} min{1, d^{1/r} 2^{1-s}} (r = min{p, 2}), and Theorem 8 proves that D_nat^{p,s} is a subset-level coarsening of standard linear dithering D_sta^{p,2^{s-1}} with E[||D_nat^{p,s}(x) - x||^2] <= (9/8) E[||D_sta^{p,2^{s-1}}(x) - x||^2] + (1/8) ||x||^2, reducing the number of quantization levels from u = 2^{s-1} to s for comparable variance.
  evidence:
  - source_id: r415-primary-pdf
    locator: Section 3 (Definitions 6-7, Theorems 7 and 8, Figure 5) & Appendix C.4-C.5
    relation: supports
- claim_id: r415-non-vanishing-asymptotic-variance-floor-and-stochastic-rounding-rng-limitation
  kind: limitation
  statement: Because D_nat^{p,s} converges to C_nat rather than the identity operator as the number of levels s -> infinity, its worst-case relative variance cannot drop below the floor omega = 1/8 (Appendix A.2.3), and generating uniform random bits for stochastic mantissa rounding introduces a 10-15% CPU/GPU compression overhead relative to deterministic rounding (Appendix B).
  evidence:
  - source_id: r415-primary-pdf
    locator: Appendix A.2.3 (Figure 18) & Appendix B Implementation Optimization
    relation: supports
- claim_id: r415-bidirectional-compressed-sgd-and-in-network-aggregation-application
  kind: application
  statement: Integrated into Distributed SGD with bidirectional worker (C_{W_i}) and master/switch (C_M) compression (Algorithm 1, Theorem 9) and SwitchML-style integer In-Network Aggregation on CIFAR-10, ImageNet (ResNet-50, AlexNet), and Neural Collaborative Filtering.
  evidence:
  - source_id: r415-primary-pdf
    locator: Section 4 Distributed SGD (Algorithm 1, Theorem 9) & Section 5 Experiments (Figures 8-12)
    relation: supports
