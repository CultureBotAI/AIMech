name: Iterated Wiener Filter
aliases:
- IWF
concept_kind: algorithm
definition: An iterative MAP image-denoising algorithm that majorizes a fixed Product of Student-t log-potential
  and alternates response-dependent precision updates with a Gaussian Wiener linear solve.
identity_notes: This is the explicitly named inference procedure in Welling, Osindero and Hinton 2002,
  not the PoT probability family, a one-pass Wiener filter, a learned denoising autoencoder or a training
  algorithm for the filters. Its iterates estimate the latent clean observation under fixed model parameters.
  It is separately represented from generic sparse coding already covered by AIO:SparseLearning. Four
  candidate identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms and 447
  preceding native IDs, names and aliases. Sparse coding matches the exact synonym and definition of AIO:SparseLearning
  and is reused; none of the three selected additions has a normalized identity match. Ignored/hidden
  full-checkout searches returned 47 lines each in worktree and main, with identical matched-line sets
  after merge. All 47 matched lines were read; they contain the existing sparse-coding class, its source/export
  and prior discovery context. All 205 semantic label/synonym rows were read and verified unchanged. Twenty-four
  annotated AIO nodes and outgoing edges comprise 23 unchanged prior readings and one new symmetry-network
  inspection. Thirty-two contextual YAMLs comprise 31 unchanged prior readings and one fully read new
  record, including eight native neighbors. Absence and no-match assessments are bounded to this snapshot
  and inspected neighborhood.
