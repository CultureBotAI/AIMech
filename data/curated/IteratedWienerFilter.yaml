claims:
- claim_id: majorization-update
  kind: mechanism
  statement: For noisy y, positive-definite noise covariance Sigma, fixed filters J, positive exponents
    alpha and nonnegative grouping weights W, minimize F(x)=0.5(y-x)^T Sigma^(-1)(y-x)+sum_i alpha_i log[1+0.5
    sum_j W_ij(J_j^T x)^2]. Ungrouped factors use identity W. At the current x set gamma_i=[1+0.5 sum_j
    W_ij(J_j^T x)^2]^(-1), form D=diag(W^T(alpha*gamma)), and solve [Sigma^(-1)+J D J^T]x_new=Sigma^(-1)y.
    The bound log(t)<=gamma*t-log(gamma)-1 is tight at gamma=1/t; exact bound minimization therefore does
    not increase the fixed objective. Sigma positive definite ensures the linear solve is unique even
    if J is rank deficient. Interpreting F as a proper-prior MAP objective additionally requires the PoT
    prior to normalize.
  evidence:
  - source_id: method-source
    locator: Section 6, Equations 10-12, PDF pp. 6-7; curator majorization and positive-definiteness consequences
    relation: supports
- claim_id: optimization-boundaries
  kind: limitation
  statement: The log-potential makes the full objective generally nonconvex. Monotone exact updates do
    not guarantee its global minimum, and MAP is not generally the squared-error-optimal posterior mean.
    A scalar proper-prior calculation with alpha=10, noise variance 1 and y=8.5 reaches distinct strict
    local minima from starting values 0 and 8.5, with objectives approximately 32.03555 and 32.08788.
    The higher solution cannot be globally optimal. This is a curator counterexample to a universal optimization
    guarantee, not a reported author experiment.
  evidence:
  - source_id: method-source
    locator: Section 6, Equations 10-13, PDF pp. 6-7; curator finite calculation from the stated objective
    relation: supports
- claim_id: special-case-and-use
  kind: scope
  statement: In the source special case of square orthonormal filters, isotropic noise and identity grouping,
    the stationary condition separates into scalar cubic equations. Other structured cases require their
    own derivation. Multiple stationary roots require objective comparison; a root alone is not a global-optimum
    certificate. The source applies the procedure to overlapping transformed image patches and averages
    restored patches, using a complete set of filters learned on natural images. This patch-processing
    and preprocessing context is part of the reported denoising experiment, not a definition of all Wiener
    filters or evidence of general benchmark superiority.
  evidence:
  - source_id: method-source
    locator: Equation 13 and Section 6.1, PDF pp. 7-8
    relation: supports
limitations:
- The algorithm fixes filters, exponents and grouping weights while optimizing the clean observation.
  It does not fit the prior, estimate a noise model automatically or sample posterior uncertainty.
- Descent follows exact auxiliary updates and exact linear solves for the same fixed objective. Approximate
  solves, changing parameters or a different noise model need separate analysis.
- Nonconvexity allows initialization-dependent local minima. MAP and posterior-mean estimates optimize
  different decision criteria; the source description of MAP as optimal is not an unconditional minimum-MSE
  theorem.
- The source reports a single displayed noisy-image comparison with known Gaussian noise, overlapping
  patches and matched whitening/DC handling. It does not establish universal denoising gains or the proposed
  future benefits of overcomplete/grouped priors.
- No author software or empirical denoising experiment was run. Finite arithmetic checks verify mathematical
  boundaries, not historical implementation correctness.
aio_no_match:
  search_scope: All 442 pinned AIO IDs, labels and scoped synonyms, 447 preceding maintained identities,
    ignored/hidden full-checkout searches, 205 semantic label/synonym hits and 24 annotated AIO nodes
    with outgoing edges; compare 32 contextual YAMLs including eight native neighbors.
  rationale: The inspected pin supplies no suitable counterpart for this fixed-prior MAP optimization
    algorithm. A broad model, task, preprocessing stage or architecture would conflate its inference scope;
    incidental denoising overlap is insufficient for a mapping. This is bounded to the pinned snapshot
    and inspected neighborhood.
  examined_targets:
  - target: AIO:Model
    rejection_reason: The algorithm computes an estimate under a fixed probability model; it is not the
      abstract model itself.
  - target: AIO:TrainingStrategy
    rejection_reason: The procedure does not train filters or other prior parameters; it optimizes a clean
      observation.
  - target: AIO:MachineLearningTask
    rejection_reason: The target is a process intended to build methods that learn from data; this record
      specifies a particular fixed-model inference algorithm.
  - target: AIO:Preprocessing
    rejection_reason: The algorithm can produce a restored image as its final output; it is not defined
      as raw-data preparation before machine learning.
  - target: AIO:ImagePreprocessingLayer
    rejection_reason: The source does not specify a neural preprocessing layer.
  - target: AIO:DenoisingAutoEncoder
    rejection_reason: The method uses a fixed energy prior and iterative linear solves, not a trained
      encoder-decoder reconstruction network.
  - target: AIO:SparseLearning
    rejection_reason: The target concerns learning sparse linear representations and their elements; IWF
      instead infers clean observations under fixed filters.
