claims:
- claim_id: slora-unified-paging-interleaved-kv-and-adapter-pool
  kind: mechanism
  statement: Exploiting the shared hidden dimension H between KV cache tensors of shape (S, H) and LoRA weight matrices of shape (R, H), S-LoRA's Unified Paging statically allocates a single GPU memory pool of H-element pages in which a KV cache of sequence length S occupies S pages and a LoRA weight tensor of rank R occupies R interleaved non-contiguous pages, eliminating external fragmentation during dynamic adapter loading.
  evidence:
  - source_id: r670-primary-pdf
    locator: Section 5.1 (Unified Paging) & Figure 3, pp. 4-5
    relation: supports
- claim_id: slora-mbgmm-and-mbgmv-non-contiguous-heterogeneous-kernels
  kind: mechanism
  statement: Rather than merging adapters into W or padding heterogeneous ranks to use dense batched GEMM, S-LoRA batches the shared base projection x W across all requests and executes x A B on the fly using Multi-size Batched Gather Matrix-Matrix Multiplication (MBGMM) during prefill and Multi-size Batched Gather Matrix-Vector Multiplication (MBGMV) during decode directly over non-contiguous page indices.
  evidence:
  - source_id: r670-primary-pdf
    locator: Section 4.1 (Batching) & Section 5.3 (Custom Kernels for heterogeneous LoRA batching on Non-Contiguous Memory), pp. 3-5, Equations (1)-(2) & Figure 1
    relation: supports
- claim_id: slora-tensor-parallelism-communication-fusion
  kind: mechanism
  statement: Across N GPUs under Megatron-LM tensor parallelism, S-LoRA partitions A_1, B_1 column-wise (with an all-gather on the r-dimensional intermediate vector) and A_2 row-wise, B_2 column-wise (with an all-reduce on the r-dimensional vector and fusion into the base model's final all-reduce), incurring only 5(N-1)Br/N additional communication versus 2(N-1)Bh/N for the base model.
  evidence:
  - source_id: r670-primary-pdf
    locator: Section 6.1 (Partition Strategy) & Section 6.2 (Communication and Memory Cost Analysis), p. 6, Figure 4
    relation: supports
- claim_id: slora-application-serving-thousands-of-concurrent-adapters
  kind: application
  statement: Evaluated on LLaMA-7B/13B/30B/70B across synthetic power-law workloads and real LMSYS Chatbot Arena traces, S-LoRA serves up to 2,000 concurrent LoRA adapters on a single A100 (80GB) GPU, improving throughput by up to 4x over vLLM-packed and up to 30x over HuggingFace PEFT.
  evidence:
  - source_id: r670-primary-pdf
    locator: Section 7 (Evaluation), Table 3 & Figures 5-8, pp. 6-9
    relation: supports
- claim_id: slora-limitation-on-the-fly-overhead-for-single-adapter-and-pcie-bandwidth
  kind: limitation
  statement: When serving only one or two static adapters, S-LoRA's separated on-the-fly x A B computation has slightly lower throughput than merging W' = W + A B once into the base model, and under highly uniform request distributions with rapid adapter churn across batches, PCIe host-to-GPU prefetching bandwidth can still bottleneck adapter loading.
  evidence:
  - source_id: r670-primary-pdf
    locator: Section 5.2 (Prefetching and Overlapping) & Section 7.5 (Ablation Study, Figure 9), pp. 5, 9-10
    relation: supports
