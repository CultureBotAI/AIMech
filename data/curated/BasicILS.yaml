name: BasicILS
definition: A ParamILS algorithm-configuration method that compares candidate configurations using cost
  estimates on the same fixed number of target-algorithm runs, paired by problem instance and random seed.
concept_kind: algorithm
identity_notes: BasicILS(N) specializes the ParamILS framework by fixing the comparison sample size N.
  N counts instance/seed evaluations, not necessarily distinct instances. It differs from FocusedILS,
  which grows evaluation prefixes adaptively, and from random search, which does not use ParamILS neighborhood
  perturbation and local search. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 265 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in both worktree and main checkout, returning 20 lines in the worktree and 25 in main.
  These were prior candidate leads, source references, neighboring-method mentions and five unrelated
  ROAR namespace entries in ignored dependencies, not existing records for these identities. Seven exact
  AIO CLASS nodes with synonyms and outgoing edges and six neighboring native mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The 2009 formulation has a finite configuration domain; numerical parameters require discretization.
  Objective, run cutoff and training-instance distribution affect the selected configuration. Independent
  held-out evaluation is needed to assess generalization; no universal solver speedup is asserted.
- The printed first-improvement loop accepts the supplied non-strict comparison. Equal-cost neighboring
  configurations can therefore cycle under a literal reading; this record does not assert unconditional
  termination of that loop or executable equivalence to a software release.
- Adaptive capping is a separable acceleration, not the defining identity of this search/comparison method.
  Section4 describes trajectory-preserving and more aggressive alternatives. Procedure4 prints a max operation
  inconsistent with shortening the run cutoff described in the prose, and uses inconsistent cutoff symbols;
  the printed routine is not treated as verified executable code.
- A small fixed N can give unreliable rankings and overfitting; a large N increases evaluation cost and
  reduces search progress at a fixed time budget. These are experimental-design tradeoffs, not a guarantee
  that one N is optimal.
