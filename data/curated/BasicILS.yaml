claims:
- claim_id: method
  kind: mechanism
  statement: Use ParamILS initialization, randomized one-exchange local search, perturbation, nonworsening
    acceptance and random restart. Implement each comparison by obtaining the chosen cost statistic for
    both configurations on the first N pairs in the shared instance/seed sequence, reusing cached compatible
    target-algorithm runs. The uncapped comparison returns true when the first configuration’s estimate
    is no greater than the second’s. Track the best encountered configuration under that empirical objective.
    The fixed comparison budget is independent of the overall time or iteration budget used to stop the
    configurator.
  evidence:
