claims:
- claim_id: claim-01
  kind: mechanism
  statement: "On an s-sparse signal with corrupted measurements u = Phi x + e, CoSaMP's four stagewise bounds\u2014Identification ||(x - a^{k-1})_{Omega^c}||_2 <= 0.2223 ||x - a^{k-1}||_2 + 2.34 ||e||_2 (Lemma 4.2), Support Merger ||x_{T^c}||_2 <= ||(x - a^{k-1})_{Omega^c}||_2 (Lemma 4.3), Estimation ||x - b||_2 <= 1.112 ||x_{T^c}||_2 + 1.06 ||e||_2 (Lemma 4.4), and Pruning ||x - a^k||_2 <= 2 ||x - b||_2 (Lemma 4.5)\u2014compose under delta_{4s} <= 0.1 to yield the per-iteration error contraction ||x - a^k||_2 <= 0.5 ||x - a^{k-1}||_2 + 7.5 ||e||_2 (Theorem 4.1)."
  evidence:
  - source_id: r315-primary-pdf
    locator: Section 4.1-4.2, Theorem 4.1 and Lemmas 4.2-4.5, pp. 11-16
    relation: supports
  - source_id: r315-metadata-cr
    locator: Bibliographic metadata for Applied and Computational Harmonic Analysis 26(3):301-321
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For general compressible signals x in C^N, Lemma 4.1 absorbs the best-(s/2) tail x - x_{s/2} into effective measurement noise e_tilde = Phi(x - x_{s/2}) + e with ||e_tilde||_2 <= sqrt(1 + delta_s)*(||x - x_{s/2}||_2 + s^{-1/2} ||x - x_{s/2}||_1) + ||e||_2, yielding Theorem 2.1's uniform mixed-(l2, l1) recovery bound ||x - a^k||_2 <= 2^{-k} ||x||_2 + 20*nu; furthermore, replacing exact pseudoinversion by 3 steps of Richardson iteration z^{l+1} = Phi_T^* u - (Phi_T^* Phi_T - I) z^l initialized at a^{k-1}|_T preserves the runtime O(L * log(||x||_2/eta)) where L is the cost of a matrix-vector multiply (Lemma 5.1 and Theorem 5.2).
  evidence:
  - source_id: r315-primary-pdf
    locator: Section 2.3, Theorem 2.1, p. 5; Section 4.1, Lemma 4.1 and Reduction to Sparse Case, pp. 11-13; Section 5.1-5.2, Lemma 5.1 and Theorem 5.2, pp. 16-19
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: CoSaMP requires prior knowledge of the target sparsity level s as an explicit input parameter and relies on the 4s-restricted isometry constant delta_{4s} <= 0.1 (because merging a 2s identification set with an s-sparse iterate forms a 3s-sparse least-squares support whose interaction with an s-sparse residual spans up to 4s columns); if the true non-zero tail energy nu is large, the reconstruction error saturates at an O(nu) noise floor.
  evidence:
  - source_id: r315-primary-pdf
    locator: Section 2.3, Algorithm 2.1 input specification and Theorem 2.1, pp. 4-6; Section 3.2, Proposition 3.5, p. 10
    relation: supports
