claims:
- claim_id: c-r623-sequential-emulation-and-orthogonality-interpolation
  kind: mechanism
  statement: Approximating the second-step gradient g_2(w_0 - alpha g_1) by its first-order Taylor expansion g_2 - alpha H_2 g_1 with Fisher Hessian H_2 approx g_2 g_2^T and optimal quadratic step alpha = 1 / ||g_2||_2^2 yields w_{1,2} = w_0 - alpha (g_1 + (1 - (g_2^T g_1)/||g_2||_2^2) g_2); averaging both minibatch execution orders (b_1, b_2) and (b_2, b_1) produces Adasum(g_1, g_2), which equals g_1 + g_2 when g_1^T g_2 = 0 (orthogonal) and (g_1 + g_2)/2 when g_1 = g_2 (parallel).
  evidence:
  - source_id: r623-primary-pdf
    locator: Section 3.1-3.5, Eq. (1)-(5), p. 3-4; Appendix A.1-A.2, Eq. (6)-(10), p. 14-15
    relation: supports
- claim_id: c-r623-pseudogradient-angle-and-norm-bounds
  kind: mechanism
  statement: For independent gradient samples a, b ~ X with mean r = E[X], E[Adasum(a, b)] = (2I - E[a a^T / ||a||_2^2]) r satisfies ||E[X]||_2 <= ||E[Adasum(a, b)]||_2 <= 2 ||E[X]||_2 (Lemma A.3) and forms an angle eta with E[X] satisfying cos(eta) >= min_gamma (2 - cos^2(gamma)) / sqrt(4 - 3 cos^2(gamma)) = 2 sqrt(2) / 3 approx 0.9428 > 0.942 (eta <= 0.108 pi, Lemma A.2), establishing pseudogradient convergence across binary-tree reductions (Theorem A.4).
  evidence:
  - source_id: r623-primary-pdf
    locator: Appendix A.3 Lemma A.2, Lemma A.3, Theorem A.4, Eq. (11)-(12), p. 15-16
    relation: supports
- claim_id: c-r623-adasumrvh-and-large-batch-scaling
  kind: application
  statement: Implemented via a two-phase recursive vector-halving collective (ADASUMRVH, Algorithm 1) applied per layer to post-optimizer parameter deltas with FP64 dot-product accumulation, AdaSum scales Momentum-SGD on ResNet-50 and Adam on BERT-Large from 16K to 64K effective batch size and LAMB on BERT-Large from 64K to 128K effective batch size while converging in up to 30% fewer steps at 64K.
  evidence:
  - source_id: r623-primary-pdf
    locator: Section 4.1-4.4 Algorithm 1 & Figure 3, p. 5-8; Section 5.1-5.3 Tables 2-4, p. 8-11
    relation: supports
- claim_id: c-r623-non-streaming-dot-product-and-parallel-gradient-limitation
  kind: limitation
  statement: Because Adasum(a, b) requires global inner products a^T b and squared norms ||a||_2^2, ||b||_2^2 across full layer tensors before scaling, it cannot be executed as a single-pass elementwise MPI reduction and requires power-of-two recursive vector-halving with extra subgroup dot-product allreduces; moreover, if all N worker gradients are strictly parallel, its convergence rate reduces to 1/N of sequential SGD.
  evidence:
  - source_id: r623-primary-pdf
    locator: Section 3.4, p. 4; Section 4.2.1 Algorithm 1, p. 6; Appendix A.3-A.4, p. 16
    relation: supports
