id: AIMech:AdaSumAdaptiveSummationForDistributedTraining
name: AdaSum Adaptive Summation for Distributed Training
concept_kind: algorithm
review_status: DRAFT
definition: A hyperparameter-free distributed gradient and model-update reduction operator that replaces naive all-reduce summation across data-parallel workers by recursively combining pairs of layer-wise gradients or optimizer parameter deltas (g_1, g_2) via Adasum(g_1, g_2) = (1 - (g_1^T g_2) / (2 ||g_1||_2^2)) g_1 + (1 - (g_1^T g_2) / (2 ||g_2||_2^2)) g_2, derived by averaging the first-order Taylor sequential SGD emulations of executing minibatch b_1 before b_2 and b_2 before b_1 under a rank-one outer-product Fisher Hessian approximation H_i approx g_i g_i^T and locally optimal step size alpha = 1 / ||g_i||_2^2.
identity_notes: 'Distinct from standard synchronous AllReduce summation/averaging, from delay-compensated asynchronous SGD (DC-ASGD, which uses only diagonal g_i odot g_i and requires a tuned hyperparameter), and from per-layer norm trust-ratio optimizers (LARS, LAMB): AdaSum operates across workers via a two-phase recursive vector-halving collective (ADASUMRVH) after local optimizer steps, reducing to the exact sum g_1 + g_2 when g_1 and g_2 are orthogonal and to the exact average (g_1 + g_2)/2 when g_1 = g_2.'
aliases:
- AdaSum
- Adaptive Summation for Distributed Training
- ADASUMRVH
