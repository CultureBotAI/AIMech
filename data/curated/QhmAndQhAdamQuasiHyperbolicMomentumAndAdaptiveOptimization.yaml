id: AIMech:QhmAndQhAdamQuasiHyperbolicMomentumAndAdaptiveOptimization
name: Quasi-Hyperbolic Momentum (QHM) and Quasi-Hyperbolic Adam (QHAdam) Optimization
concept_kind: algorithm
review_status: DRAFT
definition: 'Quasi-Hyperbolic Momentum (QHM) and Quasi-Hyperbolic Adam (QHAdam) are first-order stochastic optimization algorithms (Ma & Yarats, ICLR 2019) that replace standard exponentially weighted moving average (EWMA) moment estimators with time-inconsistent quasi-hyperbolic weighted moving averages (QHWMA) parameterized by immediate discount factors nu in R (or nu_1, nu_2 in R) and exponential discount factors beta in [0, 1) (or beta_1, beta_2 in [0, 1)). QHM updates a normalized momentum buffer g_{t+1} = beta g_t + (1 - beta) nabla L_hat_t(theta_t) and steps via a nu-weighted average of the momentum step and plain SGD: theta_{t+1} = theta_t - alpha [(1 - nu) nabla L_hat_t(theta_t) + nu g_{t+1}]. QHAdam analogously maintains bias-corrected first and second moment buffers g''_{t+1} = (1 - beta_1^{t+1})^{-1} g_{t+1} and s''_{t+1} = (1 - beta_2^{t+1})^{-1} s_{t+1} and updates parameters via theta_{t+1} = theta_t - alpha [((1 - nu_1) nabla L_hat_t(theta_t) + nu_1 g''_{t+1}) / (sqrt((1 - nu_2)(nabla L_hat_t(theta_t))^2 + nu_2 s''_{t+1}) + epsilon)].'
identity_notes: Distinct from standard Polyak momentum and Nesterov's Accelerated Gradient (NAG), which tightly couple the momentum buffer's exponential discount factor beta to the current gradient's weight (recovered as special cases of QHM at nu = 1 and nu = beta, respectively); distinct from Aggregated Momentum (AggMo, Lucas et al., 2018), which maintains K >= 2 separate momentum buffers rather than a single momentum buffer interpolated with the current gradient; and distinct from vanilla Adam (Kingma & Ba, 2015) and NAdam (Dozat, 2016), which correspond to QHAdam at (nu_1, nu_2) = (1, 1) and (modulo bias correction) (nu_1, nu_2) = (beta_1, 1) without second-moment immediate discounting nu_2 < 1.
