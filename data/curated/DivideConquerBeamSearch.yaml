claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Use breadth-first heuristic search with layered duplicate handling and relay pointers. When
    memory is full, remove open nodes with the worst evaluation values and continue with the surviving
    beam. On reaching a goal, recover its path by recursively searching the start-to-relay and relay-to-goal
    subproblems. Those reconstruction searches can find shorter subpaths, but this does not restore a
    global completeness or optimality guarantee.
  evidence:
  - source_id: method-source
    locator: Divide-and-Conquer Beam Search, PDF p. 6; Figure 3 and path reconstruction, PDF p. 5; experimental
      implementation description, PDF p. 8
    relation: supports
- claim_id: capacity-pruning
  kind: scope
  statement: The later journal account identifies the same approximate procedure as layered BFBnB plus
    deletion of high-f open nodes at the memory limit, and distinguishes it from a subsequent complete
    backtracking extension.
  evidence:
  - source_id: capacity-pruning
    locator: Section 6.2, printed p. 406 / PDF p. 22
    relation: supports
- claim_id: ranking-versus-bound
  kind: limitation
  statement: The planning experiments use the nonadmissible additive heuristic to guide approximate search
    while separately evaluating an admissible max-pair lower bound. A favorable experimental comparison
    does not convert the ranking function into an admissible cost bound.
  evidence:
  - source_id: ranking-versus-bound
    locator: Divide-and-Conquer Beam Search vs. weighted A*, PDF p. 8
    relation: supports
