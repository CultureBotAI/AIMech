name: Divide-and-conquer beam search
definition: A memory-limited breadth-first heuristic search that discards least-promising open nodes when
  its chosen capacity is reached and recovers a solution through relay-based divide-and-conquer reconstruction
  instead of retaining every predecessor layer.
concept_kind: algorithm
identity_notes: Divide-and-conquer beam search is the approximate search procedure introduced by Zhou
  and Hansen in 2004. It differs from divide-and-conquer beam-stack search, which adds systematic backtracking
  and replay under saved beam ranges. Relay reconstruction alone does not revisit every branch discarded
  by beam pruning. No normalized identity match was found across the 442 AIO and 135 prior native records;
  ignored-inclusive text hits in the main checkout were prior discovery leads, source citations, scope
  contrasts and DCBSS substring matches, plus seven public certificate-data substring matches, not existing
  concept records.
limitations:
- Permanent width pruning can discard every solution path; ordinary DCBS is neither complete nor guaranteed
  optimal.
- The reported current, previous, next and relay layers count retained search-node layers, not all temporary
  successors, recursive reconstruction state or output storage.
- The original developed search setting has uniform edge costs. Its planning implementation uses an inadmissible
  additive heuristic for ranking and a separate admissible heuristic for lower bounds; ranking and safe
  cost pruning must not be conflated.
- Larger permitted beams and reconstruction improvements do not establish monotonic quality or a universal
  speed advantage.
