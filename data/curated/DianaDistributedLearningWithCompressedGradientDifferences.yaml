claims:
- claim_id: r389-block-lp-quantization-contraction-and-unbiased-estimator
  kind: mechanism
  statement: Lemmas 4.1, 4.2, and 4.3 prove that the random l_p quantizer Quant_p on a block of size d is unbiased and satisfies E||Quant_p(x) - x||_2^2 <= (1/alpha_p(d) - 1)||x||_2^2 with exact contraction factor alpha_p(d) = inf_{x!=0} ||x||_2^2 / (||x||_1 ||x||_p) given in closed form by alpha_1(d) = 1/d, alpha_2(d) = 1/sqrt(d), and alpha_inf(d) = 2/(1 + sqrt(d)), yielding expected variance E_Q||g_hat^k - g^k||_2^2 <= ((1 - alpha_p) / (n^2 * alpha_p)) sum_{i=1}^n ||g_i^k - h_i^k||_2^2.
  evidence:
  - source_id: r389-primary-pdf
    locator: Section 3 Definition 3.1-3.2 and Section 4 Lemmas 4.1, 4.2, and 4.3, pp. 4-7, 15-17
    relation: supports
- claim_id: r389-lyapunov-linear-convergence-and-shift-learning
  kind: mechanism
  statement: For L-smooth mu-strongly convex functions f_i with proper closed convex regularizer R(x), Theorem 4.4 and Corollary 4.5 prove that the Lyapunov potential V^k = ||x^k - x^*||_2^2 + (c * gamma^2 / n) sum_{i=1}^n ||h_i^k - nabla f_i(x^*)||_2^2 contracts linearly as E[V^k] <= (1 - gamma * mu)^k V^0 + (gamma / mu)(1 + n * c * alpha)(sigma^2 / n), so in the noiseless regime (sigma = 0) both x^k -> x^* and h_i^k -> nabla f_i(x^*) converge geometrically in O(max{1/alpha_p, kappa*(1 + 1/(n * alpha_p))} log(1/eps)) iterations.
  evidence:
  - source_id: r389-primary-pdf
    locator: Section 4 Theorem 4.4, Corollary 4.5, and Table 2, pp. 7-9
    relation: supports
- claim_id: r389-unbiased-compressor-and-stochastic-noise-floor-limitation
  kind: limitation
  statement: Requires an unbiased compression operator (E[Quant_p(Delta)] = Delta) and each worker i to store a d-dimensional shift vector h_i^k; when local gradients have non-zero stochastic variance sigma^2 > 0, constant step size gamma leaves an O(gamma * (1 + 1/alpha_p) * sigma^2 / (mu * n)) neighborhood unless decreasing step sizes (Theorem 4.8) or local variance reduction are used.
  evidence:
  - source_id: r389-primary-pdf
    locator: Section 4 Theorem 4.4 & Section 4.1 Theorem 4.8 (Decreasing stepsizes), pp. 7-9
    relation: supports
- claim_id: r389-composite-l1-logistic-regression-and-resnet-application
  kind: application
  statement: Applied to distributed L1/L2-regularized logistic regression on LIBSVM datasets (mushrooms, a5a, w8a) and distributed momentum training of ResNet-18 on CIFAR-10 and AlexNet on ImageNet with block ternary (p = infinity) and 1-bit L2 (p = 2) gradient difference quantization.
  evidence:
  - source_id: r389-primary-pdf
    locator: Section 6 Experiments, Figures 1-4, pp. 10-12
    relation: supports
