name: Diffusion Maps
definition: A family of spectral embedding algorithms that normalizes a nonnegative symmetric affinity
  kernel into a reversible Markov operator and represents points by its nontrivial eigenfunctions scaled
  by powers of their eigenvalues.
concept_kind: algorithm
identity_notes: This record denotes the Markov-spectral dimensionality-reduction construction. It is not
  a denoising generative diffusion model, Isomap shortest-path embedding, or merely a graph Laplacian
  eigensystem. Kernel choice and diffusion time define the diffusion geometry being represented. All 442
  pinned AIO labels/scoped synonyms and 109 preceding native identities were compared, together with hidden/ignored-inclusive
  searches of both checkouts; source citations and pending frontier mentions were distinguished from existing
  concept identities.
limitations:
- The kernel, its bandwidth, density normalization and diffusion time determine the geometry. Ordinary
  row normalization does not generally remove sampling-density effects.
- Connectivity and aperiodicity support the usual unique-stationary and decaying-mode interpretation;
  disconnected graphs or periodic walks need qualified treatment.
- Coordinate truncation discards spectral contributions. The record does not assert the paper’s relative-error
  shorthand as a universal pairwise bound, or that every diffusion distance separates distinct points
  for a rank-deficient transition matrix.
- Continuum Laplace–Beltrami claims require the stated manifold, sampling and bandwidth limits; they do
  not establish exact finite-data geometry or universal noise robustness.
