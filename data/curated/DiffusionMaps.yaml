claims:
- claim_id: method-scope
  kind: mechanism
  statement: Choose an affinity kernel with positive degrees, normalize its rows to transition probabilities,
    and compute nontrivial eigenpairs of the resulting Markov operator. At diffusion time t, use coordinates
    λ_l^t ψ_l(x). Under the stated reversible-chain spectral assumptions, squared Euclidean distances
    in the full coordinates equal a stationary-distribution-weighted squared difference between t-step
    transition distributions; retaining only leading coordinates gives a truncated approximation. Optional
    density normalization changes the kernel before row normalization.
