  rationale: LoRA+ derives infinite-width learning-rate scaling laws for low-rank fine-tuning of deep neural networks and large language models.
limitations:
- The asymptotic scaling rule eta_B / eta_A = Theta(n) does not determine the exact finite-width constant factor lambda, which depends on the pretrained model architecture, adapter initialization scheme, and downstream task difficulty.
- "On \u201Deasy\u201D downstream tasks that require minimal feature adaptation (such as single-epoch MNLI on LLaMA-7B), setting lambda >> 1 provides negligible gain over standard equal learning rates eta_B = eta_A."
