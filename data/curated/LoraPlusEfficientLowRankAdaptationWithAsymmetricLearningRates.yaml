claims:
- claim_id: r654-claim-inefficiency-of-equal-learning-rates
  kind: mechanism
  statement: In the infinite-width limit n -> infinity with fixed rank r << n, decomposing the step-t LoRA feature update Delta Z_B^t = delta_t^1 + delta_t^2 + delta_t^3 into linear updates delta_t^1 = B_{t-1} Delta Z_A^t and delta_t^2 = Delta B_t Z_A^{t-1} and multiplicative update delta_t^3 = Delta B_t Delta Z_A^t shows (Proposition 1 and Theorem 1) that any single learning rate eta_A = eta_B = Theta(n^c) cannot simultaneously satisfy stability (Z_A, Z_B = O(1)) and efficient feature learning (delta_t^1 = Theta(1) and delta_t^2 = Theta(1)).
  evidence:
  - source_id: r654-primary-pdf
    locator: Section 3.1 (Proposition 1), p. 4; Section 4 (Definitions 3-5 & Theorem 1), p. 6-7; Appendix A.3-A.5, p. 13-16
    relation: supports
- claim_id: r654-claim-optimal-width-scaling-ratio
  kind: mechanism
  statement: "When training LoRA adapters with gradient descent (Proposition 2) or Adam-type normalized gradients where g_A^t Z = Theta(n) (Theorem 1), setting eta_A = Theta(n^{-1}) and eta_B = Theta(1)\u2014so that the learning rate exponent sum satisfies gamma[eta_A] + gamma[eta_B] = -1 and eta_B / eta_A = Theta(n)\u2014uniquely guarantees Z_A^t = O(1), Z_B^t = O(1), and delta_t^i = Theta(1) for all i in {1, 2, 3} and steps t > 1."
  evidence:
  - source_id: r654-primary-pdf
    locator: Section 3.1 (Proposition 2), p. 4; Section 4 (Theorem 1), p. 7; Appendix A.4-A.5, p. 14-16
    relation: supports
- claim_id: r654-claim-llm-finetuning-speedup-and-accuracy
  kind: application
  statement: Setting eta_B = lambda * eta_A with lambda > 1 (empirically lambda = 2^4 = 16 for RoBERTa/GPT-2 on GLUE and lambda in [2^1, 2^2] for LLaMA-7B on Flan-v2/MMLU) delivers 1%-2% test accuracy improvements and up to ~2x fine-tuning convergence speedup over standard LoRA (eta_B = eta_A) at identical per-step computational cost.
  evidence:
  - source_id: r654-primary-pdf
    locator: Section 5.1-5.3, Figures 3-7, p. 7-9
    relation: supports
- claim_id: r654-claim-architecture-and-task-dependent-constant-limitation
  kind: limitation
  statement: Because the asymptotic scaling law eta_B / eta_A = Theta(n) leaves the constant prefactor in Theta(n) unspecified, the optimal finite-width ratio lambda = eta_B / eta_A varies across model architectures, initialization schemes (Init[1] vs. Init[2]), and task difficulty (e.g., lambda approx 2^4 for RoBERTa on MNLI versus lambda approx 2^1-2^2 for LLaMA-7B).
  evidence:
  - source_id: r654-primary-pdf
    locator: Section 5.3 (How to set LoRA+ Ratio?) & Section 6 (Conclusion and Limitations), Figure 6, p. 9
    relation: supports
