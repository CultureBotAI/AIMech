id: AIMech:Mamba
name: Mamba sequence architecture
definition: A neural sequence architecture built from repeated blocks containing input-dependent selective
  state-space transformations.
concept_kind: architecture
identity_notes: The original Mamba architecture, not its trained checkpoints, all state-space models,
  or Mamba-2. Existing AIO recurrent and deep-network categories do not specify selective state-space
  blocks.
