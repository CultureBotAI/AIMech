claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any similarity loss of the separable form L(a,b) = f_1(a) + f_2(b) - h_1(a) h_2(b) and any coupling T in U(p,q), Proposition 1 proves that the four-way tensor contraction L(C, C_bar) (x) T decomposes as c_{C, C_bar}(p, q) - h_1(C) T h_2(C_bar)^T where c_{C, C_bar}(p,q) = f_1(C) p 1_M^T + 1_N q^T f_2(C_bar)^T is independent of T, reducing each gradient evaluation and Sinkhorn linearized cost matrix construction (Proposition 2, Algorithm 1) from O(N^2 M^2) to O(N^2 M + N M^2) operations.
  evidence:
  - source_id: r326-primary-pdf
    locator: Section 2.1, Proposition 1, Proposition 2, Equations 5-9, and Algorithm 1, pp. 3-4
    relation: supports
  - source_id: r326-metadata-cr
    locator: Bibliographic metadata and abstract for ICML 2016 PMLR 48:2664-2672
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For fixed couplings (T_s)_{s=1}^S in U(p, p_s), Propositions 3, 4, and 5 prove that the exact Gromov-Wasserstein barycenter matrix C minimizing sum_{s=1}^S lambda_s E(C, C_s, T_s) is given in closed form by C = (1 / p p^T) odot sum_s lambda_s T_s^T C_s T_s under L_2 loss (which automatically belongs to the positive semidefinite cone S_+^N whenever each C_s in S_+^{N_s}) and by C = exp((1 / p p^T) odot sum_s lambda_s T_s^T log(C_s) T_s) under Kullback-Leibler loss (which preserves conditionally positive semidefinite logarithms and infinitely divisible kernels).
  evidence:
  - source_id: r326-primary-pdf
    locator: Section 2.2, Propositions 3, 4, and 5, Equations 13-15, and Algorithm 2, pp. 4-5
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: The Gromov-Wasserstein objective E(C, C_bar, T) is a non-convex quadratic form in the coupling T (a continuous relaxation of the NP-hard quadratic assignment problem), so the entropic Sinkhorn iteration (Algorithm 1) and block-coordinate barycenter alternation (Algorithm 2) are only guaranteed to converge to stationary points rather than global minima, and the O(N^3) matrix multiplication cost per iteration remains a bottleneck for very large graphs or meshes.
  evidence:
  - source_id: r326-primary-pdf
    locator: Section 2.1, Non-convexity discussion and Remark 1, pp. 3-4; Conclusion, p. 8
    relation: supports
