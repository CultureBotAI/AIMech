name: Unsupervised Data Augmentation
definition: A semi-supervised classifier-training procedure that combines labeled prediction loss with
  consistency between fixed current-model predictions on original or weakly augmented unlabeled inputs
  and predictions on strongly augmented versions.
concept_kind: algorithm
identity_notes: The named UDA method is a training procedure, not just a data transform or a label-free
  learning paradigm. It uses soft current-model targets and strong augmentation, unlike FixMatch’s confidence-masked
  hard targets or an EMA-target Mean Teacher. Its source-specific RandAugment variant is not byte-for-byte
  or mathematically identical to the original shared-M procedure. The acronym here means Unsupervised
  Data Augmentation, not an assertion about every use of UDA in the literature. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 243 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 102 lines in the worktree and 103 in main from prior discovery, saved reviews and related
  native records. Twelve exact AIO CLASS nodes, their scoped synonyms and outgoing edges, plus eight neighboring
  native mechanisms were inspected. This absence assessment is bounded to the pinned snapshot and inspected
  semantic neighborhood.
limitations:
- The method still uses labeled supervision despite its name. Consistency can propagate incorrect model
  predictions, and confidence is not proof of correctness.
- Augmentations require task-appropriate label preservation; the paper’s theoretical analysis assumes
  in-domain, label-preserving and reversible transformations rather than proving these properties for
  arbitrary augmentations.
- Confidence thresholds, temperatures, loss weights, augmentation settings and domain filters are protocol
  choices. No universal values or benchmark gains are asserted.
- The paper cross-entropy and implemented KL values must not be compared as identical losses; gradient
  equivalence requires treating targets and masks as fixed.
- TSA uses a different mask and normalization on labeled examples; it is represented separately. No author
  code or training benchmark was executed.
