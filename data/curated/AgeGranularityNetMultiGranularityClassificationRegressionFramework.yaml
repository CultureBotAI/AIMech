  locator: Crossref DOI bibliographic metadata
  relation: supports
claims:
- claim_id: hierarchical-multi-granularity-cross-entropy-and-mse-aggregation
  kind: mechanism
  statement: Age-Granularity-Net jointly optimizes a shared backbone under the sum of N-1 cross-entropy losses over progressively coarser target quantizations (1-year, 5-year, 10-year, and 20-year bins) and a lambda-weighted continuous mean-squared-error regression loss, rewarding near-miss predictions that fall within the same coarser interval.
  evidence:
  - source_id: r829-primary-pdf
    locator: Section 3.1-3.2, Figures 1-2 and Equations 1-2, pp. 2-3, 5
    relation: supports
- claim_id: single-branch-inference-without-computational-overhead
  kind: mechanism
  statement: During inference, Age-Granularity-Net evaluates only the finest-granularity 100-class branch and discards the coarser classification and MSE regression branches, achieving multi-loss representation regularization with zero additional inference latency or parameters.
  evidence:
  - source_id: r829-primary-pdf
    locator: Section 4.3, p. 3; Section 6, p. 4
    relation: supports
- claim_id: apparent-facial-age-estimation-under-label-ambiguity-application
  kind: application
  statement: Applied to apparent facial age estimation on the CVPR ChaLearn Looking at People dataset across AlexNet, MobileNet-V1, ResNet-50, DenseNet-121, and VGG-16-BN backbones, Age-Granularity-Net reduces test mean absolute error by 17% to 49% relative to single-loss 100-class training.
  evidence:
  - source_id: r829-primary-pdf
    locator: Section 4.1-5, Table 1, pp. 3-4
    relation: supports
- claim_id: mse-loss-scale-sensitivity-and-learning-rate-instability-limitation
  kind: limitation
  statement: Combining unnormalized continuous MSE loss with multi-class cross-entropy losses introduces gradient magnitude disparities that require tuning the balancing weight lambda or lowering the initial learning rate by two orders of magnitude (from 10^-3 to 10^-5 on AlexNet) to prevent training divergence.
  evidence:
  - source_id: r829-primary-pdf
    locator: Section 3.2, p. 3; Section 5, Table 1 footnote 1, p. 4
    relation: supports
