id: AIMech:AgeGranularityNetMultiGranularityClassificationRegressionFramework
name: Age-Granularity-Net Multi-Granularity Classification-Regression Framework
concept_kind: architecture
review_status: DRAFT
definition: A multi-head neural network training architecture for continuous/ordinal visual estimation that attaches multiple parallel classification branches quantized at progressively coarser label granularities alongside a continuous mean-squared-error regression branch to a shared feature backbone during training, and prunes all auxiliary coarse and regression heads at inference time to predict from the finest-granularity branch alone.
identity_notes: No AIO class represents Age-Granularity-Net or multi-granularity classification-regression auxiliary branch training; ArtificialNeuralNetwork (AIO:ArtificialNeuralNetwork) is the closest broad match covering neural network architectures.
aliases:
- Age-Granularity-Net
- Multi-Granularity Classification-Regression Network
- Age-Granularity-Net Multi-Task Age Estimator
