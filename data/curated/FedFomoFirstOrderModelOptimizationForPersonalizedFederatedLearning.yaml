claims:
- claim_id: r464-first-order-validation-slope-and-relu-simplex-weights-mechanism
  kind: mechanism
  statement: Approximates the gradient of client c_i's validation loss L_i with respect to model combination weight w_n along phi_n(w_n) = w_n theta_n^{l(t)} + (1 - w_n) theta_i^{l(t-1)} via the finite-difference secant slope w_n = (L_i(theta_i^{l(t-1)}) - L_i(theta_n^{l(t)})) / ||theta_n^{l(t)} - theta_i^{l(t-1)}|| (Equations 3, 10-12) and normalizes positive weights w_n^* = max(w_n, 0) / sum_{m=1}^N max(w_m, 0) (Equation 13), defaulting to theta_i^{l(t-1)} whenever all candidate models increase validation loss.
  evidence:
  - source_id: r464-primary-pdf
    locator: Section 3.1 Equations 3-4, p. 4, and Appendix A.1 Equations 5-13, pp. 12-13
    relation: supports
- claim_id: r464-affinity-matrix-epsilon-greedy-and-loo-privacy-scope
  kind: scope
  statement: Maintains a server-side K x K client affinity matrix P updated by signed validation improvements p_{i,n} <- p_{i,n} + w_n to sample M high-affinity peer models per round via epsilon-greedy exploration (Section 3.1, p. 5), and extends to a privacy-preserving leave-one-out average variant w_n propto L_i((1/(N-1)) sum_{j != n} theta_j) - L_i((1/N) sum_j theta_j) so clients only receive aggregated models (Appendix A.4, Equation 14, p. 13).
  evidence:
  - source_id: r464-primary-pdf
    locator: Section 3.1 Sampling Relevant Models, p. 5, and Appendix A.4 Preserving Client Privacy with FOMO (Equation 14), p. 13
    relation: supports
- claim_id: r464-downlink-bandwidth-and-validation-split-limitation
  kind: limitation
  statement: Requires each active client to download M peer models per communication round (increasing server-to-client downlink bandwidth by a factor of M) and perform M forward passes on a held-out local validation split D_i^{val}, which can be noisy when local datasets are very small.
  evidence:
  - source_id: r464-primary-pdf
    locator: Section 3.1 Local Validation Split & Sampling Relevant Models, pp. 4-5, and Appendix B.1 Effect of Validation Split Size, p. 14
    relation: supports
- claim_id: r464-personalized-non-iid-and-out-of-client-distribution-application
  kind: application
  statement: Applied to personalized non-IID image classification on MNIST, CIFAR-10, and CIFAR-100 across 15 to 100 clients, as well as out-of-client target validation distributions where a client's target task differs from its local training split.
  evidence:
  - source_id: r464-primary-pdf
    locator: Section 4 Experiments (Tables 1-2, Figures 2-4), pp. 5-8
    relation: supports
