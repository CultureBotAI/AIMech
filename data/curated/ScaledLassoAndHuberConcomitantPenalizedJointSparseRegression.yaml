claims:
- claim_id: huber-concomitant-joint-convexity-and-alternating-profile-equilibrium
  kind: mechanism
  statement: For the $\ell_1$ penalty $\rho(\beta) = |\beta|_1$ and any $a \in [0, 1)$, the concomitant objective $L_{\lambda_0}(\beta, \sigma) = \frac{|y - X\beta|_2^2}{2n\sigma} + \frac{(1-a)\sigma}{2} + \lambda_0|\beta|_1$ is jointly convex in $(\beta, \sigma)$ on $\mathbb{R}^p \times (0, \infty)$, the profile objective $L_{\lambda_0}(\widehat{\beta}(\sigma), \sigma)$ along the standard LASSO solution path $\widehat{\beta}(\sigma) = \arg\min_\beta L_{\lambda_0}(\beta, \sigma)$ is strictly convex in $\sigma > 0$ with envelope derivative $\frac{\partial}{\partial\sigma} L_{\lambda_0}(\widehat{\beta}(\sigma), \sigma) = \frac{1-a}{2} - \frac{|y - X\widehat{\beta}(\sigma)|_2^2}{2n\sigma^2}$ (Eq. 6; Proof of Proposition 1, Eqs. A1-A5, pp. 14-15), and the alternating fixed-point equilibrium $(\widehat{\beta}, \widehat{\sigma})$ of Eqs. (3)-(4) satisfies the joint KKT conditions $\widehat{\sigma}^2 = |y - X\widehat{\beta}|_2^2 / \{n(1-a)\}$, $x_j'(y - X\widehat{\beta}) / (n\widehat{\sigma}) = \lambda_0 \operatorname{sign}(\widehat{\beta}_j)$ for $\widehat{\beta}_j \ne 0$, and $|x_j'(y - X\widehat{\beta})| / (n\widehat{\sigma}) \le \lambda_0$ for $\widehat{\beta}_j = 0$ (Proposition 1, Eqs. 7-8, p. 4).
