- claim_id: cone-invertibility-factor-oracle-bounds-and-post-selection-lse-recovery
  kind: mechanism
  statement: 'Under the sign-restricted cone invertibility factor $F_q(\xi, S) = \inf\{|S|^{1/q}|X''u|_\infty / (n|u|_q) : u \in \mathscr{C}_-(\xi, S)\}$ on $\mathscr{C}_-(\xi, S) = \{u : |u_{S^c}|_1 \le \xi|u_S|_1 \ne 0,\, u_j x_j''X u \le 0\; \forall j \notin S\}$ (Eqs. 10-12, p. 5), Scaled LASSO achieves simultaneous scale-free $\ell_q$ parameter estimation $|\widehat{\beta} - \beta|_q \le (1 + \tau_+)\sigma\{2(\xi+1)|S|^{1/q}\lambda_0 / (\xi F_q(\xi, S))\} = O_P(\sigma|S|^{1/q}\{(\log p)/n\}^{1/2})$ for all $q \in [1, \infty]$ (Theorem 1, Eq. 18; Corollary 1, Eqs. 20-21, pp. 6-7). Furthermore, under the sparse upper eigenvalue $\kappa_+(m, T) = \max_{B \cap T = \emptyset,\, |B| \le m} \lambda_{\max}(X_B''X_B/n)$ with $m > \{2(\xi+1)/(\xi- 1)\}^2 \kappa_+(m, T)|T|/\gamma(\xi, T)$, Scaled LASSO bounds the number of false positives by $|\widehat{S} \setminus S| < m$ (Lemma 2, p. 9), and the refitted Least-Squares Estimator after Model Selection (LSE, $\widetilde{\beta}$, $\widetilde{\sigma}$ on $\widehat{S}$, Eq. 24) satisfies $\max(1 - \widetilde{\sigma}/\sigma^*, 1 - \sigma^*/\widetilde{\sigma}) \le \widetilde{\tau}_* = O_P(|S|(\log p)/n)$ and $|X(\widetilde{\beta} - \beta^*)|_2^2 / n \le 2(\sigma^*)^2 \widetilde{\tau}_* = O_P(\sigma^2 |S|(\log p)/n)$ (Theorem 3, Eqs. 26-27, pp. 9-10).'
