- claim_id: kkt-residual-sandwich-student-t-tail-bound-and-asymptotic-normality-of-noise-scale
  kind: mechanism
  statement: Let $\sigma^* = |y - X\beta^*|_2 / n^{1/2}$ be the oracle noise level for a target vector $\beta^*$ with support $T$. The joint KKT conditions yield the two-sided residual-square sandwich $|y - X\beta^*|_2^2 - n\lambda_0\widehat{\sigma}|\beta^*|_1 \le n(1-a)\widehat{\sigma}^2 \le |y - X\beta^*|_2^2 + n\lambda_0\widehat{\sigma}|\beta^*|_1$ (Appendix, Eq. A6, p. 15). On the scale-free score event $|X'(y - X\beta^*)|_\infty / (n\sigma^*) \le (1-a)^{1/2}\lambda_0 (\xi-1)/(\xi+1)$ ($\xi > 1$), which holds with probability at least $1 - \epsilon$ under $y - X\beta^* \sim N(0, \sigma^2 I_n)$ when $\lambda_0 \ge \frac{\xi+1}{\xi-1}\{(1-a)(1 + 2a_0/n)\}^{-1/2}\{(2/n)\log(p/\epsilon)\}^{1/2}$ via the exact Student-$t$ projection identity $z_j / (|y - X\beta^*|_2/n^{1/2}) = t_j / \{(n - 1 + t_j^2)/n\}^{1/2}$ with $t_j \sim t_{n-1}$ (Lemma 1, Eq. 19, p. 7), Theorem 1 (Eqs. 16-18) and Theorem 2 (Eqs. 22-23, p. 8) prove that with $a = 0$, $\max(1 - \widehat{\sigma}/\sigma^*, 1 - \sigma^*/\widehat{\sigma}) \le \tau_*^2$ where $\tau_*^2 \asymp |T|\lambda_0^2 / \gamma_T = O(|T|(\log p)/n)$, and therefore $n^{1/2}(\widehat{\sigma}/\sigma - 1) = n^{1/2}(\sigma^*/\sigma - 1) + o_P(1) \xrightarrow{d} N(0, 1/2)$ whenever $|\beta|_0(\log p)/n^{1/2} \to 0$ (Theorem 2, Eq. 23; Corollary 2, p. 8).
