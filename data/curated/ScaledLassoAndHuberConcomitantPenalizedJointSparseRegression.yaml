    locator: Section 3.1, pp. 5-7, Equations (10)-(18), Theorem 1; Section 3.2, p. 7, Equations (20)-(21), Corollary 1; Section 3.3, pp. 8-10, Equations (24)-(27), Lemma 2, Theorem 3; Appendix, pp. 18-19, Proofs of Lemma 2 and Theorem 3
