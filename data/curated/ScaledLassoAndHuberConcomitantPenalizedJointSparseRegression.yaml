id: AIMech:ScaledLassoAndHuberConcomitantPenalizedJointSparseRegression
name: Scaled LASSO and Huber Concomitant Penalized Joint Sparse Regression
review_status: DRAFT
concept_kind: algorithm
aliases:
- Scaled Lasso
- Scaled Sparse Linear Regression
- Huber Concomitant Scale-Regression Joint L1 Penalized Estimator
- Alternating Residual-Scale Equilibrium LASSO
definition: Scaled LASSO and Huber Concomitant Penalized Joint Sparse Regression is a high-dimensional sparse linear regression and noise-level estimation framework introduced by Sun and Zhang (2012, Biometrika 99(4):879-898, DOI:10.1093/biomet/ass043, arXiv:1104.4595v2) that simultaneously estimates the regression vector $\beta \in \mathbb{R}^p$ and noise standard deviation $\sigma > 0$ via the alternating equilibrium mapping $\widehat{\sigma} = \{|y - X\widehat{\beta}|_2^2 / n(1-a)\}^{1/2}$, $\lambda = \widehat{\sigma}\lambda_0$, and $\widehat{\beta} = \arg\min_\beta \{\frac{1}{2n}|y - X\beta|_2^2 + \lambda\rho(\beta)\}$ ($a \ge 0$, Eqs. 3-4). For $\rho(\beta) = |\beta|_1$, this equilibrium is the global minimizer of the jointly convex Huber (1981) concomitant penalized loss $L_{\lambda_0}(\beta, \sigma) = \frac{|y - X\beta|_2^2}{2n\sigma} + \frac{(1-a)\sigma}{2} + \lambda_0|\beta|_1$ (Proposition 1, Eqs. 5-8), whose profile objective satisfies $\frac{\partial}{\partial\sigma} L_{\lambda_0}(\widehat{\beta}(\sigma), \sigma) = \frac{1-a}{2} - \frac{|y - X\widehat{\beta}(\sigma)|_2^2}{2n\sigma^2}$. With the scale-free universal penalty $\lambda_0 = A\{(2/n)\log(p/\epsilon)\}^{1/2}$ ($A > \{(1-a)/(1-\tau_*)\}^{1/2}$), Scaled LASSO achieves near-oracle prediction, $\ell_q$ parameter estimation (Theorem 1, Corollary 1), quadratic relative noise-level error $\max(1 - \widehat{\sigma}/\sigma^*, 1 - \sigma^*/\widehat{\sigma}) \le \tau_*^2 \lesssim |\beta^*|_0(\log p)/n$, and asymptotic normality $n^{1/2}(\widehat{\sigma}/\sigma - 1) \xrightarrow{d} N(0, 1/2)$ when $|\beta^*|_0(\log p)/n^{1/2} \to 0$ (Theorem 2, Corollary 2), while extending to concave penalties (MCP/SCAD) and Least-Squares after Model Selection (LSE, Theorem 3).
identity_notes: "Distinct from Square-Root LASSO (`AIMech:SquareRootLassoPivotalConicSparseRegression`), which minimizes the non-separable root-MSE criterion $\\{\\widehat{Q}(\\beta)\\}^{1/2} + (\\lambda/n)\\|\\beta\\|_1$ via second-order cone programming without an explicit concomitant scale variable $\\sigma$ or degrees-of-freedom adjustment $1-a$ (note that profiling $\\sigma = |y - X\\beta|_2 / \\{n(1-a)\\}^{1/2}$ out of $L_{\\lambda_0}(\\beta, \\sigma)$ yields $(1-a)^{1/2}\\{|y - X\\beta|_2 / n^{1/2}\\} + \\lambda_0|\\beta|_1$). Also distinct from standard LASSO (`AIO:LassoRegression`), whose penalty $\\lambda$ depends on unknown $\\sigma$, and from St\xE4dler-B\xFChlmann-van de Geer (2010) penalized Gaussian negative log-likelihood $\\min_{\\beta,\\sigma} \\{\\log\\sigma + |y - X\\beta|_2^2/(2n\\sigma^2) + \\lambda_0|\\beta|_1/\\sigma\\}$, whose KKT identity $n^{-1}|y - X\\widehat{\\beta}_{\\text{pmle}}|_2^2 + \\lambda_0\\widehat{\\sigma}_{\\text{pmle}}|\\widehat{\\beta}_{\\text{pmle}}|_1 = \\widehat{\\sigma}_{\\text{pmle}}^2$ (Eq. 9) introduces a linear first-order shrinkage bias in $\\widehat{\\sigma}_{\\text{pmle}}$ when $\\lambda_0|\\beta|_1 = \\Omega(n^{-1/2})$ (Section 2.2, p. 4), whereas Scaled LASSO's KKT residual-square sandwich $|y - X\\beta^*|_2^2 - n\\lambda_0\\widehat{\\sigma}|\\beta^*|_1 \\le n(1-a)\\widehat{\\sigma}^2 \\le |y - X\\beta^*|_2^2 + n\\lambda_0\\widehat{\\sigma}|\\beta^*|_1$ (Eq. A6) cancels the first-order bias via the inner product $2\\langle y - X\\beta^*, X(\\widehat{\\beta} - \\beta^*)\\rangle$ and achieves quadratic concentration $\\tau_*^2 = O_P(|\\beta^*|_0(\\log p)/n)$."
