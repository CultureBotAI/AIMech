id: AIMech:DiaconisHolmesNealFiberSampler
name: Diaconis–Holmes–Neal fiber sampler
concept_kind: algorithm
definition: A finite-state Metropolis sampler that uses partitions into ordered lines, retains a binary
  direction for each partition, and combines a neighbor proposal with a separate probabilistic sign update
  to preserve a target distribution on the augmented state.
definition_evidence:
- source_id: dhn1997
  locator: Section 5.2, printed pp. 16–17 / PDF pp. 17–18, fiber construction and Proposition 2; one-line
    case in Section 5.1, printed p. 15 / PDF p. 16
  relation: supports
claims:
- claim_id: ordered-partitions-and-augmented-target
  kind: mechanism
  statement: 'Let pi be a strictly positive probability mass function on a finite state space X. For each
    of d directions, partition X into linearly ordered lines. Require connectivity through the union of
    these lines: any two states can be joined by successive within-line moves. Retain z in {−1,+1}^d and
    use augmented target pi(x)/2^d. Fix positive direction-selection probabilities w_i summing to one
    and parameters theta_i satisfying 0<theta_i<1.'
  evidence:
  - source_id: dhn1997
    locator: Section 5.2, printed p. 16 / PDF p. 17, partitions, connectedness and augmented state
    relation: supports
- claim_id: directed-neighbor-metropolis-stage
  kind: mechanism
  statement: Choose direction i using w_i and find its line containing x. Propose the successor of x on
    that line when z_i=+1 or the predecessor when z_i=−1, together with negation of the proposed z_i.
    Accept with min(1,pi(x*)/pi(x)); otherwise leave the state unchanged for this stage. A proposed step
    beyond a line endpoint is rejected. Other direction signs remain unchanged. This uses neighboring
    elements of the ordering, not an independent draw from the full line conditional.
  evidence:
  - source_id: dhn1997
    locator: Section 5.2, printed p. 16 / PDF p. 17, Steps 1–2; endpoint rule in Section 5.1, printed
      p. 15 / PDF p. 16, Step 1; application to each line in Proposition 2 proof, printed p. 17 / PDF
      p. 18
    relation: supports
- claim_id: post-metropolis-sign-update
  kind: mechanism
  statement: After the Metropolis stage, negate the resulting sign z_i with probability 1−theta_i and
    keep it with probability theta_i, without changing x or other signs. Thus an accepted move preserves
    its incoming direction with probability 1−theta_i and reverses it with probability theta_i; a rejected
    move reverses the incoming direction with probability 1−theta_i and retains it with probability theta_i.
    This second sign operation follows both acceptance and rejection.
  evidence:
  - source_id: dhn1997
    locator: Section 5.2, printed p. 16 / PDF p. 17, Step 3; combined-effect explanation in Section 5.1,
      printed p. 15 / PDF p. 16
    relation: supports
- claim_id: finite-state-invariance-and-ergodicity
  kind: scope
  statement: The Metropolis stage preserves the augmented target and the sign-update stage preserves its
    uniform sign factors. Each direction kernel is therefore invariant, and so is their fixed mixture.
    Proposition 2 establishes irreducibility and aperiodicity for the stated finite positive-target construction
    with connected ordered-line partitions, positive direction probabilities and 0<theta_i<1. Endpoint
    holding probabilities enter the aperiodicity argument. These are assumption-bound finite-state results,
    not an ergodicity theorem for arbitrary continuous extensions or parameter endpoints.
  evidence:
  - source_id: dhn1997
    locator: Section 5.1, printed p. 15 / PDF p. 16, Proposition 1; Section 5.2, printed pp. 16–17 / PDF
      pp. 17–18, Proposition 2 and proof
    relation: supports
- claim_id: one-line-directed-specialization
  kind: scope
  statement: 'With d=1 and one ordered line X={1,...,n}, the fiber construction is the directed sampler
    of Section 5.1: propose x+z with sign negation, reject an out-of-range move, and apply the same second
    sign operation. This record includes that one-line specialization. The authors discuss continuous
    counterparts and Gustafson’s guided walk separately; the finite construction does not define all persistent-direction
    or lifted MCMC algorithms.'
  evidence:
  - source_id: dhn1997
    locator: Section 5.1, printed pp. 15–16 / PDF pp. 16–17; Section 5.2, printed pp. 16–17 / PDF pp.
      17–18
    relation: supports
- claim_id: line-selection-and-exploration-limits
  kind: limitation
  statement: Useful ordered lines must be available, although the implementation need only find a current
    point’s successor or predecessor rather than explicitly enumerate each line. Lines aligned poorly
    with the target can retain diffusive behavior, and local moves can still encounter probability barriers.
    The construction does not provide a general advantage over direct conditional or other proposal methods
    merely by retaining direction.
  evidence:
  - source_id: dhn1997
    locator: Section 5.2, printed p. 17 / PDF p. 18, line-construction discussion; Section 7, printed
      pp. 23–24 / PDF pp. 24–25, discussion
    relation: supports
identity_notes: Whole-corpus normalized checks cover every ID, name, alias and scoped synonym in 442 pinned
  AIO and 703 native records; four full checkouts include ignored and hidden files. Finite ordered fibers,
  one retained sign per partition, fixed partition selection and the post-MH sign operation define this
  identity. The one-line directed sampler is explicitly covered as d=1 specialization, with no separate
  record or narrower-name exact alias. Shared MH or lifting does not make this equivalent to random walk
  MH, Neal pair-state or acceptance-uniform updates, HMC or continuous Gustafson half-normal displacement.
  Existing source-frontier reference is resolved in place. Related AIO:MarkovChain does not assert model
  identity or layer inheritance; 18 complete candidate class contexts and 19 native neighbors were assessed.
