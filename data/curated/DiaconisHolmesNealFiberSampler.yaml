    association without equivalence, subclass status or inheritance of Network and ProbabilisticHiddenLayer
    assertions.
limitations:
- The maintained identity is the finite ordered-fiber construction, including its one-line directed case.
  It does not denote every nonreversible sampler, graph non-backtracking walk, momentum method or continuous
  guided-walk extension.
- Strict positivity, line connectivity, positive fixed direction weights and 0<theta_i<1 belong to the
  stated finite ergodicity result. Setting theta_i to zero or one requires separate analysis; stationarity
  alone does not certify convergence.
- The stored sign for each partition is part of the state. Resetting signs at every transition, omitting
  the second sign operation or applying it only after rejection changes the specified kernel.
- The primary evidence is the author-hosted 5 June 1997 Technical Report BU-1385-M. The later 2000 journal
  article was not obtained, and exact equivalence of versions is not asserted.
- The record makes no numerical mixing-rate, variance-reduction or runtime claim. The source’s specially
  tuned uniform walk and illustrative target experiments do not establish such a guarantee for every fiber
  construction.
