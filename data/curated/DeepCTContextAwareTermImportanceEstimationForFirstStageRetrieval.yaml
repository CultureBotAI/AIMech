claims:
- claim_id: deepct-per-token-mse-regression-and-qtr-targets
  kind: mechanism
  statement: DeepCT applies a linear regression head y^_{t, c} = w^T T_{t, c} + b to the contextualized BERT embedding of each word's first subword (masking subsequent subwords) and minimizes loss_MSE = sum_c sum_t (y_{t, c} - y^_{t, c})^2 (Equations 1-2) against Query Term Recall QTR(t, d) = |Q_{d, t}| / |Q_d| for passages (Equation 3) or Term Recall TR(t, q) = |D_{q, t}| / |D_q| for queries (Equation 5).
  evidence:
  - source_id: r768-primary-pdf
    locator: Sections 3.1-3.3, Equations 1-3 & 5, pp. 3-4
    relation: supports
  - source_id: r768-primary-pdf
    locator: main() verification of compute_qtr and compute_tr in [0, 1]
    relation: supports
- claim_id: deepct-inverted-index-integer-scaling-and-central-term-skew
  kind: mechanism
  statement: During offline indexing, DeepCT-Index runs query-independent inference on each passage d, scales predicted weights into non-negative integers TF_DeepCT(t, d) = round(y^_{t, d} * N) with N = 100 (Equation 4), and replaces raw TF(t, d) in the inverted index `[docid(d), TF_DeepCT(t, d)]` without adding new posting lists or online query latency, skewing flat passage term distributions toward central topical terms while suppressing frequent off-topic terms (Table 5, Figure 1).
  evidence:
  - source_id: r768-primary-pdf
    locator: Section 3.2 & Section 5.2, Equation 4, Table 5, Figure 1, pp. 3-4, 6-7
    relation: supports
  - source_id: r768-primary-pdf
    locator: main() verification of tf_deepct scaling and BM25 disambiguation of equal-TF on-topic vs off-topic passages
    relation: supports
- claim_id: deepct-first-stage-retrieval-and-reranking-applications
  kind: application
  statement: DeepCT-Index improves first-stage BM25 MRR@10 by 27% on MS MARCO (0.191 to 0.243) and 46% on TREC-CAR (0.233 to 0.332), reduces the candidate depth required by a BERT Re-Ranker by 5x to 10x for equivalent MRR@10 (Tables 2-4), and DeepCT-Query significantly improves description and narrative queries on Robust04 and Gov2 over BOW-tf and DeepTR (Table 6).
  evidence:
  - source_id: r768-primary-pdf
    locator: Section 5.1 & Section 6, Tables 2-4 & 6, pp. 5-8
    relation: supports
  - source_id: r768-metadata-cr
    locator: BibTeX citation record for arXiv:1910.10687
    relation: supports
- claim_id: deepct-noncentral-answer-suppression-and-no-expansion-limitation
  kind: limitation
  statement: Because DeepCT-Index only re-weights existing tokens in passage d without vocabulary expansion and strongly suppresses non-central terms, it cannot resolve vocabulary mismatch when query terms do not appear in d, can down-weight or zero out peripheral passage sentences that contain the answer to a detail query (Section 5.2), and DeepCT-Query provides little benefit on short keyword title queries lacking linguistic context (Section 6).
  evidence:
  - source_id: r768-primary-pdf
    locator: Section 5.1, Section 5.2 & Section 6 Results, pp. 5, 7-8
    relation: supports
