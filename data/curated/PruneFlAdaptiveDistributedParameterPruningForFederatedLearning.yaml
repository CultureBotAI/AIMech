claims:
- claim_id: prunefl-greedy-risk-reduction-per-time-reconfiguration-optimality-mechanism
  kind: mechanism
  statement: "Given non-prunable parameter set A and prunable candidate set P with squared gradient components g_j^2 and per-round execution time costs t_j > 0, Theorem 1 (p. 5; proof via Lemmas 1-2 in Appendix B-1, pp. 14-15) proves that Algorithm 2\u2014which sorts j in P in non-increasing order of g_j^2 / t_j and greedily adds j to P_bar while g_j^2 / t_j >= Gamma(A union P_bar)\u2014finds a global maximizer of Gamma(A union P_bar) = (Delta(A) + sum_{j in P_bar} g_j^2) / (c + T_A + sum_{j in P_bar} t_j) in O(|P| log |P|) time."
  evidence:
  - source_id: r508-primary-pdf
    locator: Section IV-A to IV-C, Eqs. (6)-(7), Algorithm 2, Theorem 1, pp. 4-5; Appendix B-1, Lemmas 1-2, pp. 14-15
    relation: supports
- claim_id: prunefl-masked-gradient-stationary-point-convergence-rate-scope
  kind: scope
  statement: Under Assumptions 1-4 (L-smoothness, bounded mini-batch variance sigma^2, bounded full-gradient second moment G^2, and non-expansiveness ||w - w odot m||^2 <= ||w - w*||^2 of mask projection), Theorem 2 (p. 6; proof in Appendix B-2, pp. 15-19) proves that PruneFL with step size eta = sqrt(N / K) achieves (1 / K) sum_{k=0}^{K-1} E[||nabla F(w'(k)) odot m_{w'}(k)||^2] <= 2(E[F(w'(0))] - F*) / sqrt(N K) + (4 tau^2 L^2 G^2 / K) + (2 L sigma^2 / sqrt(N K)) = O(1 / sqrt(N K)) + O(1 / K).
  evidence:
  - source_id: r508-primary-pdf
    locator: Section IV-D Convergence Analysis, Assumptions 1-4, Theorem 2, p. 6; Appendix B-2, Lemma 3 and Proof of Theorem 2, pp. 15-19
    relation: supports
- claim_id: prunefl-profiling-calibration-and-dense-gradient-accumulation-limitation
  kind: limitation
  statement: PruneFL requires offline device profiling to estimate per-parameter round-time coefficients t_j and overhead constant c via linear regression, relies on a trusted client's local dataset for Stage-1 initial pruning, and requires clients to accumulate exponential moving averages of full-dimensional squared gradients g_j^2 across reconfiguration intervals (Section III-A to III-B, pp. 3-4; Section V-A, pp. 6-7).
  evidence:
  - source_id: r508-primary-pdf
    locator: Section III-A Initial Pruning at a Selected Client, Section III-B, pp. 3-4; Section V-A Time Profiling, Fig. 4, pp. 6-7; Appendix A, pp. 12-13
    relation: supports
- claim_id: prunefl-raspberry-pi-edge-federated-training-application
  kind: application
  statement: Applied to edge-device federated training on Raspberry Pi 4 and Android devices across FEMNIST, CIFAR-10, ImageNet-100, and CelebA using Conv-2, VGG-11, ResNet-18, and MobileNetV2.
  evidence:
  - source_id: r508-primary-pdf
    locator: Section V Experimental Results, Figs. 4-11, Tables I-II, pp. 6-11
    relation: supports
