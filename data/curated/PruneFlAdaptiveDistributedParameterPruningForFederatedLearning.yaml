id: AIMech:PruneFlAdaptiveDistributedParameterPruningForFederatedLearning
name: 'PruneFL: Adaptive and Distributed Parameter Pruning for Federated Learning'
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive distributed parameter pruning and reconfiguration framework for federated learning (PruneFL; Jiang, Wang, Valls, Ko, Lee, Leung, and Tassiulas, IEEE TNNLS 2023) that executes initial iterative pruning on a single selected client prior to federated training and subsequently reconfigures (prunes and regrows) the shared sparse parameter set M = A union P_bar every R_r rounds during multi-client federated training (Algorithm 1). At each reconfiguration step, PruneFL models the single-step empirical risk reduction as Delta(M) approx sum_{j in M} g_j^2 (Eq. 6) and the single-round execution time as T(M) = c + sum_{j in M} t_j, and maximizes the risk-reduction rate Gamma(A union P_bar) = Delta(A union P_bar) / T(A union P_bar) (Eq. 7) over prunable indices P via a greedy O(|P| log |P|) sorting algorithm (Algorithm 2) that orders j in P in non-increasing order of g_j^2 / t_j and includes j while g_j^2 / t_j >= Gamma(A union P_bar).
identity_notes: Distinct from personalized sparse federated learning methods such as DisPFL (AIMech:DisPflDecentralizedSparseTrainingForPersonalizedFederatedLearning; Dai et al., ICML 2022), which maintain client-specific fixed-density masks over a decentralized peer-to-peer graph rather than dynamically resizing a shared global model mask M_k via an exact greedy optimizer of the risk-reduction-per-unit-time ratio Gamma(M). Distinct from static post-training or lottery-ticket initialization pruning (Frankle & Carbin, 2019), which fixes a predetermined target sparsity ratio and requires rewinding weights to initialization rather than adaptively shrinking and regrowing the active parameter set during ongoing federated optimization.
aliases:
- PruneFL
- Adaptive and Distributed Parameter Pruning for Federated Learning
