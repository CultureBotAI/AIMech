id: AIMech:CompressedScaffnewDoublyAcceleratedLocalTrainingAndCompression
name: CompressedScaffnew
concept_kind: algorithm
review_status: DRAFT
definition: A doubly accelerated distributed and federated optimization algorithm for minimizing f(x) = (1/n) sum_{i=1}^n f_i(x) across n heterogeneous clients without any data-similarity assumption. CompressedScaffnew integrates Scaffnew/ProxSkip probabilistic local gradient updates x_hat_i^t = x_i^t - gamma (nabla f_i(x_i^t) - h_i^t) with a shared random column-permuted binary template mask Q^t in {0,1}^{d x n} having exactly s in {2, ..., n} active ones per coordinate row when communication is triggered (with probability p in (0, 1]). At communication rounds, each client i transmits only the entries of x_hat_i^t where q_{k,i}^t = 1, the server broadcasts the row average x_bar_k^t = (1/s) sum_{j=1}^n q_{k,j}^t x_hat_{j,k}^t, and each client updates its local control variate entry h_{i,k}^{t+1} = h_{i,k}^t + (p eta / gamma)(x_bar_k^t - x_hat_{i,k}^t) only on its active coordinates (q_{k,i}^t = 1), preserving sum_{i=1}^n h_i^t = 0 and achieving O(d * sqrt(kappa * n / (s (s - 1))) log(1/epsilon)) communicated floats.
identity_notes: Distinct from uncommitted or uncompressed Scaffnew/ProxSkip (which requires full d-dimensional vector communication at every triggered sync round) and from independent random sparsifiers (which break Scaffnew's zero-sum control-variate invariant sum_{i=1}^n h_i^t = 0). CompressedScaffnew couples local training with a shared s-active-per-row permutation mask so that the control-variate updates sum to zero coordinatewise while compressing uplink communication by factor s/n.
aliases:
- CompressedScaffnew Algorithm
- Doubly Accelerated Scaffnew with Permutation Mask Compression
