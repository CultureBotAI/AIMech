claims:
- claim_id: shared-row-regular-permutation-mask-and-zero-sum-control-variates
  kind: mechanism
  statement: 'At each communication event (theta^t = 1 with probability p), CompressedScaffnew samples a binary mask Q^t = (q_1^t, ..., q_n^t) in {0,1}^{d x n} by uniformly permuting the columns of a template matrix having exactly s ones in every row (sum_{i=1}^n q_{k,i}^t = s for all k = 1..d) and balanced column sums in {floor(s d / n), ceil(s d / n)}. Because the server averages x_bar_k^t = (1/s) sum_{j: q_{k,j}^t=1} x_hat_{j,k}^t and only active clients update h_{i,k}^{t+1} = h_{i,k}^t + (p eta / gamma)(x_bar_k^t - x_hat_{i,k}^t), the invariant sum_{i=1}^n h_i^t = 0 holds exactly for all t >= 0 whenever initialized with sum_{i=1}^n h_i^0 = 0.'
  evidence:
  - source_id: r576-primary-pdf
    locator: Section 2, Algorithm 1, Figure 1, and Equations (5)-(7), pp. 4-6
    relation: supports
- claim_id: linear-lyapunov-contraction-with-coupled-local-and-compression-factor
  kind: mechanism
  statement: Theorem 1 proves that for L-smooth, mu-strongly convex local functions f_i, stepsize 0 < gamma < 2/L, mixing parameter 0 < eta <= (n (s - 1)) / (s (n - 1)), and s >= 2, the Lyapunov potential Psi^t = (1/gamma) sum_{i=1}^n ||x_i^t - x^*||^2 + (gamma / (p^2 eta)) ((n - 1) / (s - 1)) sum_{i=1}^n ||h_i^t - h_i^*||^2 contracts linearly as E[Psi^{t+1} | F^t] <= rho Psi^t with rho = max{(1 - gamma mu)^2, (gamma L - 1)^2, 1 - (p^2 eta (s - 1)) / (n - 1)} < 1.
  evidence:
  - source_id: r576-primary-pdf
    locator: Section 3.1, Theorem 1, p. 7, Equations (8)-(10)
    relation: supports
- claim_id: double-acceleration-in-condition-number-and-dimension
  kind: application
  statement: By choosing gamma = Theta(1/L), eta = (n (s - 1)) / (s (n - 1)), and communication probability p = min{1, sqrt((mu / L) * (s (n - 1)^2) / (n (s - 1)^2))}, CompressedScaffnew achieves iteration complexity O((kappa + (n - 1)/(s - 1) + sqrt(kappa * (n/s) * ((n - 1)/(s - 1))^2)) log(1/epsilon)) and uplink communication complexity O((d + (d s / n) sqrt(kappa * n / (s (s - 1)))) log(1/epsilon)) floats per client (which reduces to O((d + (d / n) sqrt(kappa n)) log(1/epsilon)) for constant s >= 2).
  evidence:
  - source_id: r576-primary-pdf
    locator: Section 1.2, Table 1, p. 3; Section 3.1, Corollary 1 and Remark 1, pp. 7-8
    relation: supports
  - source_id: r576-metadata-cr
    locator: Bibliographic record
    relation: supports
- claim_id: minimum-two-active-clients-per-coordinate-requirement
  kind: limitation
  statement: CompressedScaffnew requires at least s >= 2 active clients per coordinate row at every communication event so that the inter-client difference x_bar_k^t - x_hat_{i,k}^t is non-zero and eta = (n (s - 1)) / (s (n - 1)) > 0; if s = 1, x_bar_k^t equals the single active client's entry and consensus cannot progress.
  evidence:
  - source_id: r576-primary-pdf
    locator: Section 2, p. 6 and Section 3.1, Theorem 1, p. 7
    relation: supports
