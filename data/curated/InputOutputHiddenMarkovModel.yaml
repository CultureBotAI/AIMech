claims:
- claim_id: method
  kind: mechanism
  statement: Given inputs u_1:T and an initial state distribution, sum over paths in p(s_0) times product_t
    p(s_t|s_(t-1),u_t) p(y_t|s_t,u_t) to obtain p(y_1:T|u_1:T). The original architecture uses one static
    transition subnetwork per previous state, with a softmax over allowed successors, and one output subnetwork
    per current state. Recursively propagating zeta_t(i)=sum_j p(s_t=i|s_(t-1)=j,u_t) zeta_(t-1)(j) gives
    the state distribution conditional on inputs alone; it is distinct from the posterior after conditioning
    on observed target outputs. Forward–backward with the observed output factors supplies state and transition
    posterior responsibilities for conditional-likelihood EM. The expected complete-data log likelihood
    separates into responsibility-weighted log transition and log emission terms. Neural parameterizations
    can use generalized EM updates that increase that expected objective. Intermittently missing outputs
    can be marginalized by replacing their normalized emission factors by one while preserving the latent
    chain.
