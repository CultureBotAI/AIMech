name: Input-output hidden Markov model
definition: A conditional latent sequence-model family whose discrete hidden-state transitions and state-specific
  observation distributions depend on the current external input.
concept_kind: model_family
identity_notes: 'The inspected Bengio–Frasconi model maps an input sequence to an output-sequence distribution
  using a latent Markov state. Its original modular neural implementation supplies input-sensitive transition
  and output subnetworks, but the model family is identified by the conditional factorization. It differs
  from a standard autonomous HMM, a factorial multi-chain model, an undirected product of HMMs, a generic
  recurrent network and an arithmetic mixture without state dynamics. The input sequence is conditioned
  on rather than assigned its own generative model. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 376 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 5 and 5 lines. All 4 unique
  matched contents were fully read: preceding boundary discussions, citations, reviews and pending leads,
  not existing records of these three identities. All 64 semantic label/synonym hits, 17 exact fully annotated
  AIO nodes with outgoing edges, their generated records and four native neighbors were inspected or verified
  unchanged after prior full reading. Absence is bounded to this pin and inspected neighborhood.'
limitations:
- Input-conditioned transitions can vary with time even with fixed parameters. Removing input dependence
  recovers an ordinary HMM special case; no claim is made that an arbitrary recurrent network has this
  normalized latent-state model.
- The recurrent probability vector is a distribution over states, not a single sampled state path. Output-conditioned
  filtering or smoothing must include observed output likelihoods; the input-only recurrence is insufficient
  for that posterior.
- The paper’s backward variable includes the current emission, unlike a common future-only convention.
  Its pair-posterior Equation (11) must be interpreted with that convention to avoid counting the emission
  twice.
- The special lookup-table re-estimation display in Equation (12) omits an old transition factor needed
  by the posterior-count expression in Equation (11). This record uses posterior-weighted EM/GEM semantics
  and does not certify that display as a general update formula.
- GEM inherits conditional-likelihood monotonicity when its expected objective is increased with an exact
  E-step; an arbitrary gradient step, global optimum or unconditional convergence to a local maximum is
  not guaranteed. Local optima and large state spaces are practical limitations acknowledged by the source.
- The grammar experiment reports accuracy conditional on successful training runs and selects model size
  using validation strings. No universal long-memory advantage, benchmark ranking, 1996 full-text claim
  or author-code behavior is curated.
