    structure, with inputs conditioned on. The AIO BayesianNetwork target is broader than this input-conditioned
    latent-state family.
- target: AIO:RecurrentNeuralNetwork
  relation: related_match
  rationale: The original realization is a modular recurrent neural architecture whose state distribution
    gates static subnetworks. The conditional model family also admits tabular parameterizations, so this
    records the architectural association rather than claiming every IOHMM is a neural network.
