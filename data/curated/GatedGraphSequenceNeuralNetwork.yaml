    to a GRU unit or a specific software layer and does not adopt the pinned target’s LSTM parentage as
    scientific evidence.
limitations:
- This is the named Section4 extension, not an alias of the Section3 base GG-NN. Annotation-state feedback
  is distinguished from explicit previous-output token feedback.
- Observed intermediate supervision, latent annotation training, shared propagation and separate propagation
  are different supported configurations.
- The program-analysis application assumes supplied symbolic heap graphs and a restricted formula vocabulary;
  a separate verifier provides proof checking.
- All20pages of arXiv1511.05493v4 were read, including appendices. Other source versions and author code
  were not inspected. Constructed state/normalization examples do not train models or replicate sequence
  and verification benchmarks. DRAFT remains.
