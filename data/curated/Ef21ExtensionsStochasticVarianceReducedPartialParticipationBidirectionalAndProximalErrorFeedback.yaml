claims:
- claim_id: ef21-page-variance-reduced-coupled-distortion-recursion
  kind: mechanism
  statement: In EF21-PAGE (Algorithm 2), each worker i maintains both a PAGE gradient estimator v_i^{t+1} (equal to nabla f_i(x^{t+1}) with probability p and v_i^t + hat{Delta}_i^t with probability 1 - p) and a compressed state g_i^{t+1} = g_i^t + C_i^t(v_i^{t+1} - g_i^t). Theorem 4 proves that by coupling the compression distortion G^t = (1/n) sum_i ||g_i^t - v_i^t||^2 and the PAGE variance V^t = (1/n) sum_i ||v_i^t - nabla f_i(x^t)||^2 in a three-term Lyapunov function, EF21-PAGE converges to an exact stationary point without the O(sigma^2 / tau) noise floor of EF21-SGD.
  evidence:
  - source_id: r577-primary-pdf
    locator: Section 3.2, Algorithm 2 and Theorem 4, pp. 10-12
    relation: supports
- claim_id: ef21-bc-bidirectional-master-and-worker-markov-compression
  kind: mechanism
  statement: In EF21-BC (Algorithm 4), workers compress local gradient differences via c_i^{t+1} = C_i^t(nabla f_i(x^{t+1}) - g_i^t) with contractive parameter alpha_W, while the master maintains both a worker-average state g^t = (1/n) sum_i g_i^t and a broadcast state p^t updated via p^{t+1} = p^t + C_M^t(g^{t+1} - p^t) with contractive parameter alpha_M, achieving O(1 / (alpha_W alpha_M epsilon^2)) complexity for smooth nonconvex objectives and linear convergence under the Polyak-Lojasiewicz condition (Theorem 8).
  evidence:
  - source_id: r577-primary-pdf
    locator: Section 3.4, Algorithm 4 and Theorem 8, pp. 14-16
    relation: supports
  - source_id: r577-metadata-cr
    locator: Bibliographic record
    relation: supports
- claim_id: ef21-pp-and-ef21-prox-partial-participation-and-composite-convergence
  kind: application
  statement: EF21-PP (Algorithm 3, Theorem 6) preserves the Markov error-feedback invariant g^t = (1/n) sum_{i=1}^n g_i^t under arbitrary proper client sampling by keeping g_i^{t+1} = g_i^t for unsampled clients i not in S_t, while EF21-Prox (Algorithm 6, Theorem 12) replaces the smooth gradient update with x^{t+1} = prox_{gamma R}(x^t - gamma g^t) and guarantees O(1 / (alpha T)) decay of the squared generalized gradient mapping ||G_gamma(x^t)||^2.
  evidence:
  - source_id: r577-primary-pdf
    locator: Section 3.3, Algorithm 3 and Theorem 6, pp. 12-14; Section 3.6, Algorithm 6 and Theorem 12, pp. 19-21
    relation: supports
- claim_id: ef21-sgd-large-minibatch-or-neighborhood-limitation
  kind: limitation
  statement: Unlike EF21-PAGE, vanilla EF21-SGD (Algorithm 1, Theorem 2) accumulates stochastic noise inside the contractive compressor C_i^t(hat{g}_i(x^{t+1}) - g_i^t), so with constant stepsize and fixed minibatch size tau it only converges to a neighborhood proportional to sigma^2 / (alpha^2 tau), requiring O(sigma^2 / (alpha^2 epsilon^2)) minibatch sizes to reach an epsilon-stationary point.
  evidence:
  - source_id: r577-primary-pdf
    locator: Section 3.1, Theorem 2 and Corollary 3, pp. 8-10
    relation: supports
