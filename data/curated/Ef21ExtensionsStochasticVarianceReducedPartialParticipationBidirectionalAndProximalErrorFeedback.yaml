id: AIMech:Ef21ExtensionsStochasticVarianceReducedPartialParticipationBidirectionalAndProximalErrorFeedback
name: EF21 Algorithmic Extensions (EF21-SGD, EF21-PAGE, EF21-PP, EF21-BC, EF21-HB, EF21-Prox)
concept_kind: algorithm
review_status: DRAFT
definition: 'A suite of six algorithmic extensions of the Markov-compressor error-feedback method EF21 for distributed nonconvex and Polyak-Lojasiewicz (PL) optimization with contractive compressors C in B(alpha): (1) EF21-SGD replacing exact local gradients nabla f_i(x^t) with unbiased stochastic minibatch gradients hat{g}_i(x^t); (2) EF21-PAGE replacing local gradients with probabilistic PAGE variance-reduced estimators v_i^{t+1} (computed via full local gradients with probability p and recursive minibatch differences with probability 1 - p) to eliminate the stochastic variance floor; (3) EF21-PP supporting partial client participation where only a sampled subset S_t subseteq {1, ..., n} communicates c_i^t = C_i^t(nabla f_i(x^{t+1}) - g_i^t) while inactive clients retain g_i^{t+1} = g_i^t; (4) EF21-BC adding server-to-worker contractive compression C_M^t on the aggregated state difference; (5) EF21-HB incorporating heavy-ball momentum; and (6) EF21-Prox solving composite problems min_x f(x) + R(x) via x^{t+1} = prox_{gamma R}(x^t - gamma g^t).'
identity_notes: Distinct from baseline EF21 (which requires full-batch local gradients, full client participation, uncompressed server broadcasts, no momentum, and smooth unconstrained objectives) and from EF-BV (which decomposes compressors into bias and variance parameters using an auxiliary scaling lambda). The EF21 extensions directly generalize the Markov compression recursion g_i^{t+1} = g_i^t + C_i^t(u_i^{t+1} - g_i^t) across six orthogonal operational axes.
aliases:
- EF21 with Bells and Whistles
- EF21-PAGE
- EF21-BC
- EF21-PP
- EF21-Prox
- EF21-HB
