claims:
- claim_id: r454-local-sam-and-scale-invariant-asam-perturbation-mechanism
  kind: mechanism
  statement: Drives each participating client k toward wider, lower-curvature basins (measured by reduced maximum Hessian eigenvalue lambda_max and trace Tr(H)) by evaluating local gradients at the adversarially perturbed point w + epsilon^hat_k(w) under Euclidean ball radius rho (FedSAM, Equation 3) or parameter-scale-normalized radius ||T_w^{-1} epsilon||_2 <= rho (FedASAM, Equations 4-5), reducing the loss barrier when heterogeneous client models are averaged on the server.
  evidence:
  - source_id: r454-primary-pdf
    locator: Section 3.3 Loss Surfaces & Section 4.1 SAM and ASAM on the Client Side (Equations 2-5, Table 1, Figures 1-3), pp. 4-7
    relation: supports
- claim_id: r454-server-side-cyclic-swa-aggregation-scope
  kind: scope
  statement: Integrates server-side Stochastic Weight Averaging (SWA) after an initial warmup fraction s of total communication rounds by cycling the server-broadcast learning rate between alpha_1 and alpha_2 over cycle length c and updating the running average w_SWA <- (w_SWA * n_models + w^{t+1}) / (n_models + 1) at the minimum of each cycle without increasing client-server communication cost.
  evidence:
  - source_id: r454-primary-pdf
    locator: Section 4.2 SWA on the Server Side & Algorithm 1, pp. 7-8
    relation: supports
- claim_id: r454-two-forward-backward-passes-per-local-step-limitation
  kind: limitation
  statement: Doubles the local per-minibatch backpropagation cost on participating clients because each local step requires one gradient evaluation to compute the ascent perturbation epsilon^hat_k(w) and a second gradient evaluation at w + epsilon^hat_k(w).
  evidence:
  - source_id: r454-primary-pdf
    locator: Section 4.1 Equation 3 & Algorithm 1 Client Update, pp. 6-8
    relation: supports
- claim_id: r454-heterogeneous-federated-vision-generalization-application
  kind: application
  statement: Applied to heterogeneous cross-device federated vision benchmarks including CIFAR-10, CIFAR-100, Federated Extended MNIST (FEMNIST), and Landmarks-User-160k using GroupNorm-equipped ResNet and MobileNetV2 architectures.
  evidence:
  - source_id: r454-primary-pdf
    locator: Section 5 Experiments (Tables 1-4, Figures 3-5), pp. 8-14
    relation: supports
