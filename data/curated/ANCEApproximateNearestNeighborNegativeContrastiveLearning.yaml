id: AIMech:ANCEApproximateNearestNeighborNegativeContrastiveLearning
name: ANCE Approximate Nearest Neighbor Negative Contrastive Learning
concept_kind: algorithm
review_status: DRAFT
definition: "A contrastive representation learning algorithm for dense text retrieval that resolves the diminishing gradient norms and high stochastic gradient variance of local in-batch and static BM25 negatives by globally sampling hard negative documents D^-_{ANCE} = ANN_{f(q,d)} \\ D^+ from the top-retrieved candidates of the entire corpus under the being-optimized dual-encoder model f(q, d) = sim(g(q; theta), g(d; theta)), maintaining a parallel Inferencer process that periodically re-encodes the document corpus with recent model checkpoints f_k and asynchronously refreshes the Approximate Nearest Neighbor (ANN) index every m training batches while the Trainer optimizes \u03B8* = argmin_\u03B8 sum_q sum_{d^+ in D^+} sum_{d^- in D^-_{ANCE}} l(f(q, d^+), f(q, d^-))."
identity_notes: Distinct from Dense Passage Retrieval (Karpukhin et al., EMNLP 2020, AIMech:DensePassageRetrieval), which uses static BM25 negatives and local in-batch negatives; distinct from RocketQA (Qu et al., NAACL 2021, AIMech:RocketQADenoisedHardNegativeSampling), which uses cross-batch negatives and cross-encoder hard-negative denoising across discrete pipeline generations; and distinct from REALM (Guu et al., ICML 2020, AIMech:REALMRetrievalAugmentedLanguageModelPreTraining), which trains a masked language model jointly with a neural knowledge retriever using marginal log-likelihood over documents rather than variance-reducing global hard-negative contrastive estimation for first-stage ad-hoc and OpenQA dense retrieval.
aliases:
- ANCE
- Approximate Nearest Neighbor Negative Contrastive Estimation
- ANCE Asynchronous ANN Hard-Negative Dense Retrieval
- ANCE-FirstP and ANCE-MaxP
