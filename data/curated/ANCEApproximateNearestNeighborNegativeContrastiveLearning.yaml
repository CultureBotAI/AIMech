claims:
- claim_id: r753-claim-variance-reduction-gradient-norm
  kind: mechanism
  statement: "Under stochastic gradient descent with importance sampling \u03B8_{t+1} = \u03B8_t - \u03B7 (1 / (N p_{d^-})) grad_{\u03B8_t} l(d^+, d^-), convergence rate E[\u0394^t] is maximized by the oracle distribution p*_{d^-} proportional to ||grad_{\u03B8_t} l(d^+, d^-)||_2; because batch size b << |C| and informative negatives |D^{-*}| << |C|, a random mini-batch includes informative negatives with near-zero probability p = b|D^{-*}|/|C|^2 (empirically 0% overlap with top-100 DR negatives), whereas ANCE global negatives D^-_{ANCE} = ANN_{f(q,d)} \\ D^+ achieve 63% to 100% overlap and increase per-sample gradient norms by orders of magnitude."
  evidence:
  - source_id: r753-primary-pdf
    locator: Section 3, Section 4, & Section 6.2, Equations 4-13, Figures 3-4, pp. 3-4, 7-8
    relation: supports
- claim_id: r753-claim-asynchronous-ann-index-refresh
  kind: mechanism
  statement: To avoid halting stochastic training for corpus-wide inference, ANCE splits compute between a Trainer that samples hard negatives from the top-k (e.g., top-200) results of ANN_{f_{k-1}} and a parallel Inferencer that re-encodes the entire corpus with checkpoint f_k and rebuilds the Faiss IndexFlatIP index every m batches (e.g., every 10k batches with a 1:1 Trainer:Inferencer GPU split), supporting both 512-token FirstP truncation and 4-passage MaxP max-pooling for long documents.
  evidence:
  - source_id: r753-primary-pdf
    locator: Section 4 & Section 5, Figure 2, Appendix A.1 & A.3, Figure 5, Table 7, pp. 4-5, 12-13
    relation: supports
- claim_id: r753-claim-web-search-openqa-application
  kind: application
  statement: ANCE improves MS MARCO Passage Dev retrieval to 0.330 MRR@10 and 0.959 Recall@1k, raises TREC 2019 DL NDCG@10 to 0.648 on passages (ANCE-FirstP) and 0.628 on documents (ANCE-MaxP, vs. 0.519 for BM25 and 0.557 for DPR), increases Natural Questions Top-20/100 answer coverage to 81.9/87.5 (single-task) and 82.1/87.9 (multi-task) with 46.0/57.5 end-to-end Exact Match on NQ/TriviaQA when paired with RAG-Token/DPR readers, and delivers +14.2% to +18.4% gains in a commercial search engine over 250M to 8B documents at 11.6ms online latency (over 100x faster than 1.42s BM25 + BERT reranking).
  evidence:
  - source_id: r753-primary-pdf
    locator: Section 6.1, Tables 1-5, pp. 6-7
    relation: supports
- claim_id: r753-claim-corpus-reencoding-cost-and-async-gap-limitation
  kind: limitation
  statement: ANCE training requires dedicated parallel GPU resources for continuous corpus re-encoding (10 hours per corpus pass on a 32GB V100 GPU at 4.5ms per document), and an overly large learning rate or infrequent ANN refresh interval (e.g., 20k batches with 8:4 GPU split or 1e-5 learning rate) introduces an asynchronous index staleness gap that causes training loss and test NDCG@10 fluctuations.
  evidence:
  - source_id: r753-primary-pdf
    locator: Section 6.1, Table 5, & Appendix A.3-A.4, Figure 5, Table 7, pp. 6-7, 13-14
    relation: supports
