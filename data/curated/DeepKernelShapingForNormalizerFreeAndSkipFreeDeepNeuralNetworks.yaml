id: AIMech:DeepKernelShapingForNormalizerFreeAndSkipFreeDeepNeuralNetworks
name: Deep Kernel Shaping for Normalizer-Free and Skip-Free Deep Neural Networks
concept_kind: mathematical_method
review_status: DRAFT
definition: A model-class-preserving neural network initialization and activation-function transformation method introduced by Martens et al. (2021) that controls the initialization-time approximate paired-location kernel function (APKF) and Neural Tangent Kernel (NTK) of deep networks via local and extended Q and C maps so that deep networks can be rapidly trained without normalization layers or skip connections. Combining Orthogonal or Gaussian Delta weight initialization, optional Per-Location Normalization (PLN) of inputs, normalized weighted sums sum_i w_i Y_i with sum_i w_i^2 = 1, and a network-level maximal slope function mu(psi) = max_f p_f(psi), Deep Kernel Shaping (DKS) replaces each element-wise activation function phi(u) with a static four-parameter affine-transformed activation phi_hat(u) = gamma (phi(alpha u + beta) + delta) chosen to enforce the four local map conditions Q_f(1) = 1, Q_f'(1) = 1, C_f(0) = 0, and C_f'(1) = mu^{-1}(zeta) for a global slope bound zeta > 1.
identity_notes: 'Distinct from Edge of Chaos (EOC / dynamical isometry) initialization (Schoenholz et al. 2017; Xiao et al. 2018, which only tunes weight and bias variances to satisfy a single asymptotic condition C''(1) = 1 without enforcing C(0) = 0, Q''(1) = 1, or calibrating C''(1) = mu^{-1}(zeta) to finite network depth and topology), distinct from SELU self-normalizing networks (Klambauer et al. 2017, which use a fixed activation with C''(1) approx 1.0716 that explodes at large depths), and distinct from Fixup / ReZero / NFNets (which rely on residual skip connections with zero-initialized or down-weighted residual branches): DKS enforces four exact local Q/C map conditions for arbitrary smooth activation functions via four static activation transformation parameters (alpha, beta, gamma, delta) calibrated through the inverse maximal slope function mu^{-1}(zeta).'
aliases:
- Deep Kernel Shaping
- DKS
- Q/C Map Deep Kernel Shaping
- Maximal Slope Function Activation Transformation for Deep Kernel Shaping
