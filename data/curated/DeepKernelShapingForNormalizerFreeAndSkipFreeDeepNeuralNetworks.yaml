claims:
- claim_id: dks-positive-definite-c-map-identity-deviation-bounds
  kind: mechanism
  statement: Under uniform q values (enforced by Per-Location Normalization so that q = 1 at the input and Q_f(1) = 1 across layers), every subnetwork's extended C map C_f(c) is a positive definite function on [-1, 1] with C_f(1) = 1 and C_f^{(i)}(0) >= 0, and by Theorem 13 its uniform deviation from the identity map satisfies (1/4)(1 - C_f'(0)) <= max_{c in [-1,1]} |C_f(c) - c| <= 2(1 - C_f'(0)) and, when C_f(0) = 0, max_{c in [-1,1]} |C_f(c) - c| <= 2(C_f'(1) - 1) and max_{c in [-1,1]} |C_f'(c) - 1| <= 3(C_f'(1) - 1).
  evidence:
  - source_id: r569-primary-pdf
    locator: Section 11, Equation (14), pp. 28-29; Section 13.2, Theorem 13, pp. 37-38; Appendix D.1, pp. 132-133
    relation: supports
- claim_id: dks-maximal-slope-function-and-four-parameter-activation-solution
  kind: mechanism
  statement: 'To bound C_g''(1) <= zeta across all subnetworks g while preventing individual layers from becoming too affine (Proposition 18: na(phi)^2 = 1 - C_f''(0)/C_f''(1) >= 1 - 1/C_f''(1)), DKS defines the network maximal slope function mu(psi) = max_g p_g(psi) from subnetwork slope polynomials (where composition multiplies polynomials and normalized sums sum_i w_i Y_i with sum_i w_i^2 = 1 form weighted averages sum_i w_i^2 p_{g_i}(psi)), sets psi = mu^{-1}(zeta), and transforms each activation phi(u) into phi_hat(u) = gamma(phi(alpha u + beta) + delta) with delta = -E[phi(alpha x + beta)], gamma = Var[phi(alpha x + beta)]^{-1/2}, and (alpha, beta) solved numerically so E[phi_hat(x) phi_hat''(x) x] = Q_f''(1) = 1 and E[phi_hat''(x)^2] = C_f''(1) = mu^{-1}(zeta).'
  evidence:
  - source_id: r569-primary-pdf
    locator: Section 13.4, Proposition 18, p. 39; Section 17, pp. 48-50; Section 18.4, Equation (16), pp. 52-53; Section 21.3, pp. 63-64
    relation: supports
- claim_id: dks-per-layer-ntk-gram-matrix-approximation-bound
  kind: mechanism
  statement: For a D-layer feed-forward network in the infinite-width NTK regime, Equation (23) expresses the i-th per-layer Neural Tangent Kernel as Theta_i(x, x') = q_D C_{g_i}(c_0) C_{h_i}'(C_{g_i}(c_0)) where c_0 = x^T x' / d_0, and Theorem 27 proves that under DKS with global slope bound zeta > 1 every layer's NTK satisfies |Theta_i(x, x') - (1/d_0) x^T x'| <= 11(zeta - 1), preventing both collapsing (rank-1) and exploding layer-wise NTK pathologies.
  evidence:
  - source_id: r569-primary-pdf
    locator: Section 24.4, Equation (23), p. 75; Section 24.6, Theorem 27, p. 78; Appendix H.3, p. 143
    relation: supports
- claim_id: dks-positively-homogeneous-activation-and-multiplicative-layer-limitations
  kind: limitation
  statement: Positively homogeneous activations phi(lambda u) = lambda^k phi(u) such as ReLU yield only three effective continuous degrees of freedom under phi_hat(u) = gamma(phi(alpha u + beta) + delta) and therefore cannot simultaneously enforce Q_f'(1) = 1 alongside the other three local map conditions (Section 18.6); in addition, DKS does not support multiplicative attention layers, Batch Normalization, or inter-step weight sharing in recurrent networks, and requires second-order optimizers such as K-FAC or Shampoo to match standard ResNet training speeds when skip connections are completely removed.
  evidence:
  - source_id: r569-primary-pdf
    locator: Section 18.6, pp. 53-54; Section 21.1, p. 62; Section 30 (Limitations and future directions), pp. 121-123
    relation: supports
