claims:
- claim_id: r383-virtual-average-variance-reduction-and-drift-bound
  kind: mechanism
  statement: For the virtual average sequence x_bar_t = (1/K) sum_{k=1}^K x_t^k, Lemma 3.2 establishes that the variance of the averaged stochastic gradient is reduced by a factor of K (E ||g_t - g_bar_t||^2 <= sigma^2 / K), and Lemma 3.3 proves that for stepsizes satisfying eta_t <= 2 * eta_{t+H} and synchronization gap at most H, the expected squared worker deviation from x_bar_t is uniformly bounded by (1/K) sum_{k=1}^K E ||x_bar_t - x_t^k||^2 <= 4 * eta_t^2 * G^2 * H^2.
  evidence:
  - source_id: r383-primary-pdf
    locator: Section 3 Proof of Theorem 2.2, Lemma 3.1, Lemma 3.2, and Lemma 3.3, pp. 4-5
    relation: supports
- claim_id: r383-linear-parallel-speedup-and-communication-reduction
  kind: mechanism
  statement: Under L-smoothness and mu-strong convexity with stepsizes eta_t = 4 / (mu * (a + t)), shift a > max(16 * kappa, H), and quadratic iterate weights w_t = (a + t)^2, Theorem 2.2 proves E[f(x_hat_T)] - f(x*) <= O(sigma^2 / (mu * K * T)) + O(kappa * H^2 * G^2 / (mu * T^2)) + O(G^2 * (kappa + H)^3 / (mu * T^3)), achieving linear K-fold parallel speedup whenever H = O(sqrt(T / (K * b))).
  evidence:
  - source_id: r383-primary-pdf
    locator: Section 2 Theorem 2.2, Corollary 2.3, and Remark 2.4, pp. 3-4
    relation: supports
- claim_id: r383-bounded-second-moment-and-heterogeneous-drift-limitation
  kind: limitation
  statement: The drift bound in Lemma 3.3 assumes a uniform second-moment bound E ||grad f_i(x)||^2 <= G^2 and shared objective f across workers; when workers optimize heterogeneous local objectives f_k != f with large H, local iterates drift toward distinct local optima unless corrected.
  evidence:
  - source_id: r383-primary-pdf
    locator: Section 2 Equations (3)-(4), Lemma 3.3, and Section 6 Conclusion, pp. 2, 5, 8
    relation: supports
- claim_id: r383-communication-reduced-parallel-training-application
  kind: application
  statement: Applied to parallel mini-batch and asynchronous stochastic optimization of regularized logistic regression and convex empirical risk minimization with periodic worker averaging.
  evidence:
  - source_id: r383-primary-pdf
    locator: Section 4 Empirical Observations and Section 5 Asynchronous Local SGD, Figures 1-2, pp. 6-8
    relation: supports
