name: Parallel tempering
definition: A population Monte Carlo method that combines within-temperature target-preserving updates
  with corrected exchanges between replicas targeting differently tempered densities.
concept_kind: algorithm
identity_notes: The record identifies fixed-temperature parallel tempering, with the source’s adjacent-swap
  and random-walk realization as an explicit example. The population state includes all replicas; the
  beta=1 replica targets the original distribution. It differs from a single-chain simulated-temperature
  state and from adapting the temperature ladder. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 181 prior native IDs/names/aliases. Ignored-inclusive searches
  of both full checkouts found prior discovery leads, neighboring sampler discussions and unrelated author-name/environment
  substrings. Existing random-walk Metropolis, delayed-rejection, fixed symmetric delayed-rejection and
  RAM records were inspected; shared components do not make these procedures equivalent.
limitations:
- All tempered densities must be normalizable; flattening a target by taking a positive power below one
  need not preserve integrability.
- Target invariance alone does not establish irreducibility, mixing speed, finite-run convergence or independence
  of cold-replica samples.
- The source calls the composed chain reversible. Composition of two reversible kernels need not be reversible
  without additional conditions; this record asserts only their directly justified invariance.
- The original distribution is the cold replica’s marginal, not the pooled unweighted population distribution.
- Other valid local kernels and exchange schedules require their own conditions. The record’s explicit
  Gaussian and adjacent-swap realization is not a claim that all implementations use it.
