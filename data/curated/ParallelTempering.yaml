claims:
- claim_id: method
  kind: mechanism
  statement: Choose a fixed L≥2 and inverse temperatures 1=beta1>...>betaL>0 for which each integral Z_beta=integral
    pi(x)^beta dx is finite. Initialize replicas in positive target support. The joint target is the product
    of pi(x_l)^beta_l/Z_beta_l. In the inspected realization, choose j uniformly from adjacent pairs and
    propose swapping x_j and x_(j+1), with probability min(1,[pi(x_(j+1))/pi(x_j)]^(beta_j−beta_(j+1))).
    Then apply a Gaussian random-walk Metropolis update at every level using acceptance min(1,[pi(y_l)/pi(x_l)]^beta_l);
    rejected moves retain their current replica state. Both steps preserve the joint target, so their
    composition does also; samples at beta1=1 have the desired stationary marginal.
