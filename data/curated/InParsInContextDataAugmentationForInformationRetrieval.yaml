id: AIMech:InParsInContextDataAugmentationForInformationRetrieval
name: InPars In-Context Data Augmentation for Information Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: "A few-shot synthetic data augmentation method for information retrieval (Inquisitive Parrots for Search) that prompts a pretrained language model with a fixed prefix of N (e.g., 3) document-question demonstrations\u2014either standard pairs (Vanilla) or pairs contrasting a generic 'bad question' with a descriptive 'good question' (Guided by Bad Questions, GBQ)\u2014to generate a synthetic question for each sampled corpus document, filters the generated pairs by selecting the top K with highest length-normalized token log-probability p_q = (1/|q|) sum_{i=1}^{|q|} log p(q_i | t, d, q_{<i}), samples negative documents from BM25 candidates, and fine-tunes a neural reranker."
identity_notes: Distinct from Promptagator (AIMech:PromptagatorFewShotDenseRetrievalDataGeneration), which filters synthetic pairs via round-trip top-1 retrieval consistency using an initial dual encoder and trains a first-stage dense dual encoder, whereas InPars filters synthetic pairs directly by their length-normalized autoregressive generation log-probability p_q under the generator LM and trains a monoT5 sequence-to-sequence reranker over BM25 candidates.
aliases:
- InPars
- Inquisitive Parrots for Search
- InPars Few-Shot Synthetic Query Generation for IR
