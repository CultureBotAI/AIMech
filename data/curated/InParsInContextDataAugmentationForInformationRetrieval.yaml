claims:
- claim_id: inpars-length-normalized-logprob-filtering-mechanism
  kind: mechanism
  statement: Given a few-shot prompt prefix t and sampled document d, InPars autoregressively generates a candidate question q and retains only the top K (e.g., 10,000 out of 100,000) synthetic (q, d) pairs ranked by average token log-probability p_q = (1/|q|) sum_{i=1}^{|q|} log p(q_i | t, d, q_{<i}).
  evidence:
  - source_id: r741-primary-pdf
    locator: Section 3 & Section 6.3, pp. 2-3 & 8, Equation 1
    relation: supports
- claim_id: inpars-guided-by-bad-questions-prompting-mechanism
  kind: mechanism
  statement: To prevent the language model from generating overly generic questions that match many passages, the Guided by Bad Questions (GBQ) template pairs each in-context passage with both a shallow MS MARCO 'bad question' and a context-specific 'good question', instructing the model to generate a good question for the target document.
  evidence:
  - source_id: r741-primary-pdf
    locator: Section 4.2 & Section 6.1, pp. 4 & 7, Figure 2
    relation: supports
- claim_id: inpars-neural-reranker-adaptation-application
  kind: application
  statement: InPars is applied to unsupervised and domain-adapted passage and document reranking on MS MARCO, TREC-DL 2020, Robust04, Natural Questions, and TREC-COVID, enabling monoT5 rerankers trained without human-labeled in-domain queries to outperform BM25, Contriever, and direct GPT-3 API reranking.
  evidence:
  - source_id: r741-primary-pdf
    locator: Section 5, p. 6, Table 1
    relation: supports
  - source_id: r741-metadata-cr
    locator: DBLP bibliographic record Luiz Henrique Bonifacio et al. SIGIR 2022
    relation: supports
- claim_id: inpars-first-stage-bm25-recall-dependency-limitation
  kind: limitation
  statement: Because InPars trains a cross-encoder reranker applied to the top-1000 documents retrieved by bag-of-words BM25, its overall recall is upper-bounded by lexical first-stage retrieval and it can slightly degrade models already heavily supervised on in-domain MS MARCO queries.
  evidence:
  - source_id: r741-primary-pdf
    locator: Section 4.3 & Section 5, pp. 5-7
    relation: supports
