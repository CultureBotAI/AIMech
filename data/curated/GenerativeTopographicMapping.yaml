name: Generative Topographic Mapping
aliases:
- GTM
concept_kind: model_family
definition: A nonlinear latent-variable density model with a uniform discrete prior on fixed latent grid
  nodes, mapped through a shared smooth function to the centers of an equal-weight Gaussian mixture with
  common isotropic covariance.
identity_notes: 'Scoped to the original fixed-basis GTM construction and its batch EM fitting. The shared
  latent-to-data map ties Gaussian centers and distinguishes the model from an unconstrained mixture,
  a conditional mixture-density network, a Kohonen map and topographic ICA energy dependence. Gaussian
  radial basis functions are a usual map choice, not an identity with every radial-basis network. Learned
  mixture weights, heteroscedastic extensions and mixtures of GTMs require separate scope. Three candidate
  identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms and 454 preceding
  native IDs, names and aliases, with no normalized match. Searches of both complete checkouts included
  ignored and hidden files and returned the same 176 matched-line set across 81 paths. All matching excerpts
  were read and distinguished from existing concept records; historical ledgers were not reread in full
  solely because they contained a match. All 213 semantic-search rows were read, including 212 unchanged
  prior rows and the additional KernelLayer row. Twenty-one annotated AIO nodes with outgoing edges were
  inspected: 19 unchanged prior readings and two new readings. Thirty-one contextual YAMLs, including
  ten native neighbors, comprise 23 unchanged prior readings and eight complete readings in this round.
  This identity assessment is bounded to the pinned snapshot and maintained corpus.'
