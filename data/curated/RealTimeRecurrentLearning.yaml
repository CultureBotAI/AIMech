  rationale: RTRL computes sensitivities and parameter updates for recurrent-network training. The pinned
    TrainingStrategy definition uses a preprocessing genus and does not identify this derivative algorithm;
    a contextual training relationship is supported, without equivalence or a subclass assertion.
limitations:
- The mechanism is scoped to the inspected ten-page manuscript copy of Williams and Zipser (1989). It
  acknowledges earlier related work; no sole-inventor or historical-priority claim is made. Final publisher
  layout and later implementations were not inspected.
- Fixed-weight derivative exactness assumes the stated differentiable dynamics and parameter-independent
  supplied signals and initialization. The source’s online weight updates are approximate with respect
  to the fixed-trajectory gradient; numerical floating-point exactness is not asserted.
- The complete sensitivity tensor can be expensive even though its dimensions do not grow with sequence
  length. Restricted, approximate, sparse or low-rank algorithms require their own evidence and identity
  assessment.
- Teacher forcing changes state evolution and cuts specified derivative paths. Reported training success
  does not establish matching free-running behavior or biologically local learning.
- The small task demonstrations and qualitative results are source reports, not a reproduced benchmark
  or a guarantee of arbitrary-duration memory and convergence.
- All ten manuscript PDF pages and references were read. Constructed differentiation and algebra checks
  use fixed small examples without fitting; no author code, model training, hardware benchmark or empirical
  replication was run.
