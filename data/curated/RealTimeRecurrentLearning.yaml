id: AIMech:RealTimeRecurrentLearning
name: Real-time recurrent learning
aliases:
- RTRL
concept_kind: algorithm
definition: A recurrent-network training algorithm that propagates state sensitivities to adjustable weights
  forward in time and contracts those sensitivities with current supervised output errors to form weight
  updates.
identity_notes: Compared all 442 pinned AIO and 579 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 11, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 64 AIO and 155 native definitions, with unchanged preceding rows
  verified and new matches read. 4 full annotated AIO node/edge/generated contexts and 4 full native records
  were inspected. Matches concern prior RTRL discovery leads and NNPDA derivative context, not an exact
  record. RTRL propagates full recurrent state sensitivities; generic SGD describes sampled-gradient parameter
  updates, Rprop controls sign-based step sizes, and pseudo-linear regression substitutes a raw regressor
  for a total sensitivity. NNPDA is a recurrent controller architecture whose augmented stack-read derivative
  is approximate. TrainingStrategy is related because its preprocessing definition does not supply an
  algorithm superclass. RecurrentNeuralNetwork is a training subject, DifferentiableLLM is an LLM architecture
  and SupervisedLearning a task category. None establishes exact identity. Fixed-weight accumulated and
  online-update forms, including the teacher-forced configuration, remain within this source-defined algorithm
  family.
definition_evidence:
- source_id: williams1989
  locator: Sections 2.1–2.2, Equations 10–15, PDF pp. 4–5
  relation: supports
claims:
- claim_id: forward-state-sensitivities
  kind: mechanism
  statement: For the inspected synchronous network y_k(t+1)=f_k(sum_l w_kl*z_l(t)), z concatenates recurrent
    outputs and external inputs, including a constant bias input when needed. The sensitivity p_ij^k(t+1)=f_k'(s_k(t))*(sum_l
    w_kl*p_ij^l(t)+delta_ik*z_j(t)) propagates through every recurrent unit. Initial sensitivities are
    zero when the initial state is independent of the weights. Weight-dependent initialization or externally
    supplied signals require their additional derivatives; zero initialization is not universally valid.
  evidence:
  - source_id: williams1989
    locator: Section 2.1, Equations 1–3 and 10–14, PDF pp. 2–4
    relation: supports
- claim_id: fixed-trajectory-gradient
  kind: mechanism
  statement: With fixed weights and parameter-independent inputs, targets and initial state, contracting
    p with target-minus-output discrepancies gives the negative gradient of the current half-squared error.
    Summing these negative-gradient contributions gives the negative trajectory-loss gradient without
    storing the entire trajectory. Units lacking a target at a time contribute zero direct error, yet
    their sensitivities must generally still be propagated. Forward sensitivity propagation and reverse
    backpropagation through time agree for the same differentiable fixed-weight objective; they organize
    the derivative computation differently.
  evidence:
  - source_id: williams1989
    locator: Sections 1 and 2.1, Equations 4–15, PDF pp. 2–4; Section 2.4, p. 6; curator fixed-trajectory
      forward/reverse and finite-difference checks
    relation: supports
- claim_id: online-weight-drift
  kind: limitation
  statement: The real-time variant applies each update while the recurrent network continues running,
    avoiding a required epoch boundary. The source explicitly states that this no longer follows the exact
    negative gradient of the total error along a fixed-weight trajectory. Weight changes also change the
    generated trajectory; a sufficiently slow learning timescale is a heuristic control, not a general
    convergence guarantee. In a constructed linear recurrence with initial state 1 and successive weights
    1/2 and 3/5, the propagated sensitivity is 11/10, whereas rerunning both steps at the current fixed
    weight gives derivative 6/5. Exactness of the fixed-parameter recursion must not be transferred unqualified
    to changing weights.
  evidence:
  - source_id: williams1989
    locator: Section 2.2, PDF pp. 4–5; curator two-step changing-weight calculation
    relation: supports
- claim_id: teacher-forced-variant
  kind: mechanism
  statement: Teacher forcing replaces a unit’s output by its supplied target in subsequent state computation
    whenever that target exists. Assuming those targets are independent of the weights, the sensitivity
    recurrence omits propagation through the forced outputs. Their sensitivities still contribute to the
    current weight update before being treated as zero for future propagation. This changes the training
    dynamics and derivative paths; it is an optional RTRL configuration, not the definition of all RTRL
    or an assurance of autonomous free-running performance.
  evidence:
  - source_id: williams1989
    locator: Section 2.3, Equations 17–19 and implementation explanation, PDF pp. 5–6
    relation: supports
- claim_id: storage-and-nonlocality
  kind: limitation
  statement: For n recurrent units and r adjustable weights the direct method retains n*r sensitivities,
    including sensitivities of units without immediate targets. A fully connected n-unit network with
    m external inputs has r=n*(n+m), hence n^2*(n+m) sensitivity values. Directly evaluating the displayed
    recurrent sums takes order n^2*r arithmetic per time step, or order n^3*(n+m) for that dense parameterization.
    Storage does not grow with elapsed sequence length at fixed network size; this is not constant cost
    in network size or a guaranteed wall-clock deadline. The method needs nonlocal weight and error information
    and is not established as a biologically local learning rule.
  evidence:
  - source_id: williams1989
    locator: Section 2.4, PDF p. 6; Discussion, p. 8; direct count from Equation 12, p. 4
    relation: supports
- claim_id: experimental-scope
  kind: scope
  statement: Reported demonstrations use small fully interconnected networks on delayed XOR, sequence
    recognition, delayed nonmatch, finite-state-controller imitation and oscillation tasks. The Turing-machine
    example is described as imitation of finite-state-controller actions; it does not demonstrate that
    a finite recurrent state alone supplies an unbounded tape or arbitrary-program learning. The oscillation
    section reports that teacher forcing was needed for general success in the tested setting and discusses
    near-zero gradients around initially settling dynamics. These selected demonstrations do not establish
    universal convergence, arbitrary memory fidelity, computational efficiency or success without teacher
    forcing.
  evidence:
  - source_id: williams1989
    locator: Sections 3.1–3.5 and Discussion, PDF pp. 6–8
    relation: supports
