id: AIMech:SwarmIntelligence
name: Swarm intelligence
concept_kind: computational_paradigm
aliases: []
definition: A computational design paradigm, in the broadened 1999 formulation, that develops algorithms
  or distributed problem-solving devices inspired by collective behavior in social insects and other animal
  societies, emphasizing interactions among relatively simple agents from which system-level behavior
  emerges.
definition_evidence:
- source_id: bonabeau1999-preview
  locator: Preface, PDF p. 12 / printed p. xi; Section 1.1, PDF p. 20 / printed p. 7, the authors’ broadened
    computational design scope.
  relation: supports
claims:
- claim_id: collective-design-scope
  kind: scope
  statement: The 1999 formulation broadens swarm intelligence to the design of algorithms or distributed
    problem-solving devices inspired by the collective behavior of social insects and other animal societies.
    This selects an organizing approach rather than one prescribed computational procedure.
  evidence:
  - source_id: bonabeau1999-preview
    locator: Section 1.1, PDF p. 20 / printed p. 7, the authors’ explicitly broadened definition; Preface,
      PDF p. 12 / printed p. xi.
    relation: supports
- claim_id: individual-behavior-and-interaction
  kind: mechanism
  statement: Designing the described collective behavior requires specifying both individual agent behavior
    and the interactions among agents or with their environment. The source’s self-organization account
    explains global patterns arising from interactions based on local information, rather than from a
    global pattern explicitly imposed on each constituent.
  evidence:
  - source_id: bonabeau1999-preview
    locator: Section 1.1, PDF p. 20 / printed p. 7, programming emergent behavior; Section 1.2.2, PDF
      p. 22 / printed p. 9, definition of self-organization.
    relation: supports
- claim_id: engineering-modeling-distinction
  kind: scope
  statement: The source distinguishes modeling a biological collective from designing an artificial problem-solving
    system. An engineering design may extend parameters beyond biologically relevant ranges or add nonbiological
    features while retaining useful organizing principles; biological plausibility is not the same criterion
    as engineering usefulness.
  evidence:
  - source_id: bonabeau1999-preview
    locator: Section 1.1, PDF p. 20 / printed p. 7, artificial variations; Section 1.2.1, PDF p. 21 /
      printed p. 8, modeling and designing.
    relation: supports
- claim_id: direct-and-mediated-interactions
  kind: mechanism
  statement: The inspected account permits direct interactions and indirect interactions in which an individual
    modifies the environment and later activity responds to that change. It identifies the latter pathway
    as stigmergy and discusses combining it with self-organization; the pathway is distinct from the broader
    swarm-inspired design approach.
  evidence:
  - source_id: bonabeau1999-preview
    locator: Section 1.2.3, PDF p. 27 / printed p. 14, direct and indirect interactions; PDF p. 29 / printed
      p. 16, environmental mediation and operational examples.
    relation: supports
- claim_id: algorithm-and-device-applications
  kind: application
  statement: The source situates the approach in combinatorial optimization, communication networks and
    robotics, and includes both algorithms and distributed problem-solving devices in its definition.
    These application classes do not supply a single shared learning objective, optimizer update or implementation
    protocol.
  evidence:
  - source_id: bonabeau1999-preview
    locator: Preface, PDF p. 12 / printed p. xi, application areas; Section 1.1, PDF p. 20 / printed p.
      7; beginning of Section 1.4, PDF p. 32 / printed p. 19, robotics scope.
    relation: supports
limitations:
- The selected identity follows the explicitly broadened 1999 formulation. The Beni and Wang 1993 cellular-robotics
  chapter was inspected only through its publisher abstract and metadata. Its full methods and the priority
  of earlier uses were not verified; the historical definitions are not asserted to be identical.
- The acquired source is a 32-page preview containing front matter and part of the introduction, ending
  midway through Section 1.4 at printed page 19. The complete introduction, later book chapters and the
  original experiments cited there were not inspected through this artifact; their detailed methods or
  quantitative results are not asserted.
- This organizing approach does not fix a complete executable algorithm. Agent state, interaction topology,
  scheduling, communication, stochastic rules, objectives and stopping conditions must be specified for
  a concrete design before its behavior or reproduction can be assessed.
- Flexibility, robustness, speed and other engineering benefits are motivations or conditional examples,
  not universal guarantees. The source emphasizes that programming emergent collective behavior is difficult;
  local rules alone do not establish convergence, optimality, fault tolerance or a favorable scaling law.
- Self-organization and stigmergy are distinct concepts, and the source permits direct as well as indirect
  interactions. Environmental traces, pheromone reinforcement, evaporation and reinforcement learning
  are not mandatory for every design within the selected scope; evidence about a particular application
  does not automatically generalize to the paradigm.
- The selected approach is not every multiagent system, distributed computation, biological collective
  phenomenon or population optimizer. A source-supported organizing relationship and an explicit boundary
  from particular implementations are needed; a shared name or metaphor alone does not establish membership
  or equivalence.
aio_no_match:
  search_scope: Current identity assessment covers 769 native and 442 AIO records at the merged cohort
    344 base on 15 October 2026, with ignored and hidden files included in all four checkout searches.
    The pinned AIO commit is 397851c547d1c4d8f06ef184f63c1d40bc86937a. The retained source-specific mapping
    assessment examined the nine exact targets below and their 107 incident edges, alongside the separately
    documented native-neighbor context. Current identity collection and historical source/AIO reading
    retain distinct scopes. No informative mapping was established for this general concept in those inspected
    contexts; absence beyond this pinned vocabulary is not asserted.
  rationale: None of these inspected classes captures the defining computational design approach or supplies
    a sufficiently informative necessary relation. Optional learning, model, network or mathematical implementations
    do not establish equivalence. This is a bounded assessment of the inspected pinned vocabulary, not
    all ontologies.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The source approach includes distributed devices and robotics, not inherently preprocessing
      or training a machine-learning model. Training is a possible application, not the defining relation.
  - target: AIO:MachineLearningTask
    rejection_reason: The inspected approach organizes computation and problem solving; learning from
      data is not required for every included system.
  - target: AIO:ReinforcementLearning
    rejection_reason: Some routing or agent implementations learn from feedback, but no environment/reward-policy
      learning interface defines the whole swarm approach.
  - target: AIO:UnsupervisedLearning
    rejection_reason: Grouping or sorting examples do not make the source-defined approach necessarily
      learn structure from unlabeled data.
  - target: AIO:Model
    rejection_reason: The exact target is a generic abstract representation of properties and relationships.
      A model can inform a swarm design, but the design paradigm is not itself a particular representational
      model; that generic implementational link is not a useful identity mapping here.
  - target: AIO:MathematicalFunction
    rejection_reason: The target is a general rule relating dependent and independent values, not limited
      to scalar arguments. A swarm design may contain functions, but no particular mathematical rule defines
      the broad approach; mere formalizability is insufficient.
  - target: AIO:EvolutionaryLLM
    rejection_reason: The exact class is a large language model using evolutionary computation. Its related
      synonym evolutionary algorithms does not make every population or collective design an LLM.
  - target: AIO:Network
    rejection_reason: 'The exact definition is broad: interconnected nodes or entities for communication,
      computation or exchange. Networks can implement swarm interactions, but this target does not capture
      the source-defined design principles; generic interconnection alone is insufficient for an informative
      local mapping.'
  - target: AIO:Layer
    rejection_reason: The exact class describes deep-learning topology between layers. The broad computational
      design approach is neither a neural layer nor its operation.
