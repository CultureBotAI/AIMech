  rationale: The abstraction family is defined for partition-function sampling in factorized graphical-model
    search spaces. The pinned AIO target supplies that model/task context. This relates an inference-method
    component to graphical-model terminology without equivalence or subclass membership.
limitations:
- The maintained identity is the parameterized abstraction-function family, not the complete AOAS estimator,
  all clustering methods, or a trained model. HB, HRB and QB are value choices; their 21 combinations
  are not asserted as aliases or 21 separate additions.
- The record uses finite positive value inputs and a positive integer state cap. Ties require a consistent
  sorting convention; zero/all-zero values and numerical overflow need implementation treatment. The literal
  iff in Definition 4.1 does not handle equal state indices or tied values as written. The maintained
  description follows the ordered grouping procedures and does not certify that biconditional.
- A finite pair with true contributions 1 and 9 and equal proposal masses has mean 10 and variance 64,
  despite zero dispersion of the proxy. Proposals proportional to 1 and 9 give constant estimate 10. These
  examples illustrate the difference between proxy similarity and the source’s exact proportionality condition.
- For values 1, 2, 3, 4, 6, a specified greedy Ward tie order yields groups {1,2,3,4}/{6} with squared-deviation
  sum 5, while {1,2,3}/{4,6} gives 4. This refutes a universal global-optimum interpretation of greedy
  merging; it is not a run of the authors’ minVar implementation or a claim about its tie policy. The
  source’s use of Var does not fully specify normalization.
- All 41 pages of the proceedings file, including the 30-page appended supplement, were visually read.
  Author-hosted main/supplement text was compared after ignoring page-number lines; only the first-page
  proceedings footer differed. The separate 19-page extended background and OpenReview revisions were
  not fully read. Partial earlier static code reading is documented separately; no author program, training
  run or benchmark was executed.
