  relation: supports
claims:
- claim_id: three-node-value-classes
  kind: mechanism
  statement: 'The three specified value functions are HB: mu=h, HRB: mu=h*r, and QB: mu=w*g*h*r. Here
    h estimates the remaining subtree value, r estimates ancestral off-path branching mass, g is accumulated
    path cost, and w is the current inherited importance weight. The abstraction groups nodes; representative
    selection and inverse-probability correction remain operations of the surrounding AS algorithm. QB
    is the unnormalized proposal mass, not a learned reinforcement-learning action value.'
  evidence:
  - source_id: pezeshki2024value
    locator: Main Sections 2–4.1, Equations 1–5 and Figures 1–3, PDF pp.2–5 / printed pp.2862–2865
    relation: supports
- claim_id: ordered-partition-catalog
  kind: mechanism
  statement: The paper combines each value class with seven partition schemes. simpleVB sorts and makes
    groups whose cardinalities differ by at most one. minVarVB uses greedy Ward agglomeration. equalDistVB
    greedily fills ascending-value groups against cumulative total-mass thresholds; equalDistVB2 reverses
    the sort; equalDistVB3 also forces one node into each new group; equalDistVB4 recomputes a threshold
    from remaining mass and remaining groups. randVB selects distinct cut positions uniformly in the value-sorted
    node sequence. The supplement first returns singletons when the node count does not exceed the positive
    integer state cap. The seven schemes and three value functions specify 21 configurations of this family.
  evidence:
  - source_id: pezeshki2024value
    locator: Main Section 4.2, Algorithms 2–5 and Equations 6–8, PDF pp.5–6 / printed pp.2865–2866; appended
      supplement Sections 5–6, Algorithms 2–10, PDF pp.23–29 / printed pp.2883–2889
    relation: supports
- claim_id: exactness-versus-proxy-similarity
  kind: scope
  statement: 'Theorem 4.1 gives a sufficient exactness condition for AOAS: within each state h*r is a
    common positive multiple of the true Z*R for positive contributions, with zero estimated product for
    zero true product. This uses unknown subtree and ancestral-branching masses. Grouping similar h, h*r
    or proposal values is an implementable heuristic inspired by that condition, and does not establish
    that the unknown ratios agree. Actual representative probabilities must retain support for positive
    contributions.'
  evidence:
  - source_id: pezeshki2024value
    locator: Main Section 4.1, Theorem 4.1, PDF p.5 / printed p.2865; appended supplement Section 3, Definitions
      3.0.1–3.0.3 and Theorems 3.1.0.1 and 3.2.0.1 with proofs, PDF pp.18–20 / printed pp.2878–2880
    relation: supports
- claim_id: partition-boundaries
  kind: limitation
  statement: Mass-threshold groups need not have exactly equal mass or use all available states. The paper’s
    skewed eight-node example leaves three empty groups for equalDistVB and two for equalDistVB2. Greedy
    Ward merging is not a general certificate of the globally best fixed-count partition, and minimizing
    within-group proxy dispersion does not certify minimum variance of the final estimator. randVB preserves
    value order; the separate simpleRand procedure shuffles nodes before balanced grouping and belongs
    to a different random-only family.
  evidence:
  - source_id: pezeshki2024value
    locator: Main Sections 4.2–5, running examples and Algorithms 3–6, PDF pp.5–7 / printed pp.2865–2867;
      appended supplement Section 6, PDF pp.24–29 / printed pp.2884–2889
    relation: supports
- claim_id: partition-cost-scope
  kind: scope
  statement: For N current nodes and constant-cost value evaluation, the paper states O(N log N) time
    and O(N) space for the sorting-based schemes, and O(N squared) time and space for its described accelerated
    minVarVB approach. These are abstraction-step costs under the stated implementation assumptions. They
    exclude heuristic construction, child generation and the full cost of producing enough probes; fixed
    state cap or sample count does not equal fixed runtime.
  evidence:
  - source_id: pezeshki2024value
    locator: Main Complexity paragraph, PDF p.7 / printed p.2867; appended supplement Sections 6.0.1–6.0.7
      and 8.2, PDF pp.24–29,40 / printed pp.2884–2889,2900
    relation: supports
- claim_id: evaluation-and-source-limits
  kind: limitation
  statement: The empirical study compares these configurations within AOAS on five graphical-model benchmark
    families, using weighted mini-bucket heuristics. For large problems without exact Z, it uses an estimated
    reference from long RAND runs. Tables select abstraction granularity by benchmark error, and a weighted
    mini-bucket value substitutes for runs without a positive estimate. Main text describes a 10-hour
    reference, while appended time-series legends label it 100 hours; an exact-DBN supplementary table
    also labels a different time budget from the main exact-problem setting. These inconsistencies and
    the estimated reference prevent treating the results as a uniform independently verified accuracy
    guarantee. No universal winning configuration or fresh direct comparison against all historical external
    samplers is asserted.
  evidence:
  - source_id: pezeshki2024value
    locator: Main Section 6, Tables 1–5 and Figures 4–8, PDF pp.7–10 / printed pp.2867–2870; appended
      supplement Section 7.1.1 Table 1 and Section 7.3 Plots 1–4, PDF pp.30,35–38 / printed pp.2890,2895–2898
    relation: supports
