id: AIMech:ValueBasedAbstractionSampling
name: Value-based abstraction functions for abstraction sampling
aliases:
- Value-based abstraction sampling
concept_kind: mathematical_method
definition: A family of graphical-model sampling abstractions that assigns a positive scalar value to
  each current search node and partitions nodes in value order into abstract states used by the surrounding
  importance-weighted representative sampler.
identity_notes: Compared all 442 pinned AIO and 648 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 8, 0, 0 lines. All eight matched lines were read
  and are earlier discovery-lead metadata, not existing record identities. The older and original checkout
  searches returned no matches, including ignored and hidden files. Semantic matching covered 65 AIO and
  346 native definitions, with every matched definition read. 15 full annotated AIO node/edge/generated
  contexts and 4 full native records were inspected. Retain one parameterized family of ordered value-based
  abstraction functions. HB, HRB and QB choose different scalar node values, while seven schemes determine
  groups. These are components used by AOAS, not an alias for its traversal/weight-backup estimator. Generic
  tree sampling describes weighted representative estimation rather than this partition catalog. K-means
  uses iterative centroid assignment, CURE uses scattered representatives and agglomeration, and neither
  identifies this sampling-abstraction family. The separate simpleRand method, fixed-context RandCB and
  trained GNN abstractions are not aliases. Bare HB, QB and VBA are not claimed aliases.
