id: AIMech:SteinVariationalPolicyGradient
name: Stein Variational Policy Gradient
aliases:
- SVPG
concept_kind: algorithm
definition: A policy optimization method that applies Stein variational gradient descent
  to an entropy-regularized distribution over policy parameters, updating multiple
  policies through kernel-weighted return and prior gradients together with kernel-gradient
  repulsion.
definition_evidence:
- source_id: liu2017-uai
  locator: PDF p.3, Sections3.1–3.2, Eqs.5–8; p.4, Eq.9 and Algorithm1
  relation: supports
identity_notes: The current cohort361 prewrite comparison at base add2c806f6729c8599f4d5cfd6d75c7decde006c
  covered 1,243 maintained records (801 native and 442 pinned AIO), 4,927 identity-field
  occurrences and 3,766 normalized values. Candidate-normalized identity matches were
  empty. Four ignored- and hidden-inclusive fixed-string/word-boundary scans produced
  6,732 occurrences across 1,557 distinct matching contents, assessed through three
  attributed reader scopes and exact inherited-wrapper reconstruction. SVPG denotes
  the source-scoped interacting-policy-particle optimizer, distinct from direct SVGD
  target approximation, amortized differentiable-sampler fitting, SoftQ action sampling,
  REINFORCE, GAE and TRPO. Its policy-objective gradient and kernel interaction do
  not imply an unrestricted KL guarantee, exact samples or mandatory neural architecture.
  Main909 retains 71 citation occurrences, 36 family groupings, five questions and
  three search-only leads, together with original cohort355/359 provenance. The AIO
  reinforcement-learning related_match expresses a task relationship rather than algorithm
  equivalence.
claims:
- claim_id: parameter-distribution-objective
  kind: mechanism
  statement: SVPG optimizes a distribution q over policy parameters using expected
    return minus alpha times KL(q||q0), rather than directly adding entropy to each
    action distribution.
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.3, Section3.1, Eqs.5–6
    relation: supports
- claim_id: normalized-tilted-target
  kind: mechanism
  statement: For positive temperature and a finite normalizer, the entropy-regularized
    target has density proportional to q0(theta) exp(J(theta)/alpha).
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.3, Section3.1, Eq.7
    relation: supports
- claim_id: interacting-policy-update
  kind: mechanism
  statement: Its empirical update combines kernel-weighted return and prior gradients
    with the gradient of the kernel across a population of policy-parameter particles.
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.3, Eq.8; p.4, Eq.9 and Algorithm1
    relation: supports
  - source_id: liu2017-arxiv-v1
    locator: PDF pp.3–4, Section3.2, Eqs.8–9 and Algorithm1; earlier source version
    relation: context
- claim_id: return-gradient-inputs
  kind: scope
  statement: The method accepts policy-return gradient estimates, with finite-difference
    and likelihood-ratio estimators presented as possible inputs; experiments instantiate
    REINFORCE and A2C.
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.2, Section2.2, Eqs.1–4; p.4, Eq.9; p.6, Section5
    relation: supports
- claim_id: actor-critic-update-scope
  kind: scope
  statement: In the reported actor-critic implementation, SVPG updates policy parameters;
    critic parameters retain ordinary TD-error-gradient updates.
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.6, Section5 opening paragraphs
    relation: supports
- claim_id: experimental-comparison-design
  kind: scope
  statement: The paper evaluates interacting policies against independent-policy and
    pooled-data single-policy baselines on four continuous-control tasks, with matched
    total transition counts per training iteration.
  evidence:
  - source_id: liu2017-uai
    locator: PDF p.5, Figure1 and Table1; p.6, Sections5–5.2; p.7, Section5.3
    relation: supports
