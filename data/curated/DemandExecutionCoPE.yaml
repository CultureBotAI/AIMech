id: AIMech:DemandExecutionCoPE
name: Demand-Execution CoPE scheduling
definition: A computation-focused CoPE next-action schema that consults a supplied
  computation allocator and substitutes a required head action when its latest-start
  timeliness test demands execution, otherwise returning the recommended computation
  action.
concept_kind: algorithm
aliases: []
identity_notes: 'The official computation-focused Demand-Execution_A next-action schema:
  consult a supplied computation allocator, then initiate a required next head action
  when the timeliness condition demands execution. Its stepwise action recommendation
  and computation-first control differ from the execution-focused complete-policy
  constructors. Retain the named schema; solver A and its configured policies are
  parameters. The printed W[S] index versus remaining-time meaning, availability of
  the next head action and other literal interface conditions remain unresolved. Do
  not treat the display as a certified implementation or import a general optimality
  theorem. Use the CoPE-qualified descriptive name, aliases[]. No global identity
  is inferred for the generic phrase demand execution. Current insertion identity
  was assessed on 2026-10-16 at merged HEAD 8650bfb55ef0c67902b5a80f1527920c87ad1d9d
  and tree cd6972cabe7b7f1cdf9ca5ee69bd6263a991ba50. The complete inventory contains813
  maintained and442 pinned AIO records,1255 total, with no normalized collision among
  the four candidates. Eight ignored- and hidden-inclusive searches across data/,
  research/, sources/ and docs/ account for167 distinct matching contents and856 match
  events. Of these,105 groups retain exact historical scoped-event attribution and62
  contents received fresh semantic reading with complete relevant parent context.
  The newly added manufacturing record was fully compared;22 prior native contexts
  are byte-identical and retain attributed semantic comparisons. The current mapping
  assessment read21 complete pinned AIO nodes and72 incident edges. The peer independently
  checked the current-state work with original scientific authorship disclosed. This
  is bounded identity clearance for the selected corpus and pin, not universal novelty
  or source exhaustion. Historical131-content/588-occurrence searching used four whole
  checkouts and included review/vendor contexts; it is retained by attribution rather
  than described as the current four-root search. The existing main911 source coordinator
  is accepted for this insertion without merging method identities or closing source
  questions.'
definition_evidence:
- source_id: elboher2023
  locator: Official PDF p.6 Demand-Execution prose and p.7 Algorithm 5.
  relation: supports
claims:
- claim_id: computation-first-recommendation
  kind: mechanism
  statement: Demand-Execution_A first uses a supplied S(AE)^2 algorithm A to choose
    the next process computation under the assumption that no base-level actions are
    executed before computation terminates. The source then tests whether a base action
    is required to keep that recommended process non-tardy, rather than first fixing
    and comparing complete head-initiation policies.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.6, Section 6 computation-focused schemes and Demand-Execution
      paragraph.
    relation: supports
- claim_id: timeliness-triggered-base-action
  kind: mechanism
  statement: For the recommended process, the displayed rule selects the minimum support
    value of its induced-deadline distribution and constructs latest head-start times.
    It compares a selected head action’s scheduled start to the current wall time
    and returns that base action when the equality test holds; otherwise it returns
    the recommended computation action. The identity concerns this timeliness-triggered
    choice, while the printed head-index convention is retained as an unresolved interface
    limitation.
  evidence:
  - source_id: elboher2023
    locator: Official PDF p.7, Algorithms 4–5; p.6 Demand-Execution prose.
    relation: supports
  - source_id: elboher2023-arxiv
    locator: arXiv v1 PDF p.9, Appendix A transition/timeliness expression; p.10,
      older Demand-Execution display. Context for the retained overlap and W-index
      interface limitations, not evidence of exact version equivalence.
    relation: context
- claim_id: next-action-schema-output
  kind: scope
  statement: The official display returns one base-level or computation action for
    the current state. It is a parameterized next-action selector within CoPE, unlike
    the execution-focused schemas which construct and compare combined policies. It
    neither defines the supplied allocator A nor supplies a general optimality theorem,
    a learned policy or the later2025dual-open-list planner.
  evidence:
  - source_id: elboher2023
    locator: Official PDF pp.6–7, Section 6 contrast and Algorithm 5 result declaration.
    relation: supports
limitations:
- The selector operates in the source static CoPE abstraction with supplied distributions
  and sequential non-preemptible base actions. It does not provide online profile
  learning, full planner integration, arbitrary parallel-action execution or a stochastic
  physical-action model.
- The supplied allocator and timeliness tests retain their probability premises. Independence
  is an analysis assumption, and strict deadline survival from1−D(t) differs from
  the inclusive induced-deadline derivation at atoms. An explicit boundary convention
  is required before executable interpretation.
- Algorithm 5 assigns index=W[S], although the MDP defines W as remaining duration
  of the currently executing base action and L as the number of initiated/completed
  actions. The arXiv display retains the same issue. The draft does not substitute
  L or another index and does not diagnose the linked implementation.
- The display does not fully specify eligibility when an action is already executing,
  absent/empty head positions, a completed head, exhausted policy output or no feasible
  process. The model’s legal-action rules still apply. Latest-time scheduling uses
  duration shorthand and requires support-minimum and nonnegative/feasible-start conventions.
- The arXiv earliest-time/timeliness transition expression can add W and a computation
  unit that overlap under its own progress updates. The retained W=1, one-unit remaining
  computation and empty unstarted-head case gives completion atT+1 in the updates
  versusT+2 in the expression. This limits a literal interpretation of model-based
  tardiness without asserting that Demand-Execution code has that behavior.
- The allocation subroutine must declare its state/probability/policy-return contract.
  Conditional hazard denominators need unfinished positive survival, log-failure utilities
  need zero/one boundary treatment and LPF/time scores need positive time. None is
  certified by the wrapper’s call to A.
- Demand-Execution is one of the source’s general-case suboptimal schemes. KID-CoPE
  structural existence results and pseudo-polynomial exact cases concern different
  restricted conditions and do not prove this computation-first rule optimal or complete.
  The arXiv proofs were read without formal verification.
- Official Algorithm 5 and the arXiv older-naming display remain version-specific
  evidence, with unresolved interface correspondence. Refined-Max-LET/IPAE and the2021
  route are not accepted aliases of this selector or of CoPE generally. The author
  main PDF lacks the referenced appendix; no code was downloaded or run.
- Configured simulations over15-puzzle-derived profiles, chosen solvers and action
  durations do not establish calibrated success estimates, universal runtime advantage,
  statistical significance or practical online-planning overhead. Instance ellipses
  and rounded small runtimes are not confidence intervals or exact measurements.
