claims:
- claim_id: bridge-t-coordinatewise-trimmed-screening-and-consensus
  kind: mechanism
  statement: In BRIDGE-T, each nonfaulty node j with |N_j| >= 2b + 1 trims the b largest and b smallest neighbor values in each coordinate k and averages the remaining values with [w_j(t)]_k (Eq. 7-10), which admits an exact representation Omega(t+1) = Y(t) Omega(t) - rho(t) g(t) as a row-stochastic convex combination of nonfaulty nodes only (Eq. 13-15); under Assumption 4 that every reduced graph G_red(b) contains a source component of size >= b + 1, transition matrices Phi(t, t_0) converge geometrically to 1 alpha^T(t_0) and all nonfaulty nodes achieve consensus lim_{t->inf} max_{j in R} ||w_j(t) - v(t)|| = 0 at rate O(sqrt(d) / t) for rho(t) = O(1 / t) (Theorem 1, Eq. 17-23).
  evidence:
  - source_id: r546-primary-pdf
    locator: Section III p. 7 Eq. 7-10; Section IV-A Theorem 1 p. 8-9 Eq. 13-23
    relation: supports
- claim_id: bridge-t-statistical-risk-convergence-convex-and-nonconvex
  kind: scope
  statement: Under i.i.d. node datasets of size N, bounded L-Lipschitz gradients, and Assumption 4, BRIDGE-T with step size rho(t) = 1 / (lambda(t_0 + t)) converges sublinearly at rate O(log t / t) to a statistical risk neighborhood ||w_j(t+1) - w*|| <= O(sqrt(d ||alpha_m||^2 log(2/delta) / N)) / lambda with probability at least 1 - delta for both globally lambda-strongly convex losses (Theorem 2, Eq. 33) and locally lambda-strongly convex nonconvex losses initialized in B(w*, beta_0) (Lemma 4, Theorem 3, Eq. 34).
  evidence:
  - source_id: r546-primary-pdf
    locator: Section IV-B Theorems 2-3 & Lemmas 1-4 p. 10-11 Eq. 29-34; Appendix D p. 18
    relation: supports
- claim_id: bridge-neighborhood-degree-and-reduced-graph-limitation
  kind: limitation
  statement: BRIDGE-T, BRIDGE-K, and BRIDGE-B require minimum neighborhood sizes |N_j| >= 2b + 1, b + 3, and max(4b, 3b + 2) + 1 respectively (Table II), and BRIDGE-T's consensus guarantee requires every reduced graph G_red(b) formed by removing all Byzantine nodes and b incoming edges per nonfaulty node to contain a source component of size >= b + 1 (Assumption 4).
  evidence:
  - source_id: r546-primary-pdf
    locator: Section II-C Assumption 4 p. 5-6; Section III Table II p. 7; Section V-A p. 12-13
    relation: supports
