id: AIMech:BridgeByzantineResilientDecentralizedGradientDescent
name: BRIDGE Byzantine-Resilient Decentralized Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-resilient decentralized empirical risk minimization framework over a directed network G(J, E) of M nodes with up to b Byzantine nodes, in which each nonfaulty node j in R broadcasts its full d-dimensional parameter vector w_j(t) once per iteration, screens incoming neighbor iterates {w_i(t)}_{i in N_j U {j}} into a filtered vector y_j(t) using coordinate-wise trimmed mean (BRIDGE-T, removing the b largest and b smallest values per coordinate k and averaging the remaining |N_j| - 2b + 1 values), coordinate-wise median (BRIDGE-M), Krum (BRIDGE-K), or Krum-plus-trimmed-mean (BRIDGE-B), and updates w_j(t + 1) = y_j(t) - rho(t) grad f_j(w_j(t)).
identity_notes: 'Distinct from ByRDiE (Yang & Bajwa, 2019, which updates and screens one coordinate at a time across d sequential network-wide communication rounds and d local gradient evaluations per iteration) and from ClippedGossip (AIMech:ClippedGossipSelfCenteredClippingForByzantineRobustDecentralizedLearning, which clips neighbor differences in L2 norm around node i''s own state withlocal momentum): BRIDGE (Fang, Yang, & Bajwa, IEEE TSIPN 2022) performs a single full-vector broadcast and gradient step per iteration coupled with neighbor-set statistical screening (BRIDGE-T/-M/-K/-B) and establishes both algorithmic consensus O(sqrt(d)/t) and high-probability statistical sample-complexity convergence O(sqrt(d ||alpha_m||^2 log(2/delta) / N)) on strongly convex and locally strongly convex nonconvex risks.'
