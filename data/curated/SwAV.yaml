name: SwAV
definition: An online self-supervised visual representation-learning procedure that predicts soft prototype
  assignments of one augmented image view from other views, using entropy-regularized balanced assignment
  and jointly learned features and prototypes.
concept_kind: algorithm
identity_notes: SwAV means swapping assignments between views. It uses online soft prototype codes rather
  than offline full-dataset k-means labels, direct pairwise feature negatives, or an exponential-moving-average
  teacher. Its prototype assignments are learned training targets, not verified semantic class labels.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 191 prior
  native IDs/names/aliases. Ignored-inclusive searches of both full checkouts found only prior discovery
  leads (four hits per checkout) and one unrelated main-environment DFSWAVE token. Neighboring SimCLR,
  MoCo, BYOL and DINO procedures and exact AIO definitions/edges were inspected; shared components do
  not establish identity.
limitations:
- Finite Sinkhorn iterations approximate the balanced transport solution. Probability codes must sum to
  one per image; the mass-1 transport matrix with column sums 1/B is not already that probability matrix.
  Exponential scores need numerically stable evaluation.
- The source describes equipartition as preventing identical codes, but also reports uniform collapse
  with strong entropy regularization. Uniform soft assignments satisfy the balance constraints, so balance
  alone is not a general noncollapse theorem.
- The source motivates a feature queue when B is small relative to K. This is an empirical assignment-quality
  issue; the continuous transport polytope is not mathematically empty merely because B<K. Queued features
  can be stale and are not a momentum encoder.
- The main equations and supplement pseudocode use different compact sum/mean conventions. This record
  states averaged cross-entropy explicitly and does not transfer optimizer coefficients between differently
  scaled losses.
- Prototype number, assignment regularization, crop distribution, initial prototype freezing and optimization
  schedule are experimental choices. No semantic clustering guarantee, universal batch-size independence
  or reproduced benchmark is asserted.
