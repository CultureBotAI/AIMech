claims:
- claim_id: method
  kind: mechanism
  statement: Encode augmented views into nonzero features and L2-normalize them; compare them with K trainable
    prototype columns C. For a group of B features Z with positive integer B and K and epsilon>0, approximately
    maximize Tr(Q^T C^T Z)+epsilon H(Q) over nonnegative Q with row sums 1/K and column sums 1/B, where
    H(Q)=−sum_(k,b) Q_kb log Q_kb. Compute the soft transport assignment by Sinkhorn row/column rescaling
    of exp(C^T Z/epsilon), then normalize each column into a probability code q_b (q_b=B Q_:b at exact
    column balance). Stop gradients through codes. For each image, predict a global view’s code from the
    other views using p(v)=softmax(C^T z(v)/tau), tau>0, and cross-entropy −sum_k q_k log p_k, averaged
    over images and valid cross-view pairs. In multicrop training codes are computed from the two global
    crops; predictions use global and smaller crops while excluding the same crop as its code target.
    Update encoder/projection parameters and prototypes by gradients and normalize prototype columns,
    as in the supplement. The small-batch variant augments assignment features with a recent-feature queue
    but uses only current-image codes in the loss.
