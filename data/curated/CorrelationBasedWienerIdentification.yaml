limitations:
- This record covers the inspected two-stage polynomial identification procedure for a real-valued single-input
  single-output cascade, observed exogenous input/output, a time-invariant linear block and independent
  additive measurement noise. The displayed polynomial basis has degrees 1 through k; a constant/intercept,
  multivariable, closed-loop, colored-input or neural variant needs separate treatment.
- Independence removes additive output noise from correlation with a centered input, even if that noise
  has a nonzero mean. It does not by itself remove bias from the second-stage raw-output regression without
  an intercept. Interpreting those fitted coefficients as the system polynomial requires zero-mean noise
  or separately justified offset treatment; subtracting the entire output mean can also remove a real
  nonlinear signal mean.
- Gaussian correlation factorization is a population statement under the specified excitation and finite
  moments. Finite sample correlations, estimated regressors, chosen orders, transients, sampling, noise
  and conditioning affect fitted results. No unconditional unbiasedness, consistency, unique physical
  recovery or generalization guarantee is asserted.
- Practical continuous-time white-noise excitation has finite bandwidth. A delta-correlation approximation
  does not establish exact impulse recovery for arbitrary colored inputs. A literal ideal continuous-white
  signal cannot be passed pointwise through an unrestricted polynomial; discrete iid Gaussian examples
  here are well-defined curator calculations.
- Internal gain requires a normalization or external information. A nonzero excitation mean alone does
  not guarantee a nonzero correlation gain; cancellation can leave the first stage uninformative even
  for a nonconstant nonlinear system.
- All pages of both original reports were visually read. Later journal versions were identified from publisher/registration
  metadata but not compared in full. The broader 1980 report and original correlation-theorem, iterative-estimation
  and parallel-system sources remain follow-up evidence. No training, empirical replication or paid provider
  was run. Records remain DRAFT; author self-review is not independent approval.
