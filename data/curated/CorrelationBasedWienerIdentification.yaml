  relation: supports
claims:
- claim_id: correlation-separation
  kind: mechanism
  statement: The first stage correlates measured output with the centered Gaussian input fluctuation,
    while the actual excitation can include a constant mean. Under the source’s white-Gaussian and independent-output-noise
    assumptions, the population correlation has form beta*h at unit input spectral normalization, where
    h is the LTI impulse response and beta depends on the polynomial and excitation moments. A sampled
    rational transfer function is fitted to that scaled response. Recovering its shape requires beta !=
    0 and a meaningful finite-moment linear response; BIBO stability alone is not a substitute for finite
    filtered variance in an ideal continuous-white formulation.
  evidence:
  - source_id: billings-fakhouri1977-wiener
    locator: Equations 2–12, PDF pp. 5–7 / printed pp. 2–4; finite-moment and nonzero-gain conditions
      are curator qualifications of the displayed factorization
    relation: supports
- claim_id: powers-of-filtered-input
  kind: mechanism
  statement: Apply the estimated scaled linear dynamics to the measured input, including its mean, to
    reconstruct qhat. For a chosen degree k, form columns qhat^j, j=1,...,k, and least-squares fit measured
    output. The displayed Gram inverse requires full column rank; practical solves need numerical conditioning.
    This uses powers of a filtered input, whereas Hammerstein identification filters the individual input
    powers. Polynomial degree, linear order and transient handling remain supplied choices.
  evidence:
  - source_id: billings-fakhouri1977-wiener
    locator: Equations 12–17, PDF pp. 7–8 / printed pp. 4–5; Figure 1, PDF p. 12
    relation: supports
  - source_id: billings-fakhouri1978-hammerstein
    locator: 'Section 2, Equations 15–17, PDF pp. 8–9 / printed pp. 6–7: Hammerstein filtered-input-power
      design'
    relation: supports
- claim_id: scale-reparameterization
  kind: scope
  statement: If the first stage recovers beta*L, the reconstructed internal variable is beta*q, so the
    polynomial coefficient of degree j becomes gamma_j/beta^j. The composite response can be recovered
    without determining the original block gains. In a separate exact zero-state example with h=(1,2),
    u=(1,2,-1), g(v)=v+v² and scale 7, the reconstructed signal is (7,28,21), and coefficients (1/7,1/49)
    give outputs (2,20,12). This verifies the reparameterization, not a stochastic estimator’s accuracy.
  evidence:
  - source_id: billings-fakhouri1977-wiener
    locator: Equations 13–17 and coefficient relation following Equation 15, PDF pp. 7–8 / printed pp.
      4–5; curator exact calculations in research/discovery/correlation-identification-boundaries.py
    relation: supports
- claim_id: nonzero-mean-cancellation
  kind: limitation
  statement: A nonzero input mean does not guarantee an informative first correlation. In the discrete
    iid unit-variance Gaussian example u_t=1+x_t, h=(1,2), q has mean 3 and variance 5. For g(q)=q³-42q,
    Gaussian moments give E[g(q_t)*x_t]=E[g(q_t)*x_(t-1)]=0 although g is nonconstant. An even nonlinearity
    with a zero-DC-gain linear block can also defeat an input mean shift. These curator examples qualify
    the source conclusion; they do not prove that all identification methods fail.
  evidence:
  - source_id: billings-fakhouri1977-wiener
    locator: Equations 6–11, PDF pp. 6–7 / printed pp. 3–4; Conclusions, PDF p. 9 / printed p. 6; curator
      exact Gaussian-moment calculations in research/discovery/correlation-identification-boundaries.py
    relation: supports
