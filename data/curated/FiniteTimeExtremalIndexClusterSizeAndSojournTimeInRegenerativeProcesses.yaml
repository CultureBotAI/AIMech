claims:
- claim_id: finite-time-extremal-index-cluster-size-reciprocity-and-sojourn-second-moment-identity
  kind: mechanism
  statement: For any stationary discrete-time regenerative process with minimum observable period p(U_a) = 1, the finite-time escape probability theta_1(a) = P(X_0 > a, X_1 <= a | X_0 > a) equals the exact reciprocal of the mean cluster size E_{E_a}(N_a) = 1 / theta_1(a) conditioned on cluster entrance E_a = {X_{-1} <= a, X_0 > a} across both Smith's model (theta_1(a) = (1 - e_a)/2, E_{E_a}(N_a) = 2/(1 - e_a)) and deterministic block models (theta_1(a) = e_a(1 - e_a)/g_a, E_{E_a}(N_a) = g_a/[e_a(1 - e_a)]), whereas the unanchored expected sojourn time obeys the exact second-moment identity E_{U_a}(N_a) = (theta_1(a)/2)*(E_{E_a}(N_a^2) + E_{E_a}(N_a)) (Lemma 7, Equation 18), converging to 3/2 != 2 in Smith's model as a -> infty.
  evidence:
  - source_id: r837-primary-pdf
    locator: Section 4.1-4.2, Definitions 1-3 and Equations 9-16, pp. 7-14; Section 6, Lemma 7, Equations 18-20, p. 15
    relation: supports
- claim_id: obrien-finite-horizon-approximation-bound-and-morse-code-correlation-decay
  kind: mechanism
  statement: By factorizing the regeneration event at the second exceedance time j in {2, ..., q}, Lemma 4 proves the sharp finite-horizon O'Brien bound |1 - theta_q(a)/theta_1(a)| <= q P(U_a | R_0) (Equation 17), ensuring theta_q / theta_1 -> 1 whenever q = o(P(U_a | R_0)^{-1}), while Section 3 establishes exponential psi-mixing correlation decay c_n = P(R_{n+1} | R_0) = 1/(2 - p_1) + [(1 - p_1)/(2 - p_1)](p_1 - 1)^n on finite alphabets (Equation 8).
  evidence:
  - source_id: r837-primary-pdf
    locator: Section 3, Equation 8, pp. 6-7; Section 5, Lemma 4 and Remark 5, Equation 17, pp. 14-15
    relation: supports
- claim_id: poincare-recurrence-cylinder-hitting-time-exponential-law-application
  kind: application
  statement: Applied to Poincare recurrence and cylinder hitting times tau_n = inf{t >= 1 | X_t^{t+n-1} = a_0^{n-1}}, replacing the memory-scale horizon q(a, alpha) with the short observable periodicity p(a_0^{n-1}) yields the exponential hitting-time scaling parameter theta_{p(U_a)} directly from characteristic-polynomial root asymptotics r_1 in Smith's model (Equations 10-14) or Euclidean block remainders s_n in the deterministic block model (Equations 15-16).
  evidence:
  - source_id: r837-primary-pdf
    locator: 'Section 1, Application: Hitting times, p. 3; Section 4.2.1-4.2.2, Equations 10-16, pp. 10-14'
    relation: supports
- claim_id: infinite-alphabet-non-psi-mixing-mass-escape-and-cyclic-nonconvergence-limitation
  kind: limitation
  statement: Over an infinite countable alphabet N with non-zero symbol probabilities p_a > 0, the regenerative process fails to be psi-mixing (Section 3, p. 7), the cluster-size distribution in the deterministic block model suffers escape of mass P_E(N_a <= k) -> 0 so the limiting cluster-size expectation does not exist (Section 4.2.2, p. 12), and for n-cylinder hitting in the block model the Euclidean remainder s_n = ceil(n/a)*a - n cycles periodically through {0, ..., a-1} so neither lim_{n->infty} theta_1(n) nor lim_{n->infty} E_E(N_n) exists (Section 4.2.2, p. 13).
  evidence:
  - source_id: r837-primary-pdf
    locator: Section 3, The Infinite case, p. 7; Section 4.2.2, pp. 12-13
    relation: supports
