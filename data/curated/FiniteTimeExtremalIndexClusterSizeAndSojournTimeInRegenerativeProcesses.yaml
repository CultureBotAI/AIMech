id: AIMech:FiniteTimeExtremalIndexClusterSizeAndSojournTimeInRegenerativeProcesses
name: Finite-Time Extremal Index, Cluster Size, and Sojourn Time in Non-Markovian Regenerative Processes
concept_kind: mathematical_method
review_status: DRAFT
definition: A probabilistic extreme-value and quantitative-recurrence formulation for stationary discrete-time non-Markovian regenerative processes (X_n)_{n in Z} generated by i.i.d. symbol draws Z_n ~ (p_a) and run-length laws q_a(k) with finite mean regeneration time nu = sum_a p_a E(q_a) that distinguishes the cluster-entrance mean cluster size E_{E_a}(N_a) (conditioned on E_a = {X_{-p(U_a)} <= a, X_0 > a}) from the unanchored expected sojourn time E_{U_a}(N_a) (conditioned on U_a = {X_0 > a}), proving exact finite-time reciprocity E_{E_a}(N_a) = 1 / theta_{p(U_a)}(a), the stationary second-moment sojourn identity E_{U_a}(N_a) = (theta_1(a)/2)*(E_{E_a}(N_a^2) + E_{E_a}(N_a)), and the O'Brien horizon bound |1 - theta_q / theta_1| <= q P(U_a | R_0).
identity_notes: No AIO class represents finite-time extremal index and sojourn-time clustering identities in non-Markovian regenerative processes; MarkovChain (AIO:MarkovChain) is the closest broad match covering discrete-time stochastic processes and transition/recurrence analysis.
aliases:
- Finite-Time Extremal Index Reciprocity and Sojourn Identity in Regenerative Models
- Abadi-Freitas Non-Markovian Regenerative Extremal Clustering Formulation
