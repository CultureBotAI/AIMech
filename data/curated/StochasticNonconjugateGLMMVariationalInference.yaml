limitations:
- 'The record follows the stochastic natural-parameter derivation with frozen global targets and the full
  covariance moment in Appendix B. It does not certify Algorithm 2 as printed: that display omits Q_i
  in the inverse-Wishart target, and the sequential-looking display can obscure the old-global evaluation
  required by the simultaneous construction.'
- 'Additional source discrepancies are explicit: the Gaussian motivating weight matrix on PDF p. 5 uses
  an identity with the wrong dimension for a general design; Poisson curvature on p. 7 omits an exponential;
  the logistic normal weight on p. 37 omits a half in its exponent, as does the 2013 Section 4.3 display
  on PDF p. 8. The normalized 2013 Appendix B construction on PDF pp. 19–20, likelihood differentiation
  and the full Appendix B target delimit the supported reconstruction. No source implementation is claimed
  corrected or executed.'
- The source sweep sampler and loose local-mean convergence check do not by themselves meet the fresh-batch,
  exact-local-envelope assumptions. Constant or diminishing gains cannot supply missing stability, smoothness,
  moment or local-solution conditions. Neither every iterate nor a sampled estimate must improve the full
  ELBO.
- The factor family still omits dependence with D and across transformed Gaussian blocks. Partial noncentering
  captures restricted dependence in original coordinates, not an arbitrary joint posterior. Priors, initialization,
  numeric quadrature and conditioning affect results. A prior scale based on an estimated information
  inverse requires invertibility.
- All 42 primary 2014 preprint pages and the supporting 21-page 2013 reprint were read. The reported clinical-data
  comparisons and simulated hybrid-fit timings are not curated as clinical conclusions or general accuracy/speed
  guarantees. Source minibatch percentages contain decimal errors; finite-population weights here use
  actual N and b. No fitting, author implementation, diagnostic calibration study or benchmark was run.
- Independent arithmetic checks fixed supplied local Gaussian factors, all uniform subsets/iid draw multisets
  in a tiny example and one simultaneous global step. Those local factors were not optimized, so this
  is not a numerical test of the envelope theorem, a profiled-gradient reproduction or convergence. DRAFT
  remains.
