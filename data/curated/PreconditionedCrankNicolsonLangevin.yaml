claims:
- claim_id: method
  kind: mechanism
  statement: For finite-dimensional pi(u) proportional to exp(−Phi(u)) Normal(u;0,C), with fixed symmetric
    positive-definite C, assume differentiable Phi, choose delta>0 and draw w from Normal(0,C). Set v=((2−delta)u−2
    delta C grad Phi(u)+sqrt(8 delta)w)/(2+delta). Its Gaussian covariance is 8 delta C/(2+delta) squared.
    Let q be that proposal; accept with min(1,pi(v)q(u|v)/(pi(u)q(v|u))) and otherwise retain u, using
    the reverse gradient-dependent mean at v. This finite-dimensional expression specializes the source’s
    general Metropolis rule and pCNL rho acceptance. The prior-cancelled pCN likelihood ratio alone is
    generally insufficient for this gradient-directed kernel.
  evidence:
