claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a complete truth assignment and stop successfully when all clauses are satisfied.
    Otherwise randomly choose an unsatisfied nonempty clause. For each candidate variable in that clause,
    its breakcount is the number of currently satisfied clauses that would become unsatisfied if it were
    flipped. If any candidate has breakcount zero, choose one such candidate at random. Only when there
    is no zero-break candidate, choose a random variable from the selected clause with probability p;
    with probability 1−p choose a candidate of minimum breakcount, breaking ties randomly. Flip the chosen
    variable and repeat under the application’s stopping budget. Breakcount omits how many previously
    unsatisfied clauses become satisfied, so it need not rank candidates like GSAT’s global net-gain score.
    Random restarts are an optional outer strategy; the described 2004 competition configuration uses
    one long run.
  evidence:
  - source_id: method-source
