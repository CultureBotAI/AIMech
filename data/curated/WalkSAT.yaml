name: WalkSAT
definition: A clause-focused SAT local-search algorithm, in its classical SKC formulation, that first
  selects an unsatisfied clause, prioritizes a variable with zero breakcount, and otherwise mixes a random
  variable flip with a minimum-breakcount flip within that clause.
concept_kind: algorithm
identity_notes: 'This record curates the classical SKC variable-selection rule under the commonly used
  WalkSAT name. It does not equate every later WalkSAT heuristic, the earlier underspecified WSAT family
  description, pure clause-first random walk, or global GSAT-with-walk selection with that exact rule.
  The 1994 source gives the clause-first lineage; the authors’ 2004 solver description explicitly supplies
  the zero-break priority and breakcount-based choice. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 316 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 7 and 7 lines respectively.
  All seven unique lines were inspected, and the sorted checkout hit sets were identical: neighboring
  GSAT/WalkSAT mentions and saved review/ledger references, not existing candidate records. Eight exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and four full native neighboring records
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The zero-break branch precedes the noise coin, including at p=1. That setting is therefore not generally
  identical to a pure random-clause/random-variable walk. Removing the priority changes the specified
  SKC heuristic.
- Candidate selection is restricted to the chosen clause and can miss the globally best net-gain flip.
  Minimizing breakcount is different from minimizing breakcount minus makecount; replacing one by the
  other changes the heuristic.
- A finite unsuccessful run does not prove UNSAT, and the pure 2-CNF random-walk guarantee is not automatically
  a guarantee for this SKC policy on general formulas. The noise setting and restart strategy are not
  universal constants.
- The move rule needs a nonempty selected clause and a declared formula representation. Empty clauses
  require separate handling; duplicate clauses, literal normalization and weighted extensions can change
  counts or sampling and are not silently normalized here.
- AutoWalksat, Rnovelty, Rnovelty+ and later software additions are distinct procedures or configurations,
  not exact aliases of this SKC record. No author implementation or numerical solver benchmark was run.
