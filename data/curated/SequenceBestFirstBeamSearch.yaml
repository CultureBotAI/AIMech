name: Best-first beam search with per-length budgets
definition: The sequence-decoding beam procedure of Meister, Vieira and Cotterell that prioritizes active
  hypotheses by decreasing accumulated score, breaks score ties by shorter length, and limits accepted
  expansions to k hypotheses at each sequence length without a future-score heuristic.
concept_kind: algorithm
identity_notes: This is the 2020 sequence-decoding meaning of best-first beam search. Its per-length budget
  is distinct from AIMech:GlobalFrontierBeamSearch, which caps the entire open list. The qualified name
  avoids treating those different pruning rules as exact synonyms. The h=0 procedure is a specialization
  of the paper’s A-star beam framework. No normalized identity match was found across the 442 AIO and
  135 prior native records; ignored-inclusive text hits in the main checkout were prior discovery leads,
  source citations, scope contrasts and DCBSS substring matches, plus seven public certificate-data substring
  matches, not existing concept records.
limitations:
- The finite beam is an approximation to exact sequence-model decoding; equality to a specified beam procedure
  is not global MAP optimality.
- Sequence length limits, EOS handling and compatible deterministic tie conventions are part of the comparison.
  Arbitrary implementations with different stopping or tie rules need not return identical hypotheses.
- Queue counts are counts of retained hypotheses, not total bytes including neural states, model parameters,
  backpointers and temporary successors. No numerical speedup or benchmark-quality claim is curated.
- The beam-equivalence claim is restricted to nonincreasing scores and h=0. The paper also asserts a nonmonotonic
  stop-only extension; this record does not adopt that guarantee because a saved curator finite-tree counterexample
  exposes a conflict with unchanged per-length pruning.
- The optimized queue-of-beams representation can retain hypotheses at several lengths. The per-length
  budget is not a global queue-capacity bound.
