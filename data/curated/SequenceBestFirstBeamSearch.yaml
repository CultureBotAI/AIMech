  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Maintain a score-prioritized agenda and a count for each hypothesis length; skip expansion
    after k hypotheses of that length have been accepted. Under scores that never increase on extension
    and h=0, the paper shows that the top completed hypothesis agrees with its specified width-k layer
    beam, with compatible tie and EOS conventions. Once k hypotheses of a later length have been accepted,
    earlier unfinished layers can be removed under those same monotonicity assumptions.
  evidence:
  - source_id: method-source
    locator: Algorithm 2 and Table 1, printed pp. 797–798 / PDF pp. 3–4; Sections 3.2–4.1, printed pp.
      798–801 / PDF pp. 4–7
    relation: supports
- claim_id: heuristic-boundary
  kind: limitation
  statement: The paper explicitly limits its beam-output equivalence proof to the zero-heuristic case;
    an optimistic future-score heuristic can change which paths survive finite-beam pruning.
  evidence:
  - source_id: heuristic-boundary
    locator: Section 4.1, A Note on Heuristics, printed p. 801 / PDF p. 7
    relation: supports
- claim_id: decoding-context
  kind: application
  statement: The method is defined for sequential structured prediction and developed in the paper around
    natural-language sequence transduction, including translation and abstractive summarization. The decoder
    is separate from the trained model that supplies scores.
  evidence:
  - source_id: decoding-context
    locator: Sections 1–2, printed pp. 795–796 / PDF pp. 1–2
    relation: supports
