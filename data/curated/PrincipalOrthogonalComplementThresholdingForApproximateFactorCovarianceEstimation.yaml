claims:
- claim_id: spiked-pca-factor-consistency-and-least-squares-poet-equivalence
  kind: mechanism
  statement: "Under the canonical approximate factor model $\\boldsymbol{\\Sigma} = \\mathbf{B}\\mathbf{B}' + \\boldsymbol{\\Sigma}_u$ with diagonal $\\mathbf{B}'\\mathbf{B}$ ordered by $\\|\\widetilde{\\mathbf{b}}_1\\| \\ge \\dots \\ge \\|\\widetilde{\\mathbf{b}}_K\\|$ and pervasiveness $\\|\\widetilde{\\mathbf{b}}_j\\|^2 / p \\ge c > 0$ ($j \\le K$), Propositions 2.1 and 2.2 (p. 7) establish that the population eigenvalues $\\{\\lambda_j\\}_{j=1}^p$ and eigenvectors $\\{\\boldsymbol{\\xi}_j\\}_{j=1}^p$ of $\\boldsymbol{\\Sigma}$ satisfy $|\\lambda_j - \\|\\widetilde{\\mathbf{b}}_j\\|^2| \\le \\|\\boldsymbol{\\Sigma}_u\\|$ for $j \\le K$, $|\\lambda_j| \\le \\|\\boldsymbol{\\Sigma}_u\\|$ for $j > K$, and $\\|\\boldsymbol{\\xi}_j - \\widetilde{\\mathbf{b}}_j / \\|\\widetilde{\\mathbf{b}}_j\\|\\| = O(p^{-1}\\|\\boldsymbol{\\Sigma}_u\\|)$ for $j \\le K$. Furthermore, Theorem 2.1 (p. 12) proves that for any $K_1 \\ge 1$, the constrained least-squares factor estimator minimizing $\\|\\mathbf{Y} - \\boldsymbol{\\Lambda}\\mathbf{F}'\\|_F^2$ subject to $\\frac{1}{T}\\mathbf{F}'\\mathbf{F} = \\mathbf{I}_{K_1}$ and diagonal $\\boldsymbol{\\Lambda}'\\boldsymbol{\\Lambda}$ (Equation 2.8) yields idiosyncratic residuals $\\hat{\\mathbf{u}}_t = \\mathbf{y}_t - \\widehat{\\boldsymbol{\\Lambda}}_{K_1}\\hat{\\mathbf{f}}_t$ whose sample covariance $\\widehat{\\boldsymbol{\\Sigma}}_{u,K_1} = \\frac{1}{T}\\sum_{t=1}^T \\hat{\\mathbf{u}}_t\\hat{\\mathbf{u}}_t'$ equals the principal orthogonal complement $\\widehat{\\mathbf{R}}_{K_1}$ (Equations 2.4\u20132.6), so $\\widehat{\\boldsymbol{\\Sigma}}_{K_1} = \\widetilde{\\boldsymbol{\\Sigma}}_{K_1}$ and $\\widehat{\\boldsymbol{\\Sigma}}_K^{-1} = (\\widehat{\\boldsymbol{\\Sigma}}_{u,K}^{\\mathcal{T}})^{-1} - (\\widehat{\\boldsymbol{\\Sigma}}_{u,K}^{\\mathcal{T}})^{-1}\\widehat{\\boldsymbol{\\Lambda}}_K[\\mathbf{I}_K + \\widehat{\\boldsymbol{\\Lambda}}_K'(\\widehat{\\boldsymbol{\\Sigma}}_{u,K}^{\\mathcal{T}})^{-1}\\widehat{\\boldsymbol{\\Lambda}}_K]^{-1}\\widehat{\\boldsymbol{\\Lambda}}_K'(\\widehat{\\boldsymbol{\\Sigma}}_{u,K}^{\\mathcal{T}})^{-1}$ (Equation 2.13)."
  evidence:
  - source_id: flm2013-poet-pdf
    locator: Section 2.1, pp. 5-8, Propositions 2.1-2.2, Equations (2.1)-(2.3); Section 2.2-2.3, pp. 8-12, Equations (2.4)-(2.13), Theorem 2.1; Appendix B, pp. 41-42
    relation: supports
- claim_id: idiosyncratic-dual-rate-thresholding-and-relative-covariance-norm-convergence
  kind: scope
  statement: "Under Assumptions 3.1\u20133.4 and adaptive entrywise threshold $\\tau_{ij} = C\\sqrt{\\hat{\\theta}_{ij}}\\omega_T$ with dual convergence rate $\\omega_T = \\frac{1}{\\sqrt{p}} + \\sqrt{\\frac{\\log p}{T}}$ and $\\hat{\\theta}_{ij} = \\frac{1}{T}\\sum_{t=1}^T (\\hat{u}_{it}\\hat{u}_{jt} - \\hat{\\sigma}_{u,ij})^2$ (Equation 3.2), Theorem 3.1 (p. 15) and Corollary 3.1 (p. 17) prove that with a consistent factor-number estimator $\\widehat{K}$, $\\max_{i,j \\le p}|\\hat{r}_{ij} - \\sigma_{u,ij}| = O_p(\\omega_T)$ and $\\|\\widehat{\\boldsymbol{\\Sigma}}_{u,\\widehat{K}}^{\\mathcal{T}} - \\boldsymbol{\\Sigma}_u\\| = O_p(\\omega_T^{1-q}m_p)$; if $\\omega_T^{1-q}m_p = o(1)$, then $\\widehat{\\boldsymbol{\\Sigma}}_{u,\\widehat{K}}^{\\mathcal{T}}$ is invertible with probability approaching 1 and $\\|(\\widehat{\\boldsymbol{\\Sigma}}_{u,\\widehat{K}}^{\\mathcal{T}})^{-1} - \\boldsymbol{\\Sigma}_u^{-1}\\| = O_p(\\omega_T^{1-q}m_p)$. Whereas the unnormalized spectral norm $\\|\\widehat{\\boldsymbol{\\Sigma}}_{\\widehat{K}} - \\boldsymbol{\\Sigma}\\|$ does not vanish when $p / T \\to \\infty$ because the top $K$ eigenvalues grow at rate $O(p)$ (Section 3.3, p. 17), Theorem 3.2 (p. 18) proves that in the relative Frobenius covariance norm $\\|\\mathbf{A}\\|_{\\boldsymbol{\\Sigma}} = p^{-1/2}\\|\\boldsymbol{\\Sigma}^{-1/2}\\mathbf{A}\\boldsymbol{\\Sigma}^{-1/2}\\|_F$ (Equation 3.3) and max-norm, POET achieves $\\|\\widehat{\\boldsymbol{\\Sigma}}_{\\widehat{K}} - \\boldsymbol{\\Sigma}\\|_{\\boldsymbol{\\Sigma}} = O_p\\left(\\frac{\\sqrt{p}\\log p}{T} + m_p\\omega_T^{1-q}\\right)$, $\\|\\widehat{\\boldsymbol{\\Sigma}}_{\\widehat{K}} - \\boldsymbol{\\Sigma}\\|_{\\max} = O_p(\\omega_T)$, and $\\|\\widehat{\\boldsymbol{\\Sigma}}_{\\widehat{K}}^{-1} - \\boldsymbol{\\Sigma}^{-1}\\| = O_p(m_p\\omega_T^{1-q})$."
  evidence:
  - source_id: flm2013-poet-pdf
    locator: Section 3.1-3.3, pp. 14-19, Equations (3.1)-(3.3), Theorems 3.1-3.2, Corollary 3.1; Appendix C, pp. 42-55
    relation: supports
- claim_id: robustness-to-factor-overestimation-and-known-factor-comparison
  kind: scope
  statement: "Theorem 3.3 (Section 3.3, p. 19) establishes that the convergence rates of $\\widehat{\\boldsymbol{\\Sigma}}_{u,K_1}^{\\mathcal{T}}$, $\\widehat{\\boldsymbol{\\Sigma}}_{K_1}$, and their inverses in Theorems 3.1 and 3.2 hold uniformly over any data-driven factor number $\\widehat{K} \\in [K, K_{\\max}]$ that is bounded above by a fixed constant $K_{\\max}$ and never underestimates $K$ with probability approaching 1, demonstrating that POET is robust to moderate overestimation of the number of factors whereas underestimation ($K_1 < K$) leaves an unremoved spiked factor of spectral norm $O(p)$ in the residual covariance. Furthermore, Section 4 (Theorems 4.1 and 4.2, pp. 19\u201321) shows that when the factors $\\mathbf{f}_t$ are observable, the thresholded OLS residual estimator attains the strictly faster rate $\\tilde{\\omega}_T = \\sqrt{\\frac{\\log p}{T}}$ without the latent-factor cross-sectional estimation overhead $p^{-1/2}$."
  evidence:
  - source_id: flm2013-poet-pdf
    locator: Section 3.3, p. 19, Theorem 3.3; Section 4, pp. 19-21, Theorems 4.1-4.2; Section 6.4, pp. 28-31, Tables 4-6
    relation: supports
