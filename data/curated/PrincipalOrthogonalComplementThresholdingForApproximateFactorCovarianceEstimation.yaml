limitations:
- Convergence of the relative covariance norm $\|\widehat{\boldsymbol{\Sigma}}_{\widehat{K}} - \boldsymbol{\Sigma}\|_{\boldsymbol{\Sigma}} = O_p\left(\frac{\sqrt{p}\log p}{T} + m_p\omega_T^{1-q}\right)$ in Theorem 3.2(i) requires $p = o(T^2 / (\log p)^2)$, whereas precision-matrix and idiosyncratic covariance consistency in spectral norm hold even when $p \gg T^2$ provided $\omega_T^{1-q}m_p = o(1)$.
- POET requires the common factors to be pervasive ($\lambda_{\min}(p^{-1}\mathbf{B}'\mathbf{B}) > c > 0$, Equation 2.3) so that the leading $K$ eigenvalues of $\boldsymbol{\Sigma}$ separate at rate $O(p)$ from the bounded idiosyncratic spectrum $\|\boldsymbol{\Sigma}_u\| < \infty$; weak or semi-strong factors whose loadings grow slower than $O(\sqrt{p})$ violate Proposition 2.1's $O(p^{-1})$ eigenvector separation bound.
- 'Primary-source typographical audit of `arXiv:1201.0175v2`: (1) Section 6.4 line 2 (p. 28) spells ''consistent esimator $\widehat{K}$'' (''esimator'' instead of ''estimator''); (2) Section 7.2 line 13 (p. 34) writes ''where as the sample covariance does not process such a property'' (''where as'' and ''process'' instead of ''whereas'' and ''possess''); (3) Appendix B Proof of Proposition 2.1 line 5 (p. 41) writes ''$\mathbf{B}\mathbf{B}$'' omitting the transpose prime in ''$\mathbf{B}\mathbf{B}''$'', and Proof of Proposition 2.2 line 4 (p. 41) spells ''Prosposition 2.1''; (4) Appendix B Proof of Theorem 2.1 line 2 (p. 42) writes ''$\widehat{\boldsymbol{\Sigma}}_u \frac{1}{T}(\mathbf{Y} - \widehat{\boldsymbol{\Lambda}}\widehat{\mathbf{F}}'')(\mathbf{Y}'' - \widehat{\mathbf{F}}\widehat{\boldsymbol{\Lambda}}'') = \frac{1}{T}\mathbf{Y}\mathbf{Y}'' - \widehat{\boldsymbol{\Lambda}}\widehat{\boldsymbol{\Lambda}}'' . where'' omitting the ''$=$'' sign after ''$\widehat{\boldsymbol{\Sigma}}_u$''; (5) Appendix C.1 Proof of Lemma C.4 display (p. 43) writes ''$\ge cp\|\boldsymbol{\Sigma}_u\| \ge cp/2$'' omitting the minus sign in ''$\ge cp - \|\boldsymbol{\Sigma}_u\| \ge cp/2$''; (6) Appendix C.2 Proof of Lemma C.10(ii) line 8 (p. 48) writes ''$O_p(1/\sqrt{T} + \sqrt{p})$'' instead of ''$O_p(1/\sqrt{T} + 1/\sqrt{p})$'', and Proof of Corollary 3.1 line 4 (p. 49) writes ''$\|\mathbf{b}_i\|\mathbf{f}_t\|$'' missing a norm bar; and (7) Appendix C.3 line 5 (p. 52) writes ''One the other hand'' instead of ''On the other hand''.'
