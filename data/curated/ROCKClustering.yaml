claims:
- claim_id: method
  kind: mechanism
  statement: On the clustering sample choose a symmetric similarity in [0,1] and threshold theta. Define
    N(i)={j!=i:sim(i,j)>=theta} and link(i,j)=|N(i) intersect N(j)|; excluding each point from its own
    neighbor list reproduces the paper’s worked link counts. For clusters A,B set Link(A,B)=sum_(i in
    A,j in B)link(i,j). Starting from singletons, merge the pair maximizing g(A,B)=Link(A,B)/[(|A|+|B|)^(1+2f)−|A|^(1+2f)−|B|^(1+2f)].
    The paper’s experimental configuration uses f(theta)=(1−theta)/(1+theta); use 0<=theta<1 so f>0 and
    the denominator is positive. Update cross-cluster links additively after a merge. Stop at the requested
    cluster count or when every remaining cross-cluster link count is zero. The optional large-data procedure
    clusters a random sample and labels other observations using representative subsets L_i, choosing
    the cluster maximizing its threshold-neighbor count divided by (|L_i|+1)^f.
  evidence:
  - source_id: method-source
