name: ROCK clustering
definition: An agglomerative clustering procedure that merges clusters using shared-neighbor link counts
  divided by a cluster-size normalization derived from a neighborhood model.
concept_kind: algorithm
identity_notes: ROCK is Guha et al.’s RObust Clustering using linKs procedure, designed for categorical
  or other similarity-based data. Links count common neighbors rather than direct similarities or graph
  cut weights. The normalized goodness is a heuristic and is not simply maximum shared-neighbor count.
  The record follows the 1999 conference article, not an uninspected expanded journal version. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 223 preceding native IDs/names/aliases.
  Word-delimited fixed-string searches of both full checkouts, including ignored and hidden files, returned
  2 worktree lines in discovery context and 6 main-checkout lines including four unrelated ignored dependency
  matches. Six neighboring native records and nine exact AIO nodes with scoped synonyms and outgoing edges
  were inspected.
limitations:
- The paper introduces a neighborhood-size model and chooses f(theta) for its experiments; the normalization
  is not a universal theorem for every supplied similarity or data distribution. theta=1 makes the displayed
  experimental-normalization denominator zero.
- The graph and shared-neighbor counts depend on the supplied sample, similarity and threshold. Categorical
  attribute-value encoding with Jaccard similarity is one stated construction; shared-neighbor links do
  not guarantee semantic clustering.
- The source’s prose explicitly allows termination above the requested count when all cross-links vanish.
  Forcing arbitrary zero-link merges changes that stopping convention.
- Sampling and outlier details omitted from the conference article are deferred to its cited full report.
  This record does not invent those procedures or claim a benchmark/runtime advantage. No clustering implementation
  was executed.
