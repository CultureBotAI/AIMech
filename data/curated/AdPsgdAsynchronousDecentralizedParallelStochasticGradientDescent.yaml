id: AIMech:AdPsgdAsynchronousDecentralizedParallelStochasticGradientDescent
name: AD-PSGD (Asynchronous Decentralized Parallel Stochastic Gradient Descent)
concept_kind: algorithm
review_status: DRAFT
definition: 'An asynchronous decentralized stochastic optimization algorithm (Lian, Zhang, Zhang, & Liu 2018, Section 3, Algorithm 1, Equation 2) for non-convex objectives (1/n) sum_{i=1}^n f_i(x) in which each worker i continuously computes a stochastic gradient g(hat_x^{i_k}; xi^{i_k}) on a local parameter snapshot hat_x^{i_k} = x_{k - tau_k}^{i_k} (with bounded staleness tau_k <= N) and atomically averages its model parameters with a randomly selected neighbor via a symmetric doubly stochastic gossip matrix W_k in R^{n x n}: X_{k+1} = X_k W_k - gamma G_bar(hat_X_k; xi_k), where G_bar(hat_X_k; xi_k) has g(hat_x^{i_k}; xi^{i_k}) in column i_k and zeros elsewhere.'
identity_notes: Distinct from synchronous D-PSGD (Lian et al. 2017), which blocks all n workers at a global barrier at every iteration so step time is dictated by the slowest worker max_{i in [n]} t_i, and from centralized Asynchronous Parallel SGD (Hogwild! / Lian et al. 2015), which suffers a central parameter-server communication bottleneck and lacks peer-to-peer doubly stochastic gossip averaging W_k.
aliases:
- AD-PSGD
- Asynchronous Decentralized Parallel Stochastic Gradient Descent
- Asynchronous Decentralized Parallel SGD
