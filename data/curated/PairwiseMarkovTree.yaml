claims:
- claim_id: method
  kind: mechanism
  statement: On a finite fixed rooted tree with one parent for each nonroot site, specify a normalized
    root law p(z_r) and normalized kernels K_s(z_s|z_parent(s)); their product defines the joint paired
    distribution. At fixed complete y, the hidden posterior factors on the same rooted tree. Set beta_s(x_s)=1
    at leaves and compute each internal beta_s(x_s) as the product over children t of sum_(x_t) K_t(x_t,y_t|x_s,y_s)*beta_t(x_t).
    The root posterior is proportional to p(x_r,y_r)*beta_r(x_r). Each child posterior transition at fixed
    parent is proportional to K_t*beta_t and normalized over x_t. Propagate the root marginal downward
    through these conditional kernels to obtain all hidden-site marginals. Classical independent-emission
    hidden Markov trees result from root pi(x_r)*b(y_r|x_r) and child kernels A(x_t|x_s)*b(y_t|x_t). General
    joint kernels can leave hidden siblings dependent given only their hidden parent, so the hidden marginal
    need not itself be a Markov tree.
