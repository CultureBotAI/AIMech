name: Pairwise Markov tree
definition: A latent-variable tree-model family whose paired hidden and observed states factor into a
  root distribution and parent-to-child conditional kernels on a fixed rooted tree, without requiring
  the hidden marginal to be Markov on that tree.
concept_kind: model_family
identity_notes: Pairwise denotes Z_s=(X_s,Y_s), not generic pairwise edge potentials. The tree is the
  stochastic dependence topology across sites, rather than a decision-tree classifier, hierarchical mixture-of-experts
  gate structure, or hidden Markov decision tree’s within-time state hierarchy. An ordinary memoryless-emission
  hidden Markov tree is a constrained special case. A path is a degenerate tree, but the family permits
  branching dependencies absent from a sequential chain. No normalized identity match was found across
  all 442 pinned AIO labels and all scoped synonyms and 391 preceding native IDs, names and aliases for
  the three selected concepts. Full-checkout fixed-string searches included ignored and hidden files in
  both worktree and main, yielding 9 and 9 matched lines; all 7 unique contents were read. Hits are prior
  leads and references, not records of the proposed identities. All 89 semantic label/synonym hits and
  21 fully annotated exact AIO CLASS nodes with outgoing edges were read. Twenty-two contextual YAMLs
  were byte-verified after prior full reading and five freshly read, totaling 21 generated and six native
  contextual records. Short acronym identities were compared across the complete normalized inventory.
  Absence is bounded to the pinned source, maintained collection and inspected semantic neighborhood.
limitations:
- The definition uses a fixed finite rooted tree; it is not a graph-structure learning algorithm, a loopy-field
  model or a decision-making policy. Exact tree recursions require finite hidden states or separately
  tractable integrals.
- Posterior formulas require nonzero observation evidence and valid conditional support. Numerical scaling
  can be needed on large trees; the factorization alone does not address parameter estimation, missing
  observations or arbitrary topology changes.
- Independence of the child hidden-state transition from the parent observation is sufficient for a hidden
  Markov-tree marginal. Proposition 3.2 asserts necessity under the additional hypotheses that each internal
  node has at least two children with identical conditional laws given its paired parent; that converse
  is not adopted without those hypotheses.
- Correlated observations can coexist with a Markov hidden marginal. Non-Markov projection is permitted,
  not required, and memoryless site emissions are not necessary for every hidden-Markov special case.
- The four-page source proves structural and inference results; it does not report a comparative empirical
  evaluation or establish universal segmentation superiority. Later parameter-estimation and image-processing
  papers remain separate evidence leads.
