id: AIMech:MeasuredContinuousGreedySubmodularMaximization
name: Measured Continuous Greedy Algorithm for Constrained Monotone and Non-Monotone Submodular Maximization
concept_kind: algorithm
review_status: DRAFT
definition: 'Measured Continuous Greedy is a unified continuous relaxation algorithm for maximizing the multilinear extension F(y) = E[f(R(y))] of a non-negative (monotone or non-monotone) submodular set function f: 2^N -> R_+ over any down-monotone solvable polytope P subseteq [0, 1]^N up to a configurable stopping time T >= 0, introduced by Feldman, Naor, and Schwartz (2011). Starting from y(0) = 1_emptyset with time step delta = T * ceil(n^5 * T)^{-1}, at each time t < T the algorithm evaluates the residual marginal gains w_e(t) = F(y(t) vee 1_e) - F(y(t)) = (1 - y_e(t)) * partial_e F(y(t)) for all e in N, solves the linear program I(t) = argmax_{x in P} (x . w(t)), and updates each coordinate via the distorted differential step y_e(t + delta) = y_e(t) + delta * I_e(t) * (1 - y_e(t)) (Algorithm 1, Line 8), compensating for the factor 1 - y_e(t) between residual increase and partial_e F(y(t)) while bounding every coordinate by y_e(t) <= 1 - e^{-t} + O(delta) (Lemma III.6).'
identity_notes: "Distinct from AIMech:ContinuousGreedyAndMultilinearExtensionForMatroidSubmodularMaximization (Round 349, Calinescu et al. 2011), which updates y_e(t + delta) = y_e(t) + delta * I_e(t) without the (1 - y_e(t)) damping factor\u2014causing coordinates to reach 1 too quickly and failing on non-monotone submodular functions where F(y(t) vee 1_{OPT}) requires bounding max_e y_e(t) <= 1 - e^{-t} via Lemma III.5\u2014and which cannot run past stopping time T = 1 on high-density monotone packing polytopes."
aliases:
- Measured Continuous Greedy
- Unified Continuous Greedy Algorithm
- Feldman-Naor-Schwartz Measured Continuous Greedy
