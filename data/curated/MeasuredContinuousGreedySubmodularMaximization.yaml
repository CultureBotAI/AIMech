claims:
- claim_id: r368-claim-nonmonotone-exponential-coordinate-cap-and-one-over-e-approximation
  kind: mechanism
  statement: For any non-negative submodular function f, down-monotone solvable polytope P subseteq [0, 1]^N, and stopping time T in [0, 1], Measured Continuous Greedy (Algorithm 1) produces y(T) with y(T)/T in P (Lemma III.1) and y_e(t) <= 1 - (1 - delta)^{t/delta} <= 1 - e^{-t} + O(delta) for all e in N and 0 <= t <= T (Lemma III.6); because F(x vee 1_S) >= (1 - max_e x_e) * f(S) for any non-negative submodular function (Lemma III.5), each step satisfies F(y(t + delta)) - F(y(t)) >= delta * [e^{-t} * f(OPT) - F(y(t))] - O(n^3 * delta^2) * f(OPT) (Corollary III.7), which integrates to F(y(T)) >= [T * e^{-T} - o(1)] * f(OPT) (Theorem I.1, Corollary III.10) and yields a (1/e - o(1))-approximation at T = 1 for non-monotone submodular maximization subject to a matroid constraint (via pipage rounding, Theorem IV.1) or O(1) knapsack constraints (Corollary IV.3).
  evidence:
  - source_id: r368-primary-pdf
    locator: Section I-A, Theorem I.1, p. 572; Section II, Observation II.2 and Theorem II.3, p. 574; Section III-A, Algorithm 1, Lemmas III.1-III.9, and Corollaries III.4, III.7, III.10, pp. 575-576; Section IV-A, Theorems IV.1-IV.2 and Corollary IV.3, p. 577
    relation: supports
- claim_id: r368-claim-monotone-polytope-density-stopping-time-and-partition-welfare-tightness
  kind: mechanism
  statement: For any normalized monotone submodular function f and packing polytope P defined by constraints sum_{e in N} a_{i,e} * x_e <= b_i with density d(P) = min_{1<=i<=m} b_i / sum_{e in N} a_{i,e}, the distorted update guarantees y_e(T) <= 1 - e^{-I_e^T} + O(delta)*T where sum_{e in N} a_e * I_e^T <= T * b (Lemmas III.16-III.17) and worst-case concavity occurs when all active I_e^T are equal (Lemmas III.18-III.19), ensuring y(T) in P for all stopping times T <= T_P = -ln(1 - d(P) + n*delta) / d(P) > 1 with F(y(T)) >= [1 - e^{-T} - o(1)] * f(OPT) (Theorem I.2, Corollary III.15, Corollary III.20); on binary polytopes this yields a [1 - (1 - d(P))^{1/d(P)}]-approximation (Theorem I.3), giving a polynomial-time (1 - (1 - d/r)^{r/d})-approximation for the (d, r)-Submodular Partition problem (Lemma IV.5), the tight (1 - (1 - 1/k)^k)-approximation for k-player Submodular Welfare (Corollary IV.7), and a tight 3/4-approximation for Submodular Max-SAT (Corollary IV.9).
  evidence:
  - source_id: r368-primary-pdf
    locator: Section I-A, Theorems I.2-I.3 and Table I, pp. 572-573; Section III-B, Observation III.11, Corollaries III.12, III.15, III.20, and Lemmas III.13-III.19, pp. 576-577; Section IV-B, Observations IV.4, IV.6, IV.8, Lemma IV.5, and Corollaries IV.7, IV.9, pp. 577-578
    relation: supports
- claim_id: r368-claim-merged-stopping-time-contention-resolution-extension
  kind: application
  statement: When combined with a monotone (b, c)-balanced contention resolution scheme for a constraint family I, running Measured Continuous Greedy up to stopping time T = b directly produces a re-normalized fractional point y(b) in b * P(I) (by Lemma III.1) with F(y(b)) >= [b * e^{-b} - o(1)] * f(OPT) for non-monotone f and F(y(b)) >= [1 - e^{-b} - o(1)] * f(OPT) for monotone f, improving the black-box contention resolution approximation ratio from alpha * b * c to (e^{-b} * b * c - o(1)) for non-monotone submodular functions and ((1 - e^{-b}) * c - o(1)) for monotone submodular functions (Theorem I.4).
  evidence:
  - source_id: r368-primary-pdf
    locator: Section I-A3, Theorem I.4, p. 573
    relation: supports
