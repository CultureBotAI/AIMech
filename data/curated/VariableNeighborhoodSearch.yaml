    Historical primary and draft inspections retain their separately recorded source scopes. The fourteen
    inspected targets are MathematicalFunction, TrainingStrategy, ReinforcementLearning, ReinforcementLearningLLM,
    SupervisedLearning, UnsupervisedLearning, MetaLearning, MachineLearningTask, KnearestNeighborAlgorithm,
