id: AIMech:VariableNeighborhoodSearch
name: Variable neighborhood search
concept_kind: algorithm
aliases: []
definition: A local-search metaheuristic that repeatedly perturbs an incumbent through an indexed collection
  of neighborhoods, locally optimizes the perturbed point, resets the neighborhood index after strict
  incumbent improvement and advances it after failure, under a declared stopping rule.
definition_evidence:
- source_id: mladenovic1997
  locator: Section 2, PDF pp. 1–2 / printed pp. 1097–1098, especially the basic VNS algorithm on p. 1098.
  relation: supports
claims:
- claim_id: configured-neighborhood-controller
  kind: scope
  statement: Choose an initial feasible incumbent x and a finite indexed collection of shaking neighborhood
    structures N_1 through N_kmax. The basic VNS controller varies which neighborhood supplies the next
    perturbed starting point. Successive neighborhoods are often nested, but nesting is not required by
    the stated method.
  evidence:
  - source_id: mladenovic1997
    locator: Section 2, PDF pp. 1–2 / printed pp. 1097–1098, neighborhood questions, initialization and
      paragraph after the main step.
    relation: supports
- claim_id: random-shaking-and-local-optimization
  kind: mechanism
  statement: At the current neighborhood index k, generate x_prime at random from N_k(x), then apply a
    configured local-search method with x_prime as its initial solution. Denote its locally optimized
    result by x_double_prime. The source does not prescribe a uniform sampling distribution, and the shaken
    point need not improve the incumbent.
  evidence:
  - source_id: mladenovic1997
    locator: Section 2, PDF p. 2 / printed p. 1098, main step 2(a–b) and the subsequent descent characterization.
    relation: supports
- claim_id: strict-improvement-reset
  kind: mechanism
  statement: In the basic descent version, if x_double_prime is strictly better than the incumbent, replace
    x by x_double_prime and reset k to 1. Otherwise retain the incumbent and advance k by one. The improvement
    test is applied after local optimization; it is not a requirement that every intermediate perturbation
    improve the objective.
  evidence:
  - source_id: mladenovic1997
    locator: Section 2, PDF p. 2 / printed p. 1098, main step 2(c) and characterization as a descent,
      first-improvement method.
    relation: supports
- claim_id: separate-local-search-neighborhood
  kind: mechanism
  statement: The baseline local-search routine may use a fixed neighborhood distinct from the shaking
    neighborhoods, and that neighborhood need not belong to the selected collection N_1 through N_kmax.
    The source also discusses changing local-search neighborhoods as an extension; the basic controller
    does not require that extension.
  evidence:
  - source_id: mladenovic1997
    locator: Section 2, PDF p. 2 / printed p. 1098, variant (iii), distinction between steps 2(a) and
      2(b).
    relation: supports
- claim_id: repeated-budgeted-main-cycle
  kind: scope
  statement: The main neighborhood cycle can be repeated until a declared stopping condition, such as
    a maximum iteration count, CPU-time allowance or iterations without improvement. The basic strict-improvement
    controller is distinguished from the paper’s optional descent-ascent, best-neighborhood and generalized
    index-schedule variants.
  evidence:
  - source_id: mladenovic1997
    locator: Section 2, PDF p. 2 / printed p. 1098, paragraph following the main step and variants (i–iii);
      Section 4, PDF p. 4 / printed p. 1100.
    relation: supports
limitations:
- The printed main loop says until k=k_max although initialization lists N_1 through N_kmax. That endpoint
  wording does not unambiguously specify whether the last listed neighborhood is processed, especially
  when k_max=1. The mechanism description preserves the reset and advancement rules without claiming a
  uniquely reconstructed executable loop.
- Random sampling is not specified as uniform and does not guarantee that samples never repeat. The anti-cycling
  motivation is not a proof of cycle freedom. An unsuccessful shaken point followed by local search does
  not exhaust its shaking neighborhood or certify that no improving point exists there.
- Strictly improving accepted incumbents imply only finitely many accepted improvements when the feasible
  solution set is finite. This hand consequence does not ensure termination of an arbitrary inner optimizer
  or an outer loop lacking a finite stopping rule, and does not prove convergence to a global optimum
  or a finite-run optimality certificate.
- Neighborhood feasibility, coverage, sampling, the inner optimizer and its stopping convention must be
  declared. A local optimum is relative to that inner method’s neighborhood and accuracy, not automatically
  to every shaking neighborhood. Nested neighborhoods and connectivity are not supplied as universal guarantees
  by the basic description.
- The source’s optional floor-based neighborhood-increment expression can give zero. It is outside the
  selected basic k:=k+1 schedule and is not silently repaired or promoted to a verified executable variant.
  Accepting worsening incumbents, taking the best among multiple neighborhoods or adding tabu-style mechanisms
  likewise requires its separately stated variant choices.
- Evidence here is the four-page 1997 article and its basic controller, not an author-code execution or
  benchmark reproduction. GENIUS/TSP and traveling-salesman-with-backhauls comparisons do not establish
  universal speed, quality or complexity claims. Detailed GENI formulas and numerical table values extracted
  from the scanned pages are not asserted as exact implementation specifications.
