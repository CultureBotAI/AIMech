identity_notes: Gent and Walsh1995 Figure1 defines the source-scoped HRSAT candidate-pool coin followed
  by history selection in either pool. The accompanying prose wording is retained as an ambiguity. Later
  UBCSAT1.0.0 HWSAT uses a clause-first uniform random variable rule and is comparative evidence, not
  an exact alias. Existing HSAT, IHSAT, GSAT-with-random-walk, WalkSAT and AutoWalksat have distinct pool,
  picking or outer-controller scopes. At clean merged base14e9168ee3496e914545ae5c449e3ee190f0294b, the
  current inventory has786 native and442 pinned AIO records:4876 identity-field occurrences,3723 normalized
  values, and no candidate collision. Four full-checkout searches included ignored and hidden files; all1329
  distinct matching contents (23381 occurrences) were read by the attributed root/team partitions, with18
  contextual fields across ten neighboring records assessed separately. This is bounded identity evidence,
  not proof of universal semantic absence.
