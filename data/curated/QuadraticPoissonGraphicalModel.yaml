claims:
- claim_id: method
  kind: mechanism
  statement: On a finite graph with X_i in {0,1,...}, define p(x)=Z^(-1)*exp[sum_i a_i*x_i+sum_i d_i*x_i^2+sum_(i<j)
    b_ij*x_i*x_j], with symmetric edge coefficients and finite Z. The site conditional is proportional
    to exp(d_i*k^2+eta_i*k), k>=0, where eta_i=a_i+sum_(j!=i) b_ij*x_j. There is no factorial base measure
    in this construction. Define the symmetric matrix H with H_ii=d_i and H_ij=b_ij/2 for i!=j, so the
    quadratic contribution is x^T H x without double counting. A sufficient validity condition is x^T
    H x<=-c*||x||^2 for some c>0 on the nonnegative orthant; finite linear terms are then dominated by
    quadratic decay. Negative definiteness of H on the whole real space is one sufficient condition and
    permits either sign of the off-diagonal interactions. It is not asserted to be a necessary characterization
    of all admissible parameters.
