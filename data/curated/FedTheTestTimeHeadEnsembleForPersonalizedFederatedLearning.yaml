claims:
- claim_id: r468-feature-similarity-temperature-scaling-and-entropy-simplex-adaptation-mechanism
  kind: mechanism
  statement: Combines test-time prediction entropy minimization min_{(e, 1-e) in Delta^1} H(softmax(e z_g + (1 - e) z_p)) (Algorithm 1, Line 8) with feature-space cosine-similarity temperature scaling tau_g = 1 - lambda_s + epsilon, tau_l = lambda_s + epsilon where lambda_s = clip(cos(z'_t, h_hat_m), 0, 1) measures alignment between the test representation EMA z'_t and the client's local training representation centroid h_hat_m (Algorithm 1, Lines 11-13), upweighting h_{p_m} on in-distribution samples (lambda_s -> 1) and upweighting h_g on out-of-client samples (lambda_s -> 0).
  evidence:
  - source_id: r468-primary-pdf
    locator: Section 4.2 Test-Time Adaptive Head Ensemble for Single Test Sample & Algorithm 1 (Lines 6-14), pp. 5-7
    relation: supports
- claim_id: r468-single-sample-batch-free-and-fedthe-plus-finetuning-scope
  kind: scope
  statement: Operates on single streaming test samples (batch size 1) by optimizing only two scalar ensemble weights (e, 1 - e) rather than high-dimensional batch normalization parameters, and extends to FedTHE+ by adding one epoch of local fine-tuning of both backbone and local head prior to computing h_hat_m (Section 4.1 & Table 1).
  evidence:
  - source_id: r468-primary-pdf
    locator: Section 4.1 Low-Cost Personalized FL Training, Section 4.2 Why Simple Entropy Minimization Does Not Work Well, & Section 5.2 Table 1, pp. 5-8
    relation: supports
- claim_id: r468-overconfident-local-head-on-unseen-classes-limitation
  kind: limitation
  statement: Pure test-time entropy minimization on two-head logits can be misled when a client's local personalized head trained on a skewed subset of classes produces overconfident low-entropy wrong predictions on unseen classes, necessitating the feature-space cosine similarity term lambda_s and assuming unimodal class-representation clustering around h_hat_m.
  evidence:
  - source_id: r468-primary-pdf
    locator: Section 4.2 Why Simple Entropy Minimization Does Not Work Well & Feature-Space Adaptation, pp. 5-6, and Appendix D Ablation Study, p. 19
    relation: supports
- claim_id: r468-co-occurring-id-and-ood-federated-test-evaluation-application
  kind: application
  statement: Applied to personalized federated image classification on CIFAR-10, CIFAR-100, and ImageNet-32 under co-occurring in-distribution label skew, global out-of-client class shift, and Hendrycks CIFAR-10-C/CIFAR-100-C common corruptions.
  evidence:
  - source_id: r468-primary-pdf
    locator: Section 5 Experiments (Tables 1-2, Figures 1-3), pp. 2, 7-9
    relation: supports
