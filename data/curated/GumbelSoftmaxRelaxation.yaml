claims:
- claim_id: method
  kind: mechanism
  statement: For n≥2 categories with positive finite weights alpha_i and temperature tau>0, draw independent
    standard Gumbel G_i and set y_i=exp((log(alpha_i)+G_i)/tau) divided by the sum of those exponentials.
    Normalizing alpha beforehand only adds a common log shift and leaves y unchanged. Each draw has positive
    components summing to one and is differentiable in the log weights at positive temperature. Holding
    the base noise fixed allows the chain rule to estimate gradients of a differentiable objective evaluated
    on this relaxed random vector, under the usual conditions permitting differentiation under expectation.
    Argmax rounding has categorical probabilities alpha_i/sum(alpha) for every positive temperature; using
    the same noise while tau tends to zero yields the corresponding one-hot sample almost surely. For
    fixed finite perturbed scores, tau tending to infinity yields the uniform vector. The relaxed vector
    at finite temperature is not itself a categorical one-hot draw.
  evidence:
  - source_id: method-source
    locator: Section2, Equations(1)–(3), Figure1 and Section2.1, PDF/printed pp.2–3
    relation: supports
  - source_id: concrete-source
    locator: Sections3.1–3.3, Equations(9)–(13), Definition1 and Proposition1, PDF/printed pp.4–7; Section4
      concurrent-work distinction, p.7
    relation: supports
- claim_id: distribution-identity
  kind: scope
  statement: The Gumbel-Softmax paper explicitly calls the independently discovered distribution Concrete.
    Its normalized-probability formula and the Concrete paper’s unnormalized-weight formula produce the
    same simplex random vector after the common normalization shift cancels. The Concrete discussion distinguishes
    this shared distribution from choices of relaxed training objective.
  evidence:
  - source_id: method-source
    locator: Section2, Equation(2) and concurrent-discovery paragraph, PDF/printed p.2
    relation: supports
  - source_id: concrete-source
    locator: Section3.2, Equation(10), PDF/printed p.5; Section4, p.7
    relation: supports
- claim_id: objective-boundary
  kind: limitation
  statement: For variational training, the Concrete paper uses densities matching the relaxed prior and
    posterior in its relaxed objective, then evaluates the discrete objective at test time. It warns that
    naive insertion of soft states into discrete log-mass terms need not preserve the intended lower-bound
    interpretation. This source-specific distinction is not an assertion that every version of every Gumbel-Softmax
    implementation uses the same loss.
  evidence:
  - source_id: concrete-source
    locator: Section3.3, Equations(12)–(13), PDF/printed p.6; Section4, p.7
    relation: supports
