name: Gumbel-Softmax relaxation
definition: A continuous relaxation of a finite categorical random variable obtained by applying softmax
  to independent Gumbel-perturbed log weights divided by a positive temperature, producing a differentiable
  random vector in the simplex interior.
concept_kind: mathematical_method
identity_notes: 'Gumbel-Softmax and Concrete identify the same positive-temperature distributional construction:
  the two inspected primary papers explicitly acknowledge the concurrent work, and their sampling formulas
  agree after normalizing positive weights. This record covers that shared relaxation and its pathwise-gradient
  use. It does not equate all training objectives in the papers, the hard Gumbel-Max sample, generic deterministic
  softmax, or the separate straight-through estimator. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 331 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 11 and 11 lines respectively.
  All 10 unique hit contents were inspected: neighboring Gumbel-Top-k contrasts, saved review and ledger
  references, new source leads, and incidental concrete-distribution wording in an older random-search
  report, not existing candidate records. Exact checkout counts and differences are retained in the ledger.
  Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Pathwise gradients can be unbiased for the specified continuous relaxed objective under regularity conditions
  while remaining biased for the original discrete objective. A correct categorical argmax law does not
  make the relaxed gradient an unbiased discrete-gradient estimator.
- Temperature zero is a limit, not a valid value in the softmax division. Small temperatures can produce
  sharp derivatives and difficult variance or numerical behavior; no universally optimal temperature or
  annealing schedule is asserted.
- The positive-weight construction excludes zero-mass categories or requires a declared limiting representation.
  Finite-precision softmax, noise endpoints and ties require numerical policies.
- A uniform vector at very high temperature is different from a uniform probability density across the
  simplex. The relaxation is not generally a Dirichlet distribution.
- Distributional equivalence does not imply equivalence of training losses. When a variational objective
  includes latent log probabilities, replacing discrete states by soft values without a consistent density
  treatment need not preserve a lower bound for the intended discrete model.
- A downstream objective must be defined on the continuous simplex for relaxed training. A model may exploit
  interior values and suffer a gap when later evaluated with discrete states; neither task quality nor
  unbiased discrete optimization is guaranteed.
