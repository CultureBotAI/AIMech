claims:
- claim_id: r396-meta-objective-smoothness-and-compositional-stochastic-bias
  kind: mechanism
  statement: Under L-smooth, B-bounded-gradient, rho-Hessian-Lipschitz nonconvex client losses f_i, Lemma 4.2 proves that each meta-function F_i(w) = f_i(w - alpha nabla f_i(w)) is L_F-smooth with L_F = 4L + alpha * rho * B for alpha in [0, 1/L], while Lemma 4.3 proves that evaluating nabla_tilde f_i at the stochastic inner point w - alpha nabla_tilde f_i(w, D) induces a non-vanishing compositional bias ||E[nabla_tilde F_i(w)] - nabla F_i(w)|| <= alpha * L * sigma_G / sqrt(D) coupled with bounded variance sigma_F^2.
  evidence:
  - source_id: r396-primary-pdf
    locator: Section 4.1 Assumptions 1-3 and Section 4.2 Lemmas 4.1, 4.2, 4.3, and 4.4, pp. 5-7
    relation: supports
- claim_id: r396-nonconvex-stationarity-and-hessian-free-approximation
  kind: mechanism
  statement: Theorem 4.5 and Corollary 4.6 prove that Per-FedAvg attains an O(eps + alpha^2 sigma_G^2 / D)-first-order stationary point of F(w) in K = O(eps^{-3/2}) communication rounds with tau = O(eps^{-1/2}) local steps per round; furthermore, Section 5 replaces the exact Hessian-vector product with the two-point finite difference d_i^k = (nabla f_i(w + delta g_adapt) - nabla f_i(w - delta g_adapt)) / (2 delta) with error O(rho delta^2).
  evidence:
  - source_id: r396-primary-pdf
    locator: Section 4.2 Theorem 4.5 & Corollary 4.6 and Section 5 Practical Implementation, pp. 7-8
    relation: supports
- claim_id: r396-second-order-derivatives-and-inner-batch-bias-limitation
  kind: limitation
  statement: Exact Per-FedAvg requires computing Hessian-vector products across three separate mini-batches per local step, and its stochastic meta-gradient estimator retains an O(alpha^2 sigma_G^2 / D) stationarity floor unless the inner adaptation batch size D scales as O(alpha^2 / eps) or alpha scales as O(sqrt(eps)).
  evidence:
  - source_id: r396-primary-pdf
    locator: Section 4.2 Lemma 4.3, Theorem 4.5, and Corollary 4.6, pp. 6-8
    relation: supports
- claim_id: r396-heterogeneous-mnist-and-cifar10-personalization-application
  kind: application
  statement: Applied to personalized neural network classification on heterogeneous MNIST and CIFAR-10 client partitions, showing that Per-FedAvg (HF) and Per-FedAvg (FO) achieve higher post-adaptation test accuracy than standard FedAvg + one-step fine-tuning.
  evidence:
  - source_id: r396-primary-pdf
    locator: Section 5 Numerical Experiments (Table 1, Figure 1), pp. 8-9
    relation: supports
