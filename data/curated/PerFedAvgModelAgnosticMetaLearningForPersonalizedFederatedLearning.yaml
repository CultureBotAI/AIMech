id: AIMech:PerFedAvgModelAgnosticMetaLearningForPersonalizedFederatedLearning
name: Per-FedAvg Model-Agnostic Meta-Learning for Personalized Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A personalized federated learning algorithm (Per-FedAvg) grounded in Model-Agnostic Meta-Learning (MAML) that seeks a shared global initialization w in R^d minimizing the average post-adaptation loss F(w) = (1/n) sum_{i=1}^n F_i(w) with F_i(w) = f_i(w - alpha * nabla f_i(w)) for local adaptation step size alpha >= 0. During each communication round, selected clients execute tau local meta-SGD steps using three independent mini-batches (D_i, D'_i, D''_i) to form the stochastic meta-gradient nabla_tilde F_i(w) = (I - alpha * nabla_tilde^2 f_i(w, D''_i)) nabla_tilde f_i(w - alpha * nabla_tilde f_i(w, D_i), D'_i), supported by practical First-Order (Per-FedAvg FO) and finite-difference Hessian-Free (Per-FedAvg HF) approximations.
identity_notes: Distinct from classical centralized MAML (AIMech:ModelAgnosticMetaLearning, which performs single-step centralized meta-updates across tasks rather than tau multi-step local client updates with bounded client drift and compositional inner-batch bias analysis in federated networks) and from pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes, which optimizes proximal Moreau envelopes min_{theta_i} {f_i(theta_i) + (lambda/2)||theta_i - w||^2} instead of one-step gradient adaptation f_i(w - alpha nabla f_i(w))).
aliases:
- Per-FedAvg
- Personalized FedAvg
- Per-FedAvg (FO)
- Per-FedAvg (HF)
