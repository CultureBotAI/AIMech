  rationale: The architecture reuses a learned predictor with feedback through accumulated geometric state
    over alignment iterations, supporting a qualified relation to the pinned recurrent-network class.
    These are computational alignment iterations and need not represent observations in a temporal input
    sequence. The relation does not assert exact identity or subclass membership, and it does not turn
    the attention-based Transformer name into a match.
