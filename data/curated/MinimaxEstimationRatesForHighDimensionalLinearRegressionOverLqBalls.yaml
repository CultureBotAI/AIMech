claims:
- claim_id: nullspace-diameter-metric-entropy-and-minimax-lp-parameter-risk-bounds
  kind: mechanism
  statement: 'For the linear model Y = X beta* + w with w ~ N(0, sigma^2 I_n) and beta* in B_q(R_q) (q
    in [0, 1]), the intersected nullspace N_q(X) := B_q(R_q) cap ker(X) has l_p-diameter diam_p(N_q(X))
    := sup_{beta in N_q(X)} ||beta||_p (Equation 6). Under Assumption 2(q, R_q, f_l) requiring (1/sqrt(n))
    ||X theta||_2 >= kappa_l ||theta||_2 - f_l(R_q, n, d) for all theta in B_q(2 R_q) (Equation 8), Lemma
    1 (p. 5; proved in Appendix A, pp. 23-24) proves diam_2(N_q(X)) <= f_l(R_q, n, d)/kappa_l. Combining
    nullspace non-identifiability with generalized Fano and Yang-Barron information-theoretic lower bounds
    using the l_q-ball metric entropy log N(epsilon; B_q(R_q), ||.||_2) = Theta(R_q^{2/(2-q)} epsilon^{-2q/(2-q)}
    log(d / (R_q^{2/(2-q)} epsilon^{-2q/(2-q)}))) (Lemma 3, p. 17) and the greedy ternary packing of H(s)
    = {z in {-1, 0, +1}^d : ||z||_0 = s} with cardinality M >= ((d - s)/(s/2))^{s/2} and pairwise separation
    delta_n^2 <= ||beta - beta''||_2^2 <= 8 delta_n^2 (Lemma 5, p. 18; proved in Appendix D, pp. 26-27),
    Theorem 1 (p. 5, Equations 10-11) proves that with probability at least 1/2, M_p(B_q(R_q)) >= c_{q,p}
    max{diam_p^p(N_q(X)), R_q ((sigma^2 / kappa_c^2) (log d)/n)^{(p-q)/2}} for q in (0, 1] under column
    normalization ||X_j||_2 / sqrt(n) <= kappa_c (Assumption 1b), and M_p(B_0(s)) >= c_{0,p} max{diam_p^p(N_0(X)),
    s^{p/2} ((sigma^2 / kappa_u^2) (log(d/s))/n)^{p/2}} for q = 0 under upper restricted curvature (1/sqrt(n))
    ||X(theta - theta'')||_2 <= kappa_u ||theta - theta''||_2 on B_0(s) (Assumption 1a). Conversely, for
    l_q-constrained least squares beta_hat in argmin_{beta in B_q(R_q)} ||Y - X beta||_2^2 (Equation 9),
    Lemma 2 (p. 16) shows ||beta - beta''||_p^p <= 2 R_q ||beta - beta''||_2^{p-q}, and Theorem 2 (p.
    6, Equations 12-14; proved in Section 4.3, pp. 20-22, via Lemmas 6-7 and peeling in Appendix E, pp.
    27-32) proves matching upper bounds with probability at least 1 - c_1 exp(-c_2 min{s log(d - s), log
    d}).'
  evidence:
  - source_id: raskutti2011-minimax-lq-pdf
    locator: Sections 2.1-2.2, pp. 4-6, Assumptions 1-2, Lemma 1, Theorems 1-2, Equations (6)-(14); Sections
      4.1-4.3 and Appendices A, D, E, pp. 16-22, 23-24, 26-32, Lemmas 2, 3, 5, 6, 7
    relation: supports
- claim_id: minimax-prediction-risk-q-convex-hull-entropy-and-assumption-role-reversal
  kind: mechanism
  statement: For prediction error M_{pred}(B_q(R_q)) = inf_{beta_hat} sup_{beta* in B_q(R_q)} (1/n) ||X(beta_hat
    - beta*)||_2^2 (Equation 4), Lemma 4 (p. 17; proved in Appendix C, pp. 24-26, by duality and Carl-Pajor-type
    entropy bounds) establishes that the q-convex hull (1/sqrt(n)) X B_q(R_q) under Assumption 1b (max_j
    ||X_j||_2 / sqrt(n) <= kappa_c) has covering entropy log N(epsilon; (1/sqrt(n)) X B_q(R_q), ||.||_2)
    <= C_q R_q^{2/(2-q)} kappa_c^{2q/(2-q)} epsilon^{-2q/(2-q)} log d (Equation 34). Using Lemma 4 in
    the Yang-Barron method (for q in (0, 1]) and Lemma 5 with Assumption 2(0, s, 0) (for q = 0), Theorem
    3 (p. 7, Equations 17-18; proved in Section 4.2.2, pp. 19-20) proves M_{pred}(B_q(R_q)) >= c'_q R_q
    (sigma^2 (log d)/n)^{1 - q/2} (under a lower curvature condition on B_q(R_q)) and M_{pred}(B_0(s))
    >= c'_0 (kappa_l^2 / kappa_u^2) sigma^2 s log(d/s)/n. Conversely, Theorem 4 (p. 7, Equations 19-20;
    proved in Section 4.3.2, pp. 22-23, via Dudley's entropy integral Lemma 8 in Appendix E.3, pp. 32-34)
    proves that constrained least squares achieves sup_{beta* in B_q(R_q)} (1/n) ||X(beta_hat - beta*)||_2^2
    <= 54 R_q (kappa_c^q sigma^{2-q}) ((log d)/n)^{1 - q/2} under only column normalization (Assumption
    1b) and sup_{beta* in B_0(s)} (1/n) ||X(beta_hat - beta*)||_2^2 <= 216 sigma^2 (s log(d/s))/n without
    any design assumption at all, establishing the exact role reversal between upper and lower restricted
    curvature assumptions across parameter and prediction estimation (Section 2.3, pp. 6-7).
  evidence:
  - source_id: raskutti2011-minimax-lq-pdf
    locator: Section 2.3, pp. 6-7, Theorems 3-4, Equations (17)-(20); Sections 4.1, 4.2.2, 4.3.2 and Appendices
      C, E.3, pp. 17, 19-20, 22-23, 24-26, 32-34, Lemmas 4 and 8
    relation: supports
- claim_id: gaussian-design-restricted-curvature-and-re-vs-l0-identifiability-separation
  kind: scope
  statement: 'Proposition 1 (Section 3.2, p. 10, Equations 23-25; proved in Appendix F, pp. 34-36, via
    Raskutti et al. 2010 and Holder interpolation ||theta||_1 <= ||theta||_q^{q/(2-q)} ||theta||_2^{(2-2q)/(2-q)})
    proves that any i.i.d. N(0, Sigma) random design X satisfies Assumptions 1 and 2 for all q in [0,
    1] with kappa_l^2 = C_1 lambda_min(Sigma), kappa_c^2 = C_2 rho(Sigma) (where rho(Sigma) = max_j Sigma_{jj}),
    and tolerance f_l(R_q, n, d) = C''_q sqrt(rho(Sigma)) sqrt(R_q) ((log d)/(n lambda_min(Sigma)))^{1/2
    - q/4}, implying Corollary 2 (p. 11, Equations 26-27) that constrained least squares achieves minimax-optimal
    l_p rates for general correlated Gaussian designs. Furthermore, Section 3.3.1 (pp. 12-13) proves that
    the l_1 Restricted Eigenvalue condition Assumption 3(gamma; s) on the cone Gamma(s, gamma) := {theta
    : ||theta_{S^c}||_1 <= gamma ||theta_S||_1} (Equation 15, required by polynomial-time Lasso and Dantzig
    selector methods) is strictly stronger than l_0 nullspace identifiability Assumption 2(0, s, 0): for
    the explicit 2x3 design matrix X = [[1, -2, -1], [2, -3, -3]] (Equation 29), ker(X) = span{[1, 1/3,
    1/3]^T} has 3 nonzeros so B_0(2) cap ker(X) = {0} and l_0-constrained least squares exactly recovers
    any 1-sparse beta*, yet Delta = [1, 1/3, 1/3]^T in Gamma(1, 1) cap ker(X) violates RE(1; 1) and causes
    noiseless Lasso / Basis Pursuit on beta* = [1, 0, 0]^T (Y = [1, 2]^T) to recover beta_hat = [0, -1/3,
    -1/3]^T with ||beta_hat||_1 = 2/3 < 1 = ||beta*||_1.'
