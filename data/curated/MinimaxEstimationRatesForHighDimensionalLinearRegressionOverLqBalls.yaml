id: AIMech:MinimaxEstimationRatesForHighDimensionalLinearRegressionOverLqBalls
name: Minimax Estimation Rates for High-Dimensional Linear Regression Over l_q-Balls
concept_kind: mathematical_method
aliases:
- Minimax Rates of Estimation for High-Dimensional Linear Regression Over l_q-Balls (Raskutti, Wainwright,
  & Yu 2011)
- Information-Theoretic Minimax l_p-Parameter and l_2-Prediction Risk Over l_q-Balls
- Nullspace Kernel Diameter and Metric Entropy Minimax Linear Regression Framework
- Raskutti-Wainwright-Yu l_q-Ball Minimax Regression Rate Theory
definition: 'Minimax Estimation Rates for High-Dimensional Linear Regression Over l_q-Balls is an information-theoretic
  and empirical-process statistical analysis methodology introduced by Raskutti, Wainwright, and Yu (2011,
  IEEE Transactions on Information Theory 57(10):6976-6994, DOI:10.1109/TIT.2011.2165799, arXiv:0910.2042v1)
  that characterizes the non-asymptotic minimax l_p-parameter estimation error M_p(B_q(R_q)) := inf_{beta_hat}
  sup_{beta* in B_q(R_q)} ||beta_hat - beta*||_p^p (p in [1, 2]) and l_2-prediction error M_{pred}(B_q(R_q))
  := inf_{beta_hat} sup_{beta* in B_q(R_q)} (1/n) ||X(beta_hat - beta*)||_2^2 for high-dimensional linear
  regression Y = X beta* + w (w ~ N(0, sigma^2 I_n)) over exact-sparsity hard l_0-balls B_0(s) := {beta
  in R^d : sum_{j=1}^d I[beta_j != 0] <= s} and weak-sparsity l_q-balls B_q(R_q) := {beta in R^d : sum_{j=1}^d
  |beta_j|^q <= R_q} for q in (0, 1]. The framework establishes matching minimax lower bounds (Theorems
  1 and 3, via generalized Fano and Yang-Barron mutual-information bounds coupled with l_q-ball metric
  entropy Lemma 3, q-convex hull entropy Lemma 4, and ternary Hamming packing Lemma 5) and upper bounds
  via l_q-constrained least squares beta_hat in argmin_{beta in B_q(R_q)} ||Y - X beta||_2^2 (Theorems
  2 and 4, via Gaussian width bounds over l_q-balls and q-convex hulls in Lemmas 6-8): for parameter estimation,
  M_p(B_q(R_q)) scales as max{diam_p^p(N_q(X)), R_q ((sigma^2 / kappa_c^2) (log d)/n)^{(p-q)/2}} for q
  in (0, 1] and max{diam_p^p(N_0(X)), s^{p/2} ((sigma^2 / kappa_u^2) (log(d/s))/n)^{p/2}} for q = 0 (where
  N_q(X) := B_q(R_q) cap ker(X) is the intersected nullspace, bounded by diam_2(N_q(X)) <= f_l(R_q, n,
  d)/kappa_l under restricted curvature Assumption 2 in Lemma 1), whereas for prediction error, M_{pred}(B_q(R_q))
  scales as R_q (sigma^2 (log d)/n)^{1 - q/2} for q in (0, 1] and sigma^2 s log(d/s)/n for q = 0 without
  any lower restricted curvature condition, exhibiting an exact role reversal of design matrix assumptions
  between parameter and prediction estimation.'
identity_notes: 'Resolved against all 442 pinned AIO records and 623 maintained AIMech records. Distinct
  from AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework (Negahban, Ravikumar,
  Wainwright, & Yu 2012, Statistical Science 27(4):538-557, arXiv:1010.2731v1/v3, which analyzes convex
  regularized M-estimators theta_hat_{lambda_n} in argmin {L(theta) + lambda_n R(theta)} with subspace-decomposable
  norms under restricted strong convexity), from AIMech:RandomizedSketchesOfConvexProgramsWithTangentConeGaussianWidthGuarantees
  (Pilanci & Wainwright 2015, IEEE Trans. Inf. Theory 61(9):5096-5115, arXiv:1404.7203v1), and from AIO:LinearRegression
  and AIO:LassoRegression: Raskutti, Wainwright, & Yu (2011, IEEE Trans. Inf. Theory 57(10):6976-6994,
  arXiv:0910.2042v1) establish the algorithm-independent minimax lower bounds and non-convex l_q-constrained
  least-squares upper bounds over B_q(R_q) for q in [0, 1], characterize the nullspace diameter diam_p(N_q(X)),
  prove the metric entropy of q-convex hulls of columns of X (Lemma 4), prove the role reversal of design
  assumptions between l_2-parameter and l_2-prediction risks, and construct an explicit 2x3 design matrix
  separating l_0 identifiability from the l_1 Restricted Eigenvalue condition (Section 3.3.1).'
