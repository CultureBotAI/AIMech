claims:
- claim_id: claim-two-stage-signal-to-noise-ratio-growth-and-logarithmic-saddle-escape
  kind: mechanism
  statement: "Under Gaussian design $a_i \\stackrel{\\text{i.i.d.}}{\\sim}\\mathcal{N}(0,I_n)$ with sample size $m \\ge C n\\log^{13} n$ and random initialization $x^0 \\sim \\mathcal{N}(0, (n\\|x^\\natural\\|_2^2)^{-1} I_n)$ (Theorem 1) or data-scaled spherical initialization $x^0 = \\sqrt{\\frac{1}{m}\\sum_{i=1}^m y_i}\\,u$ with $u\\sim\\mathcal{S}^{n-1}$ (Theorem 3), Lemma 1 proves that during Stage 1 ($0 \\le t < T_0 = O(\\log n)$) the signal-to-noise ratio $\\alpha_t/\\beta_t$ grows by at least a multiplicative factor $1 + c\\eta > 1$ at every iteration via the coupled state evolution Equations (9a)\u2013(9b), entering the local contraction region ($|\\alpha_{T_0}-1| \\le \\delta, \\beta_{T_0} \\le \\delta$) in $T_0 \\le C\\log n$ iterations and thereafter contracting geometrically $\\mathrm{dist}(x^t, x^\\natural) \\le \\delta (1 - \\eta/2)^{t - T_0}\\|x^\\natural\\|_2$ (Lemma 2)."
  evidence:
  - source_id: ccfm2019-randinitpr-pdf
    locator: Section 2.2-2.3, Theorems 1-3, Equations (9a)-(10), pp. 6-13; Section 3.1, Lemmas 1-2, pp. 15-17
    relation: supports
  - source_id: ccfm2019-randinitpr-abs
    locator: Abstract
    relation: supports
- claim_id: claim-coupled-leave-one-out-and-random-sign-double-difference-decoupling
  kind: mechanism
  statement: "Because standard leave-one-out error $\\|x^t - x^{t,(l)}\\|_2 \\lesssim O(\\sqrt{\\log n/n})\\alpha_t$ is no smaller than the initial signal coordinate $|x_1^0| \\asymp 1/\\sqrt{n\\log n}$ during Stage 1, Section 3.2 constructs three auxiliary gradient trajectories \u2014 leave-one-out $x^{t,(l)}$ (Algorithm 1), random-sign $x^{t,\\mathrm{sgn}}$ using $a_i^{\\mathrm{sgn}} = (\\xi_i^{\\mathrm{sgn}}|a_{i,1}|, a_{i,-1})^\\top$ which preserves $(a_i^{\\mathrm{sgn}\\top} x^\\natural)^2 = (a_i^\\top x^\\natural)^2$ (Algorithm 2, Equation 37), and leave-one-out random-sign $x^{t,\\mathrm{sgn},(l)}$ (Algorithm 3) \u2014 and proves via Lemmas 4\u20137 (Equations 40a\u201340d) that the second-order difference $\\|x^t - x^{t,\\mathrm{sgn}} - x^{t,(l)} + x^{t,\\mathrm{sgn},(l)}\\|_2$ is bounded at a strictly higher order $O(\\frac{\\mathrm{poly}\\log n}{n})\\alpha_t$, decoupling $x_1^t$ from $a_{i,1}$ across all $O(\\log n)$ steps."
  evidence:
  - source_id: ccfm2019-randinitpr-pdf
    locator: Section 3.2, Algorithms 1-3, Equations (29)-(40d), & Lemmas 4-7, pp. 17-22; Appendices B-E, pp. 29-70
    relation: supports
  - source_id: ccfm2019-randinitpr-cr
    locator: Mathematical Programming 176(1-2):5-37 (2019) bibliographic record
    relation: supports
- claim_id: claim-scope-computational-efficiency-over-generic-cubic-regularization-and-noisy-gd
  kind: scope
  statement: Table 1 (Section 2.2) contrasts the $O(\log n + \log(1/\varepsilon))$ iteration complexity of randomly initialized vanilla gradient descent against generic strict-saddle solvers, which require $O(\mathrm{poly}(n)/\varepsilon^2)$ iterations for perturbed gradient descent or $O(\mathrm{poly}(n)\log\log(1/\varepsilon))$ iterations for trust-region / cubic regularization methods because generic worst-case analyses allow the iterate to visit many saddle points sequentially, whereas randomly initialized phase retrieval GD never approaches the unstable saddle manifold after $t=0$.
  evidence:
  - source_id: ccfm2019-randinitpr-pdf
    locator: Section 1.2 & Section 2.2, Table 1 & Remark 2, pp. 3-8
    relation: supports
- claim_id: claim-limitation-measure-zero-orthogonal-hyperplane-saddle-trapping-and-gaussian-design
  kind: limitation
  statement: If initialized deterministically on the measure-zero hyperplane orthogonal to the true signal ($\langle x^0, x^\natural\rangle = 0$, i.e. $\alpha_0 = 0$), population gradient descent remains trapped on the orthogonal subspace ($\alpha_t = 0$ for all $t \ge 0$) and reaches an unstable saddle circle $\|x\|_2 = \frac{1}{\sqrt{3}}\|x^\natural\|_2$; furthermore, the random-sign decoupling symmetry relies on i.i.d. Gaussian design distributions.
  evidence:
  - source_id: ccfm2019-randinitpr-pdf
    locator: Section 2.3, Equations (9a)-(9b) & Figure 2, pp. 9-12; Section 3.2, Equation (36), p. 18
    relation: supports
