claims:
- claim_id: local-update
  kind: mechanism
  statement: For current input x, weights w, scalar output y=w^T x and positive gain eta, the truncated
    rule is w_new=w+eta*y*(x-y*w). Each synaptic increment uses its input, its weight and the common scalar
    output. The negative eta*y^2*w term regulates Hebbian growth. This drops second- and higher-order
    gain terms from explicit normalization of w+eta*y*x, and therefore does not preserve unit norm exactly
    at a finite step.
  evidence:
  - source_id: method-source
    locator: Equations 1-6, printed pp. 267-269 / PDF pp. 1-3; Section 4, Equations 11-15, pp. 271-272
      / PDF pp. 5-6; curator finite-norm example
    relation: supports
- claim_id: mean-dynamics
  kind: mechanism
  statement: When the current input is independent of current weights, averaging the truncated increment
    per unit gain gives Cw-(w^T Cw)w, where C=E[xx^T]. The associated mean differential equation has signed
    top unit eigenvectors as attracting equilibria when C has a positive simple largest eigenvalue and
    initialization has a nonzero component along its eigenvector. In eigenvector coordinates, ratios to
    the leading coordinate decay according to the eigenvalue gap. This is a mean-ODE result with explicit
    conditions.
  evidence:
  - source_id: method-source
    locator: Section 3, Equations 7-8 and theorem, printed pp. 269-270 / PDF pp. 3-4; curator positive-eigenvalue
      qualification
    relation: supports
- claim_id: centering-and-scope
  kind: scope
  statement: For zero-mean inputs, C is the covariance, and the leading learned response corresponds to
    the largest-variance principal component. Without centering, C includes the outer product of the mean
    and the rule targets maximum quadratic mean instead. Mean subtraction is not part of the displayed
    update. The paper analyzes a single neuron and does not derive a full multi-component PCA network
    or independent-component separator.
  evidence:
  - source_id: method-source
    locator: Section 3, printed p. 270 / PDF p. 4; Section 5, p. 272 / PDF p. 6
    relation: supports
- claim_id: stochastic-convergence-scope
  kind: limitation
  statement: The source invokes stochastic-approximation results with suitable input regularity and a
    decreasing gain, such as a gain proportional to inverse time; it does not spell out a complete general
    stochastic convergence theorem. A small fixed gain is discussed as an approximation to mean dynamics,
    not a guarantee of exact almost-sure convergence. Zero or mean-ODE orthogonal starts and repeated
    leading eigenvalues require separate treatment. Large discrete gains can increase weight magnitude
    instead of controlling it.
  evidence:
  - source_id: method-source
    locator: Section 3, printed pp. 269-270 / PDF pp. 3-4; curator stationary-direction, finite-norm and
      large-gain examples
    relation: supports
limitations:
- The PCA interpretation requires centered finite-second-moment inputs and the relevant stationary/input
  assumptions. Correlation across time, changing distributions and dependence between current input and
  weights need a justified analysis.
- The first-order discrete rule is not exact normalization. Step size and initialization matter; the mean-ODE
  theorem does not establish global stability of every finite-gain implementation.
- With a repeated largest eigenvalue there is no unique principal direction, and sign is intrinsically
  ambiguous. A single unit yields one direction rather than an ordered orthogonal basis.
- All seven source pages were read. Finite arithmetic and analytic mean-flow checks were performed; no
  neuron training, historical simulation or biological experiment was reproduced.
