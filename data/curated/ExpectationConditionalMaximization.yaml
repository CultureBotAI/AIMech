claims:
- claim_id: fixed-expectation-conditional-maxima
  kind: mechanism
  statement: At theta_t compute Q(theta|theta_t), the conditional expectation of complete-data log likelihood
    given the observed data under theta_t. Starting at theta_t, CM step s maximizes that same Q subject
    to g_s(theta)=g_s(theta_previous_substep). The constraint preserves feasibility of the previous substep.
    Use the final CM result as theta_(t+1), then compute the next E step. The constraints can fix a parameter
    block, its complement, or a more general function; the CM subproblems need not have closed-form solutions.
  evidence:
  - source_id: method-source
    locator: Sections 2-3, pp.269-273 / PDF pp.3-7, especially Equations 3.1-3.3
    relation: supports
- claim_id: ascent-and-space-filling
  kind: mechanism
  statement: Exact CM steps make the fixed Q nondecreasing, so the full ECM iteration is a generalized
    EM step and makes observed likelihood nondecreasing. This compares the final iterate with the E-step
    anchor; it does not require observed likelihood to increase between every pair of intermediate CM
    points. Stationary-limit results additionally require the stated regularity and parameter-space coverage
    conditions. In the differentiable full-rank formulation, space filling requires that the available
    constraint-tangent directions collectively span the parameter directions.
  evidence:
  - source_id: method-source
    locator: Sections 3-4, Equations 3.4-3.7, Theorems 1-3 and Corollary 1, pp.272-275 / PDF pp.6-9; curator
      Gaussian counterexample to intermediate observed-likelihood monotonicity
    relation: supports
- claim_id: moments-and-refresh-schedule
  kind: scope
  statement: Incomplete normal-data examples use old conditional first and second moments throughout the
    CM sequence, while regression coefficients and covariance parameters change in their specified order.
    Missing values replaced only by conditional means discard required uncertainty terms. Multicycle ECM
    refreshes expectations before selected CM steps; its outer update need not increase one single original
    Q, although each valid refreshed cycle has its own EM ascent relation.
  evidence:
  - source_id: method-source
    locator: Section 2 Example 1, pp.269-270 / PDF pp.3-4; Section 5, pp.276-277 / PDF pp.10-11
    relation: supports
limitations:
- Bounded monotone likelihood values do not alone establish parameter convergence, stationarity, a local
  maximum or global optimality. The source stationary-limit theorems impose regularity, interior and space-filling
  conditions, with additional uniqueness or alternative technical conditions on CM updates.
- Optimizing only a restricted set of directions can stop at a point with nonzero gradient in an excluded
  direction. Arbitrary approximate Newton or other numerical steps require their own ascent checks.
- The framework is deterministic likelihood or specified posterior-mode optimization, not posterior simulation.
  The incomplete-data examples assume an appropriate ignorable missingness formulation.
- CM simplicity, number of iterations and total computation are different considerations. The source does
  not supply a universal speed ordering among EM, ECM and multicycle ECM. Finite curator examples check
  scheduling and direction-coverage boundaries; no historical fit or author software was reproduced.
