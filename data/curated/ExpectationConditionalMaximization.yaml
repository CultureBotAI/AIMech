name: Expectation Conditional Maximization
aliases:
- ECM Algorithm
- ECM
concept_kind: algorithm
definition: An extension of expectation maximization that replaces a joint maximization of the expected
  complete-data log likelihood with a sequence of constrained maximizations, holding the E-step expectation
  fixed throughout that sequence.
identity_notes: 'The Meng-Rubin ECM framework allows general constraint functions; coordinate-block maximization
  is a special case. It is distinct from posterior Gibbs sampling, ECME steps on actual observed likelihood,
  and parameter-expanded EM. Ordinary EM is recovered by one unconstrained maximization. Multicycle ECM
  refreshes the expectation within an outer iteration and is identified here as a related schedule variant,
  not the fixed-Q definition. No normalized identity match was found across all 442 pinned AIO labels
  and scoped synonyms and 463 preceding native IDs, names and aliases. Fixed-string searches of worktree
  and main included ignored and hidden files, yielding 52 and 53 matched lines respectively. All 41 distinct
  contextual passages across 105 line instances and nine checkout-qualified paths were read; these concern
  prior discovery references and factor-analysis evidence, plus an unrelated ignored URI-template parameter-expansion
  string. They are not existing identities for these three algorithms. All 223 semantic label/synonym
  rows were read. Fifteen exact annotated AIO CLASS nodes and outgoing edges were inspected: fourteen
  verified unchanged after prior reading and DataAugmentation newly read. Twenty-five contextual YAMLs
  comprise fifteen AIO and ten native records; twenty are unchanged verified prior readings, two are hash-verified
  final records fully read in the preceding cohort, and three were fully read here. General EM, tempered
  EM, Gaussian factor models, PPCA mixtures, Gibbs/Metropolis sampling, specialized deep Bayesian data
  augmentation and alternating Newton fitting do not identify these particular conditional/expanded EM
  procedures. Absence is bounded to the pinned snapshot, maintained corpus and inspected neighborhood.'
