claims:
- claim_id: method
  kind: mechanism
  statement: 'For a finite product domain with specified univariate measure mu, log base measure B and
    nonnegative scalar sufficient statistic T, set s(x)=sqrt(T(x)). The paper makes one explicit signed-root
    exception: use s(x)=x for T(x)=x^2 on the real line to recover its Gaussian special case. Let Phi
    be a finite symmetric matrix, including its diagonal. Define p(x)=Z^(-1)*exp[sum_i theta_i*s(x_i)+sum_(i,j)
    Phi_ij*s(x_i)*s(x_j)+sum_i B(x_i)] with 0<Z<infinity relative to the product measure. The log partition
    is A=log Z. The site-i full-conditional kernel is exp[Phi_ii*T(t)+(theta_i+2*sum_(j!=i) Phi_ij*s(x_j))*s(t)+B(t)].
    Nonedge matrix entries vanish. With theta=0 and diagonal Phi, the law factors into the original independent
    univariate exponential family at valid diagonal parameters. Normalizability otherwise depends on the
    chosen base measure and parameter regime.'
