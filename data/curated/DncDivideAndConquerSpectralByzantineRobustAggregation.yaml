id: AIMech:DncDivideAndConquerSpectralByzantineRobustAggregation
name: Divide-and-Conquer Spectral Byzantine-Robust Aggregation
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-robust gradient aggregation algorithm for federated learning that mitigates the curse of dimensionality and defeats optimization-based untargeted model poisoning attacks by repeatedly subsampling a random subset r of b <= d gradient coordinates, centering the subsampled client updates around their coordinate-wise mean mu, computing each client's squared projection outlier score s_i = <tilde_nabla_i - mu, v>^2 along the top right singular vector v of the centered matrix, retaining the n - c*m clients with the lowest outlier scores in each iteration, and averaging the full-dimensional gradients over the intersection I_final = cap I_good across niters random subsamples.
identity_notes: Distinct from Euclidean distance-based filtering rules (Krum, Multi-Krum, Bulyan), coordinate-wise robust estimators (Coordinate-Wise Median, Coordinate-Wise Trimmed-Mean, Geometric Median / RFA), cosine-similarity server-root-dataset trust bootstrapping (FLTrust), and loss-based suspicion scoring (Zeno). Specifically denotes the Divide-and-Conquer (DnC) spectral aggregation rule of Shejwalkar & Houmansadr (NDSS 2021, Algorithm 2, Section VII-B) backed by epsilon-spectral separability guarantees (Definition 1, Lemma 1, and Appendix B Lemmas 2-3).
aliases:
- DnC
- DnC AGR
- Divide-and-Conquer Robust Aggregation
- Divide-and-Conquer Byzantine-Robust Aggregation
