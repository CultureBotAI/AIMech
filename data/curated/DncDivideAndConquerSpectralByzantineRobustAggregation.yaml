claims:
- claim_id: r521-random-subsampling-spectral-outlier-filtering
  kind: mechanism
  statement: To avoid the O(d^3) memory and computational cost of full-dimensional singular value decomposition on neural network gradients, DnC (Algorithm 2) samples a sorted set r of b <= d random coordinate indices in each of niters iterations, centers the n x b subsampled gradients nabla^c = tilde_nabla - mu, computes the top right singular vector v of nabla^c, scores each update via s_i = (<tilde_nabla_i - mu, v>)^2, retains the n - c*m indices with lowest scores, and averages the full gradients over the intersection I_final = cap I_good.
  evidence:
  - source_id: r521-primary-pdf
    locator: Section VII-B, Algorithm 2, p. 13
    relation: supports
- claim_id: r521-epsilon-spectral-separability-lemma
  kind: scope
  statement: Under finite-covariance benign and malicious gradient distributions B and M with means mu_B, mu_M and covariances Sigma_B, Sigma_M <= sigma^2 I in the mixture U = (1 - epsilon)B + epsilon M (0 < epsilon < 0.5), Lemma 3 and Lemma 1 prove that whenever ||mu_B - mu_M||_2^2 >= 6*sigma^2 / epsilon, the top right singular vector v of U satisfies <mu_B - mu_M, v>^2 >= (2/3)||mu_B - mu_M||_2^2 >= 2*sigma^2 / epsilon, guaranteeing epsilon-spectral separability so that impactful mean-shifting attacks are filtered out.
  evidence:
  - source_id: r521-primary-pdf
    locator: Section VII-B Definition 1 and Lemma 1, p. 14; Appendix B Lemmas 2-3, pp. 17-18
    relation: supports
- claim_id: r521-non-iid-full-knowledge-adaptive-limitation
  kind: limitation
  statement: When client training data are strongly non-i.i.d. and class-imbalanced (such as on FEMNIST), benign client gradients do not align along a single low-variance mean direction, allowing a worst-case adversary with full knowledge of benign client updates (agr-updates or updates-only) to evade DnC's spectral filter using Min-Sum or adaptive attacks (Eq. 8).
  evidence:
  - source_id: r521-primary-pdf
    locator: Section VII-B Eq. 8, p. 14; Section VII-C2 and Table VI, pp. 15-16
    relation: supports
