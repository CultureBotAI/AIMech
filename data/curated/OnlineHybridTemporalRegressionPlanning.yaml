id: AIMech:OnlineHybridTemporalRegressionPlanning
name: Online hybrid temporal regression planning
aliases: []
concept_kind: algorithm
definition: An online planning-and-scheduling procedure that plans successive jobs
  by goal-regression A* over logical conditions, variable bindings, shared temporal
  constraints and resource allocations, immediately branches on conflicting resource
  orders, and retains temporal flexibility until queued plans are clamped and released
  near execution.
identity_notes: 'This descriptive identity denotes the common 2004/2005 online hybrid
  temporal regression planning procedure, with separate source versions and explicit
  qualifications. OnlinePlanner and PlanJob are nested procedure labels, and PNS in
  the retrieval filename is not an alias. Current identity context was rebound at
  clean merged commit 3f75d017b53af1c74368bd17d23d1383e4f56cbd: 812 native and 442
  pinned AIO records; all 1,254 record IDs, names, aliases and scoped synonyms participate
  in the 4,962-field/3,794-normalized-value screen, with no candidate collision. Four
  ignored- and hidden-inclusive roots returned 16 distinct matching contents and 36
  occurrences. Eleven contents reuse exact historical semantic reading; all five new
  contents and their complete matching source-progress parents were read. The 1,252
  historical records are byte-identical, and the two added CoPE record identity/definition/mapping
  contexts were freshly read as distinct. Historical 86-definition/nine-neighbor reading
  is attributed to its original receipt; the 15 selected AIO nodes and 68 incident
  edges were freshly read on the unchanged pin. The postmerge check found all record
  bytes and complete search match-event multisets identical to the just-read committed
  snapshot. Root accepts one DRAFT algorithm under existing main911 source responsibility;
  native creation, validation and saved review are separately recorded operations.'
