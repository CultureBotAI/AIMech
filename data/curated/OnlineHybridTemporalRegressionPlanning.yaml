claims:
- claim_id: sequential-job-temporal-flexibility
  kind: mechanism
  statement: The common 2004/2005 procedure builds the schedule greedily one job at
    a time while retaining the selected action plans for previous jobs. A shared temporal
    constraint database keeps unreleased action times flexible, allowing a later job
    to start earlier and older actions to shift within their feasible windows while
    required within-batch completion order is preserved.
  evidence:
  - source_id: ruml2004
    locator: PDF pp.3–5, A Hybrid Planner, Figure 5 and continuation after Planning
      Individual Jobs.
    relation: supports
  - source_id: ruml2005
    locator: PDF pp.4–6, A Hybrid Planner, Figure 6, State Representation and end
      of Objective function.
    relation: supports
- claim_id: four-part-per-job-regression
  kind: mechanism
  statement: For each job, the inner A* search regresses from its desired final state
    using states containing logical literals, variable bindings, a temporal database
    and resource allocations. A plan is complete when the regressed literals unify
    with the desired initial state; the chosen bindings and temporal database are
    then passed back to the outer procedure for planning later jobs.
  evidence:
  - source_id: ruml2004
    locator: PDF p.3 Figure 5; p.4 Planning Individual Jobs, four-tuple; p.5 first
      two paragraphs.
    relation: supports
  - source_id: ruml2005
    locator: PDF p.4 Figure 6 and Planning Individual Jobs; p.5 State Representation;
      p.6 final two paragraphs.
    relation: supports
- claim_id: immediate-temporal-resource-branching
  kind: mechanism
  statement: Regressing an applicable action introduces its duration, sequencing and
    resource-allocation constraints. Potential overlaps for the same resource are
    resolved immediately by branching over possible relative orders and propagating
    their temporal constraints; only feasible child states enter the search queue.
    The 2004 outline says to generate both orderings, while the expanded 2005 description
    enumerates available placements among existing allocations and combinations across
    resources.
  evidence:
  - source_id: ruml2004
    locator: PDF p.3 Figure 5 steps 10–15; p.4 Planning Individual Jobs, temporal
      constraints and resource branching.
    relation: supports
  - source_id: ruml2005
    locator: PDF p.4 Figure 6 steps 10–15; p.5 Branching rule through p.6 continuation.
    relation: supports
- claim_id: imminent-release-and-clamping
  kind: mechanism
  statement: After planning a job, the outer procedure checks whether a queued plan
    starts soon. To preserve submission-order release, it releases plans from the
    oldest unreleased one through that imminent plan, first fixing their time points
    to earliest feasible times. The papers justify this clamping using a complete
    algorithm for maintaining allowable temporal windows; outer-loop temporal constraints
    are added between individual-job searches so those updates do not invalidate search
    evaluations mid-search.
  evidence:
  - source_id: ruml2004
    locator: PDF pp.3–4, Figure 5 steps 1–5 and A Hybrid Planner.
    relation: supports
  - source_id: ruml2005
    locator: PDF p.4 Figure 6 steps 1–5 and A Hybrid Planner, release and temporal-window
      paragraphs.
    relation: supports
- claim_id: completion-time-ranking
  kind: mechanism
  statement: Search favors the estimated earliest feasible completion time of the
    current job in the context of earlier jobs, then smaller predicted makespan and
    then larger already-realized makespan. In the 2005 Figure 7 notation these quantities
    are t7, t7−t3 and t7−t4, respectively. A relaxed remaining-duration estimate is
    inserted before the partial plan to tighten its feasible completion bound.
  evidence:
  - source_id: ruml2004
    locator: PDF p.4 final two paragraphs and p.5 opening paragraph.
    relation: supports
  - source_id: ruml2005
    locator: PDF p.6, Figure 7 and Objective function.
    relation: supports
- claim_id: relaxed-achievement-lower-bound
  kind: mechanism
  statement: The described heuristic starts from initial and background literals,
    propagates achievement-time labels through applicable actions while omitting mutex/resource
    contention, and uses the maximum required-literal achievement time as a remaining-duration
    lower bound, with infinity if a required literal cannot be produced. Its admissibility
    interpretation requires the intended minimum relaxed achievement times; the printed
    first-production description alone does not specify a complete minimum-label agenda
    or relaxation implementation.
  evidence:
  - source_id: ruml2004
    locator: PDF p.4, final two paragraphs of Planning Individual Jobs.
    relation: supports
  - source_id: ruml2005
    locator: PDF p.6, Objective function, temporal-planning-graph and label paragraphs.
    relation: supports
- claim_id: expanded-general-regression-rule
  kind: mechanism
  statement: The 2005 general logical representation distinguishes true, false and
    unknown atoms. Applicability requires effects consistent with the regressed state
    and preconditions unaffected by those effects also consistent with it. For an
    applicable action, writing primes for the new sets, the source update is Lt′=(Lt∖Add)∪Pre+,
    Lf′=(Lf∖Del)∪Pre− and Lu′=(Lu∪Add∪Del)∖(Pre+∪Pre−). These are the expanded paper’s
    general rules, not its later simplified effect-only rule and not equations printed
    in the 2004 paper.
  evidence:
  - source_id: ruml2005
    locator: PDF p.5, Regression Semantics, general Applicability and Update paragraphs.
    relation: supports
- claim_id: resource-time-noop-relevance
  kind: scope
  statement: The 2005 discussion does not impose an additional requirement that an
    applicable action have an effect matching a required goal literal. It explains
    that a time-consuming no-op may let an existing resource allocation expire and
    thereby enable a better subsequent plan. This is a source-specific reason for
    retaining otherwise applicable actions, not a general proof that arbitrary irrelevant
    actions improve planning.
  evidence:
  - source_id: ruml2005
    locator: PDF p.5, Regression Semantics, paragraph following general Applicability.
    relation: supports
