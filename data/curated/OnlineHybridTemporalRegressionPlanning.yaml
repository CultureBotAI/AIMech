aio_no_match:
  search_scope: All pinned record IDs/names/aliases/scoped synonyms participated in
    the normalized inventory screen; 15 exact plausible AIO CLASS nodes and all 68
    incident edges were freshly read for semantic mapping. No full semantic reading
    of all442 classes is claimed. This is the attributed historical prospective screen
    at HEAD c222454fe2e2ce2b9be5fd78a01d47e9961d1f26, whose working tree included
    the three later cohort363 records; it is not a current or future insertion clearance.
    The 15 selected nodes/68 edges were read by the prior proposal author, not freshly
    reread as a whole during this draft.
  rationale: None of the inspected pinned classes identifies or usefully subsumes
    this symbolic online regression planning/scheduling procedure. Shared timing,
    regression, graph, model, control or physical application language is insufficient
    for a mapping.
  examined_targets:
  - target: AIO:MachineLearningTask
    rejection_reason: The source specifies symbolic regression search and temporal/resource
      propagation from supplied models; it does not build a method that learns from
      training data. Retaining plans or temporal constraints is not a learned predictor.
  - target: AIO:Model
    rejection_reason: The plant/action and temporal-network models are inputs/state
      to an online search-and-release procedure. The whole candidate is not merely
      an abstract representation of a system.
  - target: AIO:MathematicalFunction
    rejection_reason: The complete candidate combines search-state generation, resource-order
      branching, propagation, queuing and release. A heuristic score is a component,
      not identity of the entire procedure as a value rule.
  - target: AIO:RegressionAnalysis
    rejection_reason: Regression here means reasoning backward from a goal through
      preceding actions, not statistical estimation of dependent/independent-variable
      relationships. The pinned class is under SupervisedLearning.
  - target: AIO:ReinforcementLearning
    rejection_reason: No reward-based policy/value learning defines this algorithm.
      Interleaving planning with execution and minimizing completion times does not
      establish reinforcement learning.
  - target: AIO:ReasoningLLM
    rejection_reason: Symbolic logical reasoning in this planner does not use a language
      model. The related synonym reasoning cannot extend the pinned LLM class to all
      planning.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: The hybrid refers to planning plus temporal scheduling/constraints,
      not a neural language model combined with symbolic reasoning.
  - target: AIO:EmbodiedLLM
    rejection_reason: Physical manufacturing execution is an application; no grounded
      multimodal language model is present.
  - target: AIO:GraphConvolutionalPolicyNetwork
    rejection_reason: The temporal constraint graph and material routes are not graph
      convolution or reward/adversarial training of a graph-generating policy.
  - target: AIO:PolicyLayer
    rejection_reason: Action and release decisions are not neural-layer predictions
      of an action probability distribution.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The temporal database expresses constraints between timepoints,
      not conditional dependence among random variables. A graph representation alone
      is insufficient.
  - target: AIO:DecisionTree
    rejection_reason: Branching over regressed actions/resource orders is search over
      partial plans rather than the pinned classification/decision-support tree model.
  - target: AIO:TemporalBias
    rejection_reason: Temporal constraints and timing objectives are not selection/sampling
      distortion caused by population changes over time.
  - target: AIO:TimeSeriesAnalysis
    rejection_reason: The procedure generates feasible plans/schedules; it is not
      analysis of observed time series to extract statistics.
  - target: AIO:TimeSeriesForecasting
    rejection_reason: Earliest feasible completion estimates from an action/constraint
      model are not prediction of time-series values from past observations.
limitations:
- The papers attribute optimality to the search for the current job under its objective
  and existing-plan context, relying on heuristic admissibility and suitable feasible-state
  handling. Their greedy outer loop does not establish a globally optimal schedule
  over future arrivals, a competitive ratio, or optimal revision of earlier action
  choices.
- The heuristic prose labels a previously unknown literal when produced, but does
  not give an explicit agenda or label-improvement rule ensuring minimum relaxed achievement
  times. Admissibility cannot be inferred for an arbitrary first-producer implementation;
  a fast and a slow producer can require different label handling. This is an exposition/premise
  limit, not an observed implementation failure.
- Earliest-time clamping is justified only with the source’s appropriate complete
  temporal-window maintenance and its domain assumptions. It is not a generic guarantee
  for arbitrary CSPs, approximate or stale windows, or an unspecified propagator.
  The comparison does not demonstrate that a correctly maintained simple temporal
  network becomes inconsistent merely by earliest-time clamping.
- The manually chosen imminence interval assumes sufficient time to plan the next
  job; the papers discuss interrupting and restarting when needed. Outer-loop temporal
  updates are restricted to between-job searches, while controller changes can abort
  a current search. These descriptions do not supply a general hard real-time guarantee
  or fully specified timeout, unreachable-job and empty-frontier behavior.
- The state-uniqueness argument appeals to irreversible logical or resource-order
  choices reflected in a plan. Local branching distinctions alone do not establish
  global semantic non-reconvergence, cycle freedom, or a general no-duplicate theorem
  for arbitrary action domains. No concrete duplicate execution of the authors’ implementation
  is asserted.
- The 2005 simplified rule tests only whether effects match a fully specified state.
  Full specification plus corresponding effect preconditions does not alone ensure
  compatibility of preconditions on unaffected atoms. Such a precondition can contradict
  the target state even when the simplified effect test passes. The earlier general
  applicability rule retains the needed check; no implementation defect or author
  erratum is established.
- The 2005 simplified update flips added/deleted atoms. That update needs opposite-polarity
  preconditions for the changed atoms and suitable treatment of other preconditions;
  the phrase corresponding preconditions does not itself specify those polarities.
  The general regression update is retained separately, and the simplified branch
  is not silently strengthened or treated as universally equivalent.
- The 2005 paper explicitly supports unknown literals and describes storing true and
  unknown sets, but later calls the state fully specified and writes a two-set heuristic
  shorthand. The exact treatment of unknowns in that shorthand remains a source/interface
  question; this draft does not erase unknowns or claim an implementation-level equivalence
  of all these descriptions.
- 'The shared procedure is described for the supplied symbolic manufacturing model:
  jobs are independent except for shared resources and explicit batch constraints,
  actions for one job are sequential and abut, and controller delay constrains starting
  times. These restrictions do not establish applicability to arbitrary interacting,
  stochastic, partially observable or general durative-planning domains.'
- 'Representational flexibility is not the same as implemented support: the 2004 paper
  allows duration ranges but says its implementation uses fixed durations, and it
  describes additional resource-state compatibility restrictions. These details and
  the 2005 formal extensions remain version-local; this common record does not equate
  every modeling option or implementation across the two papers.'
- The described failure handling assumes reliable transport along planned routes and
  destination diversion that can discard faulty material; affected jobs can then be
  replanned from scratch. This does not establish recovery for arbitrary mid-route
  failures, uncertain state estimation or all in-flight material. Controller-domain
  changes are handled by aborting the current search under the stated between-search
  model.
- The 2004 experiments distinguish incremental directed path consistency from an arc-consistency
  variant maintaining origin-relative time windows without adding arcs. The latter
  does not provide arbitrary pairwise time relations as easily. The comparison does
  not prove interchangeability of arbitrary AC-3 and IDPC implementations or transfer
  the reported timing advantage to every domain.
- Physical-prototype operation, simulations on selected plant configurations and timing/quality
  comparisons are separate evidence roles. They do not establish universal throughput,
  hard deadlines or general optimality. This draft makes no numerical performance
  claim and has not executed an implementation or reproduced the experiments.
- One descriptive identity covers the common outer online coordination and inner temporal/resource
  regression procedure in these two inspected works, not separately originated A*,
  STRIPS, STN or propagator components. It does not equate all later printer-planning
  publications or use the filename token pns as an alias. The 2005 comparison is completed,
  while remaining cited-original, later-version and implementation questions stay
  separately tracked.
