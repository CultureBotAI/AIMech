claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'Under row l_1-normalization where A is separable and W is simplicial (no row W^i lies in conv({W^{i''} : i'' != i})), Claim 5.5 and Theorem 5.4 prove that a row M^j is an extreme vertex (''loner'') outside the convex hull of all distinct rows {M^{i''} : M^{i''} != M^j} if and only if M^j equals one of the r basis rows W^i, reducing exact nonnegative matrix factorization to n linear programs.'
  evidence:
  - source_id: r321-primary-pdf
    locator: Section 5.1, Definitions 5.1-5.2, Theorem 5.4, and Claim 5.5, pp. 13-14
    relation: supports
  - source_id: r321-metadata-cr
    locator: Bibliographic metadata for SIAM Journal on Computing 45(4):1582-1611
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: 'When W is alpha-robust simplicial (Definition 5.6) and the perturbed rows M''^j satisfy ||M''^j - M^j||_1 <= epsilon with 20 epsilon/alpha + 13 epsilon < alpha, Claims 5.8-5.10 and Theorem 5.7 prove that defining a robust-loner as any row M''^j whose l_1 distance to conv({M''^i : ||M''^i - M''^j||_1 >= 5 epsilon/alpha + 2 epsilon}) exceeds 2 epsilon selects points exclusively within l_1 distance 5 epsilon/alpha + 2 epsilon of the true basis rows W^i and yields a polynomial-time factorization A'' W'' satisfying ||M''^j - (A'' W'')^j||_1 <= 10 epsilon/alpha + 7 epsilon for every row j.'
  evidence:
  - source_id: r321-primary-pdf
    locator: Section 5.2, Definition 5.6, Theorem 5.7, and Claims 5.8-5.10, pp. 15-17
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Without separability, general exact NMF is NP-hard when the inner dimension r scales with the matrix dimensions (Theorem 3.1, via reduction from 3SAT and Vavasis's Intermediate Simplex problem), and if all rows of A are strictly interior mixtures lacking canonical anchor rows, convex-hull extreme-point selection fails to recover the true basis vertices W^i.
  evidence:
  - source_id: r321-primary-pdf
    locator: Section 3, Theorem 3.1, pp. 7-9; Section 5.1, Definition 5.1, p. 13
    relation: supports
