id: AIMech:SeparableNonnegativeMatrixFactorizationAndRobustLonerRecovery
name: Separable Nonnegative Matrix Factorization and Robust-Loner Recovery
concept_kind: algorithm
review_status: DRAFT
definition: 'Separable Nonnegative Matrix Factorization and Robust-Loner Recovery is a polynomial-time provable factorization framework introduced by Arora, Ge, Kannan, and Moitra (2012/2016) that circumvents the general NP-hardness of exact Nonnegative Matrix Factorization (NMF) M = A W (Theorem 3.1) by imposing the separability condition (Definition 5.1) on the first factor A in R_+^{n x r}. After normalizing the rows of M, A, and W to have unit l_1 norm, separability requires that for each latent basis index i in {1,...,r} there exists at least one canonical (''anchor'') row j_i of A equal to the standard basis vector e_i^T, so that the r rows of W appear directly among the rows of M and every other row M^j = sum_{i=1}^r A_{j,i} W^i lies in the convex hull conv(W^1,...,W^r). When W is alpha-robust simplicial (each row W^i has l_1 distance at least alpha from conv({W^{i''} : i'' != i}), Definition 5.6) and the observed matrix M'' satisfies ||M''^j - M^j||_1 <= epsilon with 20 epsilon/alpha + 13 epsilon < alpha, the Robust-Loners algorithm identifies all r canonical rows via linear programming convex-hull tests at distance threshold d = 5 epsilon/alpha + 2 epsilon and clusters them to reconstruct A'' W'' within row-wise l_1 error 10 epsilon/alpha + 7 epsilon (Theorem 5.7).'
identity_notes: Distinct from heuristic multiplicative update rules for NMF (`AIO:NonnegativeMatrixFactorization`) and FastAnchorWords / RecoverL2 word-co-occurrence topic modeling (AIMech:AnchorWordsAndRecoverL2TopicWordMatrixFactorization). Specifically captures the Arora-Ge-Kannan-Moitra (2012/2016) formalization of Separable NMF (Definition 5.1), the exact simplicial 'Loner' LP algorithm (Theorem 5.4 and Claim 5.5), the alpha-robust simplicial condition (Definition 5.6), the noisy Robust-Loners algorithm and error bound 10 epsilon/alpha + 7 epsilon (Theorem 5.7 and Claims 5.8-5.10), and the fixed-inner-dimension exact NMF algebraic decidability algorithm in time (nm)^{O(r^2 2^r)} (Theorem 4.1).
aliases:
- Separable NMF
- Arora-Ge-Kannan-Moitra Separable NMF and Robust-Loner Algorithm
- Anchor-Row Simplicial Nonnegative Matrix Factorization
