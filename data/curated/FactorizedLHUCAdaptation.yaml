limitations:
- The local identity denotes the source’s factorized LHUC interpolation procedure, not every factorized
  neural model, ordinary test-only LHUC or SAT-LHUC training.
- Interpolation is performed after xi. A latent parameter representing the combined amplitude requires
  a compatible inverse or representation; the method must not silently replace amplitude interpolation
  with latent interpolation.
- Known environment identity and separately estimated transforms are required in the demonstrated protocol.
  Factorization does not establish statistical independence or a causal decomposition of speaker and environment
  effects.
- Complete fourteen-page primary v2 inspected. Constructed amplitude calculations only; no author software,
  speech data, training or empirical replication.
