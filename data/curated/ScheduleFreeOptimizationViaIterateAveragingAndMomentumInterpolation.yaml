claims:
- claim_id: unified-bregman-online-to-batch-conversion-and-momentum-optimality
  kind: mechanism
  statement: Theorem 2 (Equation 12, Appendix A) and Theorem 5 (Appendix C, Equations 27-30) prove the exact step identity w_{1:t} F(x_t) - w_{1:t-1} F(x_{t-1}) - w_t F(x_*) = w_t langle nabla F(y_t), z_t - x_* rangle - (w_t / alpha_t) B_F(y_t, x_t) - (w_t(1 - alpha_t)/alpha_t) B_F(x_t, y_t) - w_{1:t-1} B_F(x_{t-1}, x_t) - w_t B_F(x_*, y_t) for any convex function F and any sequence beta_t = 1 - alpha_t in [0, 1], establishing E[F(x_T) - F(x_*)] <= E[sum_{t=1}^T w_t langle g_t, z_t - x_* rangle] / sum_{t=1}^T w_t and proving that Schedule-Free SGD achieves the exact minimax optimal rate E[F(x_T) - F(x_*)] <= D G / sqrt{T} for every momentum parameter beta in [0, 1] (Theorem 1).
  evidence:
  - source_id: r585-primary-pdf
    locator: Section 2, Theorems 1 and 2, Equations (8)-(12), pp. 3-4; Appendices A and C, Theorem 5, Equations (24)-(30), pp. 19-23
    relation: supports
- claim_id: exact-unification-of-polyak-averaging-primal-averaging-and-linear-decay-schedules
  kind: mechanism
  statement: Section 2.1 and Appendix B (Theorem 4 and Section B.1) show that Theorem 2 recovers classical Polyak-Ruppert online-to-batch conversion at beta_t = 0, Primal Averaging / Heavy-Ball at beta_t = 1, and last-iterate linear-decay scheduling at beta_t = t/T (alpha_t = (T - t)/T with w_t = 1, where the momentum coefficient 1 - alpha_t + t(alpha_{t+1} - alpha_t) vanishes identically so y_{t+1} - y_t = ((T - t)/T)(z_{t+1} - z_t) and y_T = x_T).
  evidence:
  - source_id: r585-primary-pdf
    locator: Section 2.1, pp. 4-5; Appendix B, Theorem 4 and Section B.1, pp. 20-21
    relation: supports
  - source_id: r585-metadata-cr
    locator: Bibliographic record (NeurIPS 2024)
    relation: supports
- claim_id: schedule-free-adamw-with-two-buffer-in-place-memory-and-warmup-squared-weighting
  kind: application
  statement: Schedule-Free AdamW (Algorithm 1, Section 4.4) eliminates the traditional momentum buffer m_t by storing only z_t, v_t, and the primary parameter buffer (flipping in-place between y_t during training steps and x_t during evaluation passes to match standard AdamW's memory footprint) while weighting the online average by c_{t+1} = gamma_t^2 / sum_{i=1}^t gamma_i^2 where gamma_t = gamma sqrt{1 - beta_2^t} min(1, t / T_warmup) (Equation 23).
  evidence:
  - source_id: r585-primary-pdf
    locator: Section 4.4, Algorithm 1, Equation (23), pp. 12-13
    relation: supports
- claim_id: batch-normalization-running-statistics-mismatch-between-y-and-x-sequences
  kind: limitation
  statement: Because training forward passes evaluate activations at the interpolated sequence y_t whereas inference and validation evaluate the model at the averaged sequence x_t, networks containing Batch Normalization layers require recomputing BatchNorm running mean and variance statistics on x_t over a small number of training batches prior to evaluation.
  evidence:
  - source_id: r585-primary-pdf
    locator: Section 4.2, p. 10; Section 4.4, pp. 12-13
    relation: supports
