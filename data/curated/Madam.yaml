id: AIMech:Madam
name: Madam
concept_kind: algorithm
review_status: DRAFT
definition: A multiplicative adaptive moments optimization algorithm for compositional neural networks that maintains an exponential moving average of squared gradients g_bar^2 <- (1 - beta) g^2 + beta g_bar^2 and updates each weight multiplicatively via W <- clamp_{sigma*}(W odot exp[-eta * sign(W) odot clamp_{eta*/eta}(g / g_bar)]), bounding the per-step relative perturbation of every weight subset while freezing initial weight signs (Dale's principle) and supporting native B-bit quantized training on a logarithmic number system ladder W = sign(W) sigma* exp(-k eta_0).
identity_notes: Distinct from additive adaptive optimizers such as Adam and RMSprop (which add -eta g / g_bar to W and can flip weight signs and violate relative perturbation bounds on small weights) and from layer-wise relative optimizers such as LARS, LAMB, and Fromage (which require global layer-wise Frobenius norm reductions). Madam guarantees ||Delta W_*||_F / ||W_*||_F = eta locally for every subset of weights W_* without layer-level synchronization.
aliases:
- Multiplicative Adaptive Moments Optimizer
- B-Bit Logarithmic Number System Madam Optimizer
- Compositional Deep-Relative-Trust Multiplicative Weight Update
