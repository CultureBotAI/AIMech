claims:
- claim_id: madam-compositional-descent-theorem-1-and-subset-relative-invariance
  kind: mechanism
  statement: 'Under the deep relative trust bound ||g_k(W + Delta W) - g_k(W)||_F / ||g_k(W)||_F <= prod_{l=1}^L (1 + ||Delta W_l||_F / ||W_l||_F) - 1 for an L-layer network, the multiplicative update W -> W odot (1 - eta sign(W) odot sign(g(W))) satisfies ||Delta W_*||_F / ||W_*||_F = eta for every weight subset W_* and angle(Delta W_k, -g_k(W)) = angle(|W_k|, |g_k(W)|) =: gamma_k, guaranteeing strict loss descent whenever eta < (1 + cos gamma_k)^{1/L} - 1 for all k = 1, ..., L (Theorem 1).'
  evidence:
  - source_id: r619-primary-pdf
    locator: Section 3.2-3.3 (Lemma 1, Modelling Assumption 1, Theorem 1, Equations 2-3) and Appendix A (p. 4, 13)
    relation: supports
  - source_id: r619-metadata-cr
    locator: Bibliographic metadata for Bernstein et al. NeurIPS 2020
    relation: supports
- claim_id: madam-sign-preservation-and-b-bit-logarithmic-ladder-scope
  kind: scope
  statement: Madam's exponential update W <- clamp_{sigma*}(W odot exp[-eta sign(W) odot clamp_{eta*/eta}(g / g_bar)]) strictly preserves the initial sign of every weight throughout training (Dale's principle), bounds per-step relative change within exp(+-eta^*), and in B-bit Madam rounds g / g_bar to multiples of eta_0 / eta so weights move directly along the 2^B discrete rungs of the logarithmic number system W = sign(W) sigma^* exp(-k eta_0) (k in {0, ..., 2^B - 1}) without maintaining a full-precision master copy.
  evidence:
  - source_id: r619-primary-pdf
    locator: Section 4 (Algorithm 1, Equations 4-5), Section 4.1 (B-bit Madam), and Section 7 (Discussion), p. 5, 7-8
    relation: supports
- claim_id: madam-fixed-learning-rate-and-low-bit-benchmark-applications
  kind: application
  statement: Using a single untuned default initial learning rate eta = 0.01 across all tasks, FP32 and 12-bit logarithmic Madam train CIFAR-10 and CIFAR-100 ResNet-18 classifiers, ImageNet ResNet-50, CIFAR-10 BigGAN class-conditional GANs (achieving 19.3 FID vs 23.9 for tuned Adam and 34 for SGD), and WikiText-2 Transformers.
  evidence:
  - source_id: r619-primary-pdf
    locator: Section 5-6 (Benchmarking Madam in FP32 and B-bit Madam), Figure 1 and Tables 1-3, p. 6-7, 14
    relation: supports
- claim_id: madam-frozen-sign-expressivity-and-weight-clipping-threshold-limitation
  kind: limitation
  statement: Because multiplicative updates cannot change a zero-initialized parameter or flip the initial random sign pattern of weights, biases must be initialized away from zero, frozen signs can slightly degrade top-1 accuracy on ImageNet compared to tuned SGD (28.9% vs 24.1% test error), and explicit weight clamping at +-sigma^* is required to prevent late-stage compound exponential weight growth.
  evidence:
  - source_id: r619-primary-pdf
    locator: Section 5 (Implementation details, p. 6) and Section 8 (Limitations and future work, Figure 3, p. 9)
    relation: supports
