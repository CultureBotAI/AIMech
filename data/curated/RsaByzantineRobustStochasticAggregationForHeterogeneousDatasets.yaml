id: AIMech:RsaByzantineRobustStochasticAggregationForHeterogeneousDatasets
name: Byzantine-Robust Stochastic Aggregation for Heterogeneous Datasets
concept_kind: algorithm
review_status: DRAFT
definition: A family of Byzantine-robust distributed stochastic learning methods for heterogeneous (non-i.i.d.) worker datasets that reformulates distributed consensus optimization by introducing local worker variables x_i and a master variable x_0 coupled through an l_1-norm (or general l_p-norm, p >= 1) consensus penalty sum_{i in R} lambda ||x_i - x_0||_p, updating each regular worker via local stochastic gradient plus penalty subgradient and updating the master via the sum of bounded dual-norm subgradients from all workers.
identity_notes: Distinct from gradient-averaging or robust gradient-aggregation rules that assume i.i.d. worker gradients (Krum, Bulyan, Trimmed-Mean, Coordinate-Wise Median, Geometric Median / RFA), and distinct from proximal heterogeneous federated optimization without Byzantine robustness (FedProx). Specifically denotes the l_1-norm and l_p-norm Regularized Stochastic Aggregation (RSA) methods of Li, Xu, Chen, Giannakis, & Ling (AAAI 2019, Eqs. 5-11, Proposition 1, Theorems 1-4).
