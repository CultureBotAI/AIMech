claims:
- claim_id: qds-transformer-sparse-adjacency-union-mechanism
  kind: mechanism
  statement: QDS-Transformer prepends a special [SOS] token to every sentence in the document and defines sparse self-attention adjacency A_QDS = A_local U A_sent U A_query U A_[CLS] (Eq. 10), where A_local[i, j] = 1 iff |i - j| <= w/2 (Eq. 7, e.g., w = 128), A_sent[i, j] = 1 iff t_j = [SOS] (Eq. 8), and A_query[i, j] = 1 iff t_i in q (Eq. 9), reducing self-attention complexity from O(n^2 * dim) to O(n * dim * (w + |q| + |s|)).
  evidence:
  - source_id: r789-primary-pdf
    locator: Section 4.1-4.3, Equations (7)-(10), p. 4
    relation: supports
  - source_id: r789-primary-pdf
    locator: build_qds_adjacency vs build_local_only_adjacency sparsity and reachability verification
    relation: supports
- claim_id: qds-transformer-long-document-ranking-and-ablation-scope
  kind: scope
  statement: On TREC 2019 Deep Learning Track document ranking and few-shot TREC benchmarks (Robust04, ClueWeb09-B, ClueWeb12-B13), QDS-Transformer outperforms RoBERTa-MaxP, TKL, Sparse-Transformer, Longformer-QA, and Transformer-XH while achieving over 2x speedup compared to dense 2,048-token RoBERTa when compiled with TVM custom CUDA kernels.
  evidence:
  - source_id: r789-primary-pdf
    locator: Section 6.1-6.3, Tables 2-5, Figure 3, pp. 6-7
    relation: supports
- claim_id: qds-transformer-irregular-sparsity-cuda-kernel-limitation
  kind: limitation
  statement: Realizing actual wall-clock GPU speedups from A_QDS requires custom Tensor Virtual Machine (TVM) CUDA kernel compilation (as naive masking is slower than dense self-attention), and irregular sentence-boundary skipping patterns in A_sent and A_query achieve lower hardware utilization than purely diagonal local windows while token-wise feed-forward layers O(dim^2 * n) remain unpruned.
  evidence:
  - source_id: r789-primary-pdf
    locator: Section 4.3, pp. 4-5; Section 6.3, Table 5, p. 7
    relation: supports
