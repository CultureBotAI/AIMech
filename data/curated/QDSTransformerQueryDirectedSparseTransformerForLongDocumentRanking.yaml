id: AIMech:QDSTransformerQueryDirectedSparseTransformerForLongDocumentRanking
name: 'QDS-Transformer: Query-Directed Sparse Transformer for Long Document Ranking'
concept_kind: architecture
review_status: DRAFT
definition: A long-document ranking Transformer architecture (Jiang, Xiong, Lee, & Wang, Findings of EMNLP 2020) that replaces the dense n x n self-attention adjacency matrix A = 1 in H_hat^l = A * M * V^T with a Query-Directed Sparse adjacency matrix A_QDS = A_local U A_sent U A_query U A_[CLS] over the concatenated query-document sequence (up to n = 2,048 tokens), combining local sliding-window attention (A_local[i, j] = 1 iff |i - j| <= w/2), hierarchical sentence-boundary attention on prepended start-of-sentence tokens (A_sent[i, j] = 1 iff t_j = [SOS]), query-directed global attention on query tokens (A_query[i, j] = 1 iff t_i in q), and global [CLS] attention, reducing per-layer self-attention complexity from O(n^2 * dim) to O(n * dim * (w + |q| + |s|)).
identity_notes: Distinct from general-purpose sparse Transformers such as Sparse Transformer (local/strided attention only) and Longformer-QA (which places global attention only on two task tokens without sentence-level [SOS] hierarchy or full query-directed paths), and from passage-splitting rankers such as BERT-MaxP or PARADE. QDS-Transformer encodes the entire long document up to 2,048 tokens in a unified cross-encoder with IR-axiomatic sparse attention compiled via TVM CUDA kernels.
aliases:
- Query-Directed Sparse Transformer
- QDS-Transformer Long Document Ranker
- Query-Directed Sparse Attention Transformer
