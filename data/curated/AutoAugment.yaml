claims:
- claim_id: method
  kind: mechanism
  statement: In the published search space, a policy contains five subpolicies, each with two ordered
    operations. An operation has a type, application probability and magnitude; the search uses 16 operation
    types, 11 probability values and 10 magnitude values, with magnitude ignored when an operation does
    not need it. During child-model training, select a subpolicy uniformly for each image and apply its
    operations according to their respective probabilities. An autoregressive recurrent controller samples
    the policy decisions. Train the child model on the training split with that policy, measure held-out
    validation accuracy, and use that reward to update the controller with proximal policy optimization.
    The described controller emits 30 decisions for the five two-operation subpolicies. After search,
    concatenate the subpolicies from the five best policies into a 25-subpolicy policy for final model
    training. Particular child architectures, search budgets and augmentation baselines are experimental
    settings rather than the identity of the procedure.
