- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Exact finite-sample calculations of False Discovery Proportion (FDP) distributions, moments,
    variances, and least favorable configurations for step-up and step-down procedures directly quantify
    and control false positive rates in multiple hypothesis testing, mitigating multiplicity-induced false
    discoveries (AIO:DataDredgingBias).
limitations:
- For general non-linear thresholds where Finner-Roters Lemma 2.1 (Equation (7)) does not apply, Steck's
  recursive computation of Psi_k (Equation (6)) involves alternating-sign binomial terms that suffer severe
  floating-point cancellation for m >= 50 unless evaluated in high-precision arithmetic (Section 2.4,
  page 590; Section 3.2, page 596).
- Condition (A) in Theorem 4.1 establishes the Dirac-uniform distribution F_1 == 1 as the least favorable
  configuration for step-down procedures over concave alternative c.d.f.s F_1 in F', whereas for non-concave
  location-shift alternatives (such as the one-sided Gaussian alternative with moderate mu in Figure 2,
  page 600) FDR(LSD) can exceed its Dirac-uniform value (Remark 4.1, pages 599-600).
- In the proof that the linear step-down procedure satisfies Condition (A) (Section 6.4, page 608), Equation
  (34) writes S_{m,k} = a_{m,k} + b_{m,k}*S_{m-1,k} by applying ((m-k-i)/(m-k))*comb(m-k, i) = comb(m-k-1,
  i) while simultaneously replacing the exponent m-k-i of (m - alpha*k - (i+1)*alpha) with m-1-k-i (introducing
  a small algebraic discrepancy of at most 0.03895035 for m = 6, alpha = 0.2), although direct evaluation
  of S_{m,k} from Equation (21) confirms that k -> S_{m,k} is strictly increasing ([0.9137931, 0.95108711,
  0.97138902, 0.98431953, 0.99333333, 1.0]) so Condition (A) and Theorem 4.1 hold as stated.
- All 28 pages of the PDF and all 667 lines of the ar5iv HTML of Roquain & Villers (2011, Annals of Statistics
  39(1):584-612, arXiv:1002.2845v2, DOI:10.1214/10-AOS847) were read. Constructed numerical checks in
  research/discovery/exact-step-up-step-down-fdp-moments-and-lfc-analysis-boundaries.py verify (1) Theorem
  3.1 exact agreement of conditional binomial moments (Equation (11)) and Stirling-number moments (Equation
  (13)) for s = 1..4 at m = 5, pi_0 = 0.6, alpha = 0.25 (E[FDP] = 0.15, E[FDP^2] = 0.1170884792, E[FDP^3]
  = 0.101398793 vs 0.0875851833 when omitting {3 \atop 2} = 3), (2) Theorem 3.2 non-binomial conditional
  step-down law (L1 gap 0.12385118) and exact agreement of Equations (20) and (21) for Dirac-uniform LSD
  (0.1346047661), (3) Proposition 3.6 and Equations (25)-(26) negative-correlation counterexample (FDR(LSU)
  = 0.0375 = 3*alpha/4 > 0.025), (4) Theorem 4.1 SU vs SD LFC split on t_k = 0.9*(k/m)^{9/10} (SU uniform
  0.45956142 > Dirac 0.453016, SD Dirac 0.41564914 > uniform 0.34753598), and (5) Theorem 4.3 exact FDP
  variance bounds and sparse benchmark at m = 10000, alpha = 0.05, 1 - pi_0 = 0.01 (min SD(FDP) = 0.021685
  ~= 0.0217).
