claims:
- claim_id: conditional-binomial-step-up-fdp-law-and-stirling-moment-formula
  kind: mechanism
  statement: Under the unconditional independent two-group mixture model P_bar^I_{(pi_0, F_1)} with marginal
    c.d.f. G(t) = pi_0*F_0(t) + pi_1*F_1(t), Theorem 3.1 (Equations (11)-(15)) proves that conditionally
    on |SU(t)| = k (for 1 <= k <= m), the number of false rejections |H_0(H) cap SU(t)| follows the exact
    binomial distribution Binom(k, pi_0*F_0(t_k)/G(t_k)) (Equation (11)). Consequently, for every integer
    s >= 1, the s-th moment of the FDP is given exactly by E[FDP(SU(t), H)^s] = sum_{ell=1}^{s wedge m}
    (m!/(m - ell)!) {s \atop ell} pi_0^ell sum_{k=ell}^m (F_0(t_k)^ell / k^s) D_{m-ell}([G(t_{j+ell})]_{1<=j<=m-ell},
    k-ell) (Equation (13)), where {s \atop ell} is the Stirling number of the second kind (correcting
    Proposition 2.2 of Ferreira & Zwinderman 2006, which omitted {s \atop ell} for s >= 3) and D_m(b,
    k) = comb(m, k) b_k^k Psi_{m-k}(1 - b_m, ..., 1 - b_{k+1}) is evaluated in O(m^3) operations via Steck's
    recursion (Equations (6) and (8)).
  evidence:
  - source_id: roquain-villers2011-pdf
    locator: Section 2.4, pages 589–590, Equations (6) and (8); Section 3.1.1, pages 591–593, Theorem
      3.1 and Equations (11)–(15); Section 6.2, pages 605–606, Proof of Theorem 3.1
    relation: supports
  - source_id: roquain-villers2011-ar5iv
    locator: Section 2.4–3.1.1, lines 80–125, Equations (6), (8), and Theorem 3.1 Equations (11)–(15);
      Section 6.2, lines 192–198
    relation: supports
- claim_id: non-binomial-step-down-conditional-law-and-finner-roters-lsd-fdr
  kind: mechanism
  statement: For a step-down procedure SD(t), Section 3.1.2 (Equations (16)-(18)) shows that the conditional
    distribution of |H_0(H) cap SD(t)| given |SD(t)| = k is not binomial when F_1 is nonlinear (such as
    F_1(u) = sqrt(u)), and Theorem 3.2 (Equations (19)-(20)) derives the exact step-down FDR formula FDR(SD(t))
    = pi_0*m sum_{k=1}^m (t_k/k) D_tilde_{m-1}([G(t_j)]_{1<=j<=m-1}, k-1) sum_{i=0}^{m-k} (k/(k+i)) D_tilde_{m-k}([(G(t_{j+k})
    - G(t_k))/(1 - G(t_k))]_{1<=j<=m-k}, i) where D_tilde_m(b, k) = comb(m, k) Psi_k(b_1, ..., b_k) (1
    - b_{k+1})^{m-k} (Equation (9)). Under the Dirac-uniform configuration F_1 == 1 and linear thresholds
    t_k = alpha*k/m, Finner-Roters Lemma 2.1 (Equation (7)) reduces Psi_k(nu_1 + j*nu_2) to (nu_1 + nu_2)*(nu_1
    + (k+1)*nu_2)^{k-1}, yielding the closed-form expansion FDR(LSD) = alpha*pi_0 sum_{k=1}^m D_tilde_{m-1}([G(t_j)],
    k-1) S_{m,k} < alpha*pi_0 (Equation (21)).
  evidence:
  - source_id: roquain-villers2011-pdf
    locator: Section 2.4, page 590, Lemma 2.1 and Equations (7) and (9); Section 3.1.2, pages 593–595,
      Theorem 3.2, Corollary 3.3, and Equations (16)–(21); Section 6.3, page 607, Proof of Theorem 3.2
    relation: supports
  - source_id: roquain-villers2011-ar5iv
    locator: Section 2.4, lines 80–97, Lemma 2.1 and Equations (7), (9); Section 3.1.2, lines 126–146,
      Theorem 3.2 and Equations (16)–(21); Section 6.3, lines 199–205
    relation: supports
- claim_id: condition-a-step-down-concave-lfc-and-negative-correlation-counterexample
  kind: mechanism
  statement: Theorem 4.1 (Section 4.1.1, pages 597-599, Equation (24)) proves that if Condition (A) holds—namely
    k -> (t_k/k) sum_{i=0}^{m-k} (k/(k+i)) D_tilde_{m-k}([(t_{j+k} - t_k)/(1 - t_k)]_{1<=j<=m-k}, i) is
    nondecreasing for k in {1, ..., m}—then the Dirac-uniform configuration F_1 == 1 maximizes FDR(SD(t))
    over all concave alternative c.d.f.s F_1 in F', and proves that the linear step-down procedure t_k
    = alpha*k/m satisfies Condition (A). For the concave threshold family t_k = 0.9*(k/m)^{9/10} (m =
    5, pi_0 = 0.5), k -> t_k/k is decreasing while Condition (A) holds, so the LFC over F_1 in F' is F_1(x)
    = x for SU(t) (Corollary 4.2) but F_1 == 1 for SD(t). Under Gaussian equicorrelation, Proposition
    3.6 and Section 4.1.2 (Equations (25)-(26)) prove continuity in (pi_0, rho, mu) at finite m and show
    that for m = 2, m_0 = 1, rho -> -1^-, and mu = z_1 + z_2, FDR(LSU) = 3*alpha/4 = alpha*(m_0/m)*(1
    + 1/2), attaining the full Benjamini-Yekutieli bound and exceeding the Dirac-uniform level alpha/2.
  evidence:
  - source_id: roquain-villers2011-pdf
    locator: Section 3.2, pages 595–597, Corollaries 3.4–3.5 and Proposition 3.6; Section 4.1.1–4.1.2,
      pages 597–600, Theorem 4.1, Corollary 4.2, and Equations (24)–(26); Section 6.4, pages 607–608
    relation: supports
  - source_id: roquain-villers2011-ar5iv
    locator: Section 3.2–4.1.2, lines 147–178, Corollaries 3.4–3.5, Proposition 3.6, Theorem 4.1, Corollary
      4.2, and Equations (24)–(26); Section 6.4, lines 206–232
    relation: supports
- claim_id: exact-lsu-fdp-variance-bounds-and-sparse-convergence-rate
  kind: mechanism
  statement: 'For the linear step-up procedure LSU (t_k = alpha*k/m) under the unconditional independent
    mixture model with F_0(x) = x, Theorem 4.3 and Section 6.5 (Equations (28)-(30) and (35)) prove that
    E[FDP(LSU, H)^2] = pi_0*alpha*u_0 + (1 - 1/m)*(pi_0*alpha)^2 where u_0(beta, gamma) = sum_{j=0}^{m-1}
    ((1 - (m - 1 - j)*gamma)/(j + 1)) comb(m - 1, j) (beta - gamma)^j with gamma = pi_0*alpha/m and beta
    = G(alpha/m), yielding exact closed-form extrema of Var[FDP(LSU, H)]: (i) the minimum over F_1 in
    F is attained at F_1 == 1 and equals pi_0*alpha*((1 - pi_0*alpha)*((1 - pi1^{m})/(m*pi1)) + (pi_0*alpha/m)*((1
    - pi1^{m-1})/pi1 - 1)) (Equation (29)); (ii) the minimum over concave F_1 in F'' is attained at F_1(x)
    = x and equals pi_0*alpha*(1 - alpha)*(1 - (1 - pi_0)*alpha/m); and (iii) the supremum over F_1 in
    F is approached as F_1 -> 0 and equals pi_0*alpha*(1 - pi_0*alpha) (Equation (30)). In the sparse
    regime 1 - pi_{0,m} ~ m^{-beta} (0 < beta < 1), min_{F_1 in F} Var[FDP(LSU)] decays only as alpha*m^{-(1-beta)}
    (at m = 10000, alpha = 0.05, 1 - pi_0 = 0.01, min SD(FDP(LSU)) ~= 0.0217).'
  evidence:
  - source_id: roquain-villers2011-pdf
    locator: Section 4.2, pages 600–603, Theorem 4.3 and Equations (28)–(30), Figures 3–4; Section 6.5,
      pages 608–610, Proof of Theorem 4.3 and Equation (35)
    relation: supports
  - source_id: roquain-villers2011-ar5iv
    locator: Section 4.2, lines 179–190, Theorem 4.3 and Equations (28)–(30); Section 6.5, lines 233–291,
      Equation (35)
    relation: supports
