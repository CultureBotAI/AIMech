id: AIMech:ExactStepUpStepDownFDPMomentsAndLFCAnalysis
name: exact step-up and step-down false discovery proportion moment formulas and least favorable configuration
  analysis
aliases:
- Roquain-Villers Exact Step-Up and Step-Down FDP Distribution and Moment Framework
- Conditional Binomial Step-Up FDP Law and Stirling-Number Moment Decomposition
- Step-Down Condition (A) Least Favorable Configuration and Linear Step-Up FDP Variance Extrema
concept_kind: mathematical_method
definition: 'A finite-sample multiple hypothesis testing analysis framework developed by Etienne Roquain
  and Fanny Villers (2011, Annals of Statistics 39(1):584-612, arXiv:1002.2845v2, DOI:10.1214/10-AOS847)
  that characterizes the exact joint distribution and moments of the False Discovery Proportion (FDP)
  for general step-up SU(t) and step-down SD(t) procedures under the unconditional independent two-group
  mixture model P_bar^I_{(pi_0, F_1)} and equicorrelated multivariate normal (EMN) dependence: (1) proves
  that conditionally on |SU(t)| = k, the number of false rejections |H_0(H) cap SU(t)| is exactly binomial
  Binom(k, pi_0*F_0(t_k)/G(t_k)) where G(t) = pi_0*F_0(t) + pi_1*F_1(t) (Theorem 3.1, Equation (11)),
  yielding exact finite-sample formulas for the FDP cumulative distribution function (Equation (12)),
  all s-th moments E[FDP(SU(t), H)^s] via Stirling numbers of the second kind {s \atop ell} and step-up
  rejection-count probabilities D_{m-ell} (Equation (13)), the FDR (Equation (14)), and polynomial-time
  average power (Equation (15)); (2) proves that |H_0(H) cap SD(t)| given |SD(t)| = k is not binomial
  for general alternatives F_1 (Equations (16)-(18)) and derives the exact joint rejection distribution
  (Equation (19)), exact step-down FDR formula (Theorem 3.2, Equation (20)), and closed-form Finner-Roters
  expansion for linear step-down (LSD) in the Dirac-uniform model (Equation (21)); (3) extends exact SU/SD
  FDP distribution and moment formulas to non-negatively equicorrelated Gaussian models via 1D/2D Gaussian
  conditioning (Corollaries 3.4-3.5, Proposition 3.6) and constructs a two-hypothesis negatively correlated
  Gaussian configuration (m = 2, m_0 = 1, rho -> -1^-, mu = z_1 + z_2) where FDR(LSU) = 3*alpha/4 = alpha*(m_0/m)*(1
  + 1/2), attaining the full Benjamini-Yekutieli upper bound and disproving the Dirac-uniform LFC conjecture
  under negative correlation (Section 4.1.2, Equations (25)-(26)); (4) establishes Condition (A) for step-down
  procedures to have the Dirac-uniform distribution F_1 == 1 as their least favorable configuration over
  concave alternative c.d.f.s F_1 in F'', proving that LSD satisfies Condition (A) (Theorem 4.1, Equation
  (24)); and (5) derives exact closed-form minimum and maximum of Var[FDP(LSU)] over general and concave
  alternative classes F, F'', and F_eps (Theorem 4.3, Equations (28)-(30)).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 598 previously curated AIMech concepts.
  While AIMech:StepUpDownLeastFavorableConfigurationFDRBounds (Blanchard, Dickhaus, Roquain, & Villers
  2014) derives upper and lower bounds for general step-up-down procedures of order r via threshold functions
  tau_k, tau'_k and provenance-independent mixture bounds, and AIMech:ArchimedeanCopulaStepUpFDRBounds
  (Bodnar & Dickhaus 2014) bounds Benjamini-Hochberg FDR under Archimedean copulae via Marshall-Olkin
  frailty conditioning, neither record establishes the conditional binomial law |H_0 cap SU(t)| | (|SU(t)|
  = k) ~ Binom(k, pi_0*F_0(t_k)/G(t_k)) under the unconditional mixture model, the Stirling-number s-th
  moment formula E[FDP(SU(t))^s] (Theorem 3.1, Equation (13)), the non-binomial conditional law and exact
  joint distribution for step-down procedures (Theorem 3.2, Equations (16)-(21)), Condition (A) for step-down
  Dirac-uniform LFCs over concave alternatives and the SU vs SD LFC split on t_k = 0.9*(k/m)^{9/10} (Theorem
  4.1), the m = 2 negatively correlated Gaussian counterexample attaining 3*alpha/4 (Equations (25)-(26)),
  or the closed-form minimum and maximum of Var[FDP(LSU)] over F, F', and F_eps (Theorem 4.3, Equations
  (28)-(30)).
