name: Delayed-rejection adaptive Metropolis
definition: An adaptive Metropolis procedure combining history-based Gaussian proposal covariance updates
  between transitions with corrected delayed-rejection proposal stages within a transition.
concept_kind: algorithm
identity_notes: 'DRAM combines two distinct mechanisms: retained-history covariance learning across iterations
  and reversed-path acceptance corrections for additional attempts after rejection. The inspected author
  implementation supplies the explicit Gaussian-stage realization; it is not merely repeated ordinary
  Metropolis tests. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 181 prior native IDs/names/aliases. Ignored-inclusive searches of both full checkouts found prior
  discovery leads, neighboring sampler discussions and unrelated author-name/environment substrings. Existing
  random-walk Metropolis, delayed-rejection, fixed symmetric delayed-rejection and RAM records were inspected;
  shared components do not make these procedures equivalent.'
limitations:
- The original 2006 article metadata was located but its complete method PDF was not obtained. This record
  is supported by the named author’s pinned implementation and its covariance helper, not a claim to have
  read that article.
- The Gaussian factors remain fixed within a delayed-rejection transition. Recomputing adaptation from
  rejected internal candidates or ignoring reverse-path factors would require different justification.
- The implementation defaults to two attempts and adaptation every 100 iterations; its usage comment about
  three stages is inconsistent with those executable defaults. These counts are options, not the concept
  identity.
- Optional covariance pseudoweights, fixed nonadapted coordinates, early rejection-rate scaling, variance
  sampling and hierarchical updates are outside the simple fixed-target account here.
- Jitter only on factorization failure differs from always adding a positive regularizer. Source-code
  inspection alone establishes neither correctness for arbitrary targets nor adaptive ergodicity; no MATLAB
  execution or performance comparison was performed.
- Initialize within positive target support. Zero reverse-path probability gives zero acceptance; numerical
  evaluation must handle vanishing densities and log ratios without invalid divisions.
