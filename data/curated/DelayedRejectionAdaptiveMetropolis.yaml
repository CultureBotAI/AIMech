claims:
- claim_id: method
  kind: mechanism
  statement: At fixed proposal settings for a transition, first propose y1 from N(x,C1) and use the Metropolis
    target ratio. After rejection propose y2 from N(x,C2), centered at the original x, with C2=C1/d1²
    for a positive stage scale d1 (d1>1 narrows the proposal). Let q_i(a,b) denote the Gaussian proposal
    density at b from a and a1(a,b)=min(1,pi(b)/pi(a)). On a reachable rejection path, accept y2 with
    min(1, [pi(y2)q1(y2,y1)q2(y2,x)(1−a1(y2,y1))]/[pi(x)q1(x,y1)q2(x,y2)(1−a1(x,y1))]). Higher stages
    use the recursive forward/reverse rejection products and earlier-stage Gaussian proposal ratios. Retain
    x after all capped stages reject. At scheduled iterations, update the empirical covariance from stored
    retained states including repeats, scale its Cholesky factor, and recompute stage factors for later
    transitions. In the inspected implementation diagonal jitter is attempted only when factorization
    fails; if that attempt also fails, the previous proposal factor is retained.
