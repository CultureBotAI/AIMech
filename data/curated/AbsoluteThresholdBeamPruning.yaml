claims:
- claim_id: method
  kind: mechanism
  statement: First retain candidates up to the current beam width. Let M be the maximum score in that
    candidate list and let a>0 be the absolute pruning margin. Discard a candidate when its score is at
    most M−a, including equality as printed in Equation (2). Continue decoding with the survivors; applying
    pruning after the cap can reduce the active count without refilling from previously discarded candidates.
  evidence:
  - source_id: method-source
    locator: Section 4, introductory paragraph and Absolute Threshold Pruning, Equation (2), printed p.
      57 / PDF p. 2
    relation: supports
- claim_id: search-error-scope
  kind: limitation
  statement: Additional pruning can change outputs by discarding a better-scoring hypothesis. The paper’s
    reported quality preservation and speed improvements are empirical outcomes in specific language-pair
    setups, not exact-search guarantees.
  evidence:
  - source_id: search-error-scope
    locator: Section 5 discussion and Section 6, printed p. 58 / PDF p. 3
    relation: supports
