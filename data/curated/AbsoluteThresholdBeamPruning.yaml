name: Absolute threshold pruning for sequence beams
definition: A sequence-beam pruning procedure that first applies the beam-size cap, then discards candidates
  whose score is at least a specified positive margin below the best score in that capped candidate list.
concept_kind: algorithm
identity_notes: This is Freitag and Al-Onaizan’s absolute threshold pruning rule. It uses an additive
  score difference, unlike their relative-score and last-token relative thresholds. It is an additional
  local pruning step, not a stopping certificate or a method that automatically widens the beam. No normalized
  identity match was found across the 442 AIO and 146 prior native records; both checkout text searches
  included ignored and hidden files and returned no matches for the selected exact IDs, full labels, aliases
  and source titles.
limitations:
- The extra pruning can remove a prefix leading to the best eventual output. The paper explicitly reports
  search errors even where aggregate task metrics remain similar.
- The numerical margin depends on score scale, log base and model calibration. It is not a relative probability
  threshold.
- A positive margin is required to retain the best finite-scoring item under the printed non-strict inequality;
  a zero margin would discard even maximum-score candidates.
- The procedure is layered onto a decoder with its own EOS and width policy. It does not by itself specify
  the entire decoder or guarantee improved speed or quality.
- The separate relative-pruning equations have a score-scale ambiguity under negative log scores. No correction
  to those distinct variants is inferred from this additive rule.
