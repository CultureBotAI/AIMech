claims:
- claim_id: nosadam-lemma-3-1-non-increasing-weights-and-gamma-psd
  kind: mechanism
  statement: Under Algorithm 1 with beta_{2,t} = B_{t-1} / B_t and B_t = sum_{k=1}^t b_k, unrolling V_t = beta_{2,t} V_{t-1} + (1 - beta_{2,t}) g_t^2 yields V_t = (1 / B_t) sum_{k=1}^t b_k g_k^2, and Lemma 3.1 proves that with alpha_t = alpha / sqrt(t) the inverse squared learning-rate difference V_t / alpha_t^2 - V_{t-1} / alpha_{t-1}^2 = (t / (B_t alpha^2)) sum_{j=1}^t b_j g_j^2 - ((t - 1) / (B_{t-1} alpha^2)) sum_{j=1}^{t-1} b_j g_j^2 >= 0 is tightly satisfied if and only if B_t / t (equivalently b_t) is non-increasing.
  evidence:
  - source_id: r617-primary-pdf
    locator: Section 3, Lemma 3.1 and Algorithm 1, p. 3-4
    relation: supports
  - source_id: r617-metadata-cr
    locator: Bibliographic metadata for Huang, Wang, & Dong (IJCAI 2019, pp. 2542-2548)
    relation: supports
- claim_id: nosadam-hyperharmonic-regret-bound-and-p-nosadam-scope
  kind: scope
  statement: "When B_t / t <= B_{t-1} / (t - 1) and B_t / (t b_t^2) >= B_{t-1} / ((t - 1) b_{t-1}^2)\u2014both satisfied data-independently by hyperharmonic weights b_k = k^{-gamma} (gamma >= 0) in NosAdam-HH\u2014Theorem 3.2 and Corollary 3.2.1 guarantee O(sqrt(T)) online convex regret R_T <= (D_inf^2 / (2 alpha (1 - beta_1))) sum_{i=1}^d sqrt(T) v_{T,i}^{1/2} + (D_inf^2 G_inf beta_1 d) / (2 (1 - beta_1) (1 - lambda)^2) + (2 alpha beta_1 / (1 - beta_1)^3) G_inf sqrt(T), and Theorem A.1 generalizes this to p-NosAdam with regret O(T^{max(1/p, (p-1)/p)}) for any p > 1."
  evidence:
  - source_id: r617-primary-pdf
    locator: Section 3 (Theorem 3.2, Corollary 3.2.1, p. 4) and Appendix A (Algorithm 2, Theorem A.1, Lemmas A.2-A.5, p. 11-16)
    relation: supports
- claim_id: nosadam-outlier-recovery-and-deep-vision-applications
  kind: application
  statement: Unlike AMSGrad whose running maximum v_hat_t = max(v_hat_{t-1}, v_t) cannot decrease after a single 100x gradient spike and severely slows subsequent convergence, NosAdam's weighted average V_t can both increase and decrease, converging to global minima on non-convex bowl landscapes with sharp local traps and outperforming Adam and AMSGrad on MNIST multilayer perceptrons and CIFAR-10 Wide-ResNet-28.
  evidence:
  - source_id: r617-primary-pdf
    locator: Section 4 (Figures 1-5) and Section 5 (Experiments, Figures 6-7), p. 5-9
    relation: supports
- claim_id: nosadam-bad-local-initialization-sensitivity-limitation
  kind: limitation
  statement: Because NosAdam assigns larger weights b_k to early gradients (k small), if the optimization is initialized directly inside a sharp suboptimal local valley where all initial gradients point toward the local trap, its strong memory of early gradients makes it harder to escape than Adam's rapidly forgetting exponential moving average.
  evidence:
  - source_id: r617-primary-pdf
    locator: Section 4 (Why Nostalgic?, Figure 5), p. 6-8
    relation: supports
