id: AIMech:NosAdam
name: Nostalgic Adam
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive first-order stochastic optimization algorithm that replaces Adam's constant second-moment decay parameter beta_2 with a scheduled sequence beta_{2,t} = B_{t-1} / B_t defined by cumulative sums B_t = sum_{k=1}^t b_k of non-increasing positive weights b_k (such as the hyperharmonic series b_k = k^{-gamma} with gamma >= 0 in NosAdam-HH), so that the second-moment estimate V_t = beta_{2,t} V_{t-1} + (1 - beta_{2,t}) g_t^2 = (1 / B_t) sum_{k=1}^t b_k g_k^2 weights past squared gradients at least as heavily as recent ones and guarantees positive semi-definiteness of the inverse learning-rate increment Gamma_t = V_t / alpha_t^2 - V_{t-1} / alpha_{t-1}^2 >= 0.
identity_notes: Distinct from Adam (which uses constant beta_2 in (0, 1) giving exponentially increasing weights (1 - beta_2) beta_2^{t-k} to recent gradients and violating Gamma_t >= 0), from AMSGrad (which forces monotonicity via a hard running maximum v_hat_t = max(v_hat_{t-1}, v_t) that permanently stalls step sizes after an outlier gradient spike), and from AdaShift (AIMech:AdaShift, which shifts gradients by n steps). NosAdam generalizes AdaGrad (recovered at gamma = 0 up to 1/t averaging) and extends to p-norm moment scaling in p-NosAdam (Theorem A.1).
aliases:
- NosAdam
- NosAdam-HH Hyperharmonic Second-Moment Adaptive Optimization
- Past-Gradient Weighted Adaptive Moment Estimation
- p-NosAdam Generalized Hyperharmonic Adaptive Optimizer
