claims:
- claim_id: time-multiple-oracles-protocol-and-homogeneous-minimax-lower-bound
  kind: mechanism
  statement: Under the Time Multiple Oracles Protocol (Protocol 3) and wall-clock complexity measure m_{time}(A_{zr}, F_{Delta,L}) (Equation 6), Theorem 6.4 proves using a zero-chain worst-case function F_T and parallel Bernoulli-gated stateful delay oracles O_{tau_i}^{hat{nabla} f} that any zero-respecting parallel algorithm requires at least Omega(min_{m in [n]} ((1/m) sum_{i=1}^m 1/tau_i)^{-1} (L Delta / epsilon + sigma^2 L Delta / (m epsilon^2))) seconds to find an epsilon-stationary point E[||nabla f(hat{x})||^2] <= epsilon, even if the algorithm is allowed to interrupt ongoing worker computations (Protocol 8, Section F).
  evidence:
  - source_id: r579-primary-pdf
    locator: Section 4-6, Protocol 2-3, Equation (6), Theorem 6.4, pp. 4-7; Appendix D.2 and F, pp. 21-27, 42
    relation: supports
- claim_id: rennala-sgd-automatic-straggler-truncation-and-optimal-time-rate
  kind: mechanism
  statement: With batch size S = max{ceil(sigma^2 / epsilon), 1} and stepsize gamma = min{1/L, epsilon S / (2 L sigma^2)}, Rennala SGD (Method 4) requires K >= 24 Delta L / epsilon outer iterations (Theorem 7.4) and completes each batch in at most 2 min_{j in [n]} (sum_{i=1}^j 1/tau_i)^{-1} (S + j) seconds (Proof of Theorem 7.5, Lemma D.7), automatically assigning B_i = 0 to all slow workers i > j^* whose latency tau_i exceeds the active harmonic threshold without knowing tau_1, ..., tau_n in advance.
  evidence:
  - source_id: r579-primary-pdf
    locator: Section 7, Method 4, Theorems 7.4 and 7.5, pp. 8-9; Appendix D.3.3-D.4.3, Lemma D.7, pp. 30-35
    relation: supports
  - source_id: r579-metadata-cr
    locator: Bibliographic record
    relation: supports
- claim_id: malenia-sgd-harmonic-batch-condition-and-heterogeneous-minimax-optimality
  kind: application
  statement: In the heterogeneous data regime, Theorem A.2 establishes the lower bound Omega(tau_n L Delta / epsilon + ((1/n) sum_{i=1}^n tau_i) sigma^2 L Delta / (n epsilon^2)), and Malenia SGD (Method 6, Theorems A.3-A.4) attains this bound within a constant factor of 96 by waiting at each outer step k until the harmonic mean of per-worker fresh sample counts B_i satisfies ((1/n) sum_{i=1}^n 1/B_i)^{-1} >= S/n with S = max{ceil(sigma^2 / epsilon), n}, which bounds the aggregated gradient variance by (1/n^2) sum_{i=1}^n sigma^2 / B_i <= sigma^2 / S.
  evidence:
  - source_id: r579-primary-pdf
    locator: Appendix A, Table 2, Method 6, Theorems A.2-A.4, pp. 16-18; Appendix E.3-E.4, pp. 40-41
    relation: supports
- claim_id: worst-straggler-bottleneck-in-heterogeneous-deterministic-regime
  kind: limitation
  statement: In the heterogeneous regime where workers hold distinct local distributions D_i without data-similarity assumptions, Theorem A.2 proves that the optimization term tau_n L Delta / epsilon depends unavoidably on the slowest worker's delay tau_n, because the non-zero objective component can reside entirely on the n-th worker.
  evidence:
  - source_id: r579-primary-pdf
    locator: Appendix A.1-A.2, Theorem A.2, pp. 16-17; Appendix E.1, Part 1, p. 36
    relation: supports
