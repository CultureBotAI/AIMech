aio_no_match:
  search_scope: All 442 pinned AIO CLASS identities and scoped synonyms, all 270 preceding maintained
    identities, ignored/hidden checkout text, and semantic inspection of eight exact AIO targets plus
    seven neighboring native mechanisms.
  rationale: No inspected AIO target captures this general optimization procedure or a defining component.
    The assessment distinguishes evolutionary language models, learning/training tasks and predictive
    models from the native algorithm; it is bounded to this pinned vocabulary.
  examined_targets:
  - target: AIO:EvolutionaryLLM
    rejection_reason: The CLASS definition is a large language model with evolutionary optimization. Its
      broad related synonym evolutionary algorithms does not make a general continuous optimizer a language
      model or an exact vocabulary match.
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition concerns preprocessing/training of machine-learning models.
      General black-box continuous optimization is not inherently model training; an optional application
      does not establish a necessary mapping.
  - target: AIO:MachineLearningTask
    rejection_reason: The target denotes building methods that learn from data. These algorithms can optimize
      arbitrary evaluated functions without a learning task, so shared optimization vocabulary alone is
      insufficient.
  - target: AIO:MetaLearning
    rejection_reason: Adapting a search distribution or optimizer state does not require learning from
      metadata about machine-learning experiments as in the pinned definition.
  - target: AIO:ActiveLearning
    rejection_reason: Candidate evaluation is not the defined task of querying labels for data points.
  - target: AIO:ReinforcementLearning
    rejection_reason: A possible policy-search application does not turn the general optimizer into the
      pinned learning task; no environment/reward-policy interface is inherent to the full identity.
  - target: AIO:RandomForest
    rejection_reason: Population members and search distributions are not a predictive decision-tree ensemble;
      no random-forest surrogate is required.
  - target: AIO:EvaluationBias
    rejection_reason: This is a bias concept, not the optimizer. Possible evaluation or sampling problems
      are limitations rather than identity mappings.
