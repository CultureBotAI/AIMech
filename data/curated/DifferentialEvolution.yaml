name: Differential Evolution
definition: A population-based continuous optimization method that generates trial vectors using scaled
  differences between population members, combines mutant and target coordinates, and selects replacements
  through target-trial objective comparisons.
concept_kind: algorithm
identity_notes: This record denotes differential evolution, with the 1997 DE/rand/1/bin procedure as its
  explicitly inspected core. Mutation/crossover variants are distinguished by the source’s DE/x/y/z notation
  rather than treated as identical executable rules. It differs from generic genetic algorithms, a fitted
  Gaussian search distribution, objective-gradient descent, and DEHB’s additional budget-specific populations
  and Hyperband scheduling. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 270 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 19 and 19 lines respectively. These were prior candidate
  leads, source discussions and neighboring DEHB/FABOLAS method mentions. Eight exact AIO CLASS nodes
  with scoped synonyms and outgoing edges and seven native neighboring mechanisms were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.
limitations:
- The prose specifies replacement for a strictly smaller objective, whereas the displayed C-style Figure3
  uses <=. The tie policy must therefore be identified when implementing or comparing versions; these
  source statements are not treated as identical code. A forced mutant coordinate need not change its
  numerical value.
- DE/rand/1/bin needs at least four population members for its distinct-index rule. Difference-vector
  proposals can leave the initialization range; that range is not a hard feasible-domain boundary. Bound
  repair, general constraint handling, noise treatment and categorical encodings are additional choices.
- The method uses function evaluations, not derivatives of the objective. Population collapse can eliminate
  difference-vector variation, and finite-budget greedy selection does not certify a global optimum. The
  source’s control-variable suggestions and comparative results are empirical, not universal guarantees
  or reproduced experiments.
