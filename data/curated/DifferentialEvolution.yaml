claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a fixed-size population of real-valued vectors. In the inspected DE/rand/1/bin scheme,
    for each target select three mutually distinct current-generation population indices that also differ
    from the target index. Add a scaled difference of two selected vectors to the third to form a mutant.
    Build a trial by independently choosing mutant or target coordinates according to the crossover probability,
    forcing one randomly selected coordinate to come from the mutant. Evaluate the trial and use a greedy
    comparison against its target to choose the next-generation member. Complete all target comparisons
    using the old population before replacing it with the next population. Repeat until the configured
    stopping criterion is met. Population size, mutation scale, crossover probability and initialization
    are configuration choices.
