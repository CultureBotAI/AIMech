id: AIMech:DoraWeightDecomposedLowRankAdaptation
name: Weight-Decomposed Low-Rank Adaptation (DoRA)
concept_kind: algorithm
review_status: DRAFT
definition: 'Weight-Decomposed Low-Rank Adaptation (DoRA) is a parameter-efficient fine-tuning (PEFT) method that decomposes a pretrained weight matrix W_0 in R^{d x k} into a trainable 1 x k column-wise magnitude vector m = ||W_0||_c and a directional matrix V = W_0, and applies Low-Rank Adaptation (LoRA) exclusively to the directional component: W'' = m * (V + Delta V) / ||V + Delta V||_c = m * (W_0 + B A) / ||W_0 + B A||_c, where B in R^{d x r} and A in R^{r x k} with rank r << min(d, k) while W_0 remains frozen. By decoupling magnitude and direction updates, DoRA reproduces the negative-slope magnitude-direction update correlation characteristic of full fine-tuning (FT) while merging W'' back into a single d x k matrix prior to deployment with zero additional inference latency.'
identity_notes: Distinct from standard Low-Rank Adaptation (LoRA, Hu et al., 2022), which updates W' = W_0 + B A directly without column-wise directional normalization ||W_0 + B A||_c or an independent magnitude vector m, causing LoRA to exhibit a positive coupling between magnitude and directional changes that struggles to make fine-grained directional adjustments without simultaneous large magnitude shifts. Also distinct from Weight Normalization (Salimans & Kingma, 2016), which trains full weight matrices V from random initialization rather than freezing W_0 and adapting V via a low-rank increment Delta V = B A.
aliases:
- DoRA
- Weight-Decomposed Low-Rank Adaptation
- DoRA PEFT
- Magnitude-Direction Decomposed Low-Rank Adaptation
