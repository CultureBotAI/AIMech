claims:
- claim_id: r651-claim-magnitude-direction-decomposition
  kind: mechanism
  statement: DoRA initializes the trainable magnitude vector m = ||W_0||_c in R^{1 x k} and frozen directional base V = W_0 so that W' = m * (W_0 + B A) / ||W_0 + B A||_c exactly equals W_0 at initialization (when B = 0), and during fine-tuning updates only m (k parameters) and the low-rank factors B and A, adding just k / (d * k) = 1/d fractional parameter overhead over LoRA.
  evidence:
  - source_id: r651-primary-pdf
    locator: Section 3.2, Equation (5) and Figure 2, p. 4-5
    relation: supports
- claim_id: r651-claim-gradient-stabilization-and-detached-norm
  kind: mechanism
  statement: Under DoRA's reparameterization V' = V + Delta V, the gradients with respect to magnitude m and directional increment Delta V are scaled by 1 / ||V'||_c, and detaching ||V + Delta V||_c from backpropagation (treating ||V'||_c as a constant C during the backward pass) leaves the magnitude gradient nabla_m L unchanged while eliminating computational graph overhead for the column norm.
  evidence:
  - source_id: r651-primary-pdf
    locator: Section 3.3 (Gradient Analysis of DoRA), Equations (6)-(9) and Table 2, p. 5-6
    relation: supports
- claim_id: r651-claim-llm-vlm-finetuning-applications
  kind: application
  statement: DoRA consistently outperforms LoRA across commonsense reasoning fine-tuning on LLaMA-7B/13B, LLaMA2-7B, and LLaMA3-8B, visual instruction tuning on LLaVA-1.5-7B, and image/video-text understanding on VL-BART, and retains its accuracy advantage even at very low ranks (r = 4 to 8) while merging into W_0 with zero inference overhead.
  evidence:
  - source_id: r651-primary-pdf
    locator: Section 4.1-4.3, Tables 3, 4, 5 & Figure 4, p. 6-9
    relation: supports
- claim_id: r651-claim-training-memory-and-norm-compute-limitation
  kind: limitation
  statement: Although detaching ||V + Delta V||_c substantially reduces backward-pass memory compared to full backpropagation through the column norm, DoRA still requires materializing or computing the column-wise norms ||W_0 + B A||_c during each forward pass of training, incurring a modest training-time memory and compute overhead relative to vanilla LoRA.
  evidence:
  - source_id: r651-primary-pdf
    locator: Section 3.3, Table 2 (Training memory savings of detaching ||V + Delta V||_c), p. 5-6
    relation: supports
