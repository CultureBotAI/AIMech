claims:
- claim_id: r428-dynamic-average-tracking-invariant-and-constant-stepsize-linear-speedup
  kind: mechanism
  statement: Initializing y_0 = G(x_0, xi_0) under a doubly stochastic mixing matrix W preserves the exact dynamic average conservation bar_y_k = (1/n) 1^T y_k = (1/n) 1^T G(x_k, xi_k) at every iteration k (Lemma 2, Eq. 5); under mu-strong convexity and L-smoothness with constant step-size alpha, the 3x3 error-moment matrix A contracts at rate rho(A) <= 1 - 2 alpha mu Gamma / (Gamma + 1) (Lemma 4, Eq. 10) to a steady-state MSE limsup_{k->infty} (1/n) E[||x_k - 1 x^*||^2] <= (alpha sigma^2 / (mu n)) O(1) + (alpha^2 L^2 sigma^2 / (mu^2 (1 - rho_w)^3)) O(rho_w^2 ||W - I||^2) completely free of inter-agent gradient heterogeneity ||nabla f_i(x^*)||^2 (Theorem 1, Remark 1, Eqs. 11-12).
  evidence:
  - source_id: r428-primary-pdf
    locator: Section 2-3 Main Results & Convergence Analysis (Lemmas 2-7, Theorem 1, Remark 1, Equations 5-12)
    relation: supports
- claim_id: r428-diminishing-stepsize-topology-independent-asymptotic-efficiency-and-gsgt
  kind: mechanism
  statement: With diminishing step-sizes alpha_k = theta / (m + k) (where theta mu > 1), DSGT achieves the asymptotic mean-squared error 2 theta^2 sigma^2 / (n (theta mu - 1) k) for every agent (minimized at theta = 2 / mu to 8 sigma^2 / (n mu^2 k)), matching centralized stochastic gradient descent independent of the network spectral gap 1 - rho_w (Theorem 2, Remark 3); furthermore, GSGT preserves 1^T y_k = 1^T G(x_k, xi_k) via pairwise edge updates (Eqs. 37-39) and reduces communication volume by O(|E| / n) on well-connected graphs (Section 4, Theorem 3).
  evidence:
  - source_id: r428-primary-pdf
    locator: Section 2.1 Theorem 2 & Remark 3 (Equations 13-14); Section 4 GSGT (Equations 37-39, Lemma 8, Theorem 3)
    relation: supports
- claim_id: r428-doubly-stochastic-mixing-and-dual-message-overhead-limitation
  kind: limitation
  statement: Requires a doubly stochastic mixing matrix W (or symmetric pairwise gossip updates in GSGT) so that 1^T W = 1^T holds, and requires exchanging both the iterate x_{i,k} - alpha_k y_{i,k} and the tracker y_{i,k} across active links.
  evidence:
  - source_id: r428-primary-pdf
    locator: Section 2.1 Assumption 1 & Equations 4, 37-38
    relation: supports
- claim_id: r428-decentralized-logistic-regression-and-ridge-regression-sensor-networks-application
  kind: application
  statement: Applied to decentralized ridge regression and regularized logistic classification over random Erdos-Renyi, ring, and grid multi-agent networks, eliminating the steady-state heterogeneity bias of decentralized stochastic gradient descent.
  evidence:
  - source_id: r428-primary-pdf
    locator: Section 5 Numerical Experiments (Figures 1-5)
    relation: supports
