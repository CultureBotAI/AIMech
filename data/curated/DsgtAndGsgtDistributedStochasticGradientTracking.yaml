id: AIMech:DsgtAndGsgtDistributedStochasticGradientTracking
name: DSGT and GSGT (Distributed and Gossip Stochastic Gradient Tracking)
concept_kind: algorithm
review_status: DRAFT
definition: A family of decentralized stochastic optimization algorithms over doubly stochastic network graphs W (Pu & Nedic 2021, Sections 2 and 4, Equations 4 and 37-39) in which each agent i maintains a local model x_{i,k} and an auxiliary stochastic gradient tracker y_{i,k} initialized at y_{i,0} = g_i(x_{i,0}, xi_{i,0}), updating in synchronous Distributed Stochastic Gradient Tracking (DSGT) via x_{k+1} = W(x_k - alpha_k y_k) and y_{k+1} = W y_k + G(x_{k+1}, xi_{k+1}) - G(x_k, xi_k), or in randomized pairwise Gossip Stochastic Gradient Tracking (GSGT) by activating a single directed wake-up edge (i_k, j_k) per iteration to average iterates and gradient trackers across {i_k, j_k}.
identity_notes: Distinct from deterministic DIGing and Push-DIGing (AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs, Nedic, Olshevsky, & Shi 2017), which analyze exact gradients over time-varying B-connected graphs via small-gain theorems, and from D2 (AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData, Tang et al. 2018), which uses a single-variable two-step recursion X_{t+1} = (2 X_t - X_{t-1} - gamma G_t + gamma G_{t-1}) W requiring lambda_n(W) > -1/3 rather than explicit dynamic average consensus tracking y_{k+1} = W y_k + G_{k+1} - G_k and randomized pairwise gossip GSGT.
aliases:
- DSGT and GSGT
- Distributed Stochastic Gradient Tracking
- Gossip Stochastic Gradient Tracking
