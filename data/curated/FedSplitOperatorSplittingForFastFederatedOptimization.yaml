id: AIMech:FedSplitOperatorSplittingForFastFederatedOptimization
name: FedSplit (Operator Splitting for Fast Federated Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: 'An operator-splitting federated optimization algorithm (Pathak & Wainwright 2020, Algorithm 1) that reformulates finite-sum federated minimization min_{x in R^d} sum_{j=1}^m f_j(x) over the consensus subspace E = {(x_1,...,x_m) : x_1 = ... = x_m} as the monotone inclusion 0 in nabla F(x) + N_E(x) and applies Peaceman-Rachford reflection splitting T = (1/2) * (I + refl_{I_E} o refl_{s F}), updating client auxiliary variables via z_j^{(t+1/2)} = prox_{s f_j}(2 x^{(t)} - z_j^{(t)}), reflected local states z_j^{(t+1)} = z_j^{(t)} + 2 (z_j^{(t+1/2)} - x^{(t)}), and the server consensus iterate x^{(t+1)} = (1/m) sum_{j=1}^m z_j^{(t+1)}.'
identity_notes: Distinct from FedAvg / multi-step FedGD(s, e) and FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization), whose deterministic fixed points fail to satisfy sum_{j=1}^m nabla f_j(x^*) = 0 when client objectives are heterogeneous (Propositions 1 and 2), from FedDyn (AIMech:FedDynFederatedLearningBasedOnDynamicRegularization, which maintains a server dual-like state h^t for partial client participation using ADMM-like linear penalties), and from FedPD (AIMech:FedPdFederatedPrimalDualOptimizationWithAdaptivityToNonIidData, which targets non-convex primal-dual augmented Lagrangian consensus with randomized communication skipping).
aliases:
- FedSplit
- Peaceman-Rachford Federated Operator Splitting
- 'FedSplit: An Algorithmic Framework for Fast Federated Optimization'
