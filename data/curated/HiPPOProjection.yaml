name: High-order polynomial projection operators
definition: A family of time-dependent operators that represents a signal's past by coefficients of its
  optimal finite-dimensional polynomial approximation under a chosen time-varying measure.
concept_kind: mathematical_method
identity_notes: HiPPO denotes the general projection-and-coefficient framework, not one fixed state matrix,
  a complete recurrent neural network, or only the scaled-Legendre instantiation HiPPO-LegS. The qualified
  acronym distinguishes this operator family from the unrelated highlight-replay PPO method.
limitations:
- Optimality is relative to the chosen measure and finite polynomial subspace, not lossless recovery of
  arbitrary history or optimal downstream prediction.
- A tractable closed-form recurrence is not asserted for every arbitrary measure. The translated-Legendre
  sliding-window update additionally approximates the unavailable boundary value; numerical discretization
  adds its own approximation.
