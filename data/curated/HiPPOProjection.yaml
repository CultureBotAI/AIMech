claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: At each time, project the available signal history onto a polynomial subspace by minimizing
    the measure-weighted squared approximation error, then extract coefficients in the associated orthogonal
    basis. For the derived measure families, differentiating those coefficients yields linear differential
    dynamics that can be discretized as online recurrences.
