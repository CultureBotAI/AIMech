- target: AIO:DataDredgingBias
  relation: related_match
  rationale: The e-BH procedure and its self-consistent post-selection and structured variants control
    the false discovery rate under arbitrary dependence, optional stopping of bandit e-processes, and
    arbitrary data-dependent hypothesis screening without false-positive inflation from data dredging
    (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the multiple-testing and selective-inference
    bias rather than the e-BH statistical testing procedure.
limitations:
- When marginal null distributions of the e-values are unknown so that boosting must default to b_k =
  1, the actual FDR bound (K_0 / K) E[T(alpha E_k)] of the unboosted base e-BH procedure is typically
  strictly smaller than alpha K_0 / K because T(alpha E_k) truncates values below 1 to 0, resulting in
  conservative power compared with distribution-boosted e-BH (Section 5.2 Remark 1 and Section 6.2 Example
  2).
- When exact uniform p-values are available and satisfy positive regression dependency on a subset (PRDS),
  the classical Benjamini-Hochberg procedure D(alpha) dominates any p-testing procedure D(psi) obtained
  by calibrating p-values via a transform psi satisfying Condition 29 (Section 6.5 Proposition 5), and
  under arbitrary dependence the Benjamini-Yekutieli (BY) procedure can yield more rejections than power-calibrated
  e-BH when the discovery proportion k^* / K is smaller than approximately 2 / log K (Section 6.5 Example
  7 and Appendix A Table 4(b)).
- Because heterogeneous boosting factors b_k >= 1 depend on each hypothesis's marginal null distribution,
  the boosted e-values e'_k = b_k e_k need not preserve the ordering of the raw e-values e_k, so the full
  e-BH procedure can reject a hypothesis with a smaller raw e-value while failing to reject one with a
  larger raw e-value (Section 5.2 Item 4).
- All 1,242 lines of Wang & Ramdas (2022, arXiv:2009.02824) were read. Constructed numerical checks in
  research/discovery/evalue-benjamini-hochberg-procedure-boundaries.py verify Proposition 1 step-down/threshold
  equivalence, Section 5.1 post-selection self-consistency, Example 4 sharpness of the alpha K_0 / K bound,
  Examples 2, 3, 5, and 6 boosting factors under arbitrary dependence and PRDS, the Theorem 5 optimality
  counterexample, and Proposition 4 exact recovery of the BY harmonic factor l_K.
