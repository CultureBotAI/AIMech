claims:
- claim_id: base-ebh-stepdown-threshold-equivalence-and-self-consistent-fdr-control
  kind: mechanism
  statement: 'Given nonnegative (boosted or raw) e-values e''_1, ..., e''_K sorted as e''_[1] >= ... >=
    e''_[K], the base e-BH procedure G(alpha) rejects the k_e^* = max{k in {1, ..., K} : k e''_[k] / K
    >= 1 / alpha} largest e-values (Eq. 5), which is equivalent to rejecting all H_k with e''_k >= t_alpha
    where t_alpha = inf{t in [0, infinity) : t R(t) / K >= 1 / alpha} in [1/alpha, K/alpha] and R(t) =
    max(sum_{k=1}^K 1_{e''_k >= t}, 1) (Eq. 6, Proposition 1); furthermore, any self-consistent e-testing
    procedure G satisfying e_k >= K / (alpha R_G) for every rejected hypothesis controls FDR at level
    alpha K_0 / K under arbitrary dependence because E[F_G / R_G] = sum_{k in N} E[1_{k in G} / R_G] <=
    (alpha / K) sum_{k in N} E[E_k] <= alpha K_0 / K (Theorem 2, Proposition 2), and running e-BH on any
    arbitrarily data-screened subset S subseteq {1, ..., K} at amended level alpha_tilde = alpha |S| /
    K or over any combinatorial family S_family of structured rejection sets preserves self-consistency
    and arbitrary-dependence FDR control (Section 5.1).'
  evidence:
  - source_id: wang-ramdas2022-ebh
    locator: Section 4.1, lines 160–179, Equations 5–6, Proposition 1; Section 5, lines 199–225, Theorem
      2 and Proposition 2; Appendix B, lines 1078–1084
    relation: supports
- claim_id: grid-truncation-boosting-under-arbitrary-dependence-and-sharpness
  kind: mechanism
  statement: 'Defining the grid truncation function T(x) = max{K/k : k in {1, ..., K}, K/k <= x} with
    max(empty) = 0 (Eq. 7) and applying Lemma 1(iii) E[f(X) 1_{X_k >= f(X)}] <= E[X''_k] to f(E'') = t_alpha
    with range (alpha^(-1) K / K_set), the base e-BH procedure applied to nonnegative random variables
    E''_1, ..., E''_K under arbitrary dependence satisfies FDR_{G(alpha)} = (1 / K) sum_{k in N} E[t_alpha^(-1)
    1_{E''_k >= t_alpha}] <= (K_0 / K) y_alpha where y_alpha = (1 / K_0) sum_{k in N} E[T(alpha E''_k)]
    (Theorem 3, Eq. 16); choosing boosting factors b_k >= 1 via E[T(alpha b_k E_k)] <= alpha (Eq. 9) or
    the K-free upper bound y_bar_{alpha,k}(b_k) := alpha b_k E[E_k 1_{alpha b_k E_k >= 1}] <= alpha (Eq.
    17) ensures FDR <= alpha K_0 / K, yielding b = (2 / alpha)^(1/2) (approx. 6.324555 at alpha = 0.05)
    for power-calibrator e-values E_k = (1/2) P_k^(-1/2) (Example 2) and solving b Phi(delta/2 + ln(alpha
    b)/delta) = 1 (b approx. 1.373374 for delta = 3 and 1.11197 for delta = 4 at alpha = 0.05) for Gaussian
    likelihood-ratio e-values E_k = exp(delta X_k - delta^2/2) (Example 3), while the unboosted bound
    alpha K_0 / K is attained with equality when E_k = (K / (K_0 alpha)) 1_A for k in N with P(A) = alpha
    K_0 / K and E_k = 0 otherwise (Example 4).'
  evidence:
  - source_id: wang-ramdas2022-ebh
    locator: Section 4.2, lines 180–198, Equations 7–11; Section 6.1, lines 278–326, Lemma 1; Section
      6.2, lines 328–358, Theorem 3 and Examples 2–4; Appendix B, lines 1086–1172
    relation: supports
- claim_id: prds-fdr-bound-and-exact-quantile-boosting-factor
  kind: mechanism
  statement: When the raw e-values satisfy positive regression dependency on a subset (PRDS) on each null
    coordinate k in N, Lemma 1(ii) implies FDR_{G(alpha)} <= (K_0 / K) z_alpha where z_alpha = (1 / K_0)
    sum_{k in N} max_{j in {1,...,K}} (K/j) P(alpha E'_k >= K/j) (Theorem 4, Eq. 21); if E_k is continuously
    distributed and t -> t P(E_k >= t) is decreasing on [q_{1-alpha}(E_k), infinity) (Condition 23), the
    largest boosting factor satisfying Eq. (8) is exactly b_k = (alpha q_{1-alpha}(E_k))^(-1) (Proposition
    3), which boosts power-calibrator e-values E_k = lambda P_k^(lambda - 1) by b = lambda^(-1) alpha^(-lambda)
    (reducing FDR by a factor z_{alpha,k}(b) / y_bar_{alpha,k}(b) = lambda, and yielding b = 2 alpha^(-1/2)
    approx. 8.944272 at lambda = 1/2, alpha = 0.05 in Example 5) and boosts Gaussian likelihood-ratio
    e-values via z_bar_{alpha,k}(b) = sup_{x >= 1} x (1 - Phi(delta/2 + ln(x/(alpha b))/delta)) = alpha
    to b approx. 7.88 for delta = 3 and b approx. 10.31–10.32 for delta = 4 at alpha = 0.05 (Example 6).
  evidence:
  - source_id: wang-ramdas2022-ebh
    locator: Section 6.3, lines 359–388, Theorem 4, Proposition 3, Equations 21–24, and Examples 5–6;
      Appendix B, lines 1173–1185
    relation: supports
- claim_id: monotone-transform-optimality-and-bh-by-calibration-unification
  kind: application
  statement: 'Among all e-testing procedures G(phi) generated by a strictly increasing continuous transform
    phi: [0, infinity] -> [0, infinity] that reject the k^*_{e,phi} = max{k : k phi(e_[k]) / K >= 1} largest
    e-values and guarantee FDR_{G(phi)} <= alpha across all configurations of e-values, G(phi) is always
    a subset of the base e-BH procedure G(alpha) (Theorem 5, proved by constructing k_0-simultaneous indicator
    null e-values E_k = m'' 1_{A_k} whenever phi^(-1)(K/k_0) < K/(k_0 alpha)); furthermore, applying e-BH
    to decreasing p-value transforms psi(P_k) yields step-up p-testing procedures D(psi) with FDR <= (K_0
    / K) E[T(psi(P))] under arbitrary dependence and FDR <= (K_0 / K) sup_{t >= 1} t psi^(-1)(t) under
    PRDS (Proposition 4), recovering both the Benjamini-Hochberg procedure (FDR <= alpha K_0 / K under
    PRDS) and the Benjamini-Yekutieli procedure (FDR <= alpha l_K K_0 / K under arbitrary dependence,
    where l_K = sum_{i=1}^K 1/i) via psi(p) = alpha / p.'
  evidence:
