id: AIMech:EValueBenjaminiHochbergProcedure
name: E-value Benjamini-Hochberg procedure
aliases:
- e-BH Procedure
- Base e-BH and Boosted e-BH Multiple Testing Procedure
- Self-Consistent E-Value False Discovery Rate Control
- Post-Selection and Structured e-BH Procedure
concept_kind: mathematical_method
definition: 'A step-down multiple hypothesis testing procedure (Wang & Ramdas 2022) for controlling the
  false discovery rate (FDR) at target level alpha in (0, 1) using nonnegative e-variables E_1, ..., E_K
  satisfying E[E_k] <= 1 under each true null hypothesis H_k (k in N, |N| = K_0) that (1) optionally multiplies
  each raw e-value e_k by a marginal-distribution-informed boosting factor b_k >= 1 calibrated via the
  discrete grid truncation function T(x) = max{K/k : k in {1, ..., K}, K/k <= x} under arbitrary dependence
  (E[T(alpha b_k E_k)] <= alpha, Eq. 9) or under positive regression dependency on a subset (PRDS, max_{j
  in {1,...,K}} (K/j) P(alpha b_k E_k >= K/j) <= alpha, Eq. 8), and (2) orders the boosted e-values e''_[1]
  >= e''_[2] >= ... >= e''_[K] to reject the k_e^* hypotheses with the largest boosted e-values where
  k_e^* = max{k in {1, ..., K} : k e''_[k] / K >= 1 / alpha} (with max(empty) = 0; equivalently e''_k
  >= t_alpha = inf{t >= 0 : t R(t) / K >= 1 / alpha}, Proposition 1), guaranteeing finite-sample FDR <=
  alpha K_0 / K under arbitrary dependence without any logarithmic Benjamini-Yekutieli correction (Theorem
  2, Proposition 2).'
identity_notes: No normalized identity match for E-value Benjamini-Hochberg procedure across all 442 pinned
  AIO records and 571 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches across
  data, sources, research, history, and reviews returned only 7 lines in Round 176 discovery and review
  artifacts where arXiv:2009.02824 was queued as a pending frontier lead. Distinct from AIMech:EValueCalibrationAndMerging
  (Vovk & Wang 2021), which merges e-values for global-null testing and controls family-wise error rate
  (FWER) via Marcus-Peritz-Gabriel closed testing (Algorithms 1–2) rather than controlling the false discovery
  rate (FDR) via self-consistent step-down thresholding and grid-truncation boosting.
