id: AIMech:HLATRHybridListAwareTransformerReranking
name: HLATR Hybrid List Aware Transformer Reranking
concept_kind: architecture
review_status: DRAFT
definition: A lightweight list-aware neural reranking architecture for multi-stage text retrieval that couples coarse first-stage retrieval features with fine-grained second-stage interaction-based reranker representations across a candidate document list D'_r of size Z by mapping each document d_i's first-stage retrieval rank order i (0 <= i <= Z) to a learnable position embedding pe_i in R^d, projecting its second-stage pretrained language model reranker representation E^R(q, d_i) via v_i = W_v^T E^R(q, d_i) in R^d, fusing both into an initial sequence matrix H^0 = [LN(pe_1 + v_1), ..., LN(pe_Z + v_Z)]^T in R^{d x Z}, passing H^0 through L Transformer encoder layers H^l = T^l(H^{l-1}) to capture mutual partial-order dependencies among all Z candidate documents simultaneously, and predicting final relevance scores score(q, d_i) = W^T H_i^l trained with a listwise contrastive loss L_{q, D'_r} = -log(exp(score(q, d+)) / sum_{d in D'_r} exp(score(q, d))).
identity_notes: Distinct from joint retriever-ranker training frameworks such as RocketQAv2 (AIMech:RocketQAv2JointTrainingDensePassageRetrievalAndReranking) and AR2 (AIMech:AR2AdversarialRetrieverRankerForDenseTextRetrieval), which jointly optimize dual-encoder and cross-encoder parameters during training to improve first-stage retrieval rather than adding a post-reranker list-aware Transformer feature-coupling stage; and distinct from static Weighted Combination of two-stage Ranking (WCR), which linearly interpolates scalar retrieval and reranking scores per document independently without modeling cross-document partial-order interactions.
aliases:
- HLATR
- Hybrid List Aware Transformer Reranking
- Hybrid List Aware Transformer Ranker
- 'HLATR: Enhance Multi-stage Text Retrieval with Hybrid List Aware Transformer Reranking'
