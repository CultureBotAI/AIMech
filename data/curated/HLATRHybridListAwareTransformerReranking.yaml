claims:
- claim_id: hlatr-multistage-retrieval-order-and-reranker-feature-coupling
  kind: mechanism
  statement: HLATR fuses first-stage retrieval rank order i (compatible with both sparse BM25 and dense retrievers such as coCondenser and ANCE) and second-stage PTM reranker representations E^R(q, d_i) by projecting v_i = W_v^T E^R(q, d_i) in R^d (Equation 4, d = 128 in Table 3) and forming H^0 = [LN(pe_1 + v_1), ..., LN(pe_Z + v_Z)]^T via LayerNorm addition with learnable retrieval-order position embeddings pe_i in R^d (Section 3.2.1, Figure 3).
  evidence:
  - source_id: r770-primary-pdf
    locator: Section 3.2.1 & Table 3, Equation 4, Figure 3, pp. 3-4, 6
    relation: supports
  - source_id: r770-primary-pdf
    locator: build_hlatr_input() and main() verification of LayerNorm(pe_i + v_i) coupling and ablation without retrieval order
    relation: supports
- claim_id: hlatr-list-aware-transformer-and-listwise-contrastive-loss
  kind: mechanism
  statement: A stack of L Transformer encoder layers (L = 4, 2 attention heads, d = 128 in Table 3) processes the entire Z-document candidate list H^0 simultaneously (H^l = T^l(H^{l-1})) to model mutual cross-document influences, followed by linear scoring score(q, d_i) = W^T H_i^l (Equation 5) and listwise contrastive optimization L_{q, D'_r} = -log(exp(score(q, d+)) / sum_{d in D'_r} exp(score(q, d))) over k = 100 negatives per query (Equation 6, Table 3), outperforming both a 2-layer MLP variant HLATR_linear and a binary cross-entropy variant HLATR_bce (Table 5).
  evidence:
  - source_id: r770-primary-pdf
    locator: Sections 3.2.2-3.2.3 & Section 4.3, Equations 5-6, Tables 3 & 5, pp. 4-7
    relation: supports
  - source_id: r770-primary-pdf
    locator: single_head_self_attention() and listwise_contrastive_loss() verification
    relation: supports
- claim_id: hlatr-msmarco-passage-and-document-reranking-application
  kind: application
  statement: "On MS MARCO Passage and Document ranking benchmarks across sparse (BM25) and dense (coCondenser, ANCE) retrievers paired with BERT-base/large and RoBERTa-base/large rerankers, HLATR consistently improves MRR@10 and MRR@100 over both conventional two-stage reranking and Weighted Combination of two-stage Ranking (WCR, Equation 7)\u2014reaching 43.7 MRR@10 on MS MARCO Passage and 45.9 MRR@10 on MS MARCO Document with RoBERTa-large (Table 2)\u2014while adding only 2ms per 1000 queries on a single V100 GPU (300x-450x faster than BERT rerankers, Table 6)."
  evidence:
  - source_id: r770-primary-pdf
    locator: Sections 4.1-4.3, Equation 7, Tables 2, 4 & 6, pp. 5-8
    relation: supports
- claim_id: hlatr-hidden-dimension-overparameterization-limitation
  kind: limitation
  statement: Because HLATR operates solely on compressed summary features from the preceding retrieval and reranking stages rather than raw text tokens, increasing its hidden dimension d (e.g., to d = 512) or stacking excessive Transformer layers (beyond the inflection point around 2-4 layers) degrades MRR@10 due to overparameterization (Section 4.3, Figure 4), and HLATR cannot run standalone without precomputed second-stage reranker representations E^R(q, d_i).
  evidence:
  - source_id: r770-primary-pdf
    locator: Section 3.2.1 & Section 4.3 (Hyper-parameters of Transformer), Figure 4, pp. 3-4, 8
    relation: supports
