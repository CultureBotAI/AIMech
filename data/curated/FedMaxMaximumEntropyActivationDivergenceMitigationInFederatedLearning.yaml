id: AIMech:FedMaxMaximumEntropyActivationDivergenceMitigationInFederatedLearning
name: FedMAX (Maximum-Entropy Activation Divergence Mitigation in Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: 'A non-IID federated learning regularization algorithm (Chen, Bhardwaj, & Marculescu 2020, Section 3, Equations 1-4) that mitigates cross-client classifier weight divergence caused by penultimate-layer activation divergence delta = (1/M) sum_{k=1}^M KL(a_bar || a_k) by augmenting each client k''s local empirical loss F_k(w_k) with a maximum-entropy prior on the softmax-normalized penultimate activation vectors sigma(a_i^k) in R^D across local training samples i = 1, ..., N: g_k(w_k) = F_k(w_k) - (beta / N) sum_{i=1}^N H(sigma(a_i^k)) (Equation 3), which is equivalent up to an additive constant C = beta log D to penalizing the Kullback-Leibler divergence between sigma(a_i^k) and the D-dimensional uniform distribution U: g_k(w_k) = F_k(w_k) + (beta / N) sum_{i=1}^N KL(sigma(a_i^k) || U) - C (Equation 4).'
identity_notes: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization, Li et al. 2020), which penalizes Euclidean distance ||w_k - w^t||^2 in weight space rather than regularizing penultimate-layer feature activations; and distinct from FedDecorr (AIMech:FedDecorrFeatureDecorrelationForDimensionalCollapseMitigationInFederatedLearning, Shi et al. 2023), which penalizes the Frobenius norm of off-diagonal entries of the batch feature correlation matrix rather than the Shannon entropy / KL divergence to uniformity of individual softmax-normalized activation vectors sigma(a_i^k).
aliases:
- FedMAX
- Maximum Entropy Activation Regularized Federated Learning
- Activation Divergence Mitigation via Maximum Entropy in Federated Learning
