claims:
- claim_id: r477-maximum-entropy-and-uniform-kl-activation-prior-equivalence-mechanism
  kind: mechanism
  statement: FedMAX applies the Principle of Maximum Entropy to the softmax-normalized penultimate activation vector sigma(a_i^k) of each local sample i on device k, yielding the local objective g_k(w_k) = F_k(w_k) - (beta / N) sum_{i=1}^N H(sigma(a_i^k)) (Equation 3) = F_k(w_k) + (beta / N) sum_{i=1}^N KL(sigma(a_i^k) || U) - C (Equation 4), which aligns activation distributions across non-IID clients toward a common uniform reference U without collapsing activation norms ||a_i^k||_2 to zero as naive L2 activation regularization (Equation 2) does (Chen et al. 2020, Section 3.2, pp. 4-6).
  evidence:
  - source_id: r477-primary-pdf
    locator: Section 3.2 (Equations 2-4), pp. 4-6
    relation: supports
- claim_id: r477-penultimate-activation-divergence-reduction-and-communication-efficiency-scope
  kind: scope
  statement: By reducing cross-device penultimate activation divergence delta = (1/M) sum_{k=1}^M KL(a_bar || a_k) during local training epochs without any additional communication payload beyond standard FedAvg, FedMAX stabilizes last-layer classifier weight updates across non-IID clients and reduces communication rounds required to reach target test accuracy by up to 3.3x-5x (Chen et al. 2020, Section 4.1-4.2, Figure 2c, Tables 2-4).
  evidence:
  - source_id: r477-primary-pdf
    locator: Section 4.1-4.2 (Figure 2, Tables 2-4), pp. 7-12
    relation: supports
- claim_id: r477-iot-vision-and-medical-imaging-federated-classification-application
  kind: application
  statement: Applied to non-IID federated classification across FEMNIST, CIFAR-10, CIFAR-100, Shakespeare character prediction, and APTOS diabetic retinopathy medical imaging with CNN and VGG-11 architectures (Chen et al. 2020, Section 4, Tables 1-4, Figures 2-4).
  evidence:
  - source_id: r477-primary-pdf
    locator: Section 4.1-4.2 (Tables 1-4, Figures 2-4), pp. 7-13
    relation: supports
- claim_id: r477-hyperparameter-beta-and-over-smoothing-limitation
  kind: limitation
  statement: Requires tuning the entropy regularization coefficient beta (e.g., beta in {1, 10, 150} across architectures and datasets); excessively large beta over-constrains penultimate activations toward uniformity and can degrade discriminative feature separability (Chen et al. 2020, Section 4.1, p. 8).
  evidence:
  - source_id: r477-primary-pdf
    locator: Section 4.1 (Experimental Setup), p. 8
    relation: supports
