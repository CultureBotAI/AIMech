  rationale: No inspected AIO class denotes this complete arithmetic number-partitioning search. Learned
    graph models, reasoning LLMs, learning tasks and functions do not identify the algorithm itself.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: Graph-structured language modeling is distinct from arithmetic subpartition manipulation.
  - target: AIO:ReasoningLLM
    rejection_reason: A language model with explicit reasoning is not a number-partitioning algorithm.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: A neural-symbolic language-model architecture is not this nonlearning search or
      heuristic.
  - target: AIO:MachineLearningTask
    rejection_reason: Balancing a given multiset does not learn a method from data.
  - target: AIO:MathematicalFunction
    rejection_reason: An algorithm evaluating differences and choosing a partition is distinct from the
      mathematical functions it uses.
  - target: AIO:ReinforcementLearning
    rejection_reason: There is no reward-based learned policy or exploration/exploitation learning in
      the curated deterministic procedure.
limitations:
- Scope is the two-way, nonnegative, finite-instance depth-first formulation. Multiway composition, cardinality
  constraints and discrepancy ordering require separate identity assessment.
- Sound optimality claims assume exact arithmetic or rigorously conservative bounds. A floating-point
  near-zero residual is not automatically an exact certificate.
- Anytime availability begins with a complete feasible partition; a limited run need not improve KK or
  establish optimality. Stored reconstruction information is required to return the actual partition.
- The inspected primary is the31-page27June1997 manuscript. The later1998 journal DOI supplies bibliographic
  linkage, not a claim that final journal text or source code was inspected.
- All manuscript pages were read; small exact-integer checks were executed without author-code or historical
  performance replication. They illustrate boundaries rather than prove the general completeness theorem.
