id: AIMech:CompleteKarmarkarKarp
name: Complete Karmarkar–Karp
aliases:
- CKK
concept_kind: algorithm
definition: A complete anytime algorithm for two-way number partitioning that first follows Karmarkar–Karp
  differencing, then explores complementary sum branches over residual subpartitions, retaining the best
  partition and using sound bounds or exhaustive search to certify optimality.
identity_notes: Compared all 442 pinned AIO and 588 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 204, 120, 119 lines. All distinct match contents
  were inspected. Semantic matching covered 67 AIO and 95 native definitions, with every matched definition
  read. 6 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. The
  combined frontier entry and new KK heuristic are related prior work, not an existing CKK identity. This
  two-way complete anytime algorithm searches relative subpartition orientations by differencing and summing
  the largest residuals. It is distinct from the irreversible KK heuristic, complete greedy item assignment,
  generic DFS and discrepancy-order search. Multiway extensions remain separate leads. No suitable counterpart
  was found in the inspected pinned AIO graph.
definition_evidence:
- source_id: korf1997
  locator: Section3 and Figure4, manuscript PDF/printed pp.12–13
  relation: supports
claims:
- claim_id: difference-and-sum-branches
  kind: mechanism
  statement: At a search state, select the two largest nonnegative residuals a>=b. The preferred child
    replaces them by a-b, representing opposite orientations of their partial partitions; the other replaces
    them by a+b, representing the same orientation. Keep residuals ordered and visit difference before
    sum in the source’s depth-first formulation. Repeated relative-orientation decisions cover all two-way
    partitions up to overall bin exchange. Bookkeeping is required to reconstruct original item assignments;
    this is not the complete greedy algorithm’s assignment of one raw item at a time.
  evidence:
  - source_id: korf1997
    locator: Sections2.6–3, manuscript PDF/printed pp.8–13; Section11 pp.27–28
    relation: supports
- claim_id: dominance-and-parity
  kind: mechanism
  statement: For a current largest residual a with remaining-residual sum r, any completion has residue
    at least max(0,a-r). If a>=r, placing all remaining residuals opposite a attains a-r, so the subtree
    can be solved directly; a lower bound no better than the incumbent also permits pruning. With exact
    integer weights, all attainable residues have the parity of the original total, allowing immediate
    optimality certification at0 for an even total or1 for an odd total. This parity stopping rule is
    not a generic real-valued tolerance rule.
  evidence:
  - source_id: korf1997
    locator: Section2.7 pruning and perfect partitions, manuscript PDF/printed pp.11–12; Section3 inherited
      CKK pruning, pp.12–13; curator exact-integer boundary calculations
    relation: supports
- claim_id: anytime-versus-optimal
  kind: limitation
  statement: The first difference-only solution has the KK residue; subsequent search may improve the
    incumbent, whose residue never increases. A time or node limit can return a useful feasible partition
    without proving optimality. Certification requires a matching valid lower bound or completion of the
    remaining search with sound pruning. Improvement is not guaranteed at each step, and the best partition
    need not be unique. In a constructed8,7,6,5,4 example, KK gives2 and complete search reaches0; stopping
    after one search node retains an uncertified2.
  evidence:
  - source_id: korf1997
    locator: Section3 pp.12–13; Section6 pp.17–19; Section12 pp.28–29; constructed sign-enumeration and
      interruption checks
    relation: supports
- claim_id: complexity-and-representation
  kind: limitation
  statement: The complete binary search has depth n-1 and can require exponentially many nodes. Depth-first
    organization supports a linear-space implementation with compact state and undo bookkeeping, but copying
    every residual list along the recursion is not itself a linear-space guarantee. Numeric bit complexity
    is separate from node counts. The source uses sorted arrays and special small-state termination in
    its implementation; these details do not turn exact partitioning into a polynomial-time algorithm.
  evidence:
  - source_id: korf1997
    locator: Section3 pp.12–13; Section4 pp.14–16, especially implementation notes and small-state termination
    relation: supports
- claim_id: subset-sum-reduction-scope
  kind: scope
  statement: For nonnegative weights of total s and a feasible subset-sum target c in[0,s], replace c
    by s-c when c<s/2 and append d=2c-s>=0. The augmented instance has a zero-residue two-way partition
    exactly when the original has a subset with the adjusted target, and complementation recovers the
    original target when needed. A nonzero optimum rules out that target only after optimality is certified;
    an interrupted positive incumbent does not. This decision reduction does not assert equality between
    nonzero partition residue and the original subset-sum error.
  evidence:
  - source_id: korf1997
    locator: Section10, manuscript PDF/printed pp.26–27; direct interpretation of the stated reduction
    relation: supports
- claim_id: historical-evaluation-boundaries
  kind: scope
  statement: The reported C implementations compare CKK and complete greedy search on uniform random integer
    instances using a SunUltraSparcModel1. Fixed precision changes the probability of a perfect partition
    and can make larger sampled instances easier; this is not monotone or universal hardness. Figure6
    averages improvement ratios over100 trials with50 48-bit numbers, reporting large gains from continued
    search. Those distribution-, precision- and hardware-specific results do not guarantee arbitrary instances
    finish quickly. Three-way experiments and discrepancy-order variants are described separately from
    this two-way depth-first identity.
  evidence:
  - source_id: korf1997
    locator: Sections4–6 and Figures5–6, manuscript PDF/printed pp.14–19; Sections7–8 and Figures7–8 pp.19–26
    relation: supports
