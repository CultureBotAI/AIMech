name: Adaptive scaling within adaptive Metropolis
definition: An adaptive Metropolis algorithm that combines acceptance-rate-driven scalar proposal scaling
  with recursive mean and covariance-shape adaptation from retained samples.
concept_kind: algorithm
identity_notes: This record gives the bounded mean-and-shape formulation of Vihola Definition 5. Its log
  scale is unbounded, while the proposed mean/shape pair is accepted only inside a specified compact constraint
  set. Unconstrained software variants are not automatically the same validity setting. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 181 prior native IDs/names/aliases.
  Ignored-inclusive searches of both full checkouts found prior discovery leads, neighboring sampler discussions
  and unrelated author-name/environment substrings. Existing random-walk Metropolis, delayed-rejection,
  fixed symmetric delayed-rejection and RAM records were inspected; shared components do not make these
  procedures equivalent.
limitations:
- The covariance update uses the old mean and the retained new state, including repeated states after
  rejection. Substituting the new mean or only accepted proposals changes the specified recursion.
- The mean and shape constraints are part of this source’s proved formulation; only the scalar scale lacks
  a fixed bound. Omitting constraints in practice does not inherit the same theorem.
- The source’s strong-law results restrict alpha_star to (0,1/2) and require the corresponding target/proposal
  regularity conditions. Algorithm definition alone does not prove ergodicity.
- Shape learning is a recursive stochastic-approximation update, not exactly the original unbiased full-history
  covariance at every finite iteration.
- No universal efficiency advantage, marginal-distribution convergence or executed benchmark is asserted.
