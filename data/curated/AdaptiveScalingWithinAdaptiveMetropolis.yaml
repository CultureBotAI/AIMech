claims:
- claim_id: method
  kind: mechanism
  statement: Choose alpha_star in (0,1) and initialize x with pi(x)>0, mu=x and feasible positive-definite
    Sigma. Propose Y=x+exp(S)Sigma^(1/2)W with spherical W, use alpha=min(1,pi(Y)/pi(x)), and retain X_new
    after the accept/reject test. Update S_new=S+eta_n(alpha−alpha_star). With the old mean mu and shape
    Sigma, form mu_hat=(1−eta_n)mu+eta_n X_new and Sigma_hat=(1−eta_n)Sigma+eta_n(X_new−mu)(X_new−mu)^T.
    For fixed zeta≥1, accept the entire proposed mean/shape pair only if ||mu_hat||≤zeta and every eigenvalue
    of Sigma_hat lies in [zeta^−1,zeta]; otherwise keep both old mu and old Sigma. Start with a feasible
    mean/shape pair and keep the scalar update separately. Use eta_n in (0,1), with divergent sum and
    finite squared sum under the source assumptions.
