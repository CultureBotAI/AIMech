claims:
- claim_id: fedhm-unrolled-conv-svd-and-shape-aligned-softmax-aggregation-mechanism
  kind: mechanism
  statement: For each factorized layer l in {rho + 1, ..., L}, the server unrolls a 4D convolution tensor of shape (m, n, k, k) into a 2D matrix of shape (m k, n k), computes truncated SVD at rank r = gamma_p rank(W_l) with spectral initialization U_t^l sqrt(Sigma_{r,t}^l) and V_t^l sqrt(Sigma_{r,t}^l), and reshapes the factors into two sequential convolution layers of shapes (m, r, k, 1) and (r, n, 1, k) reducing parameters from m n k^2 to r k (m + n) and MACs from m n k^2 H W to r k H W (m + n); after E local epochs with Frobenius decay (lambda / 2) ||U V^T||_F^2, the server reconstructs full-rank matrices U_l V_l^T (Eq. 1) and aggregates w_{t+1} = sum_{p=1}^P alpha_p w_{p,t+1} with alpha_p = exp(gamma_p / tau) / sum_{q=1}^P exp(gamma_q / tau) (Eq. 2).
  evidence:
  - source_id: r505-primary-pdf
    locator: Sections 2.2-2.3, Algorithm 1, Eqs. (1)-(2), Table 1, pp. 3-5; Appendix B.1 Eq. (18), p. 15
    relation: supports
- claim_id: fedhm-nonconvex-convergence-with-rank-truncation-error-scope
  kind: scope
  statement: Under L_{nabla f}-smooth client objectives, unbiased stochastic gradients with bounded second moment kappa_f, bounded factor Frobenius norms ||U_{p,t}^l||_F, ||V_{p,t}^l||_F <= kappa_UV, and bounded SVD rank-truncation discrepancies kappa_{sigma_1} and kappa_{sigma_2} across heterogeneous client ranks (Assumptions 3-5), Theorem 3 (and Theorem 1) proves that the factorized iterates h_hat_t satisfy (1/T) sum_{t=0}^{T-1} E[||nabla g(h_hat_t)||^2] <= (2/(T eta))(f(w_0) - f_low) + 2 L_f (L - rho) kappa_{sigma_1} / (E eta) + 6 eta kappa_g E (eta L_{nabla g}^2 E + 2 L_f kappa_UV^2) + eta L_{nabla g} M_g / P + 6 (L - rho) kappa_{sigma_2} (L_{nabla g}^2 + 2 L_f kappa_UV^2 / (E eta)), where the kappa_{sigma_2} term vanishes when all clients use full-rank models.
  evidence:
  - source_id: r505-primary-pdf
    locator: Section 3.2 Theorem 1, pp. 5-6; Appendix B.2-B.3 Assumptions 3-5, Lemmas 1-3, Theorems 2-3, pp. 15-25
    relation: supports
- claim_id: fedhm-server-svd-overhead-and-early-layer-factorization-limitation
  kind: limitation
  statement: Performing truncated SVD on the global model at the server at every communication round incurs high server-side matrix decomposition overhead (Section 6, p. 9), and factorizing all early convolution layers (rho = 0) at severe compression (2% parameter ratio) causes cumulative approximation error propagation that drops accuracy from over 90% to below 80% on CIFAR-10 and from 70% to below 55% on CIFAR-100 unless early layers are kept unfactorized (Section 2.2, p. 3; Appendix D.1, Figure 8, p. 27).
  evidence:
  - source_id: r505-primary-pdf
    locator: Section 2.2 Hybrid Network Architecture, p. 3; Section 6 Conclusion and Limitations, p. 9; Appendix D.1, p. 27
    relation: supports
- claim_id: fedhm-heterogeneous-device-visual-classification-application
  kind: application
  statement: Applied to federated visual classification across dynamic and fixed hardware-capacity client cohorts training hybrid low-rank ResNet-18 and ResNet-34 models (rank ratios gamma in {0.5, 0.25, 0.125, 0.083}) on IID and Dirichlet non-IID partitions of CIFAR-10, CIFAR-100, and Tiny-ImageNet.
  evidence:
  - source_id: r505-primary-pdf
    locator: Section 4 Experiments and Analysis, Tables 2-3, Figures 2-4, pp. 6-9; Appendix C-D, Tables 4-8, pp. 25-28
    relation: supports
