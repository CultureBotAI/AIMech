id: AIMech:FedHmHeterogeneousFederatedLearningViaLowRankFactorization
name: 'FedHM: Efficient Federated Learning for Heterogeneous Models via Low-Rank Factorization'
concept_kind: algorithm
review_status: DRAFT
definition: A model-heterogeneous federated learning framework (FedHM; Yao, Pan, O'Neill, Dai, Wan, Jin, and Sun, 2021) that compresses an L-layer global server network into client-specific [rho, L, gamma_p] hybrid low-rank networks w^{gamma_p} = {W_1, ..., W_rho, U_{rho+1}, V_{rho+1}^T, ..., U_L, V_L^T} by keeping the first rho layers unfactorized and decomposing each later layer l in {rho + 1, ..., L} via truncated SVD at rank r = gamma_p rank(W_l) (unrolling 4D convolution tensors of shape (m, n, k, k) into (m k, n k) matrices and reshaping the rank-r factors into sequential (m, r, k, 1) and (r, n, 1, k) filters with spectral initialization U_t^l sqrt(Sigma_{r,t}^l), V_t^l sqrt(Sigma_{r,t}^l)). Participating clients train their assigned hybrid models for E local epochs with Frobenius decay regularization (lambda / 2) ||U V^T||_F^2, after which the server recovers full-rank shapes via w_{p,t+1} = {W_1, ..., W_rho, U_{rho+1} V_{rho+1}^T, ..., U_L V_L^T} and aggregates them using softmax rank-ratio weights alpha_p = exp(gamma_p / tau) / sum_{q=1}^P exp(gamma_q / tau).
identity_notes: Distinct from channel width-slimming heterogeneous FL methods such as HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning; Diao et al., ICLR 2021), FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning; Horvath et al., NeurIPS 2021), and FedRolex (AIMech:FedRolexModelHeterogeneousFederatedLearningWithRollingSubModelExtraction; Alam et al., NeurIPS 2022), which extract subset channels along width rather than factorizing layers via truncated SVD and recovering full matrices U V^T prior to aggregation. Distinct from FedPara (AIMech:FedParaAndPFedParaLowRankHadamardProductParameterization; Hyeon-Woo et al., ICLR 2022), which parameterizes homogeneous client layers via a Hadamard product of two low-rank matrices (W = (X_1 Y_1^T) odot (X_2 Y_2^T)) without server-side SVD redistributions across heterogeneous client ranks.
aliases:
- FedHM
- Federated Learning for Heterogeneous Models via Low-Rank Factorization
- Hybrid Low-Rank Factorized Federated Learning
