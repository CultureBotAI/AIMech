id: AIMech:IterativeHardThresholdingForCompressedSensing
name: Iterative Hard Thresholding for Compressed Sensing
concept_kind: algorithm
review_status: DRAFT
definition: Iterative Hard Thresholding for Compressed Sensing (IHT) is a first-order non-convex projected gradient algorithm analyzed by Blumensath and Davies (2009) for recovering s-sparse and compressible signals x in R^M from noisy linear measurements y = Phi x + e in R^N (N < M). Starting from x^{[0]} = 0, each iteration n >= 0 updates x^{[n+1]} = H_s(x^{[n]} + Phi^T(y - Phi x^{[n]})), where the non-linear hard-thresholding operator H_s(a) retains the s largest-magnitude entries of a and sets all remaining M - s entries to zero. Under the Restricted Isometry Property beta_{3s} < 1/sqrt(32) (where ||Phi_B^T Phi_B - I||_2 <= beta_{|B|}), IHT requires only a single matrix-vector application of Phi and Phi^T per iteration (avoiding the inner least-squares inversions of CoSaMP and Subspace Pursuit) while guaranteeing geometric contraction ||x - x^{[n]}||_2 <= 2^{-n} ||x^s||_2 + 6 ||x - x^s||_2 + (6/sqrt(s)) ||x - x^s||_1 + 5 ||e||_2.
identity_notes: Distinct from convex l1 Basis Pursuit / Lasso (AIO:LassoRegression), greedy Orthogonal Matching Pursuit (AIMech:OrthogonalMatchingPursuitTroppGilbertSignalRecovery), and two-stage least-squares pursuit methods (CoSaMP and Subspace Pursuit). Specifically captures the Blumensath-Davies (2009) Iterative Hard Thresholding update x^{[n+1]} = H_s(x^{[n]} + Phi^T(y - Phi x^{[n]})) (Equation 1.5), its RIP contraction analysis on evolving 3s-sparse unions B^n = Gamma^{x,s} union Gamma^n union Gamma^{n+1} (Theorem 4 and Corollary 1), and its residual-based finite-termination criterion (Lemma 5 and Theorem 5).
aliases:
- Iterative Hard Thresholding
- IHT for Compressed Sensing
- Blumensath-Davies Iterative Hard Thresholding
- Projected Gradient Hard Thresholding
