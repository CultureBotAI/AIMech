claims:
- claim_id: claim-01
  kind: mechanism
  statement: By restricting the gradient step a^{[n]} = x^{[n]} + Phi^T(y - Phi x^{[n]}) to the union support B^{n+1} = Gamma^{x,s} union Gamma^n union Gamma^{n+1} of cardinality |B^{n+1}| <= 3s, the best-s-term property ||x^{[n+1]}_{B^{n+1}} - a^{[n]}_{B^{n+1}}||_2 <= ||x_{B^{n+1}} - a^{[n]}_{B^{n+1}}||_2 combines with the triangle inequality and RIP bounds ||(I - Phi_B^T Phi_B) v||_2 <= beta_{3s} ||v||_2 to yield the per-step linear error recursion ||r^{n+1}||_2 <= 2*sqrt(2)*beta_{3s} ||r^n||_2 + 2*(1+sqrt(2))*sqrt(1+beta_{2s}) ||tilde{e}||_2 = (1/sqrt(2)) ||r^n||_2 + 4.38 ||tilde{e}||_2 whenever beta_{3s} < 1/sqrt(32).
  evidence:
  - source_id: r314-primary-pdf
    locator: Section 3.2, Lemmas 1-4 and Proof of Theorem 4, Equations 3.9-3.17, pp. 6-8
    relation: supports
  - source_id: r314-metadata-cr
    locator: Bibliographic metadata for Applied and Computational Harmonic Analysis 27(3):265-274
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For exactly s-sparse signals x = x^s in the presence of observation noise e, Corollary 1 establishes ||x - x^{[n]}||_2 <= 2^{-n/2} ||x||_2 + 5 ||e||_2 after n iterations, and Lemma 5 proves that once ||x^s - x^{[n]}||_2 <= 1.25 ||tilde{e}||_2, consecutive iterates satisfy the observable stopping bound ||x^{[n]} - x^{[n-1]}||_2 <= 2.5 ||tilde{e}||_2 and residual bound ||y - Phi x^{[n]}||_2 <= 2.34 ||tilde{e}||_2 within k* <= ceil(2 log_2(||x^s||_2 / ||tilde{e}||_2)) steps (Theorem 5).
  evidence:
  - source_id: r314-primary-pdf
    locator: Section 2.1, Theorem 4 and Corollary 1, pp. 4-5; Section 3.3, Lemma 5 and Theorem 5, pp. 8-9
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Unit-step Iterative Hard Thresholding requires the sensing matrix Phi to be properly scaled so that its 3s-restricted isometry constant satisfies beta_{3s} < 1/sqrt(32) approx 0.1768 (or spectral norm < 1 for convergence to a local minimum); if the signal sparsity s exceeds the RIP threshold of the undersampled measurement operator or if Phi is unscaled, the linear gradient step amplifies off-support interference and fails to recover the signal.
  evidence:
  - source_id: r314-primary-pdf
    locator: Section 1.2, Convergence discussion, p. 3; Section 2.1, Theorem 4 condition beta_{3s} < 1/sqrt(32) and Section 4 Discussion, pp. 4, 9-10
    relation: supports
