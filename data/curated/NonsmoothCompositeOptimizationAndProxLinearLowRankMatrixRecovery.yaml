claims:
- claim_id: claim-two-sided-quadratic-taylor-accuracy-and-weak-convexity-under-l1-l2-rip
  kind: mechanism
  statement: "For the nonsmooth composite objective $f(\\boldsymbol{X}) = \\|\\mathcal{A}(\\boldsymbol{W}\\boldsymbol{W}^\\top) - \\boldsymbol{b}\\|_1$ (symmetric) or $\\|\\mathcal{A}(\\boldsymbol{X}\\boldsymbol{Y}^\\top) - \\boldsymbol{b}\\|_1$ (asymmetric, with or without nuclear-norm-style factor penalty $\\tilde{f}$), Propositions 4.1, 4.2, and 4.3 prove that under the rank-$2r$ $\\ell_1/\\ell_2$ Restricted Isometry Property $\\kappa_1\\|\\boldsymbol{M}\\|_F \\le \\|\\mathcal{A}(\\boldsymbol{M})\\|_1 \\le \\kappa_2\\|\\boldsymbol{M}\\|_F$, the linearized convex model $f_{\\boldsymbol{X}}(\\boldsymbol{Z}) = h(F(\\boldsymbol{X}) + \\nabla F(\\boldsymbol{X})(\\boldsymbol{Z}-\\boldsymbol{X}))$ satisfies the two-sided quadratic error bound $|f(\\boldsymbol{Z}) - f_{\\boldsymbol{X}}(\\boldsymbol{Z})| \\le \\kappa_2\\|\\boldsymbol{Z} - \\boldsymbol{X}\\|_F^2$ for all factors $\\boldsymbol{X},\\boldsymbol{Z}$, certifying global $2\\kappa_2$-weak convexity with parameter independent of $\\sigma_1(\\boldsymbol{M}_\\sharp)$ (Section 4.1, Assumptions 1\u20132, Propositions 4.1\u20134.3)."
  evidence:
  - source_id: ccdddd2021-complowrank-pdf
    locator: Section 1.2 (Eqs. 1.4-1.6, pp. 1510-1513), Section 4.1 (Assumptions 1-2, Propositions 4.1-4.3, pp. 1528-1531)
    relation: supports
- claim_id: claim-exact-sharpness-and-local-conditioning-under-arbitrary-outlier-corruption
  kind: mechanism
  statement: "Under the $\\mathcal{I}_{\\mathrm{fail}}$-outlier concentration bound $\\|\\mathcal{A}(\\boldsymbol{M})\\|_1 - 2\\|\\mathcal{A}_{\\mathcal{I}_{\\mathrm{fail}}}(\\boldsymbol{M})\\|_1 \\ge \\kappa_3\\|\\boldsymbol{M}\\|_F$ holding for outlier fraction $p_{\\mathrm{fail}} < 1/2$ (Assumption 2, Theorem 3.1), Propositions 4.6, 4.7, and 4.8 prove that $f$ is sharp around the ground-truth solution set $\\mathcal{X}_\\sharp$: $f(\\boldsymbol{W}) - f(\\boldsymbol{W}_\\sharp) \\ge \\kappa_3\\sqrt{2(\\sqrt{2}-1)\\sigma_r(\\boldsymbol{M}_\\sharp)}\\,\\mathrm{dist}(\\boldsymbol{W},\\mathcal{D}^*(\\boldsymbol{M}_\\sharp))$ in the symmetric case (and analogously with $\\mu \\asymp \\kappa_3\\sqrt{\\sigma_r(\\boldsymbol{M}_\\sharp)}$ in the balanced asymmetric case), yielding a local basin of attraction of radius $\\mathrm{dist}(\\boldsymbol{X}_0,\\mathcal{X}_\\sharp) < \\mu/\\rho \\asymp \\frac{\\kappa_3}{\\kappa_2}\\sqrt{\\sigma_r(\\boldsymbol{M}_\\sharp)}$ free of spurious stationary points (Section 3, Theorem 3.1; Section 4.2, Lemma 4.4, Propositions 4.6\u20134.8, Corollary 4.9)."
  evidence:
  - source_id: ccdddd2021-complowrank-pdf
    locator: Section 3 (Theorem 3.1, pp. 1521-1524), Section 4.2 (Lemma 4.4, Propositions 4.6-4.8, Corollary 4.9, pp. 1532-1537)
    relation: supports
- claim_id: claim-polyak-subgradient-linear-convergence-and-prox-linear-quadratic-convergence
  kind: application
  statement: "For any $\\rho$-weakly convex and $\\mu$-sharp composite function $f = h\\circ F$ initialized within $\\mathrm{dist}(x_0,\\mathcal{X}_\\sharp) \\le \\frac{\\alpha\\mu}{2\\rho}$ ($\\alpha \\in (0,1)$), Theorems 5.2 and 5.3 prove that the Polyak and geometrically decaying subgradient methods contract linearly with iteration complexity $O(\\frac{L^2}{\\mu^2}\\log(1/\\varepsilon)) = O(\\kappa(\\boldsymbol{M}_\\sharp)\\log(1/\\varepsilon))$, while Theorem 5.4 proves that the prox-linear iteration $x_{k+1} = \\arg\\min_x\\{f_{x_k}(x) + \\frac{\\beta}{2}\\|x - x_k\\|_2^2\\}$ achieves local **quadratic convergence** $\\mathrm{dist}(x_{k+1},\\mathcal{X}_\\sharp) \\le \\frac{\\rho + \\beta}{\\mu}\\,\\mathrm{dist}^2(x_k,\\mathcal{X}_\\sharp)$, reaching accuracy $\\varepsilon$ in $O(\\log\\log(1/\\varepsilon))$ outer convex subproblems (Section 5, Algorithms 1\u20133, Lemma 5.1, Theorems 5.2\u20135.4)."
  evidence:
  - source_id: ccdddd2021-complowrank-pdf
    locator: Section 5.1 (Algorithms 1-2, Lemma 5.1, Theorems 5.2-5.3, pp. 1538-1542), Section 5.2 (Algorithm 3, Theorem 5.4, pp. 1543-1544)
    relation: supports
