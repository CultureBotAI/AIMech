id: AIMech:NonsmoothCompositeOptimizationAndProxLinearLowRankMatrixRecovery
name: Nonsmooth Convex-Composite Optimization, Weak Convexity, Sharpness, and Prox-Linear Low-Rank Matrix Recovery
concept_kind: mathematical_method
review_status: DRAFT
definition: "A unified nonsmooth convex-composite optimization framework (introduced by Vasileios Charisopoulos, Yudong Chen, Damek Davis, Mateo D\xEDaz, Lijun Ding, and Dmitriy Drusvyatskiy in 2021) for recovering low-rank matrices $\\boldsymbol{M}_\\sharp = \\boldsymbol{W}_\\sharp\\boldsymbol{W}_\\sharp^\\top$ (symmetric) or $\\boldsymbol{X}_\\sharp\\boldsymbol{Y}_\\sharp^\\top$ (asymmetric) from linear, quadratic, or bilinear measurements corrupted by arbitrary gross outliers on a fraction $p_{\\mathrm{fail}} = |\\mathcal{I}_{\\mathrm{fail}}|/m < 1/2$ of observations. Formulating estimation as minimizing the nonsmooth composite objective $f(\\boldsymbol{X}) = h(F(\\boldsymbol{X})) = \\|\\mathcal{A}(\\boldsymbol{X}) - \\boldsymbol{b}\\|_1$ (where $h = \\|\\cdot\\|_1$ is $L$-Lipschitz convex and $F(\\boldsymbol{X}) = \\mathcal{A}(\\boldsymbol{X}) - \\boldsymbol{b}$ is a quadratic map with Linearized Taylor model $f_{\\boldsymbol{X}}(\\boldsymbol{Z}) = h(F(\\boldsymbol{X}) + \\nabla F(\\boldsymbol{X})(\\boldsymbol{Z} - \\boldsymbol{X}))$, Equations 1.4\u20131.5), Propositions 4.1 and 4.6 prove that under rank-$2r$ $\\ell_1/\\ell_2$ Restricted Isometry Property (Assumptions 1\u20132), $f$ satisfies two regularities: (1) global *weak convexity / quadratic model accuracy* $|f(\\boldsymbol{Z}) - f_{\\boldsymbol{X}}(\\boldsymbol{Z})| \\le \\rho\\|\\boldsymbol{Z} - \\boldsymbol{X}\\|_F^2$ with $\\rho = \\kappa_2$ independent of $\\sigma_1(\\boldsymbol{M}_\\sharp)$, and (2) exact *sharpness* $f(\\boldsymbol{X}) - f(\\boldsymbol{X}_\\sharp) \\ge \\mu\\,\\mathrm{dist}(\\boldsymbol{X}, \\mathcal{X}_\\sharp)$ with $\\mu \\asymp (1 - 2p_{\\mathrm{fail}})\\sqrt{\\sigma_r(\\boldsymbol{M}_\\sharp)}$. Consequently, the effective condition number $\\rho/\\mu \\asymp \\sqrt{\\kappa(\\boldsymbol{M}_\\sharp)}$ improves by a square root over smooth squared-loss formulations, enabling linear convergence via Polyak/geometrically decaying subgradient methods (Theorems 5.2\u20135.3) and local **quadratic convergence** $\\mathrm{dist}(\\boldsymbol{X}_{k+1},\\mathcal{X}_\\sharp) \\le \\frac{\\rho}{\\mu}\\,\\mathrm{dist}^2(\\boldsymbol{X}_k,\\mathcal{X}_\\sharp)$ via the prox-linear algorithm $\\boldsymbol{X}_{k+1} = \\arg\\min_{\\boldsymbol{Z}}\\{f_{\\boldsymbol{X}_k}(\\boldsymbol{Z}) + \\frac{\\beta}{2}\\|\\boldsymbol{Z} - \\boldsymbol{X}_k\\|_F^2\\}$ (Equation 1.7, Theorem 5.4)."
identity_notes: Resolved against all 442 pinned AIO concepts and 694 maintained AIMech concepts. Distinct from `AIMech:TruncatedAmplitudeFlowAndOrthogonalityPromotingInitializationForQuadraticEquations` (Wang, Giannakis, & Eldar 2018, which minimizes a smooth-after-truncation squared amplitude loss for rank-1 vectors without outlier robustness or prox-linear quadratic convergence) and from `AIMech:ScaledGradientDescentForIllConditionedLowRankMatrixEstimation` (Tong, Ma, & Chi 2021, which preconditions smooth differentiable losses rather than proving weak convexity and sharpness of nonsmooth $\ell_1$-composite objectives $f(\boldsymbol{X}) = \|\mathcal{A}(\boldsymbol{X}) - \boldsymbol{b}\|_1$).
aliases:
- Convex-Composite Low-Rank Matrix Recovery
- Weakly Convex and Sharp Nonsmooth Low-Rank Matrix Estimation
- Prox-Linear and Polyak Subgradient Low-Rank Matrix Recovery under Gross Outliers
