  - target: AIO:ReinforcementLearning
    rejection_reason: The search policy does not require reward-based policy learning or the learning-task
      identity.
  - target: AIO:DecisionTree
    rejection_reason: The pinned classification task is not a traversal of an implicit search tree.
  - target: AIO:ComputationalBias
    rejection_reason: A deliberate restriction of admissible successor choices is not the computational-bias
      phenomenon denoted by the pinned class.
  - target: AIO:ModelSelectionBias
    rejection_reason: Selecting a search cutoff is not the statistical model-selection bias defined by
      this class.
limitations:
- This is the1990 conference method; the1992 journal full text is not assumed identical.
- The cutoff is per parent. It is neither a global beam width nor a bound on all program memory.
- Completeness statements require terminating passes and eventual inclusion of an adequate search path.
  No shortest-path or arbitrary infinite-tree guarantee is asserted.
- The random-tree analysis has specific distributional assumptions and an explicit approximation. Changing
  child order invalidates its nested-event argument unless nesting is otherwise preserved.
- All five conference pages were visually inspected. Author software and empirical replication were not
  executed. Constructed examples assess mathematical boundaries only.
