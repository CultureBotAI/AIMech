id: AIMech:PredictiveEntropySearch
name: Predictive Entropy Search
concept_kind: algorithm
definition: A Bayesian global optimization algorithm that approximates information about the global maximizer
  by subtracting maximizer-conditioned predictive entropy from ordinary predictive entropy, using approximate
  maximizer samples and Gaussian constraint approximations.
definition_evidence:
- source_id: hernandez2014
  locator: Section 2, PDF pp. 2–5, Equations 2–10 and Algorithm 2
  relation: supports
claims:
- claim_id: optimizer-information-and-entropy-rearrangement
  kind: mechanism
  statement: For a latent objective with a Gaussian-process prior and Gaussian observation noise, using
    a covariance sufficiently differentiable for the method’s derivative conditioning, fix the data, candidate
    location and hyperparameters. Let S be the global maximizer location and Y a prospective noisy observation.
    When the entropy expressions are well-defined, I(S;Y) equals both the expected reduction of optimizer
    entropy and H(Y)-E_S[H(Y|S)]. PES uses the second form. This is the same ideal information objective
    targeted by Entropy Search after a consistent minimum/maximum sign change; their computational approximations
    differ. Maximizing H(Y) alone omits the conditional-entropy term and is not this objective.
  evidence:
  - source_id: hernandez2014
    locator: Sections 1–2, PDF pp. 1–3, Equations 1–3; small original finite-channel illustrations in
      research/discovery/entropy-search-boundaries.py
    relation: supports
  - source_id: hennig2012
    locator: Sections 2.3 and 2.5–2.6, PDF pp. 8–10, 12–14 / printed pp. 1816–1818, 1820–1822
    relation: supports
- claim_id: finite-feature-maximizer-samples
  kind: mechanism
  statement: For a shift-invariant real covariance kernel with a usable spectral distribution, the source
    constructs finite random Fourier features, samples Gaussian posterior feature weights, and numerically
    maximizes each resulting sample function. These locations approximate draws from the posterior maximizer
    law. For fixed features the linear model has the corresponding finite-rank Gaussian-process kernel.
    Averaging feature inner products to recover the original kernel does not make a finite-feature posterior
    or its maximizer samples exact for the original process. Feature count and numerical function maximization
    are additional approximation choices.
  evidence:
  - source_id: hernandez2014
    locator: Section 2.1, PDF p. 3, Equation 5
    relation: supports
  - source_id: hernandez2014-supplement
    locator: Appendix A, supplement PDF pp. 1–2 / printed pp. 10–11; scalar kernel-conditioning boundary
      illustration in research/discovery/entropy-search-boundaries.py
    relation: supports
- claim_id: approximate-maximizer-constraint-inference
  kind: mechanism
  statement: 'For each sampled maximizer, the source conditions the Gaussian process on a zero gradient
    and selected Hessian off-diagonal values. It initially describes zero off-diagonals, then substitutes
    the values from the sample function used to obtain that maximizer. Negative Hessian-diagonal factors
    and a soft comparison with the largest noisy observation are incorporated by expectation propagation
    to give a Gaussian approximation. These are approximate conditioning factors, not a certificate of
    local or global maximality: negative diagonals do not imply negative definiteness when off-diagonals
    are nonzero, and Gaussian moment approximations do not retain the hard sign constraints exactly. The
    zero gradient assumption describes an interior stationary point and does not cover every bounded-domain
    maximum.'
  evidence:
  - source_id: hernandez2014
    locator: Section 2.2, PDF pp. 4–5, C1–C2, Equations 6–7 and sampled off-diagonal substitution after
      Equation 9; original Hessian and boundary examples in research/discovery/entropy-search-boundaries.py
    relation: supports
  - source_id: hernandez2014-supplement
    locator: Appendices B.1–B.2, supplement PDF pp. 2–3 / printed pp. 11–12
    relation: supports
- claim_id: candidate-comparison-and-predictive-variance
  kind: mechanism
  statement: At a candidate x, form a Gaussian approximation to the joint latent values f(x) and f(S),
    then impose f(x)<f(S). For a valid covariance and positive variance of f(S)-f(x), the source obtains
    the variance of the resulting truncated-Gaussian marginal. It then replaces that marginal by a Gaussian
    with the same moments. Observation-noise variance is added before evaluating the Gaussian predictive
    entropy. The truncated marginal itself is generally not Gaussian, and its moments do not make the
    true maximizer-conditioned predictive distribution exact. The Gaussian integral formulation requires
    consistent block ordering when using the supplement’s matrix notation.
  evidence:
  - source_id: hernandez2014
    locator: Section 2.2, PDF p. 5, Equations 8–9 and entropy approximation immediately following them
    relation: supports
  - source_id: hernandez2014-supplement
    locator: Appendix B.3, supplement PDF pp. 3–4 / printed pp. 12–13, Equation 12 and following Gaussian
      prediction expressions; original block-order example in research/discovery/entropy-search-boundaries.py
    relation: supports
- claim_id: hyperparameter-conditional-acquisition-average
  kind: mechanism
  statement: The source samples Gaussian-process hyperparameters from their posterior and pairs each draw
    with an approximate maximizer draw. It averages the difference between one-half log ordinary predictive
    variance and one-half log maximizer-conditioned predictive variance, adding the corresponding draw’s
    observation-noise variance to both. This approximates an average of fixed-hyperparameter information
    acquisitions, E_psi[I(S;Y|psi,D,x)]. Such a conditional-information average is not generally equal
    to I(S;Y|D,x) under the fully marginalized model. The candidate-independent Gaussian and expectation-propagation
    terms can be computed once per draw and reused while evaluating the acquisition.
  evidence:
  - source_id: hernandez2014
    locator: Algorithm 2, PDF p. 2; Section 2.3, PDF p. 5, Equation 10; original finite XOR conditional/marginal
      information example in research/discovery/entropy-search-boundaries.py
    relation: supports
- claim_id: sequential-query-and-final-recommendation
  kind: scope
  statement: The sequential optimizer numerically maximizes the approximate acquisition to choose the
    next location, observes the noisy objective there, augments the data and repeats. Algorithm 1 returns
    a maximizer of the final Gaussian-process posterior mean as its recommendation. That recommendation
    is not defined as the mode of the optimizer-location distribution, and neither the approximation nor
    a finite evaluation budget certifies the true global optimum.
  evidence:
  - source_id: hernandez2014
    locator: Sections 1–2, PDF pp. 1–3; Algorithms 1–2, PDF p. 2
    relation: supports
identity_notes: This record maintains the original PES approximate maximizer-sampling and predictive-entropy
  algorithm. Its ideal fixed-hyperparameter information target agrees with ES, but finite-feature maximizer
  draws and constraint/moment approximations do not identify the ES representer-point/EP-derivative procedure.
  Direction of optimization alone is not the distinction. General GP regression, derivative observations
  and generic entropy calculations are components or different methods. Constrained, parallel and max-value
  methods are not automatically aliases. No acronym alias is adopted; current canonical and ignored-inclusive
  evidence is refreshed before creation.
