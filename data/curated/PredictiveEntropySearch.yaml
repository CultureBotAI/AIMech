  rationale: The pinned class describes interactive querying of an information source for outputs. This
    algorithm selects informative objective evaluations using a surrogate and optimizer-location uncertainty.
    The relation records that query-learning association without identifying the method with annotation
    or pool-based classification, asserting subclass membership, or making the broad AIO class an exact
    optimizer identity.
limitations:
- This is the original PES approximation, not a generic name for all entropy acquisitions. Entropy Search
  directly approximates minimizer probabilities and prospective loss; PES instead uses approximate optimizer
  sampling and predictive-entropy inference. Their ideal fixed-hyperparameter information target is shared.
  Constrained, parallel and max-value entropy methods are not automatically the same identity or assessed
  variants here.
- C3 on main PDF p. 4 reverses the maximum inequality in its all-domain prose, although its heading and
  Equation 8 on p. 5 use the intended candidate comparison. The stability paragraph after Equation 9 tests
  an undefined symbol s. This record retains the stated positive-variance domain and does not silently
  substitute a numerical stabilization rule. At x=S the strict comparison and variance require separate
  degenerate-case handling.
- Supplement B.1 defines K on [z;c], and B.3 defines its cross-covariance in that order, but the displayed
  prediction uses [c;tilde_m] and diag(0,tilde_V), corresponding to the opposite order. Equation 12’s
  Gaussian integral avoids that ambiguity. With [z;c] maintained, the compatible blocks are [tilde_m;c]
  and diag(tilde_V,0); alternatively every matrix must be reordered consistently. This is a curator notation
  assessment, not an author-issued erratum or a tested PES software correction.
- Differential-entropy identities require suitable densities and finite terms. A bounded-domain optimizer
  law can have boundary atoms, and interior derivative constraints omit maxima such as the endpoint of
  f(x)=x on [0,1]. General mutual information can be defined with appropriate measures, but that fact
  alone does not validate these numerical approximations or provide a universal boundary policy.
- The original curator checks cover 27 finite positive binary channels and six constructed algebraic or
  logical boundaries. They illustrate information symmetry, conditional versus marginal information, Hessian
  and covariance limitations. They do not fit a Gaussian process, execute expectation propagation, sample
  random-feature functions, optimize an acquisition, run author code or reproduce benchmarks. No general
  accuracy, speed, regret or convergence advantage over Entropy Search follows from these checks.
