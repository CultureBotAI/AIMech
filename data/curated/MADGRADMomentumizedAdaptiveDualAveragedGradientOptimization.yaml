claims:
- claim_id: c-r596-cuberoot-denominator-and-last-iterate-convex-rate
  kind: mechanism
  statement: Replacing the L1 hindsight constraint <1, s> <= c in Duchi et al. (2011) with an L2 norm constraint ||s||_2^2 <= c yields the cube-root scaling s_d propto (sum_{i=0}^k g_{i,d}^2)^{1/3} (Section 5.5.4 & Appendix C, pp. 10-11, 32-33), which cancels the (k + 1)^{3/2} growth of sum_{i=0}^k sqrt(i + 1) to preserve a sqrt(k + 1) denominator and guarantees last-iterate convex convergence E[f(x_k) - f(x_*)] <= (6 / k^{1/2}) ||x_0 - x_*||_2 G D^{1/2} for c_k = (3/2) / (k + 3/2) (Theorem 1 & Theorem 6, pp. 12, 28-31).
  evidence:
  - source_id: r596-primary-pdf
    locator: Section 5.5.4-6, Eq. (5)-(6), Algorithm 1, & Theorem 1, pp. 10-12; Appendix B-C, Lemma 2-4 & Theorem 5-6, pp. 24-33
    relation: supports
- claim_id: c-r596-outlier-gradient-decay-and-implicit-x0-regularization
  kind: mechanism
  statement: Centering dual averaging at x_0 induces an implicit step-dependent regularizer (1 / (4 sqrt(k))) ||x_k - x_0||^2 that decays during training (Section 5.2, p. 5), while forward weighting lambda_i = gamma sqrt(i + 1) causes early outlier gradient bounds G_i to decay at rate O((k + 1)^{-5/4}) rather than O((k + 1)^{-1}) in momentum AdaGrad (Section 6.1 & Appendix B.5, pp. 13, 31).
  evidence:
  - source_id: r596-primary-pdf
    locator: Section 5.2, p. 5; Section 6.1, p. 13; Appendix B.5, pp. 31-32
    relation: supports
- claim_id: c-r596-vision-mri-and-nlp-generalization
  kind: application
  statement: Across CIFAR-10 PreAct-ResNet152 (95.38% vs SGD+M 95.22% and Adam 94.69%), ImageNet ResNet-50 (76.22% vs SGD+M 76.09% and Adam 73.03%), fastMRI VarNet 2.0 (0.9119 SSIM vs Adam 0.9111), IWSLT14 LSTM (4.33 test loss vs Adam 4.35), and BookWiki RoBERTa MLM (2.07 test loss vs Adam 2.09), MADGRAD matches or outperforms both SGD+M and Adam on test-set performance.
  evidence:
  - source_id: r596-primary-pdf
    locator: Section 7.1-7.5, Figures 3-4, pp. 14-18
    relation: supports
- claim_id: c-r596-lr-scale-weight-decay-and-sparse-buffer-limitations
  kind: limitation
  statement: MADGRAD learning rates are not directly comparable to SGD or Adam (requiring a power-of-2 sweep and substantially smaller weight decay), its global step-size bound is not scale-free with respect to gradient norms, and supporting sparse parameter updates requires disabling the dense iterate moving-average buffer by setting c = 1.
  evidence:
  - source_id: r596-primary-pdf
    locator: Section 5.5.4, p. 11; Section 8.1 & 8.3, pp. 18-19
    relation: supports
