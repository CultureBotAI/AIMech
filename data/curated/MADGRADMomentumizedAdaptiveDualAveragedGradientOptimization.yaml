id: AIMech:MADGRADMomentumizedAdaptiveDualAveragedGradientOptimization
name: MADGRAD (Momentumized, Adaptive, Dual Averaged Gradient Method)
concept_kind: algorithm
review_status: DRAFT
definition: An AdaGrad-family stochastic optimization algorithm (Algorithm 1) built on Nesterov dual averaging with double averaging that centers the quadratic proximity function at the initial iterate x_0, accumulates forward-weighted gradients s_{k+1} = s_k + lambda_k g_k and squared gradients nu_{k+1} = nu_k + lambda_k (g_k circ g_k) using weights lambda_k = gamma_k sqrt(k + 1), forms the dual-averaged step z_{k+1} = x_0 - (nu_{k+1}^{1/3} + epsilon)^{-1} circ s_{k+1} via a cube-root denominator, and updates iterates via inline momentum averaging x_{k+1} = (1 - c_{k+1}) x_k + c_{k+1} z_{k+1}.
identity_notes: 'Distinct from standard mirror-descent AdaGrad and DA-AdaGrad in four ways: (1) centering the dual-averaging proximity function at x_0 rather than the origin 0 (inducing an implicit decaying regularizer (1 / (4 sqrt(k))) ||x_k - x_0||^2), (2) weighting gradients by lambda_k = gamma_k sqrt(k + 1) so the leading gradient weight remains constant during flat learning-rate phases, (3) replacing the square-root denominator with a cube-root denominator nu_{k+1}^{1/3} derived from an L2-norm hindsight penalty ||s||_2^2 <= c, and (4) incorporating momentum via inline iterate interpolation x_{k+1} = (1 - c_{k+1}) x_k + c_{k+1} z_{k+1}.'
aliases:
- MADGRAD Optimizer
- Momentumized Adaptive Dual Averaged Gradient
- Cube-Root Dual Averaged AdaGrad (MADGRAD)
