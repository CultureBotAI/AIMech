claims:
- claim_id: r373-claim-natasha15-proximal-retraction-bounded-second-order-regularized-subproblem
  kind: mechanism
  statement: When the objective f(x) satisfies lambda_min(nabla^2 f(x)) >= -sigma for a target curvature threshold sigma in (0, L), adding the proximal retraction term sigma * ||x - xhat||_2^2 makes the regularized subproblem g(x) = f(x) + sigma * ||x - xhat||_2^2 (sigma)-strongly convex and (L + 2*sigma)-smooth locally; Natasha 1.5 (Algorithm 1) divides each epoch of length m = B = Theta(1 / (sigma * varepsilon^2)) into p = Theta((L / sigma)^{2/3}) sub-epochs with proximal centers xhat updated every m/p steps and step size alpha = Theta(1 / (L^{1/3} sigma^{2/3} B)), achieving E[f(y_0) - f(y_1)] >= Omega(sigma / L) * E||nabla f(x_out)||_2^2 - O(varepsilon^2 * sigma / L) (Lemma 3.1, Lemma 4.2).
  evidence:
  - source_id: r373-primary-pdf
    locator: Section 2.2-3.1, Algorithm 1, Lemma 3.1, pp. 4-7; Appendix B, Lemma 4.2, pp. 14-18
    relation: supports
- claim_id: r373-claim-oja-negative-curvature-swing-by-and-first-second-order-complexity
  kind: mechanism
  statement: 'In Natasha 2 (Algorithms 2-3), each outer iteration first runs Oja''s online eigenvector algorithm for T_oja = Theta((L / delta)^2 * log(d / p)) stochastic gradient difference evaluations (approximating Hessian-vector products via finite differences nabla f_i(y + r*w) - nabla f_i(y) without requiring a Hessian oracle): if a direction v with v^T nabla^2 f(y_k) v <= -delta/2 is found, moving by +-(delta / L_2) v decreases f by Omega(delta^3 / L_2^2); otherwise, one epoch of Natasha 1.5 with sigma = 3*delta/2 swings by any nearby saddle point in B = Theta(1 / (delta * varepsilon^2)) steps, yielding total stochastic gradient complexity O_tilde((L * Delta_f / varepsilon^{3.25}) + (L^2 * Delta_f / varepsilon^3)) = O_tilde(varepsilon^{-3.25}) for E||nabla f(x)||_2 <= varepsilon when delta = varepsilon^{0.5} (Theorem 1), and O_tilde(varepsilon^{-3.25} + varepsilon^{-1.5} delta^{-3.5}) for an (varepsilon, delta)-second-order stationary point (Theorem 2).'
  evidence:
  - source_id: r373-primary-pdf
    locator: Section 3.2-3.3, Algorithms 2-3, Theorems 1-2, pp. 7-9; Appendix C-D, pp. 19-27
    relation: supports
- claim_id: r373-claim-scope-hessian-free-finite-difference-reduction
  kind: scope
  statement: By replacing exact stochastic Hessian-vector products nabla^2 f_i(y) * w with first-order directional finite differences (nabla f_i(y + r*w) - nabla f_i(y))/r for infinitesimally small r > 0 during Oja's method, Natasha 2 operates purely with a stochastic first-order gradient oracle while exploiting second-order Lipschitz continuity ||nabla^2 f(x) - nabla^2 f(y)||_2 <= L_2 ||x - y||_2 to beat SGD's O(varepsilon^{-4}) rate and SCSG's O(varepsilon^{-10/3}) rate.
  evidence:
  - source_id: r373-primary-pdf
    locator: Section 1.1-1.2, Table 1, pp. 2-3; Remark 3.3, p. 8
    relation: supports
