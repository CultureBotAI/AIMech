claims:
- claim_id: costa-multi-granularity-span-pooling-and-nonlinear-projector
  kind: mechanism
  statement: COSTA samples T spans at each of 4 granularities (word-level, phrase-level [4, 16], sentence-level [16, 64], and paragraph-level [64, 128]) using Beta(alpha=4, beta=2) length sampling (Equations 1-3) and extracts both the whole-text representation z_0 = Tanh(FFN(h_0)) and all 4T span representations z_i = AvgPooling([h_start, ..., h_{end-1}]) from a single forward pass of the Transformer encoder (Equations 4-7, Algorithm 1), where the nonlinear Tanh-FFN projector prevents representation collapse between same-layer [CLS] and span outputs (Table 6).
  evidence:
  - source_id: r767-primary-pdf
    locator: Section 3.2, Section 4.5.1 & Section 5.3.3, Equations 1-7, Algorithm 1, Tables 4 & 6, pp. 3-4, 6, 8
    relation: supports
  - source_id: r767-primary-pdf
    locator: main() verification of Beta(4, 2) span length expectation and multi-granularity intervals
    relation: supports
- claim_id: costa-group-wise-contrastive-loss
  kind: mechanism
  statement: Given a mini-batch of N documents and their N * 4T spans (forming N(4T+1) representations), COSTA optimizes the Group-Wise Contrastive loss L_GWC = sum_{i=1}^N -(1/(4T)) sum_{p in S(i)} log(exp(sim(z_i, z_p)/tau) / sum_{j=1}^{N(4T+1)} 1_{[i != j]} exp(sim(z_i, z_j)/tau)) jointly with L_MLM via L_total = lambda L_GWC + L_MLM (Equations 8-9), eliminating the decoder bypass effect and producing more discriminative document clusters than SEED-Encoder (Figure 3).
  evidence:
  - source_id: r767-primary-pdf
    locator: Sections 3.2-3.3 & Section 5.4, Equations 8-9, Figure 3, pp. 4-5, 9
    relation: supports
  - source_id: r767-primary-pdf
    locator: main() verification of group_wise_contrastive_loss L_GWC on aligned vs unaligned span groups
    relation: supports
- claim_id: costa-dense-retrieval-applications
  kind: application
  statement: Pre-trained on Wikipedia and fine-tuned on MS MARCO Passage Ranking, TREC 2019 DL Passage, MS MARCO Document Ranking, and TREC 2019 DL Document, COSTA significantly outperforms BERT, ICT, PROP, B-PROP, and SEED under identical fine-tuning (reaching 0.366 MRR@10 on MS MARCO Dev Passage and 0.422 MRR@100 on MS MARCO Dev Doc in Tables 1-3).
  evidence:
  - source_id: r767-primary-pdf
    locator: Sections 5.1-5.2 & 5.5, Tables 1-3, Figure 4, pp. 6-7, 9
    relation: supports
  - source_id: r767-metadata-cr
    locator: BibTeX citation record for arXiv:2204.10641 (SIGIR 2022, doi:10.1145/3477495.3531772)
    relation: supports
- claim_id: costa-span-count-and-temperature-sensitivity-limitation
  kind: limitation
  statement: Sampling too many spans per granularity (e.g., T = 20, requiring each whole-text vector to align simultaneously with 80 random spans) slows convergence and degrades retrieval MRR@10 from 0.339 (at T = 5) to 0.320 (Table 5), and L_GWC is highly sensitive to the temperature hyperparameter tau (dropping from 0.335 MRR@10 at tau = 0.1 to 0.274 at tau = 10 and 0.267 at tau = 0.01 in Table 7).
  evidence:
  - source_id: r767-primary-pdf
    locator: Sections 5.3.2 & 5.3.4, Tables 5 & 7, pp. 8-9
    relation: supports
