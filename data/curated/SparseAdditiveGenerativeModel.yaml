  rationale: SAGE is explicitly used to construct probabilistic topic models, but its family also includes
    observed-class and multifaceted generative text models. The AIO topic-model task therefore provides
    a related application/modeling context, not an equivalent identity or a necessary superclass. SparseLearning
    denotes sparse dictionary representations, SparseAutoEncoder denotes hidden-unit constraints, and
    SparseLLM denotes language-model compression, none of which identifies sparse log-frequency deviations.
