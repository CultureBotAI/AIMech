name: Sparse additive generative model
definition: A generative model family for categorical text data that forms word probabilities by normalizing
  a background log-frequency vector plus sparse component deviations, allowing multiple generative facets
  to combine additively in log space.
concept_kind: model_family
identity_notes: 'SAGE here denotes Eisenstein, Ahmed and Xing’s sparse additive generative construction,
  not Sage mathematical software or graph-neural aggregation. Its classification, topic and multifaceted
  uses share this parameterization; it is not synonymous with all naive Bayes models, sparse dictionary
  learning, sparse topic proportions or an arithmetic mixture of component word distributions. All 442
  pinned AIO labels/scoped synonyms and 352 preceding native IDs/names/aliases were compared, with no
  normalized identity match. Both full-checkout searches included ignored and hidden files; worktree returned 15
  lines and main 19. All 16 unique matched contents were read: DocNADE contrasts, frontier and review references,
  plus four ignored-environment Sage/Pygments entries unrelated to AI SAGE. Twenty-one exact AIO nodes
  and four complete native neighbors were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.'
limitations:
- Sparsity concerns log deviations. Finite logits still give positive word probabilities, and even zero-deviation
  words can change absolute probability through normalization; their relative odds remain those of the
  background when their deviations agree.
- Additive log facets yield multiplicative unnormalized effects, not an arithmetic probability mixture.
  The model family does not require every document to have a single observed class or prohibit latent
  variables.
- The Jeffreys-prior paragraph on PDF p.4 prints expected inverse variance equal to eta squared. Its preceding
  Gamma moment and b=eta squared/(a-1) instead give 1/eta squared for nonzero eta, with a>1 and positive
  scale. The printed final identity is not adopted; zero deviations require a limiting/numerical treatment.
  The improper prior is not represented as a normalized marginal distribution.
- The paper warns that warm-starting tightly coupled deviation/variance updates can lock in early sparsity
  patterns. Neither approximate inference nor Newton updates establish global convergence or calibrated
  posterior uncertainty.
- The single-component rank-one Hessian argument is not asserted unchanged for sums over multiple facet
  combinations. No author implementation, universal predictive advantage or numerical benchmark result
  is certified.
