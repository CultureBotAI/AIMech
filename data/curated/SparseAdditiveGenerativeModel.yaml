claims:
- claim_id: method
  kind: mechanism
  statement: 'For a component k, set p(w=i|k) proportional to exp(m_i+eta_ki), normalizing over the vocabulary.
    Multiple selected facets contribute a sum of their deviation vectors before this normalization; no
    additional token-level switch is needed to choose which facet generates the word. This does not remove
    latent topic assignments used by a topic-model variant. The paper places sparsity-inducing priors
    on deviations, using zero-mean Gaussian components with latent variances: an exponential variance
    prior gives a Laplace marginal, while an alternative improper Jeffreys prior gives a different shrinkage
    construction. It combines MAP estimates of deviations with variational treatment of other latent quantities.
    For a single component and fixed expected precisions, the gradient is observed or expected counts
    minus total count times word probabilities minus the precision-weighted deviations; its Hessian is
    a rank-one term minus a diagonal term, enabling the reported efficient Newton update.'
  evidence:
