name: Training signal annealing
definition: A supervised-loss scheduling procedure that temporarily excludes labeled examples already
  predicted with confidence above an increasing threshold, gradually allowing more labeled training signal
  during semi-supervised learning.
concept_kind: algorithm
identity_notes: 'TSA is the named labeled-loss schedule introduced as an additional UDA training technique,
  not the entire UDA method, an unlabeled pseudo-label confidence filter, or an LLM model class. It is
  related to curriculum scheduling but does not follow the pinned AIO CurriculumLearning definition’s
  simple-to-complex presentation rule: it withholds already-confident labeled examples rather than starting
  with them. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  243 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in both worktree and main checkout, returning 102 lines in the worktree and 103 in main from prior
  discovery, saved reviews and related native records. Twelve exact AIO CLASS nodes, their scoped synonyms
  and outgoing edges, plus eight neighboring native mechanisms were inspected. This absence assessment
  is bounded to the pinned snapshot and inspected semantic neighborhood.'
limitations:
- The schedule depends on the current classifier’s confidence and does not measure intrinsic example difficulty
  or guarantee avoidance of overfitting.
- The paper’s prose describes a threshold progressing from1/K to1, but the nonlinear formulas do not both
  attain those exact endpoints at finite T.
- The implementations retain threshold equality and normalize by retained count; these details differ
  from a strict less-than mask or a full labeled-batch denominator.
- The linear/log/exponential schedule choices and K,T must match the training setting. No benchmark gain,
  optimal schedule or universal need for TSA is claimed.
