claims:
- claim_id: claim-spider-martingale-variance-and-normalized-step-bound
  kind: mechanism
  statement: For any sequence x^{0:K} with step displacements ||x^k - x^{k-1}|| <= epsilon_1 and mini-batch estimator B_{S_*}(x) satisfying E||B_i(x) - B_i(y)||^2 <= L_B^2 ||x - y||^2, the SPIDER recursion V^k = B_{S_*}(x^k) - B_{S_*}(x^{k-1}) + V^{k-1} forms a square-integrable martingale difference sum whose variance satisfies E||V^k - B(x^k)||^2 <= k L_B^2 epsilon_1^2 / S_* + E||V^0 - B(x^0)||^2 (Proposition 1(i) and Lemma 1) and dimension-free Pinelis high-probability concentration ||Q_tilde(x^{0:k}) - Q(x^k)|| <= 2 sqrt(sum_{s=0}^k b_s^2 log(1/gamma)) (Proposition 1(ii) and Proposition 2); coupling V^k with the Normalized Gradient Descent step x^{k+1} = x^k - eta^k v^k where eta^k = min(epsilon/(L n_0 ||v^k||), 1/(2 L n_0)) enforces ||x^{k+1} - x^k|| <= epsilon/(L n_0) and guarantees E[||v^k - grad f(x^k)||^2 | x^{0:k_0}] <= epsilon^2 across the entire epoch of length q (Lemma 2).
  evidence:
  - source_id: r345-primary-pdf
    locator: Section 2, Proposition 1 and Lemma 1, pp. 7-8; Section 3.2, Equation 3.4 and Lemma 2, p. 11; Appendix A-B.1, Proposition 2 and Proofs, pp. 25-26
    relation: supports
  - source_id: r345-arxiv-abs
    locator: 'Abstract: combining SPIDER with normalized gradient descent to track deterministic quantities with reduced computational cost'
    relation: supports
- claim_id: claim-spider-sfo-near-optimal-first-and-second-order-stationarity
  kind: mechanism
  statement: Under averaged L-Lipschitz gradients (Assumption 1), SPIDER-SFO finds an epsilon-approximate first-order stationary point E[||grad f(x_tilde)||] <= 5*epsilon in at most 16 L Delta sigma epsilon^{-3} + 2 sigma^2 epsilon^{-2} + 4 sigma n_0^{-1} epsilon^{-1} = O(epsilon^{-3}) stochastic gradient evaluations in the online setting (Theorem 1) and n + 8 L Delta n^{1/2} epsilon^{-2} + 2 n_0^{-1} n^{1/2} = O(n + n^{1/2} epsilon^{-2}) evaluations in the finite-sum setting (Theorem 2), matching the algorithmic lower bound Omega(L Delta n^{1/2} epsilon^{-2}) for any randomized first-order algorithm when n <= O(Delta^2 L^2 epsilon^{-4}) (Theorem 3); furthermore, under rho-Lipschitz Hessians (Assumption 3), SPIDER-SFO+ (Algorithm 2) splits each delta/rho negative-curvature escape step into K = delta L n_0 / (rho epsilon) equal-length mini-steps of size eta = epsilon/(L n_0) to maintain the SPIDER estimator without full-gradient restart, finding an (epsilon, O(epsilon^{0.5}))-approximate second-order stationary point in O_tilde(min(n^{1/2} epsilon^{-2} + epsilon^{-2.5}, epsilon^{-3})) gradient evaluations (Theorem 6 and Corollary 7).
  evidence:
  - source_id: r345-primary-pdf
    locator: Section 3.2-3.3, Theorems 1, 2, 3, 4, 5, 6 and Corollary 7, pp. 11-16; Appendix B.2-B.4 and B.6, pp. 27-40, 44-52
    relation: supports
  - source_id: r345-metadata-cr
    locator: 'NeurIPS 2018 abstract: O(min(n^{1/2} epsilon^{-2}, epsilon^{-3})) for first-order and O_tilde(min(n^{1/2} epsilon^{-2} + epsilon^{-2.5}, epsilon^{-3})) for second-order stationary points'
    relation: supports
- claim_id: claim-spider-small-n-regime-and-zeroth-order-dimension-overhead
  kind: limitation
  statement: Because SPIDER-SFO requires small normalized step sizes proportional to epsilon / (L n_0) to control martingale error accumulation along the path, in the finite-sum second-order regime when n <= O(epsilon^{-1}) unaccelerated SPIDER-SFO+ has complexity O_tilde(epsilon^{-2.5}), which is slower than momentum-accelerated NEON+FastCubic/CDHS methods achieving O_tilde(n^{3/4} epsilon^{-1.75}) (Footnote 1 and Section 3.3, p. 16); additionally, in stochastic zeroth-order optimization (SPIDER-SZO, Algorithm 3), two-point Gaussian smoothing incurs an O(d) variance factor E||g_hat_i(x) - g_hat_i(y)||^2 <= 2(d+4)L^2 ||x - y||^2 + 2 mu^2 (d+6)^3 L^2 (Lemma 3), scaling the Incremental Zeroth-Order Oracle complexity by d to O(d min(n^{1/2} epsilon^{-2}, epsilon^{-3})) (Theorem 8).
  evidence:
  - source_id: r345-primary-pdf
    locator: Section 1, Footnote 1, p. 4; Section 3.3, Discussion on n = O(epsilon^{-1}), p. 16; Section 4, Algorithm 3, Lemma 3, and Theorem 8, pp. 18-20
    relation: supports
