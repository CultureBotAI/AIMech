id: AIMech:DARTDifferentiablePromptFewShotTuning
name: DART Differentiable Prompt Few-Shot Tuning
concept_kind: algorithm
review_status: DRAFT
definition: A few-shot prompt-based fine-tuning algorithm that maps both template tokens {[T_{0:i}], [MASK], [T_{i+1:m}]} and target class labels M(Y_j) = {h_{m+j}} to trainable continuous pseudo-token embeddings {h_1, ..., h_m, ..., h_{m+n}} assigned to unused tokens in the language model vocabulary V', and jointly optimizes them with backpropagation under a combined class-discrimination cross-entropy loss L_C = CE(g(y|X_prompt)) and an auxiliary masked-input fluency constraint loss L_F = sum_{m in M} BCE(h(x^m | x', y)) via L = L_C + lambda L_F without adding external prompt-encoder networks.
identity_notes: Distinct from LM-BFF (Gao et al., ACL 2021, AIMech:LMBFFBetterFewShotFineTuning), which performs brute-force discrete verbalizer search and external T5 template generation, from P-Tuning (Liu et al., 2021), which relies on an external bidirectional LSTM to induce template token co-dependence and uses fixed discrete verbalizers, and from WARP (AIMech:WARPWordLevelAdversarialReProgramming), which freezes the backbone Transformer and does not enforce an auxiliary MLM fluency constraint.
aliases:
- DART
- DifferentiAble pRompT
- DART Differentiable Template and Label Prompt Tuning
- Fluency-Constrained Differentiable Prompt and Label Optimization
