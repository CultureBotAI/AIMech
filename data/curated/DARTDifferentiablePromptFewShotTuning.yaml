claims:
- claim_id: r725-claim-joint-template-label-and-fluency
  kind: mechanism
  statement: To eliminate exponential O(k^C) discrete verbalizer search over C classes and external LSTM reparameterization, DART assigns unused vocabulary tokens V' to both m template pseudo-tokens {h_0, ..., h_m} and n class-label pseudo-tokens M(Y_j) = {h_{m+j}}, coupling them via an auxiliary fluency constraint objective L_F that randomly masks an input sentence token x^m in x', feeds the gold pseudo-label token y in place of [MASK], and maximizes masked-token reconstruction probability h(x^m | x', y).
  evidence:
  - source_id: r725-primary-pdf
    locator: Section 4.2-4.4, Equations 3-10, Figure 1, pp. 2, 4-5
    relation: supports
- claim_id: r725-claim-intra-inter-distance-separability
  kind: mechanism
  statement: Optimizing continuous template and label pseudo-tokens under DART lowers the ratio R_D = D_bar_intra / D_bar_inter between average Euclidean intra-class distance and inter-class distance of [MASK] hidden state representations compared to fixed discrete prompts, producing more compact and linearly separable class clusters.
  evidence:
  - source_id: r725-primary-pdf
    locator: Section 5.5 & Appendix A.6, Equation 11, Figures 3, 4, and 6, pp. 8-9, 18
    relation: supports
- claim_id: r725-claim-few-shot-re-and-classification-application
  kind: application
  statement: "Across 15 NLP benchmarks\u2014including complex many-class relation extraction and event extraction tasks (SemEval-2010 Task 8, TACRED-Revisit, Wiki80, ChemProt, ACE-2005)\u2014DART improves 8-shot performance by up to 27.0 points (23.28% average gain) over conventional fine-tuning and outperforms both LM-BFF and P-Tuning without requiring an external T5 template generator."
  evidence:
  - source_id: r725-primary-pdf
    locator: Section 5.3-5.4, Tables 1-3, Figure 2, pp. 6-8
    relation: supports
- claim_id: r725-claim-domain-shift-and-non-mlm-limitation
  kind: limitation
  statement: The auxiliary fluency constraint objective L_F cannot be applied to autoregressive language models not pretrained with a masked language modeling objective (such as GPT-2), and DART remains susceptible to hyperparameter sensitivity across few-shot data splits and performance degradation when the downstream task corpus distribution diverges strongly from the pretraining corpus (e.g., specialized biomedical text without domain pretraining).
  evidence:
  - source_id: r725-primary-pdf
    locator: Section 5.5 (Footnote 6) & Appendix A.7, pp. 8, 18-19
    relation: supports
