name: Rank-based Ant System
definition: An Ant System variant that weights pheromone deposits from a selected number of the current
  iteration’s best tours by rank and adds a separate reinforced contribution from the best-so-far tour.
concept_kind: algorithm
identity_notes: This record denotes ASrank in the inspected 1997 working paper. It differs from unweighted
  all-ant deposits, elitist Ant System’s all-ant-plus-archive deposits, and MAX–MIN’s single-best bounded-trail
  update. Rank determines which ants contribute and their additional weights, but inverse tour length
  remains in the deposit; the rule is not purely ordinal. No normalized identity match was found across
  all 442 pinned AIO labels/scoped synonyms and 291 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 61 and 71 lines
  respectively. Text hits were prior candidate leads, citations to a reused Ant System source, neighboring
  mechanism distinctions, saved review/report material, and unrelated PBIL strings in ignored HOGENOM
  prefix-map URLs. Eight exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five
  native neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The displayed sum requires enough current ants and a declared integer sigma; sigma=1 leaves only the
  best-so-far contribution. Ties in tour length need a rank assignment or tie policy, which can matter
  when tied tours use different edges.
- Rank weighting still multiplies inverse positive tour cost. An increasing transformation or constant
  shift of costs can preserve ranks while changing deposits, heuristic weights and the search trajectory.
  Calling the algorithm rank-based does not establish invariance to arbitrary fitness transformations.
- The retained best tour is a search memory, not a certified optimum. Strong elite weighting and vanishing
  trails can reduce exploration. Evaporation and rank selection do not provide the positive support bounds
  of MAX–MIN, and no finite-run global-optimality guarantee is asserted.
- Positive distances/costs, finite normalizers, initialization, heuristic exponents, edge symmetry, stopping
  and numerical behavior need explicit configuration. The 1997 working paper’s small benchmark comparison
  is not assumed identical to every later implementation or the 1999 journal text.
