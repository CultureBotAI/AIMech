claims:
- claim_id: method
  kind: mechanism
  statement: Construct traveling-salesman tours using Ant System’s feasible-city probabilities proportional
    to tau^alpha*eta^beta with eta=1/d, and retain the best-so-far tour. Sort the m current tours by nondecreasing
    positive length L_1<=...<=L_m. In the displayed rule choose an integer elite weight sigma with 1<=sigma<=m+1,
    so the top sigma−1 current tours are available. Update each edge by rho*tau plus the sum, over ranks
    mu=1..sigma−1 whose tours use the edge, of (sigma−mu)*Q/L_mu, plus sigma*Q/L_best if the best-so-far
    tour uses that edge. Rho is trail retention, so 1−rho is the evaporated fraction. The archive contribution
    is added separately even when the same tour also contributes through a current rank. Reconstruct new
    tours using the resulting trails for the next iteration; the paper’s update does not add MAX–MIN trail
    bounds or the ACS local rule.
