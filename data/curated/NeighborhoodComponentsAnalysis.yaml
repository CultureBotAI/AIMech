name: Neighbourhood components analysis
definition: A supervised metric-learning algorithm that learns a linear transformation by maximizing the
  expected number of correctly classified training examples under stochastic leave-one-out neighbor selection.
concept_kind: algorithm
identity_notes: NCA is Goldberger et al.’s transformation-learning procedure, not ordinary k-nearest-neighbor
  voting or an unsupervised local-coordinate reconstruction. Its main objective sums correct-class probabilities;
  the paper also discusses a sum-of-log-probabilities alternative, which is a different objective. A rectangular
  transformation enables supervised dimensionality reduction. The AIO MetricLearning node is explicitly
  a deep neural network, so the original linear NCA procedure is not treated as its subclass. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 223 preceding native IDs/names/aliases.
  Word-delimited fixed-string searches of both full checkouts, including ignored and hidden files, returned
  2 worktree lines in discovery context and 6 main-checkout lines including four unrelated ignored dependency
  matches. Six neighboring native records and nine exact AIO nodes with scoped synonyms and outgoing edges
  were inspected.
limitations:
- Training uses class labels and a smooth stochastic surrogate, not the discontinuous deterministic k-nearest-neighbor
  accuracy. Improving its training objective does not certify held-out classification accuracy.
- The objective is nonconvex in A; initialization and the optimizer affect its result. A=0 is a stationary
  point of the displayed gradient, so a claim that any initialization learns a useful metric would be
  unwarranted.
- At least two observations are needed for the leave-one-out denominator. A class represented by a singleton
  has p_i=0 and contributes no correct-class reward; the paper’s logarithmic alternative is undefined
  for that point.
- Rectangular or rank-deficient A yields a positive-semidefinite squared distance with possible collapsed
  directions. It need not define a strictly positive distance between distinct original points. No global
  optimum, absence of overfitting or benchmark advantage is asserted.
