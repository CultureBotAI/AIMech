claims:
- claim_id: method
  kind: mechanism
  statement: For labeled vectors x_i, choose a matrix A, possibly rectangular, and use squared transformed
    distance d_ij=||A(x_i−x_j)||², with Q=A^T A positive semidefinite. For j!=i set p_ij=exp(−d_ij)/sum_(k!=i)exp(−d_ik),
    and set p_ii=0. Define p_i=sum_(j:c_j=c_i)p_ij. Optimize f(A)=sum_i p_i by a gradient-based method;
    this is the expected number of correct labels when each training point selects one other point as
    its neighbor according to p_ij. For dimensionality reduction use A with d rows, store Ax_i and classify
    a new projected point using ordinary Euclidean k-nearest-neighbor voting. Learning the scale of A
    changes the softness of the training neighbor distribution; it does not uniquely determine the later
    integer k.
