claims:
- claim_id: method
  kind: mechanism
  statement: Compare a supplied initial configuration with a fixed number of random configurations, then
    perform randomized first-acceptable one-exchange local search. Exclude moves that change only a currently
    inactive conditional parameter. Repeatedly perturb the current search configuration by a fixed number
    of random neighborhood moves, apply the local-search routine, and accept the resulting configuration
    when the chosen comparison procedure judges it at least as good. Independently restart the search
    configuration at random with a specified probability. Maintain an overall incumbent and return it
    at termination. The framework deliberately leaves comparison and objective estimation to an instantiation
    such as BasicILS or FocusedILS.
