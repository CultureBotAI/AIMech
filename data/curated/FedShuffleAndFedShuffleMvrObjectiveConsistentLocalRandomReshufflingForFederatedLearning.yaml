id: AIMech:FedShuffleAndFedShuffleMvrObjectiveConsistentLocalRandomReshufflingForFederatedLearning
name: FedShuffle and FedShuffleMVR Objective-Consistent Local Random Reshuffling for Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A family of federated local-epoch optimization algorithms with without-replacement Random Reshuffling (FedShuffle in Algorithm 1/3, its Momentum Variance Reduction extension FedShuffleMVR in Section 5.1, and the unifying parametrization FedShuffleGen in Algorithm 4) that eliminates objective inconsistency under heterogeneous client dataset sizes |D_i| and arbitrary proper client sampling S^r ~ S (with inclusion probabilities p_i = Pr[i in S]) by scaling each client i's local learning rate inversely by its dataset size (eta_{l,i}^r = eta_l^r / (E_i |D_i|)) and aggregating client updates with unbiased Horvitz-Thompson weights Delta^r = sum_{i in S^r} (w_i / p_i) Delta_i^r.
identity_notes: Distinct from FedAvg with Random Reshuffling (FedAvgRR, which uses unscaled local step sizes and biased Sum-One aggregation w_i / sum_{j in S^r} w_j and converges to a mismatched objective), FedNova (Wang et al., NeurIPS 2020; which rescales aggregation weights rather than local step sizes, forcing a smaller worst-case local step size and not analyzing random reshuffling), and FedRR / LocalRR (which assume full client participation and identical dataset sizes).
aliases:
- FedShuffle
- FedShuffleMVR
- FedShuffleGen
- Federated Random Reshuffling with Step-Size Scaling and Unbiased Aggregation
