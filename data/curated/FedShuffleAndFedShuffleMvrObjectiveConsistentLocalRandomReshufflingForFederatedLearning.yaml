claims:
- claim_id: fedshuffle-inverse-dataset-step-size-scaling-and-horvitz-thompson-aggregation-mechanism
  kind: mechanism
  statement: In each communication round r (Algorithm 1 & Algorithm 4), each sampled client i in S^r ~ S executes E_i local epochs over random permutations Pi_{i,e}^r of its local dataset D_i using scaled local step size eta_{l,i}^r = eta_l^r / (E_i |D_i|) (update y_{i,e,j}^r = y_{i,e,j-1}^r - (eta_l^r / |D_i|) nabla f_{i, Pi_{i,e,j-1}^r}(y_{i,e,j-1}^r)), and the server aggregates Delta_i^r = y_{i,E_i,|D_i|}^r - x^r via Delta^r = sum_{i in S^r} (w_i / p_i) Delta_i^r so that the effective optimized objective hat{f}(x) = sum_i hat{w}_i f_i(x) in Theorem E.1 Eq. (31) satisfies hat{w}_i = w_i exactly while permitting larger local step sizes than FedNova (Remark E.2).
  evidence:
  - source_id: r565-primary-pdf
    locator: Section 4.1-4.2 pp. 6-8 & Appendix E.1-E.2 Theorem E.1 / Remark E.2 pp. 34-36
    relation: supports
- claim_id: fedshuffle-and-fedshufflemvr-reshuffling-variance-and-hessian-similarity-convergence-scope
  kind: scope
  statement: Under L-smoothness and (sigma_i, P_i)-bounded variance (Theorem 5.1), FedShuffle reduces the local stochastic variance term to O(sigma^2 / (R^2 eta_g^2 E^2)) in strongly convex and O(sigma^{2/3} / (R^{2/3} eta_g^{2/3} E^{2/3})) in general convex and nonconvex regimes; furthermore, under delta-Hessian similarity (Assumption 3.5), FedShuffleMVR (Theorem 5.2) incorporates server momentum variance reduction Eq. (13)-(14) to achieve O((delta^{2/3} F^{2/3} (G^2 + sigma^2)^{1/3}) / R^{2/3} + (delta F + G^2) / R) nonconvex stationarity with E >= L / delta.
  evidence:
  - source_id: r565-primary-pdf
    locator: Section 5 Theorem 5.1 & Section 5.1 Theorem 5.2 pp. 8-10
    relation: supports
  - source_id: r565-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: fedshuffle-uninterrupted-epoch-completion-or-hybrid-update-rescaling-limitation
  kind: limitation
  statement: Pure step-size scaling in FedShuffle assumes that participating clients complete their predefined number of local epochs E_i; if system timeouts truncate local epochs mid-round, hybrid post-hoc update rescaling via FedShuffleGen (Section 4.3 & Appendix F.1) is required to restore objective consistency.
  evidence:
  - source_id: r565-primary-pdf
    locator: Section 4.3 p. 8 & Appendix F.1 Figure 4 pp. 43-44
    relation: supports
- claim_id: fedshuffle-heterogeneous-cross-device-language-and-vision-training-application
  kind: application
  statement: Applied to heterogeneous cross-device federated training of LSTM character models on Shakespeare and ResNet18 classifiers on CIFAR-100 with imbalanced local datasets and without-replacement epoch shuffling.
  evidence:
  - source_id: r565-primary-pdf
    locator: Section 6.2 Tables 2-3 & Figure 2 pp. 11-12
    relation: supports
