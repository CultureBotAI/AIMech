limitations:
- Non-trivial finite-sample confidence intervals in Proposition 3.2 require either a user-specified upper bound $s$ on the number of active penalized covariates $|S(\beta) \cap S_Q|$ such that $\widehat{\kappa}_{\widehat{g}}(s) > \widehat{r}$ and $\widehat{\kappa}_{\ell_k}(s) > 0$, or an unpenalized set $S_I$ covering the endogenous covariates of interest.
- Root-$n$ asymptotic normality of the bias-corrected estimator BC-STIV (Theorem 4.1) requires both the STIVcone sensitivity and the dual approximate-inverse sensitivity $\kappa_{S(\Lambda)}^{\Psi^\top}$ to stay bounded away from zero while $\widehat{\rho}^{ZX}(s_\beta \vee s_\Lambda) = o(1/\sqrt{n})$.
- 'Primary-source typographical audit of `arXiv:1105.2454v7`: (1) Appendix A.1 line 11 (p. 25, above Assumption A.1) writes ''. for all $n \in \mathbb{N}$, $\mathbb{P}(\mathcal{G}_{A1}) \ge 1 - \alpha_n^{A1}$.'' with a lowercase ''for'' after the period; (2) Appendix A.2 line 23 (p. 28, above Theorem A.1) writes ''$\kappa^\Psi(s)$ is defined similarly from $\widehat{\kappa}^\psi(s)$'' with a lowercase superscript ''$\psi$'' instead of uppercase ''$\Psi$''; (3) Appendix A.3 Case 1 and Case 2 lines (p. 31, lines 17 and 20) write ''$\widehat{\mathbf{D}}_{\mathbf{X}}^{-1}$'' with a hat over ''$\mathbf{D}$'' instead of ''$\mathbf{D}_{\mathbf{X}}^{-1}$''; (4) Appendix A.4 Proof of Theorem 3.2 line 1 (p. 32) contains an unresolved LaTeX cross-reference ''Using lemmas A.2, ??, and O.2 (i)''; (5) Online Appendix Section O.1.4 paragraph 2 line 1 (p. 46) has a double period ''Monte-Carlo for C-STIV..''; and (6) Online Appendix Section O.1.6 line 4 (p. 48) spells ''avoid loosing $|\mathbf{D}_{\mathbf{Z}}\mathbf{Z}^\top|_\infty$'' (''loosing'' instead of ''losing'').'
