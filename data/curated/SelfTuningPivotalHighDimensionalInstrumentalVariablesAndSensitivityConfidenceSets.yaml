claims:
- claim_id: self-tuning-conic-stiv-program-and-nonasymptotic-sensitivity-oracle-bounds
  kind: mechanism
  statement: 'On the event $\mathcal{G} = \{\widehat{t}(\beta) \le \widehat{r}\}$ where $\widehat{t}(b) = |\mathbf{D}_{\mathbf{Z}}\mathbb{E}_n[ZU(b)]|_\infty / \widehat{\sigma}(b)$, the true parameter pair $(\beta, \widehat{\sigma}(\beta))$ is feasible for the STIV conic program (Definition 3.1, Eqs. 6-8), ensuring that $\widehat{\Delta} = \mathbf{D}_{\mathbf{X}}^{-1}(\widehat{\beta} - \beta)$ lies in the empirical cone $\widehat{K}_{S(\beta)} = \{\Delta \in \mathbb{R}^{d_X} : \Delta_{S^c \cap S(\widehat{\beta})^c} = 0,\, |\Delta_{S^c \cap S_Q}|_1 \le |\Delta_{S \cap S_Q}|_1 + c\widehat{g}(\Delta)\}$ where $\widehat{g}(\Delta) = \min(\widehat{r}, 1)|\Delta_{S_I}|_1 + |\Delta_{S_I^c}|_1$ (Eq. 9) and satisfies $|\widehat{\Psi}\widehat{\Delta}|_\infty \le 2\widehat{r}\overline{\sigma} + \widehat{r}(\widehat{\sigma}(\beta) - \widehat{\sigma})$ with $\overline{\sigma} = (\widehat{\sigma} + \widehat{\sigma}(\widehat{\beta})) / 2$ (Proof of Proposition 3.1, Eq. A.14, p. 29). Consequently, for any 1-homogeneous loss $\ell \in \mathcal{L}$ with empirical sensitivity $\widehat{\kappa}_{\ell, S} = \min_{\Delta \in \widehat{K}_S : \ell(\Delta) = 1}|\widehat{\Psi}\Delta|_\infty$ (Eq. 10), Proposition 3.1 (p. 7) establishes the non-asymptotic bound $\ell(\mathbf{D}_{\mathbf{X}}^{-1}(\widehat{\beta} - \beta)) \le \frac{2\widehat{r}}{\widehat{\kappa}_{\ell, S(\beta)}}\min\left(\overline{\sigma}\gamma\left(\frac{\widehat{r}}{\widehat{\kappa}_{\widehat{g}, S(\beta)}}\right),\, \widehat{\sigma}(\beta)\gamma\left(\frac{\widehat{r}}{c\widehat{\kappa}_{\ell_{S(\beta) \cap S_Q}^1, S(\beta)}}\right)\right)$ where $\gamma(x) = 1 / \max(1 - x, 0)$, together with the scale bound $|\frac{\overline{\sigma}}{\widehat{\sigma}(\beta)} - 1| \le \frac{\widehat{r}}{c\widehat{\kappa}_{\ell_{S(\beta) \cap S_Q}^1, S(\beta)}}\gamma\left(\frac{\widehat{r}}{c\widehat{\kappa}_{\ell_{S(\beta) \cap S_Q}^1, S(\beta)}}\right)$.'
  evidence:
  - source_id: gr2021-stiv-pdf
    locator: Section 3, Definition 3.1, pp. 5-7, Equations (6)-(10), Proposition 3.1; Appendix A.3, pp. 29-30, Equation (A.14)
    relation: supports
- claim_id: lp-sensitivity-lower-bounds-identification-robust-confidence-sets-and-thresholded-sign-consistency
  kind: mechanism
  statement: Given only an upper bound $s$ on $|S(\beta) \cap S_Q|$, Table 1 and Proposition 3.2 (pp. 8-9, Eqs. 11-14) construct linear-programming lower bounds $\widehat{\kappa}_{\ell_k}(s) \le \widehat{\kappa}_{\ell_k, S(\beta)}$ and $\widehat{\kappa}_{\widehat{g}}(s) \le \widehat{\kappa}_{\widehat{g}, S(\beta)}$ by maximizing $t \ge 0$ subject to $|\widehat{\Psi}\Delta|_\infty \le 1$ and $|\Delta_j| \le t$ over relaxed cones, yielding componentwise confidence intervals $[\widehat{\underline{C}}_k(s), \widehat{\overline{C}}_k(s)]$ with $\widehat{\underline{C}}_k(s) = \widehat{\beta}_k - \widehat{\omega}_k(s)$, $\widehat{\overline{C}}_k(s) = \widehat{\beta}_k + \widehat{\omega}_k(s)$, and half-width $\widehat{\omega}_k(s) = \mathbb{E}_n[X_k^2]^{-1/2}\frac{2\widehat{r}\overline{\sigma}}{\widehat{\kappa}_{\ell_k}(s)}\gamma\left(\frac{\widehat{r}}{\widehat{\kappa}_{\widehat{g}}(s)}\right)$ (Eq. 13) that remain valid on $\mathcal{G}$ even when other coordinates have zero sensitivity ($\widehat{\kappa}_{\ell_j}(s) = 0$). Moreover, Theorem 3.2 (p. 14, Eq. 27) proves that the hard-thresholded STIV estimator $\widehat{\beta}_k^{\widehat{\omega}} = \widehat{\beta}_k \mathbf{1}\{\mathbb{E}_n[X_k^2]^{1/2}|\widehat{\beta}_k| > \widehat{\omega}_k(s)\}$ achieves exact sign recovery $\operatorname{sign}(\widehat{\beta}^{\widehat{\omega}}) = \operatorname{sign}(\beta)$ whenever $\min_{k \in S(\beta)}\mathbb{E}_n[X_k^2]^{1/2}|\beta_k| > 2\max_{k \in S(\beta)}\widehat{\omega}_k(s)$.
  evidence:
  - source_id: gr2021-stiv-pdf
    locator: Section 3.2, pp. 8-9, Table 1, Equations (11)-(14), Proposition 3.2; Section 3.5, pp. 13-15, Equation (27), Theorem 3.2
    relation: supports
- claim_id: bias-corrected-stiv-asymptotic-normality-and-invalid-instrument-nv-stiv-recovery
  kind: mechanism
  statement: 'For low-dimensional linear functionals $\Phi\beta \in \mathbb{R}^{d_\Phi}$, the bias-corrected estimator (BC-STIV, Section 4, Eqs. 30-32) $\widehat{\Phi\beta} = \Phi\widehat{\beta} + \frac{1}{n}\widehat{\Lambda}\mathbf{Z}^\top \mathbf{U}(\widehat{\beta})$ solves $\min_{L, \nu}\left(|L\mathbf{D}_{\mathbf{Z}}^{-1}|_1 + \frac{\lambda\nu}{\widehat{\rho}^{ZX}}\right)$ subject to $|(\Phi - L\frac{1}{n}\mathbf{Z}^\top\mathbf{X})\mathbf{D}_{\mathbf{X}}|_\infty \le \nu$ and $|L\mathbf{D}_{\mathbf{Z}}^{-1}|_1 \widehat{\rho}^{ZX} \le \lambda\nu$, and Theorem 4.1 (p. 17, Eqs. 33-37) proves $\sqrt{n}\widehat{\mathbf{V}}^{-1/2}(\widehat{\Phi\beta} - \Phi\beta) = \mathbf{N}_n + R_n$ where $\mathbf{N}_n \xrightarrow{d} \mathcal{N}(0, \mathbf{I}_{d_\Phi})$ and $|R_n|_\infty = o_p(1)$. Furthermore, when up to $s_\theta$ instruments violate exogeneity ($\theta = \mathbb{E}[ZU(\beta)] \ne 0$), NV-STIV (Section 5, Eq. 39, Theorem 5.1, p. 19) augments the covariate matrix as $\widetilde{\mathbf{X}} = (\mathbf{X}, \widehat{\mathbf{W}})$ with $\widehat{\mathbf{W}} = \mathbf{Z}(\frac{1}{n}\mathbf{Z}^\top\mathbf{Z})^{-1}$ (or C-STIV in Section O.1.4) to jointly estimate $(\beta^\top, \theta^\top)^\top$ and select valid instruments via $\{l \in \{1, \dots, d_Z\} : \widehat{\theta}_l^{\widehat{\omega}} = 0\}$.'
  evidence:
  - source_id: gr2021-stiv-pdf
    locator: Section 4, pp. 16-18, Equations (30)-(37), Theorem 4.1; Section 5, pp. 18-19, Equations (38)-(43), Theorem 5.1; Online Appendix O.1.4, pp. 45-46
    relation: supports
