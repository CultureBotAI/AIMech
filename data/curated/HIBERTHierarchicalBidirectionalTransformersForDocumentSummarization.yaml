id: AIMech:HIBERTHierarchicalBidirectionalTransformersForDocumentSummarization
name: HIBERT (Hierarchical Bidirectional Transformers for Document Summarization)
concept_kind: architecture
review_status: DRAFT
definition: A hierarchical bidirectional Transformer document encoding and pre-training framework (Zhang, Wei, & Zhou, ACL 2019) that stacks a word-level sentence Transformer encoder producing sentence vectors from per-sentence end-of-sentence positions and a document-level Transformer encoder computing context-sensitive sentence representations across an entire document, pre-trained on unlabeled documents via a sentence-level masking and autoregressively decoded masked-sentence prediction objective before fine-tuning for extractive document summarization.
identity_notes: Distinct from flat BERT/RoBERTa encoders (which concatenate tokens into a single sequence and pre-train with token-level MLM and next-sentence prediction) and from SMITH (AIMech:SMITHSiameseMultiDepthTransformerBasedHierarchicalEncoder, which replaces autoregressive masked-sentence decoding with masked sentence-block projection classification in a Siamese dual-encoder retrieval architecture). HIBERT pre-trains a two-level hierarchical Transformer encoder by masking 15% of sentences (80% all-[MASK] tokens, 10% unchanged, 10% random sentence replacement) and predicting each masked sentence word-by-word via an auxiliary Transformer decoder that injects the context-sensitive sentence representation d_tilde_k into the two-layer feed-forward network after multi-head self-attention.
aliases:
- HIBERT
- Hierarchical Bidirectional Transformers for Document Summarization
- HIBERT Document-Level Pre-trained Hierarchical Transformer
