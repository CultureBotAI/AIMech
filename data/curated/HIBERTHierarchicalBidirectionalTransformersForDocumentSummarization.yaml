claims:
- claim_id: hibert-hierarchical-sentence-and-document-encoders
  kind: mechanism
  statement: HIBERT encodes a document D = (S_1, S_2, ..., S_|D|) with a sentence Transformer encoder E_S that maps each sentence S_k = (w_1^k, ..., w_|S_k|^k) (terminated by an end-of-sentence token) to hidden vectors (h_1^k, ..., h_|S_k|^k) and selects the final hidden state s_k = h_|S_k|^k as the sentence representation, followed by a document Transformer encoder E_D that adds sentence positional embeddings p_k to form d_k = s_k + p_k and applies multi-layer bidirectional self-attention across (d_1, ..., d_|D|) to obtain context-sensitive sentence representations (d_tilde_1, ..., d_tilde_|D|).
  evidence:
  - source_id: r791-primary-pdf
    locator: Section 2.2 (Hierarchical Transformer Encoders), pp. 2-3, Figure 1
    relation: supports
  - source_id: r791-primary-pdf
    locator: hibert_decoder_step verification
    relation: supports
- claim_id: hibert-sentence-masking-and-context-injected-decoder
  kind: mechanism
  statement: To pre-train HIBERT on unlabeled documents, 15% of sentences in D are selected at random (80% masked by replacing every word with [MASK], 10% kept unchanged, and 10% replaced with a random sentence from another document), and an auxiliary Transformer decoder predicts each selected sentence S_k word-by-word by injecting its context-sensitive sentence vector d_tilde_k into the intermediate representation h_tilde_j^k after masked multi-head attention via x_tilde_j^k = h_tilde_j^k + d_tilde_k and g_tilde_j^k = W_2^ff max(0, W_1^ff x_tilde_j^k + b_1) + b_2 (Equations 4-6).
  evidence:
  - source_id: r791-primary-pdf
    locator: Section 3.2 (Sentence Masking) & Section 3.3 (Sentence Prediction), pp. 3-4, Figure 2, Equations (4)-(8)
    relation: supports
  - source_id: r791-primary-pdf
    locator: mask_document_sentences and hibert_decoder_step verification
    relation: supports
- claim_id: hibert-extractive-summarization-empirical-gains
  kind: application
  statement: When fine-tuned as a hierarchical extractive summarizer predicting binary sentence labels Y = (y_1, ..., y_|D|), HIBERT_M (12+12 layers) achieves 42.37 ROUGE-1, 19.95 ROUGE-2, and 38.83 ROUGE-L on CNN/DailyMail (+1.25 ROUGE-1 and +1.25 ROUGE-2 over the non-pre-trained HIER-BERT baseline) and 49.47 ROUGE-1, 26.17 ROUGE-2, and 46.69 ROUGE-L on New York Times50.
  evidence:
  - source_id: r791-primary-pdf
    locator: Section 4.3 (Results), pp. 5-7, Tables 1-2
    relation: supports
- claim_id: hibert-autoregressive-sentence-decoding-pretraining-cost
  kind: limitation
  statement: Pre-training HIBERT requires an auxiliary autoregressive Transformer decoder that predicts every masked sentence token-by-token, incurring higher pre-training compute and memory overhead than non-autoregressive masked sentence-block projection objectives and requiring sentences to be truncated to 50 words and documents to 30 sentences during training.
  evidence:
  - source_id: r791-primary-pdf
    locator: Section 3.3 (Sentence Prediction) & Section 4.2 (Implementation), pp. 3-5
    relation: supports
