claims:
- claim_id: method
  kind: mechanism
  statement: For a joint distribution p(x,y) and normalized conditional decoder q(x|y), define L_BA=H(X)+E_p(x,y)[log
    q(X|Y)], using differential entropy for continuous variables when the required quantities are finite.
    The identity I(X;Y)−L_BA=E_p(y)[KL(p(X|Y)||q(X|Y))] gives L_BA<=I(X;Y). Equality holds when the decoder
    matches the true conditional almost everywhere. For representation learning with fixed p(x), an encoder
    p_theta(y|x) and decoder q_phi(x|y) can be trained to increase the expected decoder log probability;
    H(X) is constant with respect to their parameters. Dropping that constant for optimization does not
    supply a numerical information estimate when the entropy is unknown.
