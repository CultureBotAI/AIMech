aio_no_match:
  search_scope: All 442 pinned AIO CLASS labels and scoped synonyms and 208 preceding native IDs/names/aliases
    were compared. Full fixed-string word-delimited searches of both checkouts included hidden and ignored
    files. Exact definitions, synonyms and outgoing relations for FeatureExtraction, VariationalAutoEncoder,
    AutoEncoderNetwork, RepresentationLearning, DeepNeuralNetwork, BayesianNetwork and SelfsupervisedLearning
    were inspected. This assessment is bounded to AIO commit 397851c547d1c4d8f06ef184f63c1d40bc86937a
    and this semantic neighborhood.
  rationale: The inspected candidates describe networks, feature-extraction tasks or self-supervised tasks,
    not the mathematical information bound. Shared variational terminology, an optional neural parameterization
    or downstream use does not establish a suitable mapping.
  examined_targets:
  - target: AIO:VariationalAutoEncoder
    rejection_reason: A probabilistic latent autoencoder architecture is not a variational information
      inequality; neither implies the other.
  - target: AIO:AutoEncoderNetwork
    rejection_reason: Reconstruction networks can use information objectives but do not identify this
      mathematical bound.
  - target: AIO:RepresentationLearning
    rejection_reason: The target is a deep-network representation-learning class; it is a possible use
      of a bound, not the bound itself.
  - target: AIO:DeepNeuralNetwork
    rejection_reason: A neural critic or decoder is one possible parameterization, not the information
      formula.
  - target: AIO:FeatureExtraction
    rejection_reason: This preprocessing task does not specify an information estimator or bound.
  - target: AIO:BayesianNetwork
    rejection_reason: Conditional distributions do not make this bound a directed graphical-model architecture.
  - target: AIO:SelfsupervisedLearning
    rejection_reason: A self-generated prediction task does not specify this population information inequality.
