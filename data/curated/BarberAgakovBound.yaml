name: Barber–Agakov mutual information bound
definition: A variational lower bound on mutual information formed by adding input entropy to the expected
  log probability assigned by a normalized conditional decoder to the input given the output.
concept_kind: mathematical_method
identity_notes: 'The Barber–Agakov bound is the mathematical objective, distinct from Barber and Agakov’s
  alternating IM optimization procedure. It requires a normalized decoder; TUBA and NWJ provide different
  parameterizations using unnormalized critics. Reconstruction terminology alone does not identify a VAE,
  a particular autoencoder architecture or the complete IM algorithm. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 208 preceding native IDs/names/aliases. Word-delimited
  fixed-string searches of both full checkouts, including ignored and hidden files, returned 57 lines
  each: existing MINE-f component discussion, shared primary-source references, and discovery/review context.
  Four native neighbors and seven exact AIO nodes with scoped synonyms and outgoing relations were inspected.'
limitations:
- The decoder must be normalized and assign compatible support. An arbitrary real score substituted for
  log q is not this bound; zeros or divergent entropies require extended-value care.
- Increasing a loose lower bound does not by itself prove that true mutual information increased. Decoder
  expressiveness and optimization quality determine the gap.
- A sample average is an estimate of the expected objective and is not a certified lower bound for every
  realized sample. Unknown H(X) prevents reporting its numerical value without additional information.
- Only declared theoretical passages and example context were inspected; no decoder implementation, training
  or benchmark was reproduced.
