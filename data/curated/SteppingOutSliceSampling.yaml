name: Stepping-out slice sampling
definition: A univariate slice-sampling algorithm that randomly places a width-w interval around the current
  point, expands it in width-w steps under a randomly divided budget, and samples by slice-aware interval
  shrinkage.
concept_kind: algorithm
identity_notes: This record specifies Neal’s stepping-out procedure paired with shrinkage, Figures 3 and
  5. The interval-search component alone is not a complete sampler. It differs from doubling in expansion
  increments and in not requiring doubling’s retrospective acceptability test. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases.
  Ignored-inclusive full-checkout searches found prior discovery leads for Gibbs and slice sampling plus
  unrelated environment substring hits, not existing concept records. Existing HMM/MRF models and general
  Metropolis–Hastings were inspected to distinguish model, general transition and specialized algorithm
  scope.
limitations:
- The finite expansion cap limits the interval length to at most mw. It is not a certificate that all
  of the slice has been found.
- The width and expansion budget affect computational work and exploration; this method does not remove
  all tuning choices.
- Shrinking the rejected side relative to the current state is essential. Arbitrary interval placement
  or budget allocation is not the proven kernel.
- Unimodal shortcuts and tuning width from past draws in Section 4.4 require the source’s additional conditions,
  including unlimited expansion for that history-based width argument; they are not generalized here.
- Multimodality, constrained supports, numerical density evaluation and finite precision require care.
  No universal mixing guarantee is asserted.
