claims:
- claim_id: method
  kind: mechanism
  statement: 'Draw height y uniformly below f(x0). For w>0 and integer m≥1, set L=x0−wU and R=L+w with
    U uniform on (0,1); independently choose J uniformly from {0,...,m−1} and K=m−1−J. Extend L left by
    w while J remains positive and f(L)>y, decrementing J; similarly extend R right using K. From this
    interval repeatedly propose x1 uniformly: accept if f(x1)>y; otherwise replace the left endpoint by
    x1 when x1<x0, or the right endpoint otherwise. Shrinkage retains x0. The random placement and random
    left/right budget split are part of the invariance construction; the resulting interval need not cover
    every slice component.'
  evidence:
  - source_id: method-source
    locator: Sections 4.1–4.3, Figures 3 and 5, budget construction and correctness proof, PDF/printed
      pp. 8–16
