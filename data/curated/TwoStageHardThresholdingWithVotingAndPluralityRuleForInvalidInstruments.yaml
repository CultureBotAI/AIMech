claims:
- claim_id: plurality-rule-identification-and-stage-1-first-stage-hard-thresholding
  kind: mechanism
  statement: 'Under the reduced-form equations $\boldsymbol{\Gamma}^* = \beta^*\boldsymbol{\gamma}^* + \boldsymbol{\pi}^*$ with relevant instrument set $\mathcal{S}^* = \{j : \gamma_j^* \ne 0\}$ and valid subset $\mathcal{V}^* = \{j \in \mathcal{S}^* : \pi_j^* = 0\}$ (Section 2.2, p. 8, Equation 6), Assumption 1 (Equation 7) establishes that $(\beta^*, \boldsymbol{\pi}^*)$ is uniquely identified whenever $|\mathcal{V}^*| > \max_{c \ne 0}|\{j \in \mathcal{S}^* : \pi_j^* / \gamma_j^* = c\}|$ (the plurality rule), strictly relaxing the 50% majority rule $|\mathcal{V}^*| > |\mathcal{S}^*| / 2$ whenever invalid instruments do not all share the same ratio bias $\pi_j^* / \gamma_j^* = c$. Stage 1 (Section 3.1, p. 10, Equation 9) estimates $\mathcal{S}^*$ by hard thresholding $\widehat{\mathcal{S}} = \{1 \le j \le p_z : |\widehat{\gamma}_j| \ge \widehat{\sigma}_2\sqrt{\|\widehat{\boldsymbol{\Omega}}_{j\cdot}\|_2^2 / n}\,\sqrt{2.01\log p_z}\}$, screening out zero and near-zero first-stage instruments whose division $\widehat{\Gamma}_j / \widehat{\gamma}_j$ would otherwise destabilize Stage 2.'
  evidence:
  - source_id: gkcs2018-tsht-pdf
    locator: Section 2.2, pp. 8-9, Equations (6)-(8), Assumption 1; Section 3.1, pp. 9-10, Equation (9)
    relation: supports
- claim_id: pairwise-symmetric-voting-matrix-and-plurality-support-recovery
  kind: mechanism
  statement: "For each candidate $j \\in \\widehat{\\mathcal{S}}$, Stage 2 (Section 3.2, pp. 10\u201311, Equations 10\u201312) forms the trial causal estimator $\\widetilde{\\beta}^{[j]} = \\widehat{\\Gamma}_j / \\widehat{\\gamma}_j$, the invalidity residual $\\widetilde{\\pi}_k^{[j]} = \\widehat{\\Gamma}_k - \\widetilde{\\beta}^{[j]}\\widehat{\\gamma}_k$ with variance scaling $\\widehat{R}_k^{[j]} = \\widehat{\\sigma}_1^2 + (\\widetilde{\\beta}^{[j]})^2\\widehat{\\sigma}_2^2 - 2\\widetilde{\\beta}^{[j]}\\widehat{\\sigma}_{12}$ and standard error $\\widehat{\\mathrm{SE}}(\\widetilde{\\pi}_k^{[j]}) = \\sqrt{\\widehat{R}_k^{[j]}\\|(\\widehat{\\boldsymbol{\\Omega}}_{k\\cdot} - (\\widehat{\\gamma}_k / \\widehat{\\gamma}_j)\\widehat{\\boldsymbol{\\Omega}}_{j\\cdot})^T\\mathbf{W}\\mathbf{P}_{\\mathbf{X}}^\\perp\\|_2^2 / n}$ (Equation 11), and defines the symmetric voting indicator $\\widehat{V}_{k,j} = \\mathbf{1}\\left(|\\widetilde{\\pi}_k^{[j]}| \\le \\widehat{\\mathrm{SE}}(\\widetilde{\\pi}_k^{[j]})\\sqrt{2.01\\log|\\widehat{\\mathcal{S}}|}\\text{ and }|\\widetilde{\\pi}_j^{[k]}| \\le \\widehat{\\mathrm{SE}}(\\widetilde{\\pi}_j^{[k]})\\sqrt{2.01\\log|\\widehat{\\mathcal{S}}|}\\right)$ (Equation 14) so candidates $k$ and $j$ mutually vote for each other if and only if they yield statistically indistinguishable ratio estimates. Under Assumptions 2\u20135 (in low dimensions) or Assumptions 4\u20136 (in high dimensions $p \\gg n$ via Debiased Scaled Lasso, Section 3.7, Equations 22\u201326), Theorem 1 (p. 20) and Theorem 3 (p. 22) prove that the plurality winner $\\widehat{\\mathcal{V}} = \\arg\\max_{\\mathcal{V}_m}\\|\\widehat{\\mathbf{V}}_{\\cdot m}\\|_0$ (Equation 16) satisfies $\\mathcal{V}^*^{\\mathrm{str}} \\subseteq \\widehat{\\mathcal{V}} \\subseteq \\mathcal{V}^*$ with probability at least $1 - C p^{-c}$, and $\\widehat{\\mathcal{V}} = \\mathcal{V}^*$ whenever all valid instruments are strong."
  evidence:
  - source_id: gkcs2018-tsht-pdf
    locator: Section 3.2-3.3, pp. 10-13, Equations (10)-(16); Section 3.7, pp. 16-19, Equations (22)-(28); Section 4.1-4.3, pp. 19-23, Theorems 1 & 3; Appendix B-C, pp. 33-53
    relation: supports
- claim_id: root-n-asymptotic-normality-and-impossibility-of-inference-without-separation
  kind: scope
  statement: "Given $\\widehat{\\mathcal{V}}$ from Stage 2, the one-step GMM estimator $\\widehat{\\beta} = \\frac{\\widehat{\\boldsymbol{\\gamma}}_{\\widehat{\\mathcal{V}}}^T\\widehat{\\mathbf{A}}\\widehat{\\boldsymbol{\\Gamma}}_{\\widehat{\\mathcal{V}}}}{\\widehat{\\boldsymbol{\\gamma}}_{\\widehat{\\mathcal{V}}}^T\\widehat{\\mathbf{A}}\\widehat{\\boldsymbol{\\gamma}}_{\\widehat{\\mathcal{V}}}}$ with optimal weight matrix $\\widehat{\\mathbf{A}} = (\\widehat{\\sigma}_1^2\\widehat{\\boldsymbol{\\Omega}}_{\\widehat{\\mathcal{V}}})^{-1}$ (or $\\mathbf{I}_{|\\widehat{\\mathcal{V}}|}$ in high dimensions, Equations 17 and 27) and confidence interval $\\mathrm{CI}_{\\alpha} = [\\widehat{\\beta} - z_{1-\\alpha/2}\\sqrt{\\widehat{V}_{\\beta}/n},\\, \\widehat{\\beta} + z_{1-\\alpha/2}\\sqrt{\\widehat{V}_{\\beta}/n}]$ (Equations 18\u201319) satisfy $\\sqrt{n}(\\widehat{\\beta} - \\beta^*) / \\sqrt{\\widehat{V}_{\\beta}} \\xrightarrow{d} N(0, 1)$ and $\\lim_{n\\to\\infty}\\mathbb{P}(\\beta^* \\in \\mathrm{CI}_{\\alpha}) = 1 - \\alpha$ (Theorem 2, p. 21; Theorem 3, p. 22), achieving the oracle asymptotic variance $V_{\\beta}^* = \\sigma_1^2 / (\\boldsymbol{\\gamma}_{\\mathcal{V}^*}^{\\mathrm{str}}^T\\boldsymbol{\\Omega}_{\\mathcal{V}^*,\\mathrm{str}}^{-1}\\boldsymbol{\\gamma}_{\\mathcal{V}^*}^{\\mathrm{str}})$. Conversely, Proposition 1 (Section 4.4, p. 23, Equations 30\u201331) proves that if invalid instruments violate the separation condition by having local invalidity $|\\pi_j^* / \\gamma_j^*| \\le \\widetilde{\\tau}_j = \\sqrt{\\frac{\\sigma_1^2 + (\\beta^* + \\pi_j^*/\\gamma_j^*)^2\\sigma_2^2 - 2(\\beta^* + \\pi_j^*/\\gamma_j^*)\\sigma_{12}}{n}\\,(\\Omega_{jj} + (\\gamma_j^*/\\gamma_1^*)^2\\Omega_{11} - 2(\\gamma_j^*/\\gamma_1^*)\\Omega_{1j})}$, then the true parameter $(\\beta^*, \\boldsymbol{\\pi}^*)$ is statistically indistinguishable in total variation distance from an alternative valid-instrument model with shifted causal effect $\\beta^* + \\pi_j^*/\\gamma_j^*$ when $|\\mathcal{V}^*| < p_z / 2$."
