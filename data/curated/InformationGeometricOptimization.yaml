id: AIMech:InformationGeometricOptimization
name: Information-geometric optimization
concept_kind: algorithm
definition: A stochastic black-box optimization framework that adapts a parametrized sampling distribution
  using objective ranks and Fisher natural gradients, defining a continuous flow with reference-frozen
  quantile utilities and finite algorithms that approximate that flow by ranked sampling and Euler updates.
definition_evidence:
- source_id: ollivier2017
  locator: Section 2.2, Definitions 3–5 and flow/algorithm distinction, PDF/printed pp. 9–13.
  relation: supports
claims:
- claim_id: distribution-relative-rank-utility
  kind: mechanism
  statement: For minimization of a black-box objective f over a search space X, choose a parametrized
    family of sampling distributions P_theta and a non-increasing selection function w on [0,1]. Define
    the lower and upper probability levels of x using, respectively, objective values strictly below and
    at or below f(x) under P_theta. When the two levels coincide, the utility W_theta(x) is w at that
    level. For a positive-probability tie, it is the average of w over the whole interval between the
    two levels. Averaging w over this interval is generally different from evaluating w at its midpoint.
    This distribution-relative rank utility replaces raw objective magnitudes as the preference signal.
  evidence:
  - source_id: ollivier2017
    locator: Section 2.2.1, Definition 3 and Equations 4–6, PDF/printed pp. 9–10.
    relation: supports
- claim_id: reference-frozen-natural-gradient-flow
  kind: mechanism
  statement: At a current parameter theta_t, freeze the reference utility W_theta_t while differentiating
    its expectation under a variable P_theta. The IGO flow follows natural-gradient ascent of that expectation,
    evaluated at theta_t. With a differentiable sampling family and a usable nonsingular Fisher information
    matrix I, its velocity is I(theta_t)^(-1) times the expectation under P_theta_t of W_theta_t(x) times
    the score gradient of log P_theta(x), evaluated at theta_t. Differentiation acts on the distribution
    parameters, not on the black-box objective. Differentiating the utility and its averaging distribution
    together would instead differentiate the constant integral of w and lose the intended preference update.
  evidence:
  - source_id: ollivier2017
    locator: Section 2.1.2, PDF/printed p. 7; Section 2.2.2, Definition 4 and Equations 7–13, pp. 10–11;
      fixed-reference explanation below Equation 7.
    relation: supports
- claim_id: sampled-euler-update-and-ties
  kind: mechanism
  statement: The finite IGO algorithm draws N independent samples from the current distribution, evaluates
    f and ranks samples from best to worst for minimization. Without ties, a sample with zero-based rank
    r receives weight (1/N) w((r + 1/2)/N). Tied samples receive the average of these weights over their
    possible rank positions. The parameter update adds delta_t times the sum of each weight multiplied
    by its natural score gradient at the current parameter. The factor 1/N is already in each weight.
    This is a sampled Euler approximation, requiring a chosen distribution family, weighting scheme, coordinate
    parametrization, sample size and step size; it is not an exact finite-time solution of the flow.
  evidence:
  - source_id: ollivier2017
    locator: Section 2.2.3, Definition 5 and Equations 14, 16–18, PDF/printed pp. 11–13; tie convention
      after Equation 14. Footnote 2, Equation 15, gives a separate integral-weight alternative.
    relation: supports
- claim_id: qualified-invariance-properties
  kind: mechanism
  statement: Strictly increasing transformations of objective values preserve the population probability
    levels, sampled rankings and ties, so they preserve the IGO flow and the finite rule with corresponding
    samples. A smooth invertible reparametrization preserves the continuous trajectory in distribution
    space. Finite additive updates generally agree only to first order in delta_t, with local differences
    of order delta_t squared under the stated regularity assumptions; affine parameter changes preserve
    the finite rule exactly. A one-to-one search-space transformation also requires preservation of the
    distribution family, a locally diffeomorphic induced parameter correspondence and transformed initialization.
    Its finite-update equivariance has the same second-order qualification unless the induced parameter
    map is affine.
  evidence:
  - source_id: ollivier2017
    locator: Section 2.2.4, PDF/printed p. 13; Appendix C.1, Propositions 17–19 and their finite-step
      qualifications, pp. 43–44.
    relation: supports
- claim_id: population-limit-and-quantile-improvement
  kind: scope
  statement: At a fixed parameter, independent sampling, square-integrable score components and a bounded
    non-increasing selection function support almost-sure convergence of the rank-weighted empirical update
    to the exact-population Euler update as N tends to infinity, with the stated tie averaging. This limit
    alone does not remove the time-discretization error. For the ideal continuous IGO flow with truncation
    weights w(u)=1 when u<=q and 0 otherwise, where 0<q<1, the source establishes non-increase of the
    q-quantile of f under its regularity assumptions. Strict improvement additionally requires no objective
    plateaus and a nonstationary trajectory. These are not finite-population monotonicity, finite-budget
    accuracy or global-optimum guarantees.
  evidence:
  - source_id: ollivier2017
    locator: Section 3.1, Theorem 6, PDF/printed p. 14; Appendix D.2, Proposition 27 and proof, pp. 52–54,
      with its monotonicity-wording inconsistency retained below; Section 3.2, Proposition 7, p. 15, and
      Appendix D.3, pp. 54–55.
    relation: supports
- claim_id: scoped-algorithm-correspondences
  kind: scope
  statement: The framework overlaps rank-shaped natural evolution strategies; it does not equate the rank
    utility with raw expected fitness. For Gaussian distributions in mean/covariance coordinates, the
    IGO update matches the displayed rank-mu CMA update when mean and covariance learning rates are equal
    and evolution-path and step-size-control effects are disabled. For product Bernoulli distributions
    in probability coordinates, a weight of one on the best sample and zero on the others recovers the
    stated PBIL attraction update without probability mutation. The separate IGO-ML construction maximizes
    a weighted likelihood objective; for an exponential family in expectation coordinates and sample weights
    summing to one, it coincides with the corresponding IGO and smoothed cross-entropy updates when their
    required maximizers exist. These special cases do not make the whole framework an exact alias of full
    CMA-ES, mutated PBIL, generic NES or cross-entropy updates in arbitrary coordinates.
  evidence:
  - source_id: ollivier2017
    locator: NES discussion following Definition 4, PDF/printed p. 11; Section 4, Definition 11, Equations
      30–34 and Theorem 12, pp. 20–22; Section 5.1, Proposition 14 and best-sample/no-mutation case, pp.
      23–24; Section 5.2.1, Proposition 15 and footnote 5, p. 25.
    relation: supports
