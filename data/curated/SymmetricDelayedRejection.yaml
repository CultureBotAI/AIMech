name: Symmetric delayed rejection
definition: The delayed-rejection specialization using the same symmetric proposal kernel at every stage,
  centered through the last rejected candidate, with acceptance determined by the largest previous rejected
  target density.
concept_kind: algorithm
identity_notes: This record is the fixed-kernel specialization in Mira Section 3. The next proposal depends
  on the last rejected point rather than being recentered on the unchanged chain state. Stage-dependent
  variances and generic symmetric proposals do not automatically satisfy the cancellations used by this
  simplified rule. No normalized match was found across all 442 pinned AIO labels/scoped synonyms and
  175 prior native IDs/names/aliases. Full-checkout searches included ignored and hidden files in both
  worktrees; the only text hit was an unrelated installed-package checksum substring. Existing general
  Metropolis-Hastings, Metropolis-within-Gibbs and random-walk records were inspected to resolve these
  specialization boundaries.
limitations:
- Figure 1 prints pi(x)/pi(y1) for its first-stage nontrivial acceptance region, reversing the correct
  pi(y1)/pi(x) in the preceding text. This record uses the text and general Metropolis formula; the figure
  discrepancy was visually inspected.
- The later suggestion to decrease variance by stage is not treated as permission to use this simplified
  acceptance with arbitrary changing q. Such proposals need the general delayed-rejection correction.
- A candidate whose target density is no larger than the maximum target density among previous rejected
  candidates is rejected. No finite-time eventual-acceptance or universal efficiency guarantee is asserted.
- Detailed balance is not a substitute for support, irreducibility and numerical-stability checks.
