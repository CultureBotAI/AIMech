claims:
- claim_id: method
  kind: mechanism
  statement: Let q(a,b)=q(b,a) be the same kernel at every stage. Starting from x, propose y1 from q(x,·)
    and accept with min(1,pi(y1)/pi(x)). After i−1 rejections, propose yi from q(y(i−1),·), set M=max_{j<i}
    pi(yj), and accept with min(1,max(0,(pi(yi)−M)/(pi(x)−M))). On a reachable rejection path, M<pi(x).
    If a chosen finite stage limit is exhausted, retain x. Accepted candidates end the transition; rejected
    candidates do not become chain states. The formula follows cancellation of the forward and reverse
    path terms under the fixed symmetric-kernel assumption.
