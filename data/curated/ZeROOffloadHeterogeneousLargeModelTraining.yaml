id: AIMech:ZeROOffloadHeterogeneousLargeModelTraining
name: ZeRO-Offload
concept_kind: algorithm
review_status: DRAFT
definition: 'A heterogeneous GPU-CPU deep learning training algorithm for mixed-precision Adam optimization that partitions the directed cyclic training data-flow graph into two device super-nodes: it retains FP16 parameters (p_16, 2M bytes) and O(M B) forward-backward propagation (FWD-BWD Super Node) on GPU while offloading FP16 gradients (g_16, 2M bytes), FP32 master parameters, momentum, and variance (p_32, m_32, v_32, 12M bytes), and O(M) parameter update and float2half casting computations (Update Super Node) to CPU, combining with ZeRO Stage-2 across multiple GPUs so each rank offloads and updates only a 1 / N_dp partition on CPU.'
identity_notes: Distinct from GPU-only model-state sharding (ZeRO-1/2/3, which require aggregate GPU memory to hold all model states), from layer-to-layer weight swapping (L2L, which keeps optimizer compute on GPU, incurs 28M CPU-GPU communication per step, and cannot scale across multiple GPUs), and from ZeRO-Infinity (which builds on ZeRO-3 to partition parameters and offload to NVMe plus CPU with memory-centric tiling).
aliases:
- Zero Redundancy Optimizer Offload
- ZeRO-Offload Heterogeneous GPU-CPU Training
- DeepSpeed ZeRO-Offload
