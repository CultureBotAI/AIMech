id: AIMech:PFedLaAndHeurPFedLaLayerWisedHypernetworkModelAggregationForPersonalizedFederatedLearning
name: pFedLA and HeurpFedLA (Layer-Wised Hypernetwork Model Aggregation for Personalized Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A layer-wise personalized federated learning framework (Ma, Zhang, Guo, & Xu 2022, Section 3, Equations 1-12, Algorithms 1-2) that deploys a dedicated server-side hypernetwork HN_i(v_i; psi_i) with trainable client embedding vector v_i and hypernetwork weights psi_i for each client i in {1, ..., N} to generate an N x n column-stochastic layer-wise aggregation weight matrix alpha_i = [alpha_i^{l1}, alpha_i^{l2}, ..., alpha_i^{ln}] satisfying sum_{j=1}^N alpha_i^{ln, j} = 1 (Equations 3-4), synthesizes client i's personalized model by layer-wise weighted combination theta_bar_i^{ln} = sum_{j=1}^N theta_j^{ln} alpha_i^{ln, j} across all clients' intermediate layers {theta_j^{ln}} (Equations 5-6), updates v_i and psi_i at the server using the chain-rule surrogate gradients Delta v_i = (nabla_{v_i} theta_bar_i)^T Delta theta_i and Delta psi_i = (nabla_{psi_i} theta_bar_i)^T Delta theta_i driven by client i's local parameter displacement Delta theta_i = theta_i - theta_bar_i^{(t+1)} (Equations 8-11, Algorithm 1), and optionally retains the top-k highest self-weighted layers theta_bar_i^{retain} = AT_k{theta_bar_i^{l1}, ..., theta_bar_i^{ln} | alpha_i^{l1, i}, ..., alpha_i^{ln, i}} purely locally without server aggregation or transmission in its communication-efficient variant HeurpFedLA (Equation 12, Algorithm 2).
identity_notes: Distinct from pFedHN (AIMech:PFedHnPersonalizedFederatedHypernetworks, Shamsian et al. 2021), where a single hypernetwork directly generates the target neural network's raw weight tensors theta_i = HN(v_i; psi) rather than generating an N x n cross-client layer-wise convex combination matrix alpha_i = HN_i(v_i; psi_i) to aggregate clients' locally trained layer parameters {theta_j^{ln}}; and distinct from FedFomo (AIMech:FedFomoFirstOrderModelOptimizationForPersonalizedFederatedLearning, Zhang et al. 2021) and FedAMP (AIMech:FedAmpFederatedAttentiveMessagePassingForPersonalizedCrossSiloFederatedLearning, Huang et al. 2021), which compute whole-model scalar aggregation weights using parameter/loss distances rather than hypernetwork-parameterized layer-granular aggregation matrices.
aliases:
- pFedLA
- HeurpFedLA
- Layer-wised Personalized Federated Learning
