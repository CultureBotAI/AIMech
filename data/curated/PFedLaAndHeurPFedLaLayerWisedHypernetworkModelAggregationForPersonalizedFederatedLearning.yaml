claims:
- claim_id: r485-hypernetwork-parameterized-layer-wise-aggregation-mechanism
  kind: mechanism
  statement: For each client i, server hypernetwork HN_i(v_i; psi_i) maps client embedding v_i to layer-specific cross-client aggregation weights alpha_i^{ln, j} (sum_{j=1}^N alpha_i^{ln, j} = 1) so that each layer ln of client i's personalized model is aggregated as theta_bar_i^{ln} = sum_{j=1}^N theta_j^{ln} alpha_i^{ln, j} (Equations 3-6), and updates v_i and psi_i via chain-rule inner products with the uploaded local update Delta theta_i (Equations 10-11, Algorithm 1) (Ma et al. 2022, Section 3.2, pp. 4-5).
  evidence:
  - source_id: r485-primary-pdf
    locator: Section 3.2 (Equations 3-11, Algorithm 1), pp. 4-5
    relation: supports
- claim_id: r485-heurpfedla-topk-self-weight-layer-retention-mechanism
  kind: mechanism
  statement: HeurpFedLA sorts client i's self-aggregation weights {alpha_i^{l1, i}, ..., alpha_i^{ln, i}} in descending order and selects the top-k layers theta_bar_i^{retain} = AT_k{theta_bar_i^{l1}, ..., theta_bar_i^{ln} | alpha_i^{l1, i}, ..., alpha_i^{ln, i}} (Equation 12) to remain strictly local on client i without server aggregation or server-to-client download, reducing communication cost while preserving personalized layers (Ma et al. 2022, Section 3.3, Algorithm 2, Figure 4, Table 3, pp. 5 & 8).
  evidence:
  - source_id: r485-primary-pdf
    locator: Section 3.3 (Equation 12, Algorithm 2, Figure 4), p. 5, and Section 4.4-4.5 (Table 3), p. 8
    relation: supports
- claim_id: r485-non-iid-image-classification-personalization-application
  kind: application
  statement: Applied to personalized federated image classification across 10-client and 100-client non-IID partitions on EMNIST, FashionMNIST, CIFAR-10, and CIFAR-100 benchmarks (Ma et al. 2022, Section 4, Tables 1-3, Figures 5-7).
  evidence:
  - source_id: r485-primary-pdf
    locator: Section 4.1-4.5 (Tables 1-3, Figures 5-7), pp. 6-8
    relation: supports
- claim_id: r485-per-client-server-hypernetwork-and-model-storage-limitation
  kind: limitation
  statement: Requires the server to store and maintain N separate intermediate client models {theta_1, ..., theta_N} and N dedicated hypernetworks {HN_1(v_1; psi_1), ..., HN_N(v_N; psi_N)}, and assumes identical neural layer architectures across all participating clients (Ma et al. 2022, Section 3.2 & Section 4.1, pp. 3-4 & 7).
  evidence:
  - source_id: r485-primary-pdf
    locator: Section 3.2 (Algorithm 1), pp. 3-4, and Section 4.1 (Training Details), p. 7
    relation: supports
