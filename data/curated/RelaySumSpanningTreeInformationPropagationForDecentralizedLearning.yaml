claims:
- claim_id: relaysum-tree-message-merging-and-counter-normalization-mechanism
  kind: mechanism
  statement: On any tree network G = (V, E), each node i in V computes its local half-step model x_i^(t+1/2) = x_i^(t) - gamma * grad f_i(x_i^(t)) and transmits to each neighbor j in N_i the merged relay sum m_{i->j}^(t) = x_i^(t+1/2) + sum_{k in N_i \ {j}} m_{k->i}^(t-1) together with the counter c_{i->j}^(t) = 1 + sum_{k in N_i \ {j}} c_{k->i}^(t-1), updating x_i^(t+1) = (x_i^(t+1/2) + sum_{j in N_i} m_{j->i}^(t)) / (1 + sum_{j in N_i} c_{j->i}^(t)) so that for all t >= tau_max every worker receives an exact 1/n uniform average of all n workers' models delayed by shortest-path hop distance tau_{ij}.
  evidence:
  - source_id: r549-primary-pdf
    locator: Section 3 Method & Algorithm 1 RelaySGD, pp. 4-5
    relation: supports
- claim_id: relaysum-data-heterogeneity-independence-convergence-scope
  kind: scope
  statement: Under L-smoothness and bounded stochastic gradient variance sigma_bar^2, RelaySGD converges on convex and non-convex objectives at rate O(sigma_bar^2 / (n * epsilon^2) + C * sigma_bar / epsilon^(3/2) + C / epsilon) completely independent of the inter-worker data heterogeneity bound zeta^2 = max_i ||grad f_i(x) - grad f(x)||^2.
  evidence:
  - source_id: r549-primary-pdf
    locator: Section 4 Theoretical Analysis, Lemma 1 & Theorem I, pp. 5-6
    relation: supports
- claim_id: relaysum-spanning-tree-restriction-and-neighbor-memory-limitation
  kind: limitation
  statement: RelaySum requires an acyclic spanning tree (or double binary trees) so that messages do not loop indefinitely, requires auxiliary memory O(|N_i| * d) proportional to the number of tree neighbors to store incoming directional buffers m_{k->i}^(t-1), and attenuates effective step-size energy by a topology-dependent factor alpha <= 1/n.
  evidence:
  - source_id: r549-primary-pdf
    locator: Section 3 Method, Section 5.2, & Appendix D.1, pp. 4, 7, 33-34
    relation: supports
- claim_id: relaysum-heterogeneous-decentralized-deep-learning-application
  kind: application
  statement: Applied to decentralized deep learning on heterogeneous non-IID image classification (CIFAR-10 VGG-11, ImageNet ResNet-20-EvoNorm) and NLP fine-tuning (DistilBERT on AG News) over spanning trees and double binary trees.
  evidence:
  - source_id: r549-primary-pdf
    locator: Section 5.3 Effect of data heterogeneity in decentralized deep learning, Tables 1-5, pp. 7-10
    relation: supports
