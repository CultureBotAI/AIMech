- target: AIO:FederatedLearning
  relation: related_match
  rationale: AIO:FederatedLearning represents centralized server-coordinated distributed learning, whereas RelaySum/RelaySGD is a serverless spanning-tree information-propagation and optimization protocol for decentralized networks.
limitations:
- Cannot utilize cycle edges directly on general graphs without first extracting one or more spanning trees.
- Requires storing one model-sized message buffer per incident tree edge at each worker node.
