id: AIMech:RelaySumSpanningTreeInformationPropagationForDecentralizedLearning
name: RelaySum Spanning-Tree Information Propagation for Decentralized Learning
concept_kind: algorithm
review_status: DRAFT
definition: A decentralized information propagation and model-optimization mechanism (RelaySum / RelaySGD) that routes local model updates across spanning trees of a peer-to-peer communication network without hop-wise weight decay by having each worker i send to each tree neighbor j in N_i the sum m_{i->j}^(t) = x_i^(t+1/2) + sum_{k in N_i \ {j}} m_{k->i}^(t-1) along with scalar parcel counters c_{i->j}^(t), delivering to every worker an exact uniform average (1/n) sum_{j=1}^n x_j^(t - tau_{ij} + 1/2) of delayed local models within a finite number of steps equal to the tree diameter tau_max while using the same per-step communication volume as standard gossip averaging.
identity_notes: Introduced by Thijs Vogels, Lie He, Anastasia Koloskova, Tao Lin, Sai Praneeth Karimireddy, Sebastian U. Stich, and Martin Jaggi (NeurIPS 2021, pp. 28004-28015; arXiv:2110.04175). Distinct from standard gossip averaging / DP-SGD (Lian et al., NeurIPS 2017) and Stochastic Gradient Push (Assran et al., ICML 2019), which decay message weights by mixing-matrix entries < 1 at every hop and suffer from data heterogeneity drift; and distinct from gradient-tracking / exact-diffusion algorithms (D^2, NEXT, SONATA, Push-Pull), which subtract previous gradients or maintain gradient trackers rather than relaying unattenuated model sums over spanning trees.
aliases:
- RelaySum
- RelaySGD
- RelaySum Spanning-Tree Decentralized Optimization
