claims:
- claim_id: factor-augmented-predictor-decomposition-and-projected-lasso-equivalence
  kind: mechanism
  statement: "Under the approximate factor model $\\mathbf{x}_t = \\mathbf{B}\\mathbf{f}_t + \\mathbf{u}_t$ and sparse generalized linear model density $f(y_t \\mid \\mathbf{x}_t, \\boldsymbol{\\beta}^*) = \\exp\\{\\frac{y_t(\\beta_0^* + \\mathbf{x}_t^T\\boldsymbol{\\beta}^*) - b(\\beta_0^* + \\mathbf{x}_t^T\\boldsymbol{\\beta}^*)}{a(\\phi)} + c(y_t, \\phi)\\}$ (Section 2.2, Equation 2.3), Lemma 3.1 (Section 3.1, p. 8) proves that $\\mathbf{u}_t$ satisfies the augmented GLM $f(y_t \\mid \\mathbf{u}_t, \\mathbf{f}_t, \\boldsymbol{\\beta}^*, \\boldsymbol{\\gamma}^*) = \\exp\\{\\frac{y_t(\\mathbf{u}_t^T\\boldsymbol{\\beta}^* + \\mathbf{f}_t^T\\boldsymbol{\\gamma}^*) - b(\\mathbf{u}_t^T\\boldsymbol{\\beta}^* + \\mathbf{f}_t^T\\boldsymbol{\\gamma}^*)}{a(\\phi)} + c(y_t, \\phi)\\}$ with $\\boldsymbol{\\gamma}^* = \\mathbf{B}^T\\boldsymbol{\\beta}^*$. In the linear case $b(\\theta) = \\theta^2/2$ (Section 3.2, pp. 9\u201310, Equations 3.4\u20133.5), profiling out the unpenalized factor coefficient $\\boldsymbol{\\gamma} \\in \\mathbb{R}^{\\widehat{K}}$ in $\\min_{\\boldsymbol{\\beta}, \\boldsymbol{\\gamma}} \\frac{1}{2n}\\|\\mathbf{y} - \\widehat{\\mathbf{U}}\\boldsymbol{\\beta} - \\widehat{\\mathbf{F}}\\boldsymbol{\\gamma}\\|_2^2 + p_\\lambda(\\boldsymbol{\\beta})$ yields the exact orthogonal-projection identity $\\widehat{\\boldsymbol{\\beta}} \\in \\arg\\min_{\\boldsymbol{\\beta} \\in \\mathbb{R}^p} \\frac{1}{2n}\\|(\\mathbf{I}_n - \\widehat{\\mathbf{P}})(\\mathbf{y} - \\widehat{\\mathbf{U}}\\boldsymbol{\\beta})\\|_2^2 + p_\\lambda(\\boldsymbol{\\beta})$ where $\\widehat{\\mathbf{P}} = \\widehat{\\mathbf{F}}(\\widehat{\\mathbf{F}}^T\\widehat{\\mathbf{F}})^{-1}\\widehat{\\mathbf{F}}^T$, and since $\\widehat{\\mathbf{F}}^T\\widehat{\\mathbf{U}} = \\mathbf{0}$, $(\\mathbf{I}_n - \\widehat{\\mathbf{P}})\\widehat{\\mathbf{U}} = \\widehat{\\mathbf{U}}$."
  evidence:
  - source_id: fkw2020-farmselect-pdf
    locator: Section 3.1, pp. 7-9, Lemma 3.1, Equations (3.1)-(3.3); Section 3.2, pp. 9-10, Equations (3.4)-(3.5)
    relation: supports
- claim_id: asymptotic-restoration-of-irrepresentable-condition-and-glm-sign-consistency
  kind: scope
  statement: "Let $\\mathbf{W} = (\\mathbf{U}, \\mathbf{F}) \\in \\mathbb{R}^{n \\times (p+K)}$ and $\\widehat{\\mathbf{W}} = (\\widehat{\\mathbf{U}}, \\widehat{\\mathbf{F}})$ with augmented active set $\\bar{S} = S \\cup \\{p+1, \\dots, p+K\\}$ of cardinality $\\bar{s} = |S| + K$. Under Assumptions 4.1\u20134.2 (requiring the Hessian $\\nabla^2 L_n(\\mathbf{y}, \\mathbf{W}_{\\bar{S}}\\boldsymbol{\\theta}_{\\bar{S}}^*)$ to have minimum eigenvalue $\\ge \\kappa_0$ and the population idiosyncratic design $\\mathbf{W}$ to satisfy the irrepresentable condition $\\|\\nabla_{\\bar{S}^c,\\bar{S}}^2 L_n(\\mathbf{y}, \\mathbf{W}\\boldsymbol{\\theta}^*)(\\nabla_{\\bar{S},\\bar{S}}^2 L_n(\\mathbf{y}, \\mathbf{W}\\boldsymbol{\\theta}^*))^{-1}\\|_\\infty < 1 - 2\\tau$) and factor estimation bound $\\max_{k,t}|\\widehat{F}_{tk} - F_{tk}| \\lesssim \\sqrt{\\log n / p} + 1/\\sqrt{n}$ and $\\max_{j,t}|\\widehat{U}_{tj} - U_{tj}| \\lesssim (\\sqrt{\\log p / n} + 1/\\sqrt{p})\\sqrt{\\log n}$ (Assumption 4.3, Theorem 4.2, p. 15), if $\\omega_n = \\bar{s}(\\sqrt{\\frac{\\log p}{n}} + \\frac{1}{\\sqrt{p}})\\sqrt{\\log n} \\lesssim \\kappa_0 / \\tau$, then Theorem 4.1 (Section 4.1, p. 14) proves that FarmSelect achieves exact sign consistency $\\operatorname{sign}(\\widehat{\\boldsymbol{\\beta}}) = \\operatorname{sign}(\\boldsymbol{\\beta}^*)$ and error rates $\\|\\widehat{\\boldsymbol{\\beta}}_S - \\boldsymbol{\\beta}_S^*\\|_\\infty = O_p(\\sqrt{\\bar{s}}(\\sqrt{\\log p / n} + 1/\\sqrt{p}))$ and $\\|\\widehat{\\boldsymbol{\\beta}}_S - \\boldsymbol{\\beta}_S^*\\|_2 = O_p(\\bar{s}(\\sqrt{\\log p / n} + 1/\\sqrt{p}))$."
  evidence:
  - source_id: fkw2020-farmselect-pdf
    locator: Section 4.1-4.2, pp. 12-16, Assumptions 4.1-4.3, Theorems 4.1-4.2; Appendix A-C, pp. 21-38
    relation: supports
- claim_id: decorrelated-marginal-variable-screening-and-eigenvalue-ratio-factor-selection
  kind: mechanism
  statement: "Section 3.3 (p. 11, Equation 3.6) determines the latent factor dimension $\\widehat{K} = \\arg\\max_{1 \\le k \\le k_{\\max}} \\lambda_k(\\mathbf{X}\\mathbf{X}^T) / \\lambda_{k+1}(\\mathbf{X}\\mathbf{X}^T)$ via the Ahn\u2013Horenstein eigenvalue ratio estimator. For ultrahigh-dimensional regimes where $p$ is too large for direct penalized optimization, Section 3.4 (pp. 11\u201312, Equation 3.7) defines Decorrelated Variable Screening by fitting $p$ marginal factor-augmented regressions $(\\widetilde{\\beta}_j, \\widetilde{\\boldsymbol{\\gamma}}_j) = \\arg\\min_{\\beta_j \\in \\mathbb{R}, \\boldsymbol{\\gamma}_j \\in \\mathbb{R}^{\\widehat{K}}} L_n(\\mathbf{y}, \\widehat{\\mathbf{U}}_j\\beta_j + \\widehat{\\mathbf{F}}\\boldsymbol{\\gamma}_j)$ for $1 \\le j \\le p$ and retaining variables with the largest $|\\widetilde{\\beta}_j|$, eliminating the spurious marginal correlations induced by common factors $\\mathbf{F}$ that cause standard Sure Independence Screening on raw $\\mathbf{X}_j$ to select inactive factor-loaded covariates."
  evidence:
  - source_id: fkw2020-farmselect-pdf
    locator: Section 3.3-3.4, pp. 11-12, Equations (3.6)-(3.7); Section 5.1, pp. 18-19, Figure 3
    relation: supports
