id: AIMech:FactorAdjustedRegularizedModelSelectionAndDecorrelatedVariableScreening
name: Factor-Adjusted Regularized Model Selection and Decorrelated Variable Screening
concept_kind: algorithm
review_status: DRAFT
definition: A two-step high-dimensional model-selection and variable-screening methodology (introduced by Jianqing Fan, Yuan Ke, and Kaizheng Wang in 2020 as *FarmSelect*) for sparse generalized linear models and convex M-estimation under strong cross-sectional covariate dependence driven by latent common factors $\mathbf{x}_t = \mathbf{B}\mathbf{f}_t + \mathbf{u}_t$ ($t = 1, \dots, n$, $p \gg n$). Because pervasive common factors spike the top $K$ eigenvalues of $\operatorname{cov}(\mathbf{x}_t)$ at rate $O(p)$ and cause raw covariates $\mathbf{X}$ to violate the Lasso irrepresentable condition $\|\mathbf{X}_{S^c}^T\mathbf{X}_S(\mathbf{X}_S^T\mathbf{X}_S)^{-1}\|_\infty \le 1 - \tau$, Step 1 estimates the factor number $\widehat{K} = \arg\max_{1 \le k \le k_{\max}} \lambda_k(\mathbf{X}\mathbf{X}^T) / \lambda_{k+1}(\mathbf{X}\mathbf{X}^T)$ (Equation 3.6) and extracts the principal-component factor matrix $\widehat{\mathbf{F}} \in \mathbb{R}^{n \times \widehat{K}}$ ($\widehat{\mathbf{F}}^T\widehat{\mathbf{F}} / n = \mathbf{I}_{\widehat{K}}$), loadings $\widehat{\mathbf{B}} = n^{-1}\mathbf{X}^T\widehat{\mathbf{F}}$, and decorrelated idiosyncratic residuals $\widehat{\mathbf{U}} = (\mathbf{I}_n - \widehat{\mathbf{P}})\mathbf{X}$ where $\widehat{\mathbf{P}} = n^{-1}\widehat{\mathbf{F}}\widehat{\mathbf{F}}^T$. Exploiting the identity $\mathbf{x}_t^T\boldsymbol{\beta}^* = \mathbf{u}_t^T\boldsymbol{\beta}^* + \mathbf{f}_t^T\boldsymbol{\gamma}^*$ with $\boldsymbol{\gamma}^* = \mathbf{B}^T\boldsymbol{\beta}^*$ (Lemma 3.1, p. 8), Step 2 solves the factor-augmented profile penalized problem $\widehat{\boldsymbol{\beta}} \in \arg\min_{\boldsymbol{\beta} \in \mathbb{R}^p, \boldsymbol{\gamma} \in \mathbb{R}^{\widehat{K}}} L_n(\mathbf{y}, \widehat{\mathbf{U}}\boldsymbol{\beta} + \widehat{\mathbf{F}}\boldsymbol{\gamma}) + p_\lambda(\boldsymbol{\beta})$ penalizing only $\boldsymbol{\beta}$ (Equation 3.2), which for linear models reduces exactly to projected Lasso $\arg\min_{\boldsymbol{\beta}} \frac{1}{2n}\|(\mathbf{I}_n - \widehat{\mathbf{P}})(\mathbf{y} - \widehat{\mathbf{U}}\boldsymbol{\beta})\|_2^2 + p_\lambda(\boldsymbol{\beta})$ (Equation 3.5), while *Decorrelated Variable Screening* ranks features by their marginal coefficient $\widetilde{\beta}_j$ in the factor-augmented regression of $\mathbf{y}$ on $(\widehat{\mathbf{U}}_j, \widehat{\mathbf{F}})$ (Equation 3.7).
identity_notes: Resolved against all 442 pinned AIO concepts and 670 maintained AIMech concepts. Distinct from `AIMech:PrincipalOrthogonalComplementThresholdingForApproximateFactorCovarianceEstimation` (Fan, Liao, & Mincheva 2013, which thresholds the residual covariance matrix $\widehat{\mathbf{R}}_K$ for unsupervised covariance and precision matrix estimation rather than decomposing the linear predictor $\mathbf{x}_t^T\boldsymbol{\beta}^* = \mathbf{u}_t^T\boldsymbol{\beta}^* + \mathbf{f}_t^T\boldsymbol{\gamma}^*$ to restore the irrepresentable condition and model-selection sign consistency in supervised generalized linear models), distinct from `AIMech:PreconditionedLassoAndPaulilassoViaSingularValueDecomposition` (Jia & Rohe 2015, which left-multiplies $(\mathbf{y}, \mathbf{X})$ by $\mathbf{U}\mathbf{D}^{-1}\mathbf{U}^T$ when $p > n$ rather than projecting out the top $K$ latent common factors into an unpenalized nuisance space $\widehat{\mathbf{F}}\boldsymbol{\gamma}$), and distinct from `AIMech:SureIndependenceScreeningAndIteratedSureIndependenceScreeningForUltrahighDimensionalFeatureSpace` (Fan & Lv 2008, which screens raw marginal correlations $\mathbf{X}^T\mathbf{y}$ without removing factor-induced confounding).
