id: AIMech:HalkoMartinssonTroppRandomizedSubspaceIterationAndLowRankMatrixDecomposition
name: Halko-Martinsson-Tropp Randomized Subspace Iteration and Low-Rank Matrix Decomposition
concept_kind: algorithm
review_status: DRAFT
definition: A modular two-stage randomized matrix decomposition framework that in Stage A constructs an m x l orthonormal range basis Q (with l = k + p oversampling) via Gaussian random projection Y = A*Omega, adaptive a posteriori Gaussian residual stopping, QR-stabilized subspace power iteration Y = (A*A^*)^q A*Omega (Algorithm 4.4), or O(m*n*log(l)) Subsampled Random Fourier Transform Omega = sqrt(n/l)*D*F*R (Algorithm 4.5), and in Stage B computes low-rank SVD, Interpolative Decomposition row extraction, PSD Nystrom Cholesky-SVD A approx (A*Q)*(Q^* A*Q)^{-1}*(A*Q)^*, or single-pass streaming decompositions, achieving the deterministic projector bound ||(I - P_Y)*A||^2 <= ||Sigma_2||^2 + ||Sigma_2 * Omega_2 * Omega_1^dagger||^2.
identity_notes: No AIO class represents the Halko-Martinsson-Tropp two-stage randomized range finder and QR-stabilized subspace iteration framework; DimensionalityReduction (AIO:DimensionalityReduction) and PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) are the closest broad matches covering low-rank spectral and SVD dimensionality reduction.
aliases:
- Two-Stage Randomized SVD and QR-Stabilized Subspace Power Iteration
- Halko-Martinsson-Tropp Randomized Range Finder and Matrix Approximation Framework
