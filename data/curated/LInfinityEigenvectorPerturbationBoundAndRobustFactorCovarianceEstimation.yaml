claims:
- claim_id: claim-l-infinity-eigenvector-and-singular-vector-perturbation-bounds
  kind: mechanism
  statement: "For a symmetric rank-$r$ matrix $\\mathbf{A} = \\mathbf{V}\\boldsymbol{\\Lambda}\\mathbf{V}^T \\in \\mathbb{R}^{d \\times d}$ with coherence $\\mu(\\mathbf{V}) = (d/r)\\max_i \\sum_{j=1}^r V_{ij}^2$ and eigengap $\\gamma_0$, any symmetric perturbation $\\widetilde{\\mathbf{A}} = \\mathbf{A} + \\mathbf{E}$ satisfying $\\gamma_0 - \\|\\mathbf{E}\\|_\\infty = \\Omega(r^3\\mu^2\\|\\mathbf{E}\\|_\\infty)$ has perturbed eigenvectors satisfying $\\max_{1 \\le k \\le r}\\|\\widetilde{\\mathbf{v}}_k - \\operatorname{sgn}(\\widetilde{\\mathbf{v}}_k^T\\mathbf{v}_k)\\mathbf{v}_k\\|_\\infty = O(r^{5/2}\\mu^{3/2}\\|\\mathbf{E}\\|_\\infty / (\\gamma_0\\sqrt{d}))$ (Theorem 1 / Theorem 2.1), proved by reducing the eigenvector equation via Schur complement to the secular identity $\\widetilde{\\lambda}_k = \\lambda_k + \\mathbf{u}_k^T\\mathbf{E}\\mathbf{u}_k + \\mathbf{u}_k^T\\mathbf{E}\\mathbf{x}^*$ and bounding the Neumann series $\\mathbf{x}^* = \\sum_{m=0}^\\infty \\widetilde{\\lambda}_k^{-(m+1)}(\\mathbf{Q}\\mathbf{E}\\mathbf{Q})^m\\mathbf{Q}\\mathbf{E}\\mathbf{u}_k$ in $\\ell_\\infty$ norm via contraction analysis (Section 5.1, Lemmas 5.1\u20135.3); for general rectangular matrices $\\mathbf{A} = \\mathbf{U}\\boldsymbol{\\Sigma}\\mathbf{V}^T + \\mathbf{A}_{\\rm rem} \\in \\mathbb{R}^{d_1 \\times d_2}$, Theorem 2.4 bounds $\\|\\widetilde{\\mathbf{u}}_i - \\mathbf{u}_i\\|_\\infty$ and $\\|\\widetilde{\\mathbf{v}}_i - \\mathbf{v}_i\\|_\\infty$ by $O(r^{5/2}\\mu_0^{3/2}\\tau_0 / (\\delta_0 - \\varepsilon_0)) / \\sqrt{d_k}$ where $\\tau_0 = \\max\\{\\|\\widetilde{\\mathbf{E}}\\|_{2,\\infty}, \\|\\widetilde{\\mathbf{E}}^T\\|_{2,\\infty}\\}$ and $\\widetilde{\\mathbf{E}} = \\mathbf{E} + \\mathbf{A}_{\\rm rem}$."
  evidence:
  - source_id: fwz2018-linf-pdf
    locator: Section 2 (pp. 5-10, Theorems 2.1-2.4), Section 5 (pp. 24-31, Lemmas 5.1-5.4), Appendices A-B (pp. 32-44)
    relation: supports
- claim_id: claim-catoni-m-estimator-robust-factor-covariance-recovery
  kind: mechanism
  statement: "In a spiked factor model $\\mathbf{y}_i = \\mathbf{B}\\mathbf{f}_i + \\boldsymbol{\\varepsilon}_i$ ($i=1,\\dots,n$) with pervasive loadings $\\|p^{-1}\\mathbf{B}^T\\mathbf{B} - \\boldsymbol{\\Sigma}_B\\|_2 = o(1)$ and heavy-tailed observations satisfying the bounded fourth-moment condition $\\max_{j,k}\\mathbb{E}[(Y_{ij}Y_{ik} - \\Sigma_{jk})^2] \\le v_0^2 < \\infty$ (Assumption 3.2), the entrywise Catoni M-estimator $\\widehat{\\Sigma}_{jk}$ (Equations 3.2\u20133.3) achieves uniform entrywise concentration $\\|\\widehat{\\boldsymbol{\\Sigma}} - \\boldsymbol{\\Sigma}\\|_{\\max} = O_p(\\sqrt{\\log d / n}) without sub-Gaussian tails; combined with Theorem 2.2, this yields $\\|\\widehat{\\mathbf{v}}_k - \\mathbf{v}_k\\|_\\infty = O_p(\\sqrt{\\log d / (n d)} + 1/d)$ for the spiked eigenvectors and optimal convergence rates $\\|\\widehat{\\boldsymbol{\\Sigma}}_u - \\boldsymbol{\\Sigma}_u\\|_2 = O_p(\\omega_n^{1-q} m_d)$ and $\\|\\widehat{\\boldsymbol{\\Sigma}} - \\boldsymbol{\\Sigma}\\|_{\\boldsymbol{\\Sigma}} = O_p(d^{-1/2}\\sqrt{\\log d / n} + \\omega_n^{1-q} m_d)$ where $\\omega_n = \\sqrt{\\log d / n} + 1/\\sqrt{d}$ (Section 3.2, Theorems 3.1\u20133.2)."
  evidence:
  - source_id: fwz2018-linf-pdf
    locator: Section 3 (pp. 10-16, Assumptions 3.1-3.2, Equations 3.2-3.6, Theorems 3.1-3.2), Appendix C (pp. 44-45)
    relation: supports
- claim_id: claim-elliptical-spatial-kendalls-tau-eigenvector-recovery
  kind: mechanism
  statement: "When $\\mathbf{y}_i \\sim \\mathrm{ED}_d(\\mathbf{0}, \\boldsymbol{\\Sigma}, \\xi)$ follows an elliptical factor model where fourth moments may not exist, the spatial Kendall's tau U-statistic matrix $\\widetilde{\\boldsymbol{\\Sigma}}^K = \\binom{n}{2}^{-1}\\sum_{i < i'}(\\mathbf{y}_i - \\mathbf{y}_{i'})(\\mathbf{y}_i - \\mathbf{y}_{i'})^T / \\|\\mathbf{y}_i - \\mathbf{y}_{i'}\\|_2^2$ shares the exact population eigenvectors $\\mathbf{V}$ of $\\boldsymbol{\\Sigma}$ with top-$r$ eigenvalues $\\widetilde{\\lambda}_j \\asymp \\lambda_j / \\operatorname{tr}(\\boldsymbol{\\Sigma}) = \\Theta(1)$ and satisfies $\\|\\widetilde{\\boldsymbol{\\Sigma}}^K - \\boldsymbol{\\Sigma}^K\\|_2 = O_p(\\sqrt{\\log d / n})$ unconditionally on tail heaviness; applying Theorem 2.2 to $\\widetilde{\\boldsymbol{\\Sigma}}^K$ proves that its top $r$ eigenvectors $\\widetilde{\\mathbf{v}}_j^K$ satisfy $\\max_{1 \\le j \\le r}\\|\\widetilde{\\mathbf{v}}_j^K - \\mathbf{v}_j\\|_\\infty = O_p(\\sqrt{d\\log d / n} + d^{-1/2})$ without any moment condition on $\\xi$ (Section 4.1, Theorems 4.1\u20134.2)."
  evidence:
  - source_id: fwz2018-linf-pdf
    locator: Section 4 (pp. 16-20, Equations 4.1-4.4, Theorems 4.1-4.2), Appendix D (pp. 45-46)
    relation: supports
