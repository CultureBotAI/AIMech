name: Product of experts
definition: A probabilistic model family that combines expert factors over the same observations by multiplying
  their values and normalizing the product over the observation space.
concept_kind: model_family
identity_notes: This record denotes the general normalized-product construction, including latent-variable
  experts, rather than an arithmetic mixture, a training algorithm or a language-model-specific factorization.
  The original cooperative-learning setting does not require experts to be separately trained. AIO FactorizedLLM
  has Product of experts as a related synonym, but its definition and parent restrict it to large language
  models; that related synonym does not identify the general family. Logarithmic opinion pooling uses
  normalized exponent weights and has a separate aggregation scope. All 442 pinned AIO labels/scoped synonyms
  and 373 preceding native IDs/names/aliases were compared. The sole normalized hit is Product of experts
  as a related synonym of FactorizedLLM; its language-specific definition and parent distinguish it from
  the generic candidate. Both full-checkout fixed-string searches included ignored and hidden files and
  returned 59 lines each. All 29 unique matched contents were read; other hits concern citations, training
  components, prior boundary discussions or pending leads. All 88 semantic label/synonym hits, 20 exact
  fully annotated AIO nodes with outgoing edges, their generated records and four complete native neighbors
  were inspected or verified unchanged after previous full reading. Absence is bounded to this pin and
  inspected semantic neighborhood.
limitations:
- The normalizer must be finite and positive. Continuous expert densities being individually normalized
  does not alone guarantee that their product is integrable; nonoverlapping supports can also make normalization
  impossible.
- Tractable inference within each expert does not make the product normalizer, model sampling or likelihood
  learning automatically tractable. Exact likelihood derivatives involve the full product distribution;
  short-chain CD is a distinct approximate learning procedure.
- Experts need not use disjoint input dimensions, be individually well fitted, or produce a sharper or
  better calibrated distribution in every setting. A product of Gaussian factors remains Gaussian when
  well defined, so Gaussian factors alone do not represent arbitrary multimodality.
- Conditional independence is between separate latent expert states given all modeled observations. Missing
  observations can couple the experts. The original architecture is not defined by a sparse router or
  an arithmetic average of expert predictions.
- 'Unit exponent products and geometric opinion averages are not interchangeable: multiplying duplicate
  factors can sharpen a distribution, while identical distributions pooled with exponent weights summing
  to one remain unchanged. No empirical advantage or author implementation is certified.'
