claims:
- claim_id: method
  kind: mechanism
  statement: For observations x, form p(x)=product_m f_m(x;theta_m)/Z(theta), with Z the sum or integral
    of the product over x and 0<Z<infinity. Expert factors may be unnormalized; multiplying one by a positive
    x-independent constant cancels in the final normalization. For parameters local to expert m, the exact
    log-likelihood derivative is its log-factor derivative at the data minus the expectation of that derivative
    under the full product model. In the latent-expert construction, f_m(x)=sum_hm f_m(x,h_m), and separate
    expert hidden variables are conditionally independent given a completely observed x, allowing separate
    inference when each expert is tractable. This does not imply independence of observed coordinates
    or independence of experts after some observations are marginalized. Restricted Boltzmann machines
    instantiate the family with one expert per hidden unit, whereas product HMMs use complete HMM sequence
    distributions as factors.
