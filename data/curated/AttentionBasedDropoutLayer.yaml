claims:
- claim_id: method
  kind: mechanism
  statement: Average the input convolutional feature tensor over channels to obtain one spatial attention
    map. Set a threshold to a configured fraction gamma of that map’s maximum; construct a binary drop
    mask that suppresses positions above the threshold. Separately apply a sigmoid to the attention map
    to obtain importance weights. On a training iteration, choose the drop mask with the configured drop
    rate and otherwise choose the importance map, then multiply the selected spatial map into the input
    features across channels. These map operations add no trainable parameters; gradients through the
    importance branch train the surrounding classifier. ADL is disabled at testing and returns the feature
    map unchanged, without a train/test distribution compensation step. The source uses image-level classification
    labels and a separate heatmap extraction/localization procedure; ADL itself does not output an object
    bounding box.
