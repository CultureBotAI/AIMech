name: Attention-based Dropout Layer
definition: A training-time convolutional feature-map layer that stochastically applies either a thresholded
  spatial drop mask or sigmoid importance weights derived from channel-averaged activations, developed
  for weakly supervised object localization.
concept_kind: layer
identity_notes: This is the 2019 ADL component, not a complete localization network or a trained checkpoint.
  Its self-attention map is a channel average of feature activations, not dot-product query/key attention.
  It differs from random-block DropBlock, whole-channel dropout and Cutout by selecting strongly activated
  spatial regions from the current feature map and alternating their suppression with continuous importance
  gating. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  273 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 18 and 18 lines respectively. Every text hit was a prior candidate
  lead. Eleven exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native
  neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The drop rate controls how often the drop-mask branch is selected, not the fraction of pixels removed.
  Thresholding depends on the activation distribution; the source prose specifies greater-than and less-than
  comparisons but leaves equality at the threshold unresolved. The record does not invent a tie rule or
  implementation-specific batching convention.
- Sigmoid importance weights lie between zero and one and reweight regions relative to each other; they
  do not necessarily amplify raw activation magnitudes. The averaged attention map is a heuristic signal,
  not a calibrated explanation or guaranteed object mask.
- No added trainable parameters does not mean zero training computation. Placement, threshold and branch
  probability are choices; classification and localization can trade off, and low-level maps need not
  capture class-specific object regions.
- The source explicitly shows that attention suppression can encourage reliance on co-occurring background
  rather than the object. The inspected evaluation is single-object localization; broader segmentation
  compatibility is a proposed application, not an established universal result. No benchmark superiority
  or complete-object-coverage guarantee is asserted.
