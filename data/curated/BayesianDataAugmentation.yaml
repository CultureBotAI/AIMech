name: Bayesian Data Augmentation for Deep Models
definition: Tran et al.’s supervised deep-learning procedure that treats synthetic labeled examples as
  latent data, repeatedly samples them from an evolving learned model and updates model parameters through
  a generalized Monte Carlo expectation-maximization formulation.
concept_kind: algorithm
identity_notes: This record is scoped to the 2017 Tran et al. formulation for generating labeled deep-learning
  training examples. It is not all statistical Bayesian data augmentation, generic EM, Bayesian-network
  graphical modeling or posterior sampling of neural-network weights. Its class-conditioned generative
  model differs from AdaMixUp’s interpolation and cooperative intrusion discriminator. Generalized Monte
  Carlo EM is the formulation used here, not an alias identifying every GMCEM application with this record.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 250 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 9 lines in each checkout. These were references within neighboring
  records, their review and the prior discovery ledger, not records for the proposed identities. Fourteen
  exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring native mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The generalized M-step requires improvement of its objective. Differentiability alone does not guarantee
  that an arbitrary finite gradient step or a noisy minibatch epoch increases that objective.
- The source’s Lemma 1 moves from a sampled-objective inequality to an expectation inequality. Improvement
  observed for one finite sample does not by itself guarantee improvement of the exact expected objective
  or the observed-data posterior, especially when the update is selected using that sample. No unconditional
  monotonicity or convergence guarantee for practical GAN training is asserted.
- Equations (18)–(19) link authenticator losses to data log-likelihood terms. A real/fake discriminator
  probability is not itself a normalized data density; this record describes the published adversarial
  surrogate without asserting an exact normalized-likelihood or exact-EM implementation.
- Separate real and synthetic means assign each group its own normalization. Increasing the number of
  generated samples does not automatically multiply the synthetic group’s total coefficient in the printed
  objective.
- Generated labels and images depend on the fitted model and optimization. No label-correctness guarantee,
  universal sample quality, benchmark advantage or reproduction of author software is asserted.
