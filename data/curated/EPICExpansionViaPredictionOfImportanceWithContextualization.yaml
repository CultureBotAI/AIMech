id: AIMech:EPICExpansionViaPredictionOfImportanceWithContextualization
name: EPIC Expansion via Prediction of Importance with Contextualization
concept_kind: architecture
review_status: DRAFT
definition: A lexicon-grounded representation-based neural passage re-ranking architecture that maps a query q into a sparse |V|-dimensional vector phi_q where each present query term t_i receives contextualized log-softplus importance weight w_q(t_i) = ln(1 + softplus(theta_1^T f_i(q))) (summed across repeated occurrences), and maps a passage d offline at index time into a |V|-dimensional lexicon vector phi_d(tau) = c(d) * max_{t_j in d}(w_d(t_j) * psi_j(tau)) combining a projection psi_j = Theta_2 f_j(d) into the vocabulary space, token importance w_d(t_j) = ln(1 + softplus(theta_3^T f_j(d))), and a sigmoid [CLS] passage-quality gate c(d) = sigmoid(theta_4^T d_[CLS]), scoring relevance via the inner product sim(q, d) = phi_q^T phi_d over query terms with optional top-r document vector pruning.
identity_notes: Distinct from SPLADE (AIMech:SPLADESparseLexicalAndExpansionModel), which applies log(1 + ReLU(.)) directly to MLM logits with explicit FLOPS regularization for first-stage inverted-index retrieval without separate token-salience factors w_d(t_j) or a sigmoid [CLS] document-quality gate c(d); and distinct from SPARTA (AIMech:SPARTASparseTransformerMatchingForRetrieval), which computes non-contextualized query-to-contextualized-document token max dot products followed by ReLU(b + .) and log(1 + .) without query contextualization or a learned vocabulary expansion projection matrix Theta_2.
aliases:
- EPIC
- Expansion via Prediction of Importance with Contextualization
- EPIC Lexicon-Grounded Neural Ranking Model
