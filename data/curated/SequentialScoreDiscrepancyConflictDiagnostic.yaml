aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The sequential score-discrepancy conflict diagnostic operates on a parent-child partition
    of a Bayesian directed acyclic graph (Bayesian network), propagating posterior draws from the parent
    subgraph to conditional prior-expansion score checks in the child subgraph. AIO:BayesianNetwork provides
    the graphical model representation context rather than an algorithmic superclass.
limitations:
- Requires an explicit directed acyclic graph partition into parent-linked data y_pa and child-linked
  data y_ch around the selected separator block theta_2 such that the parent submodel p(theta_1 | y_pa_obs)
  and conditional child submodel p(theta_2 | y_ch, theta_1) are well-defined and proper.
- When Algorithm 1 uses a single conditional posterior draw theta_2^(m) ~ p(theta_2 | y_ch, theta_1^(m))
  rather than the exact conditional posterior expectation of the prior score, the single-draw score includes
  additional conditional posterior Monte Carlo variance; comparing an exact observed score to single-draw
  replicate scores (or vice versa) without the Appendix D.2 variance scaling factor distorts the reference
  tail probability.
- Order-statistic p-value bounds can be conservative under strong positive dependence across parent posterior
  draws, whereas the Half-Cauchy Combination Test relies on heavy-tail asymptotic approximation and does
  not guarantee exact finite-threshold Uniform(0,1) calibration under arbitrary finite-sample dependence
  structures.
- All 52 pages of Yang, Nott, & Presanis (2026, arXiv:2511.02977v2) and 22 pages of Presanis et al. (2013,
  arXiv:1310.0628v1) were read. No author MCMC implementation, epidemic model fit, or empirical repeated-data
  calibration benchmark was executed; constructed numerical checks in research/discovery/sequential-score-conflict-boundaries.py
  verify analytical variance scaling and dependent p-value combination boundaries only.
