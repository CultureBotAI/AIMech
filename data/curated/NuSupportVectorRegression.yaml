- target: AIO:RegressionAnalysis
  relation: related_match
  rationale: AIO RegressionAnalysis identifies a supervised estimation task, while this native record
    specifies one fitting algorithm for real-valued responses. A related match captures its task without
    asserting algorithm/task equivalence. LinearRegression, RidgeRegression and LeastsquaresAnalysis do
    not identify the kernel, learned tube or piecewise-linear loss.
- target: AIO:SupportVectorMachine
  relation: related_match
  rationale: The source derives this supervised kernel optimization from support-vector methods, but the
    pinned AIO target describes a network with input, hidden and output parts. This native identity is
    an optimization algorithm, so the network abstraction is related rather than an asserted exact or
    broader class. KernelLayer names a component, and generic Network or TrainingStrategy also does not
    identify the objective. Twelve annotated AIO CLASS nodes and their outgoing edges were inspected.
limitations:
- Finite nu bounds are conditional inequalities, not exact sparsity, calibrated test error or a universal
  parameter choice.
- All39 original journal pages were read; the conference precursor, later decomposition methods and external
  proof dependencies were not fully audited.
- Exact rational feasibility and KKT certificates were evaluated without running a solver, training a
  model or reproducing the historical benchmarks.
- The record remains a native DRAFT. Parametric-insensitivity and later solver/extension identities remain
  separate discovery work.
