id: AIMech:SeverSpectralGradientFilteringMetaAlgorithmForRobustStochasticOptimization
name: Sever Spectral Gradient Filtering Meta-Algorithm for Robust Stochastic Optimization
concept_kind: algorithm
review_status: DRAFT
definition: An outlier-robust stochastic optimization meta-algorithm that iteratively invokes a black-box gamma-approximate learner L on the current active sample subset S subseteq {1, ..., n} to obtain parameters w = L({f_i}_{i in S}), forms the |S| x d matrix of centered sample gradients G = [nabla f_i(w) - nabla_hat]_{i in S} where nabla_hat = (1/|S|) sum_{i in S} nabla f_i(w), computes the top right singular vector v of G, scores each sample by its squared spectral projection tau_i = ((nabla f_i(w) - nabla_hat) . v)^2, and filters out high-scoring outliers whenever the total spectral variance exceeds a threshold before re-running the base learner until convergence.
identity_notes: Introduced by Diakonikolas, Kamath, Kane, Li, Steinhardt, and Stewart (ICML 2019, PMLR 97:1596-1606, arXiv:1803.02815). Distinct from every-iteration robust-mean-estimation projected gradient descent (Appendix D; Prasad et al. 2018), which calls a robust mean estimator at every gradient step rather than only at approximate critical points of a black-box learner. Also distinct from client-update Byzantine federated aggregation rules such as DnC (AIMech:DncDivideAndConquerSpectralByzantineRobustAggregation), Multi-Krum (AIMech:KrumAndMultiKrumByzantineResilientGradientAggregation), and Bulyan (AIMech:BulyanByzantineResilientGradientAggregation), which aggregate distributed worker updates in a single communication round rather than iteratively filtering training examples around a black-box empirical risk minimizer.
aliases:
- Sever Robust Meta-Algorithm for Stochastic Optimization
- Sever Spectral Outlier Gradient Filtering
- Sever SVD Gradient Filtering Meta-Algorithm
