claims:
- claim_id: c1-mechanism-svd-centered-gradient-outlier-filtering
  kind: mechanism
  statement: 'At each outer iteration on active index set S subseteq {1, ..., n}, Sever runs the gamma-approximate learner w <- L({f_i}_{i in S}), computes the empirical mean gradient nabla_hat = (1/|S|) sum_{i in S} nabla f_i(w) and centered gradient matrix G = [nabla f_i(w) - nabla_hat]_{i in S} in R^{|S| x d}, extracts the top right singular vector v of G, computes outlier scores tau_i = ((nabla f_i(w) - nabla_hat) . v)^2, and if sum_{i in S} tau_i > c * sigma, draws T ~ Unif[0, max_i tau_i] (or removes the top p fraction of scores) to update S <- {i in S : tau_i < T} until no points are removed.'
  evidence:
  - source_id: r527-primary-pdf
    locator: Section 2.2, Algorithm 1-2 and Practical Considerations, pp. 5-6
    relation: supports
- claim_id: c2-scope-dimension-independent-approximate-critical-point
  kind: scope
  statement: Under the epsilon-contamination model (Definition 2.1), if the uncorrupted sample set I_good subseteq [n] (|I_good| >= (1 - epsilon)n) satisfies bounded gradient covariance Cov_{I_good}[nabla f_i(w)] <= sigma^2 I and bounded empirical mean gradient deviation ||nabla f_hat(w) - nabla f_bar(w)||_2 <= sigma * sqrt(epsilon), Sever terminates in at most n iterations and returns with probability at least 9/10 a (gamma + O(sigma * sqrt(epsilon)))-approximate critical point of the true population objective f_bar(w), achieving an error guarantee independent of the ambient dimension d.
  evidence:
  - source_id: r527-primary-pdf
    locator: Section 2.2 Theorem 2.1, Corollary 2.3, and Appendix B.1 Lemma B.6-B.7, pp. 6, 18-21
    relation: supports
- claim_id: c3-application-poisoning-resilient-regression-and-svm
  kind: application
  statement: Sever hardens ridge regression on high-dimensional ChEMBL drug-discovery data (410 dimensions) and hinge-loss support vector machines on Enron spam classification (5116 dimensions) against correlated data poisoning attacks that fool loss-based, l2-distance, centered-gradient l2-norm, and RANSAC outlier detectors.
  evidence:
  - source_id: r527-primary-pdf
    locator: Section 3, Figures 2-6, pp. 8-12
    relation: supports
- claim_id: c4-limitation-multiple-large-singular-values-and-sqrt-epsilon-rate
  kind: limitation
  statement: Sever's theoretical guarantee incurs an O(sigma * sqrt(epsilon)) error dependence on the corruption fraction epsilon without stronger distributional assumptions, and its single-top-singular-vector filter assumes the clean gradient covariance has small spectral norm in all directions, requiring multiple filtering rounds when subsets of outliers are initially hidden with zero hinge-loss gradient.
  evidence:
  - source_id: r527-primary-pdf
    locator: Section 3.2 Figure 6 and Section 4 Discussion, pp. 12-13
    relation: supports
