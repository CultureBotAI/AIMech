definition: A multiview exemplar-clustering procedure that learns shared exemplar weights and view weights
  through outer view-responsibility updates and an inner shared-weight fit, then assigns observations
  to a specified set of high-weight exemplars.
identity_notes: 'This is the Tzortzis-Likas 2010 weighted multiview CMM procedure. Despite the inherited
  CMM name, its joint objective is not convex. It uses the log of a view-weighted sum of exemplar scores,
  whereas the 2009 algorithm sums view log likelihoods. This record distinguishes the general component-value
  formulation from the distance-only experimental variant that omits density base factors, and does not
  assert that marginal densities on different view spaces automatically define a joint generative model.
  No normalized identity collision across all 442 pinned AIO IDs, labels/scoped synonyms and 487 maintained
  IDs, names and aliases. Full-checkout searches include ignored and hidden files: 8 matched lines in
  the worktree and 9 in main. All six distinct matched texts were read; they concern the prior exemplar-clustering
  frontier, its source/query URLs and an unrelated FreeFem lexer token. Seven annotated AIO nodes and
  seven full native neighbors were inspected. The same pinned bytes retain the previously read 442 class
  labels and 138 semantic label/synonym rows. Absence is bounded to this snapshot and corpus.'
