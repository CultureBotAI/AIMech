claims:
- claim_id: r467-channel-adaptive-gaussian-feature-augmentation-mechanism
  kind: mechanism
  statement: Normalizes intermediate CNN or Transformer feature representations x_hat = (x - mu) / (sigma + epsilon) and applies stochastic affine re-modulation y = gamma o x_hat + beta with gamma ~ N(sigma, Sigma_sigma^2) and beta ~ N(mu, Sigma_mu^2) (Equations 4-6), updating variance radii Sigma_mu^{(t)}, Sigma_sigma^{(t)} via channel-adaptive weights gamma_{\cdot,c}^{(t)} = D * Sigma_{\cdot,B,c}^{(t)} / sum_{i=1}^D Sigma_{\cdot,B,i}^{(t)} (Equations 7-8) and synchronizing Sigma_mu, Sigma_sigma across clients at every communication round.
  evidence:
  - source_id: r467-primary-pdf
    locator: Section 3.1 Probabilistic Federated Feature Augmentation (Equations 4-8), pp. 3-4
    relation: supports
- claim_id: r467-vmf-momentum-queued-anchor-loss-equivalence-scope
  kind: scope
  statement: Proves in Lemma 1 (Appendix A.1, Equations 16-18) that if L2-normalized queued features q_{c,m} follow a von Mises-Fisher distribution with unit mean direction a_c (So E[q_{c,m}] = gamma_d(kappa) a_c), then up to the concentration scale gamma_d(kappa) = I_{d/2}(kappa) / I_{d/2-1}(kappa), the expected cosine distance E_{q_{c,m}}[1 - cos(f, q_{c,m})] equals the anchor cosine distance 1 - cos(f, a_c), enabling variance-reduced online contrastive alignment via a C x M FIFO queue updated by a momentum encoder theta_k^m <- gamma theta_k^m + (1 - gamma) theta_k (Equations 11-12).
  evidence:
  - source_id: r467-primary-pdf
    locator: Section 3.2 Federated Feature Anchor Loss (Equations 9-14, Lemma 1), pp. 4-6, and Appendix A.1 Proof of Lemma 1, p. 14
    relation: supports
- claim_id: r467-momentum-encoder-and-anchor-communication-overhead-limitation
  kind: limitation
  statement: Introduces local memory and compute overhead from maintaining a momentum feature extractor theta_k^m and a C x M feature queue Q_k, along with extra communication overhead of 2 sum_{l=1}^L D_l + C D_L floats per round to exchange layer-wise variance buffers and class anchors.
  evidence:
  - source_id: r467-primary-pdf
    locator: Section 3.2 Momentum Queue & Anchor Aggregation, p. 5, and Section 3.3 Algorithm 1 & Communication Cost Analysis, p. 6
    relation: supports
- claim_id: r467-label-and-feature-skew-federated-vision-application
  kind: application
  statement: Applied to federated visual classification under both Dirichlet label distribution skew (CIFAR-10, CIFAR-100, TinyImageNet, FEMNIST) and multi-domain feature shift (Digits, Office-Caltech10) with CNN and Vision Transformer backbones.
  evidence:
  - source_id: r467-primary-pdf
    locator: Section 4 Experiments (Tables 1-4, Figures 2-3), pp. 6-9
    relation: supports
