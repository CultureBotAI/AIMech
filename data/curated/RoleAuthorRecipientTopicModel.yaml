claims:
- claim_id: token-role-topic-generation
  kind: mechanism
  statement: In RART1, each actor has a Dirichlet-distributed role vector psi, each ordered sender-role/recipient-role
    pair has a Dirichlet topic vector theta, and each topic has a Dirichlet word vector phi. Given observed
    sender a and a nonempty recipient set R, a token chooses r uniformly from R, sender role g from psi_a,
    recipient role h from psi_r, topic z from theta_gh, then word w from phi_z. An actor uses the same
    role vector for sending and receiving, while theta distinguishes the order of the roles. The model
    conditions on participants and message lengths rather than generating network edges. Shared random
    vectors must be integrated jointly across their uses; two roles drawn for the same actor need not
    be independent after psi is integrated out.
  evidence:
  - source_id: method-source
    locator: Section 5, preprint pp.18-19, RART1 generative description and joint distribution
    relation: supports
- claim_id: staged-conditional-fitting
  kind: mechanism
  statement: The reported RART1 experiment first fits ART, fixes topic and recipient assignments from
    one sample, and then infers the role structure conditionally on those assignments. This staged procedure
    does not sample the full joint RART posterior or propagate all uncertainty in the frozen assignments.
    The source states that general Gibbs updates can be derived, but its Appendix A derives ART updates,
    not a complete RART sampler. Conditional on fixed parameters, token role choices can vary within a
    message; RART2 and RART3 impose different message-level sharing and cannot be substituted without
    changing the model.
  evidence:
  - source_id: method-source
    locator: Section 5, preprint pp.18-19; Section 6, pp.19-20; Appendix A, pp.21-22
    relation: supports
