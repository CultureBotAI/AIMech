name: Role-author-recipient-topic model
definition: A family of message-content models in which actors have latent-role distributions and ordered
  sender-role/recipient-role pairs determine topic mixtures, with token-level or message-level role assignments.
concept_kind: model_family
identity_notes: Scoped to the RART family introduced by McCallum and colleagues, with the 2007 preprint
  specifying RART1 in detail and sketching RART2 and RART3. RART1 draws both roles per token; RART2 fixes
  a sender role and individual recipient roles per message; RART3 uses one common recipient role per message.
  The latter sketches are not asserted to provide complete independent inference algorithms. Explicit
  actor roles distinguish this family from ART pair-specific topic vectors and author-topic models. RART
  is a source acronym within this scope. No normalized candidate identity matched all 442 pinned AIO IDs,
  labels and scoped synonyms or 429 preceding native IDs, names and aliases. Full-checkout searches included
  ignored and hidden files in both checkouts; 23 matching lines per checkout came from four unique file
  contents containing prior frontier leads and contextual distinctions. All matching excerpts were inspected.
  The semantic search returned 205 label/synonym hits, with 204 unchanged from prior reading and one newly
  read. Eighteen annotated AIO CLASS nodes and outgoing edges were byte-verified against prior inspected
  versions. Twenty-six contextual YAMLs comprise 24 unchanged prior readings and two final round102 records
  verified against their fully read scientific-review inputs. No candidate record is present within this
  bounded pinned-snapshot and maintained-corpus search.
limitations:
- Only RART1 has a detailed generative specification in this source. The RART2/3 diagrams and prose leave
  further implementation and inference choices for exploration; family coverage does not certify fully
  specified variants.
- The demonstrated 15-role, 50-topic fit is illustrated by selected email users and manually named roles
  in Tables 6-7. Some apparently unrelated assignments remain unexplained, and entity-resolution errors
  are present. These examples do not establish verified occupations, expertise, causal influence or universal
  predictive superiority. Earlier ART perplexity results are not RART benchmark results.
- Fixed role/topic counts, bag-of-words observations, uniform recipient selection and corpus-specific
  participation affect identifiability and interpretation. Latent role labels are exchangeable; semantic
  names are human interpretations. A single ART sample judged plausible does not establish adequate uncertainty
  propagation or convergence.
- Finite synthetic collapsed-probability checks cover the specified RART1 factorization, including a shared
  actor in sender and recipient positions. They are not a reproduction of historical software, email preprocessing
  or the reported benchmark.
