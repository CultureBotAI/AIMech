id: AIMech:SoRASparseLowRankAdaptation
name: SoRA (Sparse Low-Rank Adaptation)
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive-rank parameter-efficient fine-tuning algorithm that initializes low-rank adaptation matrices W_d in R^{r_max x q} and W_u in R^{p x r_max} with a large upper-bound rank r_max, inserts a trainable gating vector g in R^{r_max} via z = W_u (g o (W_d x)), optimizes g using the proximal gradient soft-thresholding update g_{t+1} = T_{eta_t lambda}(g_t - eta_t nabla_g L_0(Delta_t)) under l1 sparsity regularization, and eliminates rows of W_d and columns of W_u indexed by zero entries I^(k) = {i | g_i^(k) = 0} after training to recover a concise LoRA module of rank r_max - |I^(k)|.
identity_notes: Distinct from AdaLoRA (AIMech:AdaLoRAAdaptiveBudgetAllocationForLoRA, which imposes explicit SVD orthogonality penalties R(U, V) = ||U^T U - I_p||_F^2 + ||V^T V - I_q||_F^2 and prunes triplets using heuristic moving-average weight-gradient sensitivity scores), from DyLoRA (AIMech:DyLoRADynamicSearchFreeLowRankAdaptation, which trains prefix sub-ranks via nested-dropout-style random rank sampling without sparse gating), and from RoSA (AIMech:RoSA, which trains a low-rank matrix plus a separate full-dimensional sparse residual matrix W^S). Formulated by Ding, Lv, Wang, Chen, Zhou, Liu, and Sun (EMNLP 2023, arXiv:2311.11696).
aliases:
- Sparse Low-Rank Adaptation
- SoRA Proximal-Gradient Adaptive-Rank LoRA
- Soft-Thresholded Gated Sparse Low-Rank Adaptation
