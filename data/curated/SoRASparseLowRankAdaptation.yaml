claims:
- claim_id: sora-proximal-gradient-soft-thresholding-gate-update
  kind: mechanism
  statement: SoRA inserts an element-wise gate g in R^{r_max} between down-projection and up-projection matrices so that z = W_u (g o (W_d x)), and updates g at step t via the proximal gradient mapping g_{t+1} = T_{eta_t lambda}(g_t - eta_t nabla_g L_0(Delta_t)) for the l1-regularized objective L(Delta) = L_0(Delta) + lambda sum_{k=1}^K ||g^(k)||_1, where T_xi(x) = sign(x) max(|x| - xi, 0) with threshold xi = eta_t lambda.
  evidence:
  - source_id: r689-primary-pdf
    locator: Section 3.1-3.2, Eq. 6-11 and Eq. 13-14, p. 4
    relation: supports
- claim_id: sora-zero-rank-post-pruning-and-svd-regularizer-elimination
  kind: mechanism
  statement: 'Upon training completion, SoRA identifies the zero-gate index set I^(k) = {i in [1 : r_max] | g_i^(k) = 0}, drops the I^(k)-th rows of W_d^(k) and columns of W_u^(k), and absorbs the non-zero gate entries g_tilde^(k) into W_tilde_u^(k) diag(g_tilde^(k)) to execute inference as a standard LoRA module of rank r_max - |I^(k)| while avoiding AdaLoRA''s orthogonality regularizer and reducing per-epoch training time by approximately 30%.'
  evidence:
  - source_id: r689-primary-pdf
    locator: Section 3.1 Post-pruning Eq. 12, Section 3.2 & Section 4.6 Table 4, p. 4-5, 8
    relation: supports
- claim_id: sora-glue-adaptation-and-sparsifying-scheduler-application
  kind: application
  statement: SoRA is applied to parameter-efficient fine-tuning of DeBERTaV3-base and RoBERTa-large across all eight GLUE benchmark tasks, outperforming LoRA and AdaLoRA with 31.5% and 28.3% fewer retained parameters respectively, and uses a progressive threshold-enlarging sparsifying scheduler (Algorithm 1) to characterize task-specific memorization and generalization compression inflection points.
  evidence:
  - source_id: r689-primary-pdf
    locator: Section 3.3 Algorithm 1 & Section 4.2-4.4 Tables 1-2 and Figures 2-3, p. 5-8
    relation: supports
- claim_id: sora-unverified-cross-modal-instruction-tuning-limitation
  kind: limitation
  statement: Unlike fixed-budget pruning methods, SoRA controls retained parameter count indirectly through the sparsity threshold xi = eta_t lambda rather than an exact cardinality constraint, and its sparsity behavior in cross-modal and open-ended instruction-tuning regimes is not evaluated in the primary study.
  evidence:
  - source_id: r689-primary-pdf
    locator: Section 4.5, p. 8 & Limitations section, p. 9
    relation: supports
