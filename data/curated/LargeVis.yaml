name: LargeVis
definition: A dimensionality-reduction and graph-visualization algorithm that constructs an approximate
  weighted nearest-neighbor graph and learns low-dimensional coordinates with sampled attractive-edge
  and repulsive-pair likelihood terms.
concept_kind: algorithm
identity_notes: LargeVis combines a specific approximate-neighbor construction with a probabilistic layout
  objective. It is distinct from t-SNE’s normalized KL objective, UMAP’s locally scaled graph weights,
  LINE graph representations, and generic nearest-neighbor search. All 442 pinned AIO labels/scoped synonyms
  and 114 preceding native identities were compared, together with hidden/ignored-inclusive searches of
  both checkouts; source citations and pending frontier mentions were distinguished from existing concept
  identities.
limitations:
- Graph construction is approximate; the reported near-perfect neighbor recovery on selected datasets
  is not a guarantee for arbitrary input.
- The sampled objective in equation (6) replaces the all-negative-pairs expression in equation (5); it
  is not asserted to be an unbiased evaluation of every original negative term.
- The linear layout-cost statement assumes fixed embedding dimension and negative-sample count with a
  number of updates proportional to points; it does not establish linear cost for all graph construction
  or convergence.
- Perplexity, graph quality, negative distribution, optimizer and chosen low-dimensional probability function
  affect results. No universal geometric fidelity or benchmark superiority is asserted.
