claims:
- claim_id: method-scope
  kind: mechanism
  statement: Initialize approximate neighbors with random projection trees and refine candidate neighbors
    through neighbors-of-neighbors exploration. Assign locally normalized Gaussian weights with a perplexity-controlled
    bandwidth and symmetrize them. Model edge likelihood using a decreasing function of embedded distance,
    sample positive edges in proportion to their weights, draw negative endpoints with degree-to-the-three-quarters
    weighting, and optimize the sampled log objective using asynchronous stochastic gradients.
