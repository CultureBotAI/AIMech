claims:
- claim_id: method
  kind: mechanism
  statement: For a finite graph with X_i in {0,...,R} and fixed integer R>=1, define p(x)=Z^(-1)*exp[sum_i(a_i*x_i-log(x_i!))+sum_(i<j)
    b_ij*x_i*x_j], using symmetric b_ij and zero coefficients on nonedges. Finite real parameters give
    a finite positive Z on the finite support. The full conditional at i is proportional to exp(eta_i*k)/k!
    for k=0,...,R, where eta_i=a_i+sum_(j!=i) b_ij*x_j. Its normalizer is C_R(lambda_i)=sum_(k=0)^R lambda_i^k/k!,
    with lambda_i=exp(eta_i). Thus lambda_i is the underlying Poisson parameter, while the actual truncated
    conditional mean is lambda_i*C_(R-1)(lambda_i)/C_R(lambda_i). This mean is generally not lambda_i.
    With all edge parameters zero the joint factors into independent truncated Poisson laws.
