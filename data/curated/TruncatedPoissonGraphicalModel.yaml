name: Truncated Poisson graphical model
definition: A finite pairwise count graphical model with a fixed upper count limit, factorial base measures
  and Poisson-kernel full conditionals renormalized over the bounded support, allowing finite symmetric
  interactions of either sign.
concept_kind: model_family
identity_notes: 'The TPGM in Yang et al. conditions a Poisson kernel on counts no larger than R. It does
  not Winsorize by moving all tail mass to the cutoff. The cutoff belongs to the model support, not merely
  an observation-clipping procedure. TPGM is distinct from the classical unbounded auto-Poisson field
  and from an auto-binomial field with combinatorial trial-count factors. Its full conditionals are truncated
  Poisson laws; this does not assert the same family for every marginal distribution. No normalized identity
  match was found across all 442 pinned AIO labels and all scoped synonyms and 406 preceding native IDs,
  names and aliases. Fixed-string full-checkout searches included ignored and hidden files in worktree
  and main, yielding six and six matched lines; all five unique contents were read. Hits are the prior
  publication lead and source URLs, not existing records of these identities. All 185 semantic label/synonym
  hits were read. Forty-five fully annotated exact CLASS nodes and outgoing edges were inspected: 43 byte-equivalent
  to prior inspected nodes and two freshly read. Fifty-nine contextual YAMLs comprise 45 generated and
  14 native records: 54 byte-verified after prior reading and five freshly read. Acronyms were included
  in normalized identity comparison and the text-search terms. Absence is bounded to the pinned snapshot,
  maintained corpus and inspected semantic neighborhood.'
limitations:
- Positive interactions and large neighboring counts can concentrate conditional mass at the cutoff. R
  changes the model, and a cutoff selected as the observed maximum does not guarantee that future counts
  will lie within its support.
- The unbounded limit cannot retain arbitrary positive pairwise coefficients while preserving the classical
  Poisson joint law. Finite-support normalizability is not evidence of unbounded-model validity.
- The source Theorem 1 is worded as a universal impossibility result for Winsorized conditionals, but
  independent constant-parameter Winsorized variables form a valid joint product. Its supplemental contradiction
  assumes nonzero interaction. Original calculations preserve that exception and separately show incompatibility
  of one symmetric log-mean interacting specification; the blanket impossibility statement is not adopted.
- The finite graph and the symmetric once-counted edge parameters must be specified. Independently fitted
  node regressions do not automatically agree on a compatible joint parameterization. Model definition,
  numerical estimation and graph selection are distinct.
- The source sketches l1-penalized neighborhood fitting, but explicitly leaves extensions of statistical
  graph-recovery guarantees to future work. A model existence result is not a sparsistency theorem or
  a guarantee that a chosen approximate optimizer finds the intended fit.
- The reported network experiments are contextual evidence, not a universal performance guarantee. The
  processed breast-cancer microRNA data and cited biological associations do not establish causal regulation
  or clinical predictive validity. No author implementation, empirical fit or benchmark was reproduced.
