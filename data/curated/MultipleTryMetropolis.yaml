name: Multiple-try Metropolis
definition: A Metropolis sampling algorithm that selects a candidate from several weighted forward proposals,
  draws a backward reference set containing the original state, and corrects acceptance using the ratio
  of their total weights.
concept_kind: algorithm
identity_notes: This record covers Liu–Liang–Wong Section 2 finite-k MTM with one proposal kernel and
  a symmetric weight factor. It is not simple selection of the highest-density candidate, importance resampling
  without a correction, or the general auxiliary-variable extension in Section 3.1. No normalized match
  was found across all 442 pinned AIO labels/scoped synonyms and 175 prior native IDs/names/aliases. Full-checkout
  searches included ignored and hidden files in both worktrees; the only text hit was an unrelated installed-package
  checksum substring. Existing general Metropolis-Hastings, Metropolis-within-Gibbs and random-walk records
  were inspected to resolve these specialization boundaries.
limitations:
- Weight sums must be finite and usable. If all forward candidates have zero target weight, the transition
  can be completed by retaining x; weighted selection is not performed with a zero denominator.
- The number of proposals and target evaluations grows with k. Larger k does not imply universal improvement
  per unit computation or independent retained draws.
- The auxiliary-variable extension in Section 3.1 prints selection weights with an argument order inconsistent
  with Section 2 and its own acceptance expression. That extension is not asserted by this record.
- Target invariance under the stated construction does not alone establish irreducibility or a mixing
  rate.
