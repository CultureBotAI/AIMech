claims:
- claim_id: method
  kind: mechanism
  statement: Choose k≥1, a proposal T with T(a,b)>0 iff T(b,a)>0, and nonnegative symmetric lambda positive
    wherever T is positive. Define w(a,b)=pi(a)T(a,b)lambda(a,b). From current x, draw k independent yj
    from T(x,·), and select y with probabilities proportional to w(yj,x). Draw k−1 independent xj* from
    T(y,·), and append xk*=x. Accept y with min(1,sum_j w(yj,x)/sum_j w(xj*,y)); otherwise retain x. For
    k=1 the symmetric lambda cancels, recovering Metropolis-Hastings. Selection and the backward reference
    set are essential to this correction.
