id: AIMech:Kd3aKnowledgeDistillationBasedDecentralizedDomainAdaptation
name: KD3A (Knowledge Distillation Based Decentralized Domain Adaptation)
concept_kind: algorithm
review_status: DRAFT
definition: KD3A (Knowledge Distillation Based Decentralized Domain Adaptation) is an unsupervised multi-source decentralized domain adaptation algorithm that transfers knowledge from K private labeled source domains {D_S^k}_{k=1}^K to an unlabeled target domain D_T in one communication round per epoch without sharing source data by combining (1) Knowledge Vote, which filters source teacher predictions via a confidence gate g^{(t)}, selects a consensus class by summing confident predictions, and trains an extended student model h_S^{K+1} on support-weighted consensus distributions (p_i, n_{p_i}), (2) Consensus Focus, which weights each source model by its marginal contribution CF(D_S^k) = Q(S) - Q(S \ {D_S^k}) to total consensus quality Q(S) = sum_{X_i^T in D_T} n_{p_i}(S) max p_i(S), and (3) BatchNorm MMD, which aligns quadratic-kernel first and second feature moments across L BatchNorm layers using stored running-mean and running-variance parameters.
identity_notes: 'Introduced by Hao-zhe Feng, Zhaoyang You, Minghao Chen, Tianye Zhang, Minfeng Zhu, Fei Wu, Chao Wu, and Wei Chen in ''KD3A: Unsupervised Multi-Source Decentralized Domain Adaptation via Knowledge Distillation'' (ICML 2021, PMLR 139:3274-3283; arXiv:2011.09757). Distinct from FADA (Peng et al. ICLR 2020), which requires batch-level feature and gradient synchronization (100x higher communication cost) for adversarial domain alignment and K-means gap-statistics attention; and distinct from single-source hypothesis transfer SHOT (Liang et al. ICML 2020), which lacks multi-source Knowledge Vote, Consensus Focus marginal-contribution weighting, and BatchNorm MMD alignment.'
aliases:
- KD3A
- Knowledge Distillation Based Decentralized Domain Adaptation
- Unsupervised Multi-Source Decentralized Domain Adaptation via Knowledge Distillation
