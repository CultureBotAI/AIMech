claims:
- claim_id: kd3a-knowledge-vote-three-step-consensus-distillation
  kind: mechanism
  statement: For each unlabeled target instance X_i^T in D_T, Knowledge Vote (1) eliminates source teacher predictions q_S^k(X_i^T) whose maximum class confidence falls below gate g^{(t)}, (2) sums the remaining confident distributions to identify the consensus class c^* and discards teachers whose argmax disagrees with c^*, and (3) averages the n_{p_i} supporting teacher distributions into p_i to train the extended model h_S^{K+1} on D_S^{K+1} = {(X_i^T, p_i, n_{p_i})}_{i=1}^{N_T} via L^{kv}(X_i^T, q) = n_{p_i} D_KL(p_i || q(X_i^T)) (Equation 5), which minimizes the extended task risk epsilon_{D_S^{K+1}}(h) by Pinsker's inequality (Appendix A, Equation 1).
  evidence:
  - source_id: r520-primary-pdf
    locator: Section 3.1-3.2, Equations (3)-(5) and Figure 1(b), pages 3-4; Appendix A, page 9
    relation: supports
- claim_id: kd3a-consensus-focus-marginal-contribution-domain-weighting
  kind: mechanism
  statement: To suppress negative transfer from irrelevant or malicious source domains without accessing raw source data, Consensus Focus defines the consensus quality of any source coalition S' subseteq S as Q(S') = sum_{X_i^T in D_T} n_{p_i}(S') max p_i(S') (Equation 7), computes each source domain's marginal contribution CF(D_S^k) = Q(S) - Q(S \ {D_S^k}) (Equation 8), and assigns aggregation weights alpha_{K+1} = N_T / (sum_{k=1}^K N_k + N_T) and alpha_k^{CF} = (1 - alpha_{K+1}) (N_k CF(D_S^k)) / (sum_{j=1}^K N_j CF(D_S^j)) (Equation 9), achieving the tighter decentralized generalization bound of Theorem 2 and Proposition 2 (Equation 13).
  evidence:
  - source_id: r520-primary-pdf
    locator: Section 3.3 and Section 4, Equations (7)-(9) and (13), Theorem 2 and Proposition 2, pages 4-6
    relation: supports
- claim_id: kd3a-batchnorm-mmd-decentralized-moment-alignment
  kind: mechanism
  statement: BatchNorm MMD optimizes the quadratic-kernel MMD distance d_MMD^kappa(D_S^k, D_T) = ||E(pi_l^k) - E(pi_l^T)||_2^2 + ||E[pi_l^k]^2 - E[pi_l^T]^2||_2^2 (Equation 11) across L BatchNorm layers without accessing source data by reading E(pi_l^k) and E[pi_l^k]^2 = Var(pi_l^k) + [E(pi_l^k)]^2 from each uploaded source model's BatchNorm running-mean and running-variance statistics and either minimizing the weighted layer-wise loss (Equation 12) or substituting the closed-form optimal moments mu_op(pi_l^T) = sum_{k=1}^{K+1} alpha_k E(pi_l^k) and mu_op[pi_l^T]^2 = sum_{k=1}^{K+1} alpha_k E[pi_l^k]^2 (Appendix E, Equation 18).
  evidence:
  - source_id: r520-primary-pdf
    locator: Section 3.4, Equations (10)-(12), page 5; Appendix E, Equations (17)-(18), page 12
    relation: supports
- claim_id: kd3a-100x-communication-reduction-and-domainnet-benchmark-performance
  kind: application
  statement: Synchronizing models only once per epoch (r = 1), KD3A reduces communication rounds by 100x relative to FADA (r = 100) while improving average target accuracy from 41.5% (FADA*) and 48.7% (DAEL) to 51.1% on DomainNet (Table 1), from 80.8% (FADA*) to 92.0% on Digit-5 (Table 6), from 78.9% (FADA) to 83.1% on Amazon Review (Table 8), and from 87.1% (FADA) to 97.9% on Office-Caltech10 (Table 9).
  evidence:
  - source_id: r520-primary-pdf
    locator: Section 5.1-5.3, Tables 1-3, pages 6-9; Appendix F, Tables 6-9, pages 12-13
    relation: supports
