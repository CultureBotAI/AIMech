id: AIMech:ModelFreeRegressionFunctionalsReweightingDiagnosticAndXYBootstrapLimit
name: Model-free regression functionals, regressor-reweighting well-specification diagnostic, and M-of-N
  XY-bootstrap sandwich limit
concept_kind: mathematical_method
aliases:
- Models as Approximations II model-free theory of parametric regression (Buja, Brown, Kuchibhotla, Berk,
  George, & Zhao 2019)
- Regressor-only Gaussian reweighting diagnostic trace and bootstrap tilt test for well-specification
- Partial influence function IF(x_vec) = E_P[IF(Y, X_vec) | X_vec = x_vec] and Pythagorean CLT variance
  decomposition
definition: A general model-free theory and diagnostic framework for parametric and penalized regression
  estimators viewed as statistical functionals theta(P) of the joint response-regressor distribution P
  = P_{Y|X_vec} (x) P_{X_vec} on arbitrary measurable spaces (Buja, Brown, Kuchibhotla, Berk, George,
  & Zhao 2019). Encompassing optimization functionals theta(P) = argmin_theta E_P[L(theta; Y, X_vec)]
  (including maximum likelihood KL-divergence functionals, proper scoring rule Bregman-divergence functionals
  such as the Basu-Harris-Hjort-Jones density power divergence S_alpha with Fisher consistency and redescending
  influence functions for alpha > 0, and penalized functionals) and estimating-equation (EE) functionals
  solving E_P[psi(theta; Y, X_vec)] = 0 (Section 2, Equations 1-7, Appendix A.2), the framework defines
  theta(.) to be well-specified for P_{Y|X_vec} iff theta(P_{Y|X_vec} (x) P_{X_vec}) = theta(P_{Y|X_vec}
  (x) P'_{X_vec}) for all acceptable regressor distributions P_{X_vec}, P'_{X_vec} (Section 3.1, Propositions
  3.3.1-3.3.3). Because regressor-only reweighting P^w(dy, dx_vec) = w(x_vec) P(dy, dx_vec) with E_P[w(X_vec)]
  = 1 preserves P^w_{Y|X_vec} = P_{Y|X_vec} (Lemma 4.1), any well-specified functional satisfies theta(P^w)
  = theta(P) (Proposition 4.1), motivating the one-parameter Gaussian reweighting diagnostic trace xi
  |-> theta_hat_xi = theta(w_hat_xi(Z) P_hat) across interior deciles xi_(1) < ... < xi_(K) of a reweighting
  variable Z = f(X_vec) and the two-point bootstrap tilt test statistic d = theta_hat_{xi_(K)} - theta_hat_{xi_(1)}
  (Sections 4-5, Equations 8-9). Conditioning on the empirical regressor distribution P_hat_{X_vec} defines
  the conditional parameter theta(X) = theta(P_{Y|X_vec} (x) P_hat_{X_vec}) and decomposes the Total Estimation
  Offset theta_hat - theta(P) into the Noise Estimation Offset theta_hat - theta(X) and Approximation
  Estimation Offset theta(X) - theta(P) (Section 6, Propositions 6.4-6.5), governed by the full influence
  function IF(Y, X_vec) and partial influence function IF(x_vec) = E_P[IF(Y, X_vec) | X_vec = x_vec] (Equations
  10-11, Lemma 6.6), which vanishes iff theta(.) is well-specified (Proposition 6.6) and yields the orthogonal
  Pythagorean CLT variance split V_P[IF(Y, X_vec)] = E_P[V_P[IF(Y, X_vec) | X_vec]] + V_P[IF(X_vec)] (Section
  7, Corollary 7.1) and the exact M-of-N XY-bootstrap sandwich limit M^{1/2}(theta^*_M - theta_hat_N)
  ->^D N(0, AV[P_hat_N; theta(.)]) as M -> infty for fixed N (Section 8, Proposition 8.1, Corollary 8.1).
identity_notes: 'Distinct from AIMech:ModelRobustNonlinearityConsistentSandwichAndRAVSpecificationTest
  (Buja, Berk, Brown, George, Pitkin, Traskin, Zhao, & Zhang 2019, Part I, Statistical Science 34(4):523-544,
  arXiv:1404.1578v4, DOI:10.1214/18-STS693), which is restricted to ordinary least squares linear regression,
  adjusted-regressor slope identities, and the Ratio of Asymptotic Variances (RAV_j) test. Buja, Brown,
  Kuchibhotla, Berk, George, & Zhao (2019, Part II, Statistical Science 34(4):545-565, arXiv:1612.03257v2,
  DOI:10.1214/18-STS694) generalize the model-free theory to arbitrary optimization, proper scoring rule
  (Bregman / Basu-Harris-Hjort-Jones density power divergence), penalized, and estimating-equation regression
  functionals on general measurable spaces: proving pointwise characterization of well-specification (Propositions
  3.3.1-3.3.3), regressor-only reweighting invariance (Lemma 4.1, Proposition 4.1) and the Gaussian decile
  reweighting diagnostic trace and tilt test d = theta_hat_{xi_(K)} - theta_hat_{xi_(1)} (Sections 4-5),
  the partial influence function characterization IF(x_vec) = E_P[IF(Y, X_vec) | X_vec = x_vec] = 0 of
  well-specification (Lemma 6.6, Proposition 6.6) and Pythagorean CLT decomposition (Corollary 7.1), and
  the general Fréchet-differentiable functional M-of-N XY-bootstrap limit (Proposition 8.1, Corollary
  8.1).'
