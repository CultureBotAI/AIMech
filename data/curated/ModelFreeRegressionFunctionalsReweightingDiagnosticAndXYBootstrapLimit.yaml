    relation: supports
- claim_id: canonical-estimation-offset-partial-influence-function-and-pythagorean-clt
  kind: mechanism
  statement: Conditioning on the empirical regressor distribution P_hat_{X_vec} = 1/N sum_{i=1}^N delta_{X_vec_i}
    defines the conditional parameter theta(X) = theta(P_{Y|X_vec} (x) P_hat_{X_vec}) and decomposes the
    Total Estimation Offset theta_hat - theta(P) = [theta_hat - theta(X)] + [theta(X) - theta(P)] into
    the Noise Estimation Offset (which vanishes identically when Y = f(X_vec) is deterministic, Proposition
    6.5) and the Approximation Estimation Offset (which vanishes for all acceptable X iff theta(.) is
    well-specified, Proposition 6.4 and Corollary 6.4, pages 20-22). Defining the full influence function
    IF(y, x_vec) (Equation 10) and the partial influence function with respect to P_{X_vec}, IF(x_vec)
    = d/dt|_{t=0} theta(P_{Y|X_vec} (x) ((1-t)P_{X_vec} + t delta_{x_vec})) = E_P[IF(Y, X_vec) | X_vec
    = x_vec] (Equation 11, Lemma 6.6, page 22), Proposition 6.6 (proved in Appendix A.3, pages 33-34)
    proves that theta(.) is well-specified for P_{Y|X_vec} iff IF(x_vec) = 0 for all x_vec, and Section
    7.1 (pages 23-24, Corollary 7.1) establishes the asymptotically orthogonal CLT decomposition N^{1/2}(theta_hat
    - theta(X)) = N^{-1/2} sum_{i=1}^N (IF(Y_i, X_vec_i) - IF(X_vec_i)) + o_P(1) and N^{1/2}(theta(X)
    - theta(P)) = N^{-1/2} sum_{i=1}^N IF(X_vec_i) + o_P(1) with Pythagorean asymptotic covariance split
    V_P[IF(Y, X_vec)] = E_P[V_P[IF(Y, X_vec) | X_vec]] + V_P[E_P[IF(Y, X_vec) | X_vec]].
  evidence:
  - source_id: buja2019p2-pdf
    locator: Sections 6-7, Pages 20-25, Equations (10)-(12), Propositions 6.4-6.6, Corollary 6.4, Lemma
      6.6, Corollary 7.1; Appendix A.3, Pages 33-34
    relation: supports
- claim_id: frechet-differentiable-functional-m-of-n-xy-bootstrap-sandwich-limit
  kind: mechanism
  statement: Section 8 (pages 25-26, Proposition 8.1 and Corollary 8.1, proved in Appendix A.5, page 35)
    proves that for any regression functional theta(.) that is continuously Fréchet differentiable at
    a fixed empirical distribution P_hat_N with influence function IF_{P_hat_N}(y, x_vec) and non-singular
    empirical sandwich covariance matrix AV[P_hat_N; theta(.)] = V_{P_hat_N}[IF_{P_hat_N}(Y, X_vec)],
    drawing M bootstrap observations (Y^*_j, X_vec^*_j)_{j=1}^M i.i.d. from P_hat_N yields the M-of-N
    XY-bootstrap estimator theta^*_M = theta(P^*_M) satisfying M^{1/2}(theta^*_M - theta_hat_N) ->^D N(0,
    AV[P_hat_N; theta(.)]) as M -> infty for fixed N, so that the empirical Huber sandwich covariance
    estimator Lambda_hat^{-1} V_{P_hat_N}[psi(theta_hat_N; Y, X_vec)] (Lambda_hat')^{-1} is the exact
    infinite-M limit of M-of-N XY-bootstrap variance estimation.
  evidence:
  - source_id: buja2019p2-pdf
    locator: Section 8, Pages 25-26, Proposition 8.1, Corollary 8.1; Appendix A.5, Page 35
    relation: supports
