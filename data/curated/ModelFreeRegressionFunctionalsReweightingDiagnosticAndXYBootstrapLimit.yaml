claims:
- claim_id: proper-scoring-and-estimating-equation-regression-functionals-and-well-specification
  kind: mechanism
  statement: Given a joint response-regressor distribution P_{Y, X_vec} = P_{Y|X_vec} (x) P_{X_vec} on
    measurable spaces X, Y (Section 2.1, Equation 1), regression functionals are defined via optimization
    theta(P) = argmin_{theta in Theta} E_P[L(theta; Y, X_vec)] (Section 2.2, Equation 2)—including maximum-likelihood
    functionals minimizing KL divergence with L(theta; y, x_vec) = -log q(y|x_vec; theta) (Equation 3),
    proper scoring (PS) functionals minimizing Bregman divergences D(P, Q) = E_P[S(Y, Q)] - H(P) such
    as the Basu-Harris-Hjort-Jones (BHHJ) density power divergence family S_alpha(y, Q) = -q^alpha(y)/alpha
    + int q^{1+alpha} dmu / (1+alpha) for alpha != 0, -1 that satisfy Fisher consistency theta(Q_{Y|X_vec;
    theta_0} (x) P_{X_vec}) = theta_0 and exhibit redescending influence functions for alpha > 0 (Equation
    4, Appendix A.2, pages 31-33), and penalized functionals L_tilde = L + lambda R (Equation 5)—or via
    estimating equations E_P[psi(theta; Y, X_vec)] = 0 (Equation 6). Section 3 (pages 7-11, Propositions
    3.3.1-3.3.3, Appendix A.4, pages 34-35) defines theta(.) to be well-specified for P_{Y|X_vec} iff
    theta(P_{Y|X_vec} (x) P_{X_vec}) = theta(P_{Y|X_vec} (x) P'_{X_vec}) for all acceptable regressor
    distributions P_{X_vec}, P'_{X_vec}, and proves for EE functionals (Proposition 3.3.3) that theta(.)
    is well-specified with value theta_0 iff E_P[psi(theta_0; Y, X_vec) | X_vec = x_vec] = 0 for all x_vec
    in X.
  evidence:
