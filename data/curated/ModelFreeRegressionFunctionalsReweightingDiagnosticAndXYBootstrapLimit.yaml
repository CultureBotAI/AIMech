limitations:
- Invariance of a regression functional across a chosen one-parameter reweighting family w_xi(Z) for a
  specific reweighting feature Z = f(X_vec) is necessary but not sufficient for global well-specification
  across all acceptable regressor distributions P'_{X_vec}, because misspecification orthogonal to Z or
  cancelling across the chosen weights may remain undetected (Section 4.3, pages 13-14).
- Aggressive reweighting in the tails of the regressor distribution reduces the effective sample size
  and inflates the variance of theta_hat_xi, which is why the diagnostic restricts reweighting centers
  xi_(1) < ... < xi_(K) to interior deciles and pairs the trace with bootstrap spaghetti bands (Sections
  4.2-4.5, pages 12-15).
- 'Six minor typographical notes in arXiv:1612.03257v2 were identified and verified during full-text inspection:
  (1) Section 1 (page 4, line 23) prints ''boostrap estimators'' for ''bootstrap estimators''; (2) the
  Section 2.2 heading (page 6) prints ''EE Funtionals'' for ''EE Functionals''; (3) Section 6.2 (page
  21, second display box) prints ''E_P[psi(theta Y, X_vec)] = 0'' missing the semicolon after theta; (4)
  Section 7.1 (page 24, line 11) prints ''IF(Y, X_vec) - E_P[IF(Y, |X_vec)'' missing the second X_vec
  and closing bracket; (5) Section 8.1 Footnote 10 (page 25) prints ''at M grows'' for ''as M grows'';
  and (6) Appendix A.3 (page 34, line 5) prints ''is a shown in Proposition 6.6'' and Appendix A.4 heading
  prints ''Proof of Lemma 3.3.3'' when proving Proposition 3.3.3.'
- All 36 pages of the full-text PDF of Buja, Brown, Kuchibhotla, Berk, George, & Zhao (2019, Statistical
  Science 34(4):545-565, arXiv:1612.03257v2, DOI:10.1214/18-STS694) were read. Constructed numerical checks
  in research/discovery/model-free-regression-functionals-reweighting-diagnostic-boundaries.py verify
  (1) BHHJ density power divergence Fisher consistency and redescending influence functions (Section 2.2,
  Appendix A.2), (2) Lemma 4.1 and Proposition 4.1 regressor-reweighting invariance under well-specification
  vs. nonzero tilt statistic d under quadratic misspecification, (3) Propositions 6.4-6.6 and Corollary
  7.1 canonical Estimation Offset decomposition, noiseless Noise-EO vanishing, and exact L^2(P) orthogonality
  of Noise IF and Approximation IF, and (4) Proposition 8.1 / Corollary 8.1 convergence of M-of-N XY-bootstrap
  variance to the empirical sandwich covariance AV[P_hat_N; theta(.)].
