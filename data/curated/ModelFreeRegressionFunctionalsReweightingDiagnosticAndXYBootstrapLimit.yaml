- claim_id: regressor-only-reweighting-invariance-and-gaussian-decile-tilt-diagnostic
  kind: mechanism
  statement: Reweighting the joint distribution strictly by the regressors P^w_{Y, X_vec}(dy, dx_vec)
    = w(x_vec) P_{Y, X_vec}(dy, dx_vec) with w(x_vec) > 0 and E_P[w(X_vec)] = 1 preserves the conditional
    distribution P^w_{Y|X_vec} = P_{Y|X_vec} while changing the marginal regressor distribution to P^w_{X_vec}(dx_vec)
    = w(x_vec) P_{X_vec}(dx_vec) (Section 4.1, page 12, Lemma 4.1, Equation 8), so any functional theta(.)
    well-specified for P_{Y|X_vec} satisfies theta(P^w_{Y, X_vec}) = theta(P_{Y, X_vec}) (Proposition
    4.1). Sections 4.2-4.5 and Section 5 (pages 12-19, Equation 9) construct a one-parameter family of
    Gaussian reweighting kernels w_hat_xi(z_i) propto exp(-(z_i - xi)^2 / (2 gamma^2)) normalized to 1/N
    sum_{i=1}^N w_i = 1 with bandwidth gamma = alpha sigma_hat(Z) along a univariate reweighting feature
    Z = f(X_vec) evaluated at interior sample deciles xi_(1) < ... < xi_(K) (K = 9), plotting the empirical
    parameter trace xi |-> theta_hat_xi = theta(w_hat_xi(Z) P_hat) against bootstrap spaghetti bands and
    testing well-specification via the two-point tilt test statistic d = theta_hat_{xi_(K)} - theta_hat_{xi_(1)}.
  evidence:
  - source_id: buja2019p2-pdf
    locator: Sections 4-5, Pages 11-19, Equations (8)-(9), Lemma 4.1, Proposition 4.1
    relation: supports
  - source_id: buja2019p2-abs
