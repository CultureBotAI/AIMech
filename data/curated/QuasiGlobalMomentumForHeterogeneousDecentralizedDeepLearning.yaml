id: AIMech:QuasiGlobalMomentumForHeterogeneousDecentralizedDeepLearning
name: Quasi-Global Momentum for Heterogeneous Decentralized Deep Learning
concept_kind: algorithm
review_status: DRAFT
definition: A communication-free momentum acceleration mechanism for decentralized stochastic optimization (QG-DSGDm / QG-DSGDm-N / QG-DAdam) that replaces the locally biased gradient accumulation buffer of standard decentralized momentum with a quasi-global momentum buffer m_hat_i^(t) = mu * m_hat_i^(t-1) + (1 - mu) * d_i^(t) updated from the normalized difference d_i^(t) = (x_i^(t) - x_i^(t+1)) / eta between two consecutive gossip-synchronized local models, where x_i^(t+1) = sum_{j in N_i^(t)} w_{ij} (x_j^(t) - eta * (beta * m_hat_j^(t-1) + g_j^(t))).
identity_notes: Introduced by Tao Lin, Sai Praneeth Karimireddy, Sebastian U. Stich, and Martin Jaggi (ICML 2021, PMLR Vol. 139, pp. 6654-6665; arXiv:2102.04761). Distinct from SlowMo (Wang et al., ICLR 2020), which performs periodic global All-Reduce synchronization every tau >> 1 steps and never feeds the slow momentum buffer back into local gradient steps; distinct from MimeLite (Karimireddy et al., 2020), which computes full-batch gradients at a central server in federated learning; and distinct from DMSGD (Balu et al., 2020), which forms a non-recursive convex combination of local and consensus step differences.
aliases:
- Quasi-Global Momentum
- QG-DSGDm
- QG-DSGDm-N
- Quasi-Global Decentralized Momentum SGD
