- target: AIO:FederatedLearning
  relation: related_match
  rationale: AIO:FederatedLearning covers collaborative training across heterogeneous client datasets, whereas Quasi-Global Momentum (QG-DSGDm) is a serverless decentralized gossip momentum algorithm that tracks consecutive synchronized model differences.
limitations:
- Theoretical non-convex convergence proof imposes a small-momentum condition beta / (1 - beta) <= rho / 21.
- Does not completely eliminate the O(zeta / (rho * epsilon^(3/2))) heterogeneity drift term when step sizes are large.
