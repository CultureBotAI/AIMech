claims:
- claim_id: qg-momentum-consecutive-synchronized-model-difference-buffer-mechanism
  kind: mechanism
  statement: At each step t, worker i takes a local step x_i^(t+1/2) = x_i^(t) - eta * (beta * m_hat_i^(t-1) + g_i^(t)), performs neighbor gossip averaging x_i^(t+1) = sum_{j in N_i^(t)} w_{ij} x_j^(t+1/2), and updates its quasi-global momentum buffer via m_hat_i^(t) = mu * m_hat_i^(t-1) + (1 - mu) * (x_i^(t) - x_i^(t+1)) / eta without transmitting any additional momentum vectors across the network; in the single-worker case (n = 1, W = [1]), this update algebraically recovers Quasi-Hyperbolic Momentum (QHM) with effective parameter beta_hat = mu + (1 - mu)*beta.
  evidence:
  - source_id: r553-primary-pdf
    locator: Section 3.2 Algorithm 1, Section 4.2, & Appendix B.3.1 Equation (5), pp. 4, 6, 19
    relation: supports
- claim_id: qg-momentum-linear-speedup-nonconvex-convergence-scope
  kind: scope
  statement: Under L-smoothness, bounded local variance sigma^2, inter-worker heterogeneity zeta^2, and doubly-stochastic mixing spectral gap rho, QG-DSGDm converges on non-convex objectives in T = O(L * sigma^2 / (n * epsilon^2) + L * zeta_tilde / (rho * epsilon^(3/2)) + L / epsilon * (1 / rho + 1 / ((1 - mu)*(1 - beta)^2))) iterations, achieving optimal O(sigma^2 / (n * epsilon^2)) linear speedup independent of 1 / (1 - beta).
  evidence:
  - source_id: r553-primary-pdf
    locator: Section 3.3 Theorem 3.1 & Appendix C Theorem C.7, pp. 5, 22-29
    relation: supports
- claim_id: qg-momentum-heterogeneity-drift-and-batchnorm-sensitivity-limitation
  kind: limitation
  statement: Unlike gradient-tracking or RelaySum methods, QG-DSGDm retains a second-order heterogeneity drift term O(L * zeta_tilde / (rho * epsilon^(3/2))) that depends on zeta^2 and the spectral gap rho, and requires replacing standard Batch Normalization with Group Normalization or EvoNorm on highly non-IID data.
  evidence:
  - source_id: r553-primary-pdf
    locator: Section 3.3 Theorem 3.1, Section 5.1-5.2, & Table 1, pp. 5, 7-8
    relation: supports
- claim_id: qg-momentum-heterogeneous-vision-and-nlp-decentralized-training-application
  kind: application
  statement: Applied to heterogeneous decentralized training of ResNet-20/18 (with BN, GN, and EvoNorm) and VGG-11 on CIFAR-10, ImageNet-32, and ImageNet, and QG-DAdam fine-tuning of DistilBERT on AG News over Ring, Social Network, and time-varying directed exponential topologies.
  evidence:
  - source_id: r553-primary-pdf
    locator: Section 5.2 Results, Tables 1-6, pp. 7-9
    relation: supports
