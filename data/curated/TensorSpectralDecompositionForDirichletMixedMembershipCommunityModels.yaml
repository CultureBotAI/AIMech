claims:
- claim_id: dirichlet-moment-centering-of-cross-partition-adjacency-and-3-star-subgraph-tensors
  kind: mechanism
  statement: In an $n$-vertex Mixed Membership Stochastic Blockmodel with $k$ communities, community connectivity matrix $P \in [0, 1]^{k \times k}$, and node membership vectors $\pi_u \stackrel{\text{i.i.d.}}{\sim} \operatorname{Dir}(\alpha)$ ($\alpha_0 = \sum_{i=1}^k \alpha_i$, $\widehat{\alpha} = \alpha / \alpha_0$) generating conditional Bernoulli adjacency $\mathbb{E}[G_{u,v} \mid \Pi] = \pi_u^\top P \pi_v$, partitioning vertices into disjoint sets $X, A, B, C$ and defining the $\alpha_0$-centered cross-adjacency matrix $G^{\alpha_0}_{X,A} = \sqrt{\alpha_0 + 1}\,G_{X,A} - (\sqrt{\alpha_0 + 1} - 1)\vec{1}\mu_{X \to A}^\top$ (Eq. 14) and $\alpha_0$-centered 3-star count tensor $\mathrm{T}^{\alpha_0}_{X \to \{A,B,C\}} = (\alpha_0 + 1)(\alpha_0 + 2)\mathrm{T}_{X \to \{A,B,C\}} + 2\alpha_0^2 \mu_{X \to A} \otimes \mu_{X \to B} \otimes \mu_{X \to C} - \frac{\alpha_0(\alpha_0 + 1)}{|X|} \sum_{i \in X}[G_{i,A}^\top \otimes G_{i,B}^\top \otimes \mu_{X \to C} + G_{i,A}^\top \otimes \mu_{X \to B} \otimes G_{i,C}^\top + \mu_{X \to A} \otimes G_{i,B}^\top \otimes G_{i,C}^\top]$ (Eq. 15) algebraically cancels the negative Dirichlet simplex correlations across communities so that $\mathbb{E}[(G^{\alpha_0}_{X,A})^\top \mid \Pi_A, \Pi_X] = F_A \operatorname{Diag}(\widehat{\alpha}^{1/2}) \Psi_X$ with $F_A = \Pi_A^\top P^\top$ and $\frac{1}{|X|}\mathbb{E}_{\Pi_X}[\Psi_X \Psi_X^\top] = I_k$ (Eqs. 16, 18), and the conditional expectation of $\mathrm{T}^{\alpha_0}_{X \to \{A,B,C\}}$ has rank-$k$ canonical polyadic form proportional to $\sum_{i=1}^k \widehat{\alpha}_i (F_A)_i \otimes (F_B)_i \otimes (F_C)_i$ (Proposition 2.2, Eq. 17; Proposition C.2, Eq. 96).
  evidence:
  - source_id: aghk2014-tensor-mmsb-pdf
    locator: Section 2, pp. 9-16, Equations (6)-(18), Propositions 2.1-2.2; Appendix C, pp. 68-69, Propositions C.1-C.2, Equations (94)-(96)
    relation: supports
- claim_id: five-way-partition-whitening-neighborhood-adaptive-deflation-tensor-power-and-q-pseudoinverse-recovery
  kind: mechanism
  statement: Given a 5-way vertex partition $(X, Y, A, B, C)$ of size $\Theta(n)$, computing rank-$k$ SVDs $|X|^{-1/2}(G^{\alpha_0}_{X,A})^\top_{k\text{-svd}} = \hat{U}_A \hat{D}_A \hat{V}_A^\top$, whitening matrices $\hat{W}_A = \hat{U}_A \hat{D}_A^{-1}$, and cross-partition alignment matrices $\hat{R}_{A,B} = |X|^{-1}\hat{W}_B^\top (G^{\alpha_0}_{X,B})^\top_{k\text{-svd}} (G^{\alpha_0}_{X,A})_{k\text{-svd}} \hat{W}_A$ on $X$ transforms the independent 3-star tensor on $Y$ into the whitened symmetrized $k \times k \times k$ tensor $\mathrm{T}^{\alpha_0}_{Y \to \{A,B,C\}}(\hat{W}_A, \hat{W}_B \hat{R}_{A,B}, \hat{W}_C \hat{R}_{A,C})$, whose population limit is the orthogonal symmetric tensor $\sum_{i=1}^k \lambda_i \Phi_i^{\otimes 3}$ with $\lambda_i = \widehat{\alpha}_i^{-1/2}$ and orthonormal $\Phi = W_A^\top F_A \operatorname{Diag}(\widehat{\alpha}^{1/2})$ (Lemma 3.1, Eqs. 21-22, pp. 17-18). Initializing Procedure 2 with whitened vertex neighborhood vectors $\{\hat{W}_A^\top G_{i,A}^\top\}_{i \notin A}$ and deflating previously recovered eigenpairs $(\hat{\lambda}_j, \hat{\phi}_j)$ only when $|\hat{\lambda}_j \langle \theta_t^{(\tau)}, \hat{\phi}_j \rangle| > \xi \ge 25\epsilon$ guarantees $\|\hat{\Phi}_i - \Phi_{\theta(i)}\|_2 \le 8\widehat{\alpha}_{\max}^{1/2}\varepsilon_T$ and $|\hat{\lambda}_i - \widehat{\alpha}_{\theta(i)}^{-1/2}| \le 5\varepsilon_T$ (Appendix A Theorem A.1 & Lemma A.1; Lemma 4.2), from which elementwise thresholding $\hat{\Pi}_{A^c} = \operatorname{Thres}(\operatorname{Diag}(\hat{\lambda})^{-1} \hat{\Phi}^\top \hat{W}_A^\top G_{A^c,A}^\top, \tau)$ (Eq. 24) and the row-normalized linear estimator $\hat{Q}^i = (\alpha_0 + 1)\frac{\hat{\Pi}^i}{\|\hat{\Pi}^i\|_1} - \frac{\alpha_0}{n}\vec{1}^\top$ (whose population counterpart $Q'$ satisfies $\mathbb{E}_\Pi[Q'\Pi^\top] = I_k$) reconstruct $\hat{P} = \hat{Q} G \hat{Q}^\top$ (Algorithm 1, Procedure 2, Section 3.3, pp. 20-25; Appendix B Lemmas B.1-B.3, pp. 46-49).
