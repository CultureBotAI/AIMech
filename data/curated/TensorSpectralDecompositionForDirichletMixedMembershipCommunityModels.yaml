id: AIMech:TensorSpectralDecompositionForDirichletMixedMembershipCommunityModels
name: Tensor Spectral Decomposition of Centered 3-Star Graph Moments for Dirichlet Mixed-Membership Community Models
review_status: DRAFT
concept_kind: algorithm
aliases:
- Tensor Spectral Approach to Mixed Membership Stochastic Blockmodels (MMSB)
- Anandkumar-Ge-Hsu-Kakade Centered 3-Star Tensor Community Detection
- Five-Way Partition Whitened Tensor Power Method for Dirichlet MMSB
- Dirichlet Moment-Centered Subgraph Count Tensor Decomposition
definition: Tensor Spectral Decomposition of Centered 3-Star Graph Moments for Dirichlet Mixed-Membership Community Models is a guaranteed polynomial-time spectral and tensor moment method introduced by Anandkumar, Ge, Hsu, and Kakade (2014, Journal of Machine Learning Research 15(66):2239-2312, arXiv:1302.2684v4) for learning the community connectivity matrix $P \in [0, 1]^{k \times k}$ and fractional vertex membership vectors $\Pi = [\pi_1 | \dots | \pi_n] \in \Delta^{k-1 \times n}$ in a Mixed Membership Stochastic Blockmodel (MMSB) with Dirichlet prior $\pi_u \stackrel{\text{i.i.d.}}{\sim} \operatorname{Dir}(\alpha)$ ($\alpha_0 = \sum_{i=1}^k \alpha_i$, $\widehat{\alpha} = \alpha / \alpha_0$) generating conditional Bernoulli edges $\mathbb{P}[G_{u,v} = 1 \mid \Pi] = \pi_u^\top P \pi_v$. Partitioning the vertices into five disjoint sets $(X, Y, A, B, C)$, the method forms $\alpha_0$-centered cross-partition adjacency matrices $G^{\alpha_0}_{X,A} = \sqrt{\alpha_0 + 1}\,G_{X,A} - (\sqrt{\alpha_0 + 1} - 1)\vec{1}\mu_{X \to A}^\top$ and $\alpha_0$-centered 3-star count tensors $\mathrm{T}^{\alpha_0}_{Y \to \{A,B,C\}}$ that algebraically cancel off-diagonal Dirichlet simplex correlations so $\mathbb{E}[\mathrm{T}^{\alpha_0}_{Y \to \{A,B,C\}} \mid \Pi_A, \Pi_B, \Pi_C] \propto \sum_{i=1}^k \widehat{\alpha}_i (F_A)_i \otimes (F_B)_i \otimes (F_C)_i$ where $F_A = \Pi_A^\top P^\top$, whitens and symmetrizes the tensor using rank-$k$ SVDs on $X$, extracts community eigenpairs $(\hat{\lambda}_i, \hat{\Phi}_i)$ via neighborhood-initialized adaptive-deflation tensor power iteration, and reconstructs $\hat{\Pi}$ and $\hat{P} = \hat{Q} G \hat{Q}^\top$.
identity_notes: Checked against all 442 pinned AIO concepts and 650 maintained AIMech concepts. Distinct from `AIMech:OrthogonalTensorPowerMethodForLatentVariableModels` (Anandkumar, Ge, Hsu, Kakade, & Telgarsky 2014, JMLR 15:2773-2832), which analyzes general symmetric orthogonal tensor power iteration for exchangeable multi-view, GMM, ICA, and topic models where views are conditionally independent given a single node's latent state, whereas in MMSB networks every edge $G_{u,v}$ couples TWO vertices' Dirichlet membership vectors $\pi_u$ and $\pi_v$, requiring 5-way vertex partitioning $(X, Y, A, B, C)$ for conditional independence, Dirichlet $\alpha_0$-centering of 3-star subgraph count tensors against cross-partition pair moments, neighborhood SVD initialization with adaptive threshold deflation, and the linear pseudo-inverse $\hat{Q}$ estimator for $\hat{P} = \hat{Q} G \hat{Q}^\top$. Also distinct from `AIMech:MixedMembershipStochasticBlockmodel` (Airoldi, Blei, Fienberg, & Xing 2008), which defines the generative model and nested variational EM inference without tensor spectral moment centering or polynomial-time $\ell_1$/$\ell_\infty$ recovery guarantees.
