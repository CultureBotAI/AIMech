- claim_id: finite-sample-l1-linf-error-bounds-zero-error-support-recovery-and-planted-clique-conditioning-barrier
  kind: scope
  statement: "In the homogeneous setting ($\\widehat{\\alpha}_i \\equiv 1/k$, $P_{ii} = p > P_{ij} = q$), when $n = \\tilde{\\Omega}(k^2(\\alpha_0 + 1)^2)$ and $\\frac{p - q}{\\sqrt{p}} = \\tilde{\\Omega}\\!\\left(\\frac{(\\alpha_0 + 1)k}{\\sqrt{n}}\\right)$, Algorithm 1 achieves with probability at least $1 - n^{-\\Omega(1)}$ (up to community permutation) per-node average $\\ell_1$ membership error $\\frac{1}{n}\\max_{i \\in [k]} \\|\\hat{\\Pi}^i - \\Pi^i\\|_1 = \\tilde{\\mathcal{O}}\\!\\left(\\frac{(\\alpha_0 + 1)^{3/2}\\sqrt{p}}{(p - q)\\sqrt{n}}\\right)$ and max-norm connectivity error $\\max_{i,j \\in [k]} |\\hat{P}_{i,j} - P_{i,j}| = \\tilde{\\mathcal{O}}\\!\\left(\\frac{(\\alpha_0 + 1)^{3/2}k\\sqrt{p}}{\\sqrt{n}}\\right)$ (Theorems 1.1 and 4.1, Eqs. 1-3, 29-32, pp. 3-4, 27), while Procedure 3 achieves zero-error support separation ($\\Pi(i,j) \\ge \\xi \\Rightarrow \\hat{S}(i,j) = 1$ and $\\Pi(i,j) \\le \\xi/2 \\Rightarrow \\hat{S}(i,j) = 0$ for $\\xi = \\Omega(\\varepsilon_P)$, Theorem 4.2, p. 28) and exact zero-error community recovery as $\\alpha_0 \\to 0$ (Corollary 4.1, p. 29). For general non-homogeneous models with $\\rho = \\frac{\\alpha_0 + 1}{\\widehat{\\alpha}_{\\min}}$ and conditioning parameter $\\zeta = \\left(\\frac{\\widehat{\\alpha}_{\\max}}{\\widehat{\\alpha}_{\\min}}\\right)^{1/2}\\frac{\\sqrt{\\max_i(P\\widehat{\\alpha})_i}}{\\sigma_{\\min}(P)}$ (Theorem 4.3, Eqs. 37-46, pp. 30-31), sensitivity of the second-order whitening step to $\\widehat{\\alpha}_{\\max} / \\widehat{\\alpha}_{\\min}$ creates an $s = \\tilde{\\Omega}(n^{2/3})$ barrier for a planted clique of size $s$ in an Erd\u0151s-R\xE9nyi graph (Section 4.2.1, Eqs. 49-50, pp. 32-33)."
