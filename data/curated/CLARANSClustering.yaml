claims:
- claim_id: method
  kind: mechanism
  statement: For n observations, supplied dissimilarities and 1<=k<n, represent a search state by k selected
    observations M. Assign each observation to a nearest medoid and define F(M)=sum_(x in X)min_(m in
    M)d(x,m), over all n observations. A neighboring state replaces one selected medoid with one unselected
    observation, giving k(n-k) possible neighbors. Begin a run at an arbitrary state. Sample a random
    neighbor; if its total cost is strictly lower, accept it and reset the unsuccessful-trial counter.
    Otherwise increment that counter. After maxneighbor unsuccessful trials at the current state, compare
    its cost with the best completed run and restart until numlocal runs have finished. Return the lowest-cost
    retained state. Swaps are judged by the full objective difference, including the observation whose
    medoid role is removed.
  evidence:
  - source_id: method-source
    locator: Sections 3.1–3.2, PDF pp. 4–5 (printed 147–148), graph objective and Algorithm CLARANS; Section
      2.1, PDF p. 3 (printed 146), cost cases and Equation (5)
    relation: supports
- claim_id: source-convention-check
  kind: limitation
  statement: 'Curator calculation: with observations {0,6,10,11}, absolute distance and medoids {0,10},
    swapping 0 for 6 increases the full cost from 5 to 7. Summing changes only over the old nonmedoids
    gives -4 and misses the removed medoid’s contribution +6. This demonstrates why the full graph-state
    objective, not that restricted sum, must govern acceptance. The exact calculation is saved in research/discovery/metric-source-boundaries.py.'
  evidence:
  - source_id: method-source
    locator: Section 3.1, PDF p. 4, defines cost over every object; Section 2.1, PDF p. 3, gives the cost
      contributions whose literal nonmedoid-only scope is tested by the curator.
    relation: supports
