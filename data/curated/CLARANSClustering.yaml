name: CLARANS clustering
definition: A randomized medoid-clustering algorithm that searches fixed-size sets of representative observations
  by accepting improving single swaps and restarting after a budget of unsuccessful neighbor trials.
concept_kind: algorithm
identity_notes: CLARANS searches the graph of all k-object medoid sets. It samples possible swaps at each
  state rather than confining all medoids to a fixed subsample as CLARA does, and differs from PAM’s exhaustive
  best-swap search. Medoids are actual observations, unlike k-means centroids. The record covers the original
  1994 clustering method, not its SD/NSD spatial data-mining wrappers or the expanded 2002 polygon-handling
  methods. No normalized identity match for this candidate was found across all 442 pinned AIO labels/scoped
  synonyms and 227 preceding native IDs/names/aliases. The same search identified BIRCH as an existing
  native record and excluded it from additions. Full-checkout word-delimited fixed-string searches included
  ignored and hidden files, with 79 worktree and 79 main-checkout matching lines; these concern BIRCH
  identity/proposal/review context and discovery leads. Ten exact AIO CLASS nodes with scoped synonyms
  and outgoing edges, and nine neighboring native records, were inspected.
limitations:
- A sampled unsuccessful-trial budget does not certify a local minimum over all possible swaps or a global
  optimum. The paper’s quoted local-minimum terminology is a stopping heuristic.
- The original pseudocode specifies a random neighbor but does not state a sampling-without-replacement
  rule or a particular probability law. This record does not add one, and it does not treat the trial
  counter as a count of distinct neighbors.
- Section 2.1 describes cost contributions for currently nonselected objects before Equation (5). Interpreting
  that literally as excluding every current medoid can omit the removed medoid’s new assignment cost.
  The full-objective definition in Section 3.1 is retained; an original finite calculation demonstrates
  the omission, not an author-issued erratum or executed implementation.
- The requested k, dissimilarity, initialization, trial budget and restart count affect the result. The
  paper’s experimental numlocal=2 and maxneighbor=max(250, 1.25% of k(n-k)) are experimental choices,
  not guarantees or identity requirements. No runtime or quality advantage is asserted.
