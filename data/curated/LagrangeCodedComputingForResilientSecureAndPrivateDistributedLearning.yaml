claims:
- claim_id: lcc-lagrange-polynomial-data-encoding-and-reed-solomon-composition-decoding
  kind: mechanism
  statement: LCC selects distinct field elements beta_1, ..., beta_{K+T} and alpha_1, ..., alpha_N (with {alpha_i} cap {beta_j}_{j=1}^K = empty when T > 0), encodes K dataset blocks and T uniform random masks via u(z) so worker i stores tilde{X}_i = u(alpha_i) (Equation 2), evaluates tilde{Y}_i = f(tilde{X}_i) locally, and decodes the degree-((K+T-1) deg(f)) composed polynomial f(u(z)) from N - S responses with up to A errors via Reed-Solomon syndrome decoding (Equation 4) to evaluate f(X_j) = f(u(beta_j)).
  evidence:
  - source_id: r537-primary-pdf
    locator: Section IV-B, Equation (2), p. 6; Appendix A-B, Algorithms 1-2 & Equation (4), pp. 10-11
    relation: supports
- claim_id: lcc-optimal-resiliency-security-privacy-tradeoff-theorems
  kind: scope
  statement: Theorem 1 and Lemma 2 prove that LCC is S-resilient, A-secure, and information-theoretically T-private (I(X; tilde{X}_T) = 0 for any |T| <= T via the MDS property of U^{bottom}) whenever (K + T - 1) deg(f) + S + 2A + 1 <= N, and Theorem 2 and Lemma 1 prove that LCC achieves the information-theoretically optimal recovery threshold R_{LCC}(N, K, f) + T deg(f) among all linear encoding schemes.
  evidence:
  - source_id: r537-primary-pdf
    locator: Section III, Theorems 1-2, p. 4; Section V, Lemma 1, p. 7; Appendix C, Lemma 2, p. 11
    relation: supports
- claim_id: lcc-polynomial-degree-scaling-and-vandermonde-conditioning-limitation
  kind: limitation
  statement: LCC applies directly only to computations expressible or approximated as multivariate polynomials of moderate degree deg(f) because the required recovery threshold scales linearly with (K + T - 1) deg(f), and real-valued Lagrange interpolation can suffer numerical conditioning errors unless embedded into a finite field F_q.
  evidence:
  - source_id: r537-primary-pdf
    locator: Section III-A, Table I, p. 5; Section VI, p. 8
    relation: supports
- claim_id: lcc-distributed-least-squares-linear-regression-gradient-application
  kind: application
  statement: Applied to straggler-resilient distributed gradient descent for least-squares linear regression (evaluating the degree-2 polynomial f(bar{X}_k) = bar{X}_k bar{X}_k^T w with recovery threshold R_{LCC} = 2 ceil(n/r) - 1) on Amazon EC2 clusters, achieving 6.79x-13.43x speedup over uncoded execution and 2.36x-4.29x over Gradient Coding.
  evidence:
  - source_id: r537-primary-pdf
    locator: Section VI, Figure 2, pp. 7-8; Appendix K, Tables II-IV, pp. 17-18
    relation: supports
