id: AIMech:LagrangeCodedComputingForResilientSecureAndPrivateDistributedLearning
name: Lagrange Coded Computing for Straggler-Resilient, Byzantine-Secure, and T-Private Distributed Polynomial Evaluation
concept_kind: algorithm
review_status: DRAFT
definition: A universal algebraic coded distributed computing framework proposed by Yu, Li, Raviv, Mousavi Kalan, Soltanolkotabi, and Avestimehr (AISTATS 2019) that evaluates an arbitrary multivariate polynomial f of degree deg(f) across K dataset batches (X_1, ..., X_K) with T-collusion information-theoretic data privacy, S-straggler resiliency, and A-Byzantine adversary security by encoding the K data batches and T uniform random noise masks (Z_{K+1}, ..., Z_{K+T}) via a degree-(K+T-1) Lagrange interpolation polynomial u(z), evaluating f(u(alpha_i)) on N workers, and decoding f(X_1), ..., f(X_K) via Reed-Solomon polynomial interpolation whenever (K + T - 1) deg(f) + S + 2A + 1 <= N.
identity_notes: Distinct from Gradient Coding for Straggler-Resilient Distributed Optimization (AIMech:GradientCodingForStragglerResilientDistributedOptimization, which linearly encodes partial gradients computed on uncoded replicated data blocks without data privacy or general polynomial universality) and from DRACO (AIMech:DracoByzantineResilientDistributedTrainingViaRedundantGradients, which treats gradient evaluation as a black-box function requiring a 2A + 1 multiplicative redundancy factor rather than a 2A additive worker overhead). Lagrange Coded Computing / LCC (Yu et al., AISTATS 2019, PMLR 89:1215-1225 / arXiv:1806.00939, Section III-IV, Theorems 1-2, Equation 2, pp. 4-6) fixes K + T distinct interpolation nodes beta_1, ..., beta_{K+T} in F_q and constructs the degree-(K+T-1) Lagrange polynomial u(z) = sum_{j=1}^K X_j prod_{k != j} (z - beta_k)/(beta_j - beta_k) + sum_{j=K+1}^{K+T} Z_j prod_{k != j} (z - beta_k)/(beta_j - beta_k), assigning worker i the single coded share tilde{X}_i = u(alpha_i). Each worker computes tilde{Y}_i = f(tilde{X}_i) = f(u(alpha_i)), an evaluation of a composed polynomial of degree at most (K + T - 1) deg(f), enabling the master to recover {f(X_j) = f(u(beta_j))}_{j=1}^K from any N - S responding workers with up to A Byzantine errors whenever N >= (K + T - 1) deg(f) + S + 2A + 1.
aliases:
- Lagrange Coded Computing
- LCC
- Lagrange Polynomial Coded Distributed Computing
