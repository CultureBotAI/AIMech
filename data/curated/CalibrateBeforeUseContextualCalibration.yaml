id: AIMech:CalibrateBeforeUseContextualCalibration
name: Calibrate Before Use Contextual Calibration
concept_kind: algorithm
review_status: DRAFT
definition: A data-free output-probability calibration method for zero-shot and few-shot in-context language models that counteracts majority label bias, recency bias, and common token bias by feeding content-free test inputs (such as 'N/A', '[MASK]', and the empty string '') into the full few-shot prompt context to estimate the model's biased prior output distribution p_hat_cf, and applying an affine vector-scaling transformation q_hat = softmax(W p_hat + b) with W = diag(p_hat_cf)^{-1} and b = 0 (or b = -p_hat_cf, W = I for open-vocabulary generation) so that content-free inputs yield uniform scores across candidate answers.
identity_notes: Distinct from statistical confidence calibration such as Temperature Scaling (Guo et al., ICML 2017, AIMech:TemperatureScaling), which requires a labeled validation set to align predicted confidence with empirical accuracy, and from Domain Conditional Pointwise Mutual Information (PMI_DC, Holtzman et al., EMNLP 2021, AIMech:PMIDCDomainConditionalPointwiseMutualInformation), which divides each open-ended hypothesis continuation by its unconditional probability under a short domain premise string rather than fitting a closed-set uniform affine transformation on content-free test inputs inside a few-shot prompt.
aliases:
- Calibrate Before Use
- Contextual Calibration
- Content-Free Input Contextual Calibration
- Contextual Calibration for Few-Shot Language Models
