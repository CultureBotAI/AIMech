claims:
- claim_id: r728-claim-three-in-context-biases
  kind: mechanism
  statement: 'Few-shot in-context learning in autoregressive LMs (GPT-2 and GPT-3) suffers severe accuracy variance across prompt formats, training example selections, and permutations (e.g., 4-shot SST-2 accuracy varying from 54.3% to 93.4% across permutations of the same four examples) due to three systematic biases that shift the output distribution: majority label bias toward frequent prompt labels, recency bias toward labels near the end of the prompt, and common token bias toward label words frequent in pretraining data (r = 0.67 correlation on DBPedia).'
  evidence:
  - source_id: r728-primary-pdf
    locator: Section 3 & Section 4, Figures 2-5, Table 2, pp. 3-5, 11
    relation: supports
- claim_id: r728-claim-content-free-uniform-scaling
  kind: mechanism
  statement: By averaging the model's output probability distribution p_hat_cf over an ensemble of content-free inputs ('N/A', '[MASK]', and '') slotted into the test placeholder of the exact few-shot prompt and setting W = diag(p_hat_cf)^{-1}, b = 0 for classification (or b = -p_hat_cf, W = I for first-token generation), Contextual Calibration forces content-free predictions to be uniform without requiring any labeled validation examples.
  evidence:
  - source_id: r728-primary-pdf
    locator: Section 5 & Section 5.2, Equation 1, Figure 8, Table 3, pp. 5, 7-8, 11
    relation: supports
- claim_id: r728-claim-gpt2-gpt3-accuracy-application
  kind: application
  statement: Across text classification (AGNews, TREC, CB, RTE, SST-2, DBPedia), fact retrieval (LAMA), and slot-filling information extraction (MIT Movies, ATIS) on GPT-2 XL (1.5B) and GPT-3 (2.7B, 13B, 175B), Contextual Calibration improves mean and worst-case accuracy by up to 30.0% absolute, eliminates the 0-shot-to-1-shot accuracy drop on three of four datasets, and approaches validation-tuned oracle diagonal calibration.
  evidence:
  - source_id: r728-primary-pdf
    locator: Section 5.1-5.2, Table 1, Figures 1, 6, 7, and 8, Table 4, pp. 2, 6-8, 12
    relation: supports
- claim_id: r728-claim-first-token-and-fixed-option-limitation
  kind: limitation
  statement: For generation tasks, Contextual Calibration only calibrates the probability distribution of the first generated output token and requires switching from multiplicative diagonal scaling W = diag(p_hat_cf)^{-1} to additive bias subtraction b = -p_hat_cf over the ~50,000-token vocabulary, and its accuracy remains sensitive to the choice of content-free input string (e.g., 'the' or 'abc' underperforming the 'N/A', '[MASK]', '' ensemble by up to 9.9 points).
  evidence:
  - source_id: r728-primary-pdf
    locator: Section 5 (Footnotes 6-8) & Appendix A, Table 3, pp. 5, 11
    relation: supports
