id: AIMech:GcflPlusGradientSequenceDynamicTimeWarpingClusteredFederatedGraphClassification
name: GCFL+ (Gradient Sequence Dynamic Time Warping Clustered Federated Graph Classification)
concept_kind: algorithm
review_status: DRAFT
definition: GCFL+ is a dynamic clustered federated graph classification algorithm for clients holding structure- and feature-heterogeneous (non-IID) graph datasets that tracks a multi-variate time-series matrix Q in R^{n x d} of each client's GNN gradient norms ||Delta theta_i^t|| over the latest d communication rounds and, whenever a cluster's weighted mean gradient norm falls below a stationarity threshold (delta_mean < varepsilon_1) while its maximum client gradient norm exceeds a heterogeneity threshold (delta_max > varepsilon_2), computes a pairwise Dynamic Time Warping (DTW) distance matrix beta_k(p, q) = dist(Q(p, :), Q(q, :)) and recursively bi-partitions the cluster via the Stoer-Wagner minimum cut algorithm.
identity_notes: Introduced by Han Xie, Jing Ma, Li Xiong, and Carl Yang in 'Federated Graph Classification over Non-IID Graphs' (NeurIPS 2021, pages 18839-18852; arXiv:2106.13423). Extends vanilla GCFL (Section 4 of the same paper), which bi-partitions client clusters using single-round gradient cosine similarities and is vulnerable to fluctuating GNN gradient norms across rounds; distinct from Euclidean Clustered Federated Learning (CFL, Sattler et al. 2020), which does not track multi-round DTW gradient-norm sequences or analyze GNN Laplacian/feature perturbation bounds; and distinct from FedSage+ (Zhang et al. NeurIPS 2021), which addresses node classification on disjoint subgraphs with missing links.
aliases:
- GCFL+
- GCFL Plus
- Graph Clustered Federated Learning Plus
- Gradient Sequence Dynamic Time Warping Clustered Federated Graph Classification
