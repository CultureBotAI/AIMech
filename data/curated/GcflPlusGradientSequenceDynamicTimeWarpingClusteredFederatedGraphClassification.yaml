claims:
- claim_id: gcfl-plus-stationarity-and-heterogeneity-bipartition-criteria
  kind: mechanism
  statement: At each communication round t, GCFL and GCFL+ evaluate for each client cluster C_k whether the weighted average GNN update norm approaches a stationary point, delta_mean = ||sum_{i in [n]} (|G_i|/|G|) Delta theta_i|| < varepsilon_1 (Equation 4), while individual client updates remain divergent, delta_max = max(||Delta theta_i||) > varepsilon_2 > 0 (Equation 5), triggering top-down cluster bi-partitioning C_k -> {C_{k1}, C_{k2}} via the Stoer-Wagner minimum cut algorithm and maintaining cluster-specific GNN parameters theta_k^{t+1} = theta_k^t + sum_{i in [n_k]} Delta theta_{k,i}^t (Equation 7).
  evidence:
  - source_id: r514-primary-pdf
    locator: Section 4.3, Equations (4)-(7), pages 5-6
    relation: supports
- claim_id: gcfl-plus-dtw-gradient-norm-sequence-distance-matrix
  kind: mechanism
  statement: To overcome single-round GNN gradient-norm fluctuations in vanilla GCFL (Figure 1a), the server in GCFL+ maintains a rolling time-series matrix Q in R^{n x d} of client gradient norms ||Delta theta_i^t|| over a window of length d (optionally standardized via Q'(i, :) = Q(i, :) / std(Q(i, :)), Equation 20) and computes the cluster pairwise distance matrix beta_k(p, q) = dist(Q(p, :), Q(q, :)) using Dynamic Time Warping (DTW, Equation 8) to drive Stoer-Wagner bi-partitioning.
  evidence:
  - source_id: r514-primary-pdf
    locator: Section 5.1-5.2, Figure 1 and Equation (8), page 7; Appendix D, Equation (20), page 17
    relation: supports
- claim_id: gcfl-plus-bourgain-sgc-structure-and-feature-gradient-bounds
  kind: mechanism
  statement: Using Bourgain's metric embedding theorem (Theorem 4.1) on Simple Graph Convolutions f(L, X) = softmax(L^K X Theta) with normalized Laplacian L = D_tilde^{-1/2} A_tilde D_tilde^{-1/2}, Propositions 4.1-4.3 prove that the squared weight difference ||Theta' - Theta||_2^2 is upper-bounded by the graph structure perturbation ||L' - L||_2^2 <= epsilon_L (Equation 12), the node feature perturbation ||X' - X||_2^2 <= epsilon_X (Equation 16), and the task embedding perturbation ||Y_i - Y_j||_2^2 <= epsilon_Y (Equation 19), theoretically justifying that GNN gradient clustering reduces intra-cluster graph structure and feature heterogeneity.
  evidence:
  - source_id: r514-primary-pdf
    locator: Section 4.4, Theorem 4.1 and Propositions 4.1-4.3, page 6; Appendix B, Equations (9)-(19), pages 15-16
    relation: supports
- claim_id: gcfl-plus-threshold-tuning-and-unencrypted-gradient-limitation
  kind: limitation
  statement: GCFL+ requires offline validation tuning of the stopping and splitting thresholds (varepsilon_1, varepsilon_2) (where overly large varepsilon_2 collapses to single-cluster FedAvg and overly small varepsilon_2 fragments clients into singleton clusters), and transmits unencrypted client GNN gradients without formal differential privacy or cryptographic aggregation.
  evidence:
  - source_id: r514-primary-pdf
    locator: Section 6.2, pages 8-9; Section 7, page 10
    relation: supports
