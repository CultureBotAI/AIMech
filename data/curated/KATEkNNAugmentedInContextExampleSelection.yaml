id: AIMech:KATEkNNAugmentedInContextExampleSelection
name: KATE kNN-Augmented In-Context Example Selection
concept_kind: algorithm
review_status: DRAFT
definition: A non-parametric in-context demonstration selection algorithm for pretrained language models that maps training instances and a test input into a shared vector space using a pretrained or task-fine-tuned sentence encoder, retrieves the k nearest training neighbors to the test input under Euclidean or cosine similarity, and concatenates those retrieved input-output pairs in distance-sorted order as the conditioning context for autoregressive prediction.
identity_notes: Distinct from datastore-interpolated language modeling such as kNN-LM and kNN-MT, which interpolate a language model's next-token output probability distribution with a non-parametric kNN distribution over cached hidden states, because KATE operates purely at the input prompt level using an external sentence encoder without accessing the target language model's internal hidden states or modifying its decoding distribution. Also distinct from LM-scored contrastive prompt retrieval (AIMech:EPREfficientPromptRetrievalForInContextLearning), which trains a custom bi-encoder using positive and hard-negative labels scored by the target language model itself.
aliases:
- KATE
- kNN-Augmented In-Context Example Selection
- KATE Nearest-Neighbor In-Context Demonstration Retrieval
