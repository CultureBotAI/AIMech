claims:
- claim_id: kate-sentence-encoder-knn-retrieval-mechanism
  kind: mechanism
  statement: Given a test query x_test and a training pool D_T = {(x_i, y_i)}, KATE encodes all inputs with a sentence encoder mu_theta, computes similarity scores s_i via negative Euclidean distance or cosine similarity, selects the top-k nearest neighbors ordered by distance, and concatenates their input-target pairs before x_test as the prompt for the frozen language model.
  evidence:
  - source_id: r734-primary-pdf
    locator: Section 2.3 & Algorithm 1, pp. 3-4
    relation: supports
- claim_id: kate-task-related-encoder-finetuning-mechanism
  kind: mechanism
  statement: "Fine-tuning the retrieval sentence encoder on semantically aligned tasks\u2014such as natural language inference and semantic textual similarity (NLI+STS-B) for open-domain question answering or domain-matched sentiment data\u2014improves the quality of retrieved in-context examples compared to unaligned encoders."
  evidence:
  - source_id: r734-primary-pdf
    locator: Section 3.1 & Section 4.1-4.3, pp. 4-7, Tables 4-7
    relation: supports
- claim_id: kate-nlu-and-nlg-benchmark-application
  kind: application
  statement: KATE is applied to few-shot sentiment transfer (SST-2 to IMDB), controlled table-to-text generation (ToTTo), and open-domain question answering (Natural Questions, WebQuestions, and TriviaQA) with GPT-3, substantially outperforming random demonstration sampling and standalone kNN majority voting.
  evidence:
  - source_id: r734-primary-pdf
    locator: Section 4.1-4.3, pp. 5-7, Tables 4, 5, and 7
    relation: supports
  - source_id: r734-metadata-cr
    locator: DBLP bibliographic record Jiachang Liu et al.
    relation: supports
- claim_id: kate-dissimilar-encoder-task-mismatch-limitation
  kind: limitation
  statement: When the sentence encoder is fine-tuned on an objective that diverges from the downstream task structure (such as applying an STS-B similarity encoder to table-to-text generation or sentiment transfer), KATE's downstream accuracy can degrade relative to an un-finetuned pretrained RoBERTa encoder.
  evidence:
  - source_id: r734-primary-pdf
    locator: Section 4.1 & Section 4.2, pp. 5-6, Tables 4-5
    relation: supports
