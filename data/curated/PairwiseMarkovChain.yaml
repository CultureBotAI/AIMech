aio_mappings:
- target: AIO:MarkovChain
  relation: broad_match
  rationale: The defining stochastic state is the complete pair Z_t=(X_t,Y_t), whose next-state law depends
    only on Z_t. The AIO Markov-chain family is broader than this hidden–observed joint-state construction;
    the mapping says nothing equivalent about either marginal.
- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: For a finite horizon the normalized joint-state chain has an acyclic directed factorization.
    Splitting each joint kernel by the probability chain rule also gives an ordered within-slice factorization
    without imposing causal semantics.
