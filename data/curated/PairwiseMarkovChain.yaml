name: Pairwise Markov chain
definition: A hidden-state sequence-model family in which the joint process of a hidden variable and its
  corresponding observation is first-order Markov, without requiring either marginal process to be Markov
  or observations to be conditionally independent given the hidden path.
concept_kind: model_family
identity_notes: Pairwise refers to the hidden–observed pair Z_t=(X_t,Y_t) at each position, not arbitrary
  pairwise potentials or a graph with two-node cliques. Classical memoryless-emission HMMs are a constrained
  special case. The concept is distinct from factorial hidden chains, input-conditioned HMMs, longer-lag
  contextual emissions, mixed-memory predecessor mixtures and pairwise Markov random fields on non-chain
  graphs. No normalized identity match was found across all 442 pinned AIO labels and all scoped synonyms
  and 388 preceding native IDs, names and aliases for the three selected concepts. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main, yielding 8 and 8 matched lines;
  all 8 unique contents were read. Hits are prior pending leads and primary-reference context, not records
  of these identities. All 78 semantic label/synonym hits and 22 fully annotated exact AIO CLASS nodes
  with outgoing edges were read. Twenty-six contextual YAMLs were byte-verified after prior full reading
  and three freshly read, totaling 22 generated and seven native contextual records. Short acronym identities
  were compared across the complete normalized record inventory. Absence is bounded to the pinned source,
  maintained collection and inspected semantic neighborhood.
limitations:
- A Markov joint process need not have Markov hidden or observed marginals. Conversely, a special parameter
  choice can make those marginals Markov; non-Markov behavior is permitted, not required by the definition.
- The source’s adjacent-marginal density ratios require mutually consistent marginals and valid support.
  Arbitrary pairwise tables cannot be inserted as if they were consistent marginals. A normalized initial
  law and transition kernels provide an explicit finite-horizon convention.
- The converse characterization in Proposition2.3 uses an additional symmetry hypothesis. It is not an
  unrestricted criterion for every hidden marginal to be Markov.
- The forward recurrence is used only for t=1,...,T-1; the printed index range beside Equation(3.3) does
  not correctly delimit that update. Posterior normalization requires positive observation evidence.
- Iterative conditional estimation is not automatically identical to EM and does not, by its name alone,
  establish likelihood monotonicity, identifiability or global convergence. Stationary parameterizations
  must preserve the consistency of their pair marginals.
- The primary experiments use specified synthetic chains and a noisy image whose scan is explicitly neither
  an exact HMC nor PMC. They do not show universal segmentation superiority, and no empirical result or
  author-code reproduction is curated.
