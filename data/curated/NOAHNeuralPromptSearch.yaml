id: AIMech:NOAHNeuralPromptSearch
name: NOAH (Neural Prompt Search)
concept_kind: algorithm
review_status: DRAFT
definition: A one-shot neural architecture search (NAS) parameter-efficient tuning methodology for large vision models that embeds Visual Prompt Tuning (VPT-Deep), Low-Rank Adaptation (LoRA), and Adapter modules into each Transformer block of a weight-entangled supernet and conducts parameter-constrained evolutionary search over per-module application depths and per-layer token lengths or bottleneck ranks for each downstream dataset.
identity_notes: Introduced by Yuanhan Zhang, Kaiyang Zhou, and Ziwei Liu (2022, arXiv:2206.04673; published in IEEE Transactions on Pattern Analysis and Machine Intelligence, vol. 47, no. 7, pp. 5268-5280). Distinct from UniPELT (Mao et al., ACL 2022; AIMech Round 693), which combines fixed-dimension Adapter, Prefix-Tuning, and LoRA submodules via continuous sigmoid gates in language models, and distinct from individual hand-crafted prompt modules (VPT, Adapter, LoRA). Both inherited (retraining-free) and retrained NOAH subnet deployment modes are covered within this record.
