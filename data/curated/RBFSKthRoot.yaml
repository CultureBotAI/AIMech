identity_notes: 'This record denotes the 2015 variant coupling heuristic factor w^((k-1)/k)
  to competitive-threshold factor w^(1/k). It is distinct from additive epsilon, histogram-controlled
  re-expansion, ordinary weighted A* and baseline RBFS as parameterized procedures.
  The source-local RBFSkthrt label is retained; endpoint coincidences and a shared
  w-quality bound do not establish aliases or identical visits. Nonnegative path cost,
  goal normalization, admissible heuristic and optimal-path frontier qualifications
  remain explicit, along with finite w>=1 and positive integer k. The formula modifies
  the continuation comparison rather than repeatedly scaling every recursive bound
  assignment. Current insertion context was reconciled at merged commit c222454fe2e2ce2b9be5fd78a01d47e9961d1f26:
  807 native and 442 pinned AIO records, 4,946 identity-field occurrences and 3,781
  normalized values. Four ignored- and hidden-inclusive roots returned 165 matching
  contents / 1,085 occurrences, all byte-identical to the bound prior readings; no
  candidate exact normalized identity collision was found. All 1,249 native and generated
  record files match that evidence. Earlier full 25-node / 92-edge AIO and native-neighbor
  readings are reused with attribution, not claimed as fresh whole-ontology review.
  Source tracking uses existing main 912 while preserving prior IE, main 6/7/822/911
  responsibilities and every historical source question.'
