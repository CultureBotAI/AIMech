definition: A bounded-suboptimal recursive best-first search variant that divides
  a quality budget w between a heuristic factor w^((k-1)/k) and a competitive-threshold
  factor w^(1/k), using the baseline recursive regeneration and backup organization
  under the source’s qualified frontier and cost assumptions.
definition_evidence:
- source_id: hatem2015
  locator: Author PDF p.3 / official p.1153, kth-root paragraph and Theorem 1; baseline
    Figure 1 on author p.2 / official p.1152
  relation: supports
concept_kind: algorithm
claims:
- claim_id: split-weight-and-threshold
  kind: mechanism
  statement: 'For a finite quality budget w>=1 and positive integer split choice k,
    the described variant uses f_prime(n)=g(n)+w^((k-1)/k)*h(n) and relaxes the competitive
    comparison to F(best)<=w^(1/k)*B. For k=2 the two factors are both sqrt(w): part
    of the budget weights the heuristic and part relaxes the competitive threshold.'
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, second variant paragraph and displayed
      generalization
    relation: supports
- claim_id: baseline-structure-with-modified-evaluation
  kind: mechanism
  statement: The proposal changes the baseline evaluation and the upper-bound comparison,
    while retaining the RBFS organization of conditional backed-up-value inheritance,
    best-child recursion and return-value backup using the modified evaluation. It
    does not instruct an implementation to multiply every recursive bound assignment
    repeatedly; the baseline finite-F and empty-successor conditions remain part of
    the scoped interpretation.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.2 / official p.1152, Figure 1; author p.3 / official p.1153,
      kth-root paragraph identifying line 9
    relation: supports
- claim_id: source-stated-quality-bound
  kind: scope
  statement: Theorem 1 states that the goal expanded by RBFS-kth-root is w-admissible
    with an admissible heuristic. Under the explicit nonnegative-path-cost, goal-normalization
    and optimal-path frontier premises used in its algebra, the two factors combine
    to bound the returned cost by w times optimal cost. This is a qualified report
    of the source theorem, without an independent implementation-correctness certification.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, Theorem 1 and proof
    relation: supports
- claim_id: parameter-and-optimal-endpoint
  kind: scope
  statement: For its stated w-quality guarantee, the source presents kth-root splitting
    without a separate epsilon or the additive variant’s post-first-goal branch-and-bound
    requirement. The choices w and k remain parameters. At w=1 both factors equal
    1, so the additional weighting and threshold relaxation disappear algebraically;
    the source’s emphasis on suboptimal search does not make that endpoint undefined.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, paragraph before Theorem 1; algebraic
      specialization of the displayed factors
    relation: supports
limitations:
- The printed theorem explicitly states heuristic admissibility; the complete algebra
  also uses a finite w>=1, positive integer k, nonnegative accumulated path costs,
  h(goal)=0 and a suitable optimal-path frontier witness. These are explicit interpretive
  premises here, not a claim that every one is printed in the theorem statement. Arbitrary
  negative-cost or incorrectly normalized-goal cases are outside the reported guarantee.
- The crucial comparison to an unresolved optimal-path frontier value is part of the
  source proof. Its preservation through all duplicate-handling, cycle, regeneration
  and tie cases is not independently certified by this draft. A bounded algebra check
  is not a full correctness, completeness or termination proof for arbitrary graphs.
- The method is described through changes to Figure 1 rather than its own complete
  listing. Root initialization, finite/infinite arithmetic, dead ends, tie handling
  and the propagation of uninflated competitive bounds require explicit conventions.
  Repeatedly multiplying every recursive bound assignment is not specified by the
  published line-9 modification.
- 'The method is not parameter-free: w and the split choice k remain. Its w=1 and
  k=1 algebraic specializations do not establish a global alias or a monotonic performance
  law; the source’s k=5 experimental choice is not a universal default or an automatic
  selection rule.'
- No O(N) regeneration-overhead theorem is attached to this variant. The histogram-controlled
  method’s extra values, distribution/count assumptions and Theorem 2 are a separate
  construction. Fewer backtracks or a better time/quality tradeoff on every domain
  is not guaranteed by the split formula.
- Depth-linear path/sibling storage assumes bounded branching and per-node data. Duplicate
  paths, cycles, heuristic/state storage and optional transposition tables need separate
  analysis; the Dockyard study’s unlimited table does not demonstrate a path-only
  total-memory bound.
- The unit-cost and square-root-cost puzzle and Dockyard observations use particular
  heuristics, k values and historical implementations. They do not establish universal
  or current-hardware speedups, and the paper’s anytime RBFS-versus-RBFS_CR figure
  is not a kth-root result. No algorithm or benchmark has been executed for this draft.
- The two 2015 PDF artifacts represent the same work despite byte and pagination differences.
  The 2024 ILBFS epsilon/RBFS_CR terminology, prior RBFS versions and exact code/experimental
  reproduction remain separate source questions; neither shared terminology nor endpoint
  coincidences justify merging kth-root with the additive or histogram variants.
