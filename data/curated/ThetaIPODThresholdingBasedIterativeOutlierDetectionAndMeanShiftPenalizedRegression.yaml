claims:
- claim_id: mean-shift-soft-ipod-huber-concomitant-equivalence-and-irrepresentable-barrier
  kind: mechanism
  statement: In the mean-shift outlier model $y = X\beta + \gamma + \varepsilon$, convex $\ell_1$-penalized estimation $\min_{\beta, \gamma} \left[\frac{1}{2}\|y - X\beta - \gamma\|_2^2 + \sum_{i=1}^n \lambda_i|\gamma_i|\right]$ (Soft-IPOD, using $\Theta_S(t; \lambda) = \operatorname{sign}(t)(|t| - \lambda)_+$) yields a stationary point $(\hat{\beta}, \hat{\gamma})$ only if $\hat{\beta}$ solves Huber's $M$-estimation score equation $X^\top \psi_H(y - X\hat{\beta}; \lambda) = 0$ with $\psi_H(t; \lambda) = t - \Theta_S(t; \lambda)$ and $\hat{\gamma} = \Theta_S(y - X\hat{\beta}; \lambda)$, while adding concomitant scale estimation $\min_{\beta, \gamma, \sigma > 0} \left[\frac{\|y - X\beta - \gamma\|_2^2}{2\sigma} + \frac{n - p}{2}\sigma + \sum_{i=1}^n \lambda_i|\gamma_i|\right]$ is algebraically identical to Huber's (1981) joint $(\beta, \sigma)$ concomitant $M$-estimator (Proposition 3, pp. 18-19; Appendix A.3, p. 30). However, whenever $|\mathcal{O}| \ge 2$ and $X \ne 0$, Soft-IPOD with any positive threshold vector $\lambda = [\lambda_1, \dots, \lambda_n]^\top$ fails to achieve zero false positives ($\operatorname{supp}(\hat{\gamma}) \subseteq \mathcal{O}$) in the noiseless limit $\sigma \to 0$ unless the design-and-sign-dependent irrepresentable condition $\|(I_n - H)_{(\mathcal{O}^c)}[(I_n - H)_{(\mathcal{O})}]^+ \operatorname{sign}(\gamma_{\mathcal{O}})\|_\infty \le 1$ is satisfied (Proposition 1, p. 9; Appendix A.1, pp. 26-29).
  evidence:
  - source_id: so2011-ipod-pdf
    locator: Section 2, pp. 4-10, Equations (2.1)-(2.9), Proposition 1; Section 4, pp. 17-20, Equations (4.1)-(4.6), Propositions 2-3; Appendices A.1 and A.3, pp. 26-30
    relation: supports
- claim_id: theta-ipod-penalty-construction-universal-convergence-and-redescending-m-duality
  kind: mechanism
  statement: 'Given any odd, nondecreasing, unbounded thresholding rule $\Theta(\cdot; \lambda)$ with threshold $\lambda > 0$, the threecouple construction $P_{\Theta}(t; \lambda) = \int_0^{|t|} (\sup\{s : \Theta(s; \lambda) \le u\} - u)\,du + q(t; \lambda)$ (with $q(t; \lambda) \ge 0$ vanishing on $\Theta(\mathbb{R}; \lambda)$) ensures that both Algorithm 1 ($\gamma^{(j)} \leftarrow \Theta(y - X\beta^{(j-1)}; \lambda^{(j)})$, $\beta^{(j)} \leftarrow (X^\top X)^{-1}X^\top(y - \gamma^{(j)})$) and the QR-accelerated Algorithm 2 ($\gamma^{(j)} \leftarrow \Theta(H\gamma^{(j-1)} + r_0; \lambda^{(j)})$ with $r_0 = (I_n - H)y$ and leverage-adjusted thresholds $\lambda_i^{(j)} = \lambda\sqrt{1 - h_i}\,\hat{\sigma}$) monotonically decrease the objective $F(\beta, \gamma) = \frac{1}{2}\|y - X\beta - \gamma\|_2^2 + \sum_{i=1}^n P_{\Theta}(\gamma_i; \lambda_i)$ ($F(\beta^{(j)}, \gamma^{(j)}) \ge F(\beta^{(j)}, \gamma^{(j+1)}) \ge F(\beta^{(j+1)}, \gamma^{(j+1)})$) and converge from any starting point $\gamma^{(0)} \in \mathbb{R}^n$ without stepsize line searches (Theorem 1, pp. 13-15; Appendix A.2, pp. 29-30). Furthermore, any limit point $(\hat{\beta}, \hat{\gamma})$ satisfies the two-stage $M$-estimation equation $X^\top \psi_{\Theta}(H\hat{\gamma} + (I_n - H)y; \lambda) = 0$ with effective score $\psi_{\Theta}(t; \lambda) = t - \Theta(t; \lambda)$ (Proposition 2, p. 18), so thresholding rules obeying $\Theta(t; \lambda) = t$ for $|t| \ge c\lambda$ ($c \ge 1$, such as hard thresholding $\Theta_H(t; \lambda) = t\mathbf{1}_{|t| > \lambda}$ with $P_{\Theta_H}(t; \lambda) = \frac{1}{2}(\lambda^2 - (\lambda - |t|)_+^2)$ or the discrete penalty $\frac{1}{2}\lambda^2 \mathbf{1}_{t \ne 0}$) correspond to redescending $\psi_{\Theta}$ functions that assign zero influence to gross outliers and recover exact clean-subset OLS on $y_{\mathcal{O}^c}$.'
  evidence:
  - source_id: so2011-ipod-pdf
    locator: Section 3, pp. 11-17, Algorithms 1-2, Equations (3.1)-(3.7), Theorem 1; Section 4, pp. 17-20, Proposition 2; Appendix A.2, pp. 29-30
    relation: supports
- claim_id: regression-scale-equivariance-and-high-dimensional-joint-sparse-tisp
  kind: mechanism
  statement: 'When combined with a regression- and scale-equivariant initial scale estimator $\hat{\sigma}(X, y)$ satisfying $\hat{\sigma}(XA, c(y + X\eta)) = |c|\hat{\sigma}(X, y)$ for nonsingular $A \in \mathbb{R}^{p \times p}$ (such as least trimmed squares), $\Theta$-IPOD initialized at $\gamma^{(0)} = 0$ is both regression- and scale-equivariant at every iteration $j \ge 1$: $\gamma^{(j)}(XA, c(y + X\eta)) = c\gamma^{(j)}(X, y)$ and $\beta^{(j)}(XA, c(y + X\eta)) = cA^{-1}(\beta^{(j)}(X, y) + \eta)$ (Proposition 4, p. 20; Appendix A.4, pp. 30-31). For high-dimensional $p > n$ regression with sparse coefficients $\beta$ and sparse outliers $\gamma$, augmenting the design matrix to $\tilde{X} = [X / \|\tilde{X}_2\|_2,\, I_n]$ and applying hybrid hard-ridge thresholding $\Theta_{HR}(t; \lambda, \eta) = \frac{t}{1 + \eta}\mathbf{1}_{|t| > \lambda}$ to $\beta$ alongside hard thresholding $\Theta_H(t; \lambda_\gamma)$ to $\gamma$ jointly recovers both sparse predictors and outlier locations (Section 6, Eq. 6.1, p. 24).'
  evidence:
  - source_id: so2011-ipod-pdf
    locator: Section 4, p. 20, Proposition 4; Section 6, p. 24, Equation (6.1); Appendix A.4, pp. 30-31
    relation: supports
