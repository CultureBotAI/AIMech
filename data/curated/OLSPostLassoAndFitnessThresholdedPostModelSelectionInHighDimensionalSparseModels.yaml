claims:
- claim_id: sparse-eigenvalue-sublinearity-and-lasso-shrinkage-lower-bound
  kind: mechanism
  statement: For the empirical Gram matrix $M = \mathbb{E}_n[x_i x_i']$ with maximal $k$-sparse eigenvalue $\phi(k) = \sup_{1 \le \|\delta\|_0 \le k} \frac{\delta' M \delta}{\|\delta\|_2^2}$, Lemma 3 (p. 11; Appendix A, p. 20) proves the subadditivity $\phi(k_1 + k_2) \le \phi(k_1) + \phi(k_2)$ and sublinearity $\phi(\ell k) \le \lceil\ell\rceil\phi(k)$ for all $\ell \ge 1$. While Theorem 1 (p. 12) shows that the first-stage Lasso achieves $\|\widehat{f}_{\mathrm{L}} - f\|_{2,n} \le \left(1 + \frac{1}{c}\right)\frac{\lambda\sqrt{s}}{n\,\kappa(s, c_0)} + 2c_s$ on the score-domination event $\lambda \ge c n\|S\|_\infty$ ($S = \frac{2}{n}\sum_{i=1}^n x_i\epsilon_i$, $c > 1$), Remark 3.1 (Equation 3.19, p. 13) proves that Lasso suffers a deterministic shrinkage lower bound $\|\widehat{f}_{\mathrm{L}} - f\|_{2,n} \ge \frac{\|\widehat{\beta}_{\mathrm{L}}\|_1}{\|f\|_{2,n}} \cdot \frac{(1 - 1/c)\lambda}{n} - c_s$ whenever $\lambda \ge c n\|S\|_\infty$, preventing Lasso from adapting to smaller noise or smaller true support without reducing $\lambda$ below the noise-domination threshold.
  evidence:
  - source_id: bc2013-postlasso-pdf
    locator: Section 3, pp. 10-11, Lemma 3; Section 4, pp. 12-13, Theorem 1, Remark 3.1, Equation (3.19); Appendix A, p. 20
    relation: supports
- claim_id: post-lasso-empirical-sparsity-bound-and-oracle-rate-without-model-selection-success
  kind: mechanism
  statement: By Theorem 3 (p. 14; Appendix C, pp. 21-23), on the event $\lambda \ge c n\|S\|_\infty$, the number of unthresholded false-positive covariates selected by Lasso is bounded by $|\widehat{T} \setminus T| \le s \cdot \min_{m \in \mathcal{M}} \phi(m)\,L_n$ where $L_n = \left[\frac{2\bar{c}}{\kappa(s, 2\bar{c})} + \frac{4n c_s}{\lambda\sqrt{s}}\right]^2$ and $\bar{c} = \frac{c+1}{c-1}$. Building on this sparsity control, Theorem 4 (p. 15; Appendix D, pp. 23-25) establishes that for any post-selection support $\widetilde{T}$ with $\widehat{m} = |\widetilde{T} \setminus T|$ and $k = |T \setminus \widetilde{T}|$, the OLS Post-Lasso estimator $\widetilde{\beta}_{\mathrm{PL}}$ satisfies $\|\widetilde{f}_{\mathrm{PL}} - f\|_{2,n} \le C\sigma\sqrt{\frac{\widehat{m}\log p + k\log(ep/k)}{n\,\kappa(k + \widehat{m})}} + c_s + \mathbf{1}\{\widehat{T} \not\supseteq T\}\sqrt{\left[\widehat{Q}(\widetilde{\beta}_{\mathrm{PL}}) - \widehat{Q}(\widehat{\beta}_{\mathrm{L}})\right]_+} + B_n\,\sigma\sqrt{\frac{s\log p}{n}}\frac{1}{\kappa(s, c_0)}$ with $B_n = \mathbf{1}\{T \not\subseteq \widetilde{T}\}$ (or $B_n = \mathbf{1}\{\widehat{T} \not\subseteq \widetilde{T}\}$).
  evidence:
  - source_id: bc2013-postlasso-pdf
    locator: Section 4, p. 14, Theorem 3; Section 5, pp. 15-17, Theorem 4, Corollaries 1-3; Appendices C and D, pp. 21-25
    relation: supports
- claim_id: fitness-thresholded-post-lasso-support-pruning-with-controlled-empirical-risk
  kind: mechanism
  statement: 'While naive coordinate thresholding $\widehat{T}_t = \{j : |\widehat{\beta}_{\mathrm{L},j}| > t\}$ can discard correlated signal variables and cause uncontrolled increases in empirical risk $\widehat{Q}(\widehat{\beta}_{\mathrm{PL}}(\widehat{T}_t)) - \widehat{Q}(\widehat{\beta}_{\mathrm{L}})$, the fitness-thresholded rule $t_\gamma = \min\{t \ge 0 : \widehat{Q}(\widehat{\beta}_{\mathrm{PL}}(\widehat{T}_t)) - \widehat{Q}(\widehat{\beta}_{\mathrm{L}}) \le \gamma\}$ (Equation 2.11, pp. 7-8) with tolerance $\gamma = O(\sigma^2 s\log p / n)$ guarantees by construction that $\widehat{Q}(\widehat{\beta}_{\mathrm{PL}}(\widehat{T}_{t_\gamma})) - \widehat{Q}(\widehat{\beta}_{\mathrm{L}}) \le \gamma$ while pruning spurious low-amplitude Lasso coordinates to reduce $\widehat{m}$ and achieve the Theorem 4 oracle bound.'
  evidence:
  - source_id: bc2013-postlasso-pdf
    locator: Section 2.2, pp. 7-8, Equations (2.10)-(2.11); Section 5, pp. 15-17, Theorem 4, Corollary 2
    relation: supports
