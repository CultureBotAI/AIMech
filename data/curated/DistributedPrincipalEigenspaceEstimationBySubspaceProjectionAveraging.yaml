claims:
- claim_id: claim-subspace-projection-averaging-consensus-and-variance-bound
  kind: mechanism
  statement: Given $m$ local top-$K$ eigenvector matrices $\widehat{\mathbf{V}}_K^{(\ell)} \in \mathcal{O}_{d \times K}$ ($\ell=1,\dots,m$), Lemma 6 proves that the top-$K$ eigenvector matrix $\widetilde{\mathbf{V}}_K$ of the averaged projection matrix $\widetilde{\boldsymbol{\Sigma}} = m^{-1}\sum_{\ell=1}^m \widehat{\mathbf{V}}_K^{(\ell)}\widehat{\mathbf{V}}_K^{(\ell)T}$ minimizes $\sum_{\ell=1}^m \rho^2(\mathbf{U}, \widehat{\mathbf{V}}_K^{(\ell)}) = 2mK - 2m\operatorname{Tr}(\mathbf{U}^T\widetilde{\boldsymbol{\Sigma}}\mathbf{U})$ over $\mathbf{U} \in \mathcal{O}_{d \times K}$, and under sub-Gaussian observations with effective rank $r = \operatorname{Tr}(\boldsymbol{\Sigma})/\lambda_1$ and $\kappa = \lambda_1/\Delta$ ($\Delta = \lambda_K - \lambda_{K+1}$), Theorem 1 proves that the sample variance component relative to the population mean projection eigenspace $\mathbf{V}_K^*$ of $\boldsymbol{\Sigma}^* = \mathbb{E}[\widehat{\mathbf{V}}_K^{(\ell)}\widehat{\mathbf{V}}_K^{(\ell)T}]$ satisfies $\|\rho(\widetilde{\mathbf{V}}_K, \mathbf{V}_K^*)\|_{\psi_1} \le C_1\kappa\sqrt{K r / N}$ where $N = mn$ (Sections 3 and 4.1, Lemmas 1, 5, 6, and Theorem 1).
  evidence:
  - source_id: fwwz2019-distpca-pdf
    locator: Section 3 (Algorithm 1, pp. 7-8), Section 4.1 (Lemma 1, Theorem 1, pp. 9-10), Section 8.2 (Lemmas 5-6, pp. 40-41)
    relation: supports
- claim_id: claim-symmetric-innovation-exact-unbiasedness-and-asymmetric-bias-rate
  kind: mechanism
  statement: When the standardized innovation $\mathbf{Z} = \boldsymbol{\Lambda}^{-1/2}\mathbf{V}^T\mathbf{X}$ satisfies reflection symmetry $\mathbf{Z} \stackrel{d}{=} (\mathbf{I}_d - 2\mathbf{e}_j\mathbf{e}_j^T)\mathbf{Z}$ for all $j \in [d]$ (Definition 4.1), Theorem 2 proves that $\mathbf{V}^T\boldsymbol{\Sigma}^*\mathbf{V}$ is diagonal so $\rho(\mathbf{V}_K^*, \mathbf{V}_K) = 0$ whenever $\|\boldsymbol{\Sigma}^* - \mathbf{V}_K\mathbf{V}_K^T\|_2 < 1/2$; for general asymmetric sub-Gaussian distributions, Lemma 2 establishes the deterministic linear projection expansion $\|\widehat{\mathbf{U}}\widehat{\mathbf{U}}^T - \mathbf{U}\mathbf{U}^T - (f(\mathbf{E}\mathbf{U})\mathbf{U}^T + \mathbf{U}f(\mathbf{E}\mathbf{U})^T)\|_F \le 24\sqrt{K}(\|\mathbf{E}\|_2/\Delta)^2$ where $f(\mathbf{A}) = \sum_{j=K+1}^d \mathbf{u}_j\mathbf{u}_j^T\mathbf{A}(\boldsymbol{\Lambda}_1 - \lambda_j\mathbf{I}_K)^{-1}$, whose linear term has zero expectation under $\mathbb{E}\mathbf{E} = \mathbf{0}$, proving $\rho(\mathbf{V}_K^*, \mathbf{V}_K) \le C_2\kappa^2\sqrt{K}r/n$ (Theorem 3) and $\|\rho(\widetilde{\mathbf{V}}_K, \mathbf{V}_K)\|_{\psi_1} \lesssim \sqrt{K}(\kappa\sqrt{r/N} + \kappa^2 r/n)$ (Theorem 4).
  evidence:
  - source_id: fwwz2019-distpca-pdf
    locator: Section 4.2 (Definition 4.1, Lemma 2, Theorems 2-4, pp. 11-15), Section 8.1 (Lemma 4, pp. 26-30), Section 8.2.5 (Lemma 8, pp. 42-43)
    relation: supports
- claim_id: claim-phase-transition-impossibility-and-heterogeneous-factor-extensions
  kind: scope
  statement: "In a spiked covariance model $\\boldsymbol{\\Sigma} = \\lambda\\mathbf{v}_1\\mathbf{v}_1^T + \\mathbf{I}_d$, Theorem 5 proves a sharp phase transition: if the local sample size falls below the Baik\u2013Ben Arous\u2013P\xE9ch\xE9 threshold $n \\le (d-1)/(3\\lambda)$, then $\\mathbb{P}(\\widetilde{\\mathbf{V}}_1 \\perp \\mathbf{V}_1) \\ge 1 - d^{-1}$ regardless of how large the number of machines $m$ is; above the threshold, Theorems 6 and 7 extend distributed subspace projection averaging to heterogeneous local covariances $\\boldsymbol{\\Sigma}^{(\\ell)}$ sharing a common top-$K$ eigenspace and to high-dimensional approximate factor models $\\mathbf{X}_i^{(\\ell)} = \\mathbf{B}\\mathbf{f}_i^{(\\ell)} + \\mathbf{u}_i^{(\\ell)}$ achieving rate $O((\\sqrt{1/N} + 1/n)(1 + \\sqrt{d}/\\psi_K) + \\sqrt{d}/(\\sqrt{N}\\psi_K^2))$ (Sections 4.2 and 5, Theorems 5, 6, and 7)."
  evidence:
  - source_id: fwwz2019-distpca-pdf
    locator: Section 4.2 (Theorem 5, pp. 14-15), Section 5 (Theorems 6-7, pp. 15-19), Section 8.1 (pp. 31-40)
    relation: supports
