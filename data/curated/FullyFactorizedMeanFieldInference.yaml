claims:
- claim_id: method
  kind: mechanism
  statement: For a fixed target p(s)=exp(F(s))/Z, choose q(s)=product_i q_i(s_i) and maximize E_q[F]+H(q),
    equivalently minimizing KL(q||p). For the source’s binary s_i in {-1,+1} and F(s)=sum_(i<j) J_ij*s_i*s_j+sum_i
    h_i*s_i, write q_i(s_i)=(1+m_i*s_i)/2. Distinct-variable moments factor as E_q[s_i*s_j]=m_i*m_j, and
    entropy is the sum of the binary factor entropies. Interior stationarity gives atanh(m_i)=h_i+sum_(j!=i)
    J_ij*m_j, with symmetric interaction indexing. Updating one mean to tanh of that effective field while
    holding the others fixed solves its coordinate subproblem. These equations characterize the chosen
    approximate inference problem; they do not compute the exact target marginals in general.
