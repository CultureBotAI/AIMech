claims:
- claim_id: rosa-rpca-additive-low-rank-sparse-decomposition
  kind: mechanism
  statement: RoSA decomposes the fine-tuning weight update around a frozen pretrained matrix W_0 into an additive sum W = W_0 + B A + S of a rank-r matrix product B A (with B in R^{m x r}, A in R^{r x n}) and a sparse matrix S in R^{m x n} supported on a fixed binary mask M of density d, capturing both dominant singular directions and unstructured outlier entries that violate a pure low-rank hypothesis.
  evidence:
  - source_id: r662-primary-pdf
    locator: 'Section 2.2 (Motivation: Robust Principal Component Analysis) & Section 3.1 (Formulation), pp. 3-4'
    relation: supports
- claim_id: rosa-gradient-warmup-mask-and-spmm-backward-kernel
  kind: mechanism
  statement: To construct the sparse support mask M and train S without incurring O(m n) dense weight-gradient memory overhead, RoSA runs a brief LoRA-only warm-up phase, accumulates full weight gradients one layer at a time via backward hooks to select the top-d fraction of coordinates by magnitude, and subsequently computes dL/dS restricted to M using a custom sparse-dense matrix multiplication (SpMM) kernel.
  evidence:
  - source_id: r662-primary-pdf
    locator: Section 3.2 (Mask Generation and System Implementation) & Algorithm 1, pp. 4-6
    relation: supports
- claim_id: rosa-application-complex-math-and-code-generation-peft
  kind: application
  statement: "Applied to LLaMA-2-7B and LLaMA-2-13B across mathematical reasoning (GSM8K) and code generation benchmarks at matched trainable parameter and memory budgets, RoSA substantially outperforms pure LoRA, pure sparse fine-tuning, and QLoRA\u2014including under 4-bit base-weight quantization (QRoSA)\u2014and closes the accuracy gap to full fine-tuning."
  evidence:
  - source_id: r662-primary-pdf
    locator: Section 4 (Experiments), Tables 1-4, pp. 6-8
    relation: supports
- claim_id: rosa-limitation-static-mask-and-unmerged-sparse-inference
  kind: limitation
  statement: Once the sparse mask M is fixed after the initial warm-up phase, coordinates outside M cannot enter the sparse support later in training, and when the base weights are quantized (QRoSA) the floating-point sparse adapter S cannot be folded directly into the 4-bit weights without dequantization or running a parallel sparse forward pass.
  evidence:
  - source_id: r662-primary-pdf
    locator: Section 3.2 (QRoSA and System Implementation) & Appendix, pp. 5-6
    relation: supports
