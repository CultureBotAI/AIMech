claims:
- claim_id: method
  kind: mechanism
  statement: For input x and leaf l, define w_l(x) as the product of normalized child-gate probabilities
    along the path to l. Then p(y|x)=sum_l w_l(x) p_l(y|x). In the two-level presentation, p(y|x)=sum_i
    g_i(x) sum_j g_(j|i)(x) p_ij(y|x), with softmax gates and generalized-linear conditional expert densities.
    The conditional output mean is the corresponding weighted sum of expert means. Given an observed y,
    leaf responsibilities are proportional to w_l(x) p_l(y|x); they condition on both x and y, unlike
    input-only gates. Conditional EM alternates these responsibilities with weighted expert fits and gate
    fits to soft multinomial targets; a lower gate’s objective is weighted by the posterior probability
    of reaching its parent. The paper uses IRLS inside those maximum-likelihood subproblems. Its separate
    Algorithm 2 instead regresses log responsibilities by least squares, and its online variant uses discounted
    recursive weighted least squares. Those surrogate procedures are approximations to the specified fitting
    approach.
