name: Hierarchical mixture of experts
definition: A conditional mixture-model family that organizes output experts as leaves of a tree and forms
  each leaf’s mixture weight by multiplying input-dependent probabilistic gates along its root-to-leaf
  path.
concept_kind: model_family
identity_notes: 'The inspected Jordan–Jacobs construction uses generalized-linear experts and softmax
  gates with shared external input, with a finite tree defining nested soft partitions. It is static conditional
  modeling, distinct from temporal hidden Markov decision trees, hard classification trees, hierarchical
  clustering and language-specific sparse MoE routing. A mixture density network shares conditional-mixture
  semantics but need not impose this tree factorization or generalized-linear leaf structure. Flattening
  a fixed tree gives leaf weights without making every flat gating parameterization the same hierarchical
  model. EM, IRLS and the online surrogate are fitting procedures, not the model identity. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 382 preceding native IDs/names/aliases
  for the four researched candidates. Both full-checkout fixed-string searches included ignored and hidden
  files, with 45 and 45 matching lines. All 31 unique matched contents were read: prior specialized inference
  records, source/review context and pending leads, not exact records for the three new identities. Expanded
  titles, source IDs, plural forms and complete/partial-factorizability terminology were included. All
  68 semantic label/synonym hits and 23 exact fully annotated AIO CLASS nodes with outgoing edges were
  read. Their generated YAMLs and seven native neighbors were read or byte-verified unchanged after prior
  complete reading, totaling 30 contextual records. The broader phrase structured variational inference
  is searched but not asserted as an unconditional alias of structured mean field. Boltzmann trees remains
  an unresolved full-text lead. Absence is bounded to the pinned vocabulary and inspected neighborhood.'
limitations:
- The source uses soft gates that mix expert densities; it does not require hard routing, top-k sparse
  activation, a language model or a causal interpretation of the decision hierarchy.
- Exact EM likelihood monotonicity requires a valid E-step and an M-step that increases the expected complete
  log likelihood under suitable regularity. It does not automatically apply to arbitrary gradient steps,
  the log-target least-squares surrogate or discounted online updates, and does not guarantee a global
  optimum.
- The logistic expert output is a Bernoulli probability, not log odds; printed p.184 is qualified by the
  explicit Bernoulli density on p.188. In Appendix B, the multinomial total is m=sum_i y_i; displayed
  n factors in Equation (6.2) and the following mean/log-partition expressions cannot be copied when n
  denotes the number of categories.
- Near-uniform gates average expert predictions, but a mixture of distinct expert densities need not become
  one generalized-linear density. Finite log-responsibility targets also require nonzero responsibilities.
- The robot simulation uses test-error stopping and selected successful comparison runs. No unbiased generalization
  comparison, universal performance advantage, author-code execution or benchmark reproduction is asserted.
