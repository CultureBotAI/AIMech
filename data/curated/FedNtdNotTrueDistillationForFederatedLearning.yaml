claims:
- claim_id: r458-not-true-softmax-and-out-local-kl-decomposition-mechanism
  kind: mechanism
  statement: Excludes the ground-truth class logit z_y from the temperature-scaled softmax normalization over the C - 1 non-true classes c != y (Equation 11), making dL_NTD/dz_y^l = 0 while decomposing the not-true KL divergence into an expectation weighted by the complementary out-local prior p_tilde_c = (1 - p_c) / (C - 1) (Proposition 2, Equation 14) that provably reduces inter-client gradient diversity Lambda(beta) on 0 <= beta <= C/2 - 1 (Proposition 1, Equation 9, Appendix P Equations 20-31).
  evidence:
  - source_id: r458-primary-pdf
    locator: Section 2.2 Proposition 1 (Equation 9), Section 3.1-3.2 Proposition 2 (Equations 10-14), and Appendices P-Q (Equations 20-41), pp. 4-6, 19-22
    relation: supports
- claim_id: r458-data-free-stateless-client-regularization-scope
  kind: scope
  statement: Applies to multi-class classification across stateless and stateful cross-device or cross-silo federated learning without requiring proxy datasets, generator networks, or extra communication payload beyond the standard global model parameters w^g.
  evidence:
  - source_id: r458-primary-pdf
    locator: Section 3.1 Federated Not-True Distillation (Algorithm 1, Table 1) & Section 4 Experiments, pp. 5-8
    relation: supports
- claim_id: r458-forward-teacher-inference-and-multiclass-requirement-limitation
  kind: limitation
  statement: Requires C >= 3 classes so the non-target class set {c != y} is non-trivial (C - 1 >= 2), and incurs an additional forward pass through the frozen global teacher model w^g on every local training mini-batch together with tuning of the distillation weight beta and temperature tau.
  evidence:
  - source_id: r458-primary-pdf
    locator: Section 3.1 Equations 10-11 & Section 4.2 Effect of Hyperparameters (Figure 5), pp. 5, 8-9
    relation: supports
- claim_id: r458-non-iid-image-and-text-classification-application
  kind: application
  statement: Applied to heterogeneous federated image and sequential classification on MNIST, CIFAR-10, CIFAR-100, CINIC-10, Tiny-ImageNet, and Shakespeare under sharding and Latent Dirichlet Allocation (LDA) partitioning.
  evidence:
  - source_id: r458-primary-pdf
    locator: Section 4 Experiments (Tables 2-4, Figures 4-5), pp. 7-9
    relation: supports
