identity_notes: 'This record denotes Felner’s named iterative principal-branch procedure
  and explicit OPEN/TREE collapse/regeneration organization. The defining paper describes
  full RBFS as its recursive counterpart with corresponding steps under its conventions.
  The accepted separation is procedural representation, not a new extensional priority
  order, solution-quality advantage or universal implementation-equivalence result.
  ILBFS is the source abbreviation; RBFS, SRBFS, IE and generic best-first search
  are not aliases. Conditional backed-up inheritance, depth-first ties, the high-level
  ancestry discrepancy and root/dead-end/graph interfaces remain explicit. The later
  2024 versions and pinned code are research context for preserved limitations, not
  replacements for the 2015 definition. Current insertion context was reconciled at
  merged commit c222454fe2e2ce2b9be5fd78a01d47e9961d1f26: 807 native and 442 pinned
  AIO records, 4,946 identity-field occurrences and 3,781 normalized values. Four
  ignored- and hidden-inclusive roots returned 165 matching contents / 1,085 occurrences,
  all byte-identical to the bound prior readings; no candidate exact normalized identity
  collision was found. All 1,249 native and generated record files match that evidence.
  Earlier full 25-node / 92-edge AIO and native-neighbor readings are reused with
  attribution, not claimed as fresh whole-ontology review. Source tracking uses existing
  main 912 while preserving prior IE, main 6/7/822/911 responsibilities and every
  historical source question.'
