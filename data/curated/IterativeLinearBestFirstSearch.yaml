  rationale: Iterative linear best-first search is a source-defined search-control
    procedure. No inspected target denotes its identity or a justified hierarchy,
    and the source establishes no sufficiently specific positive related mapping to
    these learning/model/layer classes.
  examined_targets:
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: The algorithms traverse search nodes and maintain cost bounds;
      their defining mechanisms do not use artificial neurons or learned connection
      weights.
  - target: AIO:AvailabilityHeuristicBias
    rejection_reason: Heuristic cost estimates and additive tolerance are algorithmic
      control quantities, not the human availability bias of overweighting easily
      recalled information.
  - target: AIO:DecisionTree
    rejection_reason: A search tree of possible paths is not the classification/decision-support
      model defined by this node and its Classification parent.
  - target: AIO:GraphConvolutionalNetwork
    rejection_reason: No graph convolution or neural-layer architecture is part of
      the source-defined procedures.
  - target: AIO:GraphConvolutionalPolicyNetwork
    rejection_reason: The procedures do not learn a graph-generating policy using
      rewards and adversarial loss; a planning application alone is insufficient.
  - target: AIO:GraphLanguageModel
    rejection_reason: The node concerns graph-structured language modeling, not search-tree
      generation and bound-based traversal.
  - target: AIO:LinearFunction
    rejection_reason: Linear storage in depth does not mean an affine activation.
      Weighted g/h evaluation is a scalar component, not the identity of the complete
      search algorithm.
  - target: AIO:MachineLearningTask
    rejection_reason: The inspected mechanisms search with supplied evaluations and
      per-search backups. They do not by themselves build a method that learns from
      data; no specific training relationship is established.
  - target: AIO:MathematicalFunction
    rejection_reason: Each algorithm evaluates mathematical quantities but also selects,
      stores, regenerates and terminates search. Mere arithmetic use is not an exact,
      hierarchical or sufficiently specific related mapping.
  - target: AIO:MaximumLayer
    rejection_reason: Conditional max inheritance is a scalar search-bound rule, not
      a tensor-merging neural layer.
  - target: AIO:MemoryAugmentedLLM
    rejection_reason: Stored branch alternatives or OPEN/TREE are search memory, not
      an external memory component of an LLM.
  - target: AIO:MemoryCellLayer
    rejection_reason: Retained search-node values are not cells or weights of a neural-network
      layer.
  - target: AIO:MinimumLayer
    rejection_reason: Minimum alternatives and backups in a search controller do not
      identify an element-wise tensor-merging layer.
  - target: AIO:Model
    rejection_reason: The algorithm operates on a problem representation; it is not
      the abstract system representation itself.
  - target: AIO:Network
    rejection_reason: An interconnected state graph can be input to a search procedure.
      That input structure does not make the traversal procedure a network entity.
  - target: AIO:NeuralTuringMachineNetwork
    rejection_reason: No feedforward neural architecture, learned pattern matching
      or neural memory controller is required by these procedures.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: Symbolic search without a neural language model is not a neuro-symbolic
      LLM.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: Search-tree branches and backed-up costs do not encode conditional
      dependencies among random variables.
  - target: AIO:ReasoningLLM
    rejection_reason: Goal-directed heuristic search is not, by itself, deductive
      inference during language tasks in a large language model.
  - target: AIO:RecursiveLLM
    rejection_reason: The definition requires recursive neural language architecture
      such as TreeLSTM; program recursion or iterative emulation does not establish
      it.
  - target: AIO:RecursiveLanguageModel
    rejection_reason: Its DeepNeuralNetwork and input/memory/output-layer relations
      concern learned syntactic composition, not recursive bounded search.
  - target: AIO:RecursiveNeuralNetwork
    rejection_reason: RBFS recursion and its iterative emulation apply search control,
      not shared learned weights over structured input.
  - target: AIO:ReinforcementLearning
    rejection_reason: Exploring alternative search branches with given costs is not
      evidence for a learning process balancing exploration and exploitation over
      trials.
  - target: AIO:TrainingStrategy
    rejection_reason: The sources define search-control procedures, not preprocessing
      or model-training strategies; optional use inside training would require separate
      evidence.
  - target: AIO:WeightedLayer
    rejection_reason: The kth-root variant weights a heuristic scalar; this does not
      define values applied to neurons or a layer in a network.
