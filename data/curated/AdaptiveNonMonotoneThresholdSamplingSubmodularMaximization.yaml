claims:
- claim_id: r370-claim-post-filtered-nonmonotone-threshold-sampling-invariants
  kind: mechanism
  statement: For any non-negative submodular function f, threshold tau, and candidate scale factor c >= 1, NON-MONOTONE-THRESHOLD-SAMPLING (Algorithm 1) runs in O(log(n/delta)/varepsilon) adaptive rounds and O(n/varepsilon) expected oracle queries, and conditioned on the high-probability event Z that all REDUCED-MEAN calls (Algorithm 2, Lemma 2.4) succeed (with Pr[Z] >= 1 - delta/2), guarantees that (1) if |S| < k upon termination then |A| < c*k with probability at least 1 - delta/2, and (2) the post-filtered set S' satisfies E[|S'| | Z] >= (1 - varepsilon_hat)*E[|S| | Z]; furthermore, unconditionally (for every realization), the prefix post-filtering step (Lines 14-15) guarantees f(S') >= tau * |S'| (Property 4) and the early stopping rule |A| < c*k (Line 7) guarantees Pr[x in S'] <= Pr[x in S] <= 1/c for every x in N (Property 5, Lemma 2.3).
  evidence:
  - source_id: r370-primary-pdf
    locator: Section 2.1, Definition 2.2, Algorithms 1-2, and Lemmas 2.3-2.4, pp. 4-5; Appendix A, Proof of Lemma 2.3 (Properties 1-5), pp. 16-18
    relation: supports
- claim_id: r370-claim-complementary-event-tradeoff-and-downsampling-bound
  kind: mechanism
  statement: For threshold tau approx c_1 * OPT / k, if event A_{>= c_3 k} occurs (so |S| = k conditioned on Z), then E[ALG] >= (1 - varepsilon)*(1 - delta)*c_1*OPT*Pr[A_{>= c_3 k} | Z] (Lemma 3.5); if the complementary event A_{< c_3 k} occurs (so |A| < c_3*k), then running an alpha-approximate unconstrained submodular maximization subroutine on A followed by uniform downsampling D ~ U(U, k) (which preserves E[f(D)] >= (k/|U|)*f(U) >= (1/c_3)*f(U) by Lemma 3.3) and applying Lemma 2.1 to g(S) = f(S^* cup S) with Pr[x in S' | Z] <= 1/c_3 yields E[ALG] >= ((1 - varepsilon)*(1 - delta)*alpha / c_3) * [(1 - c_1)*OPT*Pr[A_{< c_3 k} | Z] - OPT/c_3 - 2*E[f(S') | Z]] (Lemma 3.6).
  evidence:
  - source_id: r370-primary-pdf
    locator: Section 2, Lemma 2.1, p. 4; Section 2.2, Algorithm 3 and Lemmas 2.5-2.6, p. 6; Section 3.1-3.2, Algorithm 4, Definition 3.4, and Lemmas 3.3, 3.5, 3.6, pp. 7-9; Appendix B, Proofs of Lemma 3.3 and Lemma B.1, pp. 18-19
    relation: supports
- claim_id: r370-claim-logarithmic-adaptivity-and-nearly-linear-query-complexity
  kind: mechanism
  statement: Balancing the two complementary bounds of Lemmas 3.5 and 3.6 via max_{c_1,c_3,c_4,beta} min{c_4, (alpha/((1+beta)*c_3))*(1 - c_1 - 1/c_3 - 2*c_4)} subject to beta*c_1*c_3/alpha = 1 - c_1 yields E[ALG]/OPT >= (1 - varepsilon)*(1 - delta)*alpha*(1 - (1 + beta*c_3/alpha)^{-1} - c_3^{-1}) / ((1 + beta)*c_3 + 2*alpha) (Eq. 6); instantiating with 1-round random-subset UNCONSTRAINED-MAX (alpha = 1/4, c_3 = 3, beta = 1/2, c_1 = 1/7) achieves an expected (11/420)*(1 - varepsilon)*(1 - delta) >= 0.026*(1 - varepsilon)*(1 - delta) approximation in O(log(n/delta)/varepsilon) adaptive rounds and O(n*log(k)/varepsilon^2 + delta*n^2) expected oracle queries (Theorem 3.1), while instantiating with (1/2 - varepsilon)-approximate low-adaptivity unconstrained maximization (alpha = 1/2, c_3 = 3.556, beta = 0.5664, c_1 = 0.198989) achieves a 0.039*(1 - varepsilon)*(1 - delta) approximation in O(log(n/delta)/varepsilon) adaptive rounds and O(n*log(k)*log^3(1/varepsilon)/varepsilon^5 + delta*n^2) expected queries (Theorem 3.2).
  evidence:
  - source_id: r370-primary-pdf
    locator: Section 3-3.2, Theorems 3.1 and 3.2, and Equations (5)-(6), pp. 6-7, 10
    relation: supports
