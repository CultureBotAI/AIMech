limitations:
- Original DMN, intermediate DMN2/DMN3 ablations and complete DMN+ are distinguished.
- Source equation bounds and matrix dimensions contain inconsistencies; the record labels its dimensional
  interpretation and does not claim an inspected implementation.
- Benchmark protocols, finite memory, selected restarts and selected visualizations bound the evidence.
  No author code, training, benchmark replication or hardware measurement was performed.
- All ten pages of arXiv1603.01417v1 were visually read. Other versions were not inspected. DRAFT remains.
