id: AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization
name: FedNova Normalized Averaging for Heterogeneous Federated Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A heterogeneous federated optimization framework and normalized averaging algorithm (FedNova) that models client i's cumulative local model change over tau_i^{(t)} local steps as Delta_i^{(t)} = x_i^{(t,tau_i)} - x^{(t,0)} = -eta * G_i^{(t)} * a_i^{(t)}, where G_i^{(t)} in R^{d x tau_i} stacks the local stochastic gradients and a_i^{(t)} in R^{tau_i} is the local solver's gradient weighting vector (a_i = [1,...,1]^T for vanilla SGD, a_i = [(1-alpha)^{tau_i-1},...,1]^T for proximal SGD, and a_i = [1-rho^{tau_i},...,1-rho]^T/(1-rho) for momentum SGD), normalizes each client's update into an effective local gradient d_i^{(t)} = G_i^{(t)} a_i^{(t)} / ||a_i^{(t)}||_1 = -Delta_i^{(t)} / (eta * ||a_i^{(t)}||_1), and aggregates across clients with weights w_i = p_i and effective global step size tau_eff^{(t)} (defaulting to sum_{i=1}^m p_i ||a_i^{(t)}||_1) via x^{(t+1,0)} = x^{(t,0)} - tau_eff^{(t)} * sum_{i=1}^m p_i * eta * d_i^{(t)}, eliminating the surrogate objective inconsistency chi^2_{p||w} = sum_{i=1}^m (p_i - w_i)^2 / w_i caused by heterogeneous local step counts tau_i or heterogeneous local solvers while achieving O(1/sqrt(m * tau_tilde * T)) convergence to stationary points of the true global objective F(x) = sum_{i=1}^m p_i F_i(x).
identity_notes: Distinct from FedProx (AIMech:FedProxProximalHeteratedOptimization / AIMech:FedProxProximalHeterogeneousFederatedOptimization, which adds a proximal penalty (mu/2)||x - x^{(t,0)}||^2 to local objectives but still suffers from surrogate objective inconsistency w_i proportional to p_i ||a_i||_1 when tau_i varies across clients, as proven in Wang et al. 2020 Section 4.3), from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, which transmits control variate shifts c_i and requires equal local step counts), and from Local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent). No pinned AIO class covers FedNova or objective-inconsistency-eliminating normalized federated averaging.
aliases:
- FedNova
- Federated Normalized Averaging
- Normalized Averaging for Heterogeneous Federated Optimization
