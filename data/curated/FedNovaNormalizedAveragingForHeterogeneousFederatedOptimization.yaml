claims:
- claim_id: r386-surrogate-objective-inconsistency-theorem
  kind: mechanism
  statement: Theorem 1 and Corollary 1 prove that any federated algorithm aggregating unnormalized local updates with weights w_i proportional to p_i ||a_i||_1 converges to a stationary point of a mismatched surrogate objective F_tilde(x) = sum_{i=1}^m w_i F_i(x) with w_i = p_i ||a_i||_1 / sum_j p_j ||a_j||_1, and Theorem 2 combined with Lemma 4 shows that on strongly convex quadratic local losses F_i(x) = (1/2) x^T H_i x - e_i^T x, standard FedAvg converges as eta -> 0 to x_inf^{FedAvg} = (sum_i p_i tau_i H_i)^{-1} (sum_i p_i tau_i e_i) != x* with a non-vanishing lower bound min_{t in [T]} E||nabla F(x^{(t,0)})||^2 = Omega(chi^2_{p||w} kappa^2 / (chi^2_{p||w} beta^2 + 1)).
  evidence:
  - source_id: r386-primary-pdf
    locator: Section 4.1-4.2 Theorem 1, Corollary 1, Theorem 2, and Appendix B Lemmas 3-4, pp. 4-6, 15-17
    relation: supports
- claim_id: r386-normalized-averaging-stationarity-convergence
  kind: mechanism
  statement: By normalizing each client's cumulative update by ||a_i^{(t)}||_1 (where ||a_i||_1 = tau_i for vanilla SGD, (1 - (1-alpha)^{tau_i})/alpha for proximal SGD, and (tau_i - rho(1-rho^{tau_i})/(1-rho))/(1-rho) for momentum SGD) and setting w_i = p_i, FedNova achieves exact surrogate consistency (chi^2_{p||w} = 0) and Theorem 3 / Corollary 3 guarantees (1/T) sum_{t=0}^{T-1} E||nabla F(x^{(t,0)})||^2 = O(1/sqrt(m * tau_tilde * T) + m * tau_tilde / T) for L-smooth nonconvex objectives.
  evidence:
  - source_id: r386-primary-pdf
    locator: Section 4.3, Section 5 Theorem 3 & Corollary 3, pp. 6-8
    relation: supports
- claim_id: r386-local-step-size-and-drift-limitation
  kind: limitation
  statement: While FedNova eliminates the O(chi^2_{p||w}) objective inconsistency term as eta -> 0, Theorem 3 requires local step sizes to satisfy eta * L * max_i ||a_i||_1 <= O(1) so that client-drift variance O(eta^2 L^2 ||a_i||_2^2) remains controlled when local step counts tau_i are large.
  evidence:
  - source_id: r386-primary-pdf
    locator: Section 5 Theorem 3 condition (12) and Lemma 4 finite-eta limit (19), pp. 7, 16
    relation: supports
- claim_id: r386-heterogeneous-epoch-federated-training-application
  kind: application
  statement: Applied to federated training of VGG-11 and ResNet-18 on non-IID Dirichlet-partitioned CIFAR-10 and synthetic quadratic benchmarks under heterogeneous client local epochs E_i and straggler drop-offs, outperforming FedAvg and FedProx while supporting local momentum and proximal solvers.
  evidence:
  - source_id: r386-primary-pdf
    locator: Section 6 Experimental Results, Table 2 & Figures 3-4, pp. 8-9
    relation: supports
