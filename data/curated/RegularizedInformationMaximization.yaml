claims:
- claim_id: method
  kind: mechanism
  statement: For N unlabeled inputs let p_theta(y|x_i) be conditional cluster probabilities and q(y)=N^−1
    sum_i p_theta(y|x_i). Maximize H(q)−N^−1 sum_i H(p_theta(.|x_i))−R(theta). The linear configuration
    uses softmax(w_y^T x+b_y), R=lambda sum_y ||w_y||², and unpenalized biases, optimized with L-BFGS.
    Initialize by oversegmenting the data, fitting a multinomial logistic classifier to the resulting
    pseudo-labels, then optimizing the regularized information objective. Redundant categories can shrink
    toward zero marginal probability as their weights decay and biases become negative. The kernel configuration
    replaces linear scores with sum_i alpha_yi K(x_i,x)+b_y and penalizes RKHS squared norms alpha_y^T
    K alpha_y, with a regularization coefficient. A nonuniform-prior variant instead maximizes −mean conditional
    entropy−KL(q||D)−R for a chosen class prior D. A semi-supervised extension adds labeled log likelihood
    and weights the unlabeled information term separately.
  evidence:
  - source_id: method-source
    locator: Sections 2–5, PDF pp. 2–5, Equations (1)–(10); Section 6.1, p. 6 for initialization and regularization-sweep
