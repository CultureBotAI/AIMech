- claim_id: marcenko-pastur-median-unknown-noise-adaptation-and-haar-general-white-noise
  kind: scope
  statement: "When the noise level sigma in Y = X + sigma Z is unknown, Section III-E (Eq. 26, Lemma 1, Corollaries 1-3, Table IV, pp. 7-8) and Section V (Proof of Lemma 1, p. 11) prove that hat_sigma(Y) = y_{med} / sqrt(n mu_beta) \u2014 where y_{med} is the median empirical singular value of Y and mu_beta is the median of the Marcenko-Pastur law on [(1 - sqrt(beta))^2, (1 + sqrt(beta))^2] \u2014 satisfies hat_sigma(Y_n) / (1/sqrt(n)) -> 1 almost surely, so the data-dependent threshold hat_tau_*(beta, Y) = omega(beta) y_{med} with omega(beta) = lambda_*(beta) / sqrt(mu_beta) (omega(1) ~= 2.8582; cubic approximation 0.56 beta^3 - 0.95 beta^2 + 1.82 beta + 1.43 accurate to <= 0.02 on (0.001, 1], eq. 5) achieves the exact same almost-sure AMSE M(hat_X_{hat_tau_*}, x) = M(hat_X_{lambda_*}, x) and all optimality guarantees of Theorems 1-5. Furthermore, Section VI (eq. 39, p. 11) proves that when Z_n has general non-Gaussian i.i.d. white noise with finite fourth moment and X_n has Haar-distributed left/right singular vector bases U_n, V_n, all asymptotic limits in Lemmas 2-5 and Theorems 1-5 continue to hold."
