id: AIMech:OptimalSingularValueHardThresholdingAtFourOverSqrtThree
name: Optimal Singular Value Hard Thresholding at 4/sqrt(3) for Low-Rank Matrix Denoising
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Gavish-Donoho 4/sqrt(3) Singular Value Hard Thresholding
- Optimal Singular Value Hard Thresholding (SVHT)
- Aspect-Ratio Optimal SVHT Cutoff lambda_*(beta)
- Marcenko-Pastur Median Adaptive Singular Value Hard Threshold 2.858 y_med
definition: A low-rank matrix denoising methodology introduced by Gavish and Donoho (2014, IEEE Transactions on Information Theory 60(8):5040-5053, arXiv:1305.5870v3) for recovering an unknown low-rank m x n matrix X of fixed rank r from noisy observations Y = X + sigma Z = sum_{i=1}^m y_i u_i v_i' with i.i.d. zero-mean unit-variance finite-fourth-moment noise entries as m_n / n -> beta in (0, 1]. Applying Singular Value Hard Thresholding (SVHT) hat_X_tau = sum_{i=1}^m y_i 1_{y_i >= tau} u_i v_i' at threshold tau = lambda sqrt(n) sigma, the method uses Benaych-Georges and Nadakuditi's asymptotic singular value limit y(x) = sqrt((x + 1/x)(x + beta/x)) and left/right singular vector inner-product limits (Lemmas 2-3, eqs. 28-30) to derive the exact Asymptotic Mean Square Error (AMSE) M(hat_X_lambda, x) = sum_{i=1}^r M(hat_X_lambda, x_i) with component risk (x + 1/x)(x + beta/x) - (x^2 - 2 beta / x^2) for x >= x_*(lambda) and x^2 for x < x_*(lambda) (Lemma 4, eqs. 32-33). Equating the keeping and killing branches via x_*^4 - (beta + 1) x_*^2 - 3 beta = 0 yields the unique asymptotically admissible and minimax optimal hard threshold coefficient lambda_*(beta) = sqrt(2(beta + 1) + 8 beta / ((beta + 1) + sqrt(beta^2 + 14 beta + 1))) (Eq. 11, reducing to lambda_*(1) = 4 / sqrt(3) ~= 2.3094 for square matrices), which uniformly dominates every other hard threshold lambda != lambda_*(beta) and oracle-rank Truncated SVD hat_X_r (Theorems 1-4) as well as minimax risk over nuclear-norm balls ||x||_1 <= xi with optimal constant sqrt(3) xi (Theorem 5). When sigma is unknown, plugging in the Marcenko-Pastur median noise estimator hat_sigma(Y) = y_{med} / sqrt(n mu_beta) yields the tuning-free data-driven threshold hat_tau_*(beta, Y) = omega(beta) y_{med} (with omega(1) ~= 2.8582 and cubic approximation omega(beta) ~= 0.56 beta^3 - 0.95 beta^2 + 1.82 beta + 1.43) that achieves identical asymptotic optimality without knowing r or sigma (Lemma 1 and Corollaries 1-3).
identity_notes: Resolved against all 442 pinned AIO concepts and 646 maintained AIMech records. Distinct from AIMech:LossSpecificOptimalEigenvalueShrinkageForSpikedCovarianceMatrices (Donoho, Gavish, & Johnstone 2018), which shrinks eigenvalues eta(lambda_i) of symmetric sample covariance matrices S = (1/n) X'X toward a unit noise bulk floor 1 across 26 covariance pivot-losses rather than hard-thresholding rectangular data singular values y_i to 0 at tau_* = lambda_*(beta) sqrt(n) sigma under Frobenius MSE; distinct from AIMech:SingularValueThresholdingForMatrixCompletion (Cai, Candes, & Shen 2010), which applies iterative soft thresholding (y_i - tau)_+ within Uzawa subgradient iterations for incomplete matrix nuclear-norm minimization; and distinct from AIMech:BaikSilversteinSpikedPopulationCovarianceEigenvalueSeparation (Baik & Silverstein 2006) and AIMech:BaikBenArousPecheLargestEigenvaluePhaseTransition (Baik, Ben Arous, & Peche 2005), which analyze sample covariance eigenvalue limits and fluctuations without singular-vector rotation AMSE trade-offs or matrix denoising estimators.
