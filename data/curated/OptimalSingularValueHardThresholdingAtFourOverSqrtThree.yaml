claims:
- claim_id: singular-vector-rotation-amse-decomposition-and-indifference-quartic
  kind: mechanism
  statement: In the rectangular spiked matrix model Y_n = X_n + Z_n / sqrt(n) with m_n / n -> beta in (0, 1] and rank-r signal singular values x_1, ..., x_r, Section V (Lemmas 2-4, eqs. 28-36, pp. 9-10) applies Benaych-Georges and Nadakuditi's almost-sure singular value limit y_{n,i} -> sqrt((x_i + 1/x_i)(x_i + beta/x_i)) for x_i > beta^{1/4} (eq. 28) and left/right singular vector cosine limits d |<a_{n,i}, u_{n,i}>|^2 -> (x_i^4 - beta)/(x_i^4 + beta x_i^2) and d |<b_{n,i}, v_{n,i}>|^2 -> (x_i^4 - beta)/(x_i^4 + x_i^2) (eqs. 29-30) to prove that for any hard threshold lambda > 1 + sqrt(beta), the asymptotic MSE decouples into M(hat_X_lambda, x) = sum_{i=1}^r M(hat_X_lambda, x_i) with M(hat_X_lambda, x) = (x + 1/x)(x + beta/x) - (x^2 - 2 beta / x^2) when x >= x_*(lambda) and x^2 when x < x_*(lambda), where x_*(lambda) = sqrt((lambda^2 - beta - 1 + sqrt((lambda^2 - beta - 1)^2 - 4 beta)) / 2) (eqs. 18, 33). Proof of Theorem 1 (p. 11) shows that the keeping and killing risk branches intersect at the unique positive root x_* of x_*^4 - (beta + 1) x_*^2 - 3 beta = 0, namely x_*^2 = [(beta + 1) + sqrt(beta^2 + 14 beta + 1)] / 2, which maps via y(x_*) to the unique optimal threshold lambda_*(beta) = sqrt(2(beta + 1) + 8 beta / ((beta + 1) + sqrt(beta^2 + 14 beta + 1))) (eq. 11), reducing at beta = 1 to x_* = sqrt(3) and lambda_*(1) = 4 / sqrt(3) (eq. 10).
  evidence:
  - source_id: gd2014-svht-pdf
    locator: Section III, Equations (10)-(11) and (18), pp. 4-5; Section V, Lemmas 2-5, Equations (28)-(38), and Proofs of Theorems 1-4, pp. 9-11
    relation: supports
- claim_id: uniform-admissibility-over-tsvd-and-minimax-guarantees-over-rank-and-nuclear-norm
  kind: scope
  statement: Theorems 1 and 2 (pp. 4-5) prove that hat_X_{lambda_*(beta)} is asymptotically unique admissible among all hard thresholds lambda > 1 + sqrt(beta) and uniformly dominates oracle-rank Truncated SVD hat_X_r in AMSE across all signal configurations x in R^r because signal singular values x_i in (0, x_*(lambda_*(beta))) produce empirical singular vectors rotated so severely by noise that including y_{n,i} u_{n,i} v_{n,i}' incurs AMSE up to 5 times larger than setting it to zero (Section IV-A, p. 8; Lemma 5, eq. 38, p. 10). Theorems 3 and 4 (p. 5) prove that the least favorable rank-r signal is fully degenerate at x_*(lambda) (1, ..., 1) and that lambda_*(beta) achieves the minimax AMSE min_{lambda > 1 + sqrt(beta)} max_{x in R^r} M(hat_X_lambda, x) = (r/2)[(beta + 1) + sqrt(beta^2 + 14 beta + 1)] (eq. 19), which for square matrices (beta = 1) equals 3 r (or 3 n r sigma^2 in general noise scaling), strictly improving upon Universal Singular Value Thresholding lambda = 2.02 (4.26 r), oracle TSVD (5 r), and optimally tuned Singular Value Soft Thresholding at s_* = 2 (6 r), while lying within 3/2 of the optimal continuous shrinker eta_{opt}(y) = sqrt((y^2 - 4)_+) (2 r) (Table II, pp. 5-7). Moreover, Theorem 5 (pp. 6-7) proves that lambda_* = 4/sqrt(3) is minimax optimal over nuclear-norm balls ||x||_1 <= xi, achieving min_{lambda > 2} max_{||x||_1 <= xi} M(hat_X_lambda, x) = sqrt(3) xi (Table III, p. 8).
