claims:
- claim_id: method
  kind: mechanism
  statement: Initialize a search mean, positive global step size, identity covariance and zero evolution
    paths. Sample a generation of Gaussian offspring with covariance equal to the global step size squared
    times the covariance matrix. Rank offspring by the minimization objective and recombine the selected
    best offspring with positive normalized weights to set the next mean. Accumulate a normalized selected
    mean displacement into a covariance evolution path. In the inspected 2001 procedure, blend the old
    covariance with the outer product of that path. Accumulate a separate path with covariance scaling
    removed and adjust the global step size exponentially according to its length relative to the expected
    length of a standard normal vector. Obtain the covariance axes and scales by eigendecomposition for
    subsequent sampling and repeat under the chosen stopping criterion. No derivatives of the objective
    are required.
