name: Covariance Matrix Adaptation Evolution Strategy
definition: An evolution strategy for continuous optimization that samples a multivariate normal search
  distribution and adapts its mean, covariance and global step size from ranked offspring and accumulated
  selected-step paths.
concept_kind: algorithm
identity_notes: This record describes CMA-ES through the 2001 weighted-recombination algorithm and its
  author-supplied errata. That algorithm’s covariance update is based on a rank-one evolution-path outer
  product; later rank-mu, active covariance, restart and limited-memory variants are not silently imported.
  The search distribution is not a predictive model of objective values. Derandomized adaptation does
  not make offspring sampling deterministic. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 270 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 19 and 19 lines respectively. These
  were prior candidate leads, source discussions and neighboring DEHB/FABOLAS method mentions. Eight exact
  AIO CLASS nodes with scoped synonyms and outgoing edges and seven native neighboring mechanisms were
  inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- This is a source-specific account of the 2001 algorithm, not an exact implementation contract for all
  contemporary CMA-ES software. Its positive recombination weights, rank-one covariance update and cumulative
  step-size rule are distinguished from later extensions. The author errata qualify the default weight
  formula when the selected-parent count exceeds half the offspring population and revise a suggested
  ordering of cumulation parameters.
- Initial mean and step size matter. Weak, noisy or selection-irrelevant feedback and numerical conditioning
  can impair covariance adaptation or collapse short search directions. Full covariance storage grows
  quadratically with dimension; eigendecomposition and expensive function evaluations add computational
  costs.
- Constraint handling and termination require explicit choices. The paper discusses resampling feasible
  offspring but cautions about boundary optima. Ranking and distribution adaptation do not guarantee a
  global optimum, monotonic improvement of every generation, or a calibrated inverse-Hessian estimate.
  No benchmark speedup or author-code execution is asserted.
