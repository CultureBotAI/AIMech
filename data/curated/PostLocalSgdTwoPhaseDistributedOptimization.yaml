claims:
- claim_id: c-r622-two-phase-schedule-and-phase1-equivalence
  kind: mechanism
  statement: Post-Local SGD defines the worker synchronization interval as H_{(t)} = 1 for t <= t' and H_{(t)} = H > 1 for t > t' (Section 3 and Algorithm 2); during Phase 1 (t <= t'), the update is algebraically identical to synchronous mini-batch SGD with effective batch size K B_loc, allowing direct reuse of linear learning-rate scaling and gradual warmup without hyperparameter retuning while avoiding the early-epoch optimization degradation of cold-started Local SGD.
  evidence:
  - source_id: r622-primary-pdf
    locator: Section 1 Eq. (1)-(2) & Figure 1, p. 1-2; Section 3, p. 4; Appendix B.4.2 & C.1 Algorithm 2, p. 23-26
    relation: supports
- claim_id: c-r622-sde-anisotropic-noise-amplification-and-flat-minima
  kind: mechanism
  statement: "Under the Euler-Maruyama stochastic differential equation approximation of SGD (Section 5, Eq. 3-4), each worker's local update with mini-batch size B_loc experiences anisotropic gradient noise covariance approximately K * Sigma(w) \u2014 K times larger than the globally averaged mini-batch SGD noise covariance Sigma(w) = (1 / (K B_loc) - 1 / N) K(w) \u2014 which acts as computation-free structured noise injection during Phase 2 and drives Post-Local SGD to flatter minima with significantly lower dominant Hessian eigenvalues."
  evidence:
  - source_id: r622-primary-pdf
    locator: Section 5 & Section 5.1, Eq. (3)-(4) & Figure 4, p. 8-9; Appendix C.4 Figures 13-15, p. 28-30
    relation: supports
- claim_id: c-r622-large-batch-generalization-and-compression-compatibility
  kind: application
  statement: Post-Local SGD closes the large-batch generalization gap on CIFAR-10/100 (ResNet-20, DenseNet-40-12, WideResNet-28-10 at K B_loc up to 4096) and ImageNet (ResNet-50 at K B_loc up to 16384), improves upon LARS, and composes directly with gradient compression (signSGD and EF-signSGD, Algorithms 3-4) and hierarchical multi-rack synchronization (Hierarchical Local SGD, Algorithm 5, Eq. 5-6).
  evidence:
  - source_id: r622-primary-pdf
    locator: Section 4.2 Tables 2-5, p. 6-8; Appendix C.5.5 Algorithms 3-4, p. 32-34; Appendix D-E Algorithm 5 & Eq. (5)-(6), p. 35-40
    relation: supports
- claim_id: c-r622-transition-timing-and-extreme-local-steps-limitation
  kind: limitation
  statement: Turning on local updates too early (e.g., at epoch 0 or via short linear/exponential local-step warmup before the trajectory stabilizes) degrades training loss and final accuracy when K and H are large, whereas delaying the switch until the second learning-rate decay sacrifices communication savings and risks trapping the model in a sharper minimum.
  evidence:
  - source_id: r622-primary-pdf
    locator: Appendix B.4.2 Figures 10-11, p. 23-25; Appendix C.2 Figure 12, p. 27
    relation: supports
