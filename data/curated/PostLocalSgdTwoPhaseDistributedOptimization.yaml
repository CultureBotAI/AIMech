id: AIMech:PostLocalSgdTwoPhaseDistributedOptimization
name: Post-Local Stochastic Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: 'A two-phase distributed stochastic gradient optimization algorithm across K parallel workers with local mini-batch size B_loc that sets the inter-worker model-averaging period H_{(t)} via a piecewise schedule around transition step t'' (typically the first learning-rate decay): during Phase 1 (t <= t''), it sets H_{(t)} = 1 so workers synchronize after every step as standard large-batch mini-batch SGD (using standard linear scaling and warmup schedules), and during Phase 2 (t > t''), it switches to H_{(t)} = H > 1 sequential local SGD steps w_{(t)+h+1}^k = w_{(t)+h}^k - gamma_{(t)} g_{(t)+h}^k per worker before global model averaging w_{(t+1)} = (1 / K) sum_{k=1}^K w_{(t)+H}^k.'
identity_notes: 'Distinct from standard single-phase Local SGD / Parallel SGD (which uses constant H > 1 from initialization t = 0 and suffers early optimization degradation at large K and H), from gradual local-step warmup schedules, and from outer-momentum wrappers (SlowMo): Post-Local SGD specifically delays local multi-step updates until the trajectory enters the basin of a local minimum at the first learning-rate decay t'', simultaneously preserving Phase-1 optimization stability and injecting K-fold amplified structured gradient noise in Phase 2 to escape sharp minima.'
aliases:
- Post-Local SGD
- Two-Phase Post-Local SGD
- Hierarchical Post-Local SGD
