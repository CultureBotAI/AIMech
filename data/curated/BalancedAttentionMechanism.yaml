aio_mappings:
- target: AIO:Layer
  relation: broad_match
  rationale: The pinned Layer class is broader than this learned input-to-output feature-map component.
    The pinned AttentionLayer denotes dot-product attention, which is not the channel/spatial gating procedure
    here; pooling, convolution and activation targets describe constituent operations rather than equivalent
    whole-module identities.
limitations:
- The canonical identity is the 2021 balanced attention component, not Park and colleagues’ 2018 Bottleneck
  Attention Module or a complete super-resolution network. The shared acronym BAM is qualified in the
  alias.
- This record follows the eight-page arXiv v3 paper. The author code was not inspected or executed, so
  padding, bias, small-channel rounding, trained checkpoints and implementation fidelity are not certified.
- The paper PDF retains template author and affiliation placeholders and a 2022 copyright footer. Authors
  and the 2021 version date come from the primary arXiv metadata; no conference acceptance is inferred.
- Chosen exact gates illustrate algebraic limits only. No model was trained, no image or hardware benchmark
  was replicated, and the record remains DRAFT.
