id: AIMech:BalancedAttentionMechanism
name: Balanced Attention Mechanism
aliases:
- BAM (balanced attention)
concept_kind: layer
definition: A convolutional feature-gating component for single-image super-resolution that computes average-pooled
  channel attention and maximum-pooled spatial attention in parallel, multiplies their sigmoid gates by
  broadcasting, and scales the input feature tensor.
identity_notes: Compared all 442 pinned AIO and 595 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 166, 106, 105 lines. All distinct match contents
  were inspected. Semantic matching covered 66 AIO and 27 native definitions, with every matched definition
  read. 7 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. The
  selected identity is Wang and colleagues’ 2021 parallel average-channel/max-spatial product gate, not
  Park and colleagues’ 2018 Bottleneck Attention Module. BAM is qualified in the alias. The ACAM/MSAM
  branches are described within this composite layer, not asserted to be equivalent to existing pooling
  or activation classes. CBAM is sequential and SE has only channel recalibration. The inspected generic
  AIO Layer is broader; no exact counterpart was found.
definition_evidence:
- source_id: wang2021
  locator: Proposed method, PDF pp. 2–4, Figure 2 and Equations 1–5
  relation: supports
claims:
- claim_id: average-channel-branch
  kind: mechanism
  statement: For input F with batch, channel, height and width axes, the ACAM branch averages over spatial
    positions separately for each channel. It applies a learned 1-by-1 channel reduction, PReLU, a 1-by-1
    expansion to the original channel count, and sigmoid. Its channel weights are shared over spatial
    positions. The text uses reduction ratio 16 depending on the channel count; this is a configuration
    choice, not a universal identity requirement.
  evidence:
  - source_id: wang2021
    locator: 'Proposed method: Avgpool Channel Attention Module, PDF pp. 2–3; Equations 1 and 3 and Figure
      2, p. 3'
    relation: supports
- claim_id: maximum-spatial-branch
  kind: mechanism
  statement: The MSAM branch starts from the same unmodified F, takes the maximum across channels at every
    spatial position, and applies a learned 7-by-7 convolution followed by sigmoid to produce one spatial
    gate shared across channels. This maximum is over the channel axis, whereas ACAM averages over spatial
    axes. Neither branch consumes the output of the other in the paper’s parallel construction.
  evidence:
  - source_id: wang2021
    locator: 'Proposed method: Maxpool Spatial Attention Module, PDF pp. 3–4; Equation 2 and Figure 2,
      p. 3; Equation 4, p. 4'
    relation: supports
- claim_id: product-gate-boundary
  kind: scope
  statement: Broadcast the channel and spatial sigmoid outputs, multiply them together, and multiply the
    resulting gate into F. The core equation contains no residual addition or softmax normalization. For
    finite real logits the factor lies strictly between zero and one, so it attenuates immediate nonzero
    feature magnitudes; numerical sigmoid saturation can reach endpoints. For each batch item, the channel-by-flattened-spatial
    gate is an outer product of rank at most one, not an arbitrary gate at every channel-position pair.
    These are direct consequences of the formula, not guarantees of image denoising.
  evidence:
  - source_id: wang2021
    locator: Figure 2, p. 3; Balanced Attention Mechanism, p. 4, Equation 5; direct algebra and constructed
      rational gate examples
    relation: supports
- claim_id: gradient-and-ablation-limits
  kind: limitation
  statement: The paper motivates its parallel branches as balancing noise suppression and texture preservation
    and writes a product-rule gradient expansion. Shared gradient paths alone do not prove convergence,
    optimal balance or separate causal contributions of each branch. Table 2 compares complete attention
    modules inside IMDN; it does not provide an isolated ACAM-versus-MSAM ablation that establishes those
    individual effects.
  evidence:
  - source_id: wang2021
    locator: Balanced Attention Mechanism, p. 4, Equation 6; Ablation Study and Table 2, p. 7
    relation: supports
- claim_id: evaluation-protocol
  kind: scope
  statement: The reported training uses DIV2K training images with augmentation, 64-by-64 low-resolution
    patches, batch size 16, L1 loss and Adam for 1000 epochs. Evaluation uses PSNR and SSIM on the Y channel
    with bicubic downsampling at factors 2, 3 and 4. The paper compares several surrounding super-resolution
    architectures and notes that some original baselines use extra training data, so the table is not
    evidence of uniformly matched retraining or architecture-independent gains.
  evidence:
  - source_id: wang2021
    locator: 'Experiments: Datasets and metrics, Implementation details and Comparison experiments, PDF
      p. 4; Table 1, p. 5'
    relation: supports
- claim_id: mixed-results-and-runtime
  kind: limitation
  statement: The reported results are metric-, scale-, dataset- and architecture-specific. Table 1 shows
    PAN on Manga109 at factor 3 with PSNR decreasing from 33.61 to 33.19 while SSIM increases from 0.9448
    to 0.9453; RCAN at factor 4 on Manga109 also has lower PSNR after replacement. The speed comparison
    in Figure 6 uses 700 images per input scale on an RTX 2080 Ti for IMDN and DRLN variants. It does
    not isolate parallelism as the sole cause or establish universal accuracy or runtime improvements.
  evidence:
  - source_id: wang2021
    locator: Table 1, PDF p. 5; Speed comparison and Figure 6, p. 7
    relation: supports
