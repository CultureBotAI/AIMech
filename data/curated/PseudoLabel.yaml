claims:
- claim_id: method
  kind: mechanism
  statement: At each weights update, assign each unlabeled example a one-hot pseudo-target for its argmax
    predicted class. Treat that chosen target as a label for the update and train the same network on
    both observed labeled examples and pseudo-labeled examples. The original paper’s Equation15 averages
    the class-summed supervised loss over the labeled minibatch of size n and separately over the unlabeled
    minibatch of size n_prime, with multiplier alpha(t) on the latter. The represented original configuration
    uses independent sigmoid output units and sums binary cross-entropy over classes, as defined in Equation5;
    it is not silently rewritten as softmax categorical cross-entropy. Equation16 sets alpha(t)=0 before
    T1, increases it linearly to alpha_f between T1 and T2, and keeps it at alpha_f thereafter. The paper
    uses Dropout during this training and studies both optional denoising-autoencoder pretraining and
    training without it. The hard labels are recalculated at each weights update rather than supplied
    by a separate EMA teacher. The displayed Pseudo-Label rule has no confidence-threshold rejection step.
  evidence:
  - source_id: method-source
    locator: Sections 2.1 and 2.4, Equations (5), (14)–(16), PDF pp. 2–3; entropy interpretation in Sections
      3.2–3.3, PDF pp. 3–4
    relation: supports
- claim_id: entropy-boundary
  kind: limitation
  statement: Equations5 and15 use hard pseudo-target loss, while Equation17 defines a different entropy
    expression. For normalized two-class outputs(0.8,0.2) and pseudo-target(1,0), the class-summed binary
    cross-entropy is−2log(0.8), whereas the printed entropy is−0.8log(0.8)−0.2log(0.2). Their unequal
    values refute literal objective equality in this example; this finite algebra does not refute the
    paper’s qualitative confidence-sharpening motivation.
  evidence:
  - source_id: method-source
    locator: Equations (5), (15), (17) and Section 3.3, PDF pp. 2–4
    relation: supports
