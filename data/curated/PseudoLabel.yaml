name: Pseudo-Label
definition: A semi-supervised neural-network training procedure that recomputes hard labels from the model’s
  most probable class for unlabeled examples and jointly fits observed and generated targets using a scheduled
  weight on the unlabeled loss.
concept_kind: algorithm
identity_notes: This record denotes Lee’s 2013 named training method and its explicitly described sigmoid-loss
  configuration. Generic pseudo-labeling also includes other target generators and iterative procedures;
  DeepCluster’s cluster assignments, SeLa’s balanced transport and FixMatch’s weak-to-strong confidence
  filter are distinct methods. The method’s entropy-minimization motivation does not establish an identical
  objective to Shannon entropy minimization. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 243 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in both worktree and main checkout, returning 102 lines in the worktree
  and 103 in main from prior discovery, saved reviews and related native records. Twelve exact AIO CLASS
  nodes, their scoped synonyms and outgoing edges, plus eight neighboring native mechanisms were inspected.
  This absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- Wrong hard targets can reinforce early prediction errors; the ramp and low-density-separation motivation
  do not guarantee target correctness or improved generalization.
- The original paper’s independent sigmoid outputs need not form a normalized class-probability vector.
  Its classwise binary loss is distinct from later softmax-based reimplementations.
- The paper describes equivalence to entropy regularization, but its hard-target loss and printed entropy
  expression are not algebraically equal. This record preserves the shared low-entropy motivation without
  asserting objective equality.
- Specific ramp endpoints, final weight, network widths, Dropout rates and pretraining schedules are reported
  experimental choices, not universal constants. The paper does not specify an argmax tie-breaking policy.
- The inspected primary paper is a public third-party-hosted copy with an exact hash. Title, author and
  workshop identity agree with the indexed original and author-linked citation; original-host byte equality
  and an exact revision date were not established.
