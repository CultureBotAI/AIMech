name: DeepCluster
definition: A visual representation-learning procedure that alternates clustering current neural features
  into pseudo-labels and training the feature extractor and a classifier to predict those labels.
concept_kind: algorithm
identity_notes: This record covers the original k-means-based DeepCluster procedure of Caron et al. It
  is not generic deep clustering, standalone k-means, DeepCluster-v2, or a particular pretrained model.
  Cluster assignments provide training targets; the k-means centroid matrix is not used as the discriminative
  classifier. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 195 prior native IDs/names/aliases. Ignored-inclusive, word-delimited searches of both full checkouts
  found nine prior discovery/review references in each plus six unrelated language-stemmer tokens in the
  main environment. An initial substring search also matched unrelated layer-name suffixes. Neighboring
  k-means, SwAV, Barlow Twins and VICReg mechanisms and exact AIO definitions/edges were inspected; shared
  components do not establish identity.
limitations:
- K-means is nonconvex and the finite iteration implementation does not certify a global optimum. The
  alternating clustering and classification stages are not a proof of descent for one common objective
  or of general convergence.
- Empty-cluster repair and pseudo-label sampling are practical safeguards, not a universal guarantee against
  collapsed representations. The inspected wrapper delegates clustering to Faiss; its library internals
  were not audited.
- Uniform training exposure to pseudo-label groups does not force equal cluster sizes. Cluster IDs can
  be permuted or change between rounds and are not verified semantic class labels.
- PCA dimension 256, Sobel filtering, architecture, augmentations and epoch schedule describe the original
  experimental configuration. Whitening and L2 normalization require suitable numerical handling; no performance
  equivalence for arbitrary variants is asserted.
- Training discards ImageNet class labels, but the paper selects hyperparameters using labeled Pascal
  VOC validation. Full-dataset feature extraction has a cost; no training or benchmark reproduction was
  performed.
