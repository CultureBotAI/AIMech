claims:
- claim_id: method
  kind: mechanism
  statement: Extract features of the unlabeled training images with the current encoder while holding
    its parameters fixed. In the original reported configuration, PCA-reduce and whiten these features,
    then L2-normalize them before k-means. Cluster them by alternating nearest-centroid assignment and
    centroid updates toward the squared-distance objective; use the resulting hard cluster indices as
    pseudo-labels. The paper handles empty clusters by perturbing a selected nonempty centroid and reassigning
    its members between the two centers. Then hold pseudo-labels fixed and optimize the encoder and a
    classification head with cross-entropy on augmented images. Sample approximately uniformly across
    nonempty pseudo-label groups so large clusters do not dominate training. Repeat full-dataset feature
    extraction, clustering and discriminative training. The pinned author implementation reinitializes
    the final linear classifier for each reclustering round, uses 20 k-means iterations, and uses sampled
    pseudo-labels rather than differentiating through k-means.
