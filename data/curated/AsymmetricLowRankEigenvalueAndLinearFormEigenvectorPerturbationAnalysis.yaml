claims:
- claim_id: claim-neumann-master-bound-and-combinatorial-walk-moment-control
  kind: mechanism
  statement: For a rank-1 symmetric matrix $\mathbf{M}^\star = \lambda^\star\boldsymbol{u}^\star\boldsymbol{u}^{\star\top}$ with incoherence $\|\boldsymbol{u}^\star\|_\infty \le \sqrt{\mu/n}$ perturbed by an asymmetric independent noise matrix $\mathbf{H}$ obeying $\max\{\sigma\sqrt{n\log n}, B\log n\} \le c_1|\lambda^\star|$, Lemma 5 bounds the $k$-th moment $|\mathbb{E}[(\boldsymbol{a}^\top\mathbf{H}^s\boldsymbol{u}^\star)^k]|$ by partitioning $sk$ directed walk edges into equivalence types $\mathcal{T}\in\Gamma^+$ of cardinality at least 2, and Theorem 3 sums the Neumann series to prove $|\boldsymbol{a}^\top(\boldsymbol{u} - \frac{\boldsymbol{u}^{\star\top}\boldsymbol{u}}{\lambda/\lambda^\star}\boldsymbol{u}^\star)| \lesssim \frac{\max\{\sigma\sqrt{n\log n}, B\log n\}}{|\lambda^\star|}\sqrt{\frac{\mu}{n}}$ with probability $1 - O(n^{-10})$ (Sections 3.2, 4.1.1, and 4.4, Theorem 3, Lemma 5, Corollary 4).
  evidence:
  - source_id: ccf2021-asym-pdf
    locator: Section 3.2 (Theorem 2, p. 6), Section 4.1.1 (Theorem 3, p. 7), Section 4.4 & Appendices C-E (Lemma 5, pp. 13-14, 26-32)
    relation: supports
- claim_id: claim-sqrt-n-eigenvalue-accuracy-gain-and-entrywise-eigenvector-control
  kind: mechanism
  statement: "Setting $\\boldsymbol{a} = \\boldsymbol{u}^\\star$ in Theorem 3 yields Corollary 1: $|\\lambda - \\lambda^\\star| \\lesssim \\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}\\sqrt{\\mu/n}$ (which simplifies to $O(\\sigma\\sqrt{\\mu\\log n})$ when $B \\lesssim \\sigma\\sqrt{n/\\log n}$, matching the Fano minimax lower bound of Lemma 4 up to $\\sqrt{\\log n}$), improving by a factor of $O(\\sqrt{n})$ over the unadjusted singular value $|\\lambda_{\\text{svd}} - \\lambda^\\star|$ and the symmetrized eigenvalue bias $\\frac{n\\sigma^2}{2\\lambda^\\star}$ without requiring knowledge of heteroscedastic variances; Corollaries 2\u20133 further bound linear forms and entrywise error $\\min\\|\\boldsymbol{u} \\pm \\boldsymbol{u}^\\star\\|_\\infty \\lesssim \\frac{\\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}}{|\\lambda^\\star|}\\sqrt{\\frac{\\mu}{n}}$ (Sections 4.1.2\u20134.1.4 and 4.3, Corollaries 1\u20133, Lemma 4)."
  evidence:
  - source_id: ccf2021-asym-pdf
    locator: Sections 4.1.2-4.1.4 and 4.3 (Corollaries 1-3, Lemma 4, pp. 8-13)
    relation: supports
- claim_id: claim-rank-r-extension-and-asymmetrized-dilation-singular-estimation
  kind: application
  statement: "For general rank-$r$ symmetric matrices, Theorem 4 and Corollaries 5\u20137 establish eigenvalue perturbation $|\\lambda_l - \\lambda_j^\\star| \\lesssim \\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}\\kappa r\\sqrt{\\mu/n}$ and eigenspace incoherence $\\|\\mathbf{U}\\|_{2,\\infty} \\lesssim \\kappa r\\sqrt{\\mu/n}$; for an asymmetric rank-1 matrix $\\mathbf{M}^\\star = \\lambda^\\star\\boldsymbol{u}^\\star\\boldsymbol{v}^{\\star\\top} \\in \\mathbb{R}^{n_1\\times n_2}$ with two independent noisy copies $\\mathbf{M}_1, \\mathbf{M}_2$, eigen-decomposition of the asymmetrized dilation $\\mathbf{M}_{\\text{d}} = \\begin{bmatrix}\\mathbf{0} & \\mathbf{M}_1 \\\\ \\mathbf{M}_2^\\top & \\mathbf{0}\\end{bmatrix}$ achieves $|\\lambda_1^{\\text{d}} - \\lambda^\\star| \\lesssim \\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}\\sqrt{\\mu/n}$ and optimal entrywise singular-vector accuracy (Section 5, Theorem 4, Corollary 8, Theorem 5)."
  evidence:
  - source_id: ccf2021-asym-pdf
    locator: Sections 5.1-5.2 (Theorem 4, Corollaries 5-8, Theorem 5, pp. 14-18), Appendix I (pp. 33-36)
    relation: supports
