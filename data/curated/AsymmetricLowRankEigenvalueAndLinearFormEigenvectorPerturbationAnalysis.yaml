id: AIMech:AsymmetricLowRankEigenvalueAndLinearFormEigenvectorPerturbationAnalysis
name: Asymmetric Low-Rank Matrix Eigenvalue and Linear-Form Eigenvector Perturbation Analysis
concept_kind: mathematical_method
review_status: DRAFT
definition: "A non-asymptotic spectral perturbation theory (established by Yuxin Chen, Chen Cheng, and Jianqing Fan in 2021) for estimating the leading eigenvalues and eigenvectors of a low-rank symmetric matrix $\\mathbf{M}^\\star \\in \\mathbb{R}^{n\\times n}$ from an asymmetrically perturbed observation $\\mathbf{M} = \\mathbf{M}^\\star + \\mathbf{H}$ whose noise entries $\\{H_{ij}\\}_{1\\le i,j\\le n}$ are mutually independent, zero-mean, and potentially heteroscedastic ($\\text{Var}(H_{ij}) \\le \\sigma^2$, $|H_{ij}| \\le B$). Using the Neumann series eigenvector expansion $\\boldsymbol{u} = \\frac{\\lambda^\\star}{\\lambda}(\\boldsymbol{u}^{\\star\\top}\\boldsymbol{u})\\sum_{s=0}^\\infty \\frac{1}{\\lambda^s}\\mathbf{H}^s\\boldsymbol{u}^\\star$ (Theorem 2) and a combinatorial graph-partition moment bound on high-order bilinear forms $|\\mathbb{E}[(\\boldsymbol{a}^\\top\\mathbf{H}^s\\boldsymbol{u}^\\star)^k]|$ (Lemma 5, Corollary 4), Theorem 3 establishes the master linear-form perturbation bound $|\\boldsymbol{a}^\\top(\\boldsymbol{u} - \\frac{\\boldsymbol{u}^{\\star\\top}\\boldsymbol{u}}{\\lambda/\\lambda^\\star}\\boldsymbol{u}^\\star)| \\lesssim \\frac{\\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}}{|\\lambda^\\star|}\\sqrt{\\frac{\\mu}{n}}$ for any deterministic unit vector $\\boldsymbol{a} \\in \\mathbb{R}^n$. Because $\\mathbb{E}[\\boldsymbol{a}^\\top\\mathbf{H}^2\\boldsymbol{u}^\\star] = O(\\sigma^2)$ for asymmetric independent noise versus $n\\sigma^2\\boldsymbol{a}^\\top\\boldsymbol{u}^\\star$ for symmetric noise (Section 4.3), the leading eigenvalue $\\lambda$ of $\\mathbf{M}$ achieves $|\\lambda - \\lambda^\\star| \\lesssim \\max\\{\\sigma\\sqrt{n\\log n}, B\\log n\\}\\sqrt{\\mu/n} = O(\\sigma\\sqrt{\\mu\\log n})$ (Corollary 1) \u2014 up to $O(\\sqrt{n})$ times more accurate than the unadjusted leading singular value $\\sigma_1(\\mathbf{M})$ or the leading eigenvalue of $(\\mathbf{M}+\\mathbf{M}^\\top)/2$, and fully adaptive to unknown heteroscedastic noise variances \u2014 while Corollaries 2\u20133 and Theorem 5 yield sharp linear-form and $\\ell_\\infty$ entrywise eigenvector bounds including for rectangular rank-1 matrices via the asymmetrized dilation matrix $\\mathbf{M}_{\\text{d}} = \\begin{bmatrix}\\mathbf{0} & \\mathbf{M}_1 \\\\ \\mathbf{M}_2^\\top & \\mathbf{0}\\end{bmatrix}$ (Section 5.2, Equation 43)."
identity_notes: Resolved against all 442 pinned AIO concepts and 680 maintained AIMech concepts. Distinct from `AIMech:EntrywiseFirstOrderEigenvectorApproximationAndLeaveOneOutPerturbationAnalysisForLowExpectedRankRandomMatrices` (Abbe, Fan, Wang, & Zhong 2020, which analyzes *symmetric* random matrices $H_{ij} = H_{ji}$ via leave-one-out decoupling where the leading eigenvalue suffers $O(n\sigma^2/\lambda^\star)$ upward bias, whereas Chen, Cheng, & Fan 2021 exploit *asymmetry* $H_{ij} \perp H_{ji}$ via combinatorial Neumann-series walk partitions to eliminate the $O(n\sigma^2/\lambda^\star)$ eigenvalue bias without knowing heteroscedastic noise variances) and from `AIMech:LInfinityEigenvectorPerturbationBoundAndRobustFactorCovarianceEstimation` (Fan, Wang, & Zhong 2018, which is deterministic in $\|\mathbf{H}\|_\infty$ for symmetric matrices).
aliases:
