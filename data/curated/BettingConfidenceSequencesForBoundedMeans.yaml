limitations:
- Constructing valid betting martingales K_t(m) = prod_{i=1}^t (1 + lambda_i(m)(X_i - m)) requires known
  deterministic a priori support bounds [a, b] (rescaled to [0, 1]) so that predictable bets satisfy lambda_t(m)
  in (-1/(1-m), 1/m) and keep capital strictly non-negative; unbounded or heavy-tailed observations without
  known support bounds cannot use linear betting factors without breaking non-negativity (Section 1.2
  and Section 4.1).
- Unlike the closed-form Predictable Plug-in Hoeffding (PrPl-H) and Empirical Bernstein (PrPl-EB) intervals,
  the Hedged Capital confidence sequence C_t^pm has no closed-form algebraic endpoints and requires root-finding
  or grid evaluation over m in [0, 1] (with per-step cost O(G) for grid size G, though monotonicity of
  K_t^+(m) and K_t^-(m) enables binary search; Section 4.3 and Section B.4), while unhedged m-dependent
  aGRAPA bets can violate quasiconvexity and produce disconnected non-interval sublevel sets in pathological
  low-prior-variance regimes (Section E.4).
- In finite-population sampling without replacement (Hedged-WoR), whenever the candidate remaining mean
  m_t^WoR = (N m - sum_{i=1}^{t-1} X_i)/(N - t + 1) falls outside [0, 1] at step t, the null value m is
  deterministically falsified (K_t^WoR(m) = infinity), and the method requires knowing the exact finite
  population size N in advance (Section 5.1).
- All 1,971 lines of Waudby-Smith & Ramdas (2024, arXiv:2010.09686) were read. Constructed numerical checks
  in research/discovery/betting-confidence-sequences-bounded-means-boundaries.py verify Proposition 2
  / Theorem 2 exact betting martingale vs. PrPl-EB supermartingale and Fan's inequality, Theorem 3 / Lemma
  2 / Proposition 5 Hedged quasiconvexity and hgKelly convexity vs. Section E.4 unhedged aGRAPA non-convex
  sublevel sets, Theorem 4 / Proposition 4 Hedged-WoR exact martingale and width collapse, and Proposition
  6 Hoeffding dominance plus Section E.6 Owen's empirical likelihood ratio duality.
