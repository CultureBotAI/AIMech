claims:
- claim_id: predictable-plugin-empirical-bernstein-supermartingale-and-asymptotic-variance-adaptivity
  kind: mechanism
  statement: For any [0, 1]-valued sequence with E_P[X_t | F_{t-1}] = mu and any predictable sequence
    lambda_t in (0, 1), defining the predictable empirical mean mu_hat_t = (1/2 + sum_{i=1}^t X_i)/(t
    + 1) and variance sigma_hat_t^2 = (1/4 + sum_{i=1}^t (X_i - mu_hat_i)^2)/(t + 1) with psi_E(lambda)
    = (-log(1 - lambda) - lambda)/4 yields a non-negative test supermartingale prod_{i=1}^t exp(lambda_i(X_i
    - mu) - 4(X_i - mu_hat_{i-1})^2 psi_E(lambda_i)) via Fan et al.'s inequality exp(xi lambda - 4 xi^2
    psi_E(lambda)) <= 1 + xi lambda for xi >= -1 (Proposition 2), generating the closed-form Predictable
    Plug-in Empirical Bernstein (PrPl-EB) confidence sequence C_t^PrPl-EB = (sum_{i=1}^t lambda_i X_i
    / sum_{i=1}^t lambda_i) +- (log(2/alpha) + 4 sum_{i=1}^t (X_i - mu_hat_{i-1})^2 psi_E(lambda_i)) /
    sum_{i=1}^t lambda_i (Theorem 2), whose fixed-n half-width W_n under i.i.d. variance sigma^2 scales
    asymptotically as sigma sqrt(2 log(2/alpha) / n) almost surely when lambda_i = sqrt(2 log(2/alpha)
    / (n sigma_hat_{i-1}^2)) wedge c (Proposition 9).
  evidence:
  - source_id: waudby-smith-ramdas2024-betting
    locator: Section 3.2, lines 183–249, Equations 10–13, Theorem 2; Section A.1, lines 1347–1384, Proposition
      2 and Proof of Theorem 2; Section E.3, lines 1860–1901, Lemmas 6–8 and Proposition 9
    relation: supports
- claim_id: hedged-capital-process-quasiconvexity-and-kelly-betting-hierarchies
  kind: mechanism
  statement: 'For m-independent predictable pre-truncation bets lambda_dot_t^+, lambda_dot_t^- >= 0 truncated
    to lambda_t^+(m) = min(lambda_dot_t^+, c/m) and lambda_t^-(m) = min(lambda_dot_t^-, c/(1 - m)) with
    c in [0, 1) and allocation weight theta in [0, 1], the positive capital K_t^+(m) = prod_{i=1}^t (1
    + lambda_i^+(m)(X_i - m)) is nonincreasing and log-convex on the active region, the negative capital
    K_t^-(m) = prod_{i=1}^t (1 - lambda_i^-(m)(X_i - m)) is nondecreasing, and both the hedged maximum
    K_t^pm(m) = max(theta K_t^+(m), (1 - theta) K_t^-(m)) and mixture martingale M_t^pm(m) = theta K_t^+(m)
    + (1 - theta) K_t^-(m) are quasiconvex in m so that their (1 - alpha)-sublevel sets B_t^pm = {m in
    [0, 1] : K_t^pm(m) < 1/alpha} and C_t^pm = cap_{i=1}^t B_i^pm are guaranteed connected intervals (Theorem
    3, Lemma 2, and Section A.2); whereas the Hedged Grid Kelly process K_t^hgKelly(m) (Table 1, Proposition
    5) is globally convex in m, unhedged m-dependent aGRAPA capital K_t^aGRAPA(m) can exhibit disconnected
    non-interval sublevel sets (Section E.4 counterexample).'
  evidence:
  - source_id: waudby-smith-ramdas2024-betting
    locator: Section 4.1–4.3, lines 281–374, Equations 15–19, Theorem 3; Section B, lines 1425–1553, Table
      1, Proposition 5 (Convexity of hgKelly); Section A.2, lines 1386–1416, Lemma 2 and Proof of Theorem
      3; Section E.4, lines 1902–1908
    relation: supports
- claim_id: universal-law-of-the-iterated-logarithm-rate-and-owens-empirical-likelihood-duality
  kind: mechanism
  statement: Any Hoeffding factor exp(lambda(x - m) - lambda^2/8) with lambda in [-4/5, 4/5] is pointwise
    dominated on x, m in [0, 1] by a linear betting factor 1 + gamma^m(lambda)(x - m) with gamma^m(lambda)
    = exp(lambda(1 - m) - lambda^2/8) - exp(-lambda m - lambda^2/8) in [-1, 1] (Proposition 6), which
    implies via stitched geometric-grid mixtures that a discrete mixture of linear betting martingales
    achieves the universal law-of-the-iterated-logarithm shrinkage rate nu(C_t^L) = O(sqrt(log log t /
    t)) uniformly over all P in P^mu (Proposition 7) and O(1/sqrt(n)) fixed-sample width (Proposition
    8); moreover, the optimal hindsight capital K_t^HS(m) = sup_{lambda in [-1/(1-m), 1/m]} prod_{i=1}^t
    (1 + lambda(x_i - m)) equals the exact reciprocal 1 / R(x_1^t; m) of Owen's (2001) nonparametric empirical
    likelihood ratio at lambda^EL = lambda^HS (Section E.6).
  evidence:
  - source_id: waudby-smith-ramdas2024-betting
    locator: Section E.1, lines 1732–1773, Proposition 6; Section E.2.1–E.2.2, lines 1774–1826, Propositions
      7 and 8; Section E.6, lines 1914–1920 (Owen's empirical likelihood ratio duality)
    relation: supports
  - source_id: vovk-wang2021-evalues
    locator: Section 2, lines 139–196 (betting capital interpretation of e-variables and test martingales)
    relation: supports
- claim_id: finite-population-sampling-without-replacement-hedged-betting-confidence-sequences
  kind: application
  statement: 'For sequential sampling without replacement (WoR) from any finite population {x_1, ...,
    x_N} subset [0, 1]^N with mean mu = (1/N) sum_{i=1}^N x_i, replacing the static null mean m at step
    t by the predictable remaining population mean m_t^WoR = (N m - sum_{i=1}^{t-1} X_i)/(N - t + 1) in
    the hedged capital factors K_t^+(m) = prod_{i=1}^t (1 + lambda_i^+(m)(X_i - m_i^WoR)) and K_t^-(m)
    = prod_{i=1}^t (1 - lambda_i^-(m)(X_i - m_i^WoR)) with truncation lambda_t^+(m) = min(lambda_dot_t^+,
    c / m_t^WoR) and lambda_t^-(m) = min(lambda_dot_t^-, c / (1 - m_t^WoR)) yields an exact test martingale
    under H_0^WoR : mu = m (Proposition 4, Section A.3) whose (1 - alpha)-level set C_t^WoR forms a valid
    finite-population confidence sequence that collapses to the exact singleton {mu} at t = N (Theorem
    4).'
  evidence:
  - source_id: waudby-smith-ramdas2024-betting
    locator: Section 5, lines 385–446, Equations 20–24, Theorem 4 (Hedged-WoR CSs); Section A.3, lines
      1417–1424, Proposition 4 and Proof of Theorem 4
    relation: supports
