id: AIMech:BettingConfidenceSequencesForBoundedMeans
name: Betting confidence sequences for bounded random variables
aliases:
- Hedged Capital Process Confidence Sequence (Hedged-CS)
- Predictable Plug-in Empirical Bernstein Confidence Sequence (PrPl-EB)
- Approximate GRAPA Betting Martingale (aGRAPA)
- Hedged Grid Kelly Confidence Sequence (hgKelly)
- Betting Without Replacement Confidence Sequence (Hedged-WoR)
concept_kind: mathematical_method
definition: 'A nonparametric, nonasymptotic sequential and fixed-sample statistical inference framework
  (Waudby-Smith & Ramdas 2024) for estimating the common conditional mean mu in [0, 1] of a dependent
  sequence of [0, 1]-bounded random variables (X_t)_{t>=1} satisfying E_P[X_t | F_{t-1}] = mu by inverting
  composite family of test martingales (capital processes) K_t(m) = prod_{i=1}^t (1 + lambda_i(m)(X_i
  - m)) driven by F_{t-1}-predictable betting fractions lambda_t(m) in (-1/(1-m), 1/m) (Equation 14),
  or predictable plug-in Hoeffding and empirical Bernstein test supermartingales (Proposition 1, Theorem
  2), so that by Ville''s inequality the sublevel set C_t = {m in [0, 1] : K_t(m) < 1/alpha} forms a time-uniform
  (1 - alpha)-confidence sequence satisfying sup_{P in P^mu} P(exists t >= 1 : mu not in C_t) <= alpha
  and P(mu not in C_tau) <= alpha at any stopping time tau (Theorem 1).'
identity_notes: No normalized identity match for Betting confidence sequences for bounded random variables
  across all 442 pinned AIO records and 574 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 179 discovery
  artifacts where Waudby-Smith & Ramdas (2024, arXiv:2010.09686) was queued as a pending frontier lead.
  Distinct from AIMech:EDetectorSequentialChangeDetection (Shin, Ramdas, & Rinaldo 2024), which constructs
  cumulative-sum (e-SR) and running-maximum (e-CUSUM) e-detectors to detect an unknown changepoint with
  Average Run Length control E[N^*] >= 1/alpha, and from AIMech:UniversalInferenceSplitLikelihoodRatioTest
  (Wasserman, Ramdas, & Balakrishnan 2020) and AIMech:EValueCalibrationAndMerging (Vovk & Wang 2021),
  which do not develop predictable plug-in empirical Bernstein supermartingales, hedged capital processes
  K_t^pm(m), aGRAPA/LBOW Kelly approximations, or finite-population without-replacement betting confidence
  sequences.
