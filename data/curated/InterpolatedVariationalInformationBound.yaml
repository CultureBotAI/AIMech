name: Interpolated variational information bound
definition: A family of multi-sample mutual-information lower bounds that interpolates the critic’s empirical
  partition estimate with a positive variational normalizer inside a ratio, connecting NWJ and InfoNCE
  parameterizations.
concept_kind: mathematical_method
identity_notes: 'This is Poole et al.’s I_alpha family, not Rényi alpha-information, a convex average
  of final scalar bounds, or an ordinary temperature parameter. Its endpoints connect existing parameterizations;
  the interior normalizer and residual product expectation define the distinct construction. The paper’s
  proposed optimal critic is explicitly a conjecture. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 208 preceding native IDs/names/aliases. Word-delimited fixed-string
  searches of both full checkouts, including ignored and hidden files, returned 57 lines each: existing
  MINE-f component discussion, shared primary-source references, and discovery/review context. Four native
  neighbors and seven exact AIO nodes with scoped synonyms and outgoing relations were inspected.'
limitations:
- The lower bound is an expectation with specified independence; a finite minibatch is not a guaranteed
  lower bound. The held-out product sample must be independent of every input used in its normalizer.
- The positive q is a variational normalizer; choosing it as an estimated marginal is one configuration.
  The paper conjectures f=log p(y|x), q=p(y) as an optimum rather than proving it generally.
- 'The main formula, supplemental table and notebook are not textually consistent: the supplemental I_alpha
  row places a log in the product term, and a notebook docstring reverses the alpha-logit endpoint labels.
  This record follows main Equation (11), the explicit mixture definition and the independently checked
  ceiling qualification.'
- The notebook mixes score-matrix orientations across critic implementations. Only declared cells were
  read; no TensorFlow code, training or benchmark was executed. The finite-domain arithmetic check evaluates
  the population formula by enumeration and is not a trained-estimator experiment.
id: AIMech:InterpolatedVariationalInformationBound
aliases:
- I-alpha bound
- Nonlinearly interpolated mutual information lower bound
