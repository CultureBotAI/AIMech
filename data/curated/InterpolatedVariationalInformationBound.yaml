  relation: supports
claims:
- claim_id: method
  kind: mechanism
  statement: Draw X_1:K independently from p(x), with Y conditional on X_1 for the joint term. Let m(y;X_1:K)=K^−1
    sum_i exp(f(X_i,y)), b_alpha=alpha*m+(1−alpha)*q(y), and r=exp(f(X_1,y))/b_alpha, for q(y)>0 and alpha
    in [0,1]. Define I_alpha=1+E_p(x_1:K)p(y|x_1)[log r]−E_p(x_1:K)p(y)[r]. The second expectation uses
    Y independent of all K inputs. Applying NWJ to the augmented variables gives I_alpha<=I(X_1;Y). At
    alpha=0 this is NWJ after the critic transformation T=1+f−log q; at alpha=1 exchangeability makes
    the product expectation equal one and yields InfoNCE. For interior alpha the product term must be
    retained. A leave-one-out minibatch implementation can hold out an additional paired sample’s Y to
    estimate that independent product term, leaving K other inputs in the normalizer.
  evidence:
  - source_id: method-source
    locator: Sections 2.3–2.4, PDF pp. 4–5, Equations (8)–(11), independence construction, endpoint discussion
      and conjecture
    relation: supports
- claim_id: ceiling-qualification
  kind: limitation
  statement: 'A curator derivation from Equation (11) gives the conservative ceiling 1+log(K/alpha) for
    alpha>0: r<=K/alpha and the product expectation is nonnegative. At alpha=1 the cancellation gives
    the sharper InfoNCE ceiling log K. The paper’s page-5 prose states log(K/alpha) for the general family,
    whereas the pinned notebook’s plotting code includes the additive one. A deterministic finite-domain
    calculation saved in the discovery ledger yields I_alpha approximately 2.08113 for K=2 and alpha=0.5,
    exceeding log(4) approximately 1.38629 while remaining below the true information. Therefore the stronger
    printed ceiling is not adopted. This is explicit curator analysis of the displayed formula, not an
    author-issued erratum.'
  evidence:
  - source_id: method-source
    locator: Equation (11), PDF p. 4, and stated ceiling at the start of p. 5; formula and prose distinguished
    relation: supports
  - source_id: additional-1
    locator: 'Zero-based cell 35 line 35: 1 + log(batch_size) − log_alpha plotted; mixture candidate count
      in cells 10–11 is batch_size−1'
    relation: supports
- claim_id: source-conventions
  kind: limitation
  statement: The main Equation (11) uses a ratio without a logarithm in the product expectation, but supplementary
    Table 2 prints a logarithm in that term. The pinned notebook implements the ratio term; its interpolation
    docstring reverses endpoint labels even though log_interpolate weights the batch normalizer by alpha.
    The notebook also uses different score orientations in its two critic classes. The record follows
    the explicit main formula and keeps these source inconsistencies visible rather than asserting that
    every displayed expression or code path is equivalent.
  evidence:
  - source_id: method-source
    locator: Main PDF p. 4, Equation (11)
    relation: supports
  - source_id: additional-2
    locator: 'Supplementary PDF p. 1, Table 2, I_alpha row: logarithm shown in the second expectation,
      unlike main Equation (11)'
    relation: supports
  - source_id: additional-1
    locator: 'Zero-based notebook cells 7, 11, 16 and 19: product term, alpha-logit mixture, baseline
      and critic orientations'
    relation: supports
