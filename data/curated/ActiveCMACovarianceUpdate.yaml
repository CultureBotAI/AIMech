  best-minus-worst old-mean moments and its combined path update. It is distinct from the maintained 2001
  CMA base, 2003 nonnegative rank-mu blend, whole Active-CMA-ES, restart controllers and later negative-weight
  safeguards. Fresh postmerge collection at 1031c6b1f1f4492fbebec6eee1db5a6c68672d9e checked all 737 native
