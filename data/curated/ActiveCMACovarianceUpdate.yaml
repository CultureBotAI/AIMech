- target: AIO:MathematicalFunction
  relation: related_match
  rationale: Equations 5–6 define an explicit matrix-valued rule from the current covariance, supplied
    updated path, ranked mutation steps and scalar rates to a new symmetric matrix. This specific mathematical
    construction supports the relation, rather than generic computability of a whole optimizer. It asserts
    neither equivalence nor an upstream subclass edge, scalar activation semantics or universal positive-definite
    output. The host’s separate exponential step-size operation is not imported.
limitations:
- The scope is the original equal-weight best/worst moment and combined covariance rule. The whole Active-CMA-ES
  optimizer, later unequal-weight negative updates, the distinct (1+1) active method, restart policies
  and modern implementations are not exact aliases of this component.
- A positive-definite input matrix does not ensure a positive-definite output. The source says a detected
  loss can be fixed but does not specify an executable repair. Eigenvalue clipping, step normalization,
  negative-weight rescaling or exponential covariance updates are not silently added. Good conditioning
  and stable finite-precision eigendecomposition are separate concerns.
- A rank or tie policy is required to define the selected groups in general. The source does not fully
  specify a tie convention. In the hand example, objective ties occur only within pairs whose order does
  not alter the top or bottom group. This example is not a sampled failure rate or a benchmark replication.
- The neutral-selection expectation and zero-path calculation use explicitly fixed pre-update covariance
  and independent random ranking. They do not certify martingale behavior or stationarity throughout an
  adaptive run. The calculation is curator hand algebra, not an author erratum or an audit of the separate
  2005 thesis argument cited by the paper.
- The beta fit and reported comparisons concern the source’s specified tests. Neither the empirical absence
  of covariance failure in those runs nor the selected rates establish universal stability, speedup, objective
  improvement or global convergence. No optimizer, author code or benchmark was run, and numerical plot
  results are not curated here.
- The primary bytes are an eight-page archived CiteSeer copy, not certified as identical to an author-hosted
  or publisher copy. Locators use PDF pages; the file’s build date is not the publication date, and differing
  external proceedings pagination is not resolved by the PDF labels. All eight native-text pages and the
  defining pages 1–4 visually were inspected in supporting research. The cited thesis and later active-method
  papers were not fully inspected.
