  active-covariance leads, unrelated Gaussian-process cross-covariance language, and existing IPOP boundary
  context. This finding is bounded to the pinned inventory and inspected semantic neighborhoods, not all
  AI literature. Existing owner 201 is resolved in place with later variants retained.
