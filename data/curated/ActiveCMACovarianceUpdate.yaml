id: AIMech:ActiveCMACovarianceUpdate
name: Active CMA covariance update
concept_kind: mathematical_method
aliases: []
definition: A matrix-valued covariance-update component from the original 2006 active CMA construction
  that combines retained search covariance and an evolution-path outer product with an equal-weight best-minus-worst
  mutation-step second moment.
definition_evidence:
- source_id: jastrebski2006
  locator: Section II, PDF p. 2, mutation-step and evolution-path definitions; Section III, PDF p. 3,
    Equations 5–6.
  relation: supports
claims:
- claim_id: signed-old-mean-mutation-moments
  kind: mechanism
  statement: For integer dimension n>=1, positive scale sigma and current positive-definite C=B*D^2*B^T,
    with orthogonal B and positive diagonal D, write each mutation step as u_i=(offspring_i-old_mean)/sigma=B*D*z_i,
    where the z_i are independent standard-normal vectors. The source ranks lambda=4*mu offspring, with
    integer mu>=1, and forms Z=(1/mu)*sum_best_mu(u_i*u_i^T)-(1/mu)*sum_worst_mu(u_i*u_i^T). The two groups
    have equal weight magnitudes and opposite signs; intermediate ranks do not enter Z. Both moments use
    the old sampling mean and scale. They are not covariances centered on their selected-group means,
    and the negative covariance weights do not replace the source mean update with negative recombination
    weights.
  evidence:
  - source_id: jastrebski2006
    locator: Section II, PDF p. 2, sampling and ranking steps 1–4; Section III, PDF p. 3, Equation 5 and
      the distinction from weighted mean recombination.
    relation: supports
- claim_id: active-path-and-population-update
  kind: mechanism
  statement: The source accumulates the selected mean step into p_new=(1-c_C)*p_old+sqrt(mu*c_C*(2-c_C))*mean_best_mu(u_i),
    with c_C=4/(n+4), and uses C_new=(1-c_cov)*C+c_cov*p_new*p_new^T+beta*Z. The updated path represents
    accumulated selected mean-step information, whereas Z uses the current generation’s individual best
    and worst steps. Equation 6 replaces the baseline hybrid coefficient arrangement; it is not obtained
    by retaining the old alpha mixture unchanged while merely assigning a negative sign to an extra step.
  evidence:
  - source_id: jastrebski2006
    locator: Section II, PDF p. 2, step 5 and Equation 2; Section III, PDF p. 3, Equations 5–6.
    relation: supports
- claim_id: source-rates-and-empirical-beta
  kind: scope
  statement: For this active rule, the paper sets c_cov=2/(n+sqrt(2))^2 and beta=(4*mu-2)/((n+12)^2+4*mu).
    The beta expression was fitted after multiplying experimentally selected values by 0.6, using ellipsoid
    tests at n in {2,3,5,10,20,40,80} and mu in {2,n}, then rounding the fitted coefficients. This is
    an empirical parameter prescription, not a universally optimal rate or a guarantee that every updated
    matrix remains positive definite.
  evidence:
  - source_id: jastrebski2006
    locator: Section III, PDF p. 3, c_cov expression following Equation 6; PDF p. 4, beta fitting discussion
      and Equation 7.
    relation: supports
- claim_id: signed-moment-and-definiteness-boundary
  kind: scope
  statement: Z is symmetric but can be indefinite, with rank at most min(n,2*mu). The negative summand
    subtracts the worst-step second moment relative to the same update without that summand; the full
    update need not decrease every direction. A bounded curator hand example uses n=mu=2, lambda=8, C=I,
    old_mean=0, sigma=1 and p_old=0, ranking by squared Euclidean norm. Let the best steps be ±(1/2)e2,
    the middle steps ±e1 and ±2e1, and the worst steps ±6e1. Then p_new=0 and Z=diag(-36,1/4). With the
    source rates, the first diagonal of C_new is 2*sqrt(2)-52/17<0. Thus even these parameter settings
    do not preserve positive definiteness for every supplied generation.
  evidence:
  - source_id: jastrebski2006
    locator: Section III, PDF p. 3, Equations 5–6; PDF p. 4, Equation 7 and explicit positive-definiteness
      warning. The rank bound, directional qualification and two-dimensional example are curator linear
      algebra from these formulas, not reported author experiments.
    relation: supports
- claim_id: neutral-selection-and-zero-path-scope
  kind: scope
  statement: 'With a fixed pre-update C, independent zero-mean Gaussian mutation steps with covariance
    C, and ranking randomized independently of those steps, the best and worst groups have equal expected
    second moments, so E[Z]=0. This need not hold under fitness-based selection. With p_old=0 under the
    same neutral law, the first path has E[p_new*p_new^T]=c_C*(2-c_C)*C, giving E[C_new]=[1-c_cov*(1-c_C)^2]*C.
    This curator first-step calculation qualifies the source’s stationarity motivation: zero initialization
    is different from a stationary-path idealization. It is not a claim about the full adaptive run.'
  evidence:
  - source_id: jastrebski2006
    locator: Section II, PDF p. 2, zero-path initialization and step 5; Section III, PDF p. 3, random-selection
      discussion between Equations 5–6. The zero-path expectation is curator algebra under the stated
      frozen-law assumptions.
    relation: supports
- claim_id: original-component-and-host-boundary
  kind: scope
  statement: This identity is the original 2006 equal-weight signed covariance-update component, not the
    whole Active-CMA-ES optimizer. The source host uses unweighted best-offspring mean recombination and
    a separate cumulative step-size rule with a scalar exponential. That host operation is outside the
    defining Equations 5–6 component. The new subtractive moment differs from the reviewed positive rank-one
    or nonnegative hybrid covariance rules. The paper leaves weighted recombination for future work; arbitrary
    weighted-negative updates and later safeguards are not identified with this original construction.
  evidence:
  - source_id: jastrebski2006
    locator: Section II, PDF pp. 2–3, Equations 1–4 and step 7; Section III, PDF p. 3, Equations 5–6 and
      exclusion of weighted mean recombination; Section V, PDF pp. 7–8, conclusions and future weighted-recombination
      work.
    relation: supports
