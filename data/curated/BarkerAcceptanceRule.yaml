name: Barker acceptance rule
definition: An acceptance-probability rule for reversible Monte Carlo proposals that uses R/(1+R), where
  R is the target-density ratio times the reverse-to-forward proposal ratio.
concept_kind: mathematical_method
identity_notes: The record covers Hastings’s s_ij=1 form, which reduces to Barker’s 1965 rule for symmetric
  proposals. It is a scalar decision rule used inside a sampler, not a complete choice of proposal, a
  logistic-regression model, or the Metropolis min(1,R) rule. The original 1965 plasma paper was located
  but its full text has not been inspected for this record. No normalized identity match was found across
  all 442 pinned AIO labels/scoped synonyms and 153 prior native IDs/names/aliases. Both checkout text
  searches included ignored and hidden files and returned no matches for the selected exact IDs, full
  labels, aliases and source titles. Existing HMM and Markov random field records describe probability
  models, not these sampling or tuning procedures.
limitations:
- The asymmetric-proposal formula is an explicit algebraic restatement of Hastings’s general construction,
  not a claim that the inspected source is Barker’s original paper.
- The rule alone supplies neither a proposal distribution nor an ergodic or rapidly mixing chain. Support,
  boundary cases and numerical evaluation still require specification.
- The same ratio generally gives different acceptance probabilities under Barker and Metropolis rules.
  A lower or higher acceptance probability alone does not prove a universal computational-efficiency ordering.
- No claim is made about newer methods called Barker proposals or gradient-based Barker samplers; those
  can use different proposal mechanisms and need separate identity review.
