claims:
- claim_id: method
  kind: mechanism
  statement: For a current state x and proposed state y with positive finite denominator, compute R=pi(y)q(x|y)/(pi(x)q(y|x))
    and accept with alpha=R/(1+R). This follows algebraically by choosing s_ij=1 in Hastings Equation
    (6). With a symmetric proposal alpha=pi(y)/(pi(x)+pi(y)). Pairing the rule with the proposal and retaining
    x on rejection yields detailed balance. At equal positive target weights and symmetric q, acceptance
    is one half rather than the Metropolis value one.
