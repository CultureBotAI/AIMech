claims:
- claim_id: method
  kind: mechanism
  statement: For the stated binary-CSP formulation, maintain one domain value for each variable. Select
    a variable currently in conflict with at least one other variable, and evaluate its possible values
    against the other current assignments. Choose a minimum-conflict value, breaking ties randomly. The
    source footnote interprets the binary score as the number of conflicting other variables; for general
    constraints, estimating how many variables need repair depends on the constraint. The current value
    remains an eligible candidate, so an update can leave the assignment unchanged or move sideways. Initialization
    and the choice among conflicted variables belong to the surrounding search strategy. In the described
    local-repair use, repeat repairs until a consistent assignment is found or a chosen budget ends. The
    same value-ordering idea can instead guide an informed backtracking procedure; that procedure is not
    an exact synonym for the heuristic.
