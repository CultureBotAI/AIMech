name: Joint term-citation model
definition: A latent-factor document model that shares each document's fixed topic proportions between
  categorical term and citation-incidence channels, with topic-specific distributions for each channel.
concept_kind: model_family
identity_notes: Scoped to Cohn and Hofmann's joint content/connectivity model in The Missing Link. The
  maintained name describes its term/citation construction; PHITS names a link-only predecessor and is
  not used as an alias. Fixed document memberships distinguish this PLSA-style model from the integrated
  Dirichlet word/reference model of Erosheva and colleagues. Link orientation must be specified from the
  supplied incidence matrix rather than silently treating cited targets and citing sources as interchangeable.
  No normalized candidate identity matched all 442 pinned AIO IDs, labels and scoped synonyms or 429 preceding
  native IDs, names and aliases. Full-checkout searches included ignored and hidden files in both checkouts;
  23 matching lines per checkout came from four unique file contents containing prior frontier leads and
  contextual distinctions. All matching excerpts were inspected. The semantic search returned 205 label/synonym
  hits, with 204 unchanged from prior reading and one newly read. Eighteen annotated AIO CLASS nodes and
  outgoing edges were byte-verified against prior inspected versions. Twenty-six contextual YAMLs comprise
  24 unchanged prior readings and two final round102 records verified against their fully read scientific-review
  inputs. No candidate record is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- 'The exposition alternates between citing-source and cited-target language: Section 2 defines an incidence
  matrix as document i cited by j, while PHITS and Section 3 use differing verbal descriptions. The factor
  equations apply to the chosen orientation, but transposing the matrix changes the modeling task. No
  unique historical implementation orientation is inferred.'
- The displayed channel normalization is undefined for a document with an empty channel; a complete implementation
  needs an explicit missing-channel policy. Alpha endpoints discard one channel. Fixed topic count, categorical
  incidence modeling and fixed document weights constrain generalization; unseen documents require inference
  of new mixtures.
- The reported factor-space nearest-neighbor classification, topic counts tied to known category counts,
  and source-page ranking among random distractors are specific evaluation setups. They do not establish
  recovery of true classes, universal advantage, or a demonstrated end-to-end web crawler.
- Reference-flow scores sum over observed link support and use reverse document-given-topic probabilities
  requiring prior and normalization choices. They are not automatically a calibrated Markov transition
  or causal information flow. The proposed continuous-state MDP extension is prospective. No author code
  or benchmark was executed.
