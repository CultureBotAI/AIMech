claims:
- claim_id: shared-fixed-memberships
  kind: mechanism
  statement: Each document d has one fixed topic probability vector theta_d. Topic z has a categorical
    term distribution phi_z and a separate categorical citation-incidence distribution psi_z. The channel
    mixtures are P(t|d)=sum_z theta_dz*phi_zt and P(c|d)=sum_z theta_dz*psi_zc. Topic choices are made
    per observation and share the document weights; the construction is not one latent topic for a whole
    document and does not integrate a Dirichlet membership prior. The source optimizes alpha times the
    term log score plus 1-alpha times the link log score, separately normalizing each document's counts
    in each channel. This weighted criterion gives equal document mass per nonempty channel and differs
    from the raw-count corpus likelihood.
  evidence:
  - source_id: method-source
    locator: Section 3, PDF pp.3-4, channel mixtures and Equation (2)
    relation: supports
- claim_id: weighted-responsibility-fitting
  kind: mechanism
  statement: An EM-style fit computes topic responsibilities separately for observed terms and citation
    incidences, then pools their document-normalized expected counts with channel weights alpha and 1-alpha.
    Document mixtures combine the two channel responsibility averages, and each topic's emission counts
    must be normalized over its own channel categories. Equation (3) has an inconsistent document subscript
    in its first numerator, and the displayed emission updates in Equation (4) omit the final categorical
    normalization; use the conditioning document and normalized vectors for a coherent probability model.
    Experiments use tempered responsibilities, so ordinary beta=1 EM monotonicity does not certify the
    whole temperature schedule.
  evidence:
  - source_id: method-source
    locator: Section 3, PDF p.4, Equations (3)-(5); Section 4.1, PDF p.5, tempering settings
    relation: supports
