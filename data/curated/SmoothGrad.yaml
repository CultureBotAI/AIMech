name: SmoothGrad
definition: A sensitivity-map smoothing method that averages maps computed on Gaussian-noise perturbations
  of an input.
concept_kind: algorithm
identity_notes: SmoothGrad is an averaging wrapper around a sensitivity-map method, not a new trained
  network, a training-noise procedure or an exact equivalent of its underlying gradient map.
limitations:
- The result depends on the base map, noise scale and sample count.
- The paper's visual-coherence comparisons and proposed explanation for noise do not establish universal
  attribution faithfulness.
