id: AIMech:HittingSetIPAndTiledIntervalCoverOnlinePagingWithTimeWindowsAndDelays
name: Hitting-Set IP Relaxation and Tiled Interval Cover for Paging with Time Windows and Delays
concept_kind: algorithm
review_status: DRAFT
definition: An online and offline approximation framework for weighted paging with request time windows (PageTW) and monotone delay penalties (PageD) on a cache of size k over n pages that replaces the Omega(k)-integrality-gap interval-packing LP with a Hitting-Set Integer Program enforcing right-extension constraints Rext(I, t) = [s(I), ..., max(t, e(I))] over k+1 distinct pages and double-extension constraints Dext(I, t) = [min(s(I_t), s(I)), ..., t] over k distinct non-critical pages, solves the compactified constraints via Tiled Interval Cover (TiledIC/TiledICEx) and non-nested net extension, and converts online hitting-set solutions into feasible cache schedules via Hall-set weight thresholding and earliest-deadline-first charging forests to achieve O(log k log n)-competitive online and O(1)-approximate offline bounds.
identity_notes: No AIO class represents online primal-dual hitting-set LP/IP relaxations for paging with time windows and delays; MachineLearningTask (AIO:MachineLearningTask) is the closest broad match covering online sequential decision-making and optimization tasks.
aliases:
- PageTW and PageD Hitting-Set IP Caching Algorithm
- Right-and-Double-Extension Hitting-Set LP for Caching with Deadlines
- Gupta-Kumar-Panigrahi Online Paging with Time Windows and Delays
