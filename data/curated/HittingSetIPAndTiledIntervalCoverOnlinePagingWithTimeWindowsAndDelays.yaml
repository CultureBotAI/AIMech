claims:
- claim_id: right-and-double-extension-hitting-set-ip-and-tiled-interval-cover-reduction
  kind: mechanism
  statement: Whereas the natural interval-packing LP relaxation for PageTW has an Omega(k) integrality gap (Theorem B.1), the Hitting-Set IP with right extensions Rext(I, t) = [s(I), ..., max(t, e(I))] (Constraint R1/R2p) and double extensions Dext(I, t) = [min(s(I_t), s(I)), ..., t] (Constraint D1/D3p) reduces to Tiled Interval Cover (TiledIC, which is totally unimodular with integrality gap 1) and TiledICEx (integrality gap at most 2, Lemma D.1) plus two applications of the non-nested net Extension Theorem (Theorem 5.12), yielding a constant O(1) integrality gap and O(log k)-competitive online IP solution (Corollary 5.15).
  evidence:
  - source_id: r835-primary-pdf
    locator: Section 2, Claim 2.1, pp. 6-7; Section 5.1-5.2, Lemmas 5.2-5.14 and Corollary 5.15, pp. 18-26; Appendix B.2 Theorem B.1, p. 31; Appendix D Lemma D.1-D.2, pp. 33-34
    relation: supports
- claim_id: hall-set-threshold-and-charging-forest-online-schedule-conversion
  kind: mechanism
  statement: Given a past-preserving, sparse online hitting-set solution A^*_t, ConvertOnline (Algorithms 1-2) uses Hall's marriage theorem (Lemma 3.4) to select a resident hit page p^* in Z^* satisfying w(U^circ_{<= 2 w(p^*)}) <= 2 w(Z^*_{<= w(p^*)}) and bounds overlapping-interval evictions via a weight-class charging forest F = (T, E) (Claims 3.8-3.13), converting an alpha-competitive online hitting-set solution into an O(alpha log n)-competitive cache schedule (Theorem 3.1) and an O(alpha)-approximate offline schedule via reverse-delete pruning (Algorithm 3, Theorem 4.1).
  evidence:
  - source_id: r835-primary-pdf
    locator: Section 3.1-3.2, Algorithms 1-2, Theorem 3.1, Lemma 3.4, Claims 3.8-3.13, pp. 8-16; Section 4, Algorithm 3, Theorem 4.1, pp. 16-18
    relation: supports
- claim_id: deadline-io-scheduling-and-video-streaming-delayed-caching-application
  kind: application
  statement: By decomposing each general monotone delay request (p, t, F) into an ensemble of deadline intervals [t, t'] with incremental penalties F(t'+1) - F(t') (Section 6, Theorem 6.1), the framework provides O(log k log n)-competitive online and O(1)-approximate offline caching schedules for deadline-aware I/O scheduling and video-on-demand segment caching.
  evidence:
  - source_id: r835-primary-pdf
    locator: Section 1, pp. 1-2; Section 6, Theorem 6.1, p. 27
    relation: supports
- claim_id: clairvoyant-deadline-knowledge-and-extra-log-n-online-conversion-limitation
  kind: limitation
  statement: The O(log k log n)-competitive online bound for PageTW requires the clairvoyant setting in which a request's deadline e(I) is revealed at arrival time s(I) (used to sort active requests in earliest-deadline-first order in Algorithm 2, line 16) and incurs an extra O(log n) factor over the O(log k) classical weighted paging bound when converting overlapping request intervals across weight classes (Section 2, p. 6; Section 3.2, p. 12-16).
  evidence:
  - source_id: r835-primary-pdf
    locator: Section 1.1, p. 5; Section 2, p. 6; Section 3.2, Algorithm 2 line 16 and Claim 3.13, pp. 12-16
    relation: supports
