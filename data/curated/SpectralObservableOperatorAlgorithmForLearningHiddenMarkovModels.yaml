claims:
- claim_id: claim-observable-operator-similarity-equivalence-and-joint-probability-factorization
  kind: mechanism
  statement: Given an $m$-state HMM with initial state distribution $\vec{\pi}>0$, transition matrix $T\in\mathbb{R}^{m\times m}$, observation matrix $O\in\mathbb{R}^{n\times m}$, and state-observation operators $A_x = T\mathrm{diag}(O_{x,1},\dots,O_{x,m})$, Lemma 2 proves that if $\mathrm{rank}(O) = \mathrm{rank}(T) = m$ and $U\in\mathbb{R}^{n\times m}$ satisfies $\mathrm{range}(U) = \mathrm{range}(O)$ (assured when $U$ comprises the top-$m$ left singular vectors of $P_{2,1} = O T \mathrm{diag}(\vec{\pi}) O^\top$), then $U^\top O$ is invertible; Lemma 3 further establishes that $\vec{b}_1 = U^\top P_1$, $\vec{b}_\infty = (P_{2,1}^\top U)^\dagger P_1$, and $B_x = (U^\top P_{3,x,1})(U^\top P_{2,1})^\dagger$ obey $B_x = (U^\top O) A_x (U^\top O)^{-1}$, $\vec{b}_1 = (U^\top O)\vec{\pi}$, and $\vec{b}_\infty^\top = \vec{1}_m^\top (U^\top O)^{-1}$, yielding exact joint probabilities $\Pr[x_1,\dots,x_t] = \vec{b}_\infty^\top B_{x_t}\cdots B_{x_1}\vec{b}_1$ for all $t\ge 1$.
  evidence:
  - source_id: hkz2012-spectralhmm-pdf
    locator: Section 3.1, Lemmas 1-3, Equations (1)-(6), pp. 5-7
    relation: supports
  - source_id: hkz2012-spectralhmm-abs
    locator: Abstract
    relation: supports
- claim_id: claim-polynomial-sample-complexity-and-alphabet-size-independence-for-joint-and-conditional-distributions
  kind: mechanism
  statement: Theorem 6 proves that for an HMM with $m$ hidden states and minimum singular values $\sigma_m(O), \sigma_m(T) > 0$, the empirical estimates $(\hat{b}_1,\hat{b}_\infty,\{\hat{B}_x\})$ computed by Algorithm LEARN-HMM from $N \ge C (t^2/\varepsilon^2)(m/(\sigma_m(O)^4 \sigma_m(T)^2))\log(1/\delta)$ sample triples satisfy $\sum_{x_1,\dots,x_t}|\Pr[x_1,\dots,x_t] - \widehat{\Pr}[x_1,\dots,x_t]| \le \varepsilon$ with probability at least $1-\delta$, where the sample complexity is completely independent of the discrete observation cardinality $n$; furthermore, under observation diversity $\pi_{\min} > 0$, Theorem 7 establishes conditional filtering stability $\mathrm{KL}(\Pr[x_t|\text{history}] \| \widehat{\Pr}[x_t|\text{history}]) \le \varepsilon$ over arbitrarily long horizons $t$ via recursive state normalization.
  evidence:
  - source_id: hkz2012-spectralhmm-pdf
    locator: Section 2.2-2.3, Theorems 1 & 2, pp. 3-5; Section 3.2, Algorithm LEARN-HMM, p. 6; Section 5-6, Theorems 6 & 7, pp. 9-19
    relation: supports
  - source_id: hkz2012-spectralhmm-cr
    locator: Journal of Computer and System Sciences 78(5):1460-1480 (2012) metadata
    relation: supports
- claim_id: claim-scope-multi-observation-window-extensions-and-explicit-parameter-recovery
  kind: scope
  statement: Corollary 11 and Section 3.3 extend LEARN-HMM to rank-deficient single-step observation matrices by replacing single observations with length-$\ell$ observation windows whenever the $\ell$-step compound observation matrix has rank $m$, while Appendix C shows that if for some $x$ the eigenvalues of $\mathrm{diag}(O_{x,1},\dots,O_{x,m})$ are separated, the eigendecomposition of $B_x = (U^\top O) A_x (U^\top O)^{-1}$ also recovers the explicit columns of $O$ and $T$ up to permutation.
  evidence:
  - source_id: hkz2012-spectralhmm-pdf
    locator: Section 2.3 & 3.3, Corollary 11, pp. 5, 7-8; Appendix C, pp. 26-27
    relation: supports
- claim_id: claim-limitation-rank-degeneracy-of-transition-or-observation-matrix-and-singular-value-conditioning
  kind: limitation
  statement: Single-window LEARN-HMM fails when $\mathrm{rank}(O) < m$ or $\mathrm{rank}(T) < m$ because $P_{2,1} = O T \mathrm{diag}(\vec{\pi}) O^\top$ has rank strictly less than $m$ so $U^\top O$ is singular and $(U^\top P_{2,1})^\dagger$ cannot invert the hidden state space, and its sample complexity scales inversely with $\sigma_m(O)^4 \sigma_m(T)^2$.
  evidence:
  - source_id: hkz2012-spectralhmm-pdf
    locator: Section 2.1, Condition 1 & Remark 4, p. 3; Section 3.1, Lemma 2, p. 6
    relation: supports
