claims:
- claim_id: r490-claim-1
  kind: mechanism
  statement: FedEMA updates each client k's online encoder W_k^r and predictor W_k^{p,r} at the start of round r via W_k^r = mu W_k^{r-1} + (1 - mu) W_g^r and W_k^{p,r} = mu W_k^{p,r-1} + (1 - mu) W_g^{p,r} with dynamic decay rate mu = min(lambda_k ||W_g^r - W_k^{r-1}||_2, 1) (Equations 1-3) and one-shot autoscaler lambda_k = tau / ||W_g^{r+1} - W_k^r||_2 calibrated at client k's first sampled round, reducing exactly to FedBYOL when lambda_k = 0 (Algorithm 1).
  evidence:
  - source_id: r490-primary-pdf
    locator: Section 4, pp. 6-7, Equations 1-3, Algorithm 1
    relation: supports
- claim_id: r490-claim-2
  kind: mechanism
  statement: Within the generalized Siamese FedSSL framework, empirical ablation shows that (1) the online MLP predictor W_k^p is essential to prevent local representation collapse, (2) stop-gradient is not strictly required in FedBYOL because periodic server aggregation already separates the online encoder W_k from the momentum target encoder W_k^t, and (3) retaining local non-IID knowledge in both the target encoder and the EMA-updated online network significantly improves non-IID linear-probe accuracy.
  evidence:
  - source_id: r490-primary-pdf
    locator: Sections 3.4-3.5 & 5.2, pp. 4-6 & 9, Tables 1-2, Figures 2-3 & 5-7
    relation: supports
- claim_id: r490-claim-3
  kind: limitation
  statement: FedEMA requires stateful clients (or server-side client state caching) to retain previous round parameters W_k^{r-1} and W_k^{p,r-1} across rounds; in massive stateless cross-device federated settings where each client participates only once, FedEMA degrades to standard FedBYOL (full global overwrite).
  evidence:
  - source_id: r490-primary-pdf
    locator: Appendix B.3 (Cross-silo FL vs Cross-device FL), p. 17; Section 5.2, p. 9
    relation: supports
- claim_id: r490-claim-4
  kind: application
  statement: Applied to decentralized unlabeled visual representation learning with ResNet-18 and ResNet-50 Siamese networks on IID and non-IID CIFAR-10 and CIFAR-100 benchmarks under linear evaluation and 1%/10%-label semi-supervised fine-tuning, outperforming FedSimCLR, FedMoCoV1/V2, FedSimSiam, FedBYOL, and FedCA.
  evidence:
  - source_id: r490-primary-pdf
    locator: Section 5.1 & Appendix C.1, pp. 8 & 15-16, Tables 3-7
    relation: supports
