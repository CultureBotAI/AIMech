claims:
- claim_id: method
  kind: mechanism
  statement: Choose a fixed proposal density or mass g and draw each candidate y from g independently
    of the current state x. Substitute q(y|x)=g(y) into the Metropolis–Hastings ratio, obtaining alpha=min(1,pi(y)g(x)/(pi(x)g(y)))=min(1,w(y)/w(x))
    for w=pi/g where defined. Accept y or retain x. Hastings Section 2.5 explicitly chooses q_ij=pi_prime_j
    while keeping pi, rather than pi_prime, as the chain’s stationary target. The displayed acceptance
    formula here is the substitution into his Section 2.2 rule.
