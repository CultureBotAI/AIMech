name: Independence Metropolis–Hastings sampling
definition: A Metropolis–Hastings sampler whose proposal distribution is fixed independently of the current
  state, with proposal-density ratios still included in acceptance.
concept_kind: algorithm
identity_notes: Independence describes the proposal q(y), not independence of the retained Markov-chain
  states. This specializes Metropolis–Hastings and differs from estimating an expectation using separately
  weighted independent importance samples or from a state-centered random-walk proposal. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 153 prior native IDs/names/aliases.
  Both checkout text searches included ignored and hidden files and returned no matches for the selected
  exact IDs, full labels, aliases and source titles. Existing HMM and Markov random field records describe
  probability models, not these sampling or tuning procedures.
limitations:
- The proposal must cover the target support required for irreducibility, and its probability or density
  must be evaluable for the ratio.
- 'Independent candidates do not imply independent retained draws: rejection leaves the chain at the same
  state.'
- The ratio shows why a state with very large pi(x)/g(x) can be hard to leave for ordinary candidates.
  This is an algebraic caution, not a measured mixing rate or a universal convergence theorem.
- Unweighted retained-chain averages and importance-weighted independent-sample estimates are different
  procedures. Validity still requires appropriate chain and integrability conditions.
- Adaptive or learned changing proposals are outside this fixed-proposal definition and require their
  own validity arguments.
