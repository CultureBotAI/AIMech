claims:
- claim_id: r456-three-term-decoupled-drift-objective-and-corrected-aggregation-mechanism
  kind: mechanism
  statement: Combines (1) empirical loss L_i(theta_i), (2) a drift-decoupled quadratic penalty (alpha/2)*||theta_i - (w - h_i)||^2 that constrains local parameter updates relative to the drift-compensated target w - h_i, and (3) a linear gradient-drift correction (1/(eta*K))*<theta_i, g_i - g> (Equation 4), followed by backpropagation-free drift tracking h_i^+ = h_i - g_i^+ (Equation 6) and drift-corrected global aggregation w^{t+1} = sum_{i in C_t} (|D_i|/|D|)*(theta_i^+ + h_i^+) (Equation 7).
  evidence:
  - source_id: r456-primary-pdf
    locator: Section 4.2 Details of FedDC (Equations 3-8) & Appendix B Algorithm 1, pp. 10114-10116
    relation: supports
- claim_id: r456-strongly-convex-linear-and-nonconvex-convergence-scope
  kind: scope
  statement: Establishes in Theorem 1 (Appendix C) that FedDC achieves O(log(1/epsilon)) linear convergence for mu-strongly convex L-smooth objectives and O(1/epsilon) convergence for general L-smooth non-convex objectives under partial client participation.
  evidence:
  - source_id: r456-primary-pdf
    locator: Section 4.2 Convergence Analysis & Appendix C Proof of Theorem 1, pp. 10116 & Appendix
    relation: supports
- claim_id: r456-stateful-client-drift-variables-and-communication-limitation
  kind: limitation
  statement: Requires clients to maintain persistent parameter-sized state vectors (h_i and g_i) across communication rounds, and in the naive partial-participation implementation doubles per-round parameter transmission unless the server caches each client's previous state.
  evidence:
  - source_id: r456-primary-pdf
    locator: Section 4.2 Communication Discussion & Appendix B Algorithm 1, pp. 10115-10116
    relation: supports
- claim_id: r456-non-iid-federated-classification-and-partial-participation-application
  kind: application
  statement: Applied to non-IID and unbalanced federated learning across MNIST, Fashion-MNIST, EMNIST-L, CIFAR-10, CIFAR-100, Tiny-ImageNet, and synthetic heterogeneous benchmarks under low client participation ratios.
  evidence:
  - source_id: r456-primary-pdf
    locator: Section 5 Evaluation (Tables 1-3, Figures 3-6), pp. 10116-10120
    relation: supports
