claims:
- claim_id: l-svrg-single-step-lyapunov-and-mu-free-probability-interval
  kind: mechanism
  statement: For L-smooth component functions f_i and mu-strongly convex average f, L-SVRG with step size eta <= 1/(6L) and reference update probability p in (0, 1] satisfies the single-step Lyapunov recursion E[Phi^{k+1}] <= (1 - eta*mu)||x^k - x^*||^2 + (1 - p/2)D^k for Phi^k = ||x^k - x^*||^2 + D^k where D^k = (4*eta^2 / (p*n)) sum_{i=1}^n ||grad f_i(w^k) - grad f_i(x^*)||^2; choosing eta = 1/(6L) and any p in [min{c/n, c*mu/L}, max{c/n, c*mu/L}] (including p = 1/n independent of mu) yields the optimal O((n + L/mu) log(1/epsilon)) total stochastic gradient complexity.
  evidence:
  - source_id: r572-primary-pdf
    locator: Section 2 Eqs. (5)-(6), p. 3; Section 3 Lemmas 3.1-3.4 and Theorem 3.5, pp. 4-5; Appendix B, pp. 11-12
    relation: supports
- claim_id: l-katyusha-negative-momentum-accelerated-rate
  kind: mechanism
  statement: L-Katyusha couples the loopless reference update (w^{k+1} = y^k with probability p = 1/n) with Nesterov momentum z^{k+1} and negative momentum interpolation x^k = theta_1 z^k + theta_2 w^k + (1 - theta_1 - theta_2) y^k using sigma = mu/L, theta_1 = min{sqrt(2*sigma*n/3), 1/2}, theta_2 = 1/2, and eta = theta_2 / ((1 + theta_2)*theta_1), contracting the potential Psi^k = Z^k + Y^k + W^k by 1 - min{sigma/(6*theta_1), theta_1/(2*n)} per step and achieving the accelerated O((n + sqrt(nL/mu)) log(1/epsilon)) complexity.
  evidence:
  - source_id: r572-primary-pdf
    locator: Section 4 Algorithm 2, Lemmas 4.1-4.5, and Theorem 4.6, pp. 5-6; Appendix C, pp. 12-14
    relation: supports
- claim_id: l-svrg-and-l-katyusha-empirical-risk-minimization-application
  kind: application
  statement: Applied to L2-regularized logistic regression on LIBSVM benchmark datasets (a9a, w8a, mushrooms, phishing, cod-rna), L-SVRG and L-Katyusha avoid the O(n*d) gradient-table memory overhead of SAGA while consistently outperforming looped SVRG and Katyusha across condition numbers kappa = L/mu.
  evidence:
  - source_id: r572-primary-pdf
    locator: Section 5 Numerical Experiments, Figures 1-4, pp. 7-8
    relation: supports
- claim_id: l-svrg-and-l-katyusha-limitations
  kind: limitation
  statement: While L-SVRG achieves adaptive linear convergence with p = 1/n and eta = 1/(6L) without knowing mu, the accelerated L-Katyusha variant still requires knowledge of the strong convexity parameter mu (via sigma = mu/L) to set its coupling weight theta_1 = min{sqrt(2*sigma*n/3), 1/2} and mirror step z^{k+1}, and the analysis in Kovalev et al. (2020) is restricted to L-smooth, mu-strongly convex finite-sum objectives.
  evidence:
  - source_id: r572-primary-pdf
    locator: Section 1, p. 2; Section 4 Algorithm 2 and Theorem 4.6, pp. 5-6
    relation: supports
