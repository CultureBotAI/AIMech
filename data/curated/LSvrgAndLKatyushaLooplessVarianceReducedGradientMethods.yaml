id: AIMech:LSvrgAndLKatyushaLooplessVarianceReducedGradientMethods
name: L-SVRG and L-Katyusha (Loopless Variance-Reduced Gradient Methods)
concept_kind: algorithm
review_status: DRAFT
definition: L-SVRG (Loopless Stochastic Variance-Reduced Gradient) and L-Katyusha (Loopless Katyusha) are single-loop stochastic variance-reduced optimization algorithms for finite-sum empirical risk minimization min_{x in R^d} f(x) = (1/n) sum_{i=1}^n f_i(x) that eliminate the deterministic outer epoch loop of SVRG and Katyusha and replace it with an independent biased coin flip performed at every iteration. At step k, both methods construct the unbiased variance-reduced estimator g^k = grad f_i(x^k) - grad f_i(w^k) + grad f(w^k) for i ~ Unif({1,...,n}) and update the reference point w^{k+1} to the current iterate (x^k in L-SVRG or y^k in L-Katyusha) with probability p in (0, 1] and keep w^{k+1} = w^k with probability 1 - p, achieving O((n + L/mu) log(1/epsilon)) and accelerated O((n + sqrt(nL/mu)) log(1/epsilon)) oracle complexities via a single-iteration Lyapunov contraction without requiring knowledge of the strong convexity constant mu to tune the epoch length in L-SVRG.
identity_notes: Distinct from standard double-loop SVRG (Johnson and Zhang, 2013) and Katyusha (Allen-Zhu, 2017; AIMech:KatyushaDirectNegativeMomentumAccelerationForStochasticVarianceReducedOptimization), which require a fixed deterministic inner-loop length m (where standard SVRG theory requires m = Theta(L/mu) depending on the unknown strong convexity parameter mu). Also distinct from ANITA (Li, 2021; Round 570), which uses a decaying step-size schedule to attain O(n + sqrt(nL/epsilon)) on general convex problems, and from ProxSkip-L-SVRG (Malinovsky et al., 2022; Round 571), which embeds L-SVRG inside probabilistic proximal/communication skipping.
aliases:
- L-SVRG
- Loopless SVRG
