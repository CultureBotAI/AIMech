name: Natural Evolution Strategies
definition: A family of black-box optimization algorithms that adapts a parameterized search distribution
  using estimates of the natural gradient of expected fitness with respect to the distribution parameters.
concept_kind: algorithm
identity_notes: NES is the shared natural-gradient search-distribution framework, not a single Gaussian
  implementation, a trained neural network or ordinary stochastic gradient descent on model weights. Its
  canonical method differentiates the search distribution’s log density, not the black-box objective itself.
  Exponential NES and separable NES are concrete variants with additional parameterization and computational
  choices; the framework record does not equate them. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 270 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 19 and 19 lines respectively.
  These were prior candidate leads, source discussions and neighboring DEHB/FABOLAS method mentions. Eight
  exact AIO CLASS nodes with scoped synonyms and outgoing edges and seven native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The score identity and Fisher construction require suitable regularity, integrability and a usable parameterization.
  The empirical Fisher matrix can be singular or numerically unstable even when the population Fisher
  is invertible; a small batch does not automatically support the displayed inverse.
- Natural-gradient invariance describes the local direction under the appropriate exact metric. It is
  not an assertion that every finite, sampled parameter update is invariant under arbitrary reparameterization,
  stays in a valid distribution domain or improves expected fitness. Variant-specific parameterizations
  and learning rates matter.
- Rank-based shaping changes the weighting criterion; its update should not be described as an unbiased
  estimate of the raw expected-fitness gradient in general. A Gaussian search distribution, exponential
  covariance update and adaptation sampling are not mandatory features of every NES family member.
- Only the declared method and discussion pages were inspected. The record does not certify every displayed
  variant formula, an executable xNES/SNES implementation, universal benchmark superiority or a finite-budget
  global optimum.
