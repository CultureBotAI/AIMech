claims:
- claim_id: method
  kind: mechanism
  statement: Draw candidate points from a parameterized search distribution and evaluate their fitness.
    Compute the log-density derivative, or score, of each sample with respect to distribution parameters.
    In the canonical raw-fitness formulation, estimate the expected-fitness gradient by averaging score
    vectors weighted by fitness. Obtain the Fisher information of the distribution, analytically when
    available or through score outer products, and use its inverse action to transform the search gradient
    into a natural-gradient direction. Update the distribution parameters with a chosen learning rate
    and repeat. The paper additionally describes rank-based fitness shaping, which replaces raw fitness
    by ordered utility weights, and specialized distribution parameterizations that avoid a literal general
    Fisher-matrix inversion.
