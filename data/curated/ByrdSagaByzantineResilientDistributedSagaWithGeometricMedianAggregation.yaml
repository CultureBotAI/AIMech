id: AIMech:ByrdSagaByzantineResilientDistributedSagaWithGeometricMedianAggregation
name: Byrd-SAGA Byzantine-Resilient Distributed SAGA with Geometric Median Aggregation
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-resilient federated finite-sum optimization algorithm for minimizing f(x) = (1 / (W - B)) sum_{w notin B} (1 / J) sum_{j=1}^J f_{w,j}(x) across W workers Containing B < W / 2 Byzantine attackers, in which each honest worker w maintains a local table of stored per-sample gradients {f'_{w,j}(phi_{w,j}^k)}_{j=1}^J and their average g_bar_w^k = (1 / J) sum_{j=1}^J f'_{w,j}(phi_{w,j}^k), samples a random local index i_w^k in {1, ..., J} at iteration k, and transmits the SAGA variance-reduced gradient m_w^k = f'_{w,i_w^k}(x^k) - f'_{w,i_w^k}(phi_{w,i_w^k}^k) + g_bar_w^k to the master node, which updates the global model via the geometric median x^{k+1} = x^k - gamma * geomed_{w in W} {m_w^k}.
identity_notes: 'Distinct from standard SAGA (AIMech:SagaStochasticAverageGradientAmeliore, which uses single-machine or fragile mean aggregation and fails under a single Byzantine worker) and from Byzantine-robust SGD aggregators such as Krum, Geometric Median SGD, Bulyan (AIMech:BulyanByzantineResilientGradientAggregation), RSA (AIMech:RsaByzantineRobustStochasticAggregationForHeterogeneousDatasets), and Bucketing (AIMech:BucketingForAgnosticByzantineRobustAggregationOnHeterogeneousDatasets): Byrd-SAGA (Wu, Ling, Chen, & Giannakis, IEEE TSP 2020) couples per-worker SAGA finite-sum variance reduction with server-side geometric median aggregation so that the inner stochastic gradient variance sigma^2 vanishes along the optimization trajectory, removing the O(C_alpha^2 sigma^2 / mu^2) asymptotic error floor of Byzantine-resilient SGD.'
aliases:
- Byrd-SAGA
- Byzantine Attack Resilient Distributed SAGA
- Federated Variance-Reduced Byrd-SAGA
