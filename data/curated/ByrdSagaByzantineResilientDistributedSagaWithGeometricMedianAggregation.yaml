claims:
- claim_id: byrd-saga-variance-reduced-geomed-update
  kind: mechanism
  statement: At each iteration k, honest worker w samples i_w^k uniformly from {1, ..., J}, computes the SAGA-corrected gradient m_w^k = f'_{w,i_w^k}(x^k) - f'_{w,i_w^k}(phi_{w,i_w^k}^k) + g_bar_w^k, and updates its local gradient table entry and running average in O(p) time, while the master aggregates all W worker messages using an epsilon-approximate geometric median x^{k+1} = x^k - gamma * geomed_{w in W} {m_w^k}.
  evidence:
  - source_id: r544-primary-pdf
    locator: Section III-B p. 4 Eq. 8-11 & Algorithm 1
    relation: supports
- claim_id: byrd-saga-linear-convergence-without-inner-variance-floor
  kind: scope
  statement: For mu-strongly convex L-smooth objectives with bounded outer variation E_{w notin B} ||f'_w(x) - f'(x)||^2 <= delta^2 and B < W / 2 Byzantine workers (alpha = B / W < 1/2, C_alpha = (2 - 2 alpha) / (1 - 2 alpha)), Byrd-SAGA with step size gamma <= mu / (4 sqrt(5) J^2 C_alpha L^2) converges linearly as E||x^k - x*||^2 <= (1 - gamma mu / 2)^k Delta_1 + Delta_2 where Delta_2 = (10 / mu^2)(C_alpha^2 delta^2 + epsilon^2 / (W - 2B)^2), completely eliminating the inner-variance term O(C_alpha^2 sigma^2 / mu^2) present in Byzantine-resilient SGD (Theorems 1-2, Eq. 20-25).
  evidence:
  - source_id: r544-primary-pdf
    locator: Section IV-A Lemma 1 p. 5 Eq. 13; Section IV-B Theorems 1-2 p. 5-6 Eq. 20-25
    relation: supports
- claim_id: byrd-saga-memory-table-and-outer-heterogeneity-limitation
  kind: limitation
  statement: Byrd-SAGA requires each honest worker to store a table of J gradient vectors of dimension p (O(J p) local memory, or O(J) scalars for linear models), and under non-i.i.d. outer gradient variation delta^2 > 0 its asymptotic error floor Delta_2 = O(C_alpha^2 delta^2 / mu^2) remains non-zero and grows as the Byzantine fraction alpha = B / W approaches 1/2.
  evidence:
  - source_id: r544-primary-pdf
    locator: Section III-A p. 3-4; Section IV-B Theorem 1 p. 6 Eq. 20-22
    relation: supports
