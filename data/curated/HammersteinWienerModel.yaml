claims:
- claim_id: static-linear-static
  kind: mechanism
  statement: Write the deterministic cascade as y=h(G(psi(u))), using h for the forward output function.
    The input function acts on each input sample, the linear block carries the dynamics, and h acts on
    its output. Equivalently, a finite-state linear block has x_next=A*x+B*psi(u) and y=h(C*x+D*psi(u)).
    With psi(v)=v², causal filter G=(1,2), h(v)=v+v³, inputs (1,2,-1) and zero prehistory, outputs are
    (2,222,738).
  evidence:
  - source_id: yin-mueller2026
    locator: Section 2, Figure 1 and Equation 1, PDF/printed p. 3, setting noise to zero and writing h=phi^(-1);
      curator finite example in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: two-block-special-cases
  kind: scope
  statement: An identity input function psi gives a Wiener model, and an identity output function h gives
    a Hammerstein model. If G is the identity, the model reduces to the static composition h(psi(u));
    if both static functions are identities, it reduces to G. These inclusions do not make the ordered
    three-block family identical to either two-block family or to an identification algorithm.
  evidence:
  - source_id: yin-mueller2026
    locator: Introduction, Section 2 Equation 1 and Section 3.2 Remark 4, PDF/printed pp. 1,3,6; curator
      algebraic specializations in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: internal-gain-and-printed-formula
  kind: limitation
  statement: For nonzero a,b in the zero-state deterministic formulation, psi_new=a*psi, G_new=(b/a)*G
    and h_new(v)=h(v/b) preserve the response. With a=2,b=3 the finite example still gives (2,222,738).
    By contrast, the source’s printed Remark 3 transformation (a*psi,G/(a*b),b*h) gives (10/9,30,90) for
    the same example and does not generally preserve a nonlinear output function. The counterexample and
    corrected coordinate rescaling are curator derivations, not an author-issued correction.
  evidence:
  - source_id: yin-mueller2026
    locator: Section 2 Equation 1, PDF/printed p. 3; Section 3.2 Remark 3, p. 6; exact source-formula
      and coordinate-rescaling checks in research/discovery/three-block-cascade-boundaries.py
    relation: supports
- claim_id: noise-location-and-predictor-scope
  kind: scope
  statement: 'The inspected GP predictor places noise between G and the output function, giving h(z+e),
    and assumes a stable G and a monotone invertible output map. These are conditions of that particular
    noisy predictor, not requirements for evaluating every forward deterministic cascade. Noise before
    h is generally not independent additive noise after h: for h(z)=z+z³ and independent standard Gaussian
    e, E[h(z+e)]-h(z)=3z. The predictor’s virtual derivative observations promote monotonicity but do
    not guarantee it globally.'
  evidence:
  - source_id: yin-mueller2026
    locator: Section 2 Figure 1, Equation 1 and Assumption 1, PDF/printed p. 3; Section 3.3, pp. 6–7;
      curator exact noise moments in research/discovery/three-block-cascade-boundaries.py
    relation: supports
