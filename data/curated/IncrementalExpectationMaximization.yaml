claims:
- claim_id: case-cache
  kind: mechanism
  statement: For p(X,Z|theta)=product_i p(x_i,z_i|theta), retain a distribution q_i or its sufficient
    statistics for every case. Select a case or batch, replace each selected q_i with p(z_i|x_i,theta_current),
    and leave all other q_i unchanged. Maximize sum_i E_q_i log p(x_i,z_i|theta) over admissible theta
    using every cached case. With additive statistics, S_new=S_old-s_i_old+s_i_new; forgetting the subtraction
    or fitting only the selected observation changes the method.
  evidence:
  - source_id: neal-source
    locator: Section3 Eq6-9 and sufficient-statistic implementation, PDF6-8
    relation: supports
- claim_id: bound-not-likelihood
  kind: scope
  statement: Exact selected-posterior updates and admissible full-cache M-steps make F=sum_i E_q_i log
    p(x_i,z_i|theta)+sum_i H(q_i) nondecreasing. F equals observed log likelihood only when every cached
    distribution is the current posterior. The published correction explicitly shows incremental EM need
    not be GEM and displays likelihood decreases at early and later updates; ordinary observed-likelihood
    monotonicity cannot be inherited from ordinary EM.
  evidence:
  - source_id: correction-source
    locator: SectionII Eq1-2, p752 / PDF2; Figures2-3 and captions, p753 / PDF3
    relation: supports
  - source_id: neal-source
    locator: Section2 Eq1-5, PDF3-6; Section3 Eq6-9, PDF6-8, entropy-augmented objective and case-cache
      updates
    relation: supports
- claim_id: convergence-and-cost
  kind: limitation
  statement: The published stationary-point result is conditional on the underlying standard-EM regularity
    and initialization assumptions plus uniqueness of the maximizer of the full cached sum for every tuple
    of case anchors and full support of the complete-data family. The comment cites an external proof;
    uniqueness and support alone are not asserted sufficient here. Storage for per-case caches and rounding
    drift also matter. Fewer passes are not necessarily less runtime because many more M-steps can be
    required.
  evidence:
  - source_id: correction-source
    locator: SectionIII, pp753-754 / PDF3-4
    relation: supports
  - source_id: neal-source
    locator: Section3 implementation discussion, PDF7-8; Section4, PDF9-11, cache storage, roundoff and
      passes versus computation
    relation: supports
- claim_id: decay-boundary
  kind: scope
  statement: Replacing the cache total by gamma*S_old+s_i_new with fixed 0<gamma<1 is the separate decayed-statistics
    comparator. It does not maintain the exact sum of one current cached contribution per fixed observation
    and is not certified to optimize the same fixed-data likelihood. The source also describes small batches
    and occasional total recomputation to manage overhead and roundoff.
  evidence:
  - source_id: neal-source
    locator: Section3 Eq10, PDF8; Section4, PDF9-11
    relation: supports
limitations:
- Independent complete-data cases are part of this formulation. A partial update to one coordinate of
  a coupled latent vector is not justified by the independent-case formula.
- Fair revisiting, admissible M-step solutions, support and compactness/regularity conditions require
  a problem-specific analysis. No unconditional parameter convergence, local/global maximum or universal
  speedup is claimed.
- The original1998HMM article and referenced convergence report were not fully inspected. A finite curator
  cache-state example shows F increase with likelihood decrease; it does not reproduce the source’s complete
  training trajectory.
- No author software or historical empirical study was reproduced. Finite curator calculations illustrate
  stated objective and schedule boundaries; they are not a general convergence proof or an empirical speed
  comparison.
