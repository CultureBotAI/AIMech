name: Incremental Expectation Maximization
aliases:
- Incremental EM
- IEM (incremental expectation maximization)
concept_kind: algorithm
definition: An EM variant for independent observed cases that refreshes selected cached case posteriors
  at the current parameters and then fits parameters using the complete collection of refreshed and retained
  case expectations.
identity_notes: 'This record denotes the Neal-Hinton exact-cache fixed-data construction. It revisits
  a fixed data set and subtracts each selected case’s old contribution before adding its new one. It is
  distinct from streaming observation arrival, exponentially decayed online statistics, decreasing-step
  SAEM, arbitrary Gibbs updates of dependent latent coordinates and fixed-current-E GEM. Small batches
  of cases are a scheduling realization rather than a separate identity. Bare IEM is not asserted as an
  unambiguous alias. No normalized identity matches among 442 pinned and 476 maintained records, including
  acronym probes. GEM is the exact-current-E/Q-improvement framework, IEM refreshes cached independent
  cases, sparse EM preserves frozen outside mass, and DAEM is the warm-started cooling-to-beta1 procedure.
  Existing TEM has the same finite-state fixed-beta update, but its broader update framework and held-out
  inverse-annealing realization do not define that outer cooling procedure. ECM, AECM and SAGE specialize
  parameter/augmentation updates, not these case or probability-subset operations. Structured factorial-HMM
  variational inference imposes a different family restriction. Names and incidental frontier references
  do not establish identity; qualified GEM/IEM aliases avoid unrelated uses. The absence assessment is
  bounded to this snapshot and corpus. Identity-search counts: 253 matched lines in the worktree and 260
  in main; all 98 distinct matching-text windows were read, with ignored and hidden files included.'
