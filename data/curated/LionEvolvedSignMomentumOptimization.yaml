limitations:
- Requires rescaling both the learning rate (3-10x smaller) and decoupled weight decay (3-10x larger) relative to AdamW because the sign operation produces unit-magnitude coordinate updates.
- Provides smaller or negligible improvements over AdamW when training with small batch sizes (< 64), strong data augmentations, or massive language-modeling corpora.
