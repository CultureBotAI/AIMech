id: AIMech:ConvexMixtureInitializedGlobalKernelKMeans
name: Global Kernel K-Means with Convex Mixture Models
aliases:
- CMM-Initialized Global Kernel K-Means
concept_kind: algorithm
definition: An incremental kernel clustering algorithm that fits a convex mixture over datum exemplars
  once, restricts each new-cluster seed search to its selected high-weight exemplars, and retains the
  lowest-error local kernel k-means fit.
identity_notes: This is the Tzortzis-Likas2009 global kernel k-means with CMM procedure, including its
  positive observation-weight extension. It uses mixture weights to restrict initialization candidates,
  while final partitions optimize kernel variance over all observations. It is not the original CMM hard-clustering
  output, all-datum global search, fast bound maximization, or multiview mixture weighting. Compared all
  442 pinned AIO IDs, labels and scoped synonyms with all 492 prior native IDs, names and aliases; no
  normalized identity collision. Full searches of both checkouts include ignored and hidden files, returning
  62 worktree and 62 main matched lines. All 47 distinct matched texts were inspected as neighboring method
  mentions, query/frontier references or rendered copies. Eleven annotated AIO nodes, eleven generated
  YAMLs and seven native neighbors were examined. Nine unchanged annotated nodes, their generated YAMLs,
  all 442 class labels and 139 semantic rows reuse byte-verified earlier readings; two additional annotated
  targets and eight new semantic rows were read (147 rows total). Absence is bounded to this pin and corpus.
