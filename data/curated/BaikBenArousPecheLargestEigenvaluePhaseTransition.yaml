limitations:
- 'Complex Gaussian unitary invariance requirement for the Harish-Chandra-Itzykson-Zuber derivation: The exact determinantal density (eq. 61) and double-contour Fredholm determinant (Proposition 2.1, eqs. 62-63) rely on the Harish-Chandra-Itzykson-Zuber integral over the unitary group U(N), which has no analogous closed-form elementary determinant over the real orthogonal group O(N), leaving the corresponding real sample covariance fluctuation laws as a conjecture in Section 1.3 (p. 11 & Section 2.1, p. 13).'
- 'Finite-rank perturbation of an isotropic bulk covariance: Theorems 1.1 and 1.2 assume that all but a fixed finite number r of population eigenvalues equal 1 (ell_{r+1} = ... = ell_N = 1, eq. 35) and that M/N = gamma^2 lies in a compact subset of [1, infinity).'
- 'Primary-source typographical audit of arXiv:math/0403022v2 (DOI:10.1214/009117905000000233): (1) On p. 3 (Section 1.1, line 5), ''S = (1/N) X X*'' writes factor 1/N instead of 1/M (cf. p. 2 line 2 S = (1/M) X X'', eq. 7, and eq. 59); (2) on p. 7 (eq. 29), ''G_1(x) = (1/sqrt(2 pi)) int_{-inf}^x e^{-xi_1^2/2} d xi_1 = erf(x)'' writes ''erf(x)'' for the standard normal cumulative distribution function Phi(x) = (1/2)[1 + erf(x/sqrt(2))]; (3) on p. 10 (eq. 47, Proof of Corollary 1.1), the upper bound inside P(.) prints ''(1 + gamma^{-1})^2 + x M^{1/3} gamma / (1 + gamma)^{4/3}'' instead of ''(1 + gamma^{-1})^2 + x (1 + gamma)^{4/3} / (gamma M^{2/3})'' from eq. (37), and eqs. (50) (p. 10) and (305) (p. 46) write ''P((lambda_1 - ell_1)(1/ell_1) sqrt(M) x)'' omitting ''<='' before ''x''; and (4) on p. 11 (Definition 1.3, eq. 54), the finite determinant writes ''1 - <...>'' in place of ''delta_{mn} - <...>'' (cf. eq. 17), on p. 18 (eq. 93) the second argument of K_{M,N} writes ''mu + nu(x + u)
  / M^alpha'' with ''u'' instead of ''v'', and on p. 34 (eq. 208) ''pi_j^{-1} = 1 + gamma^{-1} - w_j / M^{1/3}'' omits the prefactor ''(1 + gamma)^{2/3} / gamma'' from Theorem 1.2 (eq. 55).'
