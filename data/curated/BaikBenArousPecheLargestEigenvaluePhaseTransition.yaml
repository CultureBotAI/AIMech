id: AIMech:BaikBenArousPecheLargestEigenvaluePhaseTransition
name: Baik-Ben Arous-Peche Largest Eigenvalue Phase Transition for Spiked Complex Sample Covariance Matrices
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- BBP Phase Transition for Spiked Sample Covariance Matrices
- Baik-Ben Arous-Peche Spiked Wishart Largest Eigenvalue Limit Laws
- Generalized Tracy-Widom F_k and Finite-GUE G_k Spiked Covariance Transition
- Non-Null Complex Wishart Largest Eigenvalue Fredholm Determinant Asymptotics
definition: 'Baik-Ben Arous-Peche Largest Eigenvalue Phase Transition for Spiked Complex Sample Covariance Matrices is a random-matrix spectral fluctuation methodology introduced by Baik, Ben Arous, and Peche (2005) that characterizes the exact limiting distributions and scaling exponents of the largest eigenvalue lambda_1 of an N x N complex Gaussian sample covariance matrix S = (1/M) X X* formed from M independent samples with population covariance eigenvalues ell_1, ..., ell_r and ell_{r+1} = ... = ell_N = 1 as M, N -> infinity with M/N = gamma^2 >= 1. Using the Harish-Chandra-Itzykson-Zuber unitary integral and a double-contour Fredholm determinant representation P(lambda_1 <= xi) = det(1 - K_{M,N}|_{(xi,inf)}), steepest-descent analysis establishes a sharp phase transition at the critical spike value ell_c = 1 + gamma^{-1}: (a) when ell_1 = ... = ell_k = 1 + gamma^{-1} (0 <= k <= r) and ell_{k+1}, ..., ell_r < 1 + gamma^{-1}, lambda_1 fluctuates at order M^{-2/3} around the Marcenko-Pastur
  bulk edge (1 + gamma^{-1})^2 according to the k-th generalized Airy-kernel Tracy-Widom distribution F_k(x) (with F_0 = F_GUE and F_1 = F_GOE^2), and under critical scaling ell_j = 1 + gamma^{-1} - [(1 + gamma)^{2/3} w_j] / (gamma M^{1/3}) according to the multi-parameter interpolating distribution F_k(x; w_1, ..., w_k); and (b) when ell_1 = ... = ell_k > 1 + gamma^{-1} (1 <= k <= r) and ell_{k+1}, ..., ell_r < ell_1, lambda_1 separates to mu = ell_1 + ell_1 gamma^{-2} / (ell_1 - 1) and fluctuates at order M^{-1/2} with scale nu = sqrt(ell_1^2 - ell_1^2 gamma^{-2} / (ell_1 - 1)^2) according to the largest-eigenvalue distribution G_k(x) of a k x k Gaussian Unitary Ensemble (standard Gaussian G_1(x) = Phi(x) when k = 1).'
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Baik, Ben Arous, & Peche (2005, The Annals of Probability 33(5):1643-1697; arXiv:math/0403022v2, DOI:10.1214/009117905000000233). Distinct from AIMech:BaikSilversteinSpikedPopulationCovarianceEigenvalueSeparation (Baik & Silverstein 2006, J. Multivariate Anal. 97(6):1382-1408), which establishes first-order almost-sure limits of extreme eigenvalues for non-Gaussian real and complex spiked models via the Silverstein-Choi Stieltjes transform without deriving second-order M^{-2/3} F_k or M^{-1/2} G_k fluctuation distributions or the double-contour Fredholm determinant kernel, and from AIMech:SparsePrincipalComponentsAnalysisViaCoordinateVarianceSelectionAndThresholding (Johnstone & Lu 2009) and AIMech:DiagonalThresholdingAndSemidefiniteRelaxationSupportRecoveryForSparsePCA (Amini & Wainwright 2009), which address sparse eigenvector estimation and support recovery.
