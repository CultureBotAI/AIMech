claims:
- claim_id: hciz-double-contour-fredholm-determinant-representation
  kind: mechanism
  statement: For M >= N complex Gaussian sample vectors in C^N with population covariance eigenvalues ell_j = pi_j^{-1}, Section 2.1 (Equations 59-85, Proposition 2.1, pp. 13-17) applies the Harish-Chandra-Itzykson-Zuber unitary integral to obtain the joint sample eigenvalue density p(lambda) = (1/C) [det(e^{-M pi_j lambda_k}) / V(pi)] V(lambda) prod_{j=1}^N lambda_j^{M-N} (eq. 61) and proves via Andreief's determinantal identity, Cramer's rule, and Hankel's Gamma contour representation that P(lambda_1 <= xi) = det(1 - K_{M,N}|_{(xi,inf)}) (eq. 63), where the trace-class correlation kernel factors as K_{M,N}(eta, zeta) = int_0^inf H(eta + y) J(zeta + y) dy = [M / (2 pi i)^2] int_Gamma dz int_Sigma dw e^{-eta M (z - q) + zeta M (w - q)} [1 / (w - z)] (z / w)^M prod_{k=1}^N [(pi_k - w) / (pi_k - z)] (eqs. 62, 83-85) for any 0 < q < min_j pi_j.
  evidence:
  - source_id: bbp2005-phase-pdf
    locator: Section 2.1, Equations (59)-(85) and Proposition 2.1, pp. 13-17
    relation: supports
- claim_id: subcritical-and-critical-airy-kernel-tracy-widom-hierarchy-fk
  kind: scope
  statement: When ell_{r+1} = ... = ell_N = 1, M/N = gamma^2 >= 1, ell_1 = ... = ell_k = 1 + gamma^{-1} (0 <= k <= r), and ell_{k+1}, ..., ell_r lie in a compact subset of (0, 1 + gamma^{-1}), Theorem 1.1(a) (eqs. 36-37, p. 8) and Section 3 (Proposition 3.1 and Lemma 3.3, pp. 18-33) prove via steepest-descent analysis at the coalescing double saddle point z = p_c = gamma / (gamma + 1) of f(z) = -mu (z - q) + log(z) - gamma^{-2} log(1 - z) (where f'(p_c) = f''(p_c) = 0 and f^{(3)}(p_c) = 2 nu^3 with mu = (1 + gamma^{-1})^2 and nu = (1 + gamma)^{4/3} / gamma) that P([lambda_1 - (1 + gamma^{-1})^2] [gamma / (1 + gamma)^{4/3}] M^{2/3} <= x) -> F_k(x), where F_0(x) = det(1 - A_x) = F_GUE(x), F_1(x) = (F_GOE(x))^2, and F_k(x) = det(1 - A_x) det(delta_{mn} - <(1 - A_x)^{-1} s^{(m)}, t^{(n)}>_{L^2(x,inf)})_{1 <= m,n <= k} (eq. 17). Furthermore, under critical scaling ell_j = 1 + gamma^{-1} - [(1 + gamma)^{2/3} w_j] / (gamma M^{1/3}) for 1 <= j <= k, Theorem 1.2 (eqs. 54-56, pp. 11-12) establishes
    convergence to the multi-parameter interpolating distribution F_k(x; w_1, ..., w_k).
  evidence:
  - source_id: bbp2005-phase-pdf
    locator: Section 1.2.1, Definition 1.1, Equations (10)-(25), pp. 4-6; Section 1.3, Theorem 1.1(a), Equations (35)-(37), p. 8; Section 1.4, Definition 1.3 and Theorem 1.2, Equations (52)-(56), pp. 11-12; Section 3, Proposition 3.1 and Lemma 3.3, pp. 18-34
    relation: supports
  - source_id: bbp2005-phase-abs
    locator: Abstract
    relation: supports
- claim_id: supercritical-finite-gue-fluctuations-gk-and-last-passage-percolation-duality
  kind: scope
  statement: When ell_1 = ... = ell_k > 1 + gamma^{-1} (1 <= k <= r) and ell_{k+1}, ..., ell_r lie in a compact subset of (0, ell_1), Theorem 1.1(b) (eqs. 38-39, p. 8) and Section 4 (Proposition 4.1, pp. 34-45) prove by Cauchy residue extraction at the pole z = pi_1 = ell_1^{-1} < p_c = gamma / (1 + gamma) and imaginary-axis steepest descent with f''(pi_1) = -nu^2 < 0 that P([lambda_1 - (ell_1 + ell_1 gamma^{-2} / (ell_1 - 1))] [sqrt(M) / sqrt(ell_1^2 - ell_1^2 gamma^{-2} / (ell_1 - 1)^2)] <= x) -> G_k(x) = det(1 - H_x^{(k)}) (eqs. 28, 33, 39), the largest-eigenvalue distribution of a k x k GUE matrix constructed from orthonormal Hermite polynomials p_n(xi) (yielding the standard normal law G_1(x) = Phi(x) when k = 1). Moreover, Section 6 (Proposition 6.1, eqs. 306-317, pp. 46-49) establishes the exact distributional identity P(L(M, N) <= x) = P(lambda_1(M, N) <= x) with directed last-passage percolation and N-server tandem queues with exponential site weights of mean 1 / (pi_i M), explaining
    the transition at ell_1 = 1 + gamma^{-1} via the variational problem max_{x in [0,1]} [pi_1^{-1} x + (sqrt(1 - x) + gamma^{-1})^2].
  evidence:
  - source_id: bbp2005-phase-pdf
    locator: Section 1.2.2, Definition 1.2 and Lemma 1.1, Equations (26)-(34), pp. 6-7; Section 1.3, Theorem 1.1(b) and Corollary 1.1, Equations (38)-(46), pp. 8-10; Section 4, Proposition 4.1, pp. 34-45; Section 6, Proposition 6.1, Equations (306)-(317), pp. 46-49
    relation: supports
