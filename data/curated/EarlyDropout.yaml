aio_mappings:
- target: AIO:DropoutLayer
  relation: related_match
  rationale: The procedure schedules dropout during training. The target denotes a layer operation, not
    its temporal schedule or the stochastic-depth variant, so it is related rather than an equivalent
    identity or algorithm superclass.
- target: AIO:TrainingStrategy
  relation: related_match
  rationale: The procedure changes the training-time application of stochastic masks. The pinned target
    uses a preprocessing genus and broad learning-paradigm examples, so a clean subclass claim is avoided.
limitations:
- Early Dropout denotes a temporal training procedure, not a trained vision model, the generic dropout
  layer or early stopping. Its short initial schedule is distinct in scope from schedules maintained throughout
  nearly all training.
- The source studies linear, constant and cosine initial schedules; neither a particular cutoff nor a
  fixed rate defines every valid configuration. Keeping dropout active for all training steps is outside
  this local definition.
- Empirical gradient-direction observations do not guarantee reduction of gradient variance. Constructed
  calculations are counterexamples to universal extensions, not replication of the reported vision experiments.
- All sixteen PMLR paper pages were visually inspected, including Appendices A–H. The author implementation,
  alternate full-text versions, training and hardware measurements were not inspected or executed.
