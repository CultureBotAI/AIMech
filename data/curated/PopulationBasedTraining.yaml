name: Population Based Training
definition: A population-based neural-network training procedure that interleaves parameter updates with
  performance-guided copying of partially trained models and exploration of hyperparameters, producing
  training trajectories with changing hyperparameter settings.
concept_kind: algorithm
identity_notes: PBT jointly trains model weights and searches hyperparameter schedules. It differs from
  independent random-search runs, a prediction ensemble and Population Based Augmentation’s specialized
  augmentation-schedule transfer. Its population updates do not require genetic crossover. General PBT
  can return the trained model; PBA separately discards its child weights when transferring a schedule.
  Reinforcement learning is one application, not the definition of PBT. No normalized identity match was
  found across all 442 pinned AIO labels/scoped synonyms and 250 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  9 lines in each checkout. These were references within neighboring records, their review and the prior
  discovery ledger, not records for the proposed identities. Fourteen exact AIO CLASS nodes with synonyms
  and outgoing edges and six neighboring native mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.
limitations:
- The original algorithm specifies application-dependent readiness, exploitation and exploration. PBA’s
  quartile selection, three-epoch interval, operation probabilities and schedule-only transfer are not
  general PBT requirements.
- Asynchrony removes a global training barrier but does not remove the need to exchange model state and
  performance information. Reusing weights is not weight averaging or an inference-time ensemble.
- Score-driven selection depends on the evaluation protocol, search space, budget and population behavior.
  The record asserts no global optimum, universal cost equivalence, wall-clock speedup or generalization
  guarantee.
- Only the primary method and declared pages were inspected. Application-specific experiments, appendices
  and executable implementations are outside this record’s evidence scope.
