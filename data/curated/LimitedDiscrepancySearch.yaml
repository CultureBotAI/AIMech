name: Limited discrepancy search
definition: A backtracking tree-search strategy that repeatedly explores paths under an increasing upper
  limit on deviations from a successor-ordering heuristic; in the original binary formulation, taking
  the nonpreferred child consumes one discrepancy.
concept_kind: algorithm
identity_notes: The original LDS searches paths with at most k discrepancies in each pass. It differs
  from Korf’s improved LDS, which avoids revisiting leaves at the supplied maximum depth by allocating
  an exact discrepancy count there, and from depth-bounded discrepancy search, which bounds where deviations
  may occur. The original 1995 Figure 1 explores the nonpreferred child first when discrepancy budget
  remains; Korf’s 1996 presentation of original LDS uses the opposite within-pass order. The names do
  not establish identical visit sequences. No normalized identity match was found across the 442 AIO and
  141 prior native records; ignored-inclusive text hits in the main checkout were prior discovery leads
  and incidental substrings such as builds in records, source text and dependencies, not existing concept
  records.
limitations:
- Completeness applies to exhaustive passes on a finite tree with a sufficient discrepancy/depth limit
  and adequate resources. A fixed early-pass cutoff is not a decision procedure for unsolvability.
- The first goal found is not generally a minimum-cost or shortest-path goal. Successor preference is
  a search-order heuristic, not an admissible cost bound.
- The curated original mechanism is binary. Counting any alternate child as one discrepancy and assigning
  rank-based discrepancy costs are distinct multiway extensions requiring an explicit policy.
- Repeated at-most-k passes revisit paths. The subsequent ILDS paper qualifies the original redundancy
  argument and supplies cases where discrepancy search has no advantage over ordinary DFS.
- The original paper references an LDS-BBS appendix that is not present in the inspected seven-page download.
  The bounded-backtracking hybrid is not asserted as part of this record.
