claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Run a depth-first probe with budget k, starting with k=0 and increasing through a sufficient
    maximum depth for a finite binary tree. When the budget is zero, follow the heuristic-preferred child.
    With positive budget, the original Figure 1 first probes the nonpreferred child with k−1 and then
    the preferred child with k. Return when a goal is found. Each pass permits at most k deviations, so
    earlier paths may be revisited in later passes.
  evidence:
  - source_id: method-source
    locator: Section 3 and Figure 1, printed p. 608 / PDF p. 2; Section 5.5, printed p. 611 / PDF p. 5
    relation: supports
- claim_id: original-versus-improved
  kind: scope
  statement: Korf distinguishes original at-most-k passes from an exact-count-at-maximum-depth modification,
    and presents a left-child-first original probe. This differs from the right-child-first positive-budget
    probe printed in the 1995 paper; the two presentations share a budget principle, not necessarily a
    visit order.
  evidence:
  - source_id: original-versus-improved
    locator: Printed pp. 286–287 / PDF pp. 1–2; Figures 2–3
    relation: supports
  - source_id: method-source
    locator: Figure 1, printed p. 608 / PDF p. 2
    relation: supports
- claim_id: problem-dependence
  kind: limitation
  statement: Discrepancy search depends on the successor heuristic and search-tree structure. The 1996
    study includes negative results against DFS, so the original method is not characterized by universal
    runtime superiority.
  evidence:
  - source_id: problem-dependence
    locator: A Simpler Algorithm and Negative Result and Conclusions, printed pp. 290–291 / PDF pp. 5–6
    relation: supports
