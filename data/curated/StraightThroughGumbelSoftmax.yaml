name: Straight-through Gumbel-Softmax estimator
definition: A surrogate-gradient estimator that uses a hard one-hot argmax of a Gumbel-Softmax sample
  in the forward computation and substitutes the corresponding continuous softmax relaxation’s derivative
  in the backward computation.
concept_kind: mathematical_method
identity_notes: 'This is Jang and colleagues’ straight-through Gumbel estimator, which retains a discrete
  forward sample while using a temperature-controlled continuous backward surrogate. It is distinct from
  using soft Gumbel-Softmax vectors in both passes, from exact differentiation of argmax, from a score-function
  estimator, and from the broader family of straight-through estimators for other stochastic or quantized
  units. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 331
  preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 11 and 11 lines respectively. All 10 unique hit contents were
  inspected: neighboring Gumbel-Top-k contrasts, saved review and ledger references, new source leads,
  and incidental concrete-distribution wording in an older random-search report, not existing candidate
  records. Exact checkout counts and differences are retained in the ledger. Nine exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and six full native neighboring records were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- Exact categorical forward sampling does not establish an unbiased gradient of the discrete expected
  loss. The forward/backward mismatch can persist even when the noise distribution is sampled exactly.
- The downstream computation must supply a usable derivative with respect to the hard vector, typically
  through a differentiable extension. A purely discrete black-box reward does not acquire such a derivative
  automatically.
- The derivative of hard argmax is zero almost everywhere and undefined at ties; substituting the soft
  Jacobian changes that derivative rather than proving argmax differentiable.
- Positive temperature and positive finite weights are required by the stated relaxed Jacobian. Temperature
  annealing, zero-mass categories, finite-precision ties and stability require explicit choices; there
  is no universal unbiasedness or variance guarantee.
- The estimator does not equal all straight-through rules or all Concrete training objectives. No author
  implementation, learned model or empirical speed/quality result is certified.
