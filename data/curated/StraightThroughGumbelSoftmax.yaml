claims:
- claim_id: method
  kind: mechanism
  statement: Draw independent Gumbel noise and compute y=softmax((log(alpha)+G)/tau) with positive finite
    weights and tau>0. In the forward pass, use z as the one-hot vector at argmax(y), equivalently argmax(log(alpha)+G).
    In the backward pass, approximate the derivative of z with respect to its parameters by the derivative
    of y, while the downstream computation has received z. Thus the downstream gradient evaluated at the
    hard forward state is multiplied by the relaxed sample’s Jacobian. For log-weight coordinates ell
    and fixed noise/temperature, that Jacobian has entries y_i(delta_ij−y_j)/tau. Hard output remains
    one-hot even at large positive temperature, and its categorical sampling law is independent of tau;
    temperature changes the backward surrogate. This is a deliberately biased surrogate, not the ordinary
    derivative of the hard argmax or generally the gradient obtained by evaluating the whole loss on y.
  evidence:
  - source_id: method-source
    locator: Section2.2, Straight-Through Gumbel-Softmax Estimator, PDF/printed p.3; Section2 Equation(2),
      p.2; Section3.1 and Figure2, pp.3–4
    relation: supports
- claim_id: hard-versus-soft
  kind: scope
  statement: The source discretizes the relaxed vector by argmax for the forward pass and uses the continuous
    approximation for backpropagation. Its hard samples remain sparse at high temperature, unlike the
    positive-temperature relaxed vectors themselves. This separates the forward representation from the
    surrogate derivative.
  evidence:
  - source_id: method-source
    locator: Section2.2, PDF/printed p.3
    relation: supports
