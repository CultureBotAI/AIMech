limitations:
- 'Requires substantial offline compute: indexing and retrieving top-50 lists for 28M queries across five teacher retrievers and running five 20-epoch progressive training stages.'
- Zero-shot accuracy is sensitive to the curriculum ordering of teachers and underperforms token-level late-interaction models (ColBERTv2, SPLADE++) on specialized scientific/technical forum queries in LoTTE.
