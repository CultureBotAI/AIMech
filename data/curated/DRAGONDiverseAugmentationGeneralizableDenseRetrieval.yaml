id: AIMech:DRAGONDiverseAugmentationGeneralizableDenseRetrieval
name: DRAGON (Diverse Augmentation for Generalizable Dense Retrieval)
concept_kind: algorithm
review_status: DRAFT
definition: A contrastive training algorithm for generalizable bi-encoder dense retrieval that combines large-scale diverse query augmentation (mixing corpus-cropped sentences and sequence-to-sequence generated queries) with progressive relevance label augmentation across N heterogeneous teacher retrievers (spanning sparse, dense, and multi-vector architectures ordered from lower to higher generalization capability), uniformly sampling a teacher n ~ U(1, T) at curriculum iteration T <= N and drawing positive passages from ranks 1..k (k = 10) and hard negatives from ranks 46..50 of P_q^n to optimize InfoNCE loss.
identity_notes: Introduced by Lin, Asai, Li, Oguz, Lin, Mehdad, Yih, and Chen (Findings of EMNLP 2023, pp. 6385-6400, arXiv:2302.07452). Distinguished from single-teacher cross-encoder distillation methods (such as RocketQAv2, CL-DRD, or GPL) which rely on computationally expensive cross-encoder soft labels, and from unsupervised contrastive pre-training (such as Contriever or coCondenser) which assumes the originating document is the sole positive for a cropped span.
aliases:
- Dense Retriever Trained with Diverse Augmentation
- DRAGON Progressive Label Augmentation
- DRAGON Dense Retrieval Training
