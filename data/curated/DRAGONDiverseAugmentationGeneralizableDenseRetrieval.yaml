claims:
- claim_id: dragon-progressive-multi-teacher-label-augmentation-mechanism
  kind: mechanism
  statement: Given N heterogeneous teacher retrievers ordered by increasing zero-shot generalization capability (uniCOIL -> Contriever -> GTR-XXL -> ColBERTv2 -> SPLADE++), DRAGON trains an asymmetric BERT-base bi-encoder across N = 5 progressive iterations; at iteration T <= N, for each augmented query q (sampled from 28M cropped MS MARCO sentences and 28M DocT5Query synthetic queries), it uniformly samples a teacher n ~ U(1, T), selects a positive d^+ from the top k = 10 passages and a hard negative d^- from ranks 46..50 of P_q^n (assigning consensus positives retrieved by m <= T teachers sampling probability m / (T*k) without score normalization), and minimizes InfoNCE loss.
  evidence:
  - source_id: r748-primary-pdf
    locator: Section 3.2 (Progressive Supervision, Figure 2), Section 3.4, & Appendix A.2, pp. 4-6, 14
    relation: supports
  - source_id: r748-primary-pdf
    locator: progressive_positive_sampling_distribution & main
    relation: supports
- claim_id: dragon-breaking-supervised-vs-zeroshot-tradeoff
  kind: scope
  statement: Without increasing inference model size beyond a 110M-parameter BERT-base bi-encoder or requiring target-domain corpora during training, DRAGON and DRAGON+ (initialized from RetroMAE) achieve 39.3 and 39.0 MRR@10 on supervised MS MARCO Dev, 74.1 and 74.4 nDCG@10 on TREC DL 2019, and 49.4 and 50.2 average nDCG@10 on zero-shot BEIR-13 (matching SPLADE++'s 50.3 and surpassing ColBERTv2's 49.9 and GTR-XXL's 49.3), while reversing the progressive teacher trajectory degrades BEIR-13 by 1.6 points.
  evidence:
  - source_id: r748-primary-pdf
    locator: Section 3.3 (Tables 2-3), Section 4.4 (Table 4), & Section 5 (Tables 5, 7), pp. 5, 7-9
    relation: supports
- claim_id: dragon-offline-indexing-and-curriculum-trajectory-limitation
  kind: limitation
  statement: DRAGON requires offline batch retrieval over 28M augmented queries across five distinct sparse, dense, and multi-vector teacher indices followed by five 20-epoch training iterations (around 650K total optimization steps on 32 A100 GPUs), is sensitive to the easy-to-hard ordering of teacher retrievers, and still trails late-interaction/sparse teachers (SPLADE++ and ColBERTv2) on specialized science and technology forum queries in LoTTE.
  evidence:
  - source_id: r748-primary-pdf
    locator: Section 3.3 (Table 3), p. 5; Section 3.4 & Section 4.3, pp. 6-7; Appendix A.6 (Table 11), p. 15
    relation: supports
