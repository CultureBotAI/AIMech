claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: The revised encoder uses two successive attention blocks linking learned inducing points
    and input elements. Set normalization occurs on the transformed attention and feedforward branches,
    while each residual addition retains its unmodified query-side input.
