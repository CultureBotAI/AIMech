name: Set Transformer++
definition: A Set Transformer architecture revision that replaces its induced-attention encoder blocks
  with set-normalized blocks retaining identity residual paths, while preserving the aggregation and decoder.
concept_kind: architecture
identity_notes: Set Transformer++ denotes the specific encoder revision and ISAB++ construction in Zhang
  and colleagues. It is distinct from the original Set Transformer and from Deep Sets++ despite their
  shared residual and normalization design principles.
limitations:
- This record covers the source's ISAB++ encoder construction, not all possible residual attention variants.
- Set standardization assumes a nonzero variance; no universal optimization or benchmark improvement is
  asserted.
aliases:
- ST++
