id: AIMech:ContinuumMeasureSpaceStepUpFDRControl
name: Measure-theoretic step-up false discovery rate control over a continuum of null hypotheses
aliases:
- Blanchard-Delattre-Roquain Continuum Step-Up FDR Control
- Weakly PRDS Continuum Multiple Testing Framework
- Continuous-Index Measure-Space Step-Up Procedure
concept_kind: mathematical_method
definition: 'A measure-theoretic multiple hypothesis testing framework developed by Gilles Blanchard,
  Sylvain Delattre, and Etienne Roquain (2014, Bernoulli 20(1):304-333, arXiv:1110.3599v3, DOI:10.3150/12-BEJ488)
  that extends step-up False Discovery Rate control to an arbitrary (possibly uncountably infinite) measurable
  index space of hypotheses (H, frak_H, Lambda) with finite positive measure Lambda(H) < infty: given
  a measurable p-value process (p_h(X))_{h in H} and threshold collection Delta(h, r) = alpha pi(h) beta(r),
  the continuum step-up procedure rejects R_{SU}(X) = L_Delta(r_hat(X)) where L_Delta(r) = {h in H : p_h(X)
  <= Delta(h, r)} and r_hat(X) = max{r in [0, Lambda(H)] : Lambda(L_Delta(r)) >= r} (satisfying the exact
  fixed-point volume identity Lambda(L_Delta(r_hat(X))) = r_hat(X) when Delta is left-continuous in r),
  and controls FDR(R_{SU}) = E[(Lambda(R_{SU} cap H_0) / Lambda(R_{SU})) 1{Lambda(R_{SU}) > 0}] <= alpha
  int_{H_0} pi d_Lambda either (1) under linear shape beta(r) = r when the p-value process is weakly Positive
  Regression Dependent on a Subset (weakly PRDS on H_0, meaning all finite marginals (p_h)_{h in F} are
  PRDS on F cap H_0; Definition 2.4 and Theorem 4.1) via Glivenko-Cantelli empirical measure approximations
  Lambda_n -> Lambda (Section 5.1, Lemmas 5.1-5.3), or (2) under arbitrary dependence with prior-integrated
  shape beta_nu(r) = int_0^r u d_nu(u).'
identity_notes: 'Distinct from all 442 pinned AIO concepts and all 595 previously curated AIMech concepts.
  While AIMech:SelfConsistencyAndDependencyControlFDRFramework (Blanchard & Roquain 2008, Electronic Journal
  of Statistics 2:963-992) formulates Self-Consistency and Dependency Control on countable hypothesis
  spaces H (and only remarks that definitions can be stated on continuous spaces), Blanchard, Delattre,
  & Roquain (2014, Bernoulli 20(1):304-333, arXiv:1110.3599v3, DOI:10.3150/12-BEJ488) establish the rigorous
  measure-theoretic foundations for uncountable hypothesis spaces (H, frak_H, Lambda): joint measurability
  of the continuum step-up volume r_hat(X) = max{r in [0, Lambda(H)] : Lambda(L_Delta(r)) >= r} (Lemma
  3.1), equivalence of four formulations of weak PRDS on infinite index sets via Strassen''s theorem and
  the Portmanteau theorem (Definitions 2.3-2.4, Proposition 2.2), proof of continuum step-up FDR control
  via Glivenko-Cantelli empirical measure discretization Lambda_n -> Lambda (Theorem 4.1, Lemmas 5.1-5.3),
  and exact finite-dimensional computational reductions for continuous c.d.f. testing gamma(u) = sum_{j=0}^m
  (t_j(u) - X_{(j)})_+ wedge (X_{(j+1)} - X_{(j)}) (Corollary 4.4, Remark 4.6) and Poisson process intensity
  testing with data-dependent interval-length weights (Corollary 4.5, Remark 4.6).'
