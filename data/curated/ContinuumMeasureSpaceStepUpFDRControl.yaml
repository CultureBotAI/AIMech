claims:
- claim_id: equivalence-of-infinite-dimensional-weak-prds-characterizations
  kind: mechanism
  statement: 'For an infinite family of p-value processes p = (p_h(X))_{h in H} indexed by a measurable
    space (H, frak_H), Proposition 2.2 proves via Strassen''s monotone coupling theorem and the Portmanteau
    theorem that when singletons belong to frak_H, four definitions of positive regression dependence
    on H_0 are equivalent: (1) strong PRDS on [0, 1]^H (Definition 2.3: u -> P(p in D | p_{h_0} = u) is
    non-decreasing for every non-decreasing measurable set D subset [0, 1]^H and h_0 in H_0), (2) cumulative
    Conditioning u -> P(p in D | p_{h_0} <= u) is non-decreasing for every non-decreasing measurable D
    subset [0, 1]^H, (3) finite-dimensional weak PRDS on H_0 (Definition 2.4: for every finite subset
    F subset H, the marginal vector (p_h(X))_{h in F} is PRDS on F cap H_0), and (4) finite-marginal cumulative
    conditioning u -> P((p_h)_{h in F} in D | p_{h_0} <= u) is non-decreasing for all finite F subset
    H and non-decreasing D subset [0, 1]^F.'
  evidence:
  - source_id: blanchard-delattre-roquain2014-ar5iv
    locator: Section 2.3, lines 155–212, Definitions 2.1–2.4 and Proposition 2.2; Appendix A, lines 442–572,
      Lemmas A.1–A.4
    relation: supports
  - source_id: blanchard-delattre-roquain2014-abs
    locator: Abstract (infinite family of p-values is weakly PRDS if any finite subfamily is PRDS)
    relation: supports
- claim_id: continuum-step-up-fixed-point-and-glivenko-cantelli-fdr-proof
  kind: mechanism
  statement: 'For any finite positive measure space (H, frak_H, Lambda) and threshold collection Delta(h,
    r) = alpha pi(h) beta(r) that is left-continuous and non-decreasing in r, Lemma 3.1 and Equation (8)
    prove that the continuum step-up critical volume r_hat(X) = max{r in [0, Lambda(H)] : Lambda(L_Delta(r))
    >= r} is well-defined, measurable, and satisfies the exact fixed-point identity Lambda(L_Delta(r_hat(X)))
    = r_hat(X); furthermore, Section 5.1 (Lemmas 5.1-5.3) and Theorem 4.1 prove by drawing i.i.d. locations
    h_1, ..., h_n ~ Lambda / Lambda(H) and applying the Glivenko-Cantelli uniform convergence sup_{r in
    [0, Lambda(H)]} |Lambda_n(L_Delta(r)) - Lambda(L_Delta(r))| -> 0 almost surely that the finite discrete
    step-up procedures on (H, frak_H, Lambda_n) converge to the continuum step-up procedure along a subsequence
    and transfer finite-dimensional PRDS FDR control to the continuum limit: FDR(R_{SU}) <= alpha int_{H_0}
    pi d_Lambda.'
  evidence:
  - source_id: blanchard-delattre-roquain2014-ar5iv
    locator: Section 3.3, lines 244–269, Definition 3.2, Lemma 3.1, and Equation (8); Section 4.1, lines
      270–298, Theorem 4.1; Section 5.1, lines 349–419, Lemmas 5.1–5.3
    relation: supports
- claim_id: exact-lebesgue-step-up-formula-for-continuous-cdf-testing
  kind: mechanism
  statement: 'In the non-parametric one-sided continuous c.d.f. testing problem H_{0,t}: F(t) <= F_0(t)
    for all t in (0, 1) from i.i.d. observations X_1, ..., X_m (reduced to F_0(t) = t on [0, 1]), Proposition
    4.2 proves that the binomial tail p-value process p_t(X) = sum_{j = m F_hat_m(t)}^m comb(m, j) t^j
    (1 - t)^{m - j} is weakly PRDS on H_0 (yielding FDR(R_{SU}) <= alpha Leb(H_0) by Corollary 4.4), and
    Remark 4.6 proves that because m F_hat_m(t) = j is constant on each order-statistic interval [X_{(j)},
    X_{(j+1)}) and t -> P(Binomial(m, t) >= j) has unique inverse t_j(u), the Lebesgue measure of {t in
    (0, 1) : p_t(X) <= u} reduces to the finite sum gamma(u) = sum_{j=0}^m min(max(t_j(u) - X_{(j)}, 0),
    X_{(j+1)} - X_{(j)}), so the continuum step-up critical value r_hat(X) = max{r in [0, 1] : gamma(alpha
    r) >= r} and rejection set R_{SU}(X) = bigcup_{j=1}^m [X_{(j)}, min(t_j(alpha r_hat(X)), X_{(j+1)}))
    are computed exactly without discretizing (0, 1).'
  evidence:
  - source_id: blanchard-delattre-roquain2014-ar5iv
    locator: Section 4.2.1, lines 302–316, Proposition 4.2 and Corollary 4.4; Section 4.2.2, lines 330–338,
      Remark 4.6; Section 5.3, lines 429–441
    relation: supports
- claim_id: data-dependent-interval-length-weighted-step-up-for-poisson-processes
  kind: mechanism
  statement: 'For testing the integrated intensity H_{0,t}: forall s in [0, t], E[N_s] <= Lambda_0(s)
    of a Poisson process N on [0, 1] with arrival times 0 = X_{(0)} < X_{(1)} < ... < X_{(N)} < X_{(N+1)}
    = 1 (reduced to homogeneous intensity lambda_0 s), Proposition 4.3 and Corollary 4.5 prove that the
    Poisson tail p-value process p_t(X) = P(Poisson(lambda_0 t) >= N_t | X) is weakly PRDS on H_0 and
    controls continuum FDR at level alpha Leb(H_0), and Remark 4.6 proves that under the interval-localized
    threshold collection Delta(t, r) = alpha r 1{forall s in [X_{(j)}, X_{(j+1)}), p_s(X) <= alpha r},
    the continuum step-up procedure reduces exactly to a finite weighted step-up procedure over the N
    + 1 inter-arrival intervals with left-endpoint p-values q_j(X) = p_{X_{(j)}}(X) and data-dependent
    interval-length weights w_l = X_{(sigma(l)+1)} - X_{(sigma(l))}: r_hat(X) = max{sum_{l=0}^k w_l :
    q_{sigma(k)}(X) <= alpha sum_{l=0}^k w_l}.'
  evidence:
  - source_id: blanchard-delattre-roquain2014-ar5iv
    locator: Section 4.2.2, lines 317–348, Proposition 4.3, Corollary 4.5, and Remark 4.6; Appendix B,
      lines 573–729, Lemmas B.1–B.4
    relation: supports
