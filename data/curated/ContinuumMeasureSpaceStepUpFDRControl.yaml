aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Measure-theoretic step-up procedures over a continuum of null hypotheses bound the expected
    Lebesgue/measure proportion of false discoveries across uncountably infinite hypothesis spaces, preventing
    multiplicity-induced false positives (AIO:DataDredgingBias) in continuous spatial or temporal testing
    problems.
limitations:
- On an uncountably infinite index space (H, frak_H, Lambda) where singletons have zero measure Lambda({h})
  = 0, a collection of non-empty finite-measure p-values cannot be mutually independent while maintaining
  joint measurability of the sample paths h -> p_h(X); consequently, continuum step-up FDR control with
  linear shape beta(r) = r relies fundamentally on positive spatial/temporal dependence (weak PRDS on
  H_0, Theorem 4.1) rather than independence (Section 1 and Section 3.1).
- 'In the Poisson process intensity testing problem on [0, 1] (Section 4.2.2, Proposition 4.3, and Corollary
  4.5), weak PRDS of the Poisson tail p-value process p_t(X) = P(Poisson(Lambda_0(t)) >= N_t | X) holds
  for the cumulative prefix null hypotheses H_{0,t}: forall s in [0, t], E[N_s] <= Lambda_0(s) (which
  are nested so H_0 is a prefix interval [0, t_0]), rather than for arbitrary non-nested local intensity
  hypotheses lambda(t) <= lambda_0(t) (Section 4.2.2 and Appendix B).'
- 'When the p-value process (p_h(X))_{h in H} does not admit a piecewise-monotone partition between order
  statistics as in Remark 4.6, computing the exact continuum step-up rejection volume r_hat(X) = max{r
  in [0, Lambda(H)] : Lambda(L_Delta(r)) >= r} requires numerical integration or Monte Carlo discretization
  Lambda_n of the measure space (H, frak_H, Lambda), introducing finite-grid approximation error O(n^{-1/2})
  (Section 5.1, Lemmas 5.1-5.3).'
- All 763 lines of Blanchard, Delattre, & Roquain (2014, Bernoulli 20(1):304-333, arXiv:1110.3599v3, DOI:10.3150/12-BEJ488)
  were read. Constructed numerical checks in research/discovery/continuum-measure-space-step-up-fdr-control-boundaries.py
  verify (1) Section 3.3 & Section 5.1 continuum step-up fixed-point identity Lambda(L_Delta(r_hat)) =
  r_hat = 0.5 and Glivenko-Cantelli grid convergence across n in {20, 50, 100, 500, 1000} (max n |r_hat_n
  - r_hat| = 0.0), (2) Section 4.2.1 Corollary 4.4 and Remark 4.6 exact closed-form Lebesgue measure formula
  gamma(u) = sum_{j=0}^m (t_j(u) - X_{(j)})_+ wedge (X_{(j+1)} - X_{(j)}) for one-sided c.d.f. testing
  at m = 8, alpha = 0.1 (continuum fixed point r_hat = 0.647923, gamma(alpha * r_hat) = 0.647923, matching
  20,000-point Riemann quadrature 0.64795 with fixed-point residual 0.0), and (3) Section 4.2.2 Corollary
  4.5 and Remark 4.6 exact data-dependent interval-length weighted step-up reduction for Poisson process
  intensity testing with N = 12 arrivals and lambda_0 = 5.0 (r_hat(X) = 0.95 at index k_hat = 10 with
  q_{sigma(k_hat)} = 0.026499 <= alpha * r_hat = 0.0475).
