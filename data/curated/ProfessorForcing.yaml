aio_mappings:
- target: AIO:GenerativeAdversarialNetwork
  relation: related_match
  rationale: The method uses adversarial discriminator/generator training and explicitly relates its behavior-matching
    objective to GANs. It is a training algorithm for recurrent models, with mode-conditioned behavior
    rather than only real-versus-generated outputs; the pinned network framework is therefore related
    rather than an exact identity or asserted is-a parent.
limitations:
- The source-defined procedure includes optional teacher-side confusion and multiple task-specific discriminator
  choices; a single fixed architecture or one universal loss weighting is not asserted.
- Both behavior distributions can change as the shared generator changes. Capacity, feature selection,
  sequence segmentation, optimization and classifier balance affect what matching means.
- Matching selected hidden/output behavior is not an automatic certificate for the complete generated
  distribution or arbitrary extrapolation lengths. A visualization is not a distributional equality proof.
- Gradients through continuous behavior do not by themselves resolve every parameter-dependent discrete
  sampling-gradient term. This mathematical boundary does not identify a defect in author code that was
  not inspected.
- All nine primary pages were read. Constructed probability and derivative examples were executed without
  fitting; author code, supplementary audio, model training and empirical replication were not inspected
  or run.
