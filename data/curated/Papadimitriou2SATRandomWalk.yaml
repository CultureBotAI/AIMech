claims:
- claim_id: method
  kind: mechanism
  statement: 'For a CNF formula whose clauses contain at most two literals, keep a complete assignment.
    If it satisfies every clause, return that assignment. Otherwise choose an unsatisfied nonempty clause,
    sample one of its literals uniformly, flip the corresponding variable and repeat. The selected clause
    becomes satisfied, although other clauses can become unsatisfied. Theorem 5 states that on a satisfiable
    2-SAT formula, enough O(n²) such moves find a model with probability arbitrarily close to one, where
    n is the number of variables. Its proof sketch fixes a satisfying witness and compares Hamming distance
    to a reflecting gambler’s-ruin walk: a step is at least as likely to reduce that distance as increase
    it, and distance is bounded above by n. The hidden time factor depends on the chosen confidence; the
    record interprets O(n²) as a move-count statement for fixed desired error, not one constant for arbitrarily
    small failure probabilities.'
