name: Papadimitriou 2-SAT random walk
definition: A randomized 2-SAT search procedure that starts from any complete truth assignment and repeatedly
  selects an unsatisfied clause and flips a uniformly chosen literal’s variable until a satisfying assignment
  is reached or a selected move budget ends.
concept_kind: algorithm
identity_notes: 'The record captures the 2-SAT application and Theorem 5 of Papadimitriou’s 1991 paper.
  It is distinct from that paper’s more general preference-graph and undominated-model problems, from
  greedy/random mixtures in GWSAT, from WalkSAT/SKC’s zero-break priority, and from later bounded-walk/restart
  algorithms for general k-SAT. The original short rule permits any starting assignment and does not demand
  a uniformly random clause-selection rule. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 319 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 11 and 11 lines respectively. All
  eleven unique lines were inspected, and the sorted checkout hit sets were identical: source-title references
  and saved review/ledger frontier leads, not existing candidate records. Eight exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and six full native neighboring records were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- A verified satisfying assignment is a sound positive result. Failure within a finite budget can occur
  on a satisfiable formula and is not a proof of unsatisfiability; the theorem describes a one-sided randomized
  search/decision guarantee.
- The 2-SAT analysis does not establish the same bound for general CNF, greedy mixtures, SKC priorities
  or arbitrary biased literal selection. A chosen clause-selection policy and formula representation must
  be explicit; the literal choice is random even when clause choice is deterministic.
- The source’s bound counts moves and does not make locating an unsatisfied clause or updating formula
  data structures free in wall-clock complexity. The short proof is a sketch, not a fully specified executable
  implementation or a numerical benchmark.
- Empty clauses provide no literal to flip and need separate handling. An empty conjunction is already
  satisfied. The inspected method does not prescribe a restart schedule, mandatory random initialization
  or a universal fixed cutoff constant.
- The primary paper motivates related random walks through Markov chains. With a clause-selection policy
  depending only on the current assignment, the transition rule is a Markov chain; arbitrary history-dependent
  choices need not have that property on the assignment state alone. This does not identify the algorithm
  with a neural network.
