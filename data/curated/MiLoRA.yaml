claims:
- claim_id: milora-minor-singular-subspace-initialization-and-principal-orthogonality
  kind: mechanism
  statement: Splitting W = U_p Sigma_p V_p^T + U_m Sigma_m V_m^T into the top-(m-r) principal components W_p (frozen) and bottom-r minor components W_m initialized as B_m = U_m sqrt(Sigma_m) and A_m = sqrt(Sigma_m) V_m^T preserves W = W_p + B_m A_m exactly at step 0 while initializing the adapter in a subspace strictly orthogonal to U_p and V_p without requiring an alpha/r scaling hyperparameter.
  evidence:
  - source_id: r675-primary-pdf
    locator: Section 3 (Methodology, Equations 3-5 & Figure 1), pp. 2-3
    relation: supports
- claim_id: milora-reduced-principal-feature-amplification-and-lower-forgetting-loss
  kind: mechanism
  statement: Subspace similarity and projection analyses on LLaMA2-7B show that MiLoRA updates concentrate in the bottom singular vector subspace of W with a much smaller principal-feature projection ||U^T W V||_F than PiSSA (1.86 vs. 17.57) and achieve lower pre-trained distribution forgetting cross-entropy on WikiText-103 (2.54 vs. 3.24 for LoRA and 6.07 for PiSSA).
  evidence:
  - source_id: r675-primary-pdf
    locator: Section 5.3-5.4 (Tables 7-8, Figure 2) & Appendix B.2 (Table 14), pp. 7-8, 14
    relation: supports
- claim_id: milora-application-commonsense-math-instruction-and-multimodal-finetuning
  kind: application
  statement: Across 18 benchmarks on LLaMA2-7B, LLaMA3-8B, Qwen2.5-7B, and LLaVA1.5-7B, MiLoRA outperforms both LoRA and PiSSA on commonsense reasoning (+1.6/+5.4 on LLaMA2-7B, +1.1/+6.5 on LLaMA3-8B), math reasoning (+2.0/+3.7 EM on GSM8K/MATH), instruction following (+2.9/+2.7 on AlpacaEval 2.0/FollowBench/IFEval), and visual instruction tuning (+1.4/+4.4 on 7 VQA benchmarks) with zero inference overhead.
  evidence:
  - source_id: r675-primary-pdf
    locator: Section 4.1-4.2 (Tables 1-4), Section 5.1 (Table 5) & Appendix B.1 (Table 13), pp. 4-6, 13-14
    relation: supports
- claim_id: milora-limitation-soft-orthogonality-and-small-lr-large-batch-regime
  kind: limitation
  statement: Because MiLoRA enforces orthogonality between W_m and W_p only at initialization rather than via hard projection constraints during training, and because minor singular values are small in magnitude, MiLoRA underperforms PiSSA when trained for 1 epoch under a small learning rate (2e-5) and large batch size (128) regime (22.6 vs. 29.4 average on GSM8K/MATH).
  evidence:
  - source_id: r675-primary-pdf
    locator: Section 3 (p. 3) & Section 5.5 (Comparison Between MiLoRA and PiSSA, Table 9, p. 8)
    relation: supports
