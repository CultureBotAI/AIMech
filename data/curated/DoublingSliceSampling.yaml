name: Doubling slice sampling
definition: A univariate slice-sampling algorithm that expands a randomly placed initial interval by randomly
  directed doublings and uses shrinkage with a retrospective acceptability test to preserve the target.
concept_kind: algorithm
identity_notes: This record specifies Neal’s Figures 4–6, including the extra acceptance test for general
  slices. It differs from stepping out by geometric interval expansion and the need to reject some in-slice
  candidates. Its binary interval construction is unrelated to NUTS trajectory-tree doubling. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases.
  Ignored-inclusive full-checkout searches found prior discovery leads for Gibbs and slice sampling plus
  unrelated environment substring hits, not existing concept records. Existing HMM/MRF models and general
  Metropolis–Hastings were inspected to distinguish model, general transition and specialized algorithm
  scope.
limitations:
- For a general multimodal density, being inside the slice is insufficient for acceptance. Omitting Figure
  6 can invalidate the update.
- Stopping expansion on one side merely because that side is already outside the slice is not the random
  doubling procedure used in the proof.
- The test may be omitted under the source’s single-interval slice/unimodality conditions, not as a blanket
  optimization.
- The width and maximum doubling count remain parameters; the interval length cap is 2^p w, and finding
  an interval is not proof of rapid mixing across disconnected slice components.
- The doubling interval must remain available for the retrospective test even as the proposal interval
  shrinks. Numerical boundary handling and round-off remain implementation concerns.
