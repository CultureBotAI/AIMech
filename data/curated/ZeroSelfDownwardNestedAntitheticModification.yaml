limitations:
- The maintained scope is a finite positive-support distribution, exact normalization and a consistent
  downward ordering with explicit tie handling. Zero-probability current states and countably infinite
  extensions are outside this initial operational scope.
- Algorithm 5 contains printed missing brackets in its loop and index notation. The mathematical interpretation
  used here follows the surrounding equations and includes the equality completion condition. It is not
  a claim that literal author implementation code was executed or floating-point guards fully verified.
- Curator calculations cover a bounded set of exact rational kernels. They do not certify an arbitrary
  floating-point implementation, execute author code or reproduce empirical benchmarks.
- NAM, UNAM, DNAM and the UDNAM mixture have related but different scopes. No broad exact aliases or equivalence
  with all zero-self sampling methods are asserted. The source family and empirical literature remain
  incompletely assessed.
