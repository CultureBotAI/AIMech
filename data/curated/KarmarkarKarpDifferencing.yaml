  relation: supports
claims:
- claim_id: largest-pair-reduction
  kind: mechanism
  statement: For a finite nonempty multiset of nonnegative weights, repeatedly remove two largest residuals
    a>=b and insert a-b until one remains. The final value is the achieved absolute difference between
    the two subset sums. Residuals include combinations formed at earlier steps, so this is not simply
    assigning the next original weight to the currently lighter bin. Equal-valued input items retain distinct
    identities.
  evidence:
  - *id001
  - *id002
- claim_id: relative-orientation-reconstruction
  kind: mechanism
  statement: A residual represents a partial signed sum of original weights. Combining a and b by a-b
    preserves the orientation of one partial partition and reverses the other. Recording the combination
    tree permits signs to be propagated back to all original item indices; the positive and negative groups
    reconstruct a partition with the reported residue. A later reversal can flip an entire partial partition,
    so a differencing step does not irrevocably name each raw item’s final bin.
  evidence:
  - *id001
  - *id002
- claim_id: heap-and-arithmetic-cost
  kind: scope
  statement: A max-priority queue performs n-1 pair reductions with O(n log n) comparison/arithmetic operations.
    Retaining one binary combination node per reduction uses O(n) items, and a traversal reconstructs
    the partition in O(n) operations. These are unit-cost operation and item-count statements, not bounds
    independent of numeric bit length, precision or implementation overhead.
  evidence:
  - source_id: korf1997
    locator: Section2.6, manuscript PDF/printed pp.8–10; curator explicit combination-tree construction
    relation: supports
- claim_id: heuristic-not-certificate
  kind: limitation
  statement: The heuristic is not an exact optimizer. On weights8,7,6,5,4, its residual sequence is(6,5,4,1),
    (4,1,1), (3,1), then2, while subsets{8,7} and{6,5,4} have equal sum15 and residue0. Thus the achieved
    residue is an upper bound on the minimum residue, not a lower bound or proof of optimality. The procedure
    does not enforce equal subset cardinalities.
  evidence:
  - *id002
  - source_id: korf1997
    locator: Section3 and Figure4, manuscript PDF/printed pp.12–13; curator exhaustive sign enumeration
    relation: supports
- claim_id: distinct-randomized-theorem-algorithm
  kind: scope
  statement: AlgorithmA is distinct from the original report’s adjacent-pair AlgorithmB and the later
    interval-based random differencing procedure with compaction. The report’s high-probability asymptotic
    analysis uses that randomized procedure and assumptions on independent input values with a Lipschitz
    density. Its opening linear-time and vanishing-residue claims are not adopted as unconditional guarantees
    for the bare largest-pair heuristic. The k-way cyclic-differencing construction is also outside this
    two-way record.
  evidence:
  - source_id: karmarkar-karp-report
    locator: Sections1–2.4, PDF/printed pp.1–16, especially AlgorithmB p.3, random differencing/compaction
      pp.4–6 and Theorems1–5 pp.6–7; Section3 pp.16–30
    relation: supports
- claim_id: reported-empirical-scope
  kind: scope
  statement: Korf’s Figure2 compares average residues from KK and sorted greedy partitioning on sampled
    uniformly distributed ten-digit integers. The reported average advantage depends on that input distribution
    and precision; it does not establish that KK beats greedy on every instance. CKK’s later improvements
    arise from additional search, not an optimality guarantee of this heuristic. No historical runtime
    or stochastic experiment was replicated here.
  evidence:
  - source_id: korf1997
    locator: Section2.6 and Figure2, manuscript PDF/printed pp.9–11; Section3 pp.12–13
    relation: supports
