id: AIMech:KarmarkarKarpDifferencing
name: Karmarkar–Karp differencing
aliases:
- Karmarkar–Karp heuristic
concept_kind: algorithm
definition: A two-way number-partitioning heuristic that repeatedly replaces the two largest remaining
  nonnegative residuals by their difference, then reconstructs a partition whose absolute sum difference
  is the final residual.
identity_notes: Compared all 442 pinned AIO and 587 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 172, 120, 119 lines. All distinct match contents
  were inspected. Semantic matching covered 67 AIO and 94 native definitions, with every matched definition
  read. 6 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. The
  repeated text matches are a pending combined KK/CKK frontier entry, not existing records. The identity
  here is the two-way largest-pair differencing heuristic, AlgorithmA in the original report and KK in
  Korf Section2.6. It is distinct from AlgorithmB, interval-based random differencing, complete Karmarkar–Karp
  search, and generic DFS or discrepancy ordering. Multiway variants remain explicit separate leads. The
  inspected AIO graph has no suitable counterpart; no forced related mapping is asserted.
definition_evidence:
- &id001
  source_id: karmarkar-karp-report
  locator: Section2.1 AlgorithmA and worked example, PDF/printed p.2
  relation: supports
- &id002
