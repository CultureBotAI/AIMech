      the curated deterministic procedure.
limitations:
- Scope is two-way unconstrained partitioning of a finite nonempty nonnegative multiset. Multiway, cardinality-balanced,
  randomized-compaction and complete-search variants have distinct identities.
- The returned partition is feasible but can be suboptimal. Ties can change reconstructed item membership
  even when the residue is unchanged.
- Unit-cost complexity assumes exact comparisons and arithmetic; floating-point cancellation and very
  large numeric representations require separate implementation analysis.
- The Berkeley archive metadata and Korf’s1982 report citation differ. The inspected versions are identified
  explicitly, without inferring publication priority.
- All30 original-report pages and all31 Korf manuscript pages were read. Small constructed calculations
  were run; author implementations and the final1998 journal full text were not inspected.
