id: AIMech:UnifiedAssumptionLeanMovingTargetLinearRegressionAndScoreBootstrap
name: Unified assumption-lean moving-target linear regression and score bootstrap
concept_kind: mathematical_method
aliases:
- Model-free study of ordinary least squares linear regression (Kuchibhotla, Brown, & Buja 2018)
- Unified independent non-identically distributed moving-target OLS framework
- Multiplier score bootstrap and m-of-n resampling score bootstrap for ordinary least squares
- Deterministic master inequality and semiparametric efficiency for moving-target OLS
definition: An assumption-lean statistical estimation and inference methodology for ordinary least squares
  (OLS) linear regression that starts with the empirical OLS estimator beta_hat_n = Sigma_hat_n^{-1} Gamma_hat_n
  (where Sigma_hat_n := 1/n sum_{i=1}^n X_i X_i^T and Gamma_hat_n := 1/n sum_{i=1}^n X_i Y_i) and defines
  its sample-size-dependent moving target of estimation beta_n := Sigma_n^{-1} Gamma_n = argmin_{theta
  in R^p} 1/n sum_{i=1}^n E[(Y_i - X_i^T theta)^2] (where Sigma_n := 1/n sum_{i=1}^n E[X_i X_i^T] and
  Gamma_n := 1/n sum_{i=1}^n E[X_i Y_i]; Definition 2.1, Equations 9-14) across a unified framework of
  independent, possibly non-identically distributed (i.n.i.d.) observation vectors (X_i^T, Y_i)^T in R^{p+1}
  encompassing both fixed covariates and random covariates (Kuchibhotla, Brown, & Buja 2018). Because
  the population normal equation 1/n sum_{i=1}^n E[X_i(Y_i - X_i^T beta_n)] = 0 holds on average while
  individual score expectations E[X_i(Y_i - X_i^T beta_n)] are generally non-zero under fixed or non-identically
  distributed covariates with nonlinearity, the centered score vectors S_i := X_i(Y_i - X_i^T beta_n)
  - E[X_i(Y_i - X_i^T beta_n)] have true covariance K_n = 1/n sum_{i=1}^n E[S_i S_i^T] satisfying Bentkus's
  multidimensional Berry-Esseen bound over convex sets C_p subseteq R^p (Theorem 2.1, Theorem 5.1, Equations
  16-17), while the uncentered second-moment matrix K_n^* := 1/n sum_{i=1}^n E[X_i X_i^T (Y_i - X_i^T
  beta_n)^2] dominates K_n in Loewner order (K_n <= K_n^*). Pairing the empirical plug-in matrix K_check_n
  := 1/n sum_{i=1}^n X_i X_i^T (Y_i - X_i^T beta_hat_n)^2 with Anderson's (1955) Lemma (Lemma 6.2), the
  methodology constructs asymptotically conservative confidence regions and simultaneous tests via the
  Eicker-Huber-White sandwich estimator Sigma_hat_n^{-1} K_check_n Sigma_hat_n^{-1} (Equation 18) and
  matrix-inversion-free multiplier and m-of-n resampling score bootstraps on the estimated score vectors
  S_hat_i := X_i(Y_i - X_i^T beta_hat_n) (Sections 6.2-7, Equations 20-29), backed by an assumption-free
  deterministic master inequality (Theorem 8.1, Equations 30-32) and semiparametric efficiency of beta_hat_n
  for beta_n (Appendix A, Lemma A.1, Equations 33-36).
identity_notes: Distinct from all 442 pinned AIO classes (including AIO:LinearRegression) and all 610
  maintained AIMech curated concepts. Specifically distinct from AIMech:ModelRobustNonlinearityConsistentSandwichAndRAVSpecificationTest
  (Buja et al. 2019 Part I, Statistical Science 34(4):523-544, arXiv:1404.1578v4, DOI:10.1214/18-STS693;
  restricted to i.i.d. random-design regression, Conditional Lock-In Theorem 3.1 for M_Lin and M_Hom,
  and the Ratio of Asymptotic Variances test statistic RAV_j) and AIMech:ModelFreeRegressionFunctionalsReweightingDiagnosticAndXYBootstrapLimit
  (Buja et al. 2019 Part II, Statistical Science 34(4):545-565, arXiv:1612.03257v2, DOI:10.1214/18-STS694;
  general optimization, proper scoring rule, and estimating-equation functionals on i.i.d. P_X x P_{Y|X},
  Gaussian decile reweighting diagnostic trace, partial influence function IF(x_vec), and M-of-N XY-bootstrap
  limit). Kuchibhotla, Brown, & Buja (2018, arXiv:1809.10538v1) formulate the unified independent non-identically
  distributed (i.n.i.d.) moving-target OLS framework beta_n = Sigma_n^{-1} Gamma_n bridging fixed and
  random covariates (Definition 2.1, Theorem 2.1, Theorem 5.1), prove the impossibility of consistent
  variance estimation under arbitrary unknown means (Lemma 6.1) alongside Loewner-order conservativeness
  K_n <= K_n^* and Anderson's Lemma (Lemma 6.2), introduce the multiplier score bootstrap T_n^* = n^{-1/2}
  sum_{i=1}^n W_i S_hat_i and m-of-n resampling score bootstrap T_m^star = m^{-1/2} sum_{j=1}^m S_hat_{I_j}
  that avoid solving singular resampled linear systems (Sections 6.3-6.4), and prove the deterministic
  master inequality for OLS (Theorem 8.1) and semiparametric efficiency of beta_hat_n for beta_n under
  i.n.i.d. product measures (Appendix A, Lemma A.1).
