claims:
- claim_id: unified-inid-moving-target-ols-and-multidimensional-berry-esseen-bound
  kind: mechanism
  statement: Under the unified independent, possibly non-identically distributed (i.n.i.d.) framework
    for (X_i^T, Y_i)^T in R^{p+1} encompassing fixed covariates (point masses at x_i, Section 3) and i.i.d.
    random covariates (Section 4), the moving target beta_n := Sigma_n^{-1} Gamma_n = argmin_{theta in
    R^p} 1/n sum_{i=1}^n E[(Y_i - X_i^T theta)^2] (Definition 2.1, Equations 9-14) satisfies the average
    population normal equation 1/n sum_{i=1}^n E[X_i(Y_i - X_i^T beta_n)] = 0 while the individual score
    expectations E[X_i(Y_i - X_i^T beta_n)] vanish under i.i.d. observations but are generally non-zero
    under fixed or non-identically distributed covariates with nonlinearity (Section 5, p. 11). Defining
    the centered score vectors S_i := X_i(Y_i - X_i^T beta_n) - E[X_i(Y_i - X_i^T beta_n)] (Equation 16)
    with covariance K_n = 1/n sum_{i=1}^n E[S_i S_i^T], Bentkus's (2004) multidimensional Berry-Esseen
    bound over all convex sets C_p subseteq R^p yields sup_{A in C_p} |P(n^{1/2} Sigma_hat_n (beta_hat_n
    - beta_n) in A) - P(N(0, K_n) in A)| <= C p^{1/4} n^{-1/2} alpha_n where alpha_n := 1/n sum_{i=1}^n
    E[||K_n^{-1/2} S_i||_2^3] (Theorem 2.1, Equation 17), proving n^{1/2} K_n^{-1/2} Sigma_hat_n (beta_hat_n
    - beta_n) ->^L N(0, I_p) under uniform sixth moment bounds E[||X_i||_2^6 + Y_i^6] <= B < infty (Theorem
    5.1, pp. 12-14).
  evidence:
  - source_id: kuchibhotla2018-pdf
    locator: Sections 2-5, Pages 3-14, Definition 2.1, Theorem 2.1, Theorem 5.1, Equations (1)-(17)
    relation: supports
  - source_id: kuchibhotla2018-abs
    locator: arXiv:1809.10538v1 abstract
    relation: supports
- claim_id: variance-estimation-impossibility-loewner-conservativeness-and-anderson-lemma
  kind: mechanism
  statement: For independent random variables W_1, ..., W_n with unknown means E[W_i] = mu_i and variances
    Var(W_i) = sigma_i^2, there does not exist any consistent estimator for the average variance eta_n^2
    := 1/n sum_{i=1}^n sigma_i^2 over arbitrary {(mu_i, sigma_i^2)}_{i=1}^n (Section 6.1, Lemma 6.1, p.
    16). However, the uncentered second-moment matrix K_n^* := 1/n sum_{i=1}^n E[X_i X_i^T (Y_i - X_i^T
    beta_n)^2] dominates the true centered score covariance K_n in Loewner order via K_n = K_n^* - 1/n
    sum_{i=1}^n (E[X_i(Y_i - X_i^T beta_n)])(E[X_i(Y_i - X_i^T beta_n)])^T <= K_n^* (p. 14), the empirical
    plug-in matrix K_check_n := 1/n sum_{i=1}^n X_i X_i^T (Y_i - X_i^T beta_hat_n)^2 satisfies ||K_check_n
    - K_n^*||_op = o_p(1) (p. 15), and by Anderson's (1955) Lemma (Lemma 6.2, p. 18), for any centrally
    symmetric convex set A subseteq R^p, K_n <= K_n^* implies P(N(0, K_n^*) in A) <= P(N(0, K_n) in A),
    ensuring that confidence regions and coordinate t_j / simultaneous max-|t| tests constructed from
    the Eicker-Huber-White sandwich estimator Sigma_hat_n^{-1} K_check_n Sigma_hat_n^{-1} (Equation 18)
    are asymptotically exact under i.i.d. sampling (K_n^* = K_n) and asymptotically conservative across
    the unified i.n.i.d. and fixed-covariate settings (Section 6.1, Section 7, pp. 14-22).
  evidence:
  - source_id: kuchibhotla2018-pdf
    locator: Section 6.1, Pages 14-16, Lemma 6.1, Equation (18); Section 6.3, Pages 18-19, Lemma 6.2;
      Section 7, Pages 21-22
    relation: supports
- claim_id: multiplier-and-m-of-n-resampling-score-bootstraps-without-matrix-inversion
  kind: mechanism
  statement: Because classical pairs bootstrap resampling of observations (X_i, Y_i) requires solving
    B linear systems and encounters singular resampled Gram matrices with positive probability when covariates
    have discrete atoms or small sample sizes (Section 6.2, pp. 16-17), Sections 6.3-6.4 (pp. 17-21, Equations
    20-29) bootstrap the estimated score vectors S_hat_i := X_i(Y_i - X_i^T beta_hat_n) (which satisfy
    sum_{i=1}^n S_hat_i = 0 and 1/n sum_{i=1}^n S_hat_i S_hat_i^T = K_check_n after solving the OLS linear
    system only once) via either the multiplier score bootstrap T_n^* := n^{-1/2} sum_{i=1}^n W_i S_hat_i
    with i.i.d. multipliers E[W_i] = 0, E[W_i^2] = 1, E[|W_i|^3] < infty (where W_i ~ N(0,1) makes the
    conditional Berry-Esseen error in Equation 21 identically zero, p. 18) or the m-of-n resampling score
    bootstrap T_m^star := m^{-1/2} sum_{j=1}^m S_hat_{I_j} (Equation 28). Both score bootstraps converge
    conditionally to N(0, K_n^*) over all convex sets and yield Glivenko-Cantelli confidence regions R_hat_n(alpha)
    for T_n = n^{1/2} Sigma_hat_n (beta_hat_n - beta_n) satisfying inf_{alpha in [0,1]} (int_{R_hat_n(alpha)}
    dP_{T_n} - (1 - alpha)) >= o_p(1) (Equations 24-27).
  evidence:
  - source_id: kuchibhotla2018-pdf
    locator: Sections 6.2-6.4, Pages 16-21, Lemma 6.2, Equations (20)-(29)
    relation: supports
  - source_id: kuchibhotla2018-abs
    locator: arXiv:1809.10538v1 abstract
    relation: supports
- claim_id: deterministic-master-inequality-and-semiparametric-efficiency-of-ols
  kind: mechanism
  statement: Section 8 (pp. 23-24, Theorem 8.1, Equations 30-32) proves that for any sample realization
    satisfying D_{2n}^Sigma := ||Sigma_hat_n - Sigma_n||_op <= Lambda_n / 2 where Lambda_n := lambda_min(Sigma_n)
    > 0, the OLS estimator beta_hat_n and moving target beta_n obey the assumption-free deterministic
    master inequalities 1/2 ||Sigma_n^{-1}(Gamma_hat_n - Sigma_hat_n beta_n)||_2 <= ||beta_hat_n - beta_n||_2
    <= 2 ||Sigma_n^{-1}(Gamma_hat_n - Sigma_hat_n beta_n)||_2 (Equation 30) and ||beta_hat_n - beta_n
    - Sigma_n^{-1}(Gamma_hat_n - Sigma_hat_n beta_n)||_2 <= 2 D_{2n}^Sigma ||Sigma_n^{-1}(Gamma_hat_n
    - Sigma_hat_n beta_n)||_2 / Lambda_n (Equation 31) without any distributional or independence assumptions.
    Furthermore, Appendix A (pp. 25-31, Lemma A.1, Equations 33-36) proves via least favorable parametric
    submodels dP_t^{(g_1,...,g_n)}(z_1,...,z_n) = prod_{i=1}^n c(t, g_i) K(t g_i(z_i)) dP_i(z_i) with
    K(u) = 2(1 + exp(-2u))^{-1} that the efficient influence function for beta_n is psi_tilde_{P_i}(Z_i)
    = (sum_{i=1}^n E[X_i X_i^T])^{-1} {X_i(Y_i - X_i^T beta_n) - E[X_i(Y_i - X_i^T beta_n)]}, establishing
    that beta_hat_n is a semiparametrically efficient regular estimator of beta_n.
  evidence:
  - source_id: kuchibhotla2018-pdf
    locator: Section 8, Pages 23-24, Theorem 8.1, Equations (30)-(32); Appendix A, Pages 25-31, Lemma
      A.1, Equations (33)-(36)
    relation: supports
