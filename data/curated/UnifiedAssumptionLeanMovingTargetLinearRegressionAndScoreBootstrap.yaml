limitations:
- Under non-identically distributed or fixed covariates with nonlinearity where the individual score expectations
  E[X_i(Y_i - X_i^T beta_n)] are non-zero, Lemma 6.1 proves that no consistent estimator of the true score
  covariance K_n exists without structural assumptions on the means, so sandwich and score-bootstrap inference
  targeting K_n^* >= K_n is asymptotically conservative rather than exact (Section 6.1, pp. 14-16).
- Confidence regions constructed naturally on the linear-system scale T_n = n^{1/2} Sigma_hat_n (beta_hat_n
  - beta_n) via the score bootstrap require pre-multiplying by Sigma_hat_n^{-1} or projecting onto coordinates
  to obtain individual slope intervals (Sections 6.3-7, pp. 19-22).
- 'Five minor typographical notes in arXiv:1809.10538v1 were identified and verified during full-text
  inspection: (1) Section 2 (page 3, line 11) prints ''A <= B is used mean that'' missing ''to''; (2)
  Section 3 (page 8, line 15, display for gamma_n) prints ''||Psi_n^{-1} Sigma_n^{-1} x_i||_2^3 = ...
  ||Sigma_n K_n^{-1} x_i||_2^3'' with exponent -1 instead of -1/2 on Psi_n and K_n; (3) Section 6.3 (page
  18, line 18) prints ''for any centrally convex set A'' missing ''symmetric''; (4) Section 6.4 (page
  20, line 11) prints ''represents an sample'' for ''represents a sample''; and (5) Appendix A (page 29,
  last display equation) omits the integral sign before c(t, g_i), and Appendix A.1 (page 31, last sentence)
  prints ''Similar calculations holds'' for ''Similar calculations hold''.'
- All 33 pages of the full-text PDF of Kuchibhotla, Brown, & Buja (2018, arXiv:1809.10538v1) were read.
  Constructed numerical checks in research/discovery/unified-assumption-lean-moving-target-ols-and-score-bootstrap-boundaries.py
  verify (1) Definition 2.1 moving-target average normal equation vs. non-zero individual score expectations
  and positive semidefinite Loewner gap K_n^* - K_n >= 0 under i.n.i.d. nonlinearity, (2) Section 6.1
  & Lemma 6.2 conservative coverage of sandwich confidence intervals via Anderson's Lemma, (3) Sections
  6.2-6.4 multiplier and m-of-n resampling score bootstraps eliminating pairs-bootstrap Gram matrix singularities
  (0.0% vs. 3.67%) while matching K_check_n, and (4) Theorem 8.1 deterministic master inequalities across
  all 300 realizations satisfying D_{2n}^Sigma <= Lambda_n / 2.
