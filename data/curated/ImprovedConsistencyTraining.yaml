claims:
- claim_id: generative-mechanism
  kind: mechanism
  statement: The student and stop-gradient teacher evaluate the same data sample plus the same Gaussian
    noise scaled to adjacent noise levels, with teacher EMA decay set to zero. The revised objective uses
    a Pseudo-Huber discrepancy and inverse adjacent-noise-gap weighting. Training samples adjacent intervals
    according to discretized lognormal masses and doubles the interval count at scheduled milestones up
    to a cap. Noise-embedding sensitivity and shared dropout randomness are additional prescribed training
    choices; the separate inference-time EMA remains distinct.
