name: Improved consistency training
definition: The consistency-model training procedure of Song and Dhariwal that learns directly from paired
  shared-noise data perturbations using a stop-gradient teacher with current student parameters, a Pseudo-Huber
  discrepancy, revised noise weighting and sampling, and a staged increase in noise-discretization intervals.
concept_kind: algorithm
identity_notes: The identity search included 442 AIO records, 90 preceding native identities, all scoped
  synonyms and aliases, and ignored-inclusive text in both checkouts. This is the named improved consistency-training
  procedure, not the consistency-model family, the original EMA-teacher training procedure, diffusion-model
  distillation, or a particular iCT-deep architecture/checkpoint. The acronym is qualified to avoid claiming
  an unscoped abbreviation.
limitations:
- Removing teacher EMA retains stop-gradient and does not remove inference-time parameter averaging; it
  is not a blanket recommendation to eliminate EMA from consistency distillation.
- The paper's counterexample diagnoses a flaw in an earlier asymptotic argument. Its correction and finite-noise
  curriculum do not establish universal finite-training convergence.
- Noise distribution, loss scale, discretization cap, dropout and embedding settings are choices evaluated
  in particular image-generation settings, not universal hyperparameters. The interval count doubles;
  the number of noise grid points is that count plus one.
- The record describes the inspected training procedure and retains DRAFT status; it does not reproduce
  performance comparisons, certify every proof, or identify all future variants with this version.
