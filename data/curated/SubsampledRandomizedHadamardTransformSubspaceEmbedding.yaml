claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any n x k matrix V with orthonormal columns (V^T V = I_k), Lemma 3.3 proves by applying Rademacher convex Lipschitz concentration (Lemma 2.1) to the Euclidean norm f(epsilon) = ||e_j^T H diag(epsilon) V||_2 (which has mean <= sqrt(k/n) and Lipschitz constant <= 1/sqrt(n)) that the randomized Walsh-Hadamard transform W = H D V flattens all n row norms simultaneously to satisfy max_{j=1..n} ||e_j^T (H D V)||_2 <= sqrt(k/n) + sqrt(8 log(beta n) / n) with probability at least 1 - 1/beta.
  evidence:
  - source_id: r329-primary-pdf
    locator: Section 2.1, Lemma 2.1, p. 3; Section 3.1, Lemma 3.3 and Proof, pp. 5-6
    relation: supports
  - source_id: r329-metadata-cr
    locator: Crossref metadata for Advances in Adaptive Data Analysis 3(1-2):115-126
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Combining Lemma 3.3 with the matrix Chernoff bound for uniform row sampling without replacement (Lemma 2.2 / Corollary 2.3 and Lemma 3.4), Theorems 1.1 and 3.1 establish that for embedding dimension l >= 4 [sqrt(k) + sqrt(8 log(beta n))]^2 log(beta k) = Omega((k + log n) log k), the SRHT matrix Phi = sqrt(n/l) R H D preserves all k singular values of Phi V within [1/sqrt(2), sqrt(3/2)] (or more generally [sqrt(1 - delta), sqrt(1 + delta)]) with failure probability at most O(1/beta).
  evidence:
  - source_id: r329-primary-pdf
    locator: Section 1, Theorem 1.1, p. 2; Section 3.1-3.2, Theorem 3.1, Lemma 3.4, and Proof of Theorem 3.1, pp. 5-7
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Section 3.3 demonstrates via a block-Hadamard adversarial basis V that the logarithmic factor k log k in the embedding dimension l cannot be eliminated because uniform row sampling must solve a k-bin coupon collector problem to preserve rank(Phi V) = k, while the additive log(n) log(k) term is required to prevent maximal row-norm spikes.
  evidence:
  - source_id: r329-primary-pdf
    locator: Section 3.3, Optimality of Theorem 3.1, pp. 7-8
    relation: supports
