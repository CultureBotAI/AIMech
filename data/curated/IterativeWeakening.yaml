id: AIMech:IterativeWeakening
name: Iterative weakening
aliases: []
concept_kind: algorithm
definition: A policy for selecting a sufficient search bias by trying a fixed family of search-space restrictions
  in increasing order of known evaluation complexity, progressively admitting more costly searches until
  an acceptable result is found.
identity_notes: Compared all 442 pinned AIO and 645 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 481, 244, 242 lines. All distinct match contents
  were inspected. Semantic matching covered 72 AIO and 130 native definitions, with every matched definition
  read. 11 full annotated AIO node/edge/generated contexts and 5 full native records were inspected. Retain
  the general policy for ordering a fixed family of search biases by known evaluation complexity. Iterative
  deepening and broadening are examples along particular dimensions, whereas empirical grid selection,
  iterated configuration search and statistical racing use different objectives and feedback. Search bias
  here means an allowed-space restriction, not a social or statistical bias phenomenon.
definition_evidence:
- source_id: provost1993weakening
  locator: Introduction and formal problem description, PDF pp.1–3 / printed pp.749–751
  relation: supports
claims:
- claim_id: cost-ordered-bias-selection
  kind: mechanism
  statement: A bias specifies a restriction on the lower-level search, such as allowed depth, successor
    breadth or hypothesis complexity. Treat candidate biases as states of a higher-level search and order
    their evaluation by a supplied complexity function. The inspected analysis fixes the bias family and
    its evaluation procedure and assumes no useful knowledge is transferred between successive bias trials.
    It does not learn a cost surrogate from observed trial outcomes.
  evidence:
  - source_id: provost1993weakening
    locator: Introduction, formal problem description and One-Dimensional Spaces, PDF pp.1–3 / printed
      pp.749–751
    relation: supports
- claim_id: repeated-cost-comparison
  kind: scope
  statement: The theoretical comparison concerns total search time relative to evaluating a least-cost
    sufficient bias, rather than solution-path cost or generalization quality. Actual geometric growth
    in successive trial costs can keep their cumulative cost within a constant factor of the last trial;
    polynomial growth produces increasing overhead. A literal exponential big-O upper bound alone is insufficient
    to imply that geometric-growth property.
  evidence:
  - source_id: provost1993weakening
    locator: One-Dimensional Spaces, PDF p.3 / printed p.751; When IW is not a Good Policy, PDF p.6 /
      printed p.754
    relation: supports
- claim_id: multidimensional-multiplicity
  kind: mechanism
  statement: For multiple bias dimensions, account for how many states share each cost level as well as
    how quickly that level grows. The paper studies costs such as b^i+b^j, b^(i+j) and b^(ij). Collapsing
    evaluation to equal coordinates uses additional componentwise sufficiency information and can be efficient
    for one cost family yet very costly for another. The printed bound on the number of ordered factor
    pairs by sqrt(k) needs a constant-factor qualification; that observation alone does not overturn its
    asymptotic order.
  evidence:
  - source_id: provost1993weakening
    locator: Multi-Dimensional Spaces, Dual Searches, A Search within a Search and Relative Growth, PDF
      pp.3–5 / printed pp.751–753
    relation: supports
- claim_id: joint-breadth-depth-scope
  kind: scope
  statement: The paper treats joint breadth and depth selection as an application of ordering search costs
    b^d and proposes grouping by integer logarithmic cost levels. This requires a precise mapping from
    those levels to integer admissible bounds and componentwise sufficiency. Taking d log2(b) to be exactly
    an integer would omit many integer-width settings; a practical rounding or domination schedule must
    be specified. A separate curator construction illustrates one such schedule for widths at least two
    without asserting that it is the author implementation.
  evidence:
  - source_id: provost1993weakening
    locator: 'Knowledge Can Reduce No. of States: Combining Broadening and Deepening, PDF pp.5–6 / printed
      pp.753–754'
    relation: supports
- claim_id: limits-of-policy-guarantees
  kind: limitation
  statement: Ordering evaluation costs does not guarantee a competitive policy for every search space.
    Slowly growing costs, large equal-cost classes and many bias states sharing the same coordinate description
    can increase overhead. Benefits from transferred knowledge or instance-dependent success probabilities
    are outside the fixed no-transfer analysis. The seven-page paper gives theoretical arguments and motivating
    applications, not a comparative benchmark establishing universal practical speedup.
  evidence:
  - source_id: provost1993weakening
    locator: Formal problem description, PDF p.2 / printed p.750; When IW is not a Good Policy and Conclusions,
      PDF pp.6–7 / printed pp.754–755
    relation: supports
