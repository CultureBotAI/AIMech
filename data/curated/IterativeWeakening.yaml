aio_no_match:
  search_scope: Compared all 442 pinned AIO and 645 native IDs, names, aliases and scoped synonyms; no
    normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
    discovery and original Documents checkouts returned 481, 244, 242 lines. All distinct match contents
    were inspected. Semantic matching covered 72 AIO and 130 native definitions, with every matched definition
    read. 11 full annotated AIO node/edge/generated contexts and 5 full native records were inspected.
    Retain the general policy for ordering a fixed family of search biases by known evaluation complexity.
    Iterative deepening and broadening are examples along particular dimensions, whereas empirical grid
    selection, iterated configuration search and statistical racing use different objectives and feedback.
    Search bias here means an allowed-space restriction, not a social or statistical bias phenomenon.
  rationale: No suitable AIO counterpart for this general complexity-ordered search-bias policy was established.
    A deliberate search-space restriction is distinct from the pinned bias phenomena, and optional learning
    applications do not identify a necessary learning task.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: A general tree-search policy need not be a learned graph language model.
  - target: AIO:ReasoningLLM
    rejection_reason: Search ordering does not identify a language-model reasoning architecture.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: No neural-symbolic language-model architecture is required.
  - target: AIO:MachineLearningTask
    rejection_reason: The method searches a specified tree and need not learn from data.
  - target: AIO:MathematicalFunction
    rejection_reason: Cost and heuristic functions may be evaluated, but the maintained identity is the
      repeated traversal policy.
  - target: AIO:ReinforcementLearning
    rejection_reason: The search policy does not require reward-based policy learning or the learning-task
      identity.
  - target: AIO:DecisionTree
    rejection_reason: The pinned classification task is not a traversal of an implicit search tree.
  - target: AIO:ComputationalBias
    rejection_reason: A deliberate restriction of a search space is not the computational-bias phenomenon
      denoted by the pinned class.
  - target: AIO:ModelSelectionBias
    rejection_reason: The policy orders restrictions by evaluation complexity; this is not the statistical
      bias caused by choosing a model from observed data.
  - target: AIO:TrainingStrategy
    rejection_reason: The method selects restrictions for arbitrary searches. Learning applications do
      not make training or preprocessing a necessary component.
  - target: AIO:MetaLearning
    rejection_reason: No learned prior from metadata about machine-learning experiments is required by
      the fixed complexity-order policy.
limitations:
- Search bias here denotes an admissible-space restriction, not a statistical or societal-bias identity.
- The policy requires an available ordering of trial evaluation costs and eventual evaluation of a sufficient
  bias with terminating lower-level searches.
- Asymptotic comparisons depend on cost growth, state multiplicity and additional sufficiency knowledge;
  they are not guarantees of minimum solution-path cost or statistical generalization.
- Printed big-O, ordered-factor and integer-logarithmic scheduling statements retain the explicit qualifications.
  Constructed calculations are separate curator reasoning, not author software.
- All seven official conference pages were visually inspected. Separate extended treatment, author implementation
  and empirical replication remain uninspected.
