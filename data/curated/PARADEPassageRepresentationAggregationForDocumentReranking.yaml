id: AIMech:PARADEPassageRepresentationAggregationForDocumentReranking
name: 'PARADE: Passage Representation Aggregation for Document Reranking'
concept_kind: architecture
review_status: DRAFT
definition: A neural document reranking architecture (Li, Yates, MacAvaney, He, & Sun, 2021) that segments a long document D into overlapping passages P_1, ..., P_n, encodes each query-passage pair with a pretrained Transformer (such as BERT or ELECTRA) into passage-level [CLS] relevance representations p_i^cls = PLM(q, P_i) in R^d, and aggregates D^cls = {p_1^cls, ..., p_n^cls} directly into a single dense document representation d^cls in R^d via element-wise max pooling (PARADE-Max), softmax attention weighting (PARADE-Attn), stacked stride-2 convolutional layers (PARADE-CNN), or a hierarchical Transformer encoder over [emb^cls, p_1^cls, ..., p_n^cls] (PARADE-Transformer) before computing the final document relevance score rel(q, D) = W_d d^cls.
identity_notes: Distinct from passage score aggregation methods such as BERT-MaxP and Birch (which collapse each passage representation p_i^cls into a scalar relevance score s_i before pooling across passages) and from CEDR (which averages token/CLS similarity matrices into kernel-pooling neural rankers). PARADE aggregates the high-dimensional passage [CLS] representation vectors themselves via hierarchical Transformer or CNN layers and supports logit-level MSE knowledge distillation L = alpha * L_CE + (1 - alpha) * ||z^t - z^s||^2 into compact student backbones.
aliases:
- PARADE Document Reranking Architecture
- Passage Representation Aggregation for Document Reranking
- PARADE-Transformer Document Reranker
