claims:
- claim_id: parade-hierarchical-representation-aggregation-mechanism
  kind: mechanism
  statement: Given passage relevance representations D^cls = {p_1^cls, ..., p_n^cls} extracted from sliding windows (e.g., 225 tokens with stride 200), PARADE summarizes D^cls into a document representation d^cls in R^d via element-wise max pooling d^cls[j] = max_i p_i^cls[j] (PARADE-Max), learned softmax attention weights w_i = softmax(W p_i^cls) (PARADE-Attn), 4 layers of stride-2 1D convolutions (PARADE-CNN), or a hierarchical Transformer encoder over x^0 = (emb^cls, p_1^cls, ..., p_n^cls) (PARADE-Transformer) followed by linear projection rel(q, D) = W_d d^cls, and supports output-logit knowledge distillation L = alpha * L_CE + (1 - alpha) * ||z^t - z^s||^2.
  evidence:
  - source_id: r785-primary-pdf
    locator: Section 3.3-3.4, Equations (2)-(7), pp. 3-4; Section 5.2, Equation (8), p. 8
    relation: supports
  - source_id: r785-primary-pdf
    locator: vec_max_pool, vec_attn_pool, parade_transformer_cls, and distillation_loss verification
    relation: supports
- claim_id: parade-broad-vs-single-passage-scope
  kind: scope
  statement: Hierarchical passage representation aggregation (PARADE-Transformer and PARADE-CNN) significantly outperforms passage score aggregation baselines on collections with broad information needs where relevance signals are distributed across multiple passages (such as TREC Robust04, GOV2, and NTCIR WWW-3), whereas simpler PARADE-Max aggregation is sufficient on collections exhibiting 'maximum passage bias' where queries are answered by 1-2 passages (such as TREC DL and TREC Genomics).
  evidence:
  - source_id: r785-primary-pdf
    locator: Section 4.5-4.6, Tables 2-5, pp. 5-7; Section 5.4, Table 9, pp. 9-10
    relation: supports
- claim_id: parade-multi-passage-gpu-memory-limitation
  kind: limitation
  statement: Because PARADE encodes up to n passages per document simultaneously for end-to-end training and reranking, computational and memory costs scale linearly with the number of preserved passages n, requiring passage truncation/sampling or knowledge distillation into smaller student backbones (such as BERT-Small or BERT-Mini) for low-latency deployment.
  evidence:
  - source_id: r785-primary-pdf
    locator: Section 3.5, p. 4; Section 4.3, p. 5; Section 5.2-5.3, Tables 7-8, pp. 7-9
    relation: supports
