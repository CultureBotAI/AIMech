claims:
- claim_id: promptfl-frozen-clip-continuous-prompt-cosine-alignment-and-aggregation-mechanism
  kind: mechanism
  statement: In PromptFL (Figure 1, Eq. 1, p. 3; Eq. 2, p. 6), each client keeps both the CLIP image encoder g(.) and text encoder h(.) frozen and optimizes only p continuous d-dimensional prompt vectors P (d = 512 by default) prepended to class-name word embeddings K_i via the softmax cosine-similarity likelihood p(y = i | x) = exp(cos[g(x) | h(P, K_i)]) / sum_{j=1}^k exp(cos[g(x) | h(P, K_j)]), uploading only the input-agnostic prompt updates to the federated server for global averaging.
  evidence:
  - source_id: r509-primary-pdf
    locator: Framework to Learn Prompts in FL & Prompt Learner, Fig. 1, Eq. (1), p. 3; CLIP PromptFL, Eq. (2), pp. 5-6
    relation: supports
- claim_id: promptfl-parameter-and-communication-reduction-under-extreme-non-iid-scope
  kind: scope
  statement: Across ResNet50 (38.3M parameters) and ViT-B/16 (86.6M parameters) CLIP backbones, PromptFL tunes only 0.1% and 0.01% of parameters respectively (6.3 MB uploaded per round vs 191 MB and 693.3 MB for full fine-tuning FL, a reduction of up to 110x per round and ~3x lower GPU training time per 50 epochs), while maintaining 66.3%--94.12% test accuracy under extreme non-IID (0% class overlap across clients) where full-model Finetuning FL collapses to 22.92%--29.89% (Table 2, p. 5; Figures 2 and 4, pp. 6-7).
  evidence:
  - source_id: r509-primary-pdf
    locator: Table 1, p. 4; Table 2, p. 5; Figure 2, p. 6; Figure 4 & Computation and Communication Cost Analysis, p. 7
    relation: supports
- claim_id: promptfl-backbone-ram-footprint-and-inference-flop-overhead-limitation
  kind: limitation
  statement: Although PromptFL reduces trainable parameters to 0.01%--0.1%, each client must still store and run forward/backward passes through the frozen pre-trained CLIP backbone (requiring ~600 MB disk storage, 60 GFLOPs inference, and 5.95--9.04 GB GPU memory during training unless offloaded to an inference API; Table 1, p. 4; Figure 4, p. 7).
  evidence:
  - source_id: r509-primary-pdf
    locator: System Feasibility, Table 1, p. 4; Figure 4 GPU Memory Usage, p. 7
    relation: supports
- claim_id: promptfl-few-shot-federated-visual-recognition-application
  kind: application
  statement: Applied to few-shot (2, 4, 8, and 16 shots) and non-IID federated visual recognition on Caltech101, Flowers102, OxfordPets, and Food101 using ResNet50 and ViT-B/16 CLIP foundation models.
  evidence:
  - source_id: r509-primary-pdf
    locator: Experiments, Table 2, Figures 2-4, pp. 5-7
    relation: supports
