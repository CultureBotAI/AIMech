id: AIMech:PromptFlFederatedPromptLearningForFoundationModels
name: 'PromptFL: Federated Continuous Prompt Learning for Foundation Models'
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient federated foundation-model adaptation framework (PromptFL; Guo, Guo, Wang, Tang, and Xu, IEEE Transactions on Mobile Computing 2024) that ships an off-the-shelf pre-trained vision-language foundation model F (such as CLIP with frozen image encoder g(.) and frozen text encoder h(.)) to distributed clients and replaces federated model weight training with collaborative continuous prompt (soft prompt) training. Each client attaches a Prompt Learner consisting of p learnable d-dimensional continuous prompt vectors P in R^{p x d} prepended to each class label embedding K_i (i in {1, ..., k}) to form text features w_i = h(P, K_i) and class probabilities p(y = i | x) = exp(cos[g(x) | h(P, K_i)]) / sum_{j=1}^k exp(cos[g(x) | h(P, K_j)]) (Eq. 1); during local training and server aggregation, gradients are backpropagated and aggregated exclusively with respect to the input-agnostic prompt parameters P (max_{f_prompt} p_{F; f_prompt}(y + v_f | x), Eq. 2), updating only 0.01%--0.1% of the total model parameters.
identity_notes: Distinct from full-model Federated Averaging (AIMech:FederatedAveraging; McMahan et al., 2017), which updates and communicates 100% of the neural network weights across clients and server. Distinct from centralized vision-language prompt tuning (CoOp; Zhou et al., 2022) and NLP continuous prefix/prompt tuning (Li & Liang, 2021; Lester et al., 2021), which optimize continuous prompts on a single centralized dataset rather than aggregating input-agnostic soft prompt updates across distributed non-IID clients or API-queried frozen backbones. Distinct from federated low-rank weight adapters such as FFA-LoRA (AIMech:FfaLoraFederatedFreezeALowRankAdaptation; Sun et al., ICLR 2024) and FLoRA (AIMech:FloraStackingBasedFederatedHeterogeneousLowRankAdaptation; Wang et al., NeurIPS 2024), which inject low-rank matrix increments into internal linear layers rather than prepending continuous prompt vectors to the text encoder input space.
aliases:
- PromptFL
- Federated Prompt Training for Foundation Models
- CLIP PromptFL
