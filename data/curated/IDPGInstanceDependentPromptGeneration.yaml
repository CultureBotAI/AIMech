claims:
- claim_id: idpg-bottleneck-prompt-generator-and-static-degeneracy
  kind: mechanism
  statement: Given a sentence representation M(x_i) in R^d of input x_i, IDPG generates a t-token continuous prompt W_p(T, x_i) = G(M(x_i), T) via a two-layer bottleneck generator with hidden size m << d requiring m(d+1) + t d(m+1) parameters before compression, and strictly generalizes task-specific prompt tuning since setting the projection weights W to zero leaves the second-layer bias term t x d as a static task-specific prompt.
  evidence:
  - source_id: r711-primary-pdf
    locator: Section 1 & Section 3.1, Equations (1)-(3), pp. 2-3
    relation: supports
- claim_id: idpg-phm-kronecker-decomposition-and-multilayer-sharing
  kind: mechanism
  statement: Replacing the dense generator matrices W_1 in R^{m x d} and W_2 in R^{(t d) x m} with Parameterized Hypercomplex Multiplication (PHM) layers W = sum_{i=1}^n A_i otimes B_i (with A_i in R^{n x n} shared across layers) reduces single-layer generator parameters from 1.5M (S-IDPG-DNN) to 105K (S-IDPG-PHM) for d=1024, m=256, t=5, n=16, while multi-layer M-IDPG-PHM shares W across N=24 layers with layer-specific biases in 134K trainable parameters (0.04% of RoBERTa-Large).
  evidence:
  - source_id: r711-primary-pdf
    locator: Section 3.2.1-3.2.2, Equation (4), Table 2 & Appendix A.1.2, pp. 4, 6, 11-12
    relation: supports
- claim_id: idpg-nlu-and-few-shot-benchmark-performance
  kind: application
  statement: Across ten NLU benchmarks (MPQA, Subj, CR, MR, SST-2, QNLI, RTE, MRPC, STS-B, QQP) on RoBERTa-Large, M-IDPG-PHM achieves 91.9 average score with 134K trainable parameters, outperforming standard prompt tuning (88.8) by +3.1 points and P-tuning v2 (90.3) by +1.6 points, and in few-shot settings (K in {100, 500, 1000}) outperforms prompt tuning by +2.5, +2.1, and +2.0 points respectively.
  evidence:
  - source_id: r711-primary-pdf
    locator: Section 4.2-4.4, Tables 1-3, pp. 5-7
    relation: supports
  - source_id: r711-metadata-cr
    locator: NAACL 2022 bibliographic record
    relation: supports
- claim_id: idpg-two-forward-pass-and-low-resource-variance-limitation
  kind: limitation
  statement: When using the pre-trained language model itself to compute M(x_i), IDPG requires two forward passes at inference time unless M(x_i) is cached or replaced by lightweight GloVe embeddings (M-IDPG-PHM-GloVe), and exhibits elevated initialization variance in extreme low-resource regimes (e.g., standard deviation 4.6 on MPQA at K=100).
  evidence:
  - source_id: r711-primary-pdf
    locator: Section 3.1, Section 4.4 & Section 4.5.1, pp. 3-4, 6-7
    relation: supports
