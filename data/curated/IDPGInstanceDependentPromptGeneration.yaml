id: AIMech:IDPGInstanceDependentPromptGeneration
name: Instance-Dependent Prompt Generation
concept_kind: algorithm
review_status: DRAFT
definition: A conditional parameter-efficient prompt-tuning method for pre-trained language models that generates continuous soft prompts W_p(T, x_i) = G(M(x_i), T) in R^{t x d} conditioned on each input sequence representation M(x_i) in R^d using a lightweight two-layer bottleneck perceptron G whose down-projection W_1 in R^{m x d} and up-projection W_2 in R^{(t d) x m} are decomposed via Parameterized Hypercomplex Multiplication (PHM) Kronecker sums W = sum_{j=1}^n A_j otimes B_j, with multi-layer variant M-IDPG sharing W across all Transformer layers while maintaining layer-specific bias prompts.
identity_notes: Introduced by Zhuofeng Wu, Sinong Wang, Jiatao Gu, Rui Hou, Yuxiao Dong, V. G. Vinod Vydiswaran, and Hao Ma (NAACL 2022, arXiv:2204.04497) as Instance-Dependent Prompt Generation (IDPG / S-IDPG-PHM / M-IDPG-PHM). Distinct from static Prompt Tuning and SPoT (AIMech:SPoTSoftPromptTransfer), which use a fixed input-independent prompt per task (recovered as the degenerate case W = 0 in IDPG where only the second-layer bias is active); from ATTEMPT (AIMech:ATTEMPTAttentionalMixturesOfSoftPrompts), which interpolates pre-trained source-task prompts via sub-query attention rather than generating prompts through a PHM bottleneck MLP; and from Hyperdecoder (AIMech:HyperdecoderInstanceSpecificDecoderAdapter), which generates decoder adapter weights from encoder hidden states rather than layer-wise soft prompt tokens.
aliases:
- IDPG
- M-IDPG-PHM
- S-IDPG-PHM
- Multi-Layer Instance-Dependent Prompt Generation
