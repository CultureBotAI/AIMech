name: Replicated Softmax
definition: An undirected document model with binary hidden units and a length-dependent set of categorical
  word units that share visible-to-hidden weights, with hidden biases scaled by document length.
concept_kind: architecture
identity_notes: 'This is the original Replicated Softmax model of Salakhutdinov and Hinton. It specializes
  a restricted Boltzmann machine to word-count sufficient statistics across documents of different lengths.
  It is distinct from repeatedly applying the ordinary softmax function, from the expected-count Constrained
  Poisson update discussed in the paper, and from the directed deterministic-feature Document NADE architecture.
  All 442 pinned AIO labels/scoped synonyms and 352 preceding native IDs/names/aliases were compared,
  with no normalized identity match. Both full-checkout searches included ignored and hidden files; worktree
  returned 15 lines and main 19. All 16 unique matched contents were read: DocNADE contrasts, frontier and
  review references, plus four ignored-environment Sage/Pygments entries unrelated to AI SAGE. Twenty-one
  exact AIO nodes and four complete native neighbors were inspected. Absence is bounded to this snapshot
  and semantic neighborhood.'
limitations:
- Tractable hidden posteriors do not make the partition function or equilibrium model expectation tractable.
  Finite-step contrastive-divergence updates are not exact maximum-likelihood gradients; deterministic
  expected counts are not the same as multinomial Gibbs sampling.
- The model is conditional on document length and supplies no document-length distribution. Its hidden
  feature vector has independent conditional Bernoulli coordinates, not topic proportions constrained
  to sum to one.
- For ordinary counting measure on K^D ordered word assignments and F binary hidden units, the zero-weight,
  zero-bias partition is K^D times 2^F. The AIS discussion’s printed Z_0=2^F needs a corresponding normalized
  base-measure convention or visible-state factor; it is not adopted unchanged as that counting-measure
  partition. This is a mathematical qualification of the displayed derivation, not a claim about author-code
  behavior.
- No convergence, topic quality or benchmark advantage is asserted. The later experimental pages and author
  software were not audited.
