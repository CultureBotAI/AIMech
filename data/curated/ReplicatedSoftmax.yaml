claims:
- claim_id: method
  kind: mechanism
  statement: For a document with D word positions, vocabulary counts n_k and binary hidden states h_j,
    use energy E(V,h)=-sum_jk W_jk h_j n_k-sum_k b_k n_k-D sum_j a_j h_j. The joint probability is proportional
    to exp(-E) with a partition function for that length. Hidden units are conditionally independent given
    words, with P(h_j=1|V)=sigmoid(D a_j+sum_k W_jk n_k). Given h, positions independently draw words
    from softmax(b_k+sum_j W_jk h_j); equivalently, sample D word counts from the corresponding multinomial.
    Parameter sharing makes the ordered-word probability permutation invariant. A count-vector probability
    includes the number of distinct ordered realizations. Learning contrasts data and model sufficient
    statistics; the paper approximates the model term with finite alternating Gibbs steps initialized
    at data.
