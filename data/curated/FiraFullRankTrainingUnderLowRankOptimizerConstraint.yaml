  rationale: Fira is a memory-efficient full-rank optimization algorithm for pre-training and fine-tuning deep neural network and Transformer language models.
- target: AIO:DimensionalityReduction
  relation: related_match
  rationale: Fira uses periodic truncated SVD subspace projection P_t in R^{m x r} to compress optimizer states into a low-rank subspace while reconstructing full-rank updates.
limitations:
- Requires materializing full-rank weight gradients (mn) before projection and orthogonal-complement scaling.
- Incurs a modest throughput reduction compared to GaLore and LoRA due to column-wise norm computation and norm-growth limiting.
- Empirically validated primarily on autoregressive Transformer language models rather than diffusion or multimodal architectures.
