id: AIMech:FiraFullRankTrainingUnderLowRankOptimizerConstraint
name: Fira (Full-Rank Training under Low-Rank Optimizer Constraint)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient full-rank neural network optimization framework that maintains adaptive optimizer states strictly within a low-rank gradient subspace while preserving full-rank weight updates by rescaling the orthogonal-complement residual gradient using the low-rank optimizer's matrix- or column-level gradient-norm scaling factor and smoothing abrupt gradient surges via a relative norm-growth limiter.
identity_notes: Distinct from GaLore (AIMech:GaLoreGradientLowRankProjection), which projects the full-rank gradient G_t into a rank-r subspace R_t = P_t^T G_t and completely discards the orthogonal residual (I - P_t P_t^T) G_t = G_t - P_t R_t; Fira retains the same low-rank optimizer states (mr + 2nr + 1 floats per m x n matrix) but scales and adds back G_t - P_t R_t using the low-rank adaptive scaling factor phi_t(R_t) = ||psi_t(R_t)|| / ||R_t|| alongside a multiplicative norm-growth limiter gamma.
aliases:
- Fira
- Fira Optimizer Framework
- Full-Rank Training under Low-Rank Constraint via Norm-Based Scaling
- Fira Norm-Based Scaling and Norm-Growth Limiter
