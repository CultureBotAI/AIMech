claims:
- claim_id: fira-norm-based-scaling-orthogonal-complement-mechanism
  kind: mechanism
  statement: Given full-rank gradient G_t in R^{m x n} (m <= n) and rank-r SVD projection matrix P_t in R^{m x r} updated every T steps, Fira computes the low-rank projected gradient R_t = P_t^T G_t in R^{r x n} and its adaptive optimizer correction psi_t(R_t) using low-rank states M_t, V_t in R^{r x n}, defines the matrix-level scaling factor phi_t(R_t) = ||psi_t(R_t)|| / ||R_t|| (or column-wise factors phi_t(R_t)_i = ||psi_t(R_{t,:,i})|| / (||R_{t,:,i}|| + epsilon) for i = 1, ..., n), and rescales the orthogonal residual gradient S_t = phi_t(R_t) * (G_t - P_t R_t) so the parameter update W_{t+1} = W_t - eta * (P_t psi_t(R_t) + S_t) preserves full-rank gradient information with only mr + 2nr + 1 optimizer states.
  evidence:
  - source_id: r636-primary-pdf
    locator: Section 4.1 Equations (9)-(11), Section 4.3 Table 2, and Appendix A.1 Algorithm 1, pages 5-7, 14
    relation: supports
- claim_id: fira-norm-growth-limiter-mechanism
  kind: mechanism
  statement: 'To prevent training loss spikes triggered by periodic projection-subspace switching (t mod T = 0) and steep curvature along unsmoothed residual directions, Fira applies a relative norm-growth limiter to the scaled residual gradient S_t = phi_t(R_t)(G_t - P_t R_t): whenever ||S_t|| / ||S_{t-1}|| > gamma (default gamma = 1.01), S_t is rescaled to (S_t / ||S_t||) * gamma * ||S_{t-1}||, converting abrupt gradient norm jumps into bounded geometric growth while preserving direction.'
  evidence:
  - source_id: r636-primary-pdf
    locator: Section 4.2 Equation (12), Figure 3, and Appendix A.1 Algorithm 1, pages 6-7, 14
    relation: supports
- claim_id: fira-scaling-approximation-error-and-variance-scope
  kind: scope
  statement: Under bounded component-wise adaptive scaling c_min <= |psi_i(g_i)/g_i| <= c_max, Theorem 1 proves that the squared scaling-factor approximation error satisfies kappa(r) = |phi_t^2(G_t) - phi_t^2(R_t)| <= (c_max^2 - c_min^2) * (1 - ||G_r||^2 / ||G||^2), and Theorem 2 proves under early-stage Gaussian gradients and inverse-chi-squared second moments (rho > 4) that Dirichlet(1/2, ..., 1/2) weighting yields Var[phi^2] = (3 / (n + 2)) * Var[psi^2] <= Var[psi^2].
  evidence:
  - source_id: r636-primary-pdf
    locator: Appendix E.1 Theorem 1 Equations (13)-(26) and Appendix E.2 Theorem 2 Equations (27)-(45), pages 18-22
    relation: supports
- claim_id: fira-llm-pretraining-and-finetuning-application
  kind: application
  statement: In C4 pre-training of LLaMA-60M/130M/350M/1B/7B and commonsense-reasoning fine-tuning of LLaMA-7B (BoolQ, PIQA, SIQA, HellaSwag, WinoGrande, ARC-e, ARC-c, OBQA), Fira reduces optimizer-state memory by 61.1% on LLaMA-1B and uses 8x smaller optimizer state memory (rank 64 vs 512) on LLaMA-7B while achieving lower validation perplexity and higher average accuracy (76.9% vs 62.7% for GaLore and 74.7% for LoRA).
  evidence:
  - source_id: r636-primary-pdf
    locator: Section 5.1-5.3 Tables 3-4 and Figure 4, pages 7-9
    relation: supports
- claim_id: fira-full-gradient-materialization-and-domain-scope-limitation
  kind: limitation
  statement: Unlike LoRA, which stores only low-rank adapter gradients (mr + nr), Fira computes full-rank weight gradients (mn) during backpropagation and incurs a slight throughput overhead relative to GaLore and LoRA from column-wise norm-based scaling and norm-growth limiting.
  evidence:
  - source_id: r636-primary-pdf
    locator: Section 4.3 Table 2 page 7, Appendix C.2 Tables 8-9 pages 15-16, and Appendix L Limitations page 26
    relation: supports
