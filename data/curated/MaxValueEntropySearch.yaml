aio_mappings:
- target: AIO:ActiveLearning
  relation: related_match
  rationale: The pinned class describes interactive querying of an information source for outputs. MES
    chooses expensive objective evaluations for information about a latent maximum. This relation records
    a query-learning association, without identifying the algorithm with annotation or pool-based classification,
    asserting subclass membership, or inheriting a neural architecture.
limitations:
- This record covers the original Equation 6 acquisition and its MES-G/MES-R sampling options. It does
  not identify every maximum-value information method, or add-MES, constrained PES and parallel PES, with
  this algorithm. The paper’s PDF p. 2 credits output-space predictive entropy search with the same ideal
  information objective while distinguishing its operational approximation; that earlier method is not
  assigned as an exact alias here.
- The local-truncation and observation-noise qualifications are part of the mechanism’s scope. The printed
  use of p(y|D,x) with latent variance and y<m is not silently repaired into a different noisy acquisition.
  Degenerate posterior variances, extreme Gaussian tails, finite-sample ties and numerical maximization
  require explicit implementation choices.
- A finite-domain approximation is not automatically an upper bound on a continuous-domain maximum. The
  source’s covering argument uses an epsilon-cover and a valid Lipschitz constant to add epsilon times
  that constant. Neither such a bound nor posterior nonnegative covariance is guaranteed merely by choosing
  an arbitrary grid or a familiar covariance kernel. Gumbel inversion requires 0<r<1 and a positive scale
  for finite real outputs; degenerate fitted quantiles need handling.
- The general regret theorem was not independently established by this record’s curator calculations.
  Integer sampling-block lengths, confidence terms at selected iteration times versus the final displayed
  index, and extensions to adaptive maximum distributions require a separate proof audit. No repaired
  theorem, universal regret rate or finite-budget global-optimum certificate is asserted.
- The additive extension is outside this identity. Independent component priors generally become dependent
  after summed observations; separate component acquisitions are not automatically the joint information
  of the actual summed noisy evaluation. This contextual boundary does not establish that the additive
  heuristic lacks practical utility.
- The original curator calculator evaluates 201 scalar scores and seven constructed boundary categories.
  Rational probability and covariance arithmetic is exact; Gaussian/Gumbel functions and entropy use floating
  arithmetic with explicit absolute tolerances. Its corrected CDF crossing witness and preserved initial
  failed assertion are research provenance, not a source-code repair. No Gaussian-process fitting, feature
  sampling, acquisition optimization, author implementation or benchmark was executed. These checks establish
  no general accuracy or runtime advantage over ES or PES.
