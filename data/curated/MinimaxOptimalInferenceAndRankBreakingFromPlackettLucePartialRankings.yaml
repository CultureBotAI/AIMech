claims:
- claim_id: claim-van-trees-gumbel-utility-oracle-minimax-lower-bound
  kind: mechanism
  statement: "Under the Plackett\u2013Luce random utility representation $U_i = \\theta_i^* + Z_i$ with standard Gumbel density $f(z) = e^{-(z+e^{-z})}$ having Fisher information $I(f) = \\int (f'(z))^2/f(z)\\,dz = 1$, revealing the continuous utilities $\\{U_i\\}_{i\\in S_j}$ strictly dominates observing only their induced ranking $\\sigma_j$, and applying the van Trees inequality with prior density $\\mu_0(t) = (1+\\cos(\\pi t))/2$ ($I(\\mu_0) = \\pi^2$) on $\\Theta_b$ proves $\\inf_{\\hat{\\theta}}\\sup_{\\theta^*\\in\\Theta_b}\\mathbb{E}[\\|\\hat{\\theta}-\\theta^*\\|_2^2] \\ge \\frac{(n-1)^2}{2\\sum_{j=1}^m k_j + 2n\\pi^2/b^2}$, while the exact Plackett\u2013Luce Fisher information matrix at $\\theta^* = 0$ satisfies $I(0) = \\sum_{j=1}^m (1 - \\frac{1}{k_j}\\sum_{\\ell=1}^{k_j}\\frac{1}{\\ell}) L_j$ (Section 2, Theorem 1, Corollary 1, Remark 1, Proof of Theorem 1 & Claim 3)."
  evidence:
  - source_id: hox2014-plrank-pdf
    locator: Section 2 (Theorem 1, Corollary 1, Remark 1, pp. 3-4), Section 4.1 (Proof of Theorem 1 & Claim 3, pp. 6-10)
    relation: supports
- claim_id: claim-plackett-luce-mle-hypergraph-laplacian-curvature-and-upper-bound
  kind: mechanism
  statement: "For any $\\theta \\in \\Theta_b$, Claim 1 and Lemma 2 prove that each $k_j$-way Plackett\u2013Luce log-likelihood Hessian block dominates the scaled clique Laplacian with $\\lambda_2(H(\\theta)) \\ge \\frac{1}{2e^{4b}}\\lambda_2(L)$ where $L = \\sum_{j=1}^m \\frac{1}{k_j}\\sum_{i<i'\\in S_j}(e_i-e_{i'})(e_i-e_{i'})^\\top$, while martingale score differences satisfy $\\|\\nabla\\mathcal{L}_{\\mathrm{PL}}(\\theta^*)\\|_2 \\le \\sqrt{6 m k_{\\mathrm{ave}}\\log n} + \\frac{2\\sqrt{n}}{\\sqrt{k_{\\min}}}\\log n$ (Lemma 1), yielding $\\frac{1}{\\sqrt{n}}\\|\\hat{\\theta}_{\\mathrm{ML}} - \\theta^*\\|_2 \\le C e^{4b}\\sqrt{\\frac{\\log n + (k_{\\max}/k_{\\min})\\log^2 n}{m k_{\\mathrm{ave}}}}$ when $m k_{\\mathrm{ave}} \\ge c(n\\log n + k_{\\max}^2\\log n)$ (Section 2, Theorem 2, Corollary 1, Section 4.2, Lemmas 1\u20133, Claim 1)."
  evidence:
  - source_id: hox2014-plrank-pdf
    locator: Section 2 (Theorem 2, Corollary 1, p. 4), Section 4.2 (Lemmas 1-3, Claim 1, pp. 10-19)
    relation: supports
- claim_id: claim-full-rank-breaking-weighted-composite-likelihood-minimax-optimality
  kind: application
  statement: "Whereas Independence-Preserving Breaking (Definition 4, Theorem 3) can extract at most $\\lfloor k_j/2\\rfloor$ independent pairs per $k_j$-ranking, Full Breaking (Definition 5, Equation 2) includes all $\\binom{k_j}{2}$ pairs weighted by $1/(k_j-1)$ in $\\mathcal{L}_{\\mathrm{FB}}(\\theta) = \\sum_{j=1}^m \\frac{1}{k_j-1}\\sum_{(i,i')\\in\\sigma_j}\\log\\frac{e^{\\theta_i}}{e^{\\theta_i}+e^{\\theta_{i'}}}$; using the Efron\u2013Stein inequality to bound the dependent gradient norm $\\|\\nabla\\mathcal{L}_{\\mathrm{FB}}(\\theta^*)\\|_2 \\le 4\\sqrt{m k_{\\mathrm{ave}}\\log n}$ (Lemma 4) and Hessian curvature $\\lambda_2(H_{\\mathrm{FB}}(\\theta)) \\ge \\frac{e^{2b}}{(1+e^{2b})^2}\\lambda_2(L)$ (Lemma 5), Theorem 4 and Corollary 2 prove that $\\hat{\\theta}_{\\mathrm{FB}}$ achieves the minimax-optimal $O(\\sqrt{n\\log n / (m k_{\\mathrm{ave}})})$ error rate (Section 3, Theorems 3\u20134, Corollary 2, Section 4.4, Lemmas 4\u20135)."
  evidence:
  - source_id: hox2014-plrank-pdf
    locator: Section 3 (Definitions 4-5, Eq. 2, Theorems 3-4, Corollary 2, pp. 5-6), Section 4.4 (Lemmas 4-5, pp. 21-24)
    relation: supports
