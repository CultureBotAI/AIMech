claims:
- claim_id: krona-kronecker-rank-multiplication-and-fast-matvec
  kind: mechanism
  statement: KronA parameterizes a linear transformation of dimension (a_1 b_1) x (a_2 b_2) as the Kronecker product W_K = A kron B of two factor matrices A in R^{a_1 x a_2} and B in R^{b_1 x b_2} using only a_1 a_2 + b_1 b_2 trainable parameters while achieving multiplicative rank(A kron B) = rank(A) rank(B), and evaluates (A kron B) x for x in R^{a_2 b_2} via the reshape identity vec(B X A^T) where X = reshape(x, (b_2, a_2)) without materializing the (a_1 b_1) x (a_2 b_2) Kronecker matrix.
  evidence:
  - source_id: r679-primary-pdf
    locator: Section 3.1 Kronecker Product & Eq. 5, p. 3
    relation: supports
- claim_id: krona-sequential-and-parallel-residual-variants
  kind: mechanism
  statement: KronA defines both a sequential adapter module instilled after feed-forward layers and a parallel residual module KronA_B (and rescaled KronA_B^resB) placed alongside pretrained linear layers that updates the output as y = W_0 x + s (A kron B) x, allowing the Kronecker product s (A kron B) to be merged directly into W_0 at inference time with zero additional latency.
  evidence:
  - source_id: r679-primary-pdf
    locator: Section 3.2 Kronecker Adapter (KronA), Eq. 6-7 and Figure 1, p. 3-4
    relation: supports
- claim_id: krona-glue-language-model-adaptation
  kind: application
  statement: KronA is applied to parameter-efficient fine-tuning of pretrained T5-base encoders and decoders on the GLUE natural language understanding benchmark, matching or exceeding the accuracy of LoRA, Adapter, and Compacter while using 0.07% of total model parameters and achieving faster inference throughput than PHM-based Compacter modules.
  evidence:
  - source_id: r679-primary-pdf
    locator: Section 4 Experiments, Tables 2-3, p. 4-6
    relation: supports
- claim_id: krona-factor-dimension-divisibility-constraint
  kind: limitation
  statement: KronA requires the input and output dimensions d_in and d_out of the adapted module to factorize into integer pairs d_out = a_1 b_1 and d_in = a_2 b_2, constraining the available parameter budgets to discrete divisor pairs of the layer dimensions.
  evidence:
  - source_id: r679-primary-pdf
    locator: Section 3.2 & Section 4.2 Hyperparameter Sensitivity (Factor Sizes), Table 5, p. 3-4, 6
    relation: supports
