id: AIMech:KronA
name: KronA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning adapter that replaces low-rank bottleneck projections with a Kronecker product of two smaller factor matrices A in R^{a_1 x a_2} and B in R^{b_1 x b_2}, computing the transformed activation via reshaped matrix-matrix multiplications without explicitly materializing the full Kronecker product matrix.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which parameterizes weight updates as a low-rank outer matrix product B A bounded by rank r), from Compacter (AIMech:Compacter, which uses parameterized hypercomplex multiplication sums of n Kronecker products with shared slow weights and rank-1 fast weights inside a nonlinear bottleneck adapter), and from LoKr (AIMech:LoKr, which further decomposes the second Kronecker factor into a low-rank product u_2 v_2^T inside the LyCORIS framework rather than KronA's two dense Kronecker factors A kron B deployed as sequential or parallel residual adapters with optional input-Output scaling). Formulated by Edalati et al. (arXiv:2212.10650).
aliases:
- Kronecker Adapter
- KronA Parameter-Efficient Kronecker Tuning
- Kronecker Product Adapter (KronA)
