claims:
- claim_id: method
  kind: mechanism
  statement: Feed the mean source encoder hidden state to a two-layer multilayer perceptron to predict
    a target/source generation ratio, then multiply it by the source length to obtain Lpred(x). Score
    candidate y by S(x,y)+r·min(|y|,Lpred(x)), where S is cumulative log probability. The predictor is
    evaluated from the input and the reward cap is fixed for that input during decoding.
  evidence:
  - source_id: method-source
    locator: Sections 4.2–4.2.1, Equations (8)–(9), printed p. 3056 / PDF p. 3
    relation: supports
