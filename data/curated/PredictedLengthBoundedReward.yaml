name: Bounded word reward with predicted length
definition: A sequence rescoring method that adds a fixed word reward only up to an input-specific length
  predicted from encoder states, replacing a corpus-level generation-ratio cap with Lpred(x).
concept_kind: mathematical_method
identity_notes: This is Yang et al.’s predicted-length bounded word-reward variant. It changes the cap,
  while retaining a separately tuned reward rate r. It is not the beam-statistic adaptive reward or the
  brevity-penalty normalized score, and it is not a standalone trained length-predictor instance. No normalized
  identity match was found across the 442 AIO and 146 prior native records; both checkout text searches
  included ignored and hidden files and returned no matches for the selected exact IDs, full labels, aliases
  and source titles.
limitations:
- The method still requires a learned length predictor and a tuned reward rate; replacing the corpus ratio
  does not make the complete system parameter-free.
- Predicted length is a reward cap, not automatically an enforced maximum sequence length or an accurate
  target for every input.
- A usable nonnegative length prediction, tokenizer conventions and integration with the decoder must
  be specified. The paper passage does not provide a complete predictor training or calibration protocol.
- Finite beam width still prunes hypotheses. Neither accurate length prediction nor a stopping certificate
  implies globally optimal output or universally better translation quality.
- The empirical source scope is Chinese-to-English news translation; no numerical result is curated.
