id: AIMech:LeftTruncatedCauchyCombinationTest
name: Left-truncated Cauchy combination test
aliases:
- Truncated Cauchy Combination Test
- Truncated Cauchy Test
- CA^tr
- Left-Truncated Student-t_1 Combination Test
concept_kind: mathematical_method
definition: A statistical p-value combination method that aggregates m dependent hypothesis test p-values
  p_1, ..., p_m in (0, 1] by bounding the left tail of the standard Cauchy inverse-CDF transformation
  at a finite negative threshold—either via Winsorized p-value truncation p_i^tr = min(p_i, 1 - delta)
  producing a point mass delta at nu_delta = tan(pi * (delta - 0.5)) < 0 (Fang et al. 2023) or via conditional
  left-truncation F_trunc(x; c) = (F(x) - F(c)) / (1 - F(c)) I_{x >= c} with truncation probability p_0
  = 1 - F(c) in (0.5, 1) producing the smooth quantile map tan(pi * (0.5 - p_0 * p_i)) >= tan(pi * (0.5
  - p_0)) (Gui et al. 2023)—thereby eliminating unbounded negative score penalties as p_i -> 1 while preserving
  regularly varying right-tail index gamma = 1 and asymptotic tail robustness under arbitrary non-perfect
  correlation.
identity_notes: No normalized identity match for the Left-Truncated Cauchy Combination Test across all
  442 pinned AIO records and 567 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches
  across data, sources, research, history, and reviews returned only neighbour references in AIMech:HalfCauchyCombinationTest.
  Distinct from AIMech:CauchyCombinationTest (Liu & Xie 2020), which uses the untruncated transformation
  tan(pi * (0.5 - p_i)) on (-infinity, +infinity) with symmetric tail balance p = q = 0.5 and suffers
  unbounded negative divergence as p_i -> 1. Distinct from AIMech:HalfCauchyCombinationTest (Liu, Meng,
  & Pillai 2025), which restricts support strictly to [0, +infinity) via tan(pi * (1 - p_i) / 2) (corresponding
  to the boundary case p_0 = 0.5, c = 0) and evaluates finite-sample null distributions via sine/cosine
  integral Laplace contour integration rather than negative-support truncation (p_0 in (0.5, 1), c < 0
  or point-mass Winsorization at nu_delta < 0) with Generalized Central Limit Theorem / importance-sampling
  hybrid calibration.
