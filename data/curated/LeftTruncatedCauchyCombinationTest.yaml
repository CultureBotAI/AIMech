    relation: supports
- claim_id: regularly-varying-index-one-and-asymptotic-dependence-robustness
  kind: mechanism
  statement: Both left-truncated Cauchy transformations belong to the regularly varying tailed class R_{-1}
    with tail index gamma = 1 and one-sided tail balance parameters p = 1, q = 0, satisfying Condition
    (A2.2) (bounded below and strictly decreasing near 0); under bivariate normal test statistics with
    pairwise correlations |rho_{ij}| < 1 (Theorem 1) or partial perfect correlation (Theorem 2), the upper
    tail probability satisfies P(sum_{i=1}^n w_i U_i > t) ~ (sum_{i=1}^n w_i) P(U_1 > t) as t -> infinity
    and attains the Donoho-Jin sparse detection boundary sqrt(tau) + sqrt(beta) > 1 for 0 < beta < 1/4
    under banded correlation (Theorem 3).
  evidence:
  - source_id: fang-chang-park-tseng2023
    locator: Section 3.1–3.3, lines 66–101, Theorems 1–3; Appendix A, lines 449–453, 508–526
    relation: supports
  - source_id: gui-jiang-wang2023
    locator: Section 3.1.2–3.1.3, lines 290–430, Proposition 3.2 and Remark 3.3
    relation: supports
- claim_id: gclt-stable-approximation-and-finite-sample-tail-bounds
  kind: mechanism
  statement: Because left truncation breaks exact finite-sample Cauchy stability, Fang et al. (2023) derive
    analytical finite-n lower and upper tail bounds P(X_1 >= t) <= P(n^(-1) T_{CA^tr} >= t) <= sum_{j=0}^{n-1}
    C(n, j) delta^j P(X_1 >= (n*t - j*nu_delta)/(n - j)) <= ((1 + delta)^n - delta^n) P(X_1 >= t) (Proposition
    4) and a Generalized Central Limit Theorem approximation n^(-1) T_{CA^tr} - n * theta_n ->_d S(1,
    1, 1/2, 0) (Proposition 3), using GCLT when alpha < 5e-3 or n >= 25 and cross-entropy importance sampling
    within the Proposition 4 bounds when n < 25 and alpha >= 5e-3.
  evidence:
  - source_id: fang-chang-park-tseng2023
    locator: Section 2.2, lines 41–55, Propositions 3–4; Appendix A, Proof of Proposition 4, lines 528–535
    relation: supports
- claim_id: power-recovery-under-discrete-and-negatively-correlated-p-values
  kind: application
  statement: In discrete contingency-table Fisher exact tests, misspecified or negatively correlated one-sided
    tests, and gene-level GWAS aggregation (such as genes SLC2A9 and PCSK6 in neuroticism GWAS containing
    both SNPs with p < 1e-4 and SNPs with p > 0.99), left-truncated Cauchy combination prevents p-values
    near 1 from cancelling true signals and recovers statistical power comparable to harmonic mean combination.
  evidence:
