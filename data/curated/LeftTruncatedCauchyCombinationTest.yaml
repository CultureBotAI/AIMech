claims:
- claim_id: winsorized-and-conditional-left-truncated-cauchy-transformations
  kind: mechanism
  statement: 'To prevent p-values near 1 from generating unbounded negative Cauchy scores tan(pi * (0.5
    - p_i)) -> -infinity, the left-truncated Cauchy combination test bounds each transformed score below
    at a finite negative threshold: in the Winsorized point-mass formulation (Fang et al. 2023), p_i is
    truncated to p_i^tr = min(p_i, 1 - delta) (default delta = 0.01) so g^tr(p_i) = tan(pi * (0.5 - p_i^tr))
    >= nu_delta = tan(pi * (delta - 0.5)); in the conditional left-truncated formulation (Gui et al. 2023),
    the Cauchy CDF F is conditioned on X >= c = Q_F(1 - p_0) for p_0 in (0.5, 1) (default p_0 = 0.9),
    yielding the smooth inverse-survival transformation Q_{F^trunc}(1 - p_i) = tan(pi * (0.5 - p_0 * p_i))
    >= c.'
  evidence:
  - source_id: fang-chang-park-tseng2023
    locator: Section 2.2, lines 40–45; Appendix A, Remark A1.4, line 508
    relation: supports
  - source_id: gui-jiang-wang2023
