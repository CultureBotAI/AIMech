- target: AIO:DataDredgingBias
  relation: related_match
  rationale: The left-truncated Cauchy combination test aggregates dependent hypothesis test p-values
    for global Type I error control when screening multiple correlated hypotheses, mitigating false-positive
    inflation from selective reporting (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the multiple-testing
    bias rather than the statistical combination procedure.
limitations:
- Left truncation destroys the exact finite-sample stability under addition of the standard Cauchy distribution
  (where the average of n i.i.d. standard Cauchy variables is exactly standard Cauchy for all t in R);
  consequently, exact finite-sample calibration at moderate significance levels alpha >= 5e-3 and small
  n < 25 requires importance sampling or numerical convolution rather than a closed-form arctangent formula.
- Because the right tail is one-sided (balance parameters p = 1, q = 0) with infinite first moment, the
  Generalized Central Limit Theorem limit S(1, 1, 1/2, 0) introduces a sample-size-dependent location
  shift n * theta_n that grows logarithmically with n, and using the unshifted asymptotic single-big-jump
  tail approximation at large m and moderate alpha (such as alpha = 0.05) inflates Type I error under
  dependence.
- The choice of truncation threshold (delta = 0.01 in Fang et al. 2023 or p_0 = 0.9 in Gui et al. 2023)
  is a tuning hyperparameter trading off negative-score cancellation immunity against retention of weak
  negative-evidence cancellation near p = 1.
- All 546 lines of Fang et al. (2023, arXiv:2103.12967) and all 1,071 lines of Gui, Jiang, & Wang (2023,
  arXiv:2310.20460v1) were read. No author R package or neuroticism GWAS pipeline was executed; constructed
  numerical checks in research/discovery/left-truncated-cauchy-combination-boundaries.py verify the p_0
  = 0.5 and p_0 = 1.0 boundary identities, cancellation immunity on (p_1 = 1e-4, p_2 = 1 - 1e-6), and
  Proposition 3/4 GCLT and binomial tail bounds only.
