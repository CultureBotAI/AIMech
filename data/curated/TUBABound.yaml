name: Tractable unnormalized Barber–Agakov bound
definition: A tractable unnormalized Barber–Agakov lower-bound parameterization that uses a real critic
  and a positive output-dependent normalizer to replace an intractable log partition term by a linear
  upper bound.
concept_kind: mathematical_method
identity_notes: 'TUBA is the named parameterization with separate critic f(x,y) and normalizer a(y)>0.
  It is algebraically NWJ evaluated at T=f−log(a)+1; retaining it separately records its explicit normalizer
  and optimization interpretation, not a claim of inequivalent unrestricted variational families. Fixing
  a=e gives NWJ with the same f, while a held-fixed scalar moving average explains the modified MINE gradient.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 208 preceding
  native IDs/names/aliases. Word-delimited fixed-string searches of both full checkouts, including ignored
  and hidden files, returned 57 lines each: existing MINE-f component discussion, shared primary-source
  references, and discovery/review context. Four native neighbors and seven exact AIO nodes with scoped
  synonyms and outgoing relations were inspected.'
limitations:
- The normalizer must remain positive and must match the variable/sampling convention of the formula.
  A batch-dependent normalizer cannot be inserted without checking the extended sampling argument.
- TUBA and NWJ have the same unrestricted family under the stated critic transformation. Different parameterizations,
  restrictions or optimizers can behave differently; no universal superiority is claimed.
- Replacing the normalizer by a running statistic has a fixed-denominator gradient interpretation. It
  does not automatically yield unbiased population Donsker–Varadhan gradients, especially when the statistic
  depends on the current batch.
- Finite samples can exceed true information, and exponential moments can be unstable. The inspected notebook
  has inconsistent matrix-orientation documentation/implementations; no blanket equivalence of all code
  paths or runtime correctness is asserted.
