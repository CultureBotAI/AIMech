claims:
- claim_id: method
  kind: mechanism
  statement: Let Z(y)=E_p(x)[exp(f(X,y))]. For normalized q(x|y)=p(x)exp(f(x,y))/Z(y), the unnormalized
    Barber–Agakov expression is E_joint[f]−E_p(y)[log Z(y)]. Apply log Z<=Z/a+log a−1 for a(y)>0 to obtain
    L_TUBA=1+E_joint[f(X,Y)−log a(Y)]−E_product[exp(f(X,Y))/a(Y)]<=I(X;Y). The inequality replacing log
    Z is tight at a(y)=Z(y); full information tightness additionally requires a critic that represents
    the conditional-to-marginal relationship. Critic and positive normalizer parameters can be optimized
    toward the same objective. Reparameterizing T=f−log a+1 recovers exactly the NWJ expression. With
    fixed functions and appropriate independent joint/product sampling and integrability, the linear expectations
    admit unbiased Monte Carlo estimates of this bound.
  evidence:
  - source_id: method-source
    locator: Section 2.2, PDF p. 3, Equations (3), (4), (6), (7), log-partition inequality and footnote
      1; moving-average interpretation continues on p. 4
    relation: supports
- claim_id: implementation-scope
  kind: limitation
  statement: The pinned notebook subtracts a row-wise log baseline in its TUBA function. Its separable
    critic returns Y-indexed rows and X-indexed columns, while the concatenation critic transposes a matrix
    initially tiled with Y-indexed rows. These paths therefore do not share one score orientation. This
    is a source-level observation supporting caution about a blanket implementation-equivalence claim;
    it does not change the stated population formula or claim an executed runtime defect.
  evidence:
  - source_id: additional-1
    locator: 'Zero-based notebook cells 7, 16 and 19: row normalizer subtraction, baseline(y), and differing
      score-matrix orientations in SeparableCritic and ConcatCritic'
    relation: supports
