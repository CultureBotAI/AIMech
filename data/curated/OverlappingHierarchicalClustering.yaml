aio_mappings:
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: OHC constructs an overlapping cluster hierarchy; this AIO target denotes the related task,
    not the specific graph-density algorithm or equivalence to a strict tree.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: Groups are constructed from supplied distances without reference labels. Structural comparisons
    to other hierarchies do not make the construction a supervised classifier.
limitations:
- This record denotes the Jeantet, Miklós and Gross-Amblard OHC algorithm, not all overlapping hierarchical
  clustering methods.
- Exact graph density, tolerance, tie handling and edge ordering affect the construction. Properties about
  parameter extremes are retained as qualified source descriptions, not independently certified theorems.
- Standalone calculations test a static tied expansion and subset removal. They do not establish that
  the tied state is reached by a complete OHC execution or measure empirical clustering quality.
- The full 13-page primary chapter, all figures, equations, algorithm and references were read. Author
  code and alternative revisions were not inspected or executed; no benchmark replication or formal proof
  certification was performed. This record remains DRAFT.
