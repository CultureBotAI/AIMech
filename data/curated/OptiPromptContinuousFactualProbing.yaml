claims:
- claim_id: optiprompt-continuous-input-embedding-formulation
  kind: mechanism
  statement: OptiPrompt represents a relational prompt as a sequence of dense continuous vectors [v]_1, ..., [v]_m Surrounding the subject entity placeholder [X] and masked object token [MASK] in the input embedding space R^d, and optimizes only those vectors by maximizing the conditional log-likelihood P([MASK] = o | [x]) over relational fact pairs while keeping all pretrained language model weights fixed.
  evidence:
  - source_id: r731-primary-pdf
    locator: Section 3.1, pp. 5019-5020, Equation 3
    relation: supports
- claim_id: optiprompt-manual-template-embedding-initialization
  kind: mechanism
  statement: To incorporate linguistic prior structure while permitting continuous gradient optimization, OptiPrompt can initialize the number and values of its continuous vectors [v]_i directly from the pretrained input word embeddings of a manual relational prompt template.
  evidence:
  - source_id: r731-primary-pdf
    locator: Section 3.1 & Section 3.3, pp. 5019-5021, Table 1
    relation: supports
- claim_id: optiprompt-factual-knowledge-probing-application
  kind: application
  statement: OptiPrompt is applied to factual knowledge probing on the LAMA and LAMA-UHN relational benchmarks across BERT, RoBERTa, and ALBERT models, substantially increasing Precision@1 over manual prompts and discrete AutoPrompt triggers.
  evidence:
  - source_id: r731-primary-pdf
    locator: Section 3.2 & Section 3.3, pp. 5020-5022, Tables 1-2
    relation: supports
  - source_id: r731-metadata-cr
    locator: DBLP bibliographic record conf/naacl/ZhongFC21
    relation: supports
- claim_id: optiprompt-spurious-regularity-exploitation-limitation
  kind: limitation
  statement: Optimizing prompts on supervised relational fact splits can exploit dataset-specific object distribution priors and surface lexical regularities of subject entities to predict answers that were never stored during pretraining, confounding estimates of genuine pretrained factual recall.
  evidence:
  - source_id: r731-primary-pdf
    locator: Section 4 & Section 5, pp. 5022-5026, Tables 3-5 & Figures 2-4
    relation: supports
