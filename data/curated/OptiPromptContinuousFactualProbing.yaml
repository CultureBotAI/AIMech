id: AIMech:OptiPromptContinuousFactualProbing
name: OptiPrompt Continuous Factual Probing
concept_kind: algorithm
review_status: DRAFT
definition: A continuous prompt optimization and factual probing method for pretrained language models that replaces discrete template tokens with dense trainable vectors directly in the model's input embedding space, optimizing those continuous vectors via gradient ascent on the log-likelihood of gold object entities over relational fact triples while holding all pretrained language model parameters frozen.
identity_notes: Distinct from discrete prompt search methods such as AutoPrompt (AIMech:AutoPromptGradientGuidedDiscretePromptSearch) and mining/paraphrasing relational prompts (LPAQA) because OptiPrompt optimizes unconstrained continuous vectors v_i in R^d directly in the input embedding layer of a frozen masked language model, optionally initialized from the embeddings of manual prompt tokens. Also distinct from multi-layer deep continuous prefix tuning (AIMech:PTuningV2DeepContinuousPromptTuning), which injects trainable key-value prefixes across every transformer layer for downstream NLU supervision rather than probing factual relational knowledge and analyzing spurious target-distribution exploitation in masked language models.
aliases:
- OptiPrompt
- OptiPrompt Continuous Prompt Factual Probing
- Continuous Input-Embedding Factual Probing
