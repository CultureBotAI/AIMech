id: AIMech:GustafsonGuidedWalkMetropolis
name: Gustafson guided-walk Metropolis sampler
concept_kind: algorithm
definition: A continuous-state Metropolis sampler that augments a univariate state with a binary direction,
  proposes a half-normal displacement along that direction, retains direction after acceptance and reverses
  it after rejection.
definition_evidence:
- source_id: gustafson1998
  locator: Section 3, printed pp. 358–359 / PDF pp. 2–3, displayed guided-walk transition and invariance
    argument
  relation: supports
claims:
- claim_id: direction-augmented-half-normal-proposal
  kind: mechanism
  statement: For a proper univariate target with density pi, retain state (x,p), where p is either −1
    or +1, with augmented target pi(x)/2. At a current point with positive target density, draw z from
    N(0,sigma²) for a fixed sigma>0 and propose y=x+p*abs(z). The sign selects the proposal direction
    while the absolute Gaussian draw supplies its random magnitude; target derivatives are not used.
  evidence:
  - source_id: gustafson1998
    locator: Section 2 and Section 3, printed p. 358 / PDF p. 2, continuous univariate setting and displayed
      guided-walk proposal
    relation: supports
- claim_id: acceptance-and-rejection-direction-rules
  kind: mechanism
  statement: Accept with probability min(1,pi(y)/pi(x)). On acceptance the new state is (y,p); on rejection
    it is (x,−p). Thus accepted moves retain direction, while rejection retains the position and reverses
    the direction for the next proposal. There is no additional random sign refresh in this displayed
    univariate kernel. An unknown common normalizing constant in the target density cancels from the ratio.
  evidence:
  - source_id: gustafson1998
    locator: Section 3, printed p. 358 / PDF p. 2, displayed guided-walk transition and immediately following
      explanation
    relation: supports
- claim_id: two-stage-invariance-construction
  kind: mechanism
  statement: The transition can be decomposed into a Metropolis–Hastings stage proposing (x+p*abs(z),−p),
    followed by unconditional negation of the resulting sign. The first proposal is symmetric on the augmented
    space and preserves the target under the Metropolis correction; the second operation preserves the
    uniform sign factor. Their composition therefore preserves pi(x)/2. This argument establishes invariance,
    not a general convergence rate or ergodicity theorem for every target and tuning choice.
  evidence:
  - source_id: gustafson1998
    locator: Section 3, printed p. 359 / PDF p. 3, first paragraph; introduction continuation, printed
      p. 358 / PDF p. 2
    relation: supports
- claim_id: univariate-and-componentwise-scope
  kind: scope
  statement: The paper applies univariate invariant updates in turn to full conditional distributions
    and studies componentwise guided walks for multivariate targets. This record’s operational kernel
    is the displayed univariate update. The separate simultaneous-vector variant mentioned in the discussion
    includes direction perturbation and is not specified by the same univariate formula alone; it is not
    asserted as an exact alias or complete implementation here.
  evidence:
  - source_id: gustafson1998
    locator: Introduction continuation, printed p. 358 / PDF p. 2; Examples 2–4, printed pp. 359–363 /
      PDF pp. 3–7; Section 5, printed p. 363 / PDF p. 7, simultaneous-vector discussion
    relation: supports
- claim_id: evidence-and-performance-boundaries
  kind: limitation
  statement: The paper evaluates synthetic targets and distinguishes its continuous guided walk from related
    finite-state theory. Its reported convergence experiment uses entry into a selected target ellipsoid
    as a criterion, rather than a general proof of distributional convergence. The paper also assigns
    the best acceptance-rate labels inconsistently between Example 2 and Example 4. These observations
    support keeping the mechanism separate from claims of universal efficiency, convergence or an optimal
    acceptance rate.
  evidence:
  - source_id: gustafson1998
    locator: Introduction continuation, printed p. 358 / PDF p. 2; Example 2, printed p. 361 / PDF p.
      5; Example 4 and Figure 2, printed pp. 361–363 / PDF pp. 5–7; Section 5, printed p. 363 / PDF p.
      7
    relation: supports
