    association, without equivalence, subclass status or inheritance of Network and hidden-layer assertions.
limitations:
- The definition is restricted to the displayed continuous univariate half-normal proposal and fixed positive
  scale. Other displacement laws, adaptive scales and simultaneous vector proposals require their own
  evidence and validity conditions.
- The current point must have positive target density and the acceptance calculation must be defined.
  If an outside-support proposal has zero target density, the displayed formula rejects it and flips the
  sign; it does not specify clipping, resampling or a reflected proposal. This is the formula’s support
  consequence, not a separate boundary theorem.
- The paper gives no general target-regularity and ergodicity theorem for this continuous kernel. The
  finite positive-target, nonzero-sign-randomization conditions in the related DHN construction cannot
  be transferred automatically.
- The method shares persistent-direction lifting with the DHN finite fiber sampler, but uses random continuous
  displacement and deterministic rejection reversal without its additional theta sign randomization. It
  is not an exact alias of the finite fiber construction, ordinary random-walk Metropolis or Hamiltonian
  Monte Carlo.
- The inspected source is the 1998 journal-layout paper obtained through a public mirror. Exact byte equivalence
  to a publisher download or to the 1997 preprint cited by DHN was not established. No numerical performance
  or runtime claim is made.
