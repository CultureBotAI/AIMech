claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Set T=f(start). Run breadth-first branch-and-bound admitting nodes with f≤T. If no goal is
    reached, restart with a larger T, such as the least f value excluded on the preceding pass; the paper
    also describes increments of one in its unit-cost setting. Repeat until a solution is found. Breadth-first
    traversal, admissible pruning and sufficient resources preserve a minimum-cost solution in this uniform-cost
    setting.
  evidence:
  - source_id: method-source
    locator: Section 4, printed p. 395 / PDF p. 11; Section 3.5 Figure 2, printed p. 394 / PDF p. 10
    relation: supports
- claim_id: analysis-conditions
  kind: limitation
  statement: The expansion-count theorems depend on growth assumptions, while breadth-first traversal
    restricts beneficial tie-breaking within a contour. Memory remains governed by the retained search
    frontier and duplicate-detection strategy.
  evidence:
  - source_id: analysis-conditions
    locator: Section 4.1 Theorems 4–5, Section 4.2, and Section 6.2; printed pp. 396–397 and 406 / PDF
      pp. 12–13 and 22
    relation: supports
