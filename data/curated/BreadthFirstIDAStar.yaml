name: Breadth-first iterative-deepening A-star
definition: An iterative-deepening heuristic graph-search algorithm that repeatedly runs breadth-first
  branch-and-bound within increasing hypothetical f=g+h cost bounds, beginning at the start-state f value,
  until a solution is found; the curated formulation uses unit edge costs and a nonnegative admissible
  heuristic with h(goal)=0.
concept_kind: algorithm
identity_notes: BFIDA* changes the inner traversal of cost-contour iterative deepening to breadth-first
  branch-and-bound. It is distinct from depth-first IDA*, depth-limited iterative-deepening DFS, and a
  single BFBnB search with a supplied incumbent bound. The memory implementation can use frontier or layered
  duplicate handling. No normalized identity match was found across the 442 AIO and 135 prior native records;
  ignored-inclusive text hits in the main checkout were prior discovery leads, source citations, scope
  contrasts and DCBSS substring matches, plus seven public certificate-data substring matches, not existing
  concept records.
limitations:
- The hypothetical threshold is inclusive. Reusing strict incumbent pruning at T=f(start) without a retained
  solution would be a different procedure.
- This method repeats breadth-first contours and retains frontier/duplicate information; it does not inherit
  the path-linear storage of depth-first IDA*.
- The asymptotic node-expansion analysis assumes exponential growth of distinct nodes per iteration; the
  directed-graph result additionally constrains solution depth relative to stored layers. It is not an
  unconditional wall-clock optimum.
- Large layers and tie contours can still be costly. Solvable finite-depth cases require sufficient memory;
  no universal termination guarantee on infinite unsolvable graphs is asserted.
