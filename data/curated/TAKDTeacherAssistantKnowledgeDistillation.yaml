aio_mappings:
- target: AIO:Distillation
  relation: narrow_match
  rationale: TAKD is a multi-step knowledge distillation framework that bridges large teacher-student capacity gaps using a sequential chain of intermediate-sized Teacher Assistant models.
- target: AIO:ArtificialNeuralNetwork
  relation: related_match
  rationale: Transfers softened logit dark knowledge across hierarchies of deep neural networks of decreasing capacity.
limitations:
- Increases total training compute and wall-clock time because each intermediate Teacher Assistant network in the chain must be trained via distillation before distilling the next stage.
- Determining the optimal TA capacity a priori without running multiple distillation trials relies on empirical heuristics (such as matching the average standalone accuracy of teacher and student).
