claims:
- claim_id: r811-claim-teacher-student-capacity-gap-and-vc-bound
  kind: mechanism
  statement: When the capacity gap between teacher F_t and student F_s is large, direct distillation learning rate alpha_{st} shrinks toward the from-scratch rate alpha_{sr} and teacher logits become overly confident; inserting an intermediate-capacity Teacher Assistant F_a decomposes the transfer into larger learning rate exponents alpha_{at} >= alpha_{st} and alpha_{sa} >= alpha_{st} with approximation errors eps_{at} + eps_{sa} <= eps_{st}, reducing the VC generalization excess risk upper bound from O(|F_t|_C / n^{alpha_{tr}} + |F_s|_C / n^{alpha_{st}}) + eps_{tr} + eps_{st} (Eq. 11) to O(|F_t|_C / n^{alpha_{tr}} + |F_a|_C / n^{alpha_{at}} + |F_s|_C / n^{alpha_{sa}}) + eps_{tr} + eps_{at} + eps_{sa} (Eq. 10).
  evidence:
  - source_id: r811-primary-pdf
    locator: Section 'The Gap Between Student and Teacher' (Page 3) & Section 'Why Does Distillation with TA work? / Theoretical Analysis' (Equations 4-12 & Figure 6), Pages 6-7
    relation: supports
  - source_id: r811-primary-pdf
    locator: vc_bound verification of Equations 10 <= 11 <= 12 in main()
    relation: supports
- claim_id: r811-claim-multi-step-path-optimality-and-dynamic-programming
  kind: mechanism
  statement: Given candidate network capacities ordered as Q = (q_0 = T, q_1, ..., q_n = S), the unconstrained optimal TAKD path includes all intermediate TAs (Lemma 1), while finding the optimal constrained length-k distillation path satisfies optimal substructure (Lemma 2) and is solved via dynamic programming w_k(q_j) = arg min_{w in W_{j,k}} l(w) where W_{j,k} = {BLKD(w_{k-1}(q_i) -> q_j) | 0 < i < j} (Eq. 13 & Algorithm 1) in O(k * n^2) distillation operations instead of C(n - 1, k - 1) exhaustive paths.
  evidence:
  - source_id: r811-primary-pdf
    locator: Section 'Why Limiting to 1-step TA?' (Figure 5) & Appendix 'The Best TA Sequence' (Principles 1-3, Lemmas 1-2, Equation 13, & Algorithm 1), Pages 5-6 & 10-11
    relation: supports
  - source_id: r811-primary-pdf
    locator: Exact Figure 5 path enumeration and Lemma 1 / Lemma 2 / Algorithm 1 DP verification in main()
    relation: supports
- claim_id: r811-claim-cifar-and-imagenet-empirical-gains
  kind: application
  statement: Across CIFAR-10, CIFAR-100, and ImageNet on plain CNN and ResNet backbones (e.g., T=ResNet-110 -> TA=ResNet-20 -> S=ResNet-8 on CIFAR-100 and T=ResNet-50 -> TA=ResNet-20 -> S=ResNet-14 on ImageNet), TAKD consistently outperforms both Baseline Knowledge Distillation (BLKD) and from-scratch training (NOKD), as well as FitNet, Attention Transfer (AT), FSP, BSS, and Deep Mutual Learning, while producing flatter student loss landscapes around local minima.
  evidence:
  - source_id: r811-primary-pdf
    locator: Section 'Results and Analysis' (Tables 1-3, Figures 4-7), Pages 4-7
    relation: supports
- claim_id: r811-claim-sequential-training-cost-and-ta-size-selection-limitation
  kind: limitation
  statement: TAKD requires training one or more intermediate Teacher Assistant networks sequentially before the student can be distilled, and selecting the optimal TA capacity (or k-step path without prior evaluation of all O(k * n^2) pairwise transfers) relies on heuristics such as choosing a TA whose standalone accuracy lies near the mean of the teacher and student accuracies.
  evidence:
  - source_id: r811-primary-pdf
    locator: Section 'What is the Best TA Size?' (Pages 4-5), Section 'Summary' (Page 7), & Algorithm 1 (Page 11)
    relation: supports
