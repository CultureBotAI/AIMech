id: AIMech:TAKDTeacherAssistantKnowledgeDistillation
name: Teacher Assistant Knowledge Distillation (TAKD)
concept_kind: learning_paradigm
review_status: DRAFT
definition: A multi-step knowledge distillation paradigm that mitigates accuracy degradation caused by a large capacity gap between a high-capacity teacher network T and a compact student network S by introducing one or more intermediate-capacity Teacher Assistant (TA) networks (|S|_C < |TA_m|_C < ... < |TA_1|_C < |T|_C), sequentially distilling T into TA_1, each TA_i into TA_{i+1}, and the final TA into S under temperature-scaled KL divergence plus supervised cross-entropy L = (1 - lambda) L_SL + lambda * tau^2 KL(y_s, y_t), and selecting resource-constrained length-k distillation paths via dynamic programming in O(k * n^2) distillation operations.
identity_notes: 'Introduced by Seyed-Iman Mirzadeh, Mehrdad Farajtabar, Ang Li, Nir Levine, Akihiro Matsukawa, and Hassan Ghasemzadeh (AAAI 2020, Vol. 34, No. 04, pp. 5191-5198, arXiv:1902.03393, doi:10.1609/aaai.v34i04.5963). Distinct from direct single-step Baseline Knowledge Distillation (BLKD, Hinton et al. 2015), from multi-teacher ensemble distillation (which averages parallel teachers of similar large capacity), and from online Deep Mutual Learning (which co-trains peer networks simultaneously): TAKD proves both empirically and via VC generalization bounds (Eqs. 4-12) that an overly large teacher degrades a fixed small student, and resolves this by sequential capacity-ordered intermediary distillation.'
aliases:
- TAKD
- Teacher Assistant Knowledge Distillation
- Multi-Step Teacher Assistant Distillation
