id: AIMech:MarcenkoPasturConvexOptimizationSpectrumEstimation
name: Marcenko-Pastur Convex Optimization Spectrum Estimation for Large Covariance Matrices
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- El Karoui Marcenko-Pastur Stieltjes-Transform Convex Spectrum Estimator
- Random Matrix Theory Linear-Programming Population Spectral Distribution Estimator
- Nonparametric Marcenko-Pastur Inverse Problem Covariance Eigenvalue Estimator
definition: Marcenko-Pastur Convex Optimization Spectrum Estimation for Large Covariance Matrices is a nonparametric high-dimensional spectral distribution estimation methodology that recovers the population spectral distribution H_p(x) = (1/p) sum_{j=1}^p 1_{l_j <= x} of a p x p covariance matrix Sigma_p from the empirical spectral distribution F_p of the sample covariance matrix S_p = (1/n) X'X in the proportional asymptotic regime p/n -> c in (0, infty) by inverting the Silverstein-Marcenko-Pastur equation -(1 - c)/z + c m_F(z) = -1/v_F(z) = (-z + c integral t/(1 + t v_F(z)) dH(t))^{-1} via a convex optimization program. Approximating H on a dictionary of non-negative basis functions {f_k}_{k=1}^K (such as Dirac masses dH_hat(t) = sum_{k=1}^K w_k delta_{t_k} with w_k >= 0, sum_k w_k = 1, or piecewise-linear roof/tent functions) and evaluating empirical Stieltjes transforms v_hat_j = (1 - p/n)/z_j + (p/n) m_{F_n}(z_j) on a complex grid {z_j}_{j=1}^J in C^+ subset R x i R_+, the estimator
  minimizes the maximum real and imaginary residual norm max_j |1/v_hat_j - z_j + (p/n) sum_k w_k integral t f_k(t)/(1 + t v_hat_j) dt| (or weighted L_p/L_2 criteria) as a linear or convex program, achieving weak almost-sure convergence H_hat_n => H (Theorem 1, Theorem 2, and Corollary 1) through vital theorem analytic continuation and Weierstrass polynomial moment identification.
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from El Karoui (2008, The Annals of Statistics 36(6):2757-2790; arXiv:math/0609418v1, DOI:10.1214/07-AOS581). Distinct from AIMech:OperatorNormConsistentEstimationOfBetaSparseCovarianceMatrices (El Karoui 2008, Ann. Statist. 36(6):2717-2756), which estimates the full covariance matrix Sigma_p in operator norm under closed-walk beta-sparsity via entrywise hard thresholding, whereas the present method requires no sparsity or structure on Sigma_p and estimates the 1D population eigenvalue distribution H_p by solving a convex/linear program that inverts the Marcenko-Pastur Stieltjes-transform equation on C^+. Also distinct from AIMech:LedoitWolfOptimalLinearCovarianceShrinkage (Ledoit & Wolf 2004), which shrinks S_p linearly toward the identity matrix under Frobenius loss rather than nonparametrically reconstructing the population spectral distribution H_p.
