claims:
- claim_id: marcenko-pastur-stieltjes-transform-linearity-and-convex-lp-dictionary-formulation
  kind: mechanism
  statement: Under the random matrix model X = T^{1/2} Z where Sigma_p = T has spectral distribution H_p and p/n -> c in (0, infty), the empirical spectral distribution F_p of S_p = (1/n) X'X converges weakly almost surely to F whose companion Stieltjes transform v_F(z) = (1 - c) m_{tilde F}(z) = -(1 - c)/z + c m_F(z) satisfies the Silverstein-Marcenko-Pastur functional equation -1/v_F(z) = -z + c integral t/(1 + t v_F(z)) dH(t) for z in C^+ (Section 1.1, eq. 1, p. 2). Observing that for fixed z and v_F(z) the functional H -> integral t/(1 + t v_F(z)) dH(t) is linear in the probability measure H while the domain of probability measures on [0, M] is convex (Section 2.1, p. 5), Section 2.2 (pp. 5-8) discretizes dH_hat(t) = sum_{k=1}^K w_k f_k(t) dt over a dictionary {f_k}_{k=1}^K (with Dirac masses or closed-form roof/tent basis integrals given by Lemma 1, p. 7) on a complex grid {z_j}_{j=1}^J subset C^+ and solves a linear program minimizing max_j max(|Re e_j(w)|, |Im e_j(w)|) subject to
    w_k >= 0 and sum_k w_k integral f_k(t) dt = 1, where e_j(w) = 1/v_hat_j - z_j + (p/n) sum_{k=1}^K w_k integral t f_k(t)/(1 + t v_hat_j) dt.
  evidence:
  - source_id: ek2008-spectrum-pdf
    locator: Section 1.1, eq. (1), pp. 2-3; Section 2.1-2.2, Lemma 1, pp. 5-8
    relation: supports
- claim_id: weak-almost-sure-consistency-via-vitali-analytic-continuation-and-moment-recovery
  kind: scope
  statement: 'When Sigma_p has spectrum supported in a compact interval [0, M], entries of Z are i.i.d. with mean 0 and variance 1 (or X_i = Sigma_p^{1/2} Z_i are independent isotropic convex-concentration vectors as in Lemma 2, p. 12), and the evaluation mesh {z_j}_{j=1}^{J_n} accumulates on a vertical segment {x_0 + i y : y in [y_min, y_max]} satisfying |z_j| > 2 max(2, c) M and Re(1 + t v_F(z_j)) > 1/2 (Assumptions A2-A4, p. 9), Theorem 1 (p. 9), Theorem 2 (p. 10), and Corollary 1 (p. 11) prove that any sequence of probability measures H_hat_n achieving asymptotic objective value L_{P_n}(H_hat_n) -> 0 converges weakly almost surely to H_infty (when H_p => H_infty) and satisfies Levy-distance convergence d_L(H_hat_p, H_p) -> 0 even when H_p has no limit: the proof shows via Vitali''s convergence theorem on bounded analytic functions (Section 4.1, pp. 16-20) that integral t/(1 + t v) d(H_infty - H_hat_infty)(t) = 0 on an open ball around v = 0, which by power-series differentiation forces
    all moments integral t^m dH_hat_infty(t) = integral t^m dH_infty(t) (m >= 1) to match on [0, M], uniquely identifying H_infty by the Weierstrass approximation theorem.'
  evidence:
  - source_id: ek2008-spectrum-pdf
    locator: Section 2.4, Assumptions A1-A5, Theorems 1-2, and Corollary 1, pp. 8-11; Section 2.5, Lemma 2, p. 12; Section 4, Proof of Theorem 1, Theorem 2, and Corollary 1, pp. 16-21
    relation: supports
- claim_id: eigenvalue-clustering-multiplicity-and-support-recovery-across-continuous-and-atomic-spectra
  kind: scope
  statement: "Across five challenging simulation regimes in Section 3.1 (Figures 1-5, pp. 12-16)\u2014including merged sample bulk components for closely spaced two-atom spectra 0.5 delta_1 + 0.5 delta_2 at n = 500, p = 100 (Figure 1), three-atom spectra with heterogeneous weights (0.2, 0.3, 0.5) at n = 500, p = 300 (Figure 2), mixture of a continuous Uniform(1, 2) bulk and a point mass at 0.5 (Figure 3), Toeplitz AR(1) correlation matrices Sigma_{i,j} = rho^{|i-j|} with rho = 0.6 at n = 500, p = 200 (Figure 4), and standard Wishart identity covariance at n = 1000, p = 500 (Figure 5)\u2014the convex optimization estimator accurately recovers population spectral CDFs, number of spectral clusters, cluster weights, and eigenvalue ranges where the raw sample eigenvalue distribution F_p suffers severe Marcenko-Pastur spreading and support merging."
  evidence:
  - source_id: ek2008-spectrum-pdf
    locator: Section 3, Sections 3.1-3.2 and Figures 1-5, pp. 12-16
    relation: supports
