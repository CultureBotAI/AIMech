id: AIMech:AdaMax
name: AdaMax
definition: An Adam-family optimizer using an exponentially weighted infinity-norm gradient scale instead
  of a second raw moment denominator.
concept_kind: algorithm
identity_notes: AdaMax changes Adam's normalization statistic and is retained as a distinct algorithm;
  it is not an alias for Adam.
