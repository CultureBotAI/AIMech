claims:
- claim_id: coordinate-wise-positive-thresholding-and-clipping-escapes-negative-curvature
  kind: mechanism
  statement: In Section 2.1-2.2 (Equations 1-4, Figure 2, Algorithm 1), thresholding the diagonal Hessian estimate via max(gamma h_{t,[i]}, epsilon) and clipping the preconditioned ratio via clip(m_{t,[i]} / max(gamma h_{t,[i]}, epsilon), rho) ensures that in non-convex regions where h_{t,[i]} <= 0 (negative curvature, saddle points, or local maxima) or where h_{t,[i]} is inaccurately small, the coordinate update safely reduces to benign SignGD (+-eta_t rho sign(m_{t,[i]})), while in convex regions with heterogeneous curvatures (sharp versus flat dimensions) it normalizes coordinate velocities like damped Newton's method.
  evidence:
  - source_id: r583-primary-pdf
    locator: Section 2.1-2.2, Equations (1)-(4), Footnote 1, Figure 2, Algorithm 1, pp. 3-5
    relation: supports
- claim_id: unbiased-minibatch-gauss-newton-bartlett-diagonal-estimator
  kind: mechanism
  statement: In Section 2.3 (Option 2, Equations 9-13, Algorithm 2), for a mini-batch {(x_b, y_b)}_{b=1}^B with exponential-family/cross-entropy loss l(f(theta, x_b), y_b), sampling synthetic labels hat{y}_b ~ p(theta, x_b) independently from the model's predictive distribution and computing the squared mini-batch gradient B hat{g} odot hat{g} where hat{g} = nabla_theta (1/B) sum_{b=1}^B l(f(theta, x_b), hat{y}_b) yields an exact unbiased estimator of the diagonal of the Gauss-Newton matrix (1/B) sum_{b=1}^B diag(J_theta f(theta, x_b)^T S_b J_theta f(theta, x_b)) using only one backward pass (costing ~5% average overhead when evaluated every k = 10 steps) and guarantees non-negative coordinates.
  evidence:
  - source_id: r583-primary-pdf
    locator: Section 2.3, Equations (9)-(13), Algorithm 2, pp. 6-7
    relation: supports
  - source_id: r583-metadata-cr
    locator: Bibliographic record (ICLR 2024)
    relation: supports
- claim_id: condition-number-independent-convergence-on-strictly-convex-self-concordant-functions
  kind: application
  statement: In Section 4 (Theorems 4.3 and 4.5, Lemmas D.10 and D.11), under twice differentiability and a Hessian trace continuity assumption (Assumption 4.1-4.2), deterministic Sophia achieves local quadratic convergence and global step complexity T <= d / (eta^2 rho^2) (L(theta_0) - min L(theta)) + log_2(1 / (2 eta rho^2 mu)) + log_2 log_2(d / (4 rho^2 epsilon)) that is completely independent of the maximum eigenvalue M = lambda_max(nabla^2 L) and the condition number kappa = M / mu.
  evidence:
  - source_id: r583-primary-pdf
    locator: Section 4, Assumptions 4.1-4.2, Theorems 4.3 and 4.5, pp. 9-10; Appendix D, Lemmas D.10-D.11, pp. 19-24
    relation: supports
- claim_id: diagonal-approximation-and-periodic-backward-pass-overhead-limitation
  kind: limitation
  statement: Sophia approximates only the diagonal of the Hessian or Gauss-Newton matrix (ignoring off-diagonal parameter interactions) and requires an additional backward pass (Sophia-G) or Hessian-vector product (Sophia-H) every k steps, adding approximately 5%/k*10 compute overhead.
  evidence:
  - source_id: r583-primary-pdf
    locator: Section 2.2-2.3, pp. 5-7; Section 3.2, Figure 6, p. 8
    relation: supports
