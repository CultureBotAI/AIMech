id: AIMech:CEDRContextualizedEmbeddingsForDocumentRanking
name: CEDR Contextualized Embeddings for Document Ranking
concept_kind: architecture
review_status: DRAFT
definition: A joint neural document ranking architecture that replaces the single 2D static-word-embedding similarity matrix in interaction-focused neural rankers (such as PACRR, KNRM, and DRMM) with a 3D multi-layer contextualized similarity tensor S_{Q,D}[l, q, d] = cos(context_{Q,D}(q, l), context_{Q,D}(d, l)) in R^{L x |Q| x |D|} computed across all L layers of a fine-tuned contextualized language model (BERT) and concatenates BERT's deep semantic [CLS] classification vector with the per-layer soft n-gram, RBF kernel-pooling, or histogram-bin matching signals to predict final query-document relevance.
identity_notes: Distinct from Vanilla BERT cross-encoder re-rankers, which predict relevance solely from a linear projection of the final-layer [CLS] vector without computing token-to-token cosine similarity matrices or soft term-counting kernels across intermediate layers; and distinct from static-embedding interaction rankers (KNRM, PACRR, DRMM with GloVe/Word2Vec), where identical surface words always receive cosine similarity 1.0 regardless of polysemous context.
aliases:
- CEDR
- Contextualized Embeddings for Document Ranking
- CEDR Joint Contextualized Similarity Tensor Ranking Architecture
