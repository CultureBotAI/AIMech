id: AIMech:KrumAndMultiKrumByzantineTolerantGradientDescent
name: Krum and Multi-Krum Byzantine-Tolerant Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A Euclidean-distance neighborhood gradient aggregation rule (Krum and Multi-Krum) for distributed stochastic gradient descent with n workers of which up to f are Byzantine (2f + 2 < n). Given worker vectors V_1,...,V_n in R^d, Krum assigns each worker i the score s(i) = sum_{i -> j} ||V_i - V_j||^2 summed over the n - f - 2 closest neighbors V_j of V_i in squared Euclidean norm, and outputs the single vector Kr(V_1,...,V_n) = V_{i_*} with minimum score s(i_*); Multi-Krum (Kr_m) averages the m vectors with the smallest scores s(i_*^1),...,s(i_*^m) for 1 <= m <= n - 2f - 2.
identity_notes: Distinct from Coordinate-wise Median and Coordinate-wise Trimmed Mean (AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustDistributedLearning, which aggregate each coordinate independently in O(n d) time rather than selecting whole gradient vectors via joint d-dimensional Euclidean neighborhood distances in O(n^2 (d + log n)) time) and from RFA Smoothed Weiszfeld Geometric Median (AIMech:RfaRobustFederatedAggregationSmoothedWeiszfeldGeometricMedian, which computes an iterative smoothed l_2 geometric median across all vectors up to f < n/2 rather than selecting among submitted worker vectors for 2f + 2 < n).
aliases:
- Krum
- Multi-Krum
- Krum Byzantine-Tolerant SGD
- (alpha, f)-Byzantine Resilient Krum Aggregation
