claims:
- claim_id: r399-linear-aggregation-impossibility-and-alpha-f-byzantine-resilience
  kind: mechanism
  statement: Lemma 1 proves that no non-zero linear combination of worker gradients can tolerate even a single Byzantine worker (f = 1), whereas Proposition 1 proves that for 2f + 2 < n and bounded isotropic variance sqrt(d) * sigma < ||g|| / eta(n, f) with eta(n, f) = sqrt(2 * (n - f + (f*(n - f - 2) + f^2*(n - f - 1)) / (n - 2f - 2))), Krum satisfies (alpha, f)-Byzantine resilience (<E[Kr], g> >= (1 - sin alpha) ||g||^2 > 0 and bounded 2nd-4th moments) in O(n^2 (d + log n)) time (Lemma 2).
  evidence:
  - source_id: r399-primary-pdf
    locator: Section 3 (Lemma 1, Definition 1) and Section 4 (Lemma 2, Proposition 1), pp. 3-6
    relation: supports
- claim_id: r399-almost-sure-nonconvex-quasi-martingale-convergence-and-multi-krum
  kind: mechanism
  statement: Proposition 2 establishes almost-sure convergence of Krum-SGD gradients to zero on smooth nonconvex objectives via Fisk quasi-martingale convergence whenever the cone angle satisfies eta(n, f) * sqrt(d) * sigma < ||g||, and Proposition 3 extends (alpha, f)-Byzantine resilience to Multi-Krum Kr_m = (1/m) sum_{s=1}^m V_{i_*^s} when 2f + 2 < n - m, interpolating between 1-Krum selection and mini-batch averaging.
  evidence:
  - source_id: r399-primary-pdf
    locator: Section 5 Convergence Analysis (Proposition 2) and Section 6 Discussion / Multi-Krum (Proposition 3), pp. 6-8
    relation: supports
- claim_id: r399-quadratic-worker-complexity-and-dimension-noise-cone-limitation
  kind: limitation
  statement: Computing all pairwise distances for Krum costs O(n^2 (d + log n)) per step, requires strictly more than 2f + 2 workers (n >= 2f + 3, or n > 2f + 2 + m for Multi-Krum), and its theoretical cone condition eta(n, f) * sqrt(d) * sigma < ||g|| degrades with sqrt(d) in high dimensions or under non-i.i.d. worker heterogeneity.
  evidence:
  - source_id: r399-primary-pdf
    locator: Section 4 Lemma 2, Proposition 1, Section 5 Proposition 2, and Section 6, pp. 4-8
    relation: supports
- claim_id: r399-omniscient-gaussian-and-bit-flip-byzantine-defense-application
  kind: application
  statement: Evaluated on distributed training of multi-layer perceptrons (spambase) and convolutional neural networks (MNIST) under omniscient adversary, Gaussian noise, and bit-flipping attacks up to 45% Byzantine workers, where Multi-Krum maintains clean accuracy while naive averaging fails.
  evidence:
  - source_id: r399-primary-pdf
    locator: Section 6 Discussion and Experiments (Figures 2-4), pp. 7-9
    relation: supports
