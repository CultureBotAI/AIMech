claims:
- claim_id: r450-server-spreadout-prevents-positive-only-collapse-mechanism
  kind: mechanism
  statement: When clients only have access to positive examples of class i and minimize l_pos(f(x), i) = d(w_i, g_theta(x))^2, naive FedAvg collapses all class embeddings w_1, ..., w_C and encoder outputs g_theta(x) to a single point; applying the server-side spreadout regularizer reg_sp(W) (Eq. 7) or stochastic negative mining reg_sp^top(W) over the k closest classes N_k(c) (Eq. 8) enforces pairwise separation margin nu without transmitting negative examples or full class matrices to clients.
  evidence:
  - source_id: r450-primary-pdf
    locator: Section 3.1 Failure of Vanilla FedAvg & Section 3.2 FedAwS (Equations 7-8, Algorithm 1), pp. 10948-10950
    relation: supports
- claim_id: r450-contrastive-loss-surrogate-equivalence-bound
  kind: mechanism
  statement: Lemma 1, Proposition 2, and Theorem 1 (Section 4, Equations 13-21, pp. 10950-10952) prove that cosine contrastive loss l_ccl is a valid multi-class classification surrogate and that for balanced classes with weight lambda = 1/C, the FedAwS objective approximates l_ccl within |l_ccl(f(x), y) - l_sp(f(x), y)| <= (1 + 2*nu) ||w_y - g_theta(x)||_2, vanishing as positive examples align with their class embeddings.
  evidence:
  - source_id: r450-primary-pdf
    locator: Section 4 Theoretical Justification (Propositions 1-2, Lemma 1, Theorem 1, Equations 13-21), pp. 10950-10952
    relation: supports
- claim_id: r450-quadratic-pairwise-class-cost-and-margin-tuning-limitation
  kind: limitation
  statement: Full pairwise spreadout regularization reg_sp(W) costs O(C^2 d) per server step when the number of classes C is large (requiring top-k negative mining reg_sp^top in Eq. 8), and performance depends on selecting the margin hyperparameter nu and top-k neighborhood size.
  evidence:
  - source_id: r450-primary-pdf
    locator: Section 3.2 Stochastic Negative Mining (Equation 8) & Section 5.2 Ablation Studies, pp. 10949-10954
    relation: supports
- claim_id: r450-user-verification-and-extreme-multilabel-federated-application
  kind: application
  statement: Applied to positive-only federated classification on CIFAR-10, CIFAR-100, and extreme multi-label classification datasets (AmazonCat-13K, WikiLSHTC-325K, Amazon-670K).
  evidence:
  - source_id: r450-primary-pdf
    locator: Section 5 Experiments (Tables 1-4, Figures 2-3), pp. 10952-10955
    relation: supports
