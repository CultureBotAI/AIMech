aio_mappings:
- target: AIO:SupportVectorMachine
  relation: related_match
  rationale: The algorithm trains a particular support-vector formulation, making AIO:SupportVectorMachine
    a related model-family target. The pinned target is a Network with layer relations and supervised
    classification/regression scope; it is not identical to this training algorithm. Related matching
    asserts neither equivalence nor subclassing. BinaryClassification, Classification, SupervisedLearning
    and UnsupervisedLearning are tasks, not the specific solver; encoding labels in a feature map does
    not make binary training unsupervised. KernelLayer is a component, TrainingStrategy is described as
    preprocessing, and DataPreparation or SelectionAndSamplingBias do not identify the procedure. Native
    SVDD fits a support boundary, SVC adds component labeling, kernel PCA extracts variance directions,
    and margin clustering infers labels. Shared kernels or enclosing spheres do not establish identity.
limitations:
- Kernel validity and normalization, regularization, numerical tolerances, violation-search policy and
  data geometry affect guarantees and costs. A geometric approximation is not a calibrated uncertainty
  estimate or a generalization guarantee.
- All 30 CVM and eight BVM primary PDF pages were visually read; the CVM critique’s 11 pages were also
  read for that record. The reply remains abstract-only context and its software diagnosis was not independently
  verified.
- Exact rational formula and boundary checks were executed. No historical binary, full optimizer, trained
  model or benchmark was executed. Original software access links failed; current implementation behavior
  is not asserted.
- This maintained native record remains DRAFT, with a local related AIO mapping. Generalized solvers,
  data-description variants and other discovered source leads remain unresolved.
