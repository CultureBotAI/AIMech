id: AIMech:AdapterFusion
name: AdapterFusion
concept_kind: architecture
review_status: DRAFT
definition: A two-stage multi-task transfer learning architecture and algorithm that first extracts task-specific knowledge into N bottleneck adapters {Phi_1, ..., Phi_N} while keeping the pretrained Transformer backbone Theta fixed, and second composes those frozen adapters for a target task m by learning layer-wise Query, Key, and Value matrices (Q_l, K_l, V_l) that compute contextual attention weights s_{l,t} = softmax(h_{l,t}^T Q_l dot z_{l,t,n}^T K_l) between the feed-forward sub-layer representation h_{l,t} and each adapter output z_{l,t,n} to form o_{l,t} = sum_{n=1}^N s_{l,t,n} (z_{l,t,n}^T V_l).
identity_notes: Distinct from sequential fine-tuning (which overwrites model parameters and suffers catastrophic forgetting), from joint multi-task adapter training (MT-A, which requires simultaneous access to all datasets and suffers inter-task gradient interference), and from LoRA composition methods such as LoraHub (AIMech:LoraHub) and MoLE (AIMech:MoLEMixtureOfLoRAExperts). Formulated by Pfeiffer, Kamath, Ruckle, Cho, and Gurevych (EACL 2021, pp. 487-503, arXiv:2005.00247).
aliases:
- AdapterFusion Non-Destructive Task Composition
- Two-Stage Adapter Knowledge Extraction and Composition
- Contextual Attention Adapter Mixer
