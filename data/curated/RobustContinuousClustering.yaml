id: AIMech:RobustContinuousClustering
name: Robust continuous clustering
aliases:
- RCC clustering
concept_kind: algorithm
definition: A clustering algorithm that optimizes one representative per observation using squared data
  fidelity and robust attraction along a neighborhood graph, then extracts groups from thresholded connectivity
  between the optimized representatives.
identity_notes: Compared all 442 pinned AIO and 655 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 10, 0, 0 lines. All distinct match contents were
  read, including pending discovery entries and source-reading observations. Recovery hits concern pending
  RCC discovery notes and primary-source context; none identifies an existing standalone RCC record. Both
  other checkouts returned no matches including ignored and hidden files. Semantic matching covered 45
  AIO and 241 native definitions, all read; unchanged definitions were byte-compared with the preceding
  full assessment. 10 full annotated AIO node/edge/generated contexts and 4 full native records were inspected.
  Retain robust graph-coupled optimization of moving observation representatives followed by connectivity
  extraction. It differs from fixed exemplar mixture weights, mean-shift density modes, fixed-K centroid
  reassignment and reciprocal-neighbor tree construction. RCC-DR adds sparse representation learning and
  remains a distinct lead.
definition_evidence:
- source_id: rcc2017
  locator: Formulation and Optimization, PDF pp.1–3; Algorithm1; SI Methods, PDF p.7
  relation: supports
claims:
- claim_id: robust-representative-objective
  kind: mechanism
  statement: For observations x_i and representatives u_i initially equal to x_i, minimize one half of
    the summed squared data residuals plus lambda/2 times the weighted graph-edge penalties rho(||u_p-u_q||).
    The demonstrated Geman–McClure penalty is rho(y)=mu*y^2/(mu+y^2), with mu>0. Its influence decreases
    for sufficiently large separations, allowing weak intergroup connections to contribute less than under
    a quadratic attraction penalty.
  evidence:
  - source_id: rcc2017
    locator: Formulation, PDF pp.1–2, Equations1–4
    relation: supports
- claim_id: neighborhood-and-degree-weights
  kind: mechanism
  statement: The paper constructs a mutual k-nearest-neighbor graph and augments it with a spanning tree
    of the k-nearest-neighbor graph. Its reported setting uses k=10 and cosine similarity for neighbor
    selection; an edge weight is average node degree divided by the geometric mean of its endpoint degrees.
    These graph choices and weights are separate from Euclidean representative differences in the objective.
    The pinned Python graph builder computes batched pair distances and partial neighbor sorting; it is
    not the approximate-neighbor implementation described in the paper.
  evidence:
  - source_id: rcc2017
    locator: SI Methods, Connectivity Structure and Implementation, PDF p.7, EquationS1
    relation: supports
  - source_id: rcc-graph
    locator: Toolbox/edgeConstruction.py, lines91–139,142–180
    relation: supports
- claim_id: line-process-and-linear-solve
  kind: mechanism
  statement: 'Introduce a nonnegative line variable l for each edge. For fixed representatives, its minimizing
    value is (mu/(mu+||u_p-u_q||^2))^2. For fixed line variables, representatives solve a weighted graph-Laplacian
    linear system: using columns for observations, U(I+lambda*A)=X. With nonnegative edge weights and
    lambda>=0, I+lambda*A is positive definite. These exact block subproblems do not establish a global
    optimum of the nonconvex joint objective or certify approximate numerical solves.'
  evidence:
  - source_id: rcc2017
    locator: Optimization, PDF pp.2–3, Equations2,4–8
    relation: supports
  - source_id: rcc-matlab
    locator: RCC.m, lines70–84,116–128
    relation: supports
- claim_id: continuation-and-stopping
  kind: scope
  statement: 'The method uses graduated nonconvexity: reduce the robust scale mu during optimization and
    update lambda using the ratio of data and graph spectral norms. Changing these parameters changes
    the objective, so fixed-objective descent cannot be transferred silently to the whole schedule. The
    printed loop condition combines small objective change with an iteration condition using OR; the pinned
    MATLAB implementation instead uses a bounded for-loop and explicit continuation or break decisions.
    The code initializes mu from the maximum retained edge length, whereas the supplementary description
    uses the median.'
  evidence:
  - source_id: rcc2017
    locator: Optimization and Algorithm1, PDF p.3; SI Methods, PDF p.7
    relation: supports
  - source_id: rcc-matlab
    locator: RCC.m, lines37–56,68–103
    relation: supports
- claim_id: thresholded-component-extraction
  kind: mechanism
  statement: Final labels are connected components after comparing representative distances with an edge-derived
    threshold; the number of clusters is not an input to the RCC objective. The supplement describes pairwise
    threshold connectivity, while the pinned assignment routine tests only the supplied original graph
    edges. The implementation also filters near-duplicate edges when deriving thresholds and distinguishes
    a capped scale sample from the uncapped one-percent threshold sample. These conventions can change
    the resulting partition and are not asserted to be equivalent.
  evidence:
  - source_id: rcc2017
    locator: Algorithm1, PDF p.3; SI Methods, Initialization and Output, PDF p.7
    relation: supports
  - source_id: rcc-matlab
    locator: RCC.m, lines37–48,108–111
    relation: supports
  - source_id: rcc-assignment
    locator: assignment.m, lines1–13
    relation: supports
- claim_id: variant-and-implementation-scope
  kind: scope
  statement: RCC-DR jointly learns a sparse low-dimensional representation and clustering and is a distinct
    extension, not an alias for the base RCC procedure. The author README distinguishes the released MATLAB
    accuracy implementation from a faster C++ implementation used for reported runtime measurements. Those
    measurements and the extension’s results are not transferred to this base record.
  evidence:
  - source_id: rcc2017
    locator: Joint Clustering and Dimensionality Reduction, PDF pp.3–4; Experiments, PDF pp.4–5
    relation: supports
  - source_id: rcc-readme
    locator: Introduction and MATLAB-versus-C++ implementation note
    relation: supports
