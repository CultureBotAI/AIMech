  rationale: RCC constructs groups from observation features and graph relationships. The AIO target denotes
    the task; this relation does not equate the algorithm with a task or assert an upstream subclass.
limitations:
- The nonconvex objective, continuation, graph construction and threshold extraction each impose scope
  boundaries. Neither an exact fixed-line solve nor a decreasing fixed-parameter block step proves a globally
  optimal partition.
- The released MATLAB solver uses PCG tolerance1e-2 and at most100 iterations per feature, and discards
  its returned status. Static inspection does not certify numerical convergence or exact monotonicity.
- Zero graph norms, too few retained nonduplicate edges, disconnected neighbor graphs and unexpected index
  conventions require separate handling. The pinned MATLAB code initializes edge endpoint variables only
  when the input edge list has minimum index zero; generic one-based input is not certified.
- The paper and inspected implementation differ in robust-scale initialization, threshold sampling, output
  edge scope and neighbor-search implementation. No single default configuration is silently attributed
  to both.
- Finite curator arithmetic checks20 line-process cases and81 two-point fixed-parameter updates, plus
  a constructed difference between all-pair and original-edge extraction. The extraction example is not
  claimed to arise during an author RCC run.
- The published evaluations include dataset-specific preprocessing and parameter selection. In particular,
  graph preprocessing for text datasets uses a PCA dimension equal to the number of ground-truth classes;
  this does not establish a wholly label-independent benchmark pipeline.
- All11 pages of the author-hosted main paper and supplement and the cited pinned source files were read.
  No author code, data, training, MATLAB/C++ execution or benchmark replication was performed; external
  solver internals and evaluation utilities were not audited.
