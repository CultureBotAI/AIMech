name: Robust adaptive Metropolis
definition: An adaptive random-walk Metropolis algorithm that updates the proposal shape factor by a rank-one
  transformation driven by the proposal direction and the difference between its acceptance probability
  and a chosen target rate.
concept_kind: algorithm
identity_notes: This is Vihola’s RAM update, which avoids estimating the target covariance. It differs
  from covariance-based adaptive Metropolis, scale-only adaptation and a fixed random-walk kernel. RAM
  here denotes this sampler, not computer memory. The history-dependent state sequence is not assumed
  to be a homogeneous Markov chain. No normalized match was found across all 442 pinned AIO labels/scoped
  synonyms and 175 prior native IDs/names/aliases. Full-checkout searches included ignored and hidden
  files in both worktrees; the only text hit was an unrelated installed-package checksum substring. Existing
  general Metropolis-Hastings, Metropolis-within-Gibbs and random-walk records were inspected to resolve
  these specialization boundaries.
limitations:
- Spherical continuous proposals make U=0 a null event; numerical implementations still need a zero-norm
  guard and stable factor updates.
- Positive definiteness of each update does not prove long-run stability. The source’s strong-law result
  assumes target/proposal regularity and step-size conditions and holds on an event where shape eigenvalues
  stay bounded away from zero and infinity.
- The paper explicitly leaves unrestricted stability unproved. Enforcing fixed eigenvalue bounds by rejecting
  a proposed shape update is a separate safeguard that can alter the limiting shape.
- A chosen acceptance rate is a tuning target, not a universal optimum or convergence diagnostic. Strong
  multimodality can remain difficult; no benchmark or arbitrary-heavy-tail convergence guarantee is asserted.
- The exact inspected arXiv v2 bytes have a later title-page footer date. This record does not claim to
  have inspected the later journal version.
