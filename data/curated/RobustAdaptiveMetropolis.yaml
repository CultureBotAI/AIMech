claims:
- claim_id: method
  kind: mechanism
  statement: Let q be a spherical density, S a lower-triangular factor with positive diagonal, x satisfy
    pi(x)>0, eta_n lie in (0,1] and decay to zero, and alpha_star lie in (0,1). Draw U from q and propose
    y=x+S U. Set alpha=min(1,pi(y)/pi(x)), accept y with this probability or retain x. Whether accepted
    or rejected, choose the next positive-diagonal Cholesky factor S_new satisfying S_new S_new^T=S[I+eta_n(alpha−alpha_star)UU^T/||U||²]S^T.
    The update uses the acceptance probability, not the binary acceptance outcome; the normalized direction
    U determines the rank-one adjustment. It expands that component when alpha exceeds the target and
    contracts it when alpha is smaller.
