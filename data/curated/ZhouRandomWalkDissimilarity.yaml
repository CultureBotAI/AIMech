aio_mappings:
- target: AIO:MathematicalFunction
  relation: broad_match
  rationale: The local concept assigns a nonnegative number to a graph and an adjacent vertex pair using
    an explicit equation. AIO MathematicalFunction is the broader rule-to-value class; the local identity
    is a functional rather than a particular solver.
- target: AIO:MarkovChain
  relation: related_match
  rationale: The compared profiles are mean passage times of a specified Markov walk. This relates the
    pairwise functional to its generating process, without asserting process equivalence or inheriting
    the target’s Network/hidden-layer context.
limitations:
- The maintained identity is the adjacent-pair dissimilarity functional, not the complete threshold hierarchy,
  attractor communities, a learned graph representation or a node centrality.
- N>2 and connected positive-strength input are explicit. Disconnected cross-component passage, zero denominators
  and directed generalizations are outside scope.
- The source denominator is outside the radical. Numerical thresholds cannot be copied from a root-mean-square
  convention without rescaling.
- Tie policy, friendless vertices, exhausted thresholds and synchronous reassignment termination require
  separate algorithm assessment. The finite cycling example preserves the source’s simultaneous update
  rule.
- All ten source pages were read as text, with the defining equation and algorithm steps inspected visually;
  other displays remain text-only. No author code, raw benchmark replication, journal-byte equivalence
  or biological hypothesis validation. DRAFT remains.
