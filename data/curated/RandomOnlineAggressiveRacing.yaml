claims:
- claim_id: method
  kind: mechanism
  statement: Initialize by evaluating the default configuration or a random setting when a default is
    unavailable. Supply uniformly random configurations to the intensification routine; the nominal model
    is constant and unused for proposing them. Add an incumbent evaluation, subject to the maximum-run
    cap, on an instance with the fewest incumbent runs and a random seed. Evaluate a challenger on a subset
    of the incumbent’s instance/seed pairs and compare their empirical costs on exactly those pairs. Reject
    a worse challenger; otherwise enlarge its tested subset in doubling batches until it has covered the
    incumbent’s available runs, then replace the incumbent when the challenger remains at least as good.
    Continue proposing random challengers within the configuration budget.
