name: Random Online Aggressive Racing
definition: An algorithm-configuration procedure that proposes uniformly random parameter settings and
  compares each challenger with an incumbent through adaptive evaluations on shared problem instances
  and random seeds, without fitting a predictive performance model.
concept_kind: algorithm
identity_notes: The 2011 source expands ROAR as Random Online Adaptive Racing in its introduction and
  Random Online Aggressive Racing in Section3. Both wordings here refer to that source’s same method.
  It shares SMAC’s intensification procedure but omits SMAC’s random-forest surrogate and acquisition-guided
  proposals. It differs from fixed-evaluation random search and significance-based elimination in F-Race.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 265 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 20 lines in the worktree and 25 in main. These were prior candidate
  leads, source references, neighboring-method mentions and five unrelated ROAR namespace entries in ignored
  dependencies, not existing records for these identities. Seven exact AIO CLASS nodes with synonyms and
  outgoing edges and six neighboring native mechanisms were inspected. Absence is bounded to this snapshot
  and semantic neighborhood.
limitations:
- Aggressive racing in this source makes empirical decisions without waiting for a statistical significance
  threshold. An early rejection can discard a configuration with better expected performance; no family-wise
  error control or finite-budget optimum is claimed.
- The shared intensification routine caps incumbent runs at maxR=2000. Its time-budget early-exit guard
  requires i>=2, but ROAR supplies one challenger per call, so the proposal loop ends after that one challenger;
  the guard is not a mandatory two-challenger minimum for ROAR. The paper’s asymptotic discussion assumes
  consistent estimation and unbounded evaluation growth in a finite configuration space, which are not
  automatic properties of the capped practical routine.
- The original procedure lacks adaptive capping of individual poor runs. Uniform configuration proposals
  do not mean equal allocation of evaluations to every configuration. No implementation or benchmark outcome
  was reproduced.
