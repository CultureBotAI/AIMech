- claim_id: marcenko-pastur-median-noise-adaptation-and-haar-universality
  kind: scope
  statement: When the noise level sigma > 0 is unknown in Y_n = X_n + sigma Z_n / sqrt(n), estimating sigma via the rescaled empirical median singular value hat_sigma(Y_n) = y_{med} / sqrt(n mu_beta), where mu_beta is the median of the Marcenko-Pastur distribution on [(1 - sqrt(beta))^2, (1 + sqrt(beta))^2], and applying hat_X(Y_n) = sqrt(n) hat_sigma(Y_n) hat_X_{eta^*}(Y_n / (sqrt(n) hat_sigma(Y_n))) achieves the exact known-sigma optimal asymptotic loss almost surely for every continuous optimal shrinker eta^*; moreover, under non-Gaussian white noise with E[Z_{i,j}] = 0, E[Z_{i,j}^2] = 1, and E[Z_{i,j}^4] < infty, the same optimal shrinkers and asymptotic losses hold whenever the signal singular vectors are Haar-distributed.
  evidence:
