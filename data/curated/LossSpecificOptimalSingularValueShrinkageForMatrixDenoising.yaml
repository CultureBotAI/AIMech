id: AIMech:LossSpecificOptimalSingularValueShrinkageForMatrixDenoising
name: Loss-Specific Optimal Singular Value Shrinkage for Low-Rank Matrix Denoising
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Optimal Shrinkage of Singular Values
- Gavish-Donoho Optimal Singular Value Shrinker
- Frobenius-Optimal Singular Value Shrinkage
- Nuclear-Norm-Optimal Singular Value Shrinkage
- Schatten-p Optimal Singular Value Shrinkage
definition: Loss-specific optimal singular value shrinkage is a high-dimensional matrix denoising methodology for recovering a fixed-rank signal matrix X_n = sum_{i=1}^r x_i u_{n,i} tilde_u_{n,i}' in R^{m_n x n} from noisy observations Y_n = X_n + sigma Z_n / sqrt(n) under aspect ratio m_n / n -> beta in (0, 1] via equivariant estimators hat_X_eta(Y_n) = sum_{i=1}^{m_n} sigma * eta(y_{n,i} / sigma) v_{n,i} tilde_v_{n,i}'. Using separate Gram-Schmidt orthonormalizations of the left and right population and empirical singular vectors, the framework simultaneously block-diagonalizes X_n and hat_X_eta(Y_n) into r independent 2 x 2 elementary rank-1 pairs (A(x_i), B(eta(y_i), x_i)) determined by the asymptotic singular value map y(x) = sqrt((x + 1/x)(x + beta/x)) and left/right singular vector cosines c(x) = sqrt((x^4 - beta)/(x^4 + beta x^2)) and tilde_c(x) = sqrt((x^4 - beta)/(x^4 + x^2)) for x >= beta^{1/4}, yielding unique admissible shrinkers that minimize asymptotic Frobenius, operator, nuclear, and general Schatten-p norm losses.
identity_notes: Checked against all 442 pinned AIO concepts and 647 maintained AIMech concepts. Distinct from AIMech:OptimalSingularValueHardThresholdingAtFourOverSqrtThree (Gavish & Donoho 2014, which restricts the estimator to discontinuous hard truncation 1(y >= tau_*) y with worst-case square-matrix AMSE 3 r sigma^2, whereas Gavish & Donoho 2017 optimize over all continuous and discontinuous univariate singular value shrinkers eta(y) across general orthogonal-invariant losses, achieving worst-case square-matrix AMSE 2 r sigma^2 via eta_fro^*(y) = sqrt((y^2 - 4)_+) and deriving distinct closed-form nuclear-norm and operator-norm shrinkers); distinct from AIMech:LossSpecificOptimalEigenvalueShrinkageForSpikedCovarianceMatrices (Donoho, Gavish, & Johnstone 2018, which shrinks sample covariance eigenvalues toward a positive bulk baseline 1 using a single symmetric QR basis W_n and identical left/right eigenvector cosines c(ell), whereas Gavish & Donoho 2017 shrink rectangular matrix singular values toward 0 using distinct left and right Gram-Schmidt orthogonal bases W_n, tilde_W_n and asymmetric left/right singular vector cosines c(x) != tilde_c(x)); and distinct from AIMech:SingularValueThresholdingForMatrixCompletion (Cai, Candes, & Shen 2010, iterative soft thresholding for incomplete matrix completion).
