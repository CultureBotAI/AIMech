    relation: supports
- claim_id: closed-form-frobenius-nuclear-operator-and-schatten-shrinkers
  kind: scope
  statement: 'For the elementary 2 x 2 difference matrix Delta(eta, x) = B(eta, x) - A(x) with squared Frobenius norm t(eta) = eta^2 + x^2 - 2 x eta c(x) tilde_c(x) and determinant d(eta) = -x eta s(x) tilde_s(x) = -eta sqrt(beta) / x, the singular values are sigma_pm(eta, x) = (1/2)(sqrt(t - 2d) pm sqrt(t + 2d)), yielding unique closed-form shrinkers for y > 1 + sqrt(beta): (i) Frobenius norm loss eta_fro^*(y) = x(y) c(x(y)) tilde_c(x(y)) = (1/y) sqrt((y^2 - beta - 1)^2 - 4 beta) (which reduces to sqrt((y^2 - 4)_+) at beta = 1 with worst-case AMSE 2 r versus 3 r for optimal hard thresholding and 6 r for optimal soft thresholding); (ii) nuclear norm loss eta_nuc^*(y) = x(y)(c(x) tilde_c(x) - s(x) tilde_s(x))_+ = ((x^4 - beta - sqrt(beta) x y)_+) / (x^2 y), which threshold-eliminates supercritical singular values on [1 + sqrt(beta), y(x_0)] where x_0^4 = beta + sqrt(beta) x_0 y(x_0); and (iii) operator norm loss eta_op^*(y) = x(y) = sqrt((y^2 - beta - 1 + sqrt((y^2 - beta - 1)^2 - 4 beta))/2) at beta = 1 (and exact 2 x 2 stationary root z_1(x, beta) x(y) < x(y) of c tilde_c z^2 + (s^2 tilde_s^2 - c^2 tilde_c^2 - 1) z + c tilde_c = 0 for 0 < beta < 1).'
