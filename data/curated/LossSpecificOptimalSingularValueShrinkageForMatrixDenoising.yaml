limitations:
- For discontinuous optimal shrinkers such as operator-norm shrinkage (Section 6.2) and Schatten-p quasi-norm shrinkage with 0 < p < 1 (Section 7), sample singular values near the discontinuity point fluctuate across the jump with positive probability; achieving well-defined asymptotic loss requires zeroing out a diminishing boundary neighborhood [1 + sqrt(beta), 1 + sqrt(beta) + a_n] with a_n -> 0 and a_n n^{2/3} -> infty above the Tracy-Widom fluctuation scale.
- In the strictly rectangular case 0 < beta < 1, the paper's closed-form operator-norm shrinker eta_op^*(y) = x(y) (Eq. 9 and Section 6.2 Eq. 48) relies on the square-matrix identity c(x) tilde_c(x) + s(x) tilde_s(x) = 1; for 0 < beta < 1, c(x) != tilde_c(x) and the exact 2 x 2 operator-norm minimizer is the smaller root z_1(x, beta) x(y) < x(y) of c tilde_c z^2 + (s^2 tilde_s^2 - c^2 tilde_c^2 - 1) z + c tilde_c = 0.
- Requires a fixed low rank r << min(m_n, n) and isotropic (or variance-stabilized) noise; when the signal rank grows proportionally with n (r_n / m_n -> rho > 0) or noise has correlated rows/columns, the rank-r 2 x 2 decoupling no longer directly applies.
- 'Primary-source typographical audit of arXiv:1405.7511v3 (DOI:10.1109/TIT.2017.2653801): (1) on p. 13 (Lemma 4, Eq. 24, and Corollary 1), the cross-term writes eta(y_{n,i}) instead of eta(y_{n,j}) in 2 sum_{i,j=1}^r x_i eta(y_{n,j}) <u_{n,i}, v_{n,j}><tilde_u_{n,i}, tilde_v_{n,j}>; (2) on p. 19 (Section 5.2, Eqs. 39-40 and the display below), ''W'' X W = [diag(x_1, ..., x_r) oplus I_r] oplus I_{m-2r}'' and ''W'' hat_X_eta(Y) W = R_n oplus I_{n-2r}'' write W on the right instead of tilde_W, write identity blocks I_r, I_{m-2r}, I_{n-2r} instead of zero blocks 0_r, 0_{m-2r x n-2r} (cf. Eqs. 33-36 on p. 18), and write c_1, s_1, tilde_c_1, tilde_s_1 instead of c_i, s_i, tilde_c_i, tilde_s_i; (3) on p. 23 (Section 6.3), ''dt/d(eta) - dd/d(eta) = 0'' omits the factor 2 on dd/d(eta) in d(t - 2d)/d(eta) = 0; (4) on p. 24 (Section 6.3, lines 6-7), ''recovering the optimal shrinker (9). Inspection of (9) reveals...'' cites (9) instead of (10); and (5) on p. 27 (Section 8.1, display below Eq. 51), the Marcenko-Pastur density integral writes sqrt((beta_+ - t)(t - beta_-)) / (2 pi t) omitting beta in 2 pi beta t and defines beta_pm = 1 pm sqrt(beta) instead of (1 pm sqrt(beta))^2, while on pp. 30-31 (Figures 6-7 captions), hat_X_{lambda_*} and hat_X_{s_*} are swapped.'
