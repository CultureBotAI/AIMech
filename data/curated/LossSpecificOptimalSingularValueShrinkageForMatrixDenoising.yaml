claims:
- claim_id: simultaneous-left-right-2x2-gram-schmidt-block-decomposition
  kind: mechanism
  statement: For an m_n x n observation matrix Y_n = X_n + Z_n / sqrt(n) with aspect ratio m_n / n -> beta in (0, 1] and rank-r signal X_n = sum_{i=1}^r x_i u_{n,i} tilde_u_{n,i}', separate Gram-Schmidt orthonormalizations of the left singular vectors (u_1, ..., u_r, v_1, ..., v_{m-r}) into W and right singular vectors (tilde_u_1, ..., tilde_u_r, tilde_v_1, ..., tilde_v_{m-r}) into tilde_W simultaneously reduce W' X_n tilde_W and W' hat_X_eta(Y_n) tilde_W to direct sums of r elementary 2 x 2 blocks A(x_i) = [[x_i, 0], [0, 0]] and B(eta(y(x_i)), x_i) = eta(y(x_i)) [[c(x_i) tilde_c(x_i), c(x_i) tilde_s(x_i)], [s(x_i) tilde_c(x_i), s(x_i) tilde_s(x_i)]], where y(x) = sqrt((x + 1/x)(x + beta/x)), c(x) = sqrt((x^4 - beta)/(x^4 + beta x^2)), and tilde_c(x) = sqrt((x^4 - beta)/(x^4 + x^2)) for x >= beta^{1/4}; for any orthogonal-invariant sum- or max-decomposable loss L_{m,n} and shrinker vanishing on [0, 1 + sqrt(beta)], the asymptotic loss decouples into sum_{i=1}^r L_{2,2}(A(x_i), B(eta(y(x_i)), x_i)) or max_{1 <= i <= r} L_{2,2}(A(x_i), B(eta(y(x_i)), x_i)).
  evidence:
