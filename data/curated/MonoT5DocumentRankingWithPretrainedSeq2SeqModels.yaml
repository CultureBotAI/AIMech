claims:
- claim_id: monot5-two-token-target-logit-softmax-mechanism
  kind: mechanism
  statement: 'MonoT5 formats each query q and document d into the sequence-to-sequence prompt ''Query: q Document: d Relevant:'' (Eq. 1), trains a T5 encoder-decoder to emit single SentencePiece tokens ''true'' or ''false'', and at inference time normalizes exclusively over the two target logits (z_true, z_false) via softmax rather than raw logits or full-vocabulary softmax; for full-length documents exceeding 512 tokens, it segments documents into overlapping 10-sentence sliding windows (stride 5) and selects the maximum passage relevance probability.'
  evidence:
  - source_id: r787-primary-pdf
    locator: Section 2, Equation (1), p. 2; Section 3.2, p. 3
    relation: supports
  - source_id: r787-primary-pdf
    locator: format_monot5_prompt, monot5_relevance_prob, and maxp_document_prob verification
    relation: supports
- claim_id: monot5-zero-shot-and-low-data-regime-scope
  kind: scope
  statement: Because MonoT5 reuses the pretrained sequence-to-sequence output generation head rather than learning a randomly initialized [CLS] linear layer from scratch, it achieves superior data efficiency in low-resource regimes (reaching ~45% of full-data gain over BM25 with only 2k training examples where BERT-base underperforms BM25) and state-of-the-art zero-shot transfer on TREC Robust04.
  evidence:
  - source_id: r787-primary-pdf
    locator: Section 4.1-4.3, Tables 1-4, pp. 3-7
    relation: supports
- claim_id: monot5-single-token-target-word-and-length-limitation
  kind: limitation
  statement: MonoT5 requires target relevance labels that tokenize into single SentencePiece tokens (or else requires multi-subword logit aggregation), degrades severely if mapped to semantically meaningless subword targets ('_ab' vs '_de') in low-data regimes, and incurs high computational cost for large encoder-decoder backbones (e.g., T5-3B) with a 512-token input window.
  evidence:
  - source_id: r787-primary-pdf
    locator: Section 2, p. 2; Section 3.2, p. 3; Section 4.3, Table 4, pp. 6-7
    relation: supports
