id: AIMech:MonoT5DocumentRankingWithPretrainedSeq2SeqModels
name: 'MonoT5: Document Ranking with a Pretrained Sequence-to-Sequence Model'
concept_kind: algorithm
review_status: DRAFT
definition: 'A sequence-to-sequence pointwise document and passage reranking method (Nogueira, Jiang, Pradeep, & Lin, Findings of EMNLP 2020) that formats each query-document pair as the text prompt ''Query: q Document: d Relevant:'', fine-tunes a pretrained encoder-decoder Transformer (T5) to generate single-token relevance target words (''true'' for relevant, ''false'' for non-relevant), and computes the candidate''s relevance score at inference time by applying a softmax exclusively over the first-step decoder logits of the ''true'' and ''false'' tokens: P(Relevant=1 | q, d) = exp(z_true) / (exp(z_true) + exp(z_false)).'
identity_notes: Distinct from encoder-only classification-based rerankers such as monoBERT (which attach a randomly initialized linear classification head to the [CLS] token representation) and pairwise rerankers such as duoBERT (AIMech:DuoBERTMultiStageDocumentRankingWithBERT). By mapping relevance decisions onto pretrained single-token vocabulary logits ('true' and 'false') via the T5 language modeling head, MonoT5 exploits latent semantic and polarity knowledge from pretraining, yielding substantially higher data efficiency in low-resource regimes.
aliases:
- MonoT5 Pointwise Sequence-to-Sequence Reranker
- T5 Target-Word Generation Document Ranking
- Sequence-to-Sequence Target-Word Relevance Ranking
