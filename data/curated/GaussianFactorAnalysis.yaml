claims:
- claim_id: latent-covariance
  kind: mechanism
  statement: In column-vector notation, let y=mu+Wz+epsilon, z~Normal(0,R) with positive-definite R, and
    independent epsilon~Normal(0,Psi), where Psi is diagonal and nonnegative. Then y has covariance C=WRW^T+Psi.
    The residual coordinates are conditionally independent given z; observed coordinates are generally
    dependent. R is often fixed to identity. Unlike isotropic-noise PPCA, the uniqueness variances can
    differ by observed variable, and the loading span need not be the leading covariance eigenspace.
  evidence:
  - source_id: method-source
    locator: Section 2, pp. 731-732 / PDF pp. 3-4; Section 4 joint Gaussian distribution, p. 735 / PDF
      p. 7; curator two-dimensional covariance comparison
    relation: supports
- claim_id: conditional-latent-moments
  kind: mechanism
  statement: For nonsingular C, the conditional factor mean is R W^T C^(-1)(y-mu), and its covariance
    is R-RW^T C^(-1)WR. Complete-data EM uses these first moments and second moments, including the posterior
    covariance. It updates allowed loading coefficients through expected Gaussian regression sufficient
    statistics and uniqueness variances through expected residual squares. Replacing missing factors by
    their means while discarding posterior uncertainty is not this EM procedure.
  evidence:
  - source_id: method-source
    locator: Section 3, E-step and M-step, pp. 732-733 / PDF pp. 4-5; Section 4, p. 735 / PDF p. 7; column-vector
      translation and curator moment/EM calculations
    relation: supports
- claim_id: identifiability-and-boundaries
  kind: limitation
  statement: With R fixed to identity and unrestricted loadings, an orthogonal rotation of the latent
    coordinates changes W without changing WW^T. Further loading/uniqueness nonidentifiability can remain
    in underspecified models, including constrained examples. A zero uniqueness variance is a parameter
    boundary; it does not alone imply singular marginal covariance, because latent contributions can supply
    that direction. Positive-definite observed covariance and the specified parameter constraints must
    be checked separately.
  evidence:
  - source_id: method-source
    locator: Section 2 identifiability discussion, p. 732 / PDF p. 4; Section 5.2, pp. 742-745 / PDF pp.
      14-17; curator rotation and zero-uniqueness covariance examples
    relation: supports
- claim_id: fitting-and-missingness
  kind: scope
  statement: EM can progress so slowly that an apparent plateau is not convergence. The paper’s ECME alternative
    updates loadings using expected complete-data likelihood, then updates uniqueness variances using
    actual observed likelihood; its Newton steps must be checked for an increase. Missing observed coordinates
    can be integrated using Gaussian conditional first and second moments and observed covariance submatrices.
    The demonstrated incomplete-data likelihood assumes an ignorable missingness mechanism. Neither EM
    nor the examples establish global optimality, universal speed improvement or applicability to arbitrary
    missingness.
  evidence:
  - source_id: method-source
    locator: Sections 3-4, pp. 733-737 / PDF pp. 5-9; Sections 5.1-5.2 and practical conclusion, pp. 738-745
      / PDF pp. 10-17, especially the missingness assumption on p. 740
    relation: supports
limitations:
- Latent dimension, covariance constraints and loading restrictions are part of model specification. Gaussianity
  and conditional residual independence can be misspecified; fitted factors are not automatically causal,
  unique or biologically meaningful.
- Nonnegative uniqueness and positive-definite marginal covariance are different conditions. Log-variance
  parameterization remains strictly positive at finite coordinates; exact zero is a boundary limit.
- This record uses the fully inspected Liu-Rubin 1998 primary follow-up. The Rubin-Thayer 1982 full-text
  request returned HTTP 401; it was not bypassed or treated as read. The 1983 critique remains abstract-level
  context, not a fully reviewed proof about all stationary points.
- All 19 source pages were read. Finite calculations check Gaussian conditioning, inclusion of posterior
  variance, one EM improvement, rescaling and zero-uniqueness boundaries. Source tables have inconsistent
  example labels and an apparent observation-count discrepancy; those labels/counts are not asserted here.
  Historical fits and software were not reproduced.
