name: Gaussian Factor Analysis
aliases:
- Linear Gaussian Factor Analysis
concept_kind: model_family
definition: A linear Gaussian latent-variable model in which observed variables share a lower-dimensional
  Gaussian factor and have conditionally independent residuals with variable-specific nonnegative variances.
identity_notes: This record covers the normal linear factor model with diagonal uniqueness covariance.
  It does not encompass arbitrary non-Gaussian, nonlinear, nonnegative or count-data factor models. PPCA
  adds an isotropic uniqueness restriction; EM and ECME are fitting procedures for the factor model, not
  model synonyms. Confirmatory zero-loading constraints and exploratory rotations require explicit identifiability
  assessments. Three candidate identities were compared against all 442 pinned AIO IDs, labels and scoped
  synonyms and 460 preceding native IDs, names and aliases, with no normalized collision. Ignored- and
  hidden-inclusive full-text searches of both checkouts returned the same 144 matching lines across 34
  files. Every matched passage was read, comprising 83 unique excerpts; long serialized web captures were
  inspected around each match with 220-character flanks, not reread in full. Matches are discovery leads,
  PPCA distinctions, historical reviews and PLSA/count-factorization references, not existing candidate
  records. All 222 semantic label/synonym rows were read. Twenty-six annotated AIO nodes and outgoing
  edges comprise 22 byte-verified prior readings and 4 current complete readings. Thirty-six contextual
  YAMLs comprise 29 unchanged prior readings and 7 current complete readings, including ten native neighbors.
  This is a bounded snapshot/corpus assessment.
