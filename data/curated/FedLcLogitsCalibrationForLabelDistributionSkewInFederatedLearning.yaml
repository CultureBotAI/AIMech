claims:
- claim_id: r453-minority-gradient-reversal-and-calibrated-softmax-mechanism
  kind: mechanism
  statement: Proves in Theorem 1 that under standard local cross-entropy training on skewed client label counts n_j >> n_r, the minority-class linear classifier update Delta w_r satisfies E[Delta w_r^T h^{(r)}] < 0 whenever correlated majority classes dominate the negative gradient push, and proves in Theorem 3 that subtracting tau * n_i^{-1/4} from each class logit i in L_cal (Equation 6) multiplies the gradient suppression ratio D_{j,r} by exp(tau * (n_r^{-1/4} - n_j^{-1/4})) > 1 (Equation 8) to restore E[Delta w_r^T h^{(r)}] >= 0.
  evidence:
  - source_id: r453-primary-pdf
    locator: Section 3.3 Theorem 1 & Section 4.1 Equations 6-8, Theorems 2-3, pp. 3-6
    relation: supports
- claim_id: r453-classifier-and-feature-deviation-reduction-scope
  kind: scope
  statement: Simultaneously reduces both client-to-oracle classifier weight deviation (Definition 1) and feature extractor representation deviation (Definition 2) during local client updates without transmitting any auxiliary parameters, class histograms, or proxy features to the server.
  evidence:
  - source_id: r453-primary-pdf
    locator: Section 3.2 Definitions 1-2 & Section 4.2 Discussions, pp. 2-6
    relation: supports
- claim_id: r453-zero-count-missing-class-and-tau-tuning-limitation
  kind: limitation
  statement: Requires positive local class sample counts n_i > 0 (or Laplace smoothing / clamping when a client has zero samples for a class n_i = 0 so n_i^{-1/4} remains finite) and tuning of the calibration scale hyperparameter tau.
  evidence:
  - source_id: r453-primary-pdf
    locator: Section 4.1 Equation 6 & Section 5.3 Sensitivity of Hyperparameter tau, pp. 4-8
    relation: supports
- claim_id: r453-label-skew-and-long-tailed-federated-classification-application
  kind: application
  statement: Applied to federated image classification under Dirichlet label distribution skew and globally long-tailed federated benchmarks (CIFAR-10/100-LT, ImageNet-LT, iNaturalist).
  evidence:
  - source_id: r453-primary-pdf
    locator: Section 5 Experiments (Tables 1-5, Figures 4-6), pp. 6-8
    relation: supports
