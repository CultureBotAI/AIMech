id: AIMech:FedLcLogitsCalibrationForLabelDistributionSkewInFederatedLearning
name: FedLC (Federated Learning via Logits Calibration for Label Distribution Skew)
concept_kind: algorithm
review_status: DRAFT
definition: 'A label-skew-calibrated federated learning algorithm (Zhang et al. 2022, Sections 3-4, Definitions 1-3, Theorems 1-3, Equations 1-8) that mitigates minority-class classifier collapse and local feature deviation under non-IID label distribution skew by calibrating each client''s predicted logits before computing the local softmax cross-entropy loss using a pairwise label margin Delta(n_y, n_i) proportional to the inverse fourth root of the client''s local class sample counts: L_cal(y; f(x)) = -log(exp(f_y(x) - tau * n_y^{-1/4}) / sum_i exp(f_i(x) - tau * n_i^{-1/4})) (Equation 6).'
identity_notes: Distinct from centralized Logit Adjustment (AIMech:LogitAdjustmentForLongTailedClassification, Menon et al. 2021), which shifts logits by log pi_y to achieve Fisher consistency for balanced error on a single centralized long-tailed dataset; FedLC derives a client-specific pairwise margin tau * n_y^{-1/4} from the Rademacher-complexity generalization bound across heterogeneous federated clients and proves via Theorem 3 that it enlarges the majority-to-minority gradient ratio D_{j,r} by exp(tau*(n_r^{-1/4} - n_j^{-1/4})) > 1 to prevent local minority-class weight Updates Delta w_r from having negative inner product with minority representations h^{(r)}.
aliases:
- FedLC
- Federated Learning via Logits Calibration
- FedLC Logits Calibration
