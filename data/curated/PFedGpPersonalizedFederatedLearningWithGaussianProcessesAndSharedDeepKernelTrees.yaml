claims:
- claim_id: r472-polya-gamma-gp-tree-predictive-marginal-mechanism
  kind: mechanism
  statement: "Conditioned on P\xF3lya-Gamma auxiliary variables omega_i ~ PG(1, f(x_i)), each binary GP node m in the C-class hierarchical tree yields an exact Gaussian posterior N(f_m | Sigma_m(y_m - 1/2), Sigma_m) with Sigma_m = (K_m^{-1} + diag(omega_m))^{-1}, Gaussian predictive latent distribution N(f_* | mu_*, sigma_*^2) (Equations 4-5), and factorized class probability P(y_* = c | x_*, X, y, Omega) = prod_{m in Path_c} (int Psi(f_m^*) N(f_m^* | mu_m^*, sigma_m^{*2}) df_m^*)^{y_{c,m}} (1 - int ...)^{1 - y_{c,m}} (Equation 7) (Achituve et al. 2021, Section 4.1)."
  evidence:
  - source_id: r472-primary-pdf
    locator: Sections 3.2 & 4.1 (Equations 1-7), pp. 3-5
    relation: supports
- claim_id: r472-pac-bayes-generalization-and-fitc-inducing-points-mechanism
  kind: mechanism
  statement: Theorem 1 establishes a PAC-Bayes generalization bound for each client's GP tree scales with (1 / m_i) sum_{j in Y} KL(Q_i(f_j) || P(f_j)), motivating shared deep kernel optimization via predictive marginal likelihood; pFedGP-IP-compute further replaces K_{NN} with the FITC low-rank-plus-diagonal covariance Q_{NN} + diag(K_{NN} - Q_{NN}) over M << N inducing points to achieve O(M^2 N + M^3) complexity (Achituve et al. 2021, Sections 4.2-4.3, Equations 9-14, Theorem 1).
  evidence:
  - source_id: r472-primary-pdf
    locator: Sections 4.2-4.3 (Equations 9-14, Theorem 1), pp. 5-7
    relation: supports
- claim_id: r472-uncertainty-calibrated-personalized-classification-application
  kind: application
  statement: Applied to personalized federated classification, novel-client adaptation without gradient updates, and out-of-distribution uncertainty calibration (Expected Calibration Error) on CIFAR-10, CIFAR-100, and CINIC-10 (Achituve et al. 2021, Section 5, Tables 1-4).
  evidence:
  - source_id: r472-primary-pdf
    locator: Section 5 (Experiments, Tables 1-4, Figure 2), pp. 7-9
    relation: supports
- claim_id: r472-tree-node-scaling-and-gibbs-sampling-overhead-limitation
  kind: limitation
  statement: "Requires fitting C - 1 binary GP classifiers along the class hierarchy tree and running block Gibbs sampling over P\xF3lya-Gamma variables omega_m and Gaussian latents f_m during local updates, which increases per-step computational cost when the number of classes C or local dataset size N_i is large without inducing-point approximation (Achituve et al. 2021, Sections 4.1-4.2)."
  evidence:
  - source_id: r472-primary-pdf
    locator: Sections 4.1-4.2, pp. 4-6
    relation: supports
