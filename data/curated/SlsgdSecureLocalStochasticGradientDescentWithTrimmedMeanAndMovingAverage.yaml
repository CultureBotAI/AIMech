id: AIMech:SlsgdSecureLocalStochasticGradientDescentWithTrimmedMeanAndMovingAverage
name: SLSGD Secure Local Stochastic Gradient Descent with Trimmed Mean and Moving Average
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-resilient communication-efficient distributed on-device optimization algorithm proposed by Xie, Koyejo, and Gupta (ECML-PKDD 2019) that generalizes Federated Averaging and Local SGD to non-IID data, heterogeneous local iteration counts, and data-poisoned or compromised workers by aggregating sampled local models with a coordinate-wise b-trimmed mean and updating the global model via a server-side exponential moving average.
identity_notes: 'Distinct from single-step synchronous Coordinate-Wise Median and Trimmed Mean Gradient Aggregation (AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustGradientAggregation, which aggregates single-step gradients without multi-step local SGD updates or server-side moving-average variance reduction) and from standard Federated Averaging / Local SGD (which corresponds to SLSGD Option I with b = 0 and alpha = 1). SLSGD (Xie et al., ECML-PKDD 2019, pp. 213-228 / arXiv:1903.06996, Algorithm 1, p. 6) samples a subset S_t of k workers in each global epoch t, runs H_t^i >= H_{min} heterogeneous local SGD iterations x_{t,h}^i <- x_{t,h-1}^i - gamma nabla f(x_{t,h-1}^i; z_{t,h}^i) from x_{t,0}^i = x_{t-1} on each device i in S_t, aggregates the resulting local models via coordinate-wise b-trimmed mean x_t'' = Trmean_b({x_{t,H_t^i}^i : i in S_t}) = (1 / (k - 2b)) sum_{i=b+1}^{k-b} u_{i:k} (Option II, Definition 3), and updates the global model via the moving average x_t <- (1 - alpha) x_{t-1} + alpha x_t'' (with alpha in (0, 1]).'
aliases:
- SLSGD
- Secure Local Stochastic Gradient Descent
- Secure Local SGD
