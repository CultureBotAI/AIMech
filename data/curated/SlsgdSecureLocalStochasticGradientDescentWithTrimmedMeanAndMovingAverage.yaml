claims:
- claim_id: slsgd-two-level-trimmed-mean-model-aggregation-and-moving-average-update
  kind: mechanism
  statement: 'In each global epoch t, SLSGD activates k randomly sampled devices S_t to perform H_t^i >= H_{min} local SGD steps and applies two levels of server-side defense: (1) Option II aggregates the pushed local models via the coordinate-wise b-trimmed mean x_t'' = Trmean_b({x_{t,H_t^i}^i : i in S_t}) = (1/(k-2b)) sum_{i=b+1}^{k-b} u_{i:k}, and (2) updates the global model via a moving average x_t <- (1 - alpha) x_{t-1} + alpha x_t'' that simultaneously dampens robust-aggregation error and local-update drift.'
  evidence:
  - source_id: r535-primary-pdf
    locator: Section 4, Algorithm 1, Lines 4-15 and Section 4.1, Definition 3 & Remark 2, pp. 6-7
    relation: supports
- claim_id: slsgd-non-iid-convergence-and-poisoning-error-bound-theorem
  kind: scope
  statement: Whereas standard Local SGD / FedAvg (Option I with alpha = 1) suffers unbounded expected error under model replacement by q_1 poisoned workers (Proposition 1), Theorem 2 proves that for 2q <= 2b < k and step size gamma <= min(1/L, 2), SLSGD with Option II converges on L-smooth mu-lower-bounded Taylor functions at rate (1 - alpha + alpha(1 - gamma/2)^{H_{min}})^T [F(x_0) - F(x_*)] up to an error neighborhood O(V_1) + O(beta V_2) with beta = 1 + 1/(k-q) - 1/n + k(k+b)/(k-b-q)^2.
  evidence:
  - source_id: r535-primary-pdf
    locator: Section 5.2-5.3, Theorem 1, Proposition 1, and Theorem 2, pp. 8-9, 23-28
    relation: supports
- claim_id: slsgd-per-epoch-sampled-byzantine-minority-and-trimmed-variance-limitation
  kind: limitation
  statement: SLSGD requires that the number of poisoned workers q among the k sampled devices in each epoch satisfy 2q <= 2b < k, and increasing the trimming parameter b or decreasing the moving-average weight alpha trades off convergence speed against variance and poisoning tolerance through the factor k(k+b)/(k-b-q)^2.
  evidence:
  - source_id: r535-primary-pdf
    locator: Section 5.3, Theorem 2 & Remark 5, p. 9; Section 6.3-6.5, pp. 12-15
    relation: supports
- claim_id: slsgd-on-device-federated-vision-and-language-modeling-application
  kind: application
  statement: Applied to attack-tolerant on-device distributed training of convolutional neural networks on balanced and unbalanced non-IID CIFAR-10 partitions and LSTM language models on WikiText-2 under label-flipping and label-permutation data poisoning.
  evidence:
  - source_id: r535-primary-pdf
    locator: Section 6.1-6.4, Figures 1-6, pp. 10-14; Appendix Section 8, Figures 7-13, pp. 17-23
    relation: supports
