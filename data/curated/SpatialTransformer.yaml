claims:
- claim_id: method
  kind: mechanism
  statement: A localization network reads the input tensor and predicts parameters of a configured spatial
    transformation. A grid generator applies that transformation to regular output-grid coordinates to
    obtain source sampling coordinates in the input. The paper illustrates a six-parameter 2D affine transform,
    while allowing other differentiable parameterizations. A sampler interpolates the input at the generated
    coordinates, using the same spatial warp for every channel; output height and width are configured
    separately from input size. With bilinear sampling, weighted neighboring pixels determine each output
    value and piecewise derivatives pass the task loss through the sampling coordinates and transformation
    parameters to the localization network. The module can therefore be trained jointly using the surrounding
    task objective, without requiring separate transformation labels in the source setup. Transformation
    type, localization network, sampler and placement are choices.
  evidence:
  - source_id: method-source
    locator: Section3, Equations1–7 and Figure2, PDF pp.3–5; architecture/aliasing limits Section3.4,
      PDFp.5; conclusion PDFp.8
    relation: supports
- claim_id: feature-alignment-limit
  kind: limitation
  statement: A spatial transformer that acts identically on all feature channels cannot generally align
    feature maps of a transformed image with those of the original. The later analysis identifies changes
    in channel responses and receptive-field geometry as obstacles even under ideal pose prediction. It
    distinguishes translation-covariant features and special invariant-feature cases, and does not deny
    that a network can benefit or achieve some invariant classification by other means. The broader rigorous
    proof referenced by that paper was not inspected.
  evidence:
  - source_id: invariance-analysis
    locator: SectionII including assumptions and exceptions, PDF pp.2–4; Figures1–2, PDF pp.1,3; SectionV,
      PDFp.8
    relation: supports
