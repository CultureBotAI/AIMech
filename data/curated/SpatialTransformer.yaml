name: Spatial Transformer
definition: A learnable neural-network component that predicts an input-dependent spatial transformation
  and uses the resulting sampling grid to warp an image or feature tensor.
concept_kind: layer
identity_notes: This record denotes the 2015 spatial-transformer module, composed of localization, grid
  generation and sampling. A spatial transformer network contains one or more such components; it is not
  a single fixed classifier or checkpoint. This geometric sampler is distinct from the later token-attention
  Transformer architecture and from multiplying a feature map by a spatial gate. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 282 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  2 and 2 lines respectively. Every text hit was a prior candidate lead or a closely related variant lead.
  Ten exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native neighboring
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The transformation maps output-grid coordinates to source sample locations; reversing this direction
  changes the operation. Coordinate normalization, pixel-center convention and boundary treatment must
  be specified for executable reproduction. The paper’s compact formulas are not a guarantee that every
  framework uses identical sampling conventions.
- The printed Equation6 retains sums over n,m in a derivative with respect to a particular input element
  U_nm. For a fixed element, the derivative is its own interpolation coefficient; the record follows the
  forward bilinear expression rather than copying that inconsistent displayed derivative. No author-issued
  erratum is asserted.
- Bilinear sampling is piecewise differentiable; integer nearest-neighbor sampling has zero coordinate
  derivative almost everywhere and is not interchangeable as a useful localization-gradient mechanism.
  Cropping, out-of-bounds samples and small-support downsampling can lose information or cause aliasing.
  Learnability does not guarantee a correct canonical pose or invertibility.
- A shared spatial warp cannot generally undo changes across feature channels or receptive fields caused
  by rotating or scaling the input. Translation-covariant or specially invariant features are qualified
  exceptions. Failure of feature-map alignment does not prove that every downstream classifier lacks invariance
  or that spatial transformers cannot help.
- The source’s parallel-module construction has a configured number of attended outputs; it does not establish
  unlimited object discovery, universal accuracy improvement or negligible runtime on all systems. No
  author implementation or model was executed.
