name: Greedy best-first search
definition: A best-first search algorithm that prioritizes open nodes by a heuristic estimate of remaining
  cost to a goal, without adding the cost already incurred to that priority.
concept_kind: algorithm
identity_notes: The identity is heuristic-only global best-first selection, not every algorithm described
  as greedy. Hill climbing and beam search restrict the available candidates differently. The accumulated
  cost may still be stored for reconstructing or measuring a solution; it is omitted from the primary
  priority key. No normalized identity match was found across the 442 AIO and 124 prior native records;
  ignored-inclusive text hits in the main checkout were prior discovery leads, source citations and search-order
  contrasts, plus incidental dependency substrings, not existing concept records.
limitations:
- The priority rule supplies no user-chosen fixed bound on solution suboptimality. Any post-hoc bound
  requires additional lower-bound information and assumptions.
- Tie-breaking and duplicate handling remain consequential implementation choices. Completeness is not
  asserted for arbitrary infinite spaces or memory-pruned variants.
- A strong cost-to-go heuristic does not by itself establish universally fast search; no empirical correlation
  threshold is treated as a general theorem.
