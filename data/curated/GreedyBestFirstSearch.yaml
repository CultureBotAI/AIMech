claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Select a node with minimum heuristic value h from the open frontier, expand it, and place
    eligible successors on that frontier until a selected goal or another stopping condition is reached.
    The cost-to-date g does not contribute to this heuristic-only primary ranking.
  evidence:
  - source_id: method-source
    locator: 'Best-First Search: Greedy best-first search and Ignoring Duplicates, PDF p. 2; family distinctions
      on PDF p. 1'
    relation: supports
- claim_id: speed-qualification
  kind: limitation
  statement: Heuristic-only ordering is the greedy endpoint discussed in weighted-search studies. The
    cited study cautions that moving toward this endpoint need not reduce search effort; its empirical
    explanations are not universal runtime guarantees.
  evidence:
  - source_id: weighted-search-study
    locator: Abstract and Introduction, PDF p. 1; Discussion and Conclusion, PDF p. 8
    relation: supports
