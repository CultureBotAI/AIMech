id: AIMech:FlashAttention
name: FlashAttention
definition: An exact attention computation algorithm using tiling and recomputation to reduce transfers
  between GPU memory levels.
concept_kind: algorithm
identity_notes: The original dense exact-attention algorithm, not a distinct trained model, a generic
  attention layer, or its separately described block-sparse approximation.
definition_evidence:
- source_id: original-paper
  locator: Sections 3.1–3.2 and Algorithm 1, PDF/printed pp. 4–6
  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: Blocks of queries, keys and values are processed with running softmax statistics; intermediate
    attention values can be recomputed during the backward pass.
