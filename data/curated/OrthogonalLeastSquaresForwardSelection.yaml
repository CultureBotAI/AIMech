id: AIMech:OrthogonalLeastSquaresForwardSelection
name: Orthogonal least squares forward selection
aliases:
- Forward regression orthogonal least squares
- FROLS
concept_kind: algorithm
definition: A greedy fixed-candidate regression algorithm that repeatedly adds the column giving the largest
  reduction in squared residual after joint least-squares refitting over the augmented selected span.
identity_notes: All 442 pinned AIO IDs, labels and scoped synonyms and 527 native IDs, names and aliases
  were compared with the proposed full names and OLS/OFR/FROLS terms, with no normalized identity match.
  Ignored- and hidden-inclusive full-text searches of the independent public clone and the readable prior
  worktree returned 37 and 12 lines, all inspected. Hits concern this source lead, historical OMP review
  boundaries, ordinary least-squares proposals, Ontology Lookup Service indexing, and ordinary orthogonal
  projection context. Bare OLS is not asserted as an alias because it also abbreviates ordinary least
  squares. The original Documents checkout remains inaccessible, so its untracked files were not re-audited
  in this round. All 62 semantic AIO rows and 82 native name/definition neighbors were read, followed
  by 12 full annotated AIO CLASS nodes with incident edges and 18 contextual YAMLs. The algorithm differs
  from OMP’s raw-correlation selection, MP’s single-atom update, exact minimum-L1 basis pursuit, the LARS
  equiangular path, and PLS/supervised-PCA component fitting. The new recovery worktree has the verified
  merged public tree. This is a bounded corpus assessment.
