claims:
- claim_id: forward-selection-and-refit
  kind: mechanism
  statement: For a fixed finite real candidate matrix P and response y, start with an empty selected set
    S and residual y. For each unselected column p_j with nonzero residualized direction w_j=(I-Proj_S)*p_j,
    evaluate gain_j=(r^T*w_j)^2/(w_j^T*w_j). Choose a maximum-gain candidate, augment S and compute the
    least-squares fit over that span. This minimizes the residual sum of squares among single-column augmentations
    of the current S. The residual is orthogonal to the selected span in exact arithmetic. Original columns
    need not be orthogonal or unit length. Zero-gain termination and rank/zero-direction handling are
    necessary boundary conventions; they do not imply that y lies in the dictionary span.
  evidence:
  - source_id: chen1989
    locator: Section 4, Equations 64–82, PDF pp. 13–18 / printed pp. 1884–1889
    relation: supports
  - source_id: blumensath2007
    locator: Sections II–IV and VI, PDF pp. 2–3, March 29, 2007 draft
    relation: supports
- claim_id: error-reduction-ratio
  kind: mechanism
  statement: 'For nonzero y the source defines ERR_j=g_j^2*(w_j^T*w_j)/(y^T*y), where g_j=(w_j^T*y)/(w_j^T*w_j).
    Thus ERR is the incremental fitted energy divided by the original response energy. Orthogonality gives
    ||r_k||^2/||y||^2=1-sum_{i<=k} ERR_i. The denominator is uncentered energy despite the paper’s variance
    terminology: fitting a constant to y=(1,2) has ERR=9/10 while explaining none of the centered variation.
    Centered-variance interpretation needs appropriate centering/intercept conventions. The ratio is undefined
    at y=0, for which the zero fit already has zero error.'
  evidence:
  - source_id: chen1989
    locator: Section 4.1, Equations 64–70, and Section 4.2 Equation 74, PDF pp. 13–16 / printed pp. 1884–1887;
      curator exact calculations in research/discovery/orthogonal-least-squares-boundaries.py
    relation: supports
- claim_id: omp-selection-distinction
  kind: scope
  statement: OMP compares absolute residual correlations with the original unit atoms. OLS instead compares
    correlations with their normalized residualized directions; the different denominators can reverse
    the ranking. For D=[e1,b,e3], b=(12/13,5/13,0), y=(10,4/5,3/5), both first choose e1. OMP then chooses
    e3 because 3/5>4/13; OLS chooses b because its squared-error reduction 16/25 exceeds 9/25. The two-step
    residual energies are respectively 16/25 and 9/25. Both refit their chosen span, so refitting alone
    does not make the algorithms identical.
  evidence:
  - source_id: blumensath2007
    locator: Sections II–IV and VI, PDF pp. 2–3, March 29, 2007 draft; curator exact calculations in research/discovery/orthogonal-least-squares-boundaries.py
    relation: supports
  - source_id: chen1989
    locator: Section 4, Equations 64–82, PDF pp. 13–18 / printed pp. 1884–1889; curator exact calculations
      in research/discovery/orthogonal-least-squares-boundaries.py
    relation: supports
- claim_id: greedy-optimality-and-scaling
  kind: limitation
  statement: Best single augmentation is conditional on earlier selections and does not establish globally
    best subset selection or minimum support. For unit columns [e1,e2,e3,b], b=(8/9,4/9,1/9), and y=e1-b,
    exact forward OLS with lowest-index tie resolution selects e2,e1,e3 and uses three atoms for zero
    error. A two-atom representation e1-b exists and no one atom is collinear with y. In the ideal fixed-matrix
    unregularized procedure, nonzero rescaling of individual columns preserves the gain scores, selected
    subspaces and residuals under the same tie rule, though coefficient values change. Finite-precision
    tolerances and regularized variants need separate analysis.
  evidence:
  - source_id: chen1989
    locator: Sections 2 and 4, PDF pp. 4–5,13–18 / printed pp. 1875–1876,1884–1889; curator exact calculations
      in research/discovery/orthogonal-least-squares-boundaries.py
    relation: supports
  - source_id: blumensath2007
    locator: Sections II–IV and VI, PDF pp. 2–3, March 29, 2007 draft; curator exact calculations in research/discovery/orthogonal-least-squares-boundaries.py
    relation: supports
- claim_id: stopping-and-numerical-variants
  kind: scope
  statement: The paper implements the forward criterion through classical Gram-Schmidt, modified Gram-Schmidt
    and Householder transformations, with differing storage and roundoff behavior. Orthogonal decomposition
    is an implementation mechanism, not a requirement that the supplied features be orthogonal. It describes
    residual-energy tolerance, incremental criteria and penalized AIC-based stopping; none is an unconditional
    prediction or true-support guarantee. The mathematical rule and its implementation/stopping choices
    must be distinguished. No universal runtime superiority over OMP or other subset methods is asserted.
  evidence:
  - source_id: chen1989
    locator: Sections 3.2 and 4, PDF pp. 8–18 / printed pp. 1879–1889
    relation: supports
  - source_id: blumensath2007
    locator: Sections III and V, PDF pp. 2–3
    relation: supports
- claim_id: nonlinear-identification-boundary
  kind: application
  statement: A polynomial NARX model can be nonlinear in lagged observed inputs and outputs while remaining
    linear in its unknown coefficients, so its fixed candidate columns fit this selection procedure. Polynomial
    NARMAX identification additionally uses lagged noise terms that are not directly observed. The paper’s
    outer iterative scheme substitutes prediction residuals, rebuilds noise regressors and reestimates
    models; that changing-regressor extension is not a single fixed-matrix OLS pass and its reported iteration
    counts are not a convergence theorem. The fitted algorithm does not itself establish causal identification
    of a physical system.
  evidence:
  - source_id: chen1989
    locator: Sections 2 and 5, Equations 1–13 and 83–91, PDF pp. 3–5,18–20 / printed pp. 1874–1876,1889–1891
    relation: supports
- claim_id: frols-name-scope
  kind: scope
  statement: The official SysIdentPy documentation expands FROLS as Forward Regression Orthogonal Least
    Squares and cites the Chen–Billings–Luo paper. This record uses that naming for the basic unregularized
    forward selection procedure. A software class with that name may expose other estimators or regularization
    options; its full configurable behavior is not asserted equivalent to this narrowly defined procedure.
  evidence:
