aio_mappings:
- target: AIO:LeastsquaresAnalysis
  relation: related_match
  rationale: The algorithm uses least-squares projection at every candidate augmentation, directly relating
    it to the target’s residual-squared fitting task. The pinned target describes overdetermined regression
    analysis, whereas this record denotes a specific greedy subset-selection algorithm and also allows
    overcomplete candidate sets. Related mapping preserves that algorithm/task and scope distinction;
    it is not exact identity or an asserted subclass.
- target: AIO:SparseLearning
  relation: related_match
  rationale: The procedure seeks a parsimonious representation from supplied columns. The pinned target
    denotes a representation-learning network and identifies dictionary elements; the local algorithm
    neither requires a network nor learns those elements. Related mapping reflects sparse representation
    without treating this algorithm as dictionary learning. RepresentationLearning and SparseAutoEncoder
    are different neural scopes; LassoRegression and RidgeRegression do not specify this greedy gain criterion.
    LinearRegression and RegressionAnalysis describe fitting tasks, PLS and supervised PCA fit latent
    components, and FeatureExtraction is too general. RadialBasisNetwork and autoregressive model classes
    are potential model contexts, not identities for this selection rule.
limitations:
- The record covers finite real fixed-regressor, unregularized forward selection. Complex spaces, regularization,
  backward/floating revisions, multi-output joint selection and changing-noise-regressor estimation require
  their own evidence and conditions.
- Zero response and zero/dependent candidate directions require explicit handling. Candidate construction,
  tie resolution, numerical rank and stopping affect the fitted subset; no universal support-recovery
  or out-of-sample guarantee is curated.
- All 25 pages of the 1989 publisher PDF including its cover and all three pages of the 2007 draft were
  visually read. The current official documentation is nomenclature context only, not versioned implementation
  validation. Earlier cited methods and later variants are pending primary audits.
- The source’s uncentered energy is not automatically centered variance. The apparent missing norm squares
  in Equation 44 are not used; the record uses the squared-energy identities of Section 4. No author erratum
  is claimed.
- Exact rational examples are curator calculations. No empirical benchmark, author software, model training
  or paid provider was run. The record remains DRAFT and has no independent scientific approval.
