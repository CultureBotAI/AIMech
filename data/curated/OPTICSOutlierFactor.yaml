claims:
- claim_id: self-inclusive-locality
  kind: mechanism
  statement: For a finite reference dataset D of n observations, a finite metric and 2<=m<=n, core_m(p)
    is the mth ordered distance to observations in D, including p itself. N_m(p) retains every observation
    at distance at most that boundary, including all ties. The inspected exact linear scans and heap include
    the indexed query and boundary ties; a fixed-count truncation is not the same convention. The m range
    describes the well-defined distinct-point metric case, not a claim that every constructor enforces
    it.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: elki-wrapper
    locator: 'getKNN: retrieve query object without removing its database ID'
    relation: supports
  - source_id: elki-linear-object
    locator: 'getKNN: scan every relation ID'
    relation: supports
  - source_id: elki-linear-id
    locator: 'getKNN: scan every relation ID'
    relation: supports
  - source_id: elki-heap
    locator: 'insert, addToTies, toKNNList and toKNNListSqrt: retain boundary ties'
    relation: supports
  - source_id: elki-list
    locator: Interface size and getKNNDistance contracts
    relation: supports
- claim_id: reachability-and-density-ratios
  kind: mechanism
  statement: For o in N_m(p), reach_m(p,o)=max(core_m(o),d(p,o)), using the neighbor radius. Set lrd_m(p)=|N_m(p)|
    divided by the sum of these reaches, and OF_m(p) to the mean of lrd_m(o)/lrd_m(p) over N_m(p). Thus
    self reachability is core_m(p), not zero, and the self term contributes a ratio of one when defined.
    The formulas require positive finite mean reaches for all densities used. These inverse-distance quantities
    are not normalized probability densities, and the resulting relative score is not an outlier probability
    or an automatic binary decision.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
- claim_id: standalone-three-pass-computation
  kind: mechanism
  statement: The inspected implementation first stores neighborhoods and core radii, then computes all
    local reachability densities, then averages their neighbor-to-query ratios. It does not run an OPTICS
    ordering or extract a clustering. Pairwise reachability in the score must not be replaced with a minimum
    reachability accumulated during an OPTICS traversal.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: breunig1999-context
    locator: Parsed Definitions 4-7 and computational discussion, PDF pp5-6 and8; not visually verified
    relation: context
- claim_id: distinct-from-self-excluded-lof
  kind: scope
  statement: OPTICS-OF and original LOF are retained separately because including the query changes both
    density and score averaging. Under absolute distance, D={0,1,3} gives OPTICS-OF scores {1,1,3/2} at
    m=2, whereas self-excluded LOF gives {1,1,2} at k=1, despite identical core radii. At m=3, OPTICS-OF
    gives {1,1,1}, while LOF at k=2 gives {11/12,6/5,11/12}. These exact curator calculations rule out
    identifying the two procedures merely by shifting the neighbor-count parameter.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: breunig2000
    locator: Definitions 3-7, printed/PDF pp3-4; exact comparisons in research/discovery/optics-outlier-factor-boundaries.py
    relation: supports
- claim_id: ties-and-scale-boundaries
  kind: limitation
  statement: 'Boundary ties can change scores: for D={0,2,4,5} and m=2, point 2 has three retained neighbors
    and score 4/3; selecting only itself and neighbor 0 instead gives score 1. Positive uniform scaling
    of every distance cancels from defined density ratios, but feature-specific scaling can change neighborhoods.
    When m=n, every neighborhood is D and reach_m(p,o)=core_m(o), so all densities are equal and all defined
    scores are one. A score of one therefore does not by itself establish domain normality.'
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: elki-heap
    locator: Boundary-tie retention; exact curator calculations in research/discovery/optics-outlier-factor-boundaries.py
    relation: supports
- claim_id: zero-distance-and-parameter-limits
  kind: limitation
  statement: With m=1 and a unique query location, the self-only neighborhood has zero mean reachability;
    duplicates can also produce zero means at larger m. The mathematical ratios are then undefined. The
    inspected parameterizer requires m>1 and defaults to Euclidean distance, but its constructor does
    not enforce m<=n. KNNList may report an infinite boundary when fewer than m neighbors exist. The scoring
    loop adds no epsilon; its lrd>0 guard does not resolve infinity/infinity from coincident neighborhoods.
    A fallback zero or nonfinite output outside the stated finite domain is not evidence of normality.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: elki-opticsof
    locator: Constructor and Par.configure
    relation: supports
  - source_id: elki-list
    locator: 'getKNNDistance: infinite distance if fewer than k neighbors'
    relation: supports
- claim_id: implementation-and-computation-scope
  kind: limitation
  statement: The evidence establishes the inspected release source and exact linear-query/tie contracts,
    not every index backend, historical implementation or runtime result. Stored all-ties neighborhoods
    can contain every observation even for small m, requiring quadratic neighbor incidences. All-pairs
    neighbor search can require quadratic distance evaluations, and selection/index costs need separate
    analysis; no universal near-linear or n-log-n complexity follows. The historical paper text and versioned
    test fixture provide context, but no figure-derived claim, numerical performance advantage, library
    benchmark or probability calibration is curated.
  evidence:
  - source_id: elki-opticsof
    locator: OPTICSOF.run, passes 1-3
    relation: supports
  - source_id: elki-heap
    locator: Boundary-tie storage
    relation: supports
  - source_id: elki-linear-id
    locator: Full relation scan per query
    relation: supports
  - source_id: breunig1999-context
    locator: Parsed computational and experimental prose, PDF pp7-8; figures not visually verified
    relation: context
