aio_mappings:
- target: AIO:UnsupervisedLearning
  relation: related_match
  rationale: OPTICS-OF computes relative local outlier scores from unlabeled observations, supporting
    a related algorithm-to-task association with AIO:UnsupervisedLearning. The target is a MachineLearningTask,
    so the link asserts neither equivalence nor subclassing. BinaryClassification and its supervised ancestry
    do not describe the unthresholded core. Clustering, DBSCAN and OPTICS produce cluster structure or
    a reachability ordering; this standalone score needs neither a partition nor an OPTICS traversal.
    The three AIO KnearestNeighbor classes concern voting or response averaging, unlike these density
    ratios. RegressionAnalysis, DimensionalityReduction, DataPreparation and SelectionAndSamplingBias
    do not identify the procedure. Native LOF differs by explicit self exclusion; domain-description and
    metric-learning methods have different rules or outputs.
limitations:
- Reference population, metric, feature scaling and m determine local contrast; scores alone do not establish
  errors, fraud, disease or another domain conclusion.
- The original nine-page paper was inspected as parsed text only. No successful PDF download, checksum,
  figure reading or visual equation verification is claimed. The exact ELKI main class, test and six neighbor
  files were fully read; other index backends and QueryBuilder internals were not fully audited.
- The full twelve-page LOF source was visually read in the preceding round and reused for comparison.
  Exact rational calculations were executed; no Java, library backend, trained model or historical benchmark
  was executed.
- This is a maintained native DRAFT concept with an explicit related AIO mapping, not an accepted upstream
  class or an assertion that local-density discovery is complete.
