id: AIMech:OPTICSOutlierFactor
name: OPTICS outlier factor
aliases:
- OPTICS-OF
- OPTICS with outlier factors
concept_kind: algorithm
definition: An unsupervised local outlier-scoring procedure that uses self-inclusive, tie-inclusive nearest
  neighborhoods to compute inverse mean neighbor-radius reachability and averages neighbor-to-query density
  ratios.
identity_notes: 'This record denotes OPTICS-OF with the self-inclusive convention corroborated by the
  inspected ELKI implementation. It is distinct from OPTICS ordering, DBSCAN noise labels, original self-excluded
  LOF, neighbor-label voting and raw distance ranking. Original 1999 parsed text is context; mechanism
  claims are grounded in immutable official source and exact neighbor contracts. Compared all 442 pinned
  AIO IDs, labels and scoped synonyms with all 512 preceding native IDs, names and aliases. No normalized
  identity collision was found. Fixed-string whole-word searches of both checkouts included ignored and
  hidden files, all aliases, the original title and DOI: 23 matches in each checkout were read in 19 distinct
  context windows at 46 locations. These are LOF comparison notes, prior searches and unresolved discovery
  context, not an existing OPTICS-OF record. All 99 semantic AIO rows, 13 annotated CLASS nodes with outgoing
  edges, 71 native identity-field matches and 21 contextual YAMLs were inspected or reused after unchanged-content
  checks. This is a bounded local corpus assessment.'
