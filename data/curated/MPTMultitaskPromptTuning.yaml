claims:
- claim_id: mpt-hadamard-rank-one-prompt-decomposition-mechanism
  kind: mechanism
  statement: 'MPT decomposes the soft prompt P_hat_k in R^{l x d} for task k into the Hadamard product of a slow task-shared prompt matrix P^* in R^{l x d} and a fast rank-one task-specific matrix W_k = u_k (x) v_k^T formed by outer product of vectors u_k in R^l and v_k in R^d: P_hat_k = P^* o (u_k (x) v_k^T) (Eq. 2), requiring only (l x d) + (l + d) = 77.6K tunable parameters per single target task (0.035% of T5-Base''s 220M parameters, collapsible into an l x d matrix after training) and (l x d)/tau + (l + d) = 10.5K parameters per task for multitask target adaptation across tau = 8 GLUE tasks.'
  evidence:
  - source_id: r702-primary-pdf
    locator: Section 3.1 Prompt decomposition, Eq. 2 & Figure 3, p. 4; Section 3.2 Parameter-efficiency, p. 5; Section 4.2 Table 1, p. 6
    relation: supports
- claim_id: mpt-logit-and-hidden-state-prompt-distillation-mechanism
  kind: mechanism
  statement: To prevent the shared component P^* from overfitting to large source datasets during stochastic multitask training, MPT trains student prompts P_hat_k = P^* o (u_k (x) v_k^T) against separately trained per-task teacher prompts P_k^(teacher) by minimizing L_Total = L_PLM + lambda (L_Logits + L_Hidden) (Eq. 5), combining temperature-scaled output probability KL divergence L_Logits (Eq. 3) and encoder/decoder intermediate hidden state mean squared error L_Hidden = sum (H_{k,i} - H_{k,i}^(teacher))^2 (Eq. 4).
  evidence:
  - source_id: r702-primary-pdf
    locator: Section 3.1 Prompt distillation, Eqs. 3-5, p. 4; Section 3.2 Source Training and Target Adaptation, p. 5; Section 4.3 Ablation Studies, Table 6, pp. 8-9
    relation: supports
- claim_id: mpt-nlu-and-nlg-benchmarks-application
  kind: application
  statement: Evaluated on 23 NLP datasets across GLUE (85.6 average with 77.6K params and 85.8 for MPT* with 10.5K params on T5-Base, outperforming 220M full finetuning at 84.9), SuperGLUE (74.1 single-task and 76.1 multitask, +16.3% over vanilla Prompt Tuning), MRQA, Others (WinoGrande, Yelp-2, SciTail, PAWS), 4/16/32-shot adaptation, and NLU-to-NLG transfer on E2E and WebNLG.
  evidence:
  - source_id: r702-primary-pdf
    locator: Section 4.1-4.2, Tables 1-5 & Figure 4, pp. 5-8
    relation: supports
- claim_id: mpt-mrqa-gap-and-long-prompt-overfitting-limitation
  kind: limitation
  statement: 'MPT requires a two-step source pretraining pipeline (training separate teacher prompts for every source task before joint multitask distillation), still trails full model finetuning and 1.9M-parameter Adapters on extractive reading comprehension (MRQA: 72.2 vs. 74.7), and suffers a 1.8% SuperGLUE accuracy drop when prompt length l is increased from 300 to 400 due to overfitting.'
  evidence:
  - source_id: r702-primary-pdf
    locator: Section 3.2 Source Training and Target Adaptation, p. 5; Section 4.2 Results and Analysis, Table 2, pp. 6-7; Section 4.3 Prompt length, Figure 5, p. 9
    relation: supports
