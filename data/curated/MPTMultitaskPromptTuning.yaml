id: AIMech:MPTMultitaskPromptTuning
name: MPT (Multitask Prompt Tuning)
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient multitask prompt transfer methodology for frozen pre-trained language models that decomposes each task's soft prompt matrix into the Hadamard product of a single task-shared prompt matrix P^* and a rank-one task-specific matrix W_k = u_k (x) v_k^T, learns this decomposition during source training via logit and hidden-state knowledge distillation from independently trained teacher prompts, and adapts P^* to downstream target tasks via two-speed low-rank multiplicative updates.
identity_notes: Introduced by Zhen Wang, Rameswar Panda, Leonid Karlinsky, Rogerio Feris, Huan Sun, and Yoon Kim (ICLR 2023, arXiv:2303.02861). Distinct from SPoT (Vu et al., ACL 2022; AIMech Round 698), which trains a single unfactorized prompt on a source mixture or retrieves top-k source prompts by cosine similarity without multiplicative rank-one prompt decomposition or knowledge distillation from per-task teacher prompts. Both single-target adaptation (MPT, tuning (l x d) + (l + d) parameters per task) and multitask target group adaptation (MPT*, sharing P^* across tau target tasks for (l x d)/tau + (l + d) parameters per task) are covered within this record.
aliases:
- Multitask Prompt Tuning
- MPT Prompt Decomposition and Distillation
- MPT* Multitask Target Prompt Tuning
