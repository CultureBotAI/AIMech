claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'Proposition 1 proves that cyclic Iterative Bregman Projections (Equation 3) onto the two affine marginal subspaces C_1 = {gamma 1 = p} and C_2 = {gamma^T 1 = q} coincide identically with Sinkhorn-Knopp diagonal scaling, while Proposition 2 and Remark 3 prove that for the K-measure Wasserstein barycenter problem on C_1 = {gamma_k 1 = p_k} and C_2 = {exists p : gamma_k^T 1 = p}, the weighted KL projection onto C_2 has the exact closed-form geometric-mean marginal p = prod_{r=1}^K (bar{gamma}_r^T 1)^{lambda_r}, reducing each barycenter iteration to K matrix-vector multiplications by xi and xi^T.'
  evidence:
  - source_id: r327-primary-pdf
    locator: Section 3.1, Proposition 1 and Remark 1, p. 8; Section 3.2, Proposition 2 and Remark 3, pp. 10-11
    relation: supports
  - source_id: r327-metadata-cr
    locator: Crossref metadata for SIAM J. Sci. Comput. 37(2):A1111-A1138
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: When constraints include non-affine convex sets such as upper-bounded marginals C_1 = {gamma 1 <= p}, C_2 = {gamma^T 1 <= q} with fixed total mass C_3 = {1^T gamma 1 = m} (partial optimal transport, Proposition 5) or pointwise capacity upper bounds C_3 = {gamma <= bar{gamma}} (Section 5.2, Equations 22-23), the individual KL projections are given in closed form by elementwise min(gamma 1, p), min(gamma^T 1, q), and min(gamma, bar{gamma}), and Dykstra's algorithm (Equation 4) with memory variables q^{(n)} = q^{(n-L)} odot (gamma^{(n-1)} / gamma^{(n)}) (with q^{(n)} = 1 on affine subspaces) converges to the unique exact KL projection onto cap_{l=1}^L C_l.
  evidence:
  - source_id: r327-primary-pdf
    locator: Section 2.2, Equation 4 and affine-subspace remark, p. 7; Section 5.1, Proposition 5 and Equation 20, pp. 19-20; Section 5.2, Equations 22-23, p. 22
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Without Dykstra's dual memory variables q^{(n)}, cyclic Bregman projections onto non-affine convex sets fail to converge to the KL projection onto the intersection (Section 2.2, Figure 1); moreover, when the regularization parameter epsilon is very small, entries of xi = exp(-C / epsilon) underflow in standard floating-point arithmetic and multi-marginal tensors gamma in R^{N^K} suffer O(N^K) memory growth unless the ground cost has tree or grid separability.
  evidence:
  - source_id: r327-primary-pdf
    locator: Section 1, Small-epsilon and grid/separable kernel discussion, pp. 4-5; Section 2.2, Figure 1, p. 7; Section 4, Multi-marginal transport complexity, pp. 15-17
    relation: supports
