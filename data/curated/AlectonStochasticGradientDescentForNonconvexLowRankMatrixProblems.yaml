id: AIMech:AlectonStochasticGradientDescentForNonconvexLowRankMatrixProblems
name: Alecton Riemannian-Rescaled Stochastic Gradient Descent for Non-Convex Low-Rank Matrix Problems
concept_kind: algorithm
review_status: DRAFT
definition: Alecton is a two-phase stochastic gradient descent algorithm introduced by De Sa, Olukotun, and Re (2015) for solving non-convex low-rank factorized matrix optimization problems min_{Y in R^{n x p}} E[||A_tilde - Y Y^T||_F^2] from a uniform random orthonormal initialization Y_0^T Y_0 = I_p without spectral warm-starts. Endowing the quotient manifold M = R^{n x p} / O_p with the rescaled Riemannian metric <U, V>_Y = tr(U (I + eta Y^T Y) V^T) and step size alpha_k = eta/4 transforms the factorized SGD update into Y_{k+1} = (I + eta A_tilde_k) Y_k (I + eta Y_k^T Y_k)^{-1}, whose column space C(Y_k) is identical at every step k to the unnormalized stochastic power iteration Y_bar_{k+1} = (I + eta A_tilde_k) Y_bar_k (Angular Phase), followed by orthonormalization Y_hat = Y_K (Y_K^T Y_K)^{-1/2} and empirical eigenvalue averaging R_bar = (1/L)*sum_{l=0}^{L-1} Y_hat^T A_tilde_l Y_hat to return Y_hat R_bar^{1/2} (Radial Phase).
identity_notes: Distinct from AIMech:BurerMonteiroLowRankSemidefiniteProgrammingAndRiemannianStaircase (Round 336), which classifies deterministic second-order critical points of smooth semidefinite programs with linear constraints <A_i, Y Y^T> = b_i, and from AIMech:StreamingPCANearOptimalFiniteSampleOjaAlgorithm (Round 357), which analyzes rank-1 streaming covariance PCA with bounded-norm rank-1 samples x_t x_t^T via matrix product moments rather than proving global convergence for rank-p entrywise matrix completion, trace sensing, and subspace tracking under second-moment variance bounds (AVC) via Doob's optional stopping theorem on a determinant-ratio submartingale tau_k.
aliases:
- Alecton Algorithm
- Alecton Non-Convex Low-Rank Factorized SGD
- Riemannian-Metric-Rescaled Stochastic Gradient Descent for Y Y^T Matrix Recovery
