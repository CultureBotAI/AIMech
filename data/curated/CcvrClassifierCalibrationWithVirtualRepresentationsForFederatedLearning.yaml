id: AIMech:CcvrClassifierCalibrationWithVirtualRepresentationsForFederatedLearning
name: CCVR (Classifier Calibration with Virtual Representations for Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A post-training server-side classifier calibration algorithm for non-IID federated learning (Luo et al. 2021, Section 4, Algorithm 1, Equations 2-4) that freezes the federatedly trained feature extractor f_theta, collects each client k's per-class sample count N_{c,k}, sample feature mean mu_{c,k}, and Bessel-corrected sample covariance Sigma_{c,k} in a single privacy-preserving upload, reconstructs the exact pooled global Gaussian Mixture Model parameters mu_c = sum_{k=1}^K (N_{c,k}/N_c) mu_{c,k} and Sigma_c = sum_{k=1}^K ((N_{c,k}-1)/(N_c-1)) Sigma_{c,k} + sum_{k=1}^K (N_{c,k}/(N_c-1)) (mu_{c,k} - mu_c)(mu_{c,k} - mu_c)^T, draws virtual representations z_tilde ~ N(mu_c, Sigma_c), and retrains the linear classifier head g_varphi on the server.
identity_notes: Distinct from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which learns client-specific personalized heads locally during alternating minimization rather than calibrating a single global classifier on the server via exact federated Gaussian mixture covariance reconstruction, and from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning, Lin et al. 2020), which requires an external unlabeled proxy dataset on the server for logit knowledge distillation.
aliases:
