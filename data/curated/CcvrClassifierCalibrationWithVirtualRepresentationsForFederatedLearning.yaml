claims:
- claim_id: r437-layer-wise-cka-diagnosis-of-classifier-bias-under-non-iid-data
  kind: mechanism
  statement: "Using linear Centered Kernel Alignment (CKA, Eq. 1) across client layers and per-class L_2 weight norms of the final linear classifier, Section 3 demonstrates that deeper layers \u2014 and above all the linear classifier head \u2014 exhibit the lowest cross-client representation similarity and strongest bias toward client majority classes, explaining why post-hoc calibration of the classifier head alone yields larger accuracy gains than regularizing the entire network."
  evidence:
  - source_id: r437-primary-pdf
    locator: Section 3 An Empirical Study of Heterogeneity in Federated Learning (Equation 1, Figures 1-3, Table 1), pp. 5973-5976
    relation: supports
- claim_id: r437-exact-federated-gmm-mean-and-pooled-covariance-reconstruction
  kind: mechanism
  statement: Without transmitting any individual client feature vectors z_{c,k,j}, the server identity Sigma_c = sum_{k=1}^K ((N_{c,k}-1)/(N_c-1)) Sigma_{c,k} + sum_{k=1}^K (N_{c,k}/(N_c-1)) (mu_{c,k} - mu_c)(mu_{c,k} - mu_c)^T (Eq. 3) reconstructs the exact centralized pooled sample covariance matrix over all N_c = sum_{k=1}^K N_{c,k} samples of class c, enabling plug-and-play calibration on top of FedAvg, FedProx, FedAvgM, and MOON (Section 4, Table 2).
  evidence:
  - source_id: r437-primary-pdf
    locator: Section 4.1 Virtual Representations Generation (Equations 2-3) & Section 5.2 Experimental Results (Table 2)
    relation: supports
- claim_id: r437-feature-dimension-quadratic-covariance-upload-and-gaussianity-limitation
  kind: limitation
  statement: Requires uploading C covariance matrices of size d x d (O(C d^2) scalars per client in a single post-training round) and models penultimate-layer class-conditional features as multivariate Gaussian distributions (after ReLU/tukey transformation).
  evidence:
  - source_id: r437-primary-pdf
    locator: Section 4.1-4.3 Privacy and Communication Discussions, pp. 5977-5978
    relation: supports
- claim_id: r437-non-iid-cifar10-cifar100-and-cinic10-federated-calibration-application
  kind: application
  statement: Applied to post-training calibration of federated image classifiers (MobileNetV2, ResNet-18) on non-IID Dirichlet partitions of CIFAR-10, CIFAR-100, and CINIC-10.
  evidence:
  - source_id: r437-primary-pdf
    locator: Section 5 Experiments (Tables 2-5, Figures 4-5), pp. 5978-5981
    relation: supports
