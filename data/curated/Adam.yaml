name: Adam
definition: Stochastic gradient optimization using bias-corrected exponential estimates of first and second
  gradient moments to scale parameter updates.
concept_kind: algorithm
identity_notes: Adam specifies adaptive moment-based updates; the local SGD concept does not require these
  estimates. It is an optimizer, not a training task or a trained model.
aio_mappings:
- target: AIO:TrainingStrategy
  relation: related_match
  rationale: An optimizer can implement parameter fitting, but the pinned TrainingStrategy definition
    uses a preprocessing genus; no subclass relationship is asserted.
limitations:
- No universal convergence or benchmark superiority claim is curated.
- AdamW, AdaMax and other variants require their own identity assessment.
id: AIMech:Adam
aliases:
- Adaptive moment estimation
