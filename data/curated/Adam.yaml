name: Adam
definition: Stochastic gradient optimization using bias-corrected exponential estimates of first and second
  gradient moments to scale parameter updates.
concept_kind: algorithm
identity_notes: Adam specifies adaptive moment-based updates; the local SGD concept does not require these
  estimates. It is an optimizer, not a training task or a trained model.
aio_mappings:
- target: AIO:TrainingStrategy
  relation: related_match
  rationale: An optimizer can implement parameter fitting, but the pinned TrainingStrategy definition
    uses a preprocessing genus; no subclass relationship is asserted.
limitations:
- No universal convergence or benchmark superiority claim is curated.
- AdamW, AdaMax and other variants require their own identity assessment.
- The reported counterexample is an existence result for the analyzed Adam setting, not a statement that
  Adam fails on every training problem or that all later variants share the result.
- The analysis introduces projection and a decreasing step-size setting, omits debiasing for exposition,
  and states that its arguments extend to the debiased version; it does not analyze every implementation
  configuration.
id: AIMech:Adam
aliases:
- Adaptive moment estimation
definition_evidence:
- source_id: original-paper
  locator: Section 2 and Algorithm 1, PDF/printed p. 2
  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: The update divides the bias-corrected first moment by the square root of the bias-corrected
    second raw moment plus a numerical stabilizer.
  evidence:
  - source_id: original-paper
    locator: Section 2 and Algorithm 1, PDF/printed p. 2
    relation: supports
- claim_id: convergence-counterexample
  kind: limitation
  statement: In the paper's bounded, projected diagonal optimization setting, the analysis constructs
    stochastic convex problems on which Adam with fixed moment coefficients beta1 and beta2 in [0, 1),
    satisfying beta1 < sqrt(beta2), does not converge to the optimum.
  evidence:
  - source_id: convergence-analysis
    locator: Section 2, PDF/printed pp. 2–3, including the debiasing footnote; Theorem 3 and scope discussion,
      PDF/printed p. 5
    relation: supports
