  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: The update divides the bias-corrected first moment by the square root of the bias-corrected
    second raw moment plus a numerical stabilizer.
  evidence:
  - source_id: original-paper
    locator: Section 2 and Algorithm 1, PDF/printed p. 2
    relation: supports
