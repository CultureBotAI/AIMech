claims:
- claim_id: method
  kind: mechanism
  statement: For X_i in {0,1,...}, a finite symmetric matrix Phi and finite theta, define p(x)=Z^(-1)*exp[sum_i
    theta_i*sqrt(x_i)+sum_i Phi_ii*x_i+2*sum_(i<j) Phi_ij*sqrt(x_i*x_j)-sum_i log(x_i!)]. The full conditional
    at i is proportional to exp[Phi_ii*k+eta_i*sqrt(k)]/k!, k>=0, where eta_i=theta_i+2*sum_(j!=i) Phi_ij*sqrt(x_j).
    All finite parameters are admissible on a finite graph. To see this directly, use 2*sqrt(x_i*x_j)<=x_i+x_j
    and sqrt(x_i)<=1+x_i to bound the parameter-dependent exponent by C+sum_i d_i*x_i for finite C,d_i.
    The joint kernel is then bounded by exp(C)*product_i exp(d_i*x_i)/x_i!, whose sum is exp(C+sum_i exp(d_i)).
    For theta=0 and diagonal Phi, the independent Poisson means are exp(Phi_ii). For nonzero eta_i the
    conditional is generally not an ordinary Poisson law.
