name: Bivariate counterfactual-fairness sensitivity analysis
definition: A model-based sensitivity procedure that varies the correlation between two structural error
  terms and measures how a predictor built under an unconfounded additive-noise model changes on counterfactual
  data generated under the alternative confounded model.
concept_kind: evaluation_method
identity_notes: This record denotes the paper’s two-error grid-based sensitivity procedure. The mean squared
  discrepancy is its output, not another fairness criterion. The multivariate MAXCFU optimizer is separately
  represented because it searches a matrix of correlations with a different algorithm. All 442 pinned
  AIO labels/scoped synonyms and 99 preceding native identities were compared, together with hidden/ignored-inclusive
  searches of both checkouts; source citations and pending frontier mentions were distinguished from existing
  concept identities.
limitations:
- Alternative Model B is a hypothetical data-generating model, not an identified causal ground truth;
  the sensitivity parameter and acceptable discrepancy require domain judgment.
- The inspected construction uses specified additive-noise structural functions, embeddings and Gaussian
  error covariance, rather than arbitrary hidden confounding.
- Fitting, covariance invertibility and numerical grid resolution matter. The record does not certify
  a global maximum over all admissible models or extrapolate the source’s bivariate boundary statement
  to multiple error terms.
- Squared prediction differences depend on the prediction scale and assessed sample; they are not automatically
  calibrated probabilities of discrimination or a universal fairness score.
