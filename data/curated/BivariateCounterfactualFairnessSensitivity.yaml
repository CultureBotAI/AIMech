claims:
- claim_id: method-scope
  kind: mechanism
  statement: Fit an unconfounded working model and a predictor of its residuals. At a selected error correlation,
    fit an alternative additive-noise model, retain its inferred errors while changing the protected attribute,
    and propagate the intervention through the causal ordering. Recompute residuals of these counterfactual
    features using the original working-model coefficients, apply the fixed original predictor and average
    squared prediction differences. Repeat across correlations to obtain a sensitivity curve.
