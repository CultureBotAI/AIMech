claims:
- claim_id: r647-async-unbiased-reddi-convergence
  kind: mechanism
  statement: By preconditioning the step-t gradient numerator with the lagged centered second moment s_{t-1} computed solely from history {g_0, ..., g_{t-1}}, ACProp guarantees conditional unbiasedness E[g_t / sqrt(s_{t-1} + epsilon) | g_{0:t-1}] = E[g_t] / sqrt(s_{t-1} + epsilon) and converges on Reddi et al.'s (2018) periodic online convex counterexample for all beta_1, beta_2 in (0, 1) and period P >= 3 (Lemma 3.3 / Lemma A.3).
  evidence:
  - source_id: r647-primary-pdf
    locator: Section 2.2, p. 3; Section 3.1, Lemma 3.3, pp. 3-5; Appendix A.1, Lemma A.3 & Lemma A.5, pp. 14-17
    relation: supports
- claim_id: r647-sparse-gradient-centering-advantage
  kind: mechanism
  statement: On periodic sparse-gradient online convex problems where zero gradients occur between opposing non-zero gradient pulses, uncentered asynchronous second moments v_t = beta_2 v_{t-1} decay exponentially toward zero whereas ACProp's centered second moment s_t = beta_2 s_{t-1} + (1 - beta_2)(0 - m_t)^2 remains bounded away from zero when m_t != 0, yielding s^+ / s^- <= v^+ / v^- and a strictly larger hyperparameter convergence region than AdaShift with n = 1 (Lemma 3.4 / Lemma A.6).
  evidence:
  - source_id: r647-primary-pdf
    locator: Section 3.2, Eq. 2 & Lemma 3.4, pp. 5-6; Appendix A.2, Lemma A.6, Eqs. 50-76, pp. 18-20
    relation: supports
- claim_id: r647-stochastic-nonconvex-oracle-rate
  kind: scope
  statement: Under L-smoothness and bounded-variance unbiased stochastic gradients with step-size schedule alpha_t = alpha_0 t^{-eta} (eta in [0.5, 1)), ACProp achieves (1/T) sum_{t=1}^T ||grad f(x_t)||^2 = O(1/sqrt(T)) at eta = 0.5 (requiring at most O(delta^{-4}) queries to reach a delta-stationary point, matching the first-order oracle lower bound of Arjevani et al., 2019), and reduces the early-training regret constant from sqrt(mu^2 + sigma^2 + epsilon) to sqrt(sigma^2 + epsilon) when gradient mean |mu| >> sigma (Theorem 4.1, Theorem 4.2, and Eqs. 6-7).
  evidence:
  - source_id: r647-primary-pdf
    locator: Section 4, Theorems 4.1-4.2 & Eqs. 3-7, pp. 6-7; Appendix B.2, Theorem B.1, pp. 23-25
    relation: supports
- claim_id: r647-cnn-gan-transformer-rl-applications
  kind: application
  statement: ACProp is applied to train convolutional neural networks on CIFAR-10 and ImageNet (achieving 70.46% Top-1 accuracy with ResNet-18 on ImageNet), Deep Q-Networks on the four-rooms reinforcement learning task, Transformers on IWSLT14/WMT machine translation, and DCGAN, SNGAN, SAGAN, and RLGAN architectures on CIFAR-10.
  evidence:
  - source_id: r647-primary-pdf
    locator: Section 5, Figures 7-9 & Tables 2-5, pp. 8-9
    relation: supports
- claim_id: r647-beta2-sensitivity-and-moment-extension-limitation
  kind: limitation
  statement: Empirical sensitivity ablations show that while ACProp is robust across choices of first-moment decay beta_1, its accuracy is more sensitive to the second-moment smoothing hyperparameter beta_2, and extending the theoretical non-convex convergence proof to the momentum-numerator variant (Async-moment-optimizer, Theorem B.3) requires assuming a monotonically non-increasing diagonal preconditioner A_{t+1} <= A_t.
  evidence:
  - source_id: r647-primary-pdf
    locator: Appendix B.3, Theorem B.3, p. 25; Appendix C.2, Figure 28, pp. 30-31
    relation: supports
