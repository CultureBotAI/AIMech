limitations:
- ACProp's test accuracy is more sensitive to the second-moment exponential moving average parameter beta_2 than to beta_1 (Appendix C.2, pp. 30-31).
- While the vanilla asynchronous update x_{t+1} = x_t - alpha_t A_t g_t achieves the O(1/sqrt(T)) stochastic non-convex convergence bound without monotonicity assumptions on A_t (Theorem 4.1), the theoretical extension to a momentum numerator x_{t+1} = x_t - alpha_t A_t m_t (Theorem B.3) assumes elementwise monotonic preconditioning A_{t+1} <= A_t.
