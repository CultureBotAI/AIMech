name: Depth-first search
definition: A graph or state-space traversal that follows a newly chosen successor down the current search
  branch and backtracks when that branch has no eligible unvisited successor or reaches a stopping boundary.
concept_kind: algorithm
identity_notes: DFS denotes depth-first traversal, not depth-first iterative deepening or a shortest-path
  cost ordering. The visited-vertex graph traversal and a path-only tree search share the depth-first
  order but have different duplicate handling and memory requirements. No normalized identity match was
  found across the 442 AIO and 119 prior native records; ignored-inclusive text hits in the main checkout
  were dependency-package documentation and an unrelated package-metadata substring, not existing concept
  records.
limitations:
- Depth-first order alone does not guarantee that the first goal has a shortest path.
- A tree expansion can follow an infinite branch or repeat states indefinitely unless appropriate limits
  or duplicate controls are applied.
- The graph implementation retains vertex marks; the linear-in-depth memory description of a path-only
  search is not a universal memory bound for all DFS implementations.
