claims:
- claim_id: search-procedure
  kind: mechanism
  statement: A recursive call or explicit stack continues down a successor branch before resuming the
    remaining successors of its ancestors. In the cited graph traversal, discovered vertices are marked
    and skipped on later encounters; an outer traversal can restart at an undiscovered vertex after a
    reachable component is exhausted.
  evidence:
  - source_id: method-source
    locator: Opening traversal description and DFS(G)/DFS-VISIT(G, u) pseudocode
    relation: supports
- claim_id: tree-search-limitations
  kind: limitation
  statement: The paper’s path-only depth-first search can revisit states along different paths, and an
    unbounded search without duplicate checks may fail to terminate. A chosen depth cutoff can miss a
    goal or permit a nonshortest first solution.
  evidence:
  - source_id: search-paper
    locator: Sections 3–4, printed pp. 99–100 / PDF pp. 3–4
    relation: supports
