name: Linear state-space layer
definition: A sequence-to-sequence layer defined by discretizing a linear continuous-time state-space
  system, with a state recurrence and, for zero initial state, an equivalent convolutional representation
  plus a direct input term.
concept_kind: layer
identity_notes: LSSL denotes Gu and colleagues' component with state-space parameters and timescale, not
  the complete deep LSSL network, every recurrent network, or S4's later structured parameterization and
  kernel algorithm.
limitations:
- The simple convolution expression assumes zero initial state; a nonzero starting state contributes an
  additional term.
- The layer is linear; nonlinear expressive power of stacked networks is not a property of a single standalone
  LSSL. Efficient recurrent updates and kernel construction depend on the selected state-matrix structure.
