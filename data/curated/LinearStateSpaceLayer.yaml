claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Discretize the state dynamics using a step size to obtain a recurrent state update and linear
    output map. With zero initial state, powers of the discretized state matrix between input and output
    projections form the convolution kernel. Separate feature channels use their own broadcast input/output
    parameters and timescales; complete networks add further layers and connections.
