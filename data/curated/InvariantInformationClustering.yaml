name: Invariant information clustering
definition: A neural clustering procedure that maximizes mutual information between discrete cluster-assignment
  variables for paired unlabeled samples, estimating their joint distribution from the network’s soft
  assignment probabilities.
concept_kind: algorithm
identity_notes: Invariant information clustering (IIC) refers to Ji et al.’s paired-data discrete-information
  objective and neural learning procedure. It directly learns cluster assignments and differs from continuous
  embedding mutual-information estimators, k-means pseudo-label training and generic biclustering. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 195 prior native
  IDs/names/aliases. Ignored-inclusive, word-delimited searches of both full checkouts found nine prior
  discovery/review references in each plus six unrelated language-stemmer tokens in the main environment.
  An initial substring search also matched unrelated layer-name suffixes. Neighboring k-means, SwAV, Barlow
  Twins and VICReg mechanisms and exact AIO definitions/edges were inspected; shared components do not
  establish identity.
limitations:
- The information quantity is between modeled discrete assignment variables after averaging paired samples,
  not between the continuous probability vectors themselves. Finite-batch estimation and conditional modeling
  assumptions affect the objective.
- Constant assignments give zero mutual information, whereas a feasible balanced deterministic correspondence
  can give a larger value. This distinguishes the objective from pure agreement but does not prove arbitrary
  optimization escapes stationary collapsed states or recovers semantic classes.
- The entropy term favors cluster utilization, so chosen cluster count, class imbalance, distractors and
  augmentation semantics matter. High mutual information can preserve a nuisance factor shared by paired
  inputs; it is not proof of correct categories.
- The pinned author loss computes marginals before epsilon clamping; the paper’s compact Figure 4 clamps
  the joint first. These stabilized computations approximate the ideal normalized probability formula.
  The optional entropy coefficient differs from pure mutual information when it is not one.
- 'Geometric alignment is required for segmentation; same raw pixel coordinates need not denote corresponding
  content after a transform. Learned cluster indices have arbitrary order: evaluation maps them to reference
  classes using labels, and the paper’s semi-supervised modes must remain distinct from unlabeled training.
  No benchmark result was reproduced.'
