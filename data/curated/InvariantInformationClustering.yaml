claims:
- claim_id: method
  kind: mechanism
  statement: For n paired samples (x_i,x′_i), apply the same network ending in a C-class softmax to obtain
    probability vectors a_i and b_i. Define discrete labels z and z′ as conditionally independent given
    the input pair, with these probabilities. Form the batch joint estimate P=(1/n) sum_i a_i b_i^T and,
    for symmetric pair sampling, replace it by (P+P^T)/2. Obtain marginals r_c=sum_d P_cd and s_d=sum_c
    P_cd. Minimize −sum_(c,d) P_cd log[P_cd/(r_c s_d)], differentiating through both network outputs and
    their induced joint/marginals. Use the continuous zero-mass convention or a documented numerical stabilization.
    For images, pairs are generated by content-preserving transformations. An auxiliary overclustering
    head can learn more clusters while sharing the backbone with the main head; the reported training
    alternates the heads. For segmentation, align transformed prediction grids back to the original coordinates
    and average mutual information separately over local spatial displacements between patch assignments.
