claims:
- claim_id: method
  kind: mechanism
  statement: On x in nonnegative-integer p-space, use T(x)=x, B(x)=-log(x!) and ordinary nonnegative roots
    in the GRM tensor construction. The joint kernel is exp[sum_j sum_(ell<=j) <Psi_j^ell,(x^(1/j))^(tensor
    ell)>]/product_i x_i!, with finite real super-symmetric tensors zero on repeated indices. All finite
    tensor choices have a finite partition for finite p,k. For an ell-variable term, AM–GM gives product_(i
    in S) x_i^(1/j)<=(sum_(i in S) x_i/ell)^(ell/j)<=1+sum_(i in S) x_i because ell<=j. Bounding the finitely
    many coefficients in absolute value yields H(x)<=C+sum_i d_i*x_i; summing the product envelope gives
    Z<=exp(C+sum_i exp(d_i))<infinity. This direct curator derivation supports the source’s parameter-existence
    result without its radial measure argument. A site conditional has kernel exp[sum_j eta_js*t^(1/j)]/t!,
    t>=0, with eta_js given by the symmetric tensor-slice contractions. It is generally not ordinary Poisson
    when fractional-root terms are present. Only the linear unary terms remaining gives independent Poisson
    means exp(Psi_1^1[i]); k=2 reproduces Poisson SQR.
