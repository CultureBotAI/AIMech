claims:
- claim_id: hyperformer-conditional-adapter-and-layernorm-mechanism
  kind: mechanism
  statement: HyperFormer inserts task-conditional adapter layers A^l_tau(x) = LN^l_tau(U^l_tau(GeLU(D^l_tau(x)))) + x (Eq. 3) with conditional layer normalization LN^l_tau(x^i_tau) = gamma^l_tau (o) ((x^i_tau - mu_tau)/sigma_tau) + beta^l_tau (Eq. 4) after the attention and feed-forward blocks of a frozen Transformer, generating the adapter weights (U^l_tau, D^l_tau) = (W^{U^l}, W^{D^l}) I_tau (Eq. 6) and LayerNorm parameters (gamma^l_tau, beta^l_tau) = (W^{gamma^l}, W^{beta^l}) I_tau (Eq. 7) from a learned task embedding I_tau = h_I(z_tau) (Eq. 5).
  evidence:
  - source_id: r703-primary-pdf
    locator: Section 2.1-2.3, Figure 1 & Eqs. 3-7, pp. 1-4; Section 4.3 Table 4, p. 7
    relation: supports
- claim_id: hyperformer-plusplus-cross-layer-sharing-mechanism
  kind: mechanism
  statement: 'HyperFormer++ shares the hypernetworks across all L layers and T tasks by feeding the concatenation of task embedding z_tau in R^t, layer-ID embedding l_i in R^t, and adapter position embedding p_j in R^t through a two-layer ReLU MLP projector h''_I followed by LayerNorm: I_tau = h''_I(z_tau, l_i, p_j) (Eq. 8), reducing total trainable parameters from 4 T L (2 h d + 2 h) for standard Adapters to t(T + 4 + 2 L) + 8 t e + 2 t (2 h d + 2 h) (only 0.29% parameters per task on T5-Base with 1.02x total model size, 3x fewer trainable parameters than Adapters_BASE).'
  evidence:
  - source_id: r703-primary-pdf
    locator: Section 2.4 HyperFormer++, Eq. 8, p. 4; Section 3.1 Table 1, p. 5; Section 4.1 Parameter Efficiency, p. 7
    relation: supports
- claim_id: hyperformer-glue-and-fewshot-transfer-application
  kind: application
  statement: Evaluated on T5-Small and T5-Base across multi-task GLUE (where HyperFormer++_BASE achieves 86.48 average score with 0.29% trainable parameters per task vs. 85.47 for multi-task T5_BASE and 84.88 for single-task Adapters_BASE), low-resource GLUE subsampling (100 to 4,000 samples per task), and few-shot domain transfer across 7 datasets (SciTail, CB, TREC, BoolQ, IMDB, Yelp Polarity, and PAWS).
  evidence:
  - source_id: r703-primary-pdf
    locator: Section 3.1-3.3, Tables 1-2 & Figure 2, pp. 5-6
    relation: supports
- claim_id: hyperformer-fewshot-hypernet-tuning-and-reduction-factor-limitation
  kind: limitation
  statement: During few-shot domain transfer to unseen tasks, fine-tuning only the new task embedding without also updating the hypernetwork parameters achieves lower accuracy in the few-shot regime, per-layer HyperFormer without cross-layer sharing incurs substantial parameter overhead (1.54x total parameters and 6.86% per task on T5_BASE), and the adapter reduction factor r in {8, 16, 32} must be tuned depending on dataset size.
  evidence:
  - source_id: r703-primary-pdf
    locator: Section 2.4, p. 4; Section 3.1 Table 1, p. 5; Section 3.3 Footnote 4, p. 6; Appendix A Table 5-7, pp. 11-12
    relation: supports
