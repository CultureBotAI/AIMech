id: AIMech:HyperFormerSharedHypernetworkAdapter
name: HyperFormer (Shared Hypernetwork Multi-Task Adapter)
concept_kind: architecture
review_status: DRAFT
definition: A parameter-efficient multi-task Transformer adaptation architecture that learns low-dimensional task, layer-ID, and adapter-position embeddings projected through a MLP task projector h'_I to condition shared linear hypernetworks that generate task- and layer-specific bottleneck adapter weights (U^l_tau, D^l_tau) and conditional layer normalization parameters (gamma^l_tau, beta^l_tau).
identity_notes: Introduced by Rabeeh Karimi Mahabadi, Sebastian Ruder, Mostafa Dehghani, and James Henderson (ACL/IJCNLP 2021, pp. 565-576, arXiv:2106.04489). Both per-layer HyperFormer (which places a task-conditioned hypernetwork in each Transformer layer) and the compact HyperFormer++ variant (which shares a single pair of adapter and LayerNorm hypernetworks across all layers and tasks conditioned on concatenated task z_tau, layer-ID l_i, and position p_j embeddings) are lumping-cohesive variants covered together in this record.
aliases:
- HyperFormer
- HyperFormer++
- Shared Hypernetwork Task-Conditional Adapter
