  rationale: HyperFormer uses shared hypernetwork neural networks to generate task-conditional adapter and layer-normalization weights inside frozen Transformer architectures.
limitations:
- Unshared per-layer HyperFormer increases total model parameters to 1.54x (6.86% per task on T5-Base) and requires 7.60 GB GPU memory unless cross-layer hypernetwork sharing (HyperFormer++) is used.
- In few-shot transfer to new tasks, updating only the task embedding underperforms jointly fine-tuning both the task embedding and hypernetwork weights.
- Relative to multi-task T5-Base fine-tuning, HyperFormer++_BASE still increases training time per 1,000 steps by 30.49% (7.19 min vs. 5.51 min), and optimal adapter reduction factors r vary across dataset sizes.
