id: AIMech:HyperGridDecomposableGridwiseHyperProjection
name: HyperGrid (Grid-wise Decomposable Hyper Projections for Multi-Task Transformers)
concept_kind: architecture
review_status: DRAFT
definition: "A multi-task Transformer projection architecture that pools the sequence task-prefix token into X in R^{d_m}, forms a d_r x d_c gating matrix via the sigmoid outer product of two decomposable vectors\u2014either Local-Local (L_r X)(L_c X)^T, Local-Global (L_r X) G_c^T, or Global-Local G_r (L_c X)^T\u2014tiles that gate across blocks of size (d_m / d_r) x (d_f / d_c) via a repeat operator psi(.), and applies residual element-wise weight gating Y_i = H_i(X_{i-1}, W_i) + W_i(X_{i-1}) to the second position-wise feed-forward layer of each Transformer block."
identity_notes: 'Introduced by Yi Tay, Zhe Zhao, Dara Bahri, Donald Metzler, and Da-Cheng Juan (ICLR 2021, arXiv:2007.05891). Distinct from post-FFN adapter hypernetworks such as HyperFormer (Karimi Mahabadi et al., ACL 2021; AIMech Round 703) and self-attention prompt hypernetworks such as HyperPrompt (He et al., ICML 2022; AIMech Round 706), as well as post-ReLU Output Gating (Section 7.3, Eq. 7): HyperGrid gates the pre-existing second FFN weight matrix W_i in R^{d_m x d_f} in 2D grid regions with negligible parameter overhead (d_m d_r + d_c in the LG variant). All four HyperGrid composition variants (L, L^2, LG, and GL) are covered within this single record.'
aliases:
- HyperGrid
- HyperGrid Transformer
- Grid-wise Decomposable Hyper Projections
- HyperGrid-LG
- HyperGrid-GL
- HyperGrid-L2
