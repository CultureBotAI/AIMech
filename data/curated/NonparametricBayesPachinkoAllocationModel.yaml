claims:
- claim_id: coupled-allocation-franchises
  kind: mechanism
  statement: Each token selects a document-local entryway; a newly created entryway selects a globally
    shared category representing a supertopic. Conditional on that category, the token selects a local
    document/category table. A new table selects a category-specific corpus-shared menu, and a new menu
    selects a globally shared dish representing a subtopic. Existing auxiliary objects retain their assigned
    category, menu or dish. A dish has a shared categorical word distribution with a Dirichlet base. Super-topic
    assignments therefore dynamically define groups for the lower franchise.
  evidence:
  - source_id: method-source
    locator: Section 2.3.1, PDF pp.3-4, five generative steps and Figure 1
    relation: supports
- claim_id: collapsed-franchise-inference
  kind: mechanism
  statement: The source proposes jointly sampling a token's entryway, category, table, menu and dish assignments,
    combining franchise predictive factors with a corpus dish-word predictive factor. Customer, entryway,
    table and menu counts play different roles; a correct leave-one-out calculation must consistently
    remove emptied auxiliary objects. Positive concentration parameters receive Gamma priors and are resampled
    by a cited HDP procedure. The word factor follows the dish identity in Table 1, despite nearby prose
    loosely calling that object a menu.
  evidence:
  - source_id: method-source
    locator: Section 2.3.2, PDF p.4, three conditional factors and hyperparameter discussion; Table 1
      p.3
    relation: supports
- claim_id: occupied-sparsity-boundary
  kind: mechanism
  statement: 'Reported sparse connectivity records which supertopic/subtopic pairs were occupied in finite
    assignments. It need not impose structural zero transition probabilities: a new local table and category
    menu can select a globally existing dish not previously used by that supertopic. In a synthetic positive-concentration
    example, such an unobserved edge retains predictive probability 1/24. Learning occupied topic counts
    within the fixed four-level organization is distinct from learning arbitrary DAG topology or guaranteeing
    the true finite number of topics.'
  evidence:
  - source_id: method-source
    locator: Section 2.3.1, PDF pp.3-4, new-object probabilities; Section 3.4 p.6 and Conclusions p.8
    relation: supports
