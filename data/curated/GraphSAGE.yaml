  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: At each depth, sampled neighbor representations are aggregated and combined with a node's
    current representation through learned transformations; parameters are shared across nodes.
  evidence:
  - source_id: original-paper
