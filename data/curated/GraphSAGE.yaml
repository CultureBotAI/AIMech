name: GraphSAGE
definition: An inductive graph representation architecture that learns neighborhood aggregation functions
  to generate node embeddings from features.
concept_kind: architecture
identity_notes: GraphSAGE learns an embedding-generating function, unlike individually fitted transductive
  node embeddings. The broad AIO graph-convolutional category does not require the named sampling-and-aggregation
  framework.
aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: Learned aggregation and transformation layers form an artificial neural network; this target
    is broader than the specific graph architecture.
- target: AIO:GraphConvolutionalNetwork
  relation: related_match
  rationale: The pinned definition broadly describes learning on graph structure, but GraphSAGE has its
    own inductive sampling/aggregation construction; a narrower GCN algorithm is not equated with it.
limitations:
- The paper describes multiple aggregators; no single mean or pooling variant defines the entire framework.
- Inductive construction does not guarantee accurate embeddings for every unseen graph or feature distribution.
id: AIMech:GraphSAGE
definition_evidence:
