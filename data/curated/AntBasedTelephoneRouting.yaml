id: AIMech:AntBasedTelephoneRouting
name: Ant-based telephone routing
concept_kind: algorithm
aliases: []
definition: A distributed telephone-routing algorithm that adapts neighbor-choice probabilities using
  mobile ant agents. Ants sample moves from destination-specific rows but reinforce entries toward their
  own source, with age and congestion delay modulating the updates. New calls follow the largest entries
  of the resulting destination rows in the source’s simulated circuit-switched network.
definition_evidence:
- source_id: schoonderwoerd1996-hpl
  locator: HPL-96-76, Section 2, printed pp. 3–4 / physical PDF pp. 24–23; Sections 4.1–4.5, printed pp.
    7–11 / physical PDF pp. 20–16. The retained PDF has reversed physical page order.
  relation: supports
claims:
- claim_id: telephone-model
  kind: scope
  statement: The source models a circuit-switched telephone network as an undirected graph. Each switching
    node has a finite capacity for simultaneous calls, while links have unbounded capacity in the model.
    A placed call consumes capacity at every node along its route; if a route node has no spare capacity,
    the call fails to be placed. This is the model in which the reported ant-based controller is evaluated.
  evidence:
  - source_id: schoonderwoerd1996-hpl
    locator: Section 2 and Section 2.1, printed p. 3 / physical PDF p. 24; Section 2.2, printed p. 4 /
      physical PDF p. 23; Section 4.3, printed p. 10 / physical PDF p. 17.
    relation: supports
- claim_id: source-directed-pheromone
  kind: mechanism
  statement: Each node stores a probability row over its neighbors for every other possible destination.
    An ant has a source and a randomly chosen destination, and samples its next neighbor using the row
    for that destination. On arrival at a node, it reinforces the entry pointing to its previous neighbor
    in the row for its own source. Thus the row used for movement differs from the row updated by that
    ant. The ant terminates when it reaches its destination.
  evidence:
  - source_id: schoonderwoerd1996-hpl
    locator: Section 4.1, printed pp. 7–8 / physical PDF pp. 20–19, especially Figure 4 and the ant from
      node 3 to node 2; Section 4.3, printed p. 10 / physical PDF p. 17.
    relation: supports
- claim_id: normalized-row-update
  kind: mechanism
  statement: For a probability row p, a selected previous-neighbor entry j and finite raw deposit d>=0,
    the source update is p_new[j]=(p[j]+d)/(1+d), with p_new[k]=p[k]/(1+d) for k!=j. The row remains nonnegative
    and sums to one in exact arithmetic. Equivalently, p_new=(1-r)p+r e_j with r=d/(1+d). The selected
    entry’s net increase is d*(1-p[j])/(1+d), rather than the raw deposit d.
  evidence:
  - source_id: schoonderwoerd1996-hpl
    locator: Section 4.1, printed pp. 8–9 / physical PDF pp. 19–18, the two displayed normalization formulas
      and their discussion. The convex-mixture and net-increment expressions are direct algebraic consequences.
    relation: supports
- claim_id: age-and-congestion
  kind: mechanism
  statement: The controller weakens positive reinforcement as an ant ages and delays ants at congested
    nodes. Waiting both reduces near-term ant departures and makes later updates weaker through increased
    age. The reported parameterization uses d=0.08/age+0.005 for positive elapsed age and delay=floor(80*exp(-0.075*s)),
    where s is spare node capacity in percent. These are the reported simulation parameters; the general
    discussion permits other age and utilization responses.
  evidence:
  - source_id: schoonderwoerd1996-hpl
    locator: Section 4.2, printed p. 9 / physical PDF p. 18; Sections 4.6–4.7, printed pp. 11–12 / physical
      PDF pp. 16–15; spare-capacity units in Section 2, printed p. 3 / physical PDF p. 24. The floor is
      visible in the physical PDF p. 15 formula.
    relation: supports
- claim_id: calls-and-exploration
  kind: mechanism
  statement: A new call chooses at each node the neighbor with the largest entry in the row for its destination,
    while ants use stochastic choices. The reported setup initializes equal neighbor probabilities and
    runs an ant-only period before introducing calls. An optional noise factor f lets an ant make a purely
    random choice with probability f and use the pheromone row with probability 1-f, encouraging exploration
    of alternatives. This noise changes ant movement, not the call argmax rule.
  evidence:
  - source_id: schoonderwoerd1996-hpl
    locator: Sections 4.3–4.5, printed pp. 9–11 / physical PDF pp. 18–16; Section 4.7, printed p. 12 /
      physical PDF p. 15, initialization-period parameters.
    relation: supports
limitations:
- The evidence concerns simulated undirected telephone-call networks with node-capacity congestion and
  unbounded links. It does not establish packet-routing behavior, validity for arbitrary asymmetric costs
  or performance in a deployed network. Physical communication links and their implementation costs are
  not modeled merely by the graph edges.
- A normalized probability row, positive initialization, exploration noise and an ant-only warm-up do
  not guarantee that deterministic argmax call routes reach their destination. The report acknowledges
  possible circular routes. Its warm-up and loop observations are not loop-freedom or optimality theorems;
  the displayed row update does not specify all argmax tie-breaking or cycle-handling choices.
- The stated deposit formula requires positive age, and the delay uses spare capacity on a 0–100 percentage
  scale rather than a 0–1 fraction. Its floor can yield zero waiting time. The raw deposit approaches
  0.005 as age grows, so neither it nor the equivalent mixing weight d/(1+d) is a vanishing gain. Constants,
  launch rates, warm-up periods and noise levels were selected empirically rather than derived as a universal
  convergence schedule.
- Initially positive entries remain positive under finitely many finite exact-arithmetic row updates,
  but there is no uniform positivity floor or finite-precision guarantee; an unselected zero entry remains
  zero. Alternatives shrink through normalization when another entry is reinforced, not through a separate
  global evaporation clock. Congestion delay withholds and weakens later positive reinforcement rather
  than directly subtracting a local penalty. These mechanisms do not establish monotone load relief, calibrated
  probabilities, unbiased costs, a Bellman backup or global convergence.
- The reported comparisons use a selected simulated topology, traffic patterns and tuned parameters. They
  do not establish universal superiority, negligible computational or table-storage cost, fault tolerance
  or security guarantees. The report explicitly notes additional computation/storage and leaves scaling,
  network failure and restoration studies unresolved.
- Probabilistic call routing, anti-pheromone and packet-network deployment are discussed as extensions,
  not baseline operations. The Appleby–Steward/Dijkstra-style agents in Section 5 are comparators. This
  original source-row telephone controller is not identified with AntNet’s separate datagram-routing construction,
  the whole ant-colony-optimization framework, Q-routing or later artificial bee colony algorithms merely
  through shared terminology or related update algebra.
- The declared evidence is the retained 1996 HPL-96-76 report mirror; its physical PDF page order is reversed,
  with physical page=27 minus printed page. The separate 1997 conference account is same-author context,
  not independent replication, and the journal publication was inspected only through metadata. No equivalence
  of report, conference and journal bytes, author-implementation verification, simulator execution or
  numerical benchmark reproduction is asserted.
aio_mappings:
- target: AIO:ReinforcementLearning
  relation: related_match
  rationale: The pinned task emphasizes feedback-driven exploration and exploitation without labeled corrective
    pairs. Ant-based telephone routing adapts route probabilities from ant age and congestion and can
    deliberately explore alternatives, supporting this qualified feedback-adaptation relationship. The
    local subject is a distributed routing algorithm, not every reinforcement-learning task. This is curator
    classification, not equivalence, an author-declared MDP or Q-learning formulation, or a convergence
    theorem; the report characterizes its motivating ant process as self-organization.
