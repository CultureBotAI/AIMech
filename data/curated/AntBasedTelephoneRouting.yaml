identity_notes: 'This identity selects the HPL-96-76 telephone controller with source-row reinforcement
  and separate stochastic-ant and largest-entry call routing policies. ABC remains source terminology,
  not an alias that would identify artificial bee colony. AntNet, AntColonyOptimization, QRouting and
  the learning-automata family retain distinct identities and mechanisms. Fresh postmerge collection on
  15 October 2026 at base a80a4e53097977b397421562fb1169aa1426dc8b inspected 757 maintained and 442 pinned
  AIO identities, including 4,789 identity-field occurrences and 3,661 normalized values. Four fixed-string,
  word-boundary searches included ignored and hidden files in the original checkout and three discovery/recovery
  checkouts: 8,131, 7,634, 18,826 and 22,178 occurrences, grouped into 3,163 exact contents. Candidate
  identities had no collision; the four PSO self-matches were explicitly retained for enrichment. Root
  read 159 decoded candidate contexts (including a separately retained two-context key/value projection
  correction), all 30 normalized match fields and relevant frontier fields/selected full owner objects.
  Supporting agents assessed the disjoint candidate and two contextual partitions; full raw-content reconstruction
  is separate from semantic assessment and is not a claim that root read all raw containers. Existing
  unrelated definitions, rendered mirrors, historical report/review contexts and incidental substrings
  do not establish equivalence. The frontier has 909 main and 393 nested objects; only owners 243, 258,
  260 and 261 change. This is bounded to the inspected pin, inventories and contexts, not all AI literature
  or saturation. Owner 260 retains its historical AntNet discovery URL; the inspected primary method is
  separately identified. Probability-vector resemblance neither makes this algorithm an automata synonym
  nor resolves automata theorem or variant scope.'
