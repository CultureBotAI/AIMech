id: AIMech:StreamingPCANearOptimalFiniteSampleOjaAlgorithm
name: Oja's Streaming PCA Algorithm with Matrix-Bernstein-Matching Finite-Sample Guarantees
concept_kind: algorithm
review_status: DRAFT
definition: Oja's Streaming PCA Algorithm with Matrix-Bernstein-Matching Finite-Sample Guarantees is a single-pass O(d)-space, linear-time streaming eigenvector estimation procedure and operator-theoretic convergence analysis established by Jain, Jin, Kakade, Netrapalli, and Sidford (2016) that initializes w_0 uniformly at random on the unit sphere in R^d and applies the normalized rank-1/matrix update w_i <- (w_{i-1} + eta_i A_i w_{i-1}) / ||w_{i-1} + eta_i A_i w_{i-1}||_2 over independent streaming samples A_1, ..., A_n satisfying E[A_i] = Sigma, ||A_i - Sigma||_2 <= M, and max{||E[(A_i-Sigma)(A_i-Sigma)^T]||_2, ||E[(A_i-Sigma)^T(A_i-Sigma)]||_2} <= V, using a shifted inverse-linear step size sequence eta_i = alpha / ((lambda_1 - lambda_2)(beta + i)) to match (and asymptotically improve by O(log d) upon) the batch Matrix Bernstein + Wedin sample complexity without warm-start initialization.
identity_notes: Distinct from generic PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) and DimensionalityReduction (AIO:DimensionalityReduction), which do not specify O(d)-space single-pass Oja updates or cumulative matrix-product operator moment bounds. Distinct from AIMech:NoisyPowerMethodForStreamingAndDifferentiallyPrivatePCA (Round 356), which groups samples into L blocks for block power iteration and incurs an extra O(lambda_1/(lambda_1 - lambda_2) * log n) sample-complexity factor (Table 1, p. 5). Also distinct from AIMech:ShiftAndInvertPreconditioningForFasterEigenvectorComputation (Round 354), which requires an O(gap)-close warm-start vector x_0 in the streaming setting, whereas Jain et al. (2016) prove global convergence from a uniform random unit vector w_0.
aliases:
- Jain-Jin-Kakade-Netrapalli-Sidford Oja Streaming PCA Analysis
- Matrix-Product Operator Analysis of Oja's Streaming PCA Algorithm
- Single-Pass O(d)-Space Oja Eigenvector Estimator
