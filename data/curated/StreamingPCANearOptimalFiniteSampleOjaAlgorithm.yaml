claims:
- claim_id: r357-claim-cumulative-operator-representation-and-one-step-power-lemma
  kind: mechanism
  statement: Oja's streaming update w_i = (w_{i-1} + eta_i A_i w_{i-1}) / ||w_{i-1} + eta_i A_i w_{i-1}||_2 initialized from a uniform random unit vector w_0 is algebraically identical to one step of the power method w_n = B_n w_0 / ||B_n w_0||_2 applied to the cumulative matrix product B_n = (I + eta_n A_n)(I + eta_{n-1} A_{n-1})...(I + eta_1 A_1) (Section 3, Equations 3-4), and with probability at least 1 - delta over w_0, the sine-squared alignment error with the top eigenvector v_1 of Sigma satisfies sin^2(v_1, w_n) = 1 - (v_1^T B_n w_0 / ||B_n w_0||_2)^2 <= (C log(1/delta) / delta) * Tr(V_perp^T B_n B_n^T V_perp) / (v_1^T B_n B_n^T v_1) (Lemma 3.1).
  evidence:
  - source_id: r357-primary-pdf
    locator: Section 1, Algorithm 1, p. 3; Section 3, Equations 3-4 and Lemma 3.1, pp. 7-8
    relation: supports
- claim_id: r357-claim-second-and-fourth-moment-operator-recurrences
  kind: mechanism
  statement: Under the streaming matrix Bernstein conditions (Definition 1) with V_bar = V + lambda_1^2 and step sizes eta_i <= 1 / (4 max{M, lambda_1}), the operator B_t satisfies (1) ||E[B_t B_t^T]||_2 <= exp(sum_{i=1}^t (2 eta_i lambda_1 + eta_i^2 V_bar)) (Lemma 5.1), (2) E[Tr(V_perp^T B_t B_t^T V_perp)] <= exp(sum_{j=1}^t (2 eta_j lambda_2 + eta_j^2 V_bar)) * (d + V sum_{i=1}^t eta_i^2 exp(sum_{j=1}^i 2 eta_j (lambda_1 - lambda_2))) (Lemma 5.2), (3) E[v_1^T B_t B_t^T v_1] >= exp(sum_{i=1}^t (2 eta_i lambda_1 - 4 eta_i^2 lambda_1^2)) (Lemma 5.3), and (4) E[(v_1^T B_t B_t^T v_1)^2] <= exp(sum_{i=1}^t (4 eta_i lambda_1 + 10 eta_i^2 V_bar)) (Lemma 5.4), which combine via Markov's and Chebyshev's inequalities to yield the general finite-sample error bound of Theorem 3.1.
  evidence:
  - source_id: r357-primary-pdf
    locator: Section 3, Theorem 3.1, pp. 8-9; Section 5, Lemmas 5.1, 5.2, 5.3, and 5.4, and Proof of Theorem 3.1, pp. 10-14
    relation: supports
- claim_id: r357-claim-shifted-inverse-linear-stepsize-finite-sample-bound
  kind: mechanism
  statement: Setting the step size sequence eta_t = alpha / ((lambda_1 - lambda_2)(beta + t)) for alpha > 1/2 and beta = 20 max(M*alpha/(lambda_1 - lambda_2), (V + lambda_1^2)alpha^2 / ((lambda_1 - lambda_2)^2 log(1 + delta/100))) guarantees that for n > beta, with probability at least 1 - delta, Oja's algorithm achieves sin^2(w_n, v_1) <= (C log(1/delta) / delta^2) * (d*(beta/n)^{2*alpha} + (alpha^2 V) / ((2*alpha - 1)(lambda_1 - lambda_2)^2 n)) (Theorem 4.1), matching the batch Matrix Bernstein + Wedin bound O(V log(d) / ((lambda_1 - lambda_2)^2 n) + (2*beta/n)^{2 log d}) for alpha = log d (Theorem 1.2) and improving the asymptotic leading term by O(log d) to O(V / ((lambda_1 - lambda_2)^2 n) + 1/n^2) for alpha = 6 when n > beta^{1.2} d^{0.1} (Theorem 1.3).
  evidence:
  - source_id: r357-primary-pdf
    locator: Section 1, Theorems 1.1, 1.2, and 1.3, and Table 1, pp. 2-5; Section 4, Theorem 4.1, pp. 9-10
    relation: supports
