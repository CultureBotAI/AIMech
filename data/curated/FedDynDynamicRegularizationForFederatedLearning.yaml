id: AIMech:FedDynDynamicRegularizationForFederatedLearning
name: FedDyn Dynamic Regularization for Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A communication-efficient federated optimization method (FedDyn) in which each active device k in P_t at round t minimizes a dynamically regularized local risk objective theta_k^t = argmin_theta [ L_k(theta) - <nabla L_k(theta_k^{t-1}), theta> + (alpha / 2) ||theta - theta^{t-1}||^2 ], recursively updates its local gradient state via the exact first-order optimality relation nabla L_k(theta_k^t) = nabla L_k(theta_k^{t-1}) - alpha * (theta_k^t - theta^{t-1}), and transmits only theta_k^t to the server, which updates a server state vector h^t = h^{t-1} - (alpha / m) * (sum_{k in P_t} theta_k^t - P * theta^{t-1}) == (1/m) sum_{k=1}^m nabla L_k(theta_k^t) and forms the next global model theta^t = (1/P) sum_{k in P_t} theta_k^t - (1/alpha) * h^t, ensuring that local optima dynamically align with stationary points of the global empirical loss L(theta) = (1/m) sum_{k=1}^m L_k(theta) under arbitrary statistical heterogeneity and partial participation without extra communication payload per round.
identity_notes: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization, which penalizes (mu/2)||theta - theta^{t-1}||^2 without the dynamic linear gradient-alignment term -<nabla L_k(theta_k^{t-1}), theta>, so client minimizers do not align with theta* when nabla L_k(theta*) != 0), from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, which doubles communication payload by transmitting control variate updates Delta c_i alongside model parameters), and from FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization). No pinned AIO class covers FedDyn.
aliases:
- FedDyn
- Federated Learning Based on Dynamic Regularization
- Dynamic Regularized Federated Optimization
