claims:
- claim_id: r387-dynamic-regularization-stationary-alignment-and-h-invariant
  kind: mechanism
  statement: By augmenting L_k(theta) with -<nabla L_k(theta_k^{t-1}), theta> + (alpha/2)||theta - theta^{t-1}||^2, exact local minimization enforces nabla L_k(theta_k^t) - nabla L_k(theta_k^{t-1}) + alpha(theta_k^t - theta^{t-1}) = 0 (Eq. 2), so the server recursion h^t = h^{t-1} - (alpha/m)(sum_{k in P_t} theta_k^t - P * theta^{t-1}) maintains the exact invariant h^t = (1/m) sum_{k=1}^m nabla L_k(theta_k^t) at every round t >= 1 even under partial participation P < m, and any fixed point theta_k^infty = theta^infty = theta* satisfies (1/m) sum_{k=1}^m nabla L_k(theta*) = 0.
  evidence:
  - source_id: r387-primary-pdf
    locator: Section 2.2 FedDyn Method, Algorithm 1, Equations 1-3, and Appendix A.1 Lemma 2, pp. 3-5, 13
    relation: supports
- claim_id: r387-communication-round-convergence-rates
  kind: mechanism
  statement: Under P-out-of-m partial client participation and L-smooth local losses, Theorems 1, 2, and 3 prove that FedDyn achieves O((1/T) sqrt(m/P) (L * D^2 + (1/L) * zeta_*^2)) convergence for convex losses, linear convergence (1 + mu / alpha)^{-(T-1)} with alpha = max(5*(m/P)*mu, 30*L) (i.e. O((m/P)*(L/mu) log(1/eps)) communication rounds independent of heterogeneity zeta_*^2) for mu-strongly convex losses, and O((L/T)*(m/P)) ergodic gradient norm decay for nonconvex losses.
  evidence:
  - source_id: r387-primary-pdf
    locator: Section 3 Theorems 1, 2, 3, and 4, and Table 1, pp. 5-6
    relation: supports
- claim_id: r387-stateful-client-gradient-and-exact-subproblem-limitation
  kind: limitation
  statement: Requires each client k to maintain a persistent local gradient state nabla L_k(theta_k^{t-1}) in R^d across communication rounds (making it unsuitable for purely stateless cross-device settings where clients participate only once) and assumes exact or high-accuracy minimization of the local regularized subproblem.
  evidence:
  - source_id: r387-primary-pdf
    locator: Section 2.2 Algorithm 1 and Section 3 Theorems 1-3 assumptions, pp. 4-6
    relation: supports
- claim_id: r387-heterogeneous-federated-vision-and-nlp-application
  kind: application
  statement: Applied to federated classification and language modeling on CIFAR-10, CIFAR-100, MNIST, Fashion-MNIST, Shakespeare, and StackOverflow across IID, Dirichlet non-IID, and 10%/1% partial participation regimes, achieving target accuracy in 3x-5x fewer communication rounds than FedAvg, FedProx, and SCAFFOLD.
  evidence:
  - source_id: r387-primary-pdf
    locator: Section 4 Experiments, Tables 2-3 & Figure 1, pp. 6-8
    relation: supports
