- target: AIO:FederatedLearning
  relation: narrow_match
  rationale: FedDyn is a federated learning optimization algorithm that dynamically modifies client risk objectives with a linear gradient-alignment term and quadratic proximal penalty.
limitations:
- Requires stateful clients that store nabla L_k(theta_k^{t-1}) in R^d between rounds of participation.
- Theoretical guarantees assume exact minimization of the local dynamically regularized objective at each active client.
