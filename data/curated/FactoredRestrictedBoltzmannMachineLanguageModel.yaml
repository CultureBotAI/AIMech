claims:
- claim_id: method
  kind: mechanism
  statement: 'Write r_w for the shared column embedding of word w. For context positions 1 through n-1
    and candidate word w at position n, define t=b_h+sum_(i<n) W_i^T r_context_i+W_n^T r_w and candidate
    bias a_w=b_r^T r_w+b_w. The conditional joint energy is E(w,h;context)=-t^T h-a_w. Summing binary
    h gives unnormalized word mass exp(a_w) times product_j(1+exp(t_j)); normalize these masses over candidate
    words. Given all words, hidden units are independent Bernoulli with probabilities sigmoid(t_j). Given
    h, the next word has softmax scores r_w^T W_n h+a_w. Exact conditional likelihood gradients use data-posterior
    statistics minus model expectations, whose vocabulary sum is explicit. The paper instead trains latent-variable
    models using finite contrastive divergence: start at the observed word, update hidden, word and hidden
    states, and contrast resulting statistics. Some runs replace the sampled one-hot word with its probability
    vector, a mean-field reconstruction variant.'
