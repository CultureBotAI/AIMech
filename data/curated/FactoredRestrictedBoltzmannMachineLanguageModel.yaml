name: Factored restricted Boltzmann machine language model
definition: A conditional neural word model that factorizes position-specific word-to-hidden weights through
  a shared word-embedding matrix and couples the next categorical word to binary hidden units in a context-conditioned
  restricted Boltzmann machine.
concept_kind: architecture
identity_notes: 'This is Mnih and Hinton’s static FRBM language architecture. Factored refers to matrices
  G_i=R W_i with shared learned word features, not explicit part-of-speech or morphological factors. Its
  context words are conditioned on; their marginal distribution is not learned by this single conditional.
  Temporal FRBM adds directed hidden-state history, while LBL removes stochastic hidden variables and
  Replicated Softmax models an undirected document of a given length. All 442 pinned AIO labels/scoped
  synonyms and 358 preceding native IDs/names/aliases were compared, with no normalized identity match.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main, returning
  33 lines each. All 24 unique matched contents were read: LBL source references and model contrasts,
  discovery leads and saved review context. These do not constitute existing candidate records. All 85
  semantic label/synonym hits and 22 exact AIO nodes were inspected, alongside corresponding generated
  records and four complete native neighbors. Previously read contextual files were checked for byte identity.
  Absence is bounded to this snapshot and inspected neighborhood.'
limitations:
- Equation (5) prints negative candidate-bias terms, whereas exp(-E) from Equations (2)–(4) and the word
  conditional in Equation (9) require positive a_w. The curated marginal follows those defining equations
  and discloses the sign conflict; it does not infer author-code behavior.
- The conditional partition is tractable by summing the vocabulary after binary-hidden marginalization.
  Generic RBM partition-function intractability must not be copied unchanged into this clamped-context
  construction; the exact calculation can still be expensive for a large vocabulary.
- Finite-step contrastive divergence is not the exact conditional maximum-likelihood gradient. A deterministic
  probability-vector reconstruction is not a categorical Gibbs sample.
- Sharing word features across positions does not make sequence context permutation invariant because
  W_i depends on position. Low-rank factorization constrains the effective interaction matrices.
- No predictive ranking, semantic quality guarantee, global training convergence or implementation certification
  is asserted.
