claims:
- claim_id: rslora-inverse-sqrt-rank-scaling-factor-theorem
  kind: mechanism
  statement: For an adapter gamma_r B A with B_0 = 0 and A_0 entries drawn i.i.d. with mean 0 and r-independent variance sigma_A, the expected update after n steps scales as E_{A_0}[gamma_r B_n A_n] in Theta_r(gamma_r^2 r), so setting gamma_r = alpha / sqrt(r) is the unique scaling exponent (up to a constant) that keeps forward output moments and backward input gradients at Theta_r(1) as r -> infinity.
  evidence:
  - source_id: r668-primary-pdf
    locator: Section 3 (Definition 3.1 & Theorem 3.2) & Appendix A (Proof of Theorem 3.2, Equations 6-11), pp. 3, 8-9
    relation: supports
- claim_id: rslora-elimination-of-high-rank-gradient-collapse
  kind: mechanism
  statement: "Whereas standard LoRA scaling gamma_r = alpha / r causes parameter gradient norms to shrink by orders of magnitude as r increases from 4 to 2048\u2014stunting learning so high ranks perform no better than rank 4\u2014rsLoRA preserves consistent initial gradient norms across all ranks and unlocks monotonic perplexity improvements with increasing rank."
  evidence:
  - source_id: r668-primary-pdf
    locator: Section 4 (Experimental Results, Figures 2-3) & Appendix B.1-B.4, pp. 4-5, 9-11
    relation: supports
- claim_id: rslora-application-llama2-and-gptj-instruction-and-math-finetuning
  kind: application
  statement: Applied to LLaMA-2-7B on OpenOrca with AdamW and SGD and to GPT-J-6B on GSM8K with Adafactor across ranks r in {4, 8, 32, 128, 512, 2048}, rsLoRA enables smooth training-compute-versus-perplexity scaling while merging (W + (alpha/sqrt(r)) B A) into the base weights with zero inference overhead.
  evidence:
  - source_id: r668-primary-pdf
    locator: Section 4 & Appendix B.2 (Figures 2, 4, 5), pp. 4-5, 9-10
    relation: supports
- claim_id: rslora-limitation-initialization-only-scaling-instability
  kind: limitation
  statement: Scaling only the initialization variance of A_0 by 1 / sqrt(r) without applying the multiplicative factor gamma_r = alpha / sqrt(r) to the adapter forward pass stabilizes gradients only at step 0 and becomes unstable later in training at large ranks (e.g., r = 2048), while higher ranks still incur proportional training memory and FLOPs.
  evidence:
  - source_id: r668-primary-pdf
    locator: Section 4 & Appendix B.3 (Scaling at Initialization Only, Figure 6), pp. 5, 10
    relation: supports
