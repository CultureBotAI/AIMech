name: Deep Q-network learning
aliases:
- DQN
- Deep Q-network
definition: A deep Q-learning method that trains a neural action-value function using replayed transitions
  and a separate target network.
concept_kind: algorithm
identity_notes: This record denotes the 2015 DQN learning procedure, not any arbitrary neural Q-function,
  one Atari checkpoint, or later Double DQN/Rainbow variants.
limitations:
- The cited formulation selects among discrete actions; continuous-action maximization is not supplied
  by this algorithm.
- The Atari results are not a general human-level intelligence or universal-control claim, and no benchmark
  result is curated here.
id: AIMech:DeepQNetwork
definition_evidence:
- source_id: original-paper
  locator: Methods, Model architecture and Training algorithm for deep Q-networks; Algorithm 1, PDF pp.
    6–7 (unnumbered Methods pages)
  relation: supports
claims:
- claim_id: learning-method
  kind: mechanism
  statement: The 2015 procedure samples replay minibatches, regresses action values toward reward-plus-discounted
    target-network maxima, and periodically copies the learned network into the target network while collecting
    actions with an epsilon-greedy policy. Terminal transitions use reward-only targets.
  evidence:
  - source_id: original-paper
    locator: Methods, Model architecture and Training algorithm for deep Q-networks; Algorithm 1, PDF
      pp. 6–7 (unnumbered Methods pages)
    relation: supports
