name: CD-PercLoss
definition: A conditional RBM training algorithm that contrasts the observed output free energy with that
  of a prediction selected by input-initialized stochastic search, treating the selected prediction as
  fixed during differentiation.
concept_kind: algorithm
identity_notes: 'This is the CD-PercLoss algorithm defined by Mnih, Larochelle and Hinton as a practical
  approximation to generalized perceptron-loss training. Unlike standard data-started contrastive divergence,
  its search begins from the conditioning input and chooses the best free-energy state among its search
  steps. The training algorithm, the generalized perceptron objective and the conditional RBM architecture
  are distinct identities. The name does not identify the AIO single-layer linear Perceptron architecture.
  The paper also allows extension to other models with computable energy or free energy and Gibbs sampling;
  this record states its conditional-RBM procedure. All 442 pinned AIO labels/scoped synonyms and 367
  preceding native IDs/names/aliases were compared, with no normalized identity match. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main, returning 37 lines each. All 27
  unique matched contents were read: conditional-RBM source references, contrasting method descriptions,
  pending leads and saved review context, rather than existing candidate identities. All 45 semantic label/synonym
  hits and 23 exact annotated AIO nodes were inspected, alongside corresponding generated records and
  three complete native neighbors. Previously read contextual files were checked for byte identity. Absence
  is bounded to this snapshot and inspected neighborhood.'
limitations:
- Finite search does not certify the global conditional mode. Its approximate free-energy difference can
  be negative, and its update can be zero when the searched prediction equals the observed target even
  though another output has lower free energy.
- Holding the prediction fixed is an explicit surrogate-update convention. It does not differentiate the
  sampling/selection process or produce the exact conditional log-likelihood gradient, and it does not
  guarantee calibrated conditional probabilities.
- The selected candidate is the lowest-free-energy state among k generated configurations, not necessarily
  the last chain state. Search initialization uses the conditioning input rather than the observed target;
  substituting ordinary data-started CD changes the procedure.
- Mean visible initialization and mean-field test updates are deterministic probability-valued computations,
  distinct from binary equilibrium samples or exact MAP inference. Tie-breaking and any final hard-decision
  convention need to be specified by an implementation; this record does not infer undocumented author-code
  behavior.
- The displayed loss has no explicit margin. The paper proposes margin-based extensions as future work;
  those are not silently part of CD-PercLoss. Results for the inspected denoising settings do not establish
  universal suitability, global convergence or equivalence to the linear perceptron.
