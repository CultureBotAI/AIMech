claims:
- claim_id: method
  kind: mechanism
  statement: For training pair (u,v), initialize each visible value from the logistic input-to-visible
    prediction sigmoid(b_v+W_uv^T u) when those connections exist; without them, draw independent Bernoulli(0.5)
    visible values. Holding u fixed, perform k Gibbs updates and retain the k resulting visible configurations.
    Choose a configuration v_hat with the lowest conditional free energy among those candidates. Update
    model parameters using the derivative of F(v,u)-F(v_hat,u) with v_hat held constant, contrasting the
    observed and searched free-energy derivatives. This replaces the generally intractable global minimum
    in the generalized perceptron loss by a finite stochastic search. The source uses k mean-field updates
    instead of sampled Gibbs updates for test-time predictions. No partition function enters the frozen-prediction
    free-energy-difference gradient.
