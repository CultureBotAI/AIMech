claims:
- claim_id: method
  kind: mechanism
  statement: 'For nonzero representations z_i,z_k and temperature tau>0, use s_ik=z_i^T z_k/(||z_i|| ||z_k||).
    In the SimCLR two-view configuration, N>=2 source examples produce 2N views; j is the other view of
    the same source as anchor i. Define ell(i,j)=−log[exp(s_ij/tau)/sum_(k=1..2N,k≠i) exp(s_ik/tau)].
    The denominator contains 2N−1 terms: the paired positive and 2N−2 other-source views; only the anchor
    itself is excluded. Average ell over both directions of every positive pair, giving 2N anchor losses.
    Temperature changes the softmax weighting of candidate similarities. The paper applies this objective
    to projected representations, but the mathematical loss does not itself prescribe an encoder, augmentation
    family or optimizer.'
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF p. 2, Equation (1); Algorithm 1, p. 3; Section 5.1 and Table 2, p. 6
    relation: supports
- claim_id: information-bound-scope
  kind: limitation
  statement: 'Curator qualification from comparing the two sampling constructions: SimCLR uses both augmented
    views of every other source as negative candidates, whereas Poole et al.’s Equation (10) states its
    InfoNCE expectation over independent joint pairs. The latter proof is not automatically a proof for
    the full SimCLR candidate construction. This comparison does not assert that no alternative dependent-candidate
    bound can hold.'
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF p. 2, Equation (1); Algorithm 1, p. 3, two-view candidate construction
    relation: supports
  - source_id: bound-context
