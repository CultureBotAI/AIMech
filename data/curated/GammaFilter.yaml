id: AIMech:GammaFilter
name: Gamma filter
aliases:
- Adaptive gamma filter
- ADALINE(μ)
concept_kind: model_family
definition: A linear adaptive filter family that combines a direct input tap with weighted cascaded first-order
  gamma-memory traces, using one shared memory coefficient to control the restricted feedback.
identity_notes: Compared all 442 pinned AIO and 584 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 5, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 110 AIO and 251 native definitions, with unchanged preceding rows
  verified and new matches read. 4 full annotated AIO node/edge/generated contexts and 4 full native records
  were inspected. Matches point to the pending Gamma-filter lead and Gamma neural-model context. This
  source-defined linear adaptive filter has a direct input tap and a weighted sum of cascaded gamma-memory
  traces; the broader Gamma neural architecture allows nonlinear spatial maps and neural couplings. The
  independently named ADALINE(mu) filter is a narrower model family, not a renamed generic ADALINE or
  the entire Gamma neural family. LinearStateSpaceLayer concerns a layer based on discretized continuous
  state-space systems; PseudoLinearRegressionEstimation is an estimation method and IteratedWienerFilter
  is a particular iterative denoising procedure. None supplies this exact identity. Fixed-memory-coefficient
  fitting is linear in tap weights, while joint memory-coefficient adaptation is not linear in all parameters,
  motivating only a related LinearRegression mapping.
