  relation: supports
claims:
- claim_id: linear-filter-recurrence
  kind: mechanism
  statement: For order parameter K, input u[n] and shared coefficient mu, define x0[n]=u[n] and update
    xk[n]=(1-mu)*xk[n-1]+mu*x(k-1)[n-1] simultaneously for k=1,...,K. Output y[n]=sum_(k=0..K) wk*xk[n]
    includes the direct w0 input tap. The transfer between adjacent stages is G(z)=mu/(z-(1-mu)); the
    output transfer is sum wk*G(z)^k. This parameterization has K+1 tap weights and one shared memory
    coefficient, hence K+2 adjustable scalars. It is a linear input-output filter for fixed coefficients,
    although its parameterization is not jointly linear in weights and mu.
  evidence:
  - source_id: principe1993
    locator: SectionsII–III, Equations1–6, printed pp.649–650 / PDF pp.1–2; SectionIII.E parameter count,
      printed p.652 / PDF p.4
    relation: supports
- claim_id: fixed-memory-stability
  kind: limitation
  statement: For fixed real mu the memory-stage pole is 1-mu, strictly inside the unit circle when 0<mu<2.
    At mu=1 the stages form a tapped delay line and the filter becomes FIR. At mu=0 no new input enters
    the memory stages and their initial values remain frozen; mu=2 permits resonance from a bounded alternating
    input. Degenerate weights or cancellations can lower the output transfer order, so this stage condition
    is not an unconditional characterization of every degenerate output transfer. It also does not guarantee
    convergence or stability during unconstrained coefficient adaptation.
  evidence:
  - source_id: principe1993
    locator: SectionIII.B, printed p.650 / PDF p.2; TableI, printed p.653 / PDF p.5; Discussion, printed
      pp.655–656 / PDF pp.7–8; direct stage-pole reasoning
    relation: supports
- claim_id: dispersive-memory
  kind: mechanism
  statement: With zero initial state and 0<mu<1, the kth-stage impulse response is binomial(n-1,k-1)*mu^k*(1-mu)^(n-k)
    for n>=k. It has unit sum and mean lag k/mu, so K/mu describes a mean depth for the last stage, not
    a hard memory horizon or an exact delayed sample. For 1<mu<2 the response alternates in sign and is
    not a probability distribution. The gamma-coordinate transformation makes the transfer polynomial
    in an alternative delay variable; that does not make the ordinary-time impulse response finite for
    general mu.
  evidence:
  - source_id: principe1993
    locator: SectionsIII.A–C, Equations7–12 and Figures2–3, printed pp.650–652 / PDF pp.2–4; SectionV,
      printed pp.654–655 / PDF pp.6–7
    relation: supports
- claim_id: block-and-online-adaptation
  kind: mechanism
  statement: For a fixed-parameter block with half-squared error and e[n]=d[n]-y[n], gradient descent
    uses weight increments proportional to sum_n e[n]*xk[n] and a memory-coefficient increment proportional
    to sum_n e[n]*sum_k wk*alpha_k[n]. For parameter-independent zero initial state, alpha0=0 and alpha_k[n]=(1-mu)*alpha_k[n-1]+mu*alpha_(k-1)[n-1]+x_(k-1)[n-1]-xk[n-1].
    Other initial-state conventions require corresponding initial sensitivities. The paper labels its
    samplewise updates a local-in-time approximation; fixed-parameter derivative identities do not establish
    exact gradients under arbitrary parameter drift. The direct recurrence uses O(K) work per step, without
    a universal training-time or convergence guarantee.
  evidence:
  - source_id: principe1993
    locator: SectionIII.D, Equations13–20, printed pp.651–652 / PDF pp.3–4; curator fixed-parameter derivative
      check
    relation: supports
- claim_id: normal-equations-and-nonconvexity
  kind: limitation
  statement: For fixed mu in a stationary finite-second-moment setting, the tap-weight MSE normal equation
    is Rw=p with R=E[xx^T] and p=E[d*x]; uniqueness additionally needs suitable rank, such as positive-definite
    R. Direct differentiation gives the memory-coefficient stationarity condition E[e*sum_k wk*alpha_k]=0.
    A total derivative of R includes both E[alpha*x^T] and E[x*alpha^T], so a one-sided cross-moment must
    not be used as that full derivative. Joint adaptation in mu and the tap weights is not generally convex;
    the suggested mu=1 initialization is a heuristic, not a global optimum guarantee.
  evidence:
  - source_id: principe1993
    locator: SectionIII.E, Equations21–25, printed pp.652–653 / PDF pp.4–5; Discussion, printed pp.655–656
      / PDF pp.7–8; curator direct differentiation of the second moment
    relation: supports
- claim_id: system-identification-evidence
  kind: scope
  statement: The reported experiments concern identification of two third-order elliptic low-pass systems.
    They compare analytic fixed-mu normal-equation solutions and samplewise tap-weight LMS results across
    selected mu values and orders. Such comparisons do not demonstrate automatic convergence of learned
    mu on arbitrary problems or universal superiority over FIR filters. Additional signal applications
    mentioned at the end of SectionIV are deferred to later publication and are not detailed experiments
    here.
  evidence:
  - source_id: principe1993
    locator: SectionIV, Figures4–5 and deferred signal-application statement, printed pp.653–654 / PDF
      pp.5–6; Discussion, printed pp.655–656 / PDF pp.7–8
    relation: supports
