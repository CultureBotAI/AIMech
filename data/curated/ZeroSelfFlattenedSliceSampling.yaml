limitations:
- This local record denotes the finite ZFSS blocker-and-bar construction. Generic slice sampling, Gibbs
  sampling, FSS and general nonreversible MCMC are not exact aliases.
- The zero-self name does not promise zero self probability when a state has mass greater than one half.
  Zero-current rows are a stated convention, not uniquely determined by the stationary law.
- The supplied finite order, tie convention and full conditional probabilities are part of the mechanism.
  Invalid targets, undefined conditioning contexts, adaptive order changes and countably infinite extensions
  are outside this record.
- The inspected author report is retained with its printed Figure 10 and Algorithm 9 caveats. No complete
  84-page empirical review, author-code execution, numerical implementation guarantee or benchmark reproduction
  is claimed.
