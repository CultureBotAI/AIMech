id: AIMech:ZeroSelfFlattenedSliceSampling
name: Zero-self flattened slice sampling
concept_kind: algorithm
definition: A finite categorical conditional-update algorithm that flattens probability bars and relocates
  a qualifying blocker before the maximum-probability state, yielding directed slice transitions with
  the minimum permitted self-transition probability.
definition_evidence:
- source_id: neal2024
  locator: Section 11, PDF pp. 42–43, ZFSS reordering; Algorithm 8, pp. 44–45, ZERO true
  relation: supports
claims:
- claim_id: blocking-state-and-flattened-bars
  kind: mechanism
  statement: Use an ordered finite state list and nonnegative probabilities pi summing to one. In the
    regular case max(pi)<1/2 and pi(k)>0, choose the first maximum a, with mass h, and let s be the second
    largest probability. Scan cyclically backward from a for the first state b satisfying pi(b)>=f*s,
    recomputing f=(h-s)/(1-h-pi(b)) for each candidate. Move b immediately before a while retaining the
    relative order of all other states. Shorten the original a bar to height s and append an a-labelled
    bar of height f*pi(j) after each original bar j other than a and b. Choose a current-symbol bar proportional
    to its height, draw a uniform height within it and move to the previous active bar with wraparound.
    The regular denominator is positive, 0<=f<1, and a second-largest state qualifies as a blocker, so
    the search terminates. Tied maxima give f=0.
  evidence:
  - source_id: neal2024
    locator: Section 11, PDF pp. 42–43, blocker construction; Algorithm 8, pp. 44–45, ZERO true
    relation: supports
- claim_id: invariance-and-avoided-self-transitions
  kind: mechanism
  statement: 'Bar splitting retains total height pi(j) for every symbol. At a fixed height, the predecessor
    map is a cyclic permutation of active bars, preserving their uniform distribution; integrating height
    and projecting labels preserves pi. An added a bar is no taller than its preceding original bar, so
    movement from that piece leaves a. The relocated blocker prevents the original a bar from reaching
    another a piece: below its height it intercepts movement, and above its height no added a piece is
    active because their heights are at most f*s. Thus self probabilities are zero in the regular case.
    Applied to a valid full conditional with other coordinates fixed, the kernel preserves the joint target;
    fixed mixtures and compositions preserve it too. These facts alone do not establish reversibility
    or convergence.'
  evidence:
  - source_id: neal2024
    locator: Section 11, PDF pp. 41–43, invariant-slice framework and blocker argument; Section 2, pp.
      2–3, Equations 2–4; geometric calculations in research/discovery/fss-zfss-boundaries.py
    relation: supports
- claim_id: dominant-mass-and-zero-state-conventions
  kind: scope
  statement: 'If the current value has pi(k)=0, Algorithm 8 assigns its outgoing row pi before the other
    cases. This convention does not define a conditional law when its conditioning context has zero total
    mass. For positive current mass and h=max(pi)>=1/2, every nonmaximum state moves to a, while P(a,a)=(2h-1)/h
    and P(a,j)=pi(j)/h for j!=a. The overall self probability is then 2h-1, the minimum allowed by stationarity.
    At h=1/2 it is zero; at h=1 the supported state is absorbing. This common kernel is reversible on
    positive support, even though the regular ZFSS construction is generally nonreversible. The uniqueness
    argument does not constrain zero-mass rows: for pi=(1/2,1/2,0), both the prescribed third row pi and
    the alternative (1,0,0) preserve the same target and minimum self mass.'
  evidence:
  - source_id: neal2024
    locator: Algorithm 8 Part 1, PDF p. 44, zero-current and dominant-mass branches; Section 13, p. 51,
      Equations 112–114; exact support example in research/discovery/fss-zfss-extra-boundaries.py
    relation: supports
- claim_id: finite-checks-and-printed-matrix-discrepancy
  kind: scope
  statement: 'Curator exact rational checks compare Algorithm 8, explicit bar geometry and a separately
    written interpretation of Algorithm 9 on 4,450 ordered target vectors. Their 8,900 paired FSS/ZFSS
    kernels agree on 48,580 rows and preserve the target; ZFSS achieves the minimal self mass in every
    tested case. The printed ZFSS matrix in Figure 10 does not preserve its stated target (1/10,1/5,1/5,1/20,9/20):
    multiplication gives (17/140,17/70,1/5,1/28,2/5). In the original state order, the calculations instead
    give row 2=(1/7,0,0,0,6/7) and row 3=(0,2/7,0,1/14,9/14), while the printed last row (10/63,20/63,4/9,5/63,0)
    agrees. The printed matrix is a negative control; the defining algorithms and geometry support the
    maintained kernel. These bounded checks are not an author-issued correction, implementation replication
    or general numerical proof.'
  evidence:
  - source_id: neal2024
    locator: Figure 10, PDF p. 42, rightmost matrix; Algorithms 8–9, pp. 44–47; original curator calculations
      in research/discovery/fss-zfss-boundaries.py
    relation: supports
- claim_id: kernel-distinction-and-periodicity
  kind: limitation
  statement: 'ZFSS changes the kernel when its blocking-state relocation is needed; it coincides with
    FSS in cases where it is not needed and in the shared dominant-mass branch. The exact suite contains
    297 targets with different FSS and ZFSS matrices. Zero self transitions do not establish ergodicity:
    for m uniformly weighted states, ZFSS is a deterministic predecessor cycle of period m. A fixed full
    scan of two independent uniform three-state coordinates maps (a,b) to (a-1 mod 3,b-1 mod 3), with
    three closed classes indexed by a-b mod 3. The joint target is invariant but one trajectory cannot
    explore all classes. No universal variance reduction, finite-run accuracy or wall-clock advantage
    is asserted.'
  evidence:
  - source_id: neal2024
    locator: Section 11, PDF pp. 42–43, FSS/ZFSS distinction; Section 13, pp. 49–51, uniform cycles and
      common boundary kernel; exact examples in research/discovery/fss-zfss-boundaries.py and research/discovery/fss-zfss-extra-boundaries.py
    relation: supports
- claim_id: fast-sampler-interpretation-limits
  kind: limitation
  statement: 'Algorithm 8 supplies the explicit maintained transition probabilities. The Algorithm 9 comparison
    interprets the zero-current branch as one inverse-CDF traversal because its printed outer loop line
    reuses an index that is immediately reset. This is a documented interpretation, not a verified literal
    author implementation. Its stated nonzero-output guarantee also fails for an exact closed-uniform
    endpoint: with pi=(1/4,1/4,1/2), current state 3 and r=1, the dominant-mass branch returns state 3
    although P(3,3)=0. This has zero probability under an ideal continuous uniform law and does not change
    that law, but it prevents an unconditional endpoint or floating-point correctness claim. No author
    software was executed.'
  evidence:
  - source_id: neal2024
    locator: Algorithm 9 Part 1, PDF p. 46, output guarantee, zero-current loop and dominant-mass CDF;
      endpoint checks in research/discovery/fss-zfss-extra-boundaries.py
    relation: supports
identity_notes: The post312 assessment covers all 442 pinned AIO and 706 native IDs, names, aliases and
  scoped synonyms, plus four complete checkout searches including ignored and hidden files. The maintained
  identity is a finite ordered conditional kernel, distinct from generic slice/Gibbs, interval and elliptical
  slice procedures, MH-within-Gibbs and persistent-sign/pair-state samplers. Earlier 703-native searches
  and 18 exact AIO contexts are preserved with their reading scopes; the three actual batch312 native
  neighbors were assessed for this identity comparison. AIO:MarkovChain is related_match at a different
  abstraction level; no neural Network or ProbabilisticHiddenLayer inheritance is implied. ZFSS denotes
  the nearest-qualifying-blocker ZERO=true policy. It differs from FSS for positive-probability transitions,
  while sharing special cases. Zero-self means removal of avoidable self transitions; it is not an exact
  alias for arbitrary minimum-self kernels. No aliases are adopted.
