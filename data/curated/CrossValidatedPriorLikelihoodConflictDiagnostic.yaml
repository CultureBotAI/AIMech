aio_mappings:
- target: AIO:RandomEffectsModel
  relation: related_match
  rationale: The diagnostic compares information about hierarchical random unit effects against their
    population distribution. RandomEffectsModel provides this defining model context but does not denote
    the held-out replication and conflict-scoring procedure; the mapping asserts relatedness, not equivalence
    or subclass membership.
limitations:
- A well-defined hierarchical posterior does not ensure that a held-out fit or local reference-prior replication
  is proper. Reference-prior choice, parameter scale, rank and identifiability need case-specific checks.
- A shared nuisance cut requires a specified joint simulation law and normalization order. It prevents
  a selected feedback path, not all dependence; independent marginal recombination can change the diagnostic.
- The original 2007 PDF p. 11 displays a difference mean with the opposite sign to its prior-minus-likelihood
  definition, and Figure 4 on PDF p. 31 gives an inconsistent inequality. Appendix A2 on PDF p. 23 also
  refers to Equation 13, a predictive distribution for the estimator, when discussing the latent prior
  replicate. The record follows the declared difference and generative hierarchy, retaining observation-estimator
  variance only once as in Equation 15.
- Known-variance Gaussian equivalence and a proper-prior preposterior calibration statement do not imply
  fixed-parameter uniformity for arbitrary informative priors. Tail direction, discreteness, nuisance
  coupling, dependence across units and Monte Carlo error remain substantive limitations.
- All 36 Marshall–Spiegelhalter publisher pages, 22 Presanis et al. electronic-reprint pages and 42 Tan–Nott
  preprint pages were read. No author software, MCMC, model fitting or empirical calibration experiment
  was run. Independent analytic examples check Gaussian equivalence, fixed-parameter versus preposterior
  size, conditional normalization and nuisance-induced covariance; they do not reproduce source experiments.
