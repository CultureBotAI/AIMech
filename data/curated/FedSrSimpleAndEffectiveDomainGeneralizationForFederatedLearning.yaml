  relation: broad_match
  rationale: FedSR is a specialized federated domain generalization algorithm within decentralized federated learning (AIO:FederatedLearning) that regularizes local representations via L2 norm and variational conditional mutual information bounds.
limitations:
- Representation invariance is only enforced across participating source domains and may not hold under arbitrary target-domain distribution shifts.
- Requires tuning two regularization hyperparameters (alpha^{L2R} and alpha^{CMI}) and using a probabilistic encoder p(z|x) with reparameterization sampling when ell_i^{CMI} is active.
