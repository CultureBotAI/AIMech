claims:
- claim_id: l2r-representation-norm-implicit-marginal-gaussian-alignment
  kind: mechanism
  statement: The L2-norm representation regularizer ell_i^{L2R} = E_{p_i(x)}[E_{p(z|x)}[||z||_2^2]] = E_{p_i(z)}[||z||_2^2] (Eqs. 10-12) satisfies ell_i^{L2R} = 2 sigma^2 E_{p_i(z)}[-log q(z)] (up to an additive constant) = 2 sigma^2 (H(p_i(z)) + KL[p_i(z) || q(z)]) (Eqs. 13-15) with respect to reference distribution q(z) = N(0, sigma^2 I), so minimizing ell_i^{L2R} at each client implicitly aligns every client's marginal representation distribution p_i(z) toward q(z) around the origin.
  evidence:
  - source_id: r498-primary-pdf
    locator: Section 3.3.1, Eqs. (10)-(15), pp. 5-6
    relation: supports
- claim_id: cmi-variational-upper-bound-and-implicit-conditional-alignment
  kind: mechanism
  statement: For any variational conditional distribution r(z|y) sharing support with p(z|x), ell_i^{CMI} := E_{p_i(x,y)}[KL[p(z|x) || r(z|y)]] satisfies both Lemma 1 (I_i(x, z | y) <= ell_i^{CMI}, Eq. 17) and Lemma 2 (ell_i^{CMI} >= E_{p_i(y)}[KL[p_i(z|y) || r(z|y)]], Eq. 19), because ell_i^{CMI} = I_i(x, z | y) + E_{p_i(y)}[KL[p_i(z|y) || r(z|y)]]; consequently, jointly optimizing p(z|x) and r(z|y) = N(z; mu_y, sigma_y^2) restricts non-label spurious information in z while forcing p_i(z|y) approx r(z|y) approx p_j(z|y) across all clients i, j.
  evidence:
  - source_id: r498-primary-pdf
    locator: Section 3.3.2, Eqs. (16)-(19), Lemmas 1-2, pp. 6-7
    relation: supports
- claim_id: leave-one-domain-out-federated-domain-generalization-benchmarks
  kind: application
  statement: Under leave-one-domain-out federated evaluation with E = 5 local SGD iterations per round, FedSR outperforms both FedAvg and FedADG across RotatedMNIST (96.7% vs. 94.5% FedAvg and 96.0% FedADG), PACS with ResNet-18 (83.7% vs. 80.3% FedAvg and 81.2% FedADG), OfficeHome with ResNet-50 (69.3% vs. 67.9% FedAvg and 68.4% FedADG), and DomainNet with ResNet-50 (41.3% vs. 39.6% FedAvg and 40.4% FedADG) (Tables 1-4, pp. 8-9).
  evidence:
  - source_id: r498-primary-pdf
    locator: Section 4.1-4.4, Tables 1-4, pp. 7-9
    relation: supports
- claim_id: source-domain-invariance-and-gaussian-variational-family-limitation
  kind: limitation
  statement: FedSR enforces marginal and class-conditional representation invariance only across observed source domains and may fail to generalize under arbitrary shifts in an unseen target domain; moreover, the default single-Gaussian variational family r(z|y) = N(z; mu_y, sigma_y^2) cannot represent multimodal class-conditional posteriors without switching to mixture distributions and Monte Carlo KL estimation.
  evidence:
  - source_id: r498-primary-pdf
    locator: Section 3.3.3, p. 7; Section 5 Conclusion, p. 10
    relation: supports
