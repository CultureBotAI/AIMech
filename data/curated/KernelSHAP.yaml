name: Kernel SHAP
definition: A model-agnostic Shapley-attribution estimator using weighted linear regression on feature-presence
  subsets.
concept_kind: algorithm
identity_notes: Kernel SHAP is a specific estimator within the SHAP framework. Its Shapley kernel and
  constraints distinguish it from an arbitrary LIME regression surrogate.
limitations:
- Results depend on how missing features are evaluated and on sampling; exact Shapley recovery in the
  full weighted problem is not a guarantee for every finite sample or background choice.
- Independence approximations do not in general reproduce a dependence-aware conditional expectation.
