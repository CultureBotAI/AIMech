id: AIMech:QFairFederatedLearningAlphaFairResourceAllocation
name: q-Fair Federated Learning (q-FFL) and q-FedAvg for Alpha-Fair Resource Allocation
concept_kind: algorithm
review_status: DRAFT
definition: A fairness-aware federated optimization formulation (q-Fair Federated Learning, q-FFL) and its communication-efficient solver (q-FedAvg) inspired by alpha-fair resource allocation in wireless networks, which minimizes the reweighted aggregate objective f_q(w) = sum_{k=1}^m (p_k / (q + 1)) F_k^{q+1}(w) across m devices with non-negative local losses F_k(w) and tunable fairness exponent q >= 0, continuously interpolating between standard Federated Averaging (q = 0) and minimax Agnostic Federated Learning (q -> infinity). Using an analytical local Lipschitz upper bound L_q(w) = L F_k(w)^q + q F_k(w)^{q-1} ||nabla F_k(w)||^2 derived from the base smoothness constant L at q = 0, q-FedSGD and q-FedAvg dynamically scale device updates Delta_k = F_k^q(w^t) Delta_k^t by the denominator sum_k h_k^t without retuning learning rates for each q.
identity_notes: Distinct from standard Federated Averaging (AIMech:FederatedAveragingClientServerOptimization, which is the q = 0 special case that minimizes average loss without controlling cross-device accuracy variance) and from Ditto (AIMech:DittoFairAndRobustPersonalizedFederatedMultiTaskLearning, which achieves device fairness via personalized models v_k regularized toward w^* rather than learning a single fair global model w via (q+1)-power loss reweighting).
aliases:
- q-FFL
- q-Fair Federated Learning
- q-FedAvg
- q-FedSGD
- q-MAML
