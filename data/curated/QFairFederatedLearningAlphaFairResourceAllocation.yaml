claims:
- claim_id: r394-local-lipschitz-hessian-bound-and-dynamic-step-size
  kind: mechanism
  statement: Lemma 3 proves that for any non-negative L-smooth function f(w), the gradient of f_q(w) = f(w)^{q+1}/(q+1) is nabla f_q(w) = f(w)^q nabla f(w) with Hessian nabla^2 f_q(w) = q f(w)^{q-1} nabla f(w) nabla f(w)^T + f(w)^q nabla^2 f(w), whose spectral norm at w is upper-bounded by L_q(w) = L f(w)^q + q f(w)^{q-1} ||nabla f(w)||^2; substituting the heuristic local update Delta_k^t = L(w^t - w_bar_k^{t+1}) for nabla F_k(w^t) in q-FedAvg (Algorithm 2) yields h_k^t = q F_k^{q-1}(w^t)||Delta_k^t||^2 + L F_k^q(w^t), allowing a single tuned step size 1/L at q = 0 to transfer across all q > 0.
  evidence:
  - source_id: r394-primary-pdf
    locator: 'Section 3.3 Improving Communication Efficiency: q-FedAvg (Lemma 3, Algorithms 1-2), pp. 4-6'
    relation: supports
- claim_id: r394-uniformity-interpolation-and-variance-reduction
  kind: mechanism
  statement: Under Definition 1 (fairness via uniformity of test accuracy distribution across devices) and Appendix B.2 Lemmas 4-6, increasing q >= 0 amplifies relative gradient contributions from higher-loss devices as (F_i(w) / F_j(w))^q, monotonically decreasing the generalization error of the worst-performing device and tightening the cross-device accuracy variance.
  evidence:
  - source_id: r394-primary-pdf
    locator: Section 3.1 Definition 1, Section 3.2 Eq. (2), and Appendix B.2 Properties of the q-FFL Objective (Lemmas 4-6), pp. 3-4, 15-16
    relation: supports
- claim_id: r394-nonnegative-loss-and-mean-worst-tradeoff-limitation
  kind: limitation
  statement: Requires local objective functions F_k(w) >= 0 so F_k^{q+1}(w) preserves convexity/monotonicity, and replacing nabla F_k(w^t) by L(w^t - w_bar_k^{t+1}) in q-FedAvg is a heuristic approximation when multiple local SGD steps are taken; moreover, overly large q prioritizes noisy or outlier devices at the expense of mean global accuracy.
  evidence:
  - source_id: r394-primary-pdf
    locator: Section 3.2-3.3 and Section 4.2 Choosing q, pp. 4-8
    relation: supports
- claim_id: r394-federated-benchmarks-and-q-maml-application
  kind: application
  statement: Applied to Federated Extended MNIST (FEMNIST), Vehicle sensor classification, Sent140 Twitter sentiment analysis, Shakespeare RNN, and Omniglot meta-learning via q-MAML (Algorithm 4), reducing cross-device test accuracy variance by an average of 45% while maintaining mean accuracy.
  evidence:
  - source_id: r394-primary-pdf
    locator: Section 4 Evaluation (Table 1, Figures 1-4) and Appendix D Algorithm 4 (q-MAML), pp. 6-9, 18-19
    relation: supports
