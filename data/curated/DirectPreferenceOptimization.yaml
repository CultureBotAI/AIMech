id: AIMech:DirectPreferenceOptimization
name: Direct preference optimization
definition: Preference-based policy fitting using a classification objective on policy-to-reference probability
  ratios for preferred and dispreferred responses.
concept_kind: algorithm
identity_notes: A training algorithm, not an instruction-tuned language-model instance or a synonym for
  all reinforcement learning from human feedback.
definition_evidence:
- source_id: original-paper
  locator: Section 4, equations 4–7, PDF/printed p. 4
  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: A reward-to-policy reparameterization yields a logistic preference loss that trains the policy
    without separately fitting an explicit reward model.
  evidence:
  - source_id: original-paper
    locator: Section 4, equations 4–7, PDF/printed p. 4
    relation: supports
