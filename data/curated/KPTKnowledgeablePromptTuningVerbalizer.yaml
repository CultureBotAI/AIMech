id: AIMech:KPTKnowledgeablePromptTuningVerbalizer
name: Knowledgeable Prompt-Tuning (KPT) Verbalizer
concept_kind: algorithm
review_status: DRAFT
definition: A prompt-tuning verbalizer construction, refinement, and aggregation method that expands each class anchor label v_0 into a multi-granularity candidate label-word set V_y = N_G(v_0) union {v_0} using external knowledge bases (such as ConceptNet, WordNet, Related Words, and sentiment lexicons), denoises V_y using an unlabeled support set C_tilde via contextualized prior frequency refinement P_D(v) = (1/|C_tilde|) sum_{x in C_tilde} P_M([MASK]=v|x_p), TF-IDF-style cosine relevance refinement R(v) = r(v, f(v)) (|Y|-1) / sum_{y != f(v)} r(v, y) >= 1, contextualized prior calibration P_tilde([MASK]=v|x_p) proportional to P_M([MASK]=v|x_p)/P_D(v), and learnable per-word softmax weights alpha_v = exp(w_v) / sum_{u in V_y} exp(w_u), and predicts class labels by averaging or weighted-averaging refined word scores.
identity_notes: Distinct from single-word manual verbalizers in PET (AIMech:PatternExploitingTraining), from gradient- or likelihood-searched small vocabulary verbalizers in AutoPrompt (AIMech:AutoPromptGradientGuidedDiscretePromptSearch) and LM-BFF (AIMech:LMBFFBetterFewShotFineTuning), which require labeled data and find only near-synonyms, and from continuous soft verbalizers in WARP (AIMech:WARPWordLevelAdversarialReProgramming), which cannot operate in zero-shot settings.
aliases:
- Knowledgeable Prompt-Tuning
- KPT
- KPT Knowledgeable Verbalizer
- Knowledge-Expanded Verbalizer Refinement for Prompt Tuning
