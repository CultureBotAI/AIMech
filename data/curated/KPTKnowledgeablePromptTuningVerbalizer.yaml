claims:
- claim_id: r723-claim-bayesian-verbalizer-decomposition
  kind: mechanism
  statement: 'Under marginalization over label words p(Y=y|x) proportional to sum_{v in V_y} [p([M]=v|Y=y) / p([M]=v)] P_M([M]=v|x_p), KPT decomposes multi-word verbalizer prediction into three factors: class-conditional word relevance p([M]=v|Y=y) (estimated by quantized Relevance Refinement R(v) >= 1 in zero-shot or continuous Learnable Refinement weights alpha_v in few-shot), contextualized word prior p([M]=v) = P_D(v) in the denominator (removed by Frequency Refinement and divided out by Contextualized Calibration), and the PLM masked token likelihood P_M([M]=v|x_p).'
  evidence:
  - source_id: r723-primary-pdf
    locator: Section 3.3 & Appendix B, Equations 2-8 and 12-17, pp. 4-5, 12-13
    relation: supports
- claim_id: r723-claim-oov-subtoken-averaging
  kind: mechanism
  statement: Because external knowledge bases contain out-of-vocabulary (OOV) multi-subword expressions not tailored to the PLM tokenizer, KPT computes the prediction score of each OOV label word by averaging the PLM prediction probabilities of its constituent subword tokens at the single [MASK] position, retaining over 100 refined label words per dataset and matching or outperforming single-token-restricted verbalizers.
  evidence:
  - source_id: r723-primary-pdf
    locator: Section 3.3 & Appendix D.3-D.4, Table 6, Figure 4, pp. 5, 14-15
    relation: supports
- claim_id: r723-claim-zero-and-few-shot-error-reduction
  kind: application
  statement: Across five topic and sentiment classification benchmarks (AG's News, DBPedia, Yahoo, Amazon, IMDB) with RoBERTa-large, KPT reduces average classification error rate by 16%, 18%, 10%, and 7% in 0-shot, 1-shot, 5-shot, and 10-shot settings respectively compared to the best baseline while substantially lowering variance across templates and random seeds.
  evidence:
  - source_id: r723-primary-pdf
    locator: Section 1 & Section 4.4, Tables 2-3, pp. 2, 7-8
    relation: supports
- claim_id: r723-claim-uncalibrated-kb-noise-limitation
  kind: limitation
  statement: "Raw knowledge-base label word expansion without refinement introduces severe prior-probability skew and cross-class noise\u2014dropping zero-shot AG's News accuracy from 84.8% to 55.5% when Contextualized Calibration is ablated\u2014and KPT relies on the availability of an external knowledge graph or lexicon anchored on accurate class names plus an unlabeled support set (|C_tilde| >= 50) for zero-shot calibration."
  evidence:
  - source_id: r723-primary-pdf
    locator: Section 4.4, Section 6, & Appendix D.1, Table 2, Figure 3, pp. 7-9, 13
    relation: supports
