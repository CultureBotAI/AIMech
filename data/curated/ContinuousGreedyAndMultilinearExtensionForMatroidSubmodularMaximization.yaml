claims:
- claim_id: r349-claim-multilinear-extension-directional-concavity-and-swap-convexity
  kind: mechanism
  statement: 'For any monotone submodular set function f : 2^X -> R_+, its multilinear extension F(y) = E[f(hat{y})] is smooth monotone submodular (Definition 2.1) with first partial derivatives dF/dy_j = E[f(hat{y}) | hat{y}_j = 1] - E[f(hat{y}) | hat{y}_j = 0] >= 0, mixed second partial derivatives d^2F/(dy_i dy_j) <= 0 for i != j, and pure second partial derivatives d^2F/dy_j^2 = 0, which simultaneously makes F(y + xi * v^*) concave along any nonnegative direction v^* >= 0 and F_{ij}^y(t) = F(y + t(e_i - e_j)) convex along every coordinate swap direction e_i - e_j with second derivative -2 d^2F/(dy_i dy_j) >= 0.'
  evidence:
  - source_id: r349-primary-pdf
    locator: Section 2.1, Definition 2.1 and Multilinear Extension derivatives, p. 6; Section 2.4, Pipage Rounding Claim, p. 10
    relation: supports
- claim_id: r349-claim-continuous-greedy-differential-inequality-and-approximation
  kind: mechanism
  statement: For any fractional point y in [0, 1]^X and random subset R ~ hat{y}, submodularity implies OPT <= F(y) + max_{I in I} sum_{j in I} E[f_R(j)] (Lemma 3.1), so moving along the maximum-weight independent base I(t) in M with step size delta = 1 / (9 d^2) (or delta = 1 / (40 d^2 n) in Appendix A) satisfies OPT - F(y(t + delta)) <= (1 - delta)(OPT - F(y(t))) up to sampling error and produces a fractional point y(1) in the matroid base polytope B(M) with F(y(1)) >= (1 - 1/e) OPT with high probability (Lemma 3.3 and Appendix A).
  evidence:
  - source_id: r349-primary-pdf
    locator: Section 2.3, Equation 5, p. 9; Section 3.1, Lemmas 3.1-3.3, pp. 11-13; Appendix A, pp. 25-26
    relation: supports
- claim_id: r349-claim-matroid-pipage-rounding-lossless-conversion
  kind: mechanism
  statement: Given any fractional solution y^* in the matroid base polytope B(M), oblivious randomized PipageRound(M, y^*) iteratively updates pairs of fractional variables (i, j) inside minimal tight sets along e_i - e_j or e_j - e_i until hitting a matroid rank constraint r_M(A) = y(A) (Proposition 3.4), preserving E[y' | y] = y and guaranteeing by convexity of F_{ij}^y(t) an integral independent set S in I with E[f(S)] >= F(y^*) in at most O(n^2) rounding steps (Lemma 3.5), while for simple partition matroids independent per-block sampling achieves E[f(T)] >= F(y^*) in a single step (Lemma 3.7).
  evidence:
  - source_id: r349-primary-pdf
    locator: Section 3.2, Proposition 3.4, Algorithm PipageRound, and Lemma 3.5, pp. 14-16; Section 3.3, Lemma 3.7, pp. 16-17
    relation: supports
