claims:
- claim_id: constrained-and-penalized-corrupted-sensing-demixing-theorems-via-gordon-lemma
  kind: mechanism
  statement: 'Given observations $y = \Phi x^\star + v^\star + z \in \mathbb{R}^n$ with $\Phi_{ij} \stackrel{\text{i.i.d.}}{\sim} \mathcal{N}(0, 1/n)$ and $\|z\|_2 \le \delta$, any solution $(\hat{x}, \hat{v})$ to the constrained convex program $\min_{x,v}\{\|x\|_{\text{sig}} : \|v\|_{\text{cor}} \le \|v^\star\|_{\text{cor}},\, \|y - (\Phi x + v)\|_2 \le \delta\}$ (or the symmetric program swapping $\|x\|_{\text{sig}}$ and $\|v\|_{\text{cor}}$) satisfies $\sqrt{\|\hat{x} - x^\star\|_2^2 + \|\hat{v} - v^\star\|_2^2} \le 2\delta/\epsilon$ with probability at least $1 - e^{-(\mu_n - \tau - \epsilon\sqrt{n})^2/2}$ whenever $\mu_n - \epsilon\sqrt{n} > \tau = \sqrt{\omega^2(T_{\text{sig}} \cap \mathbb{B}^p) + \omega^2(T_{\text{cor}} \cap \mathbb{B}^n)} + \frac{1}{\sqrt{2}} + \frac{1}{\sqrt{2\pi}}$ (Theorem 1, p. 4; Theorem 3, p. 12; Lemma 1, p. 13). For the tuning-free penalized program $\min_{x,v}\{\|x\|_{\text{sig}} + \lambda\|v\|_{\text{cor}} : \|y - (\Phi x + v)\|_2 \le \delta\}$ with penalty multiplier $\lambda = t_{\text{cor}}/t_{\text{sig}}$ ($t_{\text{sig}}, t_{\text{cor}} > 0$), the same error bound holds with $\tau = 2\eta(t_{\text{sig}} \cdot \partial\|x^\star\|_{\text{sig}}) + \eta(t_{\text{cor}} \cdot \partial\|v^\star\|_{\text{cor}}) + 3\sqrt{2\pi} + \frac{1}{\sqrt{2}} + \frac{1}{\sqrt{2\pi}}$ where $\eta(S) = \sqrt{\mathbb{E}_{g \sim \mathcal{N}(0, I)}[\operatorname{dist}(g, S)^2]}$ (Theorem 2, p. 4; Theorem 4, p. 14; Lemma 2, p. 15).'
  evidence:
  - source_id: fm2014-corrupted-sensing-pdf
    locator: Section II, pp. 4-5, Equations (5)-(7), Theorems 1-2; Section V, pp. 12-16, Equations (21)-(22), Theorems 3-4, Lemmas 1-2; Appendices C-D, pp. 26-28
    relation: supports
  - source_id: fm2014-corrupted-sensing-abs
    locator: Abstract
    relation: supports
- claim_id: dual-norm-subdifferential-squared-distance-recipe-and-dense-regime-bounds-for-l1-block-sparse-and-nuclear-norms
  kind: mechanism
  statement: 'For any atomic norm $\|\cdot\|$ on $\mathbb{R}^p$ whose subdifferential at $x$ contains $e + \{z \in S^\perp : \|z\|^* \le 1\}$ with $e \in S$, $\|e\|_2 = 1$, and $\tilde{\omega} \le \omega(S^\perp \cap \{z : \|z\| \le 1\})$, choosing $t = \frac{\tilde{\omega}}{\max_{\|z\|_2=1}\|z\|^2}$ guarantees $\eta^2(t \cdot \partial\|x\|) \le p - \left(\frac{\tilde{\omega}}{\max_{\|z\|_2=1}\|z\|}\right)^2 < p$ whenever $x$ is non-trivial (Proposition 3, p. 17, Appendix A, p. 20). Specializing Proposition 3 and direct tail integration yields dense-regime subdifferential squared-distance bounds strictly below $p$: (1) for an $s$-sparse vector in $\mathbb{R}^p$ ($\|\cdot\|_1$), $\eta^2(t''\partial\|x\|_1) \le p\!\left(1 - \frac{2}{\pi}(1 - s/p)^2\right)$ at $t'' = \sqrt{\frac{2}{\pi}}(1 - s/p)$ (Eqs. 9, 23), which is strictly tighter than $2s\log(p/s) + \frac{3}{2}s$ (Eq. 8) for all $s/p \ge 0.07$; (2) for an $s$-block-sparse vector in $\mathbb{R}^p$ with $m$ blocks of size $k = p/m$ ($\|\cdot\|_{\ell_1/\ell_2}$), $\eta^2(t\partial\|x\|_{\ell_1/\ell_2}) \le 4s\log(m/s) + (0.5 + 3k)s$ at $t = \sqrt{2\log(m/s)} + \sqrt{k}$ (Eq. 24) and $\eta^2(t''\partial\|x\|_{\ell_1/\ell_2}) \le p\!\left(1 - \frac{\mu_k^2}{k}(1 - s/m)^2\right)$ at $t'' = \mu_k(1 - s/m)$ (Proposition 4, Eq. 25, pp. 17-19); and (3) for a rank-$r$ matrix in $\mathbb{R}^{m_1 \times m_2}$ ($m_1 \ge m_2$, $\|\cdot\|_*$), $\eta^2(t\partial\|x\|_*) \le m_1 m_2\!\left(1 - \left(\frac{4}{27}\right)^2\left(1 - \frac{r}{m_1}\right)\left(1 - \frac{r}{m_2}\right)^2\right)$ at $t = \frac{4}{27}(m_2 - r)\sqrt{m_1 - r}/m_2$ (Proposition 5, p. 19).'
  evidence:
  - source_id: fm2014-corrupted-sensing-pdf
    locator: Section III, pp. 5-7, Equations (8)-(10), Tables I-II; Section VI, pp. 16-20, Equations (23)-(25), Propositions 2-5; Appendix A, pp. 20-21
    relation: supports
- claim_id: weak-decomposability-gap-bound-and-canonical-corrupted-sensing-corollaries
  kind: scope
  statement: 'For any weakly decomposable norm $\|\cdot\|$ on $\mathbb{R}^p$ whose subdifferential at $x$ contains $e + \{z \in S^\perp : \|z\|^* \le 1\}$ for some subspace $S$ and $e \in S$ with $\|e\|_2 = 1$, the minimum subdifferential Gaussian distance is within an additive constant of the tangent-cone Gaussian width: $\min_{t \ge 0} \eta(t \cdot \partial\|x\|) \le \omega(T \cap \mathbb{B}^p) + 6$ (Proposition 1, pp. 4, 20-21). Applied to canonical demixing problems, Theorems 1-2 yield: (1) recovery of $s$-sparse signals under $\gamma n$ gross sparse corruptions and Wyner real-valued coding of arbitrary $x^\star \in \mathbb{R}^p$ from $n = 2p + o(p)$ measurements up to corruption fraction $\gamma_0 \approx 19.3\%$ where $\omega^2(T_{\text{sparse}(n,\gamma_0)} \cap \mathbb{B}^n) = n/2$ (Corollary 1, pp. 7-8); (2) recovery of sparse signals under block-sparse adversarial corruptions up to corruption fraction $\gamma \to 1$ as $n/p \to \infty$ (Corollary 2, p. 9); (3) rank-$r$ matrix recovery under sparse corruptions (Corollary 3, pp. 9-10); and (4) package-clipped $\ell_\infty$-structured signal recovery under sparse outliers (Corollary 4, pp. 10-12).'
  evidence:
  - source_id: fm2014-corrupted-sensing-pdf
    locator: Section I.B, p. 4, Proposition 1; Section IV, pp. 7-12, Equations (11)-(20), Corollaries 1-4; Appendices A-B, pp. 20-26
    relation: supports
