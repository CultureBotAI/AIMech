id: AIMech:CorruptedSensingConvexSignalCorruptionDemixingAndSubdifferentialDistanceBounds
name: Corrupted Sensing Convex Signal-Corruption Demixing and Subdifferential Distance Bounds
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Corrupted Sensing Signal-Corruption Separation via Convex Programming
- Foygel-Mackey Constrained and Penalized Corrupted Sensing Guarantees
- Dense-Regime Subdifferential Gaussian Distance Bounds for Structured Norms
- Weak Decomposability Subdifferential-to-Tangent-Cone Gaussian Width Gap Bound
definition: 'Corrupted Sensing Convex Signal-Corruption Demixing and Subdifferential Distance Bounds is a convex recovery and Gaussian-width analysis framework introduced by Foygel and Mackey (2014, IEEE Transactions on Information Theory 60(2):1223-1247, DOI:10.1109/TIT.2013.2293654, arXiv:1305.2524v2) for simultaneously recovering a structured signal $x^\star \in \mathbb{R}^p$ (with atomic norm $\|\cdot\|_{\text{sig}}$) and structured measurement corruption $v^\star \in \mathbb{R}^n$ (with atomic norm $\|\cdot\|_{\text{cor}}$) from noisy underdetermined Gaussian linear observations $y = \Phi x^\star + v^\star + z$ ($\Phi_{ij} \stackrel{\text{i.i.d.}}{\sim} \mathcal{N}(0, 1/n)$, $\|z\|_2 \le \delta$). It proves non-asymptotic recovery error bounds $\sqrt{\|\hat{x} - x^\star\|_2^2 + \|\hat{v} - v^\star\|_2^2} \le 2\delta/\epsilon$ for both norm-constrained convex programs (requiring $\mu_n > \tau = \sqrt{\omega^2(T_{\text{sig}} \cap \mathbb{B}^p) + \omega^2(T_{\text{cor}} \cap \mathbb{B}^n)} + \frac{1}{\sqrt{2}} + \frac{1}{\sqrt{2\pi}}$, Theorems 1 & 3) and penalized convex programs $\min_{x,v}\{\|x\|_{\text{sig}} + \lambda\|v\|_{\text{cor}} : \|y - (\Phi x + v)\|_2 \le \delta\}$ with penalty multiplier $\lambda = t_{\text{cor}} / t_{\text{sig}}$ (requiring $\mu_n > \tau = 2\eta(t_{\text{sig}} \cdot \partial\|x^\star\|_{\text{sig}}) + \eta(t_{\text{cor}} \cdot \partial\|v^\star\|_{\text{cor}}) + 3\sqrt{2\pi} + \frac{1}{\sqrt{2}} + \frac{1}{\sqrt{2\pi}}$, where $\eta(S) = \sqrt{\mathbb{E}[\operatorname{dist}(g, S)^2]}$, Theorems 2 & 4), and derives dense-regime subdifferential distance bounds strictly below ambient dimension $p$ for $\ell_1$, block-sparse $\ell_1/\ell_2$, and matrix nuclear norms (Propositions 3-5).'
identity_notes: Distinct from standard uncorrupted atomic-norm linear inverse recovery (`AIMech:AtomicNormConvexGeometryAndTangentConeGaussianWidthForLinearInverseProblems`), conic kinematic demixing under random orthogonal transformations $z_0 = x_0 + U y_0$ (`AIMech:ConicStatisticalDimensionIntrinsicVolumeConcentrationAndPhaseTransitions`), and proximal denoising / uncorrupted projected LASSO risk (`AIMech:WorstCaseProximalDenoisingNMSEAndSubdifferentialMeanSquaredDistance`). Foygel & Mackey (2014) specifically analyze the asymmetric Gaussian sensing-plus-direct-corruption model $y = \Phi x^\star + v^\star + z$ ($\Phi \in \mathbb{R}^{n \times p}$, $v^\star \in \mathbb{R}^n$), establish universal penalized demixing guarantees with explicit penalty ratio $\lambda = t_{\text{cor}}/t_{\text{sig}}$ without requiring knowledge of $\|x^\star\|_{\text{sig}}$ or $\|v^\star\|_{\text{cor}}$, prove the weak-decomposability gap bound $\min_{t \ge 0}\eta(t \cdot \partial\|x\|) \le \omega(T \cap \mathbb{B}^p) + 6$ (Proposition 1), and derive dense-regime subdifferential squared-distance bounds strictly below $p$ via dual-norm Gaussian widths (Propositions 3-5).
