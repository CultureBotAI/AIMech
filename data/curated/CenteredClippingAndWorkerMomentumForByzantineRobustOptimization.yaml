id: AIMech:CenteredClippingAndWorkerMomentumForByzantineRobustOptimization
name: Centered Clipping and Worker Momentum for Byzantine-Robust Optimization
concept_kind: algorithm
review_status: DRAFT
definition: 'A stateful Byzantine-robust distributed optimization framework combining: (1) local Worker Momentum m_{t,i} = (1 - alpha_t) m_{t-1,i} + alpha_t g_i(x_{t-1}) (or Momentum Variance Reduction, MVR) maintained across steps to average out stochastic gradient noise and defeat time-coupled adversaries; and (2) iterative Centered Clipping (CC), which aggregates worker momentum vectors {x_1,...,x_n} around a reference iterate v_0 by updating v_{l+1} = v_l + (1/n) sum_{i=1}^n (x_i - v_l) min(1, tau_l / ||x_i - v_l||_2) for l >= 0 with clipping radius tau_l, achieving (delta_max, c)-robust aggregation E||v_L - x_bar_G||^2 <= c * delta * sigma^2 in O(n d) time.'
identity_notes: Distinct from memoryless middle-seeking aggregators such as Krum (AIMech:KrumAndMultiKrumByzantineTolerantGradientDescent), Coordinate-wise Median (AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustDistributedLearning), and RFA (AIMech:RfaRobustFederatedAggregationSmoothedWeiszfeldGeometricMedian), which Theorem I and Counterexamples 1-3 prove can fail to converge even with zero Byzantine workers (delta = 0) under asymmetric/bimodal stochastic gradient noise and suffer an Omega(delta * sigma^2 / mu^2) lower bound under time-coupled attacks (Theorem II), and from Bucketing (AIMech:BucketingResamplingForHeterogeneousByzantineRobustOptimization, which addresses inter-client data heterogeneity via random s-bucketing rather than intra-client stochastic noise via centered clipping).
aliases:
- Centered Clipping (CC)
- Byzantine-Robust Worker Momentum with Centered Clipping
- Learning from History for Byzantine Robust Optimization
- Byzantine-Robust Momentum Variance Reduction (MVR)
