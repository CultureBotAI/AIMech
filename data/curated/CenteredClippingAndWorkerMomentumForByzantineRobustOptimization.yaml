claims:
- claim_id: r403-middle-seeker-counterexamples-and-memoryless-time-coupled-lower-bound
  kind: mechanism
  statement: Section 3 (Counterexamples 1-3, Theorem I) proves that memoryless middle-seekers (CW Median, RFA, Krum) fail to converge even with delta = 0 corruption under asymmetric, bimodal, or imbalanced zero-mean noise, and Theorem II proves that any permutation-invariant memoryless algorithm incurs an Omega(delta * sigma^2 / mu^2) non-vanishing optimality gap against time-coupled Byzantine attacks.
  evidence:
  - source_id: r403-primary-pdf
    locator: Section 3 Failure of Existing Methods (Counterexamples 1-3, Theorem I) & Section 4 Lower Bounds for Memoryless Algorithms (Definition B, Theorem II), pp. 2-5
    relation: supports
- claim_id: r403-centered-clipping-contraction-and-worker-momentum-convergence
  kind: mechanism
  statement: Theorem IV and Corollary V prove that Centered Clipping contracts toward the true honest average and satisfies (delta_max = 0.1, c)-robustness E||x_hat - x_bar||^2 <= c * delta * rho^2 (matching the Omega(delta * rho^2) lower bound of Theorem III), while Theorem VI and Theorem VII prove that combining Centered Clipping with Worker Momentum or Momentum Variance Reduction (MVR) converges to a stationary point on nonconvex objectives at rates O((c * delta + 1/n)^{1/2} / T^{1/2}) and O((c * delta + 1/n)^{1/3} / T^{2/3}), respectively, driving asymptotic error to zero as T -> infinity.
  evidence:
  - source_id: r403-primary-pdf
    locator: Section 5 (Definition C, Theorems III-IV, Corollary V) and Section 6 (Theorems VI-VII), pp. 5-8
    relation: supports
- claim_id: r403-clipping-radius-tuning-and-delta-point-one-threshold-limitation
  kind: limitation
  statement: Theoretical contraction of Centered Clipping in Theorem IV requires the Byzantine fraction delta <= 0.1 (or bounded variance ratio) and requires setting the clipping threshold tau_l proportional to the honest variance and current distance to the honest mean.
  evidence:
  - source_id: r403-primary-pdf
    locator: Section 5.2 Analysis of Centered Clipping (Theorem IV, Corollary V), pp. 5-6
    relation: supports
- claim_id: r403-time-coupled-and-little-is-enough-cifar10-defense-application
  kind: application
  statement: Evaluated on distributed CIFAR-10 and MNIST training against time-coupled, Little-Is-Enough (ALIE), inner-product manipulation, and bit-flipping attacks, where Worker Momentum + Centered Clipping matches uncorrupted SGD accuracy while memoryless Krum, Median, and RFA stagnate.
  evidence:
  - source_id: r403-primary-pdf
    locator: Section 7 Experiments (Figures 1-3), pp. 7-9
    relation: supports
