id: AIMech:ShakeDropRegularization
name: ShakeDrop regularization
concept_kind: algorithm
aliases: []
definition: A residual-network regularization procedure that uses a Bernoulli switch to alternate ordinary
  residual computation with separately specified forward and prescribed backward multipliers, and uses
  an expected forward coefficient for deterministic inference.
definition_evidence:
- source_id: yamada2019
  locator: Figure 1(d), PDF p. 2; Section III-A, Equations (6)–(8), PDF p. 3; Section III-B.3, PDF pp.
    3–4.
  relation: supports
claims:
- claim_id: gated-residual-perturbation
  kind: scope
  statement: ShakeDrop is a stochastic regularization procedure for residual networks. Within an identity-skip
    block, a Bernoulli gate selects either the ordinary residual computation or a perturbed residual contribution.
    The construction can operate on one learned residual branch plus its skip path; it does not require
    the two learned residual branches used by the compared Shake-Shake construction. It is a training
    and inference procedure, not a complete network architecture or a stand-alone parameter optimizer.
  evidence:
  - source_id: yamada2019
    locator: Figure 1 and Section II, PDF p. 2; Section III-A, Equations (6)–(8), PDF p. 3; Section III-B.3,
      PDF pp. 3–4.
    relation: supports
- claim_id: distinct-forward-backward-coefficients
  kind: mechanism
  statement: For a residual block x+F(x), use forward residual multiplier c_f=b_l+(1-b_l)*alpha and prescribed
    backward residual multiplier c_b=b_l+(1-b_l)*beta. The same Bernoulli gate b_l is used in both passes.
    When b_l=1, both multipliers equal one; when b_l=0, they are alpha and beta respectively. The source
    uses mutually independent alpha and beta, including a configured constant-zero alpha case. The backward
    expression prescribes derivative scaling through the residual path; it is not another forward evaluation
    or a claim that beta is the derivative of the realized forward multiplier.
  evidence:
  - source_id: yamada2019
    locator: Figure 1(d), PDF p. 2; Section III-A, Equations (6)–(8), PDF p. 3; Section IV-A, PDF p. 5.
    relation: supports
- claim_id: depth-dependent-switching
  kind: mechanism
  statement: Set P(b_l=1)=p_l using the displayed depth schedule p_l=1-(l/L)*(1-p_L), where l indexes
    the residual blocks from the input, L is their total number, and p_L is the configured probability
    at the last block. For 0<=p_L<1, later blocks have a greater probability of entering the perturbed
    case. This is a schedule across network depth, not an annealing schedule over training iterations.
    The paper varies p_L with architecture and experimental setting rather than fixing one universal probability.
  evidence:
  - source_id: yamada2019
    locator: Section II, Equation (5), and Section III-A, PDF p. 3; Sections V-B and V-E, PDF pp. 8–9;
      Appendix A, PDF pp. 9–10.
    relation: supports
- claim_id: sampling-and-host-settings
  kind: mechanism
  statement: The 2019 author copy compares batch, image, channel and element-level sharing of alpha and
    beta and uses element-level coefficients in its principal experiments. It uses alpha=0 with beta uniform
    on [0,1] for the tested original architectures, and alpha uniform on [-1,1] with beta uniform on [0,1]
    for the tested modified residual branches ending with batch normalization. These are experimentally
    selected configurations. The original 2018 preprint instead selects image-level sharing for memory
    efficiency while reporting a lower pixel-level error in its preliminary comparison; that earlier default
    is retained as version context.
  evidence:
  - source_id: yamada2019
    locator: Sections IV-A and IV-B, Tables 2–3, PDF p. 5; Section V-A and Table 5 caption, PDF p. 7;
      Appendix A, PDF pp. 9–10.
    relation: supports
  - source_id: yamada2018-v1
    locator: Section 4.1, Table 2 and the following sharing-level discussion, PDF p. 5; Appendix A, PDF
      p. 10.
    relation: supports
- claim_id: deterministic-test-rule
  kind: mechanism
  statement: At inference, replace the random forward multiplier by E[b_l+(1-b_l)*alpha]. For p_l<1 this
    expectation is p_l+(1-p_l)*E[alpha | b_l=0]; independent gate and coefficient draws with zero-mean
    alpha reduce it to p_l. This includes the stated constant-zero alpha and symmetric uniform alpha configurations.
    When p_l=1, the coefficient is one directly. This defines a deterministic local inference rule, not
    the exact expected output of the complete nonlinear network.
  evidence:
  - source_id: yamada2019
    locator: Figure 1(d), PDF p. 2; Section III-A, Equation (6) and coefficient ranges, PDF p. 3; Appendix
      A inference use, PDF p. 10. The conditional-expectation expansion is a direct consequence of the
      displayed Bernoulli mixture, with its assumptions stated here.
    relation: supports
- claim_id: distinction-and-special-cases
  kind: scope
  statement: Setting alpha=beta=0 reduces the displayed residual forward and backward operation to the
    Bernoulli RandomDrop or stochastic-depth operation, with its expected gate coefficient at inference.
    Setting alpha=beta=1 removes this perturbation. Those parameter boundaries do not identify the full
    methods as aliases. In particular, b_l=0 with alpha=0 and beta>0 removes the residual value in the
    forward pass while still permitting a nonzero prescribed residual derivative, unlike dropping that
    path in both passes.
  evidence:
  - source_id: yamada2019
    locator: Section II, Equation (4), and Section III-A, Equations (6)–(8), PDF p. 3; Section III-C,
      PDF p. 4; Table 2 cases A and B, PDF p. 5; Section IV-C final paragraph, PDF pp. 6–7.
    relation: supports
