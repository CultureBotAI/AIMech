aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The mixture-approximation node-splitting conflict diagnostic operates on a Bayesian directed
    acyclic graph (Bayesian network) by duplicating a separator node across parent and child subgraphs
    and approximating the split posteriors with Gaussian mixtures. AIO:BayesianNetwork supplies the graphical
    model representation context rather than an algorithmic superclass.
limitations:
- Convolving marginal Gaussian mixtures as sum_{k,j} w_k v_j N(mu_k - m_j, Sigma_k + S_j) treats the parent-side
  and child-side copies theta_2^(1) and theta_2^(2) as marginally independent; if both copies depend strongly
  on a shared parent nuisance parameter theta_1 and are compared conditionally on paired draws of theta_1,
  ignoring between-copy covariance inflates the difference covariance by 2 * Cov(theta_2^(1), theta_2^(2)).
- Requires choosing the number of mixture components (for example via BIC) and fitting component means
  and covariance matrices via expectation-maximization; poor component selection, singular component covariances,
  or heavy-tailed split posteriors can distort the estimated density level at zero.
- Like general density-level node-splitting scores, the tail probability P(p_hat_delta(delta) <= p_hat_delta(0))
  is not invariant to nonlinear reparameterizations of the separator node theta_2 and requires a proper
  child-side split posterior under the chosen reference prior p_R(theta_2^(2)).
- All 52 pages of Yang, Nott, & Presanis (2026, arXiv:2511.02977v2) and 22 pages of Presanis et al. (2013,
  arXiv:1310.0628v1) were read. No author EM/MCMC implementation, epidemic model fit, or empirical repeated-data
  calibration benchmark was executed; constructed numerical checks in research/discovery/mixture-node-splitting-boundaries.py
  verify analytical mixture convolution and shared nuisance pairing boundaries only.
