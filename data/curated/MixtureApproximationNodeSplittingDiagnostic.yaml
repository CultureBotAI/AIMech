id: AIMech:MixtureApproximationNodeSplittingDiagnostic
name: Mixture-approximation node-splitting conflict diagnostic
aliases:
- Gaussian-mixture node-splitting conflict check
- Mixture-approximated separator conflict diagnostic
concept_kind: algorithm
definition: A Bayesian directed acyclic graph (DAG) node-splitting conflict diagnostic algorithm that
  partitions observed data around a selected separator parameter block into parent-linked and child-linked
  subsets, approximates the parent-side and child-side split posterior distributions of the duplicated
  separator node using parametric Gaussian mixture densities while propagating shared parent-parameter
  uncertainty, forms the closed-form convolved Gaussian mixture density of the split-node difference,
  and evaluates the density-level tail probability at zero without nonparametric kernel density estimation.
identity_notes: 'No normalized identity match for the mixture-approximation node-splitting conflict diagnostic
  across all 442 pinned AIO records and 563 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only references in the Round
  168 discovery report and review exclusions noting Yang, Nott, & Presanis (2026) Section 3.2 (Algorithm
  2) as a separate pending concept. Distinct from AIMech:SeparatorNodeConflictDiagnostic and AIMech:MultipleTestingNodeConflictDiagnostic,
  which define general separator node splitting and simultaneous multiple-testing adjustments using empirical
  MCMC difference samples, multivariate kernel density estimation, or single-Gaussian Mahalanobis approximations
  rather than closed-form Gaussian mixture convolution of split posteriors with shared parent-parameter
  propagation. Distinct from AIMech:SequentialScoreDiscrepancyConflictDiagnostic (Algorithm 1 of Yang
  et al. 2026), which evaluates conditional prior-expansion Fisher scores without duplicating the separator
  node or fitting mixture approximations to split posteriors.'
definition_evidence:
- source_id: yang2026
  locator: Section 1, PDF pp. 3–4; Section 3.2, Equations 16–20 and Algorithm 2, PDF pp. 17–20
  relation: supports
claims:
- claim_id: parent-child-split-with-shared-nuisance-propagation
  kind: mechanism
  statement: For a selected separator parameter block theta_2 in a Bayesian directed acyclic graph with
    ancestor/parent parameter block theta_1 and partitioned data y = (y_pa, y_ch), the node-splitting
    construction duplicates theta_2 into parent-side copy theta_2^(1) informed by y_pa_obs and child-side
    copy theta_2^(2) informed by y_ch_obs under a reference prior p_R(theta_2^(2)), while propagating
    posterior uncertainty in shared parent parameters theta_1 from p(theta_1 | y_pa_obs) to the child
    submodel.
  evidence:
  - source_id: yang2026
    locator: Section 3.2, Equations 16–18 and Algorithm 2 Steps 1–2, PDF pp. 17–20
    relation: supports
  - source_id: presanis2013
    locator: Section 2.2, PDF pp. 4–5; Section 5.2, PDF p. 17
    relation: supports
- claim_id: gaussian-mixture-split-posterior-approximation
  kind: mechanism
  statement: Rather than applying multivariate kernel density estimation directly to Markov chain Monte
    Carlo difference draws, Algorithm 2 approximates the parent-side split posterior p(theta_2^(1) | y_pa_obs)
    and child-side split posterior p_ch(theta_2^(2) | y_ch_obs, y_pa_obs) by Gaussian mixture distributions
    sum_{k=1}^K w_k N(mu_k, Sigma_k) and sum_{j=1}^J v_j N(m_j, S_j) fitted to posterior draws (or formed
    directly from conditional Gaussian components).
  evidence:
  - source_id: yang2026
    locator: Section 3.2, Equations 16 and 19, Algorithm 2, PDF pp. 17–20; Appendix C, PDF pp. 40–42
    relation: supports
- claim_id: closed-form-mixture-difference-convolution-tail
  kind: mechanism
  statement: Under independent split copies approximated by Gaussian mixtures, the difference delta =
    theta_2^(1) - theta_2^(2) has the closed-form Gaussian mixture density p_hat_delta(delta) = sum_{k=1}^K
    sum_{j=1}^J w_k v_j N(delta; mu_k - m_j, Sigma_k + S_j), enabling Monte Carlo evaluation of the density-level
    conflict p-value P(p_hat_delta(delta) <= p_hat_delta(0)) using analytic mixture density evaluations
    at simulated draws and at zero.
  evidence:
  - source_id: yang2026
    locator: Section 3.2, Equations 19–20 and Algorithm 2 Step 3, PDF pp. 19–20; Appendix C, PDF pp. 40–42
    relation: supports
- claim_id: multimodal-and-non-gaussian-conflict-detection
  kind: application
  statement: Representing the split-posterior difference as a multi-component Gaussian mixture preserves
    skewness and multimodality that a single-Gaussian Mahalanobis approximation collapses, allowing the
    density-level tail test to detect conflict when zero falls in a low-density trough between mixture
    modes.
  evidence:
  - source_id: yang2026
    locator: Section 3.2, PDF pp. 19–21; Section 4, PDF pp. 21–28; Appendix C, PDF pp. 40–42
    relation: supports
