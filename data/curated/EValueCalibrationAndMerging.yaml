- target: AIO:DataDredgingBias
  relation: related_match
  rationale: E-value calibration, symmetric arithmetic-mean e-merging, sequential test-supermartingale
    product merging, and Algorithms 1–2 closed-testing adjustments preserve valid type I error and family-wise
    validity under optional continuation, post-hoc study combination, and arbitrary dependence, preventing
    false-positive inflation from data dredging (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the
    multiple-testing and optional-stopping bias rather than the e-value methodology.
limitations:
- 'Round-trip calibration between p-values and e-values is inherently lossy: calibrating a p-value p to
  an e-value via f_kappa(p) = kappa p^(kappa - 1) and back via min(1, 1/e) yields p'' = min(1, p^(1 -
  kappa) / kappa) > p, and the Vovk-Sellke upper bound VS(p) = (-e p ln p)^(-1) is not a valid p-to-e
  calibrator because integral_0^1 VS(p) dp = infinity (Section 2, Propositions 2.1–2.2 and Remark 2.3).'
- Under arbitrary dependence, no symmetric e-merging function can strictly exceed the arithmetic mean
  M_K(e) in the rejection region M_K(e) >= 1 (Proposition 3.1 and Theorem 3.2), and all other generalized
  r-means M_{r,K} for r != 1 require worst-case penalty multipliers min(K^(1/r - 1), 1) that make them
  strictly inadmissible (Proposition 6.1).
- Product e-merging e_1 * ... * e_K and Algorithm 2 O(K) closed testing require the sequential supermartingale
  condition E_Q[E_k | E_1, ..., E_{k-1}] <= 1 (or independence); if e-variables are arbitrarily dependent,
  product merging can violate E_Q[F(E)] <= 1 by up to K-th power growth, and if likelihood-ratio e-variables
  are misspecified when the alternative holds only on part of a sequential stream, product merging can
  lose accumulated evidence compared with universal test martingales (Section 4, Section 7, and Appendix
  H, lines 1270–1274).
- All 1,288 lines of Vovk & Wang (2021, arXiv:1912.06116) were read. Constructed numerical checks in research/discovery/evalue-calibration-and-merging-boundaries.py
  verify Propositions 2.1–2.2 calibrator integrals, Proposition 3.1 / Theorem 3.2 / Proposition 6.1 domination
  over scaled r-means, Propositions 4.1–4.2 sequential filtration tree U-statistic expectations, and Section
  5 Algorithms 1 and 2 exact agreement with brute-force 2^K - 1 subset closure.
