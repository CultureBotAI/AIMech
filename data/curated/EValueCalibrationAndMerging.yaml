id: AIMech:EValueCalibrationAndMerging
name: E-value calibration and merging
aliases:
- E-Value Calibration and Combination Framework
- Vovk-Wang E-Merging and P-to-E Calibration
- Admissible Symmetric E-Merging and Sequential U-Statistic E-Merging
- Closed-Testing Family-Wise Valid E-Value Adjustment
concept_kind: mathematical_method
definition: 'A statistical hypothesis testing and evidence synthesis framework (Vovk & Wang 2021) based
  on e-variables—nonnegative random variables E >= 0 satisfying E_Q[E] <= 1 under the null hypothesis
  Q—that characterizes admissible p-to-e calibrators f: [0, 1] -> [0, infinity] via upper semicontinuity,
  f(0) = infinity, and integral_0^1 f(p) dp = 1 (Proposition 2.1), establishes g(e) = min(1, 1/e) as the
  unique admissible e-to-p calibrator (Proposition 2.2), proves that under arbitrary dependence the arithmetic
  mean M_K(e_1, ..., e_K) = (1/K) sum_{k=1}^K e_k essentially dominates all symmetric e-merging functions
  while {lambda + (1 - lambda) M_K : lambda in [0, 1]} forms the minimal complete class of admissible
  symmetric e-merging functions (Proposition 3.1, Theorem 3.2), characterizes admissible U-statistic and
  product e-merging functions under independent or sequential test-supermartingale e-variables (Propositions
  4.1–4.2), and derives polynomial-time closed-testing adjustments for family-wise valid multiple testing
  (Theorem 5.1, Algorithms 1–2).'
identity_notes: No normalized identity match for E-Value Calibration and Merging across all 442 pinned
  AIO records and 570 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches across
  data, sources, research, history, and reviews for EValueCalibrationAndMerging, e-merging, p-to-e calibrator,
  e-to-p calibrator, ie-merging, and p-to-e merging returned only 29 lines matching the substring 'e-merging'
  inside 'pvalue-merging' from Round 174. Distinct from AIMech:GeneralizedMeanPValueMerging (Vovk & Wang
  2020), which combines p-values via Kolmogorov-Nagumo r-means calibrated by penalty multipliers a_{r,K}
  rather than combining nonnegative e-variables E_Q[E] <= 1 via parameter-free arithmetic averaging or
  sequential supermartingale products.
