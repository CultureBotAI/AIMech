claims:
- claim_id: admissible-p-to-e-and-e-to-p-calibrator-characterization
  kind: mechanism
  statement: 'A decreasing function f: [0, 1] -> [0, infinity] is a p-to-e calibrator (mapping every p-variable
    P to an e-variable f(P) with E_Q[f(P)] <= 1) if and only if integral_0^1 f(p) dp <= 1, and is admissible
    if and only if f is upper semicontinuous (left-continuous), f(0) = infinity, and integral_0^1 f(p)
    dp = 1, a class containing the Shafer power calibrators f_kappa(p) = kappa p^(kappa - 1) for kappa
    in (0, 1) (Eq. 1) and the parameter-free mixture calibrator F(p) = (1 - p + p ln p) / (p (-ln p)^2)
    (Eq. 2), whereas the Vovk-Sellke bound VS(p) = (-e p ln p)^(-1) for p <= e^(-1) is not a valid calibrator
    (Proposition 2.1, Remark 2.3); conversely, g(t) = min(1, 1/t) is an e-to-p calibrator by Markov''s
    inequality and strictly dominates every other e-to-p calibrator, making it the unique admissible e-to-p
    calibrator (Proposition 2.2).'
  evidence:
  - source_id: vovk-wang2021-evalues
    locator: Section 2, lines 26–74, Propositions 2.1–2.2, Equations 1–2, Remark 2.3; Appendix B, lines
      993–1003, Equations B.1–B.2
    relation: supports
- claim_id: arithmetic-mean-essential-domination-and-minimal-complete-symmetric-class
  kind: mechanism
  statement: 'Under arbitrary dependence among K e-variables, the arithmetic mean M_K(e_1, ..., e_K) =
    (1/K) sum_{k=1}^K e_k essentially dominates every symmetric e-merging function F (meaning M_K(e) >=
    F(e) whenever F(e) > 1) and dominates every symmetric positively homogeneous e-merging function (Proposition
    3.1); more generally, every symmetric e-merging function is dominated by F_lambda(e) = lambda + (1
    - lambda) M_K(e) for some lambda in [0, 1], and a symmetric e-merging function is admissible if and
    only if it belongs to the minimal complete class {lambda + (1 - lambda) M_K : lambda in [0, 1]} where
    lambda = F(0) (Theorem 3.2 and Appendix E, Propositions E.1–E.6); for generalized r-means M_{r,K}
    under arbitrary dependence, min(K^(1/r - 1), 1) M_{r,K} is a precise e-merging function for all r
    in [-infinity, infinity] but is admissible if and only if r = 1 (Proposition 6.1).'
  evidence:
  - source_id: vovk-wang2021-evalues
    locator: Section 3, lines 75–103, Proposition 3.1 and Theorem 3.2; Section 6, lines 170–211, Proposition
      6.1 and Equations 18–19; Appendix E, lines 1110–1185, Propositions E.1–E.6
    relation: supports
- claim_id: independent-and-sequential-supermartingale-u-statistic-e-merging
  kind: mechanism
  statement: When K e-variables E_1, ..., E_K are independent (ie-merging) or sequential with E_Q[E_k
    | E_1, ..., E_{k-1}] <= 1 (se-merging, so partial products form a nonnegative test supermartingale),
    the product M^0_K(e_1, ..., e_K) = e_1 * ... * e_K (Eq. 7), the elementary symmetric U-statistics
    U_n(e_1, ..., e_K) = C(K, n)^(-1) sum_{1<=k_1<...<k_n<=K} e_{k_1} ... e_{k_n} for n in {0, 1, ...,
    K} (Eq. 8), and all their convex mixtures sum_{n=0}^K lambda_n U_n are admissible ie-merging and se-merging
    functions (Proposition 4.1), and the product function e_1 * ... * e_K weakly dominates every ie-merging
    and se-merging function F in that e_1 * ... * e_K >= F(e_1, ..., e_K) for all (e_1, ..., e_K) in [1,
    infinity)^K (Proposition 4.2).
  evidence:
  - source_id: vovk-wang2021-evalues
    locator: Section 4, lines 104–137, Propositions 4.1–4.2 and Equations 7–8
    relation: supports
- claim_id: closed-testing-family-wise-valid-multiple-testing-algorithms
  kind: application
  statement: 'Applying the Marcus-Peritz-Gabriel closure principle to intersection e-merging functions
    F_I yields family-wise valid (FWV) adjusted e-values e*_k = min_{I subseteq {1,...,K}: k in I} F_I(e_I)
    satisfying E_Q[max_{k in I_0} E*_k] <= 1 for the true null index set I_0 (Section 5, Theorem 5.1,
    Equations 9–11; Appendix A.3, lines 955–983); for arbitrary dependence with F_I = M_{|I|}, sorting
    e_(1) <= ... <= e_(K) and evaluating e*_(k) = min_{i in {0,...,k-1}} (sum_{j=1}^i e_(j) + e_(k)) /
    (i + 1) computes the exact 2^K - 1 closure minimum in O(K^2) time and strictly dominates naive Bonferroni
    e-adjustment e_k / K (Algorithm 1, Eq. 13), while for sequential or independent e-values with F_I(e_I)
    = prod_{i in I} e_i, e*_k = e_k prod_{i != k} min(1, e_i) computes the exact closure minimum in O(K)
    time without sorting (Algorithm 2, Eq. 14).'
  evidence:
  - source_id: vovk-wang2021-evalues
    locator: Section 5, lines 138–169, Theorem 5.1, Equations 9–14, and Algorithms 1–2; Appendix A.3,
      lines 955–983; Appendix G, lines 1234–1268, Propositions G.1–G.2
    relation: supports
