claims:
- claim_id: bert-pkd-normalized-cls-patient-loss-and-layer-selection
  kind: mechanism
  statement: For an n-layer student BERT_n distilled from a deeper teacher (such as BERT_12), BERT-PKD selects k = n - 1 intermediate teacher layers I_pt via either PKD-Skip (every d_step layers, e.g., I_pt = {2, 4, 6, 8, 10} for n=6) or PKD-Last (the last k intermediate layers prior to the output layer, e.g., I_pt = {7, 8, 9, 10, 11} for n=6) and minimizes L_PKD = (1 - alpha) L_CE^s + alpha L_DS + beta L_PT (Equations 5, 8), where L_PT = sum_{i=1}^N sum_{j=1}^M || h_{i,j}^s / ||h_{i,j}^s||_2 - h_{i,I_pt(j)}^t / ||h_{i,I_pt(j)}^t||_2 ||_2^2 (Equations 6-7) aligns L2-normalized intermediate [CLS] token vectors.
  evidence:
  - source_id: r802-primary-pdf
    locator: Section 3.2 (Patient Teacher for Model Compression), p. 4, Figure 1, Equations (6)-(8)
    relation: supports
  - source_id: r802-primary-pdf
    locator: pkd_layer_indices and patient_loss verification
    relation: supports
- claim_id: bert-pkd-glue-and-race-empirical-gains-and-speedup
  kind: application
  statement: On the official GLUE test benchmark and the RACE reading comprehension test set, 6-layer BERT_6-PKD (1.64x parameter reduction, 1.94x GPU inference speedup) and 3-layer BERT_3-PKD (2.40x parameter reduction, 3.73x speedup) consistently outperform direct fine-tuning (FT) and last-layer vanilla KD across SST-2, QQP, MNLI-m/mm, QNLI, RTE, and RACE (reaching 60.34% on RACE vs. 58.74% for BERT_6-KD and 54.32% for BERT_6-FT, Tables 1, 3, 4), with PKD-Skip outperforming PKD-Last by capturing diverse low-to-high-level layer semantics (Table 2).
  evidence:
  - source_id: r802-primary-pdf
    locator: Section 4.3-4.4 (Tables 1-4, Figure 2), pp. 5-8
    relation: supports
- claim_id: bert-pkd-equal-hidden-dimension-and-initialization-mismatch
  kind: limitation
  statement: Because Equation (7) directly subtracts normalized student and teacher [CLS] vectors without a projection matrix and initializes BERT_k from the bottom k layers of the teacher, BERT-PKD cannot directly compute L_PT when student and teacher hidden dimensions differ (such as distilling BERT_24[Large] d=1024 into BERT_6[Base] d=768) and suffers from bottom-layer initialization mismatch when compressing 24-layer BERT_Large 4:1 into 6-layer BERT_6[Large] (Section 4.5, Table 5).
  evidence:
  - source_id: r802-primary-pdf
    locator: Section 4.5 (Does a Better Teacher Help?, Table 5), pp. 7-8
    relation: supports
