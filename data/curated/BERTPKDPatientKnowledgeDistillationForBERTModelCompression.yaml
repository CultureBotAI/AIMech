id: AIMech:BERTPKDPatientKnowledgeDistillationForBERTModelCompression
name: BERT-PKD (Patient Knowledge Distillation for BERT Model Compression)
concept_kind: learning_paradigm
review_status: DRAFT
definition: 'A multi-layer knowledge distillation method for compressing a deep pre-trained BERT teacher into a shallower n-layer BERT_n student (Sun, Cheng, Gan, & Liu, EMNLP-IJCNLP 2019) that supplements output-layer soft-target cross-entropy L_DS and ground-truth hard-label cross-entropy L_CE^s with a patient teacher loss L_PT measuring the squared L2 distance between L2-normalized intermediate-layer [CLS] token representations of the student and k = n - 1 selected intermediate layers I_pt of the teacher under either a uniform skip strategy (PKD-Skip) or a top-layer contiguous strategy (PKD-Last): L_PKD = (1 - alpha) L_CE^s + alpha L_DS + beta L_PT.'
identity_notes: Distinct from TinyBERT (AIMech:TinyBERTTransformerDistillationForNaturalLanguageUnderstanding) and MiniLM (AIMech:MiniLMDeepSelfAttentionDistillationForTaskAgnosticCompression), which match full sequence token hidden states or multi-head attention/value-relation matrices across all tokens. To avoid the computational cost and noise of distilling all token positions during task-specific fine-tuning, BERT-PKD initializes the n-layer student with the first n layers of pre-trained BERT and aligns only the L2-normalized [CLS] token embeddings across k = n - 1 intermediate layers via PKD-Skip (e.g., I_pt = {2, 4, 6, 8, 10} for 12->6) or PKD-Last (e.g., I_pt = {7, 8, 9, 10, 11}).
aliases:
- BERT-PKD
- Patient Knowledge Distillation
- Patient-KD (PKD-Skip and PKD-Last)
