name: Real-time A*
definition: A real-time heuristic search algorithm that moves to a neighbor with minimum edge-cost-plus-heuristic
  estimate and stores the second-best such estimate at the state it leaves, using bounded lookahead or
  initial heuristics for previously unvisited states.
concept_kind: algorithm
identity_notes: 'The record identifies the basic RTA* control algorithm with a second-best backup, not
  ordinary A* frontier search, IDA* repeated cost-bounded passes, LRTA* minimum-value learning, or the
  additional graph-correction procedure sketched in the 1988 paper. Distances used to choose the next
  move are relative to the current state rather than the original start. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 313 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  24 and 24 lines respectively. All 24 unique lines were inspected, and the sorted checkout hit sets were
  identical: prior leads, neighboring Breakout descriptions and their saved reviews/ledgers, not existing
  candidate records. Seven exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and
  four full native neighboring records were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.'
limitations:
- A finite reachable goal from the initial state alone is insufficient if an irreversible move can enter
  a region with no route to any goal. Infinite spaces, zero/negative cost cycles and infinite heuristic
  barriers are outside the stated completeness theorem.
- The 1990 tree local-optimality theorem does not extend unchanged to graphs with cycles. The 1988 paper
  separately sketches a recursive correction of stored values and omits its proof for space; the 1990
  article says significant modifications would be required. That variant is not silently included in basic
  RTA*.
- Real-time work depends on a fixed lookahead/resource policy and manageable branching and heuristic evaluation.
  The method is not a uniform constant-time implementation for arbitrary successor sets or lookahead depths,
  and the visited-state table can grow with execution.
- The second-best rule assumes alternatives from which that value can be obtained. The inspected method
  description does not state a general single-successor fallback; an executable implementation must declare
  this boundary rather than invent an undocumented convention here.
- Second-best backups can overestimate remaining goal distance when reused across trials. The source motivates
  LRTA* as a separate multi-trial learning modification. No puzzle benchmark or complete graph-correction
  proof was audited.
