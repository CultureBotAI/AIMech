claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a table for states actually visited. At the current non-goal state, enumerate neighboring
    states and evaluate edge cost plus the stored heuristic of a visited neighbor or a heuristic estimate,
    optionally produced by bounded minimin lookahead, for a new neighbor. Move to a neighbor with minimum
    resulting score, resolving ties among minima, and store the second-best score at the old state. With
    tied best alternatives, the second-best score may equal the best. The table persists during the search
    and allows revisits and backtracking. Only roots actually visited need enter this table; lookahead
    descendants need not all be retained. The 1990 paper proves eventual goal finding for a finite problem
    space with positive edge costs, finite heuristic values and a goal reachable from every state. Its
    local-optimality theorem concerns decisions relative to the cumulative searched frontier on a tree,
    not globally shortest returned paths.
