aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 313 preceding maintained IDs/names/aliases;
    ignored/hidden text in both full checkouts; semantic label search for search, planning, heuristic,
    path, traversal, symbolic, reasoning, graph, reinforcement and learning-task terminology; seven exact
    AIO CLASS nodes and four complete native neighbors.
  rationale: No suitable AIO counterpart was established for this basic state-space search procedure in
    the inspected snapshot and neighborhood. Shared graph, reasoning or heuristic words do not justify
    a model/task mapping.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: Operating on a state-space graph does not make this procedure a language model over
      graph representations.
  - target: AIO:ReasoningLLM
    rejection_reason: The target is a language model with reasoning during language tasks, not a general
      path or constraint search algorithm.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: This procedure does not require neural language modeling or a neuro-symbolic language-model
      architecture.
  - target: AIO:MachineLearningTask
    rejection_reason: This basic single-search procedure adjusts search bookkeeping; it does not require
      learning a reusable predictor from multiple problem-solving trials. The separately curated LRTA*
      extension explicitly does that.
  - target: AIO:MathematicalFunction
    rejection_reason: The algorithm uses and updates a cost function; it is not identical to the mathematical
      function itself.
  - target: AIO:ReinforcementLearning
    rejection_reason: Search, revisitation and adaptive costs alone do not identify the basic procedure
      with a learning task balancing exploration and exploitation. Multi-trial heuristic learning is separately
      represented.
  - target: AIO:TrainingStrategy
    rejection_reason: This algorithm does not require preprocessing or training a machine-learning model.
