  relation: supports
claims:
- claim_id: mechanism
  kind: mechanism
  statement: Shared transformations and a learned attention function produce neighborhood scores, softmax
    normalizes those scores, and their weighted feature combinations form updated node representations.
  evidence:
  - source_id: original-paper
    locator: Section 2.1, equations 1–6, PDF/printed pp. 3–4
    relation: supports
