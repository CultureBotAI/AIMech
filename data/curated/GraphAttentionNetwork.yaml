name: Graph attention network
definition: A graph neural architecture that updates node representations using learned attention weights
  over graph neighborhoods.
concept_kind: architecture
identity_notes: The original GAT architecture is distinct from a generic attention layer and from graph-convolution
  methods that do not use its learned neighborhood attention. GATv2 and other revisions are outside this
  identity.
aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: Graph attentional layers are learned neural computations, so the general artificial-neural-network
    target is broader.
- target: AIO:GraphConvolutionalNetwork
  relation: related_match
  rationale: Both use graph structure, but the GAT paper defines a specific learned attention mechanism;
    the mapping does not equate named GAT and GCN algorithms.
limitations:
- The record uses the revised ICLR 2018 paper, including its specified attention nonlinearity.
- Attention coefficients are computation weights; no general causal-explanation or benchmark-superiority
  claim is made.
id: AIMech:GraphAttentionNetwork
aliases:
