limitations:
- Duplicate, tie, reference-exclusion and threshold conventions affect reproducibility; unspecified policies
  remain explicit instead of being invented.
- The 1998 and 2000 papers share a score but differ in calibration and evaluation. Source shorthand concerning
  density, coverage and minimum volume is not treated as a universal guarantee.
- All thirteen cited PDF pages were visually read. The 2000 document is a scan; extraction was insufficient
  and all equations and figures were checked from renders. Exact finite calculations were executed, without
  historical code, model training or benchmark reproduction.
