aio_mappings:
- target: AIO:BinaryClassification
  relation: related_match
  rationale: The accept-versus-reject output is related to AIO:BinaryClassification. This is a method-to-task
    association, not an is-a or exact-match assertion. Its Classification parent is under SupervisedLearning;
    the related mapping does not assert representative training data from the abnormal class. Inspected
    BinaryClassification, Classification, SupervisedLearning, UnsupervisedLearning, MachineLearningTask,
    Model, three KnearestNeighbor nodes, EnsembleLearning and UncertaintyBias with their annotations and
    outgoing edges. The pinned nearest-neighbor nodes specify label plurality or value averaging, not
    local distance-ratio rejection. EnsembleLearning emphasizes combined prediction, not the particular
    bootstrap-variance novelty signal, and UncertaintyBias denotes a sampling bias rather than a detector.
    Generic models and learning tasks do not identify these procedures. Bagging, DBSCAN, OPTICS, NCA,
    LMNN and both SVDD loss variants supply distinct contextual mechanisms and receive no renewed scientific
    approval.
