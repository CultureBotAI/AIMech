claims:
- claim_id: local-spacing-score
  kind: mechanism
  statement: For a reference set with at least two observations, select i minimizing ||x-x_i||_2 and another
    reference j!=i minimizing ||x_i-x_j||_2. When d2=||x_i-x_j||_2 is positive, use rho(x)=||x-x_i||_2/d2.
    The 2000 default accepts rho<=1; increasing the threshold expands acceptance for a fixed reference
    set and neighbor-selection rule. The score uses Euclidean distances, not their squares, and the density
    motivation does not make rho a normalized probability or an outlier posterior.
  evidence:
  - source_id: tax2000
    locator: Section 2.2, printed p.673 / PDF p.2, Equations 3-6 and threshold paragraph
    relation: supports
  - source_id: tax1998
    locator: Section 2.1, PDF pp.2-3, Equation 3
    relation: supports
- claim_id: duplicates-ties-and-region
  kind: limitation
  statement: 'The denominator requires excluding the selected reference observation itself. Duplicate
    coordinates can still make d2=0, including an undefined 0/0 for a matching query; a singleton reference
    set has no other neighbor. The sources do not specify a general duplicate or nearest-tie policy. Ties
    can affect the decision: for references {-1/10,0,2} and query 1, choosing 0 gives ratio 10 while choosing
    2 gives 1/2. The nearest-selected rule is also not generally the union of all reference-centered balls
    with radii equal to local spacing: query 9/10 in the same example is rejected at unit threshold although
    it lies inside the radius-2 ball centered at 2. These are exact curator calculations, not repairs
    attributed to the papers.'
  evidence:
  - source_id: tax2000
    locator: Section 2.2, printed p.673 / PDF p.2, Equations 4-6; curator examples in research/discovery/novelty-score-boundaries.py
    relation: supports
  - source_id: tax1998
    locator: Section 2.1, PDF pp.2-3, Equation 3
    relation: supports
- claim_id: coverage-and-calibration
  kind: limitation
  statement: With distinct reference coordinates and queries evaluated against the full reference set,
    each training point has ratio zero and is accepted at a nonnegative threshold. This does not guarantee
    acceptance of all future target observations, minimum-volume support estimation or a calibrated false-alarm
    rate. The 1998 calibration text says three standard deviations above the training-score mean, while
    its displayed Equation6 uses three times var. Its nonzero training-ratio histogram also requires a
    scoring convention beyond naive self-including resubstitution; the exact exclusion protocol is not
    established here. These settings are not silently substituted for the 2000 unit-threshold rule.
  evidence:
  - source_id: tax2000
    locator: Sections 2.2 and 5, printed pp.673 and 675 / PDF pp.2 and 4; curator training-query qualification
    relation: supports
  - source_id: tax1998
    locator: Section 2.2 and experimental protocol, PDF pp.3-4, Equation 6 and Figure 1
    relation: supports
- claim_id: evidence-and-noise-scope
  kind: limitation
  statement: The rule depends on individual reference locations, feature scaling and threshold choice,
    and is sensitive to noise and sparse internal regions. The 2000 study compares synthetic uniform,
    Gaussian, heavy-tailed and embedded low-variance settings, with target-coverage versus outlier-acceptance
    tradeoffs. Its pump example uses 96 training objects with 64 autoregressive features and compares
    reduced representations and other detectors. The 1998 digit study reports poor nearest-neighbor results
    in many settings and includes training observations in its normal test population. Neither source
    establishes universal small-sample or high-dimensional superiority; no numerical performance claim
    or minimum-volume theorem is inferred from their summaries.
  evidence:
  - source_id: tax2000
    locator: Introduction and Sections 3-5, printed pp.672-675 / PDF pp.1-4, Figures 1-5
    relation: supports
  - source_id: tax1998
    locator: Sections 3-4, PDF pp.4-8, Figures 1-3
    relation: supports
