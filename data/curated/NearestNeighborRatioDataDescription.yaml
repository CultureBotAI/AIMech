id: AIMech:NearestNeighborRatioDataDescription
name: Nearest-neighbor ratio data description
aliases:
- Nearest neighbor distance ratio data description
- Nearest-neighbor data description (Tax-Duin)
concept_kind: algorithm
definition: A target-class data-description algorithm that scores a query by its distance to a nearest
  reference observation divided by that observation's nearest-other-reference spacing, and accepts queries
  whose ratio does not exceed a chosen threshold, where the denominator and neighbor-selection conventions
  are well defined.
identity_notes: This is the local distance-ratio detector described in Tax-Duin1998 Equation3 and Tax-Duin2000
  Equations4-6. The 2000 paper studies a unit threshold and threshold sweeps; the 1998 paper uses a different,
  incompletely specified calibration convention. The core score is shared, but the complete experimental
  protocols are not asserted identical. The denominator concerns the selected reference point's own nearest
  other reference, not necessarily the query's second-nearest point. This method does not vote among class
  labels, average regression values, learn a supervised distance matrix, label density-connected components
  or optimize an enclosing sphere. Generic NN-d and NNDD acronyms are searched but not assigned as unique
  aliases. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 504 preceding native IDs,
  names and aliases. No normalized candidate identity collision was found. Fixed-string whole-word searches
  included ignored and hidden files in both checkouts, expanded names, acronyms and source identifiers.
  All 12 matching lines per checkout, eight distinct texts at 24 locations, were inspected as queries,
  bibliographic notes and pending leads in the preceding discovery ledger. A fresh semantic AIO search
  returned 65 label/synonym/definition rows, all read; eleven annotated class nodes and outgoing edges
  and eighteen contextual YAMLs were read or reused after unchanged-byte checks. A wider native neighbor
  search inspected names and definitions only. Absence is bounded to this pin and inspected corpus.
