claims:
- claim_id: loraga-disjoint-2r-gradient-svd-eckart-young-optimality
  kind: mechanism
  statement: Because the first-step update of eta B A is proportional to eta^2 (nabla_W L A_init^T A_init + B_init B_init^T nabla_W L) (Lemma 3.1), initializing A_init and B_init with disjoint singular vector sets I_A = {1..r} and I_B = {r+1..2r} of nabla_W L = U S V^T yields zeta sum_{i=1}^{2r} sigma_i u_i v_i^T, achieving the exact Eckart-Young optimal rank-2r Frobenius approximation to the scaled full-fine-tuning gradient zeta nabla_W L (Theorem 3.1).
  evidence:
  - source_id: r671-primary-pdf
    locator: Section 3.2 (Gradient Approximation, Lemma 3.1 & Theorem 3.1) & Appendix A.1, pp. 4-5, 12
    relation: supports
- claim_id: loraga-non-zero-initialization-scale-stability-and-o1-layerwise-memory
  kind: mechanism
  statement: "Under \u03B7 = alpha / sqrt(r), setting zeta = (alpha^2 / gamma^2) sqrt(d_out) / r^2 so that A_init = (d_out^{1/4}/gamma) V_{[1:r]}^T and B_init = (d_out^{1/4}/gamma) U_{[r+1:2r]} guarantees forward second-moment stability Theta_{r, d_out, d_in}(1) (Theorem 3.2), while subtracting eta B_init A_init from W_0 and discarding each layer's gradient immediately during the backward hook keeps initialization memory at O(1) layer overhead."
  evidence:
  - source_id: r671-primary-pdf
    locator: Section 3.3-3.4 (Definition 3.1, Theorem 3.2, Algorithm 1), Section 4.4 (Table 5) & Appendix A.2, pp. 5-6, 9, 12-14
    relation: supports
- claim_id: loraga-application-glue-t5-and-llama2-math-code-chat
  kind: application
  statement: Without altering the LoRA forward architecture or training loop, LoRA-GA accelerates convergence by 2x-4x over vanilla LoRA, improving T5-Base GLUE average accuracy by +5.69 points (87.77% vs. 82.08%) and boosting LLaMA-2-7B by +11.52% on GSM8K (53.60% vs. 42.08%), +5.05% on HumanEval (19.81% vs. 14.76%), and +0.34 on MT-Bench.
  evidence:
  - source_id: r671-primary-pdf
    locator: Section 4.1-4.3 (Tables 1-4, Figure 2), pp. 6-9
    relation: supports
- claim_id: loraga-limitation-double-adapter-checkpoint-storage-and-aspect-ratio-asymmetry
  kind: limitation
  statement: Because W_frozen = W_0 - eta B_init A_init depends on the non-zero initial adapters, LoRA-GA requires double the adapter checkpoint storage (saving both (A_init, B_init) and the trained (A, B) to reconstruct W' from an unmodified shared base model W_0), and no single scalar zeta can simultaneously make both forward and backward scales exact Theta(1) when d_out / d_in diverges.
  evidence:
  - source_id: r671-primary-pdf
    locator: Appendix A.2 (Equations 5-6, p. 14) & Appendix F (Limitations, p. 18)
    relation: supports
