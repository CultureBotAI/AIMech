claims:
- claim_id: finite-sample-validity-of-universal-confidence-sets-and-split-crossfit-lrt
  kind: mechanism
  statement: 'Given an i.i.d. sample Y_1, ..., Y_{2n} ~ P_{theta^*} partitioned into disjoint subsets
    D_0 and D_1, let hat_theta_1 in Theta be any estimator computed solely from D_1 and L_0(theta) = prod_{i
    in D_0} p_theta(Y_i) be the out-of-sample likelihood on D_0; conditioning on D_1 fixes hat_theta_1
    so that E_{theta^*}[T_n(theta^*) | D_1] = int_A prod_{i in D_0} p_{hat_theta_1}(y_i) d mu(y_i) <=
    1 for T_n(theta) = L_0(hat_theta_1) / L_0(theta), which by Markov''s inequality guarantees P_{theta^*}(theta^*
    in C_n) >= 1 - alpha for C_n = {theta in Theta : T_n(theta) <= 1/alpha} and its crossfit counterpart
    using S_n(theta) = (T_n(theta) + T_n^swap(theta))/2 (Theorem 1, Remark 2); for composite null testing
    H_0: theta^* in Theta_0, the null MLE hat_theta_0 = argmax_{theta in Theta_0} L_0(theta) satisfies
    L_0(hat_theta_0) >= L_0(theta^*), so U_n = L_0(hat_theta_1) / L_0(hat_theta_0) <= T_n(theta^*) has
    E_{theta^*}[U_n] <= 1 and E_{theta^*}[W_n] <= 1 for W_n = (U_n + U_n^swap)/2, controlling finite-sample
    Type I error at level alpha without regularity conditions (Theorem 3, Remark 4).'
  evidence:
