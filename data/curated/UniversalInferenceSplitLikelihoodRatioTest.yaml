  relation: related_match
  rationale: Universal inference running-MLE sequential likelihood ratio tests, anytime-valid p-values
    (Theorem 10), and universal confidence sequences (Theorem 11) guarantee valid finite-sample Type I
    error and coverage under continuous peeking, optional stopping, optional continuation, and sequential
    sieve model selection without false-positive inflation from data dredging (AIO:DataDredgingBias).
    AIO:DataDredgingBias denotes the selective-inference bias rather than the universal inference statistical
    methodology.
limitations:
- In regular parametric models where classical Wilks chi-squared asymptotics hold, universal inference
  is conservative due to sample splitting and Markov's inequality ('poor man's Chernoff bound' with exponent
  a = 1); in the d-dimensional Gaussian location model N_d(theta, I_d), the squared radius of the universal
  confidence ball C_n on 2n observations is approximately 4 times larger than that of the classical full-sample
  LRT confidence ball A_{2n} for large d (Section 2 and Section 3 Equations 13–15).
- Finite-sample validity of the split LRT (Theorem 3) and running-MLE sequential LRT (Theorem 9) requires
  that the denominator L_0(hat_theta_0) upper bound the true null likelihood L_0(theta^*); when the null
  likelihood is nonconvex (e.g., multi-component mixture models under H_0) and local optimizers such as
  EM fail to reach the global maximum, Type I error control is not guaranteed unless a certified convex
  or semidefinite upper bound F_0(theta) >= L_0(theta) is used (Section 4 and Section 6).
- Single-split universal inference suffers from algorithmic split randomness ('p-value lottery') and can
  degenerate to [0, infinity) with probability 1/2 when model densities have parameter-dependent support
  such as Uniform[0, theta], while the sequential running-MLE LRT requires recomputing hat_theta_{1,t-1}
  and hat_theta_{0,t} at each step t with O(t) denominator evaluation cost even in exponential families
  (Section 4, Section 5, and Section 8).
- All 1,098 lines of Wasserman, Ramdas, & Balakrishnan (2020, arXiv:1912.11436) were read. Constructed
  numerical checks in research/discovery/universal-inference-split-likelihood-ratio-test-boundaries.py
  verify Theorems 1 & 3 composite-null validity, Section 3 Gaussian squared-radius ratio 4.0, Section
  5 Uniform[0, theta] crossfit interval vs. single-split degeneracy, Section 6 powered likelihood Renyi
  divergence identity, and Section 8 running-MLE martingale dominance M_t <= L_t.
