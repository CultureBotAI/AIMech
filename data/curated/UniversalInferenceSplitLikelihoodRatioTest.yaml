id: AIMech:UniversalInferenceSplitLikelihoodRatioTest
name: Universal inference split likelihood ratio test
aliases:
- Split Likelihood Ratio Test
- Split LRT
- Crossfit Likelihood Ratio Test
- Universal Confidence Set via Split Likelihood Ratio Statistic
- Running-MLE Sequential Likelihood Ratio Test
concept_kind: mathematical_method
definition: 'A regularity-free, finite-sample statistical hypothesis testing and confidence set construction
  framework (Wasserman, Ramdas, & Balakrishnan 2020) that partitions an observed sample into disjoint
  subsets D_0 and D_1, forms any out-of-sample alternative estimator or density hat_theta_1 on D_1 and
  the constrained null maximum likelihood estimator hat_theta_0 = argmax_{theta in Theta_0} L_0(theta)
  (or a proper upper-bounding relaxation F_0 >= L_0) on D_0, and rejects the composite null hypothesis
  H_0: theta^* in Theta_0 at level alpha in (0, 1) when the split likelihood ratio e-value U_n = L_0(hat_theta_1)
  / L_0(hat_theta_0) (or its two-fold crossfit average W_n = (U_n + U_n^swap)/2 or B-split subsampling
  average) exceeds 1/alpha, guaranteeing non-asymptotic Type I error at most alpha (Theorem 3) and (1
  - alpha) coverage for the universal confidence set C_n = {theta in Theta : T_n(theta) <= 1/alpha} where
  T_n(theta) = L_0(hat_theta_1) / L_0(theta) (Theorem 1) via Markov''s inequality without differentiability
  in quadratic mean or asymptotic chi-squared approximations.'
identity_notes: No normalized identity match for Universal inference split likelihood ratio test across
  all 442 pinned AIO records and 572 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 177 discovery
  artifacts where Wasserman, Ramdas, & Balakrishnan (2020, arXiv:1912.11436) was queued as a pending frontier
  lead. Distinct from AIMech:EValueCalibrationAndMerging (Vovk & Wang 2021) and AIMech:EValueBenjaminiHochbergProcedure
  (Wang & Ramdas 2022), which combine or threshold pre-existing e-values across multiple hypotheses rather
  than constructing finite-sample composite-null e-values, confidence sets, and running-MLE confidence
  sequences for irregular statistical models via sample splitting, crossfitting, reversed information
  projections, and non-anticipating martingales.
