    locator: Section 2, lines 25–74, Equations 3–10, Theorem 1, Remark 2, Theorem 3, and Remark 4
    relation: supports
  - source_id: vovk-wang2021-evalues
    locator: Section 1, lines 18–25 and Section 3, Proposition 3.1
    relation: supports
- claim_id: dqm-parametric-and-hellinger-nonparametric-diameter-rates-and-gaussian-radius-scaling
  kind: mechanism
  statement: In identifiable parametric models differentiable in quadratic mean (DQM) at theta^* with
    non-degenerate Fisher information I(theta^*), compact parameter space Theta subset R^d, and Lipschitz
    log-likelihood |log p_{theta_1}(x) - log p_{theta_2}(x)| <= ell(x) ||theta_1 - theta_2||, any sqrt(n)-consistent
    initial estimator hat_theta_1 yields a split-LRT confidence set C_n with diameter O_p(sqrt(log(1/alpha)/n))
    (Theorem 5, Appendix A Lemmas 12–14); in nonparametric density classes P with Hellinger bracketing
    entropy integral bounded at rate epsilon_n (Eq. 11) and initial estimator hat_p_1 satisfying chi^2(p^*,
    hat_p_1) = O_p(eta_n^2) (Eq. 12), C_n has Hellinger diameter O_p(eta_n + epsilon_n + sqrt(log(1/alpha)/n))
    (Theorem 6); and in the d-dimensional Gaussian model N_d(theta^*, I_d), C_n is a ball centered at
    Y_bar_0 with squared radius R_n^2 = ||Y_bar_0 - Y_bar_1||^2 + 2 log(1/alpha)/n ~ (2/n) chi^2_d + 2
    log(1/alpha)/n (Eqs. 14–15), sharing the O_p(d/n) scaling of the classical LRT set A_n with asymptotic
    squared-radius ratio 4 as d -> infinity.
  evidence:
  - source_id: wasserman2020-universal-inference
    locator: Section 3, lines 75–151, Theorems 5 and 6, Equations 11–15; Appendix A, lines 937–1087, Lemmas
      12–14
    relation: supports
- claim_id: support-mismatch-degeneracy-elimination-via-crossfitting-and-multi-split-e-averaging
  kind: mechanism
  statement: For distributions with parameter-dependent support such as Uniform[0, theta] where hat_theta_1
    = max_{i in D_1} Y_i and hat_theta_0 = max_{i in D_0} Y_i, the single-split likelihood L_0(hat_theta_1)
    = hat_theta_1^(-n) I(hat_theta_1 >= hat_theta_0) equals zero whenever hat_theta_1 < hat_theta_0 (which
    occurs with probability 1/2), causing C_n to degenerate to [0, infinity); in contrast, two-fold crossfitting
    S_n(theta) = (T_n(theta) + T_n^swap(theta))/2 ensures that exactly one of the two split statistics
    is nonzero for theta >= max(hat_theta_0, hat_theta_1), producing the rate-optimal bounded confidence
    interval [min(hat_theta_0, hat_theta_1), max(hat_theta_0, hat_theta_1)(2/alpha)^(1/n)] (or [max(hat_theta_0,
    hat_theta_1), max(hat_theta_0, hat_theta_1)(2/alpha)^(1/n)] after support intersection) of expected
    length O(theta log(1/alpha)/n) (Section 4), while averaging B split statistics T_bar_n = B^(-1) sum_{b=1}^B
    T_{n,b} across K-fold, repeated random subsampling, or all-splits partitions preserves E_{theta^*}[T_bar_n]
    <= 1 under arbitrary dependence between splits (Section 5).
  evidence:
  - source_id: wasserman2020-universal-inference
    locator: 'Section 4, lines 196–199 (''Crossfitting can beat splitting: uniform distribution'') and
      Section 5, lines 200–221 (''Using many splits'')'
    relation: supports
- claim_id: profile-relaxed-powered-smoothed-ripr-extensions-and-running-mle-confidence-sequences
  kind: application
  statement: Universal inference extends to nuisance parameters via profile likelihoods L^dagger(psi)
    = sup_{theta in g^(-1)(psi)} L_0(theta), intractable nonconvex null MLEs via any proper upper bound
    F_0(theta) >= L_0(theta) on Theta_0 yielding T'_n = L_0(hat_theta_1)/F_0(hat_theta_0^F) <= T_n, robust
    inference via powered likelihoods L_0^eta (0 < eta < 1) via non-negativity of order-eta Renyi divergence,
    kernel-smoothed likelihoods via Jensen's inequality (Section 6), misspecified convex model classes
    via the reversed information projection (RIPR) p^* = argmin_{p in P_Theta} K(q, p) and the more powerful
    RIPR split LRT R_n = prod_{i in D_0} p_{hat_theta_1}(Y_i)/p_0^*(Y_i) >= U_n (Section 7, Propositions
    7–8), nested sieve model selection without multiplicity correction (Section 4), and sequential anytime-valid
    p-values p_bar_t = min_{s <= t} 1/M_s and confidence sequences C_bar_t = cap_{s <= t} C_s via the
    running-MLE process M_t = prod_{i=1}^t p_{hat_theta_{1,i-1}}(Y_i) / prod_{i=1}^t p_{hat_theta_{0,t}}(Y_i)
    <= L_t bounded by the oracle nonnegative martingale L_t and Ville's inequality (Section 8, Theorems
    9–11).
  evidence:
