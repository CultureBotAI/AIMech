claims:
- claim_id: method
  kind: mechanism
  statement: Transform a signal into wavelet coefficients W_i and assign each coefficient a finite hidden
    mixture state S_i. Given all states, the coefficient emissions factor by site. The canonical two-state
    emission uses zero-mean Gaussian components with a narrow and a wide variance. A hidden chain models
    within-scale dependence; a hidden tree models parent-to-child persistence across scales. For a rooted
    tree, p(s,w)=pi(s_root)*product_edges A_child(s_child|s_parent)*product_i N(w_i;mu_i(s_i),v_i(s_i)),
    with normalized root and transition laws and positive emission variances. Upward subtree likelihoods
    and a downward pass yield exact node and edge state posteriors for a tree; chains admit the corresponding
    forward/backward inference. Those expectations support EM updates and optional parameter tying over
    explicitly selected sites or scales. In the source’s orthonormal-wavelet additive white Gaussian noise
    model, noise variance adds to each conditional coefficient variance. For zero-mean signal components,
    the posterior-mean coefficient estimate averages the state-specific gain v_signal/(v_signal+v_noise)
    times the noisy coefficient using state probabilities conditioned on all observed coefficients in
    the modeled dependency component.
