claims:
- claim_id: r463-head-conditioned-complementary-feature-gating-cpn-mechanism
  kind: mechanism
  statement: Conditions the local policy network CPN(.; Theta_i) on the Hadamard product C_i = (v_i / ||v_i||_2) odot h_i between the normalized column-sum of the personalized classifier head v_i = sum_{c=1}^C w_c^T and the sample feature vector h_i, applying a 2-way softmax per feature dimension k in [K] to generate complementary routing policies r_i^k + s_i^k = 1 (Equations 3-4) that dispatch r_i odot h_i to the frozen global head W^{hd} and s_i odot h_i to the trainable personalized head W_i^{hd} (Equation 5).
  evidence:
  - source_id: r463-primary-pdf
    locator: Section 3.2.1 Separating Feature Information & Section 3.2.2 Processing Separated Feature Information (Equations 3-6), pp. 3-5
    relation: supports
- claim_id: r463-mmd-feature-alignment-and-pir-quantification-scope
  kind: scope
  statement: Aligns personalized feature extractors W_i^{fe} with the global feature extractor W^{fe} via an RKHS Maximum Mean Discrepancy regularizer E_i^d = ||E[phi(h_i)] - E[phi(f(x_i; W^{fe}))]||_H^2 (Equations 7-8) while quantifying the fraction of personalized feature dimensions via the Personalization Identification Ratio PIR_i = (1 / K) sum_{k=1}^K s_bar_i^k (Section 8).
  evidence:
  - source_id: r463-primary-pdf
    locator: Section 3.2.3 Regularizing Feature Extractor (Equations 7-8) & Section 8 Personalization Identification Ratio, pp. 5, 9
    relation: supports
- claim_id: r463-cpn-parameter-and-dual-extractor-forward-overhead-limitation
  kind: limitation
  statement: Introduces client-specific CPN parameters Theta_i of size O(K^2) and requires an additional forward pass through the frozen global feature extractor W^{fe} on every local mini-batch to evaluate the MMD alignment loss E_i^d.
  evidence:
  - source_id: r463-primary-pdf
    locator: Section 3.2.1-3.2.3 (Algorithm 1, Equations 7-8) & Section 4.4 Overhead Analysis, pp. 4-5, 8
    relation: supports
- claim_id: r463-personalized-federated-image-and-text-classification-application
  kind: application
  statement: Applied to personalized federated image and text classification under pathological and Dirichlet label skew on MNIST, CIFAR-10, CIFAR-100, Tiny-ImageNet, and AG News.
  evidence:
  - source_id: r463-primary-pdf
    locator: Section 4 Experiments (Tables 1-4, Figures 3-6), pp. 5-8
    relation: supports
