- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Conditional calibration and the dBH/dBY procedures control false discovery rate inflation
    across dependent multiple hypothesis tests without conservative Benjamini-Yekutieli log-factor penalties,
    mitigating multiplicity and data-dredging bias (AIO:DataDredgingBias).
limitations:
- Exact sufficiency-based conditional calibration (Lemma 1, Theorem 2, Proposition 2) requires knowing
  or accurately estimating the conditional law of each test statistic T_i given its sufficient conditioning
  statistic S_i under H_i (such as known covariance Sigma in Gaussian models or exact Gram matrix structure
  in Gaussian linear regression); severe covariance misspecification destroys conditional independence
  between T_i and S_i and can inflate per-hypothesis FDR contributions.
- When the pilot tuning parameter gamma < 1 or gamma > 1 produces candidate rejection sets R_0(T) for
  which min_{i in R_0} R_+^{(i)}(T) < |R_0(T)|, Theorem 1 requires Step 3 independent uniform randomized
  pruning U ~ Unif(0, 1) to guarantee finite-sample FDR <= alpha, introducing auxiliary randomization
  unless pruning rarely triggers in practice (as observed empirically for dBH in Section 5).
- 'Under one-sided composite nulls H_i : mu_i <= 0 with dependent test statistics (a_i != 0), S_i = T_{-i}
  - a_i T_i is only partially sufficient because the conditional distribution of T_i | S_i depends on
  the unknown nuisance parameter vector mu_{-i}, requiring boundary calibration at mu_i = 0 under nonnegativity
  assumptions (Section 3.3).'
- All 1,304 lines of Fithian & Lei (2022, The Annals of Statistics 50(6):3091-3118, arXiv:2007.10438v1)
  were read. Constructed numerical checks in research/discovery/conditional-calibration-for-false-discovery-rate-control-boundaries.py
  verify (1) Section 2.2 Lemma 1 exact conditional FDR identity (100% agreement across 200 conditioning
  states) and Section 2.4 Theorem 1 / Example 1 necessity of Step 3 randomized pruning (unpruned FDR =
  0.22655 > 0.20 vs. pruned FDR = 0.12775 <= 0.133333), (2) Section 3.2 Theorem 2 exact reduction to BH
  under independence (100% match), 100% CPRDS safety c_i(S_i) >= alpha and dominance dBH_1 supseteq BH
  under positive correlation (rho = 0.60), and 100% safety c_i(S_i) >= alpha / L_m and dominance dBY_1
  supseteq BY under negative equicorrelation (rho = -0.45, average discoveries 1.741667 vs. 1.466667),
  (3) Section 4.1 Proposition 2 exact piecewise-constant knot integration matching fine quadrature (abs
  error 2.082e-05) and Section 4.3 Theorem 3 monotonic multi-step recursive refinement (100% monotone,
  average discoveries 1.4875 vs. 1.475), and (4) Section 3.3 composite-null boundary suppression (g_0
  = 0.034368 > g_{-0.5} = 0.013472 > g_{-1.0} = 0.004235) vs. covariance misspecification failure (per-hypothesis
  FDR contribution 0.1075 > alpha/m = 0.04).
