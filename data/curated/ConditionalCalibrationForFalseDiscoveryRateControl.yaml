id: AIMech:ConditionalCalibrationForFalseDiscoveryRateControl
name: Conditional calibration for false discovery rate control under dependence
aliases:
- Dependency-Adjusted Benjamini-Hochberg Procedure
- dBH Procedure
- dBY Procedure
- Conditional Calibration for Multiple Testing
- Rao-Blackwellized Conditional Benjamini-Hochberg Calibration
concept_kind: mathematical_method
definition: A finite-sample multiple-testing methodology (Fithian & Lei 2022, The Annals of Statistics
  50(6):3091-3118, arXiv:2007.10438) that controls the false discovery rate (FDR) under known or conditionals-characterized
  dependence among test statistics by decomposing FDR into m additive per-hypothesis contributions FDR_i(R)
  = E[V_i / max(1, |R|)] and calibrating each hypothesis H_i's rejection threshold conditionally on a
  tailored sufficient conditioning statistic S_i that governs how H_i's test statistic T_i affects all
  other hypotheses' rejection decisions. Using conditional threshold calibration (Step 1), effective rejection-size
  bounds R_+^{(i)}(T) >= |R(T)| on V_i = 1 coupled with independent uniform randomized pruning U ~ Unif(0,
  1) (Steps 2-3), the general three-step framework (Theorem 1) guarantees exact finite-sample FDR <= alpha
  m_0 / m <= alpha without union-bound or Benjamini-Yekutieli log-factor conservatism, and yields the
  dependency-adjusted Benjamini-Hochberg (dBH) and Benjamini-Yekutieli (dBY) procedures (Section 3, Theorem
  2) as well as recursive multi-step threshold refinement (Section 4.3, Theorem 3).
identity_notes: No normalized identity match for conditional calibration for false discovery rate control
  or the dependency-adjusted Benjamini-Hochberg (dBH / dBY) procedure across all 442 pinned AIO records
  and 585 maintained IDs, names, aliases and scoped synonyms. Fixed-string searches across data, sources,
  research, history, and reviews returned only frontier references in the Round 190 discovery report.
  Distinct from AIMech:EbhProcedure (Wang & Ramdas 2022), which applies deterministic step-up thresholding
  to e-values under arbitrary dependence rather than conditioning each p-value on a sufficient statistic
  S_i and integrating out the conditional distribution of T_i | S_i; distinct from AIMech:SimultaneousPathwiseFalseDiscoveryProportionBounds
  (Katsevich & Ramdas 2020), which constructs simultaneous high-probability upper envelopes on FDP across
  nested paths rather than calibrating per-hypothesis conditional expectations E[1{p_i <= gamma_i(S_i)}
  / R_+^{(i)} | S_i] <= q_i; and distinct from AIMech:AdaptivePValueThresholding (Lei & Fithian 2018,
  AdaPT) and AIMech:FocusedBH (Katsevich, Sabatti, & Bogomolov 2023), which require independent or permutation-simulated
  null p-values rather than analytically or Monte Carlo calibrating thresholds conditionally on S_i under
  multivariate Gaussian, t, and regression dependence.
