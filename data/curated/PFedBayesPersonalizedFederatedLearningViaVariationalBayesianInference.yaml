id: AIMech:PFedBayesPersonalizedFederatedLearningViaVariationalBayesianInference
name: pFedBayes (Personalized Federated Learning via Variational Bayesian Inference)
concept_kind: algorithm
review_status: DRAFT
definition: A personalized federated Bayesian neural network algorithm (Zhang, Li, Li, Guo, & Shao 2022, Section 3, Equations 8-20, Algorithm 1, Theorems 4.4-4.5) that models both the global parameters w ~ P_theta(w) = N(mu, diag(sigma^2)) and each client i's personalized parameters w_i ~ P_{theta_i}(w_i) = N(mu_i, diag(sigma_i^2)) (with reparameterization sigma = log(1 + exp(rho))) as mean-field Gaussian random variables and solves the bi-level variational Bayesian optimization problem min_{theta} (1/N) sum_{i=1}^N F_i(theta), where F_i(theta) = min_{theta_i} { zeta * KL(P_{theta_i}(w_i) || P_theta(w)) - E_{w_i ~ P_{theta_i}(w_i)} [log P(D_i | w_i)] } (Equations 8-9), by alternating R local reparameterized Monte Carlo gradient updates on personalized posterior parameters theta_i = (mu_i, rho_i) (Equation 15) and K local closed-form KL gradient updates on localized global prior parameters theta_g^i = (mu_g^i, rho_g^i) (Equation 17), followed by server momentum-style aggregation theta^{t+1} = (1 - beta) theta^t + (beta / |S^t|) sum_{i in S^t} theta_g^i (Equation 20).
identity_notes: Distinct from pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes, T. Dinh et al. 2020), which regularizes deterministic point-estimate weights via an L2 Moreau envelope (zeta/2) ||w_i - w||_2^2 without modeling posterior weight uncertainty sigma_i^2 or optimizing an evidence lower bound; and distinct from FedPA (AIMech:FedPaFederatedPosteriorAveragingViaLocalMcmcAndShrinkageCovariance, Al-Shedivat et al. 2021) and FedBE (AIMech:FedBeFederatedBayesianModelEnsembleViaStochasticWeightAverageDistillation, Chen & Chao 2021), which construct a single global posterior rather than bi-level personalized variational Bayesian posteriors P_{theta_i}(w_i) coupled to a learned global variational prior P_theta(w).
aliases:
- pFedBayes
- Personalized Federated Variational Bayesian Inference
- Bi-Level Variational Bayesian Personalized Federated Learning
