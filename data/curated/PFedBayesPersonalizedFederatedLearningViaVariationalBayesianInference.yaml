claims:
- claim_id: r479-bilevel-gaussian-elbo-and-reparameterized-update-mechanism
  kind: mechanism
  statement: Each client i minimizes its negative evidence lower bound zeta * KL(N(mu_i, diag(sigma_i^2)) || N(mu_g^i, diag((sigma_g^i)^2))) - (n / b) sum_{j in D_i} E_{epsilon ~ N(0,I)}[log P(D_j | mu_i + sigma_i odot epsilon)] (Equations 12-14) via R inner reparameterized stochastic gradient steps on theta_i = (mu_i, rho_i) (Equation 15) and K outer steps on the localized prior theta_g^i = (mu_g^i, rho_g^i) using the exact diagonal-Gaussian KL gradient (Equation 17), before the server aggregates theta^{t+1} = (1 - beta) theta^t + (beta / |S^t|) sum_{i in S^t} theta_g^i (Zhang et al. 2022, Section 3.3, Algorithm 1).
  evidence:
  - source_id: r479-primary-pdf
    locator: Section 3.3 (Equations 10-20, Algorithm 1), pp. 4-5
    relation: supports
- claim_id: r479-minimax-nonparametric-generalization-rate-scope
  kind: scope
  statement: Under beta-Holder smooth underlying client functions f_i(x) on [0, 1]^d and sparse Bayesian neural networks, Theorems 4.4 and 4.5 prove that the client-averaged squared Hellinger / L2 estimation error of pFedBayes is bounded by O(C_zeta (r_n / n) log^3 L + C_zeta xi_n^2) and achieves the minimax-optimal rate n^{-2 beta / (2 beta + d)} up to polylogarithmic factors while preventing overfitting in small-data regimes (Zhang et al. 2022, Section 4, Lemmas 4.1-4.3 & Theorems 4.4-4.5, pp. 5-7).
  evidence:
  - source_id: r479-primary-pdf
    locator: Section 4 (Lemmas 4.1-4.3, Theorems 4.4-4.5, Equations 21-31), pp. 5-7
    relation: supports
- claim_id: r479-small-data-non-iid-personalized-classification-application
  kind: application
  statement: Applied to non-IID personalized federated classification under small, medium, and large local sample sizes on MNIST, CIFAR-10, CIFAR-100, and Sent140 (Zhang et al. 2022, Section 5, Tables 1-2, Figures 1-3).
  evidence:
  - source_id: r479-primary-pdf
    locator: Section 5 (Experimental Results, Tables 1-2, Figures 1-3), pp. 7-9
    relation: supports
- claim_id: r479-doubled-parameter-communication-and-mc-sampling-limitation
  kind: limitation
  statement: Representing every weight by both a mean mu and variance parameter rho doubles the memory footprint and per-round communication payload relative to deterministic FedAvg/pFedMe and requires M Monte Carlo forward passes per minibatch step (Zhang et al. 2022, Section 3.3, Equations 10-16).
  evidence:
  - source_id: r479-primary-pdf
    locator: Section 3.3 (Equations 10-16, Algorithm 1), pp. 4-5
    relation: supports
