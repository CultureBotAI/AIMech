name: Probabilistic Principal Component Analysis
aliases:
- PPCA
concept_kind: model_family
definition: A linear Gaussian latent-variable model with a standard-normal latent prior and isotropic
  observation noise, whose maximum-likelihood loading subspace corresponds to leading principal components
  under the stated covariance-rank conditions.
identity_notes: The single Gaussian observation model is distinct from ordinary PCA as a deterministic
  projection, diagonal-noise factor analysis, kernel PCA, discrete-latent GTM, generalized component analysis
  with categorical observations, and supervised PCA. Its eigensolution and EM procedure are fitting alternatives
  for the same model. Mixtures, missing-data fitting and hierarchical variants require their own scope.
  Three candidate identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms
  and 457 preceding native IDs, names and aliases, with no normalized collision. Full searches of both
  checkouts included ignored and hidden files and returned the same 32 matching excerpts across nine paths.
  All excerpts were read; frontier leads and neighboring-model comparisons are not duplicate records.
  Historical ledgers were not reread in full solely because an excerpt matched. All 219 semantic-search
  rows were read, including six additional adaptive-pooling rows. Nineteen annotated AIO nodes and their
  outgoing edges were byte-verified against previous complete readings. Twenty-eight contextual YAMLs,
  including nine native neighbors, comprise 25 unchanged prior readings and three complete current readings.
  The identity and mapping assessment is bounded to this snapshot and maintained corpus.
