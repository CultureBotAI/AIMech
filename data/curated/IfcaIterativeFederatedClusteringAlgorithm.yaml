id: AIMech:IfcaIterativeFederatedClusteringAlgorithm
name: Iterative Federated Clustering Algorithm (IFCA)
concept_kind: algorithm
review_status: DRAFT
definition: An alternating minimization framework for clustered federated learning (IFCA, Algorithm 2) over m clients partitioned into k unknown latent data distributions D_1,...,D_k with cluster-specific minimizers theta_1^*,...,theta_k^*, where in each round t the server broadcasts all k candidate cluster models {theta_j^{(t)}}_{j=1}^k to participating clients M_t, each client i in M_t estimates its cluster identity via empirical loss minimization j_hat_i = argmin_{j in [k]} F_i(theta_j^{(t)}) (encoded as one-hot r_{i,j}), and the server updates each cluster model theta_j^{(t+1)} by aggregating local gradients or local SGD iterates exclusively over clients assigned to cluster j (optionally sharing weights across early representation layers).
identity_notes: Distinct from single-global-model federated optimization (FedAvg, FedProx, SCAFFOLD) and from per-client personalized federated learning such as pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes), Per-FedAvg (AIMech:PerFedAvgModelAgnosticMetaLearningForPersonalizedFederatedLearning), Ditto (AIMech:DittoFairAndRobustPersonalizedFederatedMultiTaskLearning), and FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning), which maintain n distinct client models or heads rather than inferring discrete latent cluster memberships S_1,...,S_k and learning k shared cluster-level models.
aliases:
- IFCA
- Iterative Federated Clustering Algorithm
- Clustered Federated Learning via Alternating Minimization
