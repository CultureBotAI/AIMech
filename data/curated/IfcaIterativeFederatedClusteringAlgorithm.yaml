- target: AIO:FederatedLearning
  relation: narrow_match
  rationale: IFCA is a clustered FederatedLearning algorithm that alternates between local cluster membership estimation and server-side cluster model aggregation.
- target: AIO:Clustering
  relation: related_match
  rationale: IFCA partitions heterogeneous federated clients into k latent clusters based on local empirical risk.
limitations:
- Requires broadcasting k candidate models on the downlink in each round unless early layers are shared.
- Theoretical guarantees require cluster separation Delta above a threshold and initialization near the true cluster centers.
