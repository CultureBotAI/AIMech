claims:
- claim_id: vr-diana-strongly-convex-linear-convergence
  kind: mechanism
  statement: Under L-smoothness of each f_{ij}, convexity of f_{ij}, and mu-strong convexity of each f_i, VR-DIANA (Algorithm 2, L-SVRG and SAGA variants) and SVRG-DIANA (Algorithm 3) with alpha = 1/(omega + 1) and gamma = 1 / (L*(1 + 36*(omega + 1)/n)) contract the Lyapunov function psi^k = ||x^k - x^*||_2^2 + b*gamma^2*H^k + c*gamma^2*D^k at linear rate rho = min{mu / (L*(1 + 36*(omega + 1)/n)), alpha/2, 3/(8*m)}, reaching E[||x^k - x^*||_2^2] <= epsilon * psi^0 in O((kappa + kappa*omega/n + m + omega) log(1/epsilon)) iterations using only quantized uplink messages.
  evidence:
  - source_id: r573-primary-pdf
    locator: Section 7.1 Theorem 2 and Corollary 2, p. 6; Appendix E.1 pp. 17-21; Appendix F.1 Theorem 6 and Corollary 5, p. 27
    relation: supports
- claim_id: vr-diana-convex-and-nonconvex-rates
  kind: mechanism
  statement: For general convex objectives (mu = 0), VR-DIANA achieves E[f(x^a) - f^*] <= epsilon in O(((1 + omega/n)*sqrt(m) + omega/sqrt(m)) / epsilon) iterations (Theorem 3, Corollary 3), and for smooth nonconvex objectives it achieves E[||grad f(x^a)||_2^2] <= epsilon in O((1 + omega/n)^{1/2} * (m^{2/3} + omega) / epsilon) iterations (Theorem 4, Corollary 4), matching unquantized variance-reduced rates whenever omega = O(min{n, m}) (convex) or omega = O(m^{2/3}) (nonconvex).
  evidence:
  - source_id: r573-primary-pdf
    locator: Section 7.2 Theorem 3 and Corollary 3, Section 7.3 Theorem 4 and Corollary 4, Table 1, p. 7
    relation: supports
- claim_id: vr-diana-distributed-logistic-regression-application
  kind: application
  statement: Applied to distributed L2-regularized logistic regression on LIBSVM datasets (real-sim, Gisette, mushrooms, a5a) with l_infinity, l_2, and block random dithering, VR-DIANA (DIANA-SVRG, DIANA-SAGA, DIANA-LSVRG) converges linearly to machine precision (10^{-15}) while outperforming DIANA-SGD, QSVRG, and TernGrad-Adam in wall-clock time and data passes.
  evidence:
  - source_id: r573-primary-pdf
    locator: Section 8 Experiments, Figures 1-3, pp. 8-9; Appendix A Figures 4-5, p. 12
    relation: supports
- claim_id: vr-diana-limitations
  kind: limitation
  statement: VR-DIANA requires unbiased omega-quantization operators (E_Q[Q(x)] = x) and maintains a d-dimensional shift vector h_i^k on each worker (plus an O(m*d) gradient table on each worker in the SAGA variant), and it assumes full worker participation and uncompressed downlink broadcasts of x^k from the central server.
  evidence:
  - source_id: r573-primary-pdf
    locator: Section 4 Definition 4, p. 3; Section 6 Algorithm 2 and Section 6.2, pp. 5-6
    relation: supports
