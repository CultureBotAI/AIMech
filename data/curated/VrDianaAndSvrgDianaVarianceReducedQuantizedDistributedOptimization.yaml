id: AIMech:VrDianaAndSvrgDianaVarianceReducedQuantizedDistributedOptimization
name: VR-DIANA and SVRG-DIANA (Variance-Reduced Distributed Learning with Gradient Quantization)
concept_kind: algorithm
review_status: DRAFT
definition: 'VR-DIANA and SVRG-DIANA are doubly variance-reduced distributed optimization algorithms for solving min_{x in R^d} f(x) = (1/n) sum_{i=1}^n f_i(x) with local finite-sum structure f_i(x) = (1/m) sum_{j=1}^m f_{ij}(x) across n workers using arbitrary unbiased omega-quantization operators Q: R^d -> R^d (satisfying E_Q[Q(v)] = v and E_Q[||Q(v) - v||_2^2] <= omega ||v||_2^2). At each iteration k, each worker i computes a local variance-reduced stochastic gradient g_i^k = grad f_{i, j_i^k}(x^k) - grad f_{i, j_i^k}(w_{i, j_i^k}^k) + mu_i^k via L-SVRG (Variant 1), SAGA (Variant 2), or multi-epoch SVRG (Algorithm 3), quantizes only the shifted difference Delta_hat_i^k = Q(g_i^k - h_i^k) relative to a local state h_i^k, updates h_i^{k+1} = h_i^k + alpha * Delta_hat_i^k, and enables the master to take the global step x^{k+1} = x^k - gamma * (h^k + (1/n) sum_{i=1}^n Delta_hat_i^k) that eliminates both local sampling variance and quantization variance without ever transmitting uncompressed gradients.'
identity_notes: Distinct from baseline DIANA (Mishchenko et al., 2019; Round 389), which does not incorporate local finite-sum variance reduction and only converges to an O(sigma^2 / (mu^2 * n)) neighborhood under stochastic gradients. Also distinct from ADIANA (Li et al., 2020; Round 390), which accelerates full-batch or L-SVRG DIANA via Nesterov momentum, and from QSVRG (Alistarh et al., 2017; Round 378), which requires broadcasting exact uncompressed full gradients at the start of every epoch.
aliases:
- VR-DIANA
- Variance-Reduced DIANA
- DIANA-LSVRG
- DIANA-SAGA
- SVRG-DIANA
