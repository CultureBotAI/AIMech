id: AIMech:ThreePointCompressorsForCommunicationEfficientDistributedTraining
name: 3PC Three Point Compressors for Communication-Efficient Distributed Training
concept_kind: algorithm
review_status: DRAFT
definition: 'A unified class of parameterized compression mechanisms C_{h,y}: R^d -> R^d (Three Point Compressors, 3PC) conditioned on two state vectors h, y in R^d that satisfy E[||C_{h,y}(x) - x||^2] <= (1 - A)||h - y||^2 + B||x - y||^2 for constants A in (0, 1] and B >= 0, together with the 3PC distributed gradient descent algorithm (x^(t+1) = x^t - gamma * g^t, g_i^(t+1) = C_{g_i^t, grad f_i(x^t)}(grad f_i(x^(t+1)))) that unifies and hybridizes contractive error feedback (EF21), Lazily Aggregated Gradients (LAG), Compressed Lazy Aggregation (CLAG), and probabilistic shifting (3PCv1-3PCv5).'
identity_notes: Introduced by Peter Richtarik, Igor Sokolov, Ilyas Fatkhullin, Elnur Gasanov, Zhize Li, and Eduard Gorbunov (ICML 2022, PMLR Vol. 162, pp. 18596-18648; arXiv:2202.00998). Distinct from EF21 (Richtarik, Sokolov, & Fatkhullin, NeurIPS 2021; Round 380), which is a single special case of 3PC without lazy trigger thresholds; and distinct from standalone Lazily Aggregated Gradient (LAG, Chen et al., NeurIPS 2018), which uses a multi-step weighted history condition without contractive compression or the single-step 3PC Lyapunov inequality.
aliases:
- 3PC
- Three Point Compressors
- CLAG Compressed Lazy Aggregation
