claims:
- claim_id: threepc-three-point-contraction-and-clag-hybridization-mechanism
  kind: mechanism
  statement: Given an alpha-contractive compressor C, 3PC instantiates EF21 via C_{h,y}^EF21(x) = h + C(x - h) with A = 1 - sqrt(1 - alpha) and B = (1 - alpha) / (1 - sqrt(1 - alpha)), instantiates single-step LAG via C_{h,y}^LAG(x) = x if ||x - h||^2 > zeta * ||x - y||^2 else h with A = 1 and B = zeta, and combines them into CLAG (Algorithm 4) via C_{h,y}^CLAG(x) = h + C(x - h) if ||x - h||^2 > zeta * ||x - y||^2 else h satisfying Definition 4.1 with A = 1 - sqrt(1 - alpha) and B = max{(1 - alpha)/(1 - sqrt(1 - alpha)), zeta}.
  evidence:
  - source_id: r559-primary-pdf
    locator: Section 4.1-4.3 Equations (6)-(13), Table 1, & Appendix C Lemmas C.3, C.5, and C.8, pp. 4-6, 17-20
    relation: supports
- claim_id: threepc-nonconvex-o-1-over-t-and-pl-linear-convergence-scope
  kind: scope
  statement: For any 3PC compressor with parameters (A, B) applied to L_--smooth global and L_+-average-smooth local objectives with step size 0 < gamma <= 1 / (L_- + L_+ * sqrt(2*B/A)), Lemma 5.4 establishes the Distortion Lyapunov recursion E[G^(t+1)] <= (1 - A) E[G^t] + B * L_+^2 * E[||x^(t+1) - x^t||^2], Theorem 5.5 proves O(1/T) nonconvex stationarity without bounded gradient similarity, and Theorem 5.6 proves linear convergence under the Polyak-Lojasiewicz condition.
  evidence:
  - source_id: r559-primary-pdf
    locator: Section 5 Assumptions 5.1-5.3, Lemma 5.4, Theorem 5.5, & Theorem 5.6, pp. 7-8
    relation: supports
- claim_id: threepc-worst-case-trigger-and-stochastic-minibatch-limitation
  kind: limitation
  statement: The deterministic worst-case iteration bound for LAG and CLAG depends on B = max{(1 - alpha)/(1 - sqrt(1 - alpha)), zeta}, which does not strictly improve the worst-case bound of EF21 when all workers trigger communication simultaneously, and stochastic extensions require either growing minibatches or PAGE/SPIDER variance reduction.
  evidence:
  - source_id: r559-primary-pdf
    locator: Section 4.2-4.3 Remarks & Appendix G Stochastic Extensions, pp. 5-6, 37-45
    relation: supports
- claim_id: threepc-clag-nonconvex-logistic-regression-and-resnet18-cifar10-application
  kind: application
  statement: Applied to distributed nonconvex logistic regression across LIBSVM datasets (phishing, w8a, a9a, mushrooms) and distributed training of ResNet-18 on CIFAR-10, where CLAG and 3PCv1-3PCv5 reduce total communicated bits compared to standalone EF21 and LAG.
  evidence:
  - source_id: r559-primary-pdf
    locator: Section 6 Experiments & Appendix B Additional Experiments, pp. 8-9, 13-16
    relation: supports
