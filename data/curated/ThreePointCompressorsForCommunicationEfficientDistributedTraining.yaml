  rationale: AIO:FederatedLearning covers distributed model training across networked nodes, whereas 3PC is a parameterized three-point compression and lazy-aggregation framework for communication-efficient distributed optimization.
limitations:
- Requires each worker to store previous gradient and iterate states to evaluate the three-point operator.
- Lazy upload skipping gains depend on inter-worker smoothness heterogeneity and the trigger parameter zeta.
