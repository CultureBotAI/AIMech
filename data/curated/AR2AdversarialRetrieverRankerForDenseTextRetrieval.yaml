claims:
- claim_id: r757-claim-contrastive-minimax-upper-bound
  kind: mechanism
  statement: Because direct optimization of the combinatorial expectation J^theta = E_{D_q^- ~ G_theta(q, .)}[log p_phi(d | q; {d} U D_q^-)] over n sampled negatives is intractable, AR2 derives the pairwise upper bound J^theta <= J_hat^theta = E_{d_i^- ~ p_theta(. | q; D_q^-)}[log p_phi(d | q; {d, d_i^-})] with exact gradient grad_theta J_hat^theta = E_{d_i^- ~ p_theta(. | q; D_q^-)}[grad_theta log p_theta(d_i^- | q; D_q^-) log p_phi(d | q; {d, d_i^-})], which grants smooth high-probability updates to unlabeled false-negative documents that receive high relevance scores from the cross-encoder ranker D_phi.
  evidence:
  - source_id: r757-primary-pdf
    locator: Section 1, Section 3.2, & Appendix A.1, Equations 5-10 and 13-15, pp. 2, 4, 13
    relation: supports
- claim_id: r757-claim-distillation-entropy-regularization
  kind: mechanism
  statement: To prevent the retriever G_theta from converging to overly sharp conditional probabilities over D_q = {d} U D_q^- that impede negative exploration during the 10-iteration coordinate game (1,500 retriever mini-batches and 500 ranker mini-batches per iteration followed by FAISS ANN index refresh), AR2 adds the cross-entropy distillation regularizer J_R^theta = H(p_phi(. | q; D_q), p_theta(. | q; D_q)), raising top-15 retriever distribution entropy on Natural Questions from 1.70 to 2.10 and improving R@1 from 57.8 to 58.7 and R@5 from 77.3 to 77.9.
  evidence:
  - source_id: r757-primary-pdf
    locator: Section 1, Section 3.2-3.3, Section 4.2, & Section 4.4, Equations 11-12, Algorithm 1, Table 5, pp. 2, 5-8
    relation: supports
- claim_id: r757-claim-nq-triviaqa-msmarco-application
  kind: application
  statement: First-stage dual-encoder retriever AR2-G achieves 77.9 R@5, 86.0 R@20, and 90.1 R@100 on Natural Questions test (rising to 78.8 R@5 / 86.5 R@20 / 90.4 R@100 with ERNIE-2.0-Large, and 65.6 R@1 / 81.5 R@5 / 84.9 R@10 when reranked by AR2-D), 78.2 R@5 / 84.4 R@20 / 87.9 R@100 on TriviaQA test (82.1 R@5 with AR2-D), and 39.5 MRR@10 / 87.8 R@50 / 98.6 R@1k on MS-MARCO Passage Dev (43.2 MRR@10 with AR2-D), outperforming ANCE, RocketQA, PAIR, coCondenser, and IRGAN (55.2 vs. 58.7 R@1 on NQ).
  evidence:
  - source_id: r757-primary-pdf
    locator: Abstract, Section 4.3-4.4, & Appendix A.7-A.8, Tables 1-2, 4, 6, and 12-13, Figures 3-4, pp. 1, 6-8, 16
    relation: supports
- claim_id: r757-claim-training-latency-and-ann-refresh-limitation
  kind: limitation
  statement: AR2 requires jointly holding and updating a 330M-parameter cross-encoder ranker alongside the 110M-parameter dual-encoder retriever across 10 iterations of corpus re-encoding and FAISS ANN index rebuilding (taking 9.1 hours on 8 A100 GPUs at n=15 negatives vs. 1.85 hours for DPR), and per-batch training latency scales nearly linearly with negative sample size n (from 210ms at n=1 to 630ms at n=15).
  evidence:
  - source_id: r757-primary-pdf
    locator: Section 4.2, Section 4.4 (Table 3), & Appendix A.2 (Table 7) and A.4 (Table 9), pp. 6-7, 13, 15
    relation: supports
