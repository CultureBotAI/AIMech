id: AIMech:AR2AdversarialRetrieverRankerForDenseTextRetrieval
name: AR2 Adversarial Retriever-Ranker for Dense Text Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: A joint adversarial training algorithm for dense text retrieval that couples a dual-encoder retriever G_theta(q, d) = E_theta(q)^T E_theta(d) and a cross-encoder ranker D_phi(q, d) = w_phi^T E_phi([q, d]) in a contrastive minimax game J^{G*, D*} = min_theta max_phi E_{D_q^- ~ G_theta(q, .)}[log p_phi(d | q; D_q)] where D_q = {d} U D_q^- and p_phi(d | q; D_q) = exp(tau D_phi(q, d)) / sum_{d' in D_q} exp(tau D_phi(q, d')), alternating coordinate updates that (1) train the ranker D_phi to maximize log p_phi(d | q; D_q) over the ground-truth passage d and n hard negatives D_q^- sampled from the top-K candidates of the retriever's FAISS ANN index, (2) update the retriever G_theta to minimize the tractable pairwise expectation upper bound J_hat^theta = E_{d^- ~ p_theta(. | q; D_q^-)}[log p_phi(d | q; {d, d^-})] via policy-gradient weighting grad_theta log p_theta(d^- | q; D_q^-) log p_phi(d | q; {d, d^-}) plus a cross-entropy distillation regularizer J_R^theta = H(p_phi(. | q; D_q), p_theta(. | q; D_q)) that prevents retriever probability collapse, and (3) refresh the corpus ANN index after each iteration.
identity_notes: Distinct from ANCE (Xiong et al., ICLR 2021, AIMech:ANCEApproximateNearestNeighborNegativeContrastiveLearning), which iteratively mines hard negatives from an ANN index without a cross-encoder ranker or adversarial minimax reward; distinct from RocketQA (Qu et al., NAACL 2021, AIMech:RocketQADenoisedHardNegativeSampling), which uses a static cross-encoder to filter hard negatives offline across separate pipeline stages rather than interactive minimax co-training; and distinct from IRGAN (Wang et al., SIGIR 2017), which uses a binary GAN discriminator objective log D_phi(d, q) + log(1 - D_phi(d^-, q)) rather than a listwise contrastive cross-encoder likelihood with entropy-smoothing distillation regularization.
aliases:
- AR2
- Adversarial Retriever-Ranker
- AR2-G and AR2-D
- Adversarial Minimax Retriever-Ranker Training
