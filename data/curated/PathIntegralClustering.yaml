name: Path integral clustering
definition: An agglomerative clustering algorithm that merges clusters with the greatest increase in their
  size-normalized sums of discounted random-walk paths when paths are allowed through the proposed union.
concept_kind: algorithm
identity_notes: 'This is Zhang, Zhao and Wang’s 2013 maximum-incremental-path-integral clustering procedure.
  The qualified PIC alias denotes path integral clustering, not unrelated power-iteration clustering or
  generic physical path integration. Its affinity uses conditional path descriptors, not simply the merged
  cluster’s descriptor minus the two original descriptors. GDL instead uses products of degree averages;
  JULE is a joint neural-learning procedure. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 214 preceding native IDs/names/aliases. Word-delimited fixed-string searches
  of both full checkouts, including ignored and hidden files, returned 31 lines each: existing SimCLR/InfoNCE
  component discussion, shared primary-source references and discovery/review context. Five native neighbors
  and seven exact AIO nodes with scoped synonyms and outgoing relations were inspected.'
limitations:
- The distance/similarity, neighborhood size, bandwidth, discount z and target count are inputs or choices.
  Row normalization needs positive row sums; 0<z<1 and a substochastic principal submatrix make the geometric
  series converge.
- Initial nearest-neighbor components and later greedy merges are irreversible. The algorithm cannot split
  an initial component to reach a larger requested cluster count. No semantic recovery or global partition
  optimum is certified.
- Conditional path descriptors retain each original cluster’s |C|^2 normalization and endpoint indicator.
  Replacing the affinity by S_(A union B)−S_A−S_B changes the method. Principal submatrices are not independently
  renormalized transition matrices.
- The paper’s efficient-computation discussion relies on sparse graphs, iterative solves and chosen conditioning/discount.
  An exact resolvent formula is not a claim of exact finite-iteration numerical solves or an unconditional
  linear bound for the whole clustering algorithm. No runtime or benchmark reproduction was performed.
