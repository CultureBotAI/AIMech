claims:
- claim_id: method
  kind: mechanism
  statement: Build a weighted directed nearest-neighbor graph and row-normalize its adjacency W to obtain
    transition matrix P=D^−1 W. Keep that global P fixed. Initialize small clusters by linking each sample
    to its nearest neighbor and repeatedly merging overlapping groups. For nonempty C and 0<z<1, let P_C
    be the principal submatrix of P, without renormalizing its rows inside C, and define S_C=1_C^T(I−z
    P_C)^−1 1_C/|C|^2. This sums geometrically discounted within-C transition paths, including the length-zero
    identity contribution. For U=A union B, define S_(A|U)=e_A^T(I−z P_U)^−1 e_A/|A|^2, where e_A is the
    indicator of A among the vertices of U; its paths stay in U and start and end in A. Merge the pair
    maximizing (S_(A|U)−S_A)+(S_(B|U)−S_B), then repeat to the requested count. Linear systems can evaluate
    the descriptors without explicitly forming a dense inverse.
