claims:
- claim_id: two-line-sc-dc-factorization-for-doubly-weighted-fdr
  kind: mechanism
  statement: 'For any countable hypothesis space H equipped with a finite positive volume measure Lambda
    and factorized threshold collection Delta(h, r) = alpha pi(h) beta(r) (Definition 2.4), if a multiple
    testing procedure R satisfies the Self-Consistency Condition SC(alpha, pi, beta), namely R subset
    L_Delta(|R|) almost surely with |R| = Lambda(R) and L_Delta(r) = {h in H : p_h <= alpha pi(h) beta(r)}
    (Definition 2.5), and the pair (p_h, |R|) satisfies the Dependency Control Condition DC(beta) for
    every true null h in H_0, namely E[1{p_h <= c beta(|R|)} / |R|] <= c for all c > 0 (Definition 2.6),
    then by Proposition 2.7 the Lambda-weighted False Discovery Rate satisfies FDR(R) = sum_{h in H_0}
    Lambda({h}) E[1{h in R} / |R|] <= sum_{h in H_0} Lambda({h}) E[1{p_h <= alpha pi(h) beta(|R|)} / |R|]
    <= alpha Pi(H_0) = alpha sum_{h in H_0} Lambda({h}) pi(h), controlling doubly weighted FDR at level
    alpha whenever pi is a sub-probability density with respect to Lambda (Pi(H) <= 1).'
  evidence:
  - source_id: blanchard-roquain2008-ar5iv
    locator: Section 2.2–2.3, lines 155–231, Definitions 2.2–2.6 and Proposition 2.7
    relation: supports
  - source_id: blanchard-roquain2008-abs
    locator: Abstract (inclusion of both hypothesis importance weights and prior p-value weights)
    relation: supports
- claim_id: order-free-maximal-self-consistent-step-up-characterization
  kind: mechanism
  statement: 'Without requiring identical thresholds across hypotheses or an explicit global reordering
    of p-values, the weighted step-up procedure associated with threshold collection Delta is uniquely
    characterized by Definition 3.1 and Section 3.1 as the maximal self-consistent set R_SU = L_Delta(r_hat)
    with volume r_hat = max{r in {|A| : A subset H} : |L_Delta(r)| >= r}, which equals the union R_SU
    = bigcup_{A subset H, A subset L_Delta(|A|)} A of all self-consistent subsets and satisfies the exact
    fixed-point volume identity |L_Delta(r_hat)| = r_hat; furthermore, all generalized step-up-down procedures
    of order lambda in [0, |H|] (Theorem 4.5, unifying step-down at lambda = 0 and step-up at lambda =
    |H|) as well as geometrically constrained connected-neighborhood subsets R_geom subset R_SU satisfying
    |R_geom| >= r_geom with R_geom subset L_Delta(|R_geom|) (Section 4.1.4) satisfy SC(alpha, pi, beta).'
  evidence:
  - source_id: blanchard-roquain2008-ar5iv
    locator: Section 3.1, lines 236–295, Definition 3.1; Section 4.1.4, lines 494–510; Section 4.2, lines
      555–612, Theorem 4.5
    relation: supports
- claim_id: prior-integrated-shape-function-family-under-arbitrary-dependence
  kind: mechanism
  statement: 'By Lemma 3.2, dependency control DC(beta) holds in three primary regimes: (i) under independence
    with linear shape beta(x) = x when |R| = g(p_h) is nonincreasing in p_h (Proposition 3.3); (ii) under
    Positive Regression Dependency on a Subset (PRDS on H_0) with linear shape beta(x) = x whenever |R|
    is nonincreasing in the p-value vector p, proved via a geometric grid v_i = rho^{K+1-i} telescopic
    bound (Proposition 3.6); and (iii) under completely unspecified/arbitrary p-value dependencies and
    for ANY rejection rule R (even without monotonicity of |R|), DC(beta_nu) holds for the prior-integrated
    shape function family beta_nu(r) = int_0^r x d_nu(x) induced by any probability distribution nu on
    (0, infty) (Lemma 3.2(iii), Proposition 3.7, and Theorem 4.2 via Fubini''s theorem), which recovers
    on V_H = {1, ..., m} the Benjamini-Yekutieli harmonic shape beta_nu(r) = gamma_m^{-1} floor(r) under
    nu({k}) = (gamma_m k)^{-1}, the Sarkar (2008) quadratic shape beta_nu(r) = floor(r)(floor(r)+1)/(2m)
    under uniform nu({k}) = 1/m, the cubic shape beta_nu(r) = floor(r)(floor(r)+1)(2floor(r)+1)/(3m(m+1))
    under linear nu({k}) = 2k/(m(m+1)), and one-step k_0-threshold rules beta_{delta_{k_0}}(r) = k_0 1{r
    >= k_0} under Dirac nu = delta_{k_0}.'
  evidence:
  - source_id: blanchard-roquain2008-ar5iv
    locator: Section 3.2, lines 297–383, Lemma 3.2 and Propositions 3.3, 3.6, and 3.7; Section 4.1.1–4.1.2,
      lines 387–482, Theorems 4.1–4.2; Appendix A.1, lines 686–765
    relation: supports
- claim_id: two-stage-adaptive-fdr-bound-and-step-down-log-convexity
  kind: mechanism
  statement: For an adaptive step-up procedure with data-dependent thresholds Delta(h, r, p) = alpha_1
    pi(h) G(p) beta(r) where G(p) >= 0 is nondecreasing in each coordinate of p, Lemma 4.3 proves that
    under PRDS with beta(r) = r or under arbitrary dependence with beta = beta_nu, the FDR satisfies FDR(R)
    <= alpha_1 + P(G(p) > pi_0^{-1}), so choosing G(p) = (1 - r_hat_0(p)/|H|)^{-1} from a first-stage
    alpha_0-FWER procedure R_0 yields two-stage FDR control at level alpha_1 + alpha_0 (Corollary 4.4);
    furthermore, Theorem 4.6 proves via endpoint maximization of the log-convex function x -> (m_0/(m_0
    + x))(m/(m - x)) <= 1 on [0, m_1] that the Benjamini-Liu (1999a) / Romano-Shaikh (2006a) step-down
    procedure with thresholds Delta(i) = alpha m / (m - i + 1)^2 controls FDR at level alpha under H_1
    PRDSS on H_0, and with Delta(i) = (alpha m / (m - i + 1)) beta_nu(1/(m - i + 1)) under arbitrary dependence.
  evidence:
  - source_id: blanchard-roquain2008-ar5iv
    locator: Section 4.1.5, lines 511–554, Lemma 4.3 and Corollary 4.4; Section 4.2, lines 613–647, Theorem
      4.6; Appendix A.2, lines 766–816
    relation: supports
