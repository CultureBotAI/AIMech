id: AIMech:SelfConsistencyAndDependencyControlFDRFramework
name: Self-consistency and dependency control framework for false discovery rate control
aliases:
- Blanchard-Roquain Self-Consistency and Dependency Control Framework
- SC and DC Conditions for Weighted False Discovery Rate Control
- Order-Free Maximal Self-Consistent Step-Up and Prior-Integrated Shape Function Framework
concept_kind: mathematical_method
definition: 'A modular mathematical framework for multiple hypothesis testing on any countable (or continuous)
  hypothesis space H equipped with a finite positive volume measure Lambda and factorized threshold collection
  Delta(h, r) = alpha pi(h) beta(r) (with p-value weight density pi: H -> [0, 1] and nondecreasing shape
  function beta: R^+ -> R^+) developed by Gilles Blanchard and Etienne Roquain (2008, Electronic Journal
  of Statistics 2:963-992, arXiv:0802.1406v2, DOI:10.1214/08-EJS180) that decouples control of the Lambda-weighted
  False Discovery Rate FDR(R) = E[(Lambda(R cap H_0) / Lambda(R)) 1{Lambda(R) > 0}] into two sufficient
  conditions: (1) the geometric Self-Consistency Condition SC(alpha, pi, beta), requiring R subset L_Delta(|R|)
  almost surely where |R| = Lambda(R) and L_Delta(r) = {h in H : p_h <= Delta(h, r)}, and (2) the probabilistic
  Dependency Control Condition DC(beta), requiring E[1{p_h <= c beta(|R|)} / |R|] <= c for every true
  null h in H_0 and c > 0, which together imply FDR(R) <= alpha Pi(H_0) = alpha sum_{h in H_0} Lambda({h})
  pi(h) across independence, positive regression dependency (PRDS), and arbitrary dependence via the prior-integrated
  shape function family beta_nu(r) = int_0^r x d_nu(x).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 593 previously curated AIMech concepts.
  While AIMech:OptimalMultiWeightedStepUpProcedureForFDRControl (Roquain & van de Wiel 2009), AIMech:AdaptiveDataDrivenOptimalPValueWeighting
  (Durand 2019), AIMech:OptimalSpjotvollAndSieveGroupedPValueWeighting (Roeder & Wasserman 2009), and
  AIMech:ConstrainedConvexPValueWeightingInMonotoneLikelihoodRatioFamilies (Dobriban 2018) derive optimal
  p-value weights under Gaussian or MLR alternative models, none encode Blanchard & Roquain's (2008, Electronic
  Journal of Statistics 2:963-992, arXiv:0802.1406v2, DOI:10.1214/08-EJS180) modular Self-Consistency
  SC(alpha, pi, beta) and Dependency Control DC(beta) framework, the order-free characterization of the
  doubly weighted step-up procedure as the maximal self-consistent set R_SU = bigcup_{A subset L_Delta(|A|)}
  A = L_Delta(r_hat) with |L_Delta(r_hat)| = r_hat, the prior-integrated shape function family beta_nu(r)
  = int_0^r x d_nu(x) for arbitrary p-value dependence (unifying Benjamini-Yekutieli harmonic priors,
  Sarkar 2008 quadratic thresholds under uniform nu, and cubic thresholds under linear nu), or the log-convexity
  step-down FDR bound for Delta(i) = alpha m / (m - i + 1)^2.
