claims:
- claim_id: r721-claim-swap-descent-theorem
  kind: mechanism
  statement: 'Under the Edge-Popup straight-through score update s_tilde_{uv} = s_{uv} - alpha (dL/dI_v) w_{uv} Z_u, whenever a non-empty set of inactive edges E_new whose weighted outputs w_{uv} Z_u align with the negative loss gradient -dL/dI_v increases in score enough to replace an equal number of edges E_old in a layer''s top-k% active set (s_{new} < s_{old} and s_tilde_{new} > s_tilde_{old}), the first-order Taylor expansion guarantees that the mini-batch loss strictly decreases: L(I_tilde) < L(I).'
  evidence:
  - source_id: r721-primary-pdf
    locator: Section 3.2 & Appendix B.1, Theorem 1, Equations 7-21, pp. 4, 11
    relation: supports
- claim_id: r721-claim-combinatorial-search-space-and-scaling
  kind: mechanism
  statement: Because Edge-Popup selects kn weights out of n per layer, the combinatorial search space of (n choose kn) subnetworks is maximized when k is in [30%, 70%] (peaking near k = 50% while degenerating to empty networks as k -> 0% and random untrained networks as k -> 100%), and sampling weights from the Signed Kaiming Constant distribution U_k = {-sigma_k, +sigma_k} with sigma_k = sqrt(2 / n_{l-1}) (or Scaled Kaiming with factor sqrt(1/k)) preserves forward activation variance and substantially outperforms Xavier Normal or Kaiming Uniform initialization.
  evidence:
  - source_id: r721-primary-pdf
    locator: Section 4.1-4.5, Figures 3, 6, 7, and 10, pp. 5-8
    relation: supports
- claim_id: r721-claim-imagenet-untrained-subnetwork-application
  kind: application
  statement: "Without ever modifying any weight or batch-normalization parameter, Edge-Popup discovers an untrained subnetwork (k = 30%, 20.6M parameters) inside a randomly weighted Wide ResNet-50 initialized with Signed Kaiming Constant that achieves 73.3% top-1 accuracy on ImageNet\u2014matching a dense 21.8M-parameter ResNet-34 trained with SGD (73.3%)\u2014and discovers a 13M-parameter untrained subnetwork inside ResNet-101 achieving 72.3% top-1 accuracy."
  evidence:
  - source_id: r721-primary-pdf
    locator: Section 4.6 & Appendix A, Figure 8, Table 2, pp. 8, 11-12
    relation: supports
- claim_id: r721-claim-not-lottery-tickets-limitation
  kind: limitation
  statement: 'Subnetworks discovered by Edge-Popup at random initialization are not Lottery Ticket winning tickets: when their weights are subsequently trained from initialization with SGD on ImageNet, they do not reach the accuracy of the dense parent network and perform no better than training a randomly chosen 30% subnetwork (e.g., 73.6% vs. 73.5% on ResNet-50), and finding competitive untrained subnetworks requires the parent network to be substantially wider and deeper than a standard trained model.'
  evidence:
  - source_id: r721-primary-pdf
    locator: Section 4.6 & Appendix C.2, Table 3, pp. 8, 12-13
    relation: supports
