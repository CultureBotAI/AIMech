id: AIMech:EdgePopupUntrainedSubnetworkScoreOptimization
name: Edge-Popup Untrained Subnetwork Score Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A subnetwork discovery algorithm for randomly weighted neural networks that keeps all weights w_{uv} (including first, last, and batch-normalization layers) frozen at their random initialization, associates each edge (u, v) with a positive real-valued popup score s_{uv}, deterministically selects the subgraph of edges in each layer l with the top-k% highest scores via hard indicator h(s_{uv}) in {0, 1} to compute layer inputs I_v = sum_u w_{uv} Z_u h(s_{uv}), and updates all scores (including currently inactive edges) via stochastic gradient descent with the straight-through estimator s_tilde_{uv} = s_{uv} - alpha (dL/dI_v) w_{uv} Z_u.
identity_notes: Distinct from stochastic Bernoulli supermask sampling (Zhou et al., NeurIPS 2019), which samples binary masks stochastically on every forward pass and suffers high gradient variance at scale, from Discovering Neural Wirings (DNW, Wortsman et al., NeurIPS 2019), which selects top-k% edges by weight magnitude while modifying the weights themselves, from Piggyback (AIMech:PiggybackBinaryWeightMaskMultiTaskAdaptation), which thresholds masks on ImageNet-pretrained backbones with a trained linear classifier head, and from SupSup (AIMech:SupSupSupermasksInSuperposition), which extends Edge-Popup to multi-task superposition and one-shot entropy-based task inference.
aliases:
- Edge-Popup
- edge-popup Algorithm
- Edge-Popup Supermask Optimization
- Popup Score Top-k Untrained Subnetwork Search
