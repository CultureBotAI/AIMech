id: AIMech:SketchyFrequentDirectionsAdaptiveRegularizationOptimization
name: Sketchy (Frequent-Directions Sketched Adaptive Regularization / S-AdaGrad and S-Shampoo)
concept_kind: algorithm
review_status: DRAFT
definition: "A memory-efficient matrix-preconditioned adaptive optimization framework\u2014instantiated as Sketchy AdaGrad (S-AdaGrad) for vector parameters and Sketchy Shampoo (S-Shampoo) for tensor parameters\u2014that tracks a rank-ell Frequent Directions (FD) sketch of the gradient covariance (or its left and right Kronecker factors) and adds dynamic isotropic regularization equal to the cumulative deflated ell-th eigenvalue mass rho_{1:t} I, sandwiching the true covariance (G_bar_t <= G_t <= G_bar_t + rho_{1:t} I) in sublinear O(m ell + n ell) accumulator memory."
identity_notes: Distinct from Shampoo (AIMech:ShampooPreconditionedStochasticTensorOptimization), which materializes full m x m and n x n left and right Kronecker covariance factors in O(m^2 + n^2) memory. Distinct from GGT (AIMech:GgtEfficientFullMatrixAdaptiveRegularization), which stores a sliding window of r full-model gradient copies in O(m n r) superlinear memory. Distinct from Ada-FD and FD-SON, which add a static diagonal perturbation delta I rather than the dynamic cumulative escaped spectral mass rho_{1:t} I and suffer Omega(T^{3/4}) or Omega(T) worst-case regret on general online convex problems.
aliases:
- Sketchy Optimizer
- S-AdaGrad
- S-Shampoo
- Sketchy AdaGrad and Sketchy Shampoo
- Frequent-Directions Sketched Matrix Preconditioning
