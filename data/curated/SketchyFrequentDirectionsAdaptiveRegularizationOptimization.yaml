claims:
- claim_id: sketchy-escaped-mass-loewner-sandwich-mechanism
  kind: mechanism
  statement: At each step t, Frequent Directions (Algorithm 1) eigendecomposes G_bar_{t-1} + M_t, retains the top ell - 1 eigendirections deflated by the ell-th eigenvalue rho_t = lambda_ell^{(t)}, and accumulates the cumulative escaped mass rho_{1:t} = sum_{s=1}^t rho_s; Lemma 10 and Remark 11 prove that G_tilde_t = G_bar_t + rho_{1:t} I = G_t + sum_{s=1}^t rho_s N_s satisfies the two-sided Loewner sandwich G_bar_t <= G_t <= G_tilde_t.
  evidence:
  - source_id: r645-primary-pdf
    locator: Section 2 Algorithm 1, Section 4.1 Algorithm 2, and Appendix B.4.1 Lemma 10 and Remark 11, pages 2-3, 6, 19
    relation: supports
- claim_id: sketchy-shampoo-sublinear-kronecker-sketch-mechanism
  kind: mechanism
  statement: For an m x n matrix parameter X_t, Sketchy Shampoo (Algorithm 3) maintains rank-ell Frequent Directions sketches L_bar_t and R_bar_t of the exponentially weighted left and right gradient outer products G_t G_t^T and G_t^T G_t together with escaped masses rho_{1:t}^L and rho_{1:t}^R, updating X_{t+1} = X_t - eta * (L_bar_t + rho_{1:t}^L I_m)^{-1/4} G_t (R_bar_t + rho_{1:t}^R I_n)^{-1/4} in sublinear O(m ell + n ell) accumulator memory.
  evidence:
  - source_id: r645-primary-pdf
    locator: Section 3.4 Figure 1 and Section 4.2-4.3 Algorithm 3 and Observation 6, pages 5, 7
    relation: supports
- claim_id: sketchy-additive-tail-spectrum-regret-bound-scope
  kind: scope
  statement: Theorem 3 and Corollary 4 prove that without exp-concavity or low-rank curvature assumptions, S-AdaGrad achieves Regret_T <= D (sqrt(2) tr(G_T^{1/2}) + sqrt(d (d - ell) Omega_ell / 2)) using O(d ell) memory, where Omega_ell = min_{k < ell} (ell - k)^{-1} sum_{i=k+1}^d lambda_i(G_T) <= sum_{i=ell}^d lambda_i(G_T), matching full-matrix AdaGrad regret up to an additive tail-eigenvalue term.
  evidence:
  - source_id: r645-primary-pdf
    locator: Section 3.3 Table 1, Section 4.1 Theorem 3 and Corollary 4, and Appendix B.4, pages 4, 6, 19-21
    relation: supports
- claim_id: sketchy-resnet-conformer-gnn-training-application
  kind: application
  statement: With sketch rank ell = 256 (a 4x accumulator memory reduction on 1024-dimensional blocks), S-Shampoo outperforms Adam and nearly matches full Shampoo on ImageNet ResNet-50 (77.18% vs 76.76% validation accuracy) and LibriSpeech 16-layer Conformer while avoiding Shampoo's overfitting on OGBG-MolPCBA graph neural networks.
  evidence:
  - source_id: r645-primary-pdf
    locator: Section 5.1-5.2 Figures 2-3, pages 8-9
    relation: supports
- claim_id: sketchy-exponential-moving-average-and-svd-update-limitation
  kind: limitation
  statement: Applying Frequent Directions to unweighted cumulative gradient sums in deep learning causes the escaped mass rho_{1:T} to exceed ||G_T|| due to rotating eigenspaces and lack of unweighted spectral decay, requiring exponential moving average decay beta_2 < 1 and periodic rank-ell SVD updates.
  evidence:
  - source_id: r645-primary-pdf
    locator: Section 4.3 Exponentially Weighted FD and Section 6 Discussion, pages 7, 9-10
    relation: supports
