aio_no_match:
  search_scope: All 442 pinned AIO labels and scoped synonyms and 334 preceding native identities, plus
    ignored/hidden-inclusive text search in both checkouts; semantic search for reinforcement, backpropagation,
    gradients, variational inference, Bayesian/belief models, stochastic units, sigmoid functions and
    training. Ten exact AIO CLASS nodes and six complete native neighbors inspected.
  rationale: No suitable mapping for the general identity-backward surrogate rule was established in this
    bounded snapshot. A forward probability parameterization, a learned network or a broad mathematical-function
    category does not itself identify the derivative substitution.
  examined_targets:
  - target: AIO:SigmoidFunction
    rejection_reason: The sigmoid can parameterize the forward Bernoulli law, but the core backward rule
      deliberately does not use its derivative. That example component does not identify the general hard-operation
      surrogate.
  - target: AIO:HardSigmoidFunction
    rejection_reason: A piecewise-linear approximation to a sigmoid is not the binary hard threshold with
      identity backward substitution.
  - target: AIO:MathematicalFunction
    rejection_reason: The broad input-output function class does not specify a forward/backward mismatch
      or identify this estimator.
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition has a preprocessing genus and does not identify the surrogate-gradient
      rule.
  - target: AIO:DifferentiableLLM
    rejection_reason: An end-to-end differentiable language model is not a derivative estimator for hard
      stochastic units.
  - target: AIO:ReinforcementLearning
    rejection_reason: A scalar-loss surrogate can be used in many settings; it is not the learning task,
      and it does not require a score-function reward update.
  - target: AIO:ReinforcementLearningLLM
    rejection_reason: A reward-tuned language model is neither the estimator nor a required application.
  - target: AIO:BayesianNetwork
    rejection_reason: A directed conditional-dependence model is not a backward substitution rule.
  - target: AIO:DeepBeliefNetwork
    rejection_reason: The estimator does not identify this pretrained multilayer architecture.
  - target: AIO:VariationalAutoEncoder
    rejection_reason: A probabilistic latent autoencoder is an architecture, not the identity-backward
      estimator.
