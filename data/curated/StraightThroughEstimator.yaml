claims:
- claim_id: method
  kind: mechanism
  statement: Let a be the pre-threshold or pre-sigmoid activation and h the hard binary value supplied
    to downstream computation. Compute the downstream derivative dL/dh using that hard forward state.
    In the backward pass, substitute dL/dh for the gradient with respect to a, as if dh/da were one, and
    then propagate through the differentiable computation that produced a. In the paper’s Bernoulli-logistic
    setting, the intended stochastic output law is P(h=1)=sigmoid(a), as used in its proof; the identity
    backward substitution is separate from that sampling law. Multiplying dL/dh by sigmoid(a)*(1-sigmoid(a))
    gives the paper’s discussed scaled alternative, not the same backward rule. No derivative through
    the actual binary sampling decision is obtained by this substitution.
  evidence:
  - source_id: method-source
    locator: Section 4, Equation (13), PDF/printed p.7; Section 3, Equation (3), Theorem 1 and proof,
      pp.5–6; Section 5 and Figure 1, p.8
    relation: supports
- claim_id: backward-variants
  kind: scope
  statement: The source explicitly defines the core backward value as dL/dh and separately discusses multiplying
    it by the sigmoid derivative. Hard forward values are retained in either case; the two backward rules
    must not be conflated.
  evidence:
  - source_id: method-source
    locator: Section 4, Equation (13) and preceding paragraph, PDF/printed p.7
    relation: supports
- claim_id: sampling-notation
  kind: limitation
  statement: The indicator inequality in Equation (3) and the probability used in the following proof
    disagree for a general non-half sigmoid probability. The curated interpretation uses the proof’s explicit
    Bernoulli probability; this is a disclosed mathematical interpretation of the source, not a check
    of author software.
  evidence:
  - source_id: method-source
    locator: Section 3, Equation (3), PDF/printed p.5; proof leading to Equation (5), p.6
    relation: supports
