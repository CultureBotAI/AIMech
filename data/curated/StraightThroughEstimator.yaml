name: Straight-through estimator
definition: A surrogate-gradient rule that keeps a hard threshold or sampled binary output in the forward
  computation while propagating its downstream derivative backward as though the hard operation were the
  identity function.
concept_kind: mathematical_method
identity_notes: 'The core identity-backward rule is the straight-through estimator named by Bengio, Léonard
  and Courville, who attribute the preceding idea to Hinton’s 2012 lecture. The paper also discusses a
  sigmoid-derivative-scaled variant; that scaling is not part of the core identity rule. This concept
  is distinct from a score-function estimator, a fully smooth forward relaxation, and the separately curated
  straight-through Gumbel-Softmax estimator with its specific temperature-dependent softmax Jacobian.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 334 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 66 and 66 lines respectively. Match-centered excerpts from all 41 unique hit contents
  were inspected: ordinary verb reinforce in existing ant/search/pseudo-label records and calculations,
  plus neighboring Gumbel straight-through discussions and the new gradient-estimator discovery lead,
  not existing candidate records. Exact checkout counts and differences are retained in the ledger. Ten
  exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six full native neighboring
  records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- This is a biased surrogate, not the ordinary derivative of the hard threshold and not an unbiased estimator
  of the discrete expected-loss gradient. A usable downstream derivative is required; an arbitrary black-box
  discrete reward does not provide one automatically.
- The surrogate depends on the differentiable extension of the downstream loss between binary states.
  Equal values at the binary endpoints do not imply equal straight-through updates, and the source’s informal
  single-layer sign statement is not used as a universal guarantee for arbitrary differentiable losses.
- Equation (3) of the inspected paper prints the indicator U>sigmoid(a), but the subsequent proof uses
  P(h=1)=sigmoid(a). For uniform U, the printed inequality instead gives probability 1-sigmoid(a). This
  record follows the explicitly used Bernoulli law and discloses the inconsistency rather than treating
  the printed inequality as verified executable sampling code.
- Identity, sigmoid-scaled, clipped and other later straight-through rules require distinct conventions.
  A generic straight-through label does not establish that their Jacobians, bias or optimization behavior
  coincide.
- The inspected conditional-computation example motivates sparse gating; no universal speedup, accuracy
  advantage or successful convergence is asserted.
