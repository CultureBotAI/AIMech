name: Guided Genetic Algorithm
definition: The Lau–Tsang genetic-search framework that uses shared adaptive solution-feature penalties
  both to modify fitness and to construct per-chromosome gene weights that bias crossover and mutation.
concept_kind: algorithm
identity_notes: This record identifies the named Lau–Tsang GLS/genetic hybrid, not every algorithm described
  informally as guided genetic search. Later template-guided, fuzzy-guided or distributed algorithms are
  not asserted equivalent from their names. Generic GA supplies population evolution and GLS supplies
  feature penalties; GGA adds penalty-derived per-gene templates and specialized variation. It does not
  replace the population by the probability vector used in PBIL. LPGA is a problem-specific precursor,
  not an exact alias. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 307 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in worktree and main, returning 4 and 4 lines respectively. All eight text hits were prior
  discovery leads in the two checkouts, not existing candidate records. Eight exact AIO CLASS nodes with
  scoped synonyms/comments and outgoing edges and five native neighboring mechanisms were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.
limitations:
- The source initializes counters and template weights to zero but its displayed crossover and roulette
  rules divide by total weight or draw from an empty integer range when that total is zero. Neither inspected
  method supplies the fallback. A uniform fallback or pseudocount is an implementation decision requiring
  separate evidence; none is asserted here.
- The displayed mutation comparisons maximize g, whereas the article identifies the illustrated application
  as minimizing augmented cost and explicitly notes descent in footnote4. The record preserves this inconsistency
  and states objective-best selection with an explicit minimizing convention, rather than claiming the
  printed pseudocode is directly executable unchanged.
- The stagnation trigger is a heuristic, not a certificate that every possible improving gene change or
  population transition has been exhausted. The thesis’s future-work discussion states this limitation.
  Penalty updates need not escape all local traps or reach a global optimum.
- The application’s elitist replacement, finite mutation count, tie multiplicity and zero-weight handling
  do not define a unique universal implementation. Feature encoding, scaling and penalty semantics affect
  results; the reported benchmark superiority is not curated as a general guarantee.
