id: AIMech:NAdam
name: NAdam
definition: An Adam-family optimizer combining adaptive moment scaling with a Nesterov-style momentum
  update.
concept_kind: algorithm
identity_notes: The Nesterov-style combination distinguishes NAdam from Adam. Optional decoupled weight
  decay is not required for this identity.
definition_evidence:
- source_id: pytorch-docs
  locator: NAdam.__doc__, algorithm lines 214–252 and options lines 257–266
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: The documented update combines a scheduled, bias-adjusted first-moment term with a current-gradient
    term and divides the combination by a stabilized, bias-corrected second-moment scale.
  evidence:
  - source_id: pytorch-docs
    locator: NAdam.__doc__, algorithm lines 214–252 and options lines 257–266
    relation: supports
