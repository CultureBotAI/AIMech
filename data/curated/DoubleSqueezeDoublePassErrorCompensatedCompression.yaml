id: AIMech:DoubleSqueezeDoublePassErrorCompensatedCompression
name: DoubleSqueeze (Double-Pass Error-Compensated Gradient Compression)
concept_kind: algorithm
review_status: DRAFT
definition: A bidirectional communication-compressed parallel stochastic gradient descent algorithm (Tang et al. 2019, Algorithm 1) that applies error-compensated compression C(.) in both the worker-to-server push pass (v_t^{(i)} = C(g_t^{(i)} + gamma delta_{t-1}^{(i)}), delta_t^{(i)} = g_t^{(i)} + gamma delta_{t-1}^{(i)} - v_t^{(i)}) and the server-to-worker broadcast pass (v_t = C((1/n) sum_{i=1}^n v_t^{(i)} + gamma epsilon_{t-1}), epsilon_t = (1/n) sum_{i=1}^n v_t^{(i)} + gamma epsilon_{t-1} - v_t) before updating x_{t+1} = x_t - eta v_t.
identity_notes: "Distinct from unidirectional error-feedback compression methods such as Sparsified SGD with Error Memory (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression, Stich, Cordonnier, & Jaggi 2018) and EF21 (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization, Richt\xE1rik, Sokolov, & Fatkhullin 2021), which compress only worker-to-server uploads and require uncompressed server-to-worker broadcasts or all-to-all aggregation."
aliases:
- DoubleSqueeze
- Double-Pass Error-Compensated Compression for Parallel SGD
- Bidirectional Error-Compensated Distributed Stochastic Gradient Descent
