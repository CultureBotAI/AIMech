claims:
- claim_id: r416-virtual-iterate-bidirectional-error-telescoping-and-nonconvex-rate
  kind: mechanism
  statement: Defining the virtual sequence x_tilde_t = x_t - eta gamma (epsilon_{t-1} + (1/n) sum_{i=1}^n delta_{t-1}^{(i)}) yields the exact recurrence x_tilde_{t+1} = x_tilde_t - eta g_bar_t + eta (1 - gamma) (epsilon_t + delta_bar_t) (Supplementary Lemma 1), so setting gamma = 1 exactly cancels both worker-side and server-side compression errors in the virtual iterate and achieves the smooth non-convex convergence rate O(sigma / sqrt(n T) + xi^{2/3} / T^{2/3} + 1 / T) matching uncompressed parallel SGD's dominant O(1/sqrt(n T)) term (Theorem 1, Corollary 2).
  evidence:
  - source_id: r416-primary-pdf
    locator: Section 4 Theoretical Analysis (Theorem 1, Corollary 2) & Supplementary Material (Lemma 1, Proof of Theorem 1)
    relation: supports
- claim_id: r416-asymmetric-worker-vs-server-compression-noise-sensitivity
  kind: mechanism
  statement: Under bounded compression error E||C(u) - u|| <= xi / 2, the combined double-pass error satisfies xi^2 = O(xi_s^2 + xi_w^2 / n), showing that worker-side compression errors delta_t^{(i)} enjoy a 1/n averaging variance reduction across n workers whereas server-side broadcast compression error epsilon_t does not.
  evidence:
  - source_id: r416-primary-pdf
    locator: Section 3-4 Discussion of Asymmetric Compression & Supplementary Material (Remark on Worker vs. Server Error)
    relation: supports
- claim_id: r416-parameter-server-topology-and-bounded-error-memory-limitation
  kind: limitation
  statement: Requires a centralized parameter-server aggregation step to maintain the server error memory epsilon_t in R^d and assumes either bounded absolute compression error or contractive relative compression error to keep ||epsilon_t|| and ||delta_t^{(i)}|| bounded.
  evidence:
  - source_id: r416-primary-pdf
    locator: Section 4 Assumption 1 & Algorithm 1
    relation: supports
- claim_id: r416-distributed-resnet-and-cifar10-imagenet-training-application
  kind: application
  statement: Applied to distributed parameter-server training of ResNet-18 and ResNet-50 on CIFAR-10 and ImageNet with 1-bit quantization and Top-k sparsification in both communication directions.
  evidence:
  - source_id: r416-primary-pdf
    locator: Section 5 Experiments (Figures 2-5), pp. 6160-6163
    relation: supports
