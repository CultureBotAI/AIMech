id: AIMech:HyperdecoderInstanceSpecificDecoderAdapter
name: Hyperdecoder (Encoder-Conditioned Instance-Specific Decoder Adapter Hypernetwork)
concept_kind: architecture
review_status: DRAFT
definition: A parameter-efficient multi-task encoder-decoder Transformer architecture that places shared trainable parallel adapters in the frozen encoder, mean-pools the final encoder hidden states h into a two-layer ReLU MLP to form an instance embedding e = MLP(mean(h)), and feeds [e; l_i] (concatenated with a learned decoder layer embedding l_i) into a shared two-layer hypernetwork to generate unique parallel decoder adapter parameters (W_d, W_u, b_d, b_u) for every input instance and decoder layer.
identity_notes: Introduced by Hamish Ivison and Matthew E. Peters (Findings of EMNLP 2022, pp. 1715-1730, arXiv:2203.08304). Distinct from HyperFormer (Karimi Mahabadi et al., ACL/IJCNLP 2021; AIMech Round 703), which generates sequential adapters for both the encoder and decoder conditioned on learned static task embeddings (producing identical parameters for all instances within a task and requiring task IDs at inference), whereas Hyperdecoder uses non-generated shared parallel adapters in the encoder and generates instance-specific parallel adapters solely in the decoder conditioned on the encoded input text without requiring task embeddings.
aliases:
- Hyperdecoder
- Hyperdecoders
- Encoder-Conditioned Instance-Specific Decoder Adapter Hypernetwork
