claims:
- claim_id: dylora-stochastic-rank-truncation-forward-pass-mechanism
  kind: mechanism
  statement: At each training iteration, DyLoRA samples an active rank b ~ p_B(.) from a categorical distribution supported on Range[r_min, r_max], slices W_{dw downarrow b} = W_{dw}[1:b, :] in R^{b x d} and W_{up downarrow b} = W_{up}[:, 1:b] in R^{m x b}, and computes the b-truncated adapter output h = W_0 X + (alpha / b) W_{up downarrow b} W_{dw downarrow b} X to evaluate the single-rank batch loss L_{downarrow b}^{DY} without summing over all ranks.
  evidence:
  - source_id: r646-primary-pdf
    locator: Section 4 Equations (5)-(9), Algorithm 1, and Section 5.8 Table 7, pages 4-5, 9
    relation: supports
- claim_id: dylora-frozen-mode-single-row-column-update-mechanism
  kind: mechanism
  statement: In FROZEN mode (Equation 10 and Algorithm 1 lines 12-15), DyLoRA updates only the b-th row W_{dw}^b = W_{dw}[b, :] and b-th column W_{up}^b = W_{up}[:, b] corresponding to the sampled rank b while keeping lower-indexed rows and columns 1, ..., b - 1 frozen during that step, preventing optimization of higher ranks from overwriting lower-rank representations.
  evidence:
  - source_id: r646-primary-pdf
    locator: Section 4 Equation (10), Algorithm 1, and Section 5.8 Table 4, pages 5, 7-9
    relation: supports
- claim_id: dylora-rank-search-time-complexity-reduction-scope
  kind: scope
  statement: Because DyLoRA trains a single adapter supporting every rank b in {r_min, ..., r_max} in approximately the same wall-clock time as training static LoRA once at r_max (408.39s vs 399.95s on MRPC for r_max = 8), it reduces rank-selection training time by a factor of 4x to 7x compared to grid-searching static LoRA across candidate ranks.
  evidence:
  - source_id: r646-primary-pdf
    locator: Abstract, Section 5.4 Table 5, and Appendix A Time Complexity, pages 1, 8, 11-12
    relation: supports
- claim_id: dylora-roberta-glue-and-gpt2-nlg-application
  kind: application
  statement: On RoBERTa-Base across GLUE tasks and GPT-2 Medium across E2E, DART, and WebNLG generation benchmarks, a single DyLoRA model evaluated across ranks 1 through 8 substantially outperforms static LoRA at low ranks (achieving 84.22 vs 54.90 average GLUE score and 68.86 vs 3.38 E2E BLEU at Rank 1) while matching or exceeding static LoRA at Rank 8.
  evidence:
  - source_id: r646-primary-pdf
    locator: Section 5.3 Table 2, Section 5.7 Table 6, and Appendix C Table 9, pages 6, 8-9, 14
    relation: supports
- claim_id: dylora-rank-sampling-distribution-and-range-limitation
  kind: limitation
  statement: DyLoRA requires pre-specifying the maximum rank r_max and rank-sampling distribution p_B (where geometric distributions favor Rank 1 accuracy while uniform distributions favor higher-rank average accuracy), and FROZEN mode trades a modest reduction in peak accuracy for parameter-update efficiency.
  evidence:
  - source_id: r646-primary-pdf
    locator: Section 5.8 Table 4 and Section 6 Limitations, pages 7-9
    relation: supports
