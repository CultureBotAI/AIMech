id: AIMech:DyLoRADynamicSearchFreeLowRankAdaptation
name: DyLoRA (Dynamic Search-Free Low-Rank Adaptation)
concept_kind: algorithm
review_status: DRAFT
definition: A dynamic, search-free parameter-efficient low-rank adaptation algorithm for pre-trained models that orders the information content of low-rank adapter matrices across ranks b in Range[r_min, r_max] by sampling a target rank b ~ p_B(.) at each training iteration, truncating the down-projection matrix to its first b rows W_{dw downarrow b} = W_{dw}[1:b, :] and the up-projection matrix to its first b columns W_{up downarrow b} = W_{up}[:, 1:b] in the forward pass h = W_0 x + (alpha / b) W_{up downarrow b} W_{dw downarrow b} x, and updating either the b-truncated prefix or exclusively the b-th row and column (FROZEN mode).
identity_notes: Distinct from static LoRA (AIMech:LowRankAdaptation), which trains adapter matrices for a single fixed rank r and suffers severe accuracy degradation if truncated to a smaller rank b < r at inference time without retraining from scratch. Distinct from AdaLoRA (AIMech:AdaLoraAdaptiveBudgetLowRankAdaptation), which prunes singular values of SVD-parameterized adapters to a single final static budget allocation across layers rather than ordering prefix representations to support dynamic multi-rank inference from a single checkpoint. Distinct from Nested Dropout (Rippel et al., 2014), which orders vector bottleneck activations using a weighted sum of losses over all truncations rather than sampling one rank b per batch on factorized weight matrices.
aliases:
- DyLoRA
- Dynamic Low-Rank Adaptation
- Search-Free Dynamic LoRA
- Nested-Dropout Ordered Low-Rank Adapter Tuning
