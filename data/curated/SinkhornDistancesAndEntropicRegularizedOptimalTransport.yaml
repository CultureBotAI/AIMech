claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any cost matrix M in R_+^{d x d}, marginals r, c in Delta_d, and entropic regularization parameter lambda > 0, Lemma 2 proves via KKT multipliers alpha, beta that the unique minimizer P^lambda of <P, M> - (1/lambda) h(P) over U(r, c) has entries P_{ij}^lambda = u_i exp(-lambda M_{ij}) v_j for unique up-to-scalar nonnegative scaling vectors u, v >= 0, reducing optimal transport computation to Sinkhorn-Knopp alternating projections u <- r ./ (K v), v <- c ./ (K^T u) on the positive Gibbs kernel K = exp(-lambda M).
  evidence:
  - source_id: r324-primary-pdf
    locator: Section 4, Equation 2, Lemma 2, and Algorithm 1, pp. 4-6
    relation: supports
  - source_id: r324-metadata-cr
    locator: Bibliographic metadata for NeurIPS 2013 26:2292-2300
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: 'Whenever M is a metric matrix, Theorem 1 and Lemma 1 prove that the Primal-Sinkhorn divergence d_{M,alpha}(r, c) = min_{P in U_alpha(r, c)} <P, M> over the KL/mutual-information constrained polytope U_alpha(r, c) = {P in U(r, c) : KL(P || r c^T) <= alpha} is symmetric and satisfies the triangle inequality d_{M,alpha}(x, z) <= d_{M,alpha}(x, y) + d_{M,alpha}(y, z) because the conditionally glued coupling S = P diag(1/y) Q in U(x, z) satisfies the data-processing mutual-information bound I(X; Z) <= min(I(X; Y), I(Y; Z)) <= alpha.'
  evidence:
  - source_id: r324-primary-pdf
    locator: Section 3, Definition 1, Equation 1, and Theorem 1, pp. 3-4; Supplementary Material, Lemma 1 and Proof of Theorem 1, pp. 10-12
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Unlike unregularized optimal transport d_M(r, c), both d_{M,alpha}(r, r) and d_M^lambda(r, r) violate identity of indiscernibles (d_M^lambda(r, r) > 0 whenever lambda < infinity and r is not a Dirac delta, requiring indicator correction 1_{r != c} to form a true metric), and taking very large lambda to approach the unregularized LP solution causes numerical underflow in K = exp(-lambda M) and slows Sinkhorn's Hilbert-metric contraction factor.
  evidence:
  - source_id: r324-primary-pdf
    locator: Section 3, Theorem 1 and Corollary 1, pp. 3-4; Section 4, Discussion of Hilbert projective metric convergence and large lambda, pp. 5-6
    relation: supports
