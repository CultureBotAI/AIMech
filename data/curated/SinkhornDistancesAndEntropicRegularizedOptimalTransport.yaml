id: AIMech:SinkhornDistancesAndEntropicRegularizedOptimalTransport
name: Sinkhorn Distances and Entropic Regularized Optimal Transport
concept_kind: algorithm
review_status: DRAFT
definition: 'Sinkhorn Distances and Entropic Regularized Optimal Transport is a scalable optimal transport framework introduced by Cuturi (2013) that replaces the unregularized O(d^3 log d) network-simplex linear program d_M(r, c) = min_{P in U(r, c)} <P, M> over the transport polytope U(r, c) = {P in R_+^{d x d} : P 1_d = r, P^T 1_d = c} with the strictly convex entropic-regularized Dual-Sinkhorn problem d_M^lambda(r, c) = <P^lambda, M> where P^lambda = argmin_{P in U(r, c)} {<P, M> - (1/lambda) h(P)} and h(P) = -sum_{i,j} P_{ij} log P_{ij} is the Shannon entropy (Equations 2-3). By strict convexity and KKT optimality (Lemma 2), the unique optimal coupling has the diagonal-scaling form P^lambda = diag(u) K diag(v) of the Gibbs kernel K_{ij} = exp(-lambda M_{ij}), which is computed at linear convergence rate via the Sinkhorn-Knopp alternating row- and column-normalization iteration u <- r ./ (K v), v <- c ./ (K^T u) using vectorized matrix-vector multiplications in O(d^2) operations per iteration (Algorithm 1).'
identity_notes: Distinct from 1-Wasserstein discriminator critic maximization in Wasserstein GANs (AIMech:WassersteinGANAndKantorovichRubinsteinDualityCritic) and from classical combinatorial auction / network-simplex linear programming solvers. Specifically captures Cuturi's (2013) Primal-Sinkhorn entropy ball constraint U_alpha(r, c) (Definition 1 and Equation 1), the Dual-Sinkhorn entropic Lagrangian d_M^lambda(r, c) = <P^lambda, M> (Equation 2), the metric symmetry and triangle-inequality proof via conditional gluing of transport plans and strong data-processing inequality I(X; Z) <= min(I(X; Y), I(Y; Z)) (Theorem 1 and Lemma 1), the Gibbs kernel diagonal scaling characterization P^lambda = diag(u) exp(-lambda M) diag(v) (Lemma 2), and the vectorized Sinkhorn-Knopp algorithm (Algorithm 1).
aliases:
- Sinkhorn Distance
- Dual-Sinkhorn Entropic Optimal Transport
- Cuturi Lightspeed Optimal Transport via Sinkhorn-Knopp Matrix Scaling
