claims:
- claim_id: method
  kind: mechanism
  statement: For a proper target pi and a normalized proposal density h covering its support, fix c>0.
    Repeatedly draw z from h and u uniformly on (0,c h(z)) until u<pi(z). This yields a proposal y with
    density f proportional to min(pi,c h). At current state x apply independence Metropolis acceptance
    min(1,pi(y)f(x)/(pi(x)f(y))); retain x if rejected. Let C={x:pi(x)≤c h(x)}. The published acceptance
    cases are 1 when x is in C; c h(x)/pi(x) when x is outside C and y is in C; and min(1,pi(y)h(x)/(pi(x)h(y)))
    when both are outside C. Normalizing constants of f cancel. When c h dominates pi everywhere, this
    reduces to independent rejection sampling.
  evidence:
  - source_id: method-source
    locator: Sections 2.3.1, 2.3.3–2.3.4, especially Rejection sampling chains, printed pp. 1704–1707
      / PDF pp. 5–8
    relation: supports
- claim_id: earlier-report-discrepancy
  kind: scope
  statement: The inspected 1991 technical report prints pi(x)/(c h(x)) in the mixed acceptance case and
    an uncapped ratio in the both-outside case. The 1994 published Section 2.3.4 instead gives c h(x)/pi(x)
    and a minimum with one, matching the independence Metropolis ratio used in this record.
  evidence:
  - source_id: earlier-report-discrepancy
    locator: Section 2.3, Rejection Sampling Chains, printed p. 6 / PDF p. 8
    relation: supports
  - source_id: method-source
    locator: Section 2.3.4, printed p. 1707 / PDF p. 8
    relation: supports
