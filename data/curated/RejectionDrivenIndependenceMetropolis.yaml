name: Rejection-driven independence Metropolis sampling
definition: An independence Metropolis sampler whose proposals are generated by a rejection procedure
  with a fixed possibly non-dominating envelope, followed by a Metropolis correction for the resulting
  clipped proposal law.
concept_kind: algorithm
identity_notes: This is Tierney’s rejection sampling chain in Section 2.3.4. It specializes independence
  Metropolis by an inner proposal generator; it is not ordinary rejection sampling unless the envelope
  dominates everywhere. It is distinct from adaptive rejection Metropolis sampling, because h and c are
  fixed here. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 167 prior native IDs/names/aliases. Full-checkout searches in both worktrees included ignored and
  hidden files; the 15 lines in each were shared Tierney source-title references or an adaptive-rejection
  discovery lead, not matching records. Existing Gibbs, Metropolis-within-Gibbs, random-walk and independence
  Metropolis mechanisms were inspected to resolve specialization boundaries.
limitations:
- The inner proposal must have positive acceptance mass and cover the target support required for irreducibility.
  A poor choice of h or c can make either stage inefficient.
- The inner rejected trials are discarded, while rejection by the outer Metropolis test repeats the chain
  state; these two rejection events have different roles.
- A non-dominating envelope without the outer correction generally gives the clipped density rather than
  pi. Correcting it does not guarantee fast mixing.
- The inspected 1991 technical report prints the reciprocal of the mixed-case factor and omits the minimum
  with one in the final case. This record uses the visually verified 1994 published expressions, consistent
  with the general independence ratio; no separate erratum is asserted.
- Adapting h or c from chain history is outside the fixed-proposal definition and needs its own validity
  argument.
id: AIMech:RejectionDrivenIndependenceMetropolis
