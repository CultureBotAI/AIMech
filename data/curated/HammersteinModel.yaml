  relation: supports
claims:
- claim_id: static-then-linear
  kind: mechanism
  statement: Set z_t=g(u_t) and pass z through the linear dynamics, giving the zero-state response y_t=sum_{j=0}^{t-1}
    h_j*g(u_(t-j)). The nonlinearity acts on each input value before temporal mixing. Reversing these
    blocks generally changes the response; a Wiener model instead applies g to the mixed linear output.
    The family specifies the composition, not a particular nonlinear basis, fitting algorithm or neural
    implementation.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Figure 3.2 and Equations 3.11–3.14, PDF pp. 15–16 / printed pp. 12–13
    relation: supports
- claim_id: recurrence-without-inversion
  kind: mechanism
  statement: When the finite-dimensional linear block has coefficients a_i and b_j for its difference
    equation, substitution gives y_(t+n)=sum_{i=1}^n a_i*y_(t+n-i)+sum_{j=0}^n b_j*g(u_(t+n-j)). This
    construction uses the input nonlinearity directly and does not require g to be invertible. Its validity
    on the specified input domain does not imply stable trajectories, a correct fitted structure or uniquely
    recovered component parameters.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Equations 3.11–3.15 and following discussion, PDF pp. 15–16 / printed pp. 12–13
    relation: supports
- claim_id: sufficient-rank-condition-boundary
  kind: scope
  statement: A general local-realization theorem can impose stronger sufficient conditions than this special
    structure needs. The source example x_next=x+u², y=x has the exact recurrence y_next=y+u² even though
    the derivative of the input nonlinearity at zero vanishes. For inputs (1,2,-1) from zero the outputs
    after each transition are (1,5,6). Failure of that equilibrium derivative condition is therefore not
    proof that an explicit Hammerstein recurrence is unavailable.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 2, Equations 2.31–2.32, PDF p. 13 / printed p. 10; Section 3, Equations 3.15–3.18
      and discussion, PDF p. 16 / printed p. 13; curator exact calculations in research/discovery/cascade-model-boundaries.py
    relation: supports
- claim_id: internal-scale-ambiguity
  kind: limitation
  statement: Without a normalization, multiplying g by a nonzero constant c and dividing the linear operator
    L by c preserves L(g(u)) for every admissible input in the zero-state response. A c=3 finite example
    gives the same outputs. This gain exchange alone prevents unique recovery of both block scales from
    external responses; it is an algebraic boundary, not a claim that all other parameters are identifiable
    or that a particular estimator converges.
  evidence:
  - source_id: leontaritis-billings1984-part2
    locator: Section 3, Equations 3.11–3.14, PDF pp. 15–16 / printed pp. 12–13; direct curator consequence
      of the cascade equations; curator exact calculations in research/discovery/cascade-model-boundaries.py
    relation: supports
