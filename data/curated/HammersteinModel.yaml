id: AIMech:HammersteinModel
name: Hammerstein model
concept_kind: model_family
definition: A real-valued, single-input single-output, discrete-time deterministic nonlinear dynamical
  model family formed by a memoryless static nonlinearity followed by a causal linear time-invariant system.
identity_notes: 'Compared all 442 pinned AIO IDs, labels and all scoped synonyms and 532 native IDs, names
  and aliases with both candidate names, expanded cascade descriptions and IDs: no normalized identity
  match. Ignored- and hidden-inclusive full-text searches of the accessible recovery worktree and readable
  previous worktree returned four and zero lines; all four were read and concern prior discovery leads
  or a source example. Original Documents untracked files remain inaccessible and are not claimed re-audited.
  Read all 55 semantic AIO rows and 62 native name/definition neighbors, nine complete annotated AIO CLASS
  nodes with incident edges, all nine contextual generated YAMLs, and the complete IteratedWienerFilter,
  LinearStateSpaceLayer, NARX and NARMAX records. The existing iterated Wiener filter is a fixed-prior
  image-denoising algorithm. Neural linear state-space layers and NARX/NARMAX recurrences can overlap
  in representation without defining these ordered two-block model families. GLM specifies a statistical
  link/variance model; ARDL specifies lag structure; neither specifies this cascade identity. AIO convolutional
  layers and recurrent networks require neural-component/network scope, and ETS adds smoothing/trend/seasonality
  structure. These are not exact matches. This assessment is bounded to the inspected pin and accessible
  records.'
