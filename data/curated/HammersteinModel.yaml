  rationale: The source develops this ordered input-output dynamical representation for analyzing and
    identifying nonlinear systems from temporal observations. The pinned target denotes the analysis task;
    a related model/task mapping preserves that distinction and does not assert that the cascade is a
    task, neural layer or particular estimator.
limitations:
- The scoped evidence covers real-valued, single-input single-output, discrete-time deterministic cascades
  with a causal time-invariant linear block and a memoryless single-valued nonlinearity. Direct feedthrough
  is permitted. Continuous-time, multivariable, parallel and stochastic variants need explicit additional
  assumptions.
- A model family is distinct from its parameter estimator, internal-state realization, trained instance
  and physical mechanism. Noise placement, initial state, stability, excitation, identifiability and generalization
  are separate choices; no universal identification or forecasting guarantee is asserted.
- Invertibility assumptions used to derive a particular output-history recurrence are not definition-level
  requirements for a cascade model. Nonlinear and linear special cases can overlap across model families
  without making their ordered structures equivalent.
- Evidence is the fully read 1984 technical report. The final 1985 journal version and earlier correlation-based
  identification reports remain follow-up sources. Several displayed equations in the report have scope
  or transcription problems; the cited cascade definitions and directly checked algebra are used here,
  not its unchecked global claims.
- No model was trained and no empirical result was replicated. Exact finite examples are curator derivations,
  not author-reported experiments. Both records remain DRAFT; author self-review does not constitute independent
  scientific approval.
