claims:
- claim_id: r476-local-encoder-global-head-decomposition-and-adversarial-debiasing-mechanism
  kind: mechanism
  statement: Each device m maintains private lower-layer representation parameters theta_m^l and shared upper-layer parameters theta_m^g, transmitting only theta_m^g to the server in each round (Algorithm 1); when local data includes nuisance or protected attributes P_m, device m jointly trains an adversarial discriminator d_m(ell_m(X_m); phi_m) via the minimax objective min_{theta_m^l, theta_m^g} max_{phi_m} [L_m^g(theta_m^l, theta_m^g) - alpha L_m^l(theta_m^l, phi_m)], whose saddle point satisfies H(P_m | ell_m(X_m; theta_m^l)) = H(P_m) with optimal value H(Y_m | X_m) - H(P_m) (Liang et al. 2020, Section 3.3, Equations 5-7, Proposition 3, & Appendix B).
  evidence:
  - source_id: r476-primary-pdf
    locator: Section 3.2-3.3 (Algorithm 1, Equations 5-7), pp. 4-5, and Appendix B (Proposition 3, Equations 39-52), pp. 21-22
    relation: supports
- claim_id: r476-bias-variance-generalization-dominance-scope
  kind: scope
  statement: Under linear regression with cross-device task variance rho^2 and observation noise variance sigma^2 across M devices with N samples in dimension d, Theorem 2 proves that LG-FedAvg with interpolation weight alpha in [0, 1] has generalization error E_LG(f_alpha) = alpha^2 (d/N) sigma^2 + (1 - alpha)^2 ((M - 1)/M) rho^2 + (1 - alpha^2) (d / (M N)) sigma^2, and Corollary 1 establishes that alpha^* = rho^2 / (rho^2 + (d/N) sigma^2) strictly dominates both purely local learning (alpha = 1) and purely global FedAvg (alpha = 0) whenever rho^2, sigma^2 > 0 (Liang et al. 2020, Section 4, Theorem 2 & Corollary 1, Appendix A Equations 36-38).
  evidence:
  - source_id: r476-primary-pdf
    locator: Section 4 (Propositions 1-2, Theorem 2, Corollary 1), pp. 6-7, and Appendix A (Equations 13-38), pp. 17-20
    relation: supports
- claim_id: r476-heterogeneous-vision-multimodal-and-fair-federated-learning-application
  kind: application
  statement: Applied to heterogeneous rotated MNIST/CIFAR, multimodal vision-and-language VQA across modality-heterogeneous clients, and adversarial de-biasing of protected attributes on federated facial recognition (Liang et al. 2020, Section 5, Tables 1-4, Figures 2-5).
  evidence:
  - source_id: r476-primary-pdf
    locator: Section 5 (Experiments, Tables 1-4, Figures 2-5), pp. 7-10
    relation: supports
- claim_id: r476-stateful-local-encoder-requirement-for-new-devices-limitation
  kind: limitation
  statement: Because feature extractors theta_m^l are trained locally and never aggregated on the server, deploying the global head theta^g to a newly joined device requires either an ensemble of existing clients' local encoders or local labeled data to train a new local representation (Liang et al. 2020, Section 3.2 'Dealing with new devices', p. 5).
  evidence:
  - source_id: r476-primary-pdf
    locator: Section 3.2 (Dealing with new devices), p. 5
    relation: supports
