id: AIMech:LgFedAvgLocalGlobalRepresentationsFederatedLearning
name: LG-FedAvg (Local Global Federated Averaging)
concept_kind: algorithm
review_status: DRAFT
definition: A personalized and communication-efficient federated learning algorithm (Liang, Liu, Ziyin, Allen, Auerbach, Brent, Salakhutdinov, & Morency 2020, Sections 3-4, Equations 3-7 & 36-38, Algorithm 1, Theorem 2, Corollary 1) that partitions each device m's model into lower-layer local representation parameters theta_m^l (which map raw heterogeneous or multimodal inputs X_m to compact feature representations ell_m(X_m; theta_m^l)) and shared upper-layer global classifier parameters theta^g (which produce predictions y_hat = g(ell_m(X_m; theta_m^l); theta^g)), jointly updates both theta_m^l and theta_m^g locally via E epochs of stochastic gradient descent (or minimax adversarial de-biasing min_{theta_m^l, theta_m^g} max_{phi_m} L_m^g(theta_m^l, theta_m^g) - alpha L_m^l(theta_m^l, phi_m) against protected attributes P_m, Equations 5-7), and communicates only the compact upper-layer global parameters theta_m^g to the server for sample-weighted averaging theta_{t+1}^g <- sum_{m in S_t} (N_m / N) theta_m^g.
identity_notes: Distinct from FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers, Arivazhagan et al. 2019) and FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which reverse the architectural split by keeping lower feature-extraction layers global (W_B) and top classification heads private on each client; in contrast, LG-FedAvg keeps lower feature-extraction encoders theta_m^l local (allowing modality-specific or adversarially de-biased encoders) and shares only the compact top global classifier theta^g across clients.
aliases:
- LG-FedAvg
- Local Global Federated Averaging
- Federated Learning with Local and Global Representations
