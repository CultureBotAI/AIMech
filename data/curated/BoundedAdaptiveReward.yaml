claims:
- claim_id: method
  kind: mechanism
  statement: For a b-item beam at step t, compute r_t=−(1/b)·sum_i log p(word_i), using the last generated
    token probability of each beam item in its own context. Add accumulated r_t values to the sequence
    log probability up to the smaller of the candidate length and predicted length. After the cap is passed,
    no additional reward accrues, so the adjusted score cannot increase with further nonpositive log-probability
    increments. The source then permits stopping when the best current adjusted score is below the best
    completed adjusted score.
