name: Bounded adaptive reward for sequence scoring
definition: A beam-dependent sequence rescoring rule that adds per-step rewards derived from the beam’s
  mean negative log token probability, accumulating them only up to a predicted output-length cap.
concept_kind: mathematical_method
identity_notes: Yang et al.’s bounded adaptive-reward changes the reward rate with the decoding step,
  unlike fixed-r bounded word-reward. It is a beam-conditioned scoring method rather than a reinforcement-learning
  reward-training algorithm or a beam-independent probability model. No normalized identity match was
  found across the 442 AIO and 146 prior native records; both checkout text searches included ignored
  and hidden files and returned no matches for the selected exact IDs, full labels, aliases and source
  titles.
limitations:
- The reward sequence depends on the beam and model probabilities. Changing beam policy can change the
  score assigned to a completed hypothesis.
- Removing a manually tuned constant reward rate does not remove the trained translation model, length
  predictor, beam size or other implementation choices.
- The printed sum uses a predicted length as its upper limit without specifying a noninteger rounding
  policy. A discrete implementation must define the effective integer cap and EOS/token counting; the
  record does not assert an author-approved rounding convention.
- Equation (10) assumes b available beam entries and defined token log probabilities. Empty or shrunken
  beams and zero-probability tokens require an explicit policy.
- The stated stopping argument applies after reward saturation with a completed incumbent. It is limited
  to retained beam continuations, not global sequence optimality or guaranteed quality improvement.
