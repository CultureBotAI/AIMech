- target: AIO:MarkovChain
  relation: related_match
  rationale: The model extends Markov hidden-state sequencing with memory-dependent emissions and transitions.
    A Markov description requires the effective state to include auxiliary memory; the finite control
    state or observed string alone is not the pinned first-order process.
- target: AIO:ProbabilisticGraphicalModel
  relation: related_match
  rationale: The source models structured latent variables and conditional dependencies to infer hidden
    symbol pairings. The AIO target is a graphical-model task, so this is a model-to-modeling-context
    association rather than a task superclass. No neural or large-language-model identity is inferred
    from the word memory.
