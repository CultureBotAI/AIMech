claims:
- claim_id: method
  kind: mechanism
  statement: The basic model has silent start/end states, ordinary single-emission states S, and paired
    states P_n and C_n sharing a dedicated memory Z_n. On visiting P_n, emit a symbol from its state distribution
    and store that symbol in Z_n. On visiting C_n, retrieve and remove a symbol from Z_n, then emit according
    to a distribution conditioned on the retrieved symbol. After this emission, choose the C_n transition
    distribution according to whether its memory is empty. The source uses disjoint empty-memory and nonempty-memory
    destination sets, each with its own normalized row; only the row valid for the current memory is active.
    A completed valid path starts with empty memories, avoids reads from empty memory and balances each
    pair’s writes and reads. Ordinary and storage-state transitions do not depend on context in the basic
    formulation. A last-in-first-out stack with deterministic matching emissions can reproduce a prefix
    in reverse order; a first-in-first-out queue can reproduce it in the same order. Hidden control paths
    and their induced memory histories determine the probability of a symbol string, which requires summing
    over valid paths.
