id: AIMech:BPROPBootstrappedPreTrainingWithRepresentativeWordsPrediction
name: B-PROP Bootstrapped Pre-Training with Representative Words Prediction for Ad-Hoc Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: A bootstrapped self-supervised pre-training algorithm for ad-hoc document retrieval that extracts final-layer head-averaged [CLS]-token self-attention weights alpha^t = (1/h) sum_{i=1}^h alpha^t_i from a pre-trained BERT model, sums them per distinct vocabulary term in document d as beta^_{w_k} = sum_{x_t = w_k} alpha^t and applies a BM25-inspired saturation function beta_{w_k} = beta^_{w_k} / (b + beta^_{w_k}) followed by softmax normalization to obtain the contextual document term distribution P(w_k | theta_d) = exp(beta_{w_k}) / sum_{w' in V} exp(beta_{w'}), computes the collection-wide random term distribution P(w_k | theta_random) = (1/|D|) sum_{d in D} P(w_k | theta_d), derives a divergence-from-randomness contrastive term distribution P(w_k | theta_contrastive) = exp(gamma^_{w_k}) / sum_{w' in V} exp(gamma^_{w'}) from the point-wise cross-entropy gamma^_{w_k} = -P(w_k | theta_d) log2 P(w_k | theta_random), samples pairs of equal-length word sets (s_1, s_2) of length l ~ Poisson(lambda) from P(w_k | theta_contrastive), and re-trains BERT on the joint Representative Words Prediction and Masked Language Modeling objective L_total = L_ROP + L_MLM.
identity_notes: Distinct from PROP (AIMech:PROPPreTrainingWithRepresentativeWordsPrediction), which samples representative word sets from a term-independent Dirichlet-smoothed unigram language model rather than bootstrapping from BERT's saturated [CLS]-attention divergence-from-randomness contrastive distribution; and distinct from DeepCT, which trains a regression head to predict supervised term recall weights for inverted-index term weighting rather than bootstrapped pairwise ROP pre-training.
aliases:
- B-PROP
- Bootstrapped Pre-training with Representative Words Prediction
- B-PROP Contrastive Attention Term Sampling for Ad-Hoc Retrieval
