claims:
- claim_id: bprop-saturated-cls-attention-document-distribution
  kind: mechanism
  statement: To prevent high-frequency words with repeated occurrences from dominating BERT's final-layer head-averaged [CLS] attention weights alpha^t = (1/h) sum_{i=1}^h alpha^t_i (Equation 4), B-PROP aggregates attention per distinct term beta^_{w_k} = sum_{x_t = w_k} alpha^t and applies the BM25-inspired saturation function beta_{w_k} = beta^_{w_k} / (b + beta^_{w_k}) (with optimal b = 0.01) before softmax normalization P(w_k | theta_d) = exp(beta_{w_k}) / sum_{w' in V} exp(beta_{w'}) (Equation 5, Table 5).
  evidence:
  - source_id: r765-primary-pdf
    locator: Section 3.2.1 Document Term Distribution & Section 4.4 Impact of Saturation Function, Equations 4-5, Table 5, pp. 3-4, 7-8
    relation: supports
  - source_id: r765-primary-pdf
    locator: main() verification of compute_doc_term_dist with saturation parameter b=0.01
    relation: supports
- claim_id: bprop-divergence-from-randomness-contrastive-sampling
  kind: mechanism
  statement: Because vanilla BERT [CLS] attention encodes general sequence semantics and assigns high weights to common collection stopwords ('in', 'the', 'of' in Table 1), B-PROP computes the collection expectation P(w_k | theta_random) = (1/|D|) sum_{d in D} P(w_k | theta_d) (Equation 6) and defines the contrastive term distribution via cross-entropy divergence gamma^_{w_k} = -P(w_k | theta_d) log2 P(w_k | theta_random) and P(w_k | theta_contrastive) = exp(gamma^_{w_k}) / sum_{w' in V} exp(gamma^_{w'}) (Equations 7-8), promoting document-informative terms over stopwords and significantly outperforming non-contrastive attention sampling (Figure 1).
  evidence:
  - source_id: r765-primary-pdf
    locator: Section 1 Table 1, Sections 3.2.2-3.2.3 & Section 4.3, Equations 6-8, Figure 1, pp. 2, 4, 7
    relation: supports
  - source_id: r765-primary-pdf
    locator: main() verification that P_contrastive promotes topical terms ('fibrosis', 'pulmonary') above stopwords ('the', 'in')
    relation: supports
- claim_id: bprop-benchmark-adhoc-retrieval-applications
  kind: application
  statement: Across 7 ad-hoc retrieval benchmarks (MS MARCO Document Ranking, TREC 2019 DL, Robust04, ClueWeb09-B, Gov2, MQ2007, and MQ2008), B-PROP significantly outperforms BERT, Transformer_ICT, and PROP in both full-supervision and zero-/low-resource settings (Tables 3-4, Figure 3).
  evidence:
  - source_id: r765-primary-pdf
    locator: Sections 4.2 & 4.7, Tables 3-4, Figure 3, pp. 5-9
    relation: supports
  - source_id: r765-metadata-cr
    locator: BibTeX citation record for arXiv:2104.09791 (SIGIR 2021, doi:10.1145/3404835.3462869)
    relation: supports
- claim_id: bprop-saturation-sensitivity-and-overfitting-limitation
  kind: limitation
  statement: B-PROP's downstream performance is sensitive to the saturation hyperparameter b (degrading significantly at b = 0.05 or b = 0.001 compared to b = 0.01 in Table 5), requires a full forward pass of BERT over the document collection D to estimate P(w_k | theta_random), and can overfit to the pre-training corpus domain when pre-trained for too many steps (Figure 2).
  evidence:
  - source_id: r765-primary-pdf
    locator: Sections 4.4-4.5, Table 5 & Figure 2, pp. 7-8
    relation: supports
