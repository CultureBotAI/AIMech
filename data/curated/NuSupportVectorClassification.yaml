id: AIMech:NuSupportVectorClassification
name: Nu support vector classification
aliases:
- Nu-SVC
- ν-SVC
- Nu-SV classification
concept_kind: algorithm
definition: A supervised binary-classification algorithm that jointly fits a regularized kernel hyperplane
  and a nonnegative margin level, using nu to reward that level relative to linearly penalized margin
  shortfalls.
identity_notes: 'The original binary nu-SVC formulation in Scholkopf, Smola, Williamson and Bartlett (2000)
  is the selected identity. It differs from a particular decomposition solver, multiclass reduction, nu-SVR
  and the one-class estimator; source-specific equivalence to C-SVC requires fitted positive rho and parameter
  conversion. Compared all442 pinned AIO IDs, labels and scoped synonyms against all520 preceding native
  IDs, names and aliases, without a normalized collision. Full-text fixed-string whole-word searches in
  both checkouts included ignored and hidden files, expanded labels, acronyms, DOI and paper identifiers.
  Read all25 distinct matching text windows across88 locations: these are the existing one-class record
  context, its review/renderings and the preceding discovery lead, not supervised nu records. All125 semantic
  AIO rows and115 prior native name/definition rows match the previous reading; the additional one-class
  row and complete record were read. Thirty-one contextual full-record readings are retained with matching
  hashes. Absence is bounded to this snapshot and corpus.'
definition_evidence:
- source_id: scholkopf2000
  locator: Section 7, PDF pp17-21 / printed pp1223-1227, Equations 7.3-7.15
  relation: supports
claims:
- claim_id: learned-margin-objective
  kind: mechanism
  statement: For n observations with both binary labels y_i in{-1,+1} represented and a positive-semidefinite
    kernel, minimize (1/2)||w||^2-nu*rho+sum_i xi_i/n, subject to y_i*(w.Phi(x_i)+b)>=rho-xi_i, xi_i>=0
    and rho>=0. A positive feasible nu is at most2*min(n_positive,n_negative)/n, as follows directly from
    the balanced dual masses and coefficient caps. Values beyond this class-balance limit make the stated
    dual infeasible and primal unbounded. For three positive and one negative label, nu=3/4 exceeds the
    limit1/2; w=0,b=rho=t and negative slack2t give objective -t/4.
  evidence:
  - source_id: scholkopf2000
    locator: Section 7, PDF pp17-19 / printed pp1223-1225, Equations 7.3-7.12; feasibility implication
      and exact example in research/discovery/nu-svm-boundaries.py
    relation: supports
- claim_id: dual-and-decision
  kind: mechanism
  statement: The dual minimizes (1/2)*alpha^T*Y*K*Y*alpha, with0<=alpha_i<=1/n, sum_i alpha_i*y_i=0 and
    sum_i alpha_i>=nu. The score is g(x)=sum_i alpha_i*y_i*k(x_i,x)+b and the classifier takes its sign.
    The source does not specify how an exactly zero score is assigned to one binary label. When free coefficients
    exist in both classes, KKT equalities give g(x_positive)=rho and g(x_negative)=-rho and permit recovery
    of b and rho. Such free coefficients need not exist; general recovery must respect the remaining KKT
    inequalities.
  evidence:
  - source_id: scholkopf2000
    locator: Section 7, PDF pp18-19 / printed pp1224-1225, Equations 7.7-7.15
    relation: supports
- claim_id: margin-error-counts
  kind: scope
  statement: 'For an exact optimum with rho>0, sum_i alpha_i=nu. Thus nu bounds the fraction of strict
    margin errors y_i*g(x_i)<rho from above and the positive-coefficient fraction from below. A margin
    error can still be correctly classified; it is not the same event as misclassification. Finite counts
    need not equal nu, and capped coefficients can occur on the margin. Four linear-kernel inputs -1,-1,1,1
    with matching labels and nu=1/2 admit alpha_i=1/8,w=1/2,b=0,rho=1/2: all points are support vectors
    and none is a strict margin error. The source states the finite result under an analytic-kernel assumption;
    its additional asymptotic distribution and boundary-mass arguments are not promoted to unconditional
    calibration.'
  evidence:
  - source_id: scholkopf2000
    locator: Section 7 Proposition 5, PDF pp20-21 / printed pp1226-1227; exact finite certificate in research/discovery/nu-svm-boundaries.py
    relation: supports
- claim_id: c-svc-correspondence
  kind: scope
  statement: If the fitted rho is positive, dividing w,b and slacks by rho yields a C-SVC optimum with
    C=1/rho in the paper’s C/n slack-penalty convention, preserving the sign decision. The numerical conversion
    differs when software uses C times the unaveraged slack sum. A global positive multiplier on the nu-SVC
    loss terms scales the solution without changing its boundary, explaining removal of that separate
    C parameter. This does not remove kernel selection or make arbitrary C and nu settings equivalent,
    and the conversion cannot divide by rho=0.
  evidence:
  - source_id: scholkopf2000
    locator: Section 7, PDF p19 / printed p1225, homogeneity discussion; Proposition 6, PDF p21 / printed
      p1227
    relation: supports
- claim_id: degenerate-and-nonunique-offsets
  kind: limitation
  statement: 'Feasibility does not guarantee positive rho or a useful binary separator. Balanced opposite
    labels at identical zero inputs admit w=b=rho=0. Even at rho>0, b and rho can be nonunique when no
    coefficient is free: for linear-kernel inputs -1 and1 with matching labels and nu=1, both coefficients
    are1/2 and w=1, while (b,rho)=(0,1) and(3,4) attain the same objective -1/2 and classify the first
    training point differently. Strict convexity fixes the optimal normal w, not necessarily the intercept,
    margin variable or singular-Gram coefficient representation.'
  evidence:
  - source_id: scholkopf2000
    locator: Section 7, PDF pp18-21 / printed pp1224-1227, primal/dual constraints, free-coefficient formulas
      and positive-rho condition; exact certificates in research/discovery/nu-svm-boundaries.py
    relation: supports
- claim_id: generalization-and-robustness-limits
  kind: limitation
  statement: The generalization analysis adds sample-size, confidence, margin and function-class complexity
    terms to empirical margin error; test risk is not bounded by nu alone. Its displayed normalized radial-kernel
    bound omits the intercept b, and the authors explicitly note that treating b requires a modification.
    Their resistance statement is conditional on a representation using free support vectors and local
    movements in feature space parallel to w; it is not arbitrary input-space or label-noise robustness.
    External proof dependencies were not independently audited.
  evidence:
  - source_id: scholkopf2000
    locator: Section 7 Propositions 7-10, PDF pp21-24 / printed pp1227-1230, including the paragraph following
      Proposition 10
    relation: supports
- claim_id: classification-evaluation-scope
  kind: limitation
  statement: The classification study shows a two-dimensional circles-versus-disks example with a Gaussian
    kernel and nu values from0.1 to0.8, reporting support-vector and margin-error fractions plus geometric
    margins. The paper leaves real-world nu-SVC evaluation and efficient chunking methods to future work.
    It supplies no universal accuracy or runtime advantage over C-SVC, and later decomposition solvers
    are not identified with this original optimization formulation.
  evidence:
  - source_id: scholkopf2000
    locator: Section 8.2 and Table 4/Figure 11, PDF pp32 and35 / printed pp1238 and1241; Section 9, PDF
      p36 / printed p1242
    relation: supports
