claims:
- claim_id: r449-bidirectional-kl-distillation-and-feature-map-offloading-mechanism
  kind: mechanism
  statement: Reformulating federated training as constrained alternating minimization (Equations 2-10, Algorithm 1) offloads deep residual blocks W_s to the server while each edge client k trains only a lightweight feature extractor W_e^(k) and compact head W_c^(k), reducing edge training FLOPs by 9x-17x and edge parameter memory by 54x-105x relative to on-device ResNet-56/ResNet-110 training while supports asynchronous client updates.
  evidence:
  - source_id: r449-primary-pdf
    locator: Section 3 Reformulation & Bidirectional Knowledge Transfer (Equations 4-10, Table 1), pp. 3-6
    relation: supports
- claim_id: r449-per-sample-feature-map-upload-and-label-sharing-limitation
  kind: limitation
  statement: FedGKT requires each client k to transmit intermediate feature maps H_i^(k) and corresponding labels y_i to the server for its local training examples, which scales communication volume with local dataset size |D_k| and exposes intermediate activations and labels unless combined with privacy mechanisms.
  evidence:
  - source_id: r449-primary-pdf
    locator: Section 3.2 Training Pipeline (Algorithm 1) & Section 5 Discussion, pp. 5-9
    relation: supports
- claim_id: r449-edge-cnn-cifar10-cifar100-and-cinic10-application
  kind: application
  statement: Applied to edge-server federated training of ResNet-56 and ResNet-110 classifiers with compact ResNet-8 edge extractors on CIFAR-10, CIFAR-100, and CINIC-10 under IID and non-IID partitions.
  evidence:
  - source_id: r449-primary-pdf
    locator: Section 4 Experiments (Tables 1-4, Figures 3-4), pp. 6-9
    relation: supports
