id: AIMech:FedGktGroupKnowledgeTransferForEdgeFederatedLearning
name: FedGKT (Group Knowledge Transfer for Federated Learning of Large CNNs at the Edge)
concept_kind: algorithm
review_status: DRAFT
definition: An alternating-minimization federated learning and split-knowledge-transfer algorithm (He, Annavaram, & Avestimehr 2020, Section 3, Equations 2-10, Algorithm 1) that trains compact edge CNNs W^(k) = (W_e^(k), W_c^(k)) on resource-constrained clients and a high-capacity server classifier W_s by exchanging extracted hidden feature maps H_i^(k) = f_e^(k)(X_i^(k); W_e^(k)) and soft logits z_c^(k),z_s, alternating between client updates minimizing l_c = l_CE(y_i, z_c^(k)) + D_KL(p_s || p_k) (Equations 7-8) and server updates minimizing l_s = sum_k sum_i [l_CE(y_i, z_s) + D_KL(p_k || p_s)] (Equations 5-6).
identity_notes: Distinct from FedDF (AIMech:FedDfEnsembleDistillationForModelFusionInFederatedLearning, Lin et al. 2020), which transmits full client model weights to the server and performs ensemble distillation on an unlabeled server proxy dataset rather than offloading deep CNN layers to the server via uploaded client hidden feature maps and bidirectional ground-truth + KL distillation.
aliases:
- FedGKT
- Group Knowledge Transfer
- Federated Group Knowledge Transfer
