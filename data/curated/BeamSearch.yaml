name: Breadth-first beam search
definition: A heuristic search procedure that advances by depth layers, retaining at most a chosen beam
  width of the best-ranked candidate nodes for each next layer and discarding the other candidates.
concept_kind: algorithm
identity_notes: This record denotes the conventional breadth-first form of beam search. Wider historical
  uses of beam search also include global best-first frontier truncation and other heuristic pruning procedures.
  A width of one follows a single surviving continuation; it is not the unbounded global-frontier algorithm
  curated as greedy best-first search. No normalized identity match was found across the 442 AIO and 130
  prior native records; ignored-inclusive text hits in the main checkout were prior discovery leads, source
  citations and search-order contrasts, plus incidental lightbulb and wet-bulb dependency substrings,
  not existing concept records.
limitations:
- Width pruning can discard every path to a solution or every optimal path, so basic beam search has no
  general completeness or optimality guarantee.
- 'A layer-width bound does not by itself bound all memory: stored predecessor information, retained earlier
  layers, generated successors and any global duplicate table must also be accounted for.'
- Ranking, ties, goal stopping and duplicate handling are additional choices. Increasing the beam width
  does not guarantee an improvement in returned solution quality for every implementation and problem.
