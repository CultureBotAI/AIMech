claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Expand the retained nodes in the current depth layer, rank their eligible successors with
    the chosen heuristic or evaluation rule, and retain at most the beam width for the next layer. Candidates
    removed by this width rule are not systematically recovered by the basic procedure.
  evidence:
  - source_id: method-source
    locator: 'Background: Beam search, PDF p. 1; breadth-first scope on PDF p. 2'
    relation: supports
- claim_id: policy-boundaries
  kind: limitation
  statement: The comparative study distinguishes layer-limited and whole-frontier beam policies, and shows
    why duplicate handling must be specified separately. Its non-unit-cost examples challenge a universal
    claim that widening a beam always improves the returned solution.
  evidence:
  - source_id: comparison-paper
    locator: Beam Search and Closed Lists, PDF pp. 4–5; Incompleteness of Beam Search, PDF p. 5
    relation: supports
