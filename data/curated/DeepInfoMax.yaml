claims:
- claim_id: method
  kind: mechanism
  statement: Encode an input into an intermediate feature map and a global representation. Train encoder
    and critic together to score same-input feature/representation pairs above pairs formed from different
    inputs. The global objective relates an image feature map to its global code; the local objective
    averages dependence scores between local feature locations and the global code. The paper considers
    a Donsker–Varadhan KL bound, a logistic JSD proxy and an InfoNCE classification objective. For JSD,
    maximize mean_joint[−softplus(−T)]−mean_product[softplus(T)], up to constants; this is a dependence
    proxy, not a numerical KL mutual-information value. Combine global and local losses with chosen weights.
    Optional prior matching trains a separate discriminator to distinguish samples from a chosen prior
    and encoder outputs, while training the encoder to fool that discriminator. The pinned implementation
    detaches encoder outputs for discriminator training and uses a non-saturating encoder loss. Its main
    Fenchel-dual implementation averages same-image scores and masks cross-image scores separately; its
    InfoNCE branch uses finite negative logits to suppress same-image negatives.
