name: Deep InfoMax
definition: A representation-learning procedure that jointly trains an encoder and a dependence critic
  on matched versus mismatched global or local-to-global features, optionally regularizing the encoder
  output toward a chosen prior.
concept_kind: algorithm
identity_notes: Deep InfoMax (DIM) denotes Hjelm et al.’s framework, including explicitly configurable
  global/local objectives and prior matching. It is not IIC’s discrete cluster-assignment objective or
  a generic synonym for mutual information. The JSD, Donsker–Varadhan and InfoNCE options have different
  mathematical and numerical meanings. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 199 preceding native IDs/names/aliases. Ignored-inclusive word-delimited
  searches of both full checkouts found eight prior discovery/review references in each. Short acronyms
  were compared in normalized record identities; broad text searches used the full names and longer aliases.
  Nearest maintained mechanisms and seven exact AIO nodes with incident edges were inspected.
limitations:
- A bounded JSD dependence proxy is not identical to KL mutual information. The appendix’s pointwise relationship
  and sampled correlations do not establish a universal ranking equivalence between changing joint distributions.
  Finite neural critics and batches further limit estimation.
- Local/global dependence can capture nuisance information. Finite representation capacity, receptive
  fields, negative sampling and the input distribution affect which shared factors are learned; semantic
  correctness is not guaranteed.
- The pinned InfoNCE implementation replaces masked negative scores by −10 rather than excluding them
  with negative infinity. Those terms retain finite mass in its denominator; no exact equality to an ideal
  exclusion-based InfoNCE formula is asserted.
- Prior matching is an optional adversarial regularizer, not an input reconstruction decoder or a proof
  of component independence. Finite optimization need not match the requested prior exactly.
- Only declared primary passages and code ranges were inspected. No runtime environment, training, benchmark,
  mutual-information estimator accuracy or gradient implementation was independently reproduced.
