claims:
- claim_id: method
  kind: mechanism
  statement: Specify the valid hyperparameter space and its sampling distribution, independently sample
    a finite set of configurations, train/evaluate each under the chosen protocol, and select by validation
    loss. The paper initially describes uniform sampling in search coordinates, while its concrete neural-network
    and DBN spaces include categorical choices, log-domain draws and conditional architecture settings.
    Therefore uniformity in raw numerical values and independent activation of every coordinate are not
    defining requirements. More trials extend the same search distribution without requiring a Cartesian
    grid. The sampling rule does not itself prescribe equal runtime or forbid per-trial early stopping;
    the neural-network case study includes a validation-based stopping rule. Test performance is evaluated
    separately from the validation criterion used to choose a configuration.
