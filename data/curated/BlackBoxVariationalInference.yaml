claims:
- claim_id: method
  kind: mechanism
  statement: For fixed observed x and joint model p(x,z), choose a variational family q(z;lambda), sample
    z from q, and maximize L(lambda)=E_q[log p(x,z)-log q(z;lambda)] by stochastic ascent. Under the normalized-score
    and differentiation-under-expectation conditions, the raw gradient is E_q[grad_lambda log q(z;lambda)*(log
    p(x,z)-log q(z;lambda))], estimated by a Monte Carlo average. The mean-field version factors q into
    q_i(z_i;lambda_i) and uses for each factor the model log terms that depend on z_i together with -log
    q_i; unrelated terms cancel in expectation under the stated factorization. For parameter coordinate
    d in factor i, let h_d be the score and f_d be that score times the local log signal. A fixed control-variate
    coefficient gives f_d-a_d*h_d because E[h_d]=0; the population variance-minimizing coefficient is
    Cov(f_d,h_d)/Var(h_d) when these quantities exist and Var(h_d)>0. The source estimates coefficients
    from samples and averages corrected contributions before a stochastic-ascent update. Its fixed-coefficient
    expectation identity does not by itself justify arbitrary reuse of samples to estimate both the coefficient
    and corrected gradient.
