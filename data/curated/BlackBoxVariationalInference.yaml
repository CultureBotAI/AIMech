name: Black box variational inference
definition: A variational-inference procedure that estimates evidence-lower-bound gradients from samples
  of a tractable variational distribution using its score function and model log joint, with mean-field
  local signals and score control variates to manage estimator variance.
concept_kind: algorithm
identity_notes: 'This record covers Ranganath, Gerrish and Blei’s original BBVI Algorithms 1–2 and their
  score-function estimator, mean-field local signals and control variates. It is not every black-box inference
  method, a pathwise reparameterization estimator, a model architecture or an amortized recognition network
  such as NVIL. The hierarchical data-subsampling extension is outside the validated mechanism scope here.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 337 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 22 and 22 lines respectively. All 15 unique matched line contents were inspected
  in full: the preceding gradient-estimator records, their cited Bengio source, saved source-reading scopes,
  reviews and open discovery leads, not existing candidate records. Exact checkout counts and differences
  are retained in the ledger. Thirteen exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and six full native neighboring records were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- Black box still requires sampling from and evaluating the variational distribution, score derivatives
  with respect to its parameters, and evaluation of the model log joint at sampled latent states. The
  method does not require differentiation through a discrete latent sample, but support and integrability
  conditions remain necessary.
- Raw unbiasedness requires the regularity assumptions behind differentiation under the expectation and
  zero expected score. A model normalization constant independent of lambda cancels from this gradient;
  a parameter-dependent term cannot be discarded on that basis.
- A coefficient fixed independently of the gradient samples preserves expectation when the relevant moments
  exist. A coefficient estimated from those same samples can correlate with the sample score and introduce
  bias. The paper reports separate sample counts for coefficient estimation and gradient calculation,
  but the inspected description does not establish an exact sampling-independence convention; no implementation
  behavior is asserted.
- Population-optimal control-variate scaling and conditional-expectation variance reduction do not guarantee
  that estimated coefficients or every additional removal of zero-mean terms reduces finite-sample variance.
  Zero or poorly estimated score variance requires handling beyond division by the displayed ratio.
- The practical step schedule and change-in-parameters stopping rule do not establish global optimality
  or exact posterior recovery. Mean-field factorization can limit the approximation. The printed hierarchical
  subsampling formulas need a separate weighting audit and are not curated as a verified extension here.
- No benchmark result, author-code run, general convergence proof or posterior-quality certification is
  included.
