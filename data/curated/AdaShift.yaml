claims:
- claim_id: adashift-net-update-factor-bias-in-adam-lemmas-2-to-4
  kind: mechanism
  statement: Defining the net update factor of gradient g_t as k(g_t) = sum_{i=t}^inf (alpha_i / sqrt(v_i)) (1 - beta_1) beta_1^{i-t} so net(g_t) = k(g_t) g_t, Zhou et al. (ICLR 2019, Lemmas 2-4) prove that on d-periodic sequential counterexamples lim_{n->inf} v_{nd+i} = ((1 - beta_2)/(1 - beta_2^d))(C^2 - 1)beta_2^{i-1} + 1 and lim_{n->inf} k(C) = lim_{n->inf} k(g_{nd+1}) is strictly minimal across the epoch, and on i.i.d. stochastic counterexamples E[k(C)] < E[k(-1)], causing Adam to weight small wrong-direction gradients more heavily than large correct-direction gradients.
  evidence:
  - source_id: r616-primary-pdf
    locator: Section 3.1-3.3, Equations 8-12, Lemmas 2-4, and Appendices E-G, p. 3-5, 15-18
    relation: supports
  - source_id: r616-metadata-cr
    locator: Bibliographic metadata for Zhou et al. ICLR 2019
    relation: supports
- claim_id: adashift-temporal-decorrelation-theorem-5-and-fifo-window
  kind: scope
  statement: Under Theorem 5 (Equation 13), when v_t follows a stationary distribution independent of the current gradient g_t, the expected net update factor E[k(g_t)] is identical for all gradients; AdaShift enforces this independence under mini-batch sampling by popping g_{t-n} from a length-n FIFO queue Q to update v_t[i] = beta_2 v_{t-1}[i] + (1 - beta_2) phi(g_{t-n}^2[i]) while computing m_t = (sum_{j=0}^{n-1} beta_1^j g_{t-j}) / (sum_{j=0}^{n-1} beta_1^j) solely from the unpopped window {g_t, ..., g_{t-n+1}}.
  evidence:
  - source_id: r616-primary-pdf
    locator: Section 4.1-4.4, Theorem 5, Algorithm 1, Equations 13-17, and Appendix B (Algorithm 2), p. 5-7, 13
    relation: supports
- claim_id: adashift-counterexample-vision-wgan-and-nmt-applications
  kind: application
  statement: AdaShift converges rapidly in the optimal descent direction on Reddi et al.'s stochastic counterexample (where Adam diverges and AMSGrad converges slowly) and improves training loss, test accuracy, and BLEU score over Adam and AMSGrad on MNIST MLP, CIFAR-10 ResNet-18 and DenseNet-100, Tiny-ImageNet DenseNet, WGAN-GP discriminator training, and LSTM neural machine translation.
  evidence:
  - source_id: r616-primary-pdf
    locator: Section 5 (Experiments), Figures 1-7, p. 8-10
    relation: supports
- claim_id: adashift-fifo-window-memory-and-deterministic-correlation-limitation
  kind: limitation
  statement: AdaShift must store a FIFO queue Q of the latest n full gradient tensors {g_{t-i}}_{i=0}^{n-1} in memory (requiring O(n P) memory for window length n), and its temporal decorrelation guarantee relies on mini-batch gradients being statistically independent across steps t and t - n, which does not hold on deterministic sequential problems without spatial aggregation or large beta_1/beta_2.
  evidence:
  - source_id: r616-primary-pdf
    locator: Section 4.1 (p. 6), Section 5.1 (p. 8), Appendix B (Algorithm 2, p. 13), and Appendix J (p. 22-23)
    relation: supports
