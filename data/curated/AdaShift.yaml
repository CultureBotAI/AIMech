id: AIMech:AdaShift
name: AdaShift
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive learning rate optimization algorithm that eliminates the positive correlation between the second-moment scale v_t and the current gradient g_t (or first moment m_t) by maintaining a first-in-first-out window queue Q of the latest n gradients {g_{t-i}}_{i=0}^{n-1} to compute the truncated moving-average first moment m_t = (sum_{i=0}^{n-1} beta_1^i g_{t-i}) / (sum_{i=0}^{n-1} beta_1^i) while updating the adaptive scale v_t[b] = beta_2 v_{t-1}[b] + (1 - beta_2) phi(g_{t-n}^2[b]) for each parameter block b using the popped n-step temporally shifted gradient g_{t-n} and a block-wise spatial aggregation function phi (such as max).
identity_notes: Distinct from Adam and AMSGrad (which compute v_t using the contemporaneous squared gradient g_t^2, inducing positive correlation between v_t and |g_t| that biases the net update factor k(g_t) against large informative gradients). By separating the temporal support of m_t ({g_t, ..., g_{t-n+1}}) from the temporal support of v_t ({g_{t-n}, g_{t-n-1}, ...}), AdaShift makes v_t statistically independent of m_t under mini-batch independence and guarantees an unbiased expected net update factor E[k(g_t)] across all gradient magnitudes.
aliases:
- Adaptive Learning Rate Method with Temporal Shifting
- Temporally Shifted Second-Moment Decorrelated Adam
- Block-Wise Spatial-Temporal Shifted Adaptive Optimization
