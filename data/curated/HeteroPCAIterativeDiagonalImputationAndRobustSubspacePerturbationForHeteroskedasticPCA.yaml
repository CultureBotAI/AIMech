claims:
- claim_id: claim-incoherent-projection-diagonal-contraction-and-factor-two-off-diagonal-bound
  kind: mechanism
  statement: For any rank-$r$ subspace $\boldsymbol{U}\in\mathbb{O}_{p,r}$ with incoherence parameter $I(\boldsymbol{U}) = \frac{p}{r}\max_{i\in[p]}\|\boldsymbol{P}_U\boldsymbol{e}_i\|_2^2$, Lemma 1 proves that for any matrix $\boldsymbol{A}$ the diagonal operator $\boldsymbol{D}(\cdot)$ satisfies $\|\boldsymbol{D}(\boldsymbol{P}_U\boldsymbol{D}(\boldsymbol{A}))\| \le \frac{I(\boldsymbol{U})r}{p}\|\boldsymbol{D}(\boldsymbol{A})\|$ and $\|\boldsymbol{D}(\boldsymbol{P}_U\boldsymbol{A})\| \le \sqrt{\frac{I(\boldsymbol{U})r}{p}}\|\boldsymbol{A}\|$, while Lemma 4 proves that the zero-diagonal operator $\boldsymbol{\Delta}(\boldsymbol{M}) = \boldsymbol{M} - \boldsymbol{D}(\boldsymbol{M})$ satisfies the sharp extremal bound $\|\boldsymbol{\Delta}(\boldsymbol{M})\| \le 2\|\boldsymbol{M}\|$ for general matrices and $\sup_{\boldsymbol{M}=\boldsymbol{M}^\top\ne 0} \frac{\|\boldsymbol{\Delta}(\boldsymbol{M})\|}{\|\boldsymbol{M}\|} = 2 - \frac{2}{p}$ attained by $\boldsymbol{M} = \mathbf{1}_p\mathbf{1}_p^\top - \frac{p}{2}\boldsymbol{I}_p$ (Section 5, Lemmas 1 and 4).
  evidence:
  - source_id: zcw2022-heteropca-pdf
    locator: Section 5 (Lemma 1, p. 68; Lemma 4, p. 71), Supplement Proof of Lemma 4
    relation: supports
- claim_id: claim-deterministic-robust-sin-theta-theorem-independent-of-diagonal-perturbation
  kind: mechanism
  statement: Under the incoherence condition $\max\{\frac{p}{r}\max_i\|\boldsymbol{P}_U\boldsymbol{e}_i\|_2^2, \frac{q}{r}\max_j\|\boldsymbol{P}_V\boldsymbol{e}_j\|_2^2\} \le c_0$, Theorem 3 proves that HeteroPCA (Algorithm 1) run for $T$ iterations on any perturbed matrix $\boldsymbol{N} = \boldsymbol{M} + \boldsymbol{Z}$ satisfies $\max\{\|\sin\boldsymbol{\Theta}(\boldsymbol{U}^{(T)},\boldsymbol{U})\|, \|\sin\boldsymbol{\Theta}(\boldsymbol{V}^{(T)},\boldsymbol{V})\|\} \le \min\{\Gamma_T, 1\}$ where $\Gamma_t \le \frac{\|\boldsymbol{\Delta}(\boldsymbol{Z})\|}{c_1\sigma_r(\boldsymbol{M})} + 2^{-(t+3)}$, converging geometrically to exact recovery when $\boldsymbol{\Delta}(\boldsymbol{Z}) = \boldsymbol{0}$ regardless of the magnitude of the diagonal perturbation $\boldsymbol{D}(\boldsymbol{Z})$ (Section 3, Theorem 3, Section 5, Proof of Theorem 3).
  evidence:
  - source_id: zcw2022-heteropca-pdf
    locator: Section 2 (Algorithm 1, p. 57), Section 3 (Theorem 3, pp. 61-62), Section 5 (pp. 68-73)
    relation: supports
- claim_id: claim-minimax-optimal-subspace-recovery-under-heteroskedastic-spiked-covariance-and-poisson-pca
  kind: application
  statement: For the heteroskedastic spiked covariance model $\boldsymbol{Y}_k = \boldsymbol{X}_k + \boldsymbol{\varepsilon}_k$ with $\mathrm{Cov}(\boldsymbol{X}_k) = \boldsymbol{U}\boldsymbol{\Lambda}\boldsymbol{U}^\top$ and $\mathrm{Cov}(\boldsymbol{\varepsilon}_k) = \mathrm{diag}(\sigma_1^2,\dots,\sigma_p^2)$, Theorems 1 and 2 establish that HeteroPCA achieves the minimax-optimal subspace estimation rate $\mathbb{E}\|\sin\boldsymbol{\Theta}(\widehat{\boldsymbol{U}},\boldsymbol{U})\| \asymp \min\{\sqrt{\frac{p}{n}}\frac{\lambda_1^{1/2}\sigma_{\max}}{\lambda_r} + \frac{\sqrt{p}\sigma_{\mathrm{ave}}\sigma_{\max}}{\sqrt{n}\lambda_r}, 1\}$ where $\sigma_{\mathrm{ave}}^2 = \frac{1}{p}\sum_{i=1}^p \sigma_i^2$, strictly improving over standard SVD and diagonal-deletion SVD as well as extending to Poisson PCA and SVD with heteroskedastic missing data (Sections 2.2 and 4, Theorems 1, 2, 4, and 5).
  evidence:
  - source_id: zcw2022-heteropca-pdf
    locator: Section 2.2 (Theorems 1-2, pp. 58-60), Section 4 (Theorems 4-5, pp. 63-66)
    relation: supports
