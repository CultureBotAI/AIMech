claims:
- claim_id: r470-taylor-expansion-linearity-in-mashed-data-mechanism
  kind: mechanism
  statement: Proposition 1 expands the cross-client Global Mixup loss ell(f((1 - lambda) x_i + lambda x_j), (1 - lambda) y_i + lambda y_j) around lambda << 1 to first order O(lambda), yielding (1 - lambda) ell(f((1 - lambda) x_i), y_i) + lambda ell(f((1 - lambda) x_i), y_j) + lambda (partial ell / partial x)|_{(1-lambda)x_i, y_i} . x_j (Equation 4); because this expression is affine in x_j and y_j, averaging over a batch J of M instances from client j replaces individual (x_j, y_j) with their means (x_bar_j, y_bar_j) exactly up to O(lambda^2) (Yoon et al. 2021, Section 3.3, Proposition 1, Equation 5, Appendix C).
  evidence:
  - source_id: r470-primary-pdf
    locator: Section 3.3 (Proposition 1, Equations 3-5), p. 5, and Appendix C (Equations 6-8), p. 14
    relation: supports
- claim_id: r470-mafl-batch-averaging-privacy-communication-tradeoff-scope
  kind: scope
  statement: Under the Mean Augmented Federated Learning (MAFL) protocol (Algorithm 1), the batch averaging size M_k controls the privacy-utility and communication trade-off, where client k transmits n_k / M_k averaged input-label pairs (only once when local datasets are static), incurring negligible communication overhead d_i / (T p_m) relative to T rounds of p_m-parameter model exchange (Yoon et al. 2021, Sections 3.2 & 3.4).
  evidence:
  - source_id: r470-primary-pdf
    locator: Section 3.2 (Algorithm 1), p. 4, and Section 3.4, p. 6
    relation: supports
- claim_id: r470-non-iid-federated-classification-and-language-application
  kind: application
  statement: Applied to non-IID federated image classification on FEMNIST, CIFAR-10, and CIFAR-100 and embedding-space character prediction on Shakespeare under partial client participation and Dirichlet/class-shard label skew (Yoon et al. 2021, Section 4, Tables 1-7).
  evidence:
  - source_id: r470-primary-pdf
    locator: Section 4 (Experiments, Tables 1-7, Figure 2), pp. 6-9
    relation: supports
- claim_id: r470-second-order-taylor-breakdown-at-large-lambda-limitation
  kind: limitation
  statement: Because FedMix drops O(lambda^2) second-order terms in the Taylor expansion around lambda << 1 and exchanges batch-averaged inputs, choosing a large Mixup ratio lambda (e.g., lambda = 0.5) degrades approximation accuracy, and choosing a small averaging batch size M_k risks leaking information about local data distributions (Yoon et al. 2021, Section 3.4 & Section 4.2 Table 5).
  evidence:
  - source_id: r470-primary-pdf
    locator: Section 3.4, p. 6, and Section 4.2 (Table 5), p. 8
    relation: supports
