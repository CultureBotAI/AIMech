id: AIMech:FedMixApproximationOfMixupUnderMeanAugmentedFederatedLearning
name: FedMix (Approximation of Mixup under Mean Augmented Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: "A privacy-preserving federated data augmentation and optimization algorithm (Yoon, Shin, Hwang, & Yang 2021, Section 3, Proposition 1, Equations 1-5, Algorithms 1-2) operating within the Mean Augmented Federated Learning (MAFL) framework \u2014 in which each client k partitions its local dataset D_k into M_k-instance batches and exchanges only batch-averaged ('mashed') input-label pairs (x_bar_j, y_bar_j) with the server \u2014 that approximates the cross-client Global Mixup loss (1/|J|) sum_{j in J} ell(f((1 - lambda) x_i + lambda x_j), (1 - lambda) y_i + lambda y_j) around lambda << 1 via a first-order Taylor expansion in the first argument x, exploiting linearity in (x_j, y_j) so that the resulting local objective ell_FedMix = (1 - lambda) ell(f((1 - lambda) x_i), y_i) + lambda ell(f((1 - lambda) x_i), y_bar_j) + lambda (partial ell / partial x)|_{x=(1-lambda)x_i, y=y_i} . x_bar_j (Equation 5, Algorithm 2) requires only the averaged external data (x_bar_j, y_bar_j) and the local input derivative partial ell / partial x without accessing raw client instances."
identity_notes: Distinct from standard Mixup (AIMech:MixupVicinalRiskMinimizationByConvexSampleInterpolation, Zhang et al. 2018), which requires direct access to raw sample pairs (x_i, y_i) and (x_j, y_j); and distinct from NaiveMix within MAFL (Equation 1), which directly evaluates f((1 - lambda) x_i + lambda x_bar_j) on averaged inputs without the input-Jacobian correction term lambda (partial ell / partial x) . x_bar_j derived in Proposition 1.
aliases:
