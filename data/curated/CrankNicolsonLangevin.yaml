name: Crank–Nicolson Langevin sampling
definition: A Metropolis-corrected Gaussian-reference sampler that combines a Crank–Nicolson treatment
  of the reference precision with an explicit gradient drift of the remaining target potential.
concept_kind: algorithm
identity_notes: This is Cotter et al. CNL, with unpreconditioned dynamics and a precision-dependent linear
  solve. The potential gradient is of Phi relative to the Gaussian reference, not of the entire Lebesgue
  log density. It differs from CN by its gradient term and from pCNL by its preconditioning. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 167 prior native IDs/names/aliases.
  Full-checkout searches in both worktrees included ignored and hidden files; the 15 lines in each were
  shared Tierney source-title references or an adaptive-rejection discovery lead, not matching records.
  Existing Gibbs, Metropolis-within-Gibbs, random-walk and independence Metropolis mechanisms were inspected
  to resolve specialization boundaries.
limitations:
- The target must be proper relative to the Gaussian reference. The explicit density-ratio implementation
  here is finite-dimensional with symmetric positive-definite C; function-space extensions require the
  source’s operator, regularity and absolute-continuity assumptions.
- Target invariance does not imply independent draws, good exploration or finite-run accuracy. Mesh-robust
  behavior under stated assumptions is not a universal dimension-free performance guarantee.
- C and the step size are fixed in the stated kernel. Adaptive covariance or step-size policies need separate
  validity arguments.
- The reprint’s later Equation (6.2) reverses signs relative to Equation (6.1) and the explicit Section
  4 proposals. This record uses Section 4 and does not claim a published erratum or use the inconsistent
  expression.
- The gradient and forward/reverse Gaussian densities must be evaluated consistently. In infinite dimensions
  one must use the source’s measure-based acceptance under its assumptions, not a nonexistent Lebesgue
  density.
- No identity with every MALA implementation or guaranteed advantage over CN or pCN is asserted.
