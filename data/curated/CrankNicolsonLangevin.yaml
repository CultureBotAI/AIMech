claims:
- claim_id: method
  kind: mechanism
  statement: For finite-dimensional pi(u) proportional to exp(−Phi(u)) Normal(u;0,C), with fixed symmetric
    positive-definite C, assume differentiable Phi, choose delta>0 and draw w from Normal(0,C). Solve
    (2C+delta I)v=(2C−delta I)u−2 delta C grad Phi(u)+sqrt(8 delta C)w. Let q(v|u) be this Gaussian proposal.
    In finite dimensions accept with min(1,pi(v)q(u|v)/(pi(u)q(v|u))) and otherwise retain u, evaluating
    the reverse proposal at v. This is the ordinary-density specialization of the source’s general Metropolis
    construction and its rho-based CNL acceptance. The gradient changes proposal reversibility, so the
    CN likelihood-only ratio cannot simply be reused.
  evidence:
