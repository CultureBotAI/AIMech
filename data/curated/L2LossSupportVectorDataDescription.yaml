id: AIMech:L2LossSupportVectorDataDescription
name: L2-loss support vector data description
aliases:
- L2-loss SVDD
- Squared-hinge-loss support vector data description
concept_kind: algorithm
definition: A support-vector data-description algorithm that learns a feature-space sphere using squared-hinge
  penalties on squared-distance violations, yielding a unique optimal center, squared radius and slack
  vector for a fixed positive penalty and feature map.
identity_notes: 'This is the target-only L2-loss extension in Chang, Lee and Lin Section 4.1. L2 denotes
  squared slack loss, not merely the Euclidean geometry already used by standard SVDD. It changes the
  dual penalty and zero-radius threshold and is distinct from linear-slack SVDD, negative-example SVDD,
  origin-separating one-class SVM and support-vector clustering. Compared all 442 pinned AIO IDs, labels
  and scoped synonyms with all 502 preceding native IDs, names and aliases. No normalized candidate identity
  collision was found. Full fixed-string whole-word searches included ignored and hidden files in both
  checkouts, expanded names, acronyms and source identifiers. All 15 matches per checkout, eight distinct
  texts at 30 locations, were inspected as source queries, search terms and pending leads in the preceding
  discovery ledger, not existing concepts. Ten annotated AIO nodes and outgoing edges, their generated
  records, and three native neighbors were inspected or checked against unchanged complete readings. Four
  SAT Novelty-family records were inspected only for names, definitions and identity notes: those flip
  heuristics are unrelated. Absence is bounded to this pin and inspected corpus.'
definition_evidence:
- source_id: chang-revisit
  locator: Section 4.1, PDF pp.11-14, Equations 27-37 and Theorems 7-8; Appendices E-F, pp.17-20
  relation: supports
claims:
- claim_id: squared-slack-objective
  kind: mechanism
  statement: 'For C>0, minimize t+C*sum_i xi_i² subject to t>=0 and ||Phi(x_i)-a||²<=t+xi_i. Explicit
    nonnegativity constraints on xi are redundant at an optimum: a negative slack can be replaced by zero
    to improve the objective. This convex formulation has strong duality and a unique optimal center,
    squared radius and slack vector. Its squared violation penalty changes the method, even though both
    SVDD variants use squared Euclidean distances.'
  evidence:
  - source_id: chang-revisit
    locator: Section 4.1, PDF p.12, Equation 27 and Theorem 7; Appendix E, pp.17-18
    relation: supports
- claim_id: zero-radius-threshold
  kind: mechanism
  statement: First consider the zero-radius auxiliary problem minimizing sum_i ||Phi(x_i)-a||^4, with
    optimal squared distances xi_i*. When their sum is positive, define C*=1/(2*sum_i xi_i*). For 0<C<=C*,
    the optimal squared radius is zero and the auxiliary center is optimal; for C>C* the radius is positive.
    This threshold depends on the data and feature map and is not the standard SVDD threshold 1/N. The
    auxiliary center need not be the sample mean. If all training features coincide, the optimal radius
    and slacks are zero at their common feature and the denominator formula is inapplicable.
  evidence:
  - source_id: chang-revisit
    locator: Section 4.1, PDF pp.12-14, Theorem 8 and Equations 28-29, 37; Appendix F, pp.18-20
    relation: supports
- claim_id: positive-radius-dual
  kind: mechanism
  statement: For C>C*, maximize sum_i alpha_i*K_ii-alpha^T*K*alpha-sum_i alpha_i²/(4*C) subject to alpha_i>=0
    and sum_i alpha_i=1. The additional quadratic term makes the maximization objective strictly concave;
    there is no standard SVDD upper bound alpha_i<=C, though the simplex implies alpha_i<=1. Recover a=sum_i
    alpha_i*Phi(x_i), xi_i=alpha_i/(2*C), and t=||Phi(x_i)-a||²-alpha_i/(2*C) using any positive coefficient.
    This equality-simplex recovery is scoped to the positive-radius regime and must not be applied indiscriminately
    below C*.
  evidence:
  - source_id: chang-revisit
    locator: Section 4.1, PDF pp.13-14, Equations 30-36 and radius recovery
    relation: supports
- claim_id: prediction-and-evidence-limits
  kind: limitation
  statement: Prediction compares feature-space squared distance to the learned squared radius, using the
    kernel expansion when appropriate. A zero-radius fit accepts only queries mapped exactly to the center.
    The reassessment supplies mathematical derivations rather than a benchmark comparison establishing
    superiority of squared-hinge SVDD over linear-slack SVDD. Standard SVDD support-count and box-constraint
    error arguments do not transfer unchanged to this loss. For the symmetric linear-kernel sample {-2,-1,1,2},
    C*=1/20; at C=1/10 the solution has center 0, t=3/2 and objective 11/4, as verified by exact KKT and
    primal-dual calculations.
  evidence:
  - source_id: chang-revisit
    locator: Sections 3.3 and 4.1, PDF pp.11-14; Appendices E-F, pp.17-20; curator exact symmetric four-observation
      calculation
    relation: supports
