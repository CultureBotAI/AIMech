limitations:
- Kernel, preprocessing, regularization and decision-threshold conventions affect the acceptance region.
  The method does not guarantee a calibrated future outlier probability, discovery of all abnormal cases,
  or optimal cluster labels.
- The later mathematical reassessment is an author-hosted technical manuscript with conflicting author-index
  year labels. Exact URL and hash preserve inspected evidence; journal publication and version equivalence
  are not asserted.
- Exact finite calculations check mathematical edge cases. No historical implementation, training run
  or benchmark was executed.
- All 21 manuscript pages, including proofs, were visually read. The differently formatted author copy
  and implementation archive were not inspected in full. The software index alone does not verify an implementation
  of this specific L2-loss SVDD extension.
