claims:
- claim_id: claim-strict-saddle-definition-and-noisy-sgd-polynomial-escape-theorem
  kind: mechanism
  statement: For any $\beta$-smooth, $\rho$-Hessian-Lipschitz function $f:\mathbb{R}^d\to\mathbb{R}$ satisfying the $(\theta,\gamma,\zeta)$-strict saddle property (Definition 1), Theorem 6 and Lemma 9 prove that Noisy SGD $w_{t+1} = w_t - \eta(\nabla f(w_t) + \xi_t + n_t)$ with isotropic perturbation $n_t \sim \mathrm{Unif}(\mathbb{S}^{d-1})$ decreases function value by $\Omega(\eta\theta^2)$ when $\|\nabla f(w_t)\| \ge \theta$ (Lemma 7), amplifies the negative-eigenvector component at rate $(1 + \eta|\lambda_i|)^{2t}$ near any saddle point with $\lambda_{\min}(\nabla^2 f(w_0)) \le -\gamma$ to achieve $\mathbb{E}[f(w_T)] - f(w_0) \le -\eta\sigma^2/(4d)$ in $T = O(\gamma^{-1}\eta^{-1}\log d)$ steps (Lemma 9), and reaches $\|w_t - x^*\|_2 \le \epsilon$ in $O(\eta^{-2}\log(1/\delta))$ total steps with $\eta = \widetilde{O}(\epsilon^2/\mathrm{poly}(d,1/\gamma,1/\theta))$.
  evidence:
  - source_id: ghjy2015-strictsaddle-pdf
    locator: Section 3, Assumption 1, Definitions 1-2, Algorithm 1, Theorem 6, & Lemmas 7-10, pp. 5-10; Appendix B, pp. 21-30
    relation: supports
  - source_id: ghjy2015-strictsaddle-abs
    locator: Abstract
    relation: supports
- claim_id: claim-manifold-strict-saddle-property-of-deflation-free-orthogonal-tensor-cross-correlation
  kind: mechanism
  statement: 'For an orthogonal symmetric fourth-order tensor $T = \sum_{k=1}^d a_k^{\otimes 4}$, the deflation-free cross-correlation objective $\min_{\|u^{(i)}\|_2=1} \sum_{i\ne j} T(u^{(i)},u^{(i)},u^{(j)},u^{(j)})$ on $(\mathbb{S}^{d-1})^d$ (Equation 13) satisfies the manifold $(\theta,\gamma,\zeta)$-strict saddle property with $\theta = 1/(4d^{3.5}), \gamma = 1/(3d^2), \zeta = 1/(2d^{1.5})$, and $\alpha = 1$: every stationary point where two rows $u^{(i)}, u^{(j)}$ share non-tiny support exhibits a tangent direction $v\in\mathcal{T}(U)$ with quadratic curvature $v^\top M(U) v \le -1/(3d^2)$ (Lemma 44), whereas every point near a signed permutation $V$ of $\{a_1,\dots,a_d\}$ satisfies $v^\top M(V) v \ge 2\|v\|_2^2$ (Lemma 45), so Projected Noisy SGD (Algorithm 2) recovers all $d$ components simultaneously without forming $T$ explicitly (Theorems 13 and 16).'
  evidence:
  - source_id: ghjy2015-strictsaddle-pdf
    locator: Section 4.2, Equation (13) & Theorem 13, pp. 12-13; Section 5, Definition 5, Algorithm 2, & Theorem 16, pp. 14-16; Appendix D.2, Lemmas 44-45, pp. 39-44
    relation: supports
  - source_id: ghjy2015-strictsaddle-cr
    locator: COLT / PMLR Volume 40:797-842 (2015) metadata
    relation: supports
- claim_id: claim-scope-online-ica-topic-models-gmm-and-community-detection-via-fourth-order-moments
  kind: scope
  statement: Section 2 and Appendix A show that Independent Component Analysis (fourth-order cumulant $\mathbb{E}[y^{\otimes 4}] - T_{\mathcal{N}}$), Latent Dirichlet Allocation topic models, spherical Gaussian mixture models, and multi-view models admit unbiased online stochastic gradients of the fourth-order tensor objective from $O(1)$ streaming samples per step without ever storing an $O(d^4)$ or $O(d^3)$ moment tensor in memory.
  evidence:
  - source_id: ghjy2015-strictsaddle-pdf
    locator: Section 2, Equation (4), pp. 3-5; Section 4.1-4.2, Theorems 12-13, pp. 10-13; Appendix A, pp. 18-20
    relation: supports
- claim_id: claim-limitation-whitened-orthogonality-and-degenerate-higher-order-saddles
  kind: limitation
  statement: Noisy SGD's polynomial escape guarantee requires non-degenerate second-order negative curvature ($\lambda_{\min}(\nabla^2 f(x)) \le -\gamma < 0$) and fails on degenerate higher-order monkey saddles where $\nabla f(x) = 0$ and $\nabla^2 f(x) = 0$; in addition, the tensor objective (Equation 13) assumes orthonormal components $\{a_1,\dots,a_d\}$ after second-order whitening.
  evidence:
  - source_id: ghjy2015-strictsaddle-pdf
    locator: Section 1 & Section 3, Definition 1, pp. 2-6; Section 4, Equation (10), p. 11
    relation: supports
