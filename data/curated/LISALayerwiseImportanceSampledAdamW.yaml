id: AIMech:LISALayerwiseImportanceSampledAdamW
name: LISA (Layerwise Importance Sampled AdamW)
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient full-rank optimization algorithm for large language models that emulates the skewed layerwise update-norm distribution of Low-Rank Adaptation without low-rank subspace restrictions by permanently unfreezing the bottom embedding and top language-modeling head layers while periodically sampling a small fixed number gamma of intermediate Transformer layers every K iterations to update with AdamW.
identity_notes: Distinct from BAdam (AIMech:BAdamBlockCoordinateAdamFullParameterOptimization), which partitions all model layers into D blocks of equal status and updates one block per K-step epoch via cyclic or random-reshuffling block coordinate descent; LISA is grounded in the empirical skewness of layerwise weight norms w^{(ell)} = (1/T) sum_{t=1}^T ||theta_t^{(ell)}||_2 in LoRA (where embedding and LM head norms exceed intermediate layers by 10^2x), assigning importance-sampling probabilities {1.0, gamma/N_L, ..., gamma/N_L, 1.0} so E and H remain continuously active while gamma intermediate layers are sampled every K steps. Distinct from LoRA (AIMech:LoraLowRankAdaptation), which freezes base weights and constrains updates to rank-r adapter matrices across all layers.
aliases:
- LISA
- Layerwise Importance Sampled AdamW
- Layerwise Importance Sampling AdamW
- Layerwise Importance Sampling for Memory-Efficient LLM Fine-Tuning
