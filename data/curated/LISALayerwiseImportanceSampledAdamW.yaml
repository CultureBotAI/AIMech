claims:
- claim_id: lisa-skewed-weight-norm-and-importance-sampling-mechanism
  kind: mechanism
  statement: Observing that LoRA's layerwise mean weight norms w^{(ell)} = (1/T) * sum_{t=1}^T ||theta_t^{(ell)}||_2 are skewed by factors of hundreds toward the token-embedding and language-modeling head layers relative to intermediate Transformer blocks, LISA matches expected layerwise step sizes eta_t^{(ell)} = tilde_eta_t^{(ell)} * (tilde_w^{(ell)} / w^{(ell)}) in full-rank space by setting layer activation probabilities {p_ell}_{ell=1}^{N_L} = {1.0, gamma/N_L, ..., gamma/N_L, 1.0} and, every K iterations, freezing all intermediate layers except gamma randomly sampled layers that are updated alongside the embedding and head layers via AdamW.
  evidence:
  - source_id: r640-primary-pdf
    locator: Section 3.1-3.2 Figure 2 and Algorithm 1, pages 4-5
    relation: supports
- claim_id: lisa-memory-and-iteration-speedup-mechanism
  kind: mechanism
  statement: Because LISA introduces no auxiliary adapter modules, deletes redundant intermediate activations during backpropagation, and allocates gradients and AdamW states only for the embedding layer, LM head, and gamma active intermediate layers (E+H+gamma L), it reduces LLaMA-2-7B fine-tuning memory from 59 GB (full training) to 21-23 GB (fitting on a single 24 GB GPU), reduces LLaMA-2-70B memory to 71-75 GB vs 79 GB for LoRA rank 128, and achieves a 2.9x per-iteration speedup over full-parameter training (1.5x over LoRA).
  evidence:
  - source_id: r640-primary-pdf
    locator: Section 4.1 Table 1 and Figures 3-4, pages 5-6
    relation: supports
- claim_id: lisa-regularized-convex-convergence-scope
  kind: scope
  statement: Viewing AdamW on loss f(w) as randomized block-coordinate Adam on the scaled quadratic-regularized objective f^{reg}(w) = f(w) + (1/2) * w^T S w with positive semidefinite diagonal matrix S, Theorem 1 guarantees that for convex smooth f on a bounded domain with bounded stochastic gradients, LISA iterates satisfy (1/T) * sum_{t=1}^T f^{reg}(w_t) - f_*^{reg} <= O(1 / sqrt(T)).
  evidence:
  - source_id: r640-primary-pdf
    locator: Section 5 Theoretical Properties of LISA and Theorem 1, page 9
    relation: supports
- claim_id: lisa-llm-instruction-tuning-and-continual-pretraining-application
  kind: application
  statement: Across instruction tuning of TinyLlama-1.1B, Mistral-7B, LLaMA-2-7B, and LLaMA-2-70B on Alpaca-GPT4, GSM8K, and PubMedQA, and continual pre-training on 1.5B tokens of OpenWebMath, LISA outperforms LoRA by 10%-35% on MT-Bench (reaching 6.72 vs 6.10 for LoRA and 6.25 for full training on LLaMA-2-70B) and matches full-parameter continual pre-training on GSM8K at less than half the GPU memory cost (26 GB vs 59 GB).
  evidence:
  - source_id: r640-primary-pdf
    locator: Section 4.2-4.4 Tables 2-5, pages 6-8
    relation: supports
- claim_id: lisa-forward-pass-base-model-memory-and-uniform-middle-sampling-limitation
  kind: limitation
  statement: During the forward pass, LISA still requires the full pre-trained base model weights to reside in GPU memory, and its default E+H+gamma L schedule samples all intermediate layers with uniform probability gamma / N_L rather than adapting middle-layer sampling probabilities to task- or architecture-specific importance.
  evidence:
  - source_id: r640-primary-pdf
    locator: Limitations Section, page 10
    relation: supports
