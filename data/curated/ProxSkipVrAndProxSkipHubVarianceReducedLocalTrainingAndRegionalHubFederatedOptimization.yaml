id: AIMech:ProxSkipVrAndProxSkipHubVarianceReducedLocalTrainingAndRegionalHubFederatedOptimization
name: ProxSkip-VR and ProxSkip-HUB Variance-Reduced Local Training and Regional-Hub Federated Optimization
concept_kind: algorithm
review_status: DRAFT
definition: "A general variance-reduced randomized proximal-skipping framework (ProxSkip-VR) and hierarchical server-hubs-clients federated optimization method (ProxSkip-HUB / ProxSkip-LSVRG) introduced by Malinovsky, Yi, and Richt\xE1rik (2022) for composite and consensus optimization min_{x in R^d} f(x) + r(x). At each step t, ProxSkip-VR evaluates an unbiased variance-reduced gradient estimator g_t = g(x_t, y_t, xi_t) satisfying Assumption 4, takes a shift-adjusted step x_hat_{t+1} = x_t - gamma (g_t - h_t), updates the control vector y_{t+1}, evaluates the proximity operator x_{t+1} = prox_{(gamma/p) r}(x_hat_{t+1} - (gamma/p) h_t) with probability p in (0, 1] (or sets x_{t+1} = x_hat_{t+1} with probability 1 - p), and updates the gradient shift h_{t+1} = h_t + (p/gamma)(x_{t+1} - x_hat_{t+1}); ProxSkip-HUB instantiates this framework across M regional hubs, each sampling tau of m local clients and applying an unbiased omega-compressor Q_t^{ij} to client gradient differences."
identity_notes: 'Distinct from vanilla ProxSkip and SProxSkip (Mishchenko et al. 2022, which use either full batch gradients nabla f(x_t) at every local step or non-variance-reduced stochastic gradients with C > 0 that only converge to a neighborhood or require O(1/epsilon) complexity), and distinct from non-accelerated variance-reduced local methods such as S-Local-SVRG and Scaffold: ProxSkip-VR couples probabilistic prox skipping with recursive variance-reduced estimators (C = C_tilde = 0), achieving accelerated O(sqrt(L(tau)/mu) log(1/epsilon)) communication complexity while reducing total computation-plus-communication cost whenever the per-sample local computation cost delta exceeds a small threshold.'
aliases:
- ProxSkip-VR
- ProxSkip-HUB
- ProxSkip-LSVRG
- ProxSkip-QLSVRG
- Variance Reduced ProxSkip
