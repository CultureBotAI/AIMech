id: AIMech:StructurallyConstrainedRecurrentNeuralNetwork
name: Structurally constrained recurrent neural network
aliases:
- SCRN
- SCRNN
concept_kind: architecture
definition: A recurrent sequence architecture coupling a nonlinear recurrent hidden state with a separate
  linear context state whose recurrence is constrained to a scalar or diagonal decay, with context-to-hidden
  connections and no hidden-to-context feedback.
identity_notes: Compared all 442 pinned AIO and 572 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 7, 0, 0 lines. The current matches were inspected
  as the preceding IRNN report’s SCRN source/lead notes and one semantic-search expression, not an existing
  maintained record. The semantic search covers 47 AIO rows and 128 native definitions; preceding 44 AIO
  and118 native rows were verified unchanged and the additional three activation-function rows plus ten
  native definitions read. Sigmoid-based belief networks, diagonal state-space models and unrelated diagonal
  clustering/representation objectives do not match this coupled recurrent architecture. Four full annotated
  AIO node/edge/generated contexts and four full adjacent native records were inspected. RecurrentNeuralNetwork
  is the broader architecture category and SigmoidFunction is a related component. SimpleRNNLayer lacks
  this coupled context structure; EchoStateNetwork’s sparse recurrent/output-learning definition does
  not establish equivalence or a superclass relation for jointly learned fast/input/context-output parameters.
  Unlike IRNN initialization, SCRN retains structural zero and diagonal context blocks. Fixed and adaptive
  per-unit decay configurations are preserved within the record, as are current-versus-lagged context
  conventions.
definition_evidence:
- source_id: mikolov2015
  locator: Section 2.2, Figure 1 and Equations 4–8, printed/PDF pp. 2–5
  relation: supports
claims:
- claim_id: linear-context-and-fast-state
  kind: mechanism
  statement: For the fixed-decay paper formulation, s_t=(1-alpha)*B*x_t+alpha*s_(t-1), with 0<alpha<1;
    its nonlinear state is h_t=sigma(P*s_t+A*x_t+R*h_(t-1)), and output probabilities are obtained from
    softmax(U*h_t+V*s_t). The context update has no activation nonlinearity and no feedback from h. The
    fast-state recurrent matrix R is learned without imposing the same diagonal decay constraint. These
    are the paper equations; the pinned implementation uses a lagged context input to h.
  evidence:
  - source_id: mikolov2015
    locator: Section 2.2, Equations 4–6, p. 4
    relation: supports
  - source_id: authorgraph
    locator: mfactory.lua lines 150–221, especially 191–199
    relation: supports
- claim_id: persistent-structure-and-adaptive-variant
  kind: scope
  statement: The zero hidden-to-context block and diagonal context recurrence are structural restrictions,
    rather than a dense matrix initialized near identity and then freely trained. The paper also proposes
    Q=diag(sigmoid(beta_j)) in place of alpha*I, with s_t=(I-Q)*B*x_t+Q*s_(t-1). In ideal real arithmetic
    finite beta gives per-unit decays in (0,1); these are learned parameters shared over time, not input-dependent
    LSTM-style gates. The fixed and adaptive context forms remain configurations of this architecture.
  evidence:
  - source_id: mikolov2015
    locator: Section 2.2, alternative interpretation and adaptive context, Equations 7–8, pp. 4–5
    relation: supports
- claim_id: trace-memory-and-boundaries
  kind: mechanism
  statement: For fixed scalar alpha, the linear context expands to alpha^t*s_0+(1-alpha)*sum from j=1
    to t of alpha^(t-j)*B*x_j. Its direct carry derivative over k steps is alpha^k*I, which tends to zero
    for 0<alpha<1; slower forgetting does not mean permanent gradient preservation. This is a recency-weighted
    summary and is not generally invariant to permuting tokens. With uniformly bounded embedded inputs
    the scalar-decay context stays bounded by the larger of the initial-state and input norm bounds, but
    this does not bound the fast-state Jacobian or establish stability of the whole trained system.
  evidence:
  - source_id: mikolov2015
    locator: Section 2.2, Equation 4 and exponential trace discussion, p. 4; finite memory limitation
      in conclusion, pp. 7–8; curator expansion
    relation: supports
- claim_id: current-versus-lagged-context
  kind: scope
  statement: Equation 5 feeds current s_t to the fast state, but mfactory.lua feeds prev_hid_slow even
    though its nearby comment describes current c_t. A simultaneous transition using the paper Equation
    7 block [R,P;0,alpha*I] also feeds the previous context. Substituting Equation 4 into Equation 5 instead
    gives the effective recurrent coupling alpha*P and effective input matrix A+(1-alpha)*P*B. These formulations
    can be reparameterized for nonzero alpha, but are not identical with unchanged raw parameters, initialization
    or optimization. The record preserves the paper and pinned-code conventions separately.
  evidence:
  - source_id: mikolov2015
    locator: Equations 4–7 and alternative interpretation, p. 4
    relation: supports
  - source_id: authorgraph
    locator: mfactory.lua comment lines 164–166 versus graph lines 191–199; curator substitution
    relation: supports
- claim_id: pinned-fixed-context-implementation
  kind: mechanism
  statement: In the inspected fresh code setup, util.initSCRNN initializes the slow recurrent matrix to
    (1-semb_scale)*I with zero off-diagonal entries. The builder scales the slow input embedding by semb_scale,
    and SCRNN.zeroSomeGradients zeroes the slow recurrent weight gradient before the parameter update.
    The shown SGD or momentum update, starting with the zero momentum buffer created by SCRNN, therefore
    preserves this slow matrix under that path. This static reading does not certify arbitrary loaded
    optimizer state, external mutation, library behavior or an implementation of the paper adaptive-Q
    variant.
  evidence:
  - source_id: authorgraph
    locator: mfactory.lua lines 171–201
    relation: supports
  - source_id: authorinit
    locator: util.lua orthInit and initSCRNN
    relation: supports
  - source_id: authortrain
    locator: scrnn.lua lines 120–134 and 320–338
    relation: supports
  - source_id: authorupdate
    locator: rnn.lua lines 247–255
    relation: supports
- claim_id: evaluation-and-finite-memory
  kind: limitation
  statement: The paper evaluates language modeling on Penn Treebank and Text8 under selected hidden/context
    sizes, output parameterizations, backpropagation horizons and learning-rate choices. Text8 performance
    uses the reported development split, and context-weight learning helps some capacity settings more
    than others. The authors explicitly acknowledge limits of finite-capacity recurrent memory. These
    comparisons do not establish universal superiority to LSTM, arbitrary-length exact storage, or equivalence
    between the paper and historical code training runs. No numerical benchmark or independent reproduction
    is asserted.
  evidence:
  - source_id: mikolov2015
    locator: Section 3 and Tables 1–4, pp. 5–7; conclusion, pp. 7–8
    relation: supports
