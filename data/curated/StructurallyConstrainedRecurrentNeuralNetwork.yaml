aio_mappings:
- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: The architecture is a recurrent sequence network with a constrained linear context subsystem;
    the target is the broader recurrent architecture category.
- target: AIO:SigmoidFunction
  relation: related_match
  rationale: The paper names a sigmoid fast-state operation and the author graph uses nn.Sigmoid. The
    architecture is related to its activation function, not a subclass of that mathematical function.
limitations:
- Paper current-context equations and pinned previous-context code are kept distinct. Their parameter
  transformation does not imply identical initialization, optimization or empirical results.
- The slow-context structural constraint does not constrain the learned fast recurrent matrix in the same
  way. A decaying trace is not an unlimited exact memory or unconditional gradient guarantee.
- The paper prints a sigmoid expression with a positive exponential sign while calling it sigmoid; the
  author graph uses nn.Sigmoid. This record names the operation without importing a theorem from that
  printed scalar formula.
- The adaptive per-unit decay is a paper variant; the inspected fixed-context code path is not presented
  as its implementation. Static preservation reasoning assumes the stated fresh initialization and update
  path.
- All nine paper pages and six selected author files were read completely; only lines 230–285 of rnn.lua
  were read. No full repository/dependency audit, Torch execution, training or benchmark replication was
  performed.
- The source evaluations use specific capacities, splits and training choices. No current best performance,
  unconditional LSTM advantage or independent scientific approval is asserted.
