aio_no_match:
  search_scope: All 442 pinned AIO CLASS identities and scoped synonyms, all 265 preceding maintained
    identities, ignored/hidden checkout text, and semantic inspection of seven AIO targets plus neighboring
    configuration/resource-allocation methods.
  rationale: No inspected AIO target captures this general algorithm-configuration procedure or a defining
    component. The local algorithm remains supported by its primary source; this is a bounded mapping
    assessment, not absence from all ontologies.
  examined_targets:
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition concerns preprocessing/training of machine-learning models.
      This method configures target algorithms generally; an optional use for model tuning does not establish
      a training-strategy identity or necessary relation.
  - target: AIO:MachineLearningTask
    rejection_reason: The target is a broad process for building methods that learn from data. Configuring
      an arbitrary solver over instances need not build such a learning method; shared use of observations
      does not justify equivalence or subclassing.
  - target: AIO:MetaLearning
    rejection_reason: The pinned task learns from metadata about machine-learning experiments. These methods
      require no collection of ML experiments or learned cross-task prior; solver configuration alone
      is not that identity.
  - target: AIO:ActiveLearning
    rejection_reason: The pinned task queries labels for data points. Choosing configuration evaluations
      or instance runs is not label acquisition in that defined sense.
  - target: AIO:ReinforcementLearning
    rejection_reason: Exploration and empirical feedback do not by themselves establish the pinned learning-task
      identity; no reward-learning agent or policy-learning component is required by these configurators.
  - target: AIO:RandomForest
    rejection_reason: These methods contain no defining decision-tree ensemble surrogate; random sampling,
      randomized local search and rank tests are not random forests.
  - target: AIO:EvaluationBias
    rejection_reason: This is a bias concept, not a configuration algorithm. Potential overfitting or
      distribution mismatch is a limitation rather than an identity mapping.
