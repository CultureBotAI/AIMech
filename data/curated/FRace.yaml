claims:
- claim_id: method
  kind: mechanism
  statement: Start with a finite set of candidate configurations and draw a sequence of training instances
    independently from the selected instance distribution. At each racing step, evaluate every surviving
    candidate on the same new instance and append its observed solution cost. Rank surviving candidates
    by cost within each accumulated instance block, using average ranks for ties. Apply the paper’s Friedman
    aggregate rank statistic to the accumulated blocks. If its null is not rejected, retain all survivors;
    if rejected, compare each candidate with the best-ranked one using the stated post-hoc rank-difference
    test and discard candidates found worse. Repeat with the reduced candidate set until one remains or
    the prescribed total computation budget stops further evaluation.
