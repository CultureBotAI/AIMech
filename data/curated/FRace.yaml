name: F-Race
definition: A statistical racing method for configuring metaheuristics that evaluates a finite candidate
  set on shared problem-instance blocks and eliminates candidates judged worse through a Friedman rank
  test followed by comparisons with the best-ranked candidate.
concept_kind: algorithm
identity_notes: This record covers the original 2002 F-Race method. It uses a fixed starting candidate
  pool and nested survivor sets, not iterative resampling of configurations as in later iterated racing
  methods. It differs from ROAR’s challenger-incumbent heuristic comparisons, fixed-fraction successive
  halving and a standalone Friedman test without sequential resource allocation. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 265 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 20 lines in the worktree and 25 in main. These were prior candidate leads, source references,
  neighboring-method mentions and five unrelated ROAR namespace entries in ignored dependencies, not existing
  records for these identities. Seven exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring
  native mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The method assumes independent instance blocks and appropriate within-block comparability. The aggregate
  test uses an approximate chi-square reference distribution, followed by the paper’s Student-t-based
  pairwise rule. No implementation-level small-sample correction or sequential family-wise error guarantee
  was verified.
- Rank comparisons discard cost magnitudes. Better rank sums need not identify the lowest arithmetic mean
  cost, so the method is not asserted to certify the minimizer of the expected-cost objective stated in
  Section2. Repeated significance decisions and early elimination do not ensure that the best configuration
  survives.
- A finite initial candidate pool limits what can be selected, and the time budget can expire with multiple
  survivors. The inspected method does not establish a unique returned configuration in every such case.
  No general superiority over parametric racing methods or replicated TSP result is claimed.
