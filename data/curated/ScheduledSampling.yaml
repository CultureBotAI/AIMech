aio_mappings:
- target: AIO:CurriculumLearning
  relation: related_match
  rationale: The source explicitly presents a curriculum that changes reference-feedback probability during
    training. The pinned class describes ordering examples from simple to complex, whereas this procedure
    changes how feedback is selected. A related mapping preserves that training-strategy association without
    asserting exact identity or an is-a edge under the narrower pinned wording.
limitations:
- The record describes Bengio et al2015 and the original omitted decision-gradient convention. Differentiable,
  confidence-based or later sampling variants require separate evidence and identity assessment.
- A sampled model prefix can be paired with an original reference continuation that is no longer appropriate
  for that prefix. The procedure does not query a new expert target for every visited model state.
- The conditional mixture result fixes the first-token sampler to the true marginal, uses positive-support
  two-token data and separately adjustable conditionals. It does not certify the dynamics of a shared-parameter
  neural optimizer, arbitrary schedules, argmax replacements or longer sequences.
- The source critique’s broader perceptual-quality and generalized-adversarial proposals are not adopted
  here. Its displayed reformulations are not needed beyond the directly checked expected two-token criterion.
- All eighteen cited PDF pages were read. Constructed finite probability calculations were executed without
  fitting; no author code, model training, paid service or benchmark replication was run.
