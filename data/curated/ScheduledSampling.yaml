claims:
- claim_id: mixed-prefix-training
  kind: mechanism
  statement: At each training prediction, use the current mixed prefix to form the model conditional,
    score the actual reference target, and choose whether the output fed to the next prediction is the
    reference token or a model-produced token. The original experiments flip a coin for each token with
    reference probability epsilon_i at training iteration i. The model alternative may be sampled from
    the conditional or selected by argmax. The target in the loss remains the reference; this is not simply
    training the model to imitate its own sampled target.
  evidence:
  - source_id: bengio2015
    locator: Section2.4, PDF/printed pp.3–4; Figures1–2 and decision-gradient convention, p.4
    relation: supports
- claim_id: schedule-and-endpoints
  kind: scope
  statement: The all-reference choice epsilon=1 reproduces ordinary true-prefix training, whereas epsilon=0
    uses generated feedback. The source proposes decreasing schedules, including a linear decay with a
    floor, exponential decay and an inverse-sigmoid form. These are configurable curricula rather than
    one mandatory formula or an assertion that every practical schedule starts exactly at one or reaches
    zero. The paper reports poor results for some tasks when generated feedback is used from the start;
    the all-generated endpoint is not an automatic optimization improvement.
  evidence:
  - source_id: bengio2015
    locator: Section2.4, PDF/printed pp.3–4; Figures1–2 and decision-gradient convention, p.4
    relation: supports
  - source_id: bengio2015
    locator: Always Sampling comparisons in Sections4.1–4.3, PDF pp.5–8
    relation: supports
- claim_id: decision-gradient-convention
  kind: mechanism
  statement: In the reported experiments, gradients pass through the recurrent computations and losses
    but not through the discrete sampled-token decision. A model-dependent sampling distribution contributes
    additional terms if one differentiates its full expected loss; those terms must not be silently attributed
    to the reported update. The paper leaves differentiation through selection decisions to future work.
    A differentiable relaxation or a score-function estimator therefore needs its own algorithm and objective
    specification.
  evidence:
  - source_id: bengio2015
    locator: Section2.4, PDF/printed pp.3–4; Figures1–2 and decision-gradient convention, p.4
    relation: supports
  - source_id: bengio2015
    locator: Section5 Conclusion, PDF/printed p.8
    relation: supports
- claim_id: two-token-consistency-boundary
  kind: limitation
  statement: The primary critique analyzes an idealized two-token sampled-prefix criterion. For a fixed
    first-token model equal to the true marginal P1, reference probability epsilon makes the conditional
    target at a supplied prefix z equal to epsilon*P(y|z)+(1-epsilon)*P2(y). With separately adjustable
    second-token conditionals, this mixture need not equal the true conditional when the tokens are dependent.
    At epsilon=0 it becomes independent of z. This is a bounded consistency counterexample, not a claim
    that every finite neural training run converges to that distribution.
  evidence:
  - source_id: huszar2015
    locator: Sections4–4.1, especially the two-symbol formulation and Equation6, PDF/printed pp.3–5; curator
      direct expected-loss calculation
    relation: supports
- claim_id: constructed-dependent-example
  kind: scope
  statement: In a constructed binary example with joint masses P(0,0)=P(1,1)=9/20 and P(0,1)=P(1,0)=1/20,
    both marginals are uniform. Holding the first-token sampler at that marginal, epsilon=1/2 gives optimal
    second-token probabilities P_model(1|0)=3/10 and P_model(1|1)=7/10 for the mixed-input conditional
    loss, instead of the true 1/10 and 9/10. Its conditional cross-entropy is lower at the mixed target
    than at the true conditional, and the partial gradients at the truth are nonzero. The calculation
    fixes the sampler and does not equate a stopped-decision neural update with the full derivative through
    a changing sampler.
  evidence:
  - source_id: huszar2015
    locator: Section4.1 two-token criterion, Equation6, PDF/printed p.4; independently constructed finite
      enumeration in the discovery calculation
    relation: supports
- claim_id: reported-experiment-scope
  kind: scope
  statement: The original paper reports selected image-captioning, parsing and speech comparisons under
    particular capacities, schedules and evaluation settings. All-generated training fails to learn correct
    tree structure in the reported parsing condition. Speech next-step frame error uses supplied previous
    labels on validation data, while free-decoding frame error uses beam search on test data; these are
    not interchangeable measurements or general word-recognition scores. Reported benefits and the idealized
    consistency critique concern different questions and do not establish either universal superiority
    or universal empirical failure.
  evidence:
  - source_id: bengio2015
    locator: Sections4.1–4.3 and Tables1–3, PDF/printed pp.5–8; Section5, p.8
    relation: supports
  - source_id: huszar2015
    locator: Discussion of finite-training empirical success after the consistency analysis, PDF/printed
      p.5
    relation: supports
