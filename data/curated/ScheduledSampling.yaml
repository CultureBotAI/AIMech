id: AIMech:ScheduledSampling
name: Scheduled sampling
aliases: []
concept_kind: algorithm
definition: An autoregressive sequence-training procedure that chooses between reference and model-produced
  previous outputs as feedback, using a schedule that progressively reduces the probability of reference
  feedback.
identity_notes: Compared all 442 pinned AIO and 583 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 56, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 77 AIO and 173 native definitions, with unchanged preceding rows
  verified and new matches read. 4 full annotated AIO node/edge/generated contexts and 3 full native records
  were inspected. Matches are the teacher-forcing record, its source and review context, and a pending
  nested lead. Scheduled sampling mixes supplied-reference and model-produced feedback under a changing
  probability; full teacher forcing is its all-reference endpoint, not an alias for the mixed procedure.
  BPTT computes derivatives and Mean Teacher averages model parameters for consistency, so neither supplies
  this identity. The source calls the schedule a curriculum, while pinned CurriculumLearning emphasizes
  simpler-to-harder example ordering; related_match preserves the association without asserting exact
  equivalence or a broader-class identity under that narrower definition.
