id: AIMech:PageProbabilisticGradientEstimatorForNonconvexOptimization
name: PAGE (Probabilistic Gradient Estimator) for Non-Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: 'A single-loop (loopless) variance-reduced stochastic optimization algorithm and probabilistic gradient estimator (Li, Bao, Zhang, & Richtarik 2021) for non-convex finite-sum and online minimization min_x f(x) = (1/n) sum_{i=1}^n f_i(x) that updates iterates via x^{t+1} = x^t - eta * g^t and constructs the gradient estimator g^{t+1} by a Bernoulli coin flip with probability p_t in (0, 1]: with probability p_t it computes a fresh minibatch SGD gradient (1/b) sum_{i in I} nabla f_i(x^{t+1}) of size |I| = b, and with probability 1 - p_t it reuses the previous estimator with a small-minibatch SARAH/SPIDER recursive correction g^t + (1/b'') sum_{i in I''} (nabla f_i(x^{t+1}) - nabla f_i(x^t)) of size |I''| = b'' << b, achieving optimal non-convex gradient complexity O(n + n^{1/2} * varepsilon^{-2}) (and O(b + b^{1/2} * varepsilon^{-2}) with b = Theta(sigma^2 / varepsilon^2) in the online setting) using a large constant step size eta = 1 / (2L) when p_t = b'' / (b + b'') and b'' = n^{1/2}.'
identity_notes: Distinct from double-loop recursive gradient methods SARAH (Nguyen et al. 2017, AIMech:SARAHStochasticRecursiveGradientForFiniteSumOptimization), SPIDER (Fang et al. 2018, AIMech:SPIDERStochasticPathIntegratedDifferentialEstimatorForNonConvexOptimization), and SpiderBoost (Wang et al. 2019, Round 376), which reset the gradient estimator at deterministic epoch boundaries mod(k, q) = 0; from L-SVRG / Loopless Katyusha (Kovalev et al. 2020, AIMech:LooplessSVRGAndLooplessKatyushaStochasticOptimization, which uses a loopless coin flip to update an anchor point w^t in the SVRG control-variate estimator nabla f_i(x^t) - nabla f_i(w^t) + nabla f(w^t) rather than switching between a fresh minibatch gradient and a recursive path-integrated step); and from STORM (Cutkosky & Orabona 2019, AIMech:StormStochasticRecursiveMomentumForNonconvexOptimization, which blends both terms at every step via deterministic weight a_t rather than a probabilistic two-branch estimator with unequal minibatch sizes b and b').
