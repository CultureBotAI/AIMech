claims:
- claim_id: r374-claim-page-variance-recursion-and-lyapunov-descent
  kind: mechanism
  statement: Under average L-smoothness E_i||nabla f_i(x) - nabla f_i(y)||_2^2 <= L^2 ||x - y||_2^2 (Assumption 2), the PAGE estimator (Equation 3) satisfies the one-step conditional variance recursion E[||g^{t+1} - nabla f(x^{t+1})||_2^2 | F_t] <= (1 - p_t) ||g^t - nabla f(x^t)||_2^2 + ((1 - p_t) L^2 / b') ||x^{t+1} - x^t||_2^2 + p_t * I(b < n) * sigma^2 / b (Lemmas 3-4); combining this with the exact gradient descent identity f(x^{t+1}) <= f(x^t) - (eta/2) ||nabla f(x^t)||_2^2 - (1/(2*eta) - L/2) ||x^{t+1} - x^t||_2^2 + (eta/2) ||g^t - nabla f(x^t)||_2^2 (Lemma 2) yields strict decrease of the Lyapunov potential Phi_t = f(x^t) - f^* + (eta / (2 * p_t)) ||g^t - nabla f(x^t)||_2^2 whenever eta <= 1 / (L * (1 + ((1 - p_t) / (p_t * b'))^{1/2})).
  evidence:
  - source_id: r374-primary-pdf
    locator: Section 3-4, Equation (3), Theorems 1 and 3; Appendix A, Lemmas 2, 3, and 4
    relation: supports
- claim_id: r374-claim-optimal-nonconvex-and-pl-linear-convergence
  kind: mechanism
  statement: Setting p_t = b' / (b + b') with b = n (finite-sum) or b = ceil(2*sigma^2 / varepsilon^2) (online) and any b' in [1, b^{1/2}] gives (1 - p_t)/(p_t * b') = b / b'^2, allowing step size eta = 1 / (L * (1 + b^{1/2}/b')) (= 1/(2L) when b' = b^{1/2}) and expected per-step gradient cost p_t * b + (1 - p_t) * b' <= 2*b', finding E||nabla f(xhat_T)||_2 <= varepsilon in O(b + b^{1/2} * L * Delta_0 / varepsilon^2) = O(min(n + n^{1/2}/varepsilon^2, sigma^2/varepsilon^2 + sigma/varepsilon^3)) stochastic gradient evaluations, matching the Carmon et al. / Fang et al. / Arjevani et al. lower bounds (Theorems 1-4, Corollaries 1-4); furthermore, under the mu-Polyak-Lojasiewicz condition 1/2 * ||nabla f(x)||_2^2 >= mu * (f(x) - f^*), PAGE automatically switches to linear convergence O((b + b^{1/2} * L / mu) * log(1/varepsilon)) without restarting an outer loop (Theorem 5, Corollary 5).
  evidence:
  - source_id: r374-primary-pdf
    locator: Section 1, Table 1; Section 4, Theorems 1-5, Corollaries 1-5; Appendix A.2 and Appendix B
    relation: supports
- claim_id: r374-claim-unifies-sgd-gd-and-loopless-sarah-spider
  kind: application
  statement: PAGE continuously interpolates between pure minibatch SGD (recovered at p_t = 1 with b < n), full-batch gradient descent (recovered at p_t = 1 with b = n), and loopless variance-reduced recursive gradient descent (for p_t = b'/(b+b')), and empirically outperforms SGD, SVRG, SCSG, and SPIDER on non-convex neural network training on MNIST and CIFAR-10.
  evidence:
  - source_id: r374-primary-pdf
    locator: Section 3.1, Special Cases; Section 5, Experiments, Figures 1-2
    relation: supports
