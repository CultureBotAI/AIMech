claims:
- claim_id: search-procedure
  kind: mechanism
  statement: For a node with static value f and stored value V, initialize each child from its static
    value unless V exceeds f, in which case use the maximum of V and the child’s static value. Recurse
    into the child with the smallest stored value using the smaller of the inherited bound and the next-best
    sibling value. Back up the returned value, reorder the children and switch subtrees when an alternative
    becomes preferable.
  evidence:
  - source_id: method-source
    locator: Full Recursive Best-First Search, printed p. 535 / PDF p. 3; Theoretical Results, printed
      p. 536 / PDF p. 4
    relation: supports
- claim_id: later-corroboration
