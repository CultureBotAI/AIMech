id: AIMech:FedSagePlusSubgraphFederatedLearningWithMissingNeighborGeneration
name: FedSage+ (Subgraph Federated Learning with Missing Neighbor Generation)
concept_kind: algorithm
review_status: DRAFT
definition: FedSage+ is a subgraph federated learning algorithm for collaborative node classification across M data owners holding disjoint local subgraphs G_i = {V_i, E_i, X_i} with missing cross-subgraph links that trains a local missing neighbor generator NeighGen_i = {H_i^e, dGen_i, fGen_i} on simulated impaired subgraphs G_bar_i alongside cross-subgraph closest-node feature reconstruction gradients from other data owners D_j (j != i), mends each local subgraph G_i into G'_i with synthetic missing neighbors, and collaboratively trains a shared K-layer GraphSage classifier F(phi) via FedAvg on the mended subgraphs.
identity_notes: Introduced by Ke Zhang, Carl Yang, Xiaoxiao Li, Lichao Sun, and Siu-Ming Yiu in 'Subgraph Federated Learning with Missing Neighbor Generation' (NeurIPS 2021, pages 6671-6682; arXiv:2106.13430). Distinct from vanilla FedSage (Section 3.2 of the same paper), which applies FedAvg directly to GraphSage on unmended subgraphs without missing neighbor generation; distinct from LocSage+, which trains NeighGen and GraphSage purely locally without cross-subgraph gradient feedback (alpha = 0 in Eq. 6); and distinct from GCFL+ (Xie et al. NeurIPS 2021), which clusters clients for graph-level classification rather than mending cut cross-subgraph edges for node classification.
aliases:
- FedSage+
- FedSage Plus
- Subgraph Federated Learning with Missing Neighbor Generation
