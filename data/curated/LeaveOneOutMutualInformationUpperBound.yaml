name: Leave-one-out mutual information upper bound
definition: An expectation-level upper bound on mutual information that compares a known conditional density
  for each paired sample with a mixture of conditional densities from the other independent inputs in
  its batch.
concept_kind: mathematical_method
identity_notes: 'This is the leave-one-out upper bound in Poole et al., distinct from InfoNCE’s lower
  bound and from generic leave-one-out cross-validation. It requires evaluable normalized p(y|x), which
  may be the encoder defining the modeled joint distribution; an arbitrary learned critic does not supply
  that requirement. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 208 preceding native IDs/names/aliases. Word-delimited fixed-string searches of both full checkouts,
  including ignored and hidden files, returned 57 lines each: existing MINE-f component discussion, shared
  primary-source references, and discovery/review context. Four native neighbors and seven exact AIO nodes
  with scoped synonyms and outgoing relations were inspected.'
limitations:
- The conditional must be normalized and evaluable for cross-sample inputs. Treating an uncalibrated score
  as p(y|x) invalidates the stated derivation.
- For small batches or sharply separated conditional supports, the leave-one-out mixture can be tiny or
  zero where the held-out conditional is positive, producing a loose or infinite upper bound.
- Independence of batch examples is part of the proof. Correlated samples or using the held-out input
  to construct its own denominator require a different argument.
- The expected bound does not certify a realized finite-sample number. Optimization of a noisy estimate
  does not guarantee monotonic true information reduction or convergence. No encoder implementation or
  benchmark was reproduced.
