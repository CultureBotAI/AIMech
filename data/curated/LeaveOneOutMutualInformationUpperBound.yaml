claims:
- claim_id: method
  kind: mechanism
  statement: Draw K>=2 independent pairs (X_i,Y_i) from p(x)p(y|x), with evaluable normalized conditional
    density p(y|x). For each i form q_-i(y)=(K−1)^−1 sum_(j!=i) p(y|X_j). Then I(X;Y)<=E[K^−1 sum_i log(p(Y_i|X_i)/q_-i(Y_i))],
    assuming the expectations are well-defined. The mixture q_-i is independent of the held-out pair because
    it uses only the other inputs. Conditional on those inputs, the gap of the corresponding variational
    upper bound is KL(p(Y)||q_-i(Y)), a nonnegative quantity. Including the paired input in this denominator
    instead gives the known-conditional InfoNCE lower-bound construction, so the exclusion is essential.
    A finite batch computes an estimator of the upper-bound expectation rather than a guaranteed upper
    bound on its own.
  evidence:
  - source_id: method-source
    locator: Section 2.5, PDF p. 5, Equations (12)–(13), Leave one out upper bound; Section 2.1 p. 2,
      Equation (1), variational upper-bound identity
    relation: supports
