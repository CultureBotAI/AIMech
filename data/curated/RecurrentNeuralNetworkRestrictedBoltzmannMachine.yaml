claims:
- claim_id: method
  kind: mechanism
  statement: In the displayed binary model, let r_t=sigmoid(F v_t+B r_(t-1)+c) be the deterministic recurrent
    state. Set visible bias a_t=a+A r_(t-1) and hidden bias d_t=d+D r_(t-1). With hidden-by-visible weights
    W, define p(v_t,h_t|r_(t-1)) proportional to exp(a_t^T v_t+d_t^T h_t+h_t^T W v_t), and marginalize
    binary h_t for the frame distribution. The visible-sequence probability is the product of these conditional
    frame distributions; the current frame updates r_t only after its probability has been evaluated from
    r_(t-1). Recurrent and RBM hidden widths may differ, and W is distinct from recurrent input weights
    F. Train using conditional RBM likelihood statistics, approximated in the paper by data-started finite
    contrastive divergence, and backpropagate bias-gradient signals through A, D and the recurrence. The
    reverse state signal includes A^T and D^T times next-frame bias gradients, plus B^T times the next
    recurrent preactivation gradient. Generation alternates conditional frame sampling with the deterministic
    state update.
