name: RNN-RBM
definition: A neural sequence architecture in which a deterministic recurrent network with its own hidden
  state supplies parameters of a conditional RBM that models each next visible vector.
concept_kind: architecture
identity_notes: 'This is the RNN-RBM architecture introduced by Boulanger-Lewandowski, Bengio and Vincent,
  with recurrent hidden units distinct from the RBM’s stochastic hidden variables. Their displayed single-layer
  construction changes visible and hidden biases while sharing the RBM interaction weights across time.
  The broader parameter-emitting formulation and particular pretraining strategies are not all required
  features of that specialization. RTRBM ties recurrent state computation to RBM hidden probabilities;
  untying those parameters is a defining distinction here. All 442 pinned AIO labels/scoped synonyms and
  364 preceding native IDs/names/aliases were compared, with no normalized identity match. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main, returning 129 lines
  each. All 91 unique matched contents were read, including 58 initial contents and 33 additional saved-review
  contents: prior model contrasts, evidence references and discovery leads, rather than existing candidate
  identities. All 52 semantic label/synonym hits and 22 exact annotated AIO nodes were inspected, alongside
  corresponding generated records and four complete native neighbors. Previously read contextual files
  were checked for byte identity. Absence is bounded to this snapshot and inspected neighborhood.'
limitations:
- Equation (1) prints negative terms in the joint exponent that conflict with the positive-bias sigmoid
  conditionals (2)–(3) and free energy (4). Equations (14)–(15) also print negative hidden-bias signs.
  This record follows the mutually consistent conditionals and free energy, disclosing the conflicts rather
  than asserting author-code behavior.
- Under the column-vector convention of Equation (11), reverse state propagation requires transposed recurrent
  and bias-projection matrices. Printed Equation (19) omits those transposes; unequal recurrent and RBM
  hidden widths make the dimensional issue explicit. Original finite calculations check the stated convention
  and exact small-model gradients, not the authors’ implementation.
- Fully observed frames determine the recurrent state, but conditional RBM normalization and equilibrium
  sampling remain generally expensive. Finite CD and finite Gibbs generation are approximate; exact state
  inference is not exact likelihood learning.
- The worked model emits two bias vectors, not every RBM weight. A more general recurrent parameter-emission
  scheme is mentioned separately. Gaussian outputs, different recurrent cells and pretraining choices
  require their own stated conventions.
- RNN-RBM reduces to the paper’s RTRBM parameterization under matching hidden widths and appropriate weight/bias
  tying; this does not make the independently parameterized family identical to RTRBM. No global optimization,
  long-range memory or empirical ranking guarantee is asserted.
