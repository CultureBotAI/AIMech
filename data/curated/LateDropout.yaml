claims:
- claim_id: delayed-onset-rule
  kind: mechanism
  statement: The schedule leaves dropout inactive during the initial training phase and introduces it
    at a selected cutoff while model fitting continues. The 2023 study uses a constant late-phase stochastic-depth
    rate after the onset. The 2017 paper’s Switch-Curriculum comparison already describes the same no-dropout-then-dropout
    phase ordering for neuron masking; it is retained here as a precursor configuration rather than a
    duplicate concept with a separate ID.
  evidence:
  - source_id: liu2023earlylate
    locator: Figure 2, PDF p. 2; Section 4, p. 5; Section 5.3, p. 8
    relation: supports
  - source_id: morerio2017curriculum
    locator: Section 3, PDF p. 4/printed 3547; Section 5, p. 8/printed 3551
    relation: supports
- claim_id: onset-versus-smooth-curriculum
  kind: scope
  statement: A delayed step from no suppression to a selected dropout rate differs from Curriculum Dropout’s
    gradual increase in suppression. In the 2017 Switch-Curriculum experiment, dropout starts at one of
    three selected epochs on Double MNIST. Its abrupt insertion can change the objective and transient
    behavior; that source’s adverse observations do not establish that every delayed schedule is inferior
    under other architectures and training recipes.
  evidence:
  - source_id: morerio2017curriculum
    locator: Section 3, PDF p. 4/printed 3547; Figure 4, p. 7/printed 3550; Section 5, p. 8/printed 3551
    relation: supports
- claim_id: timing-and-mask-granularity
  kind: scope
  statement: The 2023 paper uses dropout as a term that can include stochastic depth. Its principal late
    experiments disable stochastic depth for the first 50 epochs, then use a constant rate selected from
    the standard stochastic-depth baseline. This temporal rule does not make residual-block masking identical
    to neuron masking, prescribe identical rates across depth or establish an inference-scaling convention
    for all implementations.
  evidence:
  - source_id: liu2023earlylate
    locator: Section 2, PDF p. 3; Section 5.3, p. 8; Appendix A, p. 13
    relation: supports
- claim_id: phase-order-boundary
  kind: limitation
  statement: 'Early and late dropout reverse which phase contains stochastic masks. Equal numbers of masked
    and unmasked steps do not guarantee equal optimization trajectories: even simple expected-gradient
    update maps can fail to commute when their order is reversed. This boundary is independent of any
    claim that one schedule has universally better accuracy.'
  evidence:
  - source_id: liu2023earlylate
    locator: Figure 2, PDF p. 2; Section 4, p. 5; separate curator affine-map calculation
    relation: supports
- claim_id: finite-vision-evidence
  kind: limitation
  statement: The 2023 late-schedule study evaluates configured supervised vision models and reports dependence
    on onset, rate and architecture. It did not find a significantly improved setting for ConvNeXt-B or
    Swin-B in the reported search, and some tested rates or onset times worsened the result. Its results
    and the earlier Switch-Curriculum comparisons therefore do not establish universal generalization
    gains, a universally optimal cutoff or superiority over smooth schedules.
  evidence:
  - source_id: liu2023earlylate
    locator: Section 5.3, PDF p. 8; Appendix B and Figures 15–16, p. 14; Appendix G, p. 16
    relation: supports
