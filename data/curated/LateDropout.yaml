limitations:
- The stable local identity covers the delayed-onset schedule described as late dropout in 2023 and the
  neuron-masking Switch-Curriculum configuration described in 2017. It does not claim priority for the
  later name or identical masks and experimental protocols across sources.
- Generic dropout, smooth Curriculum Dropout, Early Dropout and the original depth-dependent stochastic-depth
  procedure have distinct scopes. Layer-depth probability schedules and temporal onset are separate choices.
- The onset does not terminate training or permanently prune units. Reversing the order of equally many
  masked and unmasked steps does not preserve optimization in general.
- All sixteen PMLR pages and nine primary ICCV pages were visually inspected. Author implementations and
  alternate full-text versions were not inspected. No model fitting, hardware measurements or empirical
  replication were executed.
