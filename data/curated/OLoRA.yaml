claims:
- claim_id: olora-low-rank-subspace-orthogonality-regularization
  kind: mechanism
  statement: For each incoming task t, O-LoRA freezes the LoRA parameters {(A_i, B_i)}_{i < t} of previous tasks and regularizes the current task's subspace basis A_t in R^{d x r} via L_orth(A_i, A_t) = sum_{j,k} (A_i^T A_t)[j,k]^2, driving A_i^T A_t -> 0 without storing historical training examples or full-model gradient vectors.
  evidence:
  - source_id: r669-primary-pdf
    locator: Section 3.2 (Continual Learning in Orthogonal Subspaces), p. 4, Equations (3)-(8)
    relation: supports
- claim_id: olora-task-id-free-additive-weight-merging
  kind: mechanism
  statement: Because all task adapters operate additively on the shared query and value projections, O-LoRA merges completed task updates into the pretrained weights via W_init := W_init + sum_{i=1}^t A_i B_i, enabling task-ID-free inference and preventing GPU memory inflation across task streams.
  evidence:
  - source_id: r669-primary-pdf
    locator: Section 3.2 & Table 1, p. 4, Equation (9)
    relation: supports
- claim_id: olora-application-continual-nlp-and-unseen-task-generalization
  kind: application
  statement: On 5-task and 15-task continual learning benchmarks with T5-large and LLaMA-7B, O-LoRA outperforms rehearsal-free and replay baselines (including EWC, LwF, L2P, and LFPT5) while preserving zero-shot generalization on 57 unseen MMLU tasks.
  evidence:
  - source_id: r669-primary-pdf
    locator: Section 4 (Experiments), Tables 2-4 & Figures 3-4, pp. 5-8
    relation: supports
- claim_id: olora-limitation-finite-ambient-dimension-and-training-task-boundaries
  kind: limitation
  statement: Because at most floor(d / r) mutually orthogonal rank-r subspaces can exist in R^d, O-LoRA's strict orthogonality capacity saturates when the number of sequential tasks T satisfies T r > d, and the training procedure still requires explicit task boundaries to instantiate and freeze per-task LoRA modules.
  evidence:
  - source_id: r669-primary-pdf
    locator: Section 6 (Limitations), p. 9
    relation: supports
