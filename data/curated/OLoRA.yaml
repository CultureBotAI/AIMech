id: AIMech:OLoRA
name: O-LoRA
concept_kind: algorithm
review_status: DRAFT
definition: A rehearsal-free continual learning algorithm for pretrained language models that allocates a low-rank adapter pair (A_t, B_t) for each sequential task t while freezing prior adapters {(A_i, B_i)}_{i < t} and penalizing the squared Frobenius inner product ||A_i^T A_t||_F^2 so that new task updates occur in a subspace orthogonal to previously learned task subspaces.
identity_notes: Distinct from AIMech:LowRankAdaptation (LoRA), which adapts a model to a single static task and suffers catastrophic forgetting when sequentially updated across multiple tasks, and from Orthogonal Gradient Descent (OGD), which requires storing explicit historical data gradients across all model parameters. O-LoRA (Xiao Wang, Tianze Chen, Qiming Ge, Han Xia, Rong Bao, Rui Zheng, Qi Zhang, Tao Gui, and Xuanjing Huang, Findings of EMNLP 2023, arXiv:2310.14152) treats the column space U_i = span(a_i^1, ..., a_i^r) of each past task's frozen LoRA factor A_i in R^{d x r} as a parameter-efficient proxy for that task's gradient subspace. When learning task t on dataset D_t, O-LoRA optimizes sum_{(x,y) in D_t} log p_Theta(y | x) + lambda_1 sum_{i=1}^{t-1} L_orth(A_i, A_t), where O_{i,t} = A_i^T A_t in R^{r x r} and L_orth(A_i, A_t) = sum_{j,k} ||O_{i,t}[j, k]||^2. At inference time (or periodically during training), all learned adapters are summed into the base weights W_init := W_init + sum_{i=1}^t A_i B_i without requiring task IDs or replay buffers.
aliases:
- Orthogonal Low-Rank Adaptation
- O-LoRA Continual Subspace Learning
- Orthogonal Subspace Low-Rank Adaptation
