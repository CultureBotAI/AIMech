limitations:
- The penalty is on successive norm differences, not full state differences or a hard state-norm constraint.
  The selected initial state and sequence reduction affect its value.
- The squared absolute penalty is sensitive to activation scaling. Its zero set does not by itself determine
  a fixed radius or constrain all Jacobian directions.
- The stated direct derivative assumes a nonzero interior state; zero-norm and automatic-differentiation
  conventions require a specified implementation.
- Hidden-state versus memory-cell choices and output-tanh conventions differ across the inspected experiments;
  no single architecture or training recipe is implied.
- The complete nine-page v7 paper was visually read. No author code, framework dependencies, training
  or numerical benchmark reproduction was performed.
- Reported improvements and long-horizon behavior are conditional. The source also documents delayed rather
  than eliminated explosions and unfavorable regularizer combinations; no universal guarantee or independent
  approval is claimed.
