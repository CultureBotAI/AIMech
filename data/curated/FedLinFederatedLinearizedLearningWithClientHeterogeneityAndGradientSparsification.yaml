id: AIMech:FedLinFederatedLinearizedLearningWithClientHeterogeneityAndGradientSparsification
name: FedLin (Federated Linearized Learning with Client Heterogeneity and Gradient Sparsification)
concept_kind: algorithm
review_status: DRAFT
definition: A federated optimization algorithm (Mitra et al. 2021, Section 3, Algorithm 1, Equation 8; Section 4, Algorithms 2-3) that resolves the speed-accuracy conflict under simultaneous objective and systems heterogeneity (variable local steps tau_i >= 1) by updating each client i via the fresh-gradient linearized correction x_{i,l+1}^{(t)} = x_{i,l}^{(t)} - eta_i (nabla f_i(x_{i,l}^{(t)}) - nabla f_i(bar_x_t) + g_t) with client-specific step-size eta_i = bar_eta / tau_i and current global gradient g_t = (1/m) sum_{i=1}^m nabla f_i(bar_x_t) (or error-compensated TOP-k sparsified gradients in Algorithms 2-3).
identity_notes: Distinct from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, Karimireddy et al. 2020), which uses stale control variates c_i from round t-1 that violate the exact single-step fixed-point property at x^* and lacks client- inversely scaled step-sizes eta_i = bar_eta / tau_i for arbitrary systems heterogeneity, and from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization) and FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization), which Propositions 1-2 prove converge to distorted surrogate objectives under constant step-sizes.
aliases:
- FedLin
- Federated Linearized Learning
- FedLin with Server and Client Gradient Sparsification
