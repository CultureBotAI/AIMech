  relation: related_match
  rationale: Compresses deep Transformer neural networks by progressive stochastic substitution of multi-layer predecessor modules with compact successor modules.
- target: AIO:Distillation
  relation: related_match
  rationale: Transfers module-level functional behavior from a large frozen predecessor network to a compact successor network through curriculum hybrid forward passes without auxiliary distillation losses.
limitations:
- Each successor module scc_i must share identical input and output tensor dimensions with its replaced predecessor module prd_i at every module boundary.
- Task-specific compression requires executing the two-stage progressive replacement and successor fine-tuning procedure for each target downstream task.
