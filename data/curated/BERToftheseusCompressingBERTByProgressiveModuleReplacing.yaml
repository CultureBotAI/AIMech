claims:
- claim_id: r805-claim-stochastic-module-replacement-dynamics
  kind: mechanism
  statement: Given a frozen predecessor P partitioned into n multi-layer modules {prd_1, ..., prd_n} and a successor S of n single-layer modules {scc_1, ..., scc_n}, BERT-of-Theseus samples independent binary indicators r_{i+1} ~ Bernoulli(p_d) at each module boundary i and computes y_{i+1} = r_{i+1} * scc_i(y_i) + (1 - r_{i+1}) * prd_i(y_i) (Eqs. 2-3), updating only successor parameters via backpropagation of the pure task cross-entropy loss L = CrossEntropy(y_hat, y) (Eq. 4) before a second successor-only fine-tuning phase (Eq. 5).
  evidence:
  - source_id: r805-primary-pdf
    locator: Section 2.1 (Workflow of Theseus Compression), Equations 1-5 & Figure 1, Pages 2-3
    relation: supports
  - source_id: r805-primary-pdf
    locator: module_step and enumerate_hybrid_expectation over 2^6=64 hybrid paths in main()
    relation: supports
- claim_id: r805-claim-curriculum-schedule-and-lr-warmup-equivalence
  kind: mechanism
  statement: To bridge the transition from hybrid module replacement to standalone successor inference, BERT-of-Theseus applies a linear curriculum replacement scheduler p_d(t) = min(1, k*t + b) (Eq. 6) with slope k > 0 and base probability b in (0, 1); in expectation over Bernoulli sampling, this curriculum scales the effective learning rate of each successor module as lr'(t) = min(1, k*t + b) * lr (Eq. 7), acting as an implicit module-level learning-rate warmup.
  evidence:
  - source_id: r805-primary-pdf
    locator: Section 2.2 (Curriculum Replacement) & Section 2.3 (A Unified View of Dropout, Warmup and Curriculum Replacement), Equations 6-7, Pages 3-4
    relation: supports
  - source_id: r805-primary-pdf
    locator: replacement_prob and effective learning rate warmup verification in main()
    relation: supports
- claim_id: r805-claim-glue-compression-performance
  kind: application
  statement: Compressing a 12-layer BERT-base predecessor into a 6-layer successor (1.94x inference speedup, 66M parameters), BERT-of-Theseus achieves a 78.6 macro-average score on the GLUE test benchmark, retaining 98.3% of the BERT-base teacher's performance and outperforming task-specific Vanilla KD (76.4), BERT-PKD (77.0), and pre-training DistilBERT (76.2 on the matched 8-task GLUE set).
  evidence:
  - source_id: r805-primary-pdf
    locator: Section 3.3 (Experimental Results), Table 1 & Table 2, Pages 4-5
    relation: supports
- claim_id: r805-claim-inter-module-dimension-matching-limitation
  kind: limitation
  statement: Because each successor module scc_i must be a drop-in functional replacement for the corresponding predecessor module prd_i within the same forward pass, the input and output hidden dimensions of scc_i and prd_i must match at every module boundary, preventing arbitrary hidden-width reduction without additional adapter projections.
  evidence:
  - source_id: r805-primary-pdf
    locator: Section 2.1 (Workflow of Theseus Compression, Equations 2-3), Page 2
    relation: supports
