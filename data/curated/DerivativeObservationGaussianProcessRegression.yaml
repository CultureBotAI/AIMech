limitations:
- This record scopes direct Gaussian conditioning on derivative values, including noisy estimates, with
  function values. Virtual derivative signs with EP, finite-difference pseudo-observation augmentation,
  a separately fitted GP for every gradient component, and particular nonlinear controllers are separate
  constructions. No universal gradient-enhanced-kriging alias is assigned.
- The latent kernel must support the required mean-square derivatives. Gaussian conditional formulas assume
  a valid covariance and specified error model; nonsmooth kernels, correlated errors treated as independent,
  ill-conditioning and duplicate constraints need appropriate handling. Smooth latent integrability is
  not a proof of dynamical stability, controllability or globally accurate identification.
- Local-linearization compression needs a justified local approximation and error covariance. Equations
  7–9 give a particular regularized fit and covariance estimate; they do not establish exact uncertainty
  for every prior scaling or every regularized estimator. Correlation within coefficient blocks and with
  any retained original data matters. Local equilibrium models alone do not identify general off-equilibrium
  dynamics.
- At fixed Gaussian hyperparameters, adding observations cannot increase conditional covariance, but refitting
  hyperparameters changes the comparison. The source’s near-equivalence of 150 raw observations and a
  summary is a particular illustration, not a sufficiency theorem or universal accuracy/computational
  gain. The general cubic dense-system cost uses the total value and derivative observation count.
- The source’s two-nearby-values equivalence and zero-derivative mean wording are qualified by explicit
  curator calculations. The nonlinear demonstration’s output-time indexing and noise notation need resolution
  before any exact numerical reproduction. No benchmark, dynamical simulation, fitted GP or author implementation
  was executed; the record remains DRAFT after author self-review.
