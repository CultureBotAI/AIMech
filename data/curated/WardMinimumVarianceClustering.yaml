limitations:
- The common Ward method is scoped here to the Euclidean ESS specialization. The broader 1963 objective-function
  framework, generalized weighted variants and arbitrary dissimilarity recurrences are not exact aliases.
  Ward1/Ward2 terminology requires the cited paper’s input and height conventions.
- Minimum variance denotes a merge criterion, not a guarantee of globally optimal partitions or recovery
  of true classes. With a specified tie order, values 1,2,3,4,6 yield two groups with ESS 5 while another
  partition has ESS 4. Different tied merges can yield different later trees.
- The source uses variance, ESS and dissimilarity on different scales. This record defines ESS without
  division by cluster size and distinguishes it from normalized variance and displayed heights. Auxiliary
  variance prose in the 2011 PDF is not treated as a proof of a common normalization for every formula.
- The original five-value illustration 1,7,2,9,12 has exact successive total ESS 0,1/2,5/2,79/6,434/5;
  the printed 13.17 and 86.80 are rounded. These and the input-scale and cardinality examples were checked
  with a finite rational curator calculation, not an author implementation.
- All 10 original scan pages and all 20 versioned arXiv PDF pages were visually read. The latter’s title
  page date differs from its submission metadata; the reason is unestablished. No comparison with the
  associated 2014 journal version, current API validation, author R execution or benchmark reproduction
  was performed.
