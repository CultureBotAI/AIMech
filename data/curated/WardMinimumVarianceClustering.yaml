claims:
- claim_id: greedy-ess-hierarchy
  kind: mechanism
  statement: Start with one cluster per observation. At each stage choose the current pair whose union
    increases the total error sum of squares least, merge it without undoing earlier unions, and update
    cluster memberships and costs. Continuing to one cluster gives n−1 merges and a hierarchy; stopping
    at a selected cluster count gives one level of that hierarchy.
  evidence:
  - source_id: ward1963
    locator: Sections 1–2, printed pp.236–240 / PDF pp.2–6; Figure 2, printed p.242 / PDF p.8
    relation: supports
  - source_id: murtagh2011
    locator: Section 3 opening and Section 3.1, PDF pp.6–7
    relation: supports
- claim_id: cardinality-weighted-increment
  kind: mechanism
  statement: For clusters A and B with sizes a and b and means mA and mB, the ESS increase is a*b/(a+b)
    times the squared Euclidean norm of mA−mB. This is the merged-cluster ESS minus the two previous ESS
    values. It accounts for cluster cardinalities; choosing the nearest two centroids alone need not select
    the same pair.
  evidence:
  - source_id: ward1963
    locator: Section 1 ESS example and formula, printed p.237 / PDF p.3
    relation: supports
  - source_id: murtagh2011
    locator: Sections 2.1–2.2 and 3.1, Equations 1–2, PDF pp.3–4,6
    relation: supports
- claim_id: distance-scale-implementations
  kind: mechanism
  statement: In the paper’s Ward1 formulation, use squared Euclidean singleton dissimilarities and the
    linear update D(A∪B,C)=((a+c)D(A,C)+(b+c)D(B,C)−cD(A,B))/(a+b+c). Ward2 applies that linear expression
    to squared dissimilarities and takes its square root. Using Ward1 with squared Euclidean input and
    Ward2 with Euclidean input gives matching merge choices under consistent tie handling and exact arithmetic,
    with correspondingly transformed heights. Ordinary Euclidean input to the linear Ward1 update can
    change the hierarchy.
  evidence:
  - source_id: murtagh2011
    locator: Sections 3.2–3.3, Equations 3–7, PDF pp.7–9; Sections 4.3–4.4 and 5.1–5.2, PDF pp.13–17
    relation: supports
- claim_id: greedy-not-global
  kind: limitation
  statement: The chosen merge minimizes the loss among available pair unions at that step. Earlier unions
    constrain later partitions, so this does not guarantee the minimum total ESS among all partitions
    with a specified number of groups. The original paper explicitly distinguishes the hierarchical restriction
    from globally optimal grouping.
  evidence:
  - source_id: ward1963
    locator: Section 1, printed p.238 / PDF p.4
    relation: supports
  - source_id: murtagh2011
    locator: Section 3.1, PDF pp.6–7
    relation: supports
- claim_id: geometry-and-choice-boundaries
  kind: scope
  statement: This record uses unweighted observations, arithmetic means and squared Euclidean ESS. The
    original framework permits other investigator-chosen objectives, but these do not automatically denote
    the same minimum-variance method. Choosing variables and their scale, the desired cluster count, and
    tie handling remains part of the analysis; the original method does not automatically select the number
    of groups or assign unseen observations.
  evidence:
  - source_id: ward1963
    locator: Section 1, printed pp.237–239 / PDF pp.3–5; Figure 2, printed p.242 / PDF p.8
    relation: supports
  - source_id: murtagh2011
    locator: Sections 2.1–2.4 and 3.2, PDF pp.3–7
    relation: supports
- claim_id: implementation-and-height-limits
  kind: limitation
  statement: 'The objective does not fix a software implementation or runtime. The original presentation
    evaluates current pair unions, while the later paper discusses optimized nearest-neighbor-chain implementations
    separately. Dendrogram height conventions must be stated: initializing the linear recurrence with
    full squared Euclidean singleton distances yields values twice the direct ESS merge increments, and
    Ward2 uses their square roots. Historical software examples do not establish current library behavior.'
  evidence:
  - source_id: ward1963
    locator: Section 2 and Figure 2, printed pp.240–242 / PDF pp.6–8
    relation: supports
  - source_id: murtagh2011
    locator: Sections 3.1–3.3, PDF pp.6–9; Sections 4–5.3, PDF pp.9–18
    relation: supports
