id: AIMech:WardMinimumVarianceClustering
name: Ward minimum-variance clustering
aliases:
- Ward hierarchical clustering
- Ward minimum-variance method
- Ward's method
concept_kind: algorithm
definition: An agglomerative clustering algorithm for Euclidean observations that starts from singletons
  and repeatedly merges the pair causing the smallest increase in total within-cluster squared deviations
  from cluster means, producing a nested sequence of partitions.
identity_notes: Compared all 442 pinned AIO and 650 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 58, 0, 4 lines. All distinct match contents were
  inspected. Recovery-checkout hits describe Ward as a value-based abstraction component, a mathematical
  example or a pending discovery lead; the two long generated search-index rows repeat that fully read
  record. None identifies an existing standalone Ward record. The older checkout returned no matches including
  ignored and hidden files; four original-checkout hits are unrelated Gregory P. Ward attribution in ignored
  Click dependency code. Semantic matching covered 26 AIO and 167 native definitions, with every matched
  definition read. 8 full annotated AIO node/edge/generated contexts and 4 full native records were inspected.
  Retain the squared-Euclidean ESS specialization commonly called Ward minimum-variance clustering. Ward’s
  broader 1963 arbitrary-objective grouping framework is not asserted as an exact alias. Greedy pair unions
  differ from k-means reassignment, CURE representative-point linkage and BIRCH feature-tree compression.
  The value-based abstraction record uses Ward as one optional component, not as the identity of its entire
  family. Ward1 and Ward2 are distance-scale implementations of this criterion under appropriate inputs,
  not separate curated concepts here.
