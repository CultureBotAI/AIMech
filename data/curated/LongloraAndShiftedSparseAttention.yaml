claims:
- claim_id: r660-claim-half-head-half-group-shift-information-flow
  kind: mechanism
  statement: Splitting a long sequence of length N into M = N/G isolated local groups of size G reduces self-attention FLOPs by M-fold (e.g., 4x for G = N/4) but causes perplexity to degrade sharply on long contexts because no information flows across group boundaries; shifting the group partition by G/2 tokens in half of the attention heads (S^2-Attn) restores cross-group information exchange with zero additional attention FLOPs and matches full-attention fine-tuning perplexity even when evaluated with standard dense full attention at test time.
  evidence:
  - source_id: r660-primary-pdf
    locator: Section 3.2, Table 1 & Algorithm 1, p. 4-5; Section 4.3, Table 6, p. 9; Appendix B.2-B.5, Tables 7-8 & 11, p. 13-15
    relation: supports
- claim_id: r660-claim-trainable-embedding-and-normalization-necessity
  kind: mechanism
  statement: When extending LLaMA2-7B to a 32,768-token context window on RedPajama, increasing standard LoRA's rank from r = 8 to r = 256 fails to close the PG19 validation perplexity gap to full fine-tuning (11.44-11.98 vs. 8.08), whereas unfreezing the normalization layers (0.004% of parameters) and token embedding layers (<2% of parameters) alongside rank-8 LoRA reduces perplexity from 11.44 to 8.12.
  evidence:
  - source_id: r660-primary-pdf
    locator: Section 1, Figure 2(c), p. 2; Section 3.3 (Improved LoRA for Long Context), Table 2, p. 5-6
    relation: supports
- claim_id: r660-claim-single-node-100k-context-extension-application
  kind: application
  statement: Combined with Position Interpolation and FlashAttention-2, LongLoRA extends LLaMA2-7B to 100k tokens, LLaMA2-13B to 65,536 tokens, and LLaMA2-70B to 32,768 tokens on a single 8x A100 machine with up to 1.8x lower GPU memory and 1.8x faster training speed than LoRA.
  evidence:
  - source_id: r660-primary-pdf
    locator: Section 1, Figure 1, p. 1; Section 4.2, Tables 3-5 & Figure 4, p. 6-8; Appendix B.5, Tables 12-13, p. 15-16
    relation: supports
- claim_id: r660-claim-small-group-size-and-short-context-degradation-limitation
  kind: limitation
  statement: Reducing the S^2-Attn group size G below 1/4 of the target context length (e.g., 1/6 or 1/8) degrades validation perplexity relative to full attention, and models extended to extreme context lengths via Position Interpolation and LongLoRA exhibit slight perplexity degradation when evaluated on short contexts (e.g., 2048 tokens).
  evidence:
  - source_id: r660-primary-pdf
    locator: Section 4.2 (Long-sequence Language Modeling), p. 7; Appendix B.2 (Ablation on Group Sizes), Table 7, p. 13
    relation: supports
