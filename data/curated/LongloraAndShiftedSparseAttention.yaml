id: AIMech:LongloraAndShiftedSparseAttention
name: LongLoRA and Shifted Sparse Attention (S^2-Attn)
concept_kind: algorithm
review_status: DRAFT
definition: 'LongLoRA is an efficient long-context fine-tuning framework for pretrained large language models that combines two core components: (1) Shifted Sparse Attention (S^2-Attn) during training, which splits projected queries, keys, and values along the head dimension H into two equal chunks, shifts the token sequence by half the group size (-G/2) along the sequence dimension N in the second half of the heads, reshapes the sequence of length N into N/G groups of length G folded into the batch dimension to compute standard self-attention within each group in O(N G) = O(N^2 / (N/G)) time, and shifts the second half of the head outputs back by +G/2 before head concatenation; and (2) an improved low-rank adaptation regime (LoRA^+) that makes the token embedding layer and all normalization layers trainable alongside low-rank attention weight adapters.'
identity_notes: "Distinct from standard LoRA (Hu et al., 2022), which freezes embeddings and normalization layers and uses dense O(N^2) self-attention during training\u2014resulting in both high perplexity on extended context windows even at rank r = 256 and quadratic training memory/time growth. Also distinct from sparse-from-scratch Transformer architectures such as Longformer (Beltagy et al., 2020) and BigBird (Zaheer et al., 2020), which permanently alter the attention architecture, whereas S^2-Attn is used only during fine-tuning and preserves unmodified dense full self-attention at inference time."
aliases:
- LongLoRA
- Shifted Sparse Attention
- S^2-Attn
- Long-Context Low-Rank Adaptation with Shifted Sparse Attention
