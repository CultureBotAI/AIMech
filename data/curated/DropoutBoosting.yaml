- source_id: wardefarley2014
  locator: Section 7, PDF p. 7, proposed ensemble objective, selected-subnetwork update and weight-scaling
    approximation
  relation: supports
claims:
- claim_id: ensemble-likelihood-objective
  kind: mechanism
  statement: For a finite set of equally weighted masks with positive predictive probabilities, write
    s(y)=mean_m log p_m(y) and q(y)=exp(s(y))/sum_c exp(s(c)). The proposed objective for an observed
    label is log q(y), whereas ordinary dropout trains the average individual log likelihood. The two
    objectives generally have different gradients despite using the same mask noise. This is a normalized
    geometric ensemble, not an arithmetic mixture or a sequence of separately fitted weak learners.
  evidence:
  - source_id: wardefarley2014
    locator: Sections 2 and 7, PDF pp. 2–3 and 7; normalized geometric ensemble definition; direct algebra
      with explicitly defined mask averaging
    relation: supports
- claim_id: selected-mask-and-proxy
  kind: mechanism
  statement: The procedure selects a masked subnetwork and uses an ensemble-likelihood update that accounts
    for predictions from other subnetworks. Parameters are shared, so an update can affect other members
    containing those parameters. The exact ensemble prediction is generally intractable and the paper
    replaces it by the weight-scaled network prediction. This proxy can bias the resulting update; exact
    model averaging in special affine settings does not establish exactness for arbitrary nonlinear networks.
  evidence:
  - source_id: wardefarley2014
    locator: Section 7, PDF p. 7, selected-subnetwork rule and final paragraph; Section 2.2, p. 3; direct
      constructed nonlinear proxy example
    relation: supports
- claim_id: normalizer-gradient-source-caveat
  kind: limitation
  statement: Differentiating the normalized objective gives grad log q(y)=grad s(y)-sum_c q(c)*grad s(c).
    The paper’s displayed selected-member update instead prints a plus sign before the ensemble-weighted
    score term, inconsistent with differentiating its log normalization. This record uses the subtraction
    as direct curator algebra and preserves the printed discrepancy; it does not certify which sign an
    uninspected implementation used. With shared parameters, the full gradient includes contributions
    from all dependent masks. Sampling a suitably scaled contribution can be unbiased if the exact ensemble
    term is available; replacing that term by weight scaling generally loses that assurance.
  evidence:
  - source_id: wardefarley2014
    locator: Section 7, PDF p. 7, ensemble normalization and displayed update; direct differentiation
      and finite-difference calculations
    relation: supports
- claim_id: finite-mnist-comparison
  kind: limitation
  statement: The dropout-boosting experiment reuses fifty hyperparameter configurations from dropout-trained
    two-hidden-layer rectifier networks on multiclass MNIST, then trains matched dropout-boosting and
    ordinary stochastic-gradient models. Dropout boosting shows no significant Wilcoxon difference from
    ordinary training in these trials, while ordinary dropout improves in the displayed comparisons. The
    nonsignificant result is not proof of equivalence or a universal absence of regularization, and transferring
    dropout-selected settings limits causal interpretation.
  evidence:
  - source_id: wardefarley2014
    locator: Sections 6–7, PDF pp. 6–8, hyperparameter selection and Figure 4
    relation: supports
- claim_id: untied-ensemble-context
  kind: scope
  statement: The separate fixed-mask ensemble experiment trains independently parameterized bootstrap
    networks and combines their predictions geometrically. It is contextual evidence about shared parameters,
    not the dropout-boosting algorithm itself. The paper acknowledges fewer ensemble members and hyperparameters
    selected under dropout as confounds, so the comparison does not isolate weight sharing as the sole
    cause of performance differences.
  evidence:
  - source_id: wardefarley2014
    locator: Section 6, PDF pp. 6–7, Figure 3 and explicit comparison limitations
    relation: supports
