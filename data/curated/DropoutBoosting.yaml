id: AIMech:DropoutBoosting
name: Dropout Boosting
aliases: []
concept_kind: algorithm
definition: A dropout-mask training procedure proposed to optimize the likelihood of a normalized geometric
  ensemble, updating through a selected shared-parameter subnetwork while approximating the ensemble prediction
  by weight scaling.
identity_notes: Compared all 442 pinned AIO and 621 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 23, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 8 AIO and 8 native definitions, with every matched definition read.
  4 full annotated AIO node/edge/generated contexts and 6 full native records were inspected. Dropout
  boosting is the specific ensemble-likelihood training proposal in Warde-Farley and colleagues’ Section7.
  Its shared-parameter masked-subnetwork update is distinct from adding separate weak learners, error-reweighted
  AdaBoost, gradient tree boosting, independent bagging and Gaussian-approximated fast dropout. LogarithmicOpinionPool
  describes its aggregation rule without specifying this training procedure. The source’s printed gradient
  error is retained explicitly rather than used to invent a new algorithm.
