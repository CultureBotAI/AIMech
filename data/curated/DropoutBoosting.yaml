limitations:
- The name is scoped to Warde-Farley and colleagues’ proposal. It is not AdaBoost, gradient tree boosting,
  independent bagging, Gaussian fast dropout or the probability-pooling operator by itself.
- The printed update sign and mask-count exponent notation require care. Explicit finite-mask mean notation
  is used here; corrected algebra is not attributed to author implementation.
- Mask sampling and the weight-scaled ensemble proxy are separate approximations. Shared weights require
  accounting for every dependent path when deriving an exact full gradient.
- One complete ten-page versioned primary paper was visually inspected. Constructed algebra examples do
  not reproduce the experiments, inspect author code or establish convergence.
