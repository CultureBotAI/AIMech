claims:
- claim_id: r358-claim-variance-reduced-power-step-and-sparse-amortized-implementation
  kind: mechanism
  statement: Rewriting each inner VR-PCA iteration (Algorithm 1) as w_t' = (I + eta*A)w_{t-1} + eta*(x_{i_t} x_{i_t}^T - A)(w_{t-1} - w_tilde_{s-1}), w_t = w_t' / ||w_t'||_2 replaces the O(1)-variance stochastic noise of Oja's algorithm with a zero-mean perturbation whose variance is bounded by O(eta^2 ||w_{t-1} - w_tilde_{s-1}||_2^2) (Section 2, Equations 4-5); moreover, representing w_t = alpha*g + beta*u_tilde alongside scalar invariants gamma = ||alpha*g||^2, delta = <alpha*g, u_tilde>, and zeta = ||u_tilde||^2 enables exact unit-sphere normalization and sparse vector updates in O(d_s) time per inner step and O(d_s(m + n)) total time per epoch, where d_s is the average sparsity of x_i (Remark 2, p. 4; Appendix A, pp. 17-18).
  evidence:
  - source_id: r358-primary-pdf
    locator: Section 2, Algorithm 1, Equations 4-5, and Remarks 1-2, pp. 3-4; Appendix A, pp. 17-18
    relation: supports
- claim_id: r358-claim-second-order-taylor-one-step-stochastic-recurrence
  kind: mechanism
  statement: For normalized data max_i ||x_i||^2 <= 1 and eigengap lambda = s_1 - s_2 > 0, whenever <w_t, v_1> >= 1/2, <w_tilde_{s-1}, v_1> >= 0, and eta <= c*lambda, a second-order Taylor expansion of the ratio f(x, y) = x / (x + y) for x = (a_1 + z_1)^2 and y = sum_{i=2}^d (a_i + z_i)^2 establishes that the squared cosine residual b_t = 1 - <w_t, v_1>^2 satisfies the conditional expectation recurrence E[b_{t+1} | w_t] <= (1 - eta*lambda / 16)*b_t + c*eta^2*b_tilde where b_tilde = 1 - <w_tilde_{s-1}, v_1>^2 (Section 4, Part I, Lemma 1, Equations 8-17).
  evidence:
  - source_id: r358-primary-pdf
    locator: Section 4, Part I, Lemma 1 and Equations 8-17, pp. 8-13
    relation: supports
- claim_id: r358-claim-hoeffding-azuma-epoch-contraction-and-exponential-runtime
  kind: mechanism
  statement: Given max_i ||x_i||^2 <= r, eigengap s_1 - s_2 = lambda > 0, and initial alignment <w_tilde_0, v_1> >= 1/sqrt(2), running VR-PCA with step size eta <= (c_1 delta^2 / r^2)*lambda and epoch length m >= (c_2 log(2/delta))/(eta*lambda) satisfying m*eta^2*r^2 + r*sqrt(m*eta^2*log(2/delta)) <= c_3 ensures via the maximal Hoeffding-Azuma inequality (Lemmas 2-4) that after T = ceil(log(1/epsilon)/log(2/delta)) epochs, <w_tilde_T, v_1>^2 >= 1 - epsilon with probability at least 1 - 2*log(1/epsilon)*delta in total runtime O(d_s (n + (r/lambda)^2) log(1/epsilon)), decoupling the sample size n from the condition-number factor (r/lambda)^2 (Theorem 1).
  evidence:
  - source_id: r358-primary-pdf
    locator: Section 2, Theorem 1 and Equations 6-7, pp. 4-5; Section 4, Parts II-III, Lemmas 2, 3, and 4, pp. 13-16
    relation: supports
