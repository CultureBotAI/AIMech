id: AIMech:VarianceReducedStochasticPCAWithExponentialConvergence
name: Variance-Reduced Stochastic PCA and SVD with Exponential Convergence (VR-PCA)
concept_kind: algorithm
review_status: DRAFT
definition: Variance-Reduced Stochastic PCA and SVD with Exponential Convergence (VR-PCA) is an epoch-based stochastic spectral optimization algorithm introduced and analyzed by Ohad Shamir (2015) for computing the leading eigenvector(s) of an empirical covariance matrix A = (1/n) sum_{i=1}^n x_i x_i^T from a data matrix X = (x_1, ..., x_n) in R^{d x n}. In each outer epoch s, VR-PCA computes the exact full-pass anchor vector u_tilde = A w_tilde_{s-1} = (1/n) sum_{i=1}^n x_i (x_i^T w_tilde_{s-1}) and performs m inner stochastic updates w_t' = w_{t-1} + eta*(x_{i_t}(x_{i_t}^T w_{t-1} - x_{i_t}^T w_tilde_{s-1}) + u_tilde) = (I + eta*A)w_{t-1} + eta*(x_{i_t} x_{i_t}^T - A)(w_{t-1} - w_tilde_{s-1}), w_t = w_t' / ||w_t'||_2 with a fixed step size eta, driving the stochastic gradient variance ||w_{t-1} - w_tilde_{s-1}||_2^2 to zero across epochs and achieving linear/exponential convergence in O(d_s (n + (r/lambda)^2) log(1/epsilon)) total runtime.
identity_notes: Distinct from generic PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis) and DimensionalityReduction (AIO:DimensionalityReduction), which do not specify SVRG-style variance-reduced stochastic power updates on the unit sphere. Distinct from AIMech:StreamingPCANearOptimalFiniteSampleOjaAlgorithm (Round 357), which is a single-pass streaming Oja algorithm with decaying step size eta_t = O(1/t) and sub-exponential O(1/n) convergence rate due to non-vanishing stochastic update variance. Also distinct from AIMech:ShiftAndInvertPreconditioningForFasterEigenvectorComputation (Round 354), which applies SVRG to solve shifted linear systems (lambda I - A)x = b rather than directly iterating normalized variance-reduced power steps on the non-convex unit-sphere Rayleigh quotient.
aliases:
- Shamir VR-PCA Algorithm
- Variance-Reduced Oja Iteration for Principal Component Analysis
- Epoch-Anchored Stochastic Power Iteration for PCA and SVD
