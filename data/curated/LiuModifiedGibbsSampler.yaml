id: AIMech:LiuModifiedGibbsSampler
name: Liu modified discrete-state Gibbs sampler
concept_kind: algorithm
definition: A discrete conditional sampling algorithm that proposes a category from the full conditional
  distribution with the current category excluded, then applies a Metropolis correction to preserve the
  original conditional distribution.
definition_evidence:
- source_id: neal2004
  locator: Section 3, PDF p. 5, Liu conditional proposal and Equation 9
  relation: supports
claims:
- claim_id: excluded-current-conditional-proposal
  kind: mechanism
  statement: Hold the other components fixed and let p be the normalized finite full-conditional probability
    mass function for the selected component. At a current category a with p_a>0, if p_a<1, propose a
    different category c with probability p_c/(1−p_a). Categories with zero conditional mass have zero
    proposal probability. If p_a=1, retain a without evaluating the undefined excluded-current proposal.
  evidence:
  - source_id: neal2004
    locator: Section 3, PDF p. 5, paragraph preceding Equation 9 and point-mass exception below it
    relation: supports
- claim_id: conditional-metropolis-correction
  kind: mechanism
  statement: Accept the proposed category c with probability min(1,(1−p_a)/(1−p_c)); otherwise retain
    a. For distinct supported categories, the complete transition probability is U(a,c)=min(p_c/(1−p_a),p_c/(1−p_c)),
    with U(a,a) completing the row to one. The Metropolis correction uses the original conditional masses,
    not the proposed category probability after excluded-current renormalization. A proposal that differs
    from the current category can still be rejected.
  evidence:
  - source_id: neal2004
    locator: Section 3, PDF p. 5, Equation 9; Section 4, PDF p. 8, Equation 16 and diagonal completion
    relation: supports
- claim_id: conditional-balance-and-joint-invariance
  kind: mechanism
  statement: The update satisfies detailed balance with the selected full conditional. Its off-diagonal
    probability U(a,c) is at least p_c, the corresponding exact-Gibbs transition probability; this is
    a property of the conditional transition matrix. Holding the remaining components fixed therefore
    preserves the joint target. This local reversible kernel does not require a persistent direction variable
    or a stored preceding joint state.
  evidence:
  - source_id: neal2004
    locator: Section 3, PDF pp. 5–6, Equation 9 and ensuing off-diagonal comparison; Section 4, PDF p.
      8, Equation 16
    relation: supports
- claim_id: scan-schedule-and-comparison-boundary
  kind: scope
  statement: 'A fixed-probability mixture of these conditional kernels preserves the target and is reversible.
    A fixed sequential sweep also preserves the target, but its composition need not be reversible. Neal
    explicitly distinguishes random-scan and sequential updates when applying Peskun’s comparison: the
    reversible-chain argument is not automatically a result for a systematic sweep, random-permutation
    sweep, finite-run error, or computational cost.'
  evidence:
  - source_id: neal2004
    locator: Section 3, PDF pp. 5–6, Peskun qualifications and scan-order discussion
    relation: supports
- claim_id: local-update-versus-pair-state-construction
  kind: scope
  statement: Neal subsequently applies this conditional kernel inside a separate construction that swaps
    an ordered pair and updates its second component to reduce immediate backtracking. That augmented
    pair-state algorithm is not the identity of Liu’s conditional update. In particular, forbidding the
    present category in a proposal does not forbid all repeated values or eliminate rejection from the
    resulting chain.
  evidence:
  - source_id: neal2004
    locator: Section 3 conclusion and Section 4, PDF pp. 6–8, Equations 10–16
    relation: supports
