limitations:
- The maintained scope is a finite discrete full conditional with compatible joint target and a supported
  current category. A point-mass conditional requires the explicit stay guard; zero-over-zero ratios are
  not operational rules.
- Conditional invariance does not establish irreducibility, aperiodicity or convergence of every joint
  update schedule. Increased off-diagonal transition probabilities are not a universal mixing-time, finite-sample
  accuracy or runtime guarantee.
- The proposal must be sampled from the correctly normalized excluded-current conditional. Determining
  its probabilities can be costly for many categories; an arbitrary categorical proposal is not covered
  by the stated acceptance formula.
- The inspected mathematical method is Neal’s 2004 report, which attributes the modification to Liu’s
  1996 paper. The original Liu paper was available only through abstract and metadata; its full text was
  not obtained. This access gap does not supply unseen original proofs.
- The name does not denote all Metropolis-within-Gibbs methods or every method called metropolized Gibbs.
  Neal’s pair-state backtracking construction and complete library sampler classes have separate identities.
