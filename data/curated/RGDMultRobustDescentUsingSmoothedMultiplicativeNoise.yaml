id: AIMech:RGDMultRobustDescentUsingSmoothedMultiplicativeNoise
name: RGDMult Robust Descent Using Smoothed Multiplicative Noise
concept_kind: algorithm
review_status: DRAFT
definition: A robust first-order stochastic optimization algorithm that minimizes population risk under heavy-tailed data distributions by perturbing model parameters with multiple independent draws of unit-mean multiplicative noise per outer iteration, estimating perturbed gradients on mini-batches via a coordinate-wise Catoni-type M-estimator, and aggregating the inner perturbed gradient estimates with a second Catoni M-estimator to bound excess multiplicative-noise variance by 1/m.
identity_notes: No AIO class represents RGDMult or smoothed multiplicative-noise Catoni robust gradient descent; ArtificialNeuralNetwork (AIO:ArtificialNeuralNetwork) is the closest broad match covering neural and statistical learning models trained with multiplicative-noise descent.
aliases:
- RGDMult
- Robust Gradient Descent with Smoothed Multiplicative Noise
- Smoothed Multiplicative Noise Robust Descent
