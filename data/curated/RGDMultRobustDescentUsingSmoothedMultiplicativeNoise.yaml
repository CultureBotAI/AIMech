claims:
- claim_id: catoni-coordinatewise-m-estimator-gradient-concentration
  kind: mechanism
  statement: RGDMult estimates each coordinate of the gradient by solving a Catoni-type M-estimation root equation with a bounded soft-truncation influence function psi, achieving sub-Gaussian concentration around the true population gradient under only finite variance.
  evidence:
  - source_id: r824-primary-pdf
    locator: Section 2.1, Equations 3-4 and Lemma 1, pp. 2-3
    relation: supports
- claim_id: smoothed-multiplicative-noise-variance-shrinking
  kind: mechanism
  statement: Averaging gradient evaluations across m independent draws of unit-mean multiplicative parameter noise per iteration preserves the expected multiplicatively perturbed objective while shrinking the excess multiplicative-noise variance term by a factor of 1/m.
  evidence:
  - source_id: r824-primary-pdf
    locator: Section 2.2, Theorem 4 and Equations 5-6, p. 3; Section 3, Algorithm 1, p. 4
    relation: supports
- claim_id: heavy-tailed-statistical-risk-minimization-application
  kind: application
  statement: RGDMult is applied to empirical and population risk minimization under heavy-tailed data and gradient distributions where standard empirical-mean gradient descent and unsmoothed Bernoulli dropout suffer from high variance.
  evidence:
  - source_id: r824-primary-pdf
    locator: Section 1, pp. 1-2; Section 4, Figures 2-4, pp. 5-7
    relation: supports
- claim_id: coordinatewise-catoni-dimension-scaling-limitation
  kind: limitation
  statement: Because the Catoni M-estimator is applied coordinate-wise across d parameters and union-bounded over coordinates, the high-probability gradient estimation error bound scales with sqrt(d log(d/delta)/n) and requires solving d scalar root-finding problems per step.
  evidence:
  - source_id: r824-primary-pdf
    locator: Section 2.1, Lemma 1 and Remark 3, pp. 2-3; Section 3, Algorithm 1, p. 4
    relation: supports
