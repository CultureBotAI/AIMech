aio_mappings:
- target: AIO:LeastsquaresAnalysis
  relation: related_match
  rationale: The squared-residual criterion and recursive least-squares algebra directly relate these
    parameter updates to residual-squared fitting. The pinned target describes an overdetermined fitting
    analysis, not this recursive estimator; the pseudo-linear approximation also need not minimize the
    full nonlinear prediction-error objective. A related mapping preserves these differences.
- target: AIO:RegressionAnalysis
  relation: related_match
  rationale: The estimator fits a parameterized relationship between observed outputs and predictive lagged
    information. The pinned target groups statistical fitting processes and does not specify this update
    or its residual dependence. This is a contextual algorithm/fitting relationship rather than an exact
    or inferred subclass assertion.
limitations:
- The inspected mechanism evidence is the complete 1989 polynomial-NARMAX treatment. Earlier recursive-identification
  sources and broader filtered, vector, nonquadratic, rational and output-affine variants remain follow-up
  scopes; no priority claim is made.
- Model structure, initialization, gain or forgetting schedule, numerical conditioning and predictor stability
  require separate choices. A recursive parameter estimator does not select a correct model structure,
  establish physical causality or guarantee out-of-sample accuracy.
- The source defines m-invertibility by mean-square residual-initialization forgetting. Almost-sure or
  exponential forgetting is not inferred solely from that definition. Its nonlinear noise examples and
  convergence extensions require their stated assumptions; no unrestricted theorem is adopted.
- All 27 rendered PDF pages were read, including the experiments and references. Exact examples are curator
  derivations, not replications of the source experiments. No model training, empirical benchmark or paid
  service was run. DRAFT status and author self-review do not imply independent scientific approval.
