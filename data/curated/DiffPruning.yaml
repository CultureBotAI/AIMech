claims:
- claim_id: diff-pruning-hard-concrete-l0-and-structured-group-gates
  kind: mechanism
  statement: Diff Pruning relaxes the binary mask on delta_tau = z_tau (*) w_tau using a stretched Hard-Concrete distribution on (l, r)^d (with l = -1.5, r = 1.5, w_tau initialized to 0, and alpha_tau initialized to 5), yielding the differentiable expected L0 penalty sum_{i=1}^d sigma(alpha_{tau,i} - log(-l/r)); Structured Diff Pruning multiplies each element mask by a matrix/bias-group gate z_tau^j (393 groups in BERT_LARGE), increasing the average percentage of completely zeroed parameter groups at 0.5% sparsity from 6.3% (non-structured) to 28.1% (structured) (Table 3).
  evidence:
  - source_id: r694-primary-pdf
    locator: Section 3.1-3.3, pp. 3-4; Section 4.3, pp. 4-5; Section 6.2, Table 3, pp. 6-7
    relation: supports
- claim_id: diff-pruning-l0-ball-projection-glue-and-squad-performance
  kind: application
  statement: By projecting delta_tau onto an exact L0-ball via magnitude pruning and fine-tuning with the nonzero mask fixed, Structured Diff Pruning matches full fine-tuning of BERT_LARGE on the GLUE test server (80.6 average score vs. 80.6 for full fine-tuning, 79.4 for unstructured Diff Pruning, and 75.5 for non-adaptive diff pruning) while modifying only 0.5% of parameters per task (13.6 MB storage for positions + weights vs. 49.0 MB for 3.6% Adapters and 1297.0 MB for full fine-tuning), and achieves 93.2 F1 on SQuAD v1.1 at 1.0% sparsity vs. 90.8 F1 for full fine-tuning.
  evidence:
  - source_id: r694-primary-pdf
    locator: Section 3.2, p. 3; Section 5.1-5.2, Table 1 & Figure 1, pp. 5-6; Section 6.4 & 6.6, Tables 4 & 6, pp. 7-8
    relation: supports
- claim_id: diff-pruning-training-memory-speed-and-index-storage-limitation
  kind: limitation
  statement: During training, Diff Pruning requires extra GPU memory to store and optimize the auxiliary log-alpha parameters alpha_tau alongside the dense weight vector w_tau, runs approximately 1.5x to 2x slower per minibatch than standard fine-tuning, and requires storing integer coordinate indices alongside nonzero float weights for each task's compressed diff vector.
  evidence:
  - source_id: r694-primary-pdf
    locator: Section 6.6-6.7, pp. 7-8, Table 6
    relation: supports
