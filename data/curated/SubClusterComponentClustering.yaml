limitations:
- Threshold schedules, linkage choices and sparse-neighbor approximations influence the output. A finite
  schedule need not yield a single full-data cluster.
- Exact recovery assumptions and HAC-equivalence assumptions must be kept separate from practical approximations.
  No unconditional DP-means approximation is asserted from the disputed proof step.
- The finite calculation uses exact scalar arithmetic and a 404-point separated construction. It is not
  author-code execution, benchmark replication or a counterexample to the existential hierarchy claim.
- All 28 pages of arXiv v3 were inspected. Earlier versions and the proceedings version were not compared.
  Graphgrove documentation and selected code were read separately; no implementation-conformance claim
  is made here.
- No author program, model training, industrial data, hardware benchmark or formal proof certification
  was performed. This record remains DRAFT.
