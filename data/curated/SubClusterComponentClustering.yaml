id: AIMech:SubClusterComponentClustering
name: Sub-Cluster Component clustering
aliases:
- Sub-Cluster Component algorithm
concept_kind: algorithm
definition: An agglomerative clustering algorithm that repeatedly merges weakly connected components of
  a thresholded nearest-neighbor graph over the current clusters, producing nested partitions with potentially
  nonbinary merges.
identity_notes: Compared all 442 pinned AIO and 660 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 25, 0, 1 lines. All distinct match contents were
  read, including pending discovery entries and source-reading observations. Recovery hits concern pending
  SCC discovery notes and primary-source context; none identifies an existing standalone SCC record. The
  older checkout returned no matches. The sole original-checkout hit is an ignored .venv prefixmaps w3id/scc
  namespace row, not this algorithm. All searches include ignored and hidden files. Semantic matching
  covered 41 AIO and 223 native definitions, all read; unchanged definitions were byte-compared with the
  preceding full assessment. 11 full annotated AIO node/edge/generated contexts and 5 full native records
  were inspected. Retain thresholded nearest-neighbor weak-component merging, distinct from disjoint reciprocal
  batches, reusable nearest-neighbor chains, CHAMELEON bisection-normalized graph statistics, GRINCH grafting
  and PERCH rotations.
definition_evidence:
- source_id: scc2021
  locator: Section 2.2, Definition 3 and Algorithm 1, PDF pp. 5–6
  relation: supports
claims:
- claim_id: component-merges
  kind: mechanism
  statement: Starting from singleton clusters, form an eligible edge when either endpoint chooses the
    other as its nearest other cluster and their linkage dissimilarity is at most the threshold. Merge
    each weakly connected component into the union of its members. This differs from merging only reciprocal
    pairs or requiring all member pairs to meet the threshold; one component can merge several clusters
    at once.
  evidence:
  - source_id: scc2021
    locator: Section 2.2, Definition 3 and Equations 1–2, PDF pp. 5–6
    relation: supports
- claim_id: threshold-schedule
  kind: mechanism
  statement: The intended exact procedure keeps a threshold while merges occur, then advances through
    an increasing schedule. Each resulting round is a flat partition and their accumulated clusters form
    a hierarchy. The printed Algorithm 1 does not initialize its first active threshold and uses a strict
    index bound that skips the last listed threshold; it is not adopted as a complete executable specification.
  evidence:
  - source_id: scc2021
    locator: Section 2.2 and Algorithm 1, PDF pp. 5–6
    relation: supports
- claim_id: conditional-recovery
  kind: scope
  statement: The average-linkage recovery result assumes center separation relative to a within-cluster
    radius, a suitably small initial threshold and a doubling schedule that reaches the separating range.
    The stated separation constants are 6 for a metric and 30 for squared Euclidean dissimilarity. These
    are conditional sufficient conditions, not arbitrary-data guarantees. The Appendix A.1 proof also
    uses an initial threshold below the radius.
  evidence:
  - source_id: scc2021
    locator: Assumption 1 and Theorem 1, PDF p. 7; Appendix A.1, pp. 23–24
    relation: supports
- claim_id: hac-relation
  kind: scope
  statement: Under symmetric, tie-free and reducible linkage, Proposition 2 establishes existence of a
    specially chosen threshold sequence that reproduces the HAC tree. It does not identify every SCC schedule
    with HAC. The model-based separation argument in Appendix A.2 invokes that proposition, so its reducibility
    assumption cannot be silently dropped merely because Proposition 1 omits it.
  evidence:
  - source_id: scc2021
    locator: Propositions 1–2 and Section 3.3, PDF pp. 8–9; Appendix A.2, p. 24
    relation: supports
- claim_id: objective-proof-boundary
  kind: limitation
  statement: Theorem 2 claims that the hierarchy contains a two-approximation for DP-means, but the displayed
    proof relies on Appendix A.3 Proposition 3 asserting optimality of the separated target for a penalized
    facility objective. A curator finite example satisfying the printed separation condition has a feasible
    four-facility solution cheaper than that target under the stated penalty. Thus that proof step is
    not accepted as written. The example does not rule out a better partition elsewhere in the SCC hierarchy
    and does not refute the existential wording of Theorem 2.
  evidence:
  - source_id: scc2021
    locator: Theorem 2, PDF p. 8; Appendix A.3 and Proposition 3, pp. 24–26
    relation: supports
- claim_id: approximation-and-complexity
  kind: scope
  statement: The practical version uses sparse approximate-neighbor graphs, substitutes a constant for
    missing pairwise edges, and advances a fixed schedule every round. Those changes are distinct from
    the exact full-distance procedure and do not automatically inherit its recovery result. Nearest-neighbor
    work, linkage costs and empty threshold advances affect runtime; the printed 2(N−1) round accounting
    does not cover arbitrarily many no-merge thresholds.
  evidence:
  - source_id: scc2021
    locator: Sections 3.4–4.1, PDF pp. 9–11
    relation: supports
- claim_id: evaluation-scope
  kind: scope
  statement: The experiments compare hierarchical and extracted flat clusterings under source-specific
    features, graph settings, schedules and evaluation choices. Some flat selections use the true cluster
    count or select the best label-based F1 across rounds. Reported clustering times exclude separately
    reported graph construction. Proprietary web-query experiments and incomplete baseline runs do not
    establish a portable speed advantage, universal quality ranking or public replication.
  evidence:
  - source_id: scc2021
    locator: Sections 4.1–4.4, PDF pp. 10–16; Tables 1–5; Appendix B, pp. 26–28
    relation: supports
