name: Nguyen–Wainwright–Jordan variational bound
definition: A variational lower bound on Kullback–Leibler divergence that subtracts a product-distribution
  exponential critic moment from a joint-distribution critic expectation when specialized to mutual information.
concept_kind: mathematical_method
identity_notes: 'NWJ denotes the variational objective, also called the f-GAN KL bound or MINE-f objective
  in the inspected follow-up. The neural MINE-f estimator is an optimization configuration using this
  bound, not a separate formula here. The original paper also develops density-ratio estimation algorithms;
  this record does not equate the mathematical bound with those kernel estimators or with MINE’s Donsker–Varadhan
  objective. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  208 preceding native IDs/names/aliases. Word-delimited fixed-string searches of both full checkouts,
  including ignored and hidden files, returned 57 lines each: existing MINE-f component discussion, shared
  primary-source references, and discovery/review context. Four native neighbors and seven exact AIO nodes
  with scoped synonyms and outgoing relations were inspected.'
limitations:
- The exponential product term can have large or infinite variance. Unbiased estimation of a fixed critic’s
  objective is not unbiased estimation of true mutual information unless the variational gap vanishes.
- A realized finite-sample value need not stay below the true divergence. Critic fitting and evaluation
  on the same data introduce selection effects; finite optimization and restricted function classes add
  approximation error.
- The optimal critic includes a fixed normalization offset. Arbitrarily shifting a nonoptimal critic changes
  this objective, unlike the shift invariance of the population Donsker–Varadhan expression.
- The original constrained and penalized density-ratio programs have their own assumptions. Their consistency
  or convexity results are not claimed for every neural parameterization. No estimator benchmark was reproduced.
