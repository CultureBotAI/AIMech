claims:
- claim_id: method
  kind: mechanism
  statement: For P absolutely continuous with respect to Q and a real critic T with well-defined expectations,
    set L_NWJ=E_P[T]−E_Q[exp(T−1)]<=KL(P||Q). The original representation is sup_(g>0){E_P[log g]−E_Q[g]+1};
    substituting g=exp(T−1) gives the displayed objective. With P=p(x,y) and Q=p(x)p(y), it lower-bounds
    I(X;Y). Under positive density ratios and sufficient critic capacity, T*=1+log(dP/dQ) attains equality;
    boundary cases may require limiting critics. For a fixed critic with integrable moments, correctly
    sampled empirical means estimate this expected bound without a log-of-sample-mean bias. Optimizing
    a neural critic changes the statistical estimation and optimization problem and does not inherit convexity
    merely from the original function-space formulation.
