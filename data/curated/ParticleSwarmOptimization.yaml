name: Particle swarm optimization
definition: A population-based optimization method that moves candidate particles through a search space
  using retained velocities and stochastic attraction toward remembered personal and shared best positions.
concept_kind: algorithm
identity_notes: 'This existing continuous PSO identity covers the retained global-best/inertia evidence
  and the original MHS 1995 local-information variant. The ICNN 1995 simplified rule retains velocity
  with coefficient 1 and attraction coefficients 2; MHS uses its own ACC_CONST and velocity limits, while
  the later inertia source is a distinct configuration. It is not differential evolution, an objective-gradient
  method, a biological flock model, or every discrete, neighborhood or constricted PSO variant. Fresh
  postmerge collection on 15 October 2026 at base a80a4e53097977b397421562fb1169aa1426dc8b inspected 757
  maintained and 442 pinned AIO identities, including 4,789 identity-field occurrences and 3,661 normalized
  values. Four fixed-string, word-boundary searches included ignored and hidden files in the original
  checkout and three discovery/recovery checkouts: 8,131, 7,634, 18,826 and 22,178 occurrences, grouped
  into 3,163 exact contents. Candidate identities had no collision; the four PSO self-matches were explicitly
  retained for enrichment. Root read 159 decoded candidate contexts (including a separately retained two-context
  key/value projection correction), all 30 normalized match fields and relevant frontier fields/selected
  full owner objects. Supporting agents assessed the disjoint candidate and two contextual partitions;
  full raw-content reconstruction is separate from semantic assessment and is not a claim that root read
  all raw containers. Existing unrelated definitions, rendered mirrors, historical report/review contexts
  and incidental substrings do not establish equivalence. The frontier has 909 main and 393 nested objects;
  only owners 243, 258, 260 and 261 change. This is bounded to the inspected pin, inventories and contexts,
  not all AI literature or saturation. All four normalized candidate self-matches point to the exact existing
  ParticleSwarmOptimization record and its retained merged-base preimage, so owner 243 enriches this stable
  identity instead of creating another record. Its original nine AIO no-match reasons are retained and
  assessed with the exact pinned class contexts; the initial 285-native identity search remains historical
  provenance rather than the current denominator. Array-adjacent source neighborhoods are not geometric
  nearest neighbors or averaged best positions. The 2002 topology recommendations and unresolved operational
  variants remain outside the added claims.'
limitations:
- Current positions can overshoot remembered bests and have worse objective values. Attraction to a best-so-far
  position is not attraction to a known global optimum. If every particle has zero velocity and its current
  position equals both remembered attractors, this displayed rule has no motion; the fixed state need
  not be optimal.
- The original coefficient 1 on old velocity and the later inertia weight must not be conflated. The 1999
  experiment’s decreasing weight and Vmax/Xmax settings are particular choices, not universal optimal
  settings or a complete bound-repair specification. Clipping a velocity alone does not ensure a feasible
  position.
- The full random-stream coupling, synchronous versus asynchronous best updates, ties, constraints and
  noisy evaluations require declared implementation choices. The social analogy is not a convergence proof.
  The 1999 discussion explicitly allows failure to find the required optimum; no universal speed, accuracy
  or finite-budget global-optimum guarantee is asserted.
- The MHS local-neighborhood description supplies prose rather than complete local-version pseudocode.
  An implementation must declare the social-best candidate set and self membership, tie handling, finite-size
  endpoint conventions and update scheduling. Wrapping is explicit in the six-neighbor passage and is
  not evidence that every local-best variant uses the same ring. The neighborhood best denotes a remembered
  evaluated solution; noisy evaluations and uncertainty are not resolved by that selector.
- The MHS paper’s apparent immunity of its two-neighbor runs to local optima is an empirical interpretation,
  not a guarantee of escape or global optimality. If all particles share a nonoptimal position, zero velocity
  and personal memories at that position, every neighborhood best coincides with it and the displayed
  attraction rule remains fixed. This is an admissible-state algebraic boundary, not a claim about the
  probability of that state under a specified initialization. The paper’s comparative observations do
  not establish a universal ordering of neighborhood sizes or topologies.
