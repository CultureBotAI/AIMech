claims:
- claim_id: method
  kind: mechanism
  statement: 'Initialize a population of real-valued positions and velocities and evaluate the objective.
    Retain each particle’s best evaluated position and the best position shared across the population.
    For each coordinate in the inspected global-best rule, add two randomly scaled displacements to the
    retained velocity: one from the current position toward the personal best and one toward the global
    best. The baseline is v_new=v+c1*r1*(p−x)+c2*r2*(g−x), followed by x_new=x+v_new; the source gives
    random factors in [0,1]. Evaluate the resulting positions and refresh the remembered bests when improved.
    Particles remain population members rather than undergoing target-trial survival selection. In the
    1995 simplified version c1=c2=2. The 1999 inertia variant replaces the retained term v by w*v and
    studies a decreasing w schedule. Initialization, population size, coefficients, velocity limits, boundary
    treatment, update ordering and stopping rules must be specified for an executable configuration.'
