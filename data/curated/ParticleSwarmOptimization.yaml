- claim_id: original-local-social-information
  kind: mechanism
  statement: In the MHS 1995 local-information variant, each particle retains its own best evaluated position
    and has access to the best solutions remembered by its array neighbors. A neighborhood best replaces
    the population-wide best as the social attractor, while the particle retains its velocity and the
    separate random attraction toward its personal best. The local social input is a selected best remembered
    position, not the arithmetic average of neighboring positions or a certified optimum near the particle
    in the objective domain. This changes the information available to the same particle-swarm search
    mechanism rather than defining a new particle identity or requiring a learned graph.
  evidence:
  - source_id: eberhart1995-mhs
    locator: Section 2 continuation and Section 3.1, PDF p. 2 / printed p. 40; Section 3.2, PDF p. 3 /
      printed p. 41.
    relation: supports
- claim_id: original-array-neighborhood-configurations
  kind: scope
  statement: The source describes a two-neighbor configuration using the immediately adjacent array positions
    i-1 and i+1, and a six-neighbor configuration using three positions on each side. It explicitly states
    wrapped array endpoints for the six-neighbor description. These neighborhoods concern particle-array
    adjacency, not nearest current positions in the search space. The names neighborhood=2 and neighborhood=6
    count the described other array positions; the particle also retains its own personal-best information.
    These selected configurations do not specify a universal meaning of local-best PSO or a complete implementation
    for every population size.
  evidence:
  - source_id: eberhart1995-mhs
    locator: Section 3.2, PDF p. 3 / printed p. 41, opening neighborhood definitions and the paragraph
      introducing Table 2.
    relation: supports
