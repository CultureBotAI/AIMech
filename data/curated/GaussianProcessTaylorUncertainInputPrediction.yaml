- source_id: girard-tr2002
  locator: Sections 3.2–3.4, Equations 12–22, PDF pp. 8–9; Sections 4.1–4.2, PDF pp. 11–13
  relation: supports
claims:
- claim_id: local-moments
  kind: mechanism
  statement: For a fixed trained GP posterior with differentiable scalar mean m(x) and twice-differentiable
    latent variance v(x), take a prescribed Gaussian test input X~N(mu,Sigma) independent of the posterior
    function conditional on the training data and fixed hyperparameters. The source expands m to first
    order and v to second order about mu. Integrating these truncated expressions gives the predictive
    mean approximation m(mu) and latent variance approximation v(mu)+0.5*tr(H_v(mu)*Sigma)+grad(m)(mu)^T*Sigma*grad(m)(mu).
    This combines the expected conditional variance and the variance of the linearized conditional mean.
    A Gaussian with these moments is an additional approximation to the predictive law, provided the resulting
    variance is valid.
  evidence:
  - source_id: girard-tr2002
    locator: Sections 3.2–3.4, Equations 12–22, PDF pp. 8–9
    relation: supports
  - source_id: girard2002
    locator: Section 3.1, Equations 6–9, PDF p. 3
    relation: supports
- claim_id: lag-covariance
  kind: application
  statement: For iterative autoregressive prediction the report carries a full Gaussian covariance of
    the lagged outputs. The local expansion gives Cov(X,f(X)) approximately Sigma*grad(m)(mu), with the
    transpose used for Cov(f(X),X). This cross-covariance forms the new row and column while the retained
    lag block shifts forward. If predicting a future noisy output rather than the latent function value,
    add its independent observation-noise variance once to the new output diagonal. Training noise already
    used in the GP posterior and this future output noise play different roles. Using only independent
    lag variances is a different approximation.
  evidence:
  - source_id: girard-tr2002
    locator: Sections 4.1–4.2, PDF pp. 11–13; Equations 32–35 and the lag covariance matrix, PDF p. 13
    relation: supports
- claim_id: mean-curvature
  kind: limitation
  statement: 'A second-order Taylor expansion of the conditional variance is not a general assertion of
    second-order accuracy for the predictive moments: the source retains only a first-order expansion
    of the conditional mean. A curator unit-kernel example conditioned on the exact observation f(0)=1
    and X~N(0,s) gives Taylor mean 1 and Taylor variance s, whereas exact integration gives mean 1/sqrt(1+s)
    and variance s/(1+s). The mean error is of order s as s approaches zero, even though the posterior-mean
    gradient vanishes at the expansion point. At Sigma=0 the formulas reduce to ordinary fixed-input GP
    prediction.'
  evidence:
  - source_id: girard-tr2002
    locator: Sections 3.3–3.4, Equations 14–22, PDF pp. 8–9
    relation: supports
  - source_id: girard2002
    locator: Section 3.1, exact squared-exponential integrals, Equations 10–13, PDF p. 4
    relation: supports
- claim_id: variance-validity
  kind: limitation
  statement: The local Taylor variance is not guaranteed nonnegative for arbitrary input uncertainty.
    A curator calculation for a unit-amplitude, unit-lengthscale squared-exponential GP conditioned on
    an exact f(0)=0, with input mean 1 and variance 2, gives Taylor variance 1-3/e<0 while the exact integrated
    variance is 1-exp(-1/5)/sqrt(5)>0. This deliberately nonlocal case limits an unrestricted covariance
    claim; it is not an empirical reproduction or a refutation of a justified small-uncertainty approximation.
    An invalid computed covariance cannot be interpreted as a Gaussian predictive distribution without
    a separately justified correction.
  evidence:
  - source_id: girard-tr2002
    locator: Section 3.4, Equations 18–22, PDF p. 9
    relation: supports
  - source_id: girard2002
    locator: Section 3.1, Equations 8–13, PDF pp. 3–4
    relation: supports
- claim_id: distinct-exact-and-correlated-methods
  kind: scope
  statement: The local Taylor procedure is distinct from analytic squared-exponential Gaussian-input moment
    integration, which the technical report lists as future work and the proceedings paper presents separately.
    Moreover, propagating a Gaussian lag covariance while repeatedly treating the current input as independent
    of the uncertain function does not preserve all dependence created by one shared dynamics function
    across a trajectory. The later correlation-aware trajectory approaches address that different approximation;
    this record does not identify them with the earlier local Taylor method.
  evidence:
  - source_id: girard-tr2002
    locator: Conclusion and future work, PDF p. 17
    relation: supports
  - source_id: girard2002
    locator: Section 3.1, Taylor Equations 8–9 versus exact Equations 10–13, PDF pp. 3–4
    relation: supports
  - source_id: hewing2020
    locator: Introduction and Sections 2–3, PDF pp. 1–4; proposed trajectory methods, PDF pp. 5–7
    relation: supports
