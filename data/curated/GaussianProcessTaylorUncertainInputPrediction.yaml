limitations:
- The method is a local approximation requiring sufficient smoothness and input uncertainty small enough
  for the retained expansions to be useful. Gaussian test-input independence, fixed training locations/data
  and fixed hyperparameters are explicit assumptions; uncertain training locations and hyperparameter
  integration are not solved here.
- The first-order mean omits the curvature term 0.5*tr(H_m*Sigma). The scalar negative-variance example
  also prevents a universal positive-semidefinite covariance claim. No general error bound, calibration
  guarantee or automatic covariance-repair procedure is asserted.
- 'The technical report changes its squared-exponential width notation: early widths are lengthscales
  in a denominator, while Equation 25 uses inverse squared lengthscales. Any implementation must choose
  one consistent parameterization. The record uses posterior derivatives directly and does not copy incompatible
  width symbols across sections.'
- Full lag covariance handles correlation between uncertain regressor components, but does not retain
  the complete shared-function trajectory dependence. Gaussian closure also omits higher moments. A local
  covariance formula is not exact nonlinear trajectory propagation.
- The source forecasting mean can coincide with a mean-only rollout because this particular mean approximation
  is m(mu); the covariance correction changes the uncertainty estimate. Source comparisons on synthetic
  dynamics and pH data do not establish universal accuracy, superiority or calibrated coverage, and their
  numerical results are not curated here.
- The exact-observation unit-kernel examples are curator analytic checks, not fitted-model or benchmark
  reproductions. No author implementation, training, paid provider or stochastic simulation was run. The
  record remains DRAFT after author self-review.
