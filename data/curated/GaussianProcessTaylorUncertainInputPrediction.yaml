id: AIMech:GaussianProcessTaylorUncertainInputPrediction
name: Taylor approximation for uncertain-input Gaussian-process prediction
aliases:
- Taylor Gaussian-process uncertainty propagation
concept_kind: algorithm
definition: A local Gaussian-process prediction algorithm that expands a fixed posterior mean to first
  order and its latent variance to second order about the mean of a prescribed Gaussian test input, integrates
  those expansions, and uses the resulting approximate moments for a Gaussian predictive representation
  and iterative covariance propagation.
identity_notes: 'Compared all 442 pinned AIO IDs, labels and scoped synonyms and 541 native IDs, names
  and aliases against the proposed ID, name, descriptive alias and Taylor uncertain-input GP terms: no
  normalized identity match. Ignored- and hidden-inclusive full-text searches in the recovery, older discovery
  and original Documents checkouts returned 98, 0 and 0 lines. All 56 distinct matched strings were read,
  including the full generated search-index match; they describe the pending Taylor lead or the already
  represented exact Gaussian-input integration procedure. Read 37 semantic AIO rows, 77 native name/definition
  neighbors, six full annotated CLASS nodes with incident edges/generated records and five complete contextual
  native records. The scoped method approximates posterior mean and variance functions by local Taylor
  expansions before integrating over a Gaussian test input. It differs from exact squared-exponential
  input integration, generic GP regression, derivative observations used as training data and correlation-aware
  trajectory linearization. Absence is bounded to the inspected pin and maintained corpus; the alias does
  not claim all GP uncertainty propagation methods are identical.'
