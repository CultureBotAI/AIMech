claims:
- claim_id: method
  kind: mechanism
  statement: Generate d≥2 augmented views of each of N images and pass them through a shared encoder and
    projection head. For a whitening group of m projected vectors in R^p, center by the group mean and
    compute sample covariance Sigma=sum_i(v_i−mean)(v_i−mean)^T/(m−1). When Sigma is positive definite,
    factor Sigma=L L^T and transform each vector to z_i=L^−1(v_i−mean). For nonzero z normalize u_i=z_i/||z_i||
    and minimize the average ||u_i−u_j||^2 over all N d(d−1)/2 unordered same-image view pairs. Backpropagate
    through both views and whitening, including its batch statistics. In batch slicing, place each image’s
    views in separate view partitions, apply the same random image-index permutation to every partition,
    split each into groups, and whiten each group separately; compare corresponding positive views afterward.
    Repeat slicing and average losses if configured. The procedure requires no negative-pair loss, prediction
    head, momentum teacher or stopped target.
