claims:
- claim_id: method
  kind: mechanism
  statement: For nonnegative unnormalized density f with finite positive integral Z, introduce y and the
    joint density 1/Z on {(x,y):0<y<f(x)}. Its x marginal is f(x)/Z. At a current supported x draw y uniformly
    from (0,f(x)), then update x with a kernel leaving uniform measure on S_y={x:f(x)>y} invariant. An
    independent uniform draw from S_y is one option but is often unavailable; a valid Markov update within
    the slice can replace it. Discarding y recovers a chain with the desired x marginal under the construction’s
    invariance conditions.
