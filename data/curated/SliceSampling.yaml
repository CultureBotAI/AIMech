name: Slice sampling
definition: An auxiliary-variable Monte Carlo method that augments a target density with a uniform height
  below its graph and updates the state using a transition preserving the uniform distribution on the
  resulting density slice.
concept_kind: algorithm
identity_notes: This is the single-height construction and its valid within-slice transitions, not a claim
  that every implementation draws independently and uniformly from an entire slice. Univariate stepping-out
  and doubling algorithms are distinct concrete variants. Multiple-auxiliary-variable, reflective and
  overrelaxed extensions require their own mechanism descriptions. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive
  full-checkout searches found prior discovery leads for Gibbs and slice sampling plus unrelated environment
  substring hits, not existing concept records. Existing HMM/MRF models and general Metropolis–Hastings
  were inspected to distinguish model, general transition and specialized algorithm scope.
limitations:
- The target must be proper, and the density and slice updates must be implemented on their valid support.
  A random move that merely stays inside the slice need not preserve its uniform distribution.
- Local interval search need not find the entire slice, especially when it has disconnected components.
  Its acceptance and shrinkage rules determine validity and exploration.
- Target invariance does not alone establish ergodicity or efficient movement between modes. The retained
  states need not be independent.
- Neal’s 2000 report is the inspected version. A later 2003 journal publication was located, but no equivalence
  of all version details is asserted.
- No universal advantage over Gibbs or Metropolis, automatic elimination of every tuning parameter, or
  numerical benchmark result is claimed.
