id: AIMech:PolytroponModularSkillAllocation
name: Polytropon (Latent Task-Skill Allocation for Modular Multitask Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A modular multitask learning algorithm that assumes each task T_i is associated with a variable-size subset of latent discrete skills from a shared inventory S (|S| << |T|) and jointly learns, in an end-to-end fashion with a two-speed learning rate or Indian Buffet Process prior, a layer-specific Gumbel-sigmoid relaxed binary task-skill allocation matrix Z_hat in [0, 1]^{|T| x |S|} and a matrix Phi of skill-specific parameter-efficient adaptations (such as Low-Rank Adapters or Lottery-Ticket Sparse Fine-Tuning) superimposed onto a shared base parameterization theta_0 via row-normalized averaging theta_i = theta_0 + sum_{S_j} Phi_{j,*} (z_hat_{i,j} / sum_{S_k} z_hat_{i,k}).
identity_notes: Introduced by Edoardo M. Ponti, Alessandro Sordoni, Yoshua Bengio, and Siva Reddy (2022/ICLR 2023, arXiv:2202.13914; official implementation github.com/McGill-NLP/polytropon, referred to as SKILLED / Polytropon). Distinct from MoE and MoLE (AIMech Round 686), which route tokens via competitive softmax/top-k gating conditioned on the input rather than learning a non-competitive variable-subset binary soft partition Z over skills conditioned on the task, and distinct from HyperFormer (AIMech Round 703), which entangles task knowledge inside a continuous hypernetwork rather than recombining discrete modular skill parameterizations.
aliases:
- Polytropon
- Skilled Latent-Skill Multitask Model
- Gumbel-Sigmoid Task-Skill Allocation with Modular LoRA Skills
