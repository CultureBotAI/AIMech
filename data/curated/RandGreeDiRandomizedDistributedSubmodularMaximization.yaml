claims:
- claim_id: r361-claim-lovasz-extension-decomposition-and-monotone-hereditary-bound
  kind: mechanism
  statement: 'For any hereditary constraint I subseteq 2^V and monotone submodular function f where Greedy is an alpha-approximation and Alg is a beta-approximation, defining p_e = Pr_{A~V(1/m)}[e in Greedy(A union {e})] for e in OPT and 0 otherwise, greedy stability (Lemma 2: Greedy(V_i) = Greedy(V_i union O_i) for O_i = {e in OPT : e notin Greedy(V_i union {e})}) and Lovasz extension convexity/homogeneity (Lemma 1) imply E[f(S_i)] >= alpha * f^-(1_OPT - p) (Lemma 3) and E[f(Alg(S))] >= beta * f^-(p) (Lemma 4); combining these via f^-(p) + f^-(1_OPT - p) >= f^-(1_OPT) = f(OPT) proves that RandGreeDi achieves an expected (alpha*beta)/(alpha + beta) approximation (Theorem 5), and alpha/2 when Alg = Greedy (Corollary 6: (1 - 1/e)/2 for cardinality, 1/4 for matroid, ~0.17 for knapsack, and 1/(2(p+1)) for p-systems, Table 1).'
  evidence:
  - source_id: r361-primary-pdf
    locator: Section 1.2-1.3, Table 1 and Lemma 1, pp. 3-5; Section 2, Algorithm 1 and Lemma 2, pp. 5-6; Section 3, Algorithm 2, Lemmas 3-4, Theorem 5, and Corollary 6, pp. 6-8
    relation: supports
- claim_id: r361-claim-nonmonotone-nmrandgreedi-hereditary-approximation
  kind: mechanism
  statement: 'For non-negative non-monotone submodular maximization subject to a hereditary constraint I where Greedy satisfies the greedy property (GP) f(Greedy(V)) >= alpha * f(Greedy(V) union S) for all S in I, running two disjoint greedy passes S_i^1 = Greedy(V_i) and S_i^2 = Greedy(V_i \ S_i^1) on each machine i satisfies f(S_i^1) + f(S_i^2) >= alpha * f(O_i) and E[max{f(S_i^1), f(S_i^2)}] >= (alpha/2) * f^-(1_OPT - p) (Lemma 7), while the second-round reducer satisfies E[f(Alg(S))] >= beta * f^-(p) (Lemma 8), yielding an expected (alpha*beta)/(alpha + 2*beta) approximation for NMRandGreeDi (Theorem 9) and alpha/(4 + 2*alpha) when Alg combines two Greedy passes with Buchbinder et al.''s 1/2-approximate Double Greedy algorithm (Corollary 10: ~0.12 for cardinality, 1/10 for matroid, and 1/(2 + 4(p+1)) for p-systems, Table 1).'
  evidence:
  - source_id: r361-primary-pdf
    locator: Section 1.2, Table 1, p. 4; Section 4, Lemmas 7-8, Theorem 9, and Corollary 10, pp. 8-12
    relation: supports
- claim_id: r361-claim-tight-deterministic-greedi-analysis-and-lower-bound
  kind: mechanism
  statement: Regardless of how elements are partitioned across m machines, the union E = union_{j in M} E_j of machine-level greedy solutions under cardinality constraint k contains a k-element subset OPT_tilde subseteq E satisfying f(OPT) <= 2*sqrt(k)*f(OPT_tilde) (Theorem 11, Lemmas 12-13), proving that deterministic GreeDi achieves a worst-case ((1 - 1/e)/(2*sqrt(k))) approximation (and 1/Theta(min{sqrt(k), m}), Corollary 14); this bound is tight up to constants via an explicit Max k-Coverage family on m = ell^2 + 1 machines with k = ell + ell^2 where deterministic GreeDi achieves at most (2*ell^2)/(ell^2 + ell^3) = 2/(1 + ell) approx 1/sqrt(k) of OPT (Appendix B).
  evidence:
  - source_id: r361-primary-pdf
    locator: Section 1.1, Footnote 1, p. 2; Appendix A, Theorem 11, Lemmas 12-13, and Corollary 14, pp. 16-18; Appendix B, pp. 18-19
    relation: supports
