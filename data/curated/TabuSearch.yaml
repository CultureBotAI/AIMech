claims:
- claim_id: method
  kind: mechanism
  statement: Maintain the current solution, the best solution found, a neighborhood of applicable moves
    and memory-based tabu conditions on moves or their attributes. In the simple cost-minimizing version,
    choose the best admissible candidate under the configured evaluator even when every admissible move
    worsens the current objective, move there, and update the best-so-far record only on improvement.
    Update tabu memory so recent reversals or selected attributes remain restricted for a declared tenure,
    then expire restrictions according to that rule. Attribute-based restrictions can exclude unvisited
    solutions that share an attribute with a recent move. In the aspiration extension, a move satisfying
    the declared aspiration criterion can be admissible despite tabu status. Candidate sampling or approximate
    evaluation may replace full-neighborhood minimization. Intermediate-term memory can intensify search
    around features of good solutions, while longer-term frequency information can diversify it toward
    underexplored features; these are framework components whose concrete rules must be specified.
