name: Tabu search
definition: A memory-guided optimization framework that steers a search trajectory by making selected
  moves temporarily inadmissible from search history, allowing non-improving moves and, where specified,
  aspiration-based overrides.
concept_kind: algorithm
identity_notes: 'This record denotes the tabu-search framework through the original Part I formulation.
  It is not merely a list of visited nodes, Ant System’s per-tour feasibility list, or a global best-first
  frontier. Recency restrictions, aspiration and longer-term memory are configurable mechanisms; no single
  fixed tenure or exact prohibition rule defines all variants. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 301 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 37 and 37 lines
  respectively. All 13 unique hit contents were inspected: prior local-search candidate leads, Ant System’s
  feasibility-list distinction, and their saved reports/reviews. These were references to methods rather
  than existing candidate records. Six exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and seven native neighboring mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- Finite recency memory is not a proof of cycle freedom or eventual global optimality. Attribute-based
  restrictions can exclude useful unvisited moves, and aspiration overrides must be designed with their
  effect on cycling in mind. The Part II finiteness construction was not inspected or generalized here.
- The simple pseudocode stops when no admissible move exists, while the subsequent prose describes releasing
  oldest restrictions to restore a move. These are distinct handling choices; the conceptual record does
  not silently present them as one fully specified executable algorithm.
- Tabu tenure, attributes, aspiration thresholds, candidate lists, move connectivity, initialization and
  stopping affect the search. Choosing the best currently admissible move does not imply monotonic objective
  improvement or a globally optimal final solution.
- The source also discusses probabilistic, strategic-oscillation and mixed-integer extensions. This record
  does not instantiate all variants or curate performance comparisons. Memory-based search need not be
  a reinforcement-learning task.
