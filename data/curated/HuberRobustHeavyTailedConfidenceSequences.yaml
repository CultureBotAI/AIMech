  rationale: Robust Catoni and Kelly supermartingales operate sequentially over filtrations (F_t)_{t>=0}
    where each observation X_t may be drawn from a history-dependent distribution in B_TV(P, varepsilon)
    (Section 3.1, line 83; AIO:TimeSeriesAnalysis).
limitations:
- 'By Lemma 1 and Lemma 6, no (varepsilon, 1 - alpha)-robust confidence interval or confidence sequence
  over M_{sigma^2}^2 under TV contamination radius varepsilon > 0 can shrink to zero width as t -> infinity:
  any valid RCS must have diameter at least sigma sqrt(varepsilon) with probability >= 1 - 2 alpha, and
  similarly Omega(kappa^{1/p} varepsilon^{(p-1)/p}) over M_kappa^p for 1 < p < 2 (Section 2, Section 5.2).'
- Achieving the minimax O(sigma sqrt(varepsilon)) width requires a known upper bound sigma^2 on the uncorrupted
  variance (or kappa on the p-th central moment) and a known upper bound varepsilon on the total-variation
  contamination fraction in order to set the constant tuning parameter lambda = sqrt(varepsilon)/(2 sigma)
  (or lambda = (varepsilon / kappa)^{1/p}); furthermore, under lambda = sqrt(varepsilon)/(2 sigma), the
  per-step threshold log(1 + 13 varepsilon / 8) exceeds the influence cap log 2 whenever varepsilon >=
  8/13 (and Theorem 2's high-probability bound requires varepsilon <= 1/7 and t > 4 varepsilon^{-1} log(4/(alpha
  delta))) (Sections 3.3 and 5.1).
- The sequential robust confidence sequence model (Definition 1) assumes each observation X_t is drawn
  online from a distribution Q_t in B_TV(P, varepsilon); it does not cover an offline post-hoc replacement
  adversary who inspects the entire completed sample (X_1, ..., X_t) before retroactively replacing up
  to varepsilon t points (Definition 2, Section 4).
- All 938 lines of Wang & Ramdas (2023, arXiv:2301.09573) were read. Constructed numerical checks in research/discovery/huber-robust-heavy-tailed-confidence-sequences-boundaries.py
  verify Lemma 1/6 minimax lower bound witness, Lemma 3 bounded narrowest Catoni influence range [1/2,
  2] and supermartingale expectation <= 1 under varepsilon = 1/9 outlier contamination at +1000 vs. unclipped
  Catoni blowup (176.21), Lemma 7 algebraic bounds, Theorem 1/2 0.0% anytime miscoverage and mean width
  7.35 < 28 sigma sqrt(varepsilon) < 135.76 (Lugosi-Mendelson RCI) vs. 100% miscoverage for non-robust
  Catoni and sub-Gaussian CSs, Section 3.3 constant vs. polynomial tuning schedules and Corollary 1 exponential
  test martingale growth, and Section 5.2–5.3 infinite-variance p-moment RCS and bounded Kelly robust
  supermartingale expectations.
