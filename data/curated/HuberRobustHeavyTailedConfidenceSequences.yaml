claims:
- claim_id: tv-contamination-minimax-width-lower-bound-and-robust-catoni-supermartingales
  kind: mechanism
  statement: 'For the class M_{sigma^2}^2 of distributions P with Var_P(X) <= sigma^2 and corrupted data
    X_1, X_2, ... ~ Q in the total-variation ball B_TV(P, varepsilon) = {Q : D_TV(P, Q) <= varepsilon}
    (which strictly contains Huber''s gross-error contamination neighborhood {(1 - varepsilon) P + varepsilon
    N}; Definition 1, Remark 1), Lemma 1 and Lemma 6 establish via the two-point witness P_1 = delta_0
    and P_2 = (1 - varepsilon) delta_0 + varepsilon delta_{sigma / sqrt(varepsilon)} in M_{sigma^2}^2
    (with |mu(P_1) - mu(P_2)| = sigma sqrt(varepsilon) and D_TV(P_1, P_2) = varepsilon) that any (varepsilon,
    1 - alpha)-RCI or RCS with alpha in (0, 1/2) must have diameter >= sigma sqrt(varepsilon) with probability
    at least 1 - 2 alpha > 0; to achieve time-uniform validity over B_TV(P, varepsilon), Lemma 3 pairs
    Catoni''s narrowest bounded influence function phi(x) in [-log 2, log 2] (satisfying -log(1 - x +
    x^2/2) <= phi(x) <= log(1 + x + x^2/2) and exp(+-phi(x)) in [1/2, 2] of range 2 - 1/2 = 1.5) with
    the TV integral probability metric bound sup_{f in [c_1, c_2]} |E_P f - E_Q f| = (c_2 - c_1) D_TV(P,
    Q) (Equation 5) to prove E_Q[exp(+-phi(lambda_t(X_t - mu(P))))] <= 1 + lambda_t^2 sigma^2 / 2 + 1.5
    varepsilon, making M_t^{RC} and N_t^{RC} nonnegative supermartingales and CI_t^R a valid (varepsilon,
    1 - alpha)-RCS via Ville''s inequality (Theorem 1).'
