- claim_id: huber-robust-sequential-hypothesis-testing-exponential-e-process-growth
  kind: mechanism
  statement: 'For the sequential composite robust mean testing problem H_0 : P in M_{sigma^2}^2, mu(P)
    <= mu_0 versus H_1 : P in M_{sigma^2}^2, mu(P) > mu_0 under corrupted observations X_1, X_2, ... ~
    Q in B_TV(P, varepsilon), the one-sided robust Catoni supermartingale M_t^{RC}(mu_0) = prod_{i=1}^t
    [exp(phi(lambda(X_i - mu_0))) / (1 + lambda^2 sigma^2 / 2 + 1.5 varepsilon)] with lambda = sqrt(varepsilon)/(2
    sigma) controls the sequential Type-I error below alpha across all stopping times via Ville''s inequality
    and, whenever the true mean exceeds the irreducible ambiguity margin mu(P) > mu_0 + 14 sigma sqrt(varepsilon)
    for varepsilon in (0, 1/7], grows exponentially fast with asymptotic rate at least varepsilon / 4:
    for any delta in (0, 1), P_Q(t^{-1} log M_t^{RC}(mu_0) >= varepsilon / 4 - t^{-1} log(2/delta)) >=
    1 - delta/2 for all t >= 1 (Section 5.1, Corollary 1).'
  evidence:
