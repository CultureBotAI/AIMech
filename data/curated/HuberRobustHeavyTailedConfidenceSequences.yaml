id: AIMech:HuberRobustHeavyTailedConfidenceSequences
name: Huber-robust heavy-tailed confidence sequences
aliases:
- Huber-Robust Confidence Sequence
- TV-Contaminated Heavy-Tailed Robust Confidence Sequence
- Robust Catoni Supermartingale Confidence Sequence
- Infinite-Variance p-Moment Huber-Robust Confidence Sequence
- Huber-Robust Kelly Betting Supermartingale Confidence Sequence
concept_kind: mathematical_method
definition: 'A family of nonasymptotic, anytime-valid sequential confidence sequences (Wang & Ramdas 2023,
  AISTATS / PMLR 206:9662–9679) for the mean mu(P) of an uncorrupted distribution P with bounded variance
  Var_P(X) <= sigma^2 (or bounded p-th central moment E_P[|X - mu(P)|^p] <= kappa for 1 < p <= 2) when
  observations X_1, X_2, ... are drawn sequentially from an adversarially contaminated distribution Q
  in the total-variation neighborhood B_TV(P, varepsilon) = {Q : D_TV(P, Q) <= varepsilon} (strictly generalizing
  Huber''s gross-error contamination model Q = (1 - varepsilon) P + varepsilon N with no moment assumptions
  on N), constructed by pairing the bounded narrowest Catoni influence function phi(x) in [-log 2, log
  2] (where exp(+-phi(x)) lies in [1/2, 2] of range 1.5, or phi_p(x) in [-log p, log p] with exp(+-phi_p(x))
  in [1/p, p] of range p - 1/p) with the total-variation integral probability metric shift to form the
  nonnegative robust Catoni supermartingales M_t^{RC} = prod_{i=1}^t [exp(phi(lambda_i(X_i - mu(P))))
  / (1 + lambda_i^2 sigma^2 / 2 + 1.5 varepsilon)] and N_t^{RC} = prod_{i=1}^t [exp(-phi(lambda_i(X_i
  - mu(P)))) / (1 + lambda_i^2 sigma^2 / 2 + 1.5 varepsilon)], whose Ville inversion CI_t^R = {m in R
  : |sum_{i=1}^t phi(lambda_i(X_i - m))| <= sum_{i=1}^t log(1 + lambda_i^2 sigma^2 / 2 + 1.5 varepsilon)
  + log(2/alpha)} under constant tuning lambda = sqrt(varepsilon)/(2 sigma) achieves the minimax-optimal
  high-probability diameter O(sigma sqrt(varepsilon)) (specifically <= 28 sigma sqrt(varepsilon) for varepsilon
  <= 1/7 and <= (14 p / (p - 1)) kappa^{1/p} varepsilon^{(p-1)/p} for 1 < p < 2) and non-trivial finite
  breakdown point varepsilon < 8/13.'
identity_notes: No normalized identity match for Huber-robust heavy-tailed confidence sequences across
  all 442 pinned AIO records and 578 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 183 artifacts
  where Wang & Ramdas (2023, AISTATS / PMLR 206:9662-9679, arXiv:2301.09573) was queued as a pending frontier
  lead. Distinct from AIMech:CatoniStyleHeavyTailedConfidenceSequences (Wang & Ramdas 2023, Stochastic
  Processes and their Applications 163:168-202, arXiv:2202.01250), which assumes uncontaminated observations
  E[X_t | F_{t-1}] = mu with time-decaying tuning lambda_t = Theta(1/sqrt(t log t)) and unclipped influence
  functions that blow up under a single adversarial outlier Distribution N with infinite moments, whereas
  HuberRobustHeavyTailedConfidenceSequences enforces bounded influence phi(x) in [-log 2, log 2] (so exp(+-phi)
  has bounded TV sensitivity 1.5), incorporates the explicit TV-contamination compensation +1.5 varepsilon
  in the supermartingale denominator, and uses constant tuning lambda_t = sqrt(varepsilon)/(2 sigma) to
  match the non-vanishing information-theoretic lower bound sigma sqrt(varepsilon) over B_TV(P, varepsilon).
