  rationale: Huber-robust heavy-tailed confidence sequences guarantee nonasymptotic time-uniform coverage
    across arbitrary stopping times even under total-variation adversarial contamination and heavy tails,
    preventing false-positive inflation from continuous sequential peeking (AIO:DataDredgingBias).
