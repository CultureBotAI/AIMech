      Corollary 1
    relation: supports
- claim_id: infinite-variance-p-moment-robust-cs-and-bounded-robust-kelly-betting
  kind: mechanism
  statement: When P has infinite variance but finite p-th central moment E_P[|X - mu(P)|^p] <= kappa for
    known 1 < p < 2 (P in M_kappa^p), replacing phi with the truncated p-Catoni influence function phi_p(x)
    in [-log p, log p] (satisfying -log(1 - x + |x|^p/p) <= phi_p(x) <= log(1 + x + |x|^p/p) with exp(+-phi_p(x))
    in [1/p, p] of range p - 1/p) makes M_t^{RC,p} = prod_{i=1}^t [exp(phi_p(lambda_i(X_i - mu(P)))) /
    (1 + lambda_i^p kappa / p + (p - 1/p) varepsilon)] and N_t^{RC,p} nonnegative supermartingales over
    B_TV(P, varepsilon) (Lemma 5), yielding the (varepsilon, 1 - alpha)-RCS CI_t^{R,p} (Theorem 4) whose
    constant-tuned width (lambda_t = (varepsilon / kappa)^{1/p}) satisfies P_Q(diam(CI_t^{R,p}) <= (14
    p / (p - 1)) kappa^{1/p} varepsilon^{(p-1)/p}) >= 1 - delta for 0 < varepsilon <= (p - 1)/(7 p) and
    t >= varepsilon^{-1} log(4/(alpha delta)) (Theorem 5, Lemmas 8–11, matching the Omega(kappa^{1/p}
    varepsilon^{(p-1)/p}) lower bound up to constants); in the sibling case where both P and Q are supported
    on [0, 1], Theorem 6 proves that L_t = prod_{i=1}^t (1 + lambda_i(X_i - mu(P)) - varepsilon |lambda_i|)
    is a nonnegative Huber-robust Kelly betting supermartingale for any predictable lambda_i in [-(1 -
    mu(P) + varepsilon)^{-1}, (mu(P) + varepsilon)^{-1}].
  evidence:
