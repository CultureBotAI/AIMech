- claim_id: constant-tuning-minimax-width-concentration-and-breakdown-point
  kind: mechanism
  statement: Whereas uncontaminated confidence sequences use decaying weights lambda_t = Theta(t^{-1/2}),
    under varepsilon > 0 any polynomially decaying or growing schedule lambda_t = 0.5 varepsilon^{1/2}
    sigma^{-1} t^u with u != 0 causes the robust confidence sequence width to diverge as t grows (either
    because lambda_t -> 0 inflates the root scale for u < 0 or because sum_{i=1}^t log(1 + lambda_i^2
    sigma^2 / 2 + 1.5 varepsilon) exceeds the saturation ceiling t log 2 for u > 0), whereas constant
    tuning lambda_1 = ... = lambda = sqrt(varepsilon)/(2 sigma) (lambda^2 = varepsilon / (4 sigma^2))
    guarantees for all 0 < varepsilon <= 1/7 and t > 4 varepsilon^{-1} log(4 / (alpha delta)) that P_Q(diam(CI_t^R)
    <= 28 sigma sqrt(varepsilon)) >= 1 - delta (Theorem 2, proved via Lemma 7's bounds A(x) <= 6.5 x and
    B(x) <= 7 x on [0, 1/7]), matching the sigma sqrt(varepsilon) lower bound up to constant 28, strictly
    improving upon the >= 96 sqrt(2) sigma sqrt(varepsilon) RCI width simulated from Lugosi & Mendelson's
    (2021) sample-split trimmed mean RRCI via coupling (Definition 2, Lemma 4, Theorem 3), and achieving
    a non-trivial finite breakdown point varepsilon < 8/13 approx 61.5% (since log(1 + 13 varepsilon /
    8) < log 2 iff varepsilon < 8/13).
