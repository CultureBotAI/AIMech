claims:
- claim_id: deltalora-consecutive-low-rank-product-delta-weight-propagation
  kind: mechanism
  statement: After K initial warm-up iterations, Delta-LoRA updates the pretrained weight matrix W^{(t)} at each step via W^{(t+1)} = W^{(t)} + lambda * (alpha/r) * (A^{(t+1)} B^{(t+1)} - A^{(t)} B^{(t)}), propagating low-rank adapter updates into W without computing or storing dense gradients or AdamW momentum buffers for W.
  evidence:
  - source_id: r665-primary-pdf
    locator: Section 4.1 (Update the Delta of Low-Rank Matrices on Pre-Trained Weights), pp. 4-5, Equations (4)-(6) & Algorithm 1
    relation: supports
- claim_id: deltalora-dropout-removal-gradient-alignment
  kind: mechanism
  statement: Because placing a Dropout operator Drop(h_i) before A B yields g_{AB} = (dL/dh_{i+1}) Drop(h_i)^T != (dL/dh_{i+1}) h_i^T = g_W, Delta-LoRA removes the Dropout layer from the low-rank branch so that g_{AB} and g_W share the exact same outer-product structure and also eliminates intermediate dropout activation storage.
  evidence:
  - source_id: r665-primary-pdf
    locator: Section 4.2 (The Structure of Our Delta-LoRA), p. 6, Equation (7)
    relation: supports
- claim_id: deltalora-application-nlg-and-glue-nlu-benchmarks
  kind: application
  statement: Across E2E NLG, WebNLG 2017, XSum summarization with GPT-2 and BART, and eight GLUE natural language understanding tasks with RoBERTa-base, Delta-LoRA consistently outperforms LoRA, AdaLoRA, and DyLoRA at matched trainable parameter counts and memory footprints.
  evidence:
  - source_id: r665-primary-pdf
    locator: Section 5 (Experiments), Tables 1-6, pp. 6-9
    relation: supports
- claim_id: deltalora-limitation-in-place-mutation-of-pretrained-weights
  kind: limitation
  statement: Because Delta-LoRA mutates the base weight matrix W^{(t)} in place during training rather than keeping W_0 frozen, multiple task adaptations cannot share an unmodified in-memory base weight tensor during training, and the surrogate update Delta_AB is only a first-order approximation (-eta A^{(t)} g_hat_B - eta g_hat_A B^{(t)}) rather than the exact AdamW-normalized full-matrix gradient.
  evidence:
  - source_id: r665-primary-pdf
    locator: Section 4.1 & Appendix A.1 (The Expansion of Delta AB), pp. 5, 14, Equation (8)
    relation: supports
