id: AIMech:DeltaLoRA
name: Delta-LoRA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning algorithm that simultaneously optimizes a pair of low-rank adapter matrices with an adaptive optimizer and updates the full pretrained weight matrix at each post-warmup step using a scaled difference of consecutive low-rank matrix products, while omitting dropout inside the low-rank branch so the gradient with respect to the base weights equals the gradient with respect to the adapter product.
identity_notes: 'Distinct from AIMech:LowRankAdaptation (LoRA), which keeps the pretrained matrix W frozen throughout training and restricts the cumulative weight update to a rank-r subspace, and from AIMech:ReLoRA, which periodically merges A B into W and reinitializes the low-rank factors with partial optimizer resets. Delta-LoRA (Bojia Zi, Xianbiao Qi, Lingzhi Wang, Jianan Wang, Kam-Fai Wong, and Lei Zhang, arXiv:2309.02411) observes that when the Dropout layer inside the LoRA branch is removed, the forward transformation h_{i+1} = W h_i + (alpha/r) A B h_i yields identical partial derivatives g_W = dL/dW = (dL/dh_{i+1}) h_i^T = dL/d(AB) = g_{AB}. Rather than allocating O(c d) gradient and first/second-moment optimizer buffers for W, Delta-LoRA updates A and B via AdamW and uses the consecutive step difference Delta_AB = A^{(t+1)} B^{(t+1)} - A^{(t)} B^{(t)} as a memory-free surrogate update direction for W after K warm-up steps: W^{(t+1)} = W^{(t)} + lambda * (alpha/r) * (A^{(t+1)} B^{(t+1)} - A^{(t)} B^{(t)}).'
aliases:
- Delta Low-Rank Adaptation
- Delta-LoRA High-Rank Parameter Fine-Tuning
