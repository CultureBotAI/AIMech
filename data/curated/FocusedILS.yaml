name: FocusedILS
definition: A ParamILS algorithm-configuration method that adaptively extends paired evaluation prefixes
  until one configuration dominates the other, and allocates bonus evaluations to configurations that
  win the comparison.
concept_kind: algorithm
identity_notes: FocusedILS is the adaptive comparison instantiation of ParamILS. Its domination relation
  compares common instance/seed prefixes and requires the dominating configuration to have at least as
  many cached runs. It is not a fixed-sample BasicILS comparison, a Friedman significance test, or ROAR’s
  uniform proposal method with a different intensification routine. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 265 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  20 lines in the worktree and 25 in main. These were prior candidate leads, source references, neighboring-method
  mentions and five unrelated ROAR namespace entries in ignored dependencies, not existing records for
  these identities. Seven exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring native
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The 2009 formulation has a finite configuration domain; numerical parameters require discretization.
  Objective, run cutoff and training-instance distribution affect the selected configuration. Independent
  held-out evaluation is needed to assess generalization; no universal solver speedup is asserted.
- The printed first-improvement loop accepts the supplied non-strict comparison. Equal-cost neighboring
  configurations can therefore cycle under a literal reading; this record does not assert unconditional
  termination of that loop or executable equivalence to a software release.
- Adaptive capping is a separable acceleration, not the defining identity of this search/comparison method.
  Section4 describes trajectory-preserving and more aggressive alternatives. Procedure4 prints a max operation
  inconsistent with shortening the run cutoff described in the prose, and uses inconsistent cutoff symbols;
  the printed routine is not treated as verified executable code.
- The paper’s asymptotic statements require a finite space, positive-probability random restarts, consistent
  cost estimates and indefinitely continuing iterations/evaluations. They are not a finite-budget optimality
  certificate. Repeated sampling from a finite training set does not by itself establish consistency for
  a different population of instances.
