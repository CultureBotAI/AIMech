claims:
- claim_id: method
  kind: mechanism
  statement: Within the ParamILS search framework, compare configurations using cached target-algorithm
    runs on a common ordered instance/seed sequence. A configuration dominates another when it has at
    least as many runs and its estimated cost over the other’s full prefix is no greater. Begin a comparison
    by extending the shorter prefix by one run, or both when their lengths are equal; continue extending
    until either configuration dominates. Procedure3 increments its global bonus counter once per comparison
    and again when the initial run counts tie. When the first configuration dominates, add the accumulated
    number of bonus evaluations to it and reset the counter; otherwise return the unsuccessful comparison
    without that reset. Keep an incumbent while the search continues.
