    so the inspected AIO artificial-neural-network class is broader. DeepFeedForwardNetwork requires multiple
    hidden layers through its parent and is not a necessary superclass of the original one-hidden-layer
    construction. Perceptron is defined as a binary linear classifier, and MixtureofExpertsLLM has a distinct
    language-model and sparse-routing scope.
