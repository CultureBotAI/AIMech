name: Mixture density network
definition: A neural conditional-density architecture whose input-dependent outputs parameterize the mixing
  weights and component distributions of a finite mixture over target variables.
concept_kind: architecture
identity_notes: 'This is Bishop’s combined neural-network and mixture-density construction. It predicts
  a conditional distribution, not only a conditional mean, and does not require the output density to
  be unimodal. The report’s worked model uses a feed-forward network and isotropic Gaussian components;
  other component families or covariance parameterizations are choices within the broader construction.
  It is distinct from an unconditional fitted Gaussian mixture, a generic feed-forward classifier and
  a sparse mixture-of-experts large language model. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 349 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 5 and 5 lines respectively.
  All 3 unique matched line contents were inspected in full: the prior NADE-variant lead, RNADE source
  URL and previous review exclusion, not existing candidate records. Exact checkout counts and differences
  are retained in the ledger. Seventeen exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and five full native neighboring records were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- Exponentiation makes the scale positive for finite real outputs but does not bound it away from zero
  or prevent likelihood concentration as a component scale approaches zero. The report’s wording about
  avoiding zero-variance pathologies is interpreted with this mathematical qualification.
- The report sometimes calls sigma a variance, but Equation (23) uses sigma as a standard deviation. Its
  displayed population Equation (40) omits the negative sign required by the preceding negative-log-likelihood
  objective; Equations (43) and (47) omit dimension factors if read as general isotropic multivariate
  scale and total variance formulas. Those printed formulas are not adopted as general identities.
- A mixture’s global mode generally requires optimization. Selecting a component center by peak height
  or weight is an approximation under separation assumptions, not an exact general mode calculation.
- A finite architecture and local optimization do not establish an arbitrary-accuracy fit, calibrated
  uncertainty, successful generalization or global optimality. The network models p(t|x), not p(x), unless
  an additional input model is provided.
- No author implementation, later experimental pages or general approximation theorem was audited; finite
  curator calculations check only the displayed cases.
