claims:
- claim_id: method
  kind: mechanism
  statement: For input x, a neural network outputs parameters defining p(t|x)=sum_i alpha_i(x) phi_i(t|x).
    In the report’s c-dimensional isotropic Gaussian construction, softmax outputs give nonnegative mixing
    weights summing to one, direct outputs give component means, and exponentiated outputs give positive
    standard deviations sigma_i, with covariance sigma_i squared times the identity. The mixture can have
    dependent target coordinates even though coordinates are independent within each isotropic component.
    Minimize the sum of negative log mixture densities over input/target pairs. With responsibilities
    r_i=alpha_i phi_i/p(t|x), the output-logit derivative of one negative log likelihood is alpha_i-r_i;
    the mean derivative is r_i(mu_i-t)/sigma_i squared and the log-scale derivative is r_i(c-||t-mu_i||
    squared/sigma_i squared). Backpropagate these derivatives through the network. Mixture weights are
    conditional component priors before observing t; responsibilities condition on both x and t. The conditional
    mean is the weighted mean of component centers and need not be a mode or a plausible branch of a multivalued
    inverse mapping.
