id: AIMech:IterativeExpansion
name: Iterative expansion
aliases: []
definition: A recursive heuristic tree-search procedure that repeatedly explores a
  lowest-valued child within a bound set by its caller and competing children, initializes
  each generated child with the maximum of its static evaluation and the parent’s
  stored evaluation, and backs up the minimum child value.
concept_kind: algorithm
identity_notes: The current cohort361 prewrite comparison at base add2c806f6729c8599f4d5cfd6d75c7decde006c
  covered 1,243 maintained records (801 native and 442 pinned AIO), 4,927 identity-field
  occurrences and 3,766 normalized values. Candidate-normalized identity matches were
  empty. Four ignored- and hidden-inclusive fixed-string/word-boundary scans produced
  6,732 occurrences across 1,557 distinct matching contents, assessed through three
  attributed reader scopes and exact inherited-wrapper reconstruction. Iterative expansion
  is Russell1992 source-scoped IE with unconditional max(parent stored value, static
  child value) inheritance. Korf RBFS conditionally inherits backed-up values, while
  SRBFS resets children to static values; their monotonic-evaluation correspondence
  is conditional, not a global alias. Generic iterative-expansion wording, IDA* learned
  incremental thresholds and RBFS controlled re-expansion are distinct contexts. No
  global IE abbreviation alias is introduced. Main912 retains 30 citation occurrences,
  seven version/interface questions and two recovered historical search pointers as
  source tracking. Ties, dead ends, exhausted-root behavior, graph/cycle assumptions
  and proof limitations remain explicit.
