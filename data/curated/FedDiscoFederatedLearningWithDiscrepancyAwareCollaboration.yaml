id: AIMech:FedDiscoFederatedLearningWithDiscrepancyAwareCollaboration
name: FedDisco (Federated Learning with Discrepancy-Aware Collaboration)
concept_kind: algorithm
review_status: DRAFT
definition: A federated aggregation algorithm for category-imbalanced and non-IID client datasets (Ye et al. 2023, Sections 3.2-5.2, Proposition 4.1, Theorems 4.4-4.5, Equation 7, Algorithm 1) in which each client k computes the L2 discrepancy d_k = ||r_k - u||_2 (or KL/cosine discrepancy) between its local category distribution r_k in Delta^{C-1} and a target global category distribution u (such as the uniform distribution u_c = 1/C) and the server replaces standard dataset-size aggregation weights n_k = |D_k| / sum_m |D_m| with discrepancy-aware collaboration weights p_k = ReLU(n_k - a d_k + b) / sum_{m=1}^K ReLU(n_m - a d_m + b) (Equation 7) when updating w^{(t+1)} = w^{(t)} - eta sum_{k in S_t} p_k Delta_k^{(t)}, where the one-time privacy-preserving auxiliary transmission of D^{aux}_k = R r_k using a random orthogonal matrix R in R^{C x C} (R^T R = I) preserves exact Euclidean norms ||D^{aux}_k - D^{aux}_u||_2 = ||r_k - u||_2 without revealing raw class counts (Section 5.1, Equation 8).
identity_notes: Distinct from FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization, Wang et al. 2020), which normalizes client updates by their effective number of local SGD steps tau_eff rather than category-distribution discrepancy d_k = ||r_k - u||_2; and distinct from Agnostic Federated Learning (AIMech:AgnosticFederatedLearning, Mohri et al. 2019), which solves a minimax saddle-point problem max_lambda min_w sum_k lambda_k F_k(w) assigning larger weights to high-loss clients rather than down-weighting category-skewed clients via ReLU(n_k - a d_k + b).
