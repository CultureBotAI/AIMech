claims:
- claim_id: r469-gradient-diversity-bound-and-convergence-theorem-mechanism
  kind: mechanism
  statement: Proves that the weighted gradient-to-global discrepancy satisfies ||sum_{k=1}^K p_k nabla F_k(w) - nabla F(w)|| <= A sum_{k=1}^K p_k d_k under class-wise gradient bound ||nabla F_{k,c}(w)|| <= A (Proposition 4.1, Equation 2) and bounds weighted gradient diversity Lambda(w, p) in Theorem 4.4 (Equation 3), yielding the non-convex convergence upper bound of Theorem 4.5 (Equation 4) whose discrepancy terms T_3, T_5 are strictly reduced by shifting simplex mass from high-d_k to low-d_k clients via p_k propto ReLU(n_k - a d_k + b) (Equation 7 & Appendix C.4).
  evidence:
  - source_id: r469-primary-pdf
    locator: Section 4 Theoretical Analysis (Proposition 4.1, Theorems 4.4-4.5, Equations 2-5), pp. 3-5, and Appendix C.1-C.4, pp. 14-21
    relation: supports
- claim_id: r469-orthogonal-projection-privacy-preserving-discrepancy-scope
  kind: scope
  statement: Computes client discrepancy scores in a single pre-training step without revealing local class histograms r_k to the server by having clients multiply r_k by a shared random orthogonal matrix R in R^{C x C} (R^T R = I) and upload D^{aux}_k = R r_k, preserving exact L2 discrepancy ||D^{aux}_k - D^{aux}_u||_2 = sqrt((r_k - u)^T R^T R (r_k - u)) = ||r_k - u||_2 (Section 5.1, Equation 8), and combines modularly with FedAvg, FedProx, FedNova, MOON, and FedDyn.
  evidence:
  - source_id: r469-primary-pdf
    locator: Section 5.1 Discrepancy Estimation (Equation 8) & Section 5.2 Algorithm 1, pp. 5-6
    relation: supports
- claim_id: r469-asymptotic-bias-weight-divergence-tradeoff-limitation
  kind: limitation
  statement: Introduces a non-vanishing O(W_D(n)) asymptotic bias term T_4 = (4 A^2 C / mu) W_D(n)^2 in Theorem 4.5 whenever p != n (W_D(n) = ||p - n||_1 > 0), creating a finite-horizon trade-off between reducing discrepancy drift sum_k p_k d_k and bounding weight divergence ||p - n||_1 controlled by hyperparameters (a, b).
  evidence:
  - source_id: r469-primary-pdf
    locator: Section 4.2 Theorem 4.5 & Practical Guidance (Equations 4-6), pp. 4-5, and Appendix C.4 Equation 54, p. 21
    relation: supports
- claim_id: r469-quantity-and-dirichlet-skewed-federated-benchmarks-application
  kind: application
  statement: Applied to federated image classification under Dirichlet and pathological category-skewed + quantity-skewed partitions on CIFAR-10, CIFAR-100, TinyImageNet, FMNIST, and CINIC-10, consistently improving FedAvg, FedProx, MOON, and FedDyn.
  evidence:
  - source_id: r469-primary-pdf
    locator: Section 6 Experiments (Tables 1-5, Figures 4-6), pp. 6-9
    relation: supports
