claims:
- claim_id: search-procedure
  kind: mechanism
  statement: For a unit-cost graph, process nodes by increasing depth g and evaluate f=g+h with admissible
    h. Under a hypothetical bound U, retain f≤U. If U is the cost of an actual retained incumbent and
    only improvement is needed, f≥U can instead be pruned; failure to improve then preserves the incumbent.
    Memory-saving implementations retain enough information for duplicate detection and use relay nodes
    to reconstruct a found path by recursively solving subproblems.
  evidence:
  - source_id: method-source
    locator: Sections 3–3.5, printed pp. 389–395 / PDF pp. 5–11; Figure 2 and the actual-incumbent versus
      hypothetical-bound distinction on printed pp. 393–394
    relation: supports
- claim_id: resource-scope
  kind: limitation
  statement: The authors consider frontier, sparse-memory and layered duplicate handling, and relay-based
    path recovery. The potential reduction in stored search nodes is problem dependent; neither a fixed
    total-memory bound nor a universal advantage over A* follows. Nonuniform-cost extensions are outlined
    as future work.
  evidence:
  - source_id: resource-scope
    locator: Sections 2.2–3.4, 6.1–6.2; printed pp. 387–392 and 405–406 / PDF pp. 3–8 and 21–22
    relation: supports
