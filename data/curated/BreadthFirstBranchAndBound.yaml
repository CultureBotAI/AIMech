name: Breadth-first branch-and-bound search
definition: A heuristic graph-search procedure that expands states in breadth-first layers and prunes
  candidate paths whose accumulated cost plus an admissible remaining-cost estimate exceeds a supplied
  solution-cost bound; the formulation curated here assumes uniform positive edge costs, scaled to one.
concept_kind: algorithm
identity_notes: The BFBnB search strategy is distinguished from BFIDA*, which obtains bounds by repeated
  searches, and from width-pruned beam search. Breadth-first heuristic search names the broader family
  in Zhou and Hansen; that umbrella phrase is not asserted as an exact alias. Frontier, sparse-memory
  and layered duplicate-detection implementations are alternatives, not mandatory simultaneous components.
  No normalized identity match was found across the 442 AIO and 135 prior native records; ignored-inclusive
  text hits in the main checkout were prior discovery leads, source citations, scope contrasts and DCBSS
  substring matches, plus seven public certificate-data substring matches, not existing concept records.
limitations:
- The scope is uniform positive costs and an admissible heuristic. A valid upper bound must cover a real
  solution for a single-pass optimal-solution guarantee; an unsuccessful hypothetical contour does not
  establish that the original problem is unsolvable.
- The layered implementation needs enough previous-layer information for the graph structure; retaining
  one previous layer is not a universal duplicate-elimination rule for directed graphs.
- Memory-saving implementations can still run out of memory in a large frontier. The paper explicitly
  does not prove universally lower peak memory than best-first search.
- The f≥U option is valid for improving an actual incumbent, not for an inclusive hypothetical contour
  with no stored solution. Preserving the incumbent when no improvement exists is an explicit operational
  consequence of that distinction.
- The record does not certify the printed pseudocode for all base cases, graph-locality claims under every
  pruning policy, or nonuniform-cost extensions.
