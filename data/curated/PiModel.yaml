claims:
- claim_id: method
  kind: mechanism
  statement: For each minibatch B, run each input twice through the same classifier parameters with independently
    sampled input augmentation and network noise, producing C-class probability vectors z_i and z_tilde_i.
    Minimize −(1/|B|) sum over labeled i in B of log z_i[y_i], plus w(t)/(C|B|) times sum over all i in
    B of ||z_i−z_tilde_i||². Algorithm 1 normalizes the labeled sum by the complete minibatch size, not
    the number of labeled examples. Both prediction branches contribute gradients to the shared parameters.
    Start the consistency weight at zero and ramp it up; the reported Gaussian schedule is an experimental
    choice. There is no persistent per-example target or separately EMA-updated teacher in this core procedure.
