name: Pi-model
definition: A semi-supervised classifier-training procedure that combines labeled cross-entropy with squared
  disagreement between two stochastic predictions of the same input from a shared-parameter network, propagating
  gradients through both predictions.
concept_kind: algorithm
identity_notes: 'The Greek Π notation is an identity alias for the Pi-model in Laine and Aila, not the
  generic AIO Model class. Its two contemporaneous stochastic predictions and two-sided gradient differ
  from temporal ensembling’s stored predictions, Mean Teacher’s weight-averaged stopped-gradient teacher,
  and SimSiam’s asymmetric stopped-gradient representation targets. This record describes a training algorithm,
  not a trained checkpoint or fixed network architecture. The inspected AIO SemiSupervisedLLM class specifically
  combines LLM pretraining with supervised fine-tuning; its related synonym self-training is not an exact
  identity for this method. AIO SelfsupervisedLearning excludes human-annotated labels, Distillation describes
  large-to-small compression, and RegularizationLayer is a layer: none supplies an equivalent class for
  this algorithm. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 230 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout; matches concern prior discovery leads and the Pi-model
  normalization regression. Ten exact AIO CLASS nodes, their scoped synonyms and outgoing edges, plus
  five neighboring native records were inspected. The corrected Unicode-aware normalizer preserves Π;
  the previous Pi-model/Model collision was a lexical defect, not semantic identity (review issue #58).'
limitations:
- The consistency objective assumes the chosen perturbations should preserve class identity; incorrect
  augmentations can impose inappropriate targets.
- Agreement alone does not identify the correct classes; the stated classifier objective includes labeled
  cross-entropy and a consistency-weight ramp.
- Architecture, augmentation strength, batch composition and weight schedule affect the instantiated training
  procedure; no accuracy improvement or universal schedule is asserted.
- Only the declared source pages were inspected; this record does not claim a complete implementation
  or benchmark reproduction.
