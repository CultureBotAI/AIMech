id: AIMech:GloballyConvergentRegularizationHomotopyAndNystromNewtonForGeneralizedSelfConcordantLosses
name: Globally Convergent Regularization Homotopy and Nyström Newton Method for Generalized Self-Concordant
  Losses
concept_kind: mathematical_method
aliases:
- Globally Convergent Newton Methods for Ill-Conditioned Generalized Self-Concordant Losses (Marteau-Ferey,
  Bach, & Rudi 2019)
- Two-Phase Dikin-Ellipsoid Regularization Continuation Approximate Newton Scheme
- Nyström Preconditioned Conjugate Gradient Approximate Newton Method for Generalized Self-Concordant
  Kernel Learning
definition: 'Globally Convergent Regularization Homotopy and Nyström Newton Method for Generalized Self-Concordant
  Losses is a second-order convex optimization and non-parametric kernel learning methodology introduced
  by Marteau-Ferey, Bach, and Rudi (2019, NeurIPS 32, arXiv:1907.01771v2) for minimizing regularized empirical
  and Hilbert-space objectives f_lambda(x) = f(x) + (lambda/2)||x||^2 where (f, G) is generalized self-concordant:
  nabla^{(3)} f(x)[h, k, k] <= sup_{g in G} |g . h| nabla^2 f(x)[k, k] with R = sup_{g in G} ||g|| < infinity
  (covering logistic regression, softmax regression, bounded-feature GLMs, and log-cosh robust regression).
  Defining the regularized Hessian H_lambda(x) = nabla^2 f(x) + lambda I, the Newton decrement nu_lambda(x)
  = ||nabla f_lambda(x)||_{H_lambda^{-1}(x)}, the local Dikin radius r_lambda(x) = 1 / sup_{g in G} ||g||_{H_lambda^{-1}(x)}
  >= sqrt(lambda)/R, and the Dikin ellipsoid D_lambda(c) = {x : nu_lambda(x) <= c r_lambda(x)}, Lemma
  2 (Lemma 11) establishes that inside D_lambda(1/7), (1/4) nu_lambda(x)^2 <= f_lambda(x) - f_lambda(x_lambda^*)
  <= nu_lambda(x)^2, exact Newton steps converge quadratically nu_lambda(x_t) <= 2^{-(2^t - 1)} nu_lambda(x_0),
  and rho-relative approximate Newton steps tilde_Delta_t in LinApprox(H_lambda(x_t), nabla f_lambda(x_t),
  rho) with ||tilde_Delta_t - Delta_lambda(x_t)||_{H_lambda(x_t)} <= rho nu_lambda(x_t) and rho <= 1/7
  converge linearly nu_lambda(x_t) <= 2^{-t} nu_lambda(x_0). To enter the small Dikin ellipsoid D_lambda(1/7)
  without polynomial condition-number dependence sqrt(L/lambda), Lemma 3 (Lemma 13) proves the continuation
  inclusion D_mu(c/3) subseteq D_{q mu}(c), motivating a two-phase globalization scheme (Theorem 1): Phase
  I starts at x_0 = 0 and mu_0 = 7 R ||nabla f(0)|| in D_{mu_0}(1/7) and performs t = 2 steps of rho-relative
  approximate Newton per stage followed by the adaptive regularization decrease mu_{k+1} = q_{k+1} mu_k
  with q_{k+1} = (1/3 + 7 R ||x_{k+1}||) / (1 + 7 R ||x_{k+1}||), reaching D_lambda(1/7) in K <= floor((3
  + 11 R ||x_lambda^*||) log(7 R ||nabla f(0)|| / lambda)) stages; Phase II performs T = ceil(log_2 sqrt(1
  vee (lambda epsilon^{-1} / R^2))) steps at lambda to guarantee f_lambda(x_hat) - f_lambda(x_lambda^*)
  <= epsilon. In non-parametric reproducing kernel Hilbert space learning (Section 4, Algorithm 1, Theorems
  3-4 and 6-7), combining Nyström projection onto M = O_tilde(df_lambda) leverage-score landmarks with
  Q = O_tilde(df_lambda) Hessian subsampling and tau = 3 iterations of Cholesky-preconditioned conjugate
  gradient achieves minimax optimal excess risk L(g_{Q,M,lambda}) - L(g^*) <= c_0(df_lambda/n + b_lambda^2
  + epsilon) log(1/delta) in O_tilde(n df_lambda) time and O_tilde(df_lambda^2) memory, completely independent
  of the condition number L/lambda.'
identity_notes: Resolved against all 442 pinned AIO records and 618 maintained AIMech records. Distinct
  from AIMech:SelfConcordantAndPseudoSelfConcordantFiniteSampleMEstimation (Ostrovskii & Bach 2021, which
  establishes finite-sample excess risk and critical sample sizes of unregularized and L1-penalized ERM
  under calibrated-design sub-Gaussianity rather than algorithmic two-phase regularization homotopy approximate
  Newton optimization and Nyström preconditioned conjugate gradient kernel solvers), from AIMech:DeterministicBanachContractionAndNewtonKantorovichInequalitiesForSmoothMEstimators
  (Kuchibhotla 2018, which derives deterministic Banach and Newton-Kantorovich localization bounds for
  fixed-objective M-estimators rather than decreasing-regularization homotopy and Nyström RKHS projection),
  and from AIMech:HigherOrderSmoothRegularizedEmpiricalRiskMinimizationAndSampleSplitNewton (which studies
  one-pass sample-split Newton stepping across growing sample sizes rather than decreasing-regularization
  Dikin-ellipsoid continuation on a fixed dataset or RKHS).
