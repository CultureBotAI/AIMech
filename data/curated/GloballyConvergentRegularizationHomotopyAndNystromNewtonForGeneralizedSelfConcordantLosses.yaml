- claim_id: nystrom-subspace-projection-and-projector-capacity-excess-risk-preservation
  kind: mechanism
  statement: 'For an orthogonal projector P: H -> H_P with projector capacity C_P(x, lambda) := ||H(x)^{1/2}(I
    - P)||^2 / lambda and source term s_lambda := lambda ||x_lambda^*||_{H_lambda^{-1}(x_lambda^*)}, Proposition
    15 (Appendix G.2, p. 55) proves that if s_lambda / r_lambda(x_lambda^*) <= 1/4, C_P(x_lambda^*, lambda)
    <= 1/120, and nu_{P,lambda}(x) <= r_{P,lambda}(x)/2, then the full-space Newton decrement is bounded
    by nu_lambda(x) <= 3(nu_{P,lambda}(x) + s_lambda) and ||x - x_lambda^*|| <= 7 lambda^{-1/2}(nu_{P,lambda}(x)
    + s_lambda). In non-parametric RKHS learning with bounded kernel K(x, x) <= kappa^2 and generalized
    self-concordant loss |ell_z^{(3)}(t)| <= R_ell ell_z''''(t) (R = R_ell kappa), Theorem 3, Proposition
    11, Theorem 6, and Propositions 18-19 prove that selecting M Nyström landmark points {x_tilde_1,...,x_tilde_M}
    either uniformly with M >= (10 + 160 N_infinity^Sigma(eta)) log(8 kappa^2 / (eta delta)) or via q-approximate
    leverage scores with M >= (6 + 486 q^2 N^Sigma(eta)) log(8 kappa^2 / (eta delta)) at scale eta = lambda
    sqrt(2) / (1440(b_2^* vee 1)) guarantees ||H^{1/2}(f^*)(I - P_M)||^2 <= lambda sqrt(2) / 480 and excess
    risk L(f_beta) - L(f^*) <= K_1 b_lambda^2 + K_2 ((df_lambda vee (Q^*)^2) / n) log(2/delta) + K_3 nu_hat_{M,lambda}^2(beta)
    on the Cholesky-reparameterized M-dimensional objective L_hat_{M,lambda}(beta) = (1/n) sum_{i=1}^n
    ell_{z_i}(e_i^T K_{nM} T^dagger beta) + (lambda/2)||beta||^2 where T^T T = K_{MM}.'
  evidence:
  - source_id: marteauferey2019-gsc-newton-pdf
    locator: Section 4, pp. 8-9, Theorems 2-3, Equations (5)-(9); Appendix D.1-D.4, pp. 36-42, Propositions
      9-11, Theorems 5-6; Appendices G-H, pp. 54-72, Propositions 15-19, Theorems 8-9
    relation: supports
- claim_id: preconditioned-conjugate-gradient-approximate-newton-and-condition-free-kernel-complexity
  kind: scope
  statement: To compute 1/7-relative approximate Newton steps on the Nyström-projected objective L_hat_{M,mu}(beta)
    without forming the O(n M^2) Hessian H_hat_{M,mu}(beta) = (1/n) T^{-T} K_{Mn} D_n(beta) K_{nM} T^{-1}
    + mu I_M, Proposition 12 (Appendix D.5.1, pp. 42-44) subsamples Q points (Q = O_tilde(1/lambda) uniformly
    or Q = O_tilde(df_lambda) via leverage scores) to build the Cholesky preconditioner B^T B = (1/Q)
    T^{-T} K_{MQ} D_Q K_{QM} T^{-1} + mu I_M satisfying (1/2) B^T B <= H_hat_{M,mu}(beta) <= (3/2) B^T
    B (condition number <= 3, Equation 34), so that tau = 3 iterations of preconditioned conjugate gradient
    achieve relative error rho <= 2((sqrt(3) - 1)/(sqrt(3) + 1))^3 approx 0.03896 <= 1/7 in O(n M + M^2
    Q + M^3) time and O(n + M^2) memory. Combining this solver with the two-phase globalization scheme
    along the regularized solution path Gamma_hat_{lambda,1/(6R)}^M (Lemma 15, Propositions 13-14, Algorithm
    1), Theorem 4 and Theorem 7 prove that under capacity df_lambda <= Q^2 lambda^{-1/alpha} and source
    condition b_lambda <= L lambda^{1/2 + r}, the method finishes in N_ns = O(R ||f^*|| log(n)) approximate
    Newton steps and achieves the minimax optimal excess risk O(n^{-(1+2r)alpha / (1 + alpha(1+2r))} log(1/delta))
    in total time O_tilde(R ||f^*|| n df_lambda c_X) and memory O_tilde(df_lambda^2), independent of the
    polynomial condition number sqrt(C/lambda).
  evidence:
