claims:
- claim_id: generalized-self-concordant-dikin-ellipsoid-and-three-approximate-newton-regimes
  kind: mechanism
  statement: 'For a generalized self-concordant function (f, G) on a Hilbert space H satisfying nabla^{(3)}
    f(x)[h, k, k] <= t_f(h) nabla^2 f(x)[k, k] with t_f(h) := sup_{g in G} |g . h| <= R ||h|| (Definitions
    1 and 3-4), the regularized objective f_lambda(x) = f(x) + (lambda/2) ||x||^2 with Hessian H_lambda(x)
    = nabla^2 f(x) + lambda I satisfies e^{-t(h)} H_lambda(x) <= H_lambda(x + h) <= e^{t(h)} H_lambda(x)
    (Eq. 17), gradient bracketing phi_under(t(h)) ||h||_{H_lambda(x)} <= ||nabla f_lambda(x + h) - nabla
    f_lambda(x)||_{H_lambda^{-1}(x)} <= phi_over(t(h)) ||h||_{H_lambda(x)} (Eq. 18), and function bracketing
    with psi(t) = (e^t - t - 1)/t^2 (Proposition 2). Inside the Dikin ellipsoid D_lambda(c) := {x : nu_lambda(x)
    <= c r_lambda(x)} with c <= 1/7, Lemma 5 and Lemma 6 (Lemma 2) prove t(x - x_lambda^*) <= -log(1 -
    c) and (1/4) nu_lambda(x)^2 <= f_lambda(x) - f_lambda(x_lambda^*) <= nu_lambda(x)^2. For an approximate
    Newton increment tilde_Delta satisfying ||tilde_Delta - Delta_lambda(x)||_{H_lambda(x)} <= rho nu_lambda(x)
    + epsilon_0 with rho <= 1/7 and tilde_epsilon_0 = epsilon_0 / r_lambda(x) <= 1/21, Lemmas 8-11 and
    Propositions 4-5 establish three regimes: quadratic contraction (10/3) tilde_nu_lambda(x - tilde_Delta)
    <= ((10/3) tilde_nu_lambda(x))^2 when tilde_nu_lambda(x) >= rho and tilde_nu_lambda(x)^2 >= tilde_epsilon_0
    (yielding nu_lambda(x_t) <= 2^{-(2^t - 1)} nu_lambda(x_0) for exact Newton); linear contraction tilde_nu_lambda(x
    - tilde_Delta) <= (10 rho / 3) tilde_nu_lambda(x) <= (10/21) tilde_nu_lambda(x) <= (1/2) tilde_nu_lambda(x)
    when rho >= tilde_nu_lambda(x) and rho tilde_nu_lambda(x) >= tilde_epsilon_0 (yielding nu_lambda(x_t)
    <= 2^{-t} nu_lambda(x_0) for rho-relative ANM); and limiting precision nu_lambda(x - tilde_Delta)
    <= 3 epsilon_0. Moreover, Lemma 12 proves that inside D_lambda(1/30), a single 1/20-relative Hessian
    approximation at x_0 yields 1/7-relative approximate Newton steps for all x in D_lambda(1/30).'
  evidence:
  - source_id: marteauferey2019-gsc-newton-pdf
