    locator: Section 4, pp. 9-10, Lemma 4, Theorem 4, Equation (10); Appendix D.5-D.6, pp. 42-48, Lemma
      15, Propositions 12-14, Theorem 7, Equation (34); Appendix E, pp. 49-50, Algorithm 1
    relation: supports
