- claim_id: two-phase-regularization-homotopy-dikin-inclusion-and-global-convergence
  kind: mechanism
  statement: 'Lemma 3 and Lemma 13 prove the Dikin-ellipsoid continuation inclusion: if nu_mu(x) <= (c/3)
    sqrt(mu)/R (or x in D_mu(c/3)) for c < 1, then setting tilde_mu = q mu with q >= (1/3 + R sqrt(mu)
    ||x||_{H_mu^{-1}(x)} / c) / (1 + R sqrt(mu) ||x||_{H_mu^{-1}(x)} / c) (and in particular q >= (1/3
    + R ||x|| / c) / (1 + R ||x|| / c)) guarantees nu_{tilde_mu}(x) <= c sqrt(tilde_mu)/R (or x in D_{tilde_mu}(c)).
    Combining this with Lemma 14 and Corollary 3 (7 R ||x|| <= 7 R ||x_mu^*|| + 1 for c = 1/7), Proposition
    6 and Theorem 1 establish that Phase I of the Proposed Globalization Scheme — initialized at x_0 =
    0 and mu_0 = 7 R ||nabla f(0)|| so R nu_{mu_0}(x_0)/sqrt(mu_0) <= 1/7 (Remark 2) and executing t =
    2 steps of rho-relative ANM (rho <= 1/7) followed by mu_{k+1} = q_{k+1} mu_k with q_{k+1} = (1/3 +
    7 R ||x_{k+1}||) / (1 + 7 R ||x_{k+1}||) — maintains the invariant R nu_{mu_k}(x_k)/sqrt(mu_k) <=
    1/7 for all k and enters D_lambda(1/7) in K <= floor((3 + 11 R ||x_lambda^*||) log(7 R ||nabla f(0)||
    / lambda)) stages (or K <= (9/2 + 15 sup_{lambda <= mu <= mu_0} R sqrt(mu) ||x_mu^*||_{H_mu^{-1}(x_mu^*)})
    log(mu_0/lambda) under the Hessian-norm variant of Proposition 7), after which Phase II performs T
    = ceil(log_2 sqrt(1 vee (lambda epsilon^{-1} / R^2))) steps of ANM on f_lambda to achieve f_lambda(x_hat)
    - f_lambda(x_lambda^*) <= epsilon.'
