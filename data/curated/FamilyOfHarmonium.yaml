claims:
- claim_id: class-specific-modalities
  kind: mechanism
  statement: For a selected class y, each word-presence variable is Bernoulli with logit alpha_i^y+sum_k
    W_ik^y h_k. The demonstrated image-feature conditional is Gaussian with identity covariance and mean
    beta^y+U^y h. Hidden variables given all text/image features and the class are independent unit-Gaussian
    variables with mean (W^y)^T x+(U^y)^T z. Separate class parameters produce separate latent coordinates;
    topic positions across classes are not inherently aligned.
  evidence:
  - source_id: method-source
    locator: Section 3.2, PDF pp.4-5, Equations 3.2-3.5; Section 3.4, pp.6-7
    relation: supports
- claim_id: proper-gaussian-domain
  kind: limitation
  statement: For the identity-covariance construction, the Gaussian image/hidden precision must be positive
    definite; equivalently I-U^y(U^y)^T must be positive definite in every class. Binary word variables
    add bounded-state linear terms and do not repair an unstable Gaussian coupling. Proper-looking conditional
    normals alone do not establish a proper joint. The record restricts the probability-model definition
    to this admissible domain and does not certify that the historical fitting procedure enforced it.
  evidence:
  - source_id: method-source
    locator: Section 3.2, PDF p.5, Equations 3.3-3.6; Appendix, p.12
    relation: supports
- claim_id: class-normalized-decision
  kind: mechanism
  statement: Integrating Gaussian hidden variables gives class-specific visible log mass F_y(x,z)=alpha^y
    dot x+beta^y dot z-||z||^2/2+||(W^y)^T x+(U^y)^T z||^2/2. Class posterior scores require pi_y exp(F_y)/Z_y.
    Assuming uniform class priors removes pi_y but not the separate class normalizers Z_y. In a one-word,
    one-image-feature example, unnormalized scores favor the second class while normalized densities favor
    the first. Each class can be fitted from its labeled examples; adding a class does not require sharing
    its latent coordinates with existing classes.
  evidence:
  - source_id: method-source
    locator: Sections 3.2 and 3.4, PDF pp.5-7, Equations 3.6-3.7 and scalability discussion
    relation: supports
