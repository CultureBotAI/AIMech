name: Family-of-harmonium
definition: A classification model family comprising separately parameterized harmoniums for each class,
  with binary text features and Gaussian image features coupled to Gaussian latent variables and compared
  through normalized class-conditional likelihoods.
concept_kind: model_family
identity_notes: Scoped to the FoH construction in Yang and colleagues' semantic-video manuscript. Each
  labeled class owns its parameters and latent coordinates; a categorical class selector has a prior distribution.
  This differs from the shared label-coupled hierarchical harmonium, an unsupervised single harmonium
  followed by an SVM, and the earlier unbounded Poisson-text dual-wing specialization. The record covers
  the proper Gaussian parameter domain; published training or normalizer-estimation safeguards are not
  inferred from the existence of that domain. No normalized identity matched four candidates against all
  442 pinned AIO IDs, labels and scoped synonyms or 444 preceding native IDs, names and aliases. Full-checkout
  searches included ignored and hidden files in both checkouts; five matching lines per checkout came
  from two unique prior discovery-ledger contents, and all matching excerpts were read. All 205 semantic
  label/synonym hits were byte-verified against prior readings. Twenty-nine annotated AIO nodes and outgoing
  edges comprise 28 unchanged prior readings and one newly read multimodal-deep-learning node. Thirty-nine
  contextual YAMLs comprise 34 unchanged prior readings and five fully read current records. Three candidates
  are curated; the unbounded-count DWH specialization remains deferred because the inspected joint is
  not normalizable with nonzero count couplings. Absence is bounded to this pinned snapshot and maintained
  corpus.
limitations:
- The manuscript acknowledges hidden partition functions but does not give a complete operational recipe
  for estimating and comparing every class normalizer. Raw energy comparison is not certified as probability
  comparison; no omission in uninspected author code is alleged.
- The Appendix adds quantities as log-partitions but displays integrals without the required logarithms.
  The compatible main joint and standard exponential-family algebra determine this record, rather than
  that inconsistent display. Gaussian color features are a modeling approximation to physical histogram
  observations.
- Fully factorized mean field and short-chain CD approximate learning statistics. The manuscript's broad
  CD-to-maximum-likelihood convergence statement is not accepted as a general guarantee. Sampling schedules
  and stability safeguards remain implementation details not fully specified by the paper.
- Main model comparisons use the five largest TRECVID categories, 1078 shots, an equal training/test split
  and selected latent sizes. The broader collection has 15 classes and 2468 shots. Selected topic examples
  and classification curves do not prove universal semantic accuracy, causality or generalization. No
  historical implementation or benchmark was run.
