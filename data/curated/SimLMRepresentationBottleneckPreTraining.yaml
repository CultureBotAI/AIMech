claims:
- claim_id: r756-claim-skip-free-bottleneck-replaced-lm
  kind: mechanism
  statement: To eliminate the input distribution mismatch of [MASK] tokens and prevent the decoder from bypassing the [CLS] representation via skip connections, SimLM samples replaced tokens from a frozen ELECTRA_base generator at rate p_enc = 30% for the 12-layer encoder and nested rate p_dec = 50% for the 2-layer bidirectional decoder, optimizing original-token cross-entropy L_pt = L_enc + L_dec across all sequence positions 1..|x| rather than binary replaced-token detection (outperforming Enc-Dec RTD at 36.2, Condenser at 36.9, and Enc-Dec MLM at 37.7 with 38.0 MRR@10 under BM25 negatives).
  evidence:
  - source_id: r756-primary-pdf
    locator: Section 1, Section 3.1, & Section 5.1-5.2, Equations 1-2, Figure 1, Tables 7-8, pp. 1-3, 6-7
    relation: supports
- claim_id: r756-claim-three-stage-finetuning-and-distillation
  kind: mechanism
  statement: After discarding the shallow decoder, SimLM initializes bi-encoder retrievers in a standalone three-stage pipeline (Retriever_1 on BM25 negatives, Retriever_2 on Retriever_1-mined hard negatives, and Retriever_distill distilled from an ELECTRA_base cross-encoder reranker) using temperature-scaled cosine similarity phi(q, d) = exp((1/tau) cos(h_q, h_d)) (tau = 0.02) with both query-negative and passage-negative contrastive denominators sum_{n_i in N} (phi(q^+, n_i) + phi(d^+, n_i)) and KL divergence interpolation L = L_kl + alpha L_cont (alpha = 0.2).
  evidence:
  - source_id: r756-primary-pdf
    locator: Section 3.2 & Appendix B, Equations 3-5, Figure 2, Table 13, pp. 3-4, 12-13
    relation: supports
- claim_id: r756-claim-msmarco-trec-nq-application
  kind: application
  statement: On MS-MARCO Passage Ranking Dev, SimLM progresses from 38.0 MRR@10 / 98.3 R@1k with BM25 negatives (Retriever_1) to 39.1 MRR@10 / 98.6 R@1k with mined hard negatives (Retriever_2) and 41.1 MRR@10 / 87.8 R@50 / 98.7 R@1k with distillation (Retriever_distill), outperforming multi-vector ColBERTv2 (39.7 MRR@10, >150GB two-stage index vs. SimLM's 27GB single-stage index) while achieving 71.4 nDCG@10 on TREC DL 2019, 69.7 nDCG@10 on TREC DL 2020, and 85.2 R@20 / 89.7 R@100 on Natural Questions test.
  evidence:
  - source_id: r756-primary-pdf
    locator: Section 4.2, Tables 2-4 and 6, pp. 5-6
    relation: supports
- claim_id: r756-claim-no-zero-shot-and-extreme-masking-limitation
  kind: limitation
  statement: Because SimLM pre-training optimizes token-level replaced language modeling without any sequence-level contrastive objective, the pre-trained checkpoint cannot be used directly as a zero-shot dense retriever without supervised fine-tuning; furthermore, setting the decoder replacement rate to 100% removes all local context and degrades MS-MARCO Dev MRR@10 from 38.0 to 36.6, and SimLM underperforms ELECTRA_base when used to initialize a cross-encoder reranker (42.9 vs. 43.7 MRR@10).
  evidence:
  - source_id: r756-primary-pdf
    locator: Section 4.2 (Table 5), Section 5.2 (Table 8), & Limitations, pp. 6-7, 9
    relation: supports
