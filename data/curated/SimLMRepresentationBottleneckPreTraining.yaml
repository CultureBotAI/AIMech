id: AIMech:SimLMRepresentationBottleneckPreTraining
name: SimLM Representation-Bottleneck Replaced Language Model Pre-Training
concept_kind: algorithm
review_status: DRAFT
definition: A self-supervised pre-training algorithm and bottleneck architecture for dense passage retrieval that corrupts an input passage x twice using a frozen ELECTRA-style generator g with nested replacement probabilities p_enc = 30% and p_dec = 50% (x_enc = Sample(g, Mask(x, p_enc)), x_dec = Sample(g, Mask(x, p_dec)) such that every token replaced in x_enc is also replaced in x_dec), encodes x_enc with a deep Transformer encoder into a single last-layer [CLS] representation bottleneck vector h_cls without skip connections from earlier layers, feeds h_cls and x_dec into a shallow 2-layer bidirectional Transformer decoder, and optimizes the sum of all-position token-level cross-entropy replaced language modeling losses L_pt = L_enc + L_dec where L_enc = -(1/|x|) sum_{i=1}^{|x|} log p(x[i] | x_enc) and L_dec = -(1/|x|) sum_{i=1}^{|x|} log p(x[i] | h_cls, x_dec) before discarding the decoder for multi-stage bi-encoder fine-tuning and KL cross-encoder distillation.
identity_notes: 'Distinct from Condenser (AIMech:CondenserPreTrainingArchitectureForDenseRetrieval) and coCondenser (AIMech:CoCondenserUnsupervisedCorpusAwareLanguageModelPreTraining), which include a short-circuit skip connection from early encoder layers to the head and use [MASK]-based MLM; distinct from RetroMAE (AIMech:RetroMAERetrievalOrientedMaskedAutoEncoder), which uses [MASK] tokens and specialized position-specific attention masks in a 1-layer decoder; and distinct from ELECTRA (AIMech:ELECTRAReplacedTokenDetection), which trains a binary Replaced Token Detection (RTD) discriminator without a [CLS] bottleneck decoder (and performs poorly on dense retrieval: 31.9 vs. 33.7 MRR@10 in Table 1 and 36.2 vs. 38.0 in Table 7).'
aliases:
- SimLM
- Similarity Matching with Language Model Pre-Training
- SimLM Bottleneck Replaced Language Modeling for Dense Retrieval
