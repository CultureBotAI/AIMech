- target: AIO:FederatedLearning
  relation: broad_match
  rationale: FLDetector is a malicious-client anomaly detection defense for federated learning based on multi-round model-update consistency.
- target: AIO:Clustering
  relation: related_match
  rationale: FLDetector uses Gap-statistic k-means clustering on windowed update-consistency suspicious scores to separate malicious and benign clients.
limitations:
- Requires O(Np) server memory to store N historical global model and update differences and per-client previous updates.
- Must be paired with a Byzantine-robust aggregation rule rather than plain FedAvg so that any false-negative malicious client after filtering cannot single-handedly backdoor the global model.
