claims:
- claim_id: c1-mechanism-cauchy-mean-value-lbfgs-hessian-vector-prediction
  kind: mechanism
  statement: At iteration t, FLDetector approximates the integrated Hessian-vector product H_hat^t (w_t - w_{t-1}) in O(N^3 + 6Np) time via L-BFGS (Algorithm 1) over the past N global parameter differences Delta W_t = {Delta w_{t-N}, ..., Delta w_{t-1}} and global update differences Delta G_t = {Delta g_{t-N}, ..., Delta g_{t-1}}, predicts each client's update as g_hat_i^t = g_i^{t-1} + H_hat^t (w_t - w_{t-1}) (Eq. 3), and computes normalized Euclidean residuals d_hat^t = d^t / ||d^t||_1 with d_i^t = ||g_hat_i^t - g_i^t||_2.
  evidence:
  - source_id: r531-primary-pdf
    locator: Section 4.1-4.3, Equations (2)-(3), Algorithm 1, and Algorithm 3 Lines 2-8, pp. 3-5
    relation: supports
- claim_id: c2-mechanism-windowed-suspicious-score-and-gap-statistic-kmeans
  kind: mechanism
  statement: FLDetector averages each client's normalized residual over a window of N iterations to form suspicious scores s_i^t = (1/N) sum_{r=0}^{N-1} d_hat_i^{t-r}, applies the Gap statistic (Algorithm 2) to estimate the cluster count k_hat, and whenever k_hat > 1 partitions clients into 2 clusters via k-means and removes the cluster with larger average suspicious score.
  evidence:
  - source_id: r531-primary-pdf
    locator: Section 4.2, Algorithm 2, and Algorithm 3 Lines 8-13, pp. 4-5
    relation: supports
- claim_id: c3-scope-expected-suspicious-score-separation-theorem
  kind: scope
  statement: 'Under L-smooth client loss functions, i.i.d. local datasets, and global learning rate alpha < 1 / ((N + 2) L), Lemma 1 bounds the L-BFGS Hessian quadratic form by z^T H_hat^t z <= (N + 1) L ||z||_2^2 and Theorem 1 proves that the expected suspicious score of every benign client i in B is strictly smaller than that of every sign-reversing malicious client j in M: E[s_i^t] < E[s_j^t] (Eq. 5).'
  evidence:
  - source_id: r531-primary-pdf
    locator: Section 4.4 Theorem 1 (Eq. 5) and Appendix A Lemma 1 & Equations (7)-(26), pp. 4, 10
    relation: supports
- claim_id: c4-limitation-full-participation-history-and-robust-aggregator-pairing
  kind: limitation
  statement: FLDetector requires tracking each client's previous update g_i^{t-1} across consecutive iterations, exhibits degraded detection accuracy under extreme non-i.i.d. data distributions or adaptive consistency-regularized attacks with small lambda, and must be paired with a Byzantine-robust aggregation rule (such as Krum, Trimmed-Mean, or Median) because vanilla FedAvg can still be backdoored by a single missed malicious client.
  evidence:
  - source_id: r531-primary-pdf
    locator: Section 4.5 Eq. (6), Section 5.2 Figures 1-2 & 4a, and Appendix Table 6, pp. 5, 7-9, 11
    relation: supports
