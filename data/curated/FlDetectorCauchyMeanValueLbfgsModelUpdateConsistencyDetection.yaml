id: AIMech:FlDetectorCauchyMeanValueLbfgsModelUpdateConsistencyDetection
name: FLDetector Cauchy Mean Value and L-BFGS Model-Update Consistency Detection
concept_kind: algorithm
review_status: DRAFT
definition: An unsupervised server-side malicious-client detection method for federated learning that predicts each client's current gradient update via the Cauchy mean value theorem g_hat_i^t = g_i^{t-1} + H_hat^t (w_t - w_{t-1}) using a quasi-Newton L-BFGS Hessian-vector product estimated from a sliding window of N global parameter differences Delta W_t and global update differences Delta G_t, computes each client's window-averaged normalized Euclidean prediction residual s_i^t = (1/N) sum_{r=0}^{N-1} d_hat_i^{t-r} where d_i^t = ||g_hat_i^t - g_i^t||_2, and uses Gap-statistic k-means clustering to identify and remove inconsistent malicious clients.
identity_notes: Introduced by Zhang, Cao, Jia, and Gong (KDD 2022, pp. 2545-2555, DOI:10.1145/3534678.3539231, arXiv:2207.09209). Distinct from single-round Byzantine-robust aggregation rules such as Krum, Trimmed-Mean, Median, and FLTrust (AIMech:FlTrustByzantineRobustFederatedLearningViaTrustBootstrapping), which aggregate updates within each iteration without cross-iteration Cauchy-mean-value Hessian consistency prediction, and from VAE-based anomaly detection (Li et al. 2020), which requires a clean server validation dataset to train a reconstruction autoencoder.
aliases:
- FLDetector
- FLDetector Malicious Client Detection via Model-Updates Consistency
- FLDetector L-BFGS Hessian-Vector Product Update Consistency Detector
