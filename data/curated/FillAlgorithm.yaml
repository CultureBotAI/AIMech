name: Fill algorithm
definition: An idealized finite constraint-satisfaction search algorithm that takes any strictly cost-reducing
  single-variable change when available and otherwise increases only the stored cost of the current non-solution
  assignment.
concept_kind: algorithm
identity_notes: 'This is Morris’s named Fill algorithm, introduced to distinguish state-specific cost
  lifting from Breakout’s shared nogood reweighting. It is not flood fill, image inpainting, or LRTA*.
  Fill permits any lower-cost neighbor, while LRTA* selects a minimum estimated path-cost successor and
  backs up its value even away from local minima. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 313 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 24 and 24 lines respectively.
  All 24 unique lines were inspected, and the sorted checkout hit sets were identical: prior leads, neighboring
  Breakout descriptions and their saved reviews/ledgers, not existing candidate records. Seven exact AIO
  CLASS nodes with scoped synonyms/comments and outgoing edges and four full native neighboring records
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The source’s theorem is not a finite-budget guarantee or an unsatisfiability decision procedure. Restricting
  moves so a solution is unreachable, or replacing the finite assignment space with an infinite one, is
  outside that theorem.
- 'Figure 3 does not prescribe a numerical increment. Curator qualification: arbitrary positive increments
  with a bounded cumulative sum need not satisfy the proof’s unbounded-lifting step; completeness should
  not be transferred to such an implementation without a separate argument.'
- State-specific costs must survive revisits. They can require storage growing with encountered local
  minima; the compact shared-nogood representation used by Breakout changes the method and does not inherit
  Fill’s theorem.
- The constraint-violation score need not be an admissible estimate of distance to a solution. The method
  is not a shortest-path optimality algorithm. No runtime advantage, numerical experiment or author implementation
  is asserted.
