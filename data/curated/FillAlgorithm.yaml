claims:
- claim_id: method
  kind: mechanism
  statement: Initialize a modifiable cost for complete assignments using the original constraint-violation
    cost. Test the current assignment for satisfaction. If a single-variable change strictly reduces its
    stored cost, take any such change; otherwise increase the stored cost of that current assignment alone
    and continue. Costs of other assignments do not change as a side effect. Retain raised costs for later
    revisits. Figure 3 specifies an increase without fixing its magnitude; the finite-CSP completeness
    proof relies on repeated lifts of an endlessly visited minimum eventually exceeding every fixed neighboring
    cost. Positive unit increments satisfy that intended lifting property. The theorem concerns eventual
    arrival at a solution when one exists on the finite complete-assignment space with the stated single-variable
    adjacency.
