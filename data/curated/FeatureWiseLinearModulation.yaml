  rationale: FiLM is a defined neural component that transforms an intermediate representation for subsequent
    computation. The pinned generic layer class is broader than this conditional feature-wise affine layer.
limitations:
- The local identity denotes the conditioning layer, not the complete FiLM visual-reasoning architecture,
  a trained checkpoint, ordinary fixed speaker adaptation, or parameter-arithmetic zero-shot inference.
- The operation is affine under fixed conditioning. Input-dependent coefficients introduce additional
  derivative paths; zero scale does not imply zero shifted output.
- Broadcast coefficient count is independent of spatial resolution, but application work scales with the
  number of feature elements. No author implementation or hardware benchmark was executed.
- All thirteen pages of the primary arXiv v2 were visually read, including appendices, figures, tables
  and references. Evaluation conclusions remain bounded to the reported configurations.
