definition: The source’s MAX-rooted application of the dual of SSS*, using LIVE/SOLVED
  node descriptors, maximum-based merit updates and dual MAX/MIN expansion rules to
  search root successors from left to right.
definition_evidence:
- source_id: marsland1987
  locator: Section3 and Figure4, printed pp.191–193 / PDF pp.7–9
  relation: supports
concept_kind: algorithm
claims:
- claim_id: max-rooted-dual-scheduling
  kind: mechanism
  statement: The paper constructs DUAL* from the dual of SSS* by interchanging MAX
    and MIN behavior, replacing the minimum operation with a maximum, and changing
    ordered insertion to increasing merit. It deliberately applies this dual procedure
    to a MAX-rooted tree, producing a left-to-right traversal of root successors while
    using the dual search within their subtrees.
  evidence:
  - source_id: marsland1987
    locator: Section3, printed pp.191–193 / PDF pp.7–9; Figure4, printed p.192 / PDF
      p.8
    relation: supports
- claim_id: descriptor-and-list-operations
  kind: mechanism
  statement: The displayed DUAL* descriptor contains a node, LIVE or SOLVED status,
    and merit h. The initial root descriptor is LIVE with a negative-infinity bound.
    The paper distinguishes push/pop from insert; insert places a descriptor in increasing
    merit order behind entries with equal merit.
  evidence:
  - source_id: marsland1987
    locator: Figure4 and surrounding Section3 prose, printed pp.192–193 / PDF pp.8–9
    relation: supports
- claim_id: live-node-processing
  kind: mechanism
  statement: Under the intended terminal-versus-interior interpretation of Figure4,
    a LIVE leaf becomes SOLVED with merit max(Evaluate(node),h); a LIVE interior MAX
    node pushes its first child; and a LIVE interior MIN node pushes all children
    in reverse order. The printed separate leaf/MAX/MIN predicates require the source-interface
    qualification retained in the limitations.
  evidence:
  - source_id: marsland1987
    locator: Figure4, printed p.192 / PDF p.8
    relation: supports
- claim_id: solved-node-processing
  kind: mechanism
  statement: For a SOLVED descriptor, Figure4 returns h if the node is the root. Otherwise,
    a solved MAX node purges the parent’s stored successors and pushes the parent
    as SOLVED; a solved MIN node pushes the next unexamined sibling as LIVE if one
    remains, or otherwise pushes the parent as SOLVED.
  evidence:
  - source_id: marsland1987
    locator: Figure4, printed p.192 / PDF p.8; purge description, printed p.193 /
      PDF p.9
    relation: supports
- claim_id: source-stated-space-scope
  kind: scope
  statement: The journal describes complete-information SSS*, DUAL* and INS storage
    requirements as exponential with search depth, despite their differing descriptors
    and retained frontier sizes. DUAL* is not presented as a user-specified hard byte-budget
    search procedure.
  evidence:
  - source_id: marsland1987
    locator: Section4 opening, printed p.193 / PDF p.9; Section4.2, printed p.198
      / PDF p.14
    relation: supports
- claim_id: reported-comparison-design
  kind: scope
  statement: DUAL* is evaluated with the other search algorithms on the same generated
    trees of specified width, depth and sibling ordering. Figures5–7 report normalized
    terminal-node visits averaged over twenty shared samples; odd/even depth and ordering
    can change relative rankings. Separate preliminary timing observations concern
    the authors’ implementations and OPEN-list overhead.
  evidence:
  - source_id: marsland1987
    locator: Sections4.1.1–4.2, printed pp.193–198 / PDF pp.9–14; Figures5–7, printed
      pp.195–197 / PDF pp.11–13
    relation: supports
limitations:
- The selected DUAL* is the paper’s MAX-rooted use on finite, fixed-depth alternating
  game trees. The displays assume positive uniform branching for interior nodes; cyclic/shared
  graphs, stochastic games and arbitrary early-terminal conventions are not supplied.
- Figure4 prints independent LIVE tests for LEAFNODE, MAXNODE and MINNODE, while SOLVED
  processing uses the game-node type. The intended distinction between terminal and
  interior predicates, retained parity and terminal transitions must be specified
  before executable verification; the abbreviation alone does not prove a defect.
- Purge is described as deleting stored successors from OPEN. Its exact transitive
  descendant selection, tie behavior in all operations, node identity and list-maintenance
  semantics remain helper-contract questions; arbitrary graph sharing or cycles are
  not justified by that description.
- The displayed control loop is unconditional and terminates on a SOLVED root. Empty-OPEN
  failure, malformed node types and invalid child/sibling data are not given separate
  semantics; no execution-level termination or failure theorem is certified from the
  pseudocode.
- The source describes complete-information storage as exponential with depth. It
  supplies no user-enforced byte budget, eviction scheme or total-runtime memory bound;
  this DUAL* must not be relabeled as a fixed-budget search method.
- The normalized terminal-count comparisons use specified generated tree families
  and twenty shared samples, with ranking changes across depth parity and ordering.
  They are not universal node-count dominance, proof of optimal search ordering or
  a reproduced game-playing result.
- The preliminary timing ratios and OPEN-list profiles are implementation-specific,
  and the detailed overhead analysis is deferred to report12. They do not establish
  hardware-independent slowdowns or speedups, nor convert terminal visits into elapsed
  time.
- The journal compares DUAL* to SSS* and mentions Kumar–Kanal’s parallel dual-ss*
  routine. Its suggestion that one-process measurements could fill a missing comparison
  does not establish global aliases or complete equivalence to that parallel formulation.
- The selected defining artifact is the inspected1987 author-hosted journal reproduction.
  Only selected regions of the separate author rendering and the TR85-16 cover route
  were inspected; no whole-text or method equivalence, publisher-byte identity or
  independent replication is claimed.
- The draft preserves the source’s descriptor updates, MAX-root choice and measured
  comparison scope. It does not certify the full minimax invariant, exact computational
  cost, implementation correctness or theorem claims from uninspected predecessor
  references.
