claims:
- claim_id: splitfed-parallel-smashed-data-and-dual-server-aggregation-mechanism
  kind: mechanism
  statement: In SplitFed (Algorithms 1-2), each participating client k in S_t computes cut-layer activations A_{k,t} in parallel on its local sub-network W_{k,t}^C and sends A_{k,t} to the Main Server, which computes loss gradients dA_{k,t} = nabla ell_k(A_t^S; W_t^S) and returns them to client k; in SFLv1 the Main Server updates W_{t+1}^S by sample-weighted averaging of parallel client-specific server gradients, whereas in SFLv2 the Main Server updates W^S sequentially on each client's smashed data without server-side FedAvg, while in both variants the Fed Server aggregates the client-side sub-networks via W_{t+1}^C = sum_{k=1}^K (n_k / n) W_{k,t}^C.
  evidence:
  - source_id: r503-primary-pdf
    locator: Section 3.1 Overall Structure, Algorithm 1, Algorithm 2, pp. 2-5
    relation: supports
- claim_id: splitfed-communication-and-training-time-complexity-ordering-scope
  kind: scope
  statement: For K clients, total dataset size p, cut-layer activation size q, full model size |W|, client-side model fraction beta = |W^C| / |W|, communication rate R, full forward-backward time T, and aggregation time T_fedavg, Table 2 establishes total communication per global epoch 2 p q + 2 beta K |W| for SL, SFLv1, and SFLv2 (compared to 2 K |W| for FL) and total training time T + 2 p q / (K R) + 2 beta |W| / R + T_fedavg for SFLv1 and T + 2 p q / (K R) + 2 beta |W| / R + T_fedavg / 2 for SFLv2 versus T + 2 p q / R + 2 beta (|W| / R) K for SL, yielding strict training-time ordering SFLv2 < SFLv1 < SL for K > 1 while preserving (eps, delta)-DP on client gradients via l2 clipping at C' and Gaussian noise N(0, sigma^2 C'^2 I) and PixelDP robustness via Laplacian perturbation Lap(Delta I_{p,q}^A / eps').
  evidence:
  - source_id: r503-primary-pdf
    locator: Section 3.2 Privacy Protection, Eqs. (1)-(6), Lemma 1, pp. 4-6; Section 3.3 Total Cost Analysis, Table 2, p. 6
    relation: supports
- claim_id: splitfed-noncolluding-two-server-trust-and-dp-utility-degradation-limitation
  kind: limitation
  statement: SplitFed's unencrypted privacy model requires two non-colluding honest-but-curious servers (Main Server and Fed Server), degrades utility as the client-side DP and PixelDP privacy budgets eps + eps' are tightened (dropping AlexNet MNIST test accuracy from 78% without PixelDP to 40% at eps = 0.5, eps' = 0.5 in Figure 5), and inherits split learning's convergence sensitivity on deep architectures such as VGG16 on CIFAR-10 (Section 4.1, pp. 7-8; Section 4.3, p. 9; Appendix A, p. 11).
  evidence:
  - source_id: r503-primary-pdf
    locator: Section 4.1, pp. 7-8; Section 4.3, Fig. 5, p. 9; Appendix A Threat Model, p. 11; Appendix C.1-C.2, pp. 12-14
    relation: supports
- claim_id: splitfed-dermatoscopic-and-visual-classification-application
  kind: application
  statement: Applied to distributed collaborative image classification across resource-constrained clients on HAM10000 pigmented skin lesion dermatoscopic images, MNIST, Fashion-MNIST, and CIFAR-10 using LeNet, AlexNet, VGG16, and ResNet-18 split architectures.
  evidence:
  - source_id: r503-primary-pdf
    locator: Section 4 Experiments, Tables 3-5, Figs. 2-9, pp. 7-9, 12-14
    relation: supports
