id: AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning
name: FedDF (Ensemble Distillation for Robust Model Fusion in Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A server-side ensemble distillation framework for federated model fusion (FedDF, Algorithm 1 for homogeneous models and Algorithm 3 for heterogeneous model prototypes) in which, at each communication round t, the server initializes each student prototype from the coordinate-wise parameter average x_{t,0}^l = (1/|S_t^l|) sum_{k in S_t^l} x_hat_t^k of participating clients in architecture group l, and then executes N_distill steps of knowledge distillation on unlabeled or synthetically generated server mini-batches d by minimizing the Kullback-Leibler divergence KL(sigma((1/|S_t|) sum_{k in S_t} f(x_hat_t^k, d)), sigma(f(x_{t,j}^l, d))) between the softmax of the ensemble-averaged client logits and the student model logits.
identity_notes: Distinct from coordinate-wise parameter-averaging schemes such as FedAvg, FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization), FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization), and FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam), which cannot fuse heterogeneous neural network architectures and suffer functional collapse when averaging heavily drifted non-linear client weights, and from FedMA (AIMech:FedMaFederatedMatchedAveragingViaLayerWiseBayesianNonparametricMatching, which performs layer-wise Hungarian permutation alignment in weight space without unlabeled server-side logit distillation).
