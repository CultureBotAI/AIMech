claims:
- claim_id: r407-logit-ensemble-kl-distillation-and-heterogeneous-architecture-fusion
  kind: mechanism
  statement: In homogeneous FedDF (Algorithm 1), initializing the server student from the uniform parameter average x_{t,0} = (1/|S_t|) sum_{k in S_t} x_hat_t^k and refining it via gradient descent on KL(sigma((1/|S_t|) sum_{k in S_t} f(x_hat_t^k, d)), sigma(f(x_t, d))) tolerates large numbers of local training epochs and learning rates where FedAvg diverges, while heterogeneous FedDF (Algorithm 3) fuses knowledge across p distinct model architectures M^1,...,M^p by distilling the full cross-architecture logit average into each prototype architecture.
  evidence:
  - source_id: r407-primary-pdf
    locator: Section 3.1-3.2 (Algorithm 1), Section 4.1-4.2 (Figures 3-6, Tables 1-2), and Appendix A (Algorithm 3), pp. 3-8, 16
    relation: supports
- claim_id: r407-multi-source-domain-adaptation-ensemble-generalization-bound
  kind: mechanism
  statement: Viewing each client k as a local source domain D_k and the distillation distribution as D, Theorem 5.1 (and Theorem D.1) bounds the expected risk of the uniform client ensemble by L_D((1/K) sum_k h_{D_hat_k}) <= L_{D_hat}(h_{D_hat}) + (1/K) sum_k ((1/2) d_{H Delta H}(D_k, D) + lambda_k) + O(sqrt(log(K * tau_H(2m) / delta) / m)), establishing that the ensemble risk is at most the centralized pooled risk plus average H-Delta-H domain discrepancy.
  evidence:
  - source_id: r407-primary-pdf
    locator: Section 5 Understanding Ensemble Distillation (Theorem 5.1, Figure 7) & Appendix D (Theorem D.1), pp. 8-9, 24-25
    relation: supports
- claim_id: r407-unlabeled-proxy-data-or-generator-and-server-compute-limitation
  kind: limitation
  statement: FedDF requires access at the server to an unlabeled proxy dataset (out-of-domain or synthetic data from a pretrained generator) and incurs additional server-side forward passes across |S_t| teacher models and N_distill student optimization steps in each communication round.
  evidence:
  - source_id: r407-primary-pdf
    locator: Section 3.2 Discussion & Section 4.1 Ablation Study of Public Data (Figure 5), pp. 4-7
    relation: supports
- claim_id: r407-cifar-imagenet-agnews-sst2-and-heterogeneous-resnet-vgg-shufflenet-application
  kind: application
  statement: Evaluated on homogeneous and heterogeneous federated learning across CIFAR-10, CIFAR-100, ImageNet, AG News, and SST2 (fusing ResNet-8, VGG-9, MobileNetV2, and ShuffleNetV2 prototypes, and fine-tuning DistilBERT), outperforming FedAvg, FedProx, FedAvgM, and FedMA under severe Dirichlet non-IID partitions (alpha = 0.01 to 1.0).
  evidence:
  - source_id: r407-primary-pdf
    locator: Section 4 Empirical Results (Tables 1-3, Figures 3-6), pp. 5-8
    relation: supports
