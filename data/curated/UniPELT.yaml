id: AIMech:UniPELT
name: UniPELT
concept_kind: architecture
review_status: DRAFT
definition: "A unified parameter-efficient language model tuning architecture that incorporates multiple heterogeneous parameter-efficient tuning methods\u2014specifically bottleneck Adapters (A), Prefix-tuning (P), and Low-Rank Adaptation / LoRA (L)\u2014as submodules operating on distinct components of each frozen Transformer layer, and dynamically controls their activation via trainable layer-wise feedforward sigmoid gating mechanisms G_{m_i} in (0, 1). In each layer, a LoRA gate G_L(h_in) in (0, 1) replaces LoRA's static scaling hyperparameter alpha to modulate low-rank query and value updates theta_task = theta_pretrained + G_L * delta_task; a prefix gate G_P(h_in) in (0, 1) scales the virtual prefix key and value matrices (G_P * P_K, G_P * P_V) prepended to multi-head attention while leaving original token keys and values intact; and an adapter gate G_A(h_FN) in (0, 1) scales the post-feedforward bottleneck output via h'_A = G_A * h_A + h_F."
identity_notes: 'Distinct from individual PELT methods (AIMech:LowRankAdaptation, AIMech:PrefixTuning, AIMech:BottleneckAdapter, AIMech:BitFit), which modify only a single locus of the Transformer layer with static scaling, and from ungated hybrid combinations (UniPELT-NoGate) or homogeneous parallel Mixture-of-Experts (MoE) layers: UniPELT combines heterogeneous submodules sequentially across multi-head attention projections, attention prefixes, and post-FFN residual bottlenecks under input-conditioned sigmoid gates G_L, G_P, and G_A.'
aliases:
- Unified Parameter-Efficient Language Model Tuning
- UniPELT (APL)
- UniPELT (AP)
- Gated Unified PELT Framework
