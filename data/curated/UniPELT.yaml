claims:
- claim_id: unipelt-submodule-sigmoid-gating-mechanism
  kind: mechanism
  statement: 'UniPELT equips each PELT submodule m_i in {A, P, L} in every Transformer layer with a trainable feedforward network with sigmoid activation producing gate values in (0, 1): G_A(h_FN) scales the bottleneck adapter output via h''_A = G_A * h_A + h_F (bypassing the adapter when G_A approx 0), G_P(h_in) scales the prefix key and value matrices P_K and P_V prior to multi-head attention, and G_L(h_in) dynamically scales the low-rank query and value updates theta_task = theta_pretrained + G_L * delta_task in place of a fixed scalar alpha.'
  evidence:
  - source_id: r693-primary-pdf
    locator: Section 2.2, Equations 1-3, p. 3; Section 3.2, p. 4
    relation: supports
- claim_id: unipelt-glue-low-and-high-resource-gains
  kind: application
  statement: Across 8 GLUE benchmark tasks with BERT_base under K in {100, 500, 1000, all} training samples, UniPELT (APL) tunes 1.26% (1.4M) of parameters and achieves the highest mean test scores in every regime (62.59 at K=100, 69.98 at K=500, 73.31 at K=1000, and 83.50 dev average at K=all), outperforming full fine-tuning (60.02, 68.93, 71.93, 82.67), ungated hybrid tuning UniPELT-NoGate (82.23 vs. 83.12 for UniPELT-AP at K=all), and the per-task oracle upper bound max({A, P, L}) at K=100 (62.59 vs. 60.60) and K=1000 (73.31 vs. 73.19).
  evidence:
  - source_id: r693-primary-pdf
    locator: Section 4.2-4.4, Tables 1-4, pp. 5-8
    relation: supports
- claim_id: unipelt-prefix-softmax-and-inference-overhead-limitation
  kind: limitation
  statement: Unlike the Adapter and LoRA submodules, the Prefix-tuning submodule in UniPELT cannot be completely eliminated even when its gate G_P approaches zero because the prepended prefix keys still participate in the softmax normalization of multi-head attention, and combining all three submodules in UniPELT (APL) increases inference latency to 127% of standard fine-tuning (4% to 11% slower than its slowest constituent submodule).
  evidence:
  - source_id: r693-primary-pdf
    locator: Section 3.2, Footnote 3, p. 4; Section 4.4, Table 4, p. 8
    relation: supports
