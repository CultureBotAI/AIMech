name: Recursive best-first search with controlled re-expansion
definition: An RBFS variant that estimates subtree evaluation-value distributions and inflates backed-up
  values to make later visits expand geometrically more nodes, while retaining original lower-bound information
  for solution-cost pruning.
concept_kind: algorithm
identity_notes: RBFS_CR is the histogram-based controlled re-expansion method of Hatem, Kiesel and Ruml.
  It is distinct from their fixed-tolerance RBFS-epsilon and weighted-root RBFS-kth-root heuristics. Its
  inflated ordering can depart from strict best-first order in the original evaluation values. No normalized
  identity match was found across the 442 AIO and 124 prior native records; ignored-inclusive text hits
  in the main checkout were prior discovery leads, source citations and search-order contrasts, plus incidental
  dependency substrings, not existing concept records.
limitations:
- The published O(N) expansion analysis is conditional on accurate subtree histograms, enough counts to
  choose appropriate backups, and a bound of O(N) on extra unique nodes beyond optimal solution cost.
  N is the specified A-star search-tree expansion count without duplicate pruning and with worst-case
  ties.
- The implementation’s finite histogram buckets estimate distributions; they do not automatically satisfy
  the analysis’s exact-distribution assumption on every problem.
- The paper retains one histogram per current-path node. Its depth-linear storage argument assumes bounded
  per-node histogram and successor storage; an added unbounded transposition table changes the memory
  scope.
- Liberal thresholds require continuing branch-and-bound after finding an incumbent to establish optimality
  under admissible bounds. The first encountered solution is not automatically certified optimal.
- The record does not certify the pseudocode as a complete executable implementation or claim universal
  speed improvement.
