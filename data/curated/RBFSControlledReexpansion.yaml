claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Maintain original backed-up values F and additional inflated values F_CR. Histograms of generated
    but pruned evaluation values guide the inflation so the next visit is estimated to perform geometrically
    more work. Use inflated values to control traversal and backtracking, and original bounds for branch-and-bound
    after an incumbent solution is available.
  evidence:
  - source_id: method-source
    locator: RBFS with Controlled Re-expansion, Figure 2 and discussion, PDF pp. 3–4; Assumptions 1–3
      and Theorem 2, PDF pp. 4–5
    relation: supports
- claim_id: conditional-bound
  kind: limitation
  statement: The overhead theorem relies on explicit distribution and extra-node assumptions. The paper
    also explains that relaxing original best-first order is intentional and that its Dockyard experiment
    uses an unlimited transposition table; those experiments do not demonstrate the memory bound of a
    path-only implementation.
  evidence:
  - source_id: analysis-and-scope
    locator: Assumptions 1–3, PDF p. 4; Theorem 2, PDF p. 5; Dockyard Robot Planning and Conclusion, PDF
      p. 6
    relation: supports
