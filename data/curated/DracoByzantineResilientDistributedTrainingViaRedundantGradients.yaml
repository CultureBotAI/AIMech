id: AIMech:DracoByzantineResilientDistributedTrainingViaRedundantGradients
name: DRACO Byzantine-Resilient Distributed Training via Redundant Gradients
concept_kind: algorithm
review_status: DRAFT
definition: A coding-theoretic Byzantine-resilient distributed optimization framework determined by an allocation matrix A, local node encoding functions E, and a parameter-server decoding function D that assigns each of P compute nodes a redundant subset of r = (1/P)||A||_0 = 2s + 1 sample gradients and decodes the exact adversary-free gradient sum D(Z^{A,E,G} + N) = G * 1_P in linear O(P d) server time under up to s worst-case Byzantine compute nodes via either a Fractional Repetition Code with Boyer-Moore streaming majority voting or a Cyclic MDS Code with inverse-DFT Vandermonde encoding and Toeplitz error-locator syndrome decoding.
identity_notes: Distinct from approximate statistical robust aggregators (Krum, Bulyan, Coordinate-Wise Median, Trimmed-Mean, Geometric Median) that do not use algorithmic gradient redundancy and do not recover the exact adversary-free gradient sum, and distinct from DETOX (which uses logarithmic or small odd redundancy r to filter most Byzantine nodes via majority vote before applying approximate hierarchical robust aggregation rather than exact coding recovery with r = 2s + 1). Specifically denotes the DRACO framework of Chen, Wang, Charles, & Papailiopoulos (ICML 2018, PMLR 80:903-912, Definitions 1-2, Theorems 1, 2, 5, Lemmas 3-4, Algorithms 1-2).
aliases:
- DRACO
- DRACO Coded Gradient Aggregation
- DRACO Fractional Repetition and Cyclic Gradient Coding
