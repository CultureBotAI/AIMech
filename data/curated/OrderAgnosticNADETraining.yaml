name: Order-agnostic NADE training
definition: A stochastic training procedure that shares neural conditional parameters across variable
  orderings and estimates the order-averaged NADE log-likelihood objective using a sampled observed prefix
  and losses for all remaining variables.
concept_kind: algorithm
identity_notes: 'This is Uria, Murray and Larochelle’s order-agnostic training procedure, applicable to
  shallow or deep NADE and its real-valued extension. It is distinct from the original fixed-order NADE
  architecture, the existence of additional deterministic hidden layers alone, and an ensemble mixture
  evaluated after training. Parameter sharing across orderings does not assert that every ordering defines
  the same joint distribution. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 346 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 23 and 23 lines respectively. All 17 unique matched
  line contents were inspected in full: SBN source metadata, NADE and DARN scope distinctions, their saved
  review and the carried noisy-OR discovery lead, not existing candidate records. Exact checkout counts
  and differences are retained in the ledger. Seventeen exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- Shared parameters do not force order-specific joint distributions to agree. Choosing an ordering convenient
  for a conditioning query performs inference under that chosen member, not necessarily under another
  ordering or the ensemble mixture.
- Conditioning an ensemble generally reweights its members by their evidence probabilities. Uniformly
  choosing a member after observing evidence does not automatically sample the ensemble posterior; a finite
  curator example checks this distinction.
- The unbiased prefix estimator depends on the stated uniform ordering/prefix sampling and D/(D-d+1) weighting.
  Arbitrary masks, unweighted missing-output losses or nonuniform prefix sampling require a corresponding
  derivation.
- The presence mask is additional input information, not a sequence-timestep skipping layer or a guarantee
  that missing-data mechanisms have been modeled. The paper distinguishes its missing-output loss from
  ordinary denoising-autoencoder reconstruction.
- The training objective is an average of log probabilities rather than the log of an average probability.
  Ensemble density evaluation costs and deep full-joint evaluation differ from one stochastic training
  update; selecting a convenient model is not dimension-independent numerical inference.
- No agreement of all conditionals with one joint distribution, universal performance gain, global optimization
  guarantee or complete implementation audit is asserted.
