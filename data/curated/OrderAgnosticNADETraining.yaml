claims:
- claim_id: method
  kind: mechanism
  statement: Treat a variable ordering o as uniformly distributed over permutations and minimize the mean
    over data and o of the negative log probability assigned by the corresponding autoregressive NADE.
    For a training example, sample an ordering and a prefix length d-1 uniformly from zero through D-1.
    Feed the observed prefix values to the shared neural conditional network, set unobserved input values
    to zero and append a binary mask identifying observed dimensions so that observed zeros remain distinguishable
    from missing inputs. Evaluate the conditional loss for each of the D-d+1 remaining variables under
    that same prefix, sum those losses and multiply by D/(D-d+1). The resulting loss and, under the differentiability
    conditions, its gradient estimate the order-averaged objective; one masked-prefix forward/backward
    computation serves all missing outputs. Additional deterministic hidden layers can be used, while
    full joint evaluation for a chosen ordering still requires all ordered conditionals. After training,
    a selected ordering defines one normalized autoregressive model. A separate ensemble averages the
    joint probabilities of selected orderings, and samples by selecting a member then generating from
    that member. This probability average is distinct from the order-average log-likelihood training objective.
