  one-state updates, RTA* second-best backups, ordinary full A*, Dijkstra alone, EHC escape and RTAA*
  F-minus-g repair/movement-cap controls. The 2004 predecessor remains a source-version follow-up rather
  than an accepted separate identity. Fresh16 October 2026 collection at merged base917e850123890bd00e671353652fe53101f83bfb
