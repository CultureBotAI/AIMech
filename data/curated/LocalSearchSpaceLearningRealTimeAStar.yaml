- target: AIO:MachineLearningTask
  relation: related_match
  rationale: The primary method persistently learns state cost-to-go estimates from local search and observed
    costs, and explicitly retains them across repeated trials. This connects the algorithm to the pinned
    learning-from-data task/process without class equivalence or an is-a claim; it agrees with, but is
    independently grounded beyond, the maintained basic LRTA* mapping.
