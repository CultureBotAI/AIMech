claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'For any l-gradient-Lipschitz and rho-Hessian-Lipschitz function f: R^d -> R, if x_tilde satisfies ||grad f(x_tilde)|| <= g_thres and lambda_min(grad^2 f(x_tilde)) <= -sqrt(rho epsilon), then for any two initial perturbations w_0 = u_0 + mu * r * e_1 in B_{x_tilde}(r) separated by mu * r along the minimum eigenvector e_1 of H = grad^2 f(x_tilde), at least one trajectory {u_t} or {w_t} leaves B_{x_tilde}(F * l) within T < t_thres steps and decreases the objective by f(x_tilde) - f(x_{t_0 + t_thres}) >= f_thres = Omega(sqrt(epsilon^3 / rho) / log^3(d l Delta_f / (epsilon^2 delta))), implying that the stuck region X_stuck occupies volume fraction at most delta in B_{x_tilde}(r) and yielding an epsilon-second-order stationary point in tilde{O}(l (f(x_0) - f^*) / epsilon^2) total gradient steps.'
  evidence:
  - source_id: r337-primary-pdf
    locator: Section 2, Theorem 3, p. 5; Section 3, Lemmas 4 and 5, pp. 7-9; Appendix A, Theorem 9 and Lemmas 14-17, pp. 15-24
    relation: supports
  - source_id: r337-arxiv-abs
    locator: 'Abstract: Perturbed GD converges to second-order stationary points in tilde{O}(1/epsilon^2) iterations with log^4(d) dimension dependence'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: For symmetric low-rank matrix factorization min_{U in R^{d x r}} (1/2) ||U U^T - M^*||_F^2 where M^* = V^* (V^*)^T has top and r-th singular values sigma_1^*, sigma_r^* > 0, the objective satisfies the exact algebraic Hessian identity grad^2 f(U)(Delta, Delta) = ||Delta Delta^T||_F^2 - 3 ||U U^T - M^*||_F^2 + 4 <grad f(U), Delta> for Delta = U - U^* (where U^* = V^* R_U aligns U to V^*), is globally (theta, gamma, zeta)-strict-saddle with gamma = (1/3) sigma_r^*, and satisfies the local (alpha = (1/3) sigma_r^*, beta = 1/(20 sigma_1^*))-regularity condition in the neighborhood of every global minimum.
  evidence:
  - source_id: r337-primary-pdf
    locator: Section 4, Lemmas 6 and 7, pp. 10-11; Appendix C, Proof of Lemma 7 and Equations 21-26, pp. 31-35
    relation: supports
  - source_id: r337-metadata-cr
    locator: 'Abstract: Characterization of global strict-saddle geometry and local regularity for matrix Sensing and Factorization'
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Unperturbed deterministic gradient descent initialized inside the codimension-1 orthogonal stuck subspace (where the component along the negative eigendirection e_1 is zero) remains trapped in the strict-saddle manifold forever without perturbation, and Perturbed Gradient Descent cannot guarantee polynomial-time escape from degenerate higher-order saddle points where grad f(x) = 0 and lambda_min(grad^2 f(x)) = 0.
  evidence:
  - source_id: r337-primary-pdf
    locator: Section 1, Introduction (strict vs higher-order saddles and NP-hardness), pp. 1-3; Section 3, Intuition of Thin Pancake Stuck Region, pp. 7-8
    relation: supports
