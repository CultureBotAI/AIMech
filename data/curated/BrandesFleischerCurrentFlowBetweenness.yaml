  AIO contexts and five full native neighbors were assessed. The identity is Algorithm 1’s exact current-flow
  betweenness computation using sorted edge-response rows. It is not the underlying centrality measure
  alone, the chapter’s stochastic sampled-pair Algorithm 3, its closeness Algorithm 2, shortest-path Brandes
  accumulation, pivot centrality estimation, PageRank or fixed-prior image denoising. The dense pair-enumeration
