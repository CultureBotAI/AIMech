id: AIMech:BrandesFleischerCurrentFlowBetweenness
name: Brandes–Fleischer current-flow betweenness computation
aliases:
- Brandes-Fleischer exact current-flow betweenness
concept_kind: algorithm
definition: An exact network-analysis algorithm that computes current-flow betweenness by forming grounded-Laplacian
  current-response rows, sorting each edge row, and aggregating rank-weighted contributions with endpoint
  correction instead of explicitly enumerating all source–sink pairs.
definition_evidence:
- source_id: brandesfleischer2005
  locator: Section 4, Theorem 2 and Algorithm 1, PDF pp. 7–8 / printed pp. 539–540
  relation: supports
claims:
- claim_id: electrical-domain-and-estimand
  kind: scope
  statement: The domain is a simple connected undirected graph with n>=3 and positive edge conductances.
    For ordered distinct source–sink pairs s,t, solve the weighted Laplacian equation Lp=e_s-e_t. Edge
    current is c(u,v)[p(u)-p(v)]. Vertex throughput is half the sum of absolute incident currents minus
    half the absolute supply, excluding source and sink. The maintained normalized betweenness is the
    sum of these throughputs over ordered pairs, divided by (n-1)(n-2). Edge orientation is a computational
    convention and does not make the graph directed.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 2, PDF pp. 2–3 / printed pp. 534–535; Section 3.1 and Definition 2, PDF pp. 4–5 /
      printed pp. 536–537
    relation: supports
- claim_id: grounded-current-response
  kind: mechanism
  statement: Ground one vertex, invert the reduced weighted Laplacian, and embed the inverse in a matrix
    C with a zero row and column at that vertex. For oriented edge e=(u,v), define the indexed row F_ej=c(e)[C_uj-C_vj].
    Then its current for supply s,t is F_es-F_et. This row formula follows the source’s Laplacian and
    Ohm-law construction while avoiding its inconsistent incidence-matrix dimensions. Choice of ground
    changes absolute potentials but not current differences.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 2, Equation 1, PDF p. 3 / printed p. 535; Section 4, current-response construction,
      PDF p. 7 / printed p. 539
    relation: supports
- claim_id: sorted-row-aggregation
  kind: mechanism
  statement: Fix vertex indices i=1,...,n and initialize a(v)=0. For each oriented edge e=(u,v), assign
    each vertex j its distinct rank r_e(j) in a nonincreasing ordering of F_ej, retaining the original
    vertex indices. Add (j-r_e(j))F_ej to a(u) and (n+1-j-r_e(j))F_ej to a(v) for every j. Return 2[a(v_i)-(i-1)]/[(n-1)(n-2)].
    The subtraction removes sink endpoint contributions. Equal row values can occupy distinct consecutive
    positions in any consistent tie order; the aggregate is unchanged. This is the source’s raw accumulation
    and final correction, not the differently scaled intermediate prose expression.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 4, proof of Theorem 2 and Algorithm 1 lines 1.1–1.2, PDF pp. 7–8 / printed pp. 539–540;
      curator finite tie and orientation checks in research/discovery/current-flow-boundaries.py
    relation: supports
- claim_id: computation-and-storage
  kind: scope
  statement: After one reduced-matrix inversion, m rows of length n are formed and sorted, giving the
    source’s O(I(n-1)+mn log n) arithmetic/comparison bound, where I is the inversion cost. A dense C,
    graph storage and one current row require O(n^2+m) storage. The source discusses retaining selected
    inverse columns under a vertex ordering to reduce storage. Its rough condition-number estimate and
    conjugate-gradient cost do not provide an unconditional exact finite-precision runtime or tolerance
    guarantee.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 4, Theorem 2 and matrix/storage discussion, PDF pp. 7–9 / printed pp. 539–541; explicit
      dense-storage accounting is curator interpretation
    relation: supports
- claim_id: scope-and-comparison
  kind: limitation
  statement: Current-flow throughput can include routes beyond shortest paths; the unit triangle has normalized
    current-flow betweenness 1/3 at each vertex, while internal-vertex shortest-path betweenness is zero.
    On a unit four-vertex path the matched normalized scores are (0,2/3,2/3,0). These are curator examples.
    Algorithm 1 computes exact scores in its mathematical model; the chapter’s sampled-pair approximation
    and closeness procedures are different algorithms. Structural prominence and the electrical analogy
    do not establish causal influence, biological function or a learned prediction.
  evidence:
  - source_id: brandesfleischer2005
    locator: Sections 3–6, PDF pp. 4–11 / printed pp. 536–543; Algorithm 1, p. 8 / p. 540; curator finite
      examples in research/discovery/current-flow-boundaries.py
    relation: supports
- claim_id: evaluation-and-source-boundaries
  kind: limitation
  statement: Appendix A describes a Java implementation using yFiles and JMP on a 2.4 GHz computer with
    3 GB memory. Figure 1 compares total runtime of exact procedures on random graphs with average degrees
    6 through 20 in steps of two, and approximation errors on six random and six AS graphs of roughly
    9000 vertices and 20000 edges. No numerical speedup, replicated historical result or universal accuracy
    claim is asserted. The inspected copy contains current/potential, incidence-dimension and intermediate-normalization
    inconsistencies; the maintained mechanism follows the explicit Laplacian construction and Algorithm
    1, with finite checks and those limitations retained.
  evidence:
  - source_id: brandesfleischer2005
    locator: Appendix A and Figure 1, PDF p. 12 / printed p. 544; Definition 1, PDF p. 2 / p. 534; Section
      4, PDF pp. 7–8 / pp. 539–540
    relation: supports
