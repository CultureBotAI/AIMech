limitations:
- This record specifies Algorithm 1 for connected simple undirected positive-conductance networks with
  n>=3 and endpoint-excluded normalization. Disconnected components, singleton cases, signed weights,
  endpoint inclusion and edge centrality require explicit separate conventions.
- The inspected Definition 1 writes a cycle sum of currents as zero, whereas its Ohm law and weighted
  Laplacian require signed potential drops x/c to sum to zero. The weighted-triangle curator example has
  nonzero cycle-current sum and zero cycle-potential sum. The literal unweighted cycle-current equation
  is not adopted for general conductances.
- The inspected incidence matrix is declared n-by-m but used in BC where edge-by-vertex current rows require
  transposition or a different matrix convention. The maintained indexed row formula is explicit. Algorithm
  1 uses raw accumulation before endpoint subtraction, unlike an inconsistently normalized intermediate
  prose expression.
- The chapter’s separate closeness definition uses an n-1 numerator that disappears in its proof and Algorithm
  2. This record makes no blanket normalization identity with information centrality and does not incorporate
  Algorithm 2 into its identity.
- Exact mathematical accumulation is distinguished from numerical linear solves. No implementation-specific
  tolerance, conditioning guarantee, benchmark replication, paid service or model training was used. Finite
  rational examples do not certify every graph, theorem or historical program. DRAFT remains after author
  self-review.
