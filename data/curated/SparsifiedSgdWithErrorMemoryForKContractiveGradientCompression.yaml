id: AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression
name: Sparsified Stochastic Gradient Descent with Error Memory for k-Contractive Gradient Compression
concept_kind: algorithm
review_status: DRAFT
definition: 'An error-compensated stochastic gradient descent optimization algorithm (Mem-SGD) that compresses each step''s scaled stochastic gradient plus accumulated local residual memory m_t using a possibly biased k-contraction operator comp_k: R^d -> R^d satisfying E ||x - comp_k(x)||^2 <= (1 - k/d) ||x||^2 (such as deterministic top-k magnitude selection or scaled random-k coordinate sparsification), updating the iterate via x_{t+1} = x_t - g_t with g_t = comp_k(m_t + eta_t * grad f_{i_t}(x_t)) and retaining the untransmitted residual m_{t+1} = m_t + eta_t * grad f_{i_t}(x_t) - g_t so that the perturbed virtual sequence x_tilde_t = x_t - m_t evolves via exact uncompressed stochastic gradient steps and recovers the asymptotic O(G^2 / (mu * T)) convergence rate of uncompressed SGD.'
identity_notes: Distinct from unbiased stochastic quantization (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding, which requires E[Q(g)] = g and cannot analyze biased deterministic Top-k sparsification), from 1-bit sign compression without contractive residual bounds (AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization), from EF21 Markov gradient-difference compression (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization, which compresses gradient differences grad f_i(x^{t+1}) - g_i^t rather than step-scaled gradient plus error memory), and from low-rank matrix subspace compression (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback). No pinned AIO class covers k-contractive sparsified SGD with error memory or its perturbed virtual-iterate convergence guarantee.
aliases:
- Mem-SGD
- Sparsified SGD with Memory
- k-Contractive Error-Compensated SGD
- Top-k SGD with Error Feedback Memory
