name: Scaled Legendre HiPPO operator
definition: The HiPPO projection operator using the uniform measure over the full elapsed interval from
  zero to the current time, with scaled-Legendre coefficients evolving under explicitly time-dependent
  linear memory dynamics.
concept_kind: mathematical_method
identity_notes: HiPPO-LegS is the scaled-Legendre instantiation of the broader HiPPO framework. Its time-dependent
  operator differs from a fixed state matrix used to initialize a later S4 model and from the fixed-width
  translated-Legendre window.
limitations:
- The displayed differential formula contains 1/t and applies for positive t; an executable initialization
  at the time origin is not supplied by this record.
- Equation 4 illustrates an Euler discretization; the paper also uses bilinear and zero-order-hold schemes.
  The operator's approximation properties do not guarantee arbitrary downstream-network accuracy.
