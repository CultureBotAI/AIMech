claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Use the normalized uniform measure on [0,t] and the corresponding Legendre basis. For positive
    time, the coefficient derivative is minus A times the current coefficient vector divided by t, plus
    B times the current signal divided by t; the source specifies a lower-triangular A and a fixed B and
    derives discrete recurrences from these dynamics.
