claims:
- claim_id: r488-claim-1
  kind: mechanism
  statement: KT-pFL formulates personalized heterogeneous federated learning as the alternating minimization of L(w, c) = sum_{n=1}^N (D_n/D) [L_n(w^n) + lambda sum_{x_hat in D_r} L_{KL}(sum_{m=1}^N c_{mn} s(w^m, x_hat), s(w^n, x_hat))] + rho ||c - 1/N||_2^2 (Equations 2-4), alternating between two-stage client updates (private SGD in Equation 5 and public KL distillation in Equation 6) and server gradient updates on the N x N knowledge coefficient matrix c with L2 shrinkage toward 1/N (Equation 7).
  evidence:
  - source_id: r488-primary-pdf
    locator: Sections 3-4, pp. 3-5, Equations 2-7, Algorithm 1
    relation: supports
- claim_id: r488-claim-2
  kind: mechanism
  statement: Theorem 4.1 and Remark 4.1 prove that for any client n with local distribution D_n and empirical hypotheses {h_{D_hat_m}}_{m=1}^N, there always exist optimal knowledge coefficients c^*_{m,n} such that the expected loss of the personalized ensemble model satisfies L_{D_n}(sum_{m=1}^N c^*_{m,n} h_{D_hat_m}) <= L_{D_n}(h_{D_hat_n}) and L_{D_n}(sum_{m=1}^N c^*_{m,n} h_{D_hat_m}) <= L_{D_n}((1/N) sum_{m=1}^N h_{D_hat_m}), with strict inequality on non-IID problems.
  evidence:
  - source_id: r488-primary-pdf
    locator: Section 4, pp. 5-6, Theorem 4.1, Remark 4.1
    relation: supports
- claim_id: r488-claim-3
  kind: limitation
  statement: KT-pFL requires a shared public dataset D_r accessible to all clients for computing and distilling soft predictions, and choosing an overly large public dataset size |D_r| or an excessively large generalization regularization parameter rho slows client distillation or forces c toward uniform 1/N weights, degrading personalized accuracy.
  evidence:
  - source_id: r488-primary-pdf
    locator: Section 5.2.2, pp. 9-10, Tables 4 & 6
    relation: supports
- claim_id: r488-claim-4
  kind: application
  statement: Applied to heterogeneous client architectures (LeNet, AlexNet, ResNet-18, ShuffleNetV2) and homogeneous CNNs on non-IID EMNIST, Fashion_MNIST, and CIFAR-10 benchmarks, where KT-pFL outperforms FedMD, FedDF, Sim-pFL, TopK-pFL, pFedMe, FedAMP, FedFomo, and pFedHN while reducing communication volume by transmitting compact soft predictions instead of full model weights.
  evidence:
  - source_id: r488-primary-pdf
    locator: Section 5, pp. 6-10, Tables 1-2, Figures 2-5
    relation: supports
