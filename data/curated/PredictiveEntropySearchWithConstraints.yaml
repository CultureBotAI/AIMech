aio_mappings:
- target: AIO:ActiveLearning
  relation: related_match
  rationale: The connection is choosing informative queries and obtaining their outputs. The pinned AIO
    term describes a labeling-oriented machine-learning task, whereas PESC chooses objective and constraint
    evaluations for optimization. This related mapping asserts neither exact equivalence nor a subclass,
    neural-network or layer relationship.
limitations:
- The source scope is the full nine-page 2015 paper and nine-page supplement, plus only pages 1–3, 12–22
  and 41–49 of the 53-page 2016 report. PESC-F and general resource scheduling are outside this record.
- Feasible attainment and a unique optimizer or explicit tie selection are assumptions of the optimizer
  random variable. The inspected descriptions do not specify a complete policy for empty feasible posterior
  draws. No observed feasible incumbent is a different issue. The informal domain-wide indicator product
  is not a normalized density for an equality event at one continuous optimizer location.
- Finite basis sampling, numerical optimization, finite optimality constraints, Gaussian sites, task factorization,
  candidate moment matching and hyperparameter score averaging are separate approximations. They do not
  establish exact noisy information or universally additive task information.
- 'The printed appendices contain formula caveats. The 2015 supplement cavity means (Equations 18 and
  28), propagation variance after Equation 34, feasibility site Equation 30, candidate variance after
  Equation 37 and damping Equation 38 fail the retained bounded Gaussian or endpoint checks. The 2016
  report is not a wholesale repair: Equation 39 retains a reciprocal cavity-mean issue, Equation 54 gives
  the wrong derivative sign in the checked feasible-Gaussian case, and the propagation expression after
  Equation 56, candidate Equation 62 and damping Equation 65 retain corresponding defects. These are source
  caveats, not a claim to have implemented a corrected EP algorithm.'
- The 2016 main Equation 10 describes its training covariance as noise-free while omitting training noise
  inside the inverse; Appendix Equations 28–29 include that noise. The record does not certify the literal
  main predictive formula or numerical behavior for singular matrices and degenerate variances.
- The 2015 Section 4.1 rejection-sampling comparison also approximates conditional marginals as independent
  Gaussians. Its ground-truth terminology does not establish exact mutual information or validate factorization
  universally. The noncore expected-improvement Equation 2 also has a sign mismatch with the stated minimization
  convention.
- The original retained calculator checks ten bounded categories using exact rational arithmetic and elementary
  floating-point functions. It does not run EP, fit GPs, optimize acquisitions, inspect author software,
  reproduce benchmarks or establish general performance or convergence.
