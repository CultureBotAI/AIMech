id: AIMech:PredictiveEntropySearchWithConstraints
name: Predictive Entropy Search with Constraints
concept_kind: algorithm
definition: A Bayesian optimization algorithm for an unknown objective and unknown inequality constraints
  that selects evaluations using an approximation to information about the constrained minimizer location,
  combining posterior optimizer samples, finite feasibility and optimality indicators, Gaussian expectation
  propagation and taskwise predictive observation entropies.
definition_evidence:
- source_id: hernandez2015
  locator: Section 3, PDF pp. 3–5, Equations 6–16
  relation: supports
claims:
- claim_id: constrained-optimizer-information-target
  kind: mechanism
  statement: The problem minimizes f(x) subject to c_k(x)>=0 for each constraint, with objective and constraints
    defined throughout the search domain. Assume posterior function draws have an attained feasible minimum
    and an almost surely unique minimizer or a specified measurable tie selection. At fixed data and model
    hyperparameters, the ideal acquisition targets I(X_star;Y|D,x), where X_star is that constrained minimizer
    location and Y contains the prospective objective and constraint observations. When the entropy terms
    are well-defined, this equals H(Y|D,x)-E_X_star[H(Y|D,x,X_star)]. The acquisition does not require
    an already observed feasible incumbent. That property does not specify how to handle a posterior function
    draw with no feasible point or no attained minimum.
  evidence:
  - source_id: hernandez2015
    locator: PDF p. 1, Equation 1 and introductory motivation; Section 3, PDF p. 3, Equations 6–7
    relation: supports
  - source_id: hernandez2016
    locator: Section 4, PDF p. 13, Equations 7–8 and the optimizer sampling definition
    relation: supports
- claim_id: approximate-constrained-optimizer-sampling
  kind: mechanism
  statement: 'The practical method models the objective and constraints with independent Gaussian processes
    and independent Gaussian observation noise. It approximates the expectation over X_star with a finite
    average: draw approximate posterior functions and numerically minimize the sampled objective under
    the sampled constraints. The described sampler uses a finite basis approximation for stationary covariance
    functions, so the generated optimizer samples are approximate. Sampling GP hyperparameters and averaging
    their acquisition scores is an additional approximation, not in general the information obtained by
    first marginalizing predictive distributions over hyperparameters. The source does not guarantee that
    its numerical searches find every global optimizer.'
  evidence:
  - source_id: hernandez2015
    locator: Section 3, PDF p. 3, model assumptions and paragraph following Equation 8
    relation: supports
  - source_id: hernandez2016
    locator: Sections 4.1, 4.3 and 4.6, PDF pp. 14, 20–22, Equation 21; Appendix B.3, PDF p. 49
    relation: supports
- claim_id: finite-feasibility-and-optimality-indicators
  kind: mechanism
  statement: For a proposed optimizer x_star, define Gamma(z)=product_k 1[c_k(z)>=0] and Psi(z)=Gamma(z)*1[f(z)>=f(x_star)]+1-Gamma(z).
    Gamma(x_star) requires feasibility and Psi(z) excludes a feasible point with strictly smaller objective
    value. The method replaces the domain-wide product of Psi factors with a finite collection at observed
    inputs and the candidate, with x_star also represented in the latent Gaussian variables. This finite
    restriction is not exact global optimality conditioning. Even on a finite domain the indicators express
    membership in the minimizer set, not a normalized optimizer density or a rule selecting one tied minimizer.
    Equality c_k(z)=0 is feasible under the source step convention.
  evidence:
  - source_id: hernandez2015
    locator: Section 3, PDF pp. 4–5, Equations 9–15; original 81-case finite indicator diagnostic in research/discovery/pesc-boundaries.py
    relation: supports
  - source_id: hernandez2016
    locator: Section 4.2, PDF pp. 16–19, Equations 15–20; Section 4.6, PDF p. 21
    relation: supports
- claim_id: factorized-ep-and-candidate-moments
  kind: mechanism
  statement: Expectation propagation replaces the finite non-Gaussian feasibility and optimality factors
    with Gaussian sites. The resulting approximation factorizes between the objective and constraint functions
    while retaining covariances between represented values of each function. The calculation separates
    the observed-input and optimizer-dependent approximation from the candidate calculation. At a candidate,
    it applies the remaining optimality factor and matches marginal moments to a product of Gaussians.
    Independent prior functions do not remain independent merely because the optimizer location is conditioned
    on; this factorization discards conditional dependencies. Independent observation noise is added to
    the latent marginal variances afterward.
  evidence:
  - source_id: hernandez2015
    locator: Section 3, PDF pp. 4–5, Equations 12–16
    relation: supports
  - source_id: hernandez2016
    locator: Section 4.2, PDF pp. 17–19; Section 4.6, PDF pp. 21–22; original finite and Gaussian conditional-coupling
      diagnostics in research/discovery/pesc-boundaries.py
    relation: supports
  - source_id: hernandez2015-supplement
    locator: Section 2, supplement PDF pp. 2–3, Equations 3–10; Section 5, supplement PDF pp. 8–9, final
      product-Gaussian marginal moment approximation. Printed formula caveats remain in limitations.
    relation: supports
- claim_id: taskwise-noisy-log-variance-score
  kind: mechanism
  statement: For positive predictive observation variances and M>0 optimizer samples, the Gaussian entropy
    approximation assigns function i the score a_i(x)=0.5*log(v_i(x)) -(1/(2*M))*sum_j log(v_i(x|x_star_j)),
    where the conditioned variances come from the approximation and include observation noise. The coupled
    score sums a_i over the objective and constraints; an evaluated subset can use the corresponding partial
    sum. This supports comparing objective and constraint queries. Additivity comes from the conditional
    factorization approximation, not exact mutual-information additivity. The 2015 Equations 8 and 16
    omit the log-variance factor 1/2; the later 2016 Equations 9 and 11–14 include it. The common factor
    changes the information scale, though not the maximizer of that same score.
  evidence:
  - source_id: hernandez2015
    locator: PDF p. 3, Equation 8; PDF p. 5, Equation 16 and the discussion of additive acquisitions
    relation: supports
  - source_id: hernandez2016
    locator: Section 4, PDF p. 13, explicit additivity qualification; Section 4.1, PDF pp. 14–15, Equations
      9 and 11–14
    relation: supports
- claim_id: boundary-optima-and-pes-distinction
  kind: scope
  statement: 'PESC does not impose zero objective gradient or a positive-definite objective Hessian at
    every constrained optimizer: a feasible-region boundary optimum need not satisfy those unconstrained
    interior conditions. It instead uses feasibility and objective-comparison indicators. Removing all
    constraints gives an unconstrained PESC acquisition, but the 2016 report explicitly distinguishes
    this operational approximation from Predictive Entropy Search, including their derivative conditions
    and treatment of observed objective comparisons. Their shared optimizer-information target does not
    make them the same algorithm.'
  evidence:
  - source_id: hernandez2015
    locator: Section 3, PDF p. 4, Equations 9–13
    relation: supports
  - source_id: hernandez2016
    locator: Section 4.5, PDF p. 21; original constrained boundary example in research/discovery/pesc-boundaries.py
    relation: supports
identity_notes: PESC is a constrained-minimizer-location information acquisition whose operational approximation
  uses finite feasibility/optimality indicators, task-factorized EP and noisy candidate moment matching.
  These distinguish it from unconstrained PES and maximum-value MES/OPES; merely setting the constraint
  count to zero does not establish operational PES equivalence. Taskwise acquisition is not the separate
  PESC-F scheduling policy. No acronym alias is adopted. Fresh complete canonical, semantic, frontier
  and ignored-inclusive assessments establish bounded distinctness before creation.
