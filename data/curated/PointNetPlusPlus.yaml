name: PointNet++
definition: A hierarchical point-set neural architecture that repeatedly samples centroids, groups metric
  neighborhoods and applies local PointNet feature extraction, with multi-scale or multi-resolution constructions
  for variable sampling density.
concept_kind: architecture
identity_notes: PointNet++ adds hierarchical local set abstraction to PointNet. Multi-scale and multi-resolution
  grouping are distinct variants within this architecture; the paper also evaluates a single-scale ablation.
limitations:
- Neighborhood scale, sampling density and the selected grouping variant affect the representation; density-adaptive
  construction is not a guarantee for arbitrary missing data.
- The single-scale ablation, multi-scale grouping and multi-resolution grouping are not identical procedures.
  No universal benchmark advantage is curated.
