claims:
- claim_id: architecture-mechanism
  kind: mechanism
  statement: Farthest-point sampling chooses centroids; neighborhood grouping and local-coordinate PointNet
    encoders produce features for successive abstraction levels. Multi-scale grouping concatenates features
    from different radii, while multi-resolution grouping combines lower-level summaries with directly
    encoded regional points.
