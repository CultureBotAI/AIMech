claims:
- claim_id: paired-descent
  kind: mechanism
  statement: Let D contain normalized generating laws supported on the complete-data fiber compatible
    with the observed event, and let P_theta be the normalized complete-data model. Minimize D_KL(Q||P_theta)
    over the pair. A generalized forward step reduces it in Q at fixed theta; a generalized backward step
    reduces it in theta at the updated Q. Exact forward minimization over the unrestricted desired family
    gives the current conditional posterior, and exact backward minimization maximizes expected complete-data
    log likelihood. A constrained family changes the optimization problem. Finite, continuous KL on the
    relevant domain is an explicit premise here.
  evidence:
  - source_id: gam-source
    locator: Sections2.1-2.2, pp2052-2054 / PDF4-6; Eq4 and Figure2
    relation: supports
- claim_id: conditional-limit-set
  kind: scope
  statement: The inspected convergence theorem requires compact parameter space, an eventually entered
    compact invariant generating-distribution set, a closed update map, continuous finite objective, nonincrease,
    and strict decrease outside the set of joint coordinatewise global minimizers. It concludes objective
    convergence and membership of accumulation points in that set, not necessarily convergence of the
    whole parameter sequence. For the unrestricted desired family, additional interior differentiability
    conditions give stationary observed-likelihood accumulation points; stationary does not mean a local
    maximum. Separate coordinate descent tests need extra hypotheses, such as the unique forward minimizer
    in Proposition5, to establish the composite equality condition.
  evidence:
  - source_id: gam-source
    locator: Section3 Definition1, Theorems2-3, Corollary4 and Proposition5, pp2058-2062 / PDF10-14; AppendicesA-B,
      PDF20-24
    relation: supports
- claim_id: surrogate-versus-likelihood
  kind: limitation
  statement: D_KL(Q||P_theta)=D_KL(Q||P_theta(.|observed))-log p_theta(observed). Decreasing the paired
    divergence may lower observed likelihood when the posterior approximation gap also changes. The paper’s
    constrained two-coin example moves theta from0.3 to0.4, reducing likelihood from0.58 to0.52 and reaching
    a restricted fixed point that is not likelihood-stationary. Even exact EM can stay at the likelihood
    minimum theta=0.5 in that example.
  evidence:
  - source_id: gam-source
    locator: Section2.4 Example2, pp2056-2058 / PDF8-10; Section3 decomposition, p2060 / PDF12
    relation: supports
- claim_id: domain-and-source-conditions
  kind: limitation
  statement: Positive common support alone does not ensure finite KL on an arbitrary countably infinite
    state space. Continuous-observation extensions also need suitable measures and regularity. The incremental-EM
    argument applies to the inspected finite cyclic full sweep with unique admissible cached M minimizers
    and the theorem’s compactness/closedness hypotheses, not every random or unfair schedule. The displayed
    Section4 GEM comparison has its Q inequality reversed; it is not adopted as an ascent rule.
  evidence:
  - source_id: gam-source
    locator: Section2.1 assumptionsQ1-Q3, p2052 / PDF4; Section4 and Proposition6, pp2062-2065 / PDF14-17;
      AppendixB, pp2070-2072 / PDF22-24
    relation: supports
limitations:
- The finite-discrete formulation is the directly interpretable setting here. Global coordinate minimizers,
  strict progress and compact iterates are substantive assumptions, not consequences of calling an update
  GAM.
- The1984Csiszar-Tusnady PDF was downloaded and rendered but has not yet been visually read; it is not
  unseen primary support for this record.
- No historical software, benchmark or source experiment was reproduced. Saved normalized finite calculations
  challenge bounded formula/prose claims, not the complete conditional convergence theorems.
