name: Generalized Alternating Minimization
aliases:
- GAM (generalized alternating minimization)
concept_kind: algorithm
definition: An information-geometric fitting framework that updates a generating distribution constrained
  by the observations and model parameters to decrease their joint Kullback-Leibler objective, allowing
  inexact distribution and parameter minimization.
identity_notes: 'This record denotes the Gunawardana-Byrne distribution/parameter KL-descent framework.
  In its alternating realization both coordinate updates decrease the same paired objective; the general
  composite formulation can establish overall descent directly. Exact EM and suitable generalized EM are
  special cases. GAM does not mean every approximate E-step, every alternating loss or the unrelated generalized
  additive model. Restricted-family variational EM is a specialization, while cyclic incremental EM has
  a separate cache/sweep realization. No normalized match across all442pinned AIO labels/scoped synonyms
  and480native IDs/names/aliases, including GAM and VEM probes. Full-checkout searches include ignored
  and hidden files in worktree and main;59and61matched lines reduce to31distinct text windows, all read.
  Hits denote topic-model fitting steps, prior frontier leads, unrelated GAM generalized-additive-model
  context or programming mnemonics. GAM is the joint distribution/parameter KL-descent framework, not
  GEM with its exact current E-step. Variational EM fits model parameters with a restricted posterior
  family; BBVI is a stochastic variational-gradient procedure, NVIL specifies amortized stochastic learning,
  and structured factorial-HMM inference is model-specific. Melting shares its fixed-bandwidth weighted-mean
  update with Gaussian mean shift; its named outer heating, membership tree and persistence selection
  supply the distinct scope. Bare GAM/VEM aliases are qualified. Absence is bounded to this snapshot,
  corpus and inspected semantic neighborhood. Identity-search counts: 59 matched lines in the worktree
  and 61 in main; all 31 distinct matching-text windows were read, with ignored and hidden files included.'
