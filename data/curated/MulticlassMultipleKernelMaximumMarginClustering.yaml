limitations:
- The full problem is nonconvex. Solving convex second-order cone subproblems does not establish a globally
  optimal kernel combination, globally optimal labels or universal local-optimum behavior. Initialization,
  score ties, numeric tolerances and stopping conventions matter.
- Nonnegative kernel weights preserve PSD when the supplied base kernels are PSD. Feature construction,
  kernel choice and scaling, regularization C, balance limit l and cutting-plane tolerance epsilon remain
  supplied choices. No class-count balance or nonempty-cluster guarantee follows solely from aggregate
  score constraints.
- All twelve source pages, including experiments and references, were read. The reported comparisons use
  selected datasets, known class counts, chosen kernels and tuning; their per-cluster majority-label accuracy
  is not stated as one-to-one cluster matching. The source whole-dataset generalization evaluation includes
  the fitting subset. No universal performance, independent held-out guarantee, historical implementation
  or benchmark reproduction is asserted.
