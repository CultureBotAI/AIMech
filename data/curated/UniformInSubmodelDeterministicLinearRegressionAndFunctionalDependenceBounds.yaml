id: AIMech:UniformInSubmodelDeterministicLinearRegressionAndFunctionalDependenceBounds
name: Uniform-in-submodel deterministic linear regression and functional dependence bounds
aliases:
- Model-Free Uniform-in-Submodel OLS Consistency and Bahadur Linear Representation Bounds
- General Linear Regression Map beta_M(Sigma, Gamma) Deterministic Submodel Inequalities
- Functional Dependence Sub-Weibull Concentration for Uniform-in-Submodel Regression
concept_kind: mathematical_method
definition: 'Uniform-in-submodel deterministic linear regression and functional dependence bounds are
  a model-free high-dimensional statistical methodology introduced by Kuchibhotla, Brown, Buja, George,
  and Zhao (2021, arXiv:1802.05801v3) for simultaneously controlling estimation error and first-order
  Bahadur linear representation remainders across all covariate subsets M in M(k) := {M subseteq {1,...,p}
  : 1 <= |M| <= k}. Defining the general linear regression map beta_M(Sigma, Gamma) := [Sigma(M)]^{-1}
  Gamma(M) for any symmetric positive-definite p x p matrix Sigma and p-vector Gamma (encompassing ordinary
  least squares, Catoni/Minsker heavy-tailed Gram estimators, outlier-robust estimators, and Loh-Wainwright
  noisy or missing-data surrogate estimators, Section 3.3), the framework introduces the k-sparse submatrix
  operator norm RIP(k, Sigma_1 - Sigma_2) := sup_{M in M(k)} ||Sigma_1(M) - Sigma_2(M)||_{op}, the k-sparse
  vector norm D(k, Gamma_1 - Gamma_2) := sup_{M in M(k)} ||Gamma_1(M) - Gamma_2(M)||_2, and the k-sparse
  minimum eigenvalue Lambda(k; Sigma_2) := inf_{||theta||_0<=k} ||Sigma_2 theta||_2 / ||theta||_2 (Equations
  13-14). Whenever RIP(k, Sigma_1 - Sigma_2) < Lambda(k; Sigma_2), Theorem 1 proves the assumption-free
  deterministic uniform l2 bound ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2 <= [D(k, Gamma_1
  - Gamma_2) + RIP(k, Sigma_1 - Sigma_2) ||beta_M(Sigma_2, Gamma_2)||_2] / [Lambda(k; Sigma_2) - RIP(k,
  Sigma_1 - Sigma_2)] simultaneously for all M in M(k), and Theorem 3 proves the deterministic uniform
  Bahadur linear representation bound ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2) - [Sigma_2(M)]^{-1}{Gamma_1(M)
  - Sigma_1(M) beta_M(Sigma_2, Gamma_2)}||_2 <= [RIP(k, Sigma_1 - Sigma_2) / Lambda(k; Sigma_2)] ||beta_M(Sigma_1,
  Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2 with matching two-sided sandwiching (Remarks 3.2-3.3). Combining
  these deterministic inequalities with epsilon-net covering of Theta_k (Section 4) and a dyadic martingale
  plus blocking decomposition under Wu''s (2005) functional dependence measure with dependence-adjusted
  sub-Weibull norms ||{W}||_{psi_alpha,nu} (Section 5, Theorem 12) yields uniform O_p(sqrt(k log(ep/k)/n))
  consistency and O_p(k log(ep/k)/n) linear representation remainders for independent and causal time-series
  data.'
identity_notes: Evaluated against all 442 pinned AIO records and 613 maintained curated concepts in AIMech.
  Distinct from AIMech:SimultaneousNormalEquationPostSelectionConfidenceRegions (Kuchibhotla et al. 2020,
  arXiv:1806.04119v1, DOI:10.1214/19-AOS1917), which avoids inverting Sigma_hat_n(M) by working directly
  with the normal-equation residual ||Sigma_hat_n(M)(beta_{n,M} - beta_hat_{n,M})||_infty and bivariate
  max-norm quantiles (D_n^Gamma, D_n^Sigma) over M_p(1) and M_p(2) to construct simultaneous post-selection
  confidence regions R_hat_{n,M} and R_hat_{n,M}^dagger, whereas the present concept establishes deterministic
  uniform-in-submodel l2 and l1 estimation error bounds and first-order Bahadur influence-function expansions
  for the inverted submodel map beta_M(Sigma, Gamma) = [Sigma(M)]^{-1} Gamma(M) under k-sparse operator
  norm RIP(k) and develops the dyadic martingale/blocking concentration theory (Theorem 12, Lemmas 1-4)
  for dependence-adjusted sub-Weibull norms ||{W}||_{psi_alpha,nu}. Distinct from AIMech:GeneralizedBernsteinOrliczSubWeibullConcentrationAndHighDimensionalLasso
  (Kuchibhotla & Chakrabortty 2022, arXiv:1804.02605v4), which studies independent observations via the
  GBO norm ||.||_{Psi_{alpha,L}}, free-s RSC/RE optimization, and L1-penalized misspecified Lasso rather
  than unregularized uniform-in-submodel Bahadur expansions and functional dependence time-series concentration.
