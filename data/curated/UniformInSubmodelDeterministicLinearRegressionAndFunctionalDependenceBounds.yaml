claims:
- claim_id: deterministic-uniform-in-submodel-l2-and-l1-consistency-bounds
  kind: mechanism
  statement: Sections 3.1-3.3 (pp. 8-13 and 15-16, Theorems 1-2, Remarks 3.1 and 3.4, Equations 11-17
    and 23-24) define the general linear regression map beta_M(Sigma, Gamma) := [Sigma(M)]^{-1} Gamma(M)
    over M in M(k) and prove purely deterministically that whenever RIP(k, Sigma_1 - Sigma_2) < Lambda(k;
    Sigma_2), every M in M(k) satisfies ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2 <= [D(k,
    Gamma_1 - Gamma_2) + RIP(k, Sigma_1 - Sigma_2) ||beta_M(Sigma_2, Gamma_2)||_2] / [Lambda(k; Sigma_2)
    - RIP(k, Sigma_1 - Sigma_2)] (Theorem 1, Equation 15), while Remark 3.1 proves the model-free population
    moving-target bound S_{2,k}(Sigma_n, Gamma_n) := sup_{M in M(k)} ||beta_{n,M}||_2 <= (n^{-1} Lambda(k;
    Sigma_n)^{-1} sum_{i=1}^n E[Y_i^2])^{1/2} (Equation 24) and Theorem 2 establishes the coordinatewise/L1
    analogue under Infinity-norm Gram and cross-product errors.
