- claim_id: deterministic-uniform-in-submodel-bahadur-linear-representation-and-sandwiching
  kind: mechanism
  statement: 'Section 3.2 (pp. 12-15, Theorems 3-4, Corollary 1, Remarks 3.2-3.3, Equations 18-22) proves
    that for every M in M(k), the first-order Bahadur linear representation remainder satisfies ||beta_M(Sigma_1,
    Gamma_1) - beta_M(Sigma_2, Gamma_2) - [Sigma_2(M)]^{-1}{Gamma_1(M) - Sigma_1(M) beta_M(Sigma_2, Gamma_2)}||_2
    <= [RIP(k, Sigma_1 - Sigma_2) / Lambda(k; Sigma_2)] ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2
    (Theorem 3, Equation 19) with a matching lower bound C_*(k, Sigma_2) Lambda(k; Sigma_1 - Sigma_2)
    ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2 showing worst-case optimality (Remark 3.2),
    and proves that whenever RIP(k, Sigma_1 - Sigma_2) <= Lambda(k; Sigma_2)/2, the estimation error is
    sandwiched within a factor of 2 of the linear term: (1/2) ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2,
    Gamma_2)||_2 <= ||[Sigma_2(M)]^{-1}{Gamma_1(M) - Sigma_1(M) beta_M(Sigma_2, Gamma_2)}||_2 <= (3/2)
    ||beta_M(Sigma_1, Gamma_1) - beta_M(Sigma_2, Gamma_2)||_2 (Remark 3.3, Equation 22).'
  evidence:
  - source_id: kuchibhotla2021-unif-submodel-pdf
    locator: Section 3.2, Pages 12-15, Theorems 3-4, Corollary 1, Remarks 3.2-3.3, Equations (18)-(22)
    relation: supports
- claim_id: epsilon-net-sparse-sphere-discretization-and-fixed-design-exact-linearity
  kind: mechanism
  statement: 'Section 4 and Appendix A (pp. 16-20 and 27-29, Theorems 5-6, Remarks 4.1-4.5, Equations
    25-27) discretize the k-sparse unit sphere Theta_k := {theta in R^p : ||theta||_0 <= k, ||theta||_2
    = 1} using an epsilon-net N(epsilon, Theta_k) of cardinality at most ((1 + epsilon^{-1}) e p / k)^k
    (Equation 26) so that D(k, Gamma_hat_n - Gamma_n) <= (1 - epsilon)^{-1} max_{theta in N(epsilon, Theta_k)}
    theta^T(Gamma_hat_n - Gamma_n) and RIP_n(k) <= (1 - 2 epsilon)^{-1} max_{theta in N(epsilon, Theta_k)}
    |theta^T(Sigma_hat_n - Sigma_n)theta| (Equation 27), proving under marginal (MExp) or joint (JExp)
    sub-Weibull(alpha) tails that sup_{M in M(k)} ||beta_hat_{n,M} - beta_{n,M}||_2 = O_p(sqrt(k log(ep/k)/n))
    and the uniform Bahadur remainder is O_p(k log(ep/k)/n) (matching second-order degenerate U-statistics,
    Remark 4.4), while under fixed covariates (Sigma_hat_n = Sigma_n) RIP_n(k) = 0 so the Bahadur remainder
    is identically zero across all M in M(k) (Remark 4.3).'
