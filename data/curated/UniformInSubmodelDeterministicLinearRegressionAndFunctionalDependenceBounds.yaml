- claim_id: functional-dependence-adjusted-sub-weibull-concentration-for-time-series
  kind: scope
  statement: Section 5 and Appendix B (pp. 20-26 and 30-37, Theorems 7-12, Lemmas 1-4, Equations 28-45)
    extend the uniform-in-submodel bounds to causal stationary and non-stationary time series W_i = G_i(...,
    varepsilon_{i-1}, varepsilon_i) using Wu's (2005) physical functional dependence measure delta_{s,r,j}
    = max_i ||W_i(j) - W_{i,s}(j)||_r, cumulative tail Delta_{m,r,j} = sum_{s=m}^infty delta_{s,r,j},
    and dependence-adjusted sub-Weibull norm ||{W}||_{psi_alpha,nu} := sup_{r>=2} sup_{m>=0} r^{-1/alpha}(m+1)^nu
    Delta_{m,r} (Equations 28-30). Via a dyadic martingale difference plus xi_ell-dependent blocking decomposition
    and Rio's (2009) Burkholder inequality (Lemma 1, Equations 36-45), Theorem 12 proves part-Gaussian
    tail bounds with effective tail exponent s(alpha) = (1/2 + 1/alpha)^{-1} and dependence factor Omega_n(nu)
    = 1 (nu > 1/2), (log n)^{3/2} (nu = 1/2), or n^{1/2 - nu} (nu < 1/2) (Equation 31), while Lemmas 3-4
    establish linear-combination and product persistence ||{W^{(1)} W^{(2)}}||_{psi_alpha, min(nu_1,nu_2)}
    <= 2^{1+1/alpha} ||{W^{(1)}}||_{psi_{alpha_1},nu_1} ||{W^{(2)}}||_{psi_{alpha_2},nu_2} for 1/alpha
    = 1/alpha_1 + 1/alpha_2.
