name: Spectral hashing
definition: An unsupervised binary-code learning algorithm that approximates a spectral similarity-preservation
  objective using a PCA-aligned rectangular data model and zero-thresholded single-coordinate analytic
  modes.
concept_kind: algorithm
identity_notes: 'This is the original Weiss–Torralba–Fergus spectral hashing algorithm. Its graph-based
  relaxation motivates the method, while the efficient out-of-sample algorithm uses a fitted rectangular
  distribution instead of eigendecomposing the complete empirical graph for every query. It differs from
  neural semantic hashing, random-projection locality-sensitive hashing, Laplacian Eigenmaps and the later
  multidimensional spectral hashing formulation. The ambiguous abbreviation SH is not claimed as an exclusive
  alias. All 442 pinned AIO labels/scoped synonyms and 367 preceding native IDs/names/aliases were compared,
  with no normalized identity match. Full-checkout fixed-string searches included ignored and hidden files
  in both worktree and main, returning 37 lines each. All 27 unique matched contents were read: conditional-RBM
  source references, contrasting method descriptions, pending leads and saved review context, rather than
  existing candidate identities. All 45 semantic label/synonym hits and 23 exact annotated AIO nodes were
  inspected, alongside corresponding generated records and three complete native neighbors. Previously
  read contextual files were checked for byte identity. Absence is bounded to this snapshot and inspected
  neighborhood.'
limitations:
- The uniform rectangular model is an approximation to the data distribution. The resulting code is not
  the exact optimum of the discrete balanced-partition problem or necessarily the thresholded eigenvectors
  of the finite empirical affinity graph.
- Equation (2) prints Y^T Y=I while retaining unscaled plus/minus-one entries. Equation (1) instead implies
  Y^T Y=nI for n observations; an identity normalization requires rescaled real-valued relaxed coordinates.
  The record preserves this distinction rather than copying the incompatible constraints.
- Equation (4) gives the interval width but omits the origin shift unless its x already denotes a shifted
  coordinate. The mechanism states that shift explicitly. Degenerate axes, zero-threshold ties and points
  outside fitted intervals require explicit numerical conventions.
- Continuous orthogonality does not guarantee empirical balance, decorrelation or independence after thresholding.
  Excluding outer-product modes avoids one explicit source of deterministic redundancy but does not ensure
  independent bits; even first and third thresholded modes on one uniform axis are correlated.
- The number of bits need not be smaller than the input dimension. Compact storage and approximate-neighbor
  retrieval are not a guarantee of dimension reduction, exact semantic similarity, universal retrieval
  accuracy or collision resistance for cryptography. No benchmark ranking, general spectral-convergence
  theorem or author-code behavior is certified.
