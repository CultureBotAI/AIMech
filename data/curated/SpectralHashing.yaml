claims:
- claim_id: method
  kind: mechanism
  statement: The motivation minimizes affinity-weighted squared distances between binary codes, subject
    to balanced bits and pairwise decorrelation; dropping the binary restriction yields low nonconstant
    graph-Laplacian modes. The practical algorithm first computes PCA coordinates and fits an interval
    [a_j,b_j] along each retained nondegenerate axis. Under its uniform-rectangle approximation, enumerate
    nonconstant single-axis modes with positive integer frequency m, represented in shifted coordinates
    by cos(m*pi*(x_j-a_j)/(b_j-a_j)). Rank these modes by their analytic eigenvalue order, equivalently
    increasing squared frequency (m/(b_j-a_j))^2 for a common positive bandwidth, and select the required
    number of bits. Exclude the constant mode and multidimensional outer-product modes. Threshold each
    selected function at zero to form binary codes. A new point is projected into the same PCA coordinates
    and evaluated by these selected functions; hash-table retrieval then compares codes within a chosen
    Hamming radius.
