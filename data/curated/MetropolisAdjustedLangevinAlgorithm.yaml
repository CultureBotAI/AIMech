claims:
- claim_id: method
  kind: mechanism
  statement: For a positive differentiable target pi on Euclidean space, choose h>0 and propose y from
    q(y|x)=Normal(x+(h/2)grad log pi(x),hI). Accept with min(1,pi(y)q(x|y)/(pi(x)q(y|x))) and otherwise
    keep x. Evaluate the reverse Gaussian using its mean at y; the state-dependent gradient generally
    makes q asymmetric, so its ratio cannot be dropped. This correction makes the transition reversible
    with respect to the intended target under the stated support conditions, despite the discretized proposal.
  evidence:
  - source_id: method-source
    locator: Section 1.4.2, proposal and Equations (9)–(11), printed pp. 345–346 / PDF pp. 6–7; Section
      4 introductory discussion, printed p. 355 / PDF p. 16
    relation: supports
- claim_id: mala-convergence-boundaries
  kind: limitation
  statement: The paper separates conditions for geometric convergence from counterexamples and non-geometric
    cases. Its rejection and tail analysis shows that correcting the invariant target does not universally
    supply fast convergence.
  evidence:
  - source_id: mala-convergence-boundaries
    locator: Sections 4.1–4.3, printed pp. 355–359 / PDF pp. 16–20
    relation: supports
