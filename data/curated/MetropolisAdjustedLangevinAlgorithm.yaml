name: Metropolis-adjusted Langevin algorithm
definition: A Metropolis–Hastings sampler that proposes a Gaussian step with drift proportional to the
  target log-density gradient and corrects the asymmetric proposal with an accept/reject test.
concept_kind: algorithm
identity_notes: This record covers the fixed-step, identity-diffusion formulation of Roberts and Tweedie.
  It differs from ULA by its Metropolis correction, from random-walk Metropolis by its gradient-directed
  mean, and from multi-step Hamiltonian trajectories. Preconditioned and manifold variants are not silently
  included in the displayed formula. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive full-checkout searches
  found prior discovery leads for Gibbs and slice sampling plus unrelated environment substring hits,
  not existing concept records. Existing HMM/MRF models and general Metropolis–Hastings were inspected
  to distinguish model, general transition and specialized algorithm scope.
limitations:
- The full target gradient and both proposal densities must be correctly evaluated. Unknown common target
  normalization cancels, but the reverse proposal factor does not.
- Target invariance and correction of proposal discretization do not certify rapid mixing, independent
  draws or accuracy of a finite run.
- The source gives tail-dependent failures of geometric ergodicity; adding a Metropolis step is not a
  universal guarantee of exponential convergence.
- Large steps, problematic geometry and numerical gradient or density errors can make practical sampling
  ineffective. This record asserts no universal step size or acceptance target.
- Truncated drift, stochastic gradients, variable metrics and constrained-state extensions need separate
  definitions and validation.
