claims:
- claim_id: method
  kind: mechanism
  statement: For k topics sharing a specified proper Poisson-MRF exponential-family base, sufficient statistics
    and count support, let topic natural parameters be (theta_j,Theta_j). Draw document weights w from
    Dirichlet(alpha), alpha_j>0, and form theta_bar=sum_j w_j*theta_j and Theta_bar=sum_j w_j*Theta_j.
    Draw x from the normalized base law at these averaged canonical parameters. The paper also proposes
    priors on topic parameters; this construction requires those priors to be proper on an admissible
    parameter domain. Convex combinations of finite natural parameters of the same exponential family
    remain in its finite-partition domain by Holder’s inequality. In the raw-count, unbounded, zero-diagonal
    PMRF case, symmetric off-diagonal interactions must be nonpositive. The paper states that its positive-interaction
    implementation instead uses modified sufficient statistics from Yang et al. 2013 while retaining abbreviated
    raw-PMRF notation. Those modifications must be specified consistently; averaging invalid positive
    raw-count parameters does not make them proper. In the raw-count Poisson case with all interactions
    zero, canonical mixing averages log rates and hence geometrically mixes rates. A modified sufficient
    statistic need not give an ordinary independent Poisson law. LDA mixes word probabilities arithmetically
    for the same weights; the Poisson-total/multinomial identity alone does not equate these document-weight
    parameterizations.
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF p. 2, normalization restriction and modified-statistic qualification; Sections
      2.2–3, pp. 3–4, Poisson–multinomial identity, proposed prior and transformed admixtures; Section
      4, p. 4, Equation (3), canonical APM; Sections 5–6, pp. 5–7, approximate fitting and experiments
    relation: supports
