- claim_id: followup-estimator-boundary
  kind: limitation
  statement: The NIPS 2014 follow-up relaxes symmetry to fit independent nodewise regression coefficients,
    alternating topic parameters with document simplex weights. Its Appendix C describes OR/AND edge selection
    and coefficient averaging as post-processing. In the inspected public v0.9.1 source, raw counts enter
    exponentiated linear predictors with zero self coefficients and unrestricted directed interaction
    estimates. Returned coefficient arrays are not constrained to be compatible conditionals of a normalized
    joint law. Neither averaging directed coefficients nor numerically capping rates supplies the modified-statistic
    base required for a proper positive-edge APM. This separates the probability-model definition from
    the released fitting surrogate; it does not identify that release with every experiment in either
    paper.
  evidence:
  - source_id: followup-method
    locator: Section 2, PDF/printed p.3, positive-edge qualification; Section 3, pp.3-4, symmetry footnote
      and alternating objective
    relation: supports
  - source_id: followup-supplement
