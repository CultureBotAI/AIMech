name: Alternating Expectation Conditional Maximization
aliases:
- AECM
- AECM Algorithm
concept_kind: algorithm
definition: A likelihood-optimization framework that alternates cycles of expectation and constrained
  maximization, permitting the admissible data augmentation and constraint functions to change between
  cycles while collectively covering the parameter directions.
identity_notes: AECM generalizes fixed-augmentation ECM and partitioned SAGE through cycle-specific augmentations
  and general constraints. One cycle contains an E-step and one or more CM steps sharing that expectation;
  an iteration completes the stated space-filling coverage. Working parameters index augmentation choices
  without changing the observed model. This is distinct from PX-EM expansion/reduction and from Gibbs
  sampling, even when particular examples have matching updates. All 442 pinned AIO labels/scoped synonyms
  and 466 preceding native IDs, names and aliases were compared. The sole normalized search-term collision,
  bare SAGE, identifies the existing sparse additive text model; the new optimization method uses qualified
  aliases. Ignored-inclusive fixed-string searches of both full checkouts returned 436 and 459 line instances.
  Context windows for all 143 distinct normalized matched texts were inspected; duplicate ledger/review
  mentions, unrelated environment strings and the stochastic-EM lead do not establish these four method
  identities. All 225 semantic label/synonym rows and 17 annotated AIO nodes with outgoing edges were
  inspected; sixteen nodes were byte-verified unchanged after prior reading and UncertaintyBias was newly
  read. Thirty-one contextual YAMLs comprise 17 AIO and 14 native records, with 27 verified prior readings
  and four full new readings; the existing sparse text SAGE was also reread. Absence is bounded to this
  pin, maintained corpus and inspected neighborhood.
