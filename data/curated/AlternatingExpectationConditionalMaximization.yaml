  relation: supports
claims:
- claim_id: cycle-specific-augmentation
  kind: mechanism
  statement: At the current parameter choose an augmentation that yields the same observed-data model
    and compute its expected augmented log likelihood conditional on the observed data. Perform the ordered
    CM steps on that fixed expectation, each on a constraint surface containing the most recent intermediate
    parameter. Before changing augmentation or starting the next cycle, refresh the expectation at the
    current parameter. Constraints may be more general than disjoint coordinate blocks.
  evidence:
  - source_id: method-source
    locator: Section 3.2, pp.525-527 / PDF 16-18, especially Eq 3.5
    relation: supports
- claim_id: cycle-ascent-and-coverage
  kind: mechanism
  statement: 'The fixed expected objective increases within a cycle, so observed likelihood is nondecreasing
    between completed cycles and consequently completed iterations. This need not hold between every pair
    of CM substeps within one frozen-expectation cycle. Parameter-space coverage is additional to ascent:
    the source groups consecutive cycles into iterations when their constraint-gradient spaces have trivial
    intersection. The stationary-limit result further requires its stated regularity, interior, CM uniqueness
    or tie-handling, and iteration-mapping conditions.'
  evidence:
  - source_id: method-source
    locator: Section 3.2 Eq 3.7-3.8; Section 3.3 Theorems 2-3 and ECME-ordering remark, pp.526-528 / PDF
      17-19
    relation: supports
- claim_id: working-parameter-t-example
  kind: scope
  statement: For a multivariate t model, the source indexes augmentations by q(a)=|Sigma|^(-a)q. With
    fixed degrees of freedom nu and dimension p, a=1/(nu+p) gives the weighted location and scatter normalized
    by the sum of latent weights rather than sample count. For unknown nu, location/scatter and nu updates
    form different cycles, with the design parameter recomputed from the current fixed nu. This family-specific
    information comparison does not assert optimality over all augmentations or algorithms.
  evidence:
  - source_id: method-source
    locator: Sections 2.2-2.4, pp.515-522 / PDF 6-13; Section 3.4, pp.529-531 / PDF 20-22
    relation: supports
- claim_id: rate-theorem-limits
  kind: limitation
  statement: The general matrix-rate formula assumes convergence to an interior point and a fixed cycle
    composition with the specified differentiability conditions. It does not imply AECM is always faster
    than EM. Improving a local asymptotic rate or an individual block step does not guarantee fewer elapsed
    seconds, and the theorem does not establish convergence at nonnegative parameter boundaries.
  evidence:
  - source_id: method-source
    locator: Section 3.3 Theorem 4, p.529 / PDF 20; Section 3.5, p.537 / PDF 28; author reply, p.562 /
      PDF 53
    relation: supports
limitations:
- Monotone bounded likelihood values alone do not establish parameter convergence or global optimality.
  Incomplete coverage, inexact unconstrained numerical steps or stale expectations after changing augmentation
  require separate analysis.
- The main paper’s interior convergence results do not automatically cover its Poisson image example at
  zero intensities; the discussion explicitly refers to separate SAGE analysis. The Poisson pseudobackground
  example overlaps SAGE3 and is not assigned a duplicate concept ID.
- Working-parameter selection may simplify or complicate the E/CM subproblems. A deterministic optimization
  result is not a posterior-sampling mixing guarantee.
- All 58 source PDF pages were inspected, including discussions and author corrections. Historical simulations,
  CPU comparisons, image reconstructions and author software were not reproduced; no universal speed or
  clinical-performance claim is made.
