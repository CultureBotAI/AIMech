claims:
- claim_id: claim-01
  kind: mechanism
  statement: The non-backtracking matrix B_{(u -> v),(w -> x)} = 1(v = w and u != x) is the exact Jacobian of the Belief Propagation message-passing equations linearized around the factorized uniform fixed point, and because non-backtracking walks cannot return along the immediate reverse edge, any tree or dangling leaf subgraph has nilpotent restriction contributing zero to Tr(B^k) for all k >= 1 and zero nonzero eigenvalues to the spectrum of B.
  evidence:
  - source_id: r319-primary-pdf
    locator: Section 'Belief Propagation and the Non-Backtracking Matrix', Equation 3, pp. 20936-20937; Supporting Information Sections A-B, pp. 7-8
    relation: supports
  - source_id: r319-metadata-cr
    locator: Bibliographic metadata for PNAS 110(52):20935-20940
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: In the sparse q-community stochastic block model with average degree c = (c_in + (q-1)c_out)/q, the bulk spectrum of B is confined to the disk |lambda| <= sqrt(c) while the community-correlated eigenvalues equal mu = (c_in - c_out)/q, remaining separated from the bulk and enabling positively correlated community detection down to the Kesten-Stigum threshold c_in - c_out > q sqrt(c) (or c_in - c_out > 2 sqrt(c) for q = 2), whereas adjacency spectral clustering breaks down earlier at c_in - c_out = sqrt(c) + 1/sqrt(c) due to localized high-degree star eigenvectors.
  evidence:
  - source_id: r319-primary-pdf
    locator: Equations 1, 2, and 4, pp. 20935-20937; Figures 1-3, pp. 20936-20938; Supporting Information Sections C-D, pp. 8-10
    relation: supports
- claim_id: claim-03
  kind: application
  statement: By Bass's identity det(I - z B) = (1 - z^2)^{m - n} det(I - z A + z^2(D - I)), every eigenvalue mu != +/- 1 of B and its incoming-edge sum vector g_v = sum_{u in partial v} v_{u -> v} satisfy the quadratic eigenvalue equation (mu^2 I - mu A + (D - I)) g = 0 and can be computed as an ordinary eigenvector [mu^{-1} g; g] of the 2n x 2n matrix B' = [[0, D - I], [-I, A]] without explicitly forming the 2m x 2m directed-edge matrix B.
  evidence:
  - source_id: r319-primary-pdf
    locator: Section 'Connection to the Ihara Zeta Function', Equations 5-8, p. 20938
    relation: supports
