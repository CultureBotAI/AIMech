claims:
- claim_id: minilm-last-layer-attention-and-value-relation-kl-transfer
  kind: mechanism
  statement: MiniLM aligns the M-th (last) layer of the student with the L-th (last) layer of the teacher by minimizing L = L_AT + L_VR (Equation 10), where L_AT = (1 / (A_h |x|)) sum_{a=1}^{A_h} sum_{t=1}^{|x|} D_KL(A_{L,a,t}^T || A_{M,a,t}^S) (Equation 6) transfers query-key attention distributions and L_VR = (1 / (A_h |x|)) sum_{a=1}^{A_h} sum_{t=1}^{|x|} D_KL(VR_{L,a,t}^T || VR_{M,a,t}^S) (Equations 7-9) transfers the multi-head scaled value-value dot-product relation matrices VR_{L,a}^T = softmax(V_{L,a}^T (V_{L,a}^T)^T / sqrt(d_k)) and VR_{M,a}^S = softmax(V_{M,a}^S (V_{M,a}^S)^T / sqrt(d'_k)) in R^{A_h x |x| x |x|} without introducing projection parameters when student head dimension d'_k != d_k.
  evidence:
  - source_id: r801-primary-pdf
    locator: Section 3.1-3.2 (Self-Attention Distribution & Value-Relation Transfer), pp. 3-4, Figure 1, Equations (6)-(10)
    relation: supports
  - source_id: r801-primary-pdf
    locator: value_relation_matrix and minilm_deep_self_attention_loss verification
    relation: supports
- claim_id: minilm-teacher-assistant-regime-for-high-compression
  kind: mechanism
  statement: When compressing an L-layer, d_h-hidden teacher into a student whose depth and width are both at most half of the teacher's (M <= L/2 and d'_h <= d_h/2), MiniLM first distills the teacher into an intermediate L-layer, d'_h-hidden Teacher Assistant (TA) using L = L_AT + L_VR and then uses the Teacher Assistant to guide the final M-layer, d'_h-hidden student (Section 3.3, Table 3).
  evidence:
  - source_id: r801-primary-pdf
    locator: Section 3.3 (Teacher Assistant) & Section 4.3 (Table 3), pp. 4, 6
    relation: supports
- claim_id: minilm-squad-glue-and-multilingual-xnli-performance
  kind: application
  statement: "In task-agnostic compression from BERT_BASE without task-specific distillation or data augmentation, 6-layer, 768-hidden MiniLM (66M parameters, 2.0x faster) achieves 76.4 F1 on SQuAD 2.0 and 80.4 average score across SQuAD 2.0 and GLUE dev tasks\u2014retaining >99% of BERT_BASE (76.8 SQuAD 2.0, 81.5 average) and outperforming task-agnostic DistilBERT (75.2 average) and TinyBERT (79.1 average, Table 2)\u2014while smaller students (6x384, 4x384, 3x384 at up to 10.1x speedup) and multilingual XLM-R distilled MiniLM models on XNLI and MLQA consistently outperform MLM-KD and layer-to-layer baselines (Tables 3-13)."
  evidence:
  - source_id: r801-primary-pdf
    locator: Section 4.3-4.4 & Section 5 (Tables 2-13), pp. 5-10
    relation: supports
- claim_id: minilm-equal-attention-head-count-constraint
  kind: limitation
  statement: Because MiniLM computes head-wise KL divergences D_KL(A_{L,a}^T || A_{M,a}^S) and D_KL(VR_{L,a}^T || VR_{M,a}^S) across a = 1, ..., A_h (Equations 6, 9), the student model must use the same number of attention heads A_h as the teacher (or as its Teacher Assistant) in the last Transformer layer.
  evidence:
  - source_id: r801-primary-pdf
    locator: Section 3.1-3.2 (Equations 6, 9) & Section 4.1 (Distillation Setup), pp. 4-5
    relation: supports
