id: AIMech:MiniLMDeepSelfAttentionDistillationForTaskAgnosticCompression
name: MiniLM (Deep Self-Attention Distillation for Task-Agnostic Compression of Pre-Trained Transformers)
concept_kind: learning_paradigm
review_status: DRAFT
definition: 'A task-agnostic knowledge distillation framework for compressing pre-trained Transformer language models (Wang, Wei, Dong, Bao, Yang, & Zhou, NeurIPS 2020) that trains an M-layer student model with arbitrary hidden dimension d''_h to deeply mimic the self-attention module of only the last (L-th) Transformer layer of the teacher by minimizing the sum of two Kullback-Leibler divergences: L = L_AT + L_VR, where L_AT matches multi-head query-key attention distributions A_{L,a}^T = softmax(Q_{L,a}^T (K_{L,a}^T)^T / sqrt(d_k)) and L_VR matches multi-head scaled dot-product value relations VR_{L,a}^T = softmax(V_{L,a}^T (V_{L,a}^T)^T / sqrt(d_k)), optionally bridged by an intermediate-width Teacher Assistant when both depth and width are halved (M <= L/2, d''_h <= d_h/2).'
identity_notes: Distinct from TinyBERT (AIMech:TinyBERTTransformerDistillationForNaturalLanguageUnderstanding, which performs layer-to-layer distillation across all student layers using a mapping function g(m) and learnable projection matrices W_h in R^{d' x d}) and from MobileBERT (Sun et al., 2020, which requires student and teacher to have identical layer counts L=24 and bottleneck-matched outer dimensions). MiniLM distills only the teacher's final Transformer layer and converts value vectors V_{M,a}^S in R^{|x| x d'_k} into sequence-by-sequence relation matrices VR_{M,a}^S in R^{|x| x |x|} whose dimensions are invariant to d'_k, eliminating both layer-mapping tuning and linear projection matrices.
aliases:
- MiniLM
- Deep Self-Attention Distillation
- MiniLM Self-Attention Distribution and Value-Relation Distillation
