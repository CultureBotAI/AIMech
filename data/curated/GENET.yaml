name: GENET
definition: A connectionist architecture for finite constraint satisfaction that represents variable assignments
  by active label nodes and alternates input-maximizing assignment updates with increased inhibitory weights
  on violated constraints when the network stabilizes without a solution.
concept_kind: architecture
identity_notes: This is the GENET constraint-satisfaction architecture described by Davenport, Tsang,
  Wang and Zhu, including the general-constraint extension. It is not a biological genetic network, genetic
  algorithm, trained classifier or synonym of GLS. The binary network has inhibitory nogood connections,
  while the general-constraint extension includes constraint nodes and asymmetric fixed/adaptive connections.
  A Hopfield identity or globally symmetric network mapping would overstate that general architecture.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 307 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 4 and 4 lines respectively. All eight text hits were prior discovery leads in the
  two checkouts, not existing candidate records. Eight exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and five native neighboring mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.
limitations:
- 'The source explicitly says GENET is not complete: learning may create other local minima. It supplies
  no guarantee of finding a satisfying assignment or proving unsatisfiability within a finite budget.'
- Exactly synchronous updates can oscillate; the source footnote excludes that interpretation of the parallel
  pseudocode. Ties can change assignments without strict objective improvement, distinguishing this mechanism
  from the strict hill-climbing record.
- The 1994 experiments use a sequential C++ simulation. Proposed speedups from future VLSI implementations
  are expectations, not measured hardware results curated here. The GENET2 conflicted-variable variant
  is not silently treated as the default variable-selection rule.
- General-constraint output functions and representations require care. At an atmost bound, activation
  in the same variable cluster must account for all participating values; independently inhibiting each
  inactive value can introduce a false penalty. No numerical benchmark result is curated.
