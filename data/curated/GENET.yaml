claims:
- claim_id: method
  kind: mechanism
  statement: Create one cluster for each finite-domain variable and one label node per possible value,
    with exactly one active label per cluster. In the binary formulation, incompatible label pairs have
    inhibitory connections initially weighted −1; a label input sums the weights from currently active
    connected labels. A cluster activates a label of maximal input, breaking ties randomly. These updates
    need not be strict improvements. The described parallel implementation is explicitly not exactly synchronous,
    and the reported simulator selects variables sequentially. When an update cycle leaves the assignment
    unchanged, terminate if all active-label inputs are zero; otherwise reinforce violated connections,
    using W_new=W−V_i*V_j in the binary case. The extension represents higher-order constraints by constraint
    nodes with fixed label-to-constraint inputs and adaptive inhibitory outputs to labels. For a violated
    general constraint, all its outgoing connection weights are decremented according to Equation5; this
    must not be silently replaced by the binary active-endpoint rule. The paper defines distinct output
    functions for forbidden tuples and atmost constraints.
