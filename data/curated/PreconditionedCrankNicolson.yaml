name: Preconditioned Crank–Nicolson sampling
definition: A Metropolis sampler for a Gaussian-reference target whose proposal combines the current state
  with an independent draw from that reference using a scalar autoregressive coefficient.
concept_kind: algorithm
identity_notes: This is the pCN proposal and likelihood-ratio test in Cotter et al. Section 4.2. It preserves
  the Gaussian reference before correction and differs from an additive random walk, the unpreconditioned
  CN solve and an angular slice search. The displayed nonnegative coefficient form uses the source’s delta≤2
  parameterization. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 167 prior native IDs/names/aliases. Full-checkout searches in both worktrees included ignored and
  hidden files; the 15 lines in each were shared Tierney source-title references or an adaptive-rejection
  discovery lead, not matching records. Existing Gibbs, Metropolis-within-Gibbs, random-walk and independence
  Metropolis mechanisms were inspected to resolve specialization boundaries.
limitations:
- The target must be proper relative to the Gaussian reference. The explicit density-ratio implementation
  here is finite-dimensional with symmetric positive-definite C; function-space extensions require the
  source’s operator, regularity and absolute-continuity assumptions.
- Target invariance does not imply independent draws, good exploration or finite-run accuracy. Mesh-robust
  behavior under stated assumptions is not a universal dimension-free performance guarantee.
- C and the step size are fixed in the stated kernel. Adaptive covariance or step-size policies need separate
  validity arguments.
- The reprint’s later Equation (6.2) reverses signs relative to Equation (6.1) and the explicit Section
  4 proposals. This record uses Section 4 and does not claim a published erratum or use the inconsistent
  expression.
- Beta=0 would give no movement and is excluded from this stated sampler. Delta>2 in the original linear
  form gives a negative autoregressive coefficient and is not represented by the positive square-root
  parameterization here.
