claims:
- claim_id: method
  kind: mechanism
  statement: For finite-dimensional pi(u) proportional to exp(−Phi(u)) Normal(u;0,C), with fixed symmetric
    positive-definite C, choose 0<beta≤1, draw w from Normal(0,C), and set v=sqrt(1−beta squared)u+beta
    w. Accept with min(1,exp(Phi(u)−Phi(v))); otherwise retain u. For 0<delta≤2 this equals (2+delta)v=(2−delta)u+sqrt(8
    delta)w with beta squared=8 delta/(2+delta) squared. Gaussian-reference reversibility cancels the
    prior and proposal factors in the full Metropolis ratio. At beta=1 the proposal is an independent
    prior draw, while the retained states can still be correlated through rejection.
