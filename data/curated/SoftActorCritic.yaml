name: Soft actor-critic
definition: An off-policy actor-critic algorithm fitting a stochastic policy and soft value functions
  under a reward-plus-policy-entropy objective.
concept_kind: algorithm
identity_notes: SAC specifies an off-policy maximum-entropy actor-critic procedure. It is not a synonym
  for all reinforcement learning, for PPO, or for every entropy-regularized algorithm.
aio_mappings:
- target: AIO:ReinforcementLearning
  relation: related_match
  rationale: SAC is a particular algorithm for policy learning, whereas the pinned AIO target is a broad
    machine-learning task.
limitations:
- The inspected 2018 method includes a state-value approximator; later variants are not automatically
  identical in implementation.
- Tabular soft-policy-iteration theory does not by itself certify convergence of arbitrary neural function
  approximators.
