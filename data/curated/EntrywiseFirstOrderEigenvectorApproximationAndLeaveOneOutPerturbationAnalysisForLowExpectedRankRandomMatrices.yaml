claims:
- claim_id: claim-first-order-entrywise-eigenspace-approximation-and-leave-one-out
  kind: mechanism
  statement: "For a symmetric random matrix $\\mathbf{A} \\in \\mathbb{R}^{n \\times n}$ with expectation $\\mathbf{A}^* = \\mathbb{E}\\mathbf{A}$ having leading rank-$r$ eigenspace $\\mathbf{U}^*\\boldsymbol{\\Lambda}^*(\\mathbf{U}^*)^T$, eigengap $\\Delta^* = (\\lambda_r^* \\wedge |\\lambda_{r_0+r-1}^*|) - \\max_{r_0 \\le j < r}|\\lambda_j^*|$, condition number $\\kappa = \\max(|\\lambda_1^*|, |\\lambda_n^*|)/\\Delta^*$, and row-wise concentration function $\\varphi(t)$ under row-and-column independence (Assumptions A1\u2013A4), Theorem 2.1 proves that with probability at least $1 - \\delta$, the polar-aligned sample eigenspace $\\mathbf{U}\\operatorname{sgn}(\\mathbf{H})$ (where $\\operatorname{sgn}(\\mathbf{H}) = \\bar{\\mathbf{U}}\\bar{\\mathbf{V}}^T$ is the matrix sign of $\\mathbf{H} = \\mathbf{U}^T\\mathbf{U}^*$) satisfies the first-order linear approximation $\\|\\mathbf{U}\\operatorname{sgn}(\\mathbf{H}) - \\mathbf{A}\\mathbf{U}^*(\\boldsymbol{\\Lambda}^*)^{-1}\\|_{2\\to\\infty} \\lesssim [\\kappa(\\gamma + \\varphi(1/\\sqrt{n})) + \\varphi(\\gamma)/\\bar{\\gamma}]\\|\\mathbf{U}^*\\|_{2\\to\\infty}$ by constructing $n$ auxiliary leave-one-out matrices $[\\mathbf{A}^{(m)}]_{ij} = A_{ij}\\mathbf{1}_{\\{i \\ne m, j \\ne m\\}}$ whose eigenspace $\\mathbf{U}^{(m)}$ is independent of the $m$-th row $\\mathbf{A}_{m\\cdot}$ and satisfies $\\|\\mathbf{U}^{(m)}\\operatorname{sgn}(\\mathbf{H}^{(m)}) - \\mathbf{U}\\operatorname{sgn}(\\mathbf{H})\\|_F \\lesssim (\\kappa + \\gamma)\\|\\mathbf{U}\\|_{2\\to\\infty}$ (Section 2.2, Theorem 2.1, Corollary 2.1, Appendix A.1, and Appendix B Lemmas 1\u20135)."
  evidence:
  - source_id: afwz2020-entrywise-pdf
    locator: Section 1.2 (Theorem 1.1, pp. 4-5), Section 2 (Assumptions A1-A4, Theorem 2.1, Corollary 2.1, pp. 9-14), Appendix A (pp. 25-28), Appendix B (Lemmas 1-5, pp. 29-35)
    relation: supports
- claim_id: claim-sbm-exact-recovery-threshold-and-theorem-3-3-linf-impossibility
  kind: mechanism
  statement: In the two-block Stochastic Block Model $\mathrm{SBM}(n, a\log n / n, b\log n / n, J)$ with $a > b > 0$ and ground-truth labels $\mathbf{z} \in \{\pm 1\}^n$, applying Theorem 1.1 with $\varphi(t) \propto (1 \vee \log(1/t))^{-1}$ proves that the unregularized spectral estimator $\widehat{\mathbf{z}} = \operatorname{sgn}(\mathbf{u}_2)$ achieves exact recovery $\mathbb{P}(\min_{s \in \{\pm 1\}}\|\widehat{\mathbf{z}} - s\mathbf{z}\|_\infty = 0) = 1 - o(1)$ whenever $\sqrt{a} - \sqrt{b} > \sqrt{2}$ (matching the information-theoretic maximum likelihood threshold and settling the conjecture of Abbe et al. 2014b) and achieves the minimax exponential misclassification rate $\mathbb{E}r(\widehat{\mathbf{z}}, \mathbf{z}) \le n^{-(1+o(1))(\sqrt{a}-\sqrt{b})^2/2}$ when $\sqrt{a} - \sqrt{b} \in (0, \sqrt{2}]$ (Corollary 1.1, Theorem 3.2); moreover, Theorem 3.3 and Corollary 3.1 prove that when $a+b > 2$ and $(a+b-2)^2 < 4ab$, $\sqrt{n}\|\mathbf{u}_2 - \mathbf{u}_2^*\|_\infty \ge a(\eta - 1)/(a - b) - \varepsilon$ with probability $1 - o(1)$ (where $\eta \in (1, 2)$ solves $\eta\log\eta - \eta + 1 = 2/(a+b)$), which exceeds $1$ for sparse regimes above the threshold, demonstrating that direct $\|\mathbf{u}_2 - \mathbf{u}_2^*\|_\infty < 1/\sqrt{n}$ bounds fail and the first-order approximation $\mathbf{u}_2 \approx \mathbf{A}\mathbf{u}_2^* / \lambda_2^*$ is essential.
  evidence:
  - source_id: afwz2020-entrywise-pdf
    locator: Section 1.2 (Corollary 1.1, p. 6), Section 3.2 (Theorems 3.2-3.3, Corollary 3.1, pp. 15-19), Appendix C.2 (Lemmas 6-18, pp. 36-50)
    relation: supports
- claim_id: claim-z2-synchronization-and-noisy-matrix-completion-entrywise-rates
  kind: mechanism
  statement: In Gaussian $\mathbb{Z}_2$-synchronization $\mathbf{Y} = \mathbf{x}\mathbf{x}^T + \sigma\mathbf{W}$ with $\mathbf{x} \in \{\pm 1\}^n$ and symmetric Gaussian Wigner noise $\mathbf{W}$, Theorem 3.1 shows that the leading eigenvector satisfies $\min_{s \in \{\pm 1\}}\|s\mathbf{u}_1 - \mathbf{Y}\mathbf{x}/(n\sqrt{n})\|_\infty = O((\sigma^2\log n / n + \sigma\sqrt{\log n} / n) / \sqrt{n})$ with probability $1 - O(n^{-1})$, so $\widehat{\mathbf{x}} = \operatorname{sgn}(\mathbf{u}_1)$ achieves exact recovery down to the information-theoretic threshold $\sigma \le \sqrt{n / ((2+\varepsilon)\log n)}$ (Section 3.1, Theorem 3.1); for noisy low-rank matrix completion of $\mathbf{M}^* = \mathbf{U}^*\boldsymbol{\Sigma}^*(\mathbf{V}^*)^T \in \mathbb{R}^{n_1 \times n_2}$ observed with probability $p$ and noise variance $\sigma^2$, symmetric dilation into an $(n_1+n_2) \times (n_1+n_2)$ random matrix yields the entrywise error bound $\|\mathbf{M} - \mathbf{M}^*\|_{\max} \lesssim (1 + \sigma/\sigma_{\min}^*)\|\mathbf{M}^*\|_{\max}\sqrt{r(n_1+n_2)\log(n_1+n_2) / (p n_1 n_2)}$ (Section 3.3, Theorem 3.4, Appendix C.3).
  evidence:
