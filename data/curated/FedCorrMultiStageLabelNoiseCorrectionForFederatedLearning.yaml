claims:
- claim_id: r462-cumulative-lid-gmm-client-and-sample-noise-identification-mechanism
  kind: mechanism
  statement: Computes each client's Local Intrinsic Dimensionality score LID(D_k, f_k^{(t)}) over its M-dimensional prediction vectors via k-NN distance ratios (Equations 1-2), exploits the higher cumulative LID of noisy prediction subspaces to separate noisy clients S_n from clean clients S_c via a server-side 2-component GMM, and then fits a client-side 2-component GMM on per-sample cross-entropy losses on k in S_n to isolate corrupted samples D_k^n and estimate the local noise level mu_hat_k^{(t)} = |D_k^n| / |D_k|.
  evidence:
  - source_id: r462-primary-pdf
    locator: 'Section 3.1 Dimensionality of Prediction Subspace (Equations 1-2, Figure 2) & Section 3.2 Stage 1: Pre-processing (Algorithm 1 lines 1-13), pp. 3-5'
    relation: supports
- claim_id: r462-adaptive-proximal-regularization-and-partial-relabeling-scope
  kind: scope
  statement: Stabilizes local training under joint data heterogeneity and heterogeneous label noise without sharing raw client data by scaling each client's proximal penalty beta * mu_hat_k^{(t-1)} ||w_k^{(t)} - w^{(t-1)}||^2 proportionally to its estimated noise rate (Equation 5) and relabeling only the top-pi highest-loss noisy samples whose global-model confidence max(f_G^{(t)}(x)) >= theta (Equations 6-7).
  evidence:
  - source_id: r462-primary-pdf
    locator: Section 3.2 Adaptive Local Proximal Regularization & Label Correction (Equations 5-7), pp. 5-6
    relation: supports
- claim_id: r462-knn-lid-computation-and-clean-client-subset-limitation
  kind: limitation
  statement: Requires O(|D_k|^2 M) pairwise distance computations on each client's local prediction vectors per pre-processing iteration to estimate k-NN LID scores, and assumes the existence of a non-empty subset of relatively clean clients (mu_hat_k <= kappa) for Stage 2 finetuning.
  evidence:
  - source_id: r462-primary-pdf
    locator: Section 3.1-3.3 (Equations 1-2, Algorithm 1 lines 14-18) & Section 4.3 Ablation Study, pp. 3-8
    relation: supports
- claim_id: r462-federated-classification-under-heterogeneous-label-noise-application
  kind: application
  statement: Applied to federated image classification under heterogeneous synthetic and real-world label noise on CIFAR-10, CIFAR-100, and Clothing1M.
  evidence:
  - source_id: r462-primary-pdf
    locator: Section 4 Experiments (Tables 1-5, Figures 3-5), pp. 6-9
    relation: supports
