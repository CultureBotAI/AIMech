id: AIMech:FedCorrMultiStageLabelNoiseCorrectionForFederatedLearning
name: FedCorr (Multi-Stage Federated Learning for Heterogeneous Label Noise Correction)
concept_kind: algorithm
review_status: DRAFT
definition: "A three-stage federated learning framework for heterogeneous client label noise (Xu et al. 2022, Section 3, Equations 1-7, Algorithm 1) that (1) in a federated pre-processing stage (T_1 iterations with small\u7121-replacement sampling fraction gamma = 1/N), trains local models using Mixup cross-entropy plus an adaptive local proximal regularizer L(X_b) = L_CE(f_k^{(t)}(X_tilde_b), Y_tilde_b) + beta * mu_hat_k^{(t-1)} ||w_k^{(t)} - w^{(t-1)}||^2 proportional to each client's estimated noise rate mu_hat_k (Equation 5), partitions noisy versus clean clients via a two-component Gaussian Mixture Model (GMM) over cumulative Local Intrinsic Dimensionality (LID) scores of local prediction subspaces LID(D_k, f_k^{(t)}) = (1 / |D_k|) sum_{x in D_k} (-(1 / k) sum_{i=1}^k log(r_i(f(x)) / r_max(f(x))))^{-1} (Equations 1-2), separates noisy local samples D_k^n via a second per-client loss GMM, and partially relabels the top-pi fraction of high-loss samples exceeding global prediction confidence theta (Equations 6-7); (2) finetunes the global model on relatively clean clients (mu_hat_k <= kappa) for T_2 rounds followed by a second relabeling pass; and (3) performs standard FedAvg training across all corrected client datasets for T_3 rounds."
identity_notes: Distinct from centralized noisy-label learning methods such as DivideMix (AIMech:DivideMixLearningWithNoisyLabelsAsSemiSupervisedLearning, Li et al. 2020) and Co-teaching (AIMech:CoTeachingRobustTrainingOfDeepNeuralNetworksWithExtremelyNoisyLabels, Han et al. 2018), which assume a single centralized dataset with homogeneous noise and cannot distinguish clean versus noisy clients or bound non-IID weight divergence across distributed clients; and distinct from Byzantine-robust gradient aggregators (such as Krum or Trimmed Mean), which discard client updates rather than correcting corrupted local sample labels.
