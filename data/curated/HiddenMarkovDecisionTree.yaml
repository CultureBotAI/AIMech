claims:
- claim_id: method
  kind: mechanism
  statement: 'For level m and time t, its latent decision z_t^m is distributed conditional on the current
    input x_t, all current ancestor decisions z_t^1,...,z_t^(m-1), and its own preceding decision z_(t-1)^m.
    Initial decisions condition on the input and current ancestors without a preceding-time state. Multiplying
    these normalized conditional factors and one observation factor p(y_t|x_t,z_t^1,...,z_t^M) per time
    gives a normalized directed model conditional on inputs. A latent path through the hierarchy selects
    an output expert. Exact inference may enumerate the joint states but grows exponentially with hierarchy
    depth. The paper explores three distinct approximations: a product of chain-path distributions that
    preserves temporal dependence within each level; a product over times of tree-structured distributions
    that preserves current ancestor dependence; and a point-mass path approximation. Its point-mass procedure
    optimizes one level’s path by a Viterbi subroutine while holding the other paths fixed. These are
    inference choices for the family, not alternative definitions of its identity.'
