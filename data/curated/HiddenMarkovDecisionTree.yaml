name: Hidden Markov decision tree
definition: A conditional latent sequence-model family that extends a probabilistic hierarchical decision
  tree by coupling each decision level to the same level at the previous time.
concept_kind: model_family
identity_notes: 'The Jordan–Ghahramani–Saul model uses probabilistic choices down a hierarchy and Markov
  persistence within each level. It is not a hard deterministic classification tree, an independent-chain
  factorial HMM, a tree-shaped index, or a particular variational inference algorithm. Current higher-level
  decisions influence lower-level decisions; independent factorial chains arise only under additional
  restrictions. The model conditions on an external input sequence. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 379 preceding native IDs/names/aliases for the
  four researched candidate names. Both full-checkout fixed-string searches included ignored and hidden
  files, with 7 and 7 matching lines. All 6 unique matched contents were read: pending leads and preceding
  source/review context, not existing records of these three new identities. Expanded source IDs, plurals,
  Gibbs-machine and mixture-transition terminology were included. All 63 semantic label/synonym hits,
  17 exact fully annotated AIO CLASS nodes with outgoing edges, their generated YAMLs and six native neighbors
  were read or byte-verified after prior complete reading. Markov mixtures of experts substantially overlaps
  the existing IOHMM family, so no fourth ID or unconditional alias is created. Absence is bounded to
  the pinned vocabulary and inspected neighborhood.'
limitations:
- Same-level temporal connections and current-ancestor dependencies are defining restrictions of the inspected
  construction. They do not cover arbitrary cross-time connections or all models whose names contain hidden
  Markov tree.
- The probabilistic hierarchy sums over decision paths; it is not necessarily a hard classification tree.
  Input conditioning and an output expert do not imply a causal interpretation of the graph.
- Independent latent chains, a single HMM and an ordinary hierarchical mixture arise under specific restrictions,
  not as unconditional aliases of this family.
- Forest-of-chains, forest-of-trees and point-mass inference discard different posterior dependencies.
  A coordinate Viterbi step finds the best path for one fixed-context chain, not a guaranteed global joint
  MAP path.
- The paper motivates hierarchical time scales but its synthetic runs did not always recover the intended
  hierarchy. No universal coarse-to-fine organization, general convergence guarantee, benchmark advantage
  or author-code reproduction is asserted. Detailed generic variational updates remain a separate source
  lead.
