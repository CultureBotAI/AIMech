id: AIMech:NonlinearAutoregressiveMovingAverageExogenousModel
name: Nonlinear autoregressive moving average model with exogenous inputs
aliases:
- NARMAX model
concept_kind: model_family
definition: A discrete-time nonlinear input-output model family whose current output is a function of
  finite lagged outputs, exogenous inputs and errors, plus an additive current error.
identity_notes: Compared all 442 pinned AIO IDs, labels and all scoped synonyms and 528 native IDs, names
  and aliases with the proposed names, IDs, NARX/NARMAX and expanded variants; no normalized identity
  match. Ignored- and hidden-inclusive full-text searches covered the recovery worktree and readable previous
  worktree, returning 22 and zero lines respectively; all hits were inspected and concern the previous
  OLS record, its saved review, pages and pending source cohort. The original Documents checkout remains
  inaccessible, so its untracked files are not claimed searched. Read all 76 AIO semantic rows and 98
  native name/definition neighbors, 12 complete annotated AIO CLASS nodes with incident edges, four closest
  generated records and the native linear state-space layer record. The OLS selector is an estimator rather
  than either model family. A neural autoregressive density estimator models ordered conditional distributions;
  it does not by its name denote these lagged input-output recurrences. State-space neural layers and
  architectures maintain different state/parameterization scopes. This assessment is bounded to the inspected
  pin and accessible corpus. NARMAX is the encompassing notation in the representation paper; the companion
  OLS paper explicitly distinguishes its NARX subclass. Linear regression, least-squares analysis and
  forward selection describe estimators or fitting scope. RecurrentNeuralNetwork and EchoStateNetwork
  require neural structures; VAR requires linear multivariate structure; TAR uses regime changes; autoregressive
  language models target token distributions. None is an exact identity for this family.
