aio_mappings:
- target: AIO:TimeSeriesAnalysis
  relation: related_match
  rationale: This finite-lag input-output model family provides a representation used in time-series analysis
    and system identification. The pinned target is an analysis task, so this is a model/task relationship
    rather than equivalence or an is-a assertion.
- target: AIO:AutoregressiveMovingAverage
  relation: related_match
  rationale: Both use autoregressive and lagged-error structure. The pinned ARMA class describes stationary-series
    modeling; this record allows nonlinear functions and exogenous inputs and does not imply stationarity.
    The shared structure supports a related mapping, not an exact or broader-class claim.
limitations:
- This record covers finite-lag, real-valued, discrete-time, strictly causal input-output formulations;
  current-input/feedthrough conventions and broader vector/noise assumptions need explicit specification.
  The family is not a trained model, dataset or unique estimator.
- Local realization, uniqueness, stability, identifiability and predictive accuracy are separate questions.
  No claim is made that every nonlinear or stochastic system has an exact global representation of this
  form. Original 1984 reports and 1985 journal proofs are follow-up sources, not audited theorem evidence
  here.
- The 1989 representation paper contains problematic unrestricted inverse formulas and a numerical approximation
  bound contradicted by exact substitution. Those statements are not adopted. Its explicit recurrence
  definitions and scoped polynomial construction are distinguishable from these source defects.
- No model was trained and no empirical result was replicated. Exact finite curator examples check stated
  boundaries. The record remains DRAFT; structural validation and author self-review are not independent
  scientific approval.
