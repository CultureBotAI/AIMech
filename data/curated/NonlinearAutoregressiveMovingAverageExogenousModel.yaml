claims:
- claim_id: lagged-error-recurrence
  kind: mechanism
  statement: In the strictly causal scalar form, y_t=F(y_{t−1},…,y_{t−ny},u_{t−1},…,u_{t−nu},e_{t−1},…,e_{t−ne})+e_t.
    Removing explicit lagged-error dependence gives NARX; removing exogenous inputs gives a NARMA form.
    The moving-average terminology here concerns lagged errors inside a possibly nonlinear function, not
    a running arithmetic average of observations. Finite-lag recurrence structure does not require a neural
    network.
  evidence:
  - source_id: chen-luo1989
    locator: Section 2, Equations 1–6, PDF p. 3 / printed p. 1874
    relation: supports
  - source_id: chen-billings1989
    locator: Section 6, Equations 69–72, PDF p. 16 / printed p. 1028
    relation: supports
- claim_id: innovation-versus-fitted-residual
  kind: scope
  statement: In the conditional-mean innovation construction, the prediction is the conditional expectation
    of the current output given available past information, and the innovation is output minus that expectation.
    This interpretation requires the relevant moments and information set; it does not imply independent
    Gaussian errors. The companion OLS formulation separately assumes zero-mean independent noise. For
    an estimated model with chosen parameters, recursively computed prediction residuals are parameter-dependent
    and are not automatically the true innovations of the data-generating system.
  evidence:
  - source_id: chen-billings1989
    locator: Section 6, Equations 58–69 and 77–81, PDF pp. 15–16,18 / printed pp. 1027–1028,1030
    relation: supports
  - source_id: chen-luo1989
    locator: Section 2, Equations 1–5 and noise definition, PDF p. 3 / printed p. 1874
    relation: supports
- claim_id: latent-error-estimation
  kind: mechanism
  statement: Polynomial expansion is formally linear in coefficients, but lagged noise variables are not
    directly observed. Consequently the regressor matrix is not fixed directly from input-output measurements.
    The OLS paper describes an iterative extension that substitutes prediction residuals, rebuilds noise-containing
    regressors and refits. This is one estimator for the family; its reported few-iteration behavior is
    not a universal convergence guarantee or a definition of NARMAX itself.
  evidence:
  - source_id: chen-luo1989
    locator: Sections 2 and 5, Equations 83–91, PDF pp. 5,18–20 / printed pp. 1876,1889–1891
    relation: supports
- claim_id: residual-initialization-and-stability
  kind: limitation
  statement: 'Prediction with lagged errors requires residual initialization. Model invertibility asks
    whether residual sequences from different initializations forget that difference for the specified
    model and input process. Linearity in lagged errors alone is insufficient: in y_t=u_{t−1}²+a*e_{t−1}+e_t,
    two residual recursions driven by identical observations differ by (−a)^t times their initial difference.
    With initial difference 1, the difference after eight steps is 1/256 for a=1/2 and 256 for a=2. The
    source’s particular stochastic sufficient condition and example must not be generalized to arbitrary
    coefficients or input distributions.'
  evidence:
  - source_id: chen-billings1989
    locator: Section 6, Equations 74–83 and Example 6, PDF pp. 17–19 / printed pp. 1029–1031; curator
      exact examples in research/discovery/narx-narmax-boundaries.py
    relation: supports
- claim_id: polynomial-scope
  kind: scope
  statement: A polynomial parameterization expands finite lag variables into monomials and is linear in
    the monomial coefficients, while it can be nonlinear in the input and output values. The continuous
    scalar recurrence function on a specified compact finite-dimensional lag domain can be uniformly approximated
    by some polynomial; this does not prescribe a fixed degree, identify coefficients from finite observations,
    justify extrapolation, or guarantee stable recursive trajectories. The general model family is not
    restricted to polynomial parameterizations.
  evidence:
  - source_id: chen-luo1989
    locator: Section 2, Equations 6–13, PDF pp. 3–5 / printed pp. 1874–1876
    relation: supports
  - source_id: chen-billings1989
    locator: Section 4, Equations 34–43, PDF pp. 9–11 / printed pp. 1021–1023; curator exact examples
      in research/discovery/narx-narmax-boundaries.py
    relation: supports
- claim_id: published-approximation-bound
  kind: limitation
  statement: 'The source supplies the displayed formulas and stated error bound below; the refutation
    and trajectory calculation are curator derivations. The representation paper’s particular degree-four
    approximation example claims error below 0.04 on |y|<=1/4, |u|<=1. Exact substitution in its displayed
    formulas gives error 5/16 at y=−1/4,u=1, and 2336/15625 at y=−6/25,u=1 (the y coordinate is interior;
    u is on the boundary). These curator counterexamples reject that numerical bound, not the compact-domain
    polynomial approximation existence statement. A small one-step function error also need not remain
    small under repeated simulation: comparing f(y)=2y and g(y)=2y+1/100 from zero gives difference (2^t−1)/100
    after t steps.'
  evidence:
  - source_id: chen-billings1989
    locator: Section 4, displayed recurrence, polynomial and claimed error bound after Equation 43, PDF
      pp. 11–12 / printed pp. 1023–1024; these source inputs support the explicit curator derivations
      in research/discovery/narx-narmax-boundaries.py, not an author-reported correction
    relation: supports
