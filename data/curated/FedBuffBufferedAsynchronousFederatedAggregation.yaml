id: AIMech:FedBuffBufferedAsynchronousFederatedAggregation
name: FedBuff (Federated Learning with Buffered Asynchronous Aggregation)
concept_kind: algorithm
review_status: DRAFT
definition: A buffered asynchronous federated optimization algorithm (Nguyen et al. 2022, Section 3, Algorithm 1) in which the server schedules up to M concurrent clients asynchronously without barrier synchronization, accumulates each arriving client's local multi-step update Delta_i = w^{(t - tau_i)} - w_{i, Q}^{(t - tau_i)} inside a secure aggregation buffer u = u + s(tau_i) Delta_i of configurable capacity K >= 1 (independent of concurrency M), and triggers a global server update w^{(t+1)} = w^{(t)} - eta_g (u / K) only when K updates have been buffered.
identity_notes: Distinct from synchronous Federated Averaging / FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization) and FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam), which block each round until the slowest scheduled straggler finishes, and from unbuffered asynchronous FL (FedAsync, K = 1), which updates the global model on every single client arrival and exposes each individual client update without cohort secure aggregation.
aliases:
- FedBuff
- Buffered Asynchronous Federated Aggregation
- Federated Learning with Buffered Asynchronous Aggregation
