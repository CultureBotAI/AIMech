claims:
- claim_id: r419-k-fold-server-step-staleness-contraction-and-nonconvex-ergodic-bound
  kind: mechanism
  statement: Buffering K >= 1 client updates before advancing the server step index t divides the effective server-step staleness tau_{i, K} by a factor of K relative to unbuffered asynchronous aggregation (tau_{max, K} <= ceil(tau_{max, 1} / K), Appendix A), and under bounded gradient dissimilarity and staleness establishes the smooth non-convex convergence bound O(1 / sqrt(T Q K)) + O(Q^2 tau_max^2 / T) (Section 4, Theorem 1, Corollary 1).
  evidence:
  - source_id: r419-primary-pdf
    locator: Section 4 Convergence Analysis (Assumptions 1-4, Theorem 1, Corollary 1) & Appendix A-B (Relationship Between K and Staleness, Proof of Theorem 1)
    relation: supports
- claim_id: r419-secure-aggregation-compatibility-and-batch-learning-rate-normalization
  kind: mechanism
  statement: Accumulating K updates inside a Trusted Execution Environment or cryptographic Secure Aggregation buffer hides individual client updates from the server until K clients are averaged (unlike FedAsync with K = 1), while Learning Rate Normalization eta_q = eta_l (b_q / B) equalizes local SGD progress across clients with heterogeneous local batch sizes b_q (Section 3.1 & Appendix C.6.1).
  evidence:
  - source_id: r419-primary-pdf
    locator: Section 3.1 Privacy and Security (Table 1) & Appendix C.6.1 Learning Rate Normalization
    relation: supports
- claim_id: r419-buffer-size-latency-vs-staleness-tradeoff-and-over-concurrency-limitation
  kind: limitation
  statement: Choosing K too large increases wall-clock waiting time per server update (approaching synchronous FedAvg when K = M), whereas setting concurrency M >> K inflates worst-case staleness tau_max and requires staleness down-weighting s(tau) = (1 + tau)^{-alpha} to prevent stale client updates from destabilizing training.
  evidence:
  - source_id: r419-primary-pdf
    locator: Section 4-5 Trade-offs of Buffer Size K and Concurrency M (Figures 4-6)
    relation: supports
- claim_id: r419-celeba-sent140-cifar10-and-production-federated-application
  kind: application
  statement: Applied to asynchronous federated learning on CelebA, Sent140, CIFAR-10, and million-device production mobile benchmarks under realistic client speed and availability traces, achieving up to 3.8x speedup over synchronous FedAvg and FedAdam.
  evidence:
  - source_id: r419-primary-pdf
    locator: Section 5 Experiments (Figures 2-6, Tables 2-3), pp. 3586-3590
    relation: supports
