claims:
- claim_id: claim-sarah-recursive-estimator-exact-variance-identity
  kind: mechanism
  statement: For the recursive stochastic gradient update v_t = grad f_{i_t}(w_t) - grad f_{i_t}(w_{t-1}) + v_{t-1} with v_0 = grad P(w_0), the estimator is conditionally biased (E[v_t | F_t] = grad P(w_t) - grad P(w_{t-1}) + v_{t-1}) yet satisfies the exact variance identity E[||grad P(w_t) - v_t||^2] = sum_{j=1}^t E[||v_j - v_{j-1}||^2] - sum_{j=1}^t E[||grad P(w_j) - grad P(w_{j-1})||^2] for any L-smooth functions without convexity (Lemma 2), and when each f_i is convex and L-smooth with learning rate eta < 2/L, E[||grad P(w_t) - v_t||^2] <= (eta*L / (2 - eta*L)) (E[||v_0||^2] - E[||v_t||^2]) <= (eta*L / (2 - eta*L)) E[||v_0||^2] (Lemma 3).
  evidence:
  - source_id: r344-primary-pdf
    locator: Section 2, Equation 5, p. 3; Section 3.2, Lemmas 1, 2, and 3, p. 5; Supplementary Material B.2-B.3, Proofs of Lemma 2 and Lemma 3, p. 11
    relation: supports
  - source_id: r344-arxiv-abs
    locator: 'Abstract: recursive framework for updating stochastic gradient estimates without storing past gradients'
    relation: supports
- claim_id: claim-sarah-inner-loop-and-outer-loop-linear-convergence
  kind: mechanism
  statement: Unlike SVRG, SARAH's stochastic step norm E[||v_t||^2] converges linearly to zero within a single inner loop under mu-strong convexity of P with convex f_i at rate (1 - (2/(eta*L) - 1)*mu^2*eta^2)^t for eta < 2/L (Theorem 1a) and at rate (1 - 2*mu*L*eta/(mu + L))^t when each f_i is mu-strongly convex for eta <= 2/(mu + L) (Theorem 1b); across outer loops, Theorem 4 and Corollary 3 prove E[||grad P(w_tilde_s)||^2] <= (sigma_m)^s ||grad P(w_tilde_0)||^2 with contraction factor sigma_m = 1/(mu*eta*(m+1)) + eta*L/(2 - eta*L) < 1 for any eta < 1/L, which is strictly smaller than SVRG's contraction factor alpha_m = 1/(mu*eta*(1 - 2*L*eta)*m) + 2*eta*L/(1 - 2*eta*L) for identical eta < 1/(4L) and m (Remark 1), achieving O((n + kappa) log(1/epsilon)) total complexity.
  evidence:
  - source_id: r344-primary-pdf
    locator: Section 3.1, Theorems 1a and 1b, p. 4; Section 3.2.2, Theorem 4, Remark 1, and Corollary 3, p. 6; Supplementary Material B.5-B.6 and B.9, pp. 12-14
    relation: supports
  - source_id: r344-metadata-cr
    locator: 'PMLR 70:2613-2621 abstract: linear convergence rate proven in the strongly convex case for both outer and inner loops'
    relation: supports
- claim_id: claim-sarah-general-convex-residual-and-sarah-plus-threshold
  kind: limitation
  statement: For general non-strongly convex functions with multiple outer loops and fixed inner loop size m, SARAH converges only to a neighborhood Delta = delta*(1 + eta*L/(2*(1 - eta*L))) where delta = max_{0<=k<s} 2*E[P(w_tilde_k) - P(w^*)] / (eta*(m+1)), requiring m = O(1/epsilon) to reach E[||grad P(w_tilde_s)||^2] <= epsilon in O((n + 1/epsilon) log(1/epsilon)) complexity (Theorem 3 and Corollary 2); in the practical variant SARAH+ (Algorithm 2), choosing the inner stopping threshold gamma too large (e.g., gamma -> 1) terminates the inner loop prematurely and degenerates to full gradient descent, whereas choosing gamma too small (gamma << 1/8) performs excessive inner steps once the inner convergence slows down.
  evidence:
  - source_id: r344-primary-pdf
    locator: Section 3.2.1, Theorem 3 and Corollary 2, pp. 5-6; Section 4, Algorithm 2 (SARAH+) and sensitivity to gamma, p. 7
    relation: supports
