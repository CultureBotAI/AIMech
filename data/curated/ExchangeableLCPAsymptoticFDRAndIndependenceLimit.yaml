  rationale: Exchangeable Largest Crossing Point (LCP) asymptotic FDR theory quantifies the exact limiting
    false discovery rate and expected error rate of linear step-up multiple testing under equicorrelated,
    studentized, and general exchangeable dependence structures, directly addressing multiplicity-induced
    false positives (AIO:DataDredgingBias).
limitations:
- 'In both the equicorrelated normal model D-EX-N(1) and the jointly studentized normal model D-EX-t(1),
  the sample-size limit n -> infty and the independence limit (rho -> 0^+ or nu -> infty) do not commute
  at the global null zeta = 1: taking n -> infty first and then rho -> 0^+ (or nu -> infty) yields Phi(-sqrt(-2*ln(alpha)))
  = 0.00718763 < alpha = 0.05 because the conditional empirical c.d.f. has zero right-hand derivative
  gamma(z) = 0 at t = 0, whereas taking rho -> 0^+ (or nu -> infty) at fixed n yields the independent
  global-null FDR equal to alpha (Theorems 3.3 and 4.3, pages 1445-1450).'
- While the asymptotic FDR in D-EX-N(zeta) and D-EX-t(zeta) is bounded above by zeta*alpha, the unconditional
  Expected Error Rate EER_infty(zeta) can substantially exceed the independent EER limit alpha*zeta*(1
  - zeta)/(1 - alpha*zeta) under moderate correlation rho or small degrees of freedom nu, and the conditional
  false discovery proportion V_n(z)/(R_n(z) vee 1) exhibits high variance and heavy clustering near 0
  and 1 across realizations of the latent factor Z (Figures 2 and 4, Section 5 Concluding Remarks, pages
  1445-1451).
- In the prose following Theorem 3.3 on page 1446 (lines 6-7) and following Theorem 4.3 on page 1448 (lines
  32-33), the paper writes that as rho -> 0 (or nu -> infty), EER_infty(zeta) tends to alpha*(1 - zeta)/(1
  - alpha*zeta) for zeta in (0, 1); that prose expression omits the factor zeta from the true independent
  limit EER_infty(zeta) = t^*/alpha - (1 - zeta) = zeta*t^* = alpha*zeta*(1 - zeta)/(1 - alpha*zeta) (where
  t^* = alpha*(1 - zeta)/(1 - alpha*zeta) is the independent crossing point, as correctly reflected by
  the integral in Theorem 3.1 and Figure 2 on page 1445 where EER_infty(0.5) -> 0.01282051 at alpha =
  0.05 rather than 0.02564103).
- All 24 pages of the full-text PDF of Finner, Dickhaus, & Roters (2007, Annals of Statistics 35(4):1432-1455,
  arXiv:0710.3171v1, DOI:10.1214/009053607000000046) were read. Constructed numerical checks in research/discovery/exchangeable-lcp-asymptotic-fdr-and-independence-limit-boundaries.py
  verify (1) Lemma 2.2 and Example 2.3 exact conditional linear step-up FDR_n(zeta_n | z) = (n_0/n)*gamma(z)*alpha
  = 0.11982106 via Bolshev/Steck recursion and exact unconditional invariance FDR_n(zeta_n) = (n_0/n)*alpha
  = 0.13333333 for shifted exponential variables T_i = X_i - Z, (2) Section 3 Equations (3.1)-(3.5), Theorem
  3.2, and Remark 3.1 tangent-point solutions and upper bounds across rho in [0.0001, 0.5], (3) Theorem
  3.3 exact algebraic Mills-ratio exponent identity exp((w^2 - u^2)/2) == delta and global-null double-limit
  discontinuity Phi(-sqrt(-2*ln(0.05))) = 0.00718763 vs alpha = 0.05, (4) Theorem 3.1 numerical integration
  at zeta = 0.5, alpha = 0.05 confirming convergence of EER_infty(0.5) to 0.01282051 and FDR_infty(0.5)
  to 0.025 as rho -> 0^+, and (5) Lemma 4.1 and Theorem 4.3 studentized D-EX-t(1) inflection-point scaling
  a(s_nu(alpha), nu)^4/nu -> -4*ln(alpha) = 11.982929.
