claims:
- claim_id: dirac-exchangeable-conditional-ecdf-and-largest-crossing-point-laws
  kind: mechanism
  statement: 'Under the Dirac-exchangeable model D-EX(zeta_n) where T_i = g(X_i, Z) for i = 1, ..., n
    with n_0 = zeta_n*n true nulls (vartheta_i = 0) and n_1 = (1 - zeta_n)*n Dirac-zero false nulls (vartheta_i
    = infty), conditioning on Z = z renders the null p-values conditionally i.i.d. with limiting conditional
    empirical c.d.f. F_infty(t | z, zeta) = (1 - zeta) + zeta*(1 - W_X(g_1(W_T^{-1}(1 - t), z))) (Section
    2.1, Lemma 2.1, page 1437, Equation (2.2)). Defining the Largest Crossing Point (LCP) of F_infty(.
    | z, zeta) with the Simes line r_alpha(t) = t/alpha by t(z | zeta) = sup{t in [alpha*(1 - zeta), alpha]
    : F_infty(t | z, zeta) = t/alpha} (Equation (2.3)), Theorem 2.1 (page 1438, Equations (2.4)-(2.7))
    proves that for zeta in (0, 1) when P^Z(D_zeta) = 0 (where D_zeta is the set of tangent points without
    transversal crossing), lim_{n->infty} V_n(z)/n = t(z | zeta)/alpha - (1 - zeta) a.s. and lim_{n->infty}
    V_n(z)/(R_n(z) vee 1) = 1 - alpha*(1 - zeta)/t(z | zeta) a.s., yielding unconditional asymptotic limits
    EER_infty(zeta) = E^Z[t(Z | zeta)]/alpha - (1 - zeta) and FDR_infty(zeta) = 1 - alpha*(1 - zeta)*E^Z[1/t(Z
    | zeta)] along with exact limiting c.d.f.s G_{zeta,1} and G_{zeta,2} (Theorem 2.2, pages 1438-1439,
    Equations (2.8)-(2.9)).'
  evidence:
  - source_id: finner-dickhaus-roters2007-pdf
    locator: Section 2.1–2.2, pages 1435–1439, Lemma 2.1, Theorems 2.1–2.2, and Equations (2.1)–(2.9)
    relation: supports
  - source_id: finner-dickhaus-roters2007-abs
    locator: Abstract (representation of exchangeable test statistics via i.i.d. variables and a single
      disturbance variable, conditional empirical distribution, and largest crossing point)
    relation: supports
- claim_id: complete-null-zero-crossing-derivative-law-and-shifted-exponential-invariance
  kind: mechanism
  statement: 'At the complete null zeta = 1 where F_infty(t | z, 1) = F_infty(t | z) can have Largest
    Crossing Point t(z | 1) = 0 on E_0 = {z : t(z | 1) = 0}, Lemma 2.2 (Section 2.2, page 1440, Equation
    (2.10)) proves that if n_0 i.i.d. variables have linear c.d.f. F_xi(t) = gamma*t on [0, alpha] with
    gamma <= 1/alpha and n_1 variables equal 0 a.s., then the exact finite-sample linear step-up FDR is
    E[V_n''/(R_n'' vee 1)] = (n_0/n)*gamma*alpha. Example 2.3 (page 1441) shows that for shifted exponential
    variables T_i = X_i - Z with X_i, Z i.i.d. Exp(1), F_infty(t | z) = 2*exp(-z)*t on [0, exp(z)/2] has
    gamma(z) = 2*exp(-z), so for alpha -> 0 (or after truncating Z at ln(2*alpha)) the linear step-up
    procedure satisfies FDR_n(zeta_n) = zeta_n*alpha identically despite strong MTP_2 dependence. Generally,
    Theorems 2.3-2.4 (pages 1441-1443, Equations (2.12)-(2.15)) prove that if F_infty(t | z) has right-hand
    derivative at zero gamma(z) = lim_{t->0^+} F_infty(t | z)/t < 1/alpha on E_0, then FDR_infty(1 | z)
    = alpha*gamma(z) for z in E_0 and FDR_infty(1 | z) = 1 for z in E_1 = {z : t(z | 1) > 0}, giving the
    exact decomposition FDR_infty(1) = P^Z(E_1) + alpha * int_{E_0} gamma(z) dP^Z(z).'
  evidence:
  - source_id: finner-dickhaus-roters2007-pdf
    locator: Section 2.2, pages 1439–1443, Lemmas 2.2–2.3, Example 2.3, Theorems 2.3–2.4, and Equations
      (2.10)–(2.15)
    relation: supports
- claim_id: equicorrelated-normal-tangent-point-jump-and-double-limit-discontinuity
  kind: mechanism
  statement: In the equicorrelated normal model D-EX-N(zeta_n) where T_i = vartheta_i + sqrt(1 - rho)*X_i
    - sqrt(rho)*X_0 with rho in (0, 1) (Section 3, pages 1443-1446), F_infty(t | x_0) = 1 - Phi((Phi^{-1}(1
    - t) + sqrt(rho)*x_0)/sqrt(1 - rho)) satisfies gamma(x_0) = 0 for all x_0 in R, and solving F_infty(t
    | x_0, zeta) = t/alpha for x_0 yields the unique crossing-point function x_0(t | zeta) = sqrt((1 -
    rho)/rho)*Phi^{-1}((1 - t/alpha)/zeta) - Phi^{-1}(1 - t)/sqrt(rho) (Equation (3.1)). Solving the simultaneous
    tangent point conditions d(u | x_0, zeta) = 0 and d_u(u | x_0, zeta) = 0 (Equations (3.3)-(3.4)) yields
    u_{1,2}(x_0) = -x_0/sqrt(rho) +- sqrt((1 - rho)/rho)*sqrt(x_0^2 - 2*ln(sqrt(1 - rho)/(alpha*zeta)))
    (Equation (3.5)), which defines a jump interval (t_1, t_2) on which the LCP jumps discontinuously
    at x_0(t_1 | zeta) = x_0(t_2 | zeta). Theorems 3.1-3.2 (pages 1444-1445) derive closed-form integrals
    for EER_infty(zeta) and FDR_infty(zeta), showing at the global null zeta = 1 that EER_infty(1) = int_{t_2/alpha}^1
    Phi(x_0(alpha*t | 1)) dt and FDR_infty(1) = Phi(x_0(t_2 | 1)) <= Phi(-sqrt(2*ln(sqrt(1 - rho)/alpha)))
    (Remark 3.1). Theorem 3.3 (page 1445, Equation (3.6); proof on pages 1452-1453) proves that while
    lim_{rho->0^+} FDR_infty(zeta) = zeta*alpha for every fixed zeta in (0, 1), at the global null zeta
    = 1 the limit as correlation vanishes is lim_{rho->0^+} FDR_infty(1) = Phi(-sqrt(-2*ln(alpha))) <
    alpha for all alpha in (0, 1/2] (specifically 0.00718763 vs alpha = 0.05 at alpha = 0.05, a 6.9564x
    ratio).
  evidence:
  - source_id: finner-dickhaus-roters2007-pdf
    locator: Section 3, pages 1443–1446, Theorems 3.1–3.3, Remark 3.1, Figures 1–3, Equations (3.1)–(3.6),
      and Appendix pages 1451–1453
    relation: supports
  - source_id: finner-dickhaus-roters2007-abs
    locator: Abstract (explicit calculation of limiting FDR for normal distribution models when correlation
      tends to zero and comparison with the independent case)
    relation: supports
- claim_id: jointly-studentized-t-model-crossing-bounds-and-degrees-of-freedom-limit
  kind: mechanism
  statement: In the jointly studentized normal model D-EX-t(zeta_n) where T_i = (vartheta_i + X_i)/S with
    nu*S^2 ~ chi_nu^2 independent of X_1, ..., X_n (Section 4, pages 1446-1450), F_infty(t | s) = 1 -
    Phi(s*t_{nu, 1-t}) has right-hand derivative gamma(s) = 0 for all s > 0, and solving F_infty(t | s,
    zeta) = t/alpha yields s(t | zeta) = Phi^{-1}((1 - t/alpha)/zeta) / t_{nu, 1-t}, which is positive
    only on the restricted crossing interval [t_u, t_o] = [alpha*(1 - zeta), alpha*(1 - zeta/2)] because
    t_{nu, 1-t} > 0 for t < 1/2 and Phi^{-1}((1 - t/alpha)/zeta) >= 0 iff t <= alpha*(1 - zeta/2) (pages
    1446-1447). Theorems 4.1-4.2 (pages 1447-1448) express EER_infty(zeta) and FDR_infty(zeta) in terms
    of the chi-distribution c.d.f. F_{chi_nu}(sqrt(nu)*s(t | zeta)), with global-null values EER_infty(1)
    = int_{t_2/alpha}^{1/2} F_{chi_nu}(sqrt(nu)*s(alpha*t | 1)) dt and FDR_infty(1) = F_{chi_nu}(sqrt(nu)*s(t_2
    | 1)). Using the asymptotic inflection-point scaling s_nu(x) = 1 - nu^{-1/2}*(-ln x)^{1/2} + o(nu^{-1/2})
    and a(s, nu) = sqrt((nu + 1)/s^2 - nu) where a(s_nu(x), nu)^4/nu -> -4*ln(x) and a(s_nu(x), nu)^2*(1
    - s_nu(x)^2) -> -4*ln(x) (Lemma 4.1, page 1448; proof on pages 1453-1454), Theorem 4.3 (page 1448,
    Equation (4.1)) proves via the Central Limit Theorem for (nu*S^2 - nu)/sqrt(2*nu) that lim_{nu->infty}
    FDR_infty(1) = Phi(-sqrt(-2*ln(alpha))), identical to the vanishing-correlation limit in the equicorrelated
    normal model.
  evidence:
  - source_id: finner-dickhaus-roters2007-pdf
    locator: Section 4, pages 1446–1450, Lemma 4.1, Theorems 4.1–4.3, Figures 4–6, Equation (4.1), and
      Appendix pages 1453–1454
    relation: supports
