id: AIMech:ExchangeableLCPAsymptoticFDRAndIndependenceLimit
name: exchangeable largest crossing point asymptotic false discovery rate and global-null independence
  limit discontinuity
aliases:
- Finner-Dickhaus-Roters Exchangeable LCP Asymptotic FDR Framework
- Dirac-Exchangeable Conditional Empirical CDF Largest Crossing Point (LCP) Method
- Global-Null Double-Limit FDR Discontinuity Phi(-sqrt(-2*ln(alpha))) in Equicorrelated and Studentized
  Normal Models
concept_kind: mathematical_method
definition: 'An asymptotic multiple hypothesis testing analysis framework introduced by Helmut Finner,
  Thorsten Dickhaus, and Markus Roters (2007, Annals of Statistics 35(4):1432-1455, arXiv:0710.3171v1,
  DOI:10.1214/009053607000000046) that characterizes the limiting Expected Error Rate EER_infty(zeta)
  = lim_{n->infty} E[V_n/n] and limiting False Discovery Rate FDR_infty(zeta) = lim_{n->infty} E[V_n/(R_n
  vee 1)] of the linear step-up (LSU / Benjamini-Hochberg) procedure with Simes rejection curve r_alpha(t)
  = t/alpha under exchangeable test statistics T_i = g(X_i, Z) (i = 1, ..., n) generated by i.i.d. innovations
  X_1, ..., X_n and a common latent disturbance Z in Dirac-exchangeable configurations D-EX(zeta_n) with
  n_0/n -> zeta in (0, 1]. Conditioning on Z = z makes the p-values conditionally independent with limiting
  conditional empirical c.d.f. F_infty(t | z, zeta) = (1 - zeta) + zeta*(1 - W_X(g_1(W_T^{-1}(1 - t),
  z))) (Lemma 2.1, Equation (2.2)) and Largest Crossing Point (LCP) t(z | zeta) = sup{t in [alpha*(1 -
  zeta), alpha] : F_infty(t | z, zeta) = t/alpha} (Equation (2.3)). For zeta in (0, 1), V_n(z)/n -> t(z
  | zeta)/alpha - (1 - zeta) a.s. and V_n(z)/(R_n(z) vee 1) -> 1 - alpha*(1 - zeta)/t(z | zeta) a.s. (Theorems
  2.1-2.2, Equations (2.4)-(2.9)). At the complete null zeta = 1 where t(z | 1) = 0 on E_0, Lemma 2.2
  and Theorems 2.3-2.4 prove that FDR_infty(1 | z) = alpha*gamma(z) with right-hand derivative gamma(z)
  = lim_{t->0^+} F_infty(t | z)/t and FDR_infty(1) = P^Z(E_1) + alpha * int_{E_0} gamma(z) dP^Z(z) (Equations
  (2.10)-(2.15)). Applying this theory to equicorrelated normal variables D-EX-N(zeta_n) (Section 3, Theorems
  3.1-3.3, Remark 3.1, Equations (3.1)-(3.6)) and jointly studentized normal variables D-EX-t(zeta_n)
  (Section 4, Lemma 4.1, Theorems 4.1-4.3, Equation (4.1)) proves that at zeta = 1, gamma(z) == 0 on E_0,
  and as the correlation rho -> 0^+ or degrees of freedom nu -> infty, lim_{rho->0^+} FDR_infty(1) = lim_{nu->infty}
  FDR_infty(1) = Phi(-sqrt(-2*ln(alpha))) < alpha for all alpha in (0, 1/2], demonstrating a strict non-commutativity
  of the sample-size limit n -> infty and the independence limit (rho -> 0^+ or nu -> infty) at the global
  null.'
identity_notes: Distinct from all 442 pinned AIO concepts and all 600 previously curated AIMech concepts.
  While AIMech:AsymptoticallyOptimalRejectionCurveFDRControl (Finner, Dickhaus, & Roters 2009) derives
  the Dirac-uniform asymptotically optimal rejection curve f_alpha(t) = t / (t*(1 - alpha) + alpha) under
  independent p-values and regularized step-up-down/adjusted step-up procedures, and AIMech:ArchimedeanCopulaStepUpFDRBounds
  (Bodnar & Dickhaus 2014) derives finite-sample FDR bounds under Archimedean copula models using conditional
  independence given a latent frailty factor, neither record defines the Dirac-exchangeable model D-EX(zeta_n)
  = g(X_i, Z) with conditional empirical c.d.f. F_infty(t | z, zeta) and Largest Crossing Point t(z |
  zeta) (Lemma 2.1, Theorems 2.1-2.2, Equations (2.2)-(2.9)), the complete-null boundary derivative law
  FDR_infty(1) = P^Z(E_1) + alpha * int_{E_0} gamma(z) dP^Z(z) and shifted exponential MTP_2 invariance
  Example 2.3 (Lemma 2.2, Theorems 2.3-2.4, Equations (2.10)-(2.15)), the equicorrelated normal tangent-point
  jump discontinuity (t_1, t_2) and closed-form integrals for EER_infty(zeta) and FDR_infty(zeta) (Theorems
  3.1-3.2, Remark 3.1, Equations (3.1)-(3.5)), or the global-null double-limit discontinuity lim_{rho->0^+}
  FDR_infty(1) = lim_{nu->infty} FDR_infty(1) = Phi(-sqrt(-2*ln(alpha))) < alpha in equicorrelated normal
  and jointly studentized t-models (Theorem 3.3, Equation (3.6), Lemma 4.1, Theorems 4.1-4.3, Equation
  (4.1)).
