claims:
- claim_id: sufficient-statistic-coupling
  kind: mechanism
  statement: Choose visible and hidden exponential-family base measures and unary natural parameters,
    then add bilinear interactions between sufficient statistics from opposite layers. Retain base measures,
    whether written explicitly or absorbed as fixed-coefficient features, and normalize the complete joint.
    Given the opposite layer, each variable keeps its exponential-family form with shifted natural parameters.
    Integrating hidden variables contributes their log-partition functions to the visible log mass. Conditional
    factorization does not imply marginal independence or make the global partition function easy to compute.
  evidence:
  - source_id: method-source
    locator: Section 2, PDF p.3, Equations 1-7 and normalization discussion
    relation: supports
- claim_id: normalization-and-learning
  kind: mechanism
  statement: 'Admissible interaction parameters must produce a finite joint normalizer. Proper-looking
    local conditionals are insufficient: a scalar Gaussian/Gaussian example with unit conditional variances
    and coupling 1.2 has an indefinite joint precision, while a positive Poisson/Poisson interaction can
    make diagonal joint terms diverge. When the model is proper, exact likelihood gradients contrast data
    and model expected sufficient statistics; derivatives of hidden log-partitions provide conditional
    hidden expectations. Short-chain contrastive divergence approximates the equilibrium expectation and
    does not certify exact likelihood optimization.'
  evidence:
  - source_id: method-source
    locator: Section 2, PDF p.3, restrictions on interactions; Section 2.1, pp.3-4, Equations 8-9
    relation: supports
- claim_id: categorical-count-bin-specialization
  kind: mechanism
  statement: The demonstrated latent-semantic model uses one categorical count-bin variable per vocabulary
    word and unit-Gaussian hidden variables. If S is the sum of selected category weight columns, h given
    all visible observations has distribution N(S,I), and visible mass is proportional to exp(alpha dot
    x+||S||^2/2). This finite-category construction differs from replicated token positions and from binary
    hidden units. Common orthogonal rotations preserve visible probabilities; category-constant shifts
    can also be compensated by visible biases. Centering can change cosine retrieval geometry, while a
    common orthogonal rotation alone preserves cosine similarity. Missing words require inference rather
    than claiming the all-visible conditional remains exact.
  evidence:
  - source_id: method-source
    locator: Section 3, PDF pp.4-5, Equations 10-14; Section 4, pp.6-7, missing-word mean-field inference
    relation: supports
