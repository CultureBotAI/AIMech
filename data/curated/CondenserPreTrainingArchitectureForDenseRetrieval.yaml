claims:
- claim_id: condenser-late-early-short-circuit-bottleneck-mechanism
  kind: mechanism
  statement: By feeding the L^h-layer Condenser Head with [h_cls^late; h^early] (where L^e = 6 early layers and L^l = 6 late layers in BERT-base), Condenser allows local syntactic information to bypass the late layers via h^early while forcing all higher-level contextual information refined in Encoder_late to pass exclusively through the single dense vector h_cls^late to minimize L_mlm = sum_{i in masked} CrossEntropy(W h_i^cd, x_i), regularized by the backbone semantic constraint L_mlm^c = sum_{i in masked} CrossEntropy(W h_i^late, x_i) with shared projection matrix W.
  evidence:
  - source_id: r751-primary-pdf
    locator: Section 3.3-3.4 (Equations 6-11) & Section 4.1, pp. 3-4
    relation: supports
  - source_id: r751-primary-pdf
    locator: condenser_head_forward, mlm_cross_entropy & main
    relation: supports
- claim_id: condenser-structural-readiness-and-retrieval-effectiveness
  kind: scope
  statement: After discarding the 2-layer Condenser Head, the resulting 12-layer backbone exhibits high late-layer [CLS] attention entropy prior to fine-tuning (structural readiness) and achieves 0.366 MRR@10 and 0.974 Recall@1000 on MS MARCO Passage Dev (with batch size 64 and a single round of hard negatives, outperforming ANCE's 0.330 and matching RocketQA without external data at 0.364) as well as 83.2% Top-20 accuracy on Natural Questions and 81.9% on TriviaQA.
  evidence:
  - source_id: r751-primary-pdf
    locator: Section 4.3 (Tables 3-4), Section 4.4 (Tables 5-7), & Section 5 (Figure 2), pp. 6-8
    relation: supports
- claim_id: condenser-single-vector-capacity-and-corpus-contrast-limitation
  kind: limitation
  statement: Condenser requires 8 epochs of continued MLM pre-training with an extra 2-layer head (~20M additional parameters during pre-training), still relies on single-vector [CLS] compression that has limited capacity on long documents (trailing ANCE on TREC DL 2019 Document Ranking, 0.597 vs. 0.615 nDCG@10), and trains only with instance-level MLM loss without corpus-level contrastive supervision.
  evidence:
  - source_id: r751-primary-pdf
    locator: Section 2, p. 2; Section 4.1, p. 4; Appendix A.2 & A.4 (Table 8), pp. 12-13
    relation: supports
