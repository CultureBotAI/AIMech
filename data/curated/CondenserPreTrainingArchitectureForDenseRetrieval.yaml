id: AIMech:CondenserPreTrainingArchitectureForDenseRetrieval
name: Condenser (Pre-Training Architecture for Dense Retrieval)
concept_kind: architecture
review_status: DRAFT
definition: "A transformer pre-training architecture for dense bi-encoder representation learning that partitions the encoder backbone into L^e early layers and L^l late layers\u2014computing [h_cls^early; h^early] = Encoder_early([h_cls^0; h^0]) and [h_cls^late; h^late] = Encoder_late([h_cls^early; h^early])\u2014and introduces a short-circuit from the early token states h^early combined with the late [CLS] vector h_cls^late into a temporary L^h-layer Condenser Head [h_cls^cd; h^cd] = Condenser_head([h_cls^late; h^early]) trained with joint Masked Language Modeling loss L = L_mlm(W h_i^cd, x_i) + L_mlm^c(W h_i^late, x_i) before discarding the head during fine-tuning."
identity_notes: Introduced by Gao and Callan (EMNLP 2021, pp. 981-993, arXiv:2104.08253). Distinguished from standard BERT MLM/NSP pre-training (Devlin et al., 2019), where the [CLS] token remains dormant in middle layers and lacks structural readiness for dense aggregation, from RetroMAE (Xiao et al., 2022), which uses dual independent asymmetric masks (30% encoder, 50-70% decoder) and two-stream position-specific enhanced decoding without an early-layer skip connection, and from Funnel Transformer (Dai et al., 2020), which pools sequence length by 4x for compute speedup rather than routing global semantics through a single [CLS] vector.
aliases:
- Condenser Transformer Pre-Training Architecture
- CONdition on DENSE Representation Architecture
- Condenser Late-Early Short-Circuit Encoder
