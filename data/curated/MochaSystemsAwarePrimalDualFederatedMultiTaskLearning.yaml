claims:
- claim_id: r487-biconvex-alternating-data-local-dual-subproblem-mechanism
  kind: mechanism
  statement: MOCHA alternates between centrally updating the m x m task-relationship matrix Omega (via eigenvalue or graphical-lasso updates using only W) and updating W across m nodes via H_i federated rounds in which each node t computes a theta_t^h-approximate solution Delta alpha_t to the local quadratic dual subproblem G_t^{sigma'}(Delta alpha_t; v_t, alpha_t) (Equation 4, with safe step-size parameter sigma' = gamma max_t sum_{t'=1}^m |M_bar_{tt'}| / M_bar_{tt} from Lemma 9) and transmits only the d-dimensional update Delta v_t = X_t Delta alpha_t (Smith et al. 2017, Section 3.2-3.3, Algorithm 1, Lemma 9, pp. 3-4 & 16).
  evidence:
  - source_id: r487-primary-pdf
    locator: Section 3.2-3.3 (Equations 3-4, Algorithm 1), pp. 3-4, and Appendix B & D (Lemma 9, Equation 29), pp. 12-13 & 16
    relation: supports
- claim_id: r487-straggler-and-dropout-tolerant-dual-convergence-scope
  kind: scope
  statement: Under Assumption 2 (where each node t may drop out with probability p_t^h = P[theta_t^h = 1] <= p_max < 1 and otherwise achieves conditional expected approximation E[theta_t^h | H_h, theta_t^h < 1] <= Theta_max < 1, so E[theta_t^h | H_h] <= Theta_bar = p_max + (1 - p_max) Theta_max < 1 by Lemma 3), Theorem 1 proves geometric dual convergence in H >= (1 / ((1 - Theta_bar) s)) log(n / epsilon_D) iterations for (1/mu)-smooth losses, and Theorem 2 proves O(1 / ((1 - Theta_bar) epsilon_D)) sublinear convergence for L-Lipschitz non-smooth losses such as hinge-loss SVMs (Smith et al. 2017, Section 4, Definition 1, Assumption 2, Theorems 1-2, Equations 5-7, pp. 5-6).
  evidence:
  - source_id: r487-primary-pdf
    locator: Section 4 (Definition 1, Assumption 2, Theorems 1-2, Equations 5-7), pp. 5-6, and Appendix C (Lemmas 3-7), pp. 14-16
    relation: supports
- claim_id: r487-federated-sensor-and-wearable-activity-recognition-application
  kind: application
  statement: Applied to federated multi-task support vector machine classification on Google Glass (GLEAM), Human Activity Recognition, and Vehicle Sensor benchmarks under simulated cellular/WiFi communication bottlenecks, statistical/systems stragglers, and periodic device dropout (Smith et al. 2017, Section 5, Table 1, Figures 1-3, pp. 6-8).
  evidence:
  - source_id: r487-primary-pdf
    locator: Section 5 (Simulations, Table 1, Figures 1-3), pp. 6-8
    relation: supports
- claim_id: r487-convex-fenchel-dual-and-linear-predictor-limitation
  kind: limitation
  statement: Relies on Fenchel conjugate duality l_t^* and R^* of convex loss functions and bi-convex matrix regularizers, and therefore does not directly apply to non-convex deep neural networks (Smith et al. 2017, Section 3.1 & Section 6 Discussion, pp. 3 & 9).
  evidence:
  - source_id: r487-primary-pdf
    locator: Section 3.1 & 3.3, pp. 3-4, and Section 6 (Discussion), p. 9
    relation: supports
