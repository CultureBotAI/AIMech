id: AIMech:MochaSystemsAwarePrimalDualFederatedMultiTaskLearning
name: MOCHA (Systems-Aware Primal-Dual Federated Multi-Task Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A systems-aware bi-convex primal-dual optimization framework for federated multi-task learning (Smith, Chiang, Sanjabi, & Talwalkar 2017, Sections 3-4, Equations 1-7, Algorithm 1, Theorems 1-2) that fits task-specific weight vectors W = [w_1, ..., w_m] in R^{d x m} and a task-relationship matrix Omega in R^{m x m} by alternating between (1) distributed primal-dual updates of W (with fixed Omega and matrix regularizer R_bar(w, Omega_bar) strongly convex with respect to M^{-1}) where each node t in {1, ..., m} solves its data-local quadratic dual subproblem min_{Delta alpha_t} G_t^{sigma'}(Delta alpha_t; v_t, alpha_t) = sum_{i=1}^{n_t} l_t^*(-alpha_t^i - Delta alpha_t^i) + <w_t(alpha), X_t Delta alpha_t> + (sigma'/2) ||X_t Delta alpha_t||_{M_t}^2 + c(alpha) (Equations 3-4) to a flexible per-node, per-round approximation accuracy theta_t^h in [0, 1] (Definition 1, Equation 5, allowing stragglers and dropped nodes with theta_t^h = 1) and communicates only Delta v_t = X_t Delta alpha_t in R^d, and (2) centralized data-free updates of the task-structure matrix Omega given W(alpha) = nabla R^*(X alpha) (Algorithm 1).
identity_notes: Distinct from CoCoA (Jaggi et al. 2014; Ma et al. 2015), which solves single-model distributed ERM under a uniform fixed accuracy parameter theta across all workers and rounds without tolerating dropped nodes (theta_t^h = 1) or alternating multi-task relationship matrix updates Omega; and distinct from Ditto (AIMech:DittoFairAndRobustPersonalizedFederatedMultiTaskLearning, Li et al. 2021) and FedU (AIMech:FedUAndDFedULaplacianRegularizedFederatedMultiTaskLearning, Dinh et al. 2022), which operate in the primal parameter space to support nonconvex neural networks rather than solving dual block-quadratic subproblems G_t^{sigma'} with conjugate losses l_t^* and learned task-covariance matrices Omega.
