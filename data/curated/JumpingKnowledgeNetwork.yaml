name: Jumping Knowledge network
definition: A graph neural architecture that sends intermediate node representations from multiple neighborhood-aggregation
  depths to a final layer-aggregation mechanism.
concept_kind: architecture
identity_notes: Jumping Knowledge adds aggregation across layer depths and can be combined with GCN, GraphSAGE
  or GAT neighborhood operators. It is distinct from ordinary adjacent-layer skip connections and from
  any one of those base operators.
limitations:
- Concatenation followed by a node-shared linear transformation is not node-adaptive in its layer weighting;
  max pooling and the attention variant provide node-dependent selection or weights.
- The influence-distribution result is conditional on activation assumptions. No general guarantee of
  optimal neighborhood range or benchmark superiority is asserted.
- The record describes the layer-aggregation family. The paper's attention prose refers to both weighted
  layer features and weighted bidirectional-LSTM features, so an exact attention implementation would
  require a separately pinned implementation review.
