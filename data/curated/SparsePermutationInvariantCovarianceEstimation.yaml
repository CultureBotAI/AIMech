id: AIMech:SparsePermutationInvariantCovarianceEstimation
name: Sparse Permutation Invariant Covariance Estimation
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- SPICE
- Sparse Permutation-Invariant Concentration Matrix Estimator
- Correlation-Rescaled Off-Diagonal L1-Penalized Gaussian Likelihood Precision Estimator
- Cholesky-LQA Sparse Inverse Covariance Estimator
definition: Sparse Permutation Invariant Covariance Estimation (SPICE) is a high-dimensional inverse covariance (concentration) matrix estimation methodology that minimizes the off-diagonal l1-penalized Gaussian negative log-likelihood Omega_hat_lambda = argmin_{Omega succ 0} {tr(Omega Sigma_hat) - log|Omega| + lambda |Omega^-|_1} (where Omega^+ = diag(Omega) and Omega^- = Omega - Omega^+), together with its correlation-rescaled counterpart Omega_tilde_lambda = W_hat^{-1} K_hat_lambda W_hat^{-1} where W_hat^2 = Sigma_hat^+, Gamma_hat = W_hat^{-1} Sigma_hat W_hat^{-1}, and K_hat_lambda = argmin_{Omega succ 0} {tr(Omega Gamma_hat) - log|Omega| + lambda |Omega^-|_1}, and a permutation-invariant O(p^3) Cholesky-reparameterized (Omega = T^T T) cyclical coordinate descent algorithm using the epsilon-perturbed local quadratic approximation (LQA) for general l_q (q >= 1) off-diagonal penalties. Under bounded population spectrum 0 < k_under <= phi_min(Sigma_0) <= phi_max(Sigma_0) <= k_over < infty
  and at most s nonzero off-diagonal concentration entries (with no edge-Hessian mutual incoherence condition), choosing lambda asymp sqrt((log p)/n) yields the Frobenius-norm rate ||Omega_hat_lambda - Omega_0||_F = O_P(sqrt((p + s)(log p)/n)), the dimension-free inverse-correlation Frobenius rate ||K_hat_lambda - K||_F = O_P(sqrt(s(log p)/n)), and the correlation-rescaled spectral-norm (operator-norm) rate ||Omega_tilde_lambda - Omega_0||_2 = O_P(sqrt((s + 1)(log p)/n)).
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Rothman, Bickel, Levina, and Zhu (2008, Electronic Journal of Statistics 2:494-515; arXiv:0801.4837v2, DOI:10.1214/08-EJS176). Distinct from AIMech:HighDimensionalCovarianceEstimationByL1PenalizedLogDeterminantDivergence (Ravikumar, Wainwright, Raskutti, & Yu 2011), which requires the edge-Hessian mutual incoherence (irrepresentable) condition ||Gamma_{S^c S}(Gamma_{SS})^{-1}||_{L1} <= 1 - alpha to construct a primal-dual witness for elementwise l_infty error and signed edge recovery, whereas SPICE uses convex Frobenius-sphere localization G(Delta) = Q(Omega_0 + Delta) on Theta_n(M) without any irrepresentable condition and introduces correlation rescaling Omega_tilde_lambda = W_hat^{-1} K_hat_lambda W_hat^{-1} to eliminate the O_P(sqrt(p(log p)/n)) diagonal estimation penalty and achieve the operator-norm rate O_P(sqrt((s + 1)(log p)/n)), plus a Cholesky-reparameterized Omega = T^T T local quadratic approximation
  (LQA) coordinate descent solver for general l_q penalties whose non-convex stationary points are proved globally optimal (Proposition 1). Also distinct from AIMech:ConstrainedL1MinimizationForSparsePrecisionMatrixEstimation (Cai, Liu, & Luo 2011, which solves p columnwise linear programs without a log-determinant barrier), from AIMech:HighDimensionalCovarianceRegularizationByHardThresholding (Bickel & Levina 2008b, which thresholds the sample covariance matrix Sigma_hat), and from AIMech:MinimaxOptimalTaperingForHighDimensionalCovarianceMatrixEstimation (Cai, Zhang, & Zhou 2010, which tapers ordered bandable covariance matrices).
