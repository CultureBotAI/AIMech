claims:
- claim_id: convex-shell-localization-and-frobenius-convergence-rate
  kind: scope
  statement: 'Under Assumptions A1 (card(S) <= s where S = {(i, j) : Omega_{0ij} != 0, i != j}), A2 (phi_min(Sigma_0) >= k_under > 0), and A3 (phi_max(Sigma_0) <= k_over < infty), Theorem 1 (Eqs. 2-3, p. 498; Proof on pp. 500-502, Eqs. 7-18) establishes that for lambda = (C_1/eps) sqrt((log p)/n) with 0 < eps < 1 (Eq. 15), the shifted convex criterion G(Delta) = Q(Omega_0 + Delta) satisfies the integral Taylor expansion (Eqs. 9-10) with Kronecker curvature lower bound phi_min(int_0^1 (1-v)(Omega_0 + v Delta)^{-1} otimes (Omega_0 + v Delta)^{-1} dv) >= (1/4) k_under^2 (Eq. 18), off-diagonal penalty triangle inequality lambda(|Omega_0^- + Delta^-|_1 - |Omega_0^-|_1) >= lambda(|Delta_{S_bar}^-|_1 - |Delta_S^-|_1) (Eq. 11), off-diagonal sample covariance bound I <= C_1 sqrt((log p)/n) |Delta^-|_1 (Eq. 13), and diagonal Cauchy-Schwarz bound II <= C_2 sqrt(p(log p)/n) ||Delta^+||_F (Eq. 14), forcing inf_{Delta in Theta_n(M)} G(Delta) > 0 on the Frobenius sphere ||Delta||_F = M r_n for M > max{4
    C_1(1+eps)/(eps k_under^2), 4 C_2/k_under^2} (Eq. 17) and thereby proving ||Omega_hat_lambda - Omega_0||_F = O_P(sqrt((p + s)(log p)/n)) without any irrepresentable condition.'
  evidence:
  - source_id: rblz2008-spice-pdf
    locator: Section 2, Theorem 1, Lemma 1, and Equations (1)-(3), (6)-(18), pp. 498-502 (PDF pp. 5-9)
    relation: supports
- claim_id: correlation-rescaled-spice-and-operator-norm-rate
  kind: mechanism
  statement: Because the O_P(sqrt(p(log p)/n)) term in Theorem 1 arises solely from estimating the p unpenalized diagonal entries in Term II = |sum_{i=1}^p (sigma_hat_{ii} - sigma_{0ii}) Delta_{ii}| (Eqs. 12, 14), replacing Sigma_hat by the sample correlation matrix Gamma_hat = W_hat^{-1} Sigma_hat W_hat^{-1} (where W_hat^2 = Sigma_hat^+ has gamma_hat_{ii} = gamma_{0ii} = 1 identically) makes Term II vanish identically in the SPICE correlation program K_hat_lambda = argmin_{Omega succ 0} {tr(Omega Gamma_hat) - log|Omega| + lambda |Omega^-|_1} (Eq. 4), yielding the dimension-free Frobenius rate ||K_hat_lambda - K||_F = O_P(sqrt(s(log p)/n)) for K = Gamma^{-1} (Corollary 1, p. 502). Combining ||K_hat_lambda - K||_2 <= ||K_hat_lambda - K||_F with the diagonal operator-norm bound ||W_hat^2 - W^2||_2 = max_{1<=i<=p} |sigma_hat_{ii} - sigma_{0ii}| = O_P(sqrt((log p)/n)) (Eq. 19, p. 503) proves that the rescaled concentration estimator Omega_tilde_lambda = W_hat^{-1} K_hat_lambda W_hat^{-1} (Eq.
    5) achieves the operator-norm convergence rate ||Omega_tilde_lambda - Omega_0||_2 = O_P(sqrt((s + 1)(log p)/n)) (Theorem 2, p. 499; Proof on pp. 502-503).
  evidence:
  - source_id: rblz2008-spice-pdf
    locator: Section 2, Equations (4)-(5), Theorem 2, Corollary 1, and Equation (19), pp. 498-499, 502-503 (PDF pp. 5-6, 9-10)
    relation: supports
- claim_id: cholesky-lqa-coordinate-descent-and-proposition1-global-optimality
  kind: mechanism
  statement: To enforce automatic positive definiteness for the generalized l_q (q >= 1) penalized objective f(Omega) = tr(Omega Sigma_hat) - log|Omega| + lambda sum_{j' != j} |omega_{j'j}|^q (Eq. 20) while preserving permutation invariance, SPICE reparameterizes Omega = T^T T with lower triangular T = [t_{ij}] (Eqs. 21-24, p. 504) and applies the Hunter-Li (2005) epsilon-perturbed local quadratic approximation |u^{(k+1)}|^q approx (q/2)(u^{(k+1)})^2 / (|u^{(k)}| + eps)^{2-q} + (1 - q/2)|u^{(k)}|^q (Eq. 25), yielding closed-form O(p) univariate coordinate updates for t_{lc} (l > c linear update; l = c positive root u^+ of a u^2 + b u - 1 = 0, Appendix A, Eqs. 30-32, p. 513) in O(p^3) complexity per sweep. By Proposition 1 (pp. 505-506, Eqs. 26-27), although g(T) = f_tilde_{eps,k}(T^T T) is non-convex in T, the differential map nabla h(t_0)[d] = T_0^T D + D^T T_0 has trivial kernel D = 0 on lower triangular matrices whenever T_0 is nonsingular, so every stationary point nabla g(T_0) = 0 satisfies
    T_0^T T_0 = S_0, the unique global minimizer of the convex function f_tilde_{eps,k}(S).
  evidence:
  - source_id: rblz2008-spice-pdf
    locator: Section 3, Proposition 1 and Equations (20)-(27), pp. 503-506 (PDF pp. 10-13); Appendix A, Equations (30)-(32), pp. 512-513 (PDF pp. 19-20)
    relation: supports
