claims:
- claim_id: densephrases-decomposed-endpoint-phrase-and-question-encoding
  kind: mechanism
  statement: DensePhrases represents any contiguous phrase s_k of length up to L = 20 tokens in passage p as the concatenation of its SpanBERT start and end token vectors E_s(s_k, p) = [h_{start(k)}, h_{end(k)}] in R^{2d} (d = 768, Equation 3) and encodes each question q using two separate pre-trained encoders M_{q,start} and M_{q,end} into E_q(q) = [q^start, q^end] in R^{2d} (Equation 4), enabling direct answer extraction via constrained MIPS s_hat = argmax_{1 <= i <= j < i+L} (H q^start)_i + (H q^end)_j over a stacked token matrix H in R^{|W(D)| x d} that stores only word vectors rather than all 6 x 10^{10} phrases (Sections 2, 3.2 & 5, Equation 10).
  evidence:
  - source_id: r772-primary-pdf
    locator: Sections 2, 3.2 & 5, Equations 2-4 & 10, Footnote 5, pp. 2-4, 6
    relation: supports
  - source_id: r772-primary-pdf
    locator: constrained_mips_phrase_search() verification of decomposed endpoint MIPS equivalence
    relation: supports
- claim_id: densephrases-prebatch-negatives-and-multi-loss-phrase-training
  kind: mechanism
  statement: To learn discriminative phrase representations without GPU-prohibitive batch sizes, DensePhrases maintains a FIFO queue caching detached gold-phrase endpoint matrices G^start and G^end from the preceding C mini-batches (pre-batch negatives, providing B x C + B - 1 total negatives per example with B = 84, C = 2 and no gradient backpropagation to cached batches) and optimizes L = lambda_1 L_single + lambda_2 L_distill + lambda_3 L_neg (lambda_1 = 1, lambda_2 = 2, lambda_3 = 4, Equations 5-9) on reading-comprehension passages augmented with T5-generated entity questions and SpanBERT-base cross-attention KL distillation (Sections 4.1-4.4, Tables 5-6).
  evidence:
  - source_id: r772-primary-pdf
    locator: Sections 4.1-4.4 & Section 8, Equations 5-9, Figure 2, Tables 5-6, pp. 4-6, 8-9
    relation: supports
  - source_id: r772-primary-pdf
    locator: prebatch_negative_loss() verification of B * C + B - 1 negative count and softmax loss
    relation: supports
- claim_id: densephrases-query-side-finetuning-and-open-domain-qa-application
  kind: application
  statement: After indexing the full Wikipedia phrase dump H (reduced from 1,547GB to 320GB via ~75% learned token filtering and int4 scalar quantization, Table 1 & Appendix E), DensePhrases performs query-side fine-tuning by updating only E_q to minimize L_query = -log(sum_{s in S~(q), TEXT(s)=a*} exp(f(s | D, q)) / sum_{s in S~(q)} exp(f(s | D, q))) over the top k = 100 MIPS-retrieved phrases (Equation 11), boosting Natural Questions EM by 12-19 points to 40.9 EM (matching DPR-multi's 41.5 EM while running at 20.6 Q/sec on GPU and 13.6 Q/sec on CPU, Tables 1, 3 & 7) and achieving state-of-the-art KILT slot-filling accuracy on T-REx and ZsRE using only 5K-10K training triples without re-indexing (Table 4).
  evidence:
  - source_id: r772-primary-pdf
    locator: Sections 6-8 & Appendix E, Equation 11, Tables 1, 3, 4 & 7, pp. 2, 6-9, 14
    relation: supports
  - source_id: r772-primary-pdf
    locator: query_side_finetuning_loss() verification of marginal log-likelihood over top-k retrieved phrases
    relation: supports
- claim_id: densephrases-uncompressed-vector-retention-and-extractive-scope-limitation
  kind: limitation
  statement: While inference requires only the 320GB int4-quantized MIPS index, query-side fine-tuning (Equation 11) requires retaining ~500GB of original uncompressed start and end vectors on disk to reconstruct gradients because the on-disk MIPS index returns only top-k scores and indices (Appendix E), and DensePhrases is restricted to extractive span answers from natural paragraphs (excluding answers in Wikipedia lists or tables, Section 2 & Appendix C).
  evidence:
  - source_id: r772-primary-pdf
    locator: Section 2, Section 10 (Ethical Considerations), Appendix C & Appendix E, pp. 2, 10, 13-14
    relation: supports
