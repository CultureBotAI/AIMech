claims:
- claim_id: small-learning-rate-dilemma-and-endpoint-interpolation
  kind: mechanism
  statement: Section 3 (Algorithm 1, p. 3-4) shows that in fully adaptive methods (p = 1/2), coordinates with small v_hat_{t,i} << 1 produce huge early effective learning rates alpha_t / v_hat_{t,i}^{1/2}, forcing practitioners to choose a small base learning rate alpha_t that becomes vanishingly small after several rounds of stage-wise decay ('the small learning rate dilemma'); choosing p in (0, 1/2) (such as p = 1/8) moderates v_hat_{t,i}^{-p} so Padam can adopt the same large base learning rate as SGD-Momentum (e.g., alpha = 0.1 on CIFAR/ImageNet) while continuously interpolating between SGD-Momentum at p -> 0 and AMSGrad at p = 1/2.
  evidence:
  - source_id: r610-primary-pdf
    locator: Section 1, p. 1-2; Section 3, Algorithm 1 & Figure 1, p. 3-5
    relation: supports
- claim_id: auxiliary-iterate-identities-and-lemma-a5-moment-sum-bound
  kind: mechanism
  statement: For the auxiliary sequence z_t = x_t + (beta_1 / (1 - beta_1))(x_t - x_{t-1}) (Appendix A-B, Eq. A.1, p. 10, 13-15), Lemma A.1 proves the exact identities z_{t+1} - z_t = (beta_1 / (1 - beta_1))(alpha_{t-1} V_hat_{t-1}^{-p} - alpha_t V_hat_t^{-p}) m_{t-1} - alpha_t V_hat_t^{-p} g_t = (beta_1 / (1 - beta_1))[I - (alpha_t V_hat_t^{-p})(alpha_{t-1} V_hat_{t-1}^{-p})^{-1}](x_{t-1} - x_t) - alpha_t V_hat_t^{-p} g_t (Eqs. A.2-A.3), and Lemma A.5 proves that under ||nabla f(x; xi)||_infty <= G_infty, gamma = beta_1 / beta_2^{2p} < 1, and q in [max{4p - 1, 0}, 1], sum_{t=1}^T alpha_t^2 E[||V_hat_t^{-p} m_t||_2^2] <= (T^{(1+q)/2} d^q alpha^2 (1 - beta_1) G_infty^{1+q-4p} / ((1 - beta_2)^{2p}(1 - gamma))) E[(sum_{i=1}^d ||g_{1:T,i}||_2)^{1-q}] (Eqs. B.1-B.6).
  evidence:
  - source_id: r610-primary-pdf
    locator: Appendix A.1 & B.1-B.5, Lemmas A.1-A.5, Eqs. A.1-A.4 & B.1-B.6, p. 10, 13-15
    relation: supports
- claim_id: theorem43-and-corollary45-nonconvex-stationarity-convergence-rate
  kind: mechanism
  statement: Theorem 4.3, Corollary 4.5, and Remark 4.6 (Section 4, Eqs. 4.1-4.3, p. 4-5 & Appendix A, p. 10-13) prove that for L-smooth nonconvex objectives with G_infty-bounded stochastic gradients, p in [0, 1/4], beta_1 < beta_2^{2p}, and cumulative gradient growth ||g_{1:T,i}||_2 <= G_infty T^s with 0 <= s <= 1/2, Padam with optimal step size alpha = Theta((d^{1/2} T^{1/4 + s/2})^{-1}) satisfies E[||nabla f(x_out)||_2^2] <= M_1 / (T alpha) + M_2 d / T + M'_3 alpha d G_infty / T^{1/2 - s} = O(d^{1/2} / T^{3/4 - s/2} + d / T), matching nonconvex SGD's O(1 / sqrt(T)) rate in the worst case s = 1/2 and achieving a strictly faster rate in T when gradients are sparse (s < 1/2).
  evidence:
  - source_id: r610-primary-pdf
    locator: Section 1, Eq. 1.1, p. 2; Section 4, Theorem 4.3, Corollary 4.5 & Remark 4.6, Eqs. 4.1-4.3, p. 4-5
    relation: supports
- claim_id: empirical-generalization-on-cifar-imagenet-and-ptb
  kind: application
  statement: Across CIFAR-10, CIFAR-100, ImageNet (ILSVRC2012), and Penn Treebank benchmarks (Section 5, Tables 1-3 & Figures 2-3, p. 5-8; Appendix D, Table 4 & Figure 4, p. 16-17), Padam (with p = 1/8 on CNNs and p in {0.4, 0.2} on 2/3-layer LSTMs) achieves the highest test accuracy on CIFAR-10 VGGNet (93.78%) and WideResNet (95.34%), CIFAR-100 VGGNet (74.39%) and ResNet (77.85%), and ImageNet VGGNet (74.04% Top-1, 91.93% Top-5) and ResNet Top-5 (89.47%), as well as the lowest test perplexity on Penn Treebank 2-layer LSTM (61.53) and 3-layer LSTM (58.48), outperforming Adam, AMSGrad, AdamW, Yogi, and AdaBound.
  evidence:
  - source_id: r610-primary-pdf
    locator: Section 5, Tables 1-3 & Figures 2-3, p. 5-8; Appendix D, Table 4 & Figure 4, p. 16-17
    relation: supports
