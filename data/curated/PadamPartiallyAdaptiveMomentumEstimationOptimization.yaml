aio_mappings:
- target: AIO:ArtificialNeuralNetwork
  relation: related_match
  rationale: Padam is designed to close the generalization gap of adaptive gradient methods when training deep convolutional and recurrent neural networks (VGGNet-16, ResNet-18, WideResNet-16-4, and multi-layer LSTMs).
limitations:
- Requires p <= 1/2 and beta_1 < beta_2^{2p} for convergence guarantees; values of p > 1/2 break the non-increasing effective step-size bound and lead to non-convergence in the theoretical proof (Section 3, p. 3; Theorem 4.3, p. 4).
- Introduces an additional hyperparameter p in (0, 1/2] that must be selected by grid search (e.g., p in {2/5, 1/4, 1/5, 1/8, 1/16}) and varies across modalities (p = 1/8 for CNNs vs. p = 0.4 or 0.2 for LSTMs) (Section 5, p. 5-7).
- Maintains the extra running-maximum buffer v_hat_t = max(v_hat_{t-1}, v_t) in addition to m_t and v_t, increasing per-parameter optimizer state memory relative to SGD-Momentum and vanilla Adam (Algorithm 1, p. 3).
