claims:
- claim_id: claim-01
  kind: mechanism
  statement: For a linear fixed-point iteration x_{i+1} - x^* = G(x_i - x^*) with symmetric matrix 0 <= G <= sigma I (sigma < 1), the unregularized extrapolation residual norm satisfies min_{c^T 1 = 1} ||R c||_2 = min_{p in P_k, p(1)=1} ||p(G) r_0||_2 <= (2 beta^k / (1 + beta^{2k})) ||r_0||_2 where beta = (1 - sqrt(1 - sigma)) / (1 + sqrt(1 - sigma)) via Chebyshev polynomials (Proposition 2.3 and Equation 40), and achieves exact zero error ||sum_{i=0}^k c_i^* x_i - x^*||_2 = 0 as soon as k equals the degree m <= d of the minimal polynomial of G by the Cayley-Hamilton theorem (Proposition 2.1).
  evidence:
  - source_id: r341-primary-pdf
    locator: Section 2.2-2.3, Proposition 2.1, Corollary 2.2, Proposition 2.3, and Proposition 2.4, pp. 4-7; Appendix A.1, Equation 40, p. 27
    relation: supports
  - source_id: r341-arxiv-abs
    locator: 'Abstract: Optimal Chebyshev acceleration of fixed-point iterations via regularized minimal polynomial extrapolation'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: Under perturbed residuals tilde{R} with Gram perturbation P = tilde{R}^T tilde{R} - R^T R, the regularized weight vector c_lambda^* = (tilde{R}^T tilde{R} + lambda I)^{-1} 1 / (1^T (tilde{R}^T tilde{R} + lambda I)^{-1} 1) satisfies the exact KKT perturbation identity Delta c_lambda^* = -(I - (G_pert^{-1} 1 1^T)/(1^T G_pert^{-1} 1)) G_pert^{-1} P c_{lambda,clean}^* (Equation 23), the norm bound ||c_lambda^*||_2 <= sqrt((lambda + ||tilde{R}||_2^2)/(4 lambda)) (Equation 20), and the sensitivity bound ||Delta c_lambda^*||_2 <= (||P||_2 / lambda)||c_{lambda,clean}^*||_2 (Equation 21), while Proposition A.1 gives the exact worst-case Chebyshev-Tikhonov tradeoff max_{x in [0, sqrt(a/lambda)]}(kappa sqrt(a - lambda x^2) + b x) = sqrt(a) sqrt(kappa^2 + b^2 / lambda).
  evidence:
  - source_id: r341-primary-pdf
    locator: Section 3.2, Proposition 3.2 (Equations 19-23), pp. 9-10; Appendix A.1, Proposition A.1 (Equation 41), p. 28
    relation: supports
  - source_id: r341-metadata-cr
    locator: 'Mathematical Programming 179:47-83 (2020): Stability and convergence analysis of regularized nonlinear acceleration'
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Without Tikhonov regularization (lambda -> 0), the Krylov residual matrix R^T R becomes exponentially ill-conditioned (or strictly singular once k >= m), causing unregularized MPE/Anderson weights c^* to explode in Euclidean norm (||c^*||_2 >> 1) and amplify small nonlinear or numerical perturbations.
  evidence:
  - source_id: r341-primary-pdf
    locator: Section 3.1, Instability of Polynomial Extrapolation (Krylov/Hankel conditioning and Figure 1), p. 8
    relation: supports
