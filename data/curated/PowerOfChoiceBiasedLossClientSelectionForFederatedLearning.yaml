claims:
- claim_id: r491-claim-1
  kind: mechanism
  statement: Theorem 3.1 (Equation 7) and Theorem A.1 (Equation 8) prove that for L-smooth, mu-strongly convex local objectives with local-global objective gap Gamma = F^* - sum_{k=1}^K p_k F_k^* and selection skew bounds rho_bar <= rho_tilde (Definitions 3.1-3.2, Equations 4-6), FedAvg with decaying step size eta_t = 1 / (mu(t + gamma)) satisfies E[F(w_bar^{(T)})] - F^* <= (1 / (T + gamma)) [4 L (32 tau^2 G^2 + sigma^2/m) / (3 mu^2 rho_bar) + 8 L^2 Gamma / mu^2 + L gamma ||w_bar^{(0)} - w^*||^2 / 2] + (8 L Gamma / (3 mu)) (rho_tilde / rho_bar - 1), accelerating transient convergence by rho_bar.
  evidence:
  - source_id: r491-primary-pdf
    locator: Section 3, pp. 4-5, Definitions 3.1-3.2, Equations 4-7, Theorem 3.1; Appendix A, p. 12, Theorem A.1
    relation: supports
- claim_id: r491-claim-2
  kind: mechanism
  statement: Power-of-Choice (pi_{pow-d}) samples d candidate clients (m <= d <= K) without replacement with probabilities p_k and selects the m clients with highest local loss F_k(w_bar^{(t)}), while pi_{cpow-d} estimates losses on a random mini-batch of size b (Algorithm 1) and pi_{rpow-d} eliminates selection communication overhead by ranking candidates using their latest piggybacked local training loss (1 / (tau b)) sum_{l=t-tau+1}^t sum_{xi in xi_k^{(l)}} f(w_k^{(l)}, xi) (Algorithm 2).
  evidence:
  - source_id: r491-primary-pdf
    locator: Section 4, pp. 5-6; Appendix F, p. 20, Algorithms 1-2
    relation: supports
- claim_id: r491-claim-3
  kind: limitation
  statement: Increasing the candidate set size d increases the selection skew rho_bar and initial convergence speed but can also increase the ratio rho_tilde / rho_bar and the non-vanishing solution bias Q(rho_bar, rho_tilde) = (8 L Gamma / (3 mu))(rho_tilde / rho_bar - 1) under severe data heterogeneity (small Dirichlet alpha), where a moderate d outperforms choosing d = K.
  evidence:
  - source_id: r491-primary-pdf
    locator: Sections 3.2, 4, & 5, pp. 5-7, Figures 2 & 4(b)
    relation: supports
- claim_id: r491-claim-4
  kind: application
  statement: Applied to strongly convex quadratic optimization, logistic regression on Synthetic(1,1), and DNN training on non-IID Dirichlet-partitioned Fashion-MNIST, achieving up to 3x faster convergence and 10% higher test accuracy than unbiased random selection pi_rand and outperforming Active Federated Learning (pi_afl).
  evidence:
  - source_id: r491-primary-pdf
    locator: Section 5, pp. 6-8, Table 1, Figures 2-5
    relation: supports
