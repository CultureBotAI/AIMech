claims:
- claim_id: generative-law
  kind: mechanism
  statement: 'For fixed K topics beta_k on a finite vocabulary, draw document logits eta_d from N(mu,Sigma),
    set theta_d=softmax(eta_d), then independently draw each topic assignment z_dn from theta_d and its
    word from beta_zdn, conditional on these variables. The logistic-normal prior allows associations
    that a single Dirichlet proportion prior cannot express, including positive pairwise proportion covariance
    when at least three components are available. Dirichlet proportions are not literally independent:
    their sum-to-one constraint gives negative off-diagonal covariance for positive concentration parameters.
    Common shifts of all logits leave proportions unchanged; unrestricted K-logit mean/covariance parameters
    are not uniquely identified by the induced composition. Logit covariance, proportion covariance and
    causal relationships are distinct.'
  evidence:
  - source_id: method-source
    locator: Section 2, PDF pp.2-3, Figure 1 and Equation (3)
    relation: supports
  - source_id: journal-extension
    locator: Section 2, PDF/reprint pp.4-6, Figure 1 and softmax nonminimality note
    relation: supports
- claim_id: variational-inference
  kind: mechanism
  statement: The original inference scheme approximates each document posterior by independent univariate
    Gaussian logits and categorical topic assignments. An auxiliary positive scalar bounds expected log-sum-exp
    from above, yielding a tractable lower bound no greater than the exact mean-field evidence lower bound.
    Coordinate updates alternate the auxiliary scalar, assignment probabilities, Gaussian means and positive
    variances; variational EM fits topics and Gaussian parameters from approximate sufficient statistics.
    Nonconjugacy and the additional bound make this approximate inference, not exact posterior computation
    or a guarantee of global marginal-likelihood maximization. The journal correction restores entropy
    in the originally printed corpus bound; the inspected v2 reprint already includes it, and the corpus
    objective sums expected log joint plus entropy for each document.
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF pp.4-5; Appendix A, p.8, Equations (4)-(17)
    relation: supports
  - source_id: journal-extension
    locator: Section 3.1-3.2, PDF/reprint pp.7-9; Appendix, pp.16-18, Equations (9)-(20)
    relation: supports
  - source_id: journal-correction
    locator: Entire one-page correction, printed p.634, referring to original journal p.24
    relation: supports
