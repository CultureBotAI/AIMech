name: Correlated topic model
definition: A mixed-membership topic model that draws each document's topic proportions from a logistic-normal
  distribution and generates its words through latent topic assignments and shared categorical topic-word
  distributions.
concept_kind: model_family
identity_notes: 'Scoped to the Blei-Lafferty correlated topic model introduced at NIPS 2005 and developed
  in the 2007 journal article. The defining change is the logistic-normal document mixture, not a word-interaction
  MRF, dynamic topic evolution, sparse topic graph or the particular variational solver. Topic graphs
  are optional analyses of fitted latent coordinates. This is not the Dynamic Conditional Correlation
  econometric model. No normalized identity match was found across all 442 pinned AIO labels and scoped
  synonyms and 423 preceding native IDs, names and aliases. Full-checkout fixed-string searches included
  ignored and hidden files in worktree and main. Ten matched lines in each checkout reduce to nine unique
  line contents: prior frontier references, copied discovery context and cached web-result mentions. Every
  matching concept excerpt was inspected; these are not maintained or imported identities. All 200 semantic
  label/synonym hits were read. Eighteen exact annotated AIO CLASS nodes and outgoing edges were inspected,
  including 14 verified unchanged from prior reading and four newly read. Thirty contextual YAMLs comprise
  those 18 AIO records and 12 native neighbors: six fully read here, 23 byte-verified after prior reading
  and the updated APM verified against its fully reviewed round100 bytes. Absence is bounded to the pinned
  snapshot, maintained corpus and inspected semantic neighborhood.'
limitations:
- Fixed topic count, finite vocabulary and conditional bag-of-words assumptions remain. Flexible logistic-normal
  associations do not remove compositional constraints, identify unique semantic topics or establish that
  all Dirichlet laws are exact special cases.
- The source assertion that one observed document leaves no advantage for a nondiagonal variational covariance
  is not a general theorem. Posterior dependence can remain. Substituting the auxiliary bound into an
  expected log probability, as displayed with equality in the appendices, must be read as a bound rather
  than an exact expectation.
- The journal topic graph regresses standardized fitted logit means using lasso and combines neighborhoods.
  Gaussian precision statements concern specified Gaussian coordinates; graph estimates do not automatically
  establish conditional independence of proportions, gauge-invariant structure, causal links or consistency
  from noisy variational means.
- Reported Science-corpus comparisons use importance sampling or partially observed-document prediction
  under particular fits. No universal performance or semantic-interpretability advantage is asserted.
  No author code or benchmark was executed.
