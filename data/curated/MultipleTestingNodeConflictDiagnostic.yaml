claims:
- claim_id: partition-family
  kind: scope
  statement: Specify the data partitions, separator copies, common parameter transformations and family
    of comparisons before interpreting adjusted conflict. The source partitions the evidence into Q submodels
    and compares separator quantities informed by more than one partition. Proper partition posteriors
    are required to define these distributions. Poor identification can make comparisons prior-driven
    or uninformative even when a score is computable; calibrated testing requires the separately stated
    regularity and sampling assumptions. Weak data and reference priors can materially determine the result.
    Multiarm trial information must retain its joint structure. Separate observed data subsets do not
    by themselves ensure independent fitted partitions when latent or estimated nuisance quantities are
    shared.
  evidence:
  - source_id: presanis2017
    locator: Sections 2–3.2, PDF pp. 2–6; network meta-analysis, pp. 8–9; discussion, pp. 12–13
    relation: supports
- claim_id: signed-contrasts
  kind: mechanism
  statement: 'Let phi stack the declared separator copies, u=h(phi), and K be a fixed matrix whose rows
    encode comparisons. Define Delta=K*u; a pairwise difference row contains +1 and -1. K may be rectangular
    and pairwise comparisons may be redundant. From joint draws of u, compute m=E(Delta) and S=Cov(Delta)=K*Cov(u)*K^T.
    Block-diagonal partition covariance requires justified independence. If instead applying a local delta
    approximation on the original phi scale, include the transformation Jacobian J: S approximately equals
    K*J*Cov(phi)*J^T*K^T. A plug-in K*h(E(phi)) approximates, rather than generally equals, E(Delta).'
  evidence:
  - source_id: presanis2017
    locator: Sections 3.2–3.3, PDF pp. 6–7; Appendix B, p. 28
    relation: supports
  - source_id: hothorn2008
    locator: Section 2, PDF pp. 4–5 / printed pp. 2–3; redundant Tukey contrasts, PDF p. 9 / printed p.
      7
    relation: supports
- claim_id: standardization-and-support
  kind: mechanism
  statement: For a p-component contrast vector with positive finite diagonal variances, set D=diag(S),
    T=D^(-1/2)*m and R=D^(-1/2)*S*D^(-1/2). Correlation R may be singular because comparisons are redundant.
    Zero-variance or deterministic contrasts require an explicit support check and separate handling;
    they cannot be standardized by division by zero. A null vector outside the posterior affine support
    is not rescued by a pseudoinverse. Numerical rank thresholds and covariance approximation affect the
    resulting diagnostics.
  evidence:
  - source_id: presanis2017
    locator: Sections 3.3–3.4, PDF p. 7; Appendix B, p. 28
    relation: supports
  - source_id: hothorn2008
    locator: Sections 2–3, PDF pp. 4–7 / printed pp. 2–5
    relation: supports
- claim_id: wald-global-score
  kind: mechanism
  statement: One global option is W=m^T*S^+*m, equivalently T^T*R^+*T when the mean lies in the covariance
    range, with + denoting the Moore–Penrose pseudoinverse. Under a justified Gaussian null reference
    on an r-dimensional contrast subspace, use the upper chi-square_r tail, where r is the covariance
    rank. This quadratic global assessment differs from max-absolute-statistic testing and does not itself
    identify the inconsistent component. Its reference law needs support and calibration assumptions beyond
    computing a posterior mean and covariance.
  evidence:
  - source_id: presanis2017
    locator: Section 3.4, PDF p. 7
    relation: supports
  - source_id: hothorn2008
    locator: Section 3, PDF pp. 5–6 / printed pp. 3–4
    relation: supports
- claim_id: single-step-maxt
  kind: mechanism
  statement: For a centered joint normal reference Z with covariance R, define M=max_j |Z_j| and G_R(c)=P(-c<=Z_j<=c
    for all j). The global maxT score is 1-G_R(max_j |T_j|); a single-step adjusted score for component
    j is 1-G_R(|T_j|), using the same declared comparison family. This is an absolute maximum for two-sided
    tests, not the maximum of signed components. The rectangle probability incorporates correlation and
    can accommodate redundant coordinates under a valid singular normal law. Under the same continuous
    reference, each adjusted score is at least its corresponding marginal two-sided normal tail. This
    comparison does not automatically hold between differently approximated or sampled raw and adjusted
    scores.
  evidence:
  - source_id: presanis2017
    locator: Section 3.4, PDF p. 7; distinct adjustment families in Table 2, PDF p. 19
    relation: supports
  - source_id: hothorn2008
    locator: Section 3, PDF pp. 6–7 / printed pp. 4–5
    relation: supports
- claim_id: error-control-conditions
  kind: limitation
  statement: The joint reference construction targets familywise error, not a false-discovery-rate guarantee.
    Exact or asymptotic repeated-data control requires a valid joint null law for the true-null comparisons,
    an appropriately estimated covariance and a declared testing family; posterior Gaussianity alone is
    insufficient. Hothorn and colleagues state a multivariate sampling limit and consistent covariance
    estimation for their general parametric procedure. Applying that reasoning to split Bayesian summaries
    requires verifying the relevant regularity and prior-dominance conditions, rather than assuming every
    split satisfies them. Adaptive partition searches, incompatible priors, shared nuisance fitting, weak
    identification and nonnormal posteriors need further assessment.
  evidence:
  - source_id: presanis2017
    locator: Sections 3.4 and 5, PDF pp. 7 and 12–13; Appendix B, p. 28
    relation: supports
  - source_id: hothorn2008
    locator: Sections 2–3, PDF pp. 4–7 / printed pp. 2–5
    relation: supports
- claim_id: interpretation-and-source-boundaries
  kind: limitation
  statement: An adjusted continuous tail is not the posterior probability that two quantities are exactly
    equal. The choice of split, reference prior, scale and testing family changes the diagnostic; masking
    can remain, and a small score does not establish which source is wrong or authorize its exclusion.
    The record uses signed contrast matrices, proper normalized posteriors, explicit transformation Jacobians
    and max-absolute tails. It does not import the 2017 source expressions that apply a second two-tail
    transform to an already two-sided density-level score, describe difference matrices with only 1s and
    0s, or require an invertible contrast matrix. These qualifications preserve the method without treating
    source notation as a general theorem.
  evidence:
  - source_id: presanis2017
    locator: Section 3.1, PDF p. 6; Sections 3.2–3.4, pp. 6–7; examples/discussion, pp. 9–13; Appendix
      B, p. 28
    relation: supports
  - source_id: presanis2013
    locator: Section 3.2.2, PDF p. 9
    relation: supports
  - source_id: hothorn2008
    locator: Sections 2–3, PDF pp. 4–7 / printed pp. 2–5
    relation: supports
