id: AIMech:MultipleTestingNodeConflictDiagnostic
name: Multiple-testing node conflict diagnostic
aliases: []
concept_kind: algorithm
definition: A Bayesian evidence-synthesis diagnostic that partitions information at replicated separator
  nodes, stacks declared contrasts between transformed copies, and uses their joint covariance and a multivariate
  reference distribution to assess global and multiplicity-adjusted local conflict. Its single-step max-absolute-statistic
  adjustment accounts for correlation within an explicitly selected family of comparisons.
identity_notes: 'No normalized identity match for the proposed multiple-testing conflict, INLA group-conflict
  and general parametric maxT candidates among all 442 pinned AIO and 559 maintained IDs, labels, aliases
  and scoped synonyms. Ignored- and hidden-inclusive searches of the recovery, older discovery and original
  Documents checkouts returned 132, 0 and 0 lines: 39 identical previous lines reused, 90 new short rows
  read, two identical generated separator-record search rows checked and read, and one previous query
  row verified exact against its earlier reading. Hits concern existing diagnostics, mirrors, metadata
  and pending leads. Assessed 61 semantic AIO rows and 213 native names/definitions: 55 and 203 prior
  rows verified equal, all 6 and 10 additions read. Ten full AIO nodes, annotations, incident edges and
  generated records plus seven native context records were read or verified unchanged. This identity adds
  a joint contrast family and multiplicity adjustment to general separator splitting. It is not generic
  maxT inference for arbitrary estimators, a single unit-level conflict score, Gaussian-message screening,
  INLA fitting, or every method called node splitting.'
