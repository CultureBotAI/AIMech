aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The algorithm forms joint conflict comparisons from separator copies in Bayesian directed
    acyclic evidence-synthesis graphs. BayesianNetwork supplies this representation context; it is not
    the diagnostic or its simultaneous testing procedure, so this is relatedness rather than equivalence
    or subclass membership.
limitations:
- Only a specified collection of partitions and contrasts is assessed. Broad exploratory searches, dependence
  introduced by shared nuisance estimates, and changes in the selected family require separate validity
  analysis.
- A singular covariance due to redundant contrasts differs from a zero-variance coordinate or a null outside
  the affine support. Positive diagonal variances, support, numerical rank and the joint reference law
  must be assessed explicitly.
- The source contains density-score, contrast-sign, rank and normalization ambiguities; the record states
  its mathematical convention and uses the earlier node-splitting paper and primary simultaneous-inference
  report for clarification. No universal frequentist control follows from a normal-looking posterior.
- The inspected arXiv v2 margin is dated 13 September 2017 while its title page says July 9, 2021; both
  observations are retained without explaining the discrepancy. The Hothorn source is the February 15,
  2008 LMU technical report, not an assumed identical journal PDF.
- All 28 pages of the multiple-testing paper, all 25 PDF pages of the technical report and all 22 pages
  of the earlier general diagnostic paper were read. No multcomp/OpenBUGS implementation, original application
  fit, MCMC, benchmark or repeated-data calibration experiment was run. Constructed Gaussian contrasts
  check rank, covariance, correlation-adjusted tails and support boundaries; they do not reproduce the
  source applications.
