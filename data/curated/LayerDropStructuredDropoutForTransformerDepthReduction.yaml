id: AIMech:LayerDropStructuredDropoutForTransformerDepthReduction
name: 'LayerDrop: Structured Dropout for On-Demand Transformer Depth Reduction'
concept_kind: algorithm
review_status: DRAFT
definition: A structured dropout regularization and on-demand depth-pruning algorithm for Transformer networks that constrains a binary Bernoulli mask M in {0, 1} to be constant across each predefined layer weight group G in calG (so M[i] = M[j] for all (i, j) in G and entire layers are stochastically bypassed via residual connections with drop probability p during training, yielding N(1 - p) expected active layers), sets the optimal training drop rate to p* = 1 - r/N for a target inference depth of r layers, and extracts shallow sub-networks of any desired depth at inference time without post-hoc fine-tuning by deterministically dropping every other strided layer d == 0 (mod floor(1/p_prune)).
identity_notes: Introduced by Angela Fan, Edouard Grave, and Armand Joulin (ICLR 2020, arXiv:1909.11556). Distinct from unstructured weight DropConnect (which zeroes individual weights without reducing inference latency), from Stochastic Depth in ResNets (which uses a linear depth-decay survival schedule purely to accelerate training without inference-time layer pruning), and from distillation-based depth compression methods such as DistilBERT (Round 803) and TinyBERT (Round 800) that must train a separate student model for each target depth.
aliases:
- LayerDrop
- LayerDrop Structured Layer Dropout for Transformers
- On-Demand Transformer Depth Pruning via LayerDrop
