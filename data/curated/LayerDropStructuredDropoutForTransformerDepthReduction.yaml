claims:
- claim_id: r810-claim-group-constant-structured-dropout-and-optimal-drop-rate
  kind: mechanism
  statement: LayerDrop generalizes DropConnect W_d = M o W by partitioning network parameters into predefined layer groups G in calG and enforcing M[i] = M[j] for all (i, j) in G with independent group drop probability p (Section 3.2.1); because N(1 - p) layers are active on average during training, targeting an inference-time pruned sub-network of r layers out of N yields the optimal training drop rate p* = 1 - r/N (Section 3.2.2).
  evidence:
  - source_id: r810-primary-pdf
    locator: Section 3.2.1 (Randomly Dropping Structures at Training Time) & Section 3.2.2 (Setting the drop rate for optimal pruning), Pages 3-4
    relation: supports
  - source_id: r810-primary-pdf
    locator: optimal_drop_rate and expected_active_layers verification in main()
    relation: supports
- claim_id: r810-claim-every-other-strided-inference-pruning
  kind: mechanism
  statement: At inference time, LayerDrop extracts shallow sub-networks from a single trained Transformer without fine-tuning using the deterministic 'Every Other' strategy, which prunes at rate p_prune by dropping layers at depth d satisfying d == 0 (mod floor(1/p_prune)), matching or nearly matching validation-search and learned data-driven softmax layer-selection while avoiding the severe perplexity degradation caused by contiguous first-half or last-half layer removal.
  evidence:
  - source_id: r810-primary-pdf
    locator: Section 3.2.2 (Pruning at Inference Time) & Section 6 (Ablation Studies, Figures 4-5), Pages 4 & 7-8
    relation: supports
  - source_id: r810-primary-pdf
    locator: every_other_kept_layers verification for p_prune=0.25 and p_prune=0.50 in main()
    relation: supports
- claim_id: r810-claim-deep-transformer-stabilization-and-roberta-pruning
  kind: application
  statement: "LayerDrop stabilizes and regularizes very deep Transformers\u2014enabling a 12-encoder-layer Transformer to reach 30.2 BLEU on WMT14 En-De (where the baseline without LayerDrop diverges), a 40-layer Adaptive Inputs Transformer to reach 17.7 test perplexity on WikiText-103, and a 48-layer RoBERTa-Large model to train at almost 2x speed with p = 0.5\u2014while 6-layer (50% pruned) and 3-layer (75% pruned) RoBERTa sub-networks outperform DistilBERT and from-scratch small models on MNLI and SST-2."
  evidence:
  - source_id: r810-primary-pdf
    locator: Section 5.1-5.2 (Tables 1-4, Figures 2-3) & Appendix A.2-A.3 (Table 7, Figure 7), Pages 5-7 & 14-15
    relation: supports
- claim_id: r810-claim-boundary-layer-sensitivity-and-high-pruning-rate-limitation
  kind: limitation
  statement: In a LayerDrop-trained Transformer, the earliest input layers and final output projection layers remain disproportionately critical to performance (removing contiguous blocks of initial or final layers causes severe perplexity degradation from 19.7 to 26.1-29.3 on WikiText-103), and extracting aggressively pruned sub-networks (e.g., >=50% depth reduction) requires training with a correspondingly large drop rate (p = 0.4-0.5).
  evidence:
  - source_id: r810-primary-pdf
    locator: Section 6 (Ablation Studies, Figures 4, 5, & 6), Pages 7-8
    relation: supports
