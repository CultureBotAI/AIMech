name: Iterative-deepening A-star search
definition: A heuristic search algorithm that repeats depth-first passes bounded by f=g+h, starting with
  the start-state heuristic and raising each cutoff to the smallest value that exceeded the preceding
  cutoff.
concept_kind: algorithm
identity_notes: IDA-star is the cost-threshold variant of iterative deepening. The g value is the cost
  of the current search path and h estimates remaining cost. It does not maintain A-star’s complete open
  and closed lists, and its cutoff is not simply a depth limit. No normalized identity match was found
  across the 442 AIO and 119 prior native records; ignored-inclusive text hits in the main checkout were
  dependency-package documentation and an unrelated package-metadata substring, not existing concept records.
limitations:
- Lowest-cost solution arguments require an admissible heuristic and suitable search/termination assumptions;
  arbitrary heuristic estimates are not certified here.
- The method regenerates search paths. Many distinct cutoff values or duplicate routes can impose substantial
  additional work; this record does not claim the same runtime or expansion count as A-star on every graph.
- With a nonmonotone evaluation function, iterative deepening does not in general visit newly expanded
  nodes in best-first order within a cutoff.
- The original journal paper has an access-limited 1986 erratum. Its basic procedure is corroborated by
  the 1992 primary paper; the 1985 global asymptotic-optimality theorem is not asserted.
