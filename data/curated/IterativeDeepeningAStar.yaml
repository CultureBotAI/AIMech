aio_no_match:
  search_scope: All 442 pinned AIO labels and scoped synonyms and 119 preceding native identities were
    compared. Both updated checkouts were searched including hidden and ignored files. Exact CLASS nodes
    and edges for GraphLanguageModel, ReasoningLLM, NeuroSymbolicLLM, MachineLearningTask, MathematicalFunction
    and ReinforcementLearning were inspected, alongside semantic search for search, planning, heuristic,
    path, traversal, symbolic, reasoning and graph terminology.
  rationale: No suitable AIO counterpart for this graph/state-space search procedure was identified in
    the inspected snapshot. Using graphs, evaluation functions or a search subroutine in an AI system
    does not equate the algorithm with a learned model, a learning task or a mathematical function.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: A language model operating on structured graph representations is not a graph traversal
      or shortest-path algorithm.
  - target: AIO:ReasoningLLM
    rejection_reason: Language-task deductive inference does not denote general state-space search.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: A language-model architecture combining neural and symbolic components is not the
      search procedure itself.
  - target: AIO:MachineLearningTask
    rejection_reason: Building methods that learn from data is not the identity of an algorithm traversing
      a specified graph.
  - target: AIO:MathematicalFunction
    rejection_reason: The search procedure is distinct from the mathematical functions it may evaluate.
  - target: AIO:ReinforcementLearning
    rejection_reason: A learning task balancing exploration and exploitation is distinct from deterministic
      graph/state-space traversal.
