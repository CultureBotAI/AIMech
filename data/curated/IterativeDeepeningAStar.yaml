claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Within each pass, expand along a depth-first path until g+h exceeds the current cutoff. Track
    the smallest exceeded value to set the next pass’s cutoff, then restart from the initial state; depth-first
    traversal state replaces the complete A-star frontier.
  evidence:
  - source_id: method-source
    locator: Section 6, printed pp. 103–105 / PDF pp. 7–9; threshold update and qualified heuristic analysis
    relation: supports
- claim_id: regeneration-and-order
  kind: limitation
  statement: The later paper corroborates the minimum-exceeded-value threshold update and explains that
    iterative deepening need not follow best-first order with a nonmonotone cost function. It also identifies
    tree cases with many distinct costs in which regeneration overhead is substantial.
  evidence:
  - source_id: later-primary-paper
    locator: Previous Work, printed pp. 533–534 / PDF pp. 1–2; Theoretical Results, printed p. 536 / PDF
      p. 4
    relation: supports
