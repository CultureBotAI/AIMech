name: Strategic oscillation
definition: A search-control strategy that alternates search directions or regimes around selected boundaries,
  controlling excursions and returns to explore solutions beyond the region of a single one-direction
  search.
concept_kind: algorithm
identity_notes: The concept is deliberate boundary-relative control, not incidental oscillation of objective
  values and not every tabu-search method. Feasibility/infeasibility is an important application, while
  the primary source also describes cardinality boundaries, opposing constructive/destructive searches
  and rebounds without crossing. The rudimentary Glover–Hao rule is one instance, not the universal definition.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 304 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 176 and 176 lines respectively. Inspected text hits were prior discovery leads,
  uses of local search inside existing methods, source references and their saved reports/reviews. These
  were references to methods rather than existing candidate records. Six exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and six native neighboring mechanisms were inspected. Absence is
  bounded to this snapshot and semantic neighborhood.
limitations:
- The rudimentary rule does not ensure that every local step crosses a boundary, and generic strategic
  oscillation is not restricted to feasibility crossing. The boundary, quality/infeasibility measures,
  depth control, memory, ties and stopping must be specified for an executable instance.
- Finding a better objective in infeasible space does not make it a valid answer to the constrained problem.
  The strategy alone provides no general feasibility, cycle-freedom or global-optimality guarantee.
- The later paper analyzes a constructed hard example and explicitly disclaims a universally prevailing
  strategy. Its complete example derivation, broader appendix and empirical performance were not audited
  here; no generalized theorem or benchmark claim is curated.
