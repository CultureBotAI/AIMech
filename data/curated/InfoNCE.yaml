claims:
- claim_id: method
  kind: mechanism
  statement: Given a context c, draw one positive x_+ jointly with c and N−1 negative candidates independently
    from the marginal p(x), with N>=2. For real scores s(x,c), define ell=−log[exp(s(x_+,c))/sum_(j=1)^N
    exp(s(x_j,c))], including the positive in the denominator, and minimize L_NCE=E[ell]. For the ideal
    sampling scheme, log(N)−L_NCE<=I(X;C); since ell>=0, the bound is at most log(N) and may itself be
    negative. An expressive optimum scores the conditional-to-marginal density ratio up to a context-dependent
    multiplicative constant in exp(s). The categorical objective remains definable with other candidate
    constructions, but its stated mutual-information interpretation then requires a separate argument.
    Poole et al. provide an independent rigorous derivation of the expected bound beyond the approximate
    step in the original CPC appendix.
