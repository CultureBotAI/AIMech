name: InfoNCE
definition: A contrastive log-softmax objective that identifies a joint positive among sampled candidates
  and, under independent marginal-negative sampling, gives an expectation-level lower bound on mutual
  information.
concept_kind: mathematical_method
identity_notes: 'InfoNCE is the loss introduced in contrastive predictive coding, separable from the CPC
  encoder/context/prediction procedure. It does not by itself prescribe cosine similarity, temperature,
  augmentation pairs, symmetric losses or an autoregressive architecture. Named configurations such as
  SimCLR NT-Xent and DIM’s finite-masking implementation require their own sampling and numerical qualifications.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 203 preceding
  native IDs/names/aliases. Ignored-inclusive word-delimited searches of both full checkouts returned
  52 worktree and 75 main-checkout lines: existing component discussions and discovery/review references,
  plus unrelated ignored dependency text in main. Short acronyms were compared in normalized identities.
  Four nearest maintained mechanisms and eleven exact AIO candidate nodes with direct parent edges were
  inspected.'
limitations:
- The lower bound holds for an expectation under its specified joint and independent marginal sampling.
  A realized finite-batch number is not certified to be below true mutual information.
- The log(N) ceiling limits estimation of high mutual information at a fixed candidate count. Optimizing
  a finite, restricted critic need not recover the density ratio or true information.
- False semantic negatives, conditional negative proposals and correlated in-batch candidates can change
  the learned representation and invalidate an unqualified use of the ideal sampling proof. Semantic usefulness
  is not guaranteed by the loss.
- Finite masking values contribute nonzero denominator mass and are not algebraically identical to removing
  candidates. No numerical implementation or training experiment was run for this loss record.
