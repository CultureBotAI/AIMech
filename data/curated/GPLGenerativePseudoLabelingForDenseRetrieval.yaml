id: AIMech:GPLGenerativePseudoLabelingForDenseRetrieval
name: GPL (Generative Pseudo Labeling for Unsupervised Domain Adaptation of Dense Retrieval)
concept_kind: algorithm
review_status: DRAFT
definition: An unsupervised domain adaptation algorithm for dense text retrieval models that adapts a bi-encoder f_theta to an unlabeled target-domain passage corpus by (1) generating synthetic queries Q_i for target passages P_i^+ using a pre-trained sequence-to-sequence query generator, (2) mining hard negative passages P_i^- from the target corpus for each generated query using pre-existing retrievers, and (3) scoring each (Q_i, P_i^+, P_i^-) tuple with a pre-trained cross-encoder CE to compute continuous relevance margins delta_i = CE(Q_i, P_i^+) - CE(Q_i, P_i^-) and training the student bi-encoder via MarginMSE loss L_MarginMSE(theta) = (1/M) sum_{i=0}^{M-1} |hat_delta_i - delta_i|^2.
identity_notes: Introduced by Wang, Thakur, Reimers, and Gurevych (NAACL-HLT 2022, pp. 2345-2360, arXiv:2112.07577). Distinguished from QGen (Ma et al., 2021; Thakur et al., 2021), which trains on generated queries with binary 0-1 MultipleNegativesRanking loss (MNRL) and degrades when combined with hard negatives, and from InPars (Bonifacio et al., 2022) or Promptagator (Dai et al., 2023), which rely on few-shot LLM prompt generation and top-k likelihood or dual-encoder consistency filtering rather than cross-encoder MarginMSE soft-margin distillation.
aliases:
- Generative Pseudo Labeling
- GPL Unsupervised Domain Adaptation for Dense Retrieval
- GPL MarginMSE Pseudo-Labeling Pipeline
