claims:
- claim_id: gpl-three-stage-marginmse-distillation-mechanism
  kind: mechanism
  statement: For an unlabeled target corpus C (down-sampled to |C_eff| = ceil(250K / 3) when 3*|C| > 250K, with q_avg = ceil(250K / |C_eff|) >= 3 synthetic queries per passage), GPL generates queries Q_i via nucleus sampling from a T5 query generator, retrieves k = 50 hard negatives P_i^- per query using pre-existing dense retrievers, computes cross-encoder logit margins delta_i = CE(Q_i, P_i^+) - CE(Q_i, P_i^-), and trains the student bi-encoder f_theta with dot-product margins hat_delta_i = f_theta(Q_i)^T f_theta(P_i^+) - f_theta(Q_i)^T f_theta(P_i^-) to minimize L_MarginMSE(theta) = (1/M) sum_i |hat_delta_i - delta_i|^2.
  evidence:
  - source_id: r745-primary-pdf
    locator: Section 3 (Method, Eq. 1) & Section 4.1 (Experimental Setup), pp. 3-5
    relation: supports
  - source_id: r745-primary-pdf
    locator: compute_gpl_qpp_and_corpus_size, margin_mse_loss_and_grad_wrt_neg_sim & main
    relation: supports
- claim_id: gpl-false-negative-and-noisy-query-denoising
  kind: scope
  statement: Replacing QGen's binary 0-1 MultipleNegativesRanking loss (which drops by 2.5 nDCG@10 points on average when trained with mined hard negatives due to false negatives) with continuous cross-encoder MarginMSE soft labels improves average nDCG@10 across six domain-specialized BeIR datasets (FiQA, SciFact, BioASQ, TREC-COVID, CQADupStack, Robust04) from 45.2 (zero-shot MS MARCO) and 48.8 (QGen) to 51.5 (GPL) and 52.9 (TSDAE + GPL), and maintains +3.0 nDCG@10 over zero-shot even at extreme query-generation sampling temperature 10.0.
  evidence:
  - source_id: r745-primary-pdf
    locator: Section 5 (Table 1), Section 6.3 (Figure 3), & Section 7 (Table 5), pp. 6-9
    relation: supports
  - source_id: r745-primary-pdf
    locator: main (Table 5 FiQA false-negative vs. true-negative margin gradient comparison)
    relation: supports
- claim_id: gpl-multi-stage-training-overhead-limitation
  kind: limitation
  statement: "GPL requires a complex multi-stage offline adaptation pipeline\u2014generating 250K synthetic queries, indexing the target corpus for hard-negative mining, and running cross-encoder inference and 140K MarginMSE optimization steps (approximately 9.6 hours on a V100 GPU per 100K steps)\u2014and relies on pre-existing query generation and cross-encoder models pre-trained on a source-domain dataset such as MS MARCO."
  evidence:
  - source_id: r745-primary-pdf
    locator: Section 3, p. 3; Section 4.1, p. 4; Section 6.1, pp. 7-8; Section 8 (Conclusion), p. 9
    relation: supports
