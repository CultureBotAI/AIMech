name: PHATE
definition: A dimensionality-reduction algorithm that computes diffusion transition probabilities, measures
  Euclidean distances between their negative-log rows, and uses metric multidimensional scaling to embed
  those potential distances.
concept_kind: algorithm
identity_notes: PHATE uses potential distances between transformed diffusion distributions followed by
  stress fitting; AIMech:DiffusionMaps uses time-scaled Markov eigenvectors. PHATE is not generic MDS,
  a generative diffusion model, a branch-detection procedure or the DEMaP evaluation criterion. The core
  algorithm is distinct from its landmark approximation and multislice extensions. All 442 pinned AIO
  labels/scoped synonyms and 114 preceding native identities were compared, together with hidden/ignored-inclusive
  searches of both checkouts; source citations and pending frontier mentions were distinguished from existing
  concept identities.
limitations:
- Neighborhood affinities, bandwidth, decay exponent and diffusion time determine the geometry; excessive
  diffusion can remove signal as well as noise.
- Negative logarithms require positive entries. Disconnected or numerically thresholded transitions need
  explicit zero-handling; the paper’s formula alone does not specify a universal remedy.
- A two- or three-dimensional stress fit can distort potential distances and does not guarantee global
  optimization, preservation of every manifold property or biological trajectories.
- The entropy discussion assumes a nonnegative spectrum for its probability normalization. This record
  does not certify that assumption for every adaptive kernel or treat the knee heuristic as an optimal-time
  theorem.
- The inspected PDF is marked corrected; the correction notice and access limitations are tracked in the
  discovery report.
