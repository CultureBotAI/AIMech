claims:
- claim_id: method-scope
  kind: mechanism
  statement: Build symmetric local affinities with an adaptive bandwidth and an alpha-decaying kernel,
    row-normalize them to a Markov operator P, and take a selected diffusion power P^t. For positive transition
    probabilities, form potential vectors −log(P^t_i) and their Euclidean pairwise distances. Initialize
    with classical MDS and optimize metric-MDS stress in the requested output dimension. The paper proposes
    an entropy-knee heuristic for choosing diffusion time and a separate landmark approximation for scaling.
