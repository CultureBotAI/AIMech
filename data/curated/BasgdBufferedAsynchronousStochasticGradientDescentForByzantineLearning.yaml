aio_mappings:
- target: AIO:FederatedLearning
  relation: related_match
  rationale: AIO:FederatedLearning is the closely related distributed learning paradigm; BASGD provides instance-free asynchronous Byzantine-resilient stochastic gradient descent via server-side gradient buffering and timer-based reassignment.
limitations:
- Requires the total number of Byzantine and heavily delayed workers r to be strictly less than half the number of buffers B (r <= q < B/2).
- Wait-for-all-buffers aggregation introduces a semi-asynchronous server update step whose frequency decreases as the buffer count B increases.
