claims:
- claim_id: basgd-server-buffer-running-average-q-br-aggregation-and-timer-reassignment
  kind: mechanism
  statement: 'BASGD maintains B server buffers and a mapping table {beta_s}_{s=0}^{m-1}: when worker s sends gradient g, the server updates buffer b = beta_s mod B via N_b^t <- N_b^t + 1 and h_b <- ((N_b^t - 1) h_b + g)/N_b^t and immediately returns w^t to worker s; once N_b^t > 0 for all b in [B], it aggregates G^t = Aggr([h_1, ..., h_B]) via a q-BR function (Coordinate-Wise Median or q-Trimmed Mean, Definitions 1-3 & Proposition 1), updates w^{t+1} <- w^t - eta G^t, and zeroes the buffers, or reassigns active workers across [B] if the timer exceeds Delta.'
  evidence:
  - source_id: r539-primary-pdf
    locator: Section 3.1-3.3, Algorithm 1, Definitions 1-3, and Proposition 1, pp. 3-5
    relation: supports
- claim_id: basgd-asynchronous-non-convex-convergence-under-q-br-and-effective-aggregators
  kind: scope
  statement: When the combined number of Byzantine and heavily delayed (tau_k^t > tau_{max}) workers is at most r <= q < B/2, Lemmas 1-2 and Theorem 1 prove that BASGD with any q-BR aggregator achieves O(1/sqrt(T)) convergence up to a variance/bias neighborhood controlled by Lambda_{B,q,r} = (B-r)sqrt(B-r+1)/sqrt((B-q-1)(q-r+1)), and Theorem 2 proves dimension-free O(tau_{max}/sqrt(T)) + A_1 convergence for any (A_1, A_2)-effective stable aggregation function (Definitions 4-5).
  evidence:
  - source_id: r539-primary-pdf
    locator: Section 3.2, Definitions 4-5, pp. 4-5; Section 4, Lemmas 1-2, Theorems 1-2, and Proposition 2, pp. 6-7
    relation: supports
- claim_id: basgd-buffer-count-update-frequency-and-reassignment-timer-limitation
  kind: limitation
  statement: Choosing a larger buffer count B increases resilience against Byzantine workers (up to r <= floor((B-1)/2) for median) but reduces the server's parameter update frequency, while an improperly tuned reassignment interval Delta either discards buffered gradients too frequently (small Delta) or delays recovery from unresponsive straggler buffers (large Delta).
  evidence:
  - source_id: r539-primary-pdf
    locator: Section 3.2-3.3, p. 5; Section 5.2, Figure 3(a) & 3(d), pp. 7-8
    relation: supports
- claim_id: basgd-asynchronous-resnet-and-wikitext-lstm-byzantine-training-application
  kind: application
  statement: Applied to asynchronous Byzantine-resilient distributed training of ResNet-20 on CIFAR-10 and 2-layer LSTM language models on WikiText-2 under negative-gradient (NG) and random-disturbance (RD) attacks with random worker delays.
  evidence:
  - source_id: r539-primary-pdf
    locator: Section 5.1-5.3, Table 1 and Figures 3-4, pp. 7-9
    relation: supports
