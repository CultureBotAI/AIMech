id: AIMech:BasgdBufferedAsynchronousStochasticGradientDescentForByzantineLearning
name: BASGD Buffered Asynchronous Stochastic Gradient Descent for Byzantine Learning
concept_kind: algorithm
review_status: DRAFT
definition: An asynchronous Byzantine-resilient parameter-server optimization algorithm proposed by Yang and Li (ICML 2021) that resists malicious worker attacks and arbitrary worker delays without storing any validation instances on the server by maintaining B server-side buffers (0 < B <= m) and a dynamic worker-to-buffer mapping table {beta_s}_{s=0}^{m-1}, accumulating incoming worker gradients into running buffer averages h_b in buffer b = beta_s mod B while immediately returning the current model w^t to worker s, executing a robust aggregation step G^t = Aggr([h_1, ..., h_B]) using a q-Byzantine-Robust (q-BR) or (A_1, A_2)-effective aggregator whenever all B buffers contain at least one gradient, and reassigning active workers across buffers if a timer exceeds Delta seconds.
identity_notes: Distinct from Kardam (AIMech:KardamLipschitzAndFrequencyFilteredAsynchronousByzantineStochasticGradientDescent, which filters individual incoming gradients via empirical Lipschitz quantiles and a 2f-window frequency filter without server buffers) and from Zeno++ (AIMech:ZenoPlusPlusRobustFullyAsynchronousStochasticGradientDescent, which requires a clean validation dataset stored on the server to compute candidate loss-descent scores). Also distinct from synchronous s-Bucketing (AIMech:BucketingForAgnosticByzantineRobustAggregationOnHeterogeneousDatasets, which randomly reshuffles synchronous worker momentum vectors at every barrier step). BASGD (Yang & Li, ICML 2021, PMLR 139:11751-11761, Algorithm 1 & Section 3.1-3.3, pp. 3-5) routes each arriving asynchronous gradient g from worker s into buffer b = beta_s mod B via the online mean update N_b^t <- N_b^t + 1, h_b <- ((N_b^t - 1) h_b + g) / N_b^t, immediately replies to worker s with the latest w^t without synchronization barriers, triggers a parameter update w^{t+1} <- w^t - eta Aggr([h_1, ..., h_B]) and zeroes all buffers as soon as N_b^t > 0 for every b in [B], and resets the mapping table {beta_s} to redistribute active workers across all B buffers whenever the step timer exceeds the reassignment interval Delta.
aliases:
