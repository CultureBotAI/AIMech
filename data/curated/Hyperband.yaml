claims:
- claim_id: method
  kind: mechanism
  statement: Choose a maximum per-configuration resource R and reduction factor eta. In the finite-horizon
    Algorithm1, set s_max=floor(log_eta(R)) and B=(s_max+1)*R. For each bracket s from s_max down to zero,
    start with n=ceil((B/R)*eta^s/(s+1)) configurations and r=R*eta^(−s) resource units. Evaluate current
    candidates at geometrically increasing resource levels and retain the best approximately 1/eta fraction
    after each comparison. The s=0 bracket evaluates its candidates directly at R. Algorithm1 returns
    the configuration with the smallest intermediate loss observed, rather than specifying selection only
    among maximum-budget evaluations. Brackets address uncertainty about how many configurations to start
    and how long to evaluate before elimination. Resources can denote iterations, time, data or features;
    actual computational cost and whether work can be resumed depend on that choice.
