claims:
- claim_id: fedgnn-pseudo-interacted-item-sampling-and-ldp-gradient-perturbation
  kind: mechanism
  statement: To prevent the central server from inferring a user's private interaction history from which item embeddings have non-zero gradients g_i^e and from reconstructing raw ratings y_{i,j} via gradient inversion, each client in FedGNN samples M non-interacted items, generates synthetic pseudo-item gradients g_i^p from a Gaussian distribution matching the empirical mean and covariance of real item-embedding gradients g_i^e (yielding expected interaction anonymity proportional to 1 + M P / |Y_o|), and perturbs the combined gradient g_i = (g_i^m, g_i^e, g_i^p) via g_i = clip(g_i, delta) + Laplace(0, lambda) (Equation 1) with local differential privacy upper bound epsilon <= 2 delta / lambda.
  evidence:
  - source_id: r517-primary-pdf
    locator: Section 3.3 and Section 3.5, Equation (1), pages 4-6
    relation: supports
- claim_id: fedgnn-privacy-preserving-graph-expansion-via-encrypted-item-matching
  kind: mechanism
  statement: 'To capture high-order collaborative user-item signals without revealing user identities or raw interaction lists to the recommendation server or other clients, FedGNN uses Algorithm 2: after T warmup epochs, the central server generates a public/private key pair (p, s) and sends p to clients; each client encrypts its interacted item IDs with p and sends the ciphertexts together with its inferred user embedding e_i^u to a third-party server, which links users sharing identical encrypted item ciphertexts and returns anonymous 1-hop neighbor user embeddings [e_{i,1}^u, ..., e_{i,N}^u] so each client can connect neighbor user nodes to co-interacted items in its expanded local graph G_i.'
  evidence:
  - source_id: r517-primary-pdf
    locator: Section 3.4, Algorithm 2 and Figure 3, pages 5-6
    relation: supports
- claim_id: fedgnn-recommendation-accuracy-across-six-benchmarks
  kind: application
  statement: Evaluated across six benchmark recommendation datasets (MovieLens-100K, MovieLens-1M, MovieLens-10M, Flixster, Douban, and YahooMusic), FedGNN with gated graph neural networks (GGNN), graph convolutional networks (GCN), or graph attention networks (GAT) matches centralized GNN recommendation RMSE and significantly outperforms privacy-preserving Federated Matrix Factorization (FedMF) and Federated Collaborative Filtering (FCF) (Tables 2 and 3, e.g., reducing RMSE on ML-100K from 0.947 for FedMF to 0.910 for FedGNN).
  evidence:
  - source_id: r517-primary-pdf
    locator: Section 4.1-4.3, Tables 2-3, pages 6-7
    relation: supports
