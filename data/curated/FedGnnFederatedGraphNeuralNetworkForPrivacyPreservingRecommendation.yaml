id: AIMech:FedGnnFederatedGraphNeuralNetworkForPrivacyPreservingRecommendation
name: FedGNN (Federated Graph Neural Network for Privacy-Preserving Recommendation)
concept_kind: algorithm
review_status: DRAFT
definition: FedGNN (Federated Graph Neural Network for Privacy-Preserving Recommendation) is a federated collaborative filtering and graph neural network training framework in which each user client maintains a private first-order user-item interaction subgraph G_i, protects interacted item IDs against server gradient-inversion attacks by sampling M non-interacted pseudo items with synthetic Gaussian embedding gradients g_i^p matching the mean and covariance of real item embedding gradients g_i^e, perturbs the combined model and item-embedding gradients with clipped Laplace local differential privacy g_i = clip(g_i, delta) + Laplace(0, lambda), and expands local graphs to high-order user-item neighbor neighborhoods via homomorphic-encryption item-ID matching and anonymous neighbor user-embedding exchange through a third-party server.
identity_notes: 'Introduced by Chuhan Wu, Fangzhao Wu, Yang Cao, Yongfeng Huang, and Xing Xie in ''FedGNN: Federated Graph Neural Network for Privacy-Preserving Recommendation'' (arXiv:2102.04925, DBLP:journals/corr/abs-2102-04925). Distinct from FCF (Federated Collaborative Filtering, Ammad-ud-din et al. 2019), which models only first-order matrix factorization interactions and exposes interacted item IDs via non-zero item-embedding gradients; and distinct from FedSage+ (Zhang et al. NeurIPS 2021), which trains a local missing-neighbor generator (NeighGen) across multi-node subgraphs rather than expanding user-centric bipartite recommendation graphs via encrypted item matching and pseudo-item LDP gradients.'
aliases:
- FedGNN
- Federated Graph Neural Network for Privacy-Preserving Recommendation
