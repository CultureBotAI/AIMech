claims:
- claim_id: method
  kind: mechanism
  statement: Initialize each binary-coordinate probability P_i to .5. At each generation, independently
    sample a population of binary vectors according to P, evaluate them and choose a sample x_best with
    the highest objective value in that generation. Update each coordinate P_i_new=(1−LR)*P_i+LR*x_best_i.
    Then, with a configured mutation probability per coordinate, shift that probability toward a randomly
    chosen binary endpoint b using P_i_new=(1−MUT_SHIFT)*P_i+MUT_SHIFT*b. Repeat for the selected budget
    or stopping rule. For these convex-update interpretations, LR and MUT_SHIFT lie in [0,1]. Maintain
    the highest-evaluation solution vectors separately for return, as the Figure4 caption recommends.
    The baseline updates its distribution toward the current-generation winner, not automatically the
    best-so-far archive. Injecting the archived best into later populations, moving toward several winners,
    or learning away from differing bits of poor samples are separately described extensions.
