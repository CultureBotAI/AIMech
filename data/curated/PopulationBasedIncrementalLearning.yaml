name: Population-based incremental learning
definition: An optimization method that samples candidate solutions from a probability-vector representation
  and incrementally moves that representation toward high-evaluation sampled solutions, with probability-vector
  mutation in its basic formulation.
concept_kind: algorithm
identity_notes: The inspected baseline uses independent Bernoulli coordinates for fixed-length binary
  solutions and moves toward the current generation’s single best sample. Multiple-positive and negative-example
  updates are explicit extensions. It is not continual learning, supervised classification, direct crossover
  of persistent chromosomes, or the general cross-entropy optimization framework. A single-elite Bernoulli
  CE fit with smoothing can coincide with the PBIL attraction step; that shared subcase does not establish
  equivalence of the full named procedures. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 291 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 61 and 71 lines respectively. Text
  hits were prior candidate leads, citations to a reused Ant System source, neighboring mechanism distinctions,
  saved review/report material, and unrelated PBIL strings in ignored HOGENOM prefix-map URLs. Eight exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The product of coordinate marginals cannot represent general dependencies between bits or arbitrary
  mixtures of dissimilar good solutions. Different populations can have the same marginals; representation
  and encoding affect the search.
- A high learning rate can concentrate probabilities prematurely; a very low rate can make adaptation
  slow. With interior probabilities and 0<LR<1, a finite attraction step stays interior in exact arithmetic,
  but this does not guarantee lasting exploration or a finite-budget global optimum. Mutation events can
  be absent, and floating-point probabilities can collapse.
- 'Probability-vector mutation is not a bit flip of every sampled chromosome and is not guaranteed to
  increase diversity on each event: a move toward an already favored endpoint can increase concentration.
  Mutation toward .5 is discussed separately as a future alternative.'
- Selection of the current-generation winner depends on objective ordering, whereas tie handling, objective
  direction, noise, population size and mutation randomization remain configuration choices. A preserved
  output archive does not force that archived vector into future samples. The report’s comparative results
  are not universal performance guarantees.
