aio_mappings:
- target: AIO:RegressionAnalysis
  relation: related_match
  rationale: The pinned target denotes a supervised estimation task. This record specifies a fitting algorithm
    for real-valued responses, so the relation captures the task without asserting algorithm/task equivalence.
    LinearRegression, RidgeRegression and LeastsquaresAnalysis do not specify this kernel expansion, fixed
    epsilon-insensitive loss and differently regularized basis components.
- target: AIO:SupportVectorMachine
  relation: related_match
  rationale: The source extends support-vector kernel fitting, but the pinned AIO target describes a network
    with input, hidden and output parts. The native record denotes an optimization algorithm, making this
    a related abstraction rather than an exact match or asserted subclass. KernelLayer and RegularizationLayer
    are neural components, while TrainingStrategy and Network are too general to identify this objective.
limitations:
- All seven original proceedings pages were visually read. External representer/kernel proofs, the 1998
  report precursor and later extensions were not fully audited.
- Exact rational primal/dual certificates are curator calculations, not historical benchmark reproductions.
  No solver, trained model or paid provider was run.
- The supplied basis, fixed epsilon and regularization choice remain user-specified; the record does not
  establish automatic model selection or universal generalization.
- This source-specific native algorithm remains DRAFT; discovery and saved author review do not imply
  upstream AIO acceptance or independent peer review.
