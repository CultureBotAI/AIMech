claims:
- claim_id: search-procedure
  kind: mechanism
  statement: 'Use Algorithm 2 with the A-star beam settings in Table 1: prioritize the sum of current
    score and h, maintain a separate length counter, and suppress expansions beyond that length’s k budget.
    For maximization, an admissible h is optimistic about achievable future reward. The framework’s top-completed-hypothesis
    stopping rule operates over this already-pruned agenda; a finite beam can exclude globally superior
    paths.'
  evidence:
  - source_id: method-source
    locator: Section 3, Algorithm 2 and Table 1; Definition 3.1; printed pp. 797–798 / PDF pp. 3–4
    relation: supports
- claim_id: finite-beam-heuristic
  kind: limitation
  statement: With finite pruning, even an admissible future-score heuristic can alter which hypotheses
    survive compared with ordinary width-k beam search. The paper distinguishes the zero-heuristic equivalence
    result from this more general framework.
  evidence:
  - source_id: finite-beam-heuristic
    locator: Section 4.1, A Note on Heuristics, printed p. 801 / PDF p. 7
    relation: supports
