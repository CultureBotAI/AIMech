name: A-star beam search for sequence decoding
definition: A sequence-decoding beam framework that ranks active hypotheses by accumulated score plus
  an optimistic future-score heuristic, uses shorter length to break score ties, and limits accepted expansions
  to k hypotheses per sequence length.
concept_kind: algorithm
identity_notes: This names the finite-beam A-star decoding framework in Meister, Vieira and Cotterell,
  not every algorithm informally called A-star beam search. The h=0 specialization has its own per-length
  best-first record. A finite per-length budget distinguishes the framework from unpruned A* and from
  a whole-frontier capacity cap. No normalized identity match was found across the 442 AIO and 135 prior
  native records; ignored-inclusive text hits in the main checkout were prior discovery leads, source
  citations, scope contrasts and DCBSS substring matches, plus seven public certificate-data substring
  matches, not existing concept records.
limitations:
- The finite beam is an approximation to exact sequence-model decoding; equality to a specified beam procedure
  is not global MAP optimality.
- Sequence length limits, EOS handling and compatible deterministic tie conventions are part of the comparison.
  Arbitrary implementations with different stopping or tie rules need not return identical hypotheses.
- Queue counts are counts of retained hypotheses, not total bytes including neural states, model parameters,
  backpointers and temporary successors. No numerical speedup or benchmark-quality claim is curated.
- Admissibility of h does not preserve the zero-heuristic beam’s output after finite pruning. This is
  explicitly acknowledged in Section 4.1.
- Unpruned A-star guarantees cannot be transferred to the finite-beam framework merely because its heuristic
  is admissible. No unrestricted nonmonotonic stopping theorem is asserted.
- Application to a particular score requires checking the direction and validity of its future-reward
  bound, terminal behavior and stopping policy.
