claims:
- claim_id: mixture-density-and-posterior
  kind: mechanism
  statement: For nonnegative weights summing to one, p(t)=sum_i pi_i Normal(t;mu_i,C_i), with C_i=W_i
    W_i^T+sigma_i^2 I and positive component noise variance. Sampling selects a component before drawing
    its latent factor and observation. Its posterior responsibility is pi_i p(t|i)/p(t); conditional on
    that component, the latent posterior is Gaussian with mean M_i^(-1)W_i^T(t-mu_i) and covariance sigma_i^2
    M_i^(-1), where M_i=W_i^T W_i+sigma_i^2 I. Permuting component labels or rotating a component latent
    basis leaves the observation distribution unchanged.
  evidence:
  - source_id: method-source
    locator: Section 3.1, Equations 3-9, p. 5; Section 4, Equations 19-21, p. 9; Appendix A.6, p. 27;
      Appendix C, Equations 69-72, p. 28
    relation: supports
- claim_id: weighted-local-fitting
  kind: mechanism
  statement: With component assignments as missing data, EM computes responsibilities from the old mixture,
    updates each weight by its responsibility mass divided by sample count, and updates the mean by the
    weighted data mean. It forms a responsibility-weighted covariance around that new mean. A PPCA eigensolution
    supplies each covariance update when its rank and residual-variance conditions hold. Alternatively,
    the paper gives a two-stage generalized EM update using one inner latent-variable EM step, with the
    new mean, old loading/noise parameters and fixed outer responsibilities. This differs from simultaneously
    substituting new parameters into every posterior calculation.
  evidence:
  - source_id: method-source
    locator: Section 4, Equations 21-24, p. 9; Appendix C, coupled Equations 75-78 and two-stage Equations
      79-84, pp. 29-30
    relation: supports
- claim_id: assignment-objective
  kind: scope
  statement: Responsibilities depend on the mixing weight, covariance determinant, in-subspace Mahalanobis
    distance and noise-scaled orthogonal residual. They need not select the component with the smallest
    orthogonal reconstruction error. Thus likelihood fitting supplies a density and soft partition, not
    a guarantee of minimum reconstruction error or a unique global manifold parameterization. Posterior
    latent means retain PPCA shrinkage within each component.
  evidence:
  - source_id: method-source
    locator: Section 3.3, pp. 6-7; Section 5.2, Equations 25-33 and Figure 3 discussion, pp. 10-14; Section
      7, pp. 19-20; curator assignment counterexample
    relation: supports
- claim_id: fitting-degeneracy
  kind: limitation
  statement: Well-defined exact EM or the specified generalized EM step makes likelihood nondecreasing,
    but this does not guarantee convergence to a finite local or global maximum from every initialization.
    Zero loadings remain zero under the displayed iterative loading update. Without constraints preventing
    covariance collapse, a component centered on an observation can shrink its isotropic variance toward
    zero and make mixture likelihood unbounded. Empty responsibility masses, rank-deficient covariances
    and tied eigenvalues also require treatment.
  evidence:
  - source_id: method-source
    locator: Appendix A.4-A.5, pp. 25-26; Appendix C, Equations 82-84, p. 30; curator deductions and finite
      collapse calculation qualifying the source’s local-maximum wording
    relation: supports
- claim_id: covariance-family
  kind: scope
  statement: Latent dimension controls the component covariance restriction. The zero-factor case is spherical
    Gaussian, while q=d-1 can represent any positive-definite d-dimensional Gaussian covariance by using
    its smallest eigenvalue for isotropic noise. Intermediate dimensions impose a repeated residual eigenvalue.
    Component count and latent dimension are model-selection choices; a low-rank loading contribution
    is compatible with full-rank positive-noise covariance.
  evidence:
  - source_id: method-source
    locator: Section 6, internal/PDF pp. 16-18; covariance Equation 7 and eigensolution Equations 14-15,
      pp. 5-6
    relation: supports
limitations:
- Components and latent axes are not uniquely labeled. Local density components need not correspond to
  semantic classes or physical factors; mixture fitting is nonconvex and sensitive to initialization.
- The source’s unqualified local-maximum statements are bounded here by stationary starts and the unconstrained
  mixture-collapse counterexample. Positive variances at finite iterates do not impose a positive lower
  bound on them.
- Image compression may use reconstruction-based assignments after density fitting, and digit posterior
  classification uses a different decision rule. Historical comparisons do not establish universally better
  compression, clustering or recognition.
- All 30 primary reprint pages were read. Finite calculations check weighted eigensolution and two-stage
  EM likelihood increases, assignment disagreement and variance collapse. No historical benchmark or author
  software was reproduced.
