name: Mixtures of Probabilistic Principal Component Analyzers
aliases:
- Mixtures of Probabilistic PCA
- MPPCA
- Mixtures of Probabilistic Principal Component Analysers
concept_kind: model_family
definition: A finite Gaussian mixture whose components each have a linear standard-normal latent factor
  and component-specific isotropic observation noise, giving covariance W_i W_i^T+sigma_i^2 I and probabilistic
  assignments to local principal-component models.
identity_notes: The normalized mixture distribution is distinct from a single PPCA model, reconstruction-error-only
  local PCA, a diagonal-noise mixture of factor analyzers, GTM, and predictive mixtures of experts. The
  model family and its EM or eigendecomposition fitting variants share this record. Mixture components
  need not share a meaningful latent coordinate system. Three candidate identities were compared against
  all 442 pinned AIO IDs, labels and scoped synonyms and 460 preceding native IDs, names and aliases,
  with no normalized collision. Ignored- and hidden-inclusive full-text searches of both checkouts returned
  the same 144 matching lines across 34 files. Every matched passage was read, comprising 83 unique excerpts;
  long serialized web captures were inspected around each match with 220-character flanks, not reread
  in full. Matches are discovery leads, PPCA distinctions, historical reviews and PLSA/count-factorization
  references, not existing candidate records. All 222 semantic label/synonym rows were read. Twenty-six
  annotated AIO nodes and outgoing edges comprise 22 byte-verified prior readings and 4 current complete
  readings. Thirty-six contextual YAMLs comprise 29 unchanged prior readings and 7 current complete readings,
  including ten native neighbors. This is a bounded snapshot/corpus assessment.
