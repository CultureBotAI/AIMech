aio_mappings:
- target: AIO:Preprocessing
  relation: broad_match
  rationale: 'AIO:Preprocessing is broader: RAPID transforms the available observations into a selected
    training subset before an SVDD model is fitted. This mapping states the intended role of the procedure,
    not a guarantee of improved data quality or classifier accuracy. DataPreparation and TrainingStrategy
    are generic neighboring scopes, not exact names for this density-pruning method. BinaryClassification
    is the downstream accept/reject task rather than the selection algorithm. SupportVectorMachine describes
    a supervised category-separating network; KernelLayer is a neural component. SelectionAndSamplingBias
    is a bias condition, not a sample-selection procedure. Native SVDD fits a sphere; CSVDD grows a core
    using repeated SVDD fits, whereas RAPID prunes a density surrogate without those fits. CNNDD and CPDD
    use different distance-based consistency or coverage rules.'
limitations:
- A density-surrogate feasibility check is not an unconditional guarantee of finite SVDD boundary or prediction
  equivalence.
- Printed pseudocode, public code and percentage-prefilter conventions differ. The exact historical sampling
  package revision is not pinned by the inspected evaluation manifest.
- All 27 final RAPID PDF pages were visually read; source files and scoped consistency-theory passages
  were inspected. Exact rational formula checks were executed, but no Julia code, optimizer, model training
  or benchmark was run.
- This remains a native DRAFT. Competing boundary selectors, active-learning parameter methods and bandwidth
  heuristics require their own primary-method assessments.
