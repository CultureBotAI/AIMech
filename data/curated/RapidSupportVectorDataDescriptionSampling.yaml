id: AIMech:RapidSupportVectorDataDescriptionSampling
name: RAPID support vector data description sampling
aliases:
- RAPID
- Reducing samples by pruning of inlier densities
concept_kind: preprocessing_method
definition: A density-based training-subset selection method for support vector data description that
  prefilters low-density observations and greedily removes high-density inliers while testing a retained-density
  threshold on the original inlier set.
identity_notes: 'RAPID denotes the Englhardt-Trittenbach-Kottke-Sick-Böhm density-pruning procedure, expanded
  as Reducing sAmples by Pruning of Inlier Densities. The intended candidate-set rule, printed pseudocode
  and versioned implementation conventions are distinguished below. It is neither an SVDD prediction rule
  nor a generic random-sampling algorithm. Compared all 442 pinned AIO IDs, labels and scoped synonyms
  with all 518 preceding native IDs, names and aliases. No normalized identity collision was found. Fixed-string
  whole-word searches included ignored and hidden files in both checkouts, expanded names, RAPID, the
  publication title, DOI and arXiv identifier. All 126 distinct matched-text windows were read: these
  are prior discovery/review references, pending RAPID leads and ordinary uses of rapid, not an existing
  RAPID concept. All 125 semantic AIO rows and 114 native name/definition rows were read or reused after
  exact equality checks. Annotated AIO nodes and outgoing edges, and 29 contextual YAMLs with full readings,
  distinguish preprocessing, prediction tasks, neural components and neighboring subset-selection methods.
  Absence is bounded to this snapshot and maintained corpus.'
