claims:
- claim_id: density-prefilter
  kind: mechanism
  statement: For a nonempty finite observation set X and a unit-diagonal kernel k with k(x,x)=1, compute
    the unnormalized empirical density d_X(x)=sum_{z in X} k(x,z). An expected-outlier parameter selects
    a low-density threshold; keep I={x in X:d_X(x)>=theta_pre}, discard the other observations and recompute
    densities using only I as kernel centers. Subsequent subset selection prepares data for hard SVDD
    with C=1. This prefilter-plus-hard-fit procedure is not identical to fitting arbitrary-C soft SVDD
    on the original data. The paper leaves quantile index rounding, endpoints and ties under-specified;
    exact requested rejection fractions are not assured.
  evidence:
  - source_id: englhardt2022
    locator: Sections 2 and 4.1, PDF pp3-4 and8-10 / printed pp1351-1352 and1356-1358; Algorithm 1
    relation: supports
- claim_id: greedy-pruning-rule
  kind: mechanism
  statement: The stated intended rule starts with S=I and, while |S|>1, selects a highest-density retained
    observation r, and subtracts its kernel contribution at every original inlier. For the candidate T=S
    minus {r}, define theta_T=min_{z in T} d_T(z). Accept the removal only if d_T(x)>=theta_T for every
    x in I; otherwise stop and return the preceding S. If S reaches a singleton, return it without testing
    an empty candidate. This intended-rule stopping convention is distinct from the stricter public-code
    floor described below. The returned observations are used to train SVDD. The rule is a greedy density-surrogate
    selection, not repeated SVDD optimization, a globally minimum-cardinality subset, or a certified global
    solution of the mixed-integer problem.
  evidence:
  - source_id: englhardt2022
    locator: Section 4.3 prose, PDF pp13-14 / printed pp1361-1362; compare Algorithm 2
    relation: supports
  - source_id: rapid-code
    locator: src/sampler/RAPID.jl, sample function, candidate mask update and feasibility test
    relation: supports
- claim_id: optimization-and-guarantee-scope
  kind: limitation
  statement: The source SOP minimizes the range theta_max-theta_min of empirical densities over the original
    inlier set, subject to nonempty binary subset selection and a selected minimum-density witness. Minimum
    cardinality is a tie-breaker between SOP optima. Theorem 1 establishes a finite-inlier label statement
    for exactly uniform densities, not a quantitative bound on a continuous decision boundary under approximate
    uniformity. Theorem 2 uses separated density extrema and a small-bandwidth limiting argument, while
    its displayed comparison treats old extrema as if they remained extrema after removal. Those steps
    do not establish an unconditional finite-data SVDD boundary-preservation guarantee for greedy pruning.
  evidence:
  - source_id: englhardt2022
    locator: Section 4.2, PDF pp10-13 / printed pp1358-1361; Theorems 1-2, Equations 5-8 and Remarks 3-4
    relation: supports
- claim_id: finite-density-boundary-distinction
  kind: limitation
  statement: Unweighted kernel-density level sets and fitted finite-sample SVDD decision regions are generally
    different. An exact curator example uses k(x,y)=2^(-(x-y)^2) on points 0,1,4. Positive hard-SVDD coefficients
    (1205376,1198391,1802240)/4206007 give the same weighted boundary score 1804599/4206007 at all three
    nonstationary boundary crossings. Their unweighted densities are respectively 98305/65536, 769/512
    and 65665/65536, so no single unweighted-density threshold has all three as boundary points. This
    challenges an unqualified global identity, not the trivial fact that two rules can accept the same
    finite inlier set. The cited Vert-Vert results concern asymptotic density-level estimation under distribution,
    regularization and bandwidth conditions; they do not supply that finite global identity.
  evidence:
  - source_id: englhardt2022
    locator: Section 4.1 Characteristic 1 and following equivalence argument, PDF p9 / printed p1357;
      curator calculation in research/discovery/rapid-svdd-boundaries.py
    relation: supports
  - source_id: vert2006
    locator: Section 2 assumptions, Theorems 3,8,9 and Section 8.1, PDF pp3,5,7-8,33 / printed pp819,821,823-824,849
    relation: supports
- claim_id: printed-pseudocode-discrepancy
  kind: limitation
  statement: Printed Algorithm 2 subtracts r from the density sum but computes the minimum over the old
    S before deleting r. This differs from the candidate-set rule in the prose and inspected Julia code.
    For the specified Gaussian kernel 2^(-(x-y)^2), with retained inliers 0,1,2, removing the middle point
    leaves densities (17/16,1,17/16). The old-set minimum 1 accepts the removal, whereas the candidate-set
    minimum 17/16 rejects it because the removed middle observation is still an original inlier. The literal
    printed flow can continue to one point for this nonidentical dataset. This is exact pseudocode arithmetic
    after retaining all three inliers, not an execution of the public code or its percentage-prefilter
    convention.
  evidence:
  - source_id: englhardt2022
    locator: Section 4.3, Algorithm 2 lines 4-9, PDF p13 / printed p1361; single-point interpretation
      PDF p14 / printed p1362; curator calculation in research/discovery/rapid-svdd-boundaries.py
    relation: supports
  - source_id: rapid-code
    locator: src/sampler/RAPID.jl, sample_mask[idx]=false before minimum
    relation: supports
- claim_id: versioned-code-conventions
  kind: limitation
  statement: At the inspected public commit, RAPID removes r from the candidate mask before the minimum
    test and reconstructs the final mask from accepted removals, undoing a failed candidate. For m initial
    inliers, its loop starts at i=1 and continues while i<m-2, permitting at most m-3 accepted removals
    when m>=3; smaller sets are unchanged. The percentage threshold clamps floor(p_out*N) to the one-based
    index range and averages adjacent sorted densities. With a unique minimum it can exclude one observation
    at p_out=0; equal-density ties can retain all observations. The source also offers a ground-truth
    mask and a mode deriving p_out from supplied labels, so all package configurations are not unsupervised.
    These are source-code observations, not verified historical experimental behavior.
  evidence:
  - source_id: rapid-code
    locator: src/sampler/RAPID.jl complete sample function; src/pwc.jl OutlierPercentageThresholdStrategy,
      GroundTruthThresholdStrategy and split_masks; curator exact threshold illustration
    relation: supports
- claim_id: kernel-and-experiment-version
  kind: limitation
  statement: The paper calls exp(-gamma*||x-y||) Gaussian in its displayed formula, omitting the squared
    norm. The inspected sampling code delegates to MLKernels.GaussianKernel; the evaluation-pinned MLKernels
    v0.4.0 implements exp(-gamma*||x-y||^2). These formulas must not be silently conflated. Although the
    MLKernels tree matches the evaluation manifest, its OneClassSampling entry points to an author-local
    development directory without a revision or tree hash. The inspected public sampling commit therefore
    cannot be identified as the exact experimental version from that manifest.
  evidence:
  - source_id: englhardt2022
    locator: Section 2 displayed kernel following Equation 1, PDF p3 / printed p1351
    relation: supports
  - source_id: rapid-code
    locator: src/density_util.jl, get_gaussian_kernel and KDECache
    relation: supports
  - source_id: mlkernels
    locator: squaredexponential.jl GaussianKernel alias, basefunction and kappa; src/basefunctions/squaredeuclidean.jl
    relation: supports
  - source_id: evaluation-manifest
    locator: Manifest.toml, MLKernels lines516-520 and OneClassSampling lines629-633
    relation: supports
- claim_id: cost-and-evaluation-boundaries
  kind: limitation
  statement: The source gives O(N^2) sampling work under unit-cost kernel evaluation, and its optional
    Gram matrix and inspected KDE cache use quadratic storage. Input dimension, parameter selection and
    the downstream SVDD fit add costs. The experiments compare selected synthetic mixtures and real outlier
    datasets with specified bandwidth heuristics and prefiltering; the main setup supplies the true outlier
    percentage. Some costly competitors are excluded and the full-data baseline is limited to smaller
    datasets. These results do not establish universal speed, accuracy, compression or preserved generalization.
    The method still requires a kernel and an outlier-setting convention; no numerical performance advantage
    is curated.
  evidence:
  - source_id: englhardt2022
    locator: Section 4.3 cost, PDF p14 / printed p1362; Sections 5 and Appendix A, PDF pp14-24 / printed
      pp1362-1372; Figures 4-14 and Tables 2-3
    relation: supports
  - source_id: rapid-code
    locator: src/density_util.jl, KDECache full kernel matrix
    relation: supports
