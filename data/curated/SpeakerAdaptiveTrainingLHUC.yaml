limitations:
- This identity covers the SAT-LHUC training extension. Test-only LHUC, speaker-dependent pooling-parameter
  adaptation and generic speaker-adaptive training are distinct scopes.
- Gamma controls discrete routing to the shared or current-speaker transform. The expected training loss
  is a mixture of those two path losses, not generally the loss of an interpolated transform.
- The source compares particular routing granularities and acoustic configurations. It provides no universal
  robustness, convergence or representation-capacity guarantee.
- Complete fourteen-page primary v2 inspected. Constructed mathematical checks only; no author software,
  speech data, training or empirical replication.
