id: AIMech:SpeakerAdaptiveTrainingLHUC
name: Speaker-Adaptive Training LHUC
aliases:
- SAT-LHUC
concept_kind: algorithm
definition: An acoustic-model training procedure that jointly learns shared network parameters, training-speaker
  hidden-unit contribution transforms and a speaker-independent transform by routing each training example
  through either its own speaker transform or the shared transform.
identity_notes: Compared all 442 pinned AIO and 628 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 67, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 37 AIO and 88 native definitions, with every matched definition
  read. 6 full annotated AIO node/edge/generated contexts and 4 full native records were inspected. Retain
  the joint SAT-LHUC training procedure. It learns the base representation and distinct SI/training-speaker
  transforms, whereas test-only LHUC fits new amplitudes with a frozen base. Routing uses the current
  speaker or SI transform, not a generic dropout mask or unrelated speaker. Pooling-parameter adaptation
  and low-rank weight adaptation have distinct mechanisms.
definition_evidence:
- source_id: swietojanski2016lhuc
  locator: Section IV, PDF pp.3–5, Figures3–4 and Equations4–9
  relation: supports
claims:
- claim_id: shared-base-and-transforms
  kind: mechanism
  statement: The model contains shared affine network parameters and a set of LHUC amplitude parameters
    for each training speaker or adaptation cluster, plus an additional speaker-independent set. Joint
    training uses labeled acoustic observations and a tied-state negative log posterior objective. The
    learned shared representation is intended to provide a better starting point for later LHUC adaptation;
    it is not held fixed during this training phase.
  evidence:
  - source_id: swietojanski2016lhuc
    locator: Section IV, PDF pp.3–4, Equation4 and Figure4; Section V, p.5
    relation: supports
- claim_id: si-sd-routing
  kind: mechanism
  statement: For a training observation from speaker s, sample a Bernoulli variable with probability gamma.
    Its value selects the speaker-independent transform when one and that observation’s own speaker transform
    when zero. Thus gamma is the probability of speaker-independent routing. The method compares sampling
    at frame, utterance and speaker granularity; it does not select an arbitrary different speaker transform,
    erase hidden units as dropout does, or interpolate both transform outputs on every example.
  evidence:
  - source_id: swietojanski2016lhuc
    locator: Section IV, PDF p.4, Equations5–6; Section VI-B, p.6, TableIII
    relation: supports
- claim_id: routed-gradient-scope
  kind: mechanism
  statement: Backpropagation through a selected multiplier scales the lower-layer derivative by xi(r),
    and the amplitude derivative by xi_prime(r) times the unscaled hidden activation. A transform’s minibatch
    gradient accumulates only examples routed to that transform; an unselected transform receives zero
    data-loss gradient for that minibatch. Shared network parameters receive derivatives from the selected
    computation paths. This statement describes the paper’s objective, not every possible optimizer or
    regularizer.
  evidence:
  - source_id: swietojanski2016lhuc
    locator: Section IV, PDF pp.4–5, Equations7–9; direct routing calculation
    relation: supports
- claim_id: test-time-adaptation
  kind: scope
  statement: For a new test speaker, estimate a fresh LHUC transform from first-pass decoded targets while
    keeping the trained shared network fixed, as in ordinary LHUC adaptation. The speaker-independent
    transform supplies a usable unadapted model for decoding. Joint supervised SAT training and later
    unsupervised target-speaker adaptation are distinct stages. A test speaker does not automatically
    reuse an unrelated training speaker’s transform.
  evidence:
  - source_id: swietojanski2016lhuc
    locator: Section IV, PDF pp.4–5; Section V, p.5
    relation: supports
- claim_id: empirical-capacity-boundaries
  kind: limitation
  statement: The paper evaluates SAT-LHUC in configured acoustic systems and compares routing granularity
    and gamma choices using TED data before broader corpus evaluation. Its illustrative basis examples
    and word-error results do not establish arbitrary target-function capacity, improvement for every
    speaker, or a universally optimal routing probability. Dataset adaptation clusters may denote headsets
    or conversation sides rather than one physical speaker each.
  evidence:
  - source_id: swietojanski2016lhuc
    locator: Sections IV–VI, PDF pp.3–9, Figures2–5, TablesI andIII–X; Section VII, p.11
    relation: supports
