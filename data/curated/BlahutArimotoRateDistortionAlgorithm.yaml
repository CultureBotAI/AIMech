      for this iterative constrained optimization procedure.
claims:
- claim_id: gibbs-channel-and-marginal
  kind: mechanism
  statement: For finite source/reproduction alphabets, fixed source p(x), finite nonnegative distortion
    rho(x,y), multiplier beta>=0 and positive initial reproduction marginal q(y), set W(y|x)=q(y)exp(-beta*rho(x,y))/sum_z
    q(z)exp(-beta*rho(x,z)). Then set q_new(y)=sum_x p(x)W(y|x) and repeat. These are exact coordinate
    minima of F(W,q)=sum_x,y p(x)W(y|x)log(W(y|x)/q(y))+beta*E[rho]. At q=pW, F equals I(X;Y)+beta*E[rho].
    Unused zero-probability source rows can be omitted.
  evidence:
  - source_id: projection-source
    locator: Section5C, pp233-234 / PDF29-30; explicit normalized row minimum of the displayed double-minimum
      objective
    relation: supports
- claim_id: fixed-multiplier-convergence
  kind: scope
  statement: For the stated finite-alphabet, finite-distortion and positive-initial-marginal setting,
    the alternating procedure converges to a channel attaining the fixed-multiplier minimum. This solves
    one supporting-slope problem; choosing beta to attain a requested distortion or tracing the whole
    rate-distortion curve is a separate operation. An optimizer need not be unique, and different beta
    values or initializations can give different optimal channels in degenerate cases.
  evidence:
  - source_id: projection-source
    locator: Section5C, Eq5.9 and convergence discussion, pp233-234 / PDF29-30
    relation: supports
- claim_id: support-and-objective-direction
  kind: limitation
  statement: A zero reproduction probability is multiplicatively preserved and can exclude the best channel.
    In the saved symmetric binary Hamming example at beta=log(3), an interior start reaches distortion1/4
    and objective log(3/2), while marginal(1,0) remains fixed with larger objective log(3)/2. The adjacent
    source section’s positive log(reverse/input) expression belongs to capacity maximization; using it
    as a minimization objective reverses that problem. The rate-distortion objective above has its own
    minimizing sign.
  evidence:
  - source_id: projection-source
    locator: Sections5B-5C, pp231-234 / PDF27-30; curator binary channel and support calculations
    relation: supports
- claim_id: historical-proof-scope
  kind: limitation
  statement: Csiszar’s1974 correspondence identifies a gap in the original Blahut convergence argument
    and supplies a finite-reproduction-alphabet convergence result, with weaker and conditional conclusions
    for countable alphabets. The record does not transfer finite-alphabet convergence unconditionally
    to arbitrary continuous alphabets or rely on the original proof gap as evidence that the finite algorithm
    fails.
  evidence:
  - source_id: rate-correction
    locator: Introduction, p122; SectionIII Theorems1-2 and SectionIV, pp123-124; author-uploaded article
      text
    relation: supports
limitations:
- The exact source law, distortion and multiplier are inputs. Estimating an unknown source, approximating
  continuous domains and choosing a decision-making target add separate errors and modeling assumptions.
- Direct access to the1974PDF returned403. Its article text was read, while the core1984method and formulas
  were visually inspected. No original1972Blahut/ArimotoPDF or historical implementation is claimed read.
- Finite curator calculations check selected support, normalization and convergence boundaries. They are
  not author software, historical experiments or a proof of every source theorem.
