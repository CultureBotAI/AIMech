claims:
- claim_id: restricted-e-and-parameter-m
  kind: mechanism
  statement: Choose a normalized tractable family q_lambda(z) on latent states compatible with observed
    x and a model p_theta(x,z). At fixed theta optimize F(lambda,theta)=E_q[log p_theta(x,z)-log q_lambda(z)],
    equivalently minimize KL(q_lambda||p_theta(z|x)). Then, holding q fixed, maximize its expected complete-data
    log likelihood over theta and repeat. Exact coordinate optima give the source’s restricted projection
    formulation; checked partial ascent steps give a generalized realization. The latent family, model
    support and finite expectations must be specified.
  evidence:
  - source_id: gam-source
    locator: Sections2.1-2.3, pp2052-2056 / PDF4-8; Section5, pp2065-2067 / PDF17-19
    relation: supports
- claim_id: approximation-gap
  kind: scope
  statement: The lower bound equals log p_theta(x)-KL(q_lambda||p_theta(z|x)). Bound ascent therefore
    does not generally imply observed-likelihood ascent or exact posterior recovery. At a differentiable
    interior fixed pair with a stationary parameter M-step, the observed log-likelihood gradient equals
    the theta gradient of that KL gap with q fixed. A zero gap is sufficient for the usual touching-bound
    argument, but zero gradient of the gap can also occur when the gap is positive; stationary error is
    not necessarily a local error minimum.
  evidence:
  - source_id: gam-source
    locator: Section3 decomposition, p2060 / PDF12; Section5 stationary-error discussion, pp2065-2067
      / PDF17-19
    relation: supports
- claim_id: inexact-posterior-can-be-stationary
  kind: limitation
  statement: The source’s broad claim that an independence approximation permits likelihood stationarity
    only in an exact-family degenerate case is not adopted as a general impossibility theorem. In the
    saved normalized counterexample, p_theta(y,z)=Bernoulli_theta(y)*r(z), fixed correlated r has probabilities(0.3,0.2,0.2,0.3),
    and the unique best product approximation is uniform. Its positive KL gap is independent of theta,
    so variational EM still attains the observed-data likelihood optimum. This qualifies the general prose
    without refuting the conditional GAM theorem.
  evidence:
  - source_id: gam-source
    locator: Section5 broad independence-approximation argument, pp2066-2067 / PDF18-19; curator finite
      counterexample
    relation: supports
- claim_id: solver-and-theorem-boundaries
  kind: limitation
  statement: 'A mean-field fixed-point equation alone does not establish the global restricted E minimizer.
    The GAM convergence assumptions, including compactness, continuity, closed maps and sufficient strict
    progress, remain necessary for the cited conditional result. The printed fixed-q Boltzmann KL derivative
    has the opposite sign: the correct derivative is model moment minus q moment, although setting either
    sign to zero gives the same moment equation. Marginal independence of one pair does not alone imply
    a zero direct interaction when other latent paths can cancel its marginal association.'
  evidence:
  - source_id: gam-source
    locator: Section2.3 mean-field equations, pp2055-2056 / PDF7-8; Section3 Proposition5, pp2061-2062
      / PDF13-14; Section5 derivative/independence argument, pp2066-2067 / PDF18-19
    relation: supports
limitations:
- A restricted variational optimum is not automatically a stationary point of observed likelihood, a local
  maximum, a global optimum or an accurate posterior. Conversely, approximation error alone does not preclude
  likelihood stationarity.
- The broad family accommodates structured approximations; it does not equate the existing factorial-HMM
  procedure, BBVI, NVIL or topic models. No original Jordan1999 chapter or uninspected implementation
  is claimed read.
- No historical software, benchmark or source experiment was reproduced. Saved normalized finite calculations
  challenge bounded formula/prose claims, not the complete conditional convergence theorems.
