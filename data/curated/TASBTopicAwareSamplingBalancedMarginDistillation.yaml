id: AIMech:TASBTopicAwareSamplingBalancedMarginDistillation
name: TAS-Balanced Topic-Aware Sampling and Dual-Teacher Margin Distillation
concept_kind: algorithm
review_status: DRAFT
definition: A resource-efficient training and batch-sampling algorithm for single-vector dual-encoder dense retrieval (BERT_DOT) that clusters all training queries into k semantic topic clusters once before training via k-means over baseline query embeddings, constructs each training batch B of size b by drawing queries from n (typically 1) randomly chosen topic clusters so in-batch passages act as topically related hard negatives, stratifies each query's positive-negative passage pairs (p^+, p^-) across h uniform bins of static pairwise teacher margin M_t(q, p^+) - M_t(q, p^-) in [m_min + i*m, m_min + (i+1)*m) before sampling to unskew easy high-margin pairs, and optimizes the student dual-encoder under a dual-teacher Margin-MSE loss L_DS(Q, P^+, P^-) = L_Pair(Q, P^+, P^-) + alpha * L_InB(Q, P^+, P^-) combining a pairwise cross-encoder teacher (BERT_CAT) with an in-batch late-interaction teacher (ColBERT).
identity_notes: Distinct from ANCE (Xiong et al., ICLR 2021, AIMech:ANCEApproximateNearestNeighborNegativeContrastiveLearning), which requires 8 V100 GPUs to repeatedly re-encode the passage corpus and refresh an ANN index every 10k batches; distinct from RocketQA (Qu et al., NAACL 2021, AIMech:RocketQADenoisedHardNegativeSampling), which requires cross-batch negatives of size 4,000 across 8 V100 GPUs and multi-cycle training; and distinct from single-teacher pairwise Margin-MSE or Tightly-Coupled Teachers (TCT-ColBERT), which use random query batches without topic-aware query clustering or balanced margin bin stratification.
aliases:
- TAS-B
- TAS-Balanced
- Balanced Topic Aware Sampling for Dense Retrieval
- TAS-Balanced Dual-Teacher Dense Retrieval Distillation
