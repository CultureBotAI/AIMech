claims:
- claim_id: r754-claim-topic-clustering-and-balanced-margin-bins
  kind: mechanism
  statement: Before training, TAS-Balanced encodes all 400K MS MARCO training queries in one minute and partitions them into k=2,000 k-means clusters C_i in under 10 minutes; during training, each batch B of size b=32 samples queries q from n=1 random cluster C_i so all in-batch passages share the same topic, and draws (p^+, p^-) from a uniformly chosen margin bin H(P_q, i) = {(p^+, p^-) | m_min + i*m <= M_t(q, p^+) - M_t(q, p^-) < m_min + (i+1)*m} across h=10 bins to prevent easy high-margin negatives from dominating updates.
  evidence:
  - source_id: r754-primary-pdf
    locator: Section 1, Section 2.2, Section 3, & Section 4.2, Equations 10-13, Figures 1-2, Table 1, pp. 1-3, 5-6
    relation: supports
- claim_id: r754-claim-dual-teacher-margin-mse
  kind: mechanism
  statement: TAS-Balanced supervises the 6-layer DistilBERT student M_s with L_DS = L_Pair + alpha * L_InB (with alpha=0.75), where L_Pair minimizes MSE(M_s(Q, P^+) - M_s(Q, P^-), M_t(Q, P^+) - M_t(Q, P^-)) against precomputed pairwise BERT_CAT ensemble margins and L_InB minimizes Margin-MSE against a linear-complexity ColBERT teacher across all in-batch negative and positive passage pairings, outperforming KLDiv, ListNet, and LambdaRank list-based in-batch losses.
  evidence:
  - source_id: r754-primary-pdf
    locator: Section 2.3, Section 4.2, & Section 5.1, Equations 6-8, Tables 3-4, pp. 3-4, 6-7
    relation: supports
- claim_id: r754-claim-single-gpu-trec-msmarco-application
  kind: application
  statement: Trained on a single consumer-grade 11GB GPU in under 48 hours with batch size 32 (and 64ms single-query latency over 8.8M passages), TAS-Balanced achieves 0.712 nDCG@10 and 0.845 Recall@1K on TREC-DL'19, 0.693 nDCG@10 and 0.865 Recall@1K on TREC-DL'20, and 0.340 MRR@10 and 0.975 Recall@1K on MS MARCO Dev (rising to 0.347 MRR@10 and 0.978 Recall@1K at batch size 256, and 0.360 MRR@10 / 0.979 Recall@1K at 67ms when fused with docT5query), outperforming BM25 by 44% and ANCE by 5%+ on TREC-DL nDCG@10.
  evidence:
  - source_id: r754-primary-pdf
    locator: Abstract & Sections 5.1-5.3, Tables 1-2 and 4-7, Figure 3, pp. 1, 3-4, 6-9
    relation: supports
- claim_id: r754-claim-reranker-distribution-shift-limitation
  kind: limitation
  statement: When TAS-Balanced first-stage retrieval at high cutoff (Top-1,000) is piped into a high-latency mono-duo-T5 reranker trained on BM25 candidates, the shift from lexical to dense candidate distributions prevents mono-duo-T5 from translating TAS-Balanced's higher Recall@1K into higher TREC-DL nDCG@10 (achieving 0.759 vs. 0.773 for docT5query + mono-duo-T5 on TREC-DL'19).
  evidence:
  - source_id: r754-primary-pdf
    locator: Section 1 (RQ4) & Section 5.3, Table 7, pp. 2, 8-9
    relation: supports
