id: AIMech:CautiousOptimizersAlignmentMaskedMomentumOptimization
name: Cautious Optimizers (C-AdamW / C-Lion Alignment-Masked Momentum)
concept_kind: algorithm
review_status: DRAFT
definition: A general element-wise sign-alignment modification for momentum-based optimization algorithms (Algorithms 1-3) that replaces a base optimizer's negative update step w_{t+1} <- w_t - epsilon_t u_t with the masked and rescaled update w_{t+1} <- w_t - epsilon_t u_t circ phi(u_t circ g_t), where g_t = grad L(w_t), phi(x) = alpha(x) I(x > 0), and alpha(x) = dim(x) / (nnz(x > 0) + xi) (with default xi = 1), zeroing out parameter coordinates where the proposed momentum direction u_t and current gradient g_t have opposite signs.
identity_notes: Distinct from standard AdamW, Lion (Round 588), and Lookahead by applying an element-wise Update-gradient sign-consistency mask I(u_t circ g_t > 0) with active-coordinate magnitude compensation d / (||phi_t||_0 + 1) prior to decoupled weight decay, simultaneously decreasing both the base optimizer's Hamiltonian H(w, s) and the objective loss L(w) without altering base hyperparameters.
aliases:
- Cautious Optimizer
- C-AdamW and C-Lion
- Alignment-Masked Momentum Optimization
