aio_mappings:
- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: Shared gated state evolution across computational time defines a specific recurrent neural
    architecture; an observed temporal input stream is not required.
- target: AIO:GatedRecurrentUnit
  relation: related_match
  rationale: Convolutional GRU updates are components of the complete grid architecture; this does not
    equate the architecture to a single generic GRU or adopt the target’s LSTM parentage.
- target: AIO:ConvolutionalLayer
  relation: related_match
  rationale: Learned local convolutional kernel banks implement candidate and gate computations; a component
    layer is not the whole recurrent architecture.
limitations:
- The named Neural GPU is an architecture, not GPU hardware, a particular trained checkpoint, a Neural
  Turing Machine or a guarantee of algorithmic correctness.
- Full nine-page original arXiv1511.08228v3 and eleven-page follow-up arXiv1611.00736v2 PDFs were read.
  Different source configurations and access versions remain explicit.
- Author implementations, other versions and model training were not inspected or run. Chosen calculations
  establish algebraic distinctions only, not empirical replication.
- Later curriculum successes qualify the original decimal-multiplication failure; structured-input counterexamples
  qualify generalization language. DRAFT remains.
