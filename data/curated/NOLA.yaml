id: AIMech:NOLA
name: NOLA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient fine-tuning and model-compression method that overcomes the rank-one parameter lower bound of Low-Rank Adaptation (LoRA) by reparameterizing the rank-r factor matrices A in R^{m x r} and B in R^{r x n} as linear combinations of frozen pseudo-randomly generated basis matrices A = sum_{i=1}^k alpha_i A_i and B = sum_{j=1}^l beta_j B_j, optimizing and storing only the scalar PRNG seed and the (k + l) mixture coefficients (alpha, beta) to decouple trainable parameter count from both matrix dimensions (m, n) and rank r.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, whose parameter count r(m + n) is lower-bounded by m + n at rank r = 1 and tied to layer dimensions), from VeRA (AIMech:VeraVectorBasedRandomMatrixAdaptation, which scales a single random matrix pair via diagonal vectors d in R^m and b in R^r whose parameter count still depends on layer dimension m and rank r), and from PRANC (which forms a direct linear combination of full m x n random matrices requiring O(k d^2) compute and spanning only a k-dimensional linear subspace rather than NOLA's O(k d r) compute and bilinear cross-basis subspace). Formulated by Koohpayegani, Navaneet, Nooralinejad, Kolouri, and Pirsiavash (ICLR 2024, arXiv:2310.02556).
aliases:
- NOLA (Compressing LoRA Using Linear Combination of Random Basis)
- Random-Basis Bilinear Low-Rank Adaptation
- Sub-Rank-One Random Basis LoRA Reparameterization
