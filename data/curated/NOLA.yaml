claims:
- claim_id: nola-bilinear-random-basis-reparameterization-mechanism
  kind: mechanism
  statement: NOLA generates frozen random basis matrices {A_i in R^{m x r}}_{i=1}^k and {B_j in R^{r x n}}_{j=1}^l from a single scalar PRNG seed and parameterizes the weight update as Delta W = (sum_{i=1}^k alpha_i A_i) x (sum_{j=1}^l beta_j B_j), requiring only k + l trainable scalar coefficients independent of m, n, and r and achieving compression ratios strictly above LoRA's rank-one limit m n / (m + n).
  evidence:
  - source_id: r688-primary-pdf
    locator: 'Section 2 Proposed Method: NOLA, Eq. 1-2, p. 3'
    relation: supports
- claim_id: nola-compute-speedup-and-subspace-coverage-over-pranc
  kind: mechanism
  statement: Compared to full-matrix random basis combination (PRANC) on a d x d weight matrix with k total coefficients, NOLA reduces per-iteration training complexity from O(k d^2) to O(k d r) (a speedup factor of d / r, or 4.6x wall-clock speedup on ResNet18), while its bilinear A x B factorization spans a much higher-dimensional subspace of R^{d^2} than PRANC's k-dimensional linear subspace.
  evidence:
  - source_id: r688-primary-pdf
    locator: Section 2 Efficiency of NOLA compared to PRANC, p. 4 & Appendix A.1-A.2 Figure 2 and Tables 8-9, p. 15-16
    relation: supports
- claim_id: nola-quantized-coefficients-and-llm-vit-adaptation-application
  kind: application
  statement: NOLA supports post-training and STE quantization-aware training of the scalar coefficients (alpha, beta) down to 3-4 bits while keeping the random basis matrices A_i, B_j in FP16, and fine-tunes GPT-2 on E2E/DART/WebNLG, 8-bit LLaMA-2-70B on Alpaca/MMLU with 95% fewer parameters than rank-1 LoRA (0.57M vs 12.94M), and ViT-B/ViT-L on few-shot image classification with 1/3 the parameters of rank-4 LoRA.
  evidence:
  - source_id: r688-primary-pdf
    locator: Section 2-3.4, Tables 1-7, p. 3-8
    relation: supports
- claim_id: nola-basis-multiplication-training-overhead-limitation
  kind: limitation
  statement: During training, NOLA incurs extra matrix-multiplication overhead to contract the coefficient vectors (alpha, beta) with the basis tensors {A_i} and {B_j} at each forward and backward pass (unless the random basis is shared across layers), whereas at inference time A x B is merged offline into W with zero latency overhead.
  evidence:
  - source_id: r688-primary-pdf
    locator: Section 3.1 Training Time and Memory of NOLA & Table 2, p. 5-6
    relation: supports
