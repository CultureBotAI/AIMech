id: AIMech:PFedHnPersonalizedFederatedHypernetworks
name: pFedHN (Personalized Federated Hypernetworks)
concept_kind: algorithm
review_status: DRAFT
definition: A personalized federated learning method (Shamsian, Navon, Fetaya, & Chechik 2021, Section 3, Algorithm 1, Equations 2-4) in which a central server maintains a shared hypernetwork h(v_i; varphi) and low-dimensional client embedding vectors v_i in R^{d_e}, generates personalized target network weights theta_i = h(v_i; varphi) for sampled client i, receives the client's multi-step local displacement Delta theta_i = tilde_theta_i - theta_i, and updates both the hypernetwork parameters varphi and client embedding v_i on the server via the chain-rule surrogate gradient (nabla_varphi theta_i)^T Delta theta_i and (nabla_{v_i} theta_i)^T Delta theta_i.
identity_notes: Distinct from Per-FedAvg (AIMech:PerFedAvgPersonalizedFederatedLearningWithTheoreticalGuarantees, Fallah et al. 2020) and pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes, T. Dinh et al. 2020), which transmit and regularize a single shared d-dimensional model init across all clients rather than generating client-conditioned parameters theta_i = h(v_i; varphi) from a low-dimensional client descriptor v_i on the server.
aliases:
- pFedHN
- Personalized Federated Hypernetworks
- pFedHN-PC
