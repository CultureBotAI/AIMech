id: AIMech:PriorExpansionScoreConflictDiagnostic
name: Prior-expansion score conflict diagnostic
aliases: []
concept_kind: algorithm
definition: A Bayesian prior-data conflict diagnostic that embeds a baseline prior density g(theta) into
  a smoothly parameterized expansion family g(theta|gamma) with g(theta|gamma_0)=g(theta), evaluates the
  marginal-likelihood score S(y)=d/d_gamma log p(y|gamma)|_{gamma=gamma_0} via Fisher's identity as the
  baseline posterior expectation of the log-prior derivative when parameter support is fixed, and calibrates
  the score discrepancy against prior-predictive or hierarchical mixed-predictive reference distributions.
identity_notes: 'No normalized identity match for the prior-expansion score conflict diagnostic across
  all 442 pinned AIO records and 561 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches including ignored and hidden files across the worktree and repository checkouts returned 0
  matches for 1902.10393, 20-BA1204, PriorExpansionScoreConflictDiagnostic and Fisher''s identity, and
  5 lines for prior expansion (4 locator lines for Gaussian-prior algebraic expansion in GaussianLossSmoothedMixedModelVariationalInference
  and 1 pending frontier entry for Nott et al. 2020/2021 in 20261013T013528Z-inla-group-node-conflict.json).
  Assessed 61 semantic AIO rows and 215 native names/definitions, verifying all 61 AIO rows and 214 prior
  native rows plus reading the INLA group-node conflict diagnostic record. Ten full AIO nodes with incident
  edges and generated records and nine native conflict-diagnostic and variational context records were
  verified. This procedure is defined by embedding an elicited prior into a smooth family g(theta|gamma),
  evaluating S(y)=d/d_gamma log p(y|gamma)|_{gamma=gamma_0} via Fisher''s identity at the baseline posterior,
  and calibrating against prior or mixed predictive draws. It is distinct from unit-level cross-validated
  prior-likelihood splitting, DAG separator node-splitting, INLA group-node conflict checking, multiple-testing
  node-conflict maxT calibration, Gaussian variational message conflict screening, and sequential two-stage
  single-draw randomized score checks.'
