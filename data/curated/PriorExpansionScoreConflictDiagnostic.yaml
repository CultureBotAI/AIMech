aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The diagnostic evaluates prior-data conflict in Bayesian models and decomposes multi-stage
    hierarchical priors g(theta_1)*g(theta_2|theta_1) along directed Bayesian graphical structures. BayesianNetwork
    provides model-representation context rather than the prior-expansion score statistic or Fisher-identity
    predictive calibration; this is a related mapping, not equivalence or subclass membership.
- target: AIO:RandomEffectsModel
  relation: related_match
  rationale: Hierarchical random-effects models are a primary setting for the two-stage mixed-predictive
    and marginal prior-predictive score checks, but RandomEffectsModel denotes a model class rather than
    the score-based conflict diagnostic procedure.
limitations:
- Fisher's identity in Equation 1.3 requires fixed prior support with respect to the expansion parameter
  gamma so differentiation and integration commute; gamma-dependent support boundaries require reparameterization
  onto a fixed domain before differentiating (nott2020, Section 5.2, PDF pp. 25, 27).
- Exact prior-predictive or mixed-predictive calibration of S(Y) requires evaluating the posterior expectation
  of d/d_gamma log g(theta|gamma)|_{gamma=gamma_0} across many simulated replicate datasets Y when no
  closed-form sufficient-statistic reduction exists. Plug-in point-estimate substitutions (such as sample
  means or least-squares/Moore–Penrose estimates in Section 5.1) and variational approximations alter
  the statistic and are not identical to full-posterior score calibration.
- The score S(y) measures local first-order sensitivity along a scalar expansion direction g(theta|gamma)
  at gamma=gamma_0; different expansion directions probe different aspects of prior specification (for
  example, location shift versus tail heaviness or variance inflation), and when multiple expansion parameters
  are introduced they are varied one by one rather than pooled into a joint multi-parameter test statistic
  (nott2020, Section 1, PDF pp. 2–3; Section 5.2, PDF pp. 19–21).
- In the source manuscript, Section 3 (PDF p. 9, line 24) writes "a p-value for the check of g(theta_2)"
  when defining p_{S2} for the upper-level prior g(theta_1), and Section 5.1 Example 5.1 (PDF p. 14)
  prints the summation upper limit in the kurtosis denominator as x instead of n. The curated claims follow
  the mathematical definitions of the upper-level expansion g(theta_1|gamma^(2)) and the n-group sample
  kurtosis.
- All 31 pages of Nott et al. (2020, arXiv:1902.10393v2) and 52 pages of Yang, Nott, & Presanis (2026,
  arXiv:2511.02977v2) were read. No author MCMC code, bowhead whale simulation or quantum state tomography
  dataset was executed; constructed numerical examples in research/discovery/prior-expansion-score-conflict-boundaries.py
  verify Fisher's identity across non-unit prior and observation variances, fixed-posterior and varying-posterior
  KL divergence derivatives together with moving-posterior finite-alpha Renyi escort covariance derivatives,
  conjugate normal equivalence, coordinate-wise one-at-a-time directional checks, hierarchical mixed-predictive
  score calibration, and support-dependent failure without reparameterization.
