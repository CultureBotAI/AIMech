claims:
- claim_id: prior-expansion-and-fisher-identity
  kind: mechanism
  statement: Embed the elicited baseline prior density g(theta) into a smoothly parameterized family of
    proper priors g(theta|gamma) satisfying g(theta|gamma_0)=g(theta), and define the marginal likelihood
    p(y|gamma)=integral g(theta|gamma)*p(y|theta) d_theta. The local conflict statistic is the scalar
    or gradient score S(y)=d/d_gamma log p(y|gamma)|_{gamma=gamma_0}. Whenever differentiation with respect
    to gamma and integration over theta can be interchanged on a gamma-invariant support, Fisher's identity
    yields S(y)=integral (d/d_gamma log g(theta|gamma)|_{gamma=gamma_0})*g(theta|y) d_theta, which is
    a posterior expectation under the baseline model gamma=gamma_0 and depends on y only through any minimal
    sufficient statistic, invariant to its choice.
  evidence:
  - source_id: nott2020
    locator: Section 1, Equations 1.1–1.3, PDF pp. 2–3; Section 2.1, PDF pp. 4–5
    relation: supports
  - source_id: yang2026
    locator: Section 2.1, Equation 1, PDF pp. 4–5
    relation: supports
- claim_id: divergence-and-relative-belief-sensitivity
  kind: mechanism
  statement: Let RB(theta|y,gamma)=g(theta|y,gamma)/g(theta|gamma)=p(y|theta)/p(y|gamma) denote the relative
    belief ratio. Because p(y|theta) does not depend on gamma, differentiating log RB(theta|y,gamma) with
    respect to gamma at gamma=gamma_0 gives d/d_gamma log RB(theta|y,gamma)|_{gamma=gamma_0}=-d/d_gamma
    log p(y|gamma)|_{gamma=gamma_0}=-S(y) for every theta with p(y|theta)>0 (Equation 2.2). Consequently,
    for the baseline-posterior-weighted Renyi functional (alpha-1)^-1*log integral RB(theta|y,gamma)^(alpha-1)*g(theta|y)
    d_theta in Equation 2.3 (and its alpha->1 limit integral log RB(theta|y,gamma)*g(theta|y) d_theta,
    as well as the fixed-posterior Kullback–Leibler divergence KL(g(theta|y)||g(theta|gamma))), the derivative
    with respect to gamma at gamma=gamma_0 equals -S(y) for all alpha>0 (Equation 2.4). By contrast, if
    the posterior weighting distribution g(theta|y,gamma) inside R_alpha(g(theta|y,gamma)||g(theta|gamma))
    is also varied with gamma, differentiating adds a posterior covariance term between log p(y|theta)
    and d/d_gamma log g(theta|gamma)|_{gamma=gamma_0}.
  evidence:
  - source_id: nott2020
    locator: Section 2.2, Equations 2.1–2.4, PDF pp. 5–6
    relation: supports
- claim_id: prior-predictive-and-multivariate-calibration
  kind: mechanism
  statement: For a one-dimensional expansion parameter gamma where conflict corresponds to larger values
    of gamma>gamma_0 (such as inflating a prior variance parameter), calibrate the observed score S(y_obs)
    by the upper prior-predictive tail probability p_S=P(S(Y)>=S(y_obs)) under Y~p(y)=p(y|gamma_0), or
    use the lower tail or a two-sided tail when departures in either direction of gamma are relevant.
    For a multi-dimensional expansion vector gamma in R^d with score vector S(y)=grad_gamma log p(y|gamma)|_{gamma=gamma_0},
    form the quadratic discrepancy D(y)=S(y)^T*V_S^-1*S(y), where V_S=Cov(S(Y)) is the invertible prior-predictive
    covariance matrix under Y~p(y), and calibrate D(y_obs) by P(D(Y)>=D(y_obs)).
  evidence:
  - source_id: nott2020
    locator: Section 1, Equation 1.2, PDF p. 3; Section 2.1, PDF p. 5; Section 2.3, Equation 2.5, PDF
      p. 7
    relation: supports
- claim_id: conjugate-exponential-family-equivalence
  kind: mechanism
  statement: In conjugate exponential-family settings where g(theta|gamma) perturbs natural hyperparameters,
    S(y) reduces to differences between posterior expectations of natural sufficient statistics and their
    prior expectations. In the normal location model with X_1,...,X_n~N(theta,sigma^2) (known sigma^2),
    sufficiency reduction bar_x~N(theta,sigma^2/n), and variance-expanded prior theta|gamma~N(mu_0,gamma*tau_0^2)
    at baseline gamma_0=1, the score is S(bar_x)=-1/(2*tau_0^2)+((bar_x-mu_0)^2/(2*tau_0^2))*(tau_0^2/(tau_0^2+sigma^2/n))^2+(sigma^2/(2*n*tau_0^2))/(tau_0^2+sigma^2/n),
    which is a strictly increasing function of (bar_x-mu_0)^2. Consequently, the upper-tail score p-value
    P(S(Y)>=S(bar_x_obs)) under Y~N(mu_0,tau_0^2+sigma^2/n) equals the exact Evans–Moshonov prior-predictive
    density tail P((Y-mu_0)^2>=(bar_x_obs-mu_0)^2).
  evidence:
  - source_id: nott2020
    locator: Section 2.3, Equation 2.6, PDF pp. 7–8; Section 4.1, Example 4.1, PDF pp. 9–10
    relation: supports
- claim_id: hierarchical-mixed-predictive-extension
  kind: mechanism
  statement: For a two-stage hierarchical prior g(theta_1)*g(theta_2|theta_1) expanded as g(theta_1|gamma^(2))*g(theta_2|theta_1,gamma^(1))
    around baseline (gamma_0^(1),gamma_0^(2)), define the conditional lower-level score S^(1)(y,theta_1)=integral
    (d/d_gamma^(1) log g(theta_2|theta_1,gamma^(1))|_{gamma^(1)=gamma_0^(1)})*g(theta_2|theta_1,y) d_theta_2
    and eliminate theta_1 by averaging over the observed-data posterior g(theta_1|y_obs) to obtain S^(1)(y)=E[S^(1)(y,theta_1)|y_obs]=integral
    (d/d_gamma^(1) log g(theta_2|theta_1,gamma^(1))|_{gamma^(1)=gamma_0^(1)})*g(theta|y) d_theta. Calibrate
    S^(1)(y_obs) via p_{S1}=P(S^(1)(Y)>=S^(1)(y_obs)) under the mixed-predictive distribution Y~m(y)=integral
    g(theta_2|theta_1)*g(theta_1|y_obs)*p(y|theta) d_theta, and calibrate the upper-level score S^(2)(y)=d/d_gamma^(2)
    log p(y|gamma^(2))|_{gamma^(2)=gamma_0^(2)}=integral (d/d_gamma^(2) log g(theta_1|gamma^(2))|_{gamma^(2)=gamma_0^(2)})*g(theta_1|y)
    d_theta_1 via p_{S2}=P(S^(2)(Y)>=S^(2)(y_obs)) under the marginal prior-predictive law Y~p(y).
  evidence:
  - source_id: nott2020
    locator: Section 3, PDF pp. 8–9; Section 4.3, Example 4.3, PDF pp. 11–13
    relation: supports
- claim_id: support-dependent-expansion-boundary
  kind: limitation
  statement: Fisher's identity in Equation 1.3 requires the support of g(theta|gamma) to be independent
    of gamma so that differentiation with respect to gamma can be moved inside the integral over theta.
    When the prior support varies with gamma—as in the symmetrically distorted trine quantum state estimation
    experiment where the Bloch-disk constraint depends on the distortion parameter gamma—Equation 1.3
    is invalid directly; evaluating S(y)=d/d_gamma log p(y|gamma)|_{gamma=gamma_0} requires first reparameterizing
    the prior and likelihood onto a fixed domain (such as polar coordinates on [0,1]x[0,2*pi]) so that
    gamma enters the transformed integrand smoothly.
  evidence:
  - source_id: nott2020
    locator: Section 5.2, Equations 5.6–5.8 and polar reparameterization, PDF pp. 24–27
    relation: supports
- claim_id: reference-simulation-and-approximation-scope
  kind: limitation
  statement: Although Fisher's identity avoids refitting models at gamma!=gamma_0 for the observed dataset
    y_obs, computing the prior-predictive or mixed-predictive reference distribution of S(Y) when no closed-form
    sufficient-statistic reduction exists requires re-estimating the baseline posterior g(theta|Y) for
    each simulated replicate dataset Y. To reduce this cost in non-conjugate models, the source substitutes
    plug-in point estimates (such as group sample means or least-squares/Moore–Penrose estimates in the
    LASSO shrinkage check) or suggests variational approximations, which define distinct approximate diagnostics
    whose tail probabilities are not guaranteed to match exact full-posterior score calibration.
  evidence:
  - source_id: nott2020
    locator: Section 5.1, Equations 5.2–5.5, PDF pp. 14–16; Section 6 Discussion, PDF p. 28
    relation: supports
  - source_id: yang2026
    locator: Section 2.1, Equation 1 and computational cost discussion, PDF pp. 4–5
    relation: supports
