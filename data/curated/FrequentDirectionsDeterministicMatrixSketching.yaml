id: AIMech:FrequentDirectionsDeterministicMatrixSketching
name: Frequent Directions Deterministic Row-Update Matrix Sketching via Singular-Value Shrinkage
concept_kind: algorithm
review_status: DRAFT
definition: Frequent Directions (FrequentDirections and Fast-FrequentDirections) is a deterministic row-update streaming matrix sketching algorithm introduced by Liberty (2013) and analyzed with tight relative-error and space-optimality bounds by Ghashami, Liberty, Phillips, and Woodruff (2015, 2016). Given an input matrix A in R^{n x d} streamed one row a_i at a time, the algorithm maintains a sketch B in R^{ell x d} (or R^{2*ell x d} in Fast-FrequentDirections) by inserting incoming rows into zero-valued rows of B, computing the SVD [U, Sigma, V] = svd(B) once B has no zero rows, setting delta_i = sigma_ell^2, and shrinking all squared singular values via B <- sqrt(max(Sigma^2 - delta_i I, 0)) * V^T so that at least the last row of B (or last ell + 1 rows in Fast-FrequentDirections) is zeroed out while reducing ||B||_F^2 at least ell times faster than any single unit direction.
identity_notes: Distinct from AIMech:FrequentDirectionsDeterministicStreamingMatrixSketching (Round 330, Liberty KDD 2013), which established only the flat-spectrum Frobenius covariance error bound ||A^T A - B^T B||_2 <= 2||A||_F^2/ell without rank-k tail residuals or relative-error projection bounds; this record captures Ghashami, Liberty, Phillips, and Woodruff's (2015, 2016) tail-residual relative-error covariance and rank-k projection analysis (||A^T A - B^T B||_2 <= ||A - A_k||_F^2/(ell - k), ||A - pi_B^k(A)||_F^2 <= (ell/(ell - k))||A - A_k||_F^2) and matching Grassmannian/Index space-optimality lower bounds. Also distinct from AIMech:NoisyPowerMethodForStreamingAndDifferentiallyPrivatePCA (Round 356) and AIMech:StreamingPCANearOptimalFiniteSampleOjaAlgorithm (Round 357), which are randomized iterative subspace estimators rather than deterministic Misra-Gries-style singular-value shrinkage sketches.
aliases:
- Tail-Residual Frequent Directions Sketching
- Fast-FrequentDirections
- Space-Optimal FrequentDirections Rank-k Projection Sketch
