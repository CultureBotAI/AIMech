  relation: related_match
  rationale: This procedure performs Bayesian approximate inference for clustered generalized linear models
    with Gaussian random effects and an unknown shared random-effect covariance. The AIO class describes
    the random-effects modeling context, not the coordinate transformation, restricted variational family
    or inference schedule. This algorithm-to-model-family relation asserts neither equivalence nor an
    is-a link.
limitations:
- Partial noncentering changes a restricted variational family, not the underlying model. The model-coordinate
  map is exact, but the factorized posterior approximation remains restricted. Its induced original-effect
  covariance does not represent an arbitrary joint Gaussian, and dependence with D is still omitted.
- The optional W update is a curvature heuristic, not an exact ELBO coordinate maximization. Its inverse-Wishart
  mean exists only for nuq>r+1; with the source choice nu=r this requires more than one cluster. The empirical
  prior scale S=r*Rhat and penalized quasi-likelihood initialization require nonsingular information;
  near-zero random-effect variance or unstable initial covariance can cause numerical problems.
- The source itself warns that nonconjugate message proposals need not increase the lower bound or converge.
  Positive precision with exact Bernoulli/Poisson curvature is not an ascent theorem. Small relative bound
  changes do not establish a global optimum, posterior accuracy or uniqueness.
- Appendix A’s compact final bound is stated for the parameters after their updates, including the inverse-Wishart
  coordinate; it is not automatically valid for arbitrary stale-scale trial states. Replacing log evidence
  by an attained ELBO does not guarantee correct Bayes-factor ordering or model posterior probabilities.
- All 21 primary reprint pages, including experiments, tables, figures, appendices and references, were
  read. Numerical checks use independent finite matrix arithmetic, supplied Gaussian states and Simpson
  quadrature; they do not reproduce the source adaptive ten-node Gauss-Hermite code, convergence or benchmarks.
  No author implementation or GLMM fitting was executed, and no quantitative runtime/accuracy superiority
  or clinical conclusion is asserted. DRAFT remains.
