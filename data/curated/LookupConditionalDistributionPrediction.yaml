  rationale: The reused CDP recurrence contains conditional transition laws on type contexts. This is
    a curator-inferred component relationship, not an assertion that count propagation with branching
    and pruning is a probability-preserving Markov chain. Lookup reuse neither guarantees Markov sufficiency
    of compressed search types nor changes the abstraction level of the pinned network class.
limitations:
- Lookup CDP is a computational reuse method for a count estimator, not IDA* itself, online threshold
  selection, a concrete-state solution cache or probability-table truncation.
- Same-model mathematical recurrence equality does not certify true node counts. Type aggregation, parameter
  estimation, ancestor pruning and complete-iteration semantics retain their original limitations.
- Absolute-level-dependent probability modifications require an adequate cache key or fixed recoverable
  schedule context. Reusing stale values across changed models is outside the asserted equivalence.
- The reported query complexity excludes offline sampling and cache construction and assumes suitable
  lookup operations. Larger type/state spaces, many thresholds and detailed cache contexts consume memory;
  shallow-prefix work can dominate.
- All25 pages of the author-hosted journal copy were visually inspected. Author implementation, earlier
  conference full texts and benchmark replication were not inspected or executed. Rational recurrence
  and cost examples are constructed checks, not measured performance.
