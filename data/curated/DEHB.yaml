claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a differential-evolution subpopulation for each Hyperband resource level, sized
    according to the maximum number of evaluations assigned to that level. Iterate through the prescribed
    halving brackets. For a bracket’s starting level use evolution within its own population; for higher
    levels form a parent pool from promising lower-level configurations and use it for difference-vector
    mutation, followed by crossover with a target in the current level’s population. Evaluate the proposed
    configuration at the current level and retain it only according to a same-level fitness comparison
    with the target. Supplement an undersized mutation pool from a global pool of configurations. The
    initialization cycle includes direct lower-to-higher promotions before the general evolutionary transfer
    pattern. For mixed search spaces, the appendix keeps continuous population coordinates in a unit hypercube
    and maps copies to numerical or binned ordinal/categorical settings for evaluation. Its parallel design
    keeps each halving stage synchronized while allowing brackets to overlap and applying completed differential-evolution
    updates immediately.
