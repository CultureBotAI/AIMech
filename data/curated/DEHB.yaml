name: DEHB
definition: A hyperparameter optimization algorithm that combines Hyperband resource schedules with differential-evolution
  populations at different resource levels, using promising lower-resource configurations to guide proposals
  evaluated and selected at higher resource levels.
concept_kind: algorithm
identity_notes: DEHB is the combined resource-allocation and differential-evolution method, distinct from
  generic genetic algorithms, differential evolution alone, random-proposal Hyperband, KDE-guided BOHB
  and ASHA’s asynchronous within-stage promotions. Budget-specific populations contain configuration vectors,
  not a population of trained checkpoints whose weights are copied between configurations. The proceedings
  paper and the versioned appendix are distinguished explicitly. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 262 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in both worktree and main checkout, returning
  9 lines in each checkout. These were prior candidate leads, source references and neighboring-method
  mentions, not existing records for these identities. Ten exact AIO CLASS nodes with synonyms and outgoing
  edges and eight neighboring native mechanisms were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.
limitations:
- The source’s initialization prose and pseudocode use bracket and iteration terminology inconsistently.
  Algorithm3’s bracket_counter==0 condition spans an outer cycle and applies direct promotion only for
  i>0. The record describes the common mechanism without treating every printed initialization statement
  as byte-equivalent executable steps.
- Appendix Algorithm2 prints b0=(bmax/bmin)*eta^(-s), which gives normalized rather than absolute budgets
  when bmin differs from1. Its return order for counts and budgets is reversed at the Algorithm3 call
  site. These discrepancies are retained as source qualifications; no author-issued erratum or exact executable
  schedule is claimed.
- The appendix updates its incumbent after evaluations without an explicit full-budget restriction. The
  record therefore does not promise that the returned best observed configuration has been verified at
  maximum resource. Greedy same-budget replacement limits harmful transfers but is not a proof of global
  optimality or universal robustness.
- Continuous encodings impose numerical neighborhoods on categorical choices, and low-fidelity information
  can be misleading. Parallel completion order can affect shared populations. No benchmark speedup, constant
  total runtime or author-code execution is claimed.
