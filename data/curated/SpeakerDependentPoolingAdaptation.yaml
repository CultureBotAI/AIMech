limitations:
- The stable identity denotes the Swietojanski–Renals test-time pooling-parameter adaptation procedure,
  not every speaker-adaptation method, a base pooling unit, general unsupervised training or a trained
  checkpoint.
- Optional normalized Lp formulas require their own order derivative; the reported experiments use unnormalized
  units. Numerical stabilization and implementation choices are not reconstructed from ambiguous prose.
- Source precision-limit wording for value-kernel pooling must be qualified as nearest-value selection
  for a fixed mean. Parameter adaptation does not turn it into unconditional maximum pooling.
- Complete eleven-page primaryv2 inspected. Constructed calculations only; no author software, speech
  data, model training or empirical replication.
