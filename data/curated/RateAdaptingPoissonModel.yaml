claims:
- claim_id: compatible-count-conditionals
  kind: mechanism
  statement: With baseline log rates a_i, hidden thresholds beta_j, interaction weights W_ij and finite
    integer trial counts M_j, visible counts conditioned on h are independent Poisson with rates exp(a_i+sum_j
    W_ij h_j). Hidden variables conditioned on x are independent Binomial(M_j,sigmoid(sum_i W_ij x_i-beta_j)).
    The joint retains visible factorial and hidden binomial base measures. Summing all visible counts
    first leaves a finite sum over bounded hidden configurations, proving a finite joint normalizer for
    finite parameters without truncating visible counts.
  evidence:
  - source_id: method-source
    locator: Section 2.1, PDF pp.2-3, Equations 1-3
    relation: supports
- claim_id: marginal-and-complement-symmetry
  kind: mechanism
  statement: Marginalizing hidden units gives visible log mass sum_i(a_i x_i-log(x_i!))+sum_j M_j softplus(sum_i
    W_ij x_i-beta_j), up to a global constant. The hard threshold interpretation is an approximation to
    softplus, not exact zero influence below a threshold. Complementing a hidden count to M_j-h_j, reversing
    its weight column and threshold, and adding M_j W_ij to each visible log baseline preserves the normalized
    visible law. This discrete symmetry does not establish arbitrary orthogonal rotation invariance or
    full parameter identifiability.
  evidence:
  - source_id: method-source
    locator: Sections 2.1-2.2, PDF pp.3-4, Equations 6-9
    relation: supports
- claim_id: conditional-moment-learning-and-features
  kind: mechanism
  statement: Likelihood gradients contrast observed and equilibrium sufficient statistics. Conditional
    hidden expectations M_j sigmoid(W_j^T x-beta_j) replace sampled hidden counts in the displayed gradient
    statistics. The reported CD1 procedure draws hidden counts from each observed vector, reconstructs
    visible counts and uses short-chain negative expectations, introducing approximation bias. Retrieval
    uses cosine similarity of the linear projection W^T x, which is distinct from the nonlinear conditional-binomial
    mean and from exact joint likelihood scoring.
  evidence:
  - source_id: method-source
    locator: Section 2.3, PDF p.4, Equation 10 and Algorithm 1; Sections 3.1-3.2, pp.5-6
    relation: supports
