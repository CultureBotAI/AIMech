name: Rate-adapting Poisson model
definition: A harmonium model family coupling unbounded visible Poisson counts to finite binomial hidden
  variables through bilinear interactions that shift conditional log rates and binomial logits.
concept_kind: model_family
identity_notes: Scoped to Gehler, Holub and Welling's ICML2006 RAP construction with fixed finite integer
  binomial trial counts. This differs from a Gaussian-hidden count harmonium, a two-unbounded-Poisson-layer
  construction, categorical word-bin EFH and replicated-token Softmax. Baseline Poisson rates and hidden
  logits are conditional parameters, not generally marginal means or independent hidden priors. The latent
  count model is distinct from its CD fitting algorithm or a trained retrieval system. No normalized identity
  matched four candidates against all 442 pinned AIO IDs, labels and scoped synonyms or 444 preceding
  native IDs, names and aliases. Full-checkout searches included ignored and hidden files in both checkouts;
  five matching lines per checkout came from two unique prior discovery-ledger contents, and all matching
  excerpts were read. All 205 semantic label/synonym hits were byte-verified against prior readings. Twenty-nine
  annotated AIO nodes and outgoing edges comprise 28 unchanged prior readings and one newly read multimodal-deep-learning
  node. Thirty-nine contextual YAMLs comprise 34 unchanged prior readings and five fully read current
  records. Three candidates are curated; the unbounded-count DWH specialization remains deferred because
  the inspected joint is not normalizable with nonzero count couplings. Absence is bounded to this pinned
  snapshot and maintained corpus.
limitations:
- The normalizer is finite but its exact finite hidden sum can grow exponentially with the number and
  ranges of hidden units. CD, minibatches and momentum do not certify exact maximum likelihood or chain
  convergence. No noninteger binomial trial-count extension is asserted.
- The document-retrieval topic dimension is selected using test-set one-nearest-neighbor performance,
  explicitly stated in the Figure 4 caption. Reported curves therefore do not constitute an independently
  tuned held-out comparison. The split used for class-informed newsgroup vocabulary selection is insufficiently
  specified to assert a separate leakage mechanism.
- RAP is compared with LSI and PLSI on selected text corpora and bag-of-visual-words image tasks. LDA
  is omitted from the reported comparison. Different retrieval measures and dataset configurations yield
  different rankings; no universal performance advantage is curated.
- Finite checks verify 96 hidden conditional probabilities, exact visible marginalization, a likelihood
  gradient and complement symmetry. No author code, coordinate-mode implementation, empirical benchmark,
  hierarchical extension or negative-binomial replacement was executed or certified.
