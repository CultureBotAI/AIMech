claims:
- claim_id: method
  kind: mechanism
  statement: Given B labeled examples with one-hot labels and B unlabeled examples, augment each labeled
    input once and each unlabeled input K times. Average the current classifier probabilities across the
    K views of each unlabeled input, then sharpen the average q_bar using q_c=q_bar_c^(1/T)/sum_j q_bar_j^(1/T),
    for T>0; treat these guessed labels as constants during differentiation. Create augmented labeled
    pairs X_hat of size B and unlabeled pairs U_hat of size KB, then shuffle their concatenation into
    W. Mix each X_hat pair with the corresponding first B pairs in W, and each U_hat pair with the corresponding
    remaining KB pairs. For each MixUp operation draw lambda from Beta(alpha,alpha), alpha>0, set lambda_prime=max(lambda,1−lambda),
    and combine both inputs and targets with weights lambda_prime and 1−lambda_prime, keeping at least
    half of the first pair. For the resulting X_prime and U_prime, minimize average soft-target cross-entropy
    over X_prime plus lambda_u/(C|U_prime|) times sum over U_prime of squared target/prediction differences,
    where C is the number of classes. The reported implementation ramps lambda_u linearly. Guessed labels
    use current-model predictions; the evaluation-only weight EMA in Section 4.1 is not a Mean Teacher
    target generator.
