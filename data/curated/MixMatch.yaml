name: MixMatch
definition: A semi-supervised classifier-training procedure that averages predictions over augmented unlabeled
  inputs, sharpens the resulting soft targets, mixes augmented labeled and unlabeled input-target pairs,
  and optimizes labeled cross-entropy plus an unlabeled squared-probability loss.
concept_kind: algorithm
identity_notes: 'MixMatch combines averaged augmented-view label guessing, probability sharpening and
  the modified MixUp pairing rule. These components define a distinct training algorithm rather than an
  alias for MixUp, Mean Teacher or a hard pseudo-label confidence filter. Its classification soft targets
  differ from representation matching in BYOL, DINO and SimSiam. This record describes a training algorithm,
  not a trained checkpoint or fixed network architecture. The inspected AIO SemiSupervisedLLM class specifically
  combines LLM pretraining with supervised fine-tuning; its related synonym self-training is not an exact
  identity for this method. AIO SelfsupervisedLearning excludes human-annotated labels, Distillation describes
  large-to-small compression, and RegularizationLayer is a layer: none supplies an equivalent class for
  this algorithm. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 230 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout; matches concern prior discovery leads and the Pi-model
  normalization regression. Ten exact AIO CLASS nodes, their scoped synonyms and outgoing edges, plus
  five neighboring native records were inspected. The corrected Unicode-aware normalizer preserves Π;
  the previous Pi-model/Model collision was a lexical defect, not semantic identity (review issue #58).'
limitations:
- The original setup pairs B labeled examples with B unlabeled examples and K augmentations per unlabeled
  input. Alternative batching or interpolation rules require an explicit variant scope.
- For 0<T<1 sharpening concentrates probability. As a curator consequence of the formula, the T→0 limit
  is one-hot only with a unique maximum; tied maxima retain equal limiting mass. T>1 smooths rather than
  sharpens.
- Correct label-preserving augmentation and useful interpolation are assumptions; guessed labels can be
  wrong and the algorithm has no defining hard confidence threshold.
- The record does not assert published error rates or universal superiority. Reported T, K, alpha, lambda_u
  and evaluation-EMA settings are experimental choices, not fixed constants of every implementation.
