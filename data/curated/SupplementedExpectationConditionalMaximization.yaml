name: Supplemented Expectation Conditional Maximization
aliases:
- Supplemented ECM
- SECM
concept_kind: algorithm
definition: A numerical supplement to expectation conditional maximization that recovers observed-data
  asymptotic parameter covariance from expected complete-data information and the local derivatives of
  both the ECM update and its frozen-expectation conditional-maximization sweep.
identity_notes: SECM extends supplemented EM to an ECM fit. Its additional CM derivative accounts for
  incomplete joint maximization within each ECM iteration. It is a covariance-estimation procedure, distinct
  from ECM fitting, AECM, stochastic EM and an ordinary EM supplement applied without this correction.
  The supplemented-CM helper is described within this procedure rather than introduced as an ambiguous
  SCM record. All 442 pinned AIO labels/scoped synonyms and 466 preceding native IDs, names and aliases
  were compared. The sole normalized search-term collision, bare SAGE, identifies the existing sparse
  additive text model; the new optimization method uses qualified aliases. Ignored-inclusive fixed-string
  searches of both full checkouts returned 436 and 459 line instances. Context windows for all 143 distinct
  normalized matched texts were inspected; duplicate ledger/review mentions, unrelated environment strings
  and the stochastic-EM lead do not establish these four method identities. All 225 semantic label/synonym
  rows and 17 annotated AIO nodes with outgoing edges were inspected; sixteen nodes were byte-verified
  unchanged after prior reading and UncertaintyBias was newly read. Thirty-one contextual YAMLs comprise
  17 AIO and 14 native records, with 27 verified prior readings and four full new readings; the existing
  sparse text SAGE was also reread. Absence is bounded to this pin, maintained corpus and inspected neighborhood.
