aio_no_match:
  search_scope: All 442 pinned CLASS labels and scoped synonyms,466 preceding native identities and ignored-inclusive
    full-checkout searches;225 semantic label/synonym rows and 17 annotated AIO nodes with outgoing edges
    were inspected. Assessment is bounded to the recorded AIO snapshot.
  rationale: This method computes asymptotic parameter covariance by supplementing an EM-type fit with
    expected complete information and update-map derivatives. The inspected pin supplies no fitting-uncertainty
    or observed-information method counterpart. A generic task, fitted model, preprocessing operation
    or uncertainty-related bias would conflate the inferential calculation with a different kind of concept.
  examined_targets:
  - target: AIO:MachineLearningTask
    rejection_reason: The target is the learning process/task. Supplemented covariance computation is
      a general inferential calculation after fitting, not itself a learned-task identity; that broad
      association alone is not used to force a link.
  - target: AIO:Model
    rejection_reason: The calculation does not define a distribution/model family or a trained model instance.
  - target: AIO:TrainingStrategy
    rejection_reason: This pinned node is a preprocessing strategy, not an inverse-information or numerical
      covariance procedure.
  - target: AIO:RegressionAnalysis
    rejection_reason: Regression is only one possible application; the procedure applies to other incomplete-data
      likelihood models.
  - target: AIO:DataAugmentation
    rejection_reason: The pinned term enriches training examples by transformations. Conditional latent-data
      information in EM is a different construction.
  - target: AIO:UncertaintyBias
    rejection_reason: This bias favors groups better represented in training because of lower prediction
      uncertainty. It does not denote parameter covariance estimation.
  - target: AIO:EvaluationBias
    rejection_reason: This is a bias in evaluation; a numerical covariance calculation is not such a bias
      or a predictive benchmark.
definition_evidence:
- source_id: method-source
  locator: Sections 2.4-2.5, Eq 2.4.1 and 2.5.1-2.5.3, pp.59-60 / PDF 5-6
  relation: supports
claims:
- claim_id: separate-ecm-and-cm-derivatives
  kind: mechanism
  statement: At the converged interior fit, estimate D_ECM by perturbing one input coordinate and applying
    one E-step followed by the full ordered CM sweep. Estimate D_CM using the same perturbed inputs but
    only the CM sweep with the converged conditional expected sufficient statistics held fixed, or compute
    it analytically from complete information and constraint derivatives. Recomputing an E-step inside
    this second calculation would estimate the wrong map. Derivatives use input-coordinate rows and output-coordinate
    columns.
  evidence:
  - source_id: method-source
    locator: Sections 2.4 and 3, Eq 2.4.2-2.4.4 and Algorithms 2-3, pp.59-65 / PDF 5-11
    relation: supports
- claim_id: corrected-covariance-product
  kind: mechanism
  statement: Let Vcom=Ic^(-1), with Ic the expected complete-data information at the fit. The identity
    I-D_ECM=(I-D_EM)(I-D_CM) gives Vobs=Vcom(I-D_CM)(I-D_ECM)^(-1). The missing-data increment is Vcom(D_ECM-D_CM)(I-D_ECM)^(-1).
    Preserve matrix order. D_CM=0 reduces to supplemented EM; substituting D_ECM directly into the EM-only
    formula generally does not recover the observed covariance.
  evidence:
  - source_id: method-source
    locator: Section 2.4 Eq 2.4.1 and Section 2.5 Eq 2.5.1-2.5.3, pp.59-60 / PDF 5-6
    relation: supports
- claim_id: multicycle-fit-versus-probe
  kind: scope
  statement: A multicycle-ECM fit may supply the converged parameter and nearby perturbation values, but
    the stated SECM calculation still differentiates the ordinary single-E ECM map and its frozen-Q CM
    sweep. Extra E-steps used while locating the fit cannot simply be retained inside the derivative probes
    without changing the matrix identity.
  evidence:
  - source_id: method-source
    locator: Section 5.2, p.72 / PDF 18
    relation: supports
- claim_id: diagnostic-not-certification
  kind: limitation
  statement: The theoretically symmetric missing-data covariance increment is computed from separately
    estimated matrices, making appreciable asymmetry a useful indication of numerical or implementation
    errors. Tight fit tolerances, stable parameterization and meaningful perturbations matter. Symmetry
    is not sufficient proof of correct fitting, covariance or uncertainty calibration; do not force symmetry
    merely to conceal a failed diagnostic.
  evidence:
  - source_id: method-source
    locator: Sections 3.4 and 5.1, pp.64-65,71-72 / PDF 10-11,17-18; curator common-scaling counterexample
    relation: supports
limitations:
- The regular interior and invertibility assumptions exclude treating a boundary or singular fit with
  the same inverse-information formula. A large missing-information fraction amplifies errors in map differentiation.
- The straightforward sufficient-statistic routines in Section 3 assume an exponential-family complete
  model. The method needs expected complete information as well as ECM code; its cost and numerical precision
  depend on parameter dimension and conditioning.
- The p.67 example prose refers to displayed covariance blocks where the general Eq 2.4.4 specifies information
  blocks. The record follows the general information-matrix formula, not that inconsistent prose.
- A fitting sequence that reaches a coordinate exactly can make ratio probes undefined. The no-missing-information
  subcase and reduced parameterizations require the source’s additional handling.
- All 21 primary-paper pages were read. Finite Gaussian examples verify both map derivatives, noncommuting
  matrix order and failure of symmetry as sufficient certification. The censored-normal and contingency-table
  studies, original software and interval coverage were not reproduced.
