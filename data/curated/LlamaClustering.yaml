  rationale: The algorithm groups observations into overlapping sets from supplied linkage scores; this
    target denotes the grouping task, not this algorithm.
- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: The method extends nested cluster-tree construction to a structure with overlapping groups
    and multiple parents. This related-task mapping does not identify its DAG with a tree or assert equivalence
    to every hierarchical-clustering definition.
limitations:
- This Llama is the 2021 clustering algorithm, not a language model. A cluster-inclusion DAG does not
  assert causal or conditional-independence semantics.
- The literal Lemma 1 proof writes argmin where the main similarity algorithm uses argmax. Its noisy-recovery
  proof also states a first-round pair-cover argument without the singleton-target exception, whose singleton
  already exists in the accumulated structure. No formal theorem certification or refutation is claimed.
- Printed dendrogram-purity Equations 18–19 sum ordered unequal pairs but normalize by unordered-pair
  counts. A conventional unordered-pair interpretation is needed for unit-normalized purity; no metric
  implementation was inspected.
- Standalone exact calculations illustrate finite-round root absence, overlap double-counting and the
  printed purity normalization. They are not author implementation runs or general correctness proofs.
- All 12 main and six supplementary PDF pages were read, including figures, tables, references and proofs.
  Author code, datasets, alternative source revisions and historical experiments were not audited or executed.
- No training, model execution, paid service, data upload, benchmark replication or formal proof certification
  was performed. This record remains DRAFT.
