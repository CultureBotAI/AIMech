claims:
- claim_id: r401-mimic-attack-vulnerability-and-lemma1-bucket-variance-reduction
  kind: mechanism
  statement: Section 3 shows that standard robust aggregators (Krum, CM, RFA) fail on heterogeneous datasets under the Mimic attack (where Byzantine workers copy a single good worker selected along the top variance direction via streaming Oja's method), whereas Lemma 1 and Theorem I prove that s-bucketing reduces expected pairwise variance between good bucket averages to E||y_i - y_j||^2 <= rho^2 / s while keeping at least ceil(n/s) * (1 - delta * s) buckets purely good, enabling Krum o Bucketing (delta_max < 1/4), RFA o Bucketing (delta_max < 1/2), and CM o Bucketing (delta_max < 1/2) with s = floor(delta_max / delta) to achieve O(delta * rho^2) MSE without knowing rho^2.
  evidence:
  - source_id: r401-primary-pdf
    locator: Section 3 Failure of Existing Methods & Mimic Attack, Section 4 (Algorithm 1, Lemma 1, Definition A, Theorem I), & Appendix B, pp. 2-5, 14-15
    relation: supports
- claim_id: r401-heterogeneous-nonconvex-convergence-lower-bound-and-strong-growth
  kind: mechanism
  statement: Combining an (delta_max, c)-ARAgg with worker momentum (Algorithm 2), Theorem II proves convergence on heterogeneous non-convex objectives to E||nabla f(x)||^2 <= O(c * delta * zeta^2 + sigma * sqrt(L F^0 (c * delta + 1/n) / T)), matching the information-theoretic heterogeneity lower bound Omega(delta * zeta^2) of Theorem III, while Theorems IV and V establish exact convergence to 0 gradient under overparameterized strong growth E||nabla f_j(x) - nabla f(x)||^2 <= B^2 ||nabla f(x)||^2 whenever 60 c * delta * B^2 < 1.
  evidence:
  - source_id: r401-primary-pdf
    locator: Section 5 Byzantine-Robust Optimization with Heterogeneity (Algorithm 2, Theorems II, III, IV, V), pp. 5-7
    relation: supports
- claim_id: r401-breakdown-point-shrinkage-and-fundamental-heterogeneity-floor-limitation
  kind: limitation
  statement: Bucketing with bucket size s multiplies the effective fraction of corrupted buckets by up to s (requiring delta * s <= delta_max, so s = floor(delta_max / delta) must be tuned using an upper bound on delta), and Theorem III proves an unavoidable Omega(delta * zeta^2) optimality gap under arbitrary bounded gradient dissimilarity zeta^2.
  evidence:
  - source_id: r401-primary-pdf
    locator: Section 4 Lemma 1 & Theorem I, and Section 5.1 Theorem III (Lower Bounds under Heterogeneity), pp. 4-6
    relation: supports
- claim_id: r401-non-iid-mnist-and-cifar10-byzantine-defense-application
  kind: application
  statement: Evaluated on Dirichlet non-i.i.d. partitions of MNIST and CIFAR-10 against bit-flipping, little-is-enough (LIE), inner-product manipulation (IPM), and Mimic attacks, restoring high test accuracy for Krum, RFA, and Coordinate-wise Median where unbucketed versions degrade to random guessing.
  evidence:
  - source_id: r401-primary-pdf
    locator: Section 6 Experiments (Figures 2-3), pp. 7-9
    relation: supports
