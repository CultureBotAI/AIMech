id: AIMech:BucketingResamplingForHeterogeneousByzantineRobustOptimization
name: Bucketing Resampling for Heterogeneous Byzantine-Robust Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A randomized pre-aggregation resampling reduction (s-Bucketing, Algorithm 1) for Byzantine-robust distributed optimization on heterogeneous (non-i.i.d.) datasets that uniformly permutes the n worker vectors {x_1,...,x_n}, partitions them into ceil(n/s) buckets {B_1,...,B_{ceil(n/s)}} of size at most s, averages the vectors within each bucket y_i = (1/|B_i|) sum_{k in B_i} x_k to produce more homogeneous virtual workers, and feeds {y_1,...,y_{ceil(n/s)}} into a base robust aggregator Aggr (such as Krum, RFA geometric median, or Coordinate-wise Median), combined with worker momentum (Algorithm 2) to convert non-agnostic aggregators into (delta_max, c)-Agnostic Robust Aggregators (ARAgg).
identity_notes: Distinct from standalone Krum (AIMech:KrumAndMultiKrumByzantineTolerantGradientDescent), Coordinate-wise Median (AIMech:CoordinateWiseMedianAndTrimmedMeanByzantineRobustDistributedLearning), and RFA (AIMech:RfaRobustFederatedAggregationSmoothedWeiszfeldGeometricMedian), all of which fail under inter-client data heterogeneity and the Mimic attack with Omega(rho^2) bias when applied directly to unbucketed worker vectors, and from Centered Clipping (AIMech:CenteredClippingAndWorkerMomentumForByzantineRobustOptimization, which is an iterative clipping rule requiring a clipping radius tau rather than a black-box resampling meta-wrapper).
aliases:
- s-Bucketing for Byzantine-Robust Learning
- Bucketing Agnostic Robust Aggregator
- ARAgg via s-Bucketing
- Byzantine-Robust Learning on Heterogeneous Datasets via Bucketing
