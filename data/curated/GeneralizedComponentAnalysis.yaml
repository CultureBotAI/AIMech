claims:
- claim_id: log-hidden-harmonium
  kind: mechanism
  statement: For fixed document length and author-position count, word tokens, author tokens and a discrete
    timestamp contribute shared matrix columns to a vector S. The positive-hidden joint contains exp(sum_i[-log(t_i)-log(t_i)^2/2+S_i*log(t_i)]).
    Changing variables to y=log(t), including the Jacobian, gives y conditional on all visible observations
    distributed as N(S,I), and visible mass proportional to exp(||S||^2/2). The positive-hidden mean is
    exp(S_i+1/2), not S_i; positive coordinates do not by themselves create a normalized simplex of topics.
    Missing visible modalities generally produce mixtures after marginalization rather than the same single
    Gaussian with their columns set to zero.
  evidence:
  - source_id: method-source
    locator: Section 2.3, PDF p.3, Equations 3-5; Section 3, PDF pp.4-5, conditional inference and prediction
    relation: supports
- claim_id: contrastive-training-statistics
  kind: mechanism
  statement: The source fits approximate joint or conditional likelihood using contrastive divergence
    and Gaussian weight shrinkage. Conditional training clamps words and time while reconstructing authors.
    Replicated categorical author positions use occurrence counts as sufficient statistics, including
    when a reconstruction repeats an author. Equation 8 instead displays a presence indicator and prints
    A-1 as a word-sum limit; the general statistic requires author counts and the vocabulary dimension.
    The exact fixed-length likelihood gradient contrasts observed count-times-S statistics with their
    model expectation, with an additional prior gradient if regularized. Short-chain CD approximates that
    expectation and is not exact maximum likelihood.
  evidence:
  - source_id: method-source
    locator: Sections 3.1-3.2, PDF pp.4-5, Equations 6-8 and Algorithm 1
    relation: supports
- claim_id: latent-rotation-boundary
  kind: limitation
  statement: A common orthogonal transformation of the hidden rows of all interaction matrices preserves
    ||S||^2 and therefore every fixed-size visible probability. It also preserves an isotropic Gaussian
    weight penalty. Such shrinkage consequently does not remove all latent rotation ambiguity or guarantee
    a uniquely interpretable set or number of components. The source's suggestion that the prior addresses
    nonidentifiability or enables automatic component selection has this mathematical boundary.
  evidence:
  - source_id: method-source
    locator: Section 3.1, PDF p.4, Gaussian priors and identifiability discussion; Section 2.3, PDF p.3,
      model law
    relation: supports
