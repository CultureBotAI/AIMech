name: Generalized component analysis
definition: An undirected latent-component model family coupling categorical text and heterogeneous document
  attributes to positive lognormal hidden variables, with variables conditionally independent within either
  layer given the other and shared attribute-specific interaction weights.
concept_kind: model_family
identity_notes: Scoped to Wang, Pal and McCallum's KDD2007 GCA harmonium for words, author positions and
  discrete time bins. Its positive hidden coordinates couple through their logarithms, giving an equivalent
  Gaussian-hidden representation under a change of variables. This differs from the native Replicated
  Softmax model with binary hidden variables and its length-scaled bias. It is not ordinary PCA, a simplex
  topic mixture, or every method subsequently named generalized component analysis. No normalized candidate
  identity matched all 442 pinned AIO IDs, labels and scoped synonyms or 438 preceding native IDs, names
  and aliases. Full-checkout searches included ignored and hidden files in both checkouts; eleven matching
  lines per checkout came from four unique prior discovery-ledger contents with pending leads and bibliography
  context. All matching excerpts were read. All 205 semantic label/synonym hits and 21 annotated AIO nodes
  with outgoing edges were byte-verified against prior readings. Twenty-nine contextual YAMLs comprise
  28 unchanged prior readings and one fully read final round103 native target verified against its saved
  review inputs. No candidate record is present within this bounded pinned-snapshot and maintained-corpus
  search.
limitations:
- Finite categorical sample spaces make the partition function finite for each fixed number of word and
  author positions and finite weights. The source does not specify a normalized distribution over unbounded
  document lengths. Independent author positions can repeat authors; this is not automatically a distribution
  over unique author sets.
- The evaluated timestamps are discrete years or months. Proposed Gaussian or Beta visible attributes
  require their own compatible joint and normalization analysis. Broad PCA comparisons do not establish
  equivalence to probabilistic PCA with Gaussian observations.
- The reported author/recipient evaluation retrieves training documents by cosine similarity in latent
  space and scores the first result sharing an author or recipient. This is not exact author-set conditional-probability
  ranking. Treatment of missing target-modality features in embeddings is underspecified; no data-leakage
  allegation or unprovided implementation is inferred.
- Selected NIPS and single-user email data, random splits, twenty components and best reported iteration
  scores provide bounded empirical evidence. Finite checks verify fixed-size probabilities, a gradient,
  rotation invariance and missing-modality mixtures, not historical software, convergence or the reported
  benchmark.
