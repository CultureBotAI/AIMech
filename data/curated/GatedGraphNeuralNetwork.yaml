    artificial neural architecture; this target is broader.
- target: AIO:GatedRecurrentUnit
  relation: related_match
  rationale: GRU-style updates are components of the graph architecture, not an equivalent whole-model
    identity. The mapping does not adopt the pinned target’s LSTM parentage as a scientific assertion
    or equate framework-specific GRU variants.
limitations:
- The base GG-NN is distinct from the same paper’s GGS-NN sequence extension, the prior contraction-based
  GNN, named GCN, and generic GRU components.
- The supplied graph may be static while its hidden-state computation is recurrent; this does not require
  an observed temporal input sequence.
- The inspected version is arXiv1511.05493v4, dated 22September2017, bearing an ICLR2016 header. All20pages,
  including appendices, were read. Author code and other versions were not inspected.
- Tiny chosen calculations inspect algebraic boundaries only. No model training, benchmark reproduction,
  convergence proof or empirical performance certification was performed. DRAFT remains.
