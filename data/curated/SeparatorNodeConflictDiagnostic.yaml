- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The method operates on Bayesian DAG information partitions and replicated separator nodes.
    BayesianNetwork supplies its defining directed-graph representation but is not the diagnostic algorithm
    itself; this is relatedness, not equivalence or subclass membership. The general separator can lie
    outside a random-effects hierarchy.
limitations:
- The split, reference priors, parameter scale and treatment of nuisance dependence define the comparison.
  Proper full-model inference does not guarantee proper or identifiable partition-specific distributions.
- Discrete equality mass, scalar equal-tail values, Gaussian reference tails, empirical radial tails and
  density-level scores have different meanings and assumptions. Density ties and singular covariance require
  explicit handling.
- The source suggests radial scoring under symmetry and unimodality; this does not establish equality
  with density-contour scoring for non-elliptical distributions. Its posterior-normality discussion is
  not imported as a universal frequentist calibration theorem.
- The generic two-partition method does not itself provide familywise or false-discovery error control
  across an adaptive collection of splits. The later multiple-testing framework is a separate pending
  concept.
- All 22 pages of the primary electronic reprint were read, including Figures 1–16, Table 1 and references.
  No author implementation, original application data analysis, MCMC, empirical calibration or benchmark
  was run. Constructed analytic and quadrature examples check distinctions between radial and density
  scores, nonlinear scale choices and discrete agreement; they are not reproductions of source experiments.
