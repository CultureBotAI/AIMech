id: AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam
name: FedOpt Adaptive Server Optimization (FedAdagrad, FedYogi, and FedAdam)
concept_kind: algorithm
review_status: DRAFT
definition: 'A general client-server federated optimization framework (FedOpt) and its adaptive server-side instantiations (FedAdagrad, FedYogi, and FedAdam) in which sampled clients i in S_t execute K steps of a stateless local optimizer ClientOpt (such as SGD with client learning rate eta_l) to compute model deltas Delta_i^t = x_{i,K}^t - x_t, and the server treats the negative average update -Delta_t = -(1/|S_t|) sum_{i in S_t} Delta_i^t as a pseudo-gradient fed into an adaptive per-coordinate server optimizer ServerOpt with server learning rate eta and adaptivity parameter tau > 0: updating momentum m_t = beta_1 m_{t-1} + (1 - beta_1) Delta_t, second-moment preconditioner v_t = v_{t-1} + Delta_t^2 (FedAdagrad), v_t = v_{t-1} - (1 - beta_2) Delta_t^2 sign(v_{t-1} - Delta_t^2) (FedYogi), or v_t = beta_2 v_{t-1} + (1 - beta_2) Delta_t^2 (FedAdam), and global iterate x_{t+1} = x_t + eta * m_t / (sqrt(v_t) + tau).'
identity_notes: Distinct from standard Federated Averaging (AIMech:FederatedAveragingClientServerOptimization, which corresponds to the special case where ServerOpt is SGD with unit learning rate eta = 1 and no server-side momentum or second-moment preconditioning) and from Centralized Yogi/Adam/Adagrad (which maintain optimizer state at every stochastic step rather than decoupling stateless local ClientOpt trajectories from stateful server-level pseudo-gradient preconditioning).
aliases:
- FedOpt
- FedAdagrad
- FedYogi
- FedAdam
- Adaptive Federated Optimization
