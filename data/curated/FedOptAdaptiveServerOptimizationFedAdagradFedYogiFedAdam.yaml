claims:
- claim_id: r393-client-server-decoupling-and-zero-client-state-overhead
  kind: mechanism
  statement: By confining first- and second-moment accumulators (m_t, v_t in R^d) exclusively to the central server in Algorithm 2 while running stateless local SGD on sampled clients, FedAdagrad, FedYogi, and FedAdam incur zero extra client-to-server communication bandwidth and avoid stale client-side preconditioner states in cross-device settings where clients participate rarely.
  evidence:
  - source_id: r393-primary-pdf
    locator: Section 2 General Framework & Section 3 Adaptive Federated Optimization (Algorithm 2), pp. 3-5
    relation: supports
- claim_id: r393-nonconvex-convergence-rate-and-local-step-condition
  kind: mechanism
  statement: Under L-smoothness, G-bounded gradients, local variance sigma_l^2, and inter-client gradient dissimilarity sigma_g^2 with effective variance sigma^2 = sigma_l^2 + 6 K sigma_g^2, Theorems 1-2 and Corollaries 1-2 prove that choosing client learning rate eta_l = Theta(1 / (K L sqrt(T))), server learning rate eta = Theta(sqrt(K m)), and tau = G / L achieves min_{0 <= t < T} E||nabla f(x_t)||^2 = O(1 / sqrt(m K T)) linear speedup in sampled clients m and local steps K whenever K = O(T sigma_l^2 / sigma_g^2).
  evidence:
  - source_id: r393-primary-pdf
    locator: Section 3.1 Convergence Analysis (Assumptions 1-3, Theorems 1-2, Corollaries 1-2), pp. 5-7
    relation: supports
- claim_id: r393-client-drift-inverse-local-learning-rate-limitation
  kind: limitation
  statement: Because local client updates drift under non-i.i.d. data (sigma_g^2 > 0), Theorem 3 shows that even on simple 1D quadratic client objectives, fixed client learning rates converge to a biased point whose offset scales with K * eta_l, requiring eta_l to scale inversely with K * sqrt(T) and joint tuning with the server adaptivity parameter tau.
  evidence:
  - source_id: r393-primary-pdf
    locator: Section 3.1 Theorem 2, Corollary 2, and Appendix B.1 Theorem 3, pp. 6-7, 15
    relation: supports
- claim_id: r393-cross-device-benchmark-suite-application
  kind: application
  statement: "Evaluated across five realistic cross-device federated benchmarks\u2014CIFAR-10, CIFAR-100, EMNIST-62, Shakespeare next-character RNN, and StackOverflow tag-prediction logistic regression and next-word NWP RNN\u2014demonstrating that FedYogi and FedAdam significantly outperform FedAvg on heavy-tailed text vocabulary tasks and show wider learning-rate stability plateaus."
  evidence:
  - source_id: r393-primary-pdf
    locator: Section 4 Experiments and Section 5 Results (Figures 1-3, Table 2), pp. 7-9
    relation: supports
