id: AIMech:TCTColBERTTightlyCoupledTeachersForDenseRetrieval
name: TCT-ColBERT Tightly-Coupled Teachers Knowledge Distillation for Dense Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: A knowledge-distillation algorithm for single-stage dense passage retrieval that initializes a Siamese BERT bi-encoder student from a fine-tuned late-interaction ColBERT teacher, removes ColBERT's Conv1D token-projection head to represent each query and passage as a single average-pooled token embedding Pool(E_q), Pool(E_d) in R^h scored via dot product phi_PoolDot(q, d) = <Pool(E_q), Pool(E_d)>, and interleaves online inference of the frozen ColBERT teacher phi_MaxSim(q, d) = sum_{i in |E_q|} max_{j in |E_d|} <eta_q(E_{q_i}), eta_d(E_{d_j})> across all passages D_B = {d^+_{q_j}}_{j in B} U {d^-_{q_j}}_{j in B} in each training mini-batch B to minimize L = -sum_{i=1}^{|B|} [gamma * 1_{d_i in T^+_{q_i}} log P(d_i | q_i) - (1 - gamma) sum_{d' in D_B} KL(P_hat(d' | q_i) || P(d' | q_i))] where P(d | q) = softmax(phi_PoolDot(q, d)) and P_hat(d | q) = softmax(phi_MaxSim(q, d) / tau), optionally combined at inference with top-k sparse retrieval scores via minimum-score-substituted linear interpolation over D_sp U D_ds.
identity_notes: Distinct from TAS-B (AIMech:TASBTopicAwareSamplingBalancedMarginDistillation), which distills pairwise score margins from dual ColBERT and cross-encoder teachers over topic-clustered queries rather than temperature-scaled listwise KL divergence over dynamic in-batch subsampled passages from a tightly-coupled ColBERT teacher; distinct from RocketQA (AIMech:RocketQADenoisedHardNegativeSampling) and RocketQAv2 (AIMech:RocketQAv2JointTrainingDensePassageRetrievalAndReranking), which distill from a cross-encoder reranker over per-query candidate lists rather than a late-interaction MaxSim teacher over full O(|B|^2) in-batch query-passage grids; and distinct from ANCE (AIMech:ANCEApproximateNearestNeighborNegativeContrastiveLearning), which requires periodic asynchronous corpus-wide ANN re-encoding instead of tightly-coupled in-batch teacher distillation.
aliases:
- TCT-ColBERT
- Tightly-Coupled Teacher ColBERT
- Distilling Dense Representations for Ranking using Tightly-Coupled Teachers
- In-Batch Negatives for Knowledge Distillation with Tightly-Coupled Teachers for Dense Retrieval
