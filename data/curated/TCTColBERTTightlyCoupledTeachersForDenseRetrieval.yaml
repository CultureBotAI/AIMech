claims:
- claim_id: tct-colbert-maxsim-to-poolavg-dot-product-distillation
  kind: mechanism
  statement: TCT-ColBERT simplifies ColBERT's late-interaction scoring phi_MaxSim(q, d) = sum_{i in |E_q|} max_{j in |E_d|} <eta_q(E_{q_i}), eta_d(E_{d_j})> (Equation 3) by removing the Conv1D layer and compressing each passage and query into a single h = 768 average-pooled vector scored by phi_PoolDot(q, d) = <Pool(E_q), Pool(E_d)> (Equation 2, Section 3), initializing the student bi-encoder from the trained ColBERT teacher weights and freezing the teacher during distillation (Section 4).
  evidence:
  - source_id: r771-primary-pdf
    locator: Sections 2-4, Equations 2-5, Footnote 2, pp. 2-5
    relation: supports
  - source_id: r771-primary-pdf
    locator: colbert_maxsim() and pool_dot() verification
    relation: supports
- claim_id: tct-colbert-tightly-coupled-in-batch-subsampling-kl-loss
  kind: mechanism
  statement: During each mini-batch B of triplets (q_i, d^+_{q_i}, d^-_{q_i})_{i in B}, TCT-ColBERT interleaves online ColBERT teacher inference across the entire in-batch passage pool D_B = {d^+_{q_j}}_{j in B} U {d^-_{q_j}}_{j in B} to compute temperature-scaled soft targets P_hat(d | q_i) = exp(phi_MaxSim(q_i, d)/tau) / sum_{d' in D_B} exp(phi_MaxSim(q_i, d')/tau) (tau = 0.25) and optimizes L = -sum_{i=1}^{|B|} [gamma * 1_{d_i in T^+_{q_i}} log P(d_i | q_i) - (1 - gamma) sum_{d' in D_B} KL(P_hat(d' | q_i) || P(d' | q_i))] (gamma = 0.1, Equations 5-6), where adding in-batch subsampling distillation atop triplet distillation improves MS MARCO Dev full-corpus retrieval MRR@10 from 0.328 to 0.335 (Table 3).
  evidence:
  - source_id: r771-primary-pdf
    locator: Section 3.1 & Section 5 (Ablation study), Equations 5-6, Figure 1, Table 3, pp. 2-4, 6
    relation: supports
  - source_id: r771-primary-pdf
    locator: tct_distillation_loss() verification over in-batch passage grid
    relation: supports
- claim_id: tct-colbert-min-substituted-hybrid-dense-sparse-ranking
  kind: application
  statement: "To combine top-1000 sparse candidates D_sp (BM25 or doc2query-T5) with top-1000 dense candidates D_ds without scoring the entire corpus, TCT-ColBERT evaluates phi(q, d) over d in D_sp U D_ds via alpha * phi_sp(q, d) + phi_ds(q, d) when d is in both sets, substituting min_{d' in D_ds} phi_ds(q, d') when d is not in D_ds and alpha * min_{d' in D_sp} phi_sp(q, d') when d is not in D_sp (Equation 7), achieving 0.364 MRR@10 and 0.973 R@1000 on MS MARCO Dev at 106ms/query\u20144x faster than ColBERT (458ms) and 33x faster than BM25 + BERT-large (3,500ms) (Tables 1-2)."
  evidence:
  - source_id: r771-primary-pdf
    locator: Section 3.2 & Section 5, Equation 7, Tables 1-2, pp. 4-6
    relation: supports
  - source_id: r771-primary-pdf
    locator: hybrid_dense_sparse_scores() verification of Equation 7 branches
    relation: supports
- claim_id: tct-colbert-teacher-efficiency-and-single-vector-capacity-limitation
  kind: limitation
  statement: Because tight coupling requires online teacher inference over all |B| x |D_B| query-passage combinations in every mini-batch, the teacher model must be computationally efficient (ruling out full cross-encoder teachers for dynamic in-batch subsampling, Section 1 & Section 2), and compressing token-level representations into a single pooled vector incurs a standalone dense effectiveness drop compared to multi-stage ColBERT (0.335 vs. 0.360 MRR@10 on MS MARCO Dev, Table 1) unless complemented by sparse signals.
  evidence:
  - source_id: r771-primary-pdf
    locator: Section 1, Section 2, Section 3.2 & Table 1, pp. 1-5
    relation: supports
