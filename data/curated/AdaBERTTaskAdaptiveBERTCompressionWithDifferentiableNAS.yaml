id: AIMech:AdaBERTTaskAdaptiveBERTCompressionWithDifferentiableNAS
name: AdaBERT (Task-Adaptive BERT Compression with Differentiable Neural Architecture Search)
concept_kind: algorithm
review_status: DRAFT
definition: AdaBERT is a task-adaptive BERT compression framework that uses differentiable Neural Architecture Search (NAS) to jointly optimize a macro stacking layer count K in {1, ..., K_max} and a shared directed acyclic graph cell alpha_c composed of lightweight 1D standard/dilated convolutions, pooling, skip, and zero operations under the composite objective L = (1 - gamma)*L_CE + gamma*L_KD + beta*L_E, where L_KD is an Attentive Hierarchical Transfer loss distilled from frozen layer-wise teacher probe classifiers P_j^T on BERT_t and L_E is an efficiency-aware regularizer penalizing normalized parameter size and FLOPs via Gumbel-Softmax Straight-Through Estimator relaxation.
identity_notes: Distinct from task-independent BERT distillation methods such as DistilBERT (AIMech:DistilBERTKnowledgeDistillationDuringPretraining), BERT-PKD (AIMech:BERTPKDPatientKnowledgeDistillationForBERTModelCompression), and TinyBERT (AIMech:TinyBERTTransformerDistillationForNaturalLanguageUnderstanding), which compress BERT into a fixed-structure smaller Transformer for all tasks, and distinct from HAT (AIMech:HATHardwareAwareTransformersForEfficientNLP), which performs evolutionary search over an encoder-decoder SuperTransformer rather than Gumbel-Softmax differentiable search over CNN cells guided by hierarchical teacher probe classifiers.
aliases:
- AdaBERT
- Task-Adaptive BERT Compression with Differentiable Neural Architecture Search
- AdaBERT Attentive Hierarchical Probe Distillation NAS
