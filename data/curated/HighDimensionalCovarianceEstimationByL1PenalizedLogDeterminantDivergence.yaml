claims:
- claim_id: log-determinant-bregman-program-uniqueness-and-edge-hessian-irrepresentability
  kind: mechanism
  statement: The strictly convex log-determinant barrier g(A) = -log det(A) on the positive-definite cone S^p_{++} has gradient nabla g(A) = -A^{-1} and induces the Bregman divergence D_g(A || B) = -log det A + log det B + <<B^{-1}, A - B>> >= 0 (Equations 5-7), yielding the off-diagonal L1-penalized log-determinant estimator Theta_hat = argmin_{Theta > 0} {<<Theta, Sigma_hat^n>> - log det(Theta) + lambda_n ||Theta||_{1,off}} (Equations 9-11). Lemma 3 (Section 4.1, p. 15; proved in Appendix A, pp. 26-27 via Hadamard's inequality log det Theta <= sum_{i=1}^p log Theta_{ii}) establishes that for any lambda_n > 0 and strictly positive sample diagonal Sigma_hat^n_{ii} > 0, the program has a unique solution Theta_hat > 0 characterized by Sigma_hat^n - Theta_hat^{-1} + lambda_n Z_hat = 0 with Z_hat in partial ||Theta_hat||_{1,off} (Equations 47-48). At Theta*, the Hessian of g(Theta) is the p^2 x p^2 Kronecker product Gamma* := nabla^2_Theta g(Theta)|_{Theta*} = (Theta*)^{-1} otimes (Theta*)^{-1}
    (with Gaussian entries Gamma*_{(j,k),(l,m)} = cov(X_j X_k, X_l X_m), Equation 24), and Assumption 1 (p. 8, Equation 28) requires |||Gamma*_{S^c S} (Gamma*_{SS})^{-1}|||_\infty <= 1 - alpha for alpha in (0, 1], which on the 4-node diamond graph reduces to 4|rho|(|rho| + 1) < 1 (|rho| < (sqrt(2) - 1)/2 approx 0.2071 vs 2|rho| < 1 for the Lasso, Section 3.4.1, p. 12) and on the 4-node star graph reduces to |rho|(|rho| + 2) < 1 (|rho| < sqrt(2) - 1 approx 0.4142 vs |rho| < 1 for the Lasso, Section 3.4.2, pp. 12-13).
  evidence:
  - source_id: rwry2011-logdet-covariance-pdf
    locator: Section 2.2, pp. 4-5, Equations (5)-(11); Section 3.1, pp. 7-8, Equations (24)-(28), Assumption 1; Section 3.4, pp. 11-13, Figure 2; Section 4.1 and Appendix A, pp. 14-15, 26-27, Lemma 3, Equations (47)-(48), (72)
    relation: supports
- claim_id: primal-dual-witness-neumann-remainder-and-brouwer-fixed-point-control
  kind: mechanism
  statement: The primal-dual witness construction (Section 4.1, p. 15) defines Theta_tilde = argmin_{Theta > 0, Theta_{S^c} = 0} {<<Theta, Sigma_hat>> - log det(Theta) + lambda_n ||Theta||_{1,off}} (Equation 49), chooses Z_tilde_S in partial ||Theta_tilde_S||_{1,off}, and sets Z_tilde_{S^c} = (1/lambda_n)(-Sigma_hat_{S^c} + [Theta_tilde^{-1}]_{S^c}) (Equation 50). Writing W := Sigma_hat - (Theta*)^{-1}, Delta := Theta_tilde - Theta*, and the Taylor remainder R(Delta) := Theta_tilde^{-1} - (Theta*)^{-1} + (Theta*)^{-1} Delta (Theta*)^{-1} (Equations 51-52), the vectorized KKT system splits into Gamma*_{SS} Delta_bar_S + W_bar_S - R_bar_S + lambda_n Z_tilde_bar_S = 0 and Gamma*_{S^c S} Delta_bar_S + W_bar_{S^c} - R_bar_{S^c} + lambda_n Z_tilde_bar_{S^c} = 0 (Equations 54-55). Lemma 4 (p. 16, Equations 53-56) proves under Assumption 1 that max{||W||_\infty, ||R(Delta)||_\infty} <= alpha lambda_n / 8 implies ||Z_tilde_{S^c}||_\infty <= alpha/2 + (1 - alpha) < 1 and hence Theta_tilde = Theta_hat.
    Lemma 5 (p. 17, Equations 57-58; Appendix B, pp. 27-28) expands R(Delta) = (Theta*)^{-1} Delta (Theta*)^{-1} Delta J (Theta*)^{-1} with J = sum_{k=0}^infty (-1)^k ((Theta*)^{-1} Delta)^k (|||J^T|||_\infty <= 3/2 when ||Delta||_\infty <= 1/(3 K_{Sigma*} d)) to prove ||R(Delta)||_\infty <= (3/2) d ||Delta||_\infty^2 K_{Sigma*}^3, where K_{Sigma*} := |||Sigma*|||_\infty. Lemma 6 (p. 17, Equations 59-61; Appendix C, pp. 28-29) applies Brouwer's fixed-point theorem to F(Delta_bar_S) = -(Gamma*_{SS})^{-1} G_bar(Theta*_S + Delta_S) + Delta_bar_S on the l_infty-ball B(r) of radius r := 2 K_{Gamma*}(||W||_\infty + lambda_n) (where K_{Gamma*} := |||(Gamma*_{SS})^{-1}|||_infty) to prove ||Theta_tilde - Theta*||_\infty <= r whenever r <= min{1/(3 K_{Sigma*} d), 1/(3 K_{Sigma*}^3 K_{Gamma*} d)}.
  evidence:
  - source_id: rwry2011-logdet-covariance-pdf
    locator: Sections 4.1-4.2 and Appendices B-C, pp. 14-18, 27-29, Lemmas 4-7, Equations (49)-(62), (73)-(79)
    relation: supports
- claim_id: non-asymptotic-elementwise-spectral-frobenius-and-model-selection-rates-under-exponential-and-polynomial-tails
  kind: scope
  statement: 'Under tail condition T(f, v_*) (Definition 1, p. 5, Equation 12: P[|Sigma_hat^n_{ij} - Sigma*_{ij}| >= delta] <= 1/f(n, delta) for delta in (0, 1/v_*]) with inverse functions n_bar_f and delta_bar_f (Equations 13-15) and penalty lambda_n = (8/alpha) delta_bar_f(n, p^tau) for tau > 2, Theorem 1 (p. 9, Equations 29-30) and Theorem 2 (p. 11, Equations 37-38) prove that for n > n_bar_f(1 / max{v_*, 6(1 + 8 alpha^{-1}) d max{K_{Sigma*} K_{Gamma*}, K_{Sigma*}^3 K_{Gamma*}^2}}, p^tau), with probability at least 1 - 1/p^{tau - 2}: (1) ||Theta_hat - Theta*||_\infty <= 2(1 + 8 alpha^{-1}) K_{Gamma*} delta_bar_f(n, p^tau); (2) E(Theta_hat) subseteq E(Theta*) and sign(Theta_hat_{ij}) = sign(Theta*_{ij}) for all (i, j) in E(Theta*) when theta_min := min_{(i,j) in E(Theta*)} |Theta*_{ij}| > 4(1 + 8 alpha^{-1}) K_{Gamma*} delta_bar_f(n, p^tau); (3) |||Theta_hat - Theta*|||_F <= 2(1 + 8 alpha^{-1}) K_{Gamma*} sqrt(s + p) delta_bar_f(n, p^tau) and |||Theta_hat - Theta*|||_2 <= 2(1 + 8 alpha^{-1})
    K_{Gamma*} min{sqrt(s + p), d} delta_bar_f(n, p^tau) (Corollary 3, p. 13, Equations 41a-b); and (4) the inverse estimator Sigma_hat_hat := (Theta_hat)^{-1} satisfies ||Sigma_hat_hat - Sigma*||_\infty <= C_3 delta_bar_f(n, p^tau) + C_4 d [delta_bar_f(n, p^tau)]^2 and |||Sigma_hat_hat - Sigma*|||_2 <= C_3 d delta_bar_f(n, p^tau) + C_4 d^2 [delta_bar_f(n, p^tau)]^2 (Corollary 4, p. 14, Equations 45-46). Specializing via Lemma 1 (p. 6; Appendix D, pp. 30-31) to sub-Gaussian X_i / sqrt(Sigma*_{ii}) yields delta_bar_f(n, p^tau) = O(sqrt((tau log p)/n)) and sample complexity n = Omega(d^2 log p) (Corollary 1, p. 9, Equation 31), while specializing via Lemma 2 (p. 7; Appendix E, pp. 32-33) to bounded 4m-th moments E[(X_i / sqrt(Sigma*_{ii}))^{4m}] <= K_m yields delta_bar_f(n, p^tau) = O(sqrt(p^{tau/m}/n)) and sample complexity n = Omega(d^2 p^{tau/m}) (Corollary 2, p. 10, Equation 33).'
