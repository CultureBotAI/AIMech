limitations:
- "Exact sparsity and signed edge recovery (Theorems 1(b) and 2) require the edge-Hessian mutual incoherence condition |||Gamma*_{S^c S}(Gamma*_{SS})^{-1}|||_\\infty <= 1 - alpha (Assumption 1, p. 8, Equation 28), which can fail in correlation regimes where nodewise Lasso irrepresentability still holds\u2014for example, |rho| in [0.2071, 0.5) on the 4-node diamond graph and |rho| in [0.4142, 1) on the 4-node star graph (Section 3.4, pp. 11-13, Figure 2)."
- For sub-Gaussian tails with bounded complexity parameters (K_{Sigma*}, K_{Gamma*}, alpha), the sufficient sample size n = Omega((d^2 + theta_min^{-2}) log p) scales quadratically in the maximum degree d, compared with n = Omega((d + theta_min^{-2}) log p) for nodewise Lasso neighborhood selection (Section 3.4, pp. 11-12; Section 5.2, p. 23).
- For heavy-tailed random vectors satisfying only a 4m-th moment bound (Lemma 2 and Corollary 2, pp. 7, 10), the sample complexity n = Omega(d^2 p^{tau/m}) and elementwise l_infty rate O(sqrt(p^{tau/m}/n)) scale polynomially rather than logarithmically in the ambient dimension p.
- 'Primary-source typographical audit of arXiv:0811.3628v1: (1) Equations (13)-(14) (p. 6) and (19) (p. 7) write the inverse tail functions as n_bar_f(r; delta) and delta_bar_f(r; n) with r first, whereas Equation (15) and Sections 2.3.2 and 3-4 write n_bar_f(delta, r) and delta_bar_f(n, r) with n or delta first; (2) Section 3.4.1 (p. 12) prints (-0.2017, 0.2017) for the root of 4|rho|(|rho| + 1) < 1, whereas the exact positive root is (sqrt(2) - 1)/2 approx 0.20710678 (transposing digits 7 and 1); (3) Section 4.5 (p. 20, Equation 69) writes K_{Sigma*}^3 ||Delta_hat||_\infty^2 with the elementwise norm in place of the operator norm K_{Sigma*}^3 |||Delta_hat|||_\infty^2; (4) Appendix A (p. 27, line 9) writes ''a matrix Sigma_hat > 0 is optimal'' instead of ''a matrix Theta_hat > 0 is optimal''; (5) Appendix D (p. 30, Lemma 9(b) and proof; p. 31, Lemma 10) writes 2(1 - rho*_{ij}) in the first term of Lemma 9(b) instead of 2(1 + rho*_{ij}) (corrected in Equation 81), writes subscripts (s, t)
  in place of (i, j) in the proof of Lemma 9(b), and writes (U^{(k)}_i)^2 in place of (U^{(k)}_{ij})^2 in Lemma 10; and (6) Appendix E (p. 33, line 11) writes K_m[Sigma*_{ij} Sigma*_{ij}]^m + [Sigma*_{oj}]^{2m} in place of K_m[Sigma*_{ii} Sigma*_{jj}]^m + [Sigma*_{ij}]^{2m}.'
