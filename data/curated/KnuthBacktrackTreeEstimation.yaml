aio_no_match:
  search_scope: Compared all 442 pinned AIO and 642 native IDs, names, aliases and scoped synonyms; no
    normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
    discovery and original Documents checkouts returned 20, 0, 0 lines. All distinct match contents were
    inspected. Semantic matching covered 66 AIO and 346 native definitions, with every matched definition
    read. 13 full annotated AIO node/edge/generated contexts and 5 full native records were inspected.
    Retain the fixed-tree path estimator using degree or inverse-selection-probability weights. Chen’s
    weighted-stratum estimator generalizes its depth-only uniform form but adds merging across strata.
    CDP extrapolates a conditional domain model; IDA*IM controls an actual search; Gumbel top-k draws
    configurations without replacement and TreeSHAP computes feature attributions.
  rationale: No suitable AIO counterpart was established for the inspected path-weighted backtracking-tree
    estimator. Classifiers, bias phenomena, broad learning tasks and stochastic-network models have different
    identities; this no-match assessment is bounded to the pinned snapshot and inspected contexts.
  examined_targets:
  - target: AIO:DecisionTree
    rejection_reason: The pinned class is a classification task. This method estimates additive properties
      of a backtracking search tree rather than fitting a classifier.
  - target: AIO:MarkovChain
    rejection_reason: A sampled path can be modeled stochastically, but the full method is an inverse-probability
      additive-cost estimator over an actual implicit tree. A generic stochastic-network model does not
      identify this estimator; no direct counterpart was established.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: The record is a sampling algorithm with an expectation claim, not the computational
      bias phenomenon defined by this class.
  - target: AIO:MathematicalFunction
    rejection_reason: The additive tree functional is an input; the maintained identity is the randomized
      estimation procedure.
  - target: AIO:MachineLearningTask
    rejection_reason: The algorithm samples an existing implicit tree and need not learn a model or perform
      a machine-learning task.
  - target: AIO:RegressionAnalysis
    rejection_reason: No response-surface regression is required for the weighted tree estimate.
  - target: AIO:ReinforcementLearning
    rejection_reason: Sampling tree nodes to estimate a sum does not learn a reward-maximizing policy
      or define exploration–exploitation control.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: The search tree is not asserted to factor a joint distribution of random variables;
      no graphical-model learning task is required.
  - target: AIO:BayesianNetwork
    rejection_reason: An implicit rooted search tree is not by itself a Bayesian-network factorization
      or a sampler from its joint law.
  - target: AIO:GraphLanguageModel
    rejection_reason: No graph-based language model is required.
  - target: AIO:ReasoningLLM
    rejection_reason: The procedure is not a language-model reasoning architecture.
  - target: AIO:RecursiveLanguageModel
    rejection_reason: Tree-structured neural language composition is distinct from randomized additive
      tree-functional estimation.
  - target: AIO:ComputationalBias
    rejection_reason: Statistical bias is a property discussed when assessing estimators, not the identity
      of this sampling procedure.
limitations:
- A node in an implicit search tree denotes its path occurrence. Repeated graph states are not automatically
  deduplicated, and adaptive pruning can change the target tree.
- Sampling probabilities must preserve support for contributions to the target and must be used in the
  actual weight update. Oracle subtree-cost probabilities are a characterization, not a practical exact-counting
  procedure for an unknown tree.
- The source variance bound has nonnegative-cost, bounded-ratio and finite-depth assumptions. No universal
  finite-sample relative-error or confidence guarantee is asserted.
- Constructed examples distinguish a five-node tree from an additive cost total of fifteen, and show that
  biased child selection with unchanged degree weights estimates six rather than five. These are finite
  boundary checks, not author-code execution.
- All sixteen Knuth journal pages and twenty-one Chen journal pages were visually inspected. Other versions,
  source implementations and modern benchmark replication were not inspected or executed.
