id: AIMech:KnuthBacktrackTreeEstimation
name: Knuth backtrack-tree estimation
aliases:
- Knuth tree-size estimator
concept_kind: algorithm
definition: A randomized estimator of additive properties of a fixed backtracking tree that follows a
  sampled root-to-terminal path and weights each visited node contribution by the inverse probability
  of reaching it.
identity_notes: Compared all 442 pinned AIO and 642 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 20, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 66 AIO and 346 native definitions, with every matched definition
  read. 13 full annotated AIO node/edge/generated contexts and 5 full native records were inspected. Retain
  the fixed-tree path estimator using degree or inverse-selection-probability weights. Chen’s weighted-stratum
  estimator generalizes its depth-only uniform form but adds merging across strata. CDP extrapolates a
  conditional domain model; IDA*IM controls an actual search; Gumbel top-k draws configurations without
  replacement and TreeSHAP computes feature attributions.
definition_evidence:
- source_id: knuth1975backtrack
  locator: Sections 2–3, PDF pp. 4–7 / printed pp. 124–127, Algorithms B and E
  relation: supports
claims:
- claim_id: uniform-path-weights
  kind: mechanism
  statement: In the uniform form, start at the root with weight one, choose one eligible child uniformly
    at each step, and multiply the path weight by the number of eligible children. Accumulate the current
    weight times the node contribution, including the root, until the path terminates. The target backtracking
    program traverses the feasible tree, while a sampling trial follows only one path.
  evidence:
  - source_id: knuth1975backtrack
    locator: Sections 2–3, PDF pp. 4–7 / printed pp. 124–127, Algorithm E1–E4 and Theorem 1
    relation: supports
- claim_id: positive-probability-variant
  kind: mechanism
  statement: The importance-sampling variant selects a child using specified positive probabilities and
    divides the path weight by the actual probability of the selected child. Retaining ordinary degree
    weights after a nonuniform choice generally changes the expectation. The zero-variance characterization
    uses probabilities proportional to true nonnegative subtree costs; it requires information normally
    unknown to the estimator and appropriate treatment of zero-cost branches.
  evidence:
  - source_id: knuth1975backtrack
    locator: Section 5, PDF pp. 9–11 / printed pp. 129–131, E4-prime and Theorem 2
    relation: supports
- claim_id: fixed-tree-additive-scope
  kind: scope
  statement: For a finite fixed tree and defined node contributions with the required sampling support,
    the expectation equals the additive tree total. Constant-one contributions estimate node count, and
    terminal or level indicators estimate corresponding profiles. Node count does not by itself determine
    runtime when work varies across nodes. The paper explicitly excludes direct application to branch-and-bound
    with changing bounds, while allowing work estimates for testing a specified bound.
  evidence:
  - source_id: knuth1975backtrack
    locator: Sections 3 and 7, PDF pp. 6–7 and 15 / printed pp. 126–127 and 135
    relation: supports
- claim_id: relationship-to-stratified-estimation
  kind: scope
  statement: Chen’s later weighted-stratum estimator includes uniform single-path tree sampling as its
    depth-only specialization. Grouping additional nodes into ordered strata and merging weighted representatives
    extends that mechanism. This record retains the earlier path estimator and its positive-probability
    variant; arbitrary stratum-merging rules belong to the later method.
  evidence:
  - source_id: chen1992hs
    locator: Sections 2–3.2, PDF pp. 2–4 / printed pp. 296–298
    relation: supports
- claim_id: finite-trial-and-cost-limits
  kind: limitation
  statement: Unbiasedness is an expectation statement, not a guarantee that a finite set of probes finds
    rare deep nodes or produces a precise estimate. The reported knight-tour table includes zero estimated
    counts at deep levels with nonzero actual counts. Generating eligible children, evaluating costs and
    choosing probabilities require work, so a path-length bound is not a universal runtime bound. Contracting
    nodes preserves an additive target only if absorbed contributions remain included.
  evidence:
  - source_id: knuth1975backtrack
    locator: Sections 4–7, PDF pp. 8–15 / printed pp. 128–135, Table 1 and node-contraction discussion
    relation: supports
