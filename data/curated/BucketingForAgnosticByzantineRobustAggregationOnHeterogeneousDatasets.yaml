claims:
- claim_id: bucketing-random-permutation-bucket-averaging-and-variance-reduction-lemma
  kind: mechanism
  statement: Given n independent worker vectors {x_1, ..., x_n} with good subset G of size |G| >= n(1 - delta) and pairwise variance E||x_i - x_j||^2 <= rho^2, Algorithm 1 draws a uniform random permutation pi of [n], averages consecutive blocks of s vectors into y_i = (1/s) sum_{k=(i-1)s+1}^{min(n, is)} x_{pi(k)}, and passes {y_1, ..., y_{ceil(n/s)}} to AGGR; Lemma 1 proves that at least ceil(n/s)(1 - delta s) good buckets satisfy E[y_i] = E[bar{x}] and reduced pairwise variance E||y_i - y_j||^2 <= rho^2 / s.
  evidence:
  - source_id: r538-primary-pdf
    locator: Section 4.1, Algorithm 1 & Lemma 1, p. 5; Appendix C.1, pp. 19-20
    relation: supports
- claim_id: bucketing-aragg-composition-and-non-iid-lower-bound-theorems
  kind: scope
  statement: Theorem I proves that choosing s = floor(delta_{max} / delta) turns Krum (delta_{max} < 1/4), Geometric Median / RFA (delta_{max} < 1/2), and Coordinate-Wise Median (delta_{max} < 1/2) into variance-agnostic (delta_{max}, c)-ARAGG aggregators with optimal error O(delta rho^2) (or O(d delta rho^2) for CM); combining ARAGG with worker momentum (Algorithm 2) achieves O(c delta zeta^2 + sigma sqrt(L F^0 (c delta + 1/n)/T) + L F^0 / T) (Theorem II), matching the information-theoretic non-IID lower bound Omega(delta zeta^2) (Theorem III) and achieving exact convergence to 0 under overparameterized strong growth B^2 < 1/(60 c delta) (Theorem IV).
  evidence:
  - source_id: r538-primary-pdf
    locator: Section 4.2, Definition A & Theorem I, pp. 5-6; Section 5.2-5.4, Theorems II-IV, pp. 7-8
    relation: supports
- claim_id: bucketing-byzantine-fraction-amplification-and-irreducible-heterogeneity-radius-limitation
  kind: limitation
  statement: s-Bucketing amplifies the worst-case fraction of contaminated buckets by up to a factor of s (from delta to s delta <= delta_{max}), limiting the maximum bucket size to floor(delta_{max} / delta), and without overparameterization any Byzantine-robust algorithm suffers an irreducible stationarity error Omega(delta zeta^2) under non-IID heterogeneity zeta^2 > 0 (Theorem III).
  evidence:
  - source_id: r538-primary-pdf
    locator: Section 4.1, Remark 2, p. 5; Section 5.3, Theorem III & Remark 5, p. 7; Appendix D, pp. 23-24
    relation: supports
- claim_id: bucketing-non-iid-federated-defense-against-mimic-alie-and-ipm-attacks-application
  kind: application
  statement: Applied to Byzantine-robust federated learning on non-IID and long-tailed partitions of MNIST against the Mimic attack (which copies a fixed honest worker along the top Oja streaming eigenvector to induce class-imbalance bias), ALIE, Inner Product Manipulation (IPM), bit-flipping, and label-flipping attacks.
  evidence:
  - source_id: r538-primary-pdf
    locator: Section 3.2, Table 2, p. 4; Section 6, Tables 3-4 & Figures 1-2, pp. 8-9; Appendix B, pp. 18-19
    relation: supports
