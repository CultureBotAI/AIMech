claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Fuse the FFT, pointwise spectral product and inverse FFT to avoid intermediate off-chip transfers;
    factor the FFT into block matrix multiplications suited to specialized hardware. When the sequence
    exceeds the chosen on-chip working capacity, compute chunk convolutions and propagate the state-space
    boundary state between chunks.
