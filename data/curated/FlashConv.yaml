name: FlashConv
definition: An execution algorithm for state-space sequence convolutions that fuses FFT-based convolution
  in GPU on-chip memory, uses block FFT matrix multiplications and passes state between chunks for longer
  sequences.
concept_kind: algorithm
identity_notes: FlashConv is the convolution-execution contribution in the H3 paper, distinct from the
  H3 layer and from FlashAttention's attention-computation algorithm.
limitations:
- The paper's 8K on-chip threshold concerns its stated A100 setting; no device-independent cutoff or wall-clock
  speedup is asserted.
- Block FFT may use more arithmetic than a conventional FFT while exploiting specialized matrix hardware.
- The printed Algorithm 2 mixes chunk variable names and its exact boundary indexing was not implemented
  or verified here. This record supports the execution strategy, not a certified literal transcription
  of the pseudocode.
id: AIMech:FlashConv
