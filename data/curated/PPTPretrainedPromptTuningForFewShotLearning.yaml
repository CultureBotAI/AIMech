claims:
- claim_id: r722-claim-self-supervised-pvp-formats
  kind: mechanism
  statement: "PPT designs self-supervised pre-training Pattern-Verbalizer Pairs on 10GB unlabeled corpora (OpenWebText and WuDaoCorpora) for three task families\u20143-class document-coherent next sentence prediction for sentence-pair classification, multi-option next sentence selection for multiple-choice classification, and pseudo-labeled single-sentence classification\u2014and further unifies all three into a single variable-option (2 to 16 options) multiple-choice pre-training format (Unified PPT)."
  evidence:
  - source_id: r722-primary-pdf
    locator: Section 3.2-3.3 & Appendix C.3, Equations 3-5, Table 9, pp. 4-5, 13
    relation: supports
- claim_id: r722-claim-parameter-and-memory-efficiency
  kind: mechanism
  statement: "With 100 soft tokens of dimension 4096 on 11B-parameter backbones (T5-XXL and CPM-2), PPT tunes only 409,600 (~410K) parameters per task\u2014nearly 27,000x (over 3,000x in storage) smaller than full-model tuning\u2014while reducing per-step training time from 4,416 ms to 794 ms and GPU memory from 259 GB to 72 GB on SST-2."
  evidence:
  - source_id: r722-primary-pdf
    locator: Section 4.1 & Appendix E, Table 10, pp. 6, 13-14
    relation: supports
- claim_id: r722-claim-few-shot-accuracy-and-variance
  kind: application
  statement: Across 15 English and Chinese benchmarks in the 32-sample few-shot setting on 11B-parameter T5-XXL and CPM-2 models, PPT and Unified PPT substantially outperform vanilla Prompt Tuning and LM Adaptation while dramatically reducing seed variance (e.g., improving English SST-2 from 70.5+-15.5 to 94.4+-0.3 and Chinese CCPM from 31.0+-9.7 to 85.4+-0.6, surpassing full-model fine-tuning).
  evidence:
  - source_id: r722-primary-pdf
    locator: Section 4.2, Tables 4-5, pp. 6-7
    relation: supports
- claim_id: r722-claim-convergence-and-pseudo-label-limitation
  kind: limitation
  statement: Single-sentence PPT relies on an external fine-tuned classifier (e.g., RoBERTa-base trained on Yelp-5) to annotate pseudo-labels and cannot directly generalize to arbitrary non-sentiment single-text domains with many classes unless reformulated via Unified PPT, and soft prompt optimization still requires a much larger learning rate (5e-3 to 5e-2) and more training steps to converge than full-model fine-tuning.
  evidence:
  - source_id: r722-primary-pdf
    locator: Section 3.2.3, Section 4.2-4.3, and Appendix C.2, Figure 5, pp. 5, 7-8, 12-13
    relation: supports
