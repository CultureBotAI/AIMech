id: AIMech:PPTPretrainedPromptTuningForFewShotLearning
name: PPT Pre-Trained Prompt Tuning for Few-Shot Learning
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient few-shot prompt-tuning framework that groups downstream classification tasks into format-specific or unified multiple-choice Pattern-Verbalizer Pairs PVP_i^pre = (f_i^pre, v_i^pre), pre-trains a sequence of continuous soft prompt embeddings P_i on large-scale unlabeled corpora via self-supervised cloze objectives arg max_P sum_x log p(<X> = v(y) | [P; f(x)]; P) with all pretrained language model weights frozen, and uses P_i to initialize downstream few-shot soft prompt optimization.
identity_notes: Distinct from vanilla Prompt Tuning (Lester et al., EMNLP 2021, AIMech:PromptTuning), which initializes soft prompts randomly or from vocabulary word embeddings and suffers high variance and poor accuracy in few-shot settings, and from SPoT (Vu et al., ACL 2022, AIMech:SPoTSoftPromptTransfer), which transfers soft prompts from supervised source tasks rather than self-supervised pre-training on unlabeled corpora via unified Pattern-Verbalizer Pairs.
aliases:
- PPT
- Pre-trained Prompt Tuning
- Hybrid PPT and Unified PPT
- Self-Supervised Pre-Trained Soft Prompt Tuning
