aio_mappings:
- target: AIO:DropoutLayer
  relation: related_match
  rationale: The procedure approximates computations under Bernoulli dropout, whereas the pinned layer
    actually samples masks and rescales retained inputs. Algorithm and layer are related without equivalence
    or subclass assertion.
- target: AIO:GaussianDropoutLayer
  relation: related_match
  rationale: Both involve Gaussian approximations to multiplicative dropout effects, but fast dropout
    also includes moment integration and variance propagation; it is not identical to the pinned training-only
    layer that injects one-centered Gaussian noise.
limitations:
- Retention probability p in the moment formulas is one minus the dropout probability. Scaling conventions
  must be reconciled before comparing with an inverted-dropout implementation.
- Means and variances do not identify every non-Gaussian distribution. Cross-coordinate or temporal correlations
  and nonlinear moment closure can invalidate an independent Gaussian approximation.
- Fast dropout denotes an approximation algorithm, not every Gaussian-noise layer, a new recurrent architecture,
  or a fixed optimizer. Its recurrent application is retained within this method record.
- Source notation and broad regularization/stability claims are qualified by the actual moment formulas
  and local derivative scope. No exact Bayesian posterior, universal generalization improvement or hardware
  speedup is asserted.
- The complete 9-page original and 12-page v7 recurrent followup were visually inspected. Constructed
  finite calculations check mathematical boundaries only; author code, training and empirical replication
  were not performed.
