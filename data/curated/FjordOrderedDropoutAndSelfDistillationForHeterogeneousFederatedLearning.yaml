claims:
- claim_id: r448-ordered-dropout-svd-best-low-rank-equivalence
  kind: mechanism
  statement: Theorem 1 (Section 3.2, p. 4) proves that for a two-layer linear network trained under Ordered Dropout with positive-probability prefix rates p in {j/K}_{j=1}^K, any global optimum orders the hidden units by singular value magnitude so that every prefix submodel of width b in {1, ..., K} equals the exact Eckart-Young-Mirsky best rank-b approximation of the full mapping.
  evidence:
  - source_id: r448-primary-pdf
    locator: Section 3.2 Theoretical Analysis (Theorem 1), p. 4 & Appendix A Proof of Theorem 1
    relation: supports
- claim_id: r448-self-distillation-and-tier-aware-slice-aggregation-mechanism
  kind: mechanism
  statement: During local client training, FjORD uses the soft predictions of the client's largest runnable submodel p_max^i as a self-distillation teacher for smaller sampled prefix submodels p < p_max^i (Section 3.3), and the server updates each incremental parameter slice w_{ceil(p_j K)} \ w_{ceil(p_{j-1} K)} exclusively over clients with capability p_max^i >= p_j (Section 4, Equation 1).
  evidence:
  - source_id: r448-primary-pdf
    locator: Section 3.3 Knowledge Distillation & Section 4 FjORD (Equation 1, Algorithm 1), pp. 5-7
    relation: supports
- claim_id: r448-prefix-width-grid-and-separate-bn-statistics-limitation
  kind: limitation
  statement: Ordered Dropout restricts submodels to a discrete set of prefix width rates P = {p_1, ..., p_M}, requires maintaining separate Batch Normalization layers per width rate p in P, and increases local forward/backward passes when computing both the teacher pass at p_max^i and student pass at p < p_max^i.
  evidence:
  - source_id: r448-primary-pdf
    locator: Section 3.1 Ordered Dropout Architecture & Section 3.3 Knowledge Distillation, pp. 3-5
    relation: supports
- claim_id: r448-cifar10-femnist-and-shakespeare-multi-tier-deployment-application
  kind: application
  statement: Applied to heterogeneous-device federated learning and dynamic test-time width scaling on CIFAR-10 (ResNet-18), FEMNIST (CNN), and Shakespeare (RNN).
  evidence:
  - source_id: r448-primary-pdf
    locator: Section 5 Experimental Evaluation (Figures 3-6, Tables 1-2), pp. 7-9
    relation: supports
