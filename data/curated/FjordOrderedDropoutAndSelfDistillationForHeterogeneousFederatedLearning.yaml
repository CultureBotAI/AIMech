id: AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning
name: FjORD (Fair and Accurate Federated Learning under Heterogeneous Targets with Ordered Dropout)
concept_kind: algorithm
review_status: DRAFT
definition: 'A system-heterogeneous federated learning method (Horvath, Laskaridis, Almeida, Leontiadis, Venieris, & Lane 2021, Sections 3-4, Equation 1, Theorem 1) that performs Ordered Dropout (OD) by sampling a prefix width rate p ~ D_P up to each client''s maximum device capability p_max^i and pruning the rightmost channels to retain only prefix indices {0, ..., ceil(p * K_l) - 1} in each layer l, combines OD with client-side self-distillation from the client''s maximal submodel F_{p_max^i} to smaller sampled prefix submodels F_p, and aggregates disjoint width slices w_j = w_{ceil(p_j K)} \ w_{ceil(p_{j-1} K)} on the server over eligible clients {i : p_max^i >= p_j} (Equation 1).'
identity_notes: Distinct from HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning, Diao et al. 2021), which trains each client only at its single static capability width p_max^i rather than stochastically sampling all prefix widths p <= p_max^i via Ordered Dropout and self-distillation to enforce SVD-ordered representation importance across nested submodels.
aliases:
- FjORD
- Federated Learning with Ordered Dropout
- Ordered Dropout for Heterogeneous Federated Learning
