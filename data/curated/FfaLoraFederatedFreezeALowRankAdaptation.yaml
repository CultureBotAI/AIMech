claims:
- claim_id: ffa-lora-exact-linear-aggregation-and-dp-noise-linearization-mechanism
  kind: mechanism
  statement: By fixing the randomly initialized projection matrix A_0 in R^{r x k} and updating only the zero-initialized matrix B in R^{d x r}, FFA-LoRA makes the weight increment Delta W_i = B_i A_0 linear in the trainable parameters so server FedAvg satisfies W_tilde^+ = W_0 + ((1/2)(B_1 + B_2)) A_0 = W_0 + (1/2)(B_1 A_0 + B_2 A_0) = W^+ with zero bilinear cross-term error (Eq. 4, p. 5), and under DP-SGD perturbations xi_B updates W_0 + (B + xi_B) A_0 = W_0 + B A_0 + xi_B A_0 without the quadratic noise cascade term xi_B xi_A of vanilla LoRA (Section 3, p. 4; Section 4, p. 6).
  evidence:
  - source_id: r510-primary-pdf
    locator: Section 3 Discordances 1-2, Eq. (3), Figure 1, pp. 4-5; Section 4, Eq. (4), pp. 5-6
    relation: supports
- claim_id: ffa-lora-infinite-alpha-limit-and-lipschitz-smoothness-preservation-scope
  kind: scope
  statement: Theorem 1 (p. 6; proof in Appendix A.2, pp. 13-14) proves that for identical initial weight W_0 + B_0 A_0 and learning rate scaling eta_alpha = eta_1 / alpha^2, the local update trajectory {W_{alpha_LoRA}^k} of vanilla LoRA converges to the alpha-invariant trajectory {W_{alpha_FFA}^k} of FFA-LoRA in the limit lim_{alpha_LoRA -> inf} W_{alpha_LoRA}^k = W_{alpha_FFA}^k (Eq. 5); moreover, Theorem 2 (Appendix A.1, p. 13) proves that if F(W, D) is L-Lipschitz smooth in W and ||A_0||_F <= C, then F(W_0 + B A_0) is (L C^2)-Lipschitz smooth with respect to B, whereas joint (A, B) LoRA has no global Lipschitz smoothness constant.
  evidence:
  - source_id: r510-primary-pdf
    locator: Section 4 Theorem 1, Eq. (5), p. 6; Appendix A.1 Theorem 2, p. 13; Appendix A.2 Proof for Theorem 1, pp. 13-14
    relation: supports
- claim_id: ffa-lora-frozen-random-subspace-expressivity-at-very-low-rank-limitation
  kind: limitation
  statement: Because row subspace A_0 in R^{r x k} is frozen at random initialization, FFA-LoRA cannot rotate A_0 toward task-specific right singular vectors and exhibits slightly lower non-private accuracy than equal-rank vanilla LoRA at very small rank r = 2 (e.g., 88.56% vs 91.76% on QNLI at r = 2 in Table 4, p. 9, though outperforming LoRA when compared at equal trainable parameter count r_FFA = 2 r_LoRA).
  evidence:
  - source_id: r510-primary-pdf
    locator: Section 5.2 Ablation Study, Tables 3-4, pp. 8-9; Appendix A.4 Table 6, p. 16
    relation: supports
- claim_id: ffa-lora-differentially-private-federated-llm-and-vit-fine-tuning-application
  kind: application
  statement: Applied to privacy-preserving (DP-SGD with eps in {1, 3, 6}, delta = 10^-5) and non-IID cross-silo federated fine-tuning of RoBERTa-Large on GLUE (MNLI, SST-2, QQP, QNLI), LLaMA-7B on GSM-8K mathematical reasoning, and Vision Transformer (ViT) on Food-101.
  evidence:
  - source_id: r510-primary-pdf
    locator: Section 5 Experiments, Tables 1-4, pp. 6-9; Appendix A.3 Table 5 & Appendix A.7 Table 8, pp. 14-17
    relation: supports
