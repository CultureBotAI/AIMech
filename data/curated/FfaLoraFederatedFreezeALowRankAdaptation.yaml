id: AIMech:FfaLoraFederatedFreezeALowRankAdaptation
name: 'FFA-LoRA: Federated Freeze-A Low-Rank Adaptation'
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient and differentially private federated fine-tuning algorithm (Federated Freeze A LoRA / FFA-LoRA; Sun, Li, Li, and Ding, ICLR 2024) that re-parameterizes each adapted weight matrix W in R^{d x k} as W = W_0 + B A_0 with B in R^{d x r} initialized to zero (B_0 = 0) and A_0 in R^{r x k} initialized from a random Gaussian (or orthogonal/SVD) distribution and kept strictly frozen throughout local training and server aggregation. By updating and aggregating only B, FFA-LoRA halves the trainable parameter count and communication cost relative to vanilla LoRA, eliminates the server-side cross-client aggregation error ((1/n) sum_i B_i) A_0 = (1/n) sum_i (B_i A_0) (Eq. 4), removes the quadratic non-Gaussian DP-SGD noise amplification term xi_B xi_A so injected noise enters linearly as xi_B A_0, and achieves dynamics invariant to the LoRA scaling factor alpha (equivalent to the alpha -> infinity limit of vanilla LoRA, Theorem 1).
identity_notes: "Distinct from vanilla federated LoRA / FedIT (Zhang et al., 2023; Kuang et al., 2023), which jointly trains both low-rank matrices A and B on each client and averages them separately on the server\u2014incurring the bilinear aggregation error (1/2)(B_1 + B_2)(1/2)(A_1 + A_2) != (1/2)(B_1 A_1 + B_2 A_2) (Eq. 3) and quadratic DP-SGD noise amplification xi_B xi_A. Distinct from FLoRA (AIMech:FloraStackingBasedFederatedHeterogeneousLowRankAdaptation; Wang et al., NeurIPS 2024), which trains both A_k and B_k on clients and eliminates cross-term aggregation noise by stacking A_k vertically and B_k horizontally on the server rather than freezing A_0 globally across clients. Also encompasses the authors' ultra-low-budget QVP Adapter extension W = W_0 + Q_0 V P_0 with frozen Q_0 in R^{d x r}, P_0 in R^{r x k} and trainable zero-initialized V in R^{r x r} (Appendix A.4, p. 16)."
aliases:
