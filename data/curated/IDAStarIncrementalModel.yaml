aio_no_match:
  search_scope: Compared all 442 pinned AIO and 637 native IDs, names, aliases and scoped synonyms; no
    normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
    discovery and original Documents checkouts returned 458, 252, 250 lines. All distinct match contents
    were inspected. Semantic matching covered 8 AIO and 83 native definitions, with every matched definition
    read. 6 full annotated AIO node/edge/generated contexts and 3 full native records were inspected.
    Retain IDA*IM, which learns a conditional increment model to select cost bounds and uses final branch-and-bound.
    Ordinary IDA* uses minimum-exceeded thresholds; RBFS controlled re-expansion changes backed-up subtree
    values; BFIDA* changes the traversal to breadth first. The separately usable estimator and a learned
    admissible heuristic have different scopes.
  rationale: No suitable mapping for this complete adaptive state-space search algorithm was established
    in the inspected AIO snapshot. A graph-based language model, a general learning task and the arithmetic
    functions used by an estimator are different scopes.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: A language model over graph-structured inputs is not an adaptive shortest-path search
      procedure.
  - target: AIO:ReasoningLLM
    rejection_reason: Language-model deduction does not identify cost-bounded depth-first search or histogram-based
      threshold control.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: The algorithm does not require a neural language model or a hybrid neural-symbolic
      architecture.
  - target: AIO:MachineLearningTask
    rejection_reason: Learning a search-effort model is a component, but this record denotes a full search
      algorithm rather than the general task of constructing learning methods.
  - target: AIO:MathematicalFunction
    rejection_reason: Evaluation and convolution functions are components rather than the stateful search
      procedure.
  - target: AIO:ReinforcementLearning
    rejection_reason: The source fits increment counts from traversed nodes; it does not define a reward-based
      policy or value-learning procedure balancing exploration and exploitation.
limitations:
- The record is scoped to the IDA*IM search integration in the inspected 2013 author manuscript. The standalone
  incremental estimator can also be trained offline; it is not equivalent to the complete search procedure.
- 'The source contains shorthand or inconsistent details: the page 6 branching-factor prose reverses the
  usual offspring-per-parent ratio, and Figure 3 is not certified here as executable pseudocode. The record
  follows the prose mechanism and count-convolution analysis while retaining these interpretation limits.'
- Consistency means nondecreasing f, not necessarily strictly increasing f. Goal-zero conventions, valid
  lower bounds, finite relevant contours and terminating branch-and-bound remain part of any correctness
  claim; unrestricted admissibility alone is insufficient.
- The source’s ideal uniform-tree convolution argument does not prove model accuracy for general spaces.
  A chosen distance estimate need not be zero only at goal states; the paper’s proposed solution-cost
  extension remains outside this curated procedure.
- All 24 author-manuscript pages were visually inspected. The publisher journal layout, earlier conference
  full text and author implementation were not inspected. Constructed arithmetic checks are not search
  benchmarks or empirical replication.
