id: AIMech:IDAStarIncrementalModel
name: IDA* with an Incremental Model
aliases:
- IDA*IM
concept_kind: algorithm
definition: An iterative-deepening heuristic search algorithm that learns a conditional model of search-tree
  cost increments, predicts later cost thresholds to target increased expansion counts, and completes
  the goal-finding iteration by branch-and-bound.
identity_notes: Compared all 442 pinned AIO and 637 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 458, 252, 250 lines. All distinct match contents
  were inspected. Semantic matching covered 8 AIO and 83 native definitions, with every matched definition
  read. 6 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. Retain
  IDA*IM, which learns a conditional increment model to select cost bounds and uses final branch-and-bound.
  Ordinary IDA* uses minimum-exceeded thresholds; RBFS controlled re-expansion changes backed-up subtree
  values; BFIDA* changes the traversal to breadth first. The separately usable estimator and a learned
  admissible heuristic have different scopes.
definition_evidence:
- source_id: burns2013im
  locator: Sections 3–4.1, author-manuscript PDF pp. 5–11
  relation: supports
claims:
- claim_id: incremental-search-model
  kind: mechanism
  statement: During cost-bounded depth-first search, the method records changes in f=g+h and an integer
    distance-to-go estimate between parents and children, conditioned on selected node types, parent distance
    and, online, search depth. Histograms represent real-valued cost increments. Backoff models omit conditioning
    features when data are unavailable. The learned model predicts search effort; it does not replace
    the admissible heuristic with an unconstrained learned estimate.
  evidence:
  - source_id: burns2013im
    locator: Sections 3–3.1, PDF pp. 5–7; Section 4, p. 10
    relation: supports
- claim_id: histogram-extrapolation
  kind: mechanism
  statement: The predictor propagates f-value mass through conditional offspring-increment histograms
    by additive convolution, accumulating estimated counts across depths. It can start from the root or
    from a fully generated shallow layer. Estimated mass and a target count determine a simulated bound,
    with pruning and a small-mass stopping criterion. The uniform-tree exactness result assumes an accurate
    increment model and h=0; it does not certify predictions after approximate binning, backoff or unmodeled
    dependencies in arbitrary trees.
  evidence:
  - source_id: burns2013im
    locator: Section 3.2, PDF pp. 7–9, Equation 1; Section 4.1, p. 11; Theorem 4, pp. 12–13; Appendix
      A, p. 24
    relation: supports
- claim_id: threshold-control-and-fallback
  kind: mechanism
  statement: 'After an iteration without a goal, the method predicts a threshold intended to yield twice
    the preceding expansion count. The next threshold is bounded below by the smallest f value pruned
    in the completed iteration, preventing a low prediction from repeating or reducing the cutoff. A single
    model is updated from newly encountered search portions, and the configured ancestor-cycle check also
    excludes cyclic successors from model learning. The target is an estimate: discrete f-contours can
    make exact doubling impossible.'
  evidence:
  - source_id: burns2013im
    locator: Sections 4–4.1, PDF pp. 10–11; Section 5.2 and Figure 6, p. 16
    relation: supports
- claim_id: final-iteration-and-correctness-scope
  kind: limitation
  statement: A predicted threshold can exceed the cheapest solution cost, so the first encountered goal
    is not automatically optimal. The final iteration continues branch-and-bound below the incumbent cost
    and replaces it when a cheaper goal is found. The correctness argument relies on admissible lower
    bounds and completion of the required searches; finite relevant contours and the usual termination
    conditions must be retained. Consistency or pathmax supplies the nondecreasing path evaluations used
    by the model. Admissibility alone is not an unconditional termination guarantee for arbitrary infinite
    search spaces.
  evidence:
  - source_id: burns2013im
    locator: Section 4, PDF p. 10; Section 4.2, pp. 11–13
    relation: supports
- claim_id: prediction-versus-runtime
  kind: limitation
  statement: 'The reported studies cover configured sliding-tile, vacuum-maze, synthetic-tree and weighted-pancake
    problems. Better expansion predictions do not guarantee lower CPU time: model and histogram maintenance
    add overhead, and histogram capacity affects predictions. The record does not assert universal speedups,
    an always-doubling expansion rate, constant memory for the complete learned model or equivalence to
    graph search with global duplicate elimination.'
  evidence:
  - source_id: burns2013im
    locator: Section 5, PDF pp. 13–21, Figures 4–10; Discussion, pp. 21–22; Appendix A, p. 24
    relation: supports
