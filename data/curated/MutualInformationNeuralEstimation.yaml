name: Mutual information neural estimation
definition: A mutual-information estimation procedure that trains a neural statistics function to maximize
  a Donsker–Varadhan objective contrasting joint samples with product-of-marginals samples, using stochastic
  optimization and an optional moving-average denominator for gradient estimation.
concept_kind: algorithm
identity_notes: 'MINE denotes the original neural Donsker–Varadhan estimator and its moving-average training
  heuristic. The paper’s alternative MINE-f objective is a different variational bound and is not silently
  equated with this record. MINE estimates dependence; DIM is a representation-learning framework that
  can use dependence critics, and InfoNCE is a different finite-candidate objective. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 203 preceding native IDs/names/aliases.
  Ignored-inclusive word-delimited searches of both full checkouts returned 52 worktree and 75 main-checkout
  lines: existing component discussions and discovery/review references, plus unrelated ignored dependency
  text in main. Short acronyms were compared in normalized identities. Four nearest maintained mechanisms
  and eleven exact AIO candidate nodes with direct parent edges were inspected.'
limitations:
- Finite-sample log-moment estimation is biased, can be unstable for large critic scores, and need not
  remain below true mutual information. Reusing samples for critic fitting adds selection effects.
- The moving-average denominator is a bias-reduction heuristic. Its fixed-denominator alternative-bound
  interpretation does not prove that a same-batch updated running statistic is independent of the current
  samples or that the original Donsker–Varadhan gradient is unbiased.
- Strong-consistency arguments separate neural approximation from empirical estimation under compactness,
  continuity and measure assumptions. The fixed-family uniform-convergence result is not a proof that
  stochastic gradient optimization reaches the required supremum. Bounded/Lipschitz critic sample-complexity
  assumptions do not hold automatically for arbitrary networks and distributions.
- Shuffling one finite batch can include fixed points and dependent pairs; it is not literally independent
  sampling from the population product distribution. Sampling construction must be stated when interpreting
  estimates.
- As a mathematical consequence of a loose lower bound, reducing a poorly optimized estimated lower bound
  does not certify a reduction in true mutual information. No author implementation or numerical estimator
  experiment was audited.
