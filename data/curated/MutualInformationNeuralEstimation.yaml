aio_no_match:
  search_scope: All 442 CLASS labels and scoped synonyms in pinned AIO commit 397851c547d1c4d8f06ef184f63c1d40bc86937a
    and all 203 preceding native IDs/names/aliases were compared. Ignored-inclusive searches covered both
    full checkouts. Exact candidate AIO nodes, definitions, scoped synonyms and direct parents were inspected;
    this no-match assessment is bounded to this snapshot and the stated semantic neighborhood.
  rationale: The inspected snapshot has no suitable class for this neural statistical estimator. A critic
    architecture or downstream representation-learning/GAN use is not sufficient to map the estimator
    itself.
  examined_targets:
  - target: AIO:DeepNeuralNetwork
    rejection_reason: A neural network is the parameterized critic component, not the joint-versus-product
      estimation algorithm.
  - target: AIO:RepresentationLearning
    rejection_reason: Learning reusable features is a possible application; it is not the definition of
      mutual-information estimation.
  - target: AIO:ContrastiveLearning
    rejection_reason: This network/representation-learning class does not specify the Donsker–Varadhan
      estimator or its stochastic-gradient correction.
  - target: AIO:GenerativeAdversarialNetwork
    rejection_reason: An optional downstream use in generative training does not make MINE a generator/discriminator
      architecture.
