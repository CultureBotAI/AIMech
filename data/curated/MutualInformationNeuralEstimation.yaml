claims:
- claim_id: method
  kind: mechanism
  statement: For a neural statistics function T_theta(x,z), optimize J(theta)=E_joint[T_theta]−log(E_product[exp(T_theta)]).
    Under the variational representation’s integrability assumptions, each population J(theta) is a lower
    bound on I(X;Z); optimizing within a neural family yields its restricted supremum. Estimate expectations
    from observed joint pairs and samples approximating the product of marginals, such as mismatched or
    shuffled pairs. The minibatch gradient contains a ratio of product-sample means and is generally biased.
    The original training heuristic replaces its exponential-moment denominator by an exponential moving
    average to reduce this bias. Poole et al. show that, when a positive running denominator is held fixed
    for an update, the resulting update has an interpretation as the gradient of a different unnormalized
    variational bound. This interpretation does not make the moving-average update a generally unbiased
    gradient estimator of the population Donsker–Varadhan objective. After fitting a critic, evaluating
    sample means in the Donsker–Varadhan expression gives a finite estimate, not a certified mutual-information
    lower bound for that sample.
  evidence:
