name: Structured mean-field inference
definition: A variational inference method that approximates a target distribution with a tractable family
  retaining selected dependencies, choosing its parameters to reduce the approximation-to-target Kullback–Leibler
  divergence.
concept_kind: mathematical_method
identity_notes: 'This record covers the tractable-substructure mean-field construction exemplified by
  Saul and Jordan, including partially factorized modules and the qualifications for a tractable correlated
  skeleton. It is broader than the maintained factorial-HMM-specific algorithm and distinct from a fully
  factorized approximation that removes every intervariable dependence. It is an inference method, not
  a graphical-model architecture, all variational inference, a particular Monte Carlo gradient estimator
  or a variational autoencoder. Fully factorized mean field is a limiting restricted family when retained
  substructures reduce to individual variables; that inclusion does not make the two concepts exact aliases.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 382 preceding
  native IDs/names/aliases for the four researched candidates. Both full-checkout fixed-string searches
  included ignored and hidden files, with 45 and 45 matching lines. All 31 unique matched contents were
  read: prior specialized inference records, source/review context and pending leads, not exact records
  for the three new identities. Expanded titles, source IDs, plural forms and complete/partial-factorizability
  terminology were included. All 68 semantic label/synonym hits and 23 exact fully annotated AIO CLASS
  nodes with outgoing edges were read. Their generated YAMLs and seven native neighbors were read or byte-verified
  unchanged after prior complete reading, totaling 30 contextual records. The broader phrase structured
  variational inference is searched but not asserted as an unconditional alias of structured mean field.
  Boltzmann trees remains an unresolved full-text lead. Absence is bounded to the pinned vocabulary and
  inspected neighborhood.'
limitations:
- Tractability of retained substructures and evaluation of the required expectations must be established
  for the chosen family. Compact notation or a sparse-looking graph does not by itself ensure efficient
  inference.
- The optimized bound concerns log Z. It is an observed-data log-likelihood bound only when Z is that
  likelihood under the specified unnormalized posterior construction. A generic partition function is
  not automatically a probability of observations.
- Coordinate ascent with exact factor optimization can improve the bound; arbitrary simultaneous field
  updates need not. The objective can have multiple stationary points, and neither global optimality nor
  accurate posterior marginals is guaranteed.
- Omitted links inside one correlated substructure require the covariance/triple-moment terms of Equation
  (19); simply substituting independent means would change the derivation.
- The auxiliary-variable equality in Equations (20)–(21) omits a coupling-dependent constant. For one
  binary edge K, a=acosh(exp(2*abs(K)))/2, b=sign(K)*a and C=exp(-abs(K))/2 give exp(K*s_i*s_j)=C*sum_w
  exp((a*s_i+b*s_j)*w). Dropping C preserves a normalized marginal but shifts the raw log partition; evidence
  bounds must retain the offset.
- The context-sensitive HMM example has boundary conventions and a delayed observation term that need
  care; the displayed unary-field formula is not adopted as an implementation-ready recipe. Its synthetic
  illustration does not establish general weak-coupling accuracy or benchmark superiority.
