claims:
- claim_id: method
  kind: mechanism
  statement: 'For a fixed normalized target p(s)=exp(F(s))/Z and tractable q, maximize L(q)=E_q[F(s)]+H(q),
    so log Z-L(q)=KL(q||p). The source’s binary pairwise modular construction retains all intramodule
    interactions J and factorizes q across modules, replacing omitted intermodule interactions K by adjustable
    unary fields H. Expectations within a module are computed exactly using its tractable algorithm; expectations
    between modules factorize. A module’s field update is H_i^mu=h_i^mu+sum_(nu!=mu),j K_ij^(mu,nu) E_q[s_j^nu].
    Holding all other factors fixed, recomputing that module with these fields gives a coordinate variational
    update. A chain module can use forward–backward while retaining within-chain correlations. If omitted
    links connect variables within the same correlated skeleton, the simple intermodule rule no longer
    follows: the source’s stationarity equations contain covariance and triple-moment terms. Auxiliary
    binary link variables provide another construction that induces a tractable core-versus-link factorization.'
