claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any matrix A in R^{m x n} with singular values sigma_1 >= ... >= sigma_n, Lemma 3.1 ((k+1)^2 Delta_{S cup {j}}^2 = d(a_j, H_S)^2 Delta_S^2) and Lemma 3.3 (sum_{|S|=k} (k!)^2 Delta_S^2 = e_k(sigma_1^2, ..., sigma_n^2), Equation 3.5) prove that sampling a k-row subset S with probability p_S = Delta_S^2 / sum_{|T|=k} Delta_T^2 achieves the exact expected squared Frobenius projection residual E_S[||A - pi_{H_S}(A)||_F^2] = (k + 1) e_{k+1}(sigma_1^2, ..., sigma_n^2) / e_k(sigma_1^2, ..., sigma_n^2) <= (k + 1)||A - A_k||_F^2 (Theorem 1.2, Equations 3.6-3.8).
  evidence:
  - source_id: r335-primary-pdf
    locator: Section 1.2, Theorem 1.2, p. 227; Section 3, Lemmas 3.1-3.4 and Proof of Theorem 1.2 (Equations 3.4-3.8), pp. 231-233
    relation: supports
  - source_id: r335-arxiv-abs
    locator: 'Abstract: volume sampling yields (k+1) multiplicative factor and PTAS for rank-k approximation and projective clustering'
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Iterating k rounds of residual length-squared row sampling approximates k-simplex volume sampling up to a factor of k! to achieve E[||A - pi_{H_S}(A)||_F^2] <= (k + 1)! ||A - A_k||_F^2 in k passes (Theorem 1.3), and following volume sampling with O(k / epsilon) adaptive residual sampling rounds yields a subset of O(k^2 / epsilon + k log k) rows whose span contains a rank-k matrix A'_k with ||A - A'_k||_F^2 <= (1 + epsilon)||A - A_k||_F^2 (Theorem 1.4).
  evidence:
  - source_id: r335-primary-pdf
    locator: Section 1.2, Theorems 1.3 and 1.4, p. 228; Section 5, Algorithms and Proofs of Theorems 1.3-1.4, pp. 234-239
    relation: supports
  - source_id: r335-metadata-cr
    locator: Theory of Computing 2(12):225-247 bibliographic record
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: 'Proposition 4.1 proves that the multiplicative factor (k + 1) in Theorem 1.2 is asymptotically tight for ANY k-row subset selection method: for a (k+1) x (k+1) matrix whose rows form a regular k-simplex in R^k lifted by epsilon in the (k+1)-st coordinate, every k-row subset S incurs projection error ||A - pi_{H_S}(A)||_F^2 -> (k + 1)||A - A_k||_F^2 as epsilon -> 0, so selecting O(k / epsilon) > k rows is information-theoretically necessary to achieve (1 + epsilon) relative error.'
  evidence:
  - source_id: r335-primary-pdf
    locator: Section 4, Proposition 4.1 and Proof, pp. 233-234
    relation: supports
