id: AIMech:VolumeSamplingForMatrixApproximationAndProjectiveClustering
name: Volume Sampling for Matrix Approximation and Projective Clustering
concept_kind: mathematical_method
review_status: DRAFT
definition: 'Volume Sampling for Matrix Approximation and Projective Clustering is a joint geometric row-subset sampling principle and adaptive low-rank approximation framework introduced by Deshpande, Rademacher, Vempala, and Wang (2006) that selects a subset S subseteq {1, ..., m} of k rows of a matrix A in R^{m x n} with probability p_S = Delta_S^2 / sum_{|T|=k} Delta_T^2 = det(A_S A_S^T) / sum_{|T|=k} det(A_T A_T^T) proportional to the squared k-dimensional simplex volume Delta_S = (1 / k!) sqrt(det(A_S A_S^T)) spanned by {a_i : i in S} and the origin. By combining the base-times-height simplex identity (k+1)^2 Delta_{S cup {j}}^2 = d(a_j, H_S)^2 Delta_S^2 (Lemma 3.1) with the Cauchy-Binet elementary symmetric polynomial identity sum_{|S|=k} (k!)^2 Delta_S^2 = e_k(sigma_1^2, ..., sigma_n^2) (Lemma 3.3, Equation 3.5), Theorem 1.2 proves the exact expected residual formula E_S[||A - pi_{H_S}(A)||_F^2] = (k + 1) e_{k+1}(sigma_1^2, ..., sigma_n^2) / e_k(sigma_1^2, ..., sigma_n^2) <= (k + 1)||A - A_k||_F^2, establishing the first multiplicative row-subset existence bound (matching the asymptotic lower bound of Proposition 4.1) and, when combined with adaptive residual length-squared sampling (Theorem 1.3 & Theorem 1.4), yielding PTAS (1 + epsilon) algorithms for rank-k matrix approximation and projective clustering.'
identity_notes: Distinct from Relative-Error CUR Matrix Decomposition via Subspace Leverage Sampling (`AIMech:RelativeErrorCURMatrixDecompositionViaSubspaceLeverageSampling`), which samples O(k log k / epsilon^2) columns/rows i.i.d. using precomputed SVD leverage scores rather than joint k-subset volume sampling of exactly k rows with multiplicative factor (k + 1), and from k-Determinantal Point Processes for Fixed-Size Subset Selection (`AIMech:KDeterminantalPointProcessesForFixedSizeSubsetSelection`), which addresses exact two-phase sampling and conditional L-ensemble inference in machine learning rather than the Cauchy-Binet ratio bound E[||A - pi_{H_S}(A)||_F^2] <= (k+1)||A - A_k||_F^2, Proposition 4.1 simplex lower bound, and projective clustering PTAS of Deshpande et al. (2006).
aliases:
- Deshpande-Rademacher-Vempala-Wang Simplex Volume Sampling
- k-Simplex Volume-Squared Row Subset Selection
- Adaptive Volume Sampling for Low-Rank Matrix Approximation
