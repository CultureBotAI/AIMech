aio_no_match:
  search_scope: All 442 AIO CLASS labels/scoped synonyms and native identities; ignored-inclusive searches
    of both full checkouts. Semantic search covered sampling, Monte Carlo, Markov, Bayesian, probabilistic
    and mathematical-function descriptions; exact candidate targets and incident edges were inspected.
  rationale: No suitable target for this independent random-variate generator was found in the inspected
    pin. Its possible use inside a Gibbs sampler or Bayesian model is insufficient to force a process/model
    mapping. This is a bounded assessment of this AIO snapshot.
  examined_targets:
  - target: AIO:MarkovChain
    rejection_reason: A stochastic sequence/model exported beneath Network, rather than an independent
      random-variate generation procedure. Embedding independent draws in a chain or an outer Gibbs algorithm
      does not establish the needed concept relation here.
  - target: AIO:ProbabilisticGraphicalModel
    rejection_reason: Defines a graphical conditional-dependence task; no graphical factorization defines
      this generator.
  - target: AIO:BayesianNetwork
    rejection_reason: A directed acyclic probabilistic model, not this sampling algorithm; use for a conditional
      distribution is incidental.
  - target: AIO:MathematicalFunction
    rejection_reason: A generic rule assigning dependent-variable values is not a suitable identity or
      informative broader mapping for a randomized accept-reject procedure.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Describes selection-induced representativeness error, not exact generation from
      a specified target; shared sampling terminology is insufficient.
