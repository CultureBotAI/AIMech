name: Rejection sampling
definition: A random-variate generation algorithm that draws proposals from a normalized envelope dominating
  an unnormalized target and accepts each with the target-to-envelope ratio, yielding independent target
  draws with fresh independent random trials.
concept_kind: algorithm
identity_notes: This is ordinary accept-reject generation with a valid global envelope. A rejected candidate
  is discarded, not recorded as a repeated chain state. The method differs from Metropolis acceptance,
  rejection-driven Metropolis proposals, importance weighting and selective filtering of model answers.
  The inspected primary source presents the scalar density case. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 167 prior native IDs/names/aliases. Full-checkout
  searches in both worktrees included ignored and hidden files; the 15 lines in each were shared Tierney
  source-title references or an adaptive-rejection discovery lead, not matching records. Existing Gibbs,
  Metropolis-within-Gibbs, random-walk and independence Metropolis mechanisms were inspected to resolve
  specialization boundaries.
limitations:
- A valid dominating envelope and an exact sampler for its normalized distribution are required. Clipping
  an invalid envelope ratio at one does not preserve the intended independent-sample law.
- An envelope with excessive mass can make acceptance rare. No universal efficiency, dimensional scaling
  or bound on the number of trials is claimed.
- The optional squeezing bound must be valid everywhere it is used; it is an evaluation shortcut, not
  a replacement target.
- Numerical approximation, finite precision and inaccurate envelope sampling can change the output distribution.
  Log concavity is not required by ordinary rejection sampling itself.
