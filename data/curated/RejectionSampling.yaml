claims:
- claim_id: method
  kind: mechanism
  statement: For a nonnegative target g with finite positive integral, choose an integrable envelope g_u
    with g_u(x)≥g(x) everywhere on the target support and sample x from g_u/integral(g_u). Independently
    draw w uniformly on (0,1); accept x if w≤g(x)/g_u(x), otherwise discard the trial and repeat. An optional
    lower bound 0≤g_l≤g allows early acceptance when the same w≤g_l(x)/g_u(x), avoiding evaluation of
    g. Fresh independent trials produce independent accepted draws from normalized g. The target normalizing
    constant is not required for the acceptance ratio.
  evidence:
  - source_id: method-source
    locator: Section 2.1, Rejection Sampling, printed pp. 338–339 / PDF pp. 3–4
    relation: supports
