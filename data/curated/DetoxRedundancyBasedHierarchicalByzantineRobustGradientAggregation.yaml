id: AIMech:DetoxRedundancyBasedHierarchicalByzantineRobustGradientAggregation
name: DETOX Redundancy-Based Hierarchical Byzantine-Robust Gradient Aggregation
concept_kind: algorithm
review_status: DRAFT
definition: A two-stage Byzantine-resilient distributed gradient aggregation framework that partitions p compute nodes into hat_p = p/r node groups of small odd redundancy size r to evaluate the same sub-batch gradients and applies within-group majority voting z_{t,j} = maj({hat_g_{t,i} | i in A_j}) in a filtering stage that exponentially reduces the effective number of Byzantine votes hat_q, followed by a median-of-means-style hierarchical aggregation stage (HIER-AGGR) that partitions the hat_p group votes into k vote groups, aggregates each vote group via a primary operator A_0 (such as the mean), and aggregates the k group outputs via a base robust aggregator A_1.
identity_notes: Distinct from DRACO (which requires r = 2s + 1 linear redundancy in the number of Byzantine nodes s to achieve exact zero-error gradient recovery without a second-stage statistical robust aggregator) and from standalone robust aggregators (Krum, Multi-Krum, Bulyan, Coordinate-Wise Median, Geometric Median) applied directly to all p ungrouped compute nodes. Specifically denotes the DETOX and HIER-AGGR algorithms of Rajput, Wang, Charles, & Papailiopoulos (NeurIPS 2019, Algorithms 1-2, Theorems 1 & 3, Corollary 2, Lemma 4).
aliases:
- DETOX
- DETOX Hierarchical Robust Aggregation
- DETOX HIER-AGGR
