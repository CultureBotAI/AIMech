claims:
- claim_id: r525-exponential-byzantine-vote-reduction-via-group-majority
  kind: mechanism
  statement: In Stage 1 (Algorithm 1 Lines 1-7), DETOX randomly partitions p compute nodes into hat_p = p/r groups {A_j} of odd size r, assigns each node i in A_j the same subsample S_{t,j} of size rb/p, and computes the group majority vote z_{t,j} = maj({hat_g_{t,i} | i in A_j}); Lemma 4 (for r = 3) proves E[hat_q] <= q*epsilon*(4 - 2*epsilon)/3, Theorem 1 (for odd r > 3) proves E[hat_q] <= 2q(40*epsilon*(1 - epsilon))^{(r-1)/2} / r, and Corollary 2 proves that for r >= 3 + 2 log_2(q), hat_q <= 1 + 2 log(1/delta) with probability at least 1 - delta.
  evidence:
  - source_id: r525-primary-pdf
    locator: Section 3 Algorithm 1, Theorem 1, Corollary 2, pp. 4-5; Appendix A.1-A.3 Lemmas 4-5, pp. 13-15
    relation: supports
- claim_id: r525-hierarchical-median-of-means-inexact-oracle-bound
  kind: scope
  statement: In Stage 2 (Algorithm 2 HIER-AGGR and Section 4 Theorem 3), partitioning the hat_p filtered votes into k vote groups {Z_j}, averaging each group via z_hat_j = A_0(Z_j), and applying A_1 (Geometric Median with k = 128 ln(1/delta), Coordinate-Wise Median with k = 128 ln(d/delta), or 1/4-Trimmed Mean with k = 128 ln(d/delta)) yields a Delta-inexact gradient oracle ||G_hat - G||_2 <= O(sigma * sqrt(ln(d/delta) / b)) that is independent of p and epsilon while reducing server aggregation runtime from O(p^2 d) to O(p d + k^2 d).
  evidence:
  - source_id: r525-primary-pdf
    locator: Section 3 Algorithm 2 and Section 4 Theorem 3, pp. 5-6; Appendix A.4 Lemma 6, pp. 15-17
    relation: supports
- claim_id: r525-server-data-partitioning-non-privacy-limitation
  kind: limitation
  statement: Because DETOX requires the parameter server to assign identical data sub-batches S_{t,j} to all r compute nodes within each node group A_j so honest nodes produce identical gradients for majority voting, it assumes centralized data ownership and is not directly privacy-preserving for decentralized private client datasets.
  evidence:
  - source_id: r525-primary-pdf
    locator: Section 2, p. 4; Section 6 Conclusion, p. 11
    relation: supports
