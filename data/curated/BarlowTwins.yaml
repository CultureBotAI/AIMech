claims:
- claim_id: method
  kind: mechanism
  statement: For B≥2 paired augmented views, apply a shared backbone and projection head to obtain B-by-d
    embeddings in each view. Center every embedding coordinate over the batch. For nonzero centered column
    norms define C_ij=sum_b zA_bi zB_bj/[sqrt(sum_b zA_bi^2) sqrt(sum_b zB_bj^2)]. Minimize L=sum_i(1−C_ii)^2+lambda
    sum_(i≠j) C_ij^2 with lambda>0, backpropagating through both branches and their normalization. The
    first term aligns matching coordinates across views; the second penalizes off-diagonal cross-view
    correlations. After pretraining, use backbone representations before the projection head for downstream
    tasks. This states the paper’s correlation-equation formulation; the pinned implementation realizes
    normalization with synchronized batch normalization and an epsilon-stabilized denominator.
