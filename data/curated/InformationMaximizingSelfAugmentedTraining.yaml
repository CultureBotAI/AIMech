name: Information maximizing self-augmented training
definition: A discrete representation-learning procedure that combines self-augmentation consistency with
  an information objective, using categorical outputs for clustering or a pairwise approximation for multi-bit
  hashing.
concept_kind: algorithm
identity_notes: IMSAT is the named Hu et al. procedure with explicitly different clustering and hashing
  configurations. It learns discrete output variables, unlike continuous embedding dependence estimators.
  Its information between input and output, plus consistency to a fixed current prediction, differs from
  IIC information between two assignment variables. This umbrella record does not equate the categorical,
  nonuniform-prior and hash objectives. No normalized identity match was found across all 442 pinned AIO
  labels/scoped synonyms and 199 preceding native IDs/names/aliases. Ignored-inclusive word-delimited
  searches of both full checkouts found eight prior discovery/review references in each. Short acronyms
  were compared in normalized record identities; broad text searches used the full names and longer aliases.
  Nearest maintained mechanisms and seven exact AIO nodes with incident edges were inspected.
limitations:
- Hashing truncates the information expansion; pairwise penalties do not establish joint independence
  or exact information for the full bit vector. The ordered-pair convention affects its relative regularization
  strength.
- The minibatch KL inequality is an expectation bound from convexity, not a bound for every batch or a
  guarantee that finite stochastic optimization satisfies the prior constraint. Penalty-method idealizations
  do not certify the trained nonconvex network.
- Consistency depends on suitable transformations and perturbation radii. A transformation can preserve
  a nuisance factor or change desired semantics. Balanced marginal entropy can conflict with genuinely
  imbalanced classes.
- The pinned clustering code uses a weighted marginal entropy default; it must not be silently described
  as exact unit-weight mutual information. Epsilon stabilization and approximate virtual perturbations
  further distinguish numerical loss from ideal formulas.
- Some reported image experiments use features from an ImageNet-pretrained ResNet and hyperparameter selection
  uses labeled clustering accuracy. Unsupervised final training does not mean every source of representation
  or model-selection information is label-free. No model was run.
