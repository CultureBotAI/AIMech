aio_mappings:
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The algorithm learns assignments for an unlabeled clustering task. For IMSAT this mapping
    concerns its categorical configuration, not binary hashing. The AIO target is a task; this is an algorithm-to-task
    association, not equivalence or an is-a assertion.
- target: AIO:SelfsupervisedLearning
  relation: related_match
  rationale: This algorithm learns from self-generated augmentation targets or matched local/global input
    relationships without manual target labels. The target is a task; the relation is not equivalence
    or an is-a assertion, nor a claim that all experimental preprocessing or selection is label-free.
