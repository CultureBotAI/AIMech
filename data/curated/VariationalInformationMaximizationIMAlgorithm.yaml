claims:
- claim_id: method
  kind: mechanism
  statement: Choose a fixed input distribution p(x), a parameterized encoder p_theta(y|x), and a class
    Q of normalized decoders q(x|y) for which the expected decoder log probability is tractable or can
    be approximated. Starting from an encoder and decoder, hold q fixed and maximize H(X)+E_p(x)p_theta(y|x)[log
    q(X|Y)] over theta. Then hold theta fixed and fit q within Q by maximizing the same expectation. Repeat
    the two updates. H(X) is constant in these updates. Exact coordinate maximizations cannot decrease
    the chosen lower bound; approximate updates require their own improvement check. The paper develops
    a noisy linear projection with Gaussian decoding as one feature-extraction configuration and also
    describes richer encoder/decoder choices.
