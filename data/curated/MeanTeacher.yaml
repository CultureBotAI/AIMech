name: Mean Teacher
definition: A semi-supervised classifier-training procedure that regularizes a student prediction toward
  the prediction of a same-architecture teacher whose parameters are an exponential moving average of
  successive student parameters, alongside labeled classification loss.
concept_kind: algorithm
identity_notes: 'Mean Teacher averages weights, whereas temporal ensembling averages predictions and the
  Pi-model shares current parameters across two gradient-bearing branches. Sharing an EMA component does
  not make this labeled classifier-training objective identical to BYOL or DINO, which use different representation
  targets and objectives without the labeled cross-entropy term. This record describes a training algorithm,
  not a trained checkpoint or fixed network architecture. The inspected AIO SemiSupervisedLLM class specifically
  combines LLM pretraining with supervised fine-tuning; its related synonym self-training is not an exact
  identity for this method. AIO SelfsupervisedLearning excludes human-annotated labels, Distillation describes
  large-to-small compression, and RegularizationLayer is a layer: none supplies an equivalent class for
  this algorithm. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 230 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout; matches concern prior discovery leads and the Pi-model
  normalization regression. Ten exact AIO CLASS nodes, their scoped synonyms and outgoing edges, plus
  five neighboring native records were inspected. The corrected Unicode-aware normalizer preserves Π;
  the previous Pi-model/Model collision was a lexical defect, not semantic identity (review issue #58).'
limitations:
- Teacher initialization, coefficient schedules, loss scaling and network state management remain implementation
  choices; the record does not assert a universal initialization, alpha value or handling of nonparameter
  buffers.
- Consistency relies on class-preserving perturbations and can propagate wrong targets; the EMA teacher
  is not guaranteed to improve every prediction.
- The original experiments include architecture and dataset-specific settings. No benchmark score, universal
  performance ordering, or large-to-small compression claim is asserted.
- The read supplementary pages cover the convolutional setup and branch gradients, not all later supplement
  experiments or source code.
