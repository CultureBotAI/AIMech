claims:
- claim_id: method
  kind: mechanism
  statement: Evaluate each input with independently perturbed student and teacher networks of the same
    architecture. Train the student with cross-entropy on labeled examples and a weighted squared-probability
    consistency cost between student and teacher predictions on labeled and unlabeled examples. Treat
    teacher predictions as constant during the gradient update. After obtaining the updated student parameters
    theta_t, update teacher parameters theta_prime_t←alpha theta_prime_(t−1)+(1−alpha)theta_t. Thus the
    teacher changes by parameter averaging after training steps, not by backpropagation through its consistency
    branch. Choose the averaging coefficient and consistency-weight schedule as part of the training setup.
    The core description does not require a particular initialization or warm-up formula. Unlike temporal
    ensembling, it does not require a persistent target array indexed by the training set.
  evidence:
