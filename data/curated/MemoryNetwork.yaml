  rationale: The original framework is a connected computational system of memory and interacting input,
    update, inference and response components. The pinned Network target broadly includes interconnected
    entities for computation and data exchange; it does not require neural implementation.
limitations:
- The record denotes the original general framework. MemNN names its specific neural instantiation here
  and is not asserted as an exact alias for all permissible implementations.
- Memory-state updates differ from learning model parameters; test-time writable storage is not an automatic
  online-learning guarantee.
- Full supporting-fact supervision and restricted experiments apply to the reported neural instantiations.
  The later soft-read MemN2N architecture has a distinct identity and supervision protocol.
- All 15 pages of arXiv1410.3916v11 were visually read, including Appendices A–F. Other versions and author
  code were not inspected; chosen calculations illustrate boundaries, not trained-model behavior or benchmark
  reproduction. DRAFT remains.
