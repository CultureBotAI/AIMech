id: AIMech:FedDrAndAsyncFedDrRandomizedDouglasRachfordSplittingForNonconvexFederatedCompositeOptimization
name: FedDR and asyncFedDR (Randomized Douglas-Rachford Splitting for Nonconvex Federated Composite Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: 'A family of synchronous (FedDR, Algorithm 1) and asynchronous (asyncFedDR, Algorithm 2) randomized block-coordinate Douglas-Rachford splitting algorithms for nonconvex federated composite optimization min_x { F(x) := (1/n) sum_{i=1}^n f_i(x) + g(x) } with L-smooth nonconvex client objectives f_i and proper closed convex regularizer g (Tran-Dinh, Pham, Phan, & Nguyen 2021, Sections 3-4, Equations 1-8, Algorithms 1-2, Theorems 1-2): in each round k, each sampled client i in S_k updates its local shadow iterate y_i^{k+1} = y_i^k + alpha (x_bar^k - x_i^k), approximately solves the local proximal subproblem x_i^{k+1} approx prox_{eta f_i}(y_i^{k+1}) = argmin_x { f_i(x) + (1/(2 eta)) ||x - y_i^{k+1}||^2 } up to accuracy epsilon_{i,k}, and forms the reflected iterate x_hat_i^{k+1} = 2 x_i^{k+1} - y_i^{k+1}, while the server maintains the global average x_tilde^{k+1} = x_tilde^k + (1/n) sum_{i in S_k} (x_hat_i^{k+1} - x_hat_i^k) and applies the global composite proximal step x_bar^{k+1} = prox_{eta g}(x_tilde^{k+1}) (Equation 3, Algorithm 1).'
identity_notes: Distinct from FedSplit (AIMech:FedSplitOperatorSplittingForFastFederatedOptimization, Pathak & Wainwright 2020), which applies deterministic Peaceman-Rachford / Douglas-Rachford operator splitting strictly to strongly convex unconstrained objectives without composite nonsmooth regularizer g(x), partial client sampling, or asynchronous delay tolerance; and distinct from FedPD (AIMech:FedPdFederatedPrimalDualOptimizationWithAdaptivityToNonIidData, Zhang et al. 2021), which uses an augmented Lagrangian primal-dual method with full synchronization rather than a nonconvex Douglas-Rachford Lyapunov envelope with randomized block-coordinate and asynchronous bounded-delay updates (asyncFedDR).
aliases:
- FedDR
- asyncFedDR
- Randomized Douglas-Rachford Splitting for Nonconvex Federated Optimization
