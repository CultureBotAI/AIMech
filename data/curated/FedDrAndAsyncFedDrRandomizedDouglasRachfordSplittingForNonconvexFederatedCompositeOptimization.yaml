claims:
- claim_id: r482-nonconvex-douglas-rachford-triad-and-reflection-mechanism
  kind: mechanism
  statement: Each active client i in S_k updates its local triad (y_i^k, x_i^k, x_hat_i^k) by relaxing y_i^{k+1} = y_i^k + alpha (x_bar^k - x_i^k), computing an inexact proximal point x_i^{k+1} approx prox_{eta f_i}(y_i^{k+1}) satisfying ||nabla f_i(x_i^{k+1}) + (1/eta)(x_i^{k+1} - y_i^{k+1})|| <= epsilon_{i,k}, and transmitting Delta x_hat_i^k = x_hat_i^{k+1} - x_hat_i^k where x_hat_i^{k+1} = 2 x_i^{k+1} - y_i^{k+1}, so that at any consensus fixed point x_bar^* = x_i^* = x^* the shadow offsets y_i^* = x^* + eta nabla f_i(x^*) cancel local gradient drift and enforce exact composite stationarity G_eta(x^*) = (1/eta)(x^* - prox_{eta g}(x^* - eta nabla f(x^*))) = 0 (Tran-Dinh et al. 2021, Section 3, Equation 3, Algorithm 1, Lemma 1, pp. 4-5).
  evidence:
  - source_id: r482-primary-pdf
    locator: Section 3 (Equation 3, Algorithm 1, Lemma 1), pp. 4-5
    relation: supports
- claim_id: r482-nonconvex-composite-convergence-and-async-bounded-delay-scope
  kind: scope
  statement: Without any bounded gradient-dissimilarity assumption across non-IID clients, Theorems 1 and 2 prove that under L-smooth nonconvex f_i, proper closed convex g, relaxation 0 < alpha < 2, and step size eta satisfying 2(2 - alpha) - alpha eta L - (1 + 2 alpha) eta^2 L^2 > 0 (Equation 7), both synchronous FedDR under arbitrary positive sampling probabilities p_i > 0 and asynchronous asyncFedDR under bounded delay d_i^k <= tau achieve O(1/epsilon^2) communication rounds to reach E[||G_eta(x_bar^{k_hat})||^2] <= epsilon^2 (Tran-Dinh et al. 2021, Section 3.3 & Section 4.2, Theorems 1-2, pp. 5-8).
  evidence:
  - source_id: r482-primary-pdf
    locator: Section 3.3 (Theorem 1, Corollary 1, Equation 7) & Section 4.2 (Theorem 2, Corollary 2), pp. 5-8
    relation: supports
- claim_id: r482-non-iid-sparse-and-regularized-neural-network-application
  kind: application
  statement: Applied to nonconvex L1-regularized sparse federated deep classification and unconstrained non-IID neural network training on MNIST, FEMNIST, and Shakespeare benchmarks under cross-device partial participation and asynchronous worker delays (Tran-Dinh et al. 2021, Section 5, Figures 1-4).
  evidence:
  - source_id: r482-primary-pdf
    locator: Section 5 (Numerical Experiments, Figures 1-4), pp. 8-10
    relation: supports
- claim_id: r482-stateful-client-triad-memory-requirement-limitation
  kind: limitation
  statement: Requires every client i to maintain persistent local state across rounds (x_i^k, y_i^k, x_hat_i^k) and requires the server to maintain the aggregated reflected vector x_tilde^k of all n clients, preventing stateless one-shot client participation (Tran-Dinh et al. 2021, Algorithm 1 & Remark 1, p. 4).
  evidence:
  - source_id: r482-primary-pdf
    locator: Section 3.2 (Algorithm 1 & Remark 1), p. 4
    relation: supports
