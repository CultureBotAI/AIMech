id: AIMech:LossSpecificOptimalEigenvalueShrinkageForSpikedCovarianceMatrices
name: Loss-Specific Optimal Eigenvalue Shrinkage for Spiked Covariance Matrices
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Donoho-Gavish-Johnstone Spiked Covariance Optimal Eigenvalue Shrinkage
- Loss-Specific Nonlinear Eigenvalue Shrinkage in the Spiked Covariance Model
- Pivot-Loss Optimal Covariance Eigenvalue Shrinker
- 26-Loss Spiked Covariance Eigenvalue Shrinkage
definition: A high-dimensional covariance estimation methodology introduced by Donoho, Gavish, and Johnstone (2018, The Annals of Statistics 46(4):1742-1778, arXiv:1311.0851v3) for the spiked population covariance model Sigma_p = diag(ell_1, ..., ell_r, 1, ..., 1) (or Sigma_p = sigma^2 diag(ell_1, ..., ell_r, 1, ..., 1)) with fixed spike count r, supercritical spikes ell_1 > ... > ell_r > ell_+(gamma) = 1 + sqrt(gamma), and p_n / n -> gamma in (0, 1]. Given sample covariance eigendecomposition S = sum_{i=1}^p lambda_i v_i v_i', the estimator applies a scalar nonlinearity eta(lambda) to form hat_Sigma_eta = sum_{i=1}^p eta(lambda_i) v_i v_i'. By constructing an orthogonal basis W via Gram-Schmidt QR orthogonalization of the r population spike eigenvectors U_r and top r sample eigenvectors V_r, the method simultaneously block-diagonalizes W' Sigma W = (oplus_{i=1}^r A(ell_i)) oplus I_{p-2r} and W' hat_Sigma_{eta,r} W -> (oplus_{i=1}^r B(ell_i, eta)) oplus I_{p-2r} almost surely, where A(ell) = diag(ell, 1) and B(eta, c) = I_2 + (eta - 1)[[c^2, cs], [cs, s^2]] with spike-eigenvector cosine squared c^2(ell) = [1 - gamma / (ell - 1)^2] / [1 + gamma / (ell - 1)] and s^2 = 1 - c^2. Across 26 orthogonally invariant sum- or max-decomposable matrix pivot-losses and discrepancy losses L_p(Sigma, hat_Sigma) (Table 1), the p-dimensional asymptotic loss decouples into a sum or maximum of r independent 2 x 2 component losses F(ell_i, eta) = L_2(A(ell_i), B(eta, c(ell_i))). Setting eta*(lambda) = 1 for all bulk eigenvalues lambda <= lambda_+(gamma) = (1 + sqrt(gamma))^2, inverting the Baik-Silverstein forward map via ell(lambda) = [(lambda + 1 - gamma) + sqrt((lambda + 1 - gamma)^2 - 4 lambda)] / 2 for lambda > lambda_+(gamma), and minimizing F(ell, eta) yields distinct closed-form optimal shrinkers eta*(lambda; gamma, L) across 18 losses (Table 2), including Frobenius covariance loss eta_*^F(ell) = ell c^2 + s^2, Stein and precision-Frobenius loss eta_*^{St}(ell) = ell / (c^2 + ell s^2), operator-norm debiasing eta_*^O(ell) = ell, and nuclear-norm neighborhood bulk shrinkage eta_*^N(ell) = max(1 + (ell - 1)(1 - 2 s^2), 1), while achieving finite-n equivariant oracle asymptotic risk for Frobenius and Stein losses and exact adaptation to unknown noise variance sigma^2 via the Marcenko-Pastur median plug-in hat_sigma^2 = lambda_med / mu_gamma.
identity_notes: Resolved against all 442 pinned AIO concepts and 645 maintained AIMech records. Distinct from AIMech:BaikSilversteinSpikedPopulationCovarianceEigenvalueSeparation (Baik & Silverstein 2006), which establishes the first-order almost-sure forward eigenvalue limit lambda(ell) = ell + gamma ell / (ell - 1) via companion inverse Stieltjes transforms without eigenvector cosine decoupling, 2 x 2 pivot-loss block reduction, or loss-specific eigenvalue shrinkage estimators; distinct from AIMech:BaikBenArousPecheLargestEigenvaluePhaseTransition (Baik, Ben Arous, & Peche 2005), which characterizes the M^{-2/3} F_k and M^{-1/2} G_k fluctuation distributions of the largest sample eigenvalue; distinct from AIMech:RotationallyInvariantNonlinearShrinkageCovarianceEstimation (Ledoit & Wolf 2012) and AIMech:QuESTNonlinearShrinkageCovarianceEstimation (Ledoit & Wolf 2015, 2017), which target bulk-regime general population spectra with O(p) non-trivial eigenvalues under Frobenius or minimum-variance loss via sample Stieltjes transforms rather than finite-rank spiked 2 x 2 pivot-loss reductions across 26 matrix losses; and distinct from AIMech:LedoitWolfLinearShrinkageCovariance (Ledoit & Wolf 2004), which restricts shrinkage to affine combinations of S and I_p.
