claims:
- claim_id: simultaneous-2x2-gram-schmidt-block-diagonalization-and-pivot-loss-decoupling
  kind: mechanism
  statement: For population spiked covariance Sigma_p = I_p + sum_{i=1}^r (ell_i - 1) u_i u_i' (ell_1 > ... > ell_r > 1 + sqrt(gamma)) and rank-aware sample eigenvalue shrinker hat_Sigma_{eta,r} = I_p + sum_{i=1}^r (eta(lambda_i) - 1) v_i v_i', Section 2 (Lemma 1, eqs. 2.1-2.6, pp. 8-9) and Section 7 (Lemmas 5-7, eqs. 7.1-7.10, pp. 18-21) construct an orthogonal matrix W via QR Gram-Schmidt orthogonalization of [U_r V_r] so that W' Sigma W = (oplus_{i=1}^r A(ell_i)) oplus I_{p-2r} with A(ell) = diag(ell, 1) and W' hat_Sigma_{eta,r} W converges almost surely to (oplus_{i=1}^r B(ell_i, eta(lambda(ell_i)))) oplus I_{p-2r} with B(eta, c) = I_2 + (eta - 1)[[c^2, cs], [cs, s^2]], where c^2(ell) = [1 - gamma / (ell - 1)^2] / [1 + gamma / (ell - 1)] and lambda(ell) = ell + gamma ell / (ell - 1) (eqs. 1.5-1.6). Consequently, for every orthogonally invariant sum- or max-decomposable pivot-loss or discrepancy loss L_p in Table 1 (Definitions 1-5, Lemmas 2-3, pp. 9-14), the p-dimensional loss L_p(Sigma_p, hat_Sigma_{eta,r}) converges almost surely to sum_{i=1}^r F(ell_i, eta(lambda(ell_i))) or max_{1 <= i <= r} F(ell_i, eta(lambda(ell_i))), where F(ell, eta) = L_2(A(ell), B(eta, c(ell))) is a deterministic 2 x 2 matrix loss (Theorem 1, eqs. 6.2-6.4, p. 15; Lemma 7, eq. 7.8, p. 20).
  evidence:
  - source_id: dgj2018-spiked-shrinkage-pdf
    locator: Section 2, Lemma 1 and Equations (2.1)-(2.6), pp. 8-9; Sections 3-5, Definitions 1-5, Lemmas 2-3, and Table 1, pp. 9-14; Section 7, Lemmas 5-7 and Equations (7.1)-(7.10), pp. 18-21
    relation: supports
- claim_id: closed-form-loss-specific-optimal-shrinkers-across-18-matrix-losses
  kind: scope
  statement: 'Lemma 4 (p. 15) proves that any sequence of shrinkers achieving finite asymptotic loss must be a bulk shrinker satisfying eta(lambda) = 1 for all lambda in the Marcenko-Pastur bulk [(1 - sqrt(gamma))^2, (1 + sqrt(gamma))^2]. Above the bulk edge lambda_+(gamma) = (1 + sqrt(gamma))^2, inverting lambda(ell) via ell(lambda) = [(lambda + 1 - gamma) + sqrt((lambda + 1 - gamma)^2 - 4 lambda)] / 2 (eq. 1.10) and minimizing F(ell, eta) over eta >= 1 yields unique closed-form optimal shrinkers eta*(lambda; gamma, L) across 18 of the 26 loss families (Theorem 1 and Table 2, pp. 14-18), which depend strongly on the loss geometry: (i) Frobenius covariance loss L^{F,1} and Entropy loss L^{ent} share eta_*^F(ell) = ell c^2 + s^2; (ii) Stein loss L^{st} and precision Frobenius loss L^{F,2} share the strictly smaller harmonic-type shrinker eta_*^{St}(ell) = ell / (c^2 + ell s^2); (iii) operator-norm losses L^{O,1}, L^{O,2} yield exact eigenvalue debiasing eta_*^O(ell) = ell (discontinuous at lambda_+(gamma)); (iv) nuclear-norm covariance loss L^{N,1} yields eta_*^N(ell) = max(1 + (ell - 1)(1 - 2 s^2), 1), a neighborhood bulk shrinker that collapses supercritical spikes with c^2(ell) <= 1/2 entirely to 1; and (v) Frechet discrepancy L^{fre} yields eta_*^{fre}(ell) = (sqrt(ell) c^2 + s^2)^2.'
