    locator: Section 7.1-7.2, Propositions 1-3 and Corollary 1, pp. 21-25; Section 8, Theorem 2 and Lemma 8, pp. 26-28; Section 9, Lemma 9 and Equations (9.1)-(9.6), pp. 28-30
    relation: supports
