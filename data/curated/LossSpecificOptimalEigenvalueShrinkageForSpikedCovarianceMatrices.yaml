- claim_id: rank-agnostic-bulk-tail-control-oracle-optimality-and-mp-median-variance-plugin
  kind: scope
  statement: Section 7.1 (Propositions 1-2, pp. 21-22) proves via Cauchy eigenvalue interlacing lambda_{in} <= mu_{i-r,n} with a white Wishart matrix W_{p_n-r}(n, I) and Johnstone's Tracy-Widom tail sum bound ||eta(mu_{in}, c_n) - 1||_{ell_q} -> 0 in probability that for any jointly continuous bulk shrinker eta(lambda, c), the rank-agnostic estimator hat_Sigma_eta = sum_{i=1}^p eta(lambda_i, p/n) v_i v_i' achieves the exact same asymptotic loss in probability as the rank-aware estimator hat_Sigma_{eta,r}. For the discontinuous operator-norm shrinker eta_*^O(ell), Proposition 3 (pp. 23-25) proves that covariance operator loss L^{O,1} still converges in probability because F_*^{O,1}(ell) = sqrt(ell gamma (ell - 1) / (ell - 1 + gamma)) is strictly increasing, whereas precision operator loss L^{O,2} has strictly decreasing F_*^{O,2}(ell) so positive Tracy-Widom fluctuations (TW_1 > 0) of the top noise eigenvalue induce a non-vanishing asymptotic penalty W in {0, F_*^{O,2}(ell_+) - F_*^{O,2}(ell_r)}. Finally, Theorem 2 (Section 8, pp. 26-28) proves that univariate optimal shrinkage matches the asymptotic risk of the finite-n orthogonally equivariant oracle hat_Sigma^{oracle} = V Delta^{oracle} V' for Frobenius and Stein losses, and Lemma 9 (Section 9, pp. 28-30) proves that for unknown noise variance sigma^2, the Marcenko-Pastur median-matching estimator hat_sigma_n^2 = lambda_{med} / mu_gamma yields an adaptive shrinker tilde_eta_n(lambda) = hat_sigma_n^2 eta*(lambda / hat_sigma_n^2) with the exact known-sigma^2 optimal asymptotic risk.
  evidence:
