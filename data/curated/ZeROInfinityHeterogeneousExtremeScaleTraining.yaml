id: AIMech:ZeROInfinityHeterogeneousExtremeScaleTraining
name: ZeRO-Infinity
concept_kind: algorithm
review_status: DRAFT
definition: A heterogeneous distributed deep learning training system and algorithm built on ZeRO Stage-3 that partitions all model states (parameters, gradients, and optimizer states) across data-parallel processes and offloads them to CPU and NVMe storage via the Infinity Offload Engine (DeepNVMe asynchronous bulk I/O + reusable pinned-memory buffer pool), while decomposing individual large operators into sequential parameter tiles via Memory-Centric Tiling, retrieving offloaded parameters across all parallel PCIe links via allgather-based Bandwidth-Centric Partitioning, and overlapping NVMe-to-CPU (nc), CPU-to-GPU (cg), and GPU-to-GPU (gg) transfers with computation via a dynamic operator-sequence prefetcher.
identity_notes: Distinct from ZeRO-Offload (which builds on ZeRO-2, replicates FP16 parameters on every GPU, uses single-owner broadcast limiting offload bandwidth to one PCIe link, and cannot offload to NVMe), from GPU-only ZeRO-3, and from 3D Parallelism (which requires manual tensor-slicing model parallelism and pipeline-stage refactoring and is bounded by aggregate GPU HBM capacity).
aliases:
- Zero Redundancy Optimizer Infinity
- ZeRO-Infinity NVMe-CPU-GPU Offload
- DeepSpeed ZeRO-Infinity
