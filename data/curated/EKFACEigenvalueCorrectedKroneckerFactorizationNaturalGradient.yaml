id: AIMech:EKFACEigenvalueCorrectedKroneckerFactorizationNaturalGradient
name: EKFAC (Eigenvalue-Corrected Kronecker Factorization)
concept_kind: algorithm
review_status: DRAFT
definition: An approximate natural gradient optimization and Fisher information matrix factorization method that projects layer-wise parameter gradients into the orthogonal Kronecker-Factored Eigenbasis (KFE) U_A (x) U_B derived from input activation and backpropagated gradient covariances, and preconditions them using the Frobenius-optimal diagonal second-moment vector s*_i = E[((U_A (x) U_B)^T grad_theta)_i^2] tracked at every mini-batch.
identity_notes: Distinct from K-FAC (AIMech:KFacKroneckerFactoredApproximateCurvature), which approximates each layer's Fisher block as G_KFAC = A (x) B = (U_A (x) U_B)(S_A (x) S_B)(U_A (x) U_B)^T with eigenvalues restricted to the Kronecker product S_A (x) S_B; EKFAC keeps the Kronecker-Factored Eigenbasis U_A (x) U_B but replaces S_A (x) S_B with the unconstrained diagonal second-moment matrix S* in KFE coordinates, provably achieving ||G - G_EKFAC||_F <= ||G - G_KFAC||_F and enabling cheap per-iteration updates of S* without recomputing the eigendecomposition.
aliases:
- EKFAC
- EKFAC-ra
- Eigenvalue-Corrected K-FAC
- Eigenvalue-Corrected Kronecker Factorization
- Kronecker-Factored Eigenbasis Natural Gradient Descent
