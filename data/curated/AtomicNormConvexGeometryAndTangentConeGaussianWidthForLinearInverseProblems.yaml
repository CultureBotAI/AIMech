id: AIMech:AtomicNormConvexGeometryAndTangentConeGaussianWidthForLinearInverseProblems
name: Atomic Norm Convex Geometry and Tangent Cone Gaussian Width for Linear Inverse Problems
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Atomic Norm Minimization and Tangent Cone Gaussian Width
- Chandrasekaran-Recht-Parrilo-Willsky Atomic Norm Framework
- Convex Geometry of Linear Inverse Problems via Atomic Norms
- Polar Normal-Cone Distance Bound for Tangent-Cone Gaussian Width
definition: 'Atomic Norm Convex Geometry and Tangent Cone Gaussian Width for Linear Inverse Problems is a unified convex-geometric framework for recovering structured models $x^\star \in \mathbb{R}^p$ that are sparse nonnegative combinations $x^\star = \sum_{i=1}^k c_i a_i$ ($c_i > 0$) of atoms from a compact atomic set $\mathcal{A} \subset \mathbb{R}^p$ (whose elements are extreme points of $\operatorname{conv}(\mathcal{A})$) from underdetermined linear measurements $y = \Phi x^\star + \omega$ ($\Phi \in \mathbb{R}^{n \times p}$). It induces the gauge (atomic norm) $\|x\|_{\mathcal{A}} = \inf\{t > 0 : x \in t\operatorname{conv}(\mathcal{A})\} = \inf\{\sum_{a \in \mathcal{A}} c_a : x = \sum_{a \in \mathcal{A}} c_a a,\, c_a \ge 0\}$ and dual support norm $\|x\|_{\mathcal{A}}^* = \sup_{a \in \mathcal{A}} \langle x, a \rangle$, characterizes exact and robust recovery via the tangent cone $T_{\mathcal{A}}(x^\star) = \operatorname{cone}\{z - x^\star : \|z\|_{\mathcal{A}} \le \|x^\star\|_{\mathcal{A}}\}$ and its polar normal cone $N_{\mathcal{A}}(x^\star) = T_{\mathcal{A}}(x^\star)^* = \operatorname{cone}(\partial \|x^\star\|_{\mathcal{A}}), and bounds the required number of random Gaussian measurements by the squared Gaussian width $w(T_{\mathcal{A}}(x^\star) \cap \mathbb{S}^{p-1})^2 \le \mathbb{E}_{g \sim \mathcal{N}(0, I_p)}[\operatorname{dist}(g, N_{\mathcal{A}}(x^\star))^2]$.'
identity_notes: Distinct from specific compressed-sensing, matrix-completion, or singular-value-thresholding records (`AIMech:RestrictedIsometryPropertyForCompressedSensing`, `AIMech:NuclearNormConvexRelaxationForMatrixCompletion`, `AIMech:SingularValueThresholdingForMatrixCompletion`, `AIMech:MinimaxRiskOfMatrixDenoisingBySingularValueSoftThresholding`), which analyze a single norm ($\ell_1$ or nuclear norm) or direct matrix denoising ($\Phi = I$). Chandrasekaran, Recht, Parrilo, & Willsky (2012) formulate the general atomic-set gauge/support-function theory over arbitrary compact atomic sets $\mathcal{A}$ (unifying sparse vectors, low-rank matrices, sign vectors, orthogonal matrices, permutation matrices, and algebraic varieties), prove the polar normal-cone distance bound $w(\mathcal{C} \cap \mathbb{S}^{p-1}) \le \mathbb{E}_g[\operatorname{dist}(g, \mathcal{C}^*)]$ via Lagrangian duality, and analyze the computational-statistical sample-complexity tradeoff across semidefinite theta-body outer relaxations $\mathrm{TH}_k(I)$.
