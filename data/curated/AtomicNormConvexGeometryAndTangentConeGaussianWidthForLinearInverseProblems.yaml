claims:
- claim_id: atomic-norm-gauge-dual-norm-and-tangent-normal-cone-recovery-characterization
  kind: mechanism
  statement: 'For any compact atomic set $\mathcal{A} \subset \mathbb{R}^p$ whose elements are extreme points of $\operatorname{conv}(\mathcal{A})$ (with centroid at the origin), the atomic norm gauge $\|x\|_{\mathcal{A}} = \inf\{t > 0 : x \in t\operatorname{conv}(\mathcal{A})\}$ and dual norm $\|x\|_{\mathcal{A}}^* = \sup_{a \in \mathcal{A}} \langle x, a \rangle$ induce the convex optimization program $\hat{x} = \arg\min_x \|x\|_{\mathcal{A}} \text{ s.t. } y = \Phi x$; the true signal $x^\star = \sum_{i=1}^k c_i a_i$ ($c_i > 0$) is the unique optimum if and only if $\operatorname{null}(\Phi) \cap T_{\mathcal{A}}(x^\star) = \{0\}$ (equivalently $\operatorname{row}(\Phi) \cap \operatorname{relint}(N_{\mathcal{A}}(x^\star)) \ne \emptyset$), where $T_{\mathcal{A}}(x^\star) = \operatorname{cone}\{z - x^\star : \|z\|_{\mathcal{A}} \le \|x^\star\|_{\mathcal{A}}\}$ is the tangent cone and $N_{\mathcal{A}}(x^\star) = T_{\mathcal{A}}(x^\star)^* = \{s : \langle s, x^\star \rangle = t\|x^\star\|_{\mathcal{A}},\, \|s\|_{\mathcal{A}}^* \le t \text{ for some } t \ge 0\}$ is its polar normal cone, while under bounded noise $\|y - \Phi x^\star\|_2 \le \delta$ the condition $\|\Phi z\|_2 \ge \epsilon \|z\|_2$ on $T_{\mathcal{A}}(x^\star)$ guarantees $\|\hat{x} - x^\star\|_2 \le 2\delta/\epsilon$.'
  evidence:
  - source_id: crpw2012-atomic-norm-pdf
    locator: Section 2, pp. 4-10, Equations (1)-(11), Propositions 2.1-2.2
    relation: supports
- claim_id: gordon-escape-polar-normal-cone-distance-bound-and-canonical-atomic-gaussian-widths
  kind: mechanism
  statement: 'For an i.i.d. Gaussian measurement matrix $\Phi \in \mathbb{R}^{n \times p}$ with entry variance $1/n$ and spherical tangent-cone section $\Omega = T_{\mathcal{A}}(x^\star) \cap \mathbb{S}^{p-1}$, Gordon''s escape-through-a-mesh inequality guarantees exact recovery with probability at least $1 - \exp(-\frac{1}{2}[\lambda_n - w(\Omega)]^2)$ when $n \ge w(\Omega)^2 + 1$ (where $\lambda_n = \mathbb{E}_{g \sim \mathcal{N}(0, I_n)}[\|g\|_2] \ge \frac{n}{\sqrt{n+1}}$) and robust recovery $\|\hat{x} - x^\star\|_2 \le 2\delta/\epsilon$ when $n \ge \frac{w(\Omega)^2 + 3/2}{(1 - \epsilon)^2}$; by Lagrangian duality on the cone $\mathcal{C} = T_{\mathcal{A}}(x^\star)$ and its polar $\mathcal{C}^* = N_{\mathcal{A}}(x^\star)$, $w(\mathcal{C} \cap \mathbb{S}^{p-1}) \le \mathbb{E}_g[\operatorname{dist}(g, \mathcal{C}^*)]$ and $w(\mathcal{C} \cap \mathbb{S}^{p-1})^2 \le \mathbb{E}_g[\operatorname{dist}(g, \mathcal{C}^*)^2]$ (with Moreau sum-of-squares $w(\mathcal{C} \cap \mathbb{S}^{p-1})^2 + w(\mathcal{C}^* \cap \mathbb{S}^{p-1})^2 \le p$ and $w(\mathcal{C} \cap \mathbb{S}^{p-1})^2 \le p/2$ for self-dual cones), yielding explicit non-asymptotic sample complexity thresholds: $2s\log(p/s) + \frac{5}{4}s + 1$ for $s$-sparse vectors in $\mathbb{R}^p$ ($\ell_1$ norm), $3r(m_1 + m_2 - r) + 1$ for $m_1 \times m_2$ rank-$r$ matrices (nuclear norm), $\frac{p+k}{2}$ for sign vectors on a $k$-face ($\ell_\infty$ norm), $\frac{3m^2 - m}{4}$ for $m \times m$ orthogonal matrices (spectral norm), and $9m\log m$ for $m \times m$ permutation matrices (Birkhoff polytope).'
