- claim_id: theta-body-semidefinite-relaxations-terracini-secant-lower-bounds-and-moreau-proximal-decomposition
  kind: scope
  statement: 'When the atomic set $\mathcal{A} = V_{\mathbb{R}}(I)$ is the real algebraic variety of a polynomial ideal $I \subset \mathbb{R}[x]$ whose convex hull is computationally intractable, the $k$-th semidefinite theta body $\mathrm{TH}_k(I) = \{x \in \mathbb{R}^p : f(x) \ge 0 \text{ for all linear } f \text{ that are } k\text{-sos modulo } I\}$ forms an outer relaxation hierarchy $\operatorname{conv}(V_{\mathbb{R}}(I)) \subseteq \cdots \subseteq \mathrm{TH}_{k+1}(I) \subseteq \mathrm{TH}_k(I)$ whose enlarged tangent cones quantify the tradeoff between computational tractability and measurement complexity (requiring $\mathcal{O}(m)$ Gaussian measurements for $m \times m$ rank-1 cut matrices under both the cut polytope $\mathcal{P}$ and elliptope SDP relaxation $\mathcal{P}_1 = \mathrm{TH}_2(I)$, versus $\frac{m^2 - m}{4}$ measurements under the box relaxation $\mathcal{P}_2$); moreover, Terracini''s Lemma on the $(k-1)$-th secant variety tangent space $\mathcal{T}(a_1, \mathcal{A}) \oplus \cdots \oplus \mathcal{T}(a_k, \mathcal{A}) \subset T_{\mathcal{A}}(x^\star)$ establishes relaxation-independent measurement lower bounds, and Moreau decomposition splits any $x = \Pi_{\mathcal{A}}(x; \mu) + \Lambda_{\mathcal{A}}(x; \mu)$ into the atomic-norm proximity operator $\Pi_{\mathcal{A}}(x; \mu) = \arg\min_y \frac{1}{2}\|x - y\|_2^2 + \mu \|y\|_{\mathcal{A}}$ and the dual-norm ball projection $\Lambda_{\mathcal{A}}(x; \mu) = \arg\min_z \{\|x - z\|_2 : \|z\|_{\mathcal{A}}^* \le \mu\}$.'
  evidence:
