claims:
- claim_id: r457-prox-correction-exponential-unrolling-and-virtual-sequence-mechanism
  kind: mechanism
  statement: Unrolls the K local prox-corrected steps to show that x_{i,K}^t - x_{i,0}^t = -lambda * sum_{k=0}^{K-1} gamma_k * g~_{i,k}^t + lambda * gamma * g^hat_i^{t-1} where gamma_k = (eta_l/lambda)*(1 - eta_l/lambda)^{K-1-k} and gamma = 1 - (1 - eta_l/lambda)^K (Lemma C.1, Equation 2), so that the prox-correction variable evolves as the exponential moving average g^hat_i^t = (1 - gamma)*g^hat_i^{t-1} + sum_{k=0}^{K-1} gamma_k * g~_{i,k}^t (Lemma C.2, Equation 3) and maps to a bias-free virtual sequence z^t (Lemma C.3, Equations 4-5).
  evidence:
  - source_id: r457-primary-pdf
    locator: Section 3 Equations 2-3, Section 4 Equations 4-5, and Appendix C.1-C.3 Lemmas C.1-C.3, pp. 4-6 & Appendix
    relation: supports
- claim_id: r457-large-local-interval-o-one-over-t-nonconvex-convergence-scope
  kind: scope
  statement: Proves in Theorem 4.4 and Corollary 4.5 that for L-smooth non-convex objectives under bounded stochastic variance sigma_l^2 and bounded client heterogeneity sigma_g^2, setting rho = O(1/sqrt(T)), eta_l = O(1/K) >= lambda/K, and large local interval K = O(T) achieves an O(1/T) convergence rate on (1/T) sum_{t=1}^T E[||nabla F(z^t)||^2] without assuming exact local stationary solutions.
  evidence:
  - source_id: r457-primary-pdf
    locator: Section 4 Theoretical Analysis (Assumptions 4.1-4.3, Theorem 4.4, Corollary 4.5, Remarks 4.6-4.7) & Appendix C.4, pp. 5-6 & Appendix
    relation: supports
- claim_id: r457-extra-gradient-compute-cost-and-client-state-limitation
  kind: limitation
  statement: Requires two gradient evaluations per local minibatch step (increasing per-round wall-clock training time by approximately 1.57x over FedAvg on ResNet-18) and requires each client to maintain the persistent prox-correction state vector g^hat_i^t across rounds.
  evidence:
  - source_id: r457-primary-pdf
    locator: Appendix B.3.3 Time Cost (Table 5) & Algorithm 1, pp. 4 & Appendix B
    relation: supports
- claim_id: r457-low-participation-non-iid-deep-vision-application
  kind: application
  statement: Applied to non-IID federated deep learning on CIFAR-10, CIFAR-100, and Tiny-ImageNet under 10% (100 clients) and 2% (500 clients) partial participation with large local intervals K up to 20 epochs.
  evidence:
  - source_id: r457-primary-pdf
    locator: Section 5 Experiments (Table 1, Figures 1-2) & Appendix B.3 (Tables 3-8), pp. 6-9 & Appendix
    relation: supports
