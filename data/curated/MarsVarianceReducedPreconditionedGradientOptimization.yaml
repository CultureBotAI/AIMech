claims:
- claim_id: preconditioned-omd-equivalence-for-adamw-lion-and-shampoo
  kind: mechanism
  statement: Section 3.1 (p. 3-4) shows that any optimizer update of the Online Mirror Descent form x_{t+1} = argmin_x { eta_t <m_t, x> + (1/2) ||x - x_t||_{H_t}^2 } = x_t - eta_t H_t^{-1} m_t recovers Adam (with diagonal H_t = sqrt(v_t + eps)), Lion (with diagonal H_t = diag(|m_t|) yielding H_t^{-1} m_t = sign(m_t)), and idealized Shampoo / Muon (with spectral preconditioner H_t = (m_t m_t^T)^{1/2} yielding the orthogonal polar factor U_t V_t^T of m_t = U_t Sigma_t V_t^T).
  evidence:
  - source_id: r604-primary-pdf
    locator: Section 3.1, Eqs. 3.1-3.4, p. 3-4
    relation: supports
- claim_id: scaled-storm-recursive-momentum-and-proposition-3-2-identity
  kind: mechanism
  statement: Proposition 3.2 (p. 4) proves that the scaled STORM momentum recursion m_t = beta_1 m_{t-1} + (1 - beta_1) nabla f(x_t, xi_t) + gamma_t beta_1 (nabla f(x_t, xi_t) - nabla f(x_{t-1}, xi_t)) is algebraically equivalent to a standard EMA update m_t = beta_1 m_{t-1} + (1 - beta_1) c_t applied to the variance-reduced gradient estimator c_t = nabla f(x_t, xi_t) + gamma_t (beta_1 / (1 - beta_1))(nabla f(x_t, xi_t) - nabla f(x_{t-1}, xi_t)), allowing c_t (with optional unit-ball norm clipping Clip(c_t, 1)) to be plugged directly into AdamW (Algorithm 2), Lion (Algorithm 3), and Shampoo/Muon (Algorithm 4).
  evidence:
  - source_id: r604-primary-pdf
    locator: Section 3.2-3.3, Proposition 3.2 and Algorithms 1-4, p. 4-6
    relation: supports
- claim_id: optimal-o-epsilon-minus-3-nonconvex-preconditioned-complexity-theorem-4-2
  kind: scope
  statement: Under L-average-smooth nonconvex stochastic objectives with bounded variance sigma^2 and bounded condition-number drift of the positive-definite preconditioners {H_t} (Assumption 4.1), Theorem 4.2 and Corollary 4.3 (Section 4, p. 6-7) prove that MARS with gamma_t = 1 achieves E[||nabla F(x_hat)||_2] <= epsilon within O(epsilon^{-3}) stochastic gradient queries, improving over the O(epsilon^{-4}) rate of unreduced preconditioned SGD and Adam.
  evidence:
  - source_id: r604-primary-pdf
    locator: Section 4, Assumption 4.1, Theorem 4.2, and Corollary 4.3, p. 6-7
    relation: supports
- claim_id: gpt2-pretraining-token-and-wall-clock-efficiency
  kind: application
  statement: On GPT-2 fineWeb pretraining across 125M (small), 355M (medium), and 770M (large) parameter scales, MARS-AdamW, MARS-Lion, and MARS-Shampoo consistently achieve lower validation perplexity and higher downstream zero-shot accuracy than AdamW, Lion, and Muon while reducing training tokens and wall-clock time by up to 35-50%.
  evidence:
  - source_id: r604-primary-pdf
    locator: Section 5, Figures 1-4 and Tables 1-4, p. 7-9
    relation: supports
- claim_id: exact-storm-double-gradient-cost-versus-mars-approx-bias
  kind: limitation
  statement: "Exact MARS (Algorithms 1-4) requires evaluating both nabla f(x_t, xi_t) and nabla f(x_{t-1}, xi_t) on the same minibatch xi_t\u2014doubling per-step backward passes\u2014whereas the single-pass practical approximation MARS-approx (Algorithm 5, p. 6) replaces nabla f(x_{t-1}, xi_t) with the cached previous minibatch gradient nabla f(x_{t-1}, xi_{t-1}), introducing cross-minibatch variance that requires a smaller scaling factor gamma_t (typically gamma_t in [0.025, 0.05])."
  evidence:
  - source_id: r604-primary-pdf
    locator: Section 3.3, Algorithm 5 and Remark on MARS-approx, p. 5-6
    relation: supports
