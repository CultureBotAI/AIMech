id: AIMech:MarsVarianceReducedPreconditionedGradientOptimization
name: MARS (Make vAriance Reduction Shine Preconditioned Optimizer Framework)
concept_kind: algorithm
review_status: DRAFT
definition: A unified variance-reduced preconditioned stochastic optimization framework for training large deep models that combines an Online Mirror Descent / matrix-preconditioned update x_{t+1} = argmin_x { eta_t <m_t, x> + (1/2) ||x - x_t||_{H_t}^2 } with a scaled STORM-style stochastic recursive momentum estimator. At step t, MARS forms the variance-reduced gradient surrogate c_t = nabla f(x_t, xi_t) + gamma_t (beta_1 / (1 - beta_1))(nabla f(x_t, xi_t) - nabla f(x_{t-1}, xi_t)) with scaling factor gamma_t in [0, 1] (clipped to L2 norm 1 for stability), accumulates m_t = beta_1 m_{t-1} + (1 - beta_1) c_t, and applies preconditioned updates yielding MARS-AdamW, MARS-Lion, and MARS-Shampoo (including Newton-Schulz orthogonalized MARS-Muon), alongside a single-pass approximate variant MARS-approx that replaces nabla f(x_{t-1}, xi_t) with nabla f(x_{t-1}, xi_{t-1}).
identity_notes: 'Distinct from unpreconditioned STORM (AIMech:StormStochasticRecursiveMomentumForNonconvexOptimization), AdamW, Lion (AIMech:LionEvoSignMomentumOptimizer), and Shampoo (AIMech:ShampooKroneckerFactoredPreconditionedOptimizer): MARS unifies preconditioned adaptive optimization and recursive variance reduction through Proposition 3.2, introducing the control-variate scaling factor gamma_t that continuously interpolates between standard exponential moving average momentum (gamma_t = 0) and full recursive momentum (gamma_t = 1) before applying diagonal, elementwise-sign, or orthogonal-matrix preconditioning H_t.'
aliases:
- MARS Optimizer Framework
- MARS-AdamW and MARS-Lion and MARS-Shampoo
- Make Variance Reduction Shine
