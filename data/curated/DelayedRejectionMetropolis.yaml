claims:
- claim_id: method
  kind: mechanism
  statement: For current x with pi(x)>0, propose y1 from q1(x,·) and use a1(x,y1)=min(1,pi(y1)q1(y1,x)/(pi(x)q1(x,y1))).
    If rejected, draw y2 from q2(x,y1,·). Accept y2 with min(1, [pi(y2)q1(y2,y1)q2(y2,y1,x)(1−a1(y2,y1))]/[pi(x)q1(x,y1)q2(x,y1,y2)(1−a1(x,y1))]).
    The zero reverse-path case has acceptance zero. A fixed two-stage implementation retains x if both
    tests reject. Higher stages require the corresponding reversed-path proposal and previous-rejection
    products; simply applying ordinary Metropolis to each retry omits those factors.
