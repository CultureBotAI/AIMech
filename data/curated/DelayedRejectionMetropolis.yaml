name: Delayed-rejection Metropolis
definition: A Metropolis-Hastings sampling procedure that can propose another candidate after rejection
  within the same transition, correcting acceptance for the probabilities of the forward and reversed
  rejected paths.
concept_kind: algorithm
identity_notes: This is the path-reversal delayed-rejection construction in Mira Sections 2–3. Rejected
  internal candidates are auxiliary information; the chain remains at its original state until a candidate
  is accepted or the transition ends. It differs from across-iteration adaptive Metropolis and from independent
  repeated accept-reject generation. No normalized match was found across all 442 pinned AIO labels/scoped
  synonyms and 175 prior native IDs/names/aliases. Full-checkout searches included ignored and hidden
  files in both worktrees; the only text hit was an unrelated installed-package checksum substring. Existing
  general Metropolis-Hastings, Metropolis-within-Gibbs and random-walk records were inspected to resolve
  these specialization boundaries.
limitations:
- Proposal support and well-defined forward-path probabilities are required; formulas apply to reachable
  rejection paths. Irreducibility and convergence need further conditions beyond detailed balance.
- The record gives the explicit two-stage rule and identifies the higher-stage construction, not a claim
  that every history-dependent retry is valid.
- Extra stages cost proposal and target evaluations. Per-transition asymptotic-variance comparisons do
  not guarantee faster estimates per unit computation.
- A finite stage cap retains the original state after all rejections. Eventual acceptance is not guaranteed
  for unrestricted retry schemes.
