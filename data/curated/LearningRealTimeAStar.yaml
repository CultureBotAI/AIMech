name: Learning real-time A*
definition: A real-time heuristic learning algorithm that moves to a minimum estimated path-cost neighbor,
  stores that minimum edge-cost-plus-heuristic value at the state it leaves, and retains learned state
  estimates across repeated problem-solving trials with the same goals.
concept_kind: algorithm
identity_notes: 'This is Korf’s LRTA* formulation with a minimum-value backup rather than basic RTA*’s
  second-best backup. It learns state cost-to-go estimates from search experience; it is not ordinary
  A*, a trained neural network, Fill’s local-minimum-only cost increments, or Q-learning’s sampled action-value
  update. The inspected formulation is direct assignment of the minimum backup, not an added maximum with
  the state’s old value. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 313 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 24 and 24 lines respectively. All 24 unique lines were
  inspected, and the sorted checkout hit sets were identical: prior leads, neighboring Breakout descriptions
  and their saved reviews/ledgers, not existing candidate records. Seven exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and four full native neighboring records were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.'
limitations:
- The learning result does not say every state in an arbitrary graph is learned exactly, nor that a fixed
  finite number of trials certifies convergence. Random initial-state sampling and random tie resolution
  provide the repeated exploration used in the proof.
- 'Non-overestimation matters: an initially overestimated state can be avoided and remain uncorrected.
  The 1988 proof explicitly assumes h(goal)=0; the 1990 proof uses the same equality. Non-overestimation
  alone would not imply that equality if negative goal estimates were permitted.'
- LRTA* can repeatedly traverse a heuristic depression before escaping and does not inherit basic RTA*’s
  tree local-optimality theorem. Good asymptotic estimates do not ensure that an early trial follows a
  shortest path.
- Replacing h(n) with max(old h(n), minimum backup) is an additional convention not asserted as the same
  literal source update. The direct minimum can decrease an admissible but inconsistent initial value;
  that does not contradict preservation of non-overestimation.
- The table stores state estimates, and the method evaluates successor costs. It is not Q-learning’s model-free
  sampled state-action update. No stochastic-transition extension, function-approximation guarantee, convergence
  rate or numerical puzzle result is curated.
