claims:
- claim_id: method
  kind: mechanism
  statement: At each non-goal state n, use stored or initial heuristic values for its neighbors and form
    k(n,n′)+h(n′), where k is the edge cost. Move to a neighbor attaining the minimum and assign that
    minimum to h(n). Preserve the table across subsequent trials in the same problem space with the same
    goal set. This best-value backup replaces RTA*’s second-best backup. It can change values even when
    the state is not a local minimum and can decrease an initially inconsistent estimate. The source gives
    the same finite-space, positive-edge, finite-heuristic and everywhere-goal-reachable conditions for
    eventual goal finding as basic RTA*. For learning convergence, it additionally assumes non-overestimating
    initial estimates, zero estimates at goals, repeated random sampling of the initial states and random
    tie handling so the relevant alternatives continue to be explored. Under those conditions, its theorem
    concerns exact learned values along every optimal path from the sampled initial-state set to a goal
    over repeated trials.
