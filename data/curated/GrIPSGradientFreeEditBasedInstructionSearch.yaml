claims:
- claim_id: grips-phrase-level-edit-space
  kind: mechanism
  statement: 'GrIPS segments a base instruction into constituent phrases using a constituency parser and generates candidate instructions at each search step via four phrase-level edit operations: phrase deletion, phrase swapping, phrase substitution (via a paraphrase model), and phrase addition from previously deleted phrases.'
  evidence:
  - source_id: r732-primary-pdf
    locator: Section 3.1, pp. 3829-3830, Figure 1
    relation: supports
- claim_id: grips-entropy-regularized-scoring-mechanism
  kind: mechanism
  statement: To break accuracy ties on small few-shot score sets and penalize degenerate single-class biases, GrIPS evaluates candidate instructions with a composite objective that adds an entropy bonus over the empirical distribution of predicted labels to balanced classification accuracy.
  evidence:
  - source_id: r732-primary-pdf
    locator: Section 3.2, pp. 3830-3831
    relation: supports
- claim_id: grips-black-box-instruction-tuning-application
  kind: application
  statement: GrIPS optimizes task instructions for instruction-tuned and black-box language models including InstructGPT, GPT-3, and T0 across Natural-Instructions benchmarks without requiring access to model weights or gradients.
  evidence:
  - source_id: r732-primary-pdf
    locator: Section 4 & Section 5, pp. 3831-3836, Tables 1-4
    relation: supports
  - source_id: r732-metadata-cr
    locator: DBLP bibliographic record conf/eacl/PrasadHZB23
    relation: supports
- claim_id: grips-initial-instruction-dependency-limitation
  kind: limitation
  statement: Because GrIPS performs local edit search around a seed instruction, its reachable search space is constrained by the structure and content of the initial manual instruction and can overfit when the validation score set is extremely small.
  evidence:
  - source_id: r732-primary-pdf
    locator: Section 5 & Limitations, pp. 3835-3839
    relation: supports
