id: AIMech:GrIPSGradientFreeEditBasedInstructionSearch
name: GrIPS Gradient-Free Edit-Based Instruction Search
concept_kind: algorithm
review_status: DRAFT
definition: "A gradient-free discrete prompt optimization algorithm that segments a natural language task instruction into constituent syntactic phrases and iteratively searches for higher-performing instructions by applying phrase-level edit operations\u2014deletion, swapping, paraphrase substitution, and re-addition of deleted phrases\u2014scored on a small labeled evaluation set using balanced accuracy regularized by label-prediction entropy."
identity_notes: Distinct from gradient-guided discrete trigger search (AIMech:AutoPromptGradientGuidedDiscretePromptSearch), which requires first-order embedding gradients to rank vocabulary token replacements, and from reinforcement-learning token generation (AIMech:RLPromptReinforcementLearningDiscretePromptOptimization), which trains a continuous policy head over token sequences. Also distinct from derivative-free continuous subspace prompt optimization (AIMech:BBTBlackBoxTuningForLanguageModelAsAService), which optimizes continuous vectors via CMA-ES rather than human-interpretable phrase-level text edits.
aliases:
- GrIPS
- Gradient-free Edit-based Instruction Search
- Phrase-Level Edit-Based Instruction Search
