claims:
- claim_id: claim-chambolle-pock-extrapolated-primal-dual-gap-and-preconditioned-admm
  kind: mechanism
  statement: For the saddle-point problem min_{x in X} max_{y in Y} <K x, y> + G(x) - F^*(y) with L = ||K||, Algorithm 1 with extrapolation parameter theta = 1 (x_bar^{n+1} = 2 x^{n+1} - x^n) is algebraically identical to ADMM preconditioned by the symmetric proximal operator M = (1/sigma)I - tau K K^* (Section 4.3, Equations 32-34) and reduces to Douglas-Rachford splitting when K = I (Section 4.2); whenever tau * sigma * L^2 < 1, Theorem 1 proves that the iterates remain bounded via ||y^n - y_hat||^2/(2*sigma) + ||x^n - x_hat||^2/(2*tau) <= (1 - tau*sigma*L^2)^{-1}(||y^0 - y_hat||^2/(2*sigma) + ||x^0 - x_hat||^2/(2*tau)) and the ergodic averages x_N = (1/N) sum_{n=1}^N x^n, y_N = (1/N) sum_{n=1}^N y^n satisfy the O(1/N) restricted primal-dual gap bound G_{B_1 x B_2}(x_N, y_N) <= D(B_1, B_2) / N.
  evidence:
  - source_id: r346-primary-pdf
    locator: Section 3.1, Algorithm 1, Theorem 1, and Equations 7-16, pp. 4-8; Section 4.2-4.3, Equations 24-34, pp. 11-13
    relation: supports
  - source_id: r346-arxiv-abs
    locator: 'Abstract: convergence to a saddle-point with rate O(1/N) in finite dimensions'
    relation: supports
- claim_id: claim-chambolle-pock-accelerated-and-linearly-convergent-variants
  kind: mechanism
  statement: When G is gamma-uniformly convex (Equation 35), Algorithm 2 dynamically updates theta_n = 1 / sqrt(1 + 2*gamma*tau_n), tau_{n+1} = theta_n * tau_n, and sigma_{n+1} = sigma_n / theta_n from tau_0 * sigma_0 * L^2 = 1, satisfying lim_{N -> infty} N * gamma * tau_N = 1 (Corollary 1) and achieving optimal O(1/N^2) primal distance convergence ||x_hat - x^N||^2 <= ((1 + varepsilon)/N^2) * (||x_hat - x^0||^2/(gamma^2 * tau_0^2) + (L^2/gamma^2)*||y_hat - y^0||^2) (Theorem 2); when both G (gamma-uniformly convex) and F^* (delta-uniformly convex) are strongly convex, Algorithm 3 with mu = 2*sqrt(gamma*delta)/L, tau = (1/L)*sqrt(delta/gamma), sigma = (1/L)*sqrt(gamma/delta), and theta in [1/(1+mu), 1] achieves global linear convergence gamma*||x^N - x_hat||^2 + (1 - omega)*delta*||y^N - y_hat||^2 <= omega^N * (gamma*||x^0 - x_hat||^2 + delta*||y^0 - y_hat||^2) with rate omega = (1 + theta) / (2 * (1 + sqrt(gamma*delta)/L)) < 1 (Theorem 3, Equations 57-59).
  evidence:
  - source_id: r346-primary-pdf
    locator: Section 5.1, Algorithm 2, Lemmas 1-2, Corollary 1, and Theorem 2, pp. 13-17; Section 5.2, Algorithm 3 and Theorem 3, pp. 18-20
    relation: supports
  - source_id: r346-metadata-cr
    locator: Journal of Mathematical Imaging and Vision 40(1):120-145 bibliographic record and abstract
    relation: supports
- claim_id: claim-chambolle-pock-spectral-stepsize-restriction-and-arrow-hurwicz-suboptimality
  kind: limitation
  statement: Convergence of Algorithm 1 requires knowing or upper-bounding the operator norm L = ||K|| to enforce tau * sigma * L^2 <= 1 (at equality tau * sigma * L^2 = 1, control of the dual iterate y^N in Equation 15 is lost unless reformulated in y_bar, Remark 1, p. 8), and setting the extrapolation parameter to theta = 0 (the classical semi-implicit Arrow-Hurwicz method, Section 3.2) introduces an uncompensated residual error tau * L^2 * D^2 / (2*beta) in the primal-dual gap (Equation 20), which requires bounded domain D = diam(dom F^*) < infty and tau = 1/sqrt(N) to guarantee only a slower O(1/sqrt(N)) worst-case convergence rate.
  evidence:
  - source_id: r346-primary-pdf
    locator: Section 3.1, Remark 1, p. 8; Section 3.2, The Arrow-Hurwicz method (theta = 0), Equations 17-20, pp. 8-9; Section 7, Discussion, p. 42
    relation: supports
