claims:
- claim_id: method
  kind: mechanism
  statement: Refresh standard Gaussian momentum and draw a slice variable below the current joint density.
    Build a balanced trajectory tree by randomly extending forward or backward through 1, 2, 4 and further
    powers of two leapfrog steps. Check both endpoint dot products for the balanced subtrees; stop if
    either turns negative or the slice-relative joint log density falls below the allowed energy-error
    threshold. States outside the slice cannot be next samples. A stopping condition inside the newly
    added half-tree excludes that half-tree from candidate selection; a U-turn only at the completed whole-tree
    boundary permits its valid candidates. Efficient Algorithm 3 samples a representative within each
    new subtree in proportion to valid-state counts, then updates the retained candidate with probability
    min(1,n_new/n_old) when that new subtree is valid. Its transition preserves the uniform distribution
    over the valid candidate set; it is not simply uniform selection from the final whole tree.
  evidence:
  - source_id: method-source
    locator: Sections 3.1.1–3.1.2, conditions C.1–C.4, Equations (3)–(4), Algorithms 2–3 and transition
      kernel T, printed pp. 1597–1606 / PDF pp. 5–14
    relation: supports
- claim_id: nuts-domain
  kind: limitation
  statement: The paper limits direct use to differentiable continuous coordinates, discusses transformations
    and separate treatment of discrete variables, and identifies mass-matrix changes as extensions rather
    than the unit-mass formulation itself.
  evidence:
  - source_id: nuts-domain
    locator: Section 5, printed pp. 1619–1620 / PDF pp. 27–28
    relation: supports
