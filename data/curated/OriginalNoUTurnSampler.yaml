name: No-U-Turn sampler (original slice formulation)
definition: The original 2014 slice-based NUTS algorithm, which adapts a Hamiltonian trajectory’s length
  through randomly directed binary-tree doubling and selects a valid next state while enforcing subtree
  U-turn and reversibility conditions.
concept_kind: algorithm
identity_notes: This record is restricted to Hoffman and Gelman’s 2014 slice formulation, principally
  efficient Algorithm 3. Algorithm 2 is its simpler uniform-selection derivation. The paper’s acronym
  NUTS is context, not an asserted exact alias for every later algorithm with that name. Dual-averaging
  step-size warmup is separable from the fixed-step-size NUTS transition. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 153 prior native IDs/names/aliases. Both
  checkout text searches included ignored and hidden files and returned no matches for the selected exact
  IDs, full labels, aliases and source titles. Existing HMM and Markov random field records describe probability
  models, not these sampling or tuning procedures.
limitations:
- Stopping one forward trajectory at its first U-turn without the paper’s balanced-tree construction and
  candidate exclusions is not the defined valid NUTS kernel.
- The source mechanism uses identity mass and its corresponding Euclidean dot-product criterion. Nonidentity
  or position-dependent metrics require an appropriate formulation; no generalized metric rule is inferred
  here.
- Eliminating a preset leapfrog-step count does not eliminate step size, numerical-divergence handling,
  model geometry, convergence assessment or implementation resource limits.
- The efficient top-level candidate transition and uniform selection within a subtree are different operations.
  Zero valid-candidate counts require guarded implementation; no literal zero-over-zero probability is
  asserted.
- This is not a specification of later multinomial NUTS or current Stan defaults. No author implementation
  was executed or performance result reproduced.
