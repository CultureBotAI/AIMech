claims:
- claim_id: claim-spectral-initialization-and-alternating-phase-least-squares-contraction
  kind: mechanism
  statement: For Gaussian measurements $a_\ell\sim\mathcal{N}(0,I)$, the weighted covariance matrix $Y = \frac{1}{m}\sum_{\ell=1}^m y_\ell^2 a_\ell a_\ell^*$ has expectation $\mathbb{E}[Y] = \|x^*\|_2^2(I + 2\frac{x^*(x^*)^*}{\|x^*\|_2^2})$ so its top eigenvector $x^0$ achieves $\mathrm{dist}(x^0,x^*) \le c_0 < 1/6$ with $m_0 = O(n\log^3 n)$ samples (Lemma 4.1); from any iterate with $\|w^t\|_2 = \sqrt{1 - |\langle x^t,x^*\rangle|^2} \le 1/6$, the exact least-squares update $x^{t+1} = ((A^{(t+1)})^* A^{(t+1)})^{-1}(A^{(t+1)})^* C^{t+1} y^{(t+1)}$ satisfies $x^{t+1} = \alpha_t x^* - w^t + ((A^{(t+1)})^* A^{(t+1)})^{-1}(A^{(t+1)})^* v^t$ where the phase-disagreement indicator $\mathbf{1}_{c_i^t c_i^* = -1}$ occurs only when $|a_i^\top w^t| \ge \alpha_t|a_i^\top x^t|$, bounding $\frac{1}{m}\|(A^{(t+1)})^* v^t\|_2 \le \frac{1}{2}\|w^t\|_2$ (Lemma 4.3) and proving $\mathrm{dist}(x^{t+1},x^*) \le \frac{3}{4}\mathrm{dist}(x^t,x^*)$ (Theorem 2.1 & Lemma 4.2).
  evidence:
  - source_id: njs2015-altminphase-pdf
    locator: Section II & Section IV, Algorithm 1, Theorem 2.1, & Lemmas 4.1-4.3, pp. 4-6, 9-12
    relation: supports
  - source_id: njs2015-altminphase-abs
    locator: Abstract
    relation: supports
- claim_id: claim-sparse-altminphase-marginal-support-selection-and-cosamp-refinement
  kind: mechanism
  statement: For a $k$-sparse vector $x^*\in\mathbb{R}^n$ with support $S = \mathrm{supp}(x^*)$, the marginal fourth-moment statistics $Z_j = \frac{1}{m}\sum_{\ell=1}^m y_\ell^2 |a_{\ell j}|^2$ satisfy $\mathbb{E}[Z_j] = \|x^*\|_2^2 + 2|x_j^*|^2$, so selecting the $k$ largest $Z_j$ exactly recovers $S$ using $m = O(k^2\log n)$ samples when $\min_{j\in S}|x_j^*| \ge \frac{C}{\sqrt{k}}\|x^*\|_2$ (Theorem 2.2 & Lemma 5.1); for arbitrary $k$-sparse signals without a minimum non-zero entry bound, *SparseAltMinPhase* (Algorithm 2) initializes on the active support of high-magnitude coordinates and replaces the least-squares step by $x^{t+1} = \mathrm{CoSaMP}(A^{(t+1)}/\sqrt{m}, C^{t+1} y^{(t+1)}/\sqrt{m}, k)$, achieving $\|x^T - c x^*\|_2 \le \epsilon\|x^*\|_2$ with $m = O(k^2\log n + k\log n\log(1/\epsilon))$ samples (Theorem 2.3 & Lemma 5.3).
  evidence:
  - source_id: njs2015-altminphase-pdf
    locator: Section II & Section V, Algorithm 2, Theorems 2.2 & 2.3, & Lemmas 5.1-5.3, pp. 5-6, 13-16
    relation: supports
  - source_id: njs2015-altminphase-cr
    locator: Crossref metadata and published abstract for IEEE Trans. Signal Process. 63(18):4814-4826
    relation: supports
- claim_id: claim-noise-robustness-and-quadratic-computational-scaling
  kind: scope
  statement: "Under noisy magnitude measurements $y = |A x^* + \\eta|$ with $\\|\\eta\\|_\\infty \\le \\frac{\\|x^*\\|_2}{100\\sqrt{n}}$ and $\\|\\eta\\|_2 \\le \\frac{\\sqrt{m}\\|x^*\\|_2}{100}$, Theorem 4.4 proves that AltMinPhase achieves $\\mathrm{dist}(x^T,x^*) \\le \\epsilon + \\frac{4\\|\\eta\\|_2}{\\sqrt{m}\\|x^*\\|_2}$ in $O(n^2\\log^3 n(\\log n + \\log^2(1/\\epsilon)))$ total arithmetic operations \u2014 quadratically faster in dimension $n$ than the $O(n^3/\\epsilon^2)$ interior-point/first-order complexity of semidefinite programming relaxations such as PhaseLift."
  evidence:
  - source_id: njs2015-altminphase-pdf
    locator: Section II, Table 1, p. 6; Section IV-A, Theorem 4.4, pp. 12-13
    relation: supports
- claim_id: claim-limitation-sample-splitting-polylog-overhead-and-quadratic-sparse-bottleneck
  kind: limitation
  statement: The theoretical proof of AltMinPhase relies on fresh independent measurement batches $(A^{(t+1)},y^{(t+1)})$ at each iteration to decouple $x^t$ from $A^{(t+1)}$, incurring an extra $O(\log^3 n\log(1/\epsilon))$ sample factor over the information-theoretic $O(n)$ threshold, while SparseAltMinPhase requires $m = \Omega(k^2\log n)$ samples for fourth-moment support identification rather than the information-theoretic $O(k\log(n/k))$ limit.
  evidence:
  - source_id: njs2015-altminphase-pdf
    locator: Section II, Remarks on Theorem 2.1 & Theorem 2.3, pp. 4-6; Section VI Conclusions, p. 17
    relation: supports
