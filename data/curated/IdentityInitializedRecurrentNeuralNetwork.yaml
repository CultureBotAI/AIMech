limitations:
- Identity and zero recurrent bias are initialization conditions. Recurrent weights and biases may change
  during training; no permanent diagonal or orthogonal constraint is asserted.
- Memory and derivative preservation require the stated initial parameters and activation/input conditions.
  Inactive units and a zero-activation derivative convention limit unconditional claims.
- The scaled-identity iRNN configuration is retained as a documented variant. Its forgetting calculation
  assumes a fixed positive scalar, active paths and no input contribution, rather than arbitrary trained
  dynamics.
- Unit initial recurrent gain does not cap state magnitudes or update sizes. Positive input can accumulate,
  and the paper reports unfavorable full-identity speech behavior.
- Complete nine-page arXiv v2 paper, figures, tables and references were visually inspected; no author
  implementation, training, model evaluation or independent replication was performed.
- Published comparisons depend on task, tuning, capacity and configuration. No current best performance,
  numerical benchmark or universal LSTM replacement is asserted.
