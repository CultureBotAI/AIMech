claims:
- claim_id: document-semantic-graph-textrank-centrality
  kind: mechanism
  statement: DSGSUM constructs a sentence-level graph with edge weights proportional to shared word counts divided by the sum of log sentence lengths and computes the stationary distribution of a damped random walk to score global sentence salience.
  evidence:
  - source_id: r825-primary-pdf
    locator: Section 2.1, Equations 1-2, pp. 507-508
    relation: supports
- claim_id: salient-sentence-filtering-before-bert-transformer-decoding
  kind: mechanism
  statement: By selecting top-ranked sentences from the document-level semantic graph before applying BERT token/segment/position encoding and a 6-layer Transformer decoder, DSGSUM retains late-occurring salient content that standard 512-token truncation discards.
  evidence:
  - source_id: r825-primary-pdf
    locator: Section 2.2, Algorithm 1, p. 509; Section 2.3, Figure 1, pp. 510-512
    relation: supports
- claim_id: news-and-long-document-abstractive-summarization-application
  kind: application
  statement: DSGSUM is applied to single-document abstractive summarization on news corpora such as CNN/DailyMail and New York Times, improving ROUGE-1, ROUGE-2, and ROUGE-L over lead-truncated BERT baselines.
  evidence:
  - source_id: r825-primary-pdf
    locator: Section 3, Tables 2-3, pp. 512-515
    relation: supports
- claim_id: lexical-overlap-graph-synonym-insensitivity-limitation
  kind: limitation
  statement: Because the sentence similarity graph relies on exact surface word overlap normalized by log sentence length, sentences that express core document themes using synonyms without shared lexical tokens receive lower graph centrality scores.
  evidence:
  - source_id: r825-primary-pdf
    locator: Section 2.1, Equation 1, p. 507; Section 4, p. 518
    relation: supports
