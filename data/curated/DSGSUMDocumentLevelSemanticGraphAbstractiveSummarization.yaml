id: AIMech:DSGSUMDocumentLevelSemanticGraphAbstractiveSummarization
name: DSGSUM Document-Level Semantic Graph Abstractive Summarization
concept_kind: architecture
review_status: DRAFT
definition: A hybrid extractive-abstractive neural text summarization architecture that represents a source document as a sentence-level semantic graph weighted by log-length-normalized lexical overlap, computes damped random-walk TextRank authority scores to select salient sentences before encoding, and feeds the filtered sentence sequence into a pre-trained BERT encoder and multi-layer Transformer decoder to generate abstractive summaries within fixed token-length limits.
identity_notes: No AIO class represents DSGSUM or document-level semantic graph TextRank-guided BERT summarization; ArtificialNeuralNetwork (AIO:ArtificialNeuralNetwork) is the closest broad match covering neural network architectures.
aliases:
- DSGSUM
- Document-Level Semantic Graph Abstractive Summarization
- DSGSUM Hybrid Extractive-Abstractive Summarizer
