id: AIMech:ByrdieByzantineResilientDistributedCoordinateDescentForDecentralizedLearning
name: ByRDiE Byzantine-Resilient Distributed Coordinate Descent for Decentralized Learning
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-resilient decentralized optimization algorithm (ByRDiE) that decomposes a P-dimensional empirical risk minimization problem across a directed network G(J, E) with up to b Byzantine nodes into an outer coordinate-descent loop over coordinates k in {1, ..., P} and an inner T-step scalar screening loop in which each nonfaulty node j in J' discards the b smallest (N_j^s) and b largest (N_j^l) received neighbor scalars [w_i^r(t)]_k before averaging the remaining |N_j| - 2b + 1 values (including self) and stepping along its local coordinate gradient -[grad f_hat(w_j^r(t), S_j)]_k.
identity_notes: Introduced by Zhixiong Yang and Waheed U. Bajwa (IEEE Transactions on Signal and Information Processing over Networks, Vol. 5, No. 4, pp. 611-627, 2019; arXiv:1708.08155). Distinct from BRIDGE (Fang, Yang, & Bajwa, IEEE TSIPN 2022, Round 546), which performs simultaneous full-vector gradient descent with coordinate-wise trimmed mean in a single loop rather than sequential coordinate-by-coordinate T-step inner updates; and distinct from ClippedGossip (He, Karimireddy, & Jaggi, 2022, Round 545), which clips neighbor model differences in L2 norm around a node's own iterate.
aliases:
- ByRDiE
- Byzantine-Resilient Distributed Coordinate Descent
- ByRDiE Decentralized Coordinate Descent
