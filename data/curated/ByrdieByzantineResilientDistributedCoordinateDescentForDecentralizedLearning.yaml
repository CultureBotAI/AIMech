- target: AIO:FederatedLearning
  relation: related_match
  rationale: AIO:FederatedLearning covers collaborative distributed training, whereas ByRDiE is a serverless Byzantine-resilient coordinate-descent algorithm with two-sided scalar neighborhood screening.
limitations:
- Requires at least 2b + 1 incoming neighbors per nonfaulty node so that |N_j| - 2b + 1 >= 1 after trimming b smallest and b largest values.
- Incurs P * T sequential scalar communication rounds per full coordinate cycle.
