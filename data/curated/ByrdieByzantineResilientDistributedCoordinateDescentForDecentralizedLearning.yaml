claims:
- claim_id: byrdie-coordinate-wise-trimmed-screening-and-stochastic-transition-mechanism
  kind: mechanism
  statement: For each coordinate k in {1, ..., P} and inner step t in {1, ..., T}, each nonfaulty node j in J' partitions its incoming neighborhood N_j into the b smallest values N_j^s(r, k, t), the b largest values N_j^l(r, k, t), and the screened set N_j^*(r, k, t) = N_j \ N_j^s \ N_j^l, updating [w_j^r(t+1)]_k = (1 / (|N_j| - 2b + 1)) sum_{i in N_j^* U {j}} [w_i^r(t)]_k - rho(r + t - 1) [grad f_hat(w_j^r(t), S_j)]_k so that any retained Byzantine value is expressible as a convex combination of two trimmed nonfaulty neighbor values.
  evidence:
  - source_id: r551-primary-pdf
    locator: Section III-A Equations (5)-(8) & Section III-B Equations (9)-(13), pp. 4-6
    relation: supports
- claim_id: byrdie-consensus-and-statistical-risk-convergence-scope
  kind: scope
  statement: When every reduced graph G_r obtained by removing all b Byzantine nodes and up to b additional incoming edges per nonfaulty node contains a source component of size at least b + 1, ByRDiE achieves consensus at rate O(sqrt(P) * rho(r)) and converges in probability to the statistical risk minimizer w* with effective sample size N_eff = N / a_bar^2 in [N, |J'|*N] for both T -> infinity and T = 1.
  evidence:
  - source_id: r551-primary-pdf
    locator: Section III-B..D Theorems 1-6, pp. 6-9
    relation: supports
- claim_id: byrdie-sequential-coordinate-communication-latency-limitation
  kind: limitation
  statement: Because ByRDiE updates and screens one coordinate k in {1, ..., P} at a time, each outer pass requires T * P sequential scalar communication rounds tc = (r - 1)*T*P + (k - 1)*T + t, and certifying the reduced-graph source-component condition (Assumption 3) is combinatorially hard on general directed graphs.
  evidence:
  - source_id: r551-primary-pdf
    locator: Section II-A Remark 3 & Section III-E Equation (35), pp. 4, 9
    relation: supports
- claim_id: byrdie-decentralized-svm-and-neural-network-application
  kind: application
  statement: Applied to Byzantine-resilient decentralized linear SVM classification on the infinite MNIST dataset and decentralized multi-layer neural network classification on the Iris dataset under 10%-20% Byzantine node failures.
  evidence:
  - source_id: r551-primary-pdf
    locator: Section IV Numerical Results, Figures 1-3 & Table I, pp. 9-11
    relation: supports
