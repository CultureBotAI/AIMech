claims:
- claim_id: supsup-superposition-entropy-one-shot-and-binary-task-inference
  kind: mechanism
  statement: Given k binary supermasks {M^i}_{i=1}^k over fixed signed-Kaiming weights W, SupSup forms the uniform superposition p(alpha) = f(x, W odot sum_{i=1}^k alpha_i M^i) at alpha_i = 1/k and infers unknown task identity either in One-Shot via a single Frank-Wolfe gradient step argmax_i (-dH(p(alpha))/dalpha_i) or in log_2(k) Binary halving steps that zero out the bottom median of -nabla_alpha H(p(alpha)) and renormalize alpha on the simplex.
  evidence:
  - source_id: r715-primary-pdf
    locator: Section 3.2-3.3 & Appendix A, Equations (1)-(4), Algorithms 1-2, pp. 4-5, 13
    relation: supports
- claim_id: supsup-superfluous-neurons-gradient-theorem-and-nns-allocation
  kind: mechanism
  statement: Adding superfluous output neurons S = {l+1, ..., s} and defining G(y; alpha) = log sum_{v'=1}^s exp(y_{v'}) with gradients detached on real class neurons R = {1, ..., l} makes dG/dy_v identically match the cross-entropy training gradient dL/dy_v on S (Lemma I.1) so that E[-dG/dalpha_j] > 0 >= E[-dG/dalpha_i] for i != j (Lemmas I.2-I.3), while in task-agnostic Scenario NNs a new supermask is allocated whenever k max_i softmax(-nabla_alpha H)_i < 1 + epsilon.
  evidence:
  - source_id: r715-primary-pdf
    locator: Section 3.4, Section 3.6 & Appendix I-J, Lemmas I.1-I.3, J.1-J.3, pp. 5-6, 20-25
    relation: supports
- claim_id: supsup-2500-task-permuted-mnist-and-splitimagenet-continual-learning
  kind: application
  statement: Because W is fixed and generated from a single random seed, SupSup stores only sparse binary masks (achieving 89.58% vs. BatchE's 81.50% top-1 accuracy on 100-task SplitImageNet with ResNet-50) and sequentially learns 2,500 tasks on PermutedMNIST (25,000-way classification) without catastrophic forgetting, maintaining 93.46% accuracy in Scenario GNu and 93.28% in Scenario NNs using single-image One-Shot task inference.
  evidence:
  - source_id: r715-primary-pdf
    locator: Section 4.1-4.3 & Appendix H, Figures 2-4, Tables 2-5, pp. 4, 6-8, 18-19
    relation: supports
  - source_id: r715-metadata-cr
    locator: NeurIPS 2020 bibliographic record
    relation: supports
- claim_id: supsup-miscalibration-and-similar-task-inference-limitation
  kind: limitation
  statement: Gradient-based task identity inference degrades when tasks are closely related (such as 10-degree increments in RotatedMNIST, which require multi-step Binary search over a full batch rather than single-image One-Shot inference) or when uncalibrated subnetworks produce overconfident low-entropy predictions on out-of-task data.
  evidence:
  - source_id: r715-primary-pdf
    locator: Section 4.2, Section 5 & Appendix F, Figures 5, 11, pp. 8-9, 17-18
    relation: supports
