id: AIMech:SupSupSupermasksInSuperposition
name: Supermasks in Superposition
concept_kind: algorithm
review_status: DRAFT
definition: A continual learning algorithm that eliminates catastrophic forgetting by keeping a shared base neural network fixed at random signed-Kaiming initialization W and learning a sparse binary supermask M^i in {0, 1} for each task i, while inferring unknown task identity at inference (or training) time from a weighted superposition p(alpha) = f(x, W odot sum_{i=1}^k alpha_i M^i) via One-Shot or Binary gradient minimization of output Shannon entropy H(p(alpha)) or superfluous-neuron log-partition objective G(y; alpha) = log sum_v exp(y_v).
identity_notes: Introduced by Mitchell Wortsman, Vivek Ramanujan, Rosanne Liu, Aniruddha Kembhavi, Mohammad Rastegari, Jason Yosinski, and Ali Farhadi (NeurIPS 2020, pp. 15173-15184, arXiv:2006.14769) as Supermasks in Superposition (SupSup) and HopSupSup. Distinct from LT-SFT (AIMech:LTSFTLotteryTicketSparseFineTuning), which fine-tunes real-valued sparse difference vectors from a pretrained language model and sums them unconditionally; and from Polytropon (AIMech:PolytroponModularSkillAllocation), which jointly learns LoRA skill modules and a binary task-skill allocation matrix.
aliases:
- SupSup
- HopSupSup
- Supermasks in Superposition Continual Learning
