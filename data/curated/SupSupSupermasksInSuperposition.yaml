  rationale: SupSup operates on randomly initialized deep neural networks and Hopfield associative memory networks.
limitations:
- One-Shot single-gradient task identity inference can fail when tasks share highly similar input distributions (e.g., 10-degree rotations in RotatedMNIST), requiring log_2(k)-step Binary search and full test batches.
- Entropy-based task inference relies on subnetworks being well-calibrated (producing low-entropy outputs only on their own task's distribution) and degrades when wrong-task masks are overconfident.
- Storing masks implicitly as attractors in a fixed-size Hopfield network (HopSupSup) is quadratic in mask dimension, restricting masking to layer activations rather than all weight parameters.
