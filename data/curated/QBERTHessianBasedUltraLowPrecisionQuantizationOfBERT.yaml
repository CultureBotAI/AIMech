claims:
- claim_id: r809-claim-matrix-free-hessian-and-omega-sensitivity
  kind: mechanism
  statement: Q-BERT evaluates the dominant Hessian eigenvalue distribution lambda_i of each 7M-parameter encoder layer without forming the 7M x 7M Hessian matrix by applying matrix-free power iteration via d(g_i^T v)/dW_i = H_i v (Eq. 3.1 & Algorithm 1) across 10% training-data partitions, and ranks layer quantization sensitivity using Omega_i = |mean(lambda_i)| + std(lambda_i) (Eq. 3.2), assigning higher bit precision (3 or 4 bits) to middle encoder layers (layers 4-8) with high curvature mean and variance and 2 bits to flatter outer layers.
  evidence:
  - source_id: r809-primary-pdf
    locator: Section 3.2 (Mixed precision quantization, Equations 3.1-3.2), Section 4.1, Algorithm 1, & Tables 6-7, Pages 3-4, 6-7, & 12-15
    relation: supports
  - source_id: r809-primary-pdf
    locator: power_iteration_top_eigenvalue and omega_sensitivity verification in main()
    relation: supports
- claim_id: r809-claim-groupwise-output-neuron-quantization
  kind: mechanism
  statement: To prevent dynamic-range mismatch across the 4 x 12 x 64 = 3072 output neurons of multi-head self-attention and FFN matrices, Q-BERT partitions each weight matrix across its N_h = 12 attention heads and further buckets sequential output neurons into 128 subgroups per matrix, quantizing each subgroup independently via X^I = round((Clamp(X, q_0, q_{2^k-1}) - q_0) / Delta) with Delta = (q_{2^k-1} - q_0) / (2^k - 1) and Q(X) = Delta * X^I + q_0.
  evidence:
  - source_id: r809-primary-pdf
    locator: Section 3.3 (Group-wise Quantization, Figure 4), Section 4.2 (Table 2), & Appendix A, Pages 5, 7, & 12
    relation: supports
  - source_id: r809-primary-pdf
    locator: uniform_quantize_dequantize and groupwise_quantize_mse verification across G=1, 4, 16 in main()
    relation: supports
- claim_id: r809-claim-13x-compression-and-module-sensitivity
  kind: application
  statement: On SST-2, MNLI, CoNLL-03, and SQuAD, 2/3-bit mixed-precision Q-BERT_MP with 8-bit embeddings and activations compresses encoder weights by 13x (from 324.5 MB to 25.4 MB) within at most 1.1%-2.3% accuracy loss (outperforming uniform 2-bit DirectQ by up to 76.6 F1 points on SQuAD), while 4/8-bit mixed-precision word/position embedding quantization achieves 12x total model compression (34.4-36.9 MB vs. 415.4 MB).
  evidence:
  - source_id: r809-primary-pdf
    locator: Section 4.1 (Table 1), Section 5.1 (Table 3), & Appendix C.2 (Table 5), Pages 6, 8, & 13
    relation: supports
- claim_id: r809-claim-non-converged-saddle-point-and-lut-overhead-limitation
  kind: limitation
  statement: Q-BERT's second-order sensitivity analysis assumes the fine-tuned floating-point model has converged to a local minimum with positive Hessian curvature; when fine-tuning stops at a saddle point with large negative Hessian eigenvalues (as observed on SQuAD), ultra-low-bit quantization incurs higher accuracy degradation, and increasing subgroup count beyond 128 yields diminishing accuracy gains (<0.1%) while increasing hardware Look-Up Table (LUT) overhead.
  evidence:
  - source_id: r809-primary-pdf
    locator: Section 3.2 (Pages 4-5), Section 4.1-4.2 (Page 7), & Figure 3
    relation: supports
