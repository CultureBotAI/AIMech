id: AIMech:QBERTHessianBasedUltraLowPrecisionQuantizationOfBERT
name: 'Q-BERT: Hessian-Based Ultra Low Precision Quantization of BERT'
concept_kind: algorithm
review_status: DRAFT
definition: An ultra-low-bit quantization-aware compression algorithm for Transformer language models that computes layer-wise top Hessian eigenvalue distributions via matrix-free backpropagation power iteration d(g_i^T v)/dW_i = H_i v, assigns mixed bit-widths (such as 2/3-bit or 2/4-bit encoder weights and 4/8-bit word/position embeddings) by ranking layers according to the combined mean-and-variance curvature metric Omega_i = |mean(lambda_i)| + std(lambda_i), partitions each dense attention and FFN matrix across attention heads and sequential output-neuron subgroups (e.g., 128 groups per matrix) with independent clamping intervals [q_0, q_{2^k - 1}], and fine-tunes quantized weights using the Straight-Through Estimator (STE).
identity_notes: "Introduced by Sheng Shen, Zhen Dong, Jiayu Ye, Linjian Ma, Zhewei Yao, Amir Gholami, Michael W. Mahoney, and Kurt Keutzer (AAAI 2020, Vol. 34, No. 05, pp. 8815-8821, arXiv:1909.05840, doi:10.1609/aaai.v34i05.6409). Distinct from mean-only Hessian AWare Quantization (HAWQ) for CNNs \u2014 which fails on NLP tasks where middle Transformer layers exhibit high eigenvalue variance across data partitions (e.g., SQuAD layer 7 with var(lambda_7) > 61.6 vs. mean(lambda_7) approx 1.0) \u2014 and from layer-wise uniform quantization (DirectQ), which shares a single quantization range across all 3072 output neurons of multi-head self-attention."
aliases:
- Q-BERT
- Q-BERT Hessian Mixed-Precision Quantization
- Group-Wise Hessian-Guided BERT Quantization
