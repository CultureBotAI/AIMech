claims:
- claim_id: r421-momentum-correction-equivalence-to-dense-momentum-sgd
  kind: mechanism
  statement: When coordinate (i) remains below the sparsification threshold for T consecutive steps before firing, naive local gradient accumulation v_{k,t} = v_{k,t-1} + g_{k,t} (Eq. 5) loses the geometric discounting factors sum_{tau=0}^{T-1 - t} m^tau on intermediate gradients compared to dense momentum SGD (Eq. 4), whereas Momentum Correction u_{k,t} = m u_{k,t-1} + g_{k,t}, v_{k,t} = v_{k,t-1} + u_{k,t} (Eq. 6-7, Appendix B) restores the exact cumulative step -eta sum_{t=0}^{T-1} u_t of dense momentum SGD.
  evidence:
  - source_id: r421-primary-pdf
    locator: Section 3.2 Momentum Correction (Equations 3-7, Figure 2) & Appendix B
    relation: supports
- claim_id: r421-momentum-factor-masking-and-local-gradient-clipping-staleness-control
  kind: mechanism
  statement: Zeroing both the velocity accumulator v_{k,t}^{(j)} and the momentum factor u_{k,t}^{(j)} on every transmitted coordinate j (Momentum Factor Masking, Eq. 8) prevents stale pre-transmission momentum from re-accumulating into v_{k,t+1}^{(j)} on subsequent steps, while scaling the local L2 gradient clipping threshold by N^{-1/2} preserves the global clipping norm across N workers (Section 3.3, Appendix C).
  evidence:
  - source_id: r421-primary-pdf
    locator: Section 3.3 Overcoming the Staleness Effect (Equation 8, Figure 3) & Appendix C
    relation: supports
- claim_id: r421-sparse-index-encoding-and-allgather-irregularity-limitation
  kind: limitation
  statement: Because each worker selects a different set of top-k coordinate indices, transmitting sparse updates requires sending both values and index offsets and preventing dense in-place ring AllReduce without sparse index reconstruction or hierarchical aggregation.
  evidence:
  - source_id: r421-primary-pdf
    locator: Section 3.1 Gradient Sparsification & Section 4 System Analysis
    relation: supports
- claim_id: r421-imagenet-resnet50-speech-recognition-and-language-modeling-application
  kind: application
  statement: Applied to distributed training of ResNet-50 and AlexNet on ImageNet, Penn Treebank LSTM language modeling, and AN4 speech recognition, achieving 277x to 597x gradient compression ratios without loss of validation accuracy.
  evidence:
  - source_id: r421-primary-pdf
    locator: Section 4 Experiments (Tables 1-4, Figures 4-7), pp. 5-9
    relation: supports
