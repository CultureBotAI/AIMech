claims:
- claim_id: method
  kind: mechanism
  statement: Start an attempt with a random complete assignment as in GSAT and initialize the attempt-local
    flip history. If the formula is not satisfied, evaluate each variable by the change in the total number
    of satisfied clauses caused by flipping it. Form the set of variables with greatest score increase,
    including zero or negative best gains when no improving flip exists. Among those candidates, choose
    the one whose last flip in the current attempt was longest ago. Variables never flipped in that attempt
    are treated as oldest; when several such variables are candidates, use an arbitrary fixed ordering.
    Flip the chosen variable, update its timestamp and continue within the declared attempt budget. New
    attempts reset the current-attempt history. The source retains the GenSAT outer attempts and GSAT
    candidate-score rule while changing the picking rule.
