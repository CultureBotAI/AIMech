    an exact match or is-a assertion. The target has Classification and SupervisedLearning ancestry; this
    related link does not assert representative abnormal-class training examples. Inspected Classification,
    BinaryClassification, SupervisedLearning, UnsupervisedLearning, MachineLearningTask, all three KnearestNeighbor
    nodes, DimensionalityReduction, Distillation, DataPreparation and SelectionAndSamplingBias with annotations
    and outgoing edges. Neighbor voting and value averaging are distinct; reference selection does not
    reduce feature dimensions or assert a sampling-bias condition. Generic preparation and distillation
    terminology does not identify the specified consistency procedure. Nine native contexts distinguish
    local distance ratios, bootstrap variance, density-connected clustering, supervised metric learning,
    sphere support estimation and medoid optimization; none receives renewed scientific approval.
