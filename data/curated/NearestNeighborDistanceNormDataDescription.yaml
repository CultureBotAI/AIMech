limitations:
- The source's printed neighbor-rank wording is not a complete tie implementation; this record follows
  its ordered-distance-vector definition. Reference membership, distance representation, scaling, k, r
  and threshold are part of the procedure.
- Section5.3 experimentally includes r<1 outside the formal norm scope. Its tuned compression comparisons
  do not override fixed-parameter norm inequalities, and no universal parameter or calibrated false-alarm
  probability is inferred.
- All15 pages of the2007 author PDF were visually read; only the specifically cited two pages of the later
  manuscript were visually inspected. The2005 proceedings version was not compared in full. No trained
  model or historical benchmark was executed.
