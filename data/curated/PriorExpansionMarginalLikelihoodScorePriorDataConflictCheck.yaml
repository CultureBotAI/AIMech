id: AIMech:PriorExpansionMarginalLikelihoodScorePriorDataConflictCheck
name: Prior-Expansion Marginal Likelihood Score Prior-Data Conflict Check
concept_kind: evaluation_method
review_status: DRAFT
definition: A Bayesian model criticism and prior-data conflict evaluation method that embeds a working prior p_0(theta) into a continuous expansion family p(theta | gamma) indexed by a hyperparameter gamma (with p(theta | gamma_0) = p_0(theta)) and evaluates the score of the log marginal likelihood S_gamma(y) = d/dgamma log p(y | gamma)|_{gamma_0} as a posterior expectation of the prior score, computing a prior-predictive tail probability on the variance-standardized score statistic to detect conflict between prior assumptions and observed data.
identity_notes: No AIO class represents Bayesian prior-data conflict diagnostics; MachineLearningTask (AIO:MachineLearningTask) is the closest broad match covering model criticism and diagnostic evaluation tasks.
aliases:
- Prior-Expansion Score Conflict Check
- Marginal Likelihood Score Prior-Data Conflict Diagnostic
- Prior Expansion Score Statistic for Prior-Data Conflict
