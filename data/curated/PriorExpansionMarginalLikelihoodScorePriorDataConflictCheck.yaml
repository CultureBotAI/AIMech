claims:
- claim_id: posterior-expectation-identity-for-marginal-likelihood-score
  kind: mechanism
  statement: For a smooth prior expansion p(theta | gamma) reducing to p_0(theta) at gamma = gamma_0, the gradient of the log marginal likelihood S_gamma(y) = grad_gamma log p(y | gamma)|_{gamma_0} equals the posterior expectation E[grad_gamma log p(theta | gamma)|_{gamma_0} | y, gamma_0], allowing the test statistic to be computed from baseline posterior MCMC samples without refitting expanded models.
  evidence:
  - source_id: r831-primary-pdf
    locator: Section 1, Equation 1.1, p. 2; Section 2.1, Equation 2.1, p. 5
    relation: supports
- claim_id: prior-predictive-quadratic-score-tail-calibration
  kind: mechanism
  statement: Standardizing the score vector by its prior predictive covariance V_gamma = Cov_{Y ~ p(y|gamma_0)}(S_gamma(Y)) yields the quadratic discrepancy statistic Q(y) = S_gamma(y)^T V_gamma^{-1} S_gamma(y) and prior-predictive p-value p_S(y_obs) = P(Q(Y) >= Q(y_obs)), which recovers the Evans-Moshonov minimal sufficient statistic check in exponential families and connects locally to relative belief ratios.
  evidence:
  - source_id: r831-primary-pdf
    locator: Section 1, Equations 1.2-1.3, p. 3; Section 2.2, Equation 2.4, p. 7; Section 3, Equations 3.1-3.2, pp. 9-11
    relation: supports
- claim_id: hierarchical-and-regression-prior-sensitivity-application
  kind: application
  statement: The prior-expansion score diagnostic is applied to detect componentwise prior-data conflict in Bayesian regression, generalized linear models, and hierarchical random-effects models using location, scale, and heavy-tailed Student-t prior expansions.
  evidence:
  - source_id: r831-primary-pdf
    locator: Section 4, Examples 4.1-4.3, pp. 13-20
    relation: supports
- claim_id: local-first-order-expansion-direction-dependence-limitation
  kind: limitation
  statement: Because S_gamma(y) is a local first-order derivative evaluated at gamma = gamma_0, its sensitivity depends on the chosen parametric expansion family p(theta | gamma), and calibrating p_S(y_obs) requires simulating from the prior predictive distribution p(y | gamma_0) when analytical moments are unavailable.
  evidence:
  - source_id: r831-primary-pdf
    locator: Section 2.1-2.2, pp. 5-8; Section 5 Discussion, pp. 20-21
    relation: supports
