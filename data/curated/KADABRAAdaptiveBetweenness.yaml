id: AIMech:KADABRAAdaptiveBetweenness
name: KADABRA adaptive betweenness approximation
aliases:
- KADABRA
- KADABRA all-node adaptive betweenness approximation
concept_kind: algorithm
definition: An adaptive sampling algorithm for static-graph betweenness that averages internal-node indicators
  of uniformly sampled shortest paths and stops when node-specific confidence radii meet an additive tolerance
  or a predetermined sample horizon is reached.
definition_evidence:
- source_id: borassinatal2016v4
  locator: Sections 2–3, Algorithm 1 and Theorem 2, PDF pp. 4–7; Appendix C, pp. 17–19
  relation: supports
- source_id: borassinatal2016esa
  locator: Section 2, Algorithm 1 and Theorem 1, printed pp. 20:5–20:7; Section 2.1 proof, pp. 20:7–20:9
  relation: supports
claims:
- claim_id: domain-and-estimand
  kind: scope
  statement: The maintained scope is a finite simple static unweighted directed or undirected graph with
    n>=3, additive tolerance lambda and failure budget delta in (0,1), and exact shortest-path counting
    and sampling. Independently sample each ordered pair of distinct endpoints uniformly from n(n-1) possibilities,
    then select one of its shortest paths uniformly. An unreachable pair contributes an empty path. For
    each node, average the indicators that it lies internally on the sampled path; endpoints and unreachable
    pairs contribute zero. The target is shortest-path betweenness normalized by n(n-1).
  evidence:
  - source_id: borassinatal2016v4
    locator: Section 2, PDF pp. 4–6; Section 4, p. 7; Appendix A notation, p. 15
    relation: supports
- claim_id: balanced-path-sampling
  kind: mechanism
  statement: The path sampler expands an entire BFS frontier from the side with smaller incident-edge
    volume. For directed graphs, the source search follows outgoing arcs and the target search follows
    incoming arcs. At the first connecting frontier, finish collecting the meeting edges. Choose meeting
    edge (v,w) with weight sigma_sv times sigma_wt, then backtrack prefix and suffix using their shortest-path
    counts. Choosing the first meeting edge, or choosing meeting edges uniformly despite unequal counts,
    need not sample complete shortest paths uniformly.
  evidence:
  - source_id: borassinatal2016v4
    locator: Section 4, PDF p. 7; curator path-law calculations in research/discovery/kadabra-path-boundaries.py
    relation: supports
- claim_id: fixed-horizon-and-tail-budgets
  kind: mechanism
  statement: Before the main sample stream, fix a positive integer horizon Omega whose fixed-time all-node
    additive-error failure probability is at most delta/2. Also fix positive lower and upper node budgets
    whose total is at most delta/2; uniform budgets delta/(4n) satisfy this requirement. Pilot-dependent
    budgets require a separate pilot and an independent main stream, conditioning on the pilot choices.
    A conservative curator alternative to the source’s graph-dependent horizon is ceil(ln(4n/delta)/(2
    lambda^2)), from its two-sided Hoeffding bound and a union bound. This alternative is explicitly not
    the paper’s optimized RK horizon or experimental configuration.
  evidence:
  - source_id: borassinatal2016v4
    locator: Section 2 and Remark 1, PDF pp. 5–6; Sections 3 and Appendix C, pp. 6–7 and 17–19; independent
      pilot described in Appendix D, pp. 19–20; curator Hoeffding cap derived from p. 5
    relation: supports
- claim_id: confidence-radii-and-stopping
  kind: mechanism
  statement: At positive sample count tau<=Omega, use the sample mean h for each node. For its lower budget
    let L=ln(1/delta_L) and f=(L/tau)[1/3-Omega/tau+sqrt((1/3-Omega/tau)^2+2h Omega/L)]. For the upper
    budget let U=ln(1/delta_U) and g=(U/tau)[1/3+Omega/tau+sqrt((1/3+Omega/tau)^2+2h Omega/U)]. Stop when
    both radii are at most lambda for every node, or when tau reaches Omega, and return the sample means.
    Increment tau once per path draw, including an empty path, and normalize counters before using these
    formulas. The source’s bounded stopping-time analysis, combined with the fixed-time cap, supports
    a simultaneous additive-error statement under these assumptions; fixed-time concentration alone does
    not justify plugging in an arbitrary random stopping time.
  evidence:
  - source_id: borassinatal2016v4
    locator: Algorithm 1 and Section 3, PDF pp. 6–7; Theorem 2, p. 5; Appendix C, Theorem 9 and Equations
      5–6, pp. 17–19
    relation: supports
- claim_id: boundary-and-transcription-limits
  kind: limitation
  statement: 'The record describes positive-time means, not a literal execution of the printed pseudocode:
    Algorithm 1 displays raw counters where the confidence formulas need means and initializes tau=0.
    At true and estimated score zero, f=0, so the printed inclusive lower-tail failure event includes
    equality with probability one; closed-interval coverage instead treats only strict outside errors
    as failures. Integer horizon rounding and the log(VD-2) small-diameter boundary also need explicit
    handling. Curator checks on a zero-score triangle with delta=0.1, lambda=0.05, uniform tail budgets
    and the conservative cap give Omega=958 and an early stopping count of 462. This finite example is
    not a certification of every printed proof or numerical implementation.'
  evidence:
  - source_id: borassinatal2016v4
    locator: Algorithm 1, PDF p. 6; horizon expression, p. 5; Theorem 9 and proof, pp. 17–19; explicit
      curator calculation in research/discovery/kadabra-path-boundaries.py
    relation: supports
- claim_id: identity-and-evaluation-limits
  kind: limitation
  statement: 'This algorithm samples one path indicator per pair rather than ABRA’s exact pair fraction.
    Both can target the same normalized score while having different variances: a curator four-node diamond
    example gives mean 1/12, indicator variance 11/144 and pair-fraction variance 5/144 for a selected
    node. Fixed-size unbiasedness does not imply unbiasedness of the stopped mean. Historical C++/gcc
    5.3.1 experiments on directed and undirected networks compare against RK and the earlier 2016 ABRA
    implementation; they do not establish superiority over revised 2018 ABRA or current software. General
    graph runtimes, exact top-k ordering, dynamic updates and heuristic pilot optimization are outside
    this record’s guarantee.'
  evidence:
  - source_id: borassinatal2016v4
    locator: Sections 2–6, PDF pp. 4–12; Appendix D and Appendix F, pp. 19–20 and 25–37; finite variance
      comparison in research/discovery/kadabra-path-boundaries.py
    relation: supports
identity_notes: 'Compared all 442 pinned AIO and 693 native identities; no normalized match. Ignored-
  and hidden-inclusive searches of three full checkouts returned 59,0,0 lines, all read as existing KADABRA
  leads, source-reading notes or query strings. Semantic assessment covered 155 AIO and 538 native definitions:
  the prior 154 AIO and 536 native rows were verified unchanged, with BidirectionalLayer, ABRA-s-fix and
  Apriori additions read. Eleven complete AIO contexts and seven full native neighbors were assessed.
  The maintained identity is the all-node adaptive stopping procedure for sampled shortest-path indicators,
  using a fixed sample horizon and node-specific confidence radii. It differs from fixed-size RK path
  sampling, progressive or fixed ABRA pair fractions, exact dependency accumulation, electrical-flow methods,
  and the path-sampling subroutine alone. Top-k output and the pilot-budget optimization heuristic require
  separate scope assessment.'
