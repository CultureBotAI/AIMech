  rationale: No examined AIO target denotes the bounded stopped shortest-path estimator. Its concentration
    argument and bidirectional graph traversal do not make it a neural layer, bias concept, clustering
    task, language model or data preparation identity.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: A centrality vector assigns scores without grouping vertices into clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Absence of labels does not turn structural score computation into clustering.
  - target: AIO:MathematicalFunction
    rejection_reason: The identity includes a specific random sampling and bounded stopping procedure,
      not only an input-output function.
  - target: AIO:DataPreparation
    rejection_reason: Computing network prominence is the defined result; incidental downstream feature
      use does not establish a preprocessing identity.
  - target: AIO:GraphLanguageModel
    rejection_reason: The static graph sampling and concentration method has no language-model objective
      or training mechanism.
  - target: AIO:RankingBias
    rejection_reason: A structural graph score is not the belief that high-ranked information is necessarily
      relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Uniform pair sampling and its confidence bound define an algorithm, not selection
      or sampling bias.
  - target: AIO:RepresentationBias
    rejection_reason: A graph centrality computation is not subgroup representation bias.
  - target: AIO:DeepActiveLearning
    rejection_reason: Neither labels nor a deep neural network are acquired or fitted.
  - target: AIO:DataDredgingBias
    rejection_reason: A bounded stopping-time confidence construction is not itself a data-dredging bias
      concept.
  - target: AIO:BidirectionalLayer
    rejection_reason: This AIO class wraps recurrent neural networks; forward and reverse graph searches
      do not instantiate that layer.
limitations:
- The confidence interpretation requires iid uniform pair/path draws, a certified deterministic horizon,
  budgets fixed independently of the main stream, and conservative numerical evaluation. It is not an
  unlimited-time or adaptive-adversary guarantee.
- No stopped-mean unbiasedness, relative-error bound, exact unique ranking, weighted BFS extension or
  dynamic-graph guarantee is asserted.
- The source’s pilot allocation heuristic has zero-estimate and transcription boundaries that require
  a separate implementation assessment. Uniform fixed budgets suffice for the maintained core scope.
- The source has printed equality, counter-normalization and proof-notation issues. The record preserves
  these caveats and does not certify literal pseudocode, every proof display or author software.
- The conservative Hoeffding horizon and finite path-law/variance examples are labeled curator mathematics,
  not reported author experiments. The graph-dependent RK horizon requires its own valid diameter, constant
  and rounding choices.
- The 2016 source’s conditional random-graph and historical performance claims are not universal speedups.
  The extended version has a printed-date versus arXiv-version-date difference, and no later journal-byte
  equivalence is asserted. DRAFT remains.
