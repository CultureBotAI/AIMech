name: Hill climbing
definition: A family of local-improvement search procedures that replaces a current solution with a strictly
  better neighbor and stops when no improving neighbor exists under the specified move set.
concept_kind: algorithm
identity_notes: 'The record covers the strict-improvement hill-climbing family: Glover selects some improving
  move, while the inspected AIMA figure selects the best-valued successor. Steepest ascent/descent is
  a particular selection rule, not an exact alias for every family member. Hill climbing does not denote
  every local-search metaheuristic, continuous gradient descent, greedy global best-first search, or the
  full ParamILS framework. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 304 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 176 and 176 lines respectively. Inspected text hits
  were prior discovery leads, uses of local search inside existing methods, source references and their
  saved reports/reviews. These were references to methods rather than existing candidate records. Six
  exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- A local optimum need not be globally optimal. Strict improvement cannot traverse equal-valued plateaus
  or take an initially worsening escape step; sideways moves, random restarts and worsening acceptance
  change the specified baseline.
- 'Curator deduction: on a finite state space with a fixed objective and strict improvements, accepted
  states cannot repeat. This does not supply a polynomial bound, finite termination in arbitrary continuous
  spaces, or global optimality.'
- Move definition, neighborhood coverage, initialization and selection/tie rules affect results. AIMA
  Figure 4.2 does not explicitly handle an empty successor set; a concrete implementation must declare
  that boundary. No numerical performance claim is curated.
