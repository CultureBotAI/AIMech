claims:
- claim_id: method
  kind: mechanism
  statement: Choose an initial solution, an objective and applicable neighborhood moves. In the minimizing
    formulation, select a move s with c(s(x))<c(x), replace x by s(x), and repeat. If no such move exists
    in the specified neighborhood, stop at the current solution. The source permits selecting any improving
    move. The inspected AIMA maximizing variant instead selects a highest-valued successor and stops if
    its value is no greater than the current value. Thus best-improvement and other improving-move choices
    share the strict-improvement principle but need not follow the same trajectory. A complete neighborhood
    check is needed to certify the stated local stopping condition; failure to find an improvement in
    a sample is not that certificate.
