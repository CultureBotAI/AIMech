claims:
- claim_id: columnwise-linear-programming-decomposition-and-symmetrization
  kind: mechanism
  statement: The CLIME optimization problem min ||Omega||_1 subject to |Sigma_n Omega - I|_infty <= lambda_n (Eq. 1) relaxes the nonlinear graphical Lasso KKT constraint |Omega^{-1} - Sigma_n|_infty <= lambda_n (Eqs. 4-5) by right-multiplying by Omega, and by Lemma 1 (p. 7; Proof on pp. 31-32, Eqs. 21-22) its solution set {Omega_hat_1} decomposes exactly into p independent vector convex problems min |beta|_1 subject to |Sigma_n beta - e_i|_infty <= lambda_n for 1 <= i <= p (Eq. 3), each solvable as a standard linear program in 2p variables with 4p linear inequality constraints (Eq. 19, p. 19), followed by entrywise minimum-magnitude symmetrization omega_hat_{ij} = omega_hat_{ji} = omega_hat^1_{ij} I{|omega_hat^1_{ij}| <= |omega_hat^1_{ji}|} + omega_hat^1_{ji} I{|omega_hat^1_{ij}| > |omega_hat^1_{ji}|} (Eq. 2). Replacing Sigma_n by Sigma_{n,rho} = Sigma_n + rho I (rho > 0, Eqs. 8-10) guarantees a feasible interior initialization Sigma_{n,rho}^{-1} when p > n and bounds ||Omega_hat_{1,rho}||_{L1}
    <= rho^{-1} p so that E||Omega_hat_rho - Omega_0||_2^2 is finite.
  evidence:
  - source_id: cll2011-clime-pdf
    locator: Section 2, Lemma 1 and Equations (1)-(5), pp. 6-8; Section 3.1, Equations (8)-(10), pp. 11-12; Section 5, Equation (19), pp. 19-20; Section 7, Proof of Lemma 1 and Equations (21)-(22), pp. 31-32
    relation: supports
- claim_id: deterministic-perturbation-bounds-and-weak-lq-cone-decomposition
  kind: mechanism
  statement: 'By Theorem 6 (p. 14, Eqs. 13-15; Proof on pp. 32-34, Eqs. 23-27), whenever Omega_0 in U(q, s_0(p)) = {Omega succ 0 : ||Omega||_{L1} <= M, max_i sum_{j=1}^p |omega_{ij}|^q <= s_0(p)} (0 <= q < 1) and lambda_n >= ||Omega_0||_{L1} (max_{i,j} |sigma_hat_{ij} - sigma^0_{ij}| + rho), feasibility of Omega_0 (|I - Sigma_n Omega_0|_infty <= lambda_n, Eq. 24) and column l1 optimality ||Omega_hat_1||_{L1} <= ||Omega_0||_{L1} (Eq. 25) imply |Sigma_n(Omega_hat_1 - Omega_0)|_infty <= 2 lambda_n (Eq. 26), |Sigma_0(Omega_hat_1 - Omega_0)|_infty <= 4 lambda_n, and the deterministic elementwise l_infty error bound |Omega_hat_rho - Omega_0|_infty <= 4 ||Omega_0||_{L1} lambda_n (Eq. 13). Decomposing each column error h_j = omega_hat_j - omega^0_j into h^1_j = (omega_hat_{ij} I{|omega_hat_{ij}| >= 2 t_n}) - omega^0_j and h^2_j = h_j - h^1_j with t_n = |Omega_hat - Omega_0|_infty yields |h^2_j|_1 <= |h^1_j|_1 and |h^1_j|_1 <= (1 + 2^{1-q} + 3^{1-q}) t_n^{1-q} s_0(p) (Eq. 27), establishing ||Omega_hat_rho
    - Omega_0||_2 <= C_4 s_0(p) lambda_n^{1-q} with C_4 <= 2(1 + 2^{1-q} + 3^{1-q})(4 ||Omega_0||_{L1})^{1-q} (Eq. 14) and p^{-1} ||Omega_hat_rho - Omega_0||_F^2 <= C_5 s_0(p) lambda_n^{2-q} with C_5 <= 4 ||Omega_0||_{L1} C_4 (Eq. 15).'
  evidence:
  - source_id: cll2011-clime-pdf
    locator: Section 3.1-3.2, Theorem 6 and Equations (13)-(15), pp. 10, 14; Section 7, Proof of Theorem 6 and Equations (23)-(27), pp. 32-34
    relation: supports
- claim_id: convergence-rates-and-signed-support-recovery-without-incoherence
  kind: scope
  statement: 'Under either exponential-type tails (C1: log p / n <= eta < 1/4, E[e^{t(X_i - mu_i)^2}] <= K for |t| <= eta) with lambda_n = C_0 M sqrt(log p / n) or polynomial-type tails (C2: p <= c_1 n^gamma, E|X_i - mu_i|^{4*gamma + 4 + delta} <= K) with lambda_n = C_2 M sqrt(log p / n) (proved via truncation at sqrt(n / (log p)^3) and Bernstein''s inequality, Eqs. 28-33), CLIME attains the spectral-norm rate ||Omega_hat - Omega_0||_2 = O_P(M^{2-2q} s_0(p) (log p / n)^{(1-q)/2}) (Theorem 1, Eqs. 6-7; Theorem 2 in expectation), the elementwise l_infty rate |Omega_hat - Omega_0|_infty = O_P(M^2 sqrt(log p / n)) and normalized Frobenius rate p^{-1} ||Omega_hat - Omega_0||_F^2 = O_P(M^{4-2q} s_0(p) (log p / n)^{1-q/2}) (Theorems 4-5), the bandable precision rate ||Omega_hat - Omega_0||_2 = O(B^2 (log p / n)^{alpha / (2*alpha + 2)}) on U_o(alpha, B) (Theorem 3, Eqs. 11-12), and exact signed graphical model support recovery M(Omega_tilde) = M(Omega_0) for the thresholded estimator omega_tilde_{ij}
    = omega_hat_{ij} I{|omega_hat_{ij}| >= tau_n} with tau_n >= 4 M lambda_n whenever theta_min = min_{(i,j) in S(Omega_0)} |omega^0_{ij}| > 2 tau_n (Theorem 7, pp. 17-18).'
  evidence:
  - source_id: cll2011-clime-pdf
    locator: Section 3.1-3.3, Conditions (C1)-(C2), Theorems 1-5, and Equations (6)-(18), pp. 8-16; Section 4, Theorem 7, pp. 17-18; Section 7, Proofs of Theorems 1-5 and Equations (28)-(33), pp. 34-38
    relation: supports
