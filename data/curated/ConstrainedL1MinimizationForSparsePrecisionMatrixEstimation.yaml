id: AIMech:ConstrainedL1MinimizationForSparsePrecisionMatrixEstimation
name: Constrained L1 Minimization for Sparse Precision Matrix Estimation
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- CLIME
- Constrained L1-Minimization for Inverse Matrix Estimation
- Columnwise Linear-Programming Sparse Precision Matrix Estimator
definition: 'A high-dimensional sparse inverse covariance (precision) matrix estimation and graphical model selection methodology (CLIME) that solves the constrained elementwise l1 minimization program min ||Omega||_1 subject to |Sigma_n Omega - I|_infty <= lambda_n by decomposing it into p independent linear programs min |beta|_1 subject to |Sigma_n beta - e_i|_infty <= lambda_n (1 <= i <= p) and applying entrywise minimum-magnitude symmetrization omega_hat_{ij} = omega_hat_{ji} = omega_hat^1_{ij} I{|omega_hat^1_{ij}| <= |omega_hat^1_{ji}|} + omega_hat^1_{ji} I{|omega_hat^1_{ij}| > |omega_hat^1_{ji}|}, achieving elementwise l_infty rate O_P(M^2 sqrt(log p / n)), spectral-norm rate O_P(M^{2-2q} s_0(p) (log p / n)^{(1-q)/2}), normalized Frobenius-norm rate O_P(M^{4-2q} s_0(p) (log p / n)^{1-q/2}), and thresholded signed graphical model recovery M(Omega_tilde) = M(Omega_0) over the weak-l_q precision matrix class U(q, s_0(p)) = {Omega succ 0 : ||Omega||_{L1} <= M, max_i sum_{j=1}^p |omega_{ij}|^q
  <= s_0(p)} (0 <= q < 1) under both exponential-type and polynomial-type tail conditions without requiring any log-determinant edge-Hessian mutual incoherence condition.'
identity_notes: Resolved as a distinct AIMech-native mathematical_method concept from Cai, Liu, and Luo (2011, Journal of the American Statistical Association 106(494):594-607; arXiv:1102.2233v1, DOI:10.1198/jasa.2011.tm10155). Distinct from AIMech:HighDimensionalCovarianceEstimationByL1PenalizedLogDeterminantDivergence (Ravikumar, Wainwright, Raskutti, & Yu 2011), which solves the coupled nonlinear log-determinant Bregman program argmin_{Theta succ 0} {<Theta, Sigma_n> - log det(Theta) + lambda_n ||Theta||_{1,off}} and requires the edge-Hessian irrepresentable condition ||Gamma_{S^c S}(Gamma_{SS})^{-1}||_{L1} <= 1 - alpha (with Gamma = Sigma_0^{-1} otimes Sigma_0^{-1}) and yields slower polynomial-tail rates O(sqrt(p^{tau/(gamma+1+delta/4)} / n)), whereas CLIME decouples into p columnwise linear programs followed by minimum-magnitude symmetrization, requires no irrepresentable condition, and achieves identical O_P(sqrt(log p / n)) elementwise l_infty and O_P(s_0(p) (log p / n)^{(1-q)/2})
  spectral-norm rates under both sub-Gaussian (C1) and polynomial-moment (C2) tails. Also distinct from AIMech:HighDimensionalGaussianGraphicalModelNeighborhoodSelectionWithTheLasso (Meinshausen & Buhlmann 2006, which recovers only the support of nodewise regression ratios -omega^0_{ij}/omega^0_{ii} rather than estimating Omega_0), from AIMech:DantzigSelector (Candes & Tao 2007, which estimates a single linear regression vector beta in y = X beta + z rather than a p x p precision matrix with minimum-magnitude symmetrization and weak-l_q matrix perturbation bounds), and from AIMech:HighDimensionalCovarianceRegularizationByHardThresholding (Bickel & Levina 2008, which thresholds the sample covariance matrix Sigma_n assuming Sigma_0 itself is sparse).
