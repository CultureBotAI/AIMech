name: AdaMixUp
definition: An adaptive interpolation-training procedure that learns example-dependent mixing-coefficient
  regions with a policy network and trains a classifier together with an intrusion discriminator intended
  to separate mixed examples from original data.
concept_kind: algorithm
identity_notes: 'AdaMixUp learns an input-dependent mixing region and uses an intrusion objective, unlike
  original MixUp’s globally selected Beta distribution or Manifold Mixup’s hidden-layer interpolation.
  An intrusion discriminator does not make it a GAN: the generator and discriminator are trained toward
  separating mixtures from originals rather than adversarially making mixtures indistinguishable from
  real data. The mathematical distinct-class setup is relaxed in the paper’s implementation footnote.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 247 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 6 lines in the worktree and 6 in main. These were prior candidate
  leads, not concept records. Twelve exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring
  native mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The claimed avoidance of manifold intrusion depends on assumptions, generator/discriminator capacity
  and optimization. A learned discriminator cannot certify that every mixed point is outside the true
  manifold or that its soft target is correct.
- Equation5 prints positive log-probabilities despite calling the quantity cross-entropy and later minimizing
  it. The prose and pinned implementation support minimizing negative log-probability; the discrepancy
  is preserved rather than treating the printed sign as an executable loss or asserting an official erratum.
- The pinned public repository describes itself as a reimplementation. It uses binary labels opposite
  to the paper’s arbitrary0/1 convention and combines classification and intrusion batch means in one
  cost plus weight decay, while the paper describes alternating objectives.
- The code’s classification batch combines equal original/mixed counts, while its discriminator uses twice
  as many original as mixed examples. Those batch means are not asserted to equal the separately averaged
  terms of printed Equations5–6.
- The recursive mixture coefficients are nonnegative and sum to one, but this algebra alone proves neither
  semantic validity nor improved generalization. The record follows the verbal recursion and coefficient
  construction rather than the dimensionally inconsistent matrix-vector ordering in one argument of printed
  Equation7.
- No universal architecture, fold count, performance gain or execution of the downloaded author code is
  asserted.
