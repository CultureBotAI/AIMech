claims:
- claim_id: method
  kind: mechanism
  statement: For a pair of examples, a policy-region network outputs a three-component softmax (alpha,delta,remainder).
    Interpret the first two components as the interval(alpha,alpha+delta) for the mixing coefficient.
    Sample epsilon uniformly on(0,1) and set gamma=alpha+delta*epsilon so gradients can pass through the
    interval parameters. Form gamma*x1+(1−gamma)*x2 and the correspondingly mixed class targets. Train
    the classifier with observed and mixed targets, and train the policy generator together with an intrusion
    discriminator to distinguish generated mixtures from original examples. The discriminator shares the
    classifier’s feature network while using its own final classification layers. For higher-fold mixing,
    reuse the same pairwise generator recursively by mixing an original example with an original or previously
    mixed example; composing a previous coefficient vector lambda with coefficient gamma gives (gamma*lambda,1−gamma).
    The paper describes alternating minibatch optimization of classification/mixup loss and intrusion
    loss. Its intended intrusion supervision treats mixed examples as outside and observed examples as
    inside the data manifold; this is a learned surrogate, not direct access to the true manifold.
  evidence:
  - source_id: method-source
    locator: Adaptive MixUp and Implementation of AdaMixUp, Equations (5)–(7), Figure 3 and Training,
      PDF pp. 4–6 / printed pp. 3717–3719; assumptions and intrusion boundaries on pp. 2–4
    relation: supports
- claim_id: implementation-loss-conventions
  kind: mechanism
  statement: The pinned Fold-2 reimplementation generates interval parameters with softmax, samples gamma
    by reparameterization and uses the same coefficient to mix inputs and labels. Its classifier uses
    softmax cross-entropy over an equal-sized mixture of generated examples and one source group. Its
    binary intrusion head uses softmax cross-entropy, labels originals1 and mixtures0, and averages over
    two original groups and one mixed group. The returned cost sums the classification and intrusion means
    and a weight-decay term. This realizes the separation intention using negative log-probabilities,
    with source-specific label encoding and weighting rather than literal positive-log minimization or
    a demonstrated reproduction of the paper’s alternating update schedule.
  evidence:
