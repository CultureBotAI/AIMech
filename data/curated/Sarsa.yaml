name: Sarsa
definition: An on-policy temporal-difference control algorithm that updates the current state-action value
  toward the observed reward plus the discounted estimated value of the next action selected by the same
  behavior policy.
concept_kind: algorithm
identity_notes: 'This record specifies one-step Sarsa through the tabular control formulation. The historical
  Modified Connectionist Q-Learning report supplies the selected-next-action target in a broader neural
  and eligibility-trace method; its lambda=0 case shares the one-step error, but the entire trace-based
  neural method is not made an exact alias of this record. Sarsa(lambda), expected Sarsa, Q-learning and
  GAE have distinct scopes. The available Cambridge PDF bears a September 1994 cover and already mentions
  Sutton’s proposed SARSA name in footnote 3; the later book draft credits the name to Sutton (1996).
  These source statements are preserved without resolving the naming chronology. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 298 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  20 and 20 lines respectively. All 17 unique hit contents were inspected: prior TD(lambda) and Q-routing
  leads, GAE and AntNet boundary statements, and their saved reports/reviews. These were references to
  methods rather than existing candidate records. Six exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six native neighboring mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- A persistently exploratory behavior policy changes the values being estimated; an exploratory next action
  can lower or raise the sampled target relative to another action. Greedy Sarsa and Q-learning can coincide
  on a transition, but such a special case does not equate the methods.
- Convergence requires a specified setting, sampling policy and step-size assumptions. The inspected book
  draft attributes its tabular control convergence statement to personal communication, and the 1994 neural
  report discusses parameter sensitivity and missing general guarantees. Neither source is treated as
  an independently verified complete proof for arbitrary function approximation.
- The September 2016 book draft is versioned as a draft. Its retrospective naming attribution differs
  from the SARSA footnote in the available 1994-covered report; no first-use date or explanation of that
  discrepancy is asserted.
- Trace choice, replacing versus accumulating traces, n-step targets and expected backups define extensions
  requiring their own evidence. No robot-navigation or gridworld performance result is curated here.
