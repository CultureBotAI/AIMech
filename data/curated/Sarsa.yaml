claims:
- claim_id: method
  kind: mechanism
  statement: Maintain Q(s,a), choose the current action A using the current policy derived from Q, execute
    it, and observe reward R and next state S_next. For a nonterminal next state, choose A_next from that
    same policy before updating, then set Q(S,A)=Q(S,A)+alpha*(R+gamma*Q(S_next,A_next)−Q(S,A)), using
    pre-update values. Carry the selected A_next forward as the next executed action; it is not replaced
    with a fresh sample after the update. For a terminal next state, the continuation value is zero and
    no next environment action is executed. Control improves the policy from Q while retaining its declared
    exploration rule, such as epsilon-greedy selection. The sample target uses the actual selected next
    action, not a maximum over actions and not an expectation over all policy actions. Rummery and Niranjan’s
    Eq.9 uses this error multiplied by an eligibility-weighted sum of neural-output gradients; at lambda=0
    only the current gradient remains. That historical extension does not make neural networks or nonzero
    traces necessary for one-step tabular Sarsa.
