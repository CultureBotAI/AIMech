id: AIMech:SoapShampooWithAdamInPreconditionerEigenbasis
name: SOAP (ShampoO with Adam in the Preconditioner's Eigenbasis)
concept_kind: algorithm
review_status: DRAFT
definition: A second-order stochastic optimization algorithm (ShampoO with Adam in the Preconditioner's eigenbasis) that maintains Kronecker-factored gradient covariance EMAs L <- beta_2 L + (1 - beta_2) G G^T and R <- beta_2 R + (1 - beta_2) G^T G along with their eigenvector bases Q_L, Q_R (updated every f steps via power iteration and QR decomposition), projects the gradient G' = Q_L^T G Q_R and first-moment EMA M' = Q_L^T M Q_R into Shampoo's eigenbasis, continually updates an elementwise second-moment EMA V <- beta_2 V + (1 - beta_2)(G' odot G') in the rotated space at every step, applies the Adam preconditioned step N' = M' / (sqrt(V_hat) + epsilon), and rotates the update back to the original parameter space via N = Q_L N' Q_R^T.
identity_notes: Distinct from Shampoo in that SOAP establishes an exact equivalence between idealized Shampoo (with exponent 1/2 and trace scaling) and idealized Adafactor in Shampoo's eigenbasis (Claim 1), and replaces rank-1 Adafactor with full coordinatewise Adam second-moment tracking V updated at every step inside the rotated eigenbasis (Q_L, Q_R), preventing stale-preconditioner degradation when Q_L and Q_R are recomputed infrequently every f steps. Distinct from GaLore in that SOAP maintains exponential moving averages of G G^T and G^T G on both sides of a 2D layer and stores first-moment momentum M in the original parameter space before projecting into the updated eigenbasis.
aliases:
- SOAP
- SOAP Optimizer
- ShampoO with Adam in the Preconditioner's eigenbasis
