claims:
- claim_id: c-r589-shampoo-adafactor-eigenbasis-equivalence
  kind: mechanism
  statement: Idealized Shampoo with matrix power 1/2 and trace normalization H_hat = (L otimes R) / Trace(L), W_t <- W_{t-1} - eta L^{-1/2} G_t R^{-1/2} / Trace(L)^{-1/2}, is algebraically equivalent to running idealized Adafactor in the eigenbasis (Q_L, Q_R) of L = E_B[G_B G_B^T] and R = E_B[G_B^T G_B] because the row and column second-moment marginals A_i = e_i^T E_B[G'_B odot G'_B] 1_m and C_j = (1_n^T E_B[G'_B odot G'_B])_j in the rotated basis equal the eigenvalues lambda_i(L) and mu_j(R) (Claim 1).
  evidence:
  - source_id: r589-primary-pdf
    locator: Section 4.1, Algorithms 1-2 & Claim 1, pp. 4-5
    relation: supports
- claim_id: c-r589-rotated-adam-and-qr-power-iteration
  kind: mechanism
  statement: SOAP continually updates the elementwise second-moment matrix V <- beta_2 V + (1 - beta_2)(G' odot G') at every step in the rotated coordinate basis G' = Q_L^T G Q_R while updating the eigenbases Q_L, Q_R only every f steps via a single power-iteration matrix multiplication followed by QR decomposition (Algorithm 3 and Algorithm 4), introducing only one additional hyperparameter (preconditioning frequency f) beyond AdamW and degrading significantly more slowly than Shampoo as f increases up to 100.
  evidence:
  - source_id: r589-primary-pdf
    locator: Algorithm 3-4, p. 6; Section 6.2 & Figure 1, pp. 3, 8; Figure 7, pp. 12-13
    relation: supports
- claim_id: c-r589-llm-pretraining-speedup-and-critical-batch
  kind: application
  statement: On 360M and 660M parameter language model pre-training in the large-batch regime, SOAP reduces the number of training iterations by over 40% and wall-clock time by over 35% compared to AdamW (and by approximately 20% in both metrics compared to DistributedShampoo), while improving scaling toward the ideal linear critical batch size.
  evidence:
  - source_id: r589-primary-pdf
    locator: Abstract, p. 1; Section 6.1-6.4 & Figures 1-5, pp. 7-11
    relation: supports
- claim_id: c-r589-space-and-per-step-projection-overhead
  kind: limitation
  statement: Full two-sided SOAP requires 2m^2 + 2n^2 + 3mn memory and m^3 + n^3 + 2m^2 n + 2mn^2 per-step matrix-multiplication overhead for an m x n layer (more per-step projection work than Shampoo's m^3 + n^3 + m^2 n + mn^2), requiring identity-basis fallback on huge vocabulary embedding/output dimensions or one-sided/factorized approximations to reduce memory below AdamW.
  evidence:
  - source_id: r589-primary-pdf
    locator: Section 4.1 item 3, p. 7; Section 7.1-7.3, pp. 10-13
    relation: supports
