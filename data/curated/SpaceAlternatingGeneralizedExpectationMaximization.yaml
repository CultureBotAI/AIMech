name: Space-Alternating Generalized Expectation Maximization
aliases:
- SAGE Algorithm
- Space-Alternating GEM
concept_kind: algorithm
definition: A generalized expectation-maximization method that updates selected parameter blocks using
  block-specific hidden-data spaces or valid objective-improvement surrogates, refreshing the conditional
  expectation or surrogate at the current estimate before the next block.
identity_notes: Fessler-Hero SAGE is an optimization method, distinct from AIMech:SparseAdditiveGenerativeModel,
  which already owns the bare SAGE alias. Qualified algorithm aliases are used here. The 1994 hidden-data
  construction and 1995 penalized/surrogate extension belong to this method family; SAGE1/2/3 Poisson
  choices are variants, not separate records. Unlike ordinary frozen-Q ECM, the construction refreshes
  each selected-block surrogate; AECM is a broader cycle/constraint framework. All 442 pinned AIO labels/scoped
  synonyms and 466 preceding native IDs, names and aliases were compared. The sole normalized search-term
  collision, bare SAGE, identifies the existing sparse additive text model; the new optimization method
  uses qualified aliases. Ignored-inclusive fixed-string searches of both full checkouts returned 436
  and 459 line instances. Context windows for all 143 distinct normalized matched texts were inspected;
  duplicate ledger/review mentions, unrelated environment strings and the stochastic-EM lead do not establish
  these four method identities. All 225 semantic label/synonym rows and 17 annotated AIO nodes with outgoing
  edges were inspected; sixteen nodes were byte-verified unchanged after prior reading and UncertaintyBias
  was newly read. Thirty-one contextual YAMLs comprise 17 AIO and 14 native records, with 27 verified
  prior readings and four full new readings; the existing sparse text SAGE was also reread. Absence is
  bounded to this pin, maintained corpus and inspected neighborhood.
