claims:
- claim_id: claim-locally-invalid-iv-post-selection-bias-and-searching-coverage
  kind: mechanism
  statement: When locally invalid instruments satisfy $0 < |\pi_j^*/\gamma_j^*| < s_j(n) = 2\sqrt{\log n}\max_{k \in \mathcal{V}}|\mathrm{T}_{j,k}^0|$ (Definition 1, Equation 12), two-stage hard thresholding cannot separate them from valid instruments, biasing post-selection point estimators by $\sum_{j \in \widehat{\mathcal{V}} \setminus \mathcal{V}} \gamma_j^*\pi_j^* / \sum_{j \in \widehat{\mathcal{V}}}(\gamma_j^*)^2$; by contrast, whenever the initial set $\widehat{\mathcal{V}}$ satisfies the sandwich event $\mathcal{V} \subset \widehat{\mathcal{V}} \subset \mathcal{V} \cup \mathcal{I}(0, s(n))$ with $|\mathcal{V}| > |\widehat{\mathcal{V}}|/2$ (Equation 30, Lemma 1), every $\beta$ with $M(\beta) > |\widehat{\mathcal{V}}|/2$ must satisfy $|\widehat{\pi}_j(\beta)| \le \widehat{\rho}_j(\beta, \alpha)$ for at least one truly valid instrument $j \in \mathcal{V}$ by the pigeonhole principle, guaranteeing uniform asymptotic coverage $\liminf_{n \to \infty} \mathbb{P}(\beta^* \in \mathrm{CI}^{\rm search}) \ge 1 - \alpha$ and $O_p(n^{-1/2})$ length (Theorem 1 and Theorem 3).
  evidence:
  - source_id: guo2023-search-pdf
    locator: Section 3.2 (pp. 7-9), Section 4.1 (pp. 10-13), Section 5.1 (pp. 17-19), Section 6 (pp. 20-21), Lemma 1, Theorems 1 and 3
    relation: supports
- claim_id: claim-sampling-shrinkage-concentration-and-uniform-coverage
  kind: mechanism
  statement: Given $M$ conditional Gaussian draws $(\widehat{\boldsymbol{\Gamma}}^{[m]}, \widehat{\boldsymbol{\gamma}}^{[m]}) \sim N((\widehat{\boldsymbol{\Gamma}}, \widehat{\boldsymbol{\gamma}}), \widehat{\mathbf{Cov}})$ (Equation 21), Proposition 1 proves that $\mathbb{P}(\min_{1 \le m \le M}\max_{j \in \mathcal{V}}|U_j^{[m]}(\beta^*)| \le \mathrm{err}_n(M, \alpha_0) \mid \mathcal{D}) \ge 1 - \alpha_0$ where $\mathrm{err}_n(M, \alpha_0) = [\{-2\log(1 - \alpha_0^{1/M})\}^{1/|\mathcal{V}|} / c(\mathcal{D})]\sqrt{\max_{j \in \mathcal{V}}\widehat{\mathrm{Var}}(\widehat{\Gamma}_j - \beta^*\widehat{\gamma}_j)} \asymp (\{\log(1/\alpha_0)/M\}^{1/|\mathcal{V}|} / \sqrt{n})$, allowing the Sampling Confidence Interval $\mathrm{CI}^{\rm sample}$ with shrinkage factor $\lambda \asymp (\log n / M)^{1/(2|\widehat{\mathcal{V}}|)}$ to shrink the noise threshold to $\lambda\widehat{\rho}_j(\beta, \alpha)$ while maintaining uniform asymptotic coverage $\liminf_{n \to \infty}\mathbb{P}(\beta^* \in \mathrm{CI}^{\rm sample}) \ge 1 - \alpha$ and strictly tighter finite-sample intervals than pure searching (Proposition 1, Theorem 2, and Theorem 3).
  evidence:
  - source_id: guo2023-search-pdf
    locator: Section 4.2 (pp. 13-17), Section 6 (pp. 20-21), Proposition 1, Theorems 2 and 3; Supplement Sections B and D (pp. 35-38, 42-63)
    relation: supports
- claim_id: claim-data-dependent-lambda-selection-and-heteroscedastic-high-dimensional-extension
  kind: scope
  statement: "Remark 2 (Section 4.2, p. 16) provides a data-dependent rule that selects the smallest shrinkage factor $\\lambda$ on a grid such that at least a pre-specified proportion $\\mathrm{prop} = 10\\%$ of the $M = 1000$ resampled intervals $[\\beta_{\\min}^{[m]}(\\lambda), \\beta_{\\max}^{[m]}(\\lambda)]$ are non-empty, and Section 5.2 (pp. 19\u201320) extends both Searching and Sampling CIs to heteroscedastic errors and high-dimensional covariates/IVs ($p \\gg n$) by plugging in debiased Lasso reduced-form estimators $(\\widehat{\\boldsymbol{\\Gamma}}, \\widehat{\\boldsymbol{\\gamma}})$ and heteroscedasticity-robust covariance matrices $(\\widehat{\\mathbf{V}}^{\\Gamma}, \\widehat{\\mathbf{V}}^{\\gamma}, \\widehat{\\mathbf{C}})$."
  evidence:
  - source_id: guo2023-search-pdf
    locator: Section 4.2 Remark 2 (p. 16), Section 5.2 (pp. 19-20), Supplement Section A (pp. 30-34)
    relation: supports
