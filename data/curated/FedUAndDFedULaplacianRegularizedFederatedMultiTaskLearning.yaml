claims:
- claim_id: r486-local-sgd-and-graph-laplacian-server-or-neighbor-update-mechanism
  kind: mechanism
  statement: In each communication round t, sampled clients k in S^{(t)} run R local mini-batch SGD steps w_{k, r+1}^{(t)} = w_{k, r}^{(t)} - mu nabla F_tilde_k(w_{k, r}^{(t)}) and then apply the Laplacian coupling step W^{(t+1)} = (I - mu_tilde eta S_tilde^{(t)} L_cal) W_R^{(t)}, i.e., w_k^{(t+1)} = w_{k, R}^{(t)} - mu_tilde eta sum_{l in N_k} a_{kl}(w_{k, R}^{(t)} - w_{l, R}^{(t)}) (centralized on the server in FedU Algorithm 1 or peer-to-peer among neighbors N_tilde_k in dFedU Algorithm 2), where the server-update matrix C = I - mu_tilde eta L_cal is normalized (||C||_2 = 1) if and only if mu_tilde eta rho <= 2 with rho = ||L||_2 (Dinh et al. 2022, Section IV & Appendix A/C, Equations 19-21 & 43-45, pp. 4-5 & 11-14).
  evidence:
  - source_id: r486-primary-pdf
    locator: Section IV (Algorithms 1-2), pp. 4-5, and Appendix A & C (Equations 19-21, Algorithm 3, Equation 45), pp. 11 & 14
    relation: supports
- claim_id: r486-star-graph-unification-and-linear-speedup-convergence-scope
  kind: scope
  statement: Section III-B proves that conventional consensus FL (FedAvg, Equation 4), Moreau-envelope personalized FL (pFedMe, Equation 5), and MAML-based Per-FedAvg (Equation 6) are exact or epigraph special cases of the Laplacian FMTL objective on a star graph with virtual server vertex 0; furthermore, when eta rho > 2 beta (Lemma 1), Theorem 1 proves O_tilde(1/(alpha S) + sigma_1^2 / (alpha R S epsilon)) linear speedup for alpha-strongly convex objectives and Theorem 2 proves O(1/(S epsilon) + sigma_1^2 / (epsilon^2 R S)) sublinear speedup of order 1/2 for smooth nonconvex objectives without requiring bounded gradient dissimilarity at individual clients (Dinh et al. 2022, Section III-B & Section V, Lemma 1, Theorems 1-2, pp. 3-6).
  evidence:
  - source_id: r486-primary-pdf
    locator: Section III-B (Equations 4-6), pp. 3-4, and Section V (Lemma 1, Theorems 1-2, Equations 7-12), pp. 5-6
    relation: supports
- claim_id: r486-non-iid-sensor-and-vision-multitask-classification-application
  kind: application
  statement: Applied to strongly convex multinomial logistic regression and nonconvex deep neural network classification across heterogeneous tasks on Human Activity Recognition, Vehicle Sensor, MNIST, and CIFAR-10 benchmarks (Dinh et al. 2022, Section VI, Table I, Figures 3-5, pp. 6-9).
  evidence:
  - source_id: r486-primary-pdf
    locator: Section VI (Experiments, Table I, Figures 3-5), pp. 6-9
    relation: supports
- claim_id: r486-known-client-relationship-graph-requirement-limitation
  kind: limitation
  statement: Assumes the inter-client relationship weights {a_{kl}} are known a priori (and that eta satisfies eta > 2 beta / rho while mu_tilde eta rho <= 2), and in centralized FedU requires the server to maintain all N client models {w_k} and the adjacency graph (Dinh et al. 2022, Section III-B & Section IV-B, pp. 3-5).
  evidence:
  - source_id: r486-primary-pdf
    locator: Section III-B, p. 3, and Section IV-B, pp. 4-5
    relation: supports
