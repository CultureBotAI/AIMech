name: FastICA
aliases:
- Fast Independent Component Analysis
concept_kind: algorithm
definition: A family of independent-component estimation algorithms that repeatedly apply normalized approximate-Newton
  fixed-point updates to nonlinear projection contrasts, using deflation or symmetric decorrelation to
  obtain multiple components.
identity_notes: 'Scoped to Hyvarinen-Oja 1997 kurtosis FastICA and Hyvarinen 1999 generalized contrasts.
  This is an estimation algorithm, not the general ICA model, a trained source separator, ordinary-gradient
  Infomax ICA, topographic ICA or every fixed-point optimizer. Deflation and symmetric variants share
  the core update but have distinct ordering and decorrelation behavior; optional stabilization is not
  a claim that every variant is step-size-free. Three candidate identities were compared against all 442
  pinned AIO IDs, labels and scoped synonyms and 454 preceding native IDs, names and aliases, with no
  normalized match. Searches of both complete checkouts included ignored and hidden files and returned
  the same 176 matched-line set across 81 paths. All matching excerpts were read and distinguished from
  existing concept records; historical ledgers were not reread in full solely because they contained a
  match. All 213 semantic-search rows were read, including 212 unchanged prior rows and the additional
  KernelLayer row. Twenty-one annotated AIO nodes with outgoing edges were inspected: 19 unchanged prior
  readings and two new readings. Thirty-one contextual YAMLs, including ten native neighbors, comprise
  23 unchanged prior readings and eight complete readings in this round. This identity assessment is bounded
  to the pinned snapshot and maintained corpus.'
