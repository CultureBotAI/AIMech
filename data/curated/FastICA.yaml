claims:
- claim_id: normalized-fixed-point
  kind: mechanism
  statement: For centered whitened observations x with E[xx^T]=I and unit w, choose a differentiable nonlinearity
    g=Gprime and compute w_plus=E[x*g(w^T x)]-E[gprime(w^T x)]*w, then normalize its nonzero norm. The
    source derives this from an approximate Newton step for a constrained projection contrast; sample
    means replace expectations in practice. Cubic g(u)=u^3 gives the original kurtosis step E[x(w^T x)^3]-3w
    under the whitening and unit-norm conditions. Tanh and Gaussian-weighted-linear nonlinearities are
    other source choices.
  evidence:
  - source_id: generalized-method
    locator: Section III.B, Equations 14-16, printed p. 629 / PDF p. 4; Section IV.B, Equations 17-20,
      p. 630 / PDF p. 5
    relation: supports
- claim_id: multiple-components
  kind: mechanism
  statement: Deflation subtracts projections on previously estimated orthonormal directions after each
    update and renormalizes. Symmetric FastICA updates rows together and applies W <- (W W^T)^(-1/2)W
    for whitened data, requiring full row rank. For nonsphered data, the source uses covariance-metric
    normalization and decorrelation with nonsingular covariance. Orthogonality prevents exact duplicate
    directions but does not by itself prove statistical independence. Signs and component ordering are
    not identified by the ICA objective.
  evidence:
  - source_id: generalized-method
    locator: Sections IV.B-IV.C, Equations 22-26, printed pp. 630-631 / PDF pp. 5-6
    relation: supports
  - source_id: original-paper
    locator: Section 3.1.2, Equation 10, internal/PDF p. 6
    relation: supports
- claim_id: population-convergence-boundary
  kind: limitation
  statement: The generalized proof assumes the linear independent-source model, exact expectations, suitable
    moments and E[s_i*g(s_i)-gprime(s_i)] nonzero. It establishes local convergence near a source direction,
    generally quadratic and cubic with the stated symmetry condition. For the original kurtosis rule,
    source-coordinate updates are proportional to kurt(s_i)*z_i^3. A unique dominant scaled initial coordinate
    yields the cubic ratio contraction; tied starts can remain mixed up to sign. A source can be non-Gaussian
    with zero kurtosis, so the kurtosis rule cannot resolve multiple such sources merely from their non-Gaussianity.
  evidence:
  - source_id: generalized-method
    locator: Appendix A.A, Equations 27-34, printed p. 633 / PDF p. 8; curator finite zero-kurtosis and
      tied-start examples
    relation: supports
  - source_id: original-paper
    locator: Section 3.2, Equations 11-15, internal/PDF pp. 6-7; Section 5, p. 9
    relation: supports
- claim_id: contrast-and-robustness
  kind: scope
  statement: The squared contrast [E G(w^T x)-E G(v)]^2, with standard Gaussian v, approximates negentropy
    rather than giving exact entropy for arbitrary distributions. Contrast choice affects consistency
    conditions, estimation variance and sensitivity to outliers. The robustness theorem assumes robust
    whitening and explicitly does not give a globally bounded influence function. The reported outlier
    experiment estimates covariance from uncontaminated data to emulate robust whitening; it does not
    certify robustness of an arbitrary complete FastICA pipeline.
  evidence:
  - source_id: generalized-method
    locator: Section II.B, Equations 6-8, printed p. 627 / PDF p. 2; Section III.A, Theorems 1-3, p. 628
      / PDF p. 3; Section V, pp. 631-632 / PDF pp. 6-7
    relation: supports
limitations:
- Standard source identification assumes an appropriate full-rank instantaneous linear mixture, independent
  sources and at most one Gaussian source; the usable contrasts additionally require their own moments
  and nondegeneracy. Whitening needs finite covariance and a retained full-rank subspace.
- A zero fixed-point update cannot be normalized. Singular intermediate matrices cannot be repaired to
  full rank by the displayed symmetric inverse square root or iterative decorrelation formula. Finite-sample
  errors and model mismatch are outside the exact-expectation convergence proof.
- The original sign-insensitive stopping criterion can declare a mixed tied-start direction unchanged.
  Finite counterexamples qualify blanket recovery claims; they do not establish typical failure rates
  for randomized practical implementations.
- Optional stabilized, nonsphered, noisy and overcomplete variants need their stated assumptions. The
  core algorithm is not universally globally convergent, noise-consistent, step-size-free in all variants,
  or superior to other estimators.
- Both primary PDFs were read completely, totaling 19 pages. Finite arithmetic verifies zero-kurtosis
  and tied-start boundaries; no source-separation training, author implementation or historical benchmark
  was reproduced.
