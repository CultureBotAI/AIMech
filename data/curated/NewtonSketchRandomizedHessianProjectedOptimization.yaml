- target: AIO:LogisticRegression
  relation: related_match
  rationale: AIO:LogisticRegression represents logistic regression broadly, whereas Newton Sketch (Section
    3.2 Example 2, Section 5.1, and Section 5.4) provides a near-linear-time randomized Hessian-projected
    second-order solver for unconstrained and l_1-constrained logistic regression and generalized linear
    models.
- target: AIO:LassoRegression
  relation: related_match
  rationale: AIO:LassoRegression represents L1-regularized linear regression broadly, whereas Newton Sketch
    solves both primal l_1-constrained GLMs with O(s log d) sketch dimension via LARS/Lasso subproblems
    (Section 5.1, Lemma 8) and high-dimensional d >> n dual Lasso via partially sketched log-barrier interior-point
    steps in O(d m^2) time (Section 5.5).
limitations:
- 'Requirement of Accessible n x d Hessian Square-Root Factorization: As noted in Section 3.1 (p. 5),
  computing the sketched Hessian S^t nabla^2 f(x^t)^{1/2} without forming the full d x d Hessian nabla^2
  f(x^t) requires an explicit n x d matrix square root nabla^2 f(x^t)^{1/2} (such as diagonal-times-data-matrix
  structure in generalized linear models and separable analytic barriers).'
- 'Asymptotic Linear Floor Under Fixed Sketch Size and ROS Polylogarithmic Factor: Under a fixed sketch
  dimension m, Theorem 1 (Equations 14-15) exhibits linear-quadratic convergence whose asymptotic local
  rate is linear with factor eps(beta/gamma) once ||x^t - x^*||_2 << 1 unless the sketch size is inflated
  by log^2(1+t) across iterations (Corollary 1); moreover, randomized orthonormal system (ROS) sketches
  over self-bounding cones require an extra log^4 n factor in the sufficient sketch dimension (Lemma 1(b),
  p. 21).'
- 'Primary-Source Typographical and Domain-Threshold Notes in Pilanci & Wainwright (2017, arXiv:1505.02250v1):
  Verified five self-correcting typographical/notational details across the 35-page manuscript: (1) Section
  3.1 (p. 6) writes ''S^t in R^{m x d}'' instead of ''S^t in R^{m x n}'' below Equation (6), and Equation
  (7) on p. 6 and Section 6.2 on p. 23 omit the transpose on the first nabla^2 f(x^t)^{1/2} factor in
  ((nabla^2 f(x^t)^{1/2})^T (S^t)^T S^t nabla^2 f(x^t)^{1/2})^{-1} nabla f(x^t); (2) Section 4.1 (p. 11,
  Equation 18) states that eta = (1/8)(1 - (1/2)((1+eps)/(1-eps))^2 - a)/((1+eps)/(1-eps))^3 is defined
  for eps in (0, 1/4), whereas strict positivity eta > 0 (required by Lemma 3, p. 24, and verified at
  the end of Section 6.2.1 on p. 26 via a <= 1/2 - (1/2)(eps'')^2 - eps'') holds if and only if (1+eps)/(1-eps)
  < sqrt(2(1-a)), i.e., eps < (sqrt(2(1-a)) - 1)/(sqrt(2(1-a)) + 1) <= 3 - 2 sqrt(2) approx 0.17157 (and
  eps < 0.14590 for the standard choice a = 0.1); (3) Algorithms 1-2 (pp. 12-13) and Section 6.2 (p. 23)
  write the approximate Newton decrement tilde_lambda_f(x) without the square root (and without the minus
  sign in Algorithms 1-2), whereas Lemma 5 (p. 25, Equation 42), Equation (43) (p. 26), Lemma 6 (p. 26,
  Equation 44b), and Appendix A.3 (p. 30, Equation 58) use the square-root decrement tilde_lambda_f(x)
  = (-<nabla f(x), v_NSK>)^{1/2}; (4) Theorem 4 (p. 14, Equation 22) and the combined bound N = N_1 +
  N_2 at the top of p. 25 print gamma in the denominator instead of the Phase-I decrement parameter nu;
  and (5) Lemma 3(b) and the Second Phase Analysis on p. 24 print ''1 - c_1 e^{c_2 m eps^2}'' and ''1
  - N_2 c_1 e^{c_2 m}'' missing the minus sign in the exponent.'
- All 35 pages of the full-text PDF of Pilanci & Wainwright (2015/2017, SIAM J. Optim. 27(1):205-245,
