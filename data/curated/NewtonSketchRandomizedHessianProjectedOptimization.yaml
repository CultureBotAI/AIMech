id: AIMech:NewtonSketchRandomizedHessianProjectedOptimization
name: Newton Sketch Randomized Hessian-Projected Second-Order Optimization and Sketched Interior-Point
  Barrier Method
concept_kind: mathematical_method
aliases:
- Newton Sketch (Pilanci & Wainwright 2017)
- Sketched Newton Method with Tangent-Cone Gaussian Width Guarantees
- Partial Newton Sketch with Exact Self-Concordant Barrier Hessian
- Randomized Orthonormal System Hessian-Square-Root Newton Sketch
- Newton Sketch Interior-Point Central-Path Barrier Method
definition: Newton Sketch Randomized Hessian-Projected Second-Order Optimization and Sketched Interior-Point
  Barrier Method is a randomized second-order convex optimization and interior-point methodology introduced
  by Pilanci and Wainwright (2017, SIAM Journal on Optimization 27(1):205-245, arXiv:1505.02250v1, DOI:10.1137/15M1021106)
  for minimizing twice-differentiable convex objectives min_{x in C} f(x) over a closed convex constraint
  set C subseteq R^d. Given an n x d Hessian matrix square root nabla^2 f(x)^{1/2} satisfying (nabla^2
  f(x)^{1/2})^T nabla^2 f(x)^{1/2} = nabla^2 f(x) (such as diag{g_i''(<a_i, x>)^{1/2}} A for separable
  generalized linear models or analytic barrier terms) and an independent isotropic sketch matrix S^t
  in R^{m x n} with E[(S^t)^T S^t] = I_n (drawn from a sub-Gaussian ensemble, a randomized orthonormal
  system such as the fast Hadamard or Fourier transform with cost O(n d log m), or leverage-score row
  sampling), the fully sketched Newton update computes x^{t+1} := argmin_{x in C} { (1/2)||S^t nabla^2
  f(x^t)^{1/2}(x - x^t)||_2^2 + <nabla f(x^t), x - x^t> } (Equation 6); for additive decompositions f
  = f_0 + g where g has a structured or separable Hessian (such as a log-barrier or regularizer), the
  partially sketched Newton update (Equation 8) sketches only nabla^2 f_0(x^t) via Q^t := (S^t nabla^2
  f_0(x^t)^{1/2})^T S^t nabla^2 f_0(x^t)^{1/2} + nabla^2 g(x^t). Under strong convexity gamma and smoothness
  beta restricted to the tangent cone K at x^* and L-Lipschitz Hessian continuity, a sketch dimension
  m >= (c/eps^2) max_{x in C} W^2(nabla^2 f(x)^{1/2} K) (which is at most O(s log d) << min{n, d} for
  l_1-constrained problems with an s-sparse optimum, Lemma 8) guarantees local linear-quadratic convergence
  ||x^{t+1} - x^*||_2 <= eps(beta/gamma)||x^t - x^*||_2 + (4L/gamma)||x^t - x^*||_2^2 (Theorem 1) and
  super-linear convergence under eps(t) = 1/log(1+t) (Corollary 1). For strictly convex self-concordant
  functions and self-concordant barrier problems (Algorithms 1-3, Theorems 2-4), backtracking line search
  on the approximate Newton decrement achieves global affine-invariant iteration complexity T <= (f(x^0)
  - f(x^*))/nu + 0.65 log_2(1/(16 delta)) completely independent of condition numbers and Lipschitz constants.
identity_notes: Resolved against all 442 pinned AIO records and 619 maintained AIMech records. Distinct
  from AIMech:GloballyConvergentRegularizationHomotopyAndNystromNewtonForGeneralizedSelfConcordantLosses
  (Marteau-Ferey, Bach, & Rudi 2019, which combines decreasing-regularization Dikin-ellipsoid homotopy
  continuation with Nyström subspace projection and 3-step Cholesky-preconditioned conjugate gradient
  for L2-regularized generalized self-concordant RKHS losses rather than isotropic sub-Gaussian/ROS sketching
  of the Hessian square root over convex constraint tangent cones and log-barrier interior-point central
  paths), from AIMech:SelfConcordantAndPseudoSelfConcordantFiniteSampleMEstimation (Ostrovskii & Bach
  2021, which establishes statistical finite-sample localization and excess risk bounds for empirical
  M-estimators rather than randomized Hessian-sketched second-order optimization algorithms), and from
  AIMech:DeterministicBanachContractionAndNewtonKantorovichInequalitiesForSmoothMEstimators (Kuchibhotla
  2018, which proves deterministic Banach and Newton-Kantorovich localization bounds for fixed-objective
  M-estimators).
