claims:
- claim_id: full-and-partial-hessian-square-root-newton-sketch-and-ros-complexity
  kind: mechanism
  statement: 'Given a twice-differentiable convex function f: R^d -> R over a convex constraint set C
    subseteq R^d with an n x d Hessian square-root matrix nabla^2 f(x)^{1/2} satisfying (nabla^2 f(x)^{1/2})^T
    nabla^2 f(x)^{1/2} = nabla^2 f(x) for n >= rank(nabla^2 f(x)) (for example, diag{g_i''''(<a_i, x>)^{1/2}}_{i=1}^n
    A for separable objectives g(Ax) = sum_{i=1}^n g_i(<a_i, x>) or diag(1/|b_i - <a_i, x>|) A for polyhedral
    log-barriers) and an independent isotropic sketch matrix S^t in R^{m x n} satisfying E[(S^t)^T S^t]
    = I_n, the Newton Sketch update (Equation 6) solves x^{t+1} := argmin_{x in C} { (1/2)||S^t nabla^2
    f(x^t)^{1/2}(x - x^t)||_2^2 + <nabla f(x^t), x - x^t> }, which in the unconstrained case C = R^d reduces
    to x^{t+1} = x^t - ((nabla^2 f(x^t)^{1/2})^T (S^t)^T S^t nabla^2 f(x^t)^{1/2})^{-1} nabla f(x^t) (Equation
    7). For an additive decomposition f = f_0 + g, the partially sketched Newton update (Equation 8) sketches
    only nabla^2 f_0(x^t) while retaining the exact Hessian nabla^2 g(x^t) via Q^t := (S^t nabla^2 f_0(x^t)^{1/2})^T
    S^t nabla^2 f_0(x^t)^{1/2} + nabla^2 g(x^t). When S^t is drawn from a randomized orthonormal system
    (Hadamard or Fourier ROS, Section 2.2) with rows s^T = sqrt(n/m) e_j^T H D, forming S^t nabla^2 f(x^t)^{1/2}
    requires O(n d log m) operations and each unconstrained step costs O(n d log m + d m^2) rather than
    O(n d^2) for classical Newton''s method.'
  evidence:
  - source_id: pilanci2017-newton-sketch-pdf
    locator: Section 1, p. 2; Section 2.2, pp. 3-4; Section 3.1-3.2, pp. 5-8, Examples 1-2, Equations
      (5a)-(10)
    relation: supports
- claim_id: tangent-cone-gaussian-width-local-linear-quadratic-and-superlinear-convergence
  kind: mechanism
  statement: Let x^* = argmin_{x in C} f(x), let K := {Delta in R^d | x^* + t Delta in C for some t >
    0} be the tangent cone at x^* (Equation 11), let gamma = inf_{z in K cap S^{d-1}} <z, nabla^2 f(x^*)
    z> and beta = sup_{z in K cap S^{d-1}} <z, nabla^2 f(x^*) z> be the cone-constrained Hessian extreme
    eigenvalues (Equation 13), and suppose nabla^2 f is L-Lipschitz continuous (Equation 2). Defining
    the tangent-cone sketch random variables Z_1(S; x) := sup_{w in nabla^2 f(x)^{1/2} K cap S^{n-1}}
    <w, (S^T S - I) r> and Z_2(S; x) := inf_{w in nabla^2 f(x)^{1/2} K cap S^{n-1}} ||S w||_2^2 (Section
    6.1, p. 20), whenever ||Delta^t||_2 < gamma/(2L) the error Delta^t = x^t - x^* satisfies ||Delta^{t+1}||_2
    <= (6 beta Z_1^t / (gamma Z_2^t)) ||Delta^t||_2 + (4L / (gamma Z_2^t)) ||Delta^t||_2^2 (Equation 27).
    Under sketch dimension m >= (c / eps^2) max_{x in C} W^2(nabla^2 f(x)^{1/2} K) for sub-Gaussian sketches
    (or with an additional log^4 n factor for ROS sketches over self-bounding cones, Lemma 1) and initialization
    ||x^0 - x^*||_2 <= delta * gamma / (8L), Theorem 1 (Equation 14) establishes the linear-quadratic
    recursion ||x^{t+1} - x^*||_2 <= eps (beta/gamma) ||x^t - x^*||_2 + (4L/gamma) ||x^t - x^*||_2^2 with
    probability at least 1 - c_1 e^{-c_2 m eps^2}, and Corollary 1 proves that iteration-dependent sketching
    accuracy eps(t) = 1 / log(1 + t) yields super-linear convergence lim_{t -> infty} ||x^{t+1} - x^*||_2
    / ||x^t - x^*||_2 = 0. For l_1-constrained generalized linear models with an s-sparse optimum ||x^*||_0
    <= s, Lemma 8 (Appendix C, p. 33, Equation 25) bounds max_{x in C} W(nabla^2 f(x)^{1/2} K) <= 6 sqrt(s
    log d) sqrt(psi_max''/psi_min'') max_j ||A_j||_2 / sqrt(gamma_s^-(A)), so a sketch dimension m = O(s
    log d) << min{n, d} suffices.
  evidence:
  - source_id: pilanci2017-newton-sketch-pdf
    locator: Section 3.3, pp. 9-11, Theorem 1, Corollary 1, Equations (11)-(16); Section 5.1, pp. 15-16,
      Equations (23)-(25); Section 6.1, pp. 20-23, Lemma 1, Equations (27)-(34); Appendix C, p. 33, Lemma
      8
    relation: supports
- claim_id: self-concordant-two-phase-global-convergence-and-sketched-interior-point-barrier-complexity
  kind: scope
  statement: 'For a strictly convex self-concordant function f: R^d -> R (Algorithm 1, Theorem 2) or f
    = f_0 + g where f_0 is self-concordant and g is a self-concordant barrier for C whose Hessian nabla^2
    g(x) is retained unsketched (Algorithm 2, Theorem 3), if m^t >= (c_3 / eps^2) max_{x in C} W^2(nabla^2
    f(x)^{1/2} K^t), then with probability at least 1 - c_1 e^{-c_2 m^t eps^2} the sketched Newton step
    v_NSK and exact Newton step v_NE satisfy ||nabla^2 f(x)^{1/2}(v_NSK - v_NE)||_2 <= eps ||nabla^2 f(x)^{1/2}
    v_NE||_2 (Lemma 2, Equation 37; Lemma 7, Equation 48), and the approximate Newton decrement tilde_lambda_f(x)
    := (-<nabla f(x), v_NSK>)^{1/2} satisfies (1 - eps) lambda_f(x) <= tilde_lambda_f(x) <= (1 + eps)
    lambda_f(x) and ||nabla^2 f(x)^{1/2} v_NSK||_2 <= ((1+eps)/(1-eps)) tilde_lambda_f(x) (Lemmas 5-6,
    Equations 42, 44b, 58). Defining eta = (1/8) (1 - (1/2)((1+eps)/(1-eps))^2 - a) / ((1+eps)/(1-eps))^3
    > 0 and nu = a b eta^2 / (1 + ((1+eps)/(1-eps)) eta) > 0 for backtracking line-search parameters (a,
    b) (Equation 18), Lemma 3 proves two phases: in Phase I (tilde_lambda_f(x) > eta), each backtracking
    step decreases f by at least nu (Equation 39); in Phase II (tilde_lambda_f(x) <= eta), unit steps
    satisfy lambda_f(x_NSK) <= ((1+eps) lambda_f(x)^2 + eps lambda_f(x)) / (1 - (1+eps) lambda_f(x))^2
    <= (16/25) lambda_f(x) (Equations 44a and 46), yielding global complexity T <= (f(x^0) - f(x^*))/nu
    + 0.65 log_2(1 / (16 delta)). When embedded as the centering solver inside the log-barrier interior-point
    method min_{x in R^d} {tau f_0(x) - sum_{j=1}^r log(-g_j(x))} with barrier multiplier mu > 1 (Algorithm
    3), Theorem 4 (Equation 22) bounds the total Newton Sketch iterations to reach delta-optimality by
    ceil(log(r/(tau^0 delta)) / log mu) * (r(mu - 1 - log mu)/nu + 0.65 log_2(1/(16 delta))), accelerating
    primal and dual interior-point solvers for LPs, portfolio QPs, SVMs, d >> n dual Lasso, and metric
    learning SDPs (Section 5).'
