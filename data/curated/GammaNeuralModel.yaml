- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: The gamma family realizes temporal state through recursive memory dynamics. Even the focused
    configuration has recurrent memory feeding a spatially feedforward mapper. The AIO recurrent-network
    category is broader than this particular gamma-kernel architecture family.
limitations:
- The record covers the 1990 NeurIPS formulation and 1991 focused-network proceedings paper, both read
  completely. The later 1992 journal article was identified but its full text was not available from the
  attempted copy; it is not treated as inspected evidence.
- Continuous-time rates and dimensionless discrete-time recurrence coefficients have distinct conventions.
  No arbitrary discretization step, numerical integration scheme or executable implementation is supplied
  here.
- Finite order restricts the kernel family and memory is generally dispersive. Depth metrics and approximation
  statements do not prove exact reconstruction of an arbitrary past or finite-order exactness for every
  convolution.
- The strict fixed-coefficient stability interval concerns the linear memory, not all parameter adaptation
  or nonlinear feedback. Endpoint behavior and signed responses above mu=1 remain explicit.
- Focused placement, temporal Hebbian learning and backpropagation/RTRL choices are scoped configurations.
  Optimization claims in the source are not adopted as universal guarantees or evidence of automatic order
  selection.
- All seven theory-paper pages and all eight focused-paper pages, including figures and references, were
  visually read. Constructed recurrence, kernel and derivative checks involve no fitting. No author code,
  model training, runtime benchmark or empirical replication was run.
