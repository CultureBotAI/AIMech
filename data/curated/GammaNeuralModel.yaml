claims:
- claim_id: continuous-gamma-cascade
  kind: mechanism
  statement: For positive fixed decay rate mu, the continuous kernels are g_k(t)=mu^k*t^(k-1)*exp(-mu*t)/(k-1)!
    for t>=0 and positive integer k. Convolutional traces with zero initial history obey d y_k/dt=mu*(y_(k-1)-y_k),
    where y_0 is the driving neural output. Their weighted combination supplies delayed interactions in
    the neural-state equation, alongside any direct term. Each basis kernel has unit integral, but arbitrary
    signed weight matrices do not make the combined interaction a probability distribution. A finite kernel
    expansion is not an exact representation of every possible temporal interaction; the source’s approximation
    discussion has decay and increasing-order assumptions.
  evidence:
  - source_id: devries1990
    locator: Section 2, Equations 2–11, PDF pp. 2–4 / printed pp. 163–165; curator kernel normalization
    relation: supports
- claim_id: discrete-memory-and-delay-boundaries
  kind: mechanism
  statement: The discrete memory uses x_0[n]=u[n] and simultaneous updates x_k[n]=(1-mu)*x_k[n-1]+mu*x_(k-1)[n-1].
    For zero initial state and 0<mu<1, its k-stage impulse response is binomial(n-1,k-1)*mu^k*(1-mu)^(n-k)
    for n>=k, a dispersed rather than exact delay. At mu=1 it becomes a tapped delay line; at mu=0 no
    new input enters the stored traces and existing initial traces remain frozen. For the positive-kernel
    regime the mean-depth parameter K/mu describes the last memory stage, not a hard cutoff, exact retrieval
    horizon or proof of preserved information. Small mu trades temporal resolution for depth.
  evidence:
  - source_id: devries1990
    locator: Section 4, Equations 15–16 and Figure 1, PDF pp. 6–7 / printed pp. 167–168
    relation: supports
  - source_id: principe1991
    locator: Section 2, Equations 1–3, PDF pp. 2–3 / printed pp. 144–145; curator impulse-response expansion
    relation: supports
- claim_id: stability-scope
  kind: limitation
  statement: 'For fixed mu the discrete stage pole is 1-mu, giving asymptotic and bounded-input bounded-output
    stability of the linear memory for 0<mu<2. The endpoint mu=2 is excluded: an alternating bounded input
    gives a stage response whose magnitude grows linearly. Mu=0 does not forget a nonzero initial state.
    These boundaries qualify the earlier paper’s inclusive endpoint wording; the focused-network paper
    uses the strict interval. Values 1<mu<2 have alternating-sign memory weights, not positive averages.
    Stability of a fixed linear memory does not establish stability of an arbitrary coupled nonlinear
    network, an unconstrained adaptation trajectory or its optimizer.'
  evidence:
  - source_id: devries1990
    locator: Section 4 stability discussion, PDF p. 6 / printed p. 167
    relation: supports
  - source_id: principe1991
    locator: Section 2 and Conclusions, PDF pp. 3,7 / printed pp. 145,149; curator endpoint counterexample
    relation: supports
- claim_id: focused-network-configuration
  kind: scope
  statement: The focused gamma network places the gamma memory at the input and sends its traces to a
    static nonlinear feedforward mapper. It is a source-defined configuration of the gamma family, not
    the whole family or an independently averaged set of temporal models. Its spatial mapper is feedforward,
    while the memory still has recurrent dynamics. The more general formulation can filter neural-state
    outputs, and additional placements are discussed as extensions.
  evidence:
  - source_id: devries1990
    locator: Sections 2 and 4, PDF pp. 2–6 / printed pp. 163–167
    relation: supports
  - source_id: principe1991
    locator: Sections 1–2, Figure 1 and Conclusions, PDF pp. 1–3,7–8 / printed pp. 143–145,149–150
    relation: supports
- claim_id: learning-choices-and-optimality
  kind: limitation
  statement: The original formulation gives a temporal Hebbian weight rule using locally available gamma
    traces. The focused configuration instead trains spatial weights with ordinary backpropagation and
    gives a recursive sensitivity for the memory parameter, a_k[n]=(1-mu)*a_k[n-1]+mu*a_(k-1)[n-1]+x_(k-1)[n-1]-x_k[n-1],
    with an appropriate initial sensitivity; backpropagation through time is also discussed. These are
    learning choices, not one mandatory training algorithm. The displayed fixed-parameter sensitivity
    does not by itself guarantee exact gradients under parameter drift, successful optimization, automatic
    selection of integer order K or an always-optimal memory depth.
  evidence:
  - source_id: devries1990
    locator: Section 3, Equation 13, PDF p. 5 / printed p. 166
    relation: supports
  - source_id: principe1991
    locator: Section 2 derivative equations and Conclusions, PDF pp. 3–4,7 / printed pp. 145–146,149;
      curator fixed-rate finite differences
    relation: supports
- claim_id: evaluation-boundaries
  kind: scope
  statement: The focused-network experiments concern five-step prediction on a selected EEG segment, a
    specified Mackey–Glass series and identification of one linear low-pass system. EEG comparisons scan
    discrete mu settings rather than demonstrate successful learned adaptation of mu in that experiment.
    The Mackey–Glass example adapts mu online under selected capacity, sample and epoch choices; the conclusion
    describes its performance as similar to TDNN in that short-memory setting. Benefits in the chosen
    linear-identification example do not establish universal superiority, always fewer required parameters,
    biological causality or unlimited long-term memory. These results are for focused configurations,
    not a validation of every gamma architecture.
  evidence:
  - source_id: principe1991
    locator: Section 3, Figures 2–5, Table I and Conclusions, PDF pp. 4–8 / printed pp. 146–150
    relation: supports
