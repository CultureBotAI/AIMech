id: AIMech:GammaNeuralModel
name: Gamma neural model
aliases:
- Gamma neural network
- Gamma net
- Gamma neural net
concept_kind: architecture
definition: A neural architecture family that represents delayed inputs or neural outputs by weighted
  gamma-kernel memory traces, realized through cascades of first-order leaky integrators.
identity_notes: Compared all 442 pinned AIO and 580 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 3, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 65 AIO and 156 native definitions, with unchanged preceding rows
  verified and new matches read. 4 full annotated AIO node/edge/generated contexts and 4 full native records
  were inspected. Prior matches carry the temporal-kernel report’s pending Gamma lead. Cascaded gamma
  traces differ from SCRN’s separate exponential context, TKRNN’s factored parallel temporal kernels,
  Clockwork’s module schedule and NNPDA’s external fractional-symbol stack. Focused gamma input-memory
  placement is a source-defined configuration within the broader architecture. A gamma distribution in
  a separate probabilistic method and the unrelated consistency-learning Gamma-model cohort do not imply
  identity. Full recurrent-network scope supports the broader mapping; generic feedback, convolution and
  simple recurrent-layer contexts do not supply an exact or more appropriate broader match.
