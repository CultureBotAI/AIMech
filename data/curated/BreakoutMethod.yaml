name: Breakout method
definition: A finite constraint-satisfaction search method that takes strictly improving local assignment
  changes under a weighted nogood cost and increases the weights of all currently violated nogoods at
  a non-solution local minimum to change the search landscape.
concept_kind: algorithm
identity_notes: 'This is Morris’s Breakout method, using weights on forbidden assignment tuples, not the
  Breakout game. It is distinct from the idealized Fill algorithm, which raises only the current state’s
  stored cost, and from GLS, which selects features by penalty utility. Shared adaptive-penalty ideas
  do not make Breakout, GENET and GLS exact synonyms. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 310 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 3 and 9 lines respectively.
  All twelve text hits were inspected: six prior candidate-lead lines across the checkouts and six unrelated
  Pygments lexer-state lines in the ignored main environment. No hit established an existing candidate
  record. Seven exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native
  neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The practical Breakout method is incomplete. The paper supplies a satisfiable four-variable CNF counterexample
  where repeated reweighting can oscillate without reaching the all-true solution. No finite-budget success
  or unsatisfiability certificate is implied.
- The paper’s completeness theorem applies to the distinct idealized Fill algorithm, which stores and
  raises the cost of the current state alone on the finite assignment space. It must not be transferred
  to Breakout’s shared nogood weights.
- 'Representation affects the penalty landscape: one constraint can contain several forbidden tuples,
  and shared nogoods couple costs of different assignments. A constraint-weight implementation requires
  evidence that its intended representation matches this scope.'
- Random initialization is an experimental choice, not a required random restart after each local minimum.
  Favorable results on constructed distributions do not establish general efficiency. The finite curator
  calculation checks a prefix of the published counterexample, not an independent proof for infinite executions.
