claims:
- claim_id: method
  kind: mechanism
  statement: Represent forbidden assignment tuples as nogoods, give each weight1, and score a complete
    assignment by the sum of weights of the nogoods it matches. Until a satisfying assignment is reached,
    make any local assignment change that strictly lowers this weighted cost when one exists. At a non-solution
    local minimum, increment every currently matched nogood’s weight by1 and repeat the search/weight-increase
    cycle until an improving move becomes available. Plateau points are treated as local minima rather
    than traversed by unweighted sideways moves. The method leaves initialization and the choice among
    improving changes open; the reported implementation uses random initial assignments and the first
    improving change found in a left-to-right scan. Weight increases persist and can also raise costs
    of neighboring states sharing the same nogoods.
