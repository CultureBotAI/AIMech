claims:
- claim_id: r489-claim-1
  kind: mechanism
  statement: FedRolex extracts layer i of client n's sub-model in round j using a rolling window S_{n,i}^{(j)} of size floor(beta_n K_i) starting at j_hat = j mod K_i with circular wraparound modulo K_i (Equation 4) and aggregates returned sub-model parameters at the server via selective averaging theta_{[i,k]}^{(j+1)} = (1 / sum_{m in M_k} p_m) sum_{m in M_k} p_m theta_{m,[i,k]}^{(j)} over the subset M_k of participating clients whose rolling window covered parameter [i, k] (Algorithm 1, Equation 10).
  evidence:
  - source_id: r489-primary-pdf
    locator: Section 3.2, pp. 4-5, Equation 4, Algorithm 1; Appendix A.2, p. 16, Equation 10
    relation: supports
- claim_id: r489-claim-2
  kind: mechanism
  statement: By Lemmas 1 and 2 (Appendix A.1, Equations 7-9), random sub-model selection (Federated Dropout, Equation 5) requires E[N] = I sum_{i=1}^I (1/i) = I int_0^infty (1 - (1 - e^{-t})^I) dt ~ I log I rounds to select all I indices once and I int_0^infty (1 - (1 - S_m(t) e^{-t})^I) dt ~ I log I + I(m-1) log log I rounds to select all indices at least m times, whereas FedRolex's deterministic rolling window trains every index m times in exactly m I rounds and can train a global server model gamma > 1 times larger than the largest client model.
  evidence:
  - source_id: r489-primary-pdf
    locator: Sections 3.3.1-3.3.2 & 4.4, pp. 5-6 & 9; Appendix A.1, pp. 14-15, Lemmas 1-2
    relation: supports
- claim_id: r489-claim-3
  kind: limitation
  statement: A full nonconvex optimization convergence proof for rolling sub-model extraction is left open beyond the statistical coverage analysis, and when the server model scaling ratio gamma = {2, 4, 8, 16} grows large relative to small client models on small datasets, global model accuracy still drops as gamma increases.
  evidence:
  - source_id: r489-primary-pdf
    locator: Sections 4.4 & 5, pp. 9-10, Figure 4
    relation: supports
- claim_id: r489-claim-4
  kind: application
  statement: Applied to model-heterogeneous cross-device federated training of PreResNet18 on CIFAR-10 and CIFAR-100 and a 3-layer Transformer language model on Stack Overflow across five client capacity tiers beta in {1, 1/2, 1/4, 1/8, 1/16}, outperforming HeteroFL and Federated Dropout under both low and high data heterogeneity.
  evidence:
  - source_id: r489-primary-pdf
    locator: Section 4, pp. 6-10, Tables 2-4, Figures 3-5
    relation: supports
