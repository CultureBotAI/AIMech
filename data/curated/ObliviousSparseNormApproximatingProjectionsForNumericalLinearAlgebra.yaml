id: AIMech:ObliviousSparseNormApproximatingProjectionsForNumericalLinearAlgebra
name: Oblivious Sparse Norm-Approximating Projections (OSNAP) for Fast Numerical Linear Algebra
concept_kind: mathematical_method
review_status: DRAFT
definition: 'An Oblivious Sparse Norm-Approximating Projection (OSNAP) is a distribution over sparse sketching matrices Pi in {0, +1/sqrt(s), -1/sqrt(s)}^{m x n}, introduced and analyzed by Nelson and Nguyen (2013), that forms an oblivious subspace embedding (OSE) preserving (1 - varepsilon)*||x||_2 <= ||Pi x||_2 <= (1 + varepsilon)*||x||_2 simultaneously for all vectors x in any fixed d-dimensional subspace W subset R^n with probability at least 1 - delta. Writing Pi_{i,j} = delta_{i,j} * sigma_{i,j} / sqrt(s) with random signs sigma_{i,j} in {-1, +1} and column-sparsity indicators delta_{i,j} in {0, 1}, an OSNAP satisfies two structural properties: (1) every column j in [n] has exactly sum_{i=1}^m delta_{i,j} = s non-zero entries with probability 1, and (2) the indicators delta_{i,j} are negatively correlated such that E[prod_{(i,j) in S} delta_{i,j}] <= (s/m)^{|S|} for all S subseteq [m] x [n].'
identity_notes: "Distinct from AIMech:ProjectionCostPreservingSketchesForKMeansAndConstrainedLowRankApproximation (Round 364), which preserves rank-k left projection costs ||(I - P)A||_F^2 + c in O(k/varepsilon^2) dimensions (and uses OSNAP as an underlying sketching primitive), whereas OSNAP is a sparse oblivious subspace embedding preserving ||Pi U y||_2 in (1 +- varepsilon)*||y||_2 for all y in R^d simultaneously\u2014equivalently bounding all singular values of Pi U in [1 - varepsilon, 1 + varepsilon] via a Bai-Yin moment method on generalized dot-product multigraphs. Also distinct from AIMech:FrequentDirectionsDeterministicMatrixSketching (Round 363), which is a deterministic SVD-shrinkage sketch requiring O(n*d*ell) time rather than O(s*nnz(A)) sparse hashing time."
aliases:
- OSNAP
- Oblivious Sparse Norm-Approximating Projection
- Nelson-Nguyen Sparse Oblivious Subspace Embedding
