limitations:
- DT-only, DO-only, DOT, shortcut variants and stacked recurrent states are distinguished; shared depth
  terminology does not make them exact synonyms.
- Learned operators need not satisfy arithmetic algebraic laws. Shortcut paths and universal-approximation
  motivation do not establish training or memory guarantees.
- Main and starred music experiments differ in units, initialization and regularization. Language comparisons
  differ in model sizes and evaluation protocols.
- All 13 primary PDF pages visually read, including figures, formulas, tables, footnotes and references.
  No author code, other versions, model training or empirical replication; DRAFT remains.
