id: AIMech:CSERCommunicationEfficientSgdWithErrorReset
name: CSER (Communication-Efficient SGD with Error Reset)
concept_kind: algorithm
review_status: DRAFT
definition: A communication-efficient distributed SGD algorithm (and Nesterov momentum variant M-CSER) that adapts a pair of delta-approximate compressors C_1 (with approximation factor delta_1 in (0, 1]) and C_2 (with factor delta_2 in [0, 1]) via a partial synchronization subroutine PSync(v_i, C) that averages only the compressed component v_bar' = (1/n) sum_{j=1}^n C(v_j) across workers and locally recombines the residual r_i = v_i - C(v_i) into v'_i = v_bar' + r_i, immediately applying both partially synchronized gradients g'_{i,t} and local residuals r_{i,t} to bifurcated local models x_{i,t-1/2} = x_{i,t-1} - eta g'_{i,t} at every step while periodically flushing and resetting the accumulated local residual error e_{i,t-1/2} every H iterations via (e'_{i,t-1/2}, e_{i,t}) = PSync(e_{i,t-1/2}, C_1) and x_{i,t} = x_{i,t-1/2} - e_{i,t-1/2} + e'_{i,t-1/2}.
identity_notes: Distinct from Error-Feedback SGD / Sparsified SGD with Memory (AIMech:SparsifiedSgdWithMemory, Stich et al. 2018; Karimireddy et al. 2019) and QSparse-local-SGD (Basu et al. 2019), which keep local models fully synchronized after communication and set residual compression errors e_{i,t} aside from gradient evaluation for up to H local steps; CSER immediately assimilates residuals into bifurcated local models x_{i,t} so that x_{i,t} - e_{i,t} = x_{j,t} - e_{j,t} holds for all workers (Lemma 1) and the compression error vanishes when n = 1 (Remark 2).
aliases:
- CSER
- Communication-Efficient SGD with Error Reset
- M-CSER
- Momentum CSER
- CSER Optimizer
