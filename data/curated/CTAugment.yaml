name: CTAugment
definition: An online augmentation-policy adaptation procedure that samples image operations and adjusts
  their parameter-selection weights using classifier feedback on labeled probe images during training.
concept_kind: algorithm
identity_notes: CTAugment is the augmentation-policy component introduced with ReMixMatch, not the complete
  ReMixMatch classifier-training objective. It adapts parameter sampling from prediction feedback during
  training rather than performing AutoAugment’s separate child-model search or using RandAugment’s fixed
  uniform operation sampling with one shared magnitude. The record preserves a versioned implementation
  profile and does not silently identify its numerical update with the printed paper formula. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 238 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 34 lines in each from prior discovery, saved reviews and related native records. Ten exact
  AIO CLASS nodes, their scoped synonyms and outgoing edges, plus five neighboring native mechanisms were
  inspected. This absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- The paper’s printed feedback score is 1−sum(abs(q−one_hot(y)))/(2L), with L classes, whereas the inspected
  implementation omits the class-count divisor. The paper also describes direct weighted-bin sampling
  and a raw threshold, unlike the implementation’s relative threshold and interval sampling.
- 'Parameter counts also differ: the paper describes 17 bins except six rescale methods, while the inspected
  code uses eight posterize entries. These source differences are documented, not declared author-issued
  errata.'
- Predictive feedback can reward easy transformations rather than prove preservation of useful class information.
  A learned policy remains data- and model-dependent.
- The ReMixMatch wrapper’s probe classifier uses evaluation EMA parameters, and worker queues can delay
  application of updated rates; no immediate next-step or fixed operation-order guarantee is asserted.
- The original paper’s exact revision is not stamped in the author-hosted PDF. Code provenance is an exact
  commit; no byte equivalence with an OpenReview release, author-code execution or performance reproduction
  is claimed.
