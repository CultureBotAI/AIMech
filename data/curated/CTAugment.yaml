- claim_id: feedback-conventions
  kind: limitation
  statement: The printed class-divided feedback score and the released-code score are different. For a
    valid L-class probability vector, the former is 1−(1−q_y)/L while the latter is q_y. Thus the paper
    expression is at least 1−1/L; interpreting its 0.8 threshold as an absolute raw-weight cutoff has
    different behavior from the code’s relative threshold. These are algebraic consequences of the cited
    formulas, not an assertion of an author-issued correction.
  evidence:
  - source_id: method-source
    locator: 'Section3.2.2, PDF p. 6: printed score and update'
    relation: supports
