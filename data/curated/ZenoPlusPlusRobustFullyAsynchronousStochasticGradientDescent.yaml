limitations:
- Requires an auxiliary server-side validation dataset S with bounded gradient variance V_3 relative to the global objective.
- Rejects a substantial fraction of benign stale worker gradients (false-positive rate ~47-60% under high worker delay on CIFAR-10), trading off wall-clock step acceptance against Byzantine resilience.
