claims:
- claim_id: c1-mechanism-norm-rescaling-and-first-order-approximated-descent-score
  kind: mechanism
  statement: Upon receiving a candidate gradient g_tilde from an anonymous worker, the Zeno++ server reads its cached validation gradient v = nabla f_s(x_tau) (tau <= t - 1), rescales g = c * g_tilde so that ||g||_2^2 = ||v||_2^2, tests whether the first-order approximated stochastic descent score satisfies gamma * <v, g> - rho * ||g||_2^2 >= -gamma * epsilon (Definition 3), updates x_t <- x_{t-1} - gamma * g if accepted, and refreshes v non-blockingly in the background via ZenoUpdater(x) when idle or every k iterations.
  evidence:
  - source_id: r532-primary-pdf
    locator: Section 4.2, Definition 3 and Algorithm 2 Lines 1-3, p. 4
    relation: supports
- claim_id: c2-scope-convergence-under-unbounded-worker-delay-and-byzantine-majority
  kind: scope
  statement: Under L-smoothness, bounded true and validation gradient norms ||nabla F(x)||^2, ||nabla f_s(x)||^2 <= V_1, non-zero lower-bounded validation gradients ||nabla f_s(x)||^2 >= V_2 > 0, bounded validation variance E[||nabla f_s(x) - nabla F(x)||^2] <= V_3, and bounded server validation staleness t - tau <= k, Zeno++ converges at rate O(1/T) for general non-convex objectives (Theorem 2) and linearly to a neighborhood for PL objectives (Theorem 1) without any bound on worker delay k_w or the number of Byzantine workers q <= m.
  evidence:
  - source_id: r532-primary-pdf
    locator: Section 5.1 Assumption 1, Theorems 1-2, and Appendix A.1, pp. 5, 11-12
    relation: supports
- claim_id: c3-application-asynchronous-cifar10-and-wikitext2-byzantine-training
  kind: application
  statement: Zeno++ maintains convergence on asynchronous CIFAR-10 CNN classification and WikiText-2 LSTM language modeling under sign-flipping (-10 * grad) and label-flipping attacks even when q = 8 of m = 10 workers are Byzantine and worker delay reaches k_w = 15, outperforming Kardam and server-only training.
  evidence:
  - source_id: r532-primary-pdf
    locator: Section 6.2-6.3, Figures 1-4, and Appendix B Figures 5-9, pp. 6-9, 12-15
    relation: supports
- claim_id: c4-limitation-server-validation-dataset-and-false-positive-rejection-tradeoff
  kind: limitation
  statement: Zeno++ requires a clean server validation dataset S with non-zero validation gradients (||nabla f_s(x)||^2 >= V_2 > 0) and incurs a trade-off controlled by rho and server delay k where larger rho accelerates per-step descent but increases the false-positive rejection rate of honest stale gradients (FP ~ 47-60% on CIFAR-10).
  evidence:
  - source_id: r532-primary-pdf
    locator: Section 5.1 Remarks 5-6 and Section 6.2.1-6.2.2 Figures 1-3, pp. 5-8
    relation: supports
