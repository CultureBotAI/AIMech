id: AIMech:ZenoPlusPlusRobustFullyAsynchronousStochasticGradientDescent
name: Zeno++ Robust Fully Asynchronous Stochastic Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-tolerant fully asynchronous stochastic gradient descent algorithm for parameter-server architectures with anonymous workers, unbounded worker delay, and an arbitrary number of Byzantine workers that maintains a lazily updated server validation gradient v = nabla f_s(x_tau) (with server staleness t - tau <= k), normalizes each arriving candidate worker gradient g_tilde to g = c * g_tilde such that ||g||_2^2 = ||v||_2^2, and applies the asynchronous update x_t <- x_{t-1} - gamma * g if and only if the first-order Taylor approximated stochastic descent score satisfies gamma * <v, g> - rho * ||g||_2^2 >= -gamma * epsilon.
identity_notes: Introduced by Xie, Koyejo, and Gupta (ICML 2020, PMLR 119:10495-10503, arXiv:1903.07020). Distinct from synchronous Zeno (AIMech:ZenoSuspicionBasedFaultTolerantDistributedStochasticGradientDescent, Xie et al. ICML 2019), which evaluates exact zero-order loss differences f_r(x) - f_r(x - gamma*g_i) for all m workers at a synchronous barrier and averages the top m - b candidates, and from asynchronous Kardam (Damaskinos et al. 2018), which requires verified worker identities, bounded consecutive worker messages, and fewer than one-third Byzantine workers.
aliases:
- Zeno++
- Zeno++ Byzantine-Tolerant Fully Asynchronous SGD
- ZenoPlusPlus Asynchronous Inner-Product Validation SGD
