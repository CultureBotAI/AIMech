id: AIMech:BerrutApproximatedCodedComputingForStragglerResilientNonPolynomialDistributedComputation
name: Berrut Approximated Coded Computing for Straggler-Resilient Non-Polynomial Distributed Computation
concept_kind: algorithm
review_status: DRAFT
definition: 'A numerically stable straggler-resilient coded computing scheme over the real numbers R for approximately evaluating arbitrary (possibly non-polynomial) functions f: V -> U across K input data blocks X = (X_0, ..., X_{K-1}) using N + 1 worker nodes, in which the master encodes the dataset via Berrut''s pole-free barycentric rational interpolant u(z) = sum_{i=0}^{K-1} (((-1)^i / (z - alpha_i)) / sum_{j=0}^{K-1} ((-1)^j / (z - alpha_j))) X_i at first-kind Chebyshev nodes alpha_j = cos((2j + 1) pi / (2K)), assigns coded shares X_hat_r = u(z_r) at second-kind Chebyshev nodes z_r = cos(r pi / N) to workers r in {0, ..., N}, and decodes f(X_j) approx r_{Berrut, F}(alpha_j) in O(|F|) time from any subset F of n + 1 = N + 1 - s non-straggling worker evaluations f(u(z_tilde_i)) using Berrut''s rational interpolant r_{Berrut, F}(z) = sum_{i=0}^n (((-1)^i / (z - z_tilde_i)) / sum_{j=0}^n ((-1)^j / (z - z_tilde_j))) f(u(z_tilde_i)).'
identity_notes: 'Distinct from Lagrange Coded Computing (AIMech:LagrangeCodedComputingForResilientSecureAndPrivateDistributedLearning, which is restricted to multivariate polynomials of degree deg(f), requires a hard recovery threshold of (K - 1) deg(f) + 1 workers, and suffers exponential Vandermonde ill-conditioning over R): Berrut Approximated Coded Computing (BACC, Jahani-Nezhad & Maddah-Ali, IEEE TPAMI 2023) replaces polynomial interpolation with Berrut''s alternating-sign barycentric rational interpolant over first- and second-kind Chebyshev nodes, enabling straggler-resilient approximate evaluation of arbitrary non-polynomial functions (such as deep neural network gradients) from any number of surviving workers with a logarithmically bounded Lebesgue constant.'
aliases:
