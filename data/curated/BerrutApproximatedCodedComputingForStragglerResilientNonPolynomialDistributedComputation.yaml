claims:
- claim_id: bacc-pole-free-chebyshev-rational-encoding-and-decoding
  kind: mechanism
  statement: BACC encodes K data blocks at first-kind Chebyshev nodes alpha_j = cos((2j + 1) pi / (2K)) via u(z) in Eq. 18 (satisfying u(alpha_j) = X_j exactly), evaluates f(u(z_r)) at second-kind Chebyshev nodes z_r = cos(r pi / N), and reconstructs r_{Berrut, F}(z) from any surviving worker subset F in O(|F|) operations (Eq. 21) without real poles for any distribution of surviving nodes (Lemma 1).
  evidence:
  - source_id: r547-primary-pdf
    locator: Section II Definition 5 & Lemma 1 p. 4 Eq. 12-13; Section III p. 6-7 Eq. 18-21
    relation: supports
- claim_id: bacc-logarithmic-lebesgue-constant-and-straggler-error-bound
  kind: scope
  statement: For any subset X_n of n + 1 = N + 1 - s surviving workers at second-kind Chebyshev nodes (with s < N - 2), the worst-case Lebesgue constant occurs when the s stragglers are consecutive (Lemma 6) and is bounded logarithmically by Lambda_n <= (((s + 1)(s + 3) pi^2 / 4) + 1)(1 + pi^2 (s + 1) ln(N - s)) (Theorem 7); for g(z) = f(u(z)) in C^2[-1, 1], the uniform approximation error satisfies ||r_{Berrut, F}(z) - g(z)|| <= 2(1 + R) sin((s + 1) pi / (2N)) (||g''|| + ||g'||) with R = (s + 1)(s + 3) pi^2 / 4 (Theorem 9).
  evidence:
  - source_id: r547-primary-pdf
    locator: Section IV Lemma 6, Theorem 7, Corollary 8, & Theorem 9 p. 7-8 Eq. 22; Appendix VIII p. 16-19
    relation: supports
- claim_id: bacc-approximation-bias-and-consecutive-straggler-limitation
  kind: limitation
  statement: Unlike exact finite-field coded computing, BACC returns an approximate evaluation whose error Bound 2(1 + R) sin((s + 1) pi / (2N)) grows cubically with the number of consecutive stragglers s via R = (s + 1)(s + 3) pi^2 / 4 when s becomes a large fraction of N.
  evidence:
  - source_id: r547-primary-pdf
    locator: Section IV Lemma 6 & Theorem 9 p. 7-8; Section V Fig. 2 & Fig. 5 p. 9-11
    relation: supports
