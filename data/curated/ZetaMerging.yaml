claims:
- claim_id: method
  kind: mechanism
  statement: Given a fixed nonnegative weighted adjacency P, a nonempty initial partition and target count
    m_c smaller than its initial count, choose damping 0<z<1/(2||P||_1), the sufficient range stated in
    Section 3.1 for nonzero P. For a cluster C use the principal submatrix P_C without local renormalization
    and R_C=(I−zP_C)^−1. Its popularity is chi_C=(1/|C|) sum_(i in C) log (R_C)_ii. Equivalently it is
    the average leave-one-vertex-out reduction of epsilon_C=−log det(I−zP_C). For U=A union B, chi_(A|U)
    averages log (R_U)_ii over i in A with divisor |A|. Merge the current pair maximizing (chi_(A|U)−chi_A)+(chi_(B|U)−chi_B);
    recompute affected affinities and repeat to m_c. The conditional increment is not chi_U−chi_A−chi_B.
  evidence:
  - source_id: method-source
    locator: Sections 2.2–3.2, PDF pp. 3–4, Equations (2)–(5), Theorem 2 and Algorithm 1; Section 4.3,
      pp. 5–6, component boundary
    relation: supports
- claim_id: popularity-bound-qualification
  kind: limitation
  statement: 'Curator calculation: for P=[[0,1],[1,0]], z=1/4 and C both vertices, det(I−zP)=15/16 and
    both diagonal entries of (I−zP)^−1 are 16/15. Thus epsilon_C=chi_C=log(16/15)>epsilon_C/2. The z choice
    satisfies Section 3.1’s sufficient norm bound. The printed upper bound after Theorem 2 is not adopted.
    The reproducible finite calculation is saved as research/discovery/zeta-popularity-bound.py; it is
    not a benchmark of the clustering procedure.'
  evidence:
  - source_id: method-source
    locator: PDF p. 3, Equations (3)–(4) and Theorem 2 supply the definitions evaluated by the curator
      in research/discovery/zeta-popularity-bound.py; p. 4 Section 3.1 supplies the damping condition
    relation: supports
  - source_id: method-source
    locator: PDF p. 3, printed inequality immediately after Theorem 2 is the challenged assertion, not
      support for its validity
    relation: context
