name: Zeta merging
definition: An agglomerative graph-clustering algorithm that selects the pair with the largest sum of
  conditional increases in average log-diagonal resolvent popularity.
concept_kind: algorithm
identity_notes: Zeta merging is the named Algorithm 1 component of Zhao and Tang’s Zell method. Its input
  is an already constructed weighted graph and initial partition; it does not prescribe the l-links initialization.
  It differs from path integral clustering, which averages all endpoint-to-endpoint resolvent entries
  rather than logarithms of diagonal entries. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 218 preceding native IDs/names/aliases. Word-delimited fixed-string searches
  of both full checkouts, including ignored and hidden files, returned 15 lines each in existing discovery/review
  context. Five neighboring native records and five exact AIO nodes with scoped synonyms and outgoing
  edges were inspected.
limitations:
- Initialization, graph weights, damping and requested count determine the result; greedy merges cannot
  undo an initial grouping or certify a global partition optimum.
- The paper prints z<rho(W) in Theorem 1, whereas the cycle power series requires |z|rho(W)<1. This record
  uses the stricter positive norm bound actually stated for Algorithm 1, rather than importing the printed
  general condition.
- The printed bound 0<chi_C<=epsilon_C/|C| is not used. A two-vertex mutual-edge graph with z=1/4 gives
  chi_C=epsilon_C=log(16/15)>epsilon_C/2 under the paper’s own definitions; this is a curator counterexample,
  not an author erratum.
- Zell’s full l-links and bandwidth conventions require separate clarification and are not specified by
  this component. No generic sparse-inverse runtime guarantee, automatic correct cluster count, or benchmark
  reproduction is asserted.
