  relation: related_match
  rationale: The source-defined algorithm learns action values and a reward-driven policy through interaction
    and replay, with an entropy term influencing exploration. This supports a qualified relation to the
    pinned reinforcement-learning task, not exact identity or an algorithm-to-task subclass assertion.
