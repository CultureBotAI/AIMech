id: AIMech:ZeroSarahAndDZeroSarahVarianceReducedNonconvexOptimizationWithoutFullGradientComputations
name: ZeroSARAH and D-ZeroSARAH Variance-Reduced Nonconvex Optimization without Full Gradient Computations
concept_kind: algorithm
review_status: DRAFT
definition: "A family of single-loop variance-reduced stochastic optimization algorithms for nonconvex finite-sum minimization f(x) = (1/n) sum_{i=1}^n f_i(x) (ZeroSARAH) and partial-participation distributed finite-sum minimization (D-ZeroSARAH) introduced by Li, Hanzely, and Richt\xE1rik (2021). ZeroSARAH maintains a historical gradient table {y_i^{k-1}}_{i=1}^n initialized to zero (requiring zero full gradient computations throughout training), samples a mini-batch I_b^k subseteq [n] of size b_k, updates the gradient estimator via v^k = (1/b_k) sum_{i in I_b^k} (nabla f_i(x^k) - nabla f_i(x^{k-1})) + (1 - lambda_k) v^{k-1} + lambda_k ((1/b_k) sum_{i in I_b^k} (nabla f_i(x^{k-1}) - y_i^{k-1}) + (1/n) sum_{j=1}^n y_j^{k-1}), steps x^{k+1} = x^k - eta_k v^k, and refreshes y_i^k = nabla f_i(x^k) for i in I_b^k while keeping y_i^k = y_i^{k-1} for i not in I_b^k."
identity_notes: 'Distinct from classical SARAH, SPIDER, SpiderBoost, and PAGE (which require an initial full gradient computation nabla f(x^0) and/or periodic full-batch checkpoints of cost O(n) every epoch or with probability p_k), and distinct from SAGA (which achieves O(n^{2/3}/epsilon^2) nonconvex gradient complexity rather than O(sqrt(n)/epsilon^2)): ZeroSARAH combines SARAH''s recursive difference update with a SAGA-style historical table correction weighted by lambda_k = b_k / (2n) so that E_k[v^k - nabla f(x^k)] = (1 - lambda_k)(v^{k-1} - nabla f(x^{k-1})), never computing any full gradient across all iterations.'
aliases:
- ZeroSARAH
- D-ZeroSARAH
- Distributed ZeroSARAH
- Variance-Reduced Nonconvex Optimization with Zero Full Gradient Computation
