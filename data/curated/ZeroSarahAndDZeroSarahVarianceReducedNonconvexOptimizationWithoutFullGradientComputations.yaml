claims:
- claim_id: zerosarah-recursive-table-corrected-estimator-and-bias-decay
  kind: mechanism
  statement: ZeroSARAH initializes x^{-1} = x^0, v^{-1} = 0, and y_1^{-1} = ... = y_n^{-1} = 0 without evaluating nabla f(x^0), and at iteration k >= 0 samples a mini-batch I_b^k of size b_k to form v^k = (1/b_k) sum_{i in I_b^k}(nabla f_i(x^k) - nabla f_i(x^{k-1})) + (1 - lambda_k) v^{k-1} + lambda_k ((1/b_k) sum_{i in I_b^k}(nabla f_i(x^{k-1}) - y_i^{k-1}) + (1/n) sum_{j=1}^n y_j^{k-1}); by Lemma 1, the conditional expectation of the estimation error satisfies E_k[v^k - nabla f(x^k)] = (1 - lambda_k)(v^{k-1} - nabla f(x^{k-1})).
  evidence:
  - source_id: r566-primary-pdf
    locator: Section 4, Algorithm 2, Equation (5), p. 5; Appendix B.1, Lemma 1 & Equation (11), p. 13
    relation: supports
- claim_id: zerosarah-optimal-nonconvex-complexity-with-zero-full-gradients
  kind: mechanism
  statement: Under L-smoothness (Assumption 1), setting b_k = sqrt(n), lambda_0 = 1, lambda_k = b_k / (2n) for k >= 1, and step size eta_k = 1 / ((1 + sqrt(8)) L) yields M_{k+1} = 2 / (lambda_{k+1} b_{k+1}) + 8 lambda_{k+1} n^2 / b_{k+1}^3 = 8 and guarantees E[||nabla f(hat{x}^K)||^2] <= epsilon^2 in O(sqrt(n) (L Delta_0 + G_0) / epsilon^2) stochastic gradient computations with zero full gradient evaluations, recovering best-known O(n + sqrt(n) L Delta_0 / epsilon^2) complexity when initialized with y_i^{-1} = nabla f_i(x^0) (Theorem 1, Corollaries 1-2).
  evidence:
  - source_id: r566-primary-pdf
    locator: Section 4.1, Theorem 1, Corollary 1, Corollary 2 & Remark, pp. 5-6; Appendix B.1, Lemma 2, pp. 13-15
    relation: supports
- claim_id: d-zerosarah-distributed-partial-participation-nonconvex-optimization
  kind: application
  statement: 'D-ZeroSARAH (Algorithm 3) extends ZeroSARAH to distributed optimization f(x) = (1/m) sum_{i=1}^m f_i(x) where each client i in [m] holds s local functions f_{i,j}: in each round k, a subset I_{b_1}^k subseteq [m] of b_1 clients is sampled and each active client samples a local mini-batch I_{i,b_2}^k subseteq [s] of size b_2, achieving E[||nabla f(hat{x}^K)||^2] <= epsilon^2 without ever requiring full client participation or full local dataset gradient evaluation (Theorem 2, Corollaries 3-4).'
  evidence:
  - source_id: r566-primary-pdf
    locator: Section 5, Algorithm 3 (D-ZeroSARAH), Theorem 2 & Corollaries 3-4, pp. 6-8
    relation: supports
- claim_id: zerosarah-historical-gradient-table-memory-limitation
  kind: limitation
  statement: Maintaining the historical gradient table {y_i^{k-1}}_{i=1}^n requires O(n d) memory in general (reduced to O(n) scalar storage for generalized linear models where nabla f_i(x) scales a fixed feature vector a_i), and the zero-full-gradient complexity bound depends on the initial average squared component gradient norm G_0 = (1/n) sum_{i=1}^n ||nabla f_i(x^0)||^2 when y_i^{-1} is initialized to zero.
  evidence:
  - source_id: r566-primary-pdf
    locator: Section 4, footnote/discussion on table storage & Corollary 2, pp. 5-6
    relation: supports
