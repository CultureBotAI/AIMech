name: Vanilla sequence beam decoding
definition: 'A layer-based sequence beam decoder in which completed and unfinished hypotheses compete
  for the same k beam slots: finished hypotheses are carried forward unchanged, unfinished hypotheses
  are extended, and the top-scoring candidates form the next beam.'
concept_kind: algorithm
identity_notes: This is the vanilla sequence-decoding policy contrasted with FCFS by Kasai and colleagues.
  It specializes generic breadth-first beam search by specifying EOS retention and competition for active
  slots. Finished outputs are not accumulated in a separate permanent set, and the procedure is not the
  score-prioritized per-length best-first decoder. No normalized identity match was found across the 442
  AIO and 141 prior native records; ignored-inclusive text hits in the main checkout were prior discovery
  leads and incidental substrings such as builds in records, source text and dependencies, not existing
  concept records.
limitations:
- A completed hypothesis can later fall off the beam because it competes with unfinished candidates. Its
  discovery alone does not reserve an output slot.
- Finite beam pruning is not exact global MAP decoding. Different tie, length-score and maximum-length
  policies can change outputs.
- At the length limit, an implementation must specify what to return if no retained hypothesis is EOS-complete;
  the simplified figures do not provide a universal failure policy.
- Figure 2 in the 2024 paper omits initialization/reset of its temporary H pool. The fresh-per-layer interpretation
  is supported by the layer-based prose and the explicit reset in Meister et al. 2020 Algorithm 1; the
  record does not certify the 2024 figure as executable code.
- The name identifies the source-defined policy, not a claim that all libraries or all uses of beam search
  implement it.
