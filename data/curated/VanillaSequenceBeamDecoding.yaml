claims:
- claim_id: search-procedure
  kind: mechanism
  statement: At each sequence length, construct a fresh candidate pool from carried-forward EOS-complete
    hypotheses and one-token extensions of unfinished beam members. Select up to k highest-scoring candidates
    for the next beam. The 2024 description stops when all retained hypotheses are complete, or at the
    maximum length. The 2020 standard-beam pseudocode explicitly resets the candidate pool at each layer
    and carries finished hypotheses unchanged.
  evidence:
  - source_id: method-source
    locator: Section 2 and Figures 2–3, printed pp. 78–79 / PDF pp. 2–3
    relation: supports
  - source_id: fresh-layer-pool
    locator: Algorithm 1 and footnotes, printed p. 797 / PDF p. 3
    relation: supports
- claim_id: fresh-layer-pool
  kind: mechanism
  statement: The standard sequence-beam algorithm initializes an empty candidate pool for each time step,
    carries EOS-complete hypotheses unchanged, extends unfinished hypotheses and selects the next top-k
    beam. This supplies an explicit layer-pool scope for the later vanilla-policy description.
  evidence:
  - source_id: fresh-layer-pool
    locator: Algorithm 1 and footnotes, printed p. 797 / PDF p. 3
    relation: supports
