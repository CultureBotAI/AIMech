limitations:
- 'Smoothness / Differentiability Requirement on the Estimating Equation: Theorems 2.1, 2.2, 3.1, and
  4.1 require the estimating equation f(theta) = Z_hat_n(theta) to be everywhere differentiable (or the
  loss L(theta; w) to be twice differentiable with non-singular empirical Hessian Q_hat_n(theta_0)); non-smooth
  M-estimators such as median/quantile regression or hinge-loss SVM require smooth convolution/mollifier
  approximation as discussed in Section 8.1.'
- 'Local Contraction Radius and Empirical Hessian Invertibility Condition: The deterministic guarantees
  in Theorems 2.2 and 3.1 hold conditional on the empirical Hessian Q_hat_n(theta_0) (or block Jacobian
  J_n(beta_0)) being invertible and the scaled Newton step delta_n(theta_0) := 1.5 ||[Q_hat_n(theta_0)]^{-1}
  Z_hat_n(theta_0)||_2 satisfying the local Hessian-ratio bound max_{1<=i<=n} C(delta_n(theta_0), W_i)
  <= 4/3 (or sup_s mu_n(s) delta_n(beta_0) <= 1/16 for the Cox partial likelihood in Theorem 4.1).'
- 'Primary-Source Typographical Notes in arXiv:1809.05172v1: Verified five self-correcting typographical
  slips in the primary manuscript: (1) Example 3.3.1 (p. 15, first display) prints ''beta_hat_0 - beta_0''
  instead of ''beta_hat_n - beta_0''; (2) Corollary 6.1 (p. 22, Equation 21) prints a minus sign ''-[J_n(beta_0)]^{-1}(nabla
  F_n(beta_0) + A^T nu_0)'' inside the norm instead of ''+[J_n(beta_0)]^{-1}(nabla F_n(beta_0) + A^T nu_0)''
  (cf. Theorem 2.2 Equation 7 and Appendix E.1 p. 46); (3) Appendix A.1 (p. 35, line above Equation 30)
  prints ''nabla f(theta_bar)(theta - theta_0)'' for ''nabla f(theta_bar)(theta^* - theta_0)'', and Appendix
  B.1 (p. 37) prints ''nabla L'' for ''nabla_2 L'' in Equation (32) and ''nabla f(theta_0)'' for ''nabla
  f(theta)'' inside the supremum in Equation (33); (4) Appendix C.2 (p. 43, display 4) prints upper bound
  ''2 delta_n(beta_0)'' instead of ''delta_n(beta_0)'' (cf. Theorem 4.1 on p. 19), and p. 44 (top display)
  prints ''[J_hat_n(beta_0)]^{-1}'' and ''delta^2(beta_0)'' for ''[Q_hat_n(beta_0)]^{-1}'' and ''delta_n^2(beta_0)'';
  and (5) Appendix F (p. 48, Proof of Corollary 7.2) prints ''W_I'' inside ''sum_{i in I} nabla L(theta_hat_n,
  W_I)'' instead of ''W_i'', and Equation (26) (p. 25) and Equation (47) (p. 48) print ''i != I'' instead
  of ''i notin I''.'
- All 49 pages of the full-text PDF of Kuchibhotla (2018, arXiv:1809.05172v1) were read. Constructed numerical
  checks in research/discovery/deterministic-inequalities-smooth-m-estimators-boundaries.py verify (1)
  Theorems 2.1 and 2.2 Banach contraction root sandwiching and Newton-Kantorovich Holder Bahadur expansion
  on a 2D nonlinear system, (2) Theorem 3.1, Corollary 3.1, and Proposition 3.1 directional Hessian-ratio
  bounds and convex-cone mediant inequality for logistic-ridge M-estimation, (3) Lemma C.1 and Theorem
  4.1 Cox proportional hazards partial likelihood bounds, and (4) Corollaries 6.1 and 7.2 equality-constrained
  KKT block Jacobian inversion and leave-one-out deterministic expansion.
