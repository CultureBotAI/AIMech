- claim_id: generalized-self-concordant-hessian-ratio-modulus-and-convex-cone-property
  kind: mechanism
  statement: Section 3 and Appendix B (pp. 8-17 and 36-39, Theorem 3.1, Corollary 3.1, Proposition 3.1,
    Remarks 3.1-3.3, Examples 3.1-3.3, Equations 8-13 and 32-36) define the directional Hessian-ratio
    function C(u, w) := sup_{||theta_1 - theta_2||_2 <= u} sup_{||e||_2 = 1} (e^T nabla_2 L(theta_1, w)
    e) / (e^T nabla_2 L(theta_2, w) e) >= 1 and prove in Theorem 3.1 that on the event E_n := {max_{1<=i<=n}
    C(delta_n(theta_0), W_i) <= 4/3} with delta_n(theta_0) := 1.5 ||[Q_hat_n(theta_0)]^{-1} Z_hat_n(theta_0)||_2,
    there exists theta_hat_n in R^q solving Z_hat_n(theta_hat_n) = 0 with (1/2) delta_n(theta_0) <= ||theta_hat_n
    - theta_0||_2 <= delta_n(theta_0) (Equation 9) and ||theta_hat_n - theta_0 + [Q_hat_n(theta_0)]^{-1}
    Z_hat_n(theta_0)||_2 <= max_{1<=i<=n} {C(delta_n(theta_0), W_i) - 1} delta_n(theta_0) (Equation 10),
    while Proposition 3.1 proves via the mediant inequality min{a/b, c/d} <= (a + c)/(b + d) <= max{a/b,
    c/d} (Equation 35) that the class C_T of losses satisfying C(u, w) <= T(u, w) forms a convex cone
    closed under nonnegative linear combinations and convex penalties, and Corollary 3.1 / Example 3.3
    specialize to generalized linear models with C(u, y) = 1 (linear), e^u (Poisson), and <= e^{3u} (logistic
    and negative binomial) without artificial lower-curvature assumptions.
