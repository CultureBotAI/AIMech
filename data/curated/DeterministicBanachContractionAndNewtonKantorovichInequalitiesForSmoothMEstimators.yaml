- claim_id: cox-partial-likelihood-nonlinear-least-squares-and-kkt-constrained-extensions
  kind: mechanism
  statement: 'Sections 4-6 and Appendices C-E (pp. 17-23 and 39-46, Theorem 4.1, Corollaries 5.1 and 6.1,
    Lemma C.1, Equations 14-22 and 37-45) extend the deterministic fixed-point and Bahadur inequalities
    beyond sample-average convex losses: for the generalized weighted Cox proportional hazards partial
    log-likelihood L_hat_n(beta) (Equation 14), Lemma C.1 bounds the second-derivative ratio of K(t) =
    log(sum_{i=1}^n w_i e^{a_i t}) by |K''''(t)/K''''(0) - 1| <= 4 mu_n |t| exp(4 mu_n |t|) where mu_n
    := max_{1<=i<=n} |a_i|, yielding Theorem 4.1 that whenever sup_{0<=s<infty} mu_n(s) delta_n(beta_0)
    <= 1/16, beta_hat_n exists with (1/2) delta_n(beta_0) <= ||beta_hat_n - beta_0||_2 <= delta_n(beta_0)
    and ||beta_hat_n - beta_0 + [Q_hat_n(beta_0)]^{-1} Z_hat_n(beta_0)||_2 <= 8 e^{1/4} delta_n^2(beta_0)
    sup_{0<=s<infty} mu_n(s) (Equation 15); Corollary 5.1 establishes deterministic root existence and
    expansion with polynomial-Holder modulus omega(r) = L_2(theta_0) r^2 + L_{1+alpha}(theta_0) r^{1+alpha}
    + L_1(theta_0) r + L_alpha(theta_0) r^alpha for non-convex nonlinear least squares F_n(theta) = n^{-1}
    sum_{i=1}^n (Y_i - g(theta^T X_i))^2 (Equation 16); and Corollary 6.1 establishes deterministic existence
    and expansion for equality-constrained optimization min_beta F_n(beta) subject to A beta = b via the
    KKT block Jacobian J_n(beta_0) = [nabla_2 F_n(beta_0)](I - [nabla_2 F_n(beta_0)]^{-1} A^T (A [nabla_2
    F_n(beta_0)]^{-1} A^T)^{-1} A)^{-1} (Equations 17 and 20-21).'
