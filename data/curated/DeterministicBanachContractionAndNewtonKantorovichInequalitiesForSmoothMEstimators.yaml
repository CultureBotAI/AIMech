claims:
- claim_id: banach-contraction-inversion-and-newton-kantorovich-holder-bahadur-expansion
  kind: mechanism
  statement: Section 2 and Appendix A (pp. 5-8 and 35-36, Theorems 2.1 and 2.2, Remark 2.1, Equations
    3-7 and 30-31) prove via the Banach contraction mapping theorem applied to phi(theta) := theta - A^{-1}
    f(theta) on B(theta_0, r) that whenever sup_{theta in B(theta_0, r)} ||A^{-1}(A - nabla f(theta))||_{op}
    <= varepsilon < 1 (Equation 3) and ||A^{-1} f(theta_0)||_2 <= r(1 - varepsilon) (Equation 4), there
    exists a unique root theta^* in B(theta_0, r) of f(theta^*) = 0 satisfying the two-sided sandwiching
    (1 + varepsilon)^{-1} ||A^{-1} f(theta_0)||_2 <= ||theta^* - theta_0||_2 <= (1 - varepsilon)^{-1}
    ||A^{-1} f(theta_0)||_2 (Theorem 2.1); under local Holder Jacobian continuity ||[nabla f(theta_0)]^{-1}(nabla
    f(theta_0) - nabla f(theta))||_{op} <= L ||theta - theta_0||_2^alpha for (3L)^{1/alpha} ||theta -
    theta_0||_2 <= 1 (Equation 5) and ||[nabla f(theta_0)]^{-1} f(theta_0)||_2 <= 2 / (3 (3L)^{1/alpha})
    (Equation 6), Theorem 2.2 proves unique root existence in B(theta_0, 1.5 ||[nabla f(theta_0)]^{-1}
    f(theta_0)||_2) and the first-step Newton / Bahadur expansion ||theta^* - theta_0 + [nabla f(theta_0)]^{-1}
    f(theta_0)||_2 <= (1.5)^{1+alpha} L ||[nabla f(theta_0)]^{-1} f(theta_0)||_2^{1+alpha} (Equation 7),
    without requiring E[f(theta_0)] = 0 or convexity.
