id: AIMech:DeterministicBanachContractionAndNewtonKantorovichInequalitiesForSmoothMEstimators
name: Deterministic Banach contraction and Newton-Kantorovich inequalities for smooth M-estimators
aliases:
- Banach Contraction Inversion and Semilocal Newton-Kantorovich Bahadur Expansions for M-Estimators
- Generalized Self-Concordant Hessian-Ratio C(u, w) Deterministic M-Estimation Inequalities
- Deterministic Leave-k-Out Cross-Validation and Cox Partial Likelihood Bahadur Bounds
concept_kind: mathematical_method
definition: Deterministic Banach contraction and Newton-Kantorovich inequalities for smooth M-estimators
  are a finite-sample, assumption-free analytical framework introduced by Kuchibhotla (2018, arXiv:1809.05172v1)
  that decouples the existence, localization, and first-order Bahadur influence-function expansion of
  zeros of smooth estimating equations f(theta) = 0 from any probabilistic or i.i.d. data-generating assumptions.
  Using the Banach fixed-point theorem applied to phi(theta) := theta - A^{-1} f(theta) on B(theta_0,
  r), Theorem 2.1 proves that whenever sup_{theta in B(theta_0, r)} ||A^{-1}(A - nabla f(theta))||_{op}
  <= varepsilon < 1 and ||A^{-1} f(theta_0)||_2 <= r(1 - varepsilon) for an arbitrary reference point
  theta_0 (not necessarily satisfying E[f(theta_0)] = 0), there exists a unique root theta^* in B(theta_0,
  r) satisfying the two-sided norm sandwiching (1 + varepsilon)^{-1} ||A^{-1} f(theta_0)||_2 <= ||theta^*
  - theta_0||_2 <= (1 - varepsilon)^{-1} ||A^{-1} f(theta_0)||_2; under local Holder Jacobian continuity
  ||[nabla f(theta_0)]^{-1}(nabla f(theta_0) - nabla f(theta))||_{op} <= L ||theta - theta_0||_2^alpha,
  Theorem 2.2 establishes the semilocal Newton-Kantorovich Bahadur expansion ||theta^* - theta_0 + [nabla
  f(theta_0)]^{-1} f(theta_0)||_2 <= (1.5)^{1+alpha} L ||[nabla f(theta_0)]^{-1} f(theta_0)||_2^{1+alpha}.
  For smooth convex losses L(theta; w), Section 3 introduces the scale-invariant directional Hessian-ratio
  modulus C(u, w) := sup_{||theta_1 - theta_2||_2 <= u} sup_{||e||_2 = 1} (e^T nabla_2 L(theta_1, w) e)
  / (e^T nabla_2 L(theta_2, w) e) >= 1 (forming a convex cone C_T under nonnegative combinations, Proposition
  3.1) and proves in Theorem 3.1 that whenever max_{1<=i<=n} C(delta_n(theta_0), W_i) <= 4/3 with delta_n(theta_0)
  := 1.5 ||[Q_hat_n(theta_0)]^{-1} Z_hat_n(theta_0)||_2, a root theta_hat_n exists with (1/2) delta_n(theta_0)
  <= ||theta_hat_n - theta_0||_2 <= delta_n(theta_0) and ||theta_hat_n - theta_0 + [Q_hat_n(theta_0)]^{-1}
  Z_hat_n(theta_0)||_2 <= max_{1<=i<=n} {C(delta_n(theta_0), W_i) - 1} delta_n(theta_0), extending directly
  to generalized linear models (Corollary 3.1), Cox proportional hazards partial likelihood (Theorem 4.1),
  non-convex least squares (Corollary 5.1), equality-constrained KKT systems (Corollary 6.1), and sample-computable
  leave-k-out cross-validation, marginal screening, and uniform-in-submodel post-selection inference (Corollaries
  7.1-7.4).
identity_notes: Evaluated against all 442 pinned AIO records and 614 maintained curated concepts in AIMech.
  Distinct from AIMech:UniformInSubmodelDeterministicLinearRegressionAndFunctionalDependenceBounds (Kuchibhotla
  et al. 2021, arXiv:1802.05801v3) and AIMech:UnifiedAssumptionLeanMovingTargetLinearRegressionAndScoreBootstrap
  (Kuchibhotla, Brown, & Buja 2018, arXiv:1809.10538v1), which analyze closed-form linear least-squares
  estimators beta_M(Sigma, Gamma) = [Sigma(M)]^{-1} Gamma(M) whose normal equations are already linear
  in beta (where C(u, y) = 1 identically), whereas the present concept establishes general Banach contraction
  fixed-point inversion (Theorem 2.1), semilocal Newton-Kantorovich Holder expansions (Theorem 2.2), generalized
  self-concordant directional Hessian-ratio bounds C(u, w) <= 4/3 (Theorem 3.1, Proposition 3.1), Cox
  proportional hazards non-sample-average partial likelihood inequalities (Theorem 4.1, Lemma C.1), non-convex
  nonlinear least squares (Corollary 5.1), equality-constrained KKT saddle systems (Corollary 6.1), and
  sample-computable leave-|I|-out cross-validation expansions around theta_0 = theta_hat_n (Corollaries
  7.1-7.2). Distinct from AIMech:LocalRademacherComplexityAndBousquetInequality, AIMech:TalagrandConvexDistanceAndSupremaConcentrationInequalities,
  and AIMech:GeneralizedBernsteinOrliczSubWeibullConcentrationAndHighDimensionalLasso, which provide probabilistic
  concentration inequalities rather than deterministic root-existence and Bahadur expansion theorems.
