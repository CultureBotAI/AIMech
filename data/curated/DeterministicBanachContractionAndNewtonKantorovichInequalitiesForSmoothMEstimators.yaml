- claim_id: leave-k-out-cross-validation-marginal-screening-and-uniform-submodel-expansions
  kind: scope
  statement: 'Section 7 and Appendix F (pp. 23-30 and 47-49, Corollaries 7.1-7.4, Remarks 7.1-7.4, Equations
    23-29 and 46-49) exploit the freedom to choose a data-dependent reference point theta_0 = theta_hat_n
    in Theorem 3.1 to prove purely sample-computable deterministic bounds for leave-|I|-out estimators
    theta_hat_{-I} = argmin_theta sum_{i notin I} L(theta, W_i): under max_{i notin I} C(1.5 delta_{I,n},
    W_i) <= 4/3 where delta_{I,n} := ||[(n - |I|) Q_hat_{-I}(theta_hat_n)]^{-1} sum_{i in I} nabla L(theta_hat_n,
    W_i)||_2, Corollary 7.2 proves (3/4) delta_{I,n} <= ||theta_hat_{-I} - theta_hat_n||_2 <= (3/2) delta_{I,n}
    and ||theta_hat_{-I} - theta_hat_n - n^{-1} Q_hat_n^{-1} sum_{i in I} nabla L(theta_hat_n, W_i)||_2
    <= (3/2) delta_{I,n} [max_{i notin I} C(1.5 delta_{I,n}, W_i) - 1 + n^{-1} ||Q_hat_n^{-1} sum_{i in
    I} nabla_2 L(theta_hat_n, W_i)||_{op}] (Equations 25-26), yielding O_p(|I|^2 n^{-2}) expansion error
    when C(., w) is differentiable at 0; Corollaries 7.3 and 7.4 derive uniform deterministic linear representations
    for marginal screening estimators {beta_hat_{n,j}}_{1<=j<=p} (Equation 28) and submodel M-estimators
    {beta_hat_{n,M}}_{M in M} for post-selection inference (Equation 29).'
