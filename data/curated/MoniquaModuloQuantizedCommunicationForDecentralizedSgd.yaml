claims:
- claim_id: moniqua-modular-residue-quantization-and-bias-cancellation-mechanism
  kind: mechanism
  statement: Given ||x_{k,i} - x_{k,j}||_infty < theta_k and a quantizer Q_delta on [-1/2, 1/2)^d with L_infty error at most delta < 1/2, Moniqua sets B_{theta_k} = 2*theta_k / (1 - 2*delta), broadcasts q_{k,i} = Q_delta((x_{k,i} / B_{theta_k}) mod 1), reconstructs x_hat_{k,j} = (q_{k,j} * B_{theta_k} - x_{k,i}) mod B_{theta_k} + x_{k,i} with error ||x_hat_{k,j} - x_{k,j}||_infty <= delta * B_{theta_k} = theta_k * 2*delta / (1 - 2*delta), and subtracts the local self-quantization term x_hat_{k,i} = q_{k,i} * B_{theta_k} - (x_{k,i} mod B_{theta_k}) + x_{k,i} so that global model averages remain unbiased.
  evidence:
  - source_id: r555-primary-pdf
    locator: Section 4 Algorithm 1, Equation (5), Lemma 2, & Appendix B, pp. 4-5, 15-16
    relation: supports
- claim_id: moniqua-zero-extra-memory-asymptotic-rate-and-1bit-scope
  kind: scope
  statement: Requires zero additional memory beyond baseline D-PSGD, supports biased and 1-bit quantizers (via slack mixing matrix W_bar = gamma * W + (1 - gamma) * I in Theorem 3) as well as non-constant step sizes and extensions to D^2 (Theorem 4) and asynchronous AD-PSGD (Theorem 5), achieving the same O(sigma / sqrt(n*K)) asymptotic non-convex convergence rate as full-precision D-PSGD with O(log log n) bits per coordinate.
  evidence:
  - source_id: r555-primary-pdf
    locator: Table 1, Section 4 Theorems 2-3 & Corollary 1, Section 5 Theorems 4-5, pp. 3, 6-8
    relation: supports
- claim_id: moniqua-apriori-discrepancy-bound-wraparound-limitation
  kind: limitation
  statement: Correct modular recovery requires the actual inter-worker coordinate difference |x_{k,i} - x_{k,j}| to remain strictly below the a priori bound theta_k; if theta_k is underestimated, modular wrap-around introduces O(B_{theta_k}) reconstruction errors unless detected by hash verification.
  evidence:
  - source_id: r555-primary-pdf
    locator: Section 4 Lemma 2 & Section 6 Choosing theta empirically, pp. 5, 11
    relation: supports
- claim_id: moniqua-low-bandwidth-cifar-resnet-vgg-application
  kind: application
  statement: Applied to 1-bit, 2-bit, and 8-bit quantized decentralized training of ResNet-20, ResNet-110, and VGG-16 on CIFAR-10 across bandwidth- and latency-constrained networks, including heterogeneous D^2 and asynchronous AD-PSGD.
  evidence:
  - source_id: r555-primary-pdf
    locator: Section 6 Experiments, Figures 1-2 & Table 2, pp. 8-10
    relation: supports
