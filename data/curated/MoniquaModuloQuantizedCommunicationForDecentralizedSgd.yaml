id: AIMech:MoniquaModuloQuantizedCommunicationForDecentralizedSgd
name: Moniqua Modulo Quantized Communication for Decentralized SGD
concept_kind: algorithm
review_status: DRAFT
definition: A zero-additional-memory communication-quantization algorithm for decentralized stochastic optimization (Moniqua) that exploits an a priori inter-worker consensus bound ||x_{k,i} - x_{k,j}||_infty < theta_k and modular arithmetic z mod a in [-a/2, a/2) by transmitting only the quantized scaled modulo residue q_{k,i} = Q_delta((x_{k,i} / B_{theta_k}) mod 1) with B_{theta_k} = 2*theta_k / (1 - 2*delta) and reconstructing neighbor models via x_hat_{k,j} = (q_{k,j} * B_{theta_k} - x_{k,i}) mod B_{theta_k} + x_{k,i} with local bias cancellation x_{k+1/2,i} = x_{k,i} + sum_{j in N_i} (x_hat_{k,j} - x_hat_{k,i}) W_{ji}.
identity_notes: Introduced by Yucheng Lu and Christopher De Sa (ICML 2020, PMLR Vol. 119, pp. 6415-6425; arXiv:2002.11787). Distinct from Choco-SGD (Koloskova et al., ICML 2019) and DCD/ECD-PSGD (Tang et al., NeurIPS 2018), which maintain neighbor model replicas incurring Theta(m * d) additional memory overhead; and distinct from DeepSqueeze / DoubleSqueeze (Tang et al., 2019), which maintain error-compensation buffers incurring Theta(n * d) memory overhead rather than memoryless modular-arithmetic residue quantization.
aliases:
- Moniqua
- Modulo Quantized Communication in Decentralized SGD
- Moniqua Decentralized Quantized SGD
