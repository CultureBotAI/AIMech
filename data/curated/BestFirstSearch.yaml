name: Best-first search
definition: A search strategy that repeatedly expands the open node with the best value under a specified
  evaluation rule, adding eligible successors to the open frontier.
concept_kind: algorithm
identity_notes: This record describes the canonical global minimum-f form, with lower values defined as
  better. A-star, heuristic-only greedy best-first search and weighted A-star choose different evaluation
  rules. Broader literature also calls restricted-candidate-set policies best-first; their extra selection
  rules are not part of this core procedure. BFS is not an alias here because it identifies breadth-first
  search in AIMech. No normalized identity match was found across the 442 AIO and 124 prior native records;
  ignored-inclusive text hits in the main checkout were prior discovery leads, source citations and search-order
  contrasts, plus incidental dependency substrings, not existing concept records.
limitations:
- A minimum evaluation value alone does not guarantee minimum solution cost; the meaning and assumptions
  of the evaluation rule matter.
- Maintaining the full frontier and explored-state information can require substantial memory. Recursive
  or bounded-memory variants change what is retained.
- Tie-breaking, duplicate updates and termination conditions are additional algorithm choices; the generic
  strategy does not settle them or guarantee completion on an infinite space.
id: AIMech:BestFirstSearch
