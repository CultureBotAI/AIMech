claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Maintain an open frontier of generated nodes eligible for expansion. Select a node with minimum
    evaluation value, test the selected node for a goal, and otherwise expand it and update the frontier
    under the chosen duplicate policy. The evaluation rule and duplicate handling determine the specific
    search algorithm.
  evidence:
  - source_id: method-source
    locator: 'Introduction, printed p. 533 / PDF p. 1: open/closed lists, minimum-f expansion and special
      cases'
    relation: supports
- claim_id: family-boundary
  kind: scope
  statement: Global frontier selection differs from choosing only a current node’s neighbor or discarding
    nodes to enforce a beam width. Some named best-first variants additionally restrict selection to a
    privileged subset of the frontier.
  evidence:
  - source_id: comparison-paper
    locator: Introduction and Best-First Search, PDF pp. 1–2
    relation: supports
