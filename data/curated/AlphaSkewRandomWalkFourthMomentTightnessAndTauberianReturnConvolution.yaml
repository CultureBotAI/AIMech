id: AIMech:AlphaSkewRandomWalkFourthMomentTightnessAndTauberianReturnConvolution
name: Alpha-Skew Random Walk Fourth-Moment Tightness and Tauberian Return Convolution
concept_kind: mathematical_method
review_status: DRAFT
definition: A stochastic-process convergence and fourth-order moment tightness formulation for the linearly interpolated rescaled alpha-skew random walk X_n^{(alpha)}(t) = n^{-1/2}(S_{[nt]}^{(alpha)} + (nt - [nt])(S_{[nt]+1}^{(alpha)} - S_{[nt]}^{(alpha)})) on Z (where S^{(alpha)} steps from 0 to +1 with probability alpha and to -1 with probability 1-alpha, and steps +/-1 with probability 1/2 away from 0) that bounds third- and fourth-order dependent cross-increment expectations via the origin-return sequence g(2i) = comb(2i, i) 2^{-2i} with generating function g_tilde(t) = (1 - t^2)^{-1/2} and its 2-fold and 4-fold convolutions (g*g)(j) and (g*g*g*g)(j), establishing uniform tightness E|X_n^{(alpha)}(t) - X_n^{(alpha)}(s)|^4 <= C_alpha |s - t|^2 in C(R_+, R).
identity_notes: No AIO class represents the alpha-skew random walk or its fourth-moment tightness construction for skew Brownian motion; MarkovChain (AIO:MarkovChain) is the closest broad match covering discrete-time birth-death Markov chains and random-walk scaling limits.
