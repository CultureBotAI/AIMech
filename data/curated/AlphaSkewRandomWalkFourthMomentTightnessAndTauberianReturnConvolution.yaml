claims:
- claim_id: reflected-transition-law-and-origin-supported-conditional-increment-drift
  kind: mechanism
  statement: For any alpha in (0, 1), |S^{(alpha)}| has the exact distribution of a simple symmetric random walk |S| reflected at 0, -S^{(alpha)} has the distribution of S^{(1-alpha)}, P(S_k^{(alpha)} = m) = alpha P(|S_k| = m) for m > 0, (1 - alpha) P(|S_k| = -m) for m < 0, and P(S_k^{(alpha)} = 0) = g(k) = comb(2i, i) 2^{-2i} for k = 2i (Propositions 2.1-2.2), which induces the state-dependent conditional drift E(S_{j+1}^{(alpha)} - S_j^{(alpha)} | S_j^{(alpha)}) = (2*alpha - 1) 1_{S_j^{(alpha)} = 0} and unit conditional second moment E[(S_{i+1}^{(alpha)} - S_i^{(alpha)})^2 | S_i^{(alpha)}] = 1 (Proposition 2.3).
  evidence:
  - source_id: r838-primary-pdf
    locator: Section 1-2, Propositions 2.1, 2.2, and 2.3, pp. 1-2
    relation: supports
- claim_id: tauberian-return-convolutions-and-fourth-moment-kolmogorov-chentsov-tightness
  kind: mechanism
  statement: Because the origin-return generating function satisfies g_tilde(t) = sum_{k=0}^infty g(k) t^k = (1 - t^2)^{-1/2}, the two-fold convolution mu = g * g has generating function (1 - t^2)^{-1} with sum_{j=0}^m mu(j) ~ m and the four-fold convolution nu = g * g * g * g has generating function (1 - t^2)^{-2} with sum_{j=0}^m nu(j) ~ m^2 by Karamata's Tauberian theorem (Propositions 2.4-2.5), bounding the triple and quadruple cross-increment sums in Lemma 2.6 by C |k - j|^2 and proving E|X_n^{(alpha)}(t) - X_n^{(alpha)}(s)|^4 <= C_alpha |s - t|^2 for all s, t > 0 and n in N (Theorem 1.1 and Corollary 1.2).
  evidence:
  - source_id: r838-primary-pdf
    locator: Section 1, Theorem 1.1 and Corollary 1.2, p. 2; Section 2, Propositions 2.4-2.5, Lemma 2.6, and Proof of Theorem 1.1, pp. 3-5
    relation: supports
- claim_id: skew-brownian-motion-scaling-limit-and-heterogeneous-porous-media-tracking-application
  kind: application
  statement: Uniform tightness in C(R_+, R) establishes alpha-skew Brownian motion as the functional central limit scaling limit of the alpha-skew random walk on the integer lattice, providing the convergence foundation for Lagrangian random-walk particle tracking across discontinuous permeability interfaces in heterogeneous porous media and biological membranes.
  evidence:
  - source_id: r838-primary-pdf
    locator: Abstract, p. 1; Section 1, p. 1
    relation: supports
- claim_id: non-independent-increments-and-second-moment-tightness-insufficiency-limitation
  kind: limitation
  statement: Whenever alpha != 1/2, the increments S_{k+1}^{(alpha)} - S_k^{(alpha)} of the alpha-skew random walk are statistically dependent through origin visits, and second-order moment bounds E|X_n^{(alpha)}(t) - X_n^{(alpha)}(s)|^2 <= C |t - s| (exponent 1 on |t - s|) are insufficient to establish tightness in C(R_+, R) via the Kolmogorov-Chentsov criterion even in the symmetric case alpha = 1/2, necessitating fourth-order moment control (Section 1, p. 1; Lemma 2.6, p. 4).
  evidence:
  - source_id: r838-primary-pdf
    locator: Section 1, p. 1; Section 2, Lemma 2.6, p. 4
    relation: supports
