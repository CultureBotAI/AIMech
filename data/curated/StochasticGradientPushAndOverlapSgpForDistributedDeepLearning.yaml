claims:
- claim_id: r430-pushsum-debiased-nonconvex-linear-speedup-and-delay-augmentation
  kind: mechanism
  statement: Because P^{(k)} is column-stochastic (1^T P^{(k)} = 1^T), SGP preserves the exact global sum invariants sum_{i=1}^n w_i^{(k)} = n and bar_x^{(k+1)} = bar_x^{(k)} - (gamma / n) sum_{i=1}^n nabla F_i(z_i^{(k)}; xi_i^{(k)}), while the PushSum ratio z_i^{(k)} = x_i^{(k)} / w_i^{(k)} contracts to the node-wide mean bar_x^{(k)} at geometric rate q = C (1 - c)^{1/(B+1)} < 1 (Lemma 3); for tau-OSGP, augmenting the graph with n tau virtual delay nodes yields an n(tau + 1) x n(tau + 1) column-stochastic matrix hat_P^{(k)} (Appendix E), proving that both SGP and tau-OSGP achieve O(1 / sqrt(n K)) smooth non-convex convergence and O(n / K) consensus error (Theorems 1-2).
  evidence:
  - source_id: r430-primary-pdf
    locator: Section 3 Theoretical Guarantees (Theorems 1-2, Corollary 1) & Appendices B-E (Lemma 3, Virtual Delay Node Augmentation)
    relation: supports
- claim_id: r430-directed-time-varying-exponential-graph-exact-log2n-consensus
  kind: mechanism
  statement: On the time-varying 1-peer directed exponential graph where node i sends only to out-neighbor (i + 2^{k mod log_2(n)}) mod n with weight 1/2 and retains self-weight 1/2, each node communicates with only a single peer per iteration while the product P^{(log_2(n)-1)} ... P^{(0)} equals the exact uniform averaging matrix (1/n) 1 1^T in log_2(n) steps whenever n is a power of 2 (Appendix A, Proposition 1).
  evidence:
  - source_id: r430-primary-pdf
    locator: Section 2 & Appendix A Directed Exponential Graph (Proposition 1)
    relation: supports
- claim_id: r430-packet-loss-sensitivity-and-heterogeneity-drift-limitation
  kind: limitation
  statement: Requires reliable delivery of directed messages so that column-stochastic conservation 1^T P^{(k)} = 1^T is maintained, and because SGP does not track gradient differences, its non-convex bound includes an O(n / K) transient term that depends on inter-worker gradient dissimilarity sigma_2^2.
  evidence:
  - source_id: r430-primary-pdf
    locator: Section 3 Assumptions 1-4 & Theorem 1
    relation: supports
- claim_id: r430-imagenet-resnet50-32-node-256-gpu-training-application
  kind: application
  statement: Applied to distributed training of ResNet-50 on ImageNet across 32 nodes (256 GPUs) over 1-peer time-varying directed exponential graphs, matching AllReduce validation accuracy (76.2%) while completing training 1.6x faster on 10 Gbps Ethernet.
  evidence:
  - source_id: r430-primary-pdf
    locator: Section 4 Experiments (Figures 1-5, Table 1), pp. 348-351
    relation: supports
