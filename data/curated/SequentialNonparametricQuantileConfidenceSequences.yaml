id: AIMech:SequentialNonparametricQuantileConfidenceSequences
name: Sequential nonparametric quantile confidence sequences
aliases:
- Anytime-Valid Nonparametric Quantile Confidence Sequences
- Time-Uniform Empirical Distribution Function and Quantile Bands
- Double-Stitched Log-Odds Quantile-Uniform Confidence Sequences
- Quantile Lower-Upper Confidence Bound (QLUCB) Best-Arm Identification
- Two-Sample Sequential Nonparametric Quantile Test
concept_kind: mathematical_method
definition: 'A distribution-free, nonasymptotic sequential estimation and hypothesis testing framework
  (Howard & Ramdas 2022) for arbitrary fixed quantiles [Q(p), Q^+(p)] and simultaneously across all quantiles
  p in (0, 1) (and equivalently the empirical distribution function F_hat_t(x) uniformly over x in R and
  time t in N) of independent and identically distributed observations X_1, X_2, ... from any distribution
  F without moment, continuity, or density assumptions, constructing order-statistic confidence sequences
  [Q_hat_t^-(p - u_t(p)), Q_hat_t(p + u_t(p))] with P(forall t in N, forall p in I : Q_hat_t^-(p - u_t(p))
  <= Q(p) <= Q^+(p) <= Q_hat_t(p + u_t(p))) >= 1 - alpha via exact Galois inversion of upper and lower
  empirical CDFs (F_hat_t, F_hat_t^-) and empirical quantiles (Q_hat_t, Q_hat_t^-) coupled with sub-Bernoulli/sub-gamma
  polynomial stitching (Theorem 1a), beta-binomial conjugate mixtures (Theorem 1b), time-uniform empirical-process
  finite-LIL/DKW chaining (Theorems 2 and 4), and double-stitched log-odds quantile grids (Theorem 5),
  with direct extensions to two-sample sequential quantile tests (Theorem 6) and quantile best-arm identification
  via QLUCB (Theorem 3).'
identity_notes: No normalized identity match for Sequential nonparametric quantile confidence sequences
  across all 442 pinned AIO records and 576 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 180 and Round
  181 discovery artifacts where Howard & Ramdas (2022, arXiv:1906.09712) was cited and queued as a pending
  frontier lead. Distinct from AIMech:SubPsiUniformBoundaryConfidenceSequences (Howard, Ramdas, McAuliffe,
  & Sekhon 2021), which bounds scalar or matrix martingale sums S_t over intrinsic variance time V_t,
  whereas SequentialNonparametricQuantileConfidenceSequences maps probability-scale boundaries into state-space
  order statistics via exact Galois inversions for upper/lower quantiles [Q(p), Q^+(p)] with point-mass
  randomization martingales S_t(p), constructs time- and quantile-uniform empirical process finite-LIL
  bands via stratified dyadic chaining (Theorems 2 and 4) and double-stitched log-odds grids (Theorem
  5, Lemma 10), and introduces the two-sample sequential quantile product supermartingale test (Theorem
  6) and QLUCB quantile bandit algorithm (Theorem 3).
