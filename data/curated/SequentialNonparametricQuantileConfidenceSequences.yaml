- claim_id: time-and-quantile-uniform-empirical-process-lil-and-double-stitching
  kind: mechanism
  statement: Simultaneously across all t >= m and all p in (0, 1) (and all x in R), Theorem 2's and Theorem
    4's stratified dyadic chaining over quantile partitions combines sub-Bernoulli exponential supermartingales
    with adaptive switchover from Bennett's to Hoeffding's CGF bound to establish the finite-sample iterated-logarithm
    empirical process bound sup_{x in R} |F_hat_t(x) - F(x)| <= A sqrt(t^{-1}(log log(e t / m) + C)) with
    valid crossing probability for any A > 1/sqrt(2) without a naive O(sqrt(t^{-1} log t)) time-axis union
    bound over fixed-sample Dvoretzky-Kiefer-Wolfowitz inequalities (Corollary 2 giving 0.85 sqrt(t^{-1}(log
    log(e t / 32) + 8.123)) at alpha = 0.05), while Theorem 5's double-stitched sequence u_t(p) stitches
    across both time epochs and a log-odds-spaced quantile grid (controlled by Lemma 10's hyperbolic-tangent
    spacing bound q_p - p <= tanh(a/2) sqrt(p(1 - p)) <= (a/2) sqrt(p(1 - p))) to preserve extreme-tail
    scaling O(sqrt(p(1 - p) t^{-1} (log log t + log |log(p(1 - p))|))) as p -> 0 or 1.
  evidence:
  - source_id: howard-ramdas2022-quantile-cs
    locator: Section 3.2, lines 268–385, Theorem 2, Corollaries 1–2, Equations 13–20; Section 4.2, lines
      435–485, Figures 2–3; Section 7.4–7.5, lines 746–863, Theorems 4–5, Equations 47–59; Appendix C.2–C.3,
      lines 886–1014, Lemmas 4–10
    relation: supports
- claim_id: two-sample-sequential-quantile-testing-and-qlucb-best-arm-identification
  kind: application
  statement: 'For sequential A/B testing of H_0 : Q_2(p) - Q_1(p) = delta between two independent streams,
    Theorem 6 and Section C.5 avoid conservative union bounds over separate arm confidence sequences when
    delta = 0 (or under simultaneous equality of all quantiles) by bounding the joint product supermartingale
    log L_{1,t} + log L_{2,t} from below via min_{x in R} (G_{1,t}(x) + G_{2,t}(x)) evaluated over observed
    order statistics (giving a sequential median difference confidence sequence under a location-shift
    model in Corollary 3), and for multi-armed quantile bandits (Section 6), replacing the loose DKW-style
    union bound of Szorenyi et al.''s (2015) QPAC algorithm with fixed-quantile stitched bounds f_t(pi
    - epsilon) and f_t(1 - pi - epsilon) inside the LUCB sampling rule yields the QLUCB algorithm (Theorem
    3), guaranteeing (epsilon, pi, delta)-correct best-arm identification with substantially smaller stopping
    times.'
  evidence:
  - source_id: howard-ramdas2022-quantile-cs
    locator: Section 5, lines 486–549, Corollary 3, Figure 4; Section 6, lines 550–619, Theorem 3, Equations
      26–34, Figure 5; Appendix B, lines 864–864; Appendix C.4–C.5, lines 1015–1044, Theorem 6
    relation: supports
