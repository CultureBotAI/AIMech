limitations:
- Unlike sub-psi mean confidence sequences (Howard et al. 2021) which hold under arbitrary martingale
  dependence with time-varying conditional expectations, the quantile confidence sequences of Theorems
  1–2 and 4–5 require observations X_1, X_2, ... to be independent (or conditionally sharing the same
  marginal quantile Q(p)) so that the indicator/interpolated quantile increments have predictable Bernoulli
  probability p (Section 2, Section 7.1).
- When the underlying distribution F has a flat plateau at level p (so the lower quantile Q(p) < Q^+(p)
  differs strictly from the upper quantile), any valid nonparametric confidence sequence must cover the
  entire interval [Q(p), Q^+(p)] simultaneously, preventing the state-space interval width from shrinking
  below Q^+(p) - Q(p) (Section 2, Equations 1–5).
- 'In two-sample sequential quantile testing (Section 5, Appendix C.5), the tighter single-parameter product
  supermartingale test (Theorem 6) applies directly to H_0 : Q_2(p) = Q_1(p) (delta = 0) or to testing
  simultaneous equality of all quantiles under a location-shift assumption (Corollary 3); testing H_0
  : Q_2(p) - Q_1(p) = delta != 0 for a single quantile without a shift assumption requires combining two
  separate arm confidence sequences at level alpha_1 + alpha_2 = alpha.'
- All 1,139 lines of Howard & Ramdas (2022, arXiv:1906.09712) were read. Constructed numerical checks
  in research/discovery/sequential-nonparametric-quantile-confidence-sequences-boundaries.py verify Equation
  35's exact Galois order-statistic inversions on samples with ties and point-mass quantile martingale
  sub-Bernoulli CGF dominance, Theorem 1a/1b tail-quantile tightness and anytime coverage on heavy-tailed
  Cauchy(0, 1) streams vs. naive asymptotic CLT failure, Theorem 2/4 and Corollary 2 empirical-process
  finite-LIL bounds plus Lemma 10 log-odds spacing, and Theorem 6's two-sample product supermartingale
  bound and Theorem 3's QLUCB sample reduction.
