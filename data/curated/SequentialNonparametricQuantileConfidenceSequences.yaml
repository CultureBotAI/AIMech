claims:
- claim_id: galois-order-statistic-inversion-and-point-mass-quantile-martingale
  kind: mechanism
  statement: For any real sample X_1, ..., X_t with order statistics X_{(1)} <= ... <= X_{(t)}, the empirical
    CDFs F_hat_t(x) = t^{-1} sum_{i=1}^t 1(X_i <= x) and F_hat_t^-(x) = t^{-1} sum_{i=1}^t 1(X_i < x)
    and empirical quantile functions Q_hat_t(p) = X_{(lfloor t p rfloor + 1)} and Q_hat_t^-(p) = X_{(lceil
    t p rceil)} satisfy the exact Galois equivalences F_hat_t^-(x) <= p iff x <= Q_hat_t(p) and F_hat_t(x)
    >= p iff Q_hat_t^-(p) <= x for all x in R and p in (0, 1) even in the presence of arbitrary ties or
    point masses (Section 7.1, Equation 35), and when P(X = Q(p)) > 0, the linearly interpolated process
    S_t(p) = t[(1 - gamma_p) F_hat_t^-(Q(p)) + gamma_p F_hat_t(Q(p)) - p] with gamma_p = (p - F^-(Q(p)))
    / (F(Q(p)) - F^-(Q(p))) is an exact zero-mean random walk with increments in [-p, 1 - p] whose CGF
    is bounded by the 1-sub-Bernoulli function psi_B(lambda) <= psi_{G,c_p}(lambda) with scale c_p = (1
    - 2p)/3 and variance process V_t = p(1 - p)t while bounding t(F_hat_t^-(Q^+(p)) - p) <= S_t(p) <=
    t(F_hat_t(Q(p)) - p) almost surely.
  evidence:
  - source_id: howard-ramdas2022-quantile-cs
    locator: Section 2, lines 125–160, Equations 1–5; Section 7.1, lines 621–676, Equations 35–40; Appendix
      C.1, lines 865–885 (Proof of Theorem 1)
    relation: supports
- claim_id: fixed-quantile-stitched-and-beta-binomial-mixture-confidence-sequences
  kind: mechanism
  statement: 'For any fixed quantile p in (0, 1), Theorem 1a''s polynomial-stitched sub-gamma radius f_t(p)
    = S_p(t vee m)/t with S_p(t) = sqrt(k_1^2 p(1 - p)t l_t + k_2^2 c_p^2 l_t^2) + c_p k_2 l_t (Equation
    41) achieves the law-of-the-iterated-logarithm rate O(sqrt(p(1 - p) t^{-1} log log t)) as t -> infinity,
    while Theorem 1b''s one-sided beta-binomial conjugate mixture radius f_tilde_t(p) = t^{-1} sup{s in
    [0, (r + p(1 - p)t)/p) : M_{p,r}(s, p(1 - p)t) < 1/alpha} with closed-form Beta-function supermartingale
    M_{p,r}(s, v) (Equations 45–46) and Lambert W_{-1}-tuned prior scale r (Equation 21, Appendix D) exploits
    the reduced Bernoulli variance p(1 - p) near extreme quantiles p close to 0 or 1 to produce substantially
    tighter tail-quantile confidence sequences than variance-agnostic sub-Gaussian normal-mixture bounds
    (Equation 12) while maintaining guaranteed nonasymptotic anytime coverage even on heavy-tailed distributions
    with undefined moments such as the standard Cauchy distribution.'
