- claim_id: bolshev-recursion-u-shaped-fdr-and-kendall-tau-calibration
  kind: mechanism
  statement: Under Dirac-uniform configurations (m_1 = m - m_0 false null p-values equal to 0 almost surely),
    G_k^i(z) = 1 for k <= m_1 and G_k^i(z) = P_bar_{m_0-1}(a_1, ..., a_{m_0-1}) for k >= m_1 + 1 (where
    a_j = 0 for j <= k - m_1 - 1 and a_j = exp(-z*psi^{-1}(q_{j+m_1+1})) for j >= k - m_1), which is evaluated
    in O(m_0^2) operations via Bolshev's recursion P_bar_n(a_1, ..., a_n) = 1 - sum_{j=1}^n comb(n, j)
    a_j^j P_bar_{n-j}(a_{j+1}, ..., a_n) (Equations (26)-(27)). For the Figure 2 benchmark (m = 20, m_0
    = 16, q = 0.05, classical bound 0.04), the sharper Clayton upper bound follows a U-shaped curve across
    eta (dropping from 0.039856 at eta = 0.05 to 0.030393 at eta = 1.7 and 0.030236 at eta = 2.0 before
    rising to 0.034237 at eta = 10.0), enabling power gains by pre-estimating eta via pairwise Kendall's
    tau (tau = eta/(2 + eta) for Clayton; tau = (eta - 1)/eta for Gumbel, Equations (34)-(35)) and increasing
    the nominal level q so the sharper bound equals target alpha.
  evidence:
  - source_id: bodnar-dickhaus2014-pdf
    locator: Section 4.2–4.3, pages 14–17, Equations (26)–(33) and Figures 2–3; Section 5, pages 17–22,
      Equations (34)–(35) and Figures 4–6
    relation: supports
  - source_id: bodnar-dickhaus2014-ar5iv
    locator: Section 4.2–5, lines 413–554, Equations (26)–(35)
    relation: supports
- claim_id: infinite-exchangeable-archimedean-mtp2-characterization
  kind: mechanism
  statement: For any infinite sequence (P_i)_{i in N} of absolutely continuous, H_0-exchangeable p-values
    whose de Finetti-Kingman conditioning variable Z takes values in (0, infty) almost surely with conditional
    c.d.f. F_{P_tilde_i|Z=z}(p_i) = exp(-z*psi^{-1}(p_i)) where psi(t) = E[exp(-t*Z)] (Equation (21)),
    Theorem 3.3 and Corollary 3.3 (Equations (20)-(21)) prove that every m-dimensional marginal distribution
    has the Archimedean copula psi(sum_{i=1}^m psi^{-1}(p_i)) with completely monotone generator psi,
    possesses the Multivariate Totally Positive of Order 2 (MTP_2) property for all m >= 2, and guarantees
    exact finite-sample FDR control at level q under phi^{LSU}.
  evidence:
