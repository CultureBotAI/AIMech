claims:
- claim_id: marshall-olkin-sharper-upper-bound-and-direct-fdr-control
  kind: mechanism
  statement: Under an Archimedean p-value copula F_P(p_1, ..., p_m) = psi(sum_{i=1}^m psi^{-1}(F_{P_i}(p_i)))
    with a completely monotone generator psi(t) = E[exp(-t*Z)] (Theorem 2.1, Equation (2)), conditioning
    on Z = z renders the transformed variables T_j(P_j) = exp(-z*psi^{-1}(F_{P_j}(P_j))) conditionally
    independent and Uniform[0, 1] under H_j. Theorem 3.1 and Corollary 3.1 (Equations (5)-(9)) prove that
    for all vartheta in Theta, FDR_{vartheta,psi}(phi^{LSU}) <= (m_0(vartheta)/m)*q - b(m, vartheta, psi)
    <= (m_0(vartheta)/m)*q, where the non-negative conservativity reduction term is b(m, vartheta, psi)
    = (q/m) sum_{i in I_0(vartheta)} sum_{k=1}^{m-1} int_{z_k^*}^infty (exp(-z*psi^{-1}(q_{k+1}))/q_{k+1}
    - exp(-z*psi^{-1}(q_k))/q_k) (G_k^i(z) - G_k^i(z_k^*)) dF_Z(z) >= 0 with single-crossing threshold
    z_k^* = log(1 + 1/k) / (psi^{-1}(k*q/m) - psi^{-1}((k+1)*q/m)) and conditional order-statistic probability
    G_k^i(z) = P(bigcap_{r=k}^{m-1} {P_{r:m-1}^{(-i)} > q_{r+1}} | Z = z).
  evidence:
  - source_id: bodnar-dickhaus2014-pdf
    locator: Section 2.2, pages 4–5, Theorem 2.1 and Equations (2)–(4); Section 3, pages 5–7, Theorem
      3.1, Corollary 3.1, and Equations (5)–(9); Section 7, pages 24–29, Proof of Theorem 3.1
    relation: supports
  - source_id: bodnar-dickhaus2014-ar5iv
    locator: Section 2.2–3, lines 102–207, Theorem 2.1, Theorem 3.1, and Corollary 3.1; Section 7, lines
      575–680
    relation: supports
- claim_id: generator-dependent-lower-bound-and-clayton-incomplete-gamma-formula
  kind: mechanism
  statement: For any Archimedean p-value copula with completely monotone generator psi and continuous
    marginal p-values on [0, 1], Theorem 3.2 and Lemma 3.1 (Equations (10)-(17)) prove the finite-sample
    lower bound FDR_{vartheta,psi}(phi^{LSU}) >= (m_0(vartheta)*q/m)*gamma_min(psi), where gamma_min(psi)
    = 1 - int_0^{z^*} (g(psi^{-1}(q/m)|z) - g(psi^{-1}(q)|z)) dF_Z(z) with g(x|z) = exp(-z*x)/psi(x) and
    z^* = log(m) / (psi^{-1}(q/m) - psi^{-1}(q)). Corollary 3.2 (Equations (18)-(19)) shows that gamma_min(psi)
    = 1 when F_Z(z^*) in {0, 1} and gamma_min(psi) -> 1 as m -> infty if (m - 1)*F_Z(z^*(m))/q -> 0. For
    the Clayton copula psi(t) = (1 + eta*t)^{-1/eta} with Z ~ Gamma(1/eta, eta), Equations (24)-(25) give
    the exact closed form gamma_min(eta) = 1 + F_{Gamma(1/eta,1)}(ln(m)/(m^eta - 1)) - F_{Gamma(1/eta,1)}(m^eta*ln(m)/(m^eta
    - 1)).
  evidence:
  - source_id: bodnar-dickhaus2014-pdf
    locator: Section 3, pages 7–10, Theorem 3.2, Lemma 3.1, Corollary 3.2, and Equations (10)–(19); Section
      4.2, pages 12–14, Equations (22)–(25); Section 7, pages 29–31, Proofs of Theorem 3.2, Lemma 3.1,
      and Corollary 3.2
    relation: supports
  - source_id: bodnar-dickhaus2014-ar5iv
