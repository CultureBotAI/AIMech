- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Archimedean copula FDR bounds and copula-calibrated Benjamini-Hochberg step-up testing directly
    control false discoveries across dependent multiple hypothesis tests, mitigating multiplicity-induced
    false positives (AIO:DataDredgingBias).
limitations:
- Practical evaluation of the sharper upper bound via Bolshev's recursion (Equations (26)-(27)) assumes
  that Dirac-uniform configurations yield upper FDR bounds for phi^{LSU} under Archimedean copula dependence,
  whereas general finite-sample proofs of the Dirac-uniform least favorable configuration under arbitrary
  dependence remain open (Section 3, page 7; Section 4.2, page 14).
- Pre-estimating the copula parameter eta from N resampled or repeated dataset realizations via Kendall's
  tau or maximum likelihood requires subset pivotality (the dependence parameter eta of the p-value copula
  does not depend on the underlying parameter vector vartheta; Section 5, page 17).
- For Clayton and Gumbel-Hougaard copulae at fixed positive dependence parameter eta > 0, (m - 1)*F_Z(z^*(m))/q
  does not vanish as m -> infty and gamma_min(psi) approaches zero at moderate-to-large copula parameters,
  rendering the lower bound (m_0*q/m)*gamma_min(psi) non-informative away from weak dependence; moreover,
  along the continuous Clayton Gamma(1/eta, eta) family as eta -> 0+, the threshold z^*(eta) = 1 - eta*ln(sqrt(m)/q)
  + O(eta^2) approaches 1 from below with (z^*(eta) - 1)/sqrt(eta) -> 0-, so lim_{eta -> 0+} F_Z(z^*(eta))
  = 1/2 (whereas at eta = 0, Z == 1 gives F_Z(1) = 1) while lim_{eta -> 0+} gamma_min(eta) = 1 (Section
  3, pages 9-10; Section 4.2-4.3, pages 13-16).
- 'All 33 pages of the PDF and all 737 lines of the ar5iv HTML of Bodnar & Dickhaus (2014, Electronic
  Journal of Statistics 8(2):2207-2241, arXiv:1305.3897v3, DOI:10.1214/14-EJS950) were read. Constructed
  numerical checks in research/discovery/archimedean-copula-step-up-fdr-bounds-boundaries.py verify (1)
  Theorem 3.1 and Equations (26)-(27) Bolshev recursion sharper upper bound for the Figure 2 Clayton benchmark
  (m = 20, m_0 = 16, q = 0.05, classical bound 0.04: ub(0.05) = 0.039856, ub(0.5) = 0.036417, ub(1.7)
  = 0.030393, minimum ub(2.0) = 0.030236, ub(10.0) = 0.034237), (2) Theorem 3.2 and Equations (24)-(25)
  Clayton incomplete-gamma lower bound and eta -> 0+ limit (gamma_min(0.05) = 0.738765, lb(0.05) = 0.029551),
  (3) Gumbel single-crossing threshold z^* (Equation (31): z^*(1.0) = 1.0, z^*(6.6) = 2.23504e-05), and
  (4) Equations (34)-(35) Kendall''s tau calibration identities (Clayton eta = 2: tau = 0.5; Gumbel eta
  = 2: tau = 0.5).'
