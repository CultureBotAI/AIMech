id: AIMech:ArchimedeanCopulaStepUpFDRBounds
name: Archimedean copula linear step-up false discovery rate bounds and calibration
aliases:
- Bodnar-Dickhaus Archimedean Copula Linear Step-Up FDR Bound Framework
- Archimedean p-Value Copula Benjamini-Hochberg FDR Upper and Lower Bounds
- Marshall-Olkin Conditional Order-Statistic Linear Step-Up FDR Calibration
concept_kind: mathematical_method
definition: 'A statistical multiple hypothesis testing and False Discovery Rate (FDR) analysis framework
  developed by Taras Bodnar and Thorsten Dickhaus (2014, Electronic Journal of Statistics 8(2):2207-2241,
  arXiv:1305.3897v3, DOI:10.1214/14-EJS950) that models joint p-value distributions P = (P_1, ..., P_m)^T
  under an Archimedean copula F_P(p_1, ..., p_m) = psi(sum_{i=1}^m psi^{-1}(F_{P_i}(p_i))) with a completely
  monotone generator psi(t) = E[exp(-t*Z)] via the Marshall-Olkin conditionally independent frailty representation
  P_i = F_{P_i}^{-1}(psi(-log(Y_i)/Z)): (1) derives a sharper finite-sample upper bound FDR_{vartheta,psi}(phi^{LSU})
  <= (m_0(vartheta)/m)*q - b(m, vartheta, psi) for the Benjamini-Hochberg linear step-up test phi^{LSU}
  (Theorem 3.1, Corollary 3.1) without invoking general MTP_2 inequalities, evaluating the conditional
  order-statistic probabilities G_k^i(z) under Dirac-uniform configurations via Bolshev''s recursion (Equations
  (26)-(27)); (2) establishes a generator-dependent finite-sample lower bound FDR_{vartheta,psi}(phi^{LSU})
  >= (m_0*q/m)*gamma_min(psi) via single-crossing thresholds z^* (Theorem 3.2, Lemma 3.1, Corollary 3.2)
  with a closed-form incomplete-gamma expression for the Clayton copula (Equations (24)-(25)); (3) characterizes
  infinite H_0-exchangeable p-value sequences whose m-dimensional marginals are Archimedean copulae possessing
  the MTP_2 property (Theorem 3.3, Corollary 3.3); and (4) increases the power of phi^{LSU} by pre-estimating
  the copula parameter eta via pairwise Kendall''s tau method-of-moments or maximum likelihood on resampled
  data and calibrating the nominal level q (Section 5, Equations (34)-(35)).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 597 previously curated AIMech concepts.
  While AIMech:SelfConsistencyAndDependencyControlFDRFramework (Blanchard & Roquain 2008), AIMech:OneAndTwoStageAdaptiveStepUpFDRUnderDependence
  (Blanchard & Roquain 2009), AIMech:ContinuumMeasureSpaceStepUpFDRControl (Blanchard, Delattre, & Roquain
  2014), and AIMech:StepUpDownLeastFavorableConfigurationFDRBounds (Blanchard, Dickhaus, Roquain, & Villers
  2014) analyze FDR control under general PRDS/unspecified dependence or independent two-group mixtures,
  none of those records exploit the Marshall-Olkin frailty representation Z of Archimedean p-value copulae
  with completely monotone generators psi(t) = E[exp(-t*Z)] to derive the non-negative conservativity
  reduction term b(m, vartheta, psi) via Bolshev's order-statistic recursion, the generator-dependent
  lower bound factor gamma_min(psi) and its Clayton incomplete-gamma closed form, the infinite H_0-exchangeable
  Archimedean representation (Theorem 3.3), or Kendall's tau copula-calibrated nominal-level adjustment
  for Clayton and Gumbel-Hougaard families.
