claims:
- claim_id: tamuna-correlated-cohort-mask-and-zero-sum-control-variate-invariant
  kind: mechanism
  statement: In each round r, TAMUNA generates a binary mask matrix q^{(r)} in {0,1}^{d x c} across the c active clients Omega^{(r)} by independently permuting a template row containing s in {2, ..., c} ones and c - s zeros for each coordinate j in {1, ..., d}; the resulting compressors C_i^{(r)} satisfy E[||(1/s) sum_{i in Omega} C_i(v_i) - (1/c) sum_{i in Omega} v_i||^2] = ((c - s)/(s(c - 1))) ((1/c) sum_{i in Omega} ||v_i||^2 - ||(1/c) sum_{i in Omega} v_i||^2) (Eq. 8) and ensure that the control variate update h_i^{(r+1)} = h_i^{(r)} + (eta/gamma)(C_i^{(r)}(x_bar^{(r+1)}) - C_i^{(r)}(x_i^{(r, L^{(r)})})) preserves sum_{i=1}^n h_i^{(r)} = 0 for all r >= 0 when initialized with sum_{i=1}^n h_i^{(0)} = 0.
  evidence:
  - source_id: r567-primary-pdf
    locator: Section 4, Algorithm 1 & Section 4.1, Equations (6)-(8), pp. 6-8
    relation: supports
- claim_id: tamuna-linear-convergence-and-doubly-accelerated-communication-complexity
  kind: mechanism
  statement: For L-smooth mu-strongly convex client objectives with exact gradients, setting 0 < gamma < 2/L, 0 < chi <= n(s - 1)/(s(n - 1)), and eta = p chi guarantees that the Lyapunov function Psi^{(r)} := (n/(gamma p)) ||x_bar^{(r)} - x*||^2 + (gamma / (p^2 chi)) ((n - 1)/(s - 1)) sum_{i=1}^n ||h_i^{(r)} - nabla f_i(x*)||^2 contracts at rate E[Psi^{(r)}] <= tau^r Psi^{(0)} with tau = max((1 - gamma mu)^2, (gamma L - 1)^2, 1 - p^2 chi (s - 1)/(n - 1)) < 1 (Theorem 1), yielding doubly accelerated total uplink communication complexity O((sqrt(d) sqrt(kappa) sqrt(n/c) + d sqrt(kappa) sqrt(n)/c + d n / c + sqrt(alpha) d sqrt(kappa) sqrt(n/c)) log(1/epsilon)) floats (Corollary 1).
  evidence:
  - source_id: r567-primary-pdf
    locator: Section 5, Theorem 1, Corollary 1 & Equation (14), pp. 8-10
    relation: supports
- claim_id: tamuna-stochastic-gradient-variance-reduced-convergence
  kind: scope
  statement: Under unbiased local stochastic gradients with bounded variance C_i and bounded ABC-type second-moment growth A_i ||nabla f_i(x) - nabla f_i(x*)||^2 + B_i D_{f_i}(x, x*) + C_i (Assumption 2), TAMUNA converges linearly to a variance-proportional neighborhood of x* for constant step size gamma (Theorem 3) and converges to x* with O(1/epsilon) communication complexity via diminishing step sizes or variance reduction.
  evidence:
  - source_id: r567-primary-pdf
    locator: Section 6, Assumption 2 & Theorem 3, pp. 11-12
    relation: supports
- claim_id: tamuna-stateful-control-variate-and-shared-seed-mask-limitation
  kind: limitation
  statement: Because every client i in [n] must maintain a stateful control variate h_i^{(r)} in R^d across rounds even when not participating, TAMUNA is applicable to stateful cross-silo or repeat-participation cross-device federated learning rather than purely stateless one-shot client sampling, and requires active clients in Omega^{(r)} to coordinate (e.g. via a shared pseudorandom seed) to generate the row-constrained binary masks with exactly s ones per coordinate.
  evidence:
  - source_id: r567-primary-pdf
    locator: Section 4.1 & Section 4.2, Remarks on control variates and mask generation, pp. 7-8
    relation: supports
