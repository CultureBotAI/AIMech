limitations:
- Local and global partitions are alternative output modes of one attractor-closure construction; neither
  is generally a refinement of the other.
- The source calls expected passage a distance, but it is asymmetric and has positive diagonal returns.
  Replacing it by a zero-diagonal metric changes global attractors.
- Exact ties are retained. Numerical tolerance and approximate linear-solver error require an implementation
  policy that was not audited.
- The introductory stationary-probability convergence wording is not adopted for periodic walks. First-passage
  solves do not rely on that limit.
- Only historical source applications and finite curator calculations were assessed. Journal-byte equivalence,
  author code, raw datasets, biological hypotheses and benchmark replication were not verified. DRAFT
  remains.
