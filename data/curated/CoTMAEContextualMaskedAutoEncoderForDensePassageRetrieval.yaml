id: AIMech:CoTMAEContextualMaskedAutoEncoderForDensePassageRetrieval
name: CoT-MAE Contextual Masked Auto-Encoder for Dense Passage Retrieval
concept_kind: architecture
review_status: DRAFT
definition: An asymmetric encoder-decoder generative pre-training architecture and algorithm for dense passage retrieval that samples pairs of text spans (T_A, T_B) from each document using a uniform mixture of adjacent non-overlapping (Near), partially overlapping (Olap), and random non-overlapping (Rand) span-pair strategies, applies asymmetric token masking with rate p_enc (e.g., 30%) on the deep Transformer encoder side and a higher rate p_dec (e.g., 45%) on the shallow (2-layer) Transformer decoder side, and jointly minimizes the symmetric dual sum of self-supervised masked language modeling and cross-span context-supervised masked language modeling losses L = L^{AB} + L^{BA} = (L^A_smlm + L^{AB}_cmlm) + (L^B_smlm + L^{BA}_cmlm), where L^A_smlm = -sum_{t in m_enc(T_A)} log p(t | T_A \ m_enc(T_A)) and L^{AB}_cmlm = -sum_{t in m_dec(T_B)} log p(t | [h^{last}_{0, A}, T_B \ m_dec(T_B)]) conditions the decoder's reconstruction of masked tokens in T_B on the encoder's last-layer [CLS] context representation h^{last}_{0, A} of neighboring span T_A (and symmetrically for B -> A) before discarding the decoder at fine-tuning time.
identity_notes: Distinct from SEED-Encoder (AIMech:SEEDPreTrainingStrongTextEncoderUsingWeakDecoder), Condenser (AIMech:CondenserPreTrainingArchitectureForDenseRetrieval), RetroMAE (AIMech:RetroMAERetrievalOrientedMaskedAutoEncoder), and SimLM (AIMech:SimLMRepresentationBottleneckPreTraining), all of which perform single-span internal auto-encoding where the decoder reconstructs the same text span encoded into [CLS] rather than cross-span context-supervised masked auto-encoding over paired neighboring spans (T_A, T_B); and distinct from coCondenser (AIMech:CoCondenserUnsupervisedCorpusAwareLanguageModelPreTraining), which uses a discriminative corpus-level contrastive loss across spans rather than generative context-MLM reconstruction.
aliases:
- CoT-MAE
- ConTextual Masked Auto-Encoder
- Contextual Masked Auto-Encoder for Dense Passage Retrieval
