claims:
- claim_id: cot-mae-dual-self-and-context-supervised-mlm
  kind: mechanism
  statement: CoT-MAE links intra-span token semantics and inter-span semantic correlation by jointly optimizing self-supervised MLM on the deep encoder (L^A_smlm = -sum_{t in m(T_A)} log p(t | T_A \ m(T_A)), Equation 4) and context-supervised MLM on the shallow 2-layer decoder conditioned on the neighboring span's last-layer [CLS] vector h^{last}_0 (L^{AB}_cmlm = -sum_{t in m(T_B)} log p(t | [h^{last}_0, T_B \ m(T_B)]), Equation 5) symmetrically in both directions L = (L^A_smlm + L^{AB}_cmlm) + (L^B_smlm + L^{BA}_cmlm) (Equations 6-8).
  evidence:
  - source_id: r766-primary-pdf
    locator: 'Section CoT-MAE: ConTextual Masked Auto-Encoder, Equations 4-8, Figure 1b, pp. 2-4'
    relation: supports
  - source_id: r766-primary-pdf
    locator: main() verification of symmetric dual loss L = L^{AB} + L^{BA} and reduction of L^{AB}_{cmlm} under aligned neighboring span [CLS] context
    relation: supports
- claim_id: cot-mae-asymmetric-masking-and-mixed-span-sampling
  kind: mechanism
  statement: Combining all three span-pair sampling strategies (Near, Olap, and Rand) with asymmetric masking rates (p_enc = 30% on the encoder and p_dec = 45% on the 2-layer decoder) maximizes downstream retrieval accuracy (39.2 MRR@10 at 800k steps in Tables 3-5), whereas either a 1-layer decoder (too weak to fuse context and unmasked tokens) or a deeper 3-to-6-layer decoder (reducing reliance on the encoder's [CLS] context vector) underperforms the 2-layer decoder.
  evidence:
  - source_id: r766-primary-pdf
    locator: Section Analysis (Impact of Mask Rate, Impact of Sampling Strategies, Impact of Decoder Layer Number), Tables 3-5, p. 6
    relation: supports
  - source_id: r766-primary-pdf
    locator: main() verification of Near, Olap, and Rand span-pair properties and asymmetric mask counts (30% vs 45%)
    relation: supports
- claim_id: cot-mae-benchmark-applications
  kind: application
  statement: On MS-MARCO Passage Ranking, Natural Questions (NQ), and TREC DL 2020, CoT-MAE achieves 39.4 MRR@10 and 98.7% R@1k without distillation (exceeding coCondenser's 38.2 MRR@10 and reaching 70.4 nDCG@10 on TREC DL 2020 in Table 1), and reaches 40.4 MRR@10 and 88.5% R@50 after reranker distillation (Table 2).
  evidence:
  - source_id: r766-primary-pdf
    locator: Section Main Results & Comparison with Distilled Retrievers, Tables 1-2, pp. 5-6
    relation: supports
  - source_id: r766-metadata-cr
    locator: BibTeX citation record for arXiv:2208.07670
    relation: supports
- claim_id: cot-mae-excessive-encoder-masking-limitation
  kind: limitation
  statement: Increasing the encoder masking rate too aggressively (e.g., p_enc = 45% with p_dec = 60% in Table 3) degrades downstream retrieval performance (from 39.2 to 38.8 MRR@10) because the heavily masked encoder span can no longer provide a sufficiently informative [CLS] context vector to the decoder.
  evidence:
  - source_id: r766-primary-pdf
    locator: 'Section Analysis: Impact of Mask Rate, Table 3, p. 6'
    relation: supports
