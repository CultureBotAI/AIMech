- target: AIO:LongShortTermMemory
  relation: broad_match
  rationale: The named architecture is a recurrent LSTM sequence network with an additional gated inter-layer
    cell path; the pinned generic LSTM network is broader.
- target: AIO:LSTMCellLayer
  relation: related_match
  rationale: The modified cell update operates at a sequence step within the stacked architecture; a cell
    layer is a component rather than an equivalent complete network.
limitations:
- Direct lower-cell carry, ordinary hidden-state stacking and delayed gated feedback are different mechanisms;
  related Grid and highway descriptions do not make them interchangeable aliases.
- Coupled ordinary gates do not normalize the additional depth contribution. Input-dependent gates and
  other paths affect the full Jacobian.
- Unequal-width carry details and the linked implementation were not verified. First-layer projected-input
  gating is an explicitly scoped extension.
- Translation depth comparisons, reranking and language modeling use different protocols. The table-derived
  reranking gain differs from the prose.
- All six pages of arXiv1508.03790v4 visually read, including equations, tables, figures and references.
  No author code, other versions, training or benchmark replication; DRAFT remains.
