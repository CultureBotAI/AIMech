name: Deep SHAP
definition: A compositional approximation of neural-network Shapley attributions using component-level
  SHAP values and backward multipliers.
concept_kind: algorithm
identity_notes: Deep SHAP adapts DeepLIFT-style propagation with component SHAP values; it is a distinct
  approximation method, not the general SHAP definition or a synonym for all DeepLIFT rules.
limitations:
- Component-wise exact values do not imply exact Shapley values for an arbitrary composite nonlinear model.
- Reference/background and feature-dependence assumptions affect the approximation; no causal-importance
  guarantee is curated.
id: AIMech:DeepSHAP
definition_evidence:
- source_id: original-paper
  locator: Section 4.2, Deep SHAP, equations 13–16 and Figure 2B, PDF/printed p. 7
  relation: supports
claims:
- claim_id: explanation-method
  kind: mechanism
  statement: Compute attributions for supported simple network components, convert them to multipliers
    relative to reference expectations, and compose those multipliers backward to approximate whole-network
    feature attributions.
