id: AIMech:SimultaneousPathwiseFalseDiscoveryProportionBounds
name: Simultaneous pathwise false discovery proportion bounds
aliases:
- Simultaneous High-Probability FDP Bounds Across Nested Rejection Paths
- Closed-Testing Interpolation-Based Simultaneous FDP Control
- Pathwise False Discovery Proportion Confidence Envelopes
- Simultaneous FDP Bounds for Sorted, Interactive, Knockoff, and Online Paths
concept_kind: mathematical_method
definition: A finite-sample multiple-testing and selective-inference methodology (Katsevich & Ramdas 2020,
  The Annals of Statistics 48(6):3465-3487, arXiv:1803.06790) that constructs simultaneously valid level-(1
  - alpha) upper confidence envelopes on the false discovery proportion FDP(R_k) = V(R_k) / max(1, |R_k|)
  across an entire nested sequence of candidate rejection sets emptyset = R_0 subset R_1 subset ... subset
  R_m ordered by sorted p-values, covariate-assisted interactive unmasking (STAR/AdaPT), knockoff feature-importance
  statistics, or online hypothesis streams. By proving a unifying finite-sample exponential supermartingale
  and empirical-process inequality (Lemma 1 and Lemma 2) to obtain pathwise false-discovery upper bounds
  V(R_k) <= bar{V}(R_k) and applying closed-testing interpolation tilde{V}(R_k) = min_{0 <= j <= k} {bar{V}(R_j)
  + |R_k \ R_j|} (Proposition 1), the procedure allows analysts to inspect the entire size-versus-FDP
  trade-off curve and select any rejection set R_k or target FDP level post hoc without violating simultaneous
  coverage.
identity_notes: No normalized identity match for simultaneous pathwise false discovery proportion bounds
  across all 442 pinned AIO records and 584 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only references in AdaptivePValueThresholding,
  FocusedBH, and ConformalNoveltyDetection context notes. Distinct from AIMech:AdaptivePValueThresholding
  (Lei & Fithian 2018, AdaPT) and AIMech:FocusedBH (Katsevich, Sabatti, & Bogomolov 2023), which output
  a single stopping threshold controlling expected FDR = E[FDP] <= q rather than simultaneous high-probability
  upper bounds on FDP(R_k) across all path steps k; distinct from AIMech:GeneralizedAlphaInvesting, AIMech:LOND,
  AIMech:LORD, and AIMech:SAFFRON, which control online mFDR or expected FDR for a single sequence of
  rejection decisions rather than simultaneous post-hoc FDP envelopes across all candidate online sets
  (Theorems 4-5); and distinct from AIMech:DerandomizedKnockoffs (Ren, Wei, & Candes 2023), which aggregates
  multiple knockoff runs for single-threshold PFER or k-FWER control rather than bounding FDP simultaneously
  across the entire ordered knockoff path (Theorem 3).
