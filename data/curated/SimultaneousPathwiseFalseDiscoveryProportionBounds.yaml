limitations:
- Theorem 1 (sorted p-value path) requires mutual independence among null p-values (Condition 1); under
  strong positive equicorrelation across offline tests, the supremum ratio sup_k V(R_k) / max(1, n_0 p_{(k)})
  becomes heavy-tailed and can violate the nominal level alpha unless dependence-robust or resampling-based
  bounds are substituted.
- Theorem 2 (interactive covariate-assisted path) and Theorem 3 (knockoff path) require independent mirror-conservative
  null p-values (P(p_i <= 1/2 | tilde{p}_i) <= 1/2) or exact i.i.d. coin-flip null sign symmetry (Condition
  2); misspecification of the feature distribution in model-X knockoffs or asymmetric null p-values can
  invalidate the exponential supermartingale inequality of Lemma 1.
- Because the bounds hold simultaneously across all path steps k and with high probability 1 - alpha over
  the realized FDP rather than merely in expectation (FDR), the multiplicative constants c(alpha) > 1
  (e.g., c_sort(0.10) = 1.927324 and c_knock(0.05) = 4.485775) and additive offset c(alpha) introduce
  conservatism in very small rejection sets compared to single-threshold expected-FDR methods when only
  a fixed pre-specified FDR target is needed.
- All 1,158 lines of Katsevich & Ramdas (2020, The Annals of Statistics 48(6):3465-3487, arXiv:1803.06790v5)
  were read. Constructed numerical checks in research/discovery/simultaneous-pathwise-false-discovery-proportion-bounds-boundaries.py
  verify (1) Section 2.2 Theorem 1 / Section 7.1 Lemma 2 exact multiplier c_sort(0.10) = 1.927324, Proposition
  2 threshold cutoff alpha(1.5) = 0.318532, tighter intermediate bound V_bar_sort = 26 vs. DKW = 66 and
  Robbins = 125, and global-null simultaneous violation rate 0.056667 <= 0.10 vs. unadjusted 1.0, (2)
  Section 7.2 Lemma 1 exact supermartingale increment inequality <= 1.0 across Cases 1-3, Section 4 Theorem
  3 knockoff constant c_knock(0.05) = 4.485775 vs. backward 20.0, and knockoff simultaneous violation
  rate 0.006 <= 0.05, (3) Section 3 Theorem 2 interactive covariate-assisted path simultaneous violation
  rate 0.0225 <= 0.10 and higher average post-hoc discoveries (32.335 vs. 24.8425 at tilde{FDP} <= 0.20)
  than sorted p-values, and (4) Section 5 Theorems 4-5 online simple and adaptive simultaneous bounds
  (violation rates 0.001 <= 0.10) vs. offline violation rate 0.23 > 0.10 under strong positive equicorrelation
  rho = 0.90.
