claims:
- claim_id: method
  kind: mechanism
  statement: Decompose the neighborhood into indexed, possibly overlapping subneighborhoods and supply
    an activation bit for each. The standalone initialization activates all; the callable routine also
    permits a supplied subset. Repeatedly scan in the declared order, skipping inactive subneighborhoods.
    In an active subneighborhood, take the first encountered move that strictly improves the current objective,
    update the solution, retain that subneighborhood as active, and activate the configured subneighborhoods
    affected by the move. Continue with the next subneighborhood instead of restarting the entire scan.
    If no improving move is found after checking the current subneighborhood, deactivate it. Return the
    current solution when all bits are inactive. In the optional GLS combination, changes to feature penalties
    reactivate associated subneighborhoods before the next FLS call; the penalty formula itself belongs
    to GLS.
