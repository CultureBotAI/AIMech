name: Fast Local Search
definition: A neighborhood-search procedure that uses activation bits to scan selected subneighborhoods,
  deactivating unsuccessful ones and reactivating those affected by accepted improvements.
concept_kind: algorithm
identity_notes: FLS is the named Voudouris–Tsang neighborhood-reduction procedure, not any fast implementation
  of local search. It is separable from GLS feature-penalty updates and from the combined Guided Fast
  Local Search algorithm. Subneighborhoods can overlap; calling them a disjoint partition would overstate
  the source. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 304 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in worktree and main, returning 176 and 176 lines respectively. Inspected text hits were
  prior discovery leads, uses of local search inside existing methods, source references and their saved
  reports/reviews. These were references to methods rather than existing candidate records. Six exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and six native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- All bits inactive certifies only the termination of the configured activation scheme. If initial activation
  or later reactivation omits a region where an improvement exists or becomes possible, the result need
  not be a local optimum of the full neighborhood. The authors explicitly call the result approximate
  and warn that improvements can be missed.
- Activation dependencies, move coverage, order and overlap are problem-dependent. Reactivating every
  subneighborhood is conservative but can remove the intended computational savings; the method is not
  a universal speedup guarantee.
- 'Within one call the objective is fixed and accepted moves strictly improve it. Curator deduction: finite
  states and finite move scans imply termination, but neither arbitrary continuous termination nor overall
  GLS termination follows. Penalty changes between GLS calls alter the objective and require renewed activation.'
