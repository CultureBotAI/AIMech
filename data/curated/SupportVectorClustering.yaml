- source_id: svc-source
  locator: Sections2.1-2.2, printed pp.126-128 / PDF pp.2-4, Equations1-16
  relation: supports
claims:
- claim_id: sphere-fit
  kind: mechanism
  statement: For N input observations, Gaussian kernel K(x,y)=exp(-q*||x-y||²), q>0, and slack penalty
    C>0, fit a center a and radius R by minimizing R²+C*sum_i xi_i subject to ||Phi(x_i)-a||²<=R²+xi_i
    and xi_i>=0. The displayed dual maximizes sum_i beta_i*K_ii-beta^T*K*beta with sum_i beta_i=1 and
    0<=beta_i<=C. Its feasibility requires N*C>=1. The center is sum_i beta_i*Phi(x_i); kernel evaluation
    avoids explicitly constructing those features. The convex quadratic dual concerns sphere fitting,
    not globally optimal clustering or parameter selection.
  evidence:
  - source_id: svc-source
    locator: Section2.1, printed pp.126-127 / PDF pp.2-3, Equations1-11; feasibility follows by summing
      the box bounds
    relation: supports
- claim_id: radius-and-bound-vectors
  kind: limitation
  statement: The squared distance of a new input is K(x,x)-2*sum_i beta_i*K(x_i,x)+beta^T*K*beta. A free
    support vector with 0<beta_i<C lies on the sphere and supplies R. If no free support vector exists,
    the stated radius rule needs an additional convention. A coefficient beta_i=C permits distance equal
    to R as well as greater than R; bounded coefficients alone do not prove strict exclusion. With N=2,
    C=1/2 and Gaussian off-diagonal kernel value 1/2, beta=(1/2,1/2), and every squared radius from 0 to 1/4
    with equal slacks 1/4-R² attains primal and dual value 1/4. At R²=1/4 both bounded vectors are on the
    boundary and no free vector exists.
  evidence:
  - source_id: svc-source
    locator: Section2.1, printed pp.127-128 / PDF pp.3-4, Equations3-14; curator exact two-observation
      KKT and primal-dual calculation
    relation: supports
- claim_id: component-assignment
  kind: mechanism
  statement: For observations retained inside or on the sphere, form an edge when every point on their
    straight line segment in input space also maps inside or onto the sphere. Assign clusters as connected
    components of this observation graph. The reported implementation approximates each continuous segment
    test with 20 sampled points. Points treated as outliers are initially unassigned; leaving them unassigned
    or assigning them to a nearest cluster is an additional policy, and the paper uses the latter in its
    examples.
  evidence:
  - source_id: svc-source
    locator: Section2.2, printed p.128 / PDF p.4, Equation16 and following paragraphs
    relation: supports
- claim_id: finite-connectivity
  kind: limitation
  statement: An exact accepted segment gives a path inside the sphere preimage, but a graph on finitely
    many observations need not capture every path-connected component of that continuous set. Finite segment
    sampling can miss an excursion outside and introduce a false connection. The 20-sample implementation
    therefore has no stated exact topological recovery guarantee. Restricting adjacency tests to support
    vectors is a heuristic described in Section 5 reported to agree on the tried datasets, not a general equivalence proof.
  evidence:
  - source_id: svc-source
    locator: Section2.2, printed p.128 / PDF p.4; Section5, printed p.135 / PDF p.11; curator distinction
      between continuous paths and finite sampled edges
    relation: supports
- claim_id: scale-and-outlier-control
  kind: mechanism
  statement: The parameters q and p=1/(N*C) explore spatial scale and allowable slack. Larger q means
    a narrower Gaussian; larger p means a smaller penalty C. The box and sum constraints imply that the
    fraction of coefficients at their upper bound is at most p; the paper’s stricter inequality requires
    remaining positive coefficient mass. High-p fits can describe cluster cores rather than the envelope
    of all data. The weighted kernel score sum_i beta_i*K(x_i,x) approaches the equal-weight Parzen score
    as p approaches 1, up to density normalization; this resemblance does not make the component procedure
    identical to mode seeking.
  evidence:
  - source_id: svc-source
    locator: Sections3.2-4, printed pp.130-133 / PDF pp.6-9, Equations17-22; bound qualification follows
      from Equations3,9
    relation: supports
- claim_id: selection-and-hierarchy
  kind: limitation
  statement: The source proposes increasing q and adjusting p while monitoring support-vector fractions
    and stability. It explicitly reports counterexamples to a strict hierarchy when bounded support vectors
    are used. These choices do not provide a universal cluster-count selector or nested partition guarantee.
    Strong overlap may leave small cluster cores; the finite experiments also show sensitivity to retained
    PCA dimensions.
  evidence:
  - source_id: svc-source
    locator: Sections4.1-4.2 and 6, printed pp.134-136 / PDF pp.10-12
    relation: supports
- claim_id: computational-scope
  kind: limitation
  statement: The source uses an adapted sequential minimal optimization fit and sampled pairwise connectivity
    checks. With a fixed number of segment samples, straightforward labeling scales with retained-point
    pairs, nonzero-coefficient kernel evaluations and input dimension. The stated overall quadratic scaling
    assumes a bounded support-vector count and empirical solver behavior; it is not an unconditional complexity
    guarantee for all kernels or datasets.
  evidence:
  - source_id: svc-source
    locator: Section5, printed p.135 / PDF p.11
    relation: supports
