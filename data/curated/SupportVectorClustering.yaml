    is a related task mapping, not algorithm-task identity or an upstream subclass assertion. Inspected
    eight annotated AIO nodes and their generated records: UnsupervisedClustering, Clustering, UnsupervisedLearning,
    MachineLearningTask, SupportVectorMachine, Network, KernelLayer and Model. The supervised classification/regression
    network definition of SupportVectorMachine does not cover this unsupervised sphere-and-connectivity
    algorithm; a shared support-vector name is insufficient. Generic networks, kernel layers and model
    abstractions do not specify it. All442 AIO class labels and 153 semantic matches reuse byte-verified
    prior readings; expanded support/sphere/density/novelty/anomaly searches add no rows. KernelPCA, KernelKMeans
    and SemidefiniteMaximumMarginClustering were checked against their unchanged complete readings; DBSCAN
    and MeanShift were fully read as additional context. Their projections, variance objectives, label
    matrices, neighborhoods and mode updates differ from the selected sphere preimage and segment graph.
    Context is not renewed scientific approval.'
