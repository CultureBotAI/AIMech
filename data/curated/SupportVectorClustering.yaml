limitations:
- The record describes the exact inspected source and qualifies its KKT, connectivity, hierarchy and cost
  statements; the separately listed revision remains unavailable for comparison.
- Gaussian scale, penalty, numerical tolerances, radius conventions, segment sampling and outlier reassignment
  affect results. The original comparison does not establish universal performance, unbiased parameter
  choice or recovery of arbitrary population clusters.
- All 13 source pages, seven figures and references were visually read. Iris results depend on PCA dimension
  and, for the two-dimensional example, combining two returned clusters. No historical optimizer, benchmark
  or model training was executed.
