id: AIMech:SupportVectorClustering
name: Support Vector Clustering
aliases:
- SVC
concept_kind: algorithm
definition: An unsupervised clustering procedure that fits a soft enclosing sphere to observations in
  Gaussian-kernel feature space, then labels retained observations by connected components of a graph
  whose input-space segments remain within the sphere preimage.
identity_notes: 'This record covers the Ben-Hur-Horn-Siegelmann-Vapnik sphere-and-connectivity procedure
  in the exact inspected JMLR PDF. The support description alone does not assign component labels. This
  is distinct from supervised support-vector classification, label-margin clustering, kernel k-means,
  density-connected neighborhoods and iterative mode seeking. Low- and high-outlier regimes are parameter
  settings within the method. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 501 prior
  native IDs, names and aliases; no normalized identity collision for Support Vector Clustering or SVC.
  Full fixed-string searches of both checkouts included ignored and hidden files, expanded terminology,
  source identifiers and adjacent support-description names. They returned 13 lines per checkout: nine
  distinct texts at 26 locations, all inspected as query, bibliography or provisional frontier references
  in the preceding discovery ledger, not maintained concepts. Eight annotated AIO nodes and outgoing edges,
  eight generated records and five native neighbors distinguish the selected procedure. Absence is bounded
  to the inspected pin and corpus; inaccessible source revisions do not establish absence upstream.'
