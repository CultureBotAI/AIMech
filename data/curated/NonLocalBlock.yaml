name: Non-local block
definition: A neural-network component that aggregates input-dependent pairwise contributions from positions
  across a representation, projects the aggregate and adds it to the original features through a residual
  connection.
concept_kind: layer
identity_notes: This record denotes the residual non-local block introduced in the 2018 paper, not an
  entire non-local network, classical non-local-means denoiser, fixed dense layer or a particular trained
  video classifier. Its operator family includes softmax and non-softmax pairwise functions; an embedded-Gaussian
  instance overlaps self-attention without making every family member identical to a Transformer layer.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 282 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 2 and 2 lines respectively. Every text hit was a prior candidate lead or a closely
  related variant lead. Ten exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and
  five native neighboring mechanisms were inspected. Absence is bounded to this snapshot and semantic
  neighborhood.
limitations:
- Non-softmax weights need not sum to one, and raw dot-product weights can be negative. Their aggregate
  need not be a convex average or calibrated attention distribution. The paper’s Gaussian terminology
  refers to its exponential dot-product formula, not a required Euclidean radial-basis kernel.
- The embedded-Gaussian formula lacks an explicit inverse-square-root dimension factor and is not a complete
  multi-head Transformer architecture. Subsampling projected source branches does not generally reproduce
  the full-resolution all-pairs result or commute with projection and pooling.
- Zero output projection in the stated residual formula gives identity only when all residual contributions
  vanish. In the source’s batch-normalized implementation, zero scale also needs zero offset to make the
  branch zero; later training changes this state.
- Explicit pairwise computation can require a query-by-source matrix and becomes expensive at high resolution.
  Bottleneck width, subsampling, placement and the chosen implementation determine costs; global reach
  does not imply linear complexity or universal speedup. No benchmark replication, source-code execution
  or proof of causal interpretability is asserted.
