claims:
- claim_id: method
  kind: mechanism
  statement: At each output position, evaluate a pairwise scalar function between that position and source
    positions across space, time or spacetime. Use those scalars to aggregate learned value embeddings
    of source features, with a normalizer chosen for the pairwise function. The paper’s Gaussian and embedded-Gaussian
    variants exponentiate dot products and normalize each query over source positions, yielding softmax
    weights. Its raw embedded dot-product and ReLU-on-concatenated-embeddings variants divide by the number
    of source positions instead. Project the aggregate back to the input channel count and add the original
    feature at the output position. A zero residual branch can initialize the block as identity. The source
    reduces embedding width and optionally max-pools the projected source branches to reduce pairwise
    work while retaining the output query grid; this changes the sampled context but retains long-range
    aggregation.
