id: AIMech:WatkinsHardCutMultistepQLearning
name: Watkins hard-cut multistep Q-learning
concept_kind: algorithm
aliases: []
definition: The original hard-cut multistep Q-learning construction that estimates action returns using
  maximum-value bootstraps and continuation through policy actions, cuts subsequent-return contributions
  at non-policy actions, and updates action values from the delayed estimates.
definition_evidence:
- source_id: watkins1989
  locator: Chapter 7, Sections 2.3 and 3–3.1, printed pp. 92–98 / PDF pp. 99–105, policy-dependent return
    construction, implicit greedy policy and delayed action-value update.
  relation: supports
claims:
- claim_id: action-values-and-implicit-greedy-policy
  kind: mechanism
  statement: Represent action values Q_t(s,a) and derive the state estimate U_t^Q(s)=max_a Q_t(s,a). The
    implicit current policy chooses an action attaining that maximum. Actions actually taken may differ
    from that policy; learning action values does not itself specify how exploration is selected.
  evidence:
  - source_id: watkins1989
    locator: Chapter 7, Section 3, printed pp. 95–96 / PDF pp. 102–103, state-value and implicit-policy
      definitions and the action-selection discussion.
    relation: supports
- claim_id: hard-cut-forward-return
  kind: mechanism
  statement: Choose lambda_star in [0,1] and set lambda_t=lambda_star when a_t is classified as a policy
    action, and lambda_t=0 otherwise. With R_t denoting the source’s variable-lambda action-return estimate,
    its printed recursion is R_t=r_t+gamma*((1-lambda_(t+1))*U_t(s_(t+1))+lambda_(t+1)*R_(t+1)). In the
    action-value construction U is the maximum-based state estimate. This retains the literal U_t indexing
    of the displayed recursion; the source’s following prose uses a different time index, as recorded
    in the limitations.
  evidence:
  - source_id: watkins1989
    locator: Chapter 7, Section 2.3, printed pp. 93–95 / PDF pp. 100–102, especially the hard-cut rule
      and recursion on printed p. 94; Section 3.1, printed p. 97 / PDF p. 104.
    relation: supports
- claim_id: cut-boundary-and-experimental-action-credit
  kind: mechanism
  statement: When action a_(t+1) is non-policy, lambda_(t+1)=0 and the current action’s return reduces
    to r_t+gamma*U_t(s_(t+1)). The next-state bootstrap remains, while rewards generated by that non-policy
    action and subsequent steps do not propagate into earlier returns through this recursion. The estimate
    R_t still concerns the action actually taken at t, including when that action is itself experimental;
    the cut does not mean that experimental actions are excluded from action-value learning.
  evidence:
  - source_id: watkins1989
    locator: Chapter 7, Section 2.3, printed p. 94 / PDF p. 101, recursive cut explanation and distinction
      between action-value and state-value estimation; Section 3.1, printed p. 97 / PDF p. 104.
    relation: supports
- claim_id: delayed-action-value-update
  kind: mechanism
  statement: In the displayed delayed realization, once the return estimate for the state-action pair
    at time t is available at a later time t+T, update Q_(t+T+1)(s_t,a_t)=(1-alpha)*Q_(t+T)(s_t,a_t)+alpha*R_t.
    The value being blended is the pair’s value at the update time, not necessarily its value when the
    action was taken. The source also discusses incremental prediction-difference implementations, but
    this selected construction does not substitute a later online backward-trace loop for the displayed
    delayed update.
  evidence:
  - source_id: watkins1989
    locator: Chapter 7, Section 3.1, printed pp. 97–98 / PDF pp. 104–105, delayed update equation and
      changing-estimate discussion.
    relation: supports
- claim_id: one-step-and-unit-continuation-boundaries
  kind: scope
  statement: At lambda_star=0, all continuation coefficients vanish and the action-return estimate has
    the one-step reward-plus-maximum bootstrap target. At lambda_star=1, subsequent policy actions retain
    continuation, but a non-policy action still causes a cut and a bootstrap. Thus unit continuation is
    not an unconditional full-trajectory Monte Carlo target under arbitrary behavior, and equality of
    a one-step target does not establish equality of differently timed update trajectories.
  evidence:
  - source_id: watkins1989
    locator: Chapter 7, Section 2, printed p. 88 / PDF p. 95, constant-lambda endpoints; Section 2.3,
      printed pp. 93–95 / PDF pp. 100–102, variable-lambda cut; Section 3.1, printed p. 97 / PDF p. 104.
    relation: supports
limitations:
- The selected scope is the original hard-cut forward-return and delayed-update construction, not every
  method called Q(lambda), the whole Q-learning family, selected-next-action MCQ-L/Sarsa, Peng–Williams
  two-error propagation, or a replacing-trace component. The thesis separately proposes a soft exponential
  continuation rule. That alternative is not a defining component or an exact alias of this hard-cut method.
- The inspected return-estimation development assumes bounded rewards and discount gamma<1 in a Markov
  setting. Continuing undiscounted returns, unbounded rewards or arbitrary approximation require additional
  conditions. Lambda_star=1 does not remove non-policy cuts and does not itself establish existence of
  a return, stable learning or convergence.
- The displayed recursion on printed p. 94 / PDF p. 101 uses U_t(s_(t+1)), while the immediately following
  explanatory prose invokes U_(t+1)(s_(t+1)). The draft preserves the displayed formula and records this
  timing gap instead of silently selecting a modern convention. Return construction, delayed updates and
  changing value estimates must use an explicitly declared timing convention in an implementation.
- The initial corrigenda amend the prediction-difference development on printed pp. 90–91, retaining changing-value
  correction terms. The original printed p. 91 update also uses C(x,t+1) after defining C(x,t). These
  passages do not establish exact equality between arbitrary finite-step online updates and the delayed
  forward construction. Small-step remarks are not a uniform error bound or a true-online equivalence
  theorem.
- The preliminary policy-classification discussion assumes a unique policy action per state, while the
  maximum-based policy can have ties. Tie breaking, the classification of equal-valued alternatives, initialization,
  terminal treatment and episode resets are not fully specified by this selected construction. An exploratory
  sampling branch can still select a maximizing action; its label alone does not determine whether the
  selected action is non-policy.
- The thesis explicitly does not prove convergence of this multistep control family and discusses possible
  interactions between changing values and policies. Its one-step result is not a general proof for this
  method, nonlinear approximators, arbitrary behavior or arbitrary learning rates. This is a boundary
  of the inspected original source, not a claim that no later theorem exists.
- Evidence is a 241-page Cambridge-hosted scan of the May 1989 thesis, including its initial corrigenda.
  The source’s PDF build date and repository modification date are not publication dates. Selected methods,
  qualifications and formula images were inspected; no full-thesis proof certification, author-code inspection
  or experiment reproduction is claimed. Historical demonstrations do not establish universal speed, variance
  reduction or benchmark superiority.
