claims:
- claim_id: ipq-activation-weighted-kmeans-em-objective
  kind: mechanism
  statement: Instead of minimizing Frobenius weight reconstruction error ||W - W_hat||_2^2 (Eq. 1), iPQ minimizes in-domain output activation reconstruction error ||y - y_hat||_2^2 = sum_j ||x(w_j - q(w_j))||_2^2 (Eq. 2) by unrolling input activations x in R^{B x C_in} into x_tilde in R^{(B*m) x d} and alternating an E-step cluster assignment c_j = argmin_{c in C} ||x_tilde(c - v)||_2^2 (Eq. 3) with a least-squares M-step update c* = argmin_{c in R^d} sum_{p in I_c} ||x_tilde(c - v_p)||_2^2 (Eq. 4).
  evidence:
  - source_id: r815-primary-pdf
    locator: Section 3.1 (Quantization of a Fully-Connected Layer), Equations 1-4, pp. 3-4
    relation: supports
  - source_id: r815-primary-pdf
    locator: frobenius_weight_error_sq and activation_recon_error_sq
    relation: supports
- claim_id: ipq-sequential-layer-quantization-and-codeword-distillation
  kind: mechanism
  statement: For convolutional layers W in R^{C_out x C_in x K x K}, iPQ reshapes filters spatially into subvectors of dimension d = K x K (or 2*K*K), quantizes layers sequentially using activations forwarded through already-quantized lower layers, and fine-tunes fixed-assignment codewords under teacher-student KL divergence L = KL(y_s, y_t) via averaged subvector gradients c <- c - eta * (1/|I_c|) sum_{p in I_c} dL/db_p (Eq. 5), followed by global centroid fine-tuning with BatchNorm running-statistics adaptation.
  evidence:
  - source_id: r815-primary-pdf
    locator: Section 3.2-3.4, Figure 2 and Equation 5, pp. 4-5
    relation: supports
  - source_id: r815-primary-pdf
    locator: codeword_distillation_step and layer_storage_bytes
    relation: supports
- claim_id: ipq-resnet50-and-mask-rcnn-byte-aligned-compression
  kind: application
  statement: Using byte-aligned codebooks (k = 256 centroids, 1 byte per subvector index), iPQ compresses a semi-supervised ResNet-50 by 20x to ~5 MB while preserving 76.12% ImageNet top-1 accuracy and compresses Mask R-CNN (ResNet-50 FPN) by 26x from 170 MB to 6.65 MB with 33.9 Box AP and 30.8 Mask AP.
  evidence:
  - source_id: r815-primary-pdf
    locator: Section 4.2-4.3, Tables 1-4 and Figure 3, pp. 6-8
    relation: supports
- claim_id: ipq-sequential-calibration-time-and-depthwise-conv-limitation
  kind: limitation
  statement: Because each layer's codebook depends on the quantized activations of all preceding layers and requires per-layer distillation fine-tuning (~2,500 iterations per layer), quantizing ResNet-50 takes ~1 GPU day on a V100, and architectures dominated by depthwise separable convolutions (such as MobileNets) exhibit lower spatial filter correlation for PQ than ResNets.
  evidence:
  - source_id: r815-primary-pdf
    locator: Section 2 (Dedicated architectures) and Section 4.1 (Experimental Setup), pp. 3, 6
    relation: supports
