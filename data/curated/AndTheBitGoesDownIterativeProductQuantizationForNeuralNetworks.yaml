id: AIMech:AndTheBitGoesDownIterativeProductQuantizationForNeuralNetworks
name: Iterative Product Quantization for Neural Networks (And the Bit Goes Down / Activation-Weighted PQ)
concept_kind: algorithm
review_status: DRAFT
definition: 'Iterative Product Quantization for Neural Networks (introduced in ''And the Bit Goes Down: Revisiting the Quantization of Neural Networks'', often denoted iPQ) is a structured vector quantization method that compresses deep neural networks sequentially from lowest to highest layer by partitioning weight columns (or spatially reshaped K x K convolutional filters) into contiguous d-dimensional subvectors, learning a byte-aligned codebook C via a weighted k-means EM algorithm that minimizes the in-domain output activation reconstruction error ||y - y_hat||_2^2 = sum_j ||x(w_j - q(w_j))||_2^2 on unlabelled input activations rather than Frobenius weight error, and fine-tuning the learned codewords both layer-by-layer and globally by averaging subvector gradients under a teacher-student Kullback-Leibler distillation loss.'
identity_notes: Distinct from classical weight-space Product Quantization (Gong et al., 2014), which minimizes Frobenius weight error ||W - W_hat||_2^2 (Eq. 1) and suffers catastrophic accuracy drift across deep layers, and distinct from Quant-Noise (AIMech:QuantNoiseTrainingWithQuantizationNoiseForExtremeCompression), which applies quantization noise to random weight blocks during training to preserve unbiased gradient flow.
aliases:
- Iterative Product Quantization for Neural Networks
- And the Bit Goes Down Activation-Weighted Product Quantization
- Activation-Weighted Product Quantization with Codebook Distillation
