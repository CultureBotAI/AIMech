- claim_id: closed-testing-specialization-simes-shortcut-equivalence-and-unbalancedness
  kind: mechanism
  statement: 'The Goeman & Solari (2011) closed-testing post hoc bound V_bar^{GS}_alpha(R) is
    recovered as a special case of V^*_{R_ref}(R) by taking R_ref = (R_1, ..., R_K) to be the
    superset-closed collection of intersection hypotheses rejected at local level alpha with zeta_k
    = |R_k| - 1 (Section 2.2, pp. 6-7 in v3; Section 8.1-8.2, Equations 38-39 in v2), while for
    Simes-type local tests phi_I(X) = 1{exists i in {1, ..., |I|} : p_{(i:I)} <= c_i^{|I|}} with
    monotonic critical values c_i^ell <= c_i^k (ell >= k) and c_i^ell <= c_j^ell (i <= j), the
    polynomial-time Goeman-Solari shortcut V_bar^{GS}_alpha(R) = |R| - (1 + max{S_r, 1 <= r <=
    |R|}) vee 0 with S_r = max{0 <= s <= r-1 : p_{(r:R)} <= c_{r-s}^m} is algebraically identical
    to the threshold-based reference-family bound V_bar_{R_ref}(R) = min_{1 <= k <= m} (sum_{i
    in R} 1{p_i > c_k^m} + k - 1) wedge |R| with R_k = {i in N_m : p_i <= c_k^m} and zeta_k =
    k - 1 (Section 8.3, Lemmas 8.1-8.2, Equations 40-41 in v2). Under PRDS (with c_m = 1) or arbitrary
    dependence (with Hommel factor c_m = sum_{i=1}^m 1/i), the canonical Simes reference family
    R^0_k(X) = {i in N_m : p_i < alpha k / (m c_m)} controls JER at level alpha (Section 4.1,
    Theorem 4.1, Equations 15-18 in v3), with exact equality JER(R^0, P) = alpha under i.i.d.
    U(0,1) global null (m_0 = m, c_m = 1), but exhibits severe conservativeness under positive
    Gaussian equicorrelation (achieving only 0.73 alpha at rho = 0.2 and 0.39 alpha at rho = 0.8
    for m = 1000, alpha = 0.2, Table 1) and exponential rank unbalancedness P(p_{(k:m)} <= alpha
    k/m) <= exp(-(k/4)(1 - alpha - 1/(m+1))^2) where k = 1 alone consumes 1 - (1 - alpha/m)^m
    = alpha + o(alpha) of the error budget (4.9e-2 at k = 1 vs. 6.6e-6 at k = 5 and 5.8e-93 at
    k = 100 for m = 1000, alpha = 0.05, Section 4.2-4.3, Tables 1-2 in v3; Appendix A.1, Proposition
    A.1(iv), Equation 44 in v2).'
