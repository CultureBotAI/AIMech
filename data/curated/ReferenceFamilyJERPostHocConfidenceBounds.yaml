claims:
- claim_id: reference-family-jer-interpolation-equivalence-np-hardness-and-nested-optimality
  kind: mechanism
  statement: 'For any data-dependent reference family R_ref = (R_k(X), zeta_k(X))_{1 <= k <= K}
    of subsets R_k subset N_m and integers zeta_k, the joint error rate event E(R_ref, H_0) =
    {forall k = 1, ..., K, |R_k(X) cap H_0| <= zeta_k(X)} is identical as a random event to both
    {forall R subset N_m, |R cap H_0| <= V^*_{R_ref}(R)} and {forall R subset N_m, |R cap H_0|
    <= V_bar_{R_ref}(R)} = {S_bar_{R_ref}(H_0) = 0}, where V^*_{R_ref}(R) = max_{A in A(R_ref)}
    |R cap A| over A(R_ref) = {A subset N_m : forall k, |R_k cap A| <= zeta_k} and V_bar_{R_ref}(R)
    = min_{1 <= k <= K} (|R \ R_k| + zeta_k) wedge |R| (Section 2.2, Proposition 2.1, Equations
    4-9 in v3; Section 2.2, Proposition 2.1, Equations 4-9 and Appendix B.1 in v2). Computing
    the worst-case bound V^*_{R_ref}(R) for an arbitrary reference family is NP-hard by reduction
    from Maximum Independent Set on a graph G = (N_m, E) with 2-element edge sets |R_e| = 2, zeta_e
    = 1, and R = N_m (Section 2.3, Proposition 2.3 in v3; Proposition 2.2 and Appendix B.1 in
    v2, where on a 3-vertex triangle graph V^*_{R_ref}({1,2,3}) = 1 < 2 = V_bar_{R_ref}({1,2,3})).
    Replacing zeta_k by the tightened reference bounds tilde{zeta}_k = V_bar_{R_ref}(R_k) = min_j
    (|R_k \ R_j| + zeta_j) wedge |R_k| <= zeta_k yields the exact self-consistency idempotence
    V_bar_{tilde{R_ref}}(R) = V_bar_{R_ref}(R) for all R subset N_m (Proposition 2.4 in v3 / Proposition
    2.3 in v2), while whenever the reference sets are nested (R_k subset R_{k''} for k <= k''),
    the polynomial-time bound is exact: V_bar_{R_ref}(R) = V^*_{R_ref}(R) for every R subset N_m
    (Proposition 2.5 in v3 / Proposition 2.4 and Appendix B.1 in v2), and the only non-empty sets
    R admissible with respect to V_bar_{R_ref} (satisfying forall R'' supsetneq R, V_bar(R'')
    > V_bar(R) and forall R'' subsetneq R, S_bar(R'') < S_bar(R)) belong to the reference family
    {R_1, ..., R_K} (Section 8.4 in v3).'
