- claim_id: threshold-templates-and-single-step-and-step-down-lambda-calibration
  kind: mechanism
  statement: 'For any size-K one-parameter threshold template t_k(lambda), 1 <= k <= K, that is
    non-decreasing and left-continuous on [0, 1] with t_k(0) = 0 and generalized inverse t_k^{-1}(y)
    = max{x in [0, 1] : t_k(x) <= y} (Definition 5.1), the JER of R_lambda = ({i in N_m : p_i(X)
    < t_k(lambda)})_{1 <= k <= K} satisfies JER(R_lambda, P) = P_{X~P}(min_{1 <= k <= K wedge
    m_0} t_k^{-1}(p_{(k:H_0)}(X)) < lambda) (Lemma 5.2, Equation 20). Any functional lambda(alpha,
    A) that is set-non-increasing in A (A subset A'' implies lambda(alpha, A'') <= lambda(alpha,
    A)) and satisfies P_{X~P}(min_{1 <= k <= K wedge m_0} t_k^{-1}(p_{(k:H_0(P))}(X)) < lambda(alpha,
    H_0(P))) <= alpha (Definition 5.3, Equations 21-22) guarantees exact level-alpha JER control
    both for the single-step calibration lambda(alpha, N_m) (Proposition 5.4) and for the step-down
    fixed point A_hat of Algorithm 1 defined by A^{(0)} = N_m, lambda_j = lambda(alpha, A^{(j-1)}),
    A^{(j)} = {i in N_m : p_i(X) >= t_1(lambda_j)} until A^{(j)} = A^{(j-1)} (Proposition 5.5;
    reducing to the Romano-Wolf step-down FWER procedure when K = 1, Remark 5.6). Under known
    null dependence (LeastFavor: p_i(X) >= q_i(X) for i in H_0(P) with q ~ nu_m independent of
    P), deterministic quantile calibration lambda(alpha, A) = max{lambda >= 0 : P_{q~nu_m}(min_{1
    <= k <= K wedge |A|} t_k^{-1}(q_{(k:A)}) < lambda) <= alpha} is a valid lambda-calibration
    (Section 5.3, Theorem 5.7, Equations 23-24); under unknown dependence with finite group invariance
    (Rand: (p_{H_0}(g''.X))_{g'' in G} ~ (p_{H_0}(g''.g.X))_{g'' in G} for g in G, such as sign-flipping
    G = {-1, 1}^n), drawing B transformations (g_1 = id, g_2, ..., g_B i.i.d. uniform on G) and
    setting lambda(alpha, A) = Psi_{(floor(alpha B) + 1)} of Psi(g_j.X, A) = min_{1 <= k <= K
    wedge |A|} t_k^{-1}(p_{(k:A)}(g_j.X)) controls JER at level floor(alpha B)/B <= alpha for
    any deterministic template (Section 5.4, Theorem 5.8, Equation 25, and Appendix A, pp. 26-27
    in v3).'
