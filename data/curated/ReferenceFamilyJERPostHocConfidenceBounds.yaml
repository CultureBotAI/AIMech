- claim_id: linear-vs-balanced-template-asymptotic-conservativeness-and-higher-criticism-detection-optimality
  kind: mechanism
  statement: 'Instantiating the template with the linear family t_k^L(lambda) = lambda k/m yields
    R^L and R^{L,sd} (Section 6.1, Equations 26-28 in v3), whereas the balanced template t_k^B(lambda)
    = F_k^{-1}(lambda) with F_k(x) = P_{q~nu_m}(q_{(k:m)} <= x) equalizes marginal k-FWER violation
    probabilities across k = 1, ..., K under the global null and satisfies alpha/K <= lambda^B(alpha,
    N_m) <= alpha (Section 6.2, Equations 29-31 in v3; Section 5.2, Equations 29-33 in v2). Under
    independence with K = m, Proposition A.1 and Lemmas A.2-A.3 (v2 Appendix A.1-A.2, Equations
    42-46) prove that t_k^B(lambda) >= k/(m+1) - (k/(m+1)(1 - k/(m+1)))^{1/2} m^{-1/2} (4 log(1/lambda))^{1/2},
    that lambda^B(alpha, N_m) <= (log m)^{-1/4} -> 0, and that for fixed pi_0 = m_0/m in (0, 1)
    the single-step balanced JER collapses at rate P(exists k <= m_0 : q_{(k:m_0)} < t_k^B(lambda^B(alpha)))
    <= C(pi_0) (log m)^{-1/8} -> 0 because P(p_{(k:m_0)} <= t_k^B(lambda)) <= exp(-(k/32)(1 -
    m_0/m)^2), making either template truncation K < m or step-down calibration R^{B,sd} essential
    to recover nominal level alpha (Section 5.3 in v2; Sections 6.2, 7.1, and 8.1 in v3). Furthermore,
    in the Donoho-Jin (2004) sparse Gaussian mixture H_i ~ B(m^{-beta}), mu_m = sqrt(2 r log m)
    with beta in (1/2, 1), Theorem 7.2 (v2 Section 7.3, Equations 35-37 and Appendix B.2) proves
    that the balanced family R^B with K = m achieves optimal detection power Pow^*(R^B, P) = P(S_bar_{R^B}(N_m)
    >= 1) -> 1 for all r > rho^*(beta) = (beta - 1/2) 1_{(1/2, 3/4]}(beta) + (1 - sqrt(1 - beta))^2
    1_{(3/4, 1)}(beta), whereas the linear family R^L (Theorem 7.3 and Appendix B.3) is asymptotically
    powerless (limsup Pow^*(R^L, P) <= alpha) throughout the sparse-weak regime beta - 1/2 < r
    < (1 - sqrt(1 - beta))^2.'
