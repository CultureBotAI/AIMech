aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Reference-family JER control provides user-agnostic post hoc upper bounds V(R) on
    false positives valid simultaneously over all 2^m subsets R subset N_m, directly preventing
    selection-effect and data-snooping invalidation (AIO:DataDredgingBias).
limitations:
- For general non-nested reference families R_ref = (R_k, zeta_k)_{1 <= k <= K} (such as arbitrary
  closed-testing intersection families with zeta_k = |R_k| - 1), computing the optimal worst-case
  bound V^*_{R_ref}(R) is NP-hard (Proposition 2.3 in v3 / Proposition 2.2 in v2), and the polynomial-time
  bound V_bar_{R_ref}(R) can be strictly looser than V^*_{R_ref}(R) (e.g., V_bar = 2 > 1 = V^*
  on a 3-vertex triangle graph).
- Theorem 5.8 establishes exact finite-sample JER control under unknown dependence (Rand) only
  when the threshold template t_k(lambda) is deterministic (such as the linear template t_k^L(lambda)
  = lambda k/m); for the data-dependent balanced template t_k^B(X, lambda) estimated by permutations
  or sign-flipping, marginal invariance of t_k(g.X, lambda) and p_{H_0}(g.X) does not imply joint
  invariance of ((t_k(X, lambda))_{1 <= k <= K}, p_{H_0}(X)), leaving an open theoretical gap
  shared with Theorem 1 (Equation 12) of Meinshausen (2006) (Section 6.2, Remark 6.2, p. 19 in
  v3; Section 9, p. 25, Footnote 2 in v2).
- Under independence with full template size K = m and non-trivial signal proportion pi_0 < 1,
  the single-step balanced calibration lambda^B(alpha, N_m) <= (log m)^{-1/4} yields an achieved
  JER that decays to zero at rate O((log m)^{-1/8}) (Lemmas A.2-A.3 in v2), requiring either step-down
  calibration R^{B,sd} or smaller template size K < m; conversely, naively updating the balanced
  template t_k^B(lambda, A^{(j)}) inside the step-down loop can destroy set monotonicity in H_0
  (Section 8.2, p. 24 in v3).
- 'All 29 pages of arXiv:1703.02307v3 and all 34 pages of arXiv:1703.02307v2 were read in full
  text. Three minor typographical slips in the primary sources were identified and corrected in
  our verification: (1) Remark 2.2 (v3 p. 8) writes ''for any R in N_m'' instead of ''R subset
  N_m'' and ''S_bar(R) := |R| - S_bar(R)'' instead of ''S_bar(R) := |R| - V_bar(R)'' (as correctly
  printed in v2 p. 5 Equation 7 and v3 p. 22), (2) Section 7.1 (v3 p. 19) describes the empirical
  JER violation event as ''|R_k(X) cap H_0(P)| > k'' instead of ''|R_k(X) cap H_0(P)| > zeta_k
  = k - 1'' (i.e. >= k, corresponding to Equations 1, 5, and 13), and (3) Appendix A Proof of
  Theorem 5.8 (v3 p. 26) writes ''1 <= j <= m'' instead of ''1 <= j <= B'' for the index range
  of Y_j = Psi(g_j.X, H_0) and Psi(g''_j.X, H_0). Constructed numerical checks in research/discovery/reference-family-jer-post-hoc-confidence-bounds-boundaries.py
  verify: (1) triangle-graph NP-hardness gap V^* = 1 < V_bar = 2, self-consistency idempotence
