id: AIMech:ReferenceFamilyJERPostHocConfidenceBounds
name: Reference-family joint error rate post hoc confidence bounds
aliases:
- Joint Family-Wise Error Rate Reference-Family Post Hoc Inference
- JER-Controlled Reference Family Post Hoc False-Positive Bounds
- Blanchard-Neuvial-Roquain Reference-Family Post Hoc Confidence Bounds
- Single-Step and Step-Down Lambda-Calibrated Reference-Family JER Control
concept_kind: mathematical_method
definition: A user-agnostic post hoc multiple-testing and selective-inference framework introduced
  by Gilles Blanchard, Pierre Neuvial, and Etienne Roquain (2020, The Annals of Statistics 48(3):1281-1303,
  arXiv:1703.02307v3/v2, DOI:10.1214/19-AOS1847) that constructs simultaneous level-(1 - alpha)
  upper confidence bounds V(R) on the number of false positives |R cap H_0(P)| (and complementary
  lower bounds S(R) = |R| - V(R) on true discoveries |R cap H_1(P)|) valid uniformly over all
  2^m candidate subsets R subset N_m = {1, ..., m}. Given a reference family R_ref = (R_k(X),
  zeta_k(X))_{1 <= k <= K} with controlled Joint Family-Wise Error Rate JER(R_ref, P) = 1 - P_{X~P}(forall
  k in {1, ..., K}, |R_k(X) cap H_0(P)| <= zeta_k(X)) <= alpha, the framework interpolates from
  R_ref to arbitrary user-selected sets R via both the worst-case optimal bound V^*_{R_ref}(R)
  = max_{A in A(R_ref)} |R cap A| and the polynomial-time bound V_bar_{R_ref}(R) = min_{1 <= k
  <= K} (|R \ R_k| + zeta_k) wedge |R|, proving exact event equivalence E(R_ref, H_0) = {forall
  R subset N_m, |R cap H_0| <= V_bar_{R_ref}(R)} = {forall R subset N_m, |R cap H_0| <= V^*_{R_ref}(R)}
  (Proposition 2.1), NP-hardness of V^*_{R_ref}(R) in general (Proposition 2.3), self-consistency
  idempotence V_bar_{tilde{R_ref}}(R) = V_bar_{R_ref}(R) (Proposition 2.4), and exact optimality
  V_bar_{R_ref}(R) = V^*_{R_ref}(R) whenever the reference regions R_1 subset ... subset R_K are
  nested (Proposition 2.5), while calibrating p-value threshold templates t_k(lambda) (linear
  t_k^L(lambda) = lambda k/m and balanced Beta-quantile t_k^B(lambda) = F_k^{-1}(lambda)) via
  single-step lambda(alpha, N_m) and step-down Algorithm 1 lambda(alpha, A_hat) under known dependence
  (LeastFavor, Theorem 5.7) or unknown dependence via finite transformation groups (Rand, Theorem
  5.8).
identity_notes: No normalized identity match for reference-family joint error rate post hoc confidence
  bounds across all 442 pinned AIO records and 601 maintained IDs, names, aliases and scoped synonyms.
  Fixed-string searches across data, sources, research, history, and reviews returned only frontier
  references in the Round 207 discovery report and review. Distinct from AIMech:SimultaneousPathwiseFalseDiscoveryProportionBounds
  (Katsevich & Ramdas 2020, The Annals of Statistics 48(6):3465-3487), which constructs simultaneous
  FDP bounds across a single pre-ordered nested path emptyset = R_0 subset R_1 subset ... subset
  R_m via Poissonized empirical-process and exponential supermartingale inequalities (and applies
  closed-testing interpolation only along that path) rather than user-agnostic interpolation over
  all 2^m arbitrary subsets R subset N_m from a JER-controlled reference family (R_k, zeta_k)_{1
  <= k <= K} with single-step and step-down lambda-calibration under LeastFavor and Rand; distinct
  from AIMech:HadamardDifferentiableThresholdFDPAsymptoticsAndFixedPointDuality (Neuvial 2008),
  which establishes asymptotic Gaussian CLTs for the FDP of a single data-dependent threshold
  T(G_hat_m) under independence rather than non-asymptotic simultaneous post hoc bounds P(forall
  R subset N_m, |R cap H_0(P)| <= V(R)) >= 1 - alpha; and distinct from AIMech:AdaptiveSimesStepUpFDRControlUnderIndependence
  (Benjamini, Krieger, & Yekutieli 2006) and AIMech:DependencyRobustFalseDiscoveryRateControl
  (Benjamini & Yekutieli 2001), which control expected FDR = E[FDP] for a single fixed rejection
  set rather than controlling the joint family-wise error rate JER(R_ref, P) <= alpha to provide
  post hoc confidence bounds for any post-selection subset R.
