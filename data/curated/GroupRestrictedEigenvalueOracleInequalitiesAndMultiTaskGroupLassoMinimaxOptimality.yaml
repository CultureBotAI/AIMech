claims:
- claim_id: group-re-cone-oracle-inequalities-and-multi-task-chi-square-gain
  kind: mechanism
  statement: By Lemma 3.1 (pp. 9-10), whenever the empirical group noise scores satisfy $\frac{2}{n}\|(X^\top W)^j\|_2 \le \lambda_j = 2c_j\lambda$ for all $j = 1, \dots, M$, the Group Lasso error $\Delta = \hat{\beta} - \beta^*$ lies in the weighted block-$\ell_{2,1}$ cone $\sum_{j \in S^c} c_j\|\Delta^j\|_2 \le 3\sum_{j \in S} c_j\|\Delta^j\|_2$ ($S = S(\beta^*)$, $|S| \le s$) and satisfies the KKT optimality conditions $\frac{2}{n}(X^\top(X\hat{\beta} - Y))^j + \lambda_j \frac{\hat{\beta}^j}{\|\hat{\beta}^j\|_2} = 0$ on $\hat{\beta}^j \ne 0$ and $\frac{2}{n}\|(X^\top(X\hat{\beta} - Y))^j\|_2 \le \lambda_j$ on $\hat{\beta}^j = 0$ (Proposition 2.1, p. 6). Under Assumption 3.1 ($RE(s, \mathbf{c})$ with constant $\kappa(s, \mathbf{c}) > 0$), Theorem 3.1 (p. 11) and Corollary 4.1 (p. 15) establish that for $T$-task regression ($n = NT$) with Gaussian noise and threshold $\lambda = \frac{2\sigma}{\sqrt{NT}}\sqrt{1 + \frac{A\log M}{\sqrt{T}}}$ ($A > \sqrt{8}$), with probability at least $1 - 2M^{1 - A^2/8}$, $\frac{1}{NT}\|X(\hat{\beta} - \beta^*)\|_{\mathrm{Fr}}^2 \le \frac{64\sigma^2 s}{\kappa_{\mathrm{MT}}^2(s)\,N}\left(1 + \frac{A\log M}{\sqrt{T}}\right)$ and $\sum_{j=1}^M \frac{1}{\sqrt{T}}\|\hat{\beta}^j - \beta^{*j}\|_2 \le \frac{32\sigma s}{\kappa_{\mathrm{MT}}^2(s)\sqrt{N}}\sqrt{1 + \frac{A\log M}{\sqrt{T}}}$, eliminating the $\log M$ penalty as the number of tasks $T$ grows relative to $(\log M)^2$.
