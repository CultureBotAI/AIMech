limitations:
- "A subtle logarithmic gap remains between the Corollary 4.1 multi-task Group Lasso upper bound $O\\left(\\frac{\\sigma^2 s}{N}\\left(1 + \\frac{\\log M}{\\sqrt{T}}\\right)\\right)$ (under equal deterministic penalty weights $c_j = 1$) and the Theorem 6.1 minimax lower bound $\\Omega\\left(\\frac{\\sigma^2 s}{N}\\left(1 + \\frac{\\log(eM/s)}{T}\\right)\\right)$ in the intermediate regime $\\log(eM/s) \\le T \\le (\\log M)^2$; closing this $\\sqrt{T}$ vs. $T$ denominator gap requires the larger penalty choice $\\lambda = \\frac{2\\sigma}{\\sqrt{NT}}\\sqrt{1 + \\frac{A\\log M}{T} + \\sqrt{\\frac{2A\\log M}{T}}}$ from the Laurent\u2013Massart chi-square tail bound (Remark 4.1, p. 16)."
- Exact group support recovery via hard thresholding in Theorem 5.1 requires the stringent block-coherence condition $\theta = \max_{j \ne k} \frac{1}{N}\|(X_t^j)^\top X_t^k\|_{2 \to 2} \le \frac{1}{7s}$ (scaling inversely with $s$) and a beta-min condition $\min_{j \in S(\beta^*)} \frac{1}{\sqrt{T}}\|\beta^{*j}\|_2 > 2a_0\lambda\sqrt{T}$, whereas prediction and $\ell_{2,1}$ estimation require only $RE(s, \mathbf{c})$.
- 'Primary-source typographical audit of `arXiv:1007.1771v3`: (1) Section 2 display above Eq. (2.3) (p. 6) writes ''$\frac{1}{n}\|X\beta - Y\|_n^2 + \sum_{j=1}^M \lambda_j\|\hat{\beta}^j\|_2$'', mixing $\beta$ on the left with $\hat{\beta}^j$ in the penalty; (2) Section 2.1 last sentence (p. 8) duplicates ''have not been been put forward''; (3) Proof of Lemma 3.1 line 15 (p. 10) writes ''$\|\Psi\|_{\mathrm{Fr}}$'' missing the group superscript $j$; (4) Proof of Theorem 3.2 line 3 (p. 14) introduces an unused ''Let $y > 0$ be arbitrary''; (5) Proof of Corollary 5.1 line 1 (p. 20) writes ''$\Delta = \hat{\beta} - \beta$'' instead of ''$\hat{\beta} - \beta^*$''; (6) Theorem 7.1 Eq. (7.4) (p. 25) writes ''$j \in \mathbb{N}_m$'' instead of ''$j \in \mathbb{N}_K$''; (7) Theorem 8.1 last display (p. 28) writes ''$\kappa^2(2s)$'' instead of ''$\kappa_{\mathrm{MT}}^2(2s)$''; and (8) Proof of Lemma 9.1 second display (p. 32) prints ''$\max_{1\,6\,j\le M}$'' with digit ''6'' for ''$\le$''.'
