- claim_id: block-coherence-l2-infinity-bound-and-exact-group-support-recovery
  kind: mechanism
  statement: 'Under the block diagonal normalization $\frac{1}{N} (X_t^j)^\top X_t^j = I_{d_j}$ and the block-coherence condition $\theta := \max_{j \ne k} \frac{1}{N} \|(X_t^j)^\top X_t^k\|_{2 \to 2} \le \frac{1}{7s}$ (Assumption 5.1, p. 18), Assumption $RE(s, 1)$ holds automatically with $\kappa_{\mathrm{MT}}(s) = \sqrt{1 - 7s\theta}$, and Theorem 5.1 (pp. 19-20) proves the uniform group-$\ell_{2,\infty}$ error bound $\max_{1 \le j \le M} \frac{1}{\sqrt{T}}\|\hat{\beta}^j - \beta^{*j}\|_2 \le a_0 \lambda \sqrt{T}$ where $a_0 = \frac{3}{2} + \frac{16 s \theta}{1 - 7s\theta}$. Consequently, if the minimum nonzero group energy satisfies $\min_{j \in S(\beta^*)} \frac{1}{\sqrt{T}}\|\beta^{*j}\|_2 > 2 a_0 \lambda \sqrt{T}$, the hard-thresholded Group Lasso estimator $\tilde{S} = \left\{j : \frac{1}{\sqrt{T}}\|\hat{\beta}^j\|_2 > a_0 \lambda \sqrt{T}\right\}$ recovers the exact sparsity pattern $\tilde{S} = S(\beta^*)$ with probability at least $1 - 2M^{1 - A^2/8}$ (Theorem 5.1 and Corollary 5.1, pp. 19-21).'
