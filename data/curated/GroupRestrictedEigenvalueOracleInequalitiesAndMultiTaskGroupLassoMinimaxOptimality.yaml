id: AIMech:GroupRestrictedEigenvalueOracleInequalitiesAndMultiTaskGroupLassoMinimaxOptimality
name: Group Restricted Eigenvalue Oracle Inequalities and Multi-Task Group Lasso Minimax Optimality
concept_kind: mathematical_method
review_status: DRAFT
definition: 'A non-asymptotic oracle inequality, group support recovery, and minimax optimality framework for Group Lasso and multi-task sparse linear learning (introduced by Karim Lounici, Massimiliano Pontil, Sara van de Geer, and Alexandre B. Tsybakov in 2011) that analyzes the block-$\ell_{2,1}$-penalized estimator $\hat{\beta} = \arg\min_{\beta \in \mathbb{R}^p} \left\{\frac{1}{n}\|Y - X\beta\|_n^2 + \sum_{j=1}^M \lambda_j \|\beta^j\|_2\right\}$ across $M$ coordinate groups $G_1, \dots, G_M$ of sizes $d_1, \dots, d_M$ under a Group Restricted Eigenvalue condition $RE(s, \mathbf{c})$: $\kappa(s, \mathbf{c}) = \min_{J_0 \subseteq \{1,\dots,M\}, |J_0| \le s} \min_{\Delta \ne 0,\, \sum_{j \in J_0^c} c_j\|\Delta^j\|_2 \le 3\sum_{j \in J_0} c_j\|\Delta^j\|_2} \frac{\|X\Delta\|_n}{\|\Delta^{J_0}\|_2} > 0$. By Theorem 3.1, when the group weights $\lambda_j = 2 c_j \lambda$ dominate the empirical group score norms $\frac{2}{n}\|(X^\top \varepsilon)^j\|_2 \le c_j \lambda$, the Group Lasso satisfies simultaneous prediction and $\ell_{2,1}$ estimation bounds $\frac{1}{n}\|X(\hat{\beta} - \beta^*)\|_n^2 \le \frac{16\lambda^2}{\kappa^2(s, \mathbf{c})} \sum_{j \in S(\beta^*)} c_j^2$ and $\sum_{j=1}^M c_j\|\hat{\beta}^j - \beta^{*j}\|_2 \le \frac{16\lambda}{\kappa^2(s, \mathbf{c})} \sum_{j \in S(\beta^*)} c_j^2$, as well as $2s$-sparse group selection via hard thresholding (Theorem 3.2). In the $T$-task regression setting ($d_j = T$, $n = N T$) with equal group weights $c_j = 1$ and threshold $\lambda = \frac{2\sigma}{\sqrt{NT}}\sqrt{1 + \frac{A}{\sqrt{T}}\log M}$ ($A > \sqrt{8}$), Corollary 4.1 proves per-task prediction and $\ell_{2,1}$ rates $\frac{1}{NT}\|X(\hat{\beta} - \beta^*)\|_{\mathrm{Fr}}^2 \lesssim \frac{\sigma^2 s}{N}\left(1 + \frac{\log M}{\sqrt{T}}\right)$ that match the non-asymptotic minimax lower bound $\frac{\sigma^2 s}{N}\left(1 + \frac{\log(eM/s)}{T}\right)$ of Theorem 6.1 up to logarithmic constants and strictly dominate separate-task LASSO rates $\frac{\sigma^2 s \log(MT)}{N}$ whenever $T$ grows.'
identity_notes: Resolved against all 442 pinned AIO concepts and 661 maintained AIMech concepts. Distinct from `AIMech:GroupLassoBlockCoordinateDescent` (Yuan & Lin 2006 / Meier, van de Geer, & Buhlmann 2008, which formulates the Group Lasso objective and block coordinate descent optimization without the Group Restricted Eigenvalue $RE(s, \mathbf{c})$ condition, multi-task $O(\frac{s}{N}(1 + \frac{\log M}{T}))$ minimax lower bounds, block-coherence $\ell_{2,\infty}$ group support recovery, or random-design $\kappa_{\mathrm{MT}}(s)$ transfer), distinct from `AIMech:BickelRitovTsybakovRestrictedEigenvalueConditionAndLassoDantzigOracleBounds` (Bickel, Ritov, & Tsybakov 2009, which defines the coordinate-wise $\ell_1$ Restricted Eigenvalue condition for standard Lasso and Dantzig selector rather than the block-$\ell_{2,1}$ cone $\sum_{j \in J_0^c} c_j\|\Delta^j\|_2 \le 3\sum_{j \in J_0} c_j\|\Delta^j\|_2$ and multi-task chi-square concentration $\sqrt{1 + \frac{A}{\sqrt{T}}\log M}$), distinct from `AIMech:SparseAdditiveModelsAndRavikumarLiuLaffertyWassermanSpAMBackfitting` (Ravikumar et al. 2009, nonparametric additive component backfitting), and distinct from `AIMech:DirtyModelMultiTaskLearningWithSharedAndTaskSpecificSparsity` (Jalali et al. 2010, $\ell_{1,\infty} + \ell_{1,1}$ superposition decomposition under mutual incoherence).
