- claim_id: multi-task-minimax-lower-bound-random-design-re-transfer-and-subgaussian-maximal-inequality
  kind: mechanism
  statement: 'By Theorem 6.1 (pp. 21-24), over the $s$-group-sparse multi-task class $B_0(s) = \{\beta : |S(\beta)| \le s\}$, any estimator $\tilde{\beta}$ satisfies the non-asymptotic minimax lower bound $\inf_{\tilde{\beta}} \sup_{\beta^* \in B_0(s)} \mathbb{P}\left(\frac{1}{NT}\|X(\tilde{\beta} - \beta^*)\|_{\mathrm{Fr}}^2 \ge C\frac{\sigma^2 s}{N}\left(1 + \frac{\log(eM/s)}{T}\right)\right) \ge \frac{1}{2} - \frac{\log 2}{\log(eM/s)}$ (and analogously for $\frac{1}{T}\|\tilde{\beta} - \beta^*\|_{\mathrm{Fr}}^2$). Furthermore, Theorem 8.1 (pp. 28-31) proves that for i.i.d. isotropic subgaussian random designs whose population covariance $\Sigma$ satisfies $RE(2s, 3)$ with constant $\kappa(2s) > 0$, the empirical design $X$ satisfies $RE(s, 1)$ with $\kappa_{\mathrm{MT}}(s) \ge \kappa(2s)/\sqrt{2}$ with high probability once $N \gtrsim s^2 \log M$, and Lemma 9.1 (pp. 31-32) establishes the maximal moment inequality $\left(\mathbb{E}\max_{1 \le j \le M} \|\xi_j\|_2^{2m}\right)^{1/(2m)} \le \sigma\sqrt{T + 2\sqrt{T}\,\tilde{L}_{M,m} + 2\tilde{L}_{M,m}}$ with $\tilde{L}_{M,m} = \log M + m\log(2m) + 3$ for subgaussian noise.'
