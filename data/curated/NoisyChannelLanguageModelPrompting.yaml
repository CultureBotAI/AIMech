id: AIMech:NoisyChannelLanguageModelPrompting
name: Noisy Channel Language Model Prompting
concept_kind: algorithm
review_status: DRAFT
definition: 'A few-shot language model prompting and prompt-tuning method for text classification that applies Bayes'' rule under a uniform class prior P(c_i) = 1/|C| to reparameterize class prediction arg max_{c_i in C} P(c_i | x) as maximizing the conditional probability of generating the entire input text x given the verbalized label v(c_i): P_LM(x | v(c^1), x^1, ..., v(c^K), x^K, v(c_i)) in concatenation-based demonstrations, prod_{j=1}^K P_LM(x | v(c^j), x^j, v(c_i)) in ensemble-based demonstrations, or P_LM(x | u_1...u_n, v(c_i)) in channel prompt tuning with trainable prefix embeddings u_1...u_n and frozen causal LM weights.'
identity_notes: Distinct from direct prompting and direct Prompt Tuning (AIMech:InContextLearning, AIMech:PromptTuning), which compute P_LM(v(c_i) | x) and collapse when training labels are imbalanced or when test labels are unseen during training, and from zero-shot Domain Conditional PMI (Holtzman et al., EMNLP 2021, AIMech:PMIDCDomainConditionalPointwiseMutualInformation), which reweights zero-shot direct continuations by a domain premise rather than training continuous channel prompts u_1...u_n or multiplying K reversed demonstration likelihoods.
aliases:
- Noisy Channel Prompting
- Channel Prompt Tuning
- Noisy Channel Language Model Prompting for Few-Shot Classification
- Generative Channel Model Prompting and Ensemble Demonstrations
