id: AIMech:DeepImpactLearningPassageImpactsForInvertedIndexes
name: DeepImpact Learning Passage Impacts for Inverted Indexes
concept_kind: algorithm
review_status: DRAFT
definition: A learned sparse impact-scoring and inverted-index retrieval method that expands each passage offline with DocT5Query predicted queries concatenated after a [SEP] token, encodes the expanded passage with BERT, takes the contextualized representation of the first occurrence of each unique term (merging WordPiece sub-tokens into space-separated words by averaging their contextual representations), passes each unique term embedding through a two-layer ReLU multi-layer perceptron trained end-to-end via pairwise softmax cross-entropy loss on the sum-of-impacts query-document score over intersecting terms, and linearly quantizes the resulting positive impact scores into b-bit integers (b = 8) stored directly in standard inverted-index postings for fast query-independent top-k retrieval.
identity_notes: Distinct from DeepCT (AIMech:DeepCTContextAwareTermImportanceEstimationForFirstStageRetrieval), which trains per-token linear regression against static heuristic ground-truth term recall weights rather than end-to-end pairwise ranking over sum-of-impacts and requires BM25 scoring formulas at query time; and distinct from uniCOIL (AIMech:uniCOILUnifiedContextualizedInvertedList), which operates over WordPiece subword tokens and computes query-time contextualized query term weights rather than query-independent first-occurrence word-level impacts.
aliases:
- DeepImpact
- Learning Passage Impacts for Inverted Indexes
- DeepImpact Passage Impact Model
