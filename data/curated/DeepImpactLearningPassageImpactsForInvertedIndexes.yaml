claims:
- claim_id: deepimpact-first-occurrence-relu-mlp-and-sum-of-impacts-training
  kind: mechanism
  statement: DeepImpact concatenates each passage d with DocT5Query expansion terms separated by a [SEP] token, feeds the sequence into BERT (averaging WordPiece sub-tokens for multi-piece words), feeds only the contextualized embedding of the first occurrence of each unique term t in d into a two-layer MLP with ReLU activations to produce a single non-negative scalar impact score s_{t,d}, defines the query-document score as the sum of impacts over intersecting query-document terms score(q, d) = sum_{t in q cap d} s_{t,d}, and optimizes the encoder and MLP end-to-end via pairwise softmax cross-entropy loss over (q, d+, d-) triples (Section 2, Figure 1).
  evidence:
  - source_id: r776-primary-pdf
    locator: Section 2, Figure 1, pp. 2-3
    relation: supports
  - source_id: r776-primary-pdf
    locator: first_occurrence_positions(), compute_document_impacts(), sum_of_impacts_score(), and pairwise_softmax_ce_loss()
    relation: supports
- claim_id: deepimpact-linear-quantization-into-inverted-index-postings
  kind: mechanism
  statement: To support fast top-k query processing in standard inverted-index engines such as PISA using MaxScore without runtime BM25/TF-IDF computation, DeepImpact linearly scales positive real-valued impact scores (stored at 3 digits of precision) across the collection into b-bit integers in [1, 2^b - 1] (with b = 8 yielding [1, 255]) and stores each quantized integer directly in the frequency payload field of the inverted list alongside the document ID (Section 2).
  evidence:
  - source_id: r776-primary-pdf
    locator: Section 2 (Indexing and Quantization & Query Processing), pp. 2-3
    relation: supports
  - source_id: r776-primary-pdf
    locator: quantize_impacts_linear() and main() verification
    relation: supports
- claim_id: deepimpact-msmarco-and-trec-dl-effectiveness-and-speedup-application
  kind: application
  statement: On MS MARCO Dev and TREC DL 2019/2020, DeepImpact achieves 0.326 MRR@10 on MS MARCO Dev (up to +17.7% over DocT5Query at 0.277 and +34.2% over DeepCT at 0.243) and, when used as a first-stage retriever feeding a ColBERT re-ranker over k = 100 candidates, matches the end-to-end effectiveness of re-ranking k = 1000 BM25 candidates while achieving up to a 5.1x query latency speedup (Section 3, Tables 1-2).
  evidence:
  - source_id: r776-primary-pdf
    locator: Section 3, Tables 1-2, pp. 3-4
    relation: supports
- claim_id: deepimpact-offline-doct5query-expansion-dependency-limitation
  kind: limitation
  statement: Because DeepImpact only estimates impact scores for terms physically present in its input token sequence, bridging vocabulary mismatch depends on first running an external generative document-expansion model (DocT5Query) across the entire corpus prior to BERT impact scoring and inverted-index construction, and passages remain truncated at 300 tokens (Section 2).
  evidence:
  - source_id: r776-primary-pdf
    locator: Section 2 (Eliminating the Vocabulary Mismatch & Implementation Details), pp. 2-3
    relation: supports
