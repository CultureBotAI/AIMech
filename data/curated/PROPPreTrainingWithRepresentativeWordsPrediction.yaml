claims:
- claim_id: prop-dirichlet-unigram-poisson-word-set-sampling
  kind: mechanism
  statement: PROP grounds pseudo-query generation in classical query likelihood theory (Equations 1-3) by sampling a word-set size l ~ Poisson(lambda) (with lambda = 3) and drawing two word sets S_1 and S_2 of length l from the document's Dirichlet-smoothed unigram language model P(w | D) = (c(w, D) + mu P(w | C)) / (|D| + mu), labeling the set with higher product likelihood prod_{w_i in S} P(w_i | D) as the positive representative word set (Algorithm 1).
  evidence:
  - source_id: r764-primary-pdf
    locator: Section 2 & Section 3.1 Representative Word Sets Sampling, Equations 1-3, Algorithm 1, pp. 2-3
    relation: supports
  - source_id: r764-primary-pdf
    locator: main() verification of dirichlet_doc_lm normalization and log_query_likelihood ordering of paired word sets
    relation: supports
- claim_id: prop-pairwise-hinge-rop-and-mlm-joint-training
  kind: mechanism
  statement: Given an ordered pair of word sets (S_1, S_2) for document D, PROP feeds [CLS] + S_i + [SEP] + D + [SEP] through an L-layer Transformer encoder and an MLP over H^{[CLS]} (Equation 4) to optimize the pairwise margin hinge loss L_ROP = max(0, 1 - P(S_1 | D) + s(S_2 | D)) (Equation 5) jointly with Masked Language Modeling L_MLM (Equation 6), converging faster and achieving higher downstream nDCG than random vocabulary sampling or MLM alone (Tables 3 and 5, Figure 1).
  evidence:
  - source_id: r764-primary-pdf
    locator: Section 3.1 & Sections 4.6-4.7, Equations 4-6, Tables 3 & 5, Figure 1, pp. 3, 6-7
    relation: supports
  - source_id: r764-primary-pdf
    locator: main() verification of rop_hinge_loss margin satisfaction
    relation: supports
- claim_id: prop-adhoc-retrieval-and-low-resource-applications
  kind: application
  statement: Pre-trained on Wikipedia or MS MARCO documents, PROP significantly outperforms BM25, QL, BERT, and Transformer_ICT across Robust04, ClueWeb09-B, Gov2, MQ2007, and MQ2008, and when fine-tuned with only 10 to 30 labeled queries matches or exceeds BERT fine-tuned on the full query sets (Table 2, Figure 2).
  evidence:
  - source_id: r764-primary-pdf
    locator: Sections 4.5, 4.8 & 4.9, Tables 2 & 4, Figure 2, pp. 5-8
    relation: supports
  - source_id: r764-metadata-cr
    locator: BibTeX citation record for arXiv:2010.10137 (WSDM 2021, doi:10.1145/3437963.3441777)
    relation: supports
- claim_id: prop-unigram-term-independence-limitation
  kind: limitation
  statement: Because PROP samples representative word sets using a classical multinomial unigram language model that assumes term independence, it ignores contextual correlations between words in the document and requires manual heuristic preprocessing (INQUERY stopword removal, minimum frequency >= 50, and Word2Vec frequent-word subsampling at threshold 10^{-5}) to avoid sampling uninformative frequent terms.
  evidence:
  - source_id: r764-primary-pdf
    locator: Section 2 Equation 2 & Section 4.4.2 Pre-training Process, pp. 2, 5
    relation: supports
