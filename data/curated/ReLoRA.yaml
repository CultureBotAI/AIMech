claims:
- claim_id: relora-sum-of-ranks-periodic-merge-and-reinit
  kind: mechanism
  statement: ReLoRA exploits the subadditivity of matrix rank, rank(A + B) <= rank(A) + rank(B), by wrapping frozen linear layers W^i with rank-r factors (W_A^i, W_B^i) and every q steps merging the update W^i <- W^i + s W_A^i W_B^i into the base weights and reinitializing W_A^i with Kaiming initialization and W_B^i with zeros, accumulating a high-rank total update Delta W = sum_{k=1}^N s W_A^k W_B^k whose singular value spectrum closely matches full-rank training.
  evidence:
  - source_id: r682-primary-pdf
    locator: Section 2 Method, Eq. 1-2, Algorithm 1, and Section 4 Figures 3-4, p. 2-6
    relation: supports
- claim_id: relora-partial-optimizer-pruning-and-jagged-cosine-schedule
  kind: mechanism
  statement: To prevent historical Adam first and second moments (M_{W_A}, V_{W_A}) with high beta_1, beta_2 from constraining reinitialized factors W_A^{k+1} to the previous subspace while avoiding divergence from a full reset, ReLoRA prunes 90% to 99% of the lowest-magnitude optimizer state entries at each restart and pairs the reset with a jagged cosine learning rate schedule that drops the learning rate to zero and warms it back up over 50 to 100 steps.
  evidence:
  - source_id: r682-primary-pdf
    locator: Section 2 Method, Figure 2, Algorithm 1 Lines 17-20, and Section 4.2 Table 6, p. 2-4, 8
    relation: supports
- claim_id: relora-transformer-pretraining-application
  kind: application
  statement: ReLoRA is applied to pre-training transformer language models from 60M up to 1.3B parameters on the C4 corpus following an initial full-rank warm-start phase, achieving perplexity comparable to full-rank training while saving up to 5.5 GB of GPU RAM per device and improving training throughput by 9% to 40% across hardware setups.
  evidence:
  - source_id: r682-primary-pdf
    locator: Section 3 Experiments & Section 4 Results, Tables 2, 4, and 7, p. 4-8
    relation: supports
- claim_id: relora-full-rank-warmstart-requirement-and-frequent-reset-degradation
  kind: limitation
  statement: Training from random initialization with ReLoRA requires a substantial initial full-rank warm-start phase (typically 25% to 33% of total update steps) to avoid significant perplexity degradation, and overly frequent online LoRA merges (e.g., every 100 steps) or restarts without the jagged learning rate schedule degrade performance or cause training divergence.
  evidence:
  - source_id: r682-primary-pdf
    locator: 'Section 4.1 Negative results: Online ReLoRA, Table 5, and Section 4.2 Table 6, p. 7-8'
    relation: supports
