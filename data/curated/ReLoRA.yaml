id: AIMech:ReLoRA
name: ReLoRA
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient high-rank neural network training algorithm that transitions from an initial full-rank warm-start phase to sequential low-rank adaptation updates Delta W = sum_{k=1}^N s W_A^k W_B^k by periodically merging learned low-rank factors into the frozen base weights, reinitializing the low-rank matrices, partially resetting Adam optimizer states via magnitude pruning, and applying a jagged cosine learning rate schedule with rapid zero-learning-rate re-warmups.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which trains a single pair of low-rank matrices whose update rank is bounded above by r without restarts or warm-start pre-training), from Chain of LoRA (AIMech:ChainOfLoRA, which fine-tunes already pretrained models via a Frank-Wolfe conditional-gradient chain with step-down rank schedules rather than pre-training transformers with a full-rank warm start, magnitude-pruned partial Adam moment resets, and a jagged cosine learning rate schedule), and from GaLore (AIMech:GaLoreGradientLowRankProjection, which projects full-parameter gradients into low-rank subspaces via SVD rather than parameterizing linear layers with merged-and-reinitialized LoRA adapters). Formulated by Lialin et al. (ICLR 2024, arXiv:2307.05695).
aliases:
- Restarted Low-Rank Adaptation (ReLoRA)
- ReLoRA High-Rank Training Through Low-Rank Updates
- Warm-Started Periodic Reset Low-Rank Pre-Training
