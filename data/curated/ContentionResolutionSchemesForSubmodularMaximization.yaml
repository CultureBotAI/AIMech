id: AIMech:ContentionResolutionSchemesForSubmodularMaximization
name: Contention Resolution Schemes and Multilinear Relaxation Rounding for Constrained Submodular Maximization
concept_kind: algorithm
review_status: DRAFT
definition: A (b, c)-balanced Contention Resolution (CR) scheme pi for a polyhedral relaxation P_I subseteq [0, 1]^N of a downward-closed independence family I subseteq 2^N, introduced and analyzed by Chekuri, Vondrak, and Zenklusen (2011/2014), is a (possibly randomized) rounding procedure that for every fractional vector x in b * P_I and subset A subseteq N returns a feasible random subset pi_x(A) subseteq A cap support(x) such that (i) pi_x(A) in I with probability 1, and (ii) for every element i in support(x), Pr[i in pi_x(R(x)) | i in R(x)] >= c when R(x) includes each element j in N independently with probability x_j (Definition 1.2). The CR scheme is monotone if Pr[i in pi_x(A_1)] >= Pr[i in pi_x(A_2)] whenever i in A_1 subseteq A_2. Coupled with a linear-time sequential pruning operation eta_f(I) that retains i in I only if f(J + i) - f(J) > 0, any monotone (b, c)-balanced CR scheme rounds x in b * P_I to a feasible integral solution satisfying E[f(eta_f(pi_x(R(x))))] >= c * F(x) for any non-negative (monotone or non-monotone) submodular function f with multilinear extension F (Theorem 1.3).
identity_notes: Distinct from AIMech:ContinuousGreedyAndMultilinearExtensionForMatroidSubmodularMaximization (Round 349) and AIMech:MeasuredContinuousGreedySubmodularMaximization (Round 368), which are continuous optimization algorithms that find a fractional point x in P_I maximizing F(x) (and rely on matroid-specific pipage rounding), whereas Contention Resolution Schemes provide a general, modular dependent-rounding framework across intersections of matroids, matchoids, knapsacks, sparse packing systems, and tree unsplittable flows via LP duality and the correlation gap, alongside Fractional Local Search for maximizing F(x) over arbitrary solvable down-monotone polytopes.
aliases:
- Contention Resolution Scheme
- Monotone (b, c)-Balanced Contention Resolution Scheme
- Chekuri-Vondrak-Zenklusen Contention Resolution Framework
