claims:
- claim_id: r369-claim-fkg-pruning-expectation-bound-and-intersection-composition
  kind: mechanism
  statement: For any non-negative submodular function f with multilinear extension F, point x in b * P_I, and monotone (b, c)-balanced CR scheme pi producing I = pi_x(R(x)), defining the pruned set J = eta_f(I) by sequentially including i in I iff f_{J cap [i-1]}(i) > 0 guarantees via submodularity and the FKG inequality on the product space conditioned on i in R(x) that E[f(J cap [i]) - f(J cap [i-1])] >= c * E[f(R cap [i]) - f(R cap [i-1])] for each i, summing to E[f(eta_f(I))] >= c * F(x) (Theorem 1.3, Section 4.1 Eqs. 8-10); furthermore, given h independence systems I_i with monotone (b, c_i)-balanced CR schemes pi^i on P_{I_i}, their intersection scheme pi_x(A) = cap_{i=1}^h pi_x^i(A) on P_I = cap_i P_{I_i} is a monotone (b, prod_{i=1}^h c_i)-balanced CR scheme by the FKG inequality (Lemma 1.6, Section 4.1).
  evidence:
  - source_id: r369-primary-pdf
    locator: Section 1.2-1.3, Definition 1.2, Theorems 1.3 and 1.5, and Lemma 1.6, pp. 5-7; Section 4.1, Equations (8)-(10), Theorem 4.1, and Proof of Lemma 1.6, pp. 16-18
    relation: supports
- claim_id: r369-claim-correlation-gap-lp-duality-and-optimal-matroid-crs
  kind: mechanism
  statement: By formulating the search for a randomized (b, c)-balanced CR scheme at x in b * P_I as a linear program over distributions of valid deterministic mappings (LP1) and taking its dual (DP1), a (b, c)-balanced CR scheme exists if and only if inf_{x in b*P_I, y >= 0} E_{R(x)}[max_{S subseteq R, S in I} sum_{i in S} y_i] / sum_{i in N} x_i * y_i >= c, which equals the correlation gap kappa(I) = inf_{y >= 0} kappa(r_y) of the weighted rank functions r_y of I and can be constructed in polynomial time via the ellipsoid algorithm whenever I admits a monotone maximum-weight independent set oracle (Theorem 4.3, Theorem 4.6, Lemma 4.7, Appendix C); for any matroid M on n elements, F(b * p) >= (1 - (1 - b/n)^n) * f^+(p) (Lemmas 4.9-4.10) yields a monotone, efficiently implementable (b, (1 - (1 - b/n)^n) / b)-balanced (and (b, (1 - e^{-b}) / b)-balanced) CR scheme (Theorem 1.4, Theorem 4.8, Corollary 4.11) that is provably optimal even on rank-1 uniform matroids (Theorem 4.12), alongside a simpler deterministic (b, 1 - b)-balanced span-ordering scheme (Lemma 4.13, Theorem 4.14).
  evidence:
  - source_id: r369-primary-pdf
    locator: Section 1.2, Theorem 1.4, p. 6; Section 4.2-4.4, Proposition 4.2, Theorems 4.3, 4.6, 4.8, 4.12, 4.14, Lemmas 4.7, 4.9, 4.10, 4.13, and Corollary 4.11, pp. 18-26; Appendix B-C, pp. 37-41
    relation: supports
- claim_id: r369-claim-fractional-local-search-over-down-monotone-polytopes
  kind: mechanism
  statement: 'For maximizing the multilinear extension F(x) of any non-negative submodular function over any solvable down-monotone polytope P subseteq [0, 1]^N, direction-wise concavity implies (y - x) . nabla F(x) >= F(x vee y) + F(x wedge y) - 2*F(x) (Lemma 3.2); Discretized Fractional Local Search (Algorithm 3.6) maintains a convex combination of q = n^a vertices of P and terminates in O(n^{2a-1}) steps at an approximate local optimum x satisfying 2*F(x) >= F(x vee y) + F(x wedge y) - 5*delta*n for all y in P (Lemmas 3.7-3.8), so running it on P and on the complement-restricted polytope Q = {y in P : y <= 1 - x} (Algorithm 3.9) gives 2*F(x) + 2*F(z) >= OPT - 10*delta*n and a (0.25 - o(1))-approximation to max_{x in P} F(x) (Lemma 3.12, Corollary 3.13), while a single Restricted Local Search on P cap [0, t]^N with t = (3 - sqrt(5))/2 (Algorithm 3.15) achieves F(x) >= ((2*t - t^2)/2)*f(C) - o(1) = ((-1 + sqrt(5))/4 - o(1))*OPT_int approx 0.309*OPT_int (Theorem 1.1, Lemma 3.19, Corollary 3.21).'
  evidence:
  - source_id: r369-primary-pdf
    locator: Section 1.1, Theorem 1.1, p. 4; Section 3.1-3.4, Algorithms 3.1, 3.6, 3.9, 3.15, Lemmas 3.2, 3.7, 3.8, 3.11, 3.12, 3.16, 3.19, and Corollaries 3.13, 3.21, pp. 9-15
    relation: supports
