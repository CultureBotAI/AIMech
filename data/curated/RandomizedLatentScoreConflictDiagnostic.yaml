  rationale: The method organizes Bayesian hierarchical information into parent and child components of
    a directed graphical model. BayesianNetwork is its representation context; it does not denote the
    latent score diagnostic, frozen-parent sampling or its calibration. This is a related mapping without
    equivalence or subclass assertion.
limitations:
- This descriptive local identity denotes the randomized latent score procedure in Yang, Nott and Presanis
  Algorithm 1, not all prior-expansion checks, pivotal diagnostics, node splitting, cut inference or half-Cauchy
  combination tests.
- The source is the 2026-09-12 arXiv v2 preprint. Its full 52-page PDF, all figures and tables and references
  were inspected; this is not a claim of peer-review status or external empirical validation.
- Fixed-parent conditional sampling differs from full posterior sampling. Neither the prior-posterior
  marginal identity nor uniform marginal scores can be assumed after cutting feedback. Constructed calculations
  qualify these claims without fitting the source models.
- Score sign, normalizing derivatives, continuity/ties, Monte Carlo zeros and dependent aggregation must
  be specified. The separate primary theory for half-Cauchy combination has not yet been fully inspected;
  no general error-control guarantee is imported from a secondary description.
- 'Source application inconsistencies are retained in the discovery report: a Table 2 threshold marker,
  GP versus HOS interpretation around Table 3, and a beta-binomial marginalization that does not preserve
  the latent probability joint law when replaced by a count ratio. No application outcome or joint-model
  equivalence is imported.'
- No MCMC fitting, source implementation execution, biomedical inference, benchmark or repeated-data empirical
  calibration was performed. Constructed Gaussian and uniform-interval examples check mathematical limits
  only.
