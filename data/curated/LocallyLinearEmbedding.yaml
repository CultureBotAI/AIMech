claims:
- claim_id: method-scope
  kind: mechanism
  statement: Select neighbors, solve a constrained least-squares reconstruction for each input with weights
    zero outside its neighborhood and summing to one, then keep the weights fixed while minimizing embedded
    reconstruction error under centering and covariance constraints. The final step uses the smallest
    eigenmodes of (I − W)^T(I − W), excluding the constant translation mode. Weight regularization is
    needed for singular or poorly conditioned local fits.
  evidence:
  - source_id: original-paper
    locator: Equations (1)–(3), Figure 2 and notes 5–9, printed pp. 2323–2326 / PDF pp. 1–4
    relation: supports
- claim_id: local-fit-and-extension-limits
  kind: limitation
  statement: The expanded LLE paper explicitly distinguishes similarity-transform invariance from shear
    invariance, discusses neighborhood and connectivity failures, conditions singular Gram matrices with
    a weight penalty, and separates the fixed-data embedding from optional mappings to unseen points.
  evidence:
  - source_id: expanded-method
    locator: Section 2 and Figure 4, pp. 122–125 / PDF pp. 4–7; Sections 4.1–4.3, pp. 131–135 / PDF pp.
      13–17; Section 6, p. 141 / PDF p. 23
    relation: supports
