name: Locally Linear Embedding
definition: A nonlinear dimensionality-reduction algorithm that learns sparse, sum-to-one linear reconstructions
  of each point from nearby points and computes embedding coordinates by minimizing reconstruction error
  with those same weights.
concept_kind: algorithm
identity_notes: LLE preserves local reconstruction relations rather than explicitly fitting all-pairs
  geodesic distances. It is distinct from Isomap, a linear PCA projection, Laplacian Eigenmaps, and a
  learned neural embedding layer. The expanded 2003 paper elaborates the same LLE identity; optional extensions
  are not automatically separate aliases. All 442 pinned AIO labels/scoped synonyms and 109 preceding
  native identities were compared, together with hidden/ignored-inclusive searches of both checkouts;
  source citations and pending frontier mentions were distinguished from existing concept identities.
limitations:
- Neighborhoods must adequately represent local structure; excessive neighborhood size can violate local
  linearity and sparse or disconnected neighborhoods require separate treatment.
- The optimized weights are invariant to translation, rotation and homogeneous scaling of a neighborhood,
  not to arbitrary affine shears.
- Global minimization of the stated quadratic embedding objective does not establish faithful recovery
  of an arbitrary manifold or a unique coordinate system when eigenspaces are degenerate.
- The core algorithm embeds its supplied point set; applying it to new points requires an additional mapping
  or recomputation.
aliases:
- LLE
