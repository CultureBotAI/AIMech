claims:
- claim_id: fedavgm-server-velocity-and-effective-learning-rate-mechanism
  kind: mechanism
  statement: At the end of each communication round, participating clients k = 1, ..., K return local model displacements Delta w_k = w - w_k^{(E)} obtained after E local epochs of SGD with client learning rate eta, and the server forms the sample-weighted pseudo-gradient Delta w = sum_{k=1}^K (n_k / n) Delta w_k, updates its running momentum buffer v <- beta v + Delta w, and sets w <- w - v, inducing an effective learning rate eta_eff = eta / (1 - beta) that smooths conflicting update directions across rounds of partial client participation.
  evidence:
  - source_id: r502-primary-pdf
    locator: Section 4.1 Vanilla Federated Averaging and Section 4.2 Momentum on the Server, pp. 3-4
    relation: supports
- claim_id: fedavgm-dirichlet-concentration-continuum-scope
  kind: scope
  statement: 'To evaluate federated algorithms across a continuous spectrum of label-distribution skew, each client''s class distribution q is drawn independently from a Dirichlet distribution q ~ Dir(alpha p) over prior class distribution p with concentration parameter alpha > 0: as alpha -> infinity all clients have identical class distributions matching the prior p, whereas as alpha -> 0 each client holds examples from only a single randomly chosen class; at beta = 0 FedAvgM reduces identically to vanilla FedAvg.'
  evidence:
  - source_id: r502-primary-pdf
    locator: Section 3 Synthetic Non-Identical Client Data, Figure 1, pp. 2-3; Section 4.2, p. 4
    relation: supports
- claim_id: fedavgm-hyperparameter-scaling-sensitivity-and-extreme-skew-limitation
  kind: limitation
  statement: Because server momentum amplifies the effective step size by 1 / (1 - beta) (e.g., 10x at beta = 0.9), FedAvgM is sensitive to the joint tuning of client learning rate eta and beta and becomes unstable when eta_eff is too large or when local epoch count E is small (E = 1) with large reporting fraction C (Figure 4, p. 5); furthermore, under extreme single-class non-identical skew (alpha -> 0) with large local epochs, client drift still degrades accuracy relative to IID training.
  evidence:
  - source_id: r502-primary-pdf
    locator: Section 4.2 hyperparameter analysis and Figure 4, pp. 4-6
    relation: supports
- claim_id: fedavgm-federated-visual-classification-application
  kind: application
  statement: Applied to federated visual classification across Dirichlet label-skewed partitions of CIFAR-10 (CNN) and ImageNet / CIFAR benchmarks under varying client participation fractions C, local epochs E, and concentration parameters alpha in [0, 100].
  evidence:
  - source_id: r502-primary-pdf
    locator: Section 3-4 Experiments, Figures 1-5, Table 1, pp. 2-6
    relation: supports
