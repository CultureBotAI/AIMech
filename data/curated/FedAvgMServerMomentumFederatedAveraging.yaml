id: AIMech:FedAvgMServerMomentumFederatedAveraging
name: Federated Averaging with Server Momentum
concept_kind: algorithm
review_status: DRAFT
definition: A federated optimization algorithm (FedAvgM; Hsu, Qi, and Brown, 2019) that augments Federated Averaging with a Polyak heavy-ball momentum buffer v maintained at the central server over the sample-weighted aggregate client parameter update Delta w = sum_{k=1}^K (n_k / n) Delta w_k, updating the server velocity via v <- beta v + Delta w (with momentum factor beta in [0, 1)) and the global model via w <- w - v, coupled with a continuous Dirichlet client class-prior synthesis benchmark q ~ Dir(alpha p) parameterized by concentration alpha > 0 to evaluate and damp oscillations across non-identical client data distributions.
identity_notes: Distinct from vanilla Federated Averaging (AIMech:FederatedAveraging; McMahan et al., 2017), which corresponds to the memoryless server update beta = 0 (w <- w - Delta w). Distinct from SlowMo (AIMech:SlowMoCommunicationEfficientDistributedSgdWithSlowMomentum; Wang et al., ICLR 2020), which formulates a two-level outer-step Nesterov/heavy-ball momentum framework with explicit outer learning rate alpha and inner base optimizer steps (covering local SGD and SGP), and from FedOpt / FedAdam / FedYogi / FedAdagrad (AIMech:AdaptiveFederatedOptimization; Reddi et al., ICLR 2021), which introduce second-moment adaptive preconditioners v_t at the server. Also distinct from Mime / MimeLite (Karimireddy et al., 2020) and FedCM (Xu et al., 2021), which apply server momentum or client-level momentum inside every local client gradient step.
aliases:
