claims:
- claim_id: method
  kind: mechanism
  statement: Choose two training images and a binary spatial mask M. Construct M*x_A+(1−M)*x_B, preserving
    anchor pixels outside the rectangle and using donor pixels inside it. Train against lambda*y_A+(1−lambda)*y_B,
    with lambda representing the retained anchor area fraction. The paper draws a nominal coefficient
    from Beta(alpha,alpha), samples the rectangle center uniformly over the image, and sets nominal side
    lengths to the image dimensions times sqrt(1−lambda). The published experiments use alpha=1. The donor
    patch is taken from the same spatial coordinates as the overwritten anchor region. Unlike MixUp, individual
    pixels are selected from one source rather than blended throughout the image; unlike Cutout, the removed
    region is filled with another training image and target weights reflect both sources. On a discrete
    image, clipping and integer box construction can change the nominal area, so the inspected implementation
    recomputes the target coefficient from the actual rectangle.
  evidence:
  - source_id: method-source
    locator: Section 3.1, Equations (1)–(2), and Section 3.2, PDF pp. 3–4 / printed pp. 6025–6026
    relation: supports
  - source_id: cutmix-train
    locator: 'train.py lines 170–175, 220–255 and 279–295: cross-entropy, permutation, area correction
      and clipped integer box; defaults at 56–63'
    relation: supports
- claim_id: clipped-area-implementation
  kind: mechanism
  statement: When beta is positive and the minibatch application draw passes cutmix_prob, the pinned implementation
    samples a Beta coefficient, permutes the batch, constructs a shared rectangle and replaces that region
    with the permuted donor pixels. rand_bbox converts each nominal side length to an integer, uses half-width
    floor division on each side of a random integer center and clips endpoints to the image dimensions.
    It then sets lambda=1−rectangle_area/image_area and sums lambda times the anchor cross-entropy with
    1−lambda times the donor cross-entropy. With this shared coefficient, the objective equals cross-entropy
    against the correspondingly mixed targets. Training continues by backpropagation; ordinary unmodified
    inputs and labels are used when the application condition fails.
  evidence:
  - source_id: cutmix-train
    locator: 'train.py lines 170–175, 220–255 and 279–295: cross-entropy, permutation, area correction
      and clipped integer box; defaults at 56–63'
    relation: supports
