name: CutMix
definition: A training augmentation procedure that replaces a rectangular region of one image with the
  corresponding region of another and mixes their class targets in proportion to the retained and pasted
  image areas.
concept_kind: algorithm
identity_notes: CutMix is spatial patch mixing with area-weighted targets. It is distinct from whole-image
  intensity averaging, zero masking, learned synthesis and hidden-representation interpolation. The record
  describes input-image CutMix; feature-level variants are not silently treated as an identical architecture
  or layer. Its official implementation profile is pinned separately from the proceedings formula. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 253 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in both
  worktree and main checkout, returning 27 lines in each checkout. These were neighboring-record and review
  references or prior candidate leads, not existing records for these identities. Twelve exact AIO CLASS
  nodes with synonyms and outgoing edges and six neighboring native mechanisms were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.
limitations:
- Patch area is a heuristic for class-target contribution; it need not equal the visible object area or
  semantic information retained. A pasted patch may contain background or remove the discriminative object
  region.
- Integer side lengths, floor division and boundary clipping make the actual area differ from the nominal
  Beta draw. The realized target coefficient is not generally distributed as the original Beta variable.
- The pinned training code uses one application decision, rectangle and coefficient for a minibatch and
  a random permutation for partners. Per-example variants and feature-level CutMix require separate version-specific
  descriptions.
- The script’s beta argument controls the Beta distribution, while alpha controls PyramidNet width; these
  names are not the paper’s mathematical alpha convention. Default beta and cutmix_prob are zero, so the
  augmentation must be enabled by configuration.
- The implementation was read, not executed. Old API usage and unspecified runtime dependencies preclude
  an execution guarantee. Logged training error against the anchor labels is distinct from the mixed-target
  training objective. No universal localization, robustness or performance improvement is asserted.
