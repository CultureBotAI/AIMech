name: Supervised Principal Components
aliases:
- Supervised Principal Components Regression
concept_kind: algorithm
definition: A prediction procedure that screens features by their marginal association with an outcome,
  computes principal components of the retained feature matrix, and uses those components in an outcome
  regression.
identity_notes: This record denotes the Bair-Hastie-Paul-Tibshirani screening/PCA/regression procedure.
  It is distinct from ordinary principal-component regression, sparse PCA, PPCA, partial least squares,
  supervised gene shaving, and other objectives also called supervised PCA. The ambiguous acronym SPCA
  is searched but not asserted as an alias. Unlabeled observations are optional in a proposed extension,
  not required by the base procedure. Three candidate identities were compared against all 442 pinned
  AIO IDs, labels and scoped synonyms and 460 preceding native IDs, names and aliases, with no normalized
  collision. Ignored- and hidden-inclusive full-text searches of both checkouts returned the same 144
  matching lines across 34 files. Every matched passage was read, comprising 83 unique excerpts; long
  serialized web captures were inspected around each match with 220-character flanks, not reread in full.
  Matches are discovery leads, PPCA distinctions, historical reviews and PLSA/count-factorization references,
  not existing candidate records. All 222 semantic label/synonym rows were read. Twenty-six annotated
  AIO nodes and outgoing edges comprise 22 byte-verified prior readings and 4 current complete readings.
  Thirty-six contextual YAMLs comprise 29 unchanged prior readings and 7 current complete readings, including
  ten native neighbors. This is a bounded snapshot/corpus assessment.
