claims:
- claim_id: screen-then-project
  kind: mechanism
  statement: For centered training feature columns x_j and response y, the linear-response version scores
    each nonzero column by s_j=x_j^T y/||x_j|| and retains those with |s_j| greater than a threshold.
    It computes an SVD of the retained matrix and regresses the outcome on its first or first few left
    singular vectors. The threshold and component count are tuning choices. Outcome-dependent selection
    makes the entire fitting procedure nonlinear in the training responses, even though the fitted linear-response
    predictor is linear in new features.
  evidence:
  - source_id: method-source
    locator: Section 2.1, Equations 1-7, pp. 120-121 / PDF pp. 2-3; Section 6.1, p. 125 / PDF p. 7
    relation: supports
- claim_id: new-sample-prediction
  kind: mechanism
  statement: With retained training SVD X_theta=U D V^T, use weights V D^(-1) for nonzero retained singular
    values to project new observations centered by the training feature means. For one unit-norm component
    u, the training linear fit is ybar+(u^T y)u; the same fitted outcome coefficient multiplies the new
    projected score. The new observation does not need an outcome to obtain its prediction. Generalized-response
    versions replace the marginal score and outcome regression appropriately, including score-statistic
    screening and proportional-hazards regression for survival data.
  evidence:
  - source_id: method-source
    locator: Section 2.1, Equations 4-8 and test-vector instructions, pp. 120-122 / PDF pp. 2-4; curator
      nonzero-singular-value qualification
    relation: supports
- claim_id: screening-and-consistency-limits
  kind: limitation
  statement: The consistency analysis assumes a specified Gaussian latent-factor structure, identifiable
    separated signal directions, suitable relevant-dimension and signal-to-noise scaling, and adequate
    recovery of the relevant coordinates. With multiple factors, cancellation can make a relevant feature
    marginally uncorrelated with the outcome. The paper does not prove that cross-validation selects the
    correct feature set and notes substantial variability in small samples. Its detailed analysis also
    distinguishes noise-corrected latent regression coefficients from attenuated uncorrected component
    coefficients at fixed nonzero noise.
  evidence:
  - source_id: method-source
    locator: Section 9, Theorems 1-2 and Equations 36-45, pp. 130-134 / PDF pp. 12-16; Section 11, p.
      135 / PDF p. 17; curator jointly-informative zero-marginal-covariance example
    relation: supports
- claim_id: extensions-and-comparisons
  kind: scope
  statement: An optional unlabeled-data extension selects features using labeled observations and their
    outcomes, then estimates components from those selected columns in labeled plus unlabeled observations.
    This differs from repeatedly selecting all features by correlation with the current component, which
    loses the original outcome supervision. The procedure does not guarantee better prediction than ridge,
    partial least squares or other regression methods. The historical microarray examples do not establish
    clinical validity.
  evidence:
  - source_id: method-source
    locator: Section 4, p. 124 / PDF p. 6; Section 7 and Table 4, pp. 129-130 / PDF pp. 11-12; Section
      10, p. 134 / PDF p. 16
    relation: supports
limitations:
- The retained feature set may be empty, columns may have zero norm, and singular values may vanish. A
  usable implementation must handle these cases; inverses and component formulas do not establish full
  rank automatically.
- Marginally unassociated but jointly predictive variables can be missed; marginal associations can also
  select conditionally irrelevant variables. Feature scaling, threshold selection, component count and
  the response model affect the result.
- The fitted latent components need not identify causal biological processes. Survival and classification
  extensions have their own outcome assumptions; the source acknowledges incomplete theoretical justification
  for its Cox setting.
- All 19 primary pages were read. Finite orthogonal-vector calculations check selection, projection and
  a marginal-screening failure. Historical microarray results and software were not reproduced.
