claims:
- claim_id: method
  kind: mechanism
  statement: Use column vectors, visible-by-hidden weights W and recurrent hidden-by-hidden weights U.
    Given r_(t-1), let the current binary RBM have joint mass proportional to exp(v_t^T W z_t+a^T v_t+(b+U
    r_(t-1))^T z_t), with binary z_t marginalized for the visible distribution. After observing or sampling
    v_t, set r_t=sigmoid(W^T v_t+b+U r_(t-1)); the first step uses the specified initial bias contribution.
    This update is deterministic by definition, so a fully observed visible sequence fixes the recurrent
    trajectory exactly and later observations cannot alter its already determined states. The visible-sequence
    log likelihood is the sum of the conditional RBM log marginals. Differentiate that objective through
    the recurrence and through each RBM’s direct parameter dependence. In particular, a recurrent weight
    affects the current output distribution through its hidden bias as well as later recurrent states.
    Backpropagation through time propagates these dependencies, while the paper approximates conditional
    RBM model expectations with contrastive divergence. A Gaussian-visible version replaces the binary
    visible base measure with a quadratic Gaussian term.
