- target: AIO:RecurrentNeuralNetwork
  relation: broad_match
  rationale: 'The pinned target is broader: a neural network with directed temporal connections. RTRBM
    has an explicit deterministic recurrent update and a recurrent-network likelihood objective, with
    the additional defining restriction that its tied conditional RBM marginal supplies the output distribution.
    This is a structural mapping, not equivalence to every recurrent network or an empirical performance
    claim.'
- target: AIO:RestrictedBoltzmannMachine
  relation: related_match
  rationale: Each time step uses a conditional RBM with undirected visible–hidden interactions. The entire
    sequence construction additionally has directed history connections and a separate conditional normalizer
    per step; a related mapping records the component relationship without equating the whole temporal
    architecture to one unconditioned symmetric RBM.
