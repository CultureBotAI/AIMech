name: Recurrent temporal restricted Boltzmann machine
definition: A recurrent neural sequence architecture whose deterministic state is a conditional RBM hidden-probability
  vector and sets the next step’s hidden bias, with visible observations drawn from that step’s RBM marginal.
concept_kind: architecture
identity_notes: 'This is Sutskever, Hinton and Taylor’s 2008 RTRBM, with a real-valued recurrent state
  and separate binary within-step RBM hidden variables. Replacing a sampled TRBM hidden state by a deterministic
  probability vector changes the generative model; exact inference in RTRBM is not exact inference in
  the original stochastic TRBM. The recurrent update and conditional RBM share weights in this architecture.
  The real-valued state must not be conflated with the binary hidden variables integrated out of each
  output RBM. All 442 pinned AIO labels/scoped synonyms and 361 preceding native IDs/names/aliases were
  compared, with no normalized identity match. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main, returning 24 lines each. All 18 unique matched contents were
  read: temporal FRBM source references, model contrasts, a discovery lead and saved review context, rather
  than existing candidate records. All 44 semantic label/synonym hits and 21 exact AIO nodes were inspected,
  alongside corresponding generated records and four complete native neighbors. Previously read contextual
  files were checked for byte identity. Absence is bounded to this snapshot and inspected neighborhood.'
limitations:
- Exact deterministic-state inference requires the visible sequence to be observed. Missing observations
  require marginalizing uncertainty in visible values and induced recurrent states; the exact-inference
  statement does not automatically extend to that problem.
- Within-step binary hidden variables are stochastic even though the recurrent summary is deterministic.
  Exact state reconstruction does not make RBM partition functions, equilibrium sampling or finite-CD
  gradients exact or generally tractable.
- The printed Equation (12) local-score index differs from its surrounding next-step prose. Equation (13)
  displays a recurrence contribution but omits the direct current-RBM dependence through its dynamic hidden
  bias; a complete objective derivative must include it. The curated description follows the normalized
  generative definition and chain rule, checked by original finite differences, rather than treating Equations
  (12)–(14) as a verified implementation. No author-code defect or official erratum is asserted.
- A finite recurrent vector permits temporal dependence but does not guarantee successful learning of
  arbitrarily long dependencies. The source’s sample-quality comparisons do not establish universal superiority
  or exact likelihood learning.
- The source shares parameters between recurrence and output RBMs. A separate recurrent network that independently
  controls RBM parameters is a distinct neighboring construction; this record does not equate every RNN–RBM
  hybrid to RTRBM.
