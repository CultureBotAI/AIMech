claims:
- claim_id: hypercube-chunk-index-dht-matchmaking-and-exact-full-grid-averaging
  kind: mechanism
  statement: In Moshpit All-Reduce (Algorithm 1), each peer i maintains a group key C_i^t = (c_i^{t-d+1}, ..., c_i^t) of its d - 1 previous Butterfly All-Reduce chunk indices so that peers sharing a group in round t are assigned distinct group keys in round t + 1. Theorem C.1 proves that when N = M^d peers occupy a full d-dimensional hypercube without failures, Moshpit All-Reduce computes the exact global average (1/M^d) sum_{j=1}^{M^d} theta_j across all peers in exactly d communication rounds, and Theorem 3.1 proves almost-sure convergence to the global average under random peer orderings whenever each worker has a non-zero probability of completing a round.
  evidence:
  - source_id: r580-primary-pdf
    locator: Section 3.1, Algorithm 1, Equations (1)-(3), Theorem 3.1, pp. 4-5; Appendix C.1-C.2, Theorem C.1, pp. 21-23
    relation: supports
- claim_id: exponential-distortion-contraction-and-binomial-dropout-variance-reduction
  kind: mechanism
  statement: Under random splitting of N peers into r disjoint groups of sizes M_1^k, ..., M_r^k, Theorem 3.2 (Theorem C.3) proves that the expected average squared distortion from the mean bar{theta} contracts after T rounds by ((r - 1)/N + r/N^2)^T, and Theorem C.4 (with Lemma C.1) proves that when peers drop out independently with survival probability p >= 2/3 and grid size M >= 11, the output variance of Moshpit Averaging satisfies E[||theta_i^T - E_theta[theta_i^T]||^2] <= 2 sigma^2 / (M (M / 3)^{T - 1}).
  evidence:
  - source_id: r580-primary-pdf
    locator: Section 3.2.1, Theorem 3.2, Equation (5), p. 5; Appendix C.3-C.4, Theorem C.3, Lemma C.1, and Theorem C.4, Equations (18)-(26), pp. 23-31
    relation: supports
  - source_id: r580-metadata-cr
    locator: Bibliographic record
    relation: supports
- claim_id: moshpit-sgd-convergence-under-peer-vanishing-and-linear-programming-load-balancing
  kind: application
  statement: Under bounded local gradient variance sigma^2 (Assumption 3.1) and bounded peer-vanishing drift Delta_{pv}^k and averaging error gamma^2 delta_{aq}^2 (Assumption 3.2), Theorems 3.3 and 3.4 prove that Moshpit SGD (Algorithm 2) matches Centralized Local-SGD iteration complexity in both mu-strongly convex/convex and L-smooth nonconvex regimes without any spectral-gap factor, while Appendix G formulates a linear program min_{w, xi} xi subject to sum_{i=1}^M w_i = 1, w_i >= 0, and xi >= (1 - w_i + (M - 1) w_i) / b_i to balance Butterfly All-Reduce partition weights w_i across peers with heterogeneous bandwidths b_i.
  evidence:
  - source_id: r580-primary-pdf
    locator: Section 3.2.2, Algorithm 2, Assumptions 3.1-3.2, Theorems 3.3-3.4, pp. 6-7; Appendix D and G, pp. 31-45
    relation: supports
- claim_id: partially-occupied-grid-and-adaptive-optimizer-pseudo-gradient-limitation
  kind: limitation
  statement: When the active peer count N is much smaller than the hypercube capacity M^d, deterministic hypercube coordinates can produce uneven or singleton groups (Section 4.1), and when combined with adaptive optimizers such as LAMB on language model pretraining, direct parameter averaging can diverge unless workers recover pseudo-gradients after averaging to update local optimizer statistics (Section 4.3).
  evidence:
  - source_id: r580-primary-pdf
    locator: Section 4.1, Observation 4, p. 8; Section 4.3, p. 10; Appendix C.1, p. 22
    relation: supports
