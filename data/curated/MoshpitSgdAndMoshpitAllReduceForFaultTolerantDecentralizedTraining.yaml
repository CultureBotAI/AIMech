id: AIMech:MoshpitSgdAndMoshpitAllReduceForFaultTolerantDecentralizedTraining
name: Moshpit SGD and Moshpit All-Reduce
concept_kind: algorithm
review_status: DRAFT
definition: A fault-tolerant, communication-efficient decentralized averaging protocol (Moshpit All-Reduce, Algorithm 1) and distributed local stochastic gradient optimization method (Moshpit SGD, Algorithm 2) designed for training on heterogeneous, unreliable, or preemptible compute nodes. Instead of running fragile global Ring All-Reduce across all N peers or slow sparse-graph gossip, Moshpit All-Reduce dynamically partitions peers into small independent groups of size at most M using Distributed Hash Table (DHT) matchmaking keyed by tuples of their d - 1 most recent Butterfly All-Reduce chunk indices C_i^t = (c_i^{t-d+1}, ..., c_i^t), ensuring that any two peers grouped together at round t join different groups at round t + 1. Moshpit SGD interleaves tau local SGD steps on active peers P_{k+1} with periodic Moshpit All-Reduce synchronization, achieving topology-independent exponential averaging and Local-SGD-equivalent iteration complexity even under peer churn.
identity_notes: Distinct from global Ring/Butterfly All-Reduce (where a single straggler or failed peer stalls the entire cluster) and from gossip or PushSum decentralized SGD (whose convergence rate degrades with the spectral gap 1 - lambda_2(M) of a fixed sparse communication graph). Moshpit All-Reduce uses DHT-coordinated hypercube chunk-history keys to form disjoint small All-Reduce groups whose expected squared distortion contracts exponentially at rate ((r - 1)/N + r/N^2)^T independent of graph spectral gap.
aliases:
- Moshpit SGD
- Moshpit All-Reduce
- Moshpit Averaging
