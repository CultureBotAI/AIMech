id: AIMech:Sparsemax
name: Sparsemax
definition: A transformation of real-valued scores into a probability vector by Euclidean
  projection onto the probability simplex, capable of assigning exact zero probabilities.
concept_kind: mathematical_method
identity_notes: This concept is the Sparsemax transformation, not the separate sparsemax
  loss, a trained model or an implementing neural-network layer. Hidden and ignored
  repository files, pinned AIO class metadata, maintained identities, proposals, and
  local and remote branch tips were searched for Sparsemax, sparse max, sparse-max
  and publication identifiers. The only phrase hit was an unrelated sparse maximal
  eigenvalue bound in a Lasso record. AIO MathematicalFunction, SoftmaxFunction, ActivationLayer
  and SoftmaxLayer were examined; layer classes do not denote this function. Softmax
  is an alternative normalization, not an equivalent concept. Other AIMech algorithm
  records and discovery helpers use simplex projection as a component; this record
  names the standalone Sparsemax score-to-probability formulation, without claiming
  that the projection primitive is new.
definition_evidence:
- source_id: sparsemax-2016
  locator: Section 2.1, Equation 2, PDF p. 2
  relation: supports
claims:
- claim_id: adaptive-threshold
  kind: mechanism
  statement: For each input coordinate z_i, the output is max(z_i - tau, 0), where
    the input-dependent threshold tau makes the outputs sum to one. The sorting-based
    algorithm finds the support and threshold.
  evidence:
  - source_id: sparsemax-2016
    locator: Section 2.2, Proposition 1, Equations 3-4 and Algorithm 1, PDF p. 2
    relation: supports
- claim_id: piecewise-differentiability
  kind: limitation
  statement: The transformation is piecewise linear and differentiable except at points
    where its support changes. Away from those points, its Jacobian is diag(s) - s
    s^T / |S|, with s the indicator of the support S. At support-change points the
    transformation is not differentiable; there the paper uses an element of Clarke's
    generalized Jacobian (footnote 2).
  evidence:
  - source_id: sparsemax-2016
    locator: End of Section 2.4 and Section 2.5, Equations 11-12 and footnote 2, PDF
      p. 3
    relation: supports
