claims:
- claim_id: clear-lexical-residual-dynamic-hinge-margin-loss
  kind: mechanism
  statement: 'CLEAR defines a dynamic lexical-residual hinge loss L(q, d+, d-; Theta) = [m_r(s_lex(q, d+), s_lex(q, d-)) - s_emb(q, d+) + s_emb(q, d-)]_+ where m_r = xi - lambda_train * (s_lex(q, d+) - s_lex(q, d-)) (Equations 6-7): when the lexical model already ranks d+ far above d-, m_r becomes small or negative so the neural encoder does not waste capacity re-learning easy lexical matches, whereas when the lexical model fails (s_lex(q, d-) > s_lex(q, d+)), m_r expands above xi in proportion to the lexical error magnitude.'
  evidence:
  - source_id: r777-primary-pdf
    locator: Section 3.2, Equations 5-7, pp. 4-5
    relation: supports
  - source_id: r777-primary-pdf
    locator: residual_margin(), residual_hinge_loss(), and main() verification
    relation: supports
- claim_id: clear-bm25-error-based-negative-sampling-and-mean-pooled-dual-encoder
  kind: mechanism
  statement: To expose the residual learner to realistic lexical failure modes rather than random easy negatives, CLEAR samples hard negatives uniformly from the top 1000 documents retrieved by BM25 for query q (Section 3.3), encodes queries and documents with twin-tower BERT networks (sharing the lower 8 layers while specializing the upper 4 layers for queries vs. documents) followed by linear projection, layer normalization, and average pooling over token embeddings (Equations 1-4), and scores candidates at test time via s_CLEAR(q, d) = lambda_test * s_lex(q, d) + s_emb(q, d) (Equation 8).
  evidence:
  - source_id: r777-primary-pdf
    locator: Sections 3.1 & 3.3-3.4, Equations 1-4 & 8, pp. 4-6
    relation: supports
  - source_id: r777-primary-pdf
    locator: clear_score() and main() verification on lexical failure pair
    relation: supports
- claim_id: clear-msmarco-retrieval-and-shallow-bert-reranking-application
  kind: application
  statement: On MS MARCO passage ranking, CLEAR achieves 33.8 Dev MRR@10 and 79.9% Recall@100 (outperforming BM25 at 18.7, DeepCT at 24.3, doc2query at 21.5, docTTTTTquery at 27.7, and non-residual BM25+Emb interpolation at 31.3, Table 1), and when used as the first-stage retriever for a BERT cross-encoder reranker, reranking only the top K = 25 CLEAR candidates matches the MRR@10 of reranking K = 1000 BM25 candidates (a 40x reduction in BERT reranking depth, Figure 1b).
  evidence:
  - source_id: r777-primary-pdf
    locator: Section 5, Tables 1-3 & Figure 1, pp. 7-11
    relation: supports
- claim_id: clear-dual-index-storage-and-hyperparameter-sensitivity-limitation
  kind: limitation
  statement: Deploying CLEAR for full-corpus first-stage retrieval requires maintaining and querying both a lexical inverted index (for s_lex) and a dense vector MIPS index (for s_emb) and merging their candidate lists with tuned scaling weights (xi, lambda_train, lambda_test), and excessive lambda_train (e.g., lambda_train = 0.2 in Figure 2b) degrades retrieval accuracy by forcing overly aggressive embedding margins on outliers.
  evidence:
  - source_id: r777-primary-pdf
    locator: Sections 3.4 & 5.3, Figure 2b, pp. 6, 9-10
    relation: supports
