id: AIMech:CLEARComplementingLexicalRetrievalWithSemanticResidualEmbedding
name: CLEAR Complementing Lexical Retrieval with Semantic Residual Embedding
concept_kind: algorithm
review_status: DRAFT
definition: A hybrid lexical-semantic retrieval method that explicitly trains a dense Transformer dual-encoder embedding model to capture the semantic residual of a lexical retrieval model (such as BM25) by replacing the constant margin in pairwise max-margin hinge loss with a lexical-score-dependent residual margin m_r(s_lex(q, d+), s_lex(q, d-)) = xi - lambda_train * (s_lex(q, d+) - s_lex(q, d-)) over BM25 error-based negative documents, and combines the lexical score and residual embedding inner-product score linearly at inference time via s_CLEAR(q, d) = lambda_test * s_lex(q, d) + s_emb(q, d).
identity_notes: Distinct from post-hoc score interpolation of independently trained BM25 and dense dual-encoder models (such as DPR + BM25 in AIMech:DensePassageRetrieval or ME-BERT hybrids in AIMech:MEBERTMultiVectorDenseRetrieval), where the dense encoder is trained independently without conditioning its loss margin on the lexical score difference s_lex(q, d+) - s_lex(q, d-).
aliases:
- CLEAR
- Complementing Lexical Retrieval with Semantic Residual Embedding
- CLEAR Semantic Residual Embedding Retrieval
