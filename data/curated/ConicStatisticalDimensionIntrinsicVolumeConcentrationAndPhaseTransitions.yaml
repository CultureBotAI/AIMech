- claim_id: subdifferential-descent-cone-recipe-nonasymptotic-error-bound-and-exact-cone-dimensions
  kind: scope
  statement: "For any proper convex function $f: \\mathbb{R}^d \\to \\overline{\\mathbb{R}}$ whose subdifferential $\\partial f(x)$ is nonempty, compact, and does not contain $0$, the expected squared distance $J(\\tau; \\partial f(x)) := \\mathbb{E}[\\operatorname{dist}^2(g, \\tau \\partial f(x))]$ is strictly convex and differentiable on $\\tau \\ge 0$ with unique minimizer $\\tau_*$ satisfying $\\delta(\\mathcal{D}(f, x)) \\le \\inf_{\\tau \\ge 0} J(\\tau; \\partial f(x))$ (Proposition 4.1, Recipe 4.1, Lemmas C.1-C.2, pp. 16-17, 37-40), and when $f$ is a norm on $\\mathbb{R}^d$, the Gaussian Poincar\xE9 inequality yields the nonasymptotic reverse error bound $0 \\le \\left(\\inf_{\\tau \\ge 0} J(\\tau; \\partial f(x))\\right) - \\delta(\\mathcal{D}(f, x)) \\le \\frac{2\\sup\\{\\|s\\| : s \\in \\partial f(x)\\}}{f(x/\\|x\\|)}$ (Theorem 4.3, Eq. 4.3, p. 17; Appendix C.2, pp. 40-41). Specializing yields the two-sided $\\ell_1$ descent-cone bound $\\psi(s/d) - \\frac{2}{\\sqrt{sd}} \\le \\frac{\\delta(\\mathcal{D}(\\|\\cdot\\|_1, x))}{d} \\le \\psi(s/d)$ (Proposition 4.5, Eqs. 4.4-4.6), the Mar\u010Denko-Pastur Schatten 1-norm limit $\\frac{\\delta(\\mathcal{D}(\\|\\cdot\\|_{S_1}, X(r,m,n)))}{mn} \\to \\psi(\\rho, \\nu)$ (Proposition 4.7, Eqs. 4.7-4.9), and closed-form statistical dimensions for self-dual cones ($\\delta(C) = d/2$, Proposition 3.2), $s$-saturated $\\ell_\\infty$ descent cones ($d - s/2$, Proposition 3.3), circular cones ($d\\sin^2\\alpha + O(1)$, Proposition 3.4), and Weyl-chamber permutahedron normal and descent cones $\\delta(\\mathcal{N}(\\mathcal{P}(x), x)) = H_d = \\sum_{i=1}^d i^{-1}$ and $\\delta(\\mathcal{D}(\\|\\cdot\\|_{\\mathcal{P}(y_0)}, x_0)) = d - H_d$ (Propositions 3.5 and 9.1, Appendix D.4)."
