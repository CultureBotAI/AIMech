- claim_id: approximate-conic-kinematic-formula-and-universal-phase-transitions-in-random-convex-programs
  kind: mechanism
  statement: 'Combining the exact conic kinematic and Crofton formulas $\mathbb{P}\{C \cap Q K \ne \{0\}\} = 2 h_{d+1}(C \times K)$ and $\mathbb{P}\{C \cap Q L_{d-m} \ne \{0\}\} = 2 h_{m+1}(C)$ (Facts 2.1 and 5.10, Eqs. 5.9-5.10) with half-tail interlacing $2 h_k(C) \ge t_k(C) \ge 2 h_{k+1}(C)$ (Proposition 5.9, p. 22) and intrinsic-volume concentration yields the Approximate Kinematic Formula (Theorem 7.1, Eqs. 7.1-7.2; Theorem I, p. 5): for uniformly random $Q \in O(d)$ and $\lambda \ge 0$, $m \ge \delta(C) + \lambda \Rightarrow \mathbb{P}\{C \cap Q L_{d-m} \ne \{0\}\} \le p_C(\lambda)$, $m \le \delta(C) - \lambda \Rightarrow \mathbb{P}\{C \cap Q L_{d-m} \ne \{0\}\} \ge 1 - p_C(\lambda)$, and for any convex cone $K \subset \mathbb{R}^d$, $\delta(C) + \delta(K) \le d - 2\lambda \Rightarrow \mathbb{P}\{C \cap Q K \ne \{0\}\} \le p_C(\lambda) + p_K(\lambda)$ while $\delta(C) + \delta(K) \ge d + 2\lambda \Rightarrow \mathbb{P}\{C \cap Q K \ne \{0\}\} \ge 1 - (p_C(\lambda) + p_K(\lambda))$. This immediately proves sharp two-sided phase transitions with $a_\eta = \sqrt{8\log(4/\eta)}$ for: (1) regularized linear inverse problems $\min f(x) \text{ s.t. } A x = A x_0$ at $m = \delta(\mathcal{D}(f, x_0)) \pm a_\eta\sqrt{d}$ (Theorem II, p. 8); (2) convex demixing $\min f(x) \text{ s.t. } g(y) \le g(y_0),\, x + U y = x_0 + U y_0$ at $\delta(\mathcal{D}(f, x_0)) + \delta(\mathcal{D}(g, y_0)) = d \pm a_\eta\sqrt{d}$ (Theorem III, p. 11); and (3) random cone programs $\min \langle u, x\rangle \text{ s.t. } A x = b,\, x \in C$ between unboundedness ($m \le \delta(C) - \lambda$) and infeasibility ($m \ge \delta(C) + \lambda$) each with probability $\ge 1 - p_C(\lambda)$ (Theorem 8.1, p. 27).'
