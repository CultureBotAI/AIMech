claims:
- claim_id: canonical-statistical-dimension-equivalent-characterizations-and-intrinsic-volume-concentration
  kind: mechanism
  statement: For any closed convex cone $C \subset \mathbb{R}^d$ with conic intrinsic volumes $v_k(C)$ ($k = 0, \dots, d$ satisfying $\sum_{k=0}^d v_k(C) = 1$, polarity reversal $v_k(C) = v_{d-k}(C^\circ)$, and Gauss-Bonnet $\sum_{k\text{ even}} v_k(C) = \sum_{k\text{ odd}} v_k(C) = 1/2$ when $C$ is not a subspace, Fact 5.5, Eqs. 5.1-5.3), the spherical Steiner formula $\mathbb{P}\{\|\Pi_C(\theta)\|^2 \ge \varepsilon\} = \sum_{k=0}^d v_k(C) I_k^d(\varepsilon)$ (Fact 5.7, Eq. 5.6) implies that the intrinsic definition $\delta(C) := \sum_{k=0}^d k v_k(C)$ coincides with the Gaussian metric projection $\mathbb{E}[\|\Pi_C(g)\|^2] = d\mathbb{E}[\|\Pi_C(\theta)\|^2] = \mathbb{E}[\operatorname{dist}^2(g, C^\circ)] = \mathbb{E}[(\sup_{y \in C \cap \mathbb{B}^d} \langle y, g\rangle)^2]$ (Propositions 2.4, 3.1, and 5.12), satisfies complementarity $\delta(C) + \delta(C^\circ) = d$ (Eq. 3.7), direct-product additivity $\delta(C \times K) = \delta(C) + \delta(K)$ (Eq. 3.8), Gaussian-width sandwiching $w^2(C) \le \delta(C) \le w^2(C) + 1$ (Proposition 10.2, Eq. 10.1), and is the unique continuous, rotation-invariant, localizable valuation on closed convex cones extending $\delta(L) = \operatorname{dim}(L)$ (Section 5.6, p. 23). Moreover, with transition width $\omega(C) := \sqrt{\delta(C) \wedge \delta(C^\circ)}$ and $p_C(\lambda) := 4\exp\!\left(\frac{-\lambda^2/8}{\omega^2(C) + \lambda}\right)$, the tail functional $t_k(C) = \sum_{j=k}^d v_j(C)$ satisfies $t_{k_-}(C) \ge 1 - p_C(\lambda)$ for $k_- \le \delta(C) - \lambda + 1$ and $t_{k_+}(C) \le p_C(\lambda)$ for $k_+ \ge \delta(C) + \lambda$ (Theorem 6.1, Eqs. 6.1-6.3, Lemmas 6.2-6.3, Sublemma E.3).
  evidence:
