id: AIMech:ConicStatisticalDimensionIntrinsicVolumeConcentrationAndPhaseTransitions
name: Conic Statistical Dimension, Intrinsic Volume Concentration, and Approximate Kinematic Phase Transitions in Random Convex Programs
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Amelunxen-Lotz-McCoy-Tropp Conic Statistical Dimension and Phase Transitions
- Statistical Dimension of Convex Cones and Approximate Conic Kinematic Formula
- Conic Intrinsic Volume Concentration and Random Convex Optimization Phase Transitions
- Descent Cone Subdifferential Recipe with Nonasymptotic Variance Error Bound
definition: 'Conic Statistical Dimension, Intrinsic Volume Concentration, and Approximate Kinematic Phase Transitions in Random Convex Programs is a conic integral geometry and convex optimization framework established by Amelunxen, Lotz, McCoy, and Tropp (2014, Information and Inference: A Journal of the IMA 3(3):224-294, DOI:10.1093/imaiai/iau005, arXiv:1303.6672v2) that defines the statistical dimension $\delta(C) := \sum_{k=0}^d k v_k(C) = \mathbb{E}[\|\Pi_C(g)\|^2] = \mathbb{E}[\operatorname{dist}^2(g, C^\circ)]$ of a closed convex cone $C \subset \mathbb{R}^d$ as the mean of its conic intrinsic volume distribution $(v_0(C), \dots, v_d(C))$ and proves that $v_k(C)$ concentrates exponentially around $\delta(C)$ on scale $\omega(C) := \sqrt{\delta(C) \wedge \delta(C^\circ)}$ via $p_C(\lambda) = 4\exp\!\left(\frac{-\lambda^2/8}{\omega^2(C)+ \lambda}\right)$ (Theorem 6.1). Combining intrinsic-volume concentration with the exact conic kinematic and Crofton formulas $\mathbb{P}\{C \cap Q K \ne \{0\}\} = 2 h_{d+1}(C \times K)$ yields the Approximate Kinematic Formula (Theorem I and Theorem 7.1), which proves sharp two-sided phase transitions of width $O(\omega(C)) \le O(\sqrt{d})$ for regularized linear inverse problems at $m = \delta(\mathcal{D}(f, x_0))$ (Theorem II), convex demixing under a random orthogonal basis $U \in O(d)$ at $\delta(\mathcal{D}(f, x_0)) + \delta(\mathcal{D}(g, y_0)) = d$ (Theorem III), and random cone programs between unboundedness ($m \le \delta(C) - \lambda$) and infeasibility ($m \ge \delta(C) + \lambda$, Theorem 8.1), together with a nonasymptotic error bound $0 \le \inf_{\tau \ge 0} J(\tau; \partial f(x)) - \delta(\mathcal{D}(f, x)) \le \frac{2\sup\{\|s\| : s \in \partial f(x)\}}{f(x/\|x\|)}$ for the subdifferential recipe $J(\tau) = \mathbb{E}[\operatorname{dist}^2(g, \tau \partial f(x))]$ (Theorem 4.3).'
identity_notes: Checked against all 442 pinned AIO concepts and 651 maintained AIMech concepts. Distinct from `AIMech:AtomicNormConvexGeometryAndTangentConeGaussianWidthForLinearInverseProblems` (Chandrasekaran, Recht, Parrilo, & Willsky 2012, FoCM 12(6):805-849), which establishes only a one-sided Gaussian recovery sufficiency bound $m \ge w(\mathcal{T}_{\mathcal{A}}(x^*) \cap \mathbb{S}^{p-1})^2 + O(\sqrt{p})$ via Gordon's escape-through-a-mesh inequality and an upper-bound polarity recipe without a lower-bound tightness guarantee, whereas Amelunxen, Lotz, McCoy, & Tropp (2014) prove via the spherical Steiner formula and Gaussian log-Sobolev inequalities that conic intrinsic volumes concentrate around the statistical dimension $\delta(C)$ (Theorem 6.1), derive two-sided approximate kinematic bounds for Haar-random orthogonal rotations $Q \in O(d)$ (Theorems I and 7.1), establish universal two-sided phase transitions for linear inverse problems (Theorem II), convex demixing (Theorem III), and random cone programs (Theorem 8.1), prove the nonasymptotic error bound for the subdifferential recipe (Theorem 4.3), and compute exact Weyl-chamber harmonic number statistical dimensions $\delta(\mathcal{N}(\mathcal{P}(x), x)) = H_d$ for permutahedra (Propositions 3.5 and 9.1).
