  rationale: The construction defines conditional Markov transitions preserving a target. AIO MarkovChain
    denotes a stochastic process/model, so this is a method-to-process association without equivalence,
    subclass status or inheritance of Network and ProbabilisticHiddenLayer assertions.
limitations:
- The maintained mathematical scope uses a finite positive-support distribution with exact normalization
  and a consistent focal ordering. Zero-current conventions, floating arithmetic and countably infinite
  extensions are not specified here.
- The source Figure 3 caption on PDF p. 16 says off-diagonal probabilities become smaller, contrary to
  its displayed matrix and the Section 7 inequalities. This caption direction error is not adopted. No
  author implementation was executed.
- Historical attribution to the full Frigessi–Hwang–Younes construction is mediated through Neal’s report;
  that original full text was not obtained. The local Tjelmeland index-selection kernel does not identify
  its entire multiple-proposal and weighted-estimator framework with NAM.
- All fixed/upward/downward policies are covered as parameter choices, without broad exact aliases. UDNAM
  remains a distinct mixture identity and ZDNAM a separate completion; this construction does not exhaust
  the source family.
