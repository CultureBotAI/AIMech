id: AIMech:KardamLipschitzAndFrequencyFilteredAsynchronousByzantineStochasticGradientDescent
name: Kardam Lipschitz- and Frequency-Filtered Asynchronous Byzantine Stochastic Gradient Descent
concept_kind: algorithm
review_status: DRAFT
definition: A Byzantine-resilient asynchronous stochastic gradient descent algorithm proposed by Damaskinos, El Mhamdi, Guerraoui, Patra, and Taziki (ICML 2018) that decouples gradient verification from synchronous communication barriers by combining a staleness-aware gradient dampening rule with a two-stage server filter consisting of an empirical Lipschitz continuity check against the (n-f)/n worker quantile and a sliding-window worker frequency filter that guarantees at least f+1 honest updates in every 2f+1 consecutive model transitions.
identity_notes: "Distinct from Zeno++ (AIMech:ZenoPlusPlusRobustFullyAsynchronousStochasticGradientDescent, which scores candidate asynchronous updates using a server validation mini-batch loss descent test without worker frequency bounds or empirical Lipschitz quantiles) and from synchronous Byzantine aggregators such as Krum (AIMech:KrumAndMultiKrumByzantineResilientGradientAggregation), Bulyan (AIMech:BulyanTwoStageMetaAggregationForByzantineResilientDistributedLearning), and Geometric Median / RFA (AIMech:RobustFederatedAggregationViaSmoothedWeiszfeldGeometricMedian). Kardam (Damaskinos et al., ICML 2018, PMLR 80:1153-1162, Section 3.1-3.2, Definitions 3-5, pp. 3-6) comprises two coupled components on the parameter server: (1) the Dampening component scales any accepted gradient g_{tl} computed on stale model x_l (with staleness tau_{tl} = t - l) by a strictly decreasing bijective staleness decay function Lambda(tau_{tl}) satisfying Lambda(0) = 1 (such as exponential dampening Lambda(tau) = exp(-alpha * tau^(1/beta))) with adaptive step size gamma_t = gamma * M / sum_{lambda in Lambda_t} lambda |G_{t,lambda}|; and (2) the Filtering component accepts a candidate gradient g_p from worker p only if it simultaneously passes the Frequency Filter\u2014which maintains the list L of workers for the last 2f accepted gradients and rejects worker q if the top-f most frequent workers in (L; q) appear more than f times in total (Definition 4, Lemma 1)\u2014and the Empirical Lipschitz Filter\u2014which checks whether the server-side empirical Lipschitz ratio hat{K}_t^p = ||g_p - g_q||_2 / ||x_t - x_{t-1}||_2 is at most the (n-f)/n quantile hat{K}_t of all workers' local empirical Lipschitz coefficients hat{K}_p = ||g_p - g_p^{prev}||_2 / ||x_{l_p} - x_{l_p}^{prev}||_2 (Definition 5)."
