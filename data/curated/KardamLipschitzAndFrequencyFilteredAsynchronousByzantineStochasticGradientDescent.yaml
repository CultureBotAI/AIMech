claims:
- claim_id: kardam-frequency-filter-and-empirical-lipschitz-quantile-test
  kind: mechanism
  statement: 'Kardam filters each incoming asynchronous gradient g_p at step t using two checks: the Frequency Filter (Definition 4) tracks the worker IDs L of the last 2f accepted updates and rejects worker p if the sum of occurrences of the f most frequent workers in (L; p) exceeds f (guaranteeing at least f+1 honest updates in every 2f+1 accepted transitions by Lemma 1), and the Empirical Lipschitz Filter (Definition 5) accepts g_p only if hat{K}_t^p = ||g_p - g_q||_2 / ||x_t - x_{t-1}||_2 <= hat{K}_t, where hat{K}_t is the (n-f)/n quantile of per-worker empirical Lipschitz coefficients {hat{K}_w}_{w=1}^n.'
  evidence:
  - source_id: r534-primary-pdf
    locator: Section 3.2, Definitions 4-5 and Lemma 1, pp. 4-5
    relation: supports
- claim_id: kardam-staleness-dampening-convergence-and-tight-slowdown-bounds
  kind: scope
  statement: Under n >= 2f + 1 workers, Theorem 1 proves that Kardam achieves a tight optimal Byzantine slowdown factor bounded by (n - 2f)/(n - f) <= SL <= (n - f)/n, and Theorems 2-5 prove almost-sure convergence of the staleness-dampened asynchronous updates (Equations 1-2) to a neighborhood of a stationary point under bounded variance and Lipschitz-smooth non-convex objectives.
  evidence:
  - source_id: r534-primary-pdf
    locator: Section 3.1, Equations (1)-(2), p. 3; Section 3.2.2, Theorem 1, p. 5; Section 4, Theorems 2-5, p. 6
    relation: supports
- claim_id: kardam-two-f-plus-one-worker-bound-and-staleness-horizon-limitation
  kind: limitation
  statement: Kardam requires a strict honest majority n > 2f so that the (n-f)/n empirical Lipschitz quantile and the 2f-window frequency filter do not permanently stall training, and its convergence rate degrades as the maximum worker staleness tau_max increases.
  evidence:
  - source_id: r534-primary-pdf
    locator: Section 3.2.2, Theorem 1 & Proof sketch, p. 5; Section 4, Theorem 5, p. 6
    relation: supports
- claim_id: kardam-asynchronous-distributed-deep-learning-application
  kind: application
  statement: Applied to asynchronous distributed training of deep neural networks on CIFAR-10 (ResNet-18) and ImageNet across heterogeneous worker clusters under Byzantine gradient corruption and straggler delays.
  evidence:
  - source_id: r534-primary-pdf
    locator: Section 5, Figures 1-6, pp. 6-9
    relation: supports
