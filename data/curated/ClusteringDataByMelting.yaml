claims:
- claim_id: weighted-center-heating
  kind: mechanism
  statement: For each center y and beta>0, assign original points weights P_y,beta(x)=exp(-beta*||x-y||^2)/sum_u
    exp(-beta*||u-y||^2). Iterate y_new=sum_x x*P_y,beta(x) at fixed beta. Start centers at observations
    at a sufficiently high initial beta, retain their point memberships, track converged centers, and
    combine memberships when centers coalesce. Decrease beta and warm-start the retained centers; the
    printed schedule divides beta by1.05 and uses200inner iterations in demonstrations. The weighting
    set remains the original observations, not an unweighted replacement by merged centers.
  evidence:
  - source_id: melting-source
    locator: Section2 Eq2.1-2.5, pp90-91 / PDF2-3; Section3 Eq3.1 and Melting Procedure, pp92-94 / PDF4-6
    relation: supports
- claim_id: persistence-selection
  kind: mechanism
  statement: For nominal cluster Q at its tracked center, fractional free energy M_Q(beta)=sum_(x in Q)P_y,beta(x)
    is a membership weight fraction. Choose a threshold M_T; a cluster is good where its fraction exceeds
    that threshold, and robustness is the corresponding range of logarithmic scales. Greedily select the
    most robust good cluster, remove its ancestors and descendants from consideration, and repeat. Observations
    not covered by selected clusters remain in a leftover set; complete coverage is hoped for in the source,
    not guaranteed. Threshold choice and tie handling affect the result.
  evidence:
  - source_id: melting-source
    locator: Section4 Eq4.1, Definition2 and Melting Algorithm steps1-6, pp95-98 / PDF7-10
    relation: supports
- claim_id: fixed-points-and-rate
  kind: limitation
  statement: 'Stationary centers satisfy the weighted-mean equation for F=-log Z/beta, but not every fixed
    point is a local minimum or exponentially attracting. For points{-1,+1}, the update is tanh(2*beta*y):
    at beta=1, y=0 stays at an unstable free-energy maximum if initialized exactly there; at beta=0.5,
    the critical map tanh(y) has derivative one and no uniform local geometric rate. The one-dimensional
    bifurcation condition2*beta*weighted_variance=1 does not establish higher-dimensional global cluster
    recovery.'
  evidence:
  - source_id: melting-source
    locator: Section3 fixed-point and convergence prose, pp92-95 / PDF4-7, Eq3.2 and Figure3; Section6
      rate discussion, p101 / PDF13; curator finite/algebraic examples
    relation: supports
- claim_id: implementation-and-empirical-limits
  kind: limitation
  statement: The printed merge step says more than two coincident clusters, while the surrounding prose
    describes two-cluster mergers; this record uses the intended two-or-more interpretation explicitly.
    Exact coincidence tolerance, robust tie policy and a universally adequate initial scale are not specified.
    Finite inner iteration does not certify convergence or finite exact tree completion. Selected synthetic
    and SAR demonstrations do not establish universal density/shape insensitivity, semantic cluster-count
    recovery or superiority to ISODATA under arbitrary initialization.
  evidence:
  - source_id: melting-source
    locator: Section3 Melting Procedure step6 and preceding prose, pp92-93 / PDF4-5; Sections4-6, pp98-102
      / PDF10-14
    relation: supports
limitations:
- High initial beta is a data-dependent choice. Euclidean rotation invariance does not guarantee recovery
  of arbitrary anisotropic clusters. The method can be costly because each center uses all original points
  at many scales.
- The1992thesis, cited SAR original studies and Tam implementation report remain uninspected. Suggested
  continuation, grouping and adaptive-step speedups are not certified implementations here.
- No historical software, benchmark or source experiment was reproduced. Saved normalized finite calculations
  challenge bounded formula/prose claims, not the complete conditional convergence theorems.
