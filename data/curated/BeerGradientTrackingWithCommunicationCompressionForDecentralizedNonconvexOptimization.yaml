claims:
- claim_id: beer-coupled-ef21-parameter-and-gradient-tracking-invariance-mechanism
  kind: mechanism
  statement: BEER maintains compressed control variates H^t for parameters X^t and G^t for gradient-tracking estimates V^t using an alpha-contractive compressor C satisfying E||C(x) - x||^2 <= (1 - alpha)||x||^2 (Definition 2.2), and because H^t (W - I) (1/n) 1 = 0 and G^t (W - I) (1/n) 1 = 0 for doubly-stochastic W, Lemma B.3 establishes the exact global invariants v_bar^t = (1/n) sum_{i=1}^n grad f_i(x_i^t) and x_bar^(t+1) = x_bar^t - (eta/n) sum_{i=1}^n grad f_i(x_i^t) for all t >= 0.
  evidence:
  - source_id: r557-primary-pdf
    locator: Section 2.2 Definition 2.2, Section 3 Algorithm 1, & Appendix B.1 Lemma B.3 (Equations 11-12), pp. 4, 7, 15
    relation: supports
- claim_id: beer-fast-o-1-over-t-nonconvex-and-linear-pl-rate-scope
  kind: scope
  statement: For L-smooth nonconvex objectives over a graph with spectral gap rho = 1 - sigma_max(W - (1/n) 1*1^T) > 0, Theorem 1 proves that BEER with gamma = Theta(alpha * rho) and eta = Theta(gamma * rho^2 * alpha / L) attains E||grad f(x_hat)||^2 <= epsilon^2 in T = O(L / (rho^3 * alpha^2 * epsilon^2)) communication rounds without data-heterogeneity assumptions, while Theorem 2 proves linear convergence O((1 / (mu * rho^3 * alpha^2)) log(1/epsilon)) under the Polyak-Lojasiewicz condition (Assumption 2) and minibatch size b = Theta(sigma^2 / (rho * alpha * epsilon^2)).
  evidence:
  - source_id: r557-primary-pdf
    locator: Table 1 & Section 4 Theorems 1-2, pp. 3, 7-8
    relation: supports
- claim_id: beer-cubic-spectral-gap-and-dual-message-transmission-limitation
  kind: limitation
  statement: Each iteration transmits two compressed vectors (Q_h^(t+1) and Q_g^(t+1)) per node and stores four d-dimensional state vectors per node (x_i^t, h_i^t, v_i^t, g_i^t), and the theoretical communication complexity scales inversely with the cube of the graph spectral gap rho^3 and the square of the contraction factor alpha^2.
  evidence:
  - source_id: r557-primary-pdf
    locator: Section 3 Algorithm 1 & Section 4 Theorem 1 Remark, pp. 7-8
    relation: supports
- claim_id: beer-heterogeneous-nonconvex-logistic-regression-and-cnn-training-application
  kind: application
  statement: Applied to decentralized nonconvex logistic regression with nonconvex regularizer on the a9a dataset and 1-hidden-layer neural network training on unshuffled heterogeneous MNIST across 10-node ring topologies using biased Top-k and unbiased Rand-k / gsgn compressors.
  evidence:
  - source_id: r557-primary-pdf
    locator: Section 5 Numerical Experiments, Figures 2-4, pp. 9-10
    relation: supports
