id: AIMech:BeerGradientTrackingWithCommunicationCompressionForDecentralizedNonconvexOptimization
name: BEER Gradient Tracking with Communication Compression for Decentralized Nonconvex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A communication-compressed decentralized nonconvex optimization algorithm (BEER) that couples EF21-style Markov contractive error-feedback states H^t in R^(d x n) (tracking parameters X^t) and G^t in R^(d x n) (tracking gradient-tracking vectors V^t) with decentralized gossip mixing over a symmetric doubly-stochastic matrix W via X^(t+1) = X^t + gamma * H^t (W - I) - eta * V^t, H^(t+1) = H^t + C(X^(t+1) - H^t), V^(t+1) = V^t + gamma * G^t (W - I) + grad F(X^(t+1)) - grad F(X^t), and G^(t+1) = G^t + C(V^(t+1) - G^t), achieving a fast O(1/T) nonconvex stationarity rate with arbitrary alpha-contractive (possibly biased) compressors without bounded gradient-dissimilarity assumptions.
identity_notes: Introduced by Haoyu Zhao, Boyue Li, Zhize Li, Peter Richtarik, and Yuejie Chi (NeurIPS 2022, Vol. 35, pp. 31653-31667; arXiv:2201.13320). Distinct from Choco-SGD (Koloskova et al., ICML 2019; Round 382), which compresses only model parameters without gradient tracking and attains a slower O(1/sqrt(T)) rate under bounded inter-client gradient dissimilarity; and distinct from EF21 (Richtarik, Sokolov, & Fatkhullin, NeurIPS 2021; Round 380), which operates on a centralized master-worker star topology rather than a decentralized peer-to-peer graph with dual parameter and gradient-tracking control variates.
aliases:
- BEER
- BEER Decentralized Compressed Gradient Tracking
- Gradient Tracking with Communication Compression for Decentralized Nonconvex Optimization
