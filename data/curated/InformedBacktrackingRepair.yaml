id: AIMech:InformedBacktrackingRepair
name: Informed backtracking repair
concept_kind: algorithm
aliases: []
definition: A finite-CSP repair-oriented backtracking controller that uses an existing complete assignment
  to order repairs while recursively extending a compatible repaired prefix.
definition_evidence:
- source_id: minton1992-nasa
  locator: Section 3.2 and Figure 2, PDF pp. 9–10 / printed pp. 4–5, informed backtracking in the space
    of repairs.
  relation: supports
claims:
- claim_id: complete-assignment-and-repaired-prefix
  kind: mechanism
  statement: The procedure starts with an initial value for every variable. VARS-LEFT initially contains
    all variables and VARS-DONE is empty. Repairs extend a consistent repaired prefix while the assignments
    of unrepaired variables remain available to guide search; this is a complete-assignment repair controller
    rather than only a value-selection heuristic.
  evidence:
  - source_id: minton1992-nasa
    locator: Section 3.2, PDF pp. 9–10 / printed pp. 4–5; Figure 2 initialization and recursive arguments.
    relation: supports
- claim_id: conflicted-variable-and-ranked-domain
  kind: mechanism
  statement: At a nonsolution node, Figure 2 selects a currently conflicted variable from VARS-LEFT, removes
    it from that list and pushes it onto VARS-DONE. It considers the selected variable’s possible values
    in ascending number of conflicts with the remaining VARS-LEFT assignments. The figure does not mandate
    one particular conflicted-variable selector or tie order.
  evidence:
  - source_id: minton1992-nasa
    locator: Figure 2, PDF p. 10 / printed p. 5, variable selection, list movement and VALUES ordering;
      Section 3.2, PDF p. 9.
    relation: supports
- claim_id: repaired-prefix-compatibility-filter
  kind: mechanism
  statement: A value may be assigned and recursively explored only if it is compatible with the already
    repaired variables. Compatibility with the repaired prefix is a hard filter, separate from the conflict
    score against unrepaired variables. With binary constraints between distinct variables, extending
    a consistent repaired prefix this way preserves its consistency; a low remaining-variable conflict
    score alone is insufficient.
  evidence:
  - source_id: minton1992-nasa
    locator: 'Section 3.2 and Figure 2, PDF pp. 9–10 / printed pp. 4–5: the VARS-DONE admissibility test
      and recursive repair. The prefix invariant is the direct binary-CSP interpretation of that test.'
    relation: supports
- claim_id: success-test-and-exhaustive-backtracking
  kind: scope
  statement: 'The success test checks whether all variables are consistent, not merely whether VARS-LEFT
    is empty. When choices fail, ordinary backtracking returns to earlier choices and tries alternatives.
    For finite variables and domains, exhaustive branch exploration with restoration of branch state gives
    the completeness characterized by the source: find a solution if one exists or report failure after
    exhaustion. This qualification does not cover a run stopped by an early budget.'
  evidence:
  - source_id: minton1992-nasa
    locator: Figure 2 and Section 4 opening strategy comparison, PDF p. 10 / printed p. 5; Section 3.2,
      PDF p. 9. Branch-state restoration is implicit in the stated standard backtracking interpretation.
    relation: supports
- claim_id: repair-ordering-distinct-from-hill-climbing
  kind: scope
  statement: The controller combines backtracking with min-conflicts information; it does not require
    each accepted repair to reduce the total conflict count. The report distinguishes this controller
    from min-conflicts hill climbing and from its later Brelaz-based hybrid variable-ordering example.
    The later hybrid is not a mandatory step of Figure 2.
  evidence:
  - source_id: minton1992-nasa
    locator: Sections 3.2 and 4, PDF pp. 9–10 / printed pp. 4–5; hybrid and Section 4.4, PDF pp. 18–19
      / printed pp. 13–14.
    relation: supports
limitations:
- The completeness statement assumes finite domains, complete exploration and ordinary recursive restoration
  of assignments and list state. The printed pseudocode does not specify every copying, restoration or
  failure-return convention; it is not an executable implementation specification.
- Figure 2 leaves the choice among conflicted variables and tied domain-order scores open. Random tie
  breaking in the separately boxed min-conflicts heuristic is not silently imposed on every backtracking
  choice.
- Ranking against current VARS-LEFT assignments and compatibility with VARS-DONE are different operations.
  An admissible repair can increase total conflicts; no monotone whole-assignment descent or fixed conflict-reduction
  rate is guaranteed.
- The direct operational scope is the binary-CSP formulation. General constraints require an explicit
  interpretation of conflict counts and repairs, as the source notes; arbitrary weighted or higher-order
  scoring is not fixed by Figure 2.
- At-most-once repair applies along one recursive branch. Backtracking can reconsider earlier assignments,
  and exhaustive failure on a large problem can take a very long time. A cutoff without a solution does
  not establish unsatisfiability.
- No universal speedup, benchmark reproduction or exhaustion of the backtracking family is claimed. Later
  hybrid orderings and the report’s simplified problem-specific analysis are not included as mandatory
  mechanisms of this controller.
aio_no_match:
  search_scope: The actual 2026-10-15 post-cohort 350 collection at commit f654ed4db7fe7277efa4478aa4e71eddd8085d97
    covers 781 maintained and 442 generated records. Four fixed-word searches included ignored and hidden
    files across the original checkout and three retained discovery/recovery checkouts. All 20338 occurrences
    were reconstructed into 1167 distinct contents, freshly read by two attributed supporting readers.
    Root read 29 focused contents, all six normalized identity/definition rows and eleven contextual fields,
    every matching field and owner projection for 24 frontier objects, and both selected owners in full.
    Normalization covered 4861 identity-field occurrences. No candidate collision was found in this bounded
    scope. The ten exact pinned AIO CLASS identities, definitions, synonyms and graph contexts listed
    here were separately inspected in the accepted research. Generic task, training, function and neural/process
    classes do not identify this symbolic repair controller. No suitable target was found in the inspected
    snapshot and semantic scope; no universal upstream absence is claimed.
  rationale: No substantive AIO counterpart to the specified informed-backtracking repair controller was
    identified in the inspected snapshot. Its conflict scoring, generic traversal and neural inspiration
    do not by themselves identify the complete controller.
  examined_targets:
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: The symbolic repair controller is not a connected artificial-neuron architecture;
      neural inspiration does not identify its backtracking mechanism.
  - target: AIO:HopfieldNetwork
    rejection_reason: The target specifies a symmetric content-addressable neural network, not finite-CSP
      backtracking through repair choices.
  - target: AIO:RecurrentNeuralNetwork
    rejection_reason: The target describes a dynamic neural network along a temporal sequence, not the
      symbolic repaired-prefix controller.
  - target: AIO:Network
    rejection_reason: An interconnected-system genus does not supply a substantive mapping for this controller
      merely because a search tree can be represented as a graph.
  - target: AIO:MachineLearningTask
    rejection_reason: Solving a finite CSP by the stated repair search does not itself build methods that
      learn from data.
  - target: AIO:TrainingStrategy
    rejection_reason: The specified repair controller is neither preprocessing nor a strategy for training
      a machine-learning model.
  - target: AIO:AvailabilityHeuristicBias
    rejection_reason: This cognitive judgment bias is unrelated to the algorithmic use of min-conflicts
      ordering.
  - target: AIO:MarkovChain
    rejection_reason: A possible stochastic model of choices is not the specified backtracking controller;
      no Markov-process equivalence is established.
  - target: AIO:MathematicalFunction
    rejection_reason: The controller evaluates conflict and compatibility functions, but that does not
      identify the whole recursive search procedure with this generic mathematical-rule class.
  - target: AIO:ReasoningLLM
    rejection_reason: The controller requires neither a language model nor language-task reasoning; the
      target explicitly does.
