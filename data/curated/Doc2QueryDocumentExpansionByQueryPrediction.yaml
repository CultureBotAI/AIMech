id: AIMech:Doc2QueryDocumentExpansionByQueryPrediction
name: Doc2query Neural Document Expansion by Query Prediction
concept_kind: preprocessing_method
review_status: DRAFT
definition: A neural document-expansion preprocessing method for first-stage information retrieval that trains a sequence-to-sequence Transformer model on (query, relevant document) pairs to generate questions a given document could potentially answer, samples N = 10 predicted queries per document via top-k random sampling prior to indexing, and appends the predicted queries directly to the original document text without special markup before building a standard bag-of-words inverted index (such as BM25), simultaneously performing implicit term re-weighting via copied document tokens (increasing the term frequency of salient words) and bridging lexical vocabulary mismatch via newly generated synonym and related-concept tokens while shifting neural inference cost from retrieval time to offline indexing.
identity_notes: Distinct from query-side generation expansion methods such as GAR (AIMech:GARGenerationAugmentedRetrievalForOpenDomainQA) and HyDE (AIMech:HyDEHypotheticalDocumentEmbeddings), which generate expansion contexts from the input query at retrieval time rather than expanding corpus documents offline prior to inverted-index construction; and distinct from DeepCT (AIMech:DeepCTContextAwareTermImportanceEstimationForFirstStageRetrieval), which regresses integer term frequencies for existing document tokens without generating new vocabulary terms not present in the document.
aliases:
- Doc2query
- Document Expansion by Query Prediction
- Neural Document Expansion by Query Prediction
