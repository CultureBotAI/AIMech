claims:
- claim_id: doc2query-seq2seq-topk-random-sampling-document-expansion
  kind: mechanism
  statement: "Doc2query trains a 6-layer encoder-decoder Transformer (512 hidden units, 8 attention heads, 2048 feed-forward units, BPE-tokenized with documents truncated to 400 tokens and queries to 100 tokens, Section 3 & Appendix A) on (query, relevant document) pairs, predicts 10 queries per document using top-k random sampling\u2014which outperforms beam search across all hypothesis counts and peaks at 10 queries before excess queries dilute the original text (Appendix B, Figure 2)\u2014and appends them to the document without special markup prior to BM25 indexing."
  evidence:
  - source_id: r773-primary-pdf
    locator: Section 3 & Appendices A-B, Figures 1-2, pp. 1-2, 7
    relation: supports
  - source_id: r773-primary-pdf
    locator: main() verification of BM25 document expansion with predicted queries
    relation: supports
- claim_id: doc2query-complementary-copied-term-reweighting-and-new-term-expansion
  kind: mechanism
  statement: 'Excluding stopwords (51% of predicted query tokens), 69% of Doc2query''s predicted words exist in the source document (copied words that perform implicit term re-weighting by boosting key term frequencies) while 31% are novel words absent from the source document (new words that mitigate vocabulary mismatch via synonyms and related terms): on MS MARCO Dev, expanding with new words alone improves BM25 MRR@10 from 18.4 to 18.8, copied words alone reaches 19.7, and combining both reaches 21.5 MRR@10 and raises Recall@1000 from 85.3 to 89.3 (Section 5, Tables 1-2).'
  evidence:
  - source_id: r773-primary-pdf
    locator: Section 5, Tables 1-2, pp. 3-4
    relation: supports
  - source_id: r773-primary-pdf
    locator: main() verification of orig < copied, orig < new, and full (copied + new) > both
    relation: supports
- claim_id: doc2query-msmarco-and-treccar-retrieval-and-reranking-application
  kind: application
  statement: Doc2query improves standalone BM25 retrieval effectiveness by ~15% on both TREC-CAR (15.3 to 18.3 MAP) and MS MARCO (18.6 to 21.8 Test MRR@10 at 90ms/query vs. 650ms/query for Single Duet v2), outperforms RM3 query expansion (which degrades MS MARCO Dev MRR@10 to 16.7), and provides orthogonal gains when pipelined with BERT cross-encoder reranking (36.5 MAP on TREC-CAR and 37.5 Dev / 36.8 Test MRR@10 on MS MARCO, Table 1).
  evidence:
  - source_id: r773-primary-pdf
    locator: Sections 4-5, Table 1, pp. 2-4
    relation: supports
- claim_id: doc2query-corpus-reindexing-and-overexpansion-noise-limitation
  kind: limitation
  statement: Because document expansion modifies corpus representations prior to indexing, any change to the expansion model requires running neural generation across all corpus documents and re-indexing the entire collection (Section 2), and appending too many predicted queries (e.g., 20 queries in Figure 2) introduces noise that reduces the relative contribution of the original document text and degrades MRR@10 (Appendix B).
  evidence:
  - source_id: r773-primary-pdf
    locator: Section 2 & Appendix B, Figure 2, pp. 2, 7
    relation: supports
