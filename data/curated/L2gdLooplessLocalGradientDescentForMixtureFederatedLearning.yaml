claims:
- claim_id: r445-exact-kkt-gradient-average-identity-and-spectrum-interpolation
  kind: mechanism
  statement: For every penalty parameter lambda in (0, infinity), the unique minimizer x^*(lambda) = (x_1^*(lambda), ..., x_n^*(lambda)) of F(x) = f(x) + lambda psi(x) satisfies nabla f_i(x_i^*(lambda)) + lambda(x_i^*(lambda) - bar_x^*(lambda)) = 0 and therefore the exact zero-sum gradient identity (1/n) sum_{i=1}^n nabla f_i(x_i^*(lambda)) = 0 (Theorem 3.2, Eq. 5), while interpolating monotonically between purely local training at lambda = 0 (Theorem 3.1) and the classical consensus global optimum x^*(lambda) -> 1 x^* with x_i^*(lambda) - bar_x^*(lambda) = -(1/lambda) nabla f_i(x^*) + o(1/lambda) as lambda -> infinity (Theorem 3.5).
  evidence:
  - source_id: r445-primary-pdf
    locator: Section 3 Properties of the Optimal Solution (Theorems 3.1-3.5, Equations 4-9), pp. 4-6
    relation: supports
- claim_id: r445-unbiased-two-summand-sgd-equivalence-and-optimal-communication-probability
  kind: mechanism
  statement: Interpreting F(x) = f(x) + lambda psi(x) as a two-summand finite sum and sampling G(x^k) = nabla f(x^k) / (1 - p) with probability 1 - p and lambda nabla psi(x^k) / p with probability p makes G(x^k) an unbiased estimator E[G(x^k) | x^k] = nabla F(x^k) (Section 4.1, Eq. 13); applying control variates (L2GD+) or non-uniform sampling achieves global linear convergence O(max(L / ((1 - p) mu), lambda / (p mu)) log(1/epsilon)) where the optimal communication probability p^* = lambda / (lambda + L) minimizes expected communication rounds to O((lambda L / (lambda + L)) / mu * log(1/epsilon)) (Theorems 4.4, 5.2, and Corollary 4.5).
  evidence:
  - source_id: r445-primary-pdf
    locator: Section 4.1-4.3 Convergence of L2GD (Equations 13-17, Theorem 4.4, Corollary 4.5) & Section 5 Variance Reduced L2GD+ (Theorem 5.2), pp. 6-12
    relation: supports
- claim_id: r445-variance-floor-without-control-variates-and-strong-convexity-limitation
  kind: limitation
  statement: Because nabla f_i(x_i^*(lambda)) = -lambda(x_i^*(lambda) - bar_x^*(lambda)) != 0 whenever client optima differ and lambda > 0, vanilla L2GD with constant step size alpha converges to an O(alpha sigma_*^2) neighborhood of x^*(lambda) unless diminishing step sizes or the variance-reduced control-variate extension L2GD+ (Section 5) are used.
  evidence:
  - source_id: r445-primary-pdf
    locator: Section 4.3 Theorem 4.4 Neighborhood Analysis & Section 5 L2GD+ with Control Variates, pp. 8-11
    relation: supports
- claim_id: r445-personalized-l2-regularized-logistic-regression-federated-application
  kind: application
  statement: Applied to personalized federated l_2-regularized logistic regression across heterogeneous LIBSVM client datasets (a1a, mushrooms, madelon, phishing), reducing communication rounds relative to full-consensus gradient descent as heterogeneity increases.
  evidence:
  - source_id: r445-primary-pdf
    locator: Section 6 Experiments (Figures 1-4), pp. 13-15
    relation: supports
