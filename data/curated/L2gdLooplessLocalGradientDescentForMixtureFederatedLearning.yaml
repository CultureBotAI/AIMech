id: AIMech:L2gdLooplessLocalGradientDescentForMixtureFederatedLearning
name: L2GD (Loopless Local Gradient Descent for Mixture Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: 'A personalized federated optimization formulation and randomized loopless algorithm (Hanzely & Richtarik 2020, Section 2, Equation 2; Section 4, Algorithm 1, Equations 14-15) that minimizes the penalized mixture objective min_{x_1, ..., x_n in R^d} F(x) = (1/n) sum_{i=1}^n f_i(x_i) + (lambda / (2 n)) sum_{i=1}^n ||x_i - bar_x||^2 (where bar_x = (1/n) sum_{i=1}^n x_i) by flipping a coin xi_k ~ Bernoulli(p) at each iteration k: with probability 1 - p (xi_k = 0), every client i performs a purely local gradient step x_i^{k+1} = x_i^k - (alpha / (1 - p)) nabla f_i(x_i^k); with probability p (xi_k = 1), the server computes bar_x^k and every client takes an averaging-contraction step x_i^{k+1} = (1 - alpha lambda / p) x_i^k + (alpha lambda / p) bar_x^k.'
identity_notes: Distinct from pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes, T. Dinh et al. 2020), which solves nested bi-level Moreau envelope subproblems at every local step using an auxiliary global variable w, and from Local SGD / FedAvg (AIMech:FederatedAveraging, McMahan et al. 2017), which forces full consensus x_1 = ... = x_n (the lambda -> infinity limit) and suffers O(alpha) bias on heterogeneous objectives, whereas L2GD is an unbiased variance-reduced stochastic solver on the two-term sum F(x) = f(x) + lambda psi(x) that converges linearly to the exact mixture optimum x^*(lambda) for any constant step size.
aliases:
- L2GD
- Loopless Local Gradient Descent
- Mixture Federated Learning with L2GD
