id: AIMech:LaPropSeparatingMomentumAndAdaptivityInAdam
name: LaProp (Decoupled Momentum and Adaptivity Optimizer)
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive first-order stochastic optimization algorithm that decouples parameter-space momentum from root-mean-square gradient adaptivity by normalizing the current gradient by its bias-corrected second-moment estimate prior to accumulating momentum. Given momentum parameter mu in [0, 1), adaptivity parameter nu in [0, 1), and bias correction factors c_m = 1 - mu^t and c_n = 1 - nu^t, LaProp updates n_t = nu n_{t-1} + (1 - nu) g_t^2, m_t = mu m_{t-1} + (1 - mu) g_t / (sqrt(n_t / c_n) + eps), and theta_{t+1} = theta_t - lambda_t m_t / c_m, bersama with decoupled-weight-decay (LaPropW), monotonic-second-moment (AmsProp), and variance-centered (Centered LaProp) extensions.
identity_notes: 'Distinct from Adam (Kingma and Ba 2015) and ADOPT (AIMech:AdoptModifiedAdamOptimalConvergenceAnyBeta2): in the generalized adaptive update theta_{t+1} = theta_t - lambda_t G_t nabla l(theta_t) + mu_t K_t (theta_t - theta_{t-1}) (Eq. 2), Adam induces K_t = H_t^{-1} H_{t-1} (reweighting past parameter momentum by the current preconditioner and diverging when nu -> 0 with mu > 0), whereas LaProp sets K_t = I by normalizing g_t with contemporaneous bias-corrected sqrt(n_t / c_n) + eps before momentum accumulation (unlike ADOPT, which uses the lagged un-bias-corrected v_{t-1}). Originally circulated as ''LaProp: a Better Way to Combine Momentum with Adaptive Gradient'' (v1) and revised as ''LaProp: Separating Momentum and Adaptivity in Adam'' (v3).'
aliases:
- LaProp Optimizer
- LaProp Separating Momentum and Adaptivity in Adam
- LaPropW and AmsProp and Centered LaProp
