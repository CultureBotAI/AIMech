claims:
- claim_id: group-local-emissions
  kind: mechanism
  statement: Each corpus topic has a shared Dirichlet parameter vector over words. Each book draws a separate
    word-probability vector for that topic, and each page draws its own topic mixture. Tokens select a
    topic from the page mixture and a word from the corresponding book/topic vector. Integrating those
    vectors yields Dirichlet-multinomial reinforcement within a book/topic group. With fixed shared Dirichlet
    parameters, different books can be processed independently; a fully Bayesian treatment of uncertain
    shared parameters would introduce additional dependence.
  evidence:
  - source_id: method-source
    locator: Sections 3.3-3.4, printed pp.379-380 / PDF pp.4-5; Figure 3
    relation: supports
- claim_id: collapsed-local-counts
  kind: mechanism
  statement: Conditional on fixed topic subsets and valid hyperparameters, a collapsed token update multiplies
    a leave-token-out page-topic predictive factor by a book/topic-word predictive factor. Emission counts
    pool across pages of the same book, not directly across all books. Other books can affect predictions
    through refitted corpus Dirichlet parameters. With a uniform two-word prior and one topic, two identical
    words have integrated probability 1/3 when sharing one book emission vector versus 1/4 across independent
    book vectors. The construction is exchangeable within its groups rather than a word-order or phrase
    model.
  evidence:
  - source_id: method-source
    locator: Section 3.3, printed p.379 / PDF p.4, Equation 1; Section 3.4 and Figure 3
    relation: supports
- claim_id: cluster-and-refit-procedure
  kind: mechanism
  statement: The reported stochastic-EM-style procedure first fits topic assignments independently within
    books, clusters the resulting local topic word distributions, estimates a corpus Dirichlet vector
    for each cluster using a cited fixed-point method, then retrains book models with selected cluster
    priors. The demonstrated clustering is hard greedy agglomeration using Jensen-Shannon divergence.
    A shared-support expression accelerates pairwise divergence calculation; its disjoint-support constant
    of one assumes base-two logs. After a Gibbs round, each book retains its most-used topics, with the
    topic-count heuristic ten plus page count divided by ten. These topic-selection and clustering choices
    are part of the reported approximation, not an exact-posterior or likelihood-monotonicity guarantee.
  evidence:
  - source_id: method-source
    locator: Sections 3.2-3.5, printed pp.379-380 / PDF pp.4-5, Equation 2 and retraining paragraph
    relation: supports
