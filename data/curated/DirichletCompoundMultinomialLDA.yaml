name: Dirichlet compound multinomial latent Dirichlet allocation
definition: A topic-model family for grouped documents in which each group draws its own topic-word distributions
  from corpus-shared topic-specific Dirichlet distributions, while individual documents mix those group-specific
  topics.
concept_kind: model_family
identity_notes: Scoped to Mimno and McCallum's JCDL2007 DCM-LDA model for pages within books. Corpus topic
  identity is shared through fitted Dirichlet parameters beta_t, whereas topic-word vectors phi_bt are
  book-specific and document/page topic mixtures are local. This differs from standard LDA with corpus-shared
  word vectors and from merely replacing a symmetric LDA prior by an asymmetric one. The reported clustering
  and restricted-topic fitting procedure is distinguished from the fixed-parameter probability model.
  DCM-LDA is the source acronym. No normalized candidate identity matched all 442 pinned AIO IDs, labels
  and scoped synonyms or 441 preceding native IDs, names and aliases. Full-checkout searches included
  ignored and hidden files in both checkouts; twelve matching lines per checkout came from five unique
  prior discovery-ledger contents and the existing GCA mapping rationale. All matching excerpts were read.
  All 205 semantic label/synonym hits and 21 annotated AIO nodes with outgoing edges were byte-verified
  against prior readings. Thirty contextual YAMLs comprise 27 unchanged prior readings, two fully read
  final native targets verified against saved review inputs, and a fully read Metropolis-Hastings record.
  No candidate record is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- The source does not fully specify agglomerative linkage updates, stopping, count-rule rounding or every
  empty-vector/Dirichlet-estimation edge case. A restricted book topic subset changes available assignments;
  it is not automatically an exact sampler over all corpus topics.
- The model supplies faceted topics rather than an ontology subsumption hierarchy. Selected virtual shelves
  and topic/Library-of-Congress-heading mutual information do not establish complete semantic accuracy
  or a validated retrieval benchmark; new retrieval evaluation is identified as future work.
- The large-corpus timing uses particular preprocessing, hardware and two major training stages. The much
  longer standard-LDA estimate is extrapolated, not a matched full-corpus run. An inconsistent smaller
  subcollection count in related work is not silently reconciled with the reported 42000-book experiment.
- Finite checks cover 160 fixed-parameter collapsed conditionals, group sharing and the shared-support
  Jensen-Shannon identity. No author software, full clustering pipeline or empirical benchmark was executed.
