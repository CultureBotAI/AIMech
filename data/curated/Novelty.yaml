claims:
- claim_id: method
  kind: mechanism
  statement: Begin from a complete assignment and, while it is unsatisfying, randomly choose an unsatisfied
    clause. Rank its candidate variables by the total number of unsatisfied clauses that would remain
    after each flip, preferring a less recently flipped variable when objective scores tie. Let the first
    two candidates be best and second-best. If the best is not the most recently flipped variable anywhere
    in the selected clause, choose it. Otherwise choose the second-best with probability p and the best
    with probability 1−p, for p in [0,1]. Flip the chosen variable, update its timestamp and repeat under
    the chosen outer search and stopping policy. The score uses the global net effect of a flip, not breakcount
    alone. The noise coin is conditional on recency; it is not an unconditional random selection from
    all clause variables.
  evidence:
  - source_id: method-source
    locator: PDF2 / printed322, Local Search Procedures for Boolean Satisfiability and NOVELTY rule; PDF3
      / printed323, intuition and empirical noise discussion
    relation: supports
- claim_id: unrestarted-incompleteness
  kind: limitation
  statement: The unrestarted Novelty heuristic can remain confined to nonsatisfying assignments on a satisfiable
    formula, regardless of its noise parameter. Hoos1999 gives an explicit five-variable counterexample;
    the theorem does not assert that an unbounded uniform random-restart wrapper is also incomplete.
  evidence:
  - source_id: additional-1
    locator: PDF3, definition of PAC and pure no-restart scope; PDF4, Theorem 3 and F2 proof
    relation: supports
