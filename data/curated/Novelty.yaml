name: Novelty SAT heuristic
definition: A clause-based SAT local-search heuristic that ranks candidate flips by total violation count
  with oldest-variable tie breaks, normally selects the best candidate, and sometimes selects the second-best
  when the best was the most recently flipped variable in that clause.
concept_kind: algorithm
identity_notes: 'This is the Novelty SAT heuristic introduced by McAllester, Selman and Kautz in 1997,
  not the general idea of novelty or novelty-search objectives in evolutionary computation. It ranks only
  variables of a selected unsatisfied clause by the global post-flip objective. Its age-conditional choice
  differs from HSAT’s global best-score tie selection, WalkSAT/SKC’s break-only score and freebie priority,
  and tabu inadmissibility. Novelty+ adds a separate random-walk branch and is not an exact alias. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 322 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 52 and 53 lines respectively. All twenty unique hit contents were inspected: neighboring
  variant references, saved reviews and discovery leads, generic novelty wording and an ignored Sphinx
  comment, not existing candidate records. The checkout differences are retained in the ledger. Nine exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five full native neighboring records
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- 'Hoos’s 1999 Theorem 3 shows that Novelty without random restart is essentially incomplete for every
  noise setting: there are satisfiable inputs and reachable search states from which a model is never
  found. This statement is about the unrestarted heuristic, not every solver that wraps it in an unbounded
  random-restart scheme.'
- A verified model is a sound positive result, but exhausting a finite budget is not an UNSAT certificate.
  The 1997 empirical noise-level and optimality invariants are not general convergence theorems or guaranteed
  optimal tuning rules.
- The two-candidate rule needs an explicit convention for unit clauses and for initial/tied timestamps
  among never-flipped variables. Empty clauses require separate handling. The short source description
  does not certify an executable choice for every such boundary.
- A nonrecent best candidate is selected even when p=1; a score tie is first resolved by age. No SKC zero-break
  priority, tabu prohibition or R-Novelty score-gap formula is silently inserted. Weighted MAX-SAT extensions
  and later Novelty variants need separate scope.
