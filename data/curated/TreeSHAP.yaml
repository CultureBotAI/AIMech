name: Tree SHAP
definition: A tree-specific algorithm computing Shapley feature attributions through recursive bookkeeping
  of weighted feature subsets along decision paths.
concept_kind: algorithm
identity_notes: This record denotes the original tree-traversal SHAP algorithm, not the TreeExplainer
  software package, all its later modes, or Independent Tree SHAP.
limitations:
- Exact computation is relative to the specified tree-traversal subset-evaluation function; it is not
  an assertion of exact conditional expectations for arbitrary dependent input distributions.
- Background/intervention variants and nonlinear output transforms require separate method assumptions.
id: AIMech:TreeSHAP
