  relation: supports
claims:
- claim_id: explanation-method
  kind: mechanism
  statement: The original procedure follows known-feature branches and uses node cover for missing-feature
    branches, while EXTEND and UNWIND operations track subset sizes and repeated split features to accumulate
    weighted leaf contributions.
  evidence:
  - source_id: original-paper
    locator: Sections 3.1–3.2, Algorithms 1–2, PDF/printed pp. 3–4
    relation: supports
- claim_id: subset-function-scope
  kind: scope
  statement: The later method description explicitly defines the exact Tree SHAP calculation relative
    to the tree-traversal subset function and distinguishes Independent Tree SHAP.
  evidence:
