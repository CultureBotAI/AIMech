claims:
- claim_id: r484-certainty-weighted-ensemble-distillation-mechanism
  kind: mechanism
  statement: Instead of weighting all active client teachers equally on unlabeled distillation sample x in D_distill, FedAUX trains a one-vs-auxiliary logistic certainty scorer w_i^* on normalized frozen-extractor features h_tilde_0(x) separating private client samples D_i from negative auxiliary samples D^- (Equation 4), evaluates certainty s_i(x) = (1 + exp(-<w_i^* + rho, h_tilde_0(x)>))^{-1} + xi (Equation 6), and distills the certainty-weighted soft label A_s(x) = softmax(sum_{i in S_t} s_i(x) f_i(x) / sum_{i in S_t} s_i(x)) into the server prototype model (Sattler et al. 2021, Section 3.4, Equations 3-6, Algorithm 1, p. 4).
  evidence:
  - source_id: r484-primary-pdf
    locator: Section 3.4 (Equations 3-6, Algorithm 1), p. 4
    relation: supports
- claim_id: r484-l2-sensitivity-and-differentially-private-scoring-scope
  kind: scope
  statement: Theorem 1 proves that the L2 sensitivity of the lambda-regularized logistic certainty classifier w_i^* over unit-norm features ||h_tilde_0(x)||_2 <= 1 is bounded by 2 / (lambda (|D_i| + |D^-|)) (Equation 8), and Theorem 2 establishes that adding Gaussian noise rho ~ N(0, sigma^2 I) with variance sigma^2 >= 8 ln(1.25 / delta) / (epsilon^2 lambda^2 (|D_i| + |D^-|)^2) (Equation 10) guarantees (epsilon, delta)-differential privacy for the published certainty scoring mechanism (Sattler et al. 2021, Section 3.5 & Appendix J, Theorems 1-2, pp. 5 & 18-21).
  evidence:
  - source_id: r484-primary-pdf
    locator: Section 3.5 (Theorems 1-2, Equations 8-10), p. 5, and Appendix J, pp. 18-21
    relation: supports
- claim_id: r484-heterogeneous-vision-and-chest-xray-federated-distillation-application
  kind: application
  statement: Applied to homogeneous and heterogeneous neural network ensembles under severe Dirichlet label skew on CIFAR-10, STL-10, Office-Home domain shift, and ChestX-ray14 medical imaging benchmarks using unlabeled ImageNet / CIFAR-100 auxiliary data (Sattler et al. 2021, Section 4, Tables 1-6, Figures 2-6).
  evidence:
  - source_id: r484-primary-pdf
    locator: Section 4 (Experimental Evaluation, Tables 1-6, Figures 2-6), pp. 6-10
    relation: supports
- claim_id: r484-unlabeled-auxiliary-dataset-availability-limitation
  kind: limitation
  statement: Requires the server and clients to have access to an unlabeled auxiliary dataset D_aux whose input modality is compatible with the target task for contrastive pretraining, negative scoring, and ensemble distillation (Sattler et al. 2021, Section 3.1-3.4, pp. 3-4).
  evidence:
  - source_id: r484-primary-pdf
    locator: Section 3.1-3.4, pp. 3-4
    relation: supports
