claims:
- claim_id: c-r592-hutchinson-diagonal-and-spatial-block-averaging
  kind: mechanism
  statement: AdaHessian computes an unbiased Hessian diagonal estimate D = diag(H) = E[z odot (H z)] using a Rademacher vector z in {-1, +1}^d and a single Hessian-vector backpropagation H z = d(g^T z)/dtheta (Eqs. 8-9), and applies block-diagonal spatial averaging D^{(s)}[i b + j] = (1/b) sum_{r=1}^b D[i b + r] over blocks of size b (e.g., 3x3 convolutional kernels or attention rows, Eq. 10), preserving the strong-convexity spectral bounds alpha <= D_i^{(s)} <= beta and convergence rate (Eqs. 13-19) while reducing single-sample Hutchinson variance without extra computational cost.
  evidence:
  - source_id: r592-primary-pdf
    locator: Equations (8)-(10) & Figures 4-5, pp. 6-8; Appendix Descending Properties, Eqs. (13)-(19), p. 15
    relation: supports
- claim_id: c-r592-rms-hessian-momentum-and-power-preconditioning
  kind: mechanism
  statement: By maintaining a bias-corrected root-mean-square exponential moving average D_bar_t of the spatially averaged Hessian diagonal (Eq. 11) and preconditioning the gradient momentum m_t by v_t = (D_bar_t)^k (0 <= k <= 1, Eq. 12), AdaHessian smooths out misleading local curvature spikes on rugged non-convex loss surfaces (Figure 3) and exhibits high robustness to learning-rate scaling up to 10x on Transformer machine translation where AdamW diverges (Table 6).
  evidence:
  - source_id: r592-primary-pdf
    locator: Figure 3 & Equations (11)-(12), pp. 6-7; Table 6, p. 11
    relation: supports
- claim_id: c-r592-cv-nlp-recsys-empirical-gains
  kind: application
  statement: Using the same learning-rate schedule, warmup, weight decay, and (beta_1, beta_2) as first-order baselines, AdaHessian achieves +5.55% higher top-1 accuracy than Adam (+2.67% over AdamW) on ImageNet ResNet18, +0.13/+0.33 BLEU over AdamW on IWSLT14/WMT14, 2.7/1.0 lower perplexity on PTB/WikiText-103, +0.41 GLUE points on SqueezeBERT, and +0.032% test accuracy over AdaGrad on Criteo DLRM.
  evidence:
  - source_id: r592-primary-pdf
    locator: Abstract, p. 1; Tables 2-5 & Figure 6, pp. 8-10
    relation: supports
- claim_id: c-r592-second-backprop-overhead-limitation
  kind: limitation
  statement: Computing the Hessian-vector product H z via automatic differentiation requires a second backpropagation pass (2x theoretical FLOPs and 2.27x-2.91x measured per-iteration wall-clock time relative to Adam when run at every step), and PyTorch lacks native second-order backpropagation support for sparse embedding gradients.
  evidence:
  - source_id: r592-primary-pdf
    locator: Recommendation System section, p. 10; AdaHessian Overhead & Table 8, pp. 11-12
    relation: supports
