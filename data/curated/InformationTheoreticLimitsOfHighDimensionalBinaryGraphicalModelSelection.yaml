claims:
- claim_id: clique-minus-edge-mean-saturation-and-fano-necessary-sample-complexity-bounds
  kind: mechanism
  statement: 'For two Ising parameter vectors theta, theta'' in R^{C(p,2)}, the symmetrized Kullback-Leibler
    divergence satisfies S(theta || theta'') := D(theta || theta'') + D(theta'' || theta) = sum_{s !=
    t} (theta_{st} - theta''_{st})(mu_{st} - mu''_{st}) where mu_{st} = E_theta[X_s X_t] (Equations 18,
    21-22). On the edge-deleted complete graph G^{st} = K_m \ {(s,t)} with uniform edge weight lambda
    > 0 and omega = lambda m >= 2, Lemma 1 (Section 4.2, pp. 12-13, Equations 29-31) proves that the likelihood
    ratio on the missing edge (s, t) satisfies q_{st}/(1 - q_{st}) := P_{theta(G^{st})}[X_s X_t = +1]
    / P_{theta(G^{st})}[X_s X_t = -1] >= exp(omega/2 - 3 lambda/2)/(m + 1) and therefore E_{theta(G^{st})}[X_s
    X_t] >= 1 - 2(m + 1) exp(3 lambda/2)/(exp(omega/2) + (m + 1) exp(3 lambda/2)). Applying Fano''s inequality
    (Lemma 2, pp. 11-12, Equations 27-28) to Ensemble A (M = C(p, 2) single-edge graphs with S = 2 lambda
    tanh(lambda)), Ensemble B (floor(p/(d+1)) cliques of size d+1 minus one edge, where Lemma 2 on p.
    14 bounds S(theta(G^{st}) || theta(G^{uv})) <= 8 lambda d exp(3 lambda/2)/exp(lambda d/2)), and Ensemble
    C (all graphs in G_{p,d}, where Lemma 1(b) on p. 10 bounds log |G_{p,d}| >= (d p/4) log(p/(8d)) and
    I(X_1^n; G) <= n p) establishes Theorem 1 (p. 6, Equations 8-9): any graph decoder phi has worst-case
    error >= 1/2 over G_{p,d}(lambda, omega) if n <= max{ log p / (2 lambda tanh(lambda)), exp(omega/4)
    d lambda log(p d/4 - 1) / (128 exp(3 lambda/2)), (d/8) log(p/(8d))}, yielding n > c max{d^2, lambda^{-2}}
    log p when lambda = O(1/d) (Corollary 1).'
  evidence:
  - source_id: sw2012-binary-graphical-limits-pdf
    locator: Section 3.1, p. 6, Theorem 1, Corollary 1, Equations (8)-(9); Sections 4.1-4.3, pp. 9-15,
      Lemmas 1-2, Equations (17)-(32)
    relation: supports
- claim_id: fkg-likelihood-ratio-bound-and-bounded-edge-necessary-conditions
  kind: mechanism
  statement: 'For the bounded-edge class G_{p,k}(lambda, omega), choosing the largest integer m with k
    + 1 >= C(m, 2) >= floor(sqrt(k)) >= sqrt(k)/2 and forming the family of C(m, 2) subgraphs G^{st} =
    K_m \ {(s,t)} with uniform edge weight lambda > 0, Lemma 3 (Section 4.4, pp. 15-17, Equations 33-34)
    applies the Fortuin-Kasteleyn-Ginibre (FKG) inequality to show that for (s, t) != (u, v), P_{theta(G^{uv})}[X_s
    X_t = +1] / P_{theta(G^{uv})}[X_s X_t = -1] <= P_{theta(K_m)}[X_s X_t = +1] / P_{theta(K_m)}[X_s X_t
    = -1] = exp(2 lambda) q_{st}/(1 - q_{st}), which combined with Lemma 1 (Equation 29) bounds the symmetrized
    KL divergence by S(theta(G^{st}) || theta(G^{uv})) <= 4 lambda (exp(2 lambda) - 1)(m + 1)/exp(omega/2
    - 3 lambda/2) <= 16 omega exp(5 lambda/2) sinh(lambda) / exp(omega/2). Combining this with Ensemble
    A via Fano''s inequality proves Theorem 2 (Section 3.1, p. 7, Equations 10-11): any decoder has worst-case
    error >= 1/2 over G_{p,k}(lambda, omega) if n <= max{log p / (2 lambda tanh(lambda)), exp(omega/2)
    log(k/8) / (64 omega exp(5 lambda/2) sinh(lambda))}, implying n > c max{k, lambda^{-2}} log p when
    lambda = O(k^{-1/2}) (Corollary 2).'
  evidence:
