limitations:
- The analysis is restricted to zero-field pairwise binary Ising Markov random fields on {-1, +1}^p without
  external node potentials or higher-order clique interactions (Section 2.1, p. 3, Equation 2; Section
  6, p. 24).
- Both the maximum-likelihood graph decoder phi* (Equation 36) and the mean-parameter l_infty-projection
  decoder phi^dagger (Equation 42) search exhaustively over the combinatorial graph class G_{p,d} or G_{p,k}
  and are therefore computationally intractable, serving strictly to establish information-theoretic achievability
  rather than polynomial-time algorithms (Section 1, p. 1; Section 5.1, p. 17; Section 5.5.1, p. 20).
- For growing maximum degree d under lambda = O(1/d) (and growing edge count k under lambda ~ k^{-1/2}),
  a multiplicative gap of order d (respectively order k) remains between the necessary sample complexity
  Omega(d^2 log p) (respectively Omega(k log p)) and the sufficient sample complexity O(d^3 log p) (respectively
  O(k^2 log p)); moreover, for unknown edge weights, the mean-parameter projection bound scales as lambda^{-4}
  log p rather than lambda^{-2} log p (Section 3.2, pp. 8-9, Corollaries 3-4; Section 6, p. 24).
- 'Primary-source typographical audit of arXiv:0905.2639v1: (1) Equation (3) (p. 3) writes Z(theta) :=
  log[sum_x exp(...)] with an extra logarithm, whereas Equations (2) and (20) and pp. 16 and 18 use Z(theta)
  = sum_x exp(...) as the partition function; (2) Lemma numbers 1, 2, and 3 are each assigned twice (pp.
  10 & 12, pp. 11 & 14, and pp. 15 & 18); (3) Section 4.1.1 (p. 10) writes ''D(theta || theta'') != D(theta
  || theta'')'' for ''D(theta || theta'') != D(theta'' || theta)'', and Equation (31) (p. 13) indexes
  the binomial sum over m with exponent (2j - m + 1)^2 - 4 in place of the m - 2 vertices outside {s,
  t} with exponent (2j - (m - 2) + 2)^2 - 4; (4) Equation (14) (p. 8) and p. 21 print an unclosed parenthesis
  in ''3 exp(2 omega + 1'' for ''3 exp(2 omega) + 1'' and write J_G(G_hat) <= ||mu_hat - theta(G)|| in
  place of J_G(mu_hat) <= ||mu_hat - mu(theta(G))||_infty; (5) Lemma 4 (p. 18) writes E'' \ E'' for E''
  \ E in E Delta E'', and Sections 5.3-5.4 (pp. 19-20) write sinh^2(lambda/2) when substituting Lemma
  4''s sinh^2(lambda/4); and (6) Appendix A (p. 25, line 9) writes alpha(y)/beta(y) in place of beta(y)/alpha(y)
  in the second factor of Equation (53).'
