id: AIMech:InformationTheoreticLimitsOfHighDimensionalBinaryGraphicalModelSelection
name: Information-Theoretic Limits of High-Dimensional Binary Graphical Model Selection
concept_kind: mathematical_method
aliases:
- Information-Theoretic Limits of Selecting Binary Graphical Models in High Dimensions
- Santhanam-Wainwright Ising Graphical Model Selection Capacity
- Information-Theoretic Sample Complexity of High-Dimensional Ising Model Selection
definition: Information-Theoretic Limits of High-Dimensional Binary Graphical Model Selection is a minimax
  information-theoretic framework (Santhanam & Wainwright 2012, IEEE Transactions on Information Theory
  58(7):4117-4134, arXiv:0905.2639v1) that characterizes necessary and sufficient sample sizes n for exact
  structure recovery of p-vertex pairwise binary Markov random fields (zero-field Ising models P_theta(x)
  = (1/Z(theta)) exp(sum_{(s,t) in E} theta_{st} x_s x_t) on {-1, +1}^p) over bounded-degree graph families
  G_{p,d}(lambda, omega) (maximum degree at most d) and bounded-edge graph families G_{p,k}(lambda, omega)
  (at most k edges) parameterized by minimum edge weight lambda*(theta(G)) := min_{(s,t) in E} |theta_{st}|
  >= lambda and maximum neighborhood weight omega*(theta(G)) := max_{s in V} sum_{t in N(s)} |theta_{st}|
  <= omega. By combining Fano's inequality over single-edge, clique-minus-single-edge (K_m \ {(s,t)}),
  and full-graph packing ensembles with explicit maximum-likelihood and mean-parameter l_infty-projection
  graph decoders analyzed via symmetric-difference edge matchings and a spin-flipping separation lemma,
  the framework establishes that sample complexity grows exponentially in omega and that under non-saturation
  scalings lambda = O(1/d) (for G_{p,d}) or lambda = O(k^{-1/2}) (for G_{p,k}), n > c max{d^2, lambda^{-2}}
  log p (respectively n > c max{k, lambda^{-2}} log p) samples are necessary for any decoder to achieve
  worst-case error below 1/2 while n > c' max{d^2, lambda^{-2}} d log p (respectively n > c' k^2 log p
  for lambda ~ k^{-1/2}) samples suffice.
review_status: DRAFT
identity_notes: Resolved against all 442 pinned AIO records in data/aio/ and sources/aio/aio.json and
  630 maintained concepts in data/curated/. Distinct from AIMech:HighDimensionalIsingModelSelectionViaL1RegularizedLogisticRegression
  (Ravikumar, Wainwright, & Lafferty 2010), which analyzes a polynomial-time nodewise l_1-regularized
  logistic regression estimator under sample/population Fisher mutual incoherence and proves sufficient
  sample complexity n = Omega(d^3 log p) for theta*_min = Omega(1/d) without establishing algorithm-independent
  Fano lower bounds, maximum-neighborhood-weight exponential barriers exp(omega/2), or information-theoretic
  ML/mean-projection decoders without incoherence assumptions. Distinct from AIMech:InformationTheoreticLimitsOfHighDimensionalNoisySparsityRecovery
  (Wainwright 2009), which studies vector support recovery in linear Gaussian regression Y = X beta +
  W rather than undirected binary graphical model selection on {-1, +1}^p. Distinct from AIMech:MinimaxInformationTheoreticLowerBoundsViaPackingsAndFanoInequality
  (Yu 1997; Yang & Barron 1999), which provides general metric-entropy Fano/Le Cam/Assouad machinery rather
  than Ising-specific clique-minus-edge mean-parameter saturation bounds (Lemmas 1-3), FKG likelihood
  ratio bounds, symmetric-difference matching divergence bounds (Lemma 4), and spin-flipping separation
  lemmas (Lemmas 6-8).
