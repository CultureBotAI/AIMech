    locator: Section 3.1, p. 7, Theorem 2, Corollary 2, Equations (10)-(11); Section 4.4, pp. 15-17, Lemma
      3, Equations (33)-(34)
    relation: supports
- claim_id: matching-number-chernoff-achievability-and-mean-parameter-projection-decoding
  kind: mechanism
  statement: For known edge weights, the maximum likelihood decoder phi*(X_1^n) = argmax_{G in G} (1/n)
    sum_{i=1}^n log P_{theta(G)}[X^{(i)}] (Equations 35-36) satisfies the pairwise Chernoff bound P[ell_{theta(G')}(X_1^n)
    >= ell_{theta(G)}(X_1^n)] <= exp(-(n/2) J(theta(G) || theta(G'))) where J(theta || theta') := D((theta
    + theta')/2 || theta) + D((theta + theta')/2 || theta') = log(Z(theta) Z(theta') / Z^2((theta + theta')/2))
    (Lemma 3, p. 18, Equations 19-20, 37). Using the spin-flipping lemma (Lemma 8, Appendix B, pp. 26-27,
    Equation 56, proving that for any (s, t) in E \ E' flipping x_s, x_t, or both changes Delta(x) by
    at least |theta_{st}|) and quadratic root contradiction (Lemma 7, Appendix A, pp. 24-26, Equation
    50), Lemma 4 (Section 5.2, p. 18, Equation 38) lower bounds J(theta(G) || theta(G')) >= (m(G, G')
    / (3 exp(2 omega) + 1)) sinh^2(lambda/4) where m(G, G') is the matching number of the symmetric difference
    E Delta E' (with m(G, G') >= |E Delta E'|/(4d) on G_{p,d}), proving Theorem 3(a) (n = O(max{d^2, lambda^{-2}}
    d log p) for lambda = O(1/d), Corollary 3) and Theorem 4(a) (n = O(k^2 log p) for lambda ~ k^{-1/2},
    Corollary 4). For unknown edge weights, the mean-parameter projection decoder phi^dagger(X_1^n) =
    argmin_{G in G} min_{theta in Theta_{lambda,omega}(G)} ||mu_hat - mu(theta)||_infty with mu_hat_{st}
    = (1/n) sum_{i=1}^n X_s^{(i)} X_t^{(i)} (Equations 41-42) combines Hoeffding concentration (Lemma
    5, p. 21) with pairwise mean separation max_{u in {s,t}, v in V} |E_{theta(G)}[X_u X_v] - E_{theta(G')}[X_u
    X_v]| >= sinh^2(lambda/4) / (2 omega (3 exp(2 omega) + 1)) (Lemma 6, pp. 21-23) to achieve error <=
    delta for n > [omega(3 exp(2 omega) + 1) / sinh^2(lambda/4)]^2 (16 log p + 4 log(2/delta)) (Theorems
    3(b) and 4(b), Equation 14).
  evidence:
  - source_id: sw2012-binary-graphical-limits-pdf
    locator: Section 3.2, pp. 8-9, Theorems 3-4, Corollaries 3-4, Equations (12)-(16); Section 5 and Appendices
      A-B, pp. 17-27, Lemmas 3-8, Equations (35)-(58)
    relation: supports
