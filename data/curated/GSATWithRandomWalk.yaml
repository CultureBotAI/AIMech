name: GSAT with random walk
definition: A GSAT variant that mixes a uniformly chosen flip from the distinct variables currently occurring
  in unsatisfied clauses with a globally best GSAT flip, using a fixed probability to choose the focused
  random move.
concept_kind: algorithm
identity_notes: 'This is the mixed random-walk extension of GSAT described by Selman and Kautz and clarified
  in the later noise paper. Its focused move samples a duplicate-free union of eligible variables, not
  a clause followed by one of its variables. The latter distribution underlies the separately described
  WSAT family. It is also distinct from unrestricted GSAT random noise and from a pure clause-first walk
  for 2-SAT. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  316 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 7 and 7 lines respectively. All seven unique lines were inspected,
  and the sorted checkout hit sets were identical: neighboring GSAT/WalkSAT mentions and saved review/ledger
  references, not existing candidate records. Eight exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and four full native neighboring records were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.'
limitations:
- The focused random branch and the global greedy branch use different candidate sets. Replacing the former
  by random-clause-then-random-variable sampling changes the transition distribution, even at p=1. Shared
  behavior at p=0 does not make the full variant identical to basic GSAT.
- Finite search failure is not a proof of unsatisfiability. The polynomial analysis cited for pure random
  walks on satisfiable 2-CNF does not establish a corresponding general-CNF bound for this mixture.
- The noise parameter, CNF encoding, initialization and outer budgets affect behavior. No single best
  p, universal speedup or numerical benchmark claim is curated. Empty clauses or empty candidate sets
  require explicit handling outside the described nonempty-variable flip rule.
- The record curates the move policy and its stated GSAT context, not an executed solver or a certification
  of every loop boundary. The original GSAT pre-flip-only pseudocode boundary remains an implementation
  choice to declare.
