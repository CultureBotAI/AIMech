aio_no_match:
  search_scope: All 442 pinned AIO labels/scoped synonyms and 316 preceding maintained IDs/names/aliases;
    ignored/hidden full-checkout text in main and worktree; semantic labels for search, heuristics, satisfiability,
    logic, reasoning, noise and randomness; eight exact AIO CLASS nodes and four complete native neighbors.
  rationale: No suitable target was established for these symbolic SAT-search variants in the inspected
    snapshot and semantic neighborhood. Stochastic moves, noise terminology and logical formulas do not
    justify a forced learning-task, neural-layer or language-model mapping.
  examined_targets:
  - target: AIO:ReasoningLLM
    rejection_reason: A language model performing reasoning during language tasks is not a CNF assignment-search
      algorithm.
  - target: AIO:TrainingStrategy
    rejection_reason: These SAT procedures do not require preprocessing or training a machine-learning
      model.
  - target: AIO:MachineLearningTask
    rejection_reason: Searching a supplied formula for a model does not itself require developing a method
      that learns from data.
  - target: AIO:ReinforcementLearning
    rejection_reason: Random exploration and greedy clause scores do not make this fixed-formula search
      a reinforcement-learning task or a learned action-value method.
  - target: AIO:MarkovChain
    rejection_reason: Fixed configurations can admit a Markov description, but that representation does
      not establish this named algorithm’s identity or a specific semantic mapping to the pinned network/model
      class. No transition-model concept is curated here.
  - target: AIO:ArtificialNeuralNetwork
    rejection_reason: The described mechanisms manipulate Boolean assignments and clause counts, without
      requiring a network of artificial neurons.
  - target: AIO:NoiseDenseLayer
    rejection_reason: Random variable flips in SAT search are not noise injection into dense-layer weights
      for neural regularization.
  - target: AIO:GaussianNoiseLayer
    rejection_reason: The noise is a choice of discrete search move, not additive zero-centered Gaussian
      regularization of neural inputs.
