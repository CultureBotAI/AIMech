claims:
- claim_id: method
  kind: mechanism
  statement: Maintain a complete assignment of the variables in the input CNF formula. Stop successfully
    when it satisfies the formula. Otherwise, with fixed probability p, select uniformly from the distinct
    variables appearing in at least one currently unsatisfied clause and flip the chosen variable. With
    probability 1−p, evaluate all single-variable flips and choose a largest increase in the total number
    of satisfied clauses, breaking tied best choices randomly as in GSAT. The random and greedy branches
    can make non-improving moves. The extension can use the GSAT outer random-initialization, per-attempt
    flip budget and restart/attempt budget. The 1994 paper explicitly explains the duplicate-free variable
    list, which gives equal probabilities to eligible variables even when their clause occurrence counts
    differ.
