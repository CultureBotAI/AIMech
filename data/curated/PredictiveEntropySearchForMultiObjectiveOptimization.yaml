  rationale: PESMO adaptively chooses informative objective evaluations. This resembles the pinned task
    of querying an information source, but multi-objective optimization and Pareto-set inference are not
    identical to labeling data for predictive learning. The mapping is a qualified curator relation, not
    an exact match or an upstream subclass assertion.
