claims:
- claim_id: entropy-gradient
  kind: mechanism
  statement: Let u=Wx+b with square invertible W and y_i=1/(1+exp(-u_i)). The output differential entropy
    differs from H(X) by log|det W|+sum_i E[log(y_i(1-y_i))]. Its ordinary gradient updates are proportional
    to W^(-T)+(1-2y)x^T for W and 1-2y for b, averaged or sampled over observations. This is the ordinary
    parameter gradient, not a natural-gradient replacement. The inverse term is undefined at singular
    W, and finite steps need not preserve invertibility automatically.
  evidence:
  - source_id: method-source
    locator: Sections 2.1-2.2, Equations 2.2-2.16, printed pp. 1131-1134 / PDF pp. 3-6; Appendix A.1-A.8,
      pp. 1154-1155 / PDF pp. 26-27
    relation: supports
- claim_id: information-and-independence
  kind: limitation
  statement: 'The curated objective is output differential entropy. For noiseless invertible transformations
    of continuous variables, mutual information between input and output is infinite, so the finite change-of-variables
    contrast is not a finite noiseless mutual-information value. A finite added output-noise model has
    a different noisy-output entropy unless the appropriate limiting approximation is justified. Maximizing
    the sigmoid-output entropy also trades off marginal entropy and dependence: a fixed nonlinearity mismatched
    to source distributions can prefer mixed outputs. The source illustrates this for uniform sources;
    arbitrary stationary points do not certify independent components.'
  evidence:
  - source_id: method-source
    locator: Section 2.1, printed p. 1131 / PDF p. 3; Section 4 and Figure 4, pp. 1141-1143 / PDF pp.
      13-15; curator continuous-information qualification
    relation: supports
- claim_id: source-separation-scope
  kind: scope
  statement: The instantaneous application assumes a linear mixture x=A s and seeks unsquashed outputs
    u that recover sources up to scale, sign and permutation under suitable distributional and identifiability
    conditions. The historical demonstrations mix recorded audio and discuss failures with multiple Gaussian
    white-noise sources and ill-conditioned mixing. The paper separately derives FIR blind deconvolution,
    which can whiten a nonwhite source instead of recovering the exact original. Neither arbitrary acoustic
    propagation delays nor unmodeled input noise is handled by the standard instantaneous rule.
  evidence:
  - source_id: method-source
    locator: Sections 3-5.3, printed pp. 1138-1149 / PDF pp. 10-21; Section 6.4, pp. 1153-1154 / PDF pp.
      25-26
    relation: supports
limitations:
- Square nonsingular mixing, suitable source distributions and an appropriate contrast are substantive
  assumptions. The standard fixed logistic rule is not a universal source-separation or independence guarantee.
- The generalized sigmoid ODE in Equation 2.32 gives a chain-rule factor y^(p-1)(1-y)^(r-1) multiplying
  p(1-y)-r*y; Equations 2.33-2.34 omit it outside the standard p=r=1 case. Curator arithmetic verifies
  this discrepancy. Those generalized variants are excluded here; no uninspected author-code defect is
  asserted.
- Gradient ascent with a chosen finite learning rate need not converge globally or monotonically. The
  inverse-weight term is nonlocal; the source does not establish a biological learning mechanism.
- Audio demonstrations, annealing schedules and comparative timings are historical source-specific evidence.
  No author implementation, audio separation experiment or benchmark was run.
