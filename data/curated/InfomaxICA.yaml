name: Infomax Independent Component Analysis
aliases:
- Infomax ICA
- Bell-Sejnowski ICA
concept_kind: algorithm
definition: An unsupervised source-separation learning algorithm that adjusts an invertible square linear
  transform and biases by the ordinary gradient of the differential entropy of coordinatewise sigmoid-transformed
  outputs.
identity_notes: 'Scoped to the standard logistic instantaneous algorithm of Bell and Sejnowski 1995. The
  unsquashed linear outputs estimate sources; the sigmoid outputs define its entropy contrast. This is
  distinct from the broader Infomax principle, Deep InfoMax’s learned dependence critics, later natural-gradient
  ICA, FastICA, and the paper’s separately developed temporal deconvolution and generalized-sigmoid variants.
  Four candidate identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms and
  450 preceding native IDs, names and aliases, with no normalized match. Ignored/hidden full-checkout
  searches returned the same 106 matched-line set in each checkout after the prior merge. All matched
  excerpts from 76 files were read; they are discovery context, not existing concept records. The semantic
  search covered all pinned labels and scoped synonyms and returned 212 rows: 205 byte-equivalent prior
  readings and seven additional rows, all inspected. Twenty-three annotated AIO nodes with outgoing edges
  comprise 21 unchanged prior readings and two new inspections. Thirty contextual YAMLs, including seven
  native neighbors, comprise 25 unchanged prior readings and five complete new readings. This absence
  assessment is bounded to the pinned snapshot and inspected maintained corpus.'
