id: AIMech:WorstCaseProximalDenoisingNMSEAndSubdifferentialMeanSquaredDistance
name: Worst-Case Proximal Denoising Normalized Mean-Squared Error and Subdifferential Mean-Squared Distance
review_status: DRAFT
concept_kind: mathematical_method
aliases:
- Proximal Denoising Worst-Case NMSE and Subdifferential Distance
- Oymak-Hassibi Sharp MSE Bounds for Proximal Denoising
- Expected Squared Distance to Scaled Subdifferential D(lambda partial f)
- Projected LASSO Risk and Subdifferential Distance Phase Transition
definition: 'Worst-Case Proximal Denoising Normalized Mean-Squared Error and Subdifferential Mean-Squared Distance is a convex-geometric and statistical estimation framework introduced by Oymak and Hassibi (2016, Foundations of Computational Mathematics 16(4):965-1029, DOI:10.1007/s10208-015-9278-4, arXiv:1305.2714v5) for recovering a structured signal $x_0 \in \mathbb{R}^n$ from additive Gaussian noise $y = x_0 + \sigma v$ ($v \sim \mathcal{N}(0, I_n)$) via the regularized proximal denoiser $x^*(\sigma\lambda, \sigma v) = \arg\min_x \{\frac{1}{2}\|y - x\|_2^2 + \sigma\lambda f(x)\}$ or the constrained denoiser $x^c(\sigma v) = \arg\min_{f(x) \le f(x_0)} \|y - x\|_2^2$ for a proper continuous convex function $f : \mathbb{R}^n \to \mathbb{R}$. It proves that the worst-case normalized mean-squared error $\operatorname{NMSE}(\sigma) = \mathbb{E}[\|x^*(\sigma\lambda, \sigma v) - x_0\|_2^2]/\sigma^2$ over all noise levels $\sigma > 0$ is achieved in the vanishing-noise limit $\sigma \to 0^+$ and equals the expected squared Euclidean distance of a standard Gaussian vector to the scaled subdifferential $\mathbf{D}(\lambda\partial f(x_0)) := \mathbb{E}[\operatorname{dist}(g, \lambda\partial f(x_0))^2]$ (Theorem 1.1), while for $0 \notin \partial f(x_0)$ the worst-case constrained denoising NMSE equals $\mathbf{D}(\operatorname{cone}(\partial f(x_0))) = \inf_{\lambda \ge 0} \mathbf{D}(\lambda\partial f(x_0))$ (Theorem 3.1), which coincides with the statistical dimension of the descent cone $T_f(x_0)$ and governs the exact compressed sensing phase transition and high-SNR projected LASSO risk $\eta_{\text{LASSO}} = \mathbf{D}/(m - \mathbf{D})$ (Theorem 3.3 and Proposition 7.1).'
identity_notes: Checked against all 442 pinned AIO concepts and 653 maintained AIMech concepts. Distinct from `AIMech:ConicStatisticalDimensionIntrinsicVolumeConcentrationAndPhaseTransitions` (Amelunxen, Lotz, McCoy, & Tropp 2014, Information and Inference 3(3):224-294), which defines conic intrinsic volumes $v_k(C)$, statistical dimension $\delta(C) = \mathbb{E}[\|\Pi_C(g)\|_2^2]$, and kinematic conic intersection phase transitions, whereas Oymak & Hassibi (2016) analyze finite-noise and vanishing-noise regularized proximal denoisers $x^*(\sigma\lambda, \sigma v)$ and constrained denoisers $x^c(\sigma v)$, proving point-wise domination $\|x^*(\sigma\lambda, \sigma v) - x_0\|_2 \le \operatorname{dist}(\sigma v, \sigma\lambda\partial f(x_0))$ (Lemma 5.1) and the exact identity $\sup_{\sigma > 0} \operatorname{NMSE}(\sigma) = \lim_{\sigma \to 0^+} \operatorname{NMSE}(\sigma) = \mathbf{D}(\lambda\partial f(x_0))$ (Theorem 1.1), establishing tight multiplicative sandwiching ratios $1 + 2/\sqrt{k^3/n}$ and $1 + 2/\sqrt{r^3 d}$ between $\inf_{\lambda \ge 0}\mathbf{D}(\lambda\partial f(x_0))$ and the squared Gaussian complexity $\mathbf{S}(T_f(x_0) \cap \mathcal{B}^n)$ (Proposition 6.1), and deriving the high-SNR projected LASSO risk $\mathbf{D}/(m - \mathbf{D})$ and optimal cost $m - \mathbf{D}/(m - \mathbf{D})$ (Theorem 3.3 and Proposition 7.1). Also distinct from `AIMech:AtomicNormConvexGeometryAndTangentConeGaussianWidthForLinearInverseProblems` (Chandrasekaran et al. 2012) and `AIMech:MinimaxRiskOfMatrixDenoisingBySingularValueSoftThresholding` (Donoho & Gavish 2014).
