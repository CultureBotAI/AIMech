- claim_id: gaussian-squared-complexity-sandwiching-and-decomposable-subdifferential-cone-gap-bounds
  kind: mechanism
  statement: 'For any proper convex function $f$ and $x_0 \in \mathbb{R}^n$, the conic subdifferential distance $\mathbf{D}(\operatorname{cone}(\partial f(x_0)))$ and the squared Gaussian width $\mathbf{S}(T_f(x_0) \cap \mathcal{B}^n) := (\mathbb{E}[\sup_{u \in T_f(x_0) \cap \mathcal{B}^n} \langle u, g\rangle])^2$ satisfy the universal additive sandwiching $0 \le \mathbf{D}(\operatorname{cone}(\partial f(x_0))) - \mathbf{S}(T_f(x_0) \cap \mathcal{B}^n) \le 1$ (Proposition 6.1, Eq. 6.1, p. 16; Lemma C.1, p. 29), and tighter multiplicative bounds $\frac{\min_{\lambda \ge 0} \mathbf{D}(\lambda\partial f(x_0))}{\mathbf{S}(T_f(x_0) \cap \mathcal{B}^n)} \le 1 + \frac{2}{\sqrt{k^3 / n}}$ for the $\ell_1$ norm at a $k$-sparse vector in $\mathbb{R}^n$ (Eq. 6.2) and $\le 1 + \frac{2}{\sqrt{r^3 d}}$ for the nuclear norm at a rank-$r$ matrix in $\mathbb{R}^{d \times d}$ (Eq. 6.3, Lemmas C.2-C.3, pp. 29-30). Furthermore, for norms whose subdifferential decomposes over orthogonal subspaces $T$ and $T^\perp$ as $\partial f(x_0) = \{e + w : w \in \partial f_{T^\perp}(0), \|w\|_2 \le R_{x_0}\}$ with $e \in T$ ($\|e\|_2 \ge L_{x_0}^{-1}$) and radial convexity along $T^\perp$, the gap between ray-scaled subdifferential distance and the full cone satisfies $0 \le \min_{\lambda \ge 0} \mathbf{D}(\lambda\partial f(x_0)) - \mathbf{D}(\operatorname{cone}(\partial f(x_0))) \le 2\pi R_{x_0}^2 L_{x_0}^2 + 2\sqrt{2\pi}\,R_{x_0} L_{x_0} \sqrt{\mathbf{D}(\operatorname{cone}(\partial f(x_0)))} + 1$ (Proposition 6.2, p. 17; Lemma C.4, p. 30).'
