- claim_id: compressed-sensing-phase-transition-and-projected-lasso-asymptotic-risk-and-cost-laws
  kind: scope
  statement: 'In noisy linear inverse problems $y = A x_0 + \sigma v \in \mathbb{R}^m$ with i.i.d. standard Gaussian $A \in \mathbb{R}^{m \times n}$ and $v \sim \mathcal{N}(0, I_m)$, the tangent-cone projected LASSO $\hat{x} = \arg\min_{x - x_0 \in T_{\mathcal{C}}(x_0)} \|y - A x\|_2$ (which bounds the constrained LASSO error via $\|x^* - x_0\|_2 \le 2\|\hat{x} - x_0\|_2$, Lemma 7.1, Eq. 7.3) undergoes a sharp phase transition governed solely by $\mathbf{D} = \mathbf{D}(T_{\mathcal{C}}(x_0)^*) = \mathbf{D}(\operatorname{cone}(\partial f(x_0)))$: in the asymptotic regime $n \to \infty$ with $|m - \mathbf{D}| / \sqrt{m} \to \infty$, the normalized estimation error $\eta_{\text{LASSO}} = \lim_{\sigma \to 0} \frac{\|\hat{x} - x_0\|_2^2}{\sigma^2}$ and normalized optimal cost $F_{\text{LASSO}} = \lim_{\sigma \to 0} \frac{\|y - A\hat{x}\|_2^2}{\sigma^2}$ converge in probability to $\eta_{\text{LASSO}} = \frac{\mathbf{D}}{m - \mathbf{D}}$ and $F_{\text{LASSO}} = m - \frac{\mathbf{D}}{m - \mathbf{D}}$ when $m > \mathbf{D}$, whereas for $m < \mathbf{D}$ recovery fails with $\eta_{\text{LASSO}} = \infty$ and $F_{\text{LASSO}} = 0$ (Theorem 3.3, Eqs. 3.8-3.9, pp. 7-8; Proposition 7.1, Eqs. 7.5-7.9, pp. 18-19).'
  evidence:
  - source_id: oh2016-prox-denoising-pdf
    locator: Section 3.3, pp. 7-8, Theorem 3.3, Equations (3.6)-(3.9); Section 7, pp. 18-19, Theorem 7.1, Lemma 7.1, Proposition 7.1, Equations (7.1)-(7.9)
    relation: supports
