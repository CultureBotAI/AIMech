claims:
- claim_id: pointwise-subdifferential-domination-and-exact-vanishing-noise-proximal-and-constrained-denoising-nmse
  kind: mechanism
  statement: 'For any proper continuous convex function $f : \mathbb{R}^n \to \mathbb{R}$, signal $x_0 \in \mathbb{R}^n$, tuning multiplier $\lambda \ge 0$, noise scale $\sigma > 0$, and noise realization $v \in \mathbb{R}^n$, the regularized proximal denoiser $x^*(\sigma\lambda, \sigma v) = \arg\min_x \{\frac{1}{2}\|x_0 + \sigma v - x\|_2^2 + \sigma\lambda f(x)\}$ satisfies the deterministic point-wise bound $\|x^*(\sigma\lambda, \sigma v) - x_0\|_2 \le \operatorname{dist}(\sigma v, \sigma\lambda\partial f(x_0))$ via nonexpansiveness of proximal mappings applied to the first-order subdifferential support function $\hat{f}_{x_0}(x) = f(x_0) + \sup_{s \in \partial f(x_0)} \langle s, x - x_0\rangle \le f(x)$ (Lemma 5.1, Eqs. 5.1-5.6, pp. 12-13). Taking expectations over $v \sim \mathcal{N}(0, I_n)$ and using local Lipschitz continuity of $f$ to control the directional derivative limit as $\sigma \to 0^+$ (Lemmas 5.2-5.3, Proposition 5.2, pp. 13-16) yields the exact worst-case identity $\sup_{\sigma > 0} \frac{\mathbb{E}[\|x^*(\sigma\lambda, \sigma v) - x_0\|_2^2]}{\sigma^2} = \lim_{\sigma \to 0^+} \frac{\mathbb{E}[\|x^*(\sigma\lambda, \sigma v) - x_0\|_2^2]}{\sigma^2} = \mathbf{D}(\lambda\partial f(x_0)) := \mathbb{E}[\operatorname{dist}(v, \lambda\partial f(x_0))^2]$ (Theorem 1.1, Eq. 2.7, p. 4). Moreover, when $0 \notin \partial f(x_0)$, the constrained denoiser $x^c(\sigma v) = \arg\min_{f(x) \le f(x_0)} \|x_0 + \sigma v - x\|_2^2$ satisfies $\|x^c(\sigma v) - x_0\|_2 \le \operatorname{dist}(\sigma v, \operatorname{cone}(\partial f(x_0))) = \|\Pi_{T_f(x_0)}(\sigma v)\|_2$ point-wise and $\sup_{\sigma > 0}\frac{\mathbb{E}[\|x^c(\sigma v) - x_0\|_2^2]}{\sigma^2} = \lim_{\sigma \to 0^+} \frac{\mathbb{E}[\|x^c(\sigma v) - x_0\|_2^2]}{\sigma^2} = \mathbf{D}(\operatorname{cone}(\partial f(x_0))) = \inf_{\lambda \ge 0} \mathbf{D}(\lambda\partial f(x_0))$ (Theorem 3.1, Eqs. 3.1-3.3, p. 6; Appendix B Lemma B.1, pp. 27-29).'
