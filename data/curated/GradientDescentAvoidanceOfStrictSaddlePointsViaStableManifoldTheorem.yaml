claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'For any C^2 function f: R^d -> R with L-Lipschitz gradient and step size 0 < alpha < 1 / L, the gradient descent map g(x) = x - alpha grad f(x) is a global C^1 diffeomorphism whose inverse is the single-valued proximal operator of h(x) = -alpha f(x) + ||x||_2^2 / 2, and whose differential Dg(x^*) = I - alpha grad^2 f(x^*) at any strict saddle point x^* has at least one eigenvalue strictly greater than 1, ensuring that the set of initial conditions converging to any strict saddle point has Lebesgue measure zero.'
  evidence:
  - source_id: r338-primary-pdf
    locator: Section 4.1, Theorem 4.1, Theorem 4.2, and Proposition 4.5, pp. 5-7
    relation: supports
  - source_id: r338-arxiv-abs
    locator: 'Abstract: Gradient descent with random initialization converges to a strict saddle point with probability zero via the Stable Manifold Theorem'
    relation: supports
- claim_id: claim-02
  kind: mechanism
  statement: In the quadratic model f(x) = (1/2) x^T H x with indefinite invertible Hessian H having k > 0 negative eigenvalues, gradient descent x_{t+1} = (I - alpha H) x_t converges to the saddle point 0 if and only if x_0 lies in the (d-k)-dimensional subspace E_s spanned by eigenvectors with positive eigenvalues, whereas any nonzero projection onto the unstable subspace E_u grows geometrically as (1 - alpha lambda_i)^t with 1 - alpha lambda_i > 1.
  evidence:
  - source_id: r338-primary-pdf
    locator: Section 3, Motivating Quadrics (Proposition 3.1), pp. 4-5
    relation: supports
  - source_id: r338-metadata-cr
    locator: 'Abstract: Analysis of unstable eigendirections and measure-zero stable manifolds for gradient descent'
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: 'The strict-saddle condition lambda_min(grad^2 f(x^*)) < 0 and the step-size bound alpha < 1 / L are both necessary: for the C^2 function f(x, y) = x^2 / 2 + y^4 / 4 - y^3 / 3, the point (0, 0) is a degenerate (non-strict) saddle point with Hessian diag(1, 0), and every initial condition in the positive-measure open rectangle (0, 1) x (-2, 0) converges under gradient descent to the saddle point (0, 0) rather than the local minimum (0, 1).'
  evidence:
  - source_id: r338-primary-pdf
    locator: Appendix A, Necessity of Strict Saddle Assumption, pp. 10-11
    relation: supports
