claims:
- claim_id: modified-cholesky-row-decomposable-gaussian-likelihood-and-hierarchical-zero-propagation
  kind: mechanism
  statement: 'Under the modified Cholesky decomposition Sigma^{-1} = T^T D^{-1} T with unit lower-triangular T = I - Phi and diagonal residual variance matrix D = diag(sigma_1^2, ..., sigma_p^2) from regressing X_j on X_1, ..., X_{j-1} (Section 2, Equations 1-3, pp. 248-249 / PDF pp. 4-5), the Gaussian negative log-likelihood decomposes into p separable row objectives ell(Sigma, x_1, ..., x_n) = sum_{j=1}^p ell_j(sigma_j, phi_j, x_1, ..., x_n) where ell_j = n log sigma_j^2 + sum_{i=1}^n (x_{ij} - sum_{l=1}^{j-1} phi_{jl} x_{il})^2 / sigma_j^2 (Equations 4-5, pp. 249-250 / PDF pp. 5-6). Replacing the unstructured L1 penalty lambda sum_{l=1}^{j-1} |phi_{jl}| (Equations 6-8) with the nested Lasso penalty J_0(phi_j) = lambda(|phi_{j,j-1}| + |phi_{j,j-2}|/|phi_{j,j-1}| + ... + |phi_{j,1}|/|phi_{j,2}|) or its scale-adjusted variants J_1(phi_j) and J_2(phi_j) (Equations 9-11, pp. 250-251 / PDF pp. 6-7, with 0/0 = 0) enforces hierarchical predecessor exclusion: whenever phi_{j,l} = 0, any nonzero
    coefficient among phi_{j,1}, ..., phi_{j,l-1} incurs an infinite penalty, so row j retains only a contiguous band of k_j <= j - 1 closest predecessors.'
  evidence:
  - source_id: lrz2008-nested-lasso-pdf
    locator: Section 2 and Section 2.1, Equations (1)-(12) and Figure 1, pp. 248-251 (PDF pp. 4-7)
    relation: supports
- claim_id: precision-matrix-sparsity-preservation-versus-unstructured-cholesky-lasso-fill-in
  kind: scope
  statement: Whereas applying an unstructured L1 (Lasso) penalty directly to the entries of the Cholesky factor T (Huang et al. 2006, Equations 6-8) places zeros at irregular locations in T (Figure 1b) so that the product Sigma_hat^{-1} = T_hat^T D_hat^{-1} T_hat loses sparsity through outer-product fill-in, adaptive banding via the nested Lasso penalty (Figure 1c) guarantees that T_hat remains banded with overall bandwidth k = max_j k_j and preserves exact structural zeros in the estimated precision matrix Sigma_hat^{-1} (Section 1, pp. 247-248 / PDF pp. 3-4; Section 3.1, Table 3 and Figures 2-3, pp. 256-258 / PDF pp. 12-14).
  evidence:
  - source_id: lrz2008-nested-lasso-pdf
    locator: Section 1, pp. 247-248 (PDF pp. 3-4); Section 3.1, Table 3 and Figures 2-3, pp. 256-258 (PDF pp. 12-14)
    relation: supports
- claim_id: alternating-local-quadratic-approximation-and-coordinate-shooting-algorithm
  kind: mechanism
  statement: To minimize the nonconvex row objective ell_j(sigma_j, phi_j) + J(phi_j) (Equation 12), Section 2.2 (pp. 252-253 / PDF pp. 8-9) initializes phi_hat^{(0)}_{jt} = phi_hat^*_{jt} via univariate marginal regressions of X_j on X_t alone (well defined even when p > n) and alternates between Step 1, updating the residual variance in closed form (sigma_hat^{(k)}_j)^2 = (1/n) sum_{i=1}^n (x_{ij} - sum_{t=1}^{j-1} phi_hat^{(k)}_{jt} x_{it})^2, and Step 2, updating phi_hat^{(k+1)}_j via the local quadratic approximation |phi^{(k+1)}_{jt}| approx (phi^{(k+1)}_{jt})^2 / (2|phi_hat^{(k)}_{jt}|) + |phi_hat^{(k)}_{jt}| / 2 (Equation 13) with |phi_hat^{(k)}_{j,t+1}| substituted in the ratio denominators, which converts each iteration into a closed-form generalized ridge regression problem with thresholding at 10^{-10} (or equivalently solves Step 2 by coordinate-wise shooting over piecewise-convex univariate subproblems).
  evidence:
  - source_id: lrz2008-nested-lasso-pdf
    locator: Section 2.2, Equation (13) and Steps 1-2, pp. 252-253 (PDF pp. 8-9)
    relation: supports
