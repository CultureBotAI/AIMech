id: AIMech:GlobalKernelKMeans
name: Global Kernel K-Means
aliases: []
concept_kind: algorithm
definition: An incremental kernel clustering algorithm that adds a singleton datum cluster at each stage,
  runs kernel k-means from each such candidate partition, and retains the candidate with the smallest
  feature-space clustering error.
identity_notes: This is the Tzortzis-Likas2009 global kernel k-means procedure, including its positive
  observation-weight extension. It tries all datum candidates at each stage, unlike the fast one-candidate
  procedure or CMM-selected subset. Adding clusters is not an asserted nested hierarchy because local
  fitting can reassign all observations. The algorithm name does not certify a globally optimal partition.
  Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 492 prior native IDs, names and
  aliases; no normalized identity collision. Full searches of both checkouts include ignored and hidden
  files, returning 62 worktree and 62 main matched lines. All 47 distinct matched texts were inspected
  as neighboring method mentions, query/frontier references or rendered copies. Eleven annotated AIO nodes,
  eleven generated YAMLs and seven native neighbors were examined. Nine unchanged annotated nodes, their
  generated YAMLs, all 442 class labels and 139 semantic rows reuse byte-verified earlier readings; two
  additional annotated targets and eight new semantic rows were read (147 rows total). Absence is bounded
  to this pin and corpus.
