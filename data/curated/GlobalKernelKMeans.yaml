limitations:
- PSD kernels, positive cluster weight and well-defined nonempty updates are conditions for the RKHS distance
  and descent arguments. Arbitrary similarities or arbitrary sigmoid-kernel parameters do not automatically
  satisfy them. Ties, empty clusters and stopping need explicit implementation conventions.
- Dense Gram storage is quadratic in N. Kernel choice, supplied cluster count and initialization affect
  results. No global optimum, approximation ratio, universal empirical superiority or biological causal
  interpretation is asserted.
- The primary papers use particular synthetic, digit, face, expression or graph settings, chosen kernels
  and parameters, and supplied cluster counts. Their finite comparisons do not establish universal performance.
  No historical implementation or benchmark was reproduced.
