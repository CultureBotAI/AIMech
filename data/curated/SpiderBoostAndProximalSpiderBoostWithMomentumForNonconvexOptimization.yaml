claims:
- claim_id: r376-claim-epoch-grouped-telescoping-and-constant-step-size
  kind: mechanism
  statement: Whereas original SPIDER bounds single-step descent by enforcing ||v_k - nabla f(x_k)||_2 <= varepsilon at every step via a tiny step size eta = O(varepsilon / L), SpiderBoost (Algorithm 1, Theorem 1) telescopically sums the accumulated recursive variance E||v_k - nabla f(x_k)||_2^2 <= sum_{j=(n_k-1)q}^{k-1} (L^2 / |S|) E||x_{j+1} - x_j||_2^2 across each entire epoch of length q = |S| = ceil(n^{1/2}), yielding a positive per-step descent coefficient beta_1 = 1/(2*eta) - L/2 - (eta * L^2 / 2) * (q / |S|) = L/4 > 0 at the large accuracy-independent constant step size eta = 1 / (2L) and achieving E||nabla f(x_out)||_2 <= varepsilon in O(n + n^{1/2} * varepsilon^{-2}) stochastic gradient evaluations.
  evidence:
  - source_id: r376-primary-pdf
    locator: Section 2, Algorithm 1, Theorem 1, Remark 1; Appendix G-H, Lemma 1 and Theorem 10
    relation: supports
- claim_id: r376-claim-prox-spiderboost-composite-and-pl-convergence
  kind: mechanism
  statement: For composite non-convex problems min_x Psi(x) = f(x) + h(x), Prox-SpiderBoost (Algorithm 2, Theorems 2 and 6) applies the unnormalized proximal gradient mapping G_eta(x_k, v_k) = (1/eta) * (x_k - prox_{eta*h}(x_k - eta*v_k)) with constant step size eta = 1 / (2L), achieving E||G_eta(x_xi, nabla f(x_xi))||_2 <= varepsilon in O(n + n^{1/2} * varepsilon^{-2}) finite-sum (or O(varepsilon^{-3}) online) SFO calls and O(varepsilon^{-2}) proximal oracle (PO) calls, improving upon ProxSVRG/ProxSAGA's O(n + n^{2/3} * varepsilon^{-2}) SFO complexity by n^{1/6}; under the composite Polyak-Lojasiewicz condition ||G_eta(x, nabla f(x))||_2^2 >= (1/tau) * (Psi(x) - Psi^*), Prox-SpiderBoost-PL (Theorem 5) achieves linear convergence O((n + L^2 * tau^2) * log(1/varepsilon)) SFO and O(L * tau * log(1/varepsilon)) PO calls without restarting when L*tau <= n^{1/2}.
  evidence:
  - source_id: r376-primary-pdf
    locator: Section 1, Table 1; Section 3.1-3.3, Algorithm 2, Theorems 2, 4, 5, 6, and 7; Appendix H-I
    relation: supports
- claim_id: r376-claim-momentum-coupling-prox-spiderboost-m
  kind: mechanism
  statement: Prox-SpiderBoost-M (Algorithm 3, Theorems 3 and 8) couples three iterate sequences {x_k, y_k, z_k} with epoch-synchronized momentum weight alpha_k = 2 / (ceil(k / q) + 1), evaluating the SPIDER estimator v_k at the extrapolated point z_k = (1 - alpha_{k+1}) y_k + alpha_{k+1} x_k while bounding the momentum drift ||z_{k+1} - z_k||_2^2 <= 2*(1 + alpha_{k+2})^2 ||y_{k+1} - x_k||_2^2 + 2*alpha_{k+1}^2 ||x_k - y_k||_2^2 via the decreasing product sequence Gamma_k = 2 / (ceil(k/q) * (ceil(k/q) + 1)) (Lemma 5), preserving optimal O(n + n^{1/2} * varepsilon^{-2}) finite-sum and O(varepsilon^{-3}) online SFO complexity with faster empirical convergence on non-convex classification and robust image denoising.
  evidence:
  - source_id: r376-primary-pdf
    locator: Section 4, Algorithm 3, Theorem 3; Section 5, Figures 1-2; Appendix J, Lemmas 3-6, Proof of Theorem 3
    relation: supports
