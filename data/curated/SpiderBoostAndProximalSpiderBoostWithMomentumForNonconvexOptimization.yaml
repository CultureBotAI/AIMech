id: AIMech:SpiderBoostAndProximalSpiderBoostWithMomentumForNonconvexOptimization
name: SpiderBoost and Proximal SpiderBoost with Momentum for Non-Convex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A family of stochastic path-integrated variance reduction algorithms (Wang, Ji, Zhou, Liang, & Tarokh 2019) for smooth and composite non-convex optimization min_x Psi(x) = f(x) + h(x) (where f is L-smooth non-convex and h is proper closed convex) that maintains the SPIDER recursive gradient estimator v_k = (1/|S|) sum_{i in S} (nabla f_i(x_k) - nabla f_i(x_{k-1})) + v_{k-1} with epoch period q = |S| = ceil(n^{1/2}), replaces SPIDER's accuracy-dependent normalized update x_{k+1} = x_k - (varepsilon / (L * n_0)) * (v_k / ||v_k||_2) with an unnormalized large constant step size eta = 1 / (2L) via an epoch-grouped telescoping analysis (SpiderBoost), and extends directly to proximal composite mappings x_{k+1} = prox_{eta*h}(x_k - eta*v_k) (Prox-SpiderBoost), Bregman proximal mappings, and Nesterov-style momentum coupling (Prox-SpiderBoost-M), achieving optimal O(min(n + n^{1/2} * varepsilon^{-2}, varepsilon^{-3})) stochastic first-order oracle (SFO) complexity and O(varepsilon^{-2}) proximal oracle (PO) complexity.
identity_notes: Distinct from original SPIDER (Fang et al. 2018, AIMech:SPIDERStochasticPathIntegratedDifferentialEstimatorForNonConvexOptimization), which uses a tiny accuracy-dependent step size eta = O(varepsilon / L) and normalized gradient directions that prevent direct extension to composite proximal mappings prox_{eta*h}; from SARAH (Nguyen et al. 2017, AIMech:SARAHStochasticRecursiveGradientForFiniteSumOptimization), which uses b = 1 and sub-optimal O(n + n^{2/3}/varepsilon^2) non-convex complexity; and from loopless PAGE (Li et al. 2021, AIMech:PageProbabilisticGradientEstimatorForNonconvexOptimization), which replaces deterministic q-periodic epochs with Bernoulli coin flips for unconstrained smooth problems.
