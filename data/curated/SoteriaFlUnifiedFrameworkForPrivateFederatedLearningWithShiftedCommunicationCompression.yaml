id: AIMech:SoteriaFlUnifiedFrameworkForPrivateFederatedLearningWithShiftedCommunicationCompression
name: SoteriaFL Unified Framework for Private Federated Learning with Shifted Communication Compression
concept_kind: algorithm
review_status: DRAFT
definition: A unified framework for local differentially private (LDP) federated learning with communication compression (Algorithm 1) in which each client i perturbs its local stochastic gradient estimator tilde{g}_i^t relative to a maintained local reference shift s_i^t via Gaussian noise xi_i^t ~ N(0, sigma_p^2 I_d) before applying an unbiased omega-compressor C_i^t(tilde{g}_i^t - s_i^t + xi_i^t), updating the shift as s_i^{t+1} = s_i^t + gamma_t C_i^t(tilde{g}_i^t - s_i^t + xi_i^t) with optimal shift step size gamma_t = ((1+omega) - sqrt((1+omega)^2 - tau)) / (2*omega*(1+omega)) so that compression variance does not blow up under differential privacy noise.
identity_notes: Distinct from naive Compressed-DP-SGD (which sets s_i^t = 0 and suffers an O((1+omega) sigma_p^2) noise amplification combined with unbounded gradient-norm variance) and from non-private DIANA / EF21. SoteriaFL (Li, Zhao, Li, & Chi, NeurIPS 2022, arXiv:2206.09888) unifies Soteria-SGD, Soteria-SVRG, and Soteria-SAGA under Lemma 1's shifted-compression contraction.
