claims:
- claim_id: soteriafl-shifted-ldp-compressed-gradient-estimator-and-lemma1-contraction-mechanism
  kind: mechanism
  statement: In SoteriaFL (Algorithm 1), each client i computes a local gradient estimator tilde{g}_i^t (instantiated as clipped mini-batch SGD, clipped SVRG, or clipped SAGA in Table 2), adds Gaussian LDP noise xi_i^t ~ N(0, sigma_p^2 I_d) to the shifted difference tilde{g}_i^t - s_i^t, transmits v_i^t = C_i^t(tilde{g}_i^t - s_i^t + xi_i^t), and updates s_i^{t+1} = s_i^t + gamma_t v_i^t; by Lemma 1, setting gamma_t = ((1+omega) - sqrt((1+omega)^2 - tau)) / (2*omega*(1+omega)) contracts the shift error Phi_s^t at rate (1 - tau/(4*(1+omega))) while bounding the additive LDP noise term by (1 + 2*(1 - sqrt(1 - tau/(1+omega)^2))) d sigma_p^2.
  evidence:
  - source_id: r561-primary-pdf
    locator: Section 3 Algorithm 1 p. 4 & Section 4 Lemma 1 Equations (5)-(6) p. 6
    relation: supports
- claim_id: soteriafl-eps-delta-ldp-privacy-utility-and-communication-complexity-scope
  kind: scope
  statement: Under (eps, delta)-local differential privacy (Theorem 1, setting sigma_p^2 = 8 G^2 T log(1/delta) / (K^2 m^2 eps^2)) and L-smoothness (Assumption 1), SoteriaFL (Theorem 2 & Corollaries 1-3) achieves optimal utility O(sqrt(d log(1/delta)) / (n sqrt(m) eps)) with O((1+omega)^{3/2} sqrt(n) m eps) communication rounds for Soteria-SVRG/SAGA when omega <= O(m eps^2 / (d log(1/delta)) - 1), matching uncompressed private FL utility while reducing communicated bits by factor 1/(1+omega).
  evidence:
  - source_id: r561-primary-pdf
    locator: Section 4 Theorems 1-2 & Corollaries 1-3 pp. 5-8, Table 1 p. 2
    relation: supports
  - source_id: r561-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: soteriafl-gradient-clipping-norm-bound-and-unbiased-compressor-limitation
  kind: limitation
  statement: Requires bounded per-sample gradient sensitivity ||nabla f_{i,j}(x)||_2 <= G (enforced via gradient clipping before forming tilde{g}_i^t) to guarantee (eps, delta)-LDP and assumes unbiased omega-compression operators (Assumption 3).
  evidence:
  - source_id: r561-primary-pdf
    locator: Section 2.2 Assumptions 3-4 p. 4 & Section 3.1 Table 2 p. 5
    relation: supports
- claim_id: soteriafl-differentially-private-compressed-federated-classification-application
  kind: application
  statement: Applied to locally differentially private and communication-compressed federated logistic regression and neural network classification across distributed client datasets.
  evidence:
  - source_id: r561-primary-pdf
    locator: Section 5 Experiments pp. 9-10
    relation: supports
