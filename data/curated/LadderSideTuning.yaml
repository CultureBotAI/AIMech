id: AIMech:LadderSideTuning
name: Ladder Side-Tuning (LST)
concept_kind: architecture
review_status: DRAFT
definition: A parameter- and memory-efficient transfer learning architecture that separates all trainable parameters from a frozen backbone network f into a parallel lightweight side network g of hidden dimension scaled by 1/r, fuses downsampled intermediate backbone activations h_i^f with side-network representations h_{i-1}^g via learned temperature-scaled sigmoid gates mu_i * h_i^f + (1 - mu_i) * h_{i-1}^g (mu_i = sigmoid(alpha_i / T)), initializes g via Fisher-information or magnitude structural pruning of f, and completely eliminates backpropagation through the frozen backbone.
identity_notes: Distinct from in-backbone PETL methods such as LoRA (AIMech:LoRA), LoRA-FA (AIMech:LoRAFA), Compacter (AIMech:CompacterLowRankHypercomplexAdapterLayers), and IA3 (AIMech:Ia3InfusedAdapterByInhibitingAndAmplifyingInnerActivations), all of which insert trainable parameters inside the backbone and must cache backbone nonlinearity derivatives {sigma'} for chain-rule backpropagation (capping memory savings at <= 50%), and from vanilla Side-Tuning (which fuses representations only at the final output layer without intermediate gated ladder shortcuts, structural pruning initialization, or side-network layer dropping). Formulated by Sung, Cho, and Bansal (NeurIPS 2022, arXiv:2206.06522).
aliases:
- LST
- Ladder Side-Tuning
- Backpropagation-Free Gated Ladder Side Network
