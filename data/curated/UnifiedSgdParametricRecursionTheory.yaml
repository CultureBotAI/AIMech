claims:
- claim_id: six-parameter-coupled-oracle-and-memory-inequalities
  kind: mechanism
  statement: Assumption 4.1 characterizes any unbiased gradient estimator g^k (E_k[g^k] = nabla f(x^k)) and non-negative sequence {sigma_k^2} via six parameters A >= 0, B >= 0, C >= 0, D_1 >= 0, D_2 >= 0, and 0 <= rho <= 1 such that E_k[||g^k - nabla f(x^*)||^2] <= 2 A D_f(x^k, x^*) + B sigma_k^2 + D_1 and E_k[sigma_{k+1}^2] <= (1 - rho) sigma_k^2 + 2 C D_f(x^k, x^*) + D_2, where D_f(x^k, x^*) = f(x^k) - f(x^*) - <nabla f(x^*), x^k - x^*> is the Bregman divergence.
  evidence:
  - source_id: r575-primary-pdf
    locator: Section 4, Assumption 4.1, p. 4, Equations (7)-(8)
    relation: supports
- claim_id: master-lyapunov-contraction-and-neighborhood-bound
  kind: mechanism
  statement: Under mu-quasi-strong convexity of f and Assumption 4.1, Theorem 4.1 proves that for any M > B / rho and stepsize 0 < gamma <= min{1 / (A + C M), rho / (2 mu)}, the Lyapunov functional V_k = ||x^k - x^*||^2 + M gamma^2 sigma_k^2 satisfies E[V_k] <= [max{1 - gamma mu, 1 + B / M - rho}]^k V_0 + ((D_1 + M D_2) gamma^2) / min{gamma mu, rho - B / M}, yielding exact linear convergence to x^* whenever the noise floor constants satisfy D_1 = D_2 = 0.
  evidence:
  - source_id: r575-primary-pdf
    locator: Section 4, Theorem 4.1 and Corollary 4.1, pp. 4-5, Equations (9)-(11)
    relation: supports
  - source_id: r575-metadata-cr
    locator: Abstract
    relation: supports
- claim_id: shift-trick-sgd-star-and-quantized-arbitrary-sampling-specializations
  kind: application
  statement: The parametric framework recovers 16 existing and new methods described in Table 1, including SGD-star (which shifts stochastic gradients by nabla f_i(x^*) to achieve A = L_max, B = C = D_1 = D_2 = 0, rho = 1 and linear convergence without dynamic control variates), N-SAGA and N-SEGA under noisy oracles, and Q-SGD-SR combining arbitrary coordinate/minibatch sampling with unbiased quantization.
  evidence:
  - source_id: r575-primary-pdf
    locator: Section 3, Table 1, p. 4; Section 5 and Appendix A, Table 2, pp. 5-14
    relation: supports
- claim_id: quasi-strong-convexity-and-unbiased-oracle-requirement
  kind: limitation
  statement: The master theorem requires f to be mu-quasi-strongly convex around x^* and the stochastic gradient estimator g^k to be conditionally unbiased (E_k[g^k] = nabla f(x^k)), so biased contractive compressors with error feedback or nonconvex objectives require separate Lyapunov analyses.
  evidence:
  - source_id: r575-primary-pdf
    locator: Section 2, Assumption 2.1, p. 2; Section 4, Assumption 4.1(a), p. 4
    relation: supports
