id: AIMech:UnifiedSgdParametricRecursionTheory
name: Unified Parametric Theory of Proximal SGD
concept_kind: mathematical_method
review_status: DRAFT
definition: 'A unified parametric convergence analysis framework for composite strongly convex stochastic optimization min_{x in R^d} f(x) + R(x) using proximal stochastic gradient iterates x^{k+1} = prox_{gamma R}(x^k - gamma g^k) with unbiased gradient estimator E_k[g^k] = nabla f(x^k). The framework characterizes the stochastic oracle and auxiliary variance-tracking sequence sigma_k^2 >= 0 via six non-negative parameters (A, B, C, D_1, D_2, rho) satisfying two coupled inequalities: E_k[||g^k - nabla f(x^*)||^2] <= 2 A D_f(x^k, x^*) + B sigma_k^2 + D_1 and E_k[sigma_{k+1}^2] <= (1 - rho) sigma_k^2 + 2 C D_f(x^k, x^*) + D_2. Under stepsize 0 < gamma <= min{1 / (A + C M), rho / (2 mu (1 - B M))} with M > B / rho, the Lyapunov potential V_k = ||x^k - x^*||^2 + M gamma^2 sigma_k^2 contracts linearly up to an explicit neighborhood (D_1 + M D_2) gamma^2 / min{gamma mu, rho - B M}, unifying mini-batch SGD, SAGA, L-SVRG, SEGA, jacSketch, DIANA, and Q-SGD-SR.'
identity_notes: Distinct from individual variance-reduced or quantized stochastic gradient methods (such as SAGA, L-SVRG, SEGA, or DIANA) because it defines the six-parameter (A, B, C, D_1, D_2, rho) meta-assumption (Assumption 4.1) and master Lyapunov contraction theorem (Theorem 4.1) that simultaneously derives existing and new methods (SGD-star, N-SAGA, N-SEGA, Q-SGD-SR) as parameter specializations.
aliases:
- Unified (A,B,C,D1,D2,rho) Theory of SGD
- ABC-SGD Parametric Framework
- SGD-star
- Q-SGD-SR
