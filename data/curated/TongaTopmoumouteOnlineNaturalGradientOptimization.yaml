claims:
- claim_id: r648-bayesian-frequentist-generalization-optimality
  kind: mechanism
  statement: Modeling the empirical training gradient g = (1/n) sum_{i=1}^n g_i as Gaussian around the true generalization gradient g_tilde ~ N(g_tilde, C_tilde / n), both the Bayesian formulation (with isotropic Gaussian prior g_tilde ~ N(0, sigma^2 I)) and the frequentist linear-preconditioner formulation (v = M^T g) show that the descent direction minimizing the probability P(v^T g_tilde > 0) of increasing generalization error is the natural gradient direction v proportional to -C_tilde^{-1} g (Section 2.1-2.2, Eqs. 1-7).
  evidence:
  - source_id: r648-primary-pdf
    locator: Section 2, Section 2.1-2.2, Eqs. 1-7, pp. 2-4
    relation: supports
- claim_id: r648-uncentered-covariance-collinearity-and-woodbury-gram
  kind: mechanism
  statement: Replacing the centered gradient covariance C with the uncentered second moment C + g g^T yields (C + g g^T)^{-1} g = v / (1 + g^T v) where v = C^{-1} g, preserving the exact natural gradient direction while bounding step norm by 1 / (||g|| cos(g, v)) (Eq. 8); moreover, using the Woodbury identity and incremental r x r Gram matrix G_t = X_t^T X_t (Eqs. 10-14), TONGA computes the regularized natural direction and rank-k eigenvector truncation in O(p b) time per step when k <= b and k + b << sqrt(p).
  evidence:
  - source_id: r648-primary-pdf
    locator: Section 3.2.1-3.2.3, Eqs. 8-14, pp. 4-5
    relation: supports
- claim_id: r648-block-diagonal-neural-network-approximation
  kind: application
  statement: By partitioning multilayer perceptron parameters into per-neuron weight blocks (weights entering each hidden unit and weights entering each output unit) and retaining the top k eigenvectors per block, Block-Diagonal TONGA increases the effective covariance approximation rank from k to k * (number of blocks) at the same O(p b) cost and achieves faster CPU-time convergence and lower test negative log-likelihood and classification error than stochastic gradient descent on MNIST and the 900,000-example Rectangles-images benchmark.
  evidence:
  - source_id: r648-primary-pdf
    locator: Section 4, Figures 1-2, pp. 6-7; Section 5.1-5.2, Figures 3-4, pp. 7-8
    relation: supports
- claim_id: r648-full-matrix-low-rank-sensitivity-limitation
  kind: limitation
  statement: When TONGA is applied as a single low-rank approximation to the full p x p covariance matrix with small rank k to keep computational overhead low, it captures a much smaller fraction of the Frobenius norm than the block-diagonal variant, performs only comparably to stochastic gradient descent, and is sensitive to hyperparameter choices including the damping schedule lambda.
  evidence:
  - source_id: r648-primary-pdf
    locator: Section 4, Figure 2, p. 6; Section 5, p. 7
    relation: supports
