id: AIMech:TongaTopmoumouteOnlineNaturalGradientOptimization
name: TONGA Topmoumoute Online Natural Gradient Optimization
concept_kind: algorithm
review_status: DRAFT
definition: TONGA (Topmoumoute Online Natural Gradient Algorithm) is an online natural gradient optimization algorithm that approximates the empirical gradient second-moment (uncentered covariance) matrix C_t in R^{p x p} using a low-rank factor X_t in R^{p x r} (r = k + b << p) updated via C_t = gamma * C_hat_{t-1} + g_t g_t^T = X_t X_t^T with X_t = [sqrt(gamma) X_{t-1}, g_t]. Using the Woodbury matrix identity and an incrementally updated r x r Gram matrix G_t = X_t^T X_t, TONGA computes the regularized natural gradient direction v_t = (X_t X_t^T + lambda I_p)^{-1} g_t = X_t (G_t + lambda I_r)^{-1} y_t (where y_t = [0, ..., 0, 1]^T) in O(p r + r^3) time, and every b steps compresses X_{t+b} back to rank k via the eigendecomposition G_t = V D V^T. In its neural network block-diagonal variant, TONGA applies this rank-k online update independently to each per-neuron weight block, achieving rank k * (number of blocks) at O(p b) per-update complexity.
identity_notes: Distinct from exact Natural Gradient Descent (AIMech:NaturalGradientDescent), which requires O(p^2) covariance storage and O(n p^2 + p^3) inversion; distinct from Kronecker-factored natural gradient methods (AIMech:KFAC, AIMech:EKFACEigenvalueCorrectedKroneckerFactorizationNaturalGradient, AIMech:TensorNormalTrainingKroneckerNaturalGradientOptimization), which factorize layer curvature as Kronecker products of activations and pre-activation derivatives; and distinct from Frequent Directions sketching of AdaGrad/Shampoo preconditioners (AIMech:SketchyFrequentDirectionsAdaptiveRegularizationOptimization), which subtracts the l-th singular value squared sigma_l^2 I_r during streaming SVD updates.
