claims:
- claim_id: r755-claim-distribution-shift-correlation-and-coco
  kind: mechanism
  statement: Because MS MARCO and BEIR tasks exhibit only 32.4% average query-intent similarity and 34.6% average document weighted Jaccard lexical similarity J(S, T) = sum_k min(S_k, T_k) / sum_k max(S_k, T_k), standard dense retrievers degrade severely under domain shift; COCO initializes from Condenser and continuously pre-trains on target corpora with sequence contrastive loss L_co = sum_{i=1}^n -log(exp(<g(s_{i,1}), g(s_{i,2})>) / sum_{j=1,2} sum_{s^- in B} exp(<g(s_{i,j}), g(s^-)>)) plus MLM to simultaneously improve target representation alignment l_align and hypersphere uniformity l_uniform.
  evidence:
  - source_id: r755-primary-pdf
    locator: Section 3.2, Section 4.1, Section 5.4, & Appendix C-D and H, Equations 4, 13, 24-25, Figures 2 and 5, Table 6, pp. 3-4, 8-9, 16, 18
    relation: supports
- claim_id: r755-claim-idro-gradient-similarity-kkt-update
  kind: mechanism
  statement: During ANCE-style fine-tuning on MS MARCO, iDRO clusters source queries via k-means (K = 50) at each negative-refresh episode and solves min_{omega^{(t)}} l_g + tau D_KL(omega^{(t)} || omega^{(t-1)}) subject to sum_i omega_i^{(t)} = 1 over the first-order total cluster loss change l_g approx -eta sum_{i,j} alpha_i alpha_j omega_i^t (grad_theta l_i)^T grad_theta l_j, yielding the closed-form KKT update omega_i^{t*} = omega_i^{(t-1)} exp((1/tau) sum_{j=1}^K r_{ij}) / Z with r_{ij} = [l_i(theta) l_j(theta)]^beta (grad_theta l_i(theta))^T grad_theta l_j(theta) (beta = 0.25) that prioritizes clusters sharing aligned gradients.
  evidence:
  - source_id: r755-primary-pdf
    locator: Section 4.2, Section 5.1, & Appendix E-F, Equations 5-12 and 14-23, Table 7, pp. 4-6, 17
    relation: supports
- claim_id: r755-claim-beir-zero-shot-application
  kind: application
  statement: Using a single unified dual-encoder across 18 BEIR zero-shot retrieval benchmarks, COCO-DR_Base (110M parameters) achieves 0.462 average nDCG@10 (outperforming BM25 at 0.428, ANCE at 0.389, ColBERT at 0.431, per-task GPL at 0.459, and 4.8B-parameter GTR_XXL at 0.458), while COCO-DR_Large (335M parameters) reaches 0.484 average nDCG@10 across all 18 tasks and 0.541 on the 11-task CPT subset, surpassing the 175B-parameter GPT-3 CPT_XL model (0.528) with 0.17% of its parameters.
  evidence:
  - source_id: r755-primary-pdf
    locator: Abstract, Section 1, & Section 5.2-5.4, Figure 1, Tables 1-3, pp. 1-2, 6-8
    relation: supports
- claim_id: r755-claim-hyperparameter-fragmentation-and-theory-limitation
  kind: limitation
  statement: Setting the iDRO cluster count K too large (e.g., K >= 150-200) creates fragmented source query clusters that are distant from target BEIR tasks and degrades average nDCG@10, while extreme temperature values tau either collapse weights to uniform (large tau) or over-concentrate on a few clusters (small tau); moreover, COCO-DR requires access to the target document corpora for 200K steps (~1.5-3 days on 8 A100 GPUs) of continuous contrastive pre-training prior to fine-tuning.
  evidence:
  - source_id: r755-primary-pdf
    locator: Section 5.1, Section 5.3 (Figure 3), & Limitations, pp. 6-7, 9
    relation: supports
