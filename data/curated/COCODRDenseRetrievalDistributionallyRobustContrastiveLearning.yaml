id: AIMech:COCODRDenseRetrievalDistributionallyRobustContrastiveLearning
name: COCO-DR Contrastive and Distributionally Robust Zero-Shot Dense Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: A two-stage zero-shot dense retrieval training algorithm that mitigates document-side and query-side distribution shifts between a labeled source retrieval dataset and unlabeled target corpora by (1) performing Continuous Contrastive pretraining (COCO) on the target corpora using disjoint same-document span pairs (s_{i,1}, s_{i,2}) and masked language modeling to align and uniformly distribute target document representations, and (2) fine-tuning on source retrieval labels via Implicit Distributionally Robust Optimization (iDRO) L_iDRO(theta) = sum_{i=1}^K alpha_i omega_i l_i(theta) over K k-means source query clusters, where alpha_i proportional to [l_i(theta)]^beta up-weights harder clusters and omega_i^{t*} = omega_i^{(t-1)} exp((1/tau) sum_{j=1}^K r_{ij}) / Z dynamically reweights clusters via a KL-regularized first-order Taylor expansion using cross-cluster loss-and-gradient similarity r_{ij} = [l_i(theta) l_j(theta)]^beta (grad_theta l_i(theta))^T grad_theta l_j(theta).
identity_notes: Distinct from coCondenser (Gao & Callan, ACL 2022, AIMech:CoCondenserUnsupervisedCorpusAwareLanguageModelPreTraining), which pre-trains on the source corpus (e.g., MS MARCO) and fine-tunes with uniform Empirical Risk Minimization without target-corpus adaptation or iDRO query-cluster reweighting; distinct from GPL (Wang et al., NAACL 2022, AIMech:GPLGenerativePseudoLabelingForDenseRetrieval), which generates synthetic queries and cross-encoder pseudo-labels to train a separate model per target task rather than a single unified zero-shot model; and distinct from GroupDRO (Sagawa et al., ICLR 2020, AIMech:GroupDistributionallyRobustOptimization), which weights groups solely by loss magnitude without the cross-cluster gradient dot-product similarity r_{ij}.
aliases:
- COCO-DR
- COntinuous COntrastive and Implicit Distributionally Robust Dense Retrieval
- COCO-DR Zero-Shot Dense Retrieval
- Continuous Contrastive Pretraining with Implicit DRO (COCO + iDRO)
