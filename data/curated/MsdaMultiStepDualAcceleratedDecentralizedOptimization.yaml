id: AIMech:MsdaMultiStepDualAcceleratedDecentralizedOptimization
name: MSDA and SSDA (Multi-Step and Single-Step Dual Accelerated Decentralized Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: 'Rate-optimal decentralized optimization algorithms for alpha-strongly convex and beta-smooth objectives min_{theta_1=...=theta_n} sum_{i=1}^n f_i(theta_i) over a network with gossip Laplacian W (Scaman, Bach, Bubeck, Lee, & Massoulie 2017, Section 3, Algorithms 1-2): Single-Step Dual Accelerated (SSDA, Algorithm 1) reformulates the consensus problem into the unconstrained dual max_{lambda} -F^*(lambda sqrt(W)) and applies Nesterov''s accelerated gradient descent using local dual conjugate gradients nabla f_i^*(y_{i,t}) gossiped by W; Multi-Step Dual Accelerated (MSDA, Algorithm 2) replaces W with the K-step Chebyshev polynomial gossip operator P_K(W) = I - T_K(c_2(I - c_1 W)) / T_K(c_2) where K = floor(1 / sqrt(gamma(W))) and gamma(W) = lambda_{n-1}(W) / lambda_1(W).'
identity_notes: Distinct from primal-dual consensus algorithms such as EXTRA (AIMech:ExtraExactFirstOrderDecentralizedConsensusOptimization, Shi et al. 2015) and DIGing (AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs, Nedic et al. 2017), which evaluate primal gradients nabla f_i(x_i) without Nesterov dual acceleration or Chebyshev polynomial gossip and have non-accelerated O(kappa_l / gamma) dependence on the condition number kappa_l = beta / alpha and spectral gap gamma(W).
aliases:
- MSDA and SSDA
- Multi-Step Dual Accelerated Decentralized Optimization
- Single-Step Dual Accelerated Decentralized Optimization
