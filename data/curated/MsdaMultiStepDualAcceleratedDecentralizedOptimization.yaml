claims:
- claim_id: r435-decentralized-and-centralized-lower-bounds-theorems-1-and-2
  kind: mechanism
  statement: For black-box distributed optimization with local computation time 1 and per-link communication delay tau, Theorem 1 and Corollary 1 establish a centralized lower bound Omega(sqrt(kappa_g)(1 + Delta tau) ln(1 / varepsilon)) in terms of the global condition number kappa_g = beta_g / alpha_g and network diameter Delta, while Theorem 2 and Corollary 2 construct adversarially split chain/grid graphs to prove a decentralized gossip lower bound Omega(sqrt(kappa_l)(1 + tau / sqrt(gamma)) ln(1 / varepsilon)) in terms of the local condition number kappa_l = beta / alpha and normalized Laplacian eigengap gamma = lambda_{n-1}(W) / lambda_1(W).
  evidence:
  - source_id: r435-primary-pdf
    locator: Section 2 Optimal Convergence Rates (Theorems 1-2, Corollaries 1-2)
    relation: supports
- claim_id: r435-chebyshev-gossip-eigengap-boost-and-msda-optimal-time-theorem
  kind: mechanism
  statement: Whereas SSDA (Theorem 3) requires O(sqrt(kappa_l / gamma)(1 + tau) ln(1 / varepsilon)) time, MSDA's Chebyshev polynomial operator P_K(W) with c_1 = 2 / (lambda_1(W) + lambda_{n-1}(W)), c_2 = (1 + gamma) / (1 - gamma), and K = floor(1 / sqrt(gamma)) satisfies 1 / sqrt(gamma(P_K(W))) <= 2 (Proposition 1), decoupling computation and communication so MSDA reaches varepsilon-precision in O(sqrt(kappa_l) ln(1 / varepsilon)) local conjugate-gradient steps and O(sqrt(kappa_l / gamma) ln(1 / varepsilon)) gossip steps, matching the optimal decentralized time bound O(sqrt(kappa_l)(1 + tau / sqrt(gamma)) ln(1 / varepsilon)) (Theorem 4).
  evidence:
  - source_id: r435-primary-pdf
    locator: Section 3.2 SSDA (Theorem 3) & Section 3.3 MSDA (Proposition 1, Algorithm 2, Theorem 4)
    relation: supports
- claim_id: r435-fenchel-conjugate-oracle-and-spectral-parameter-knowledge-limitation
  kind: limitation
  statement: Requires each node i to evaluate the Fenchel conjugate gradient nabla f_i^*(y) = argmax_theta (<y, theta> - f_i(theta)) (an exact local inner minimization at every outer step) and requires prior knowledge of the spectral bounds lambda_1(W) and lambda_{n-1}(W) as well as alpha and beta.
  evidence:
  - source_id: r435-primary-pdf
    locator: Section 3.1 Dual Formulation & Section 3.2-3.3 Algorithms 1-2
    relation: supports
- claim_id: r435-decentralized-regression-and-regularized-classification-application
  kind: application
  statement: Applied to decentralized l_2-regularized linear regression and logistic classification across grid, cycle, and Erdos-Renyi communication networks.
  evidence:
  - source_id: r435-primary-pdf
    locator: Section 3.3 Practical Remarks & Appendix Proof of Theorem 4
    relation: supports
