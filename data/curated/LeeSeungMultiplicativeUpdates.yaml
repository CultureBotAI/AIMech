name: Lee-Seung Multiplicative Updates
aliases:
- Lee-Seung NMF Updates
concept_kind: algorithm
definition: The Lee-Seung block multiplicative algorithms for nonnegative matrix factorization, using
  objective-specific elementwise factor rescaling to reduce squared reconstruction error or generalized
  KL divergence with the other factor held fixed.
identity_notes: 'Scoped to Equations 4-5 and their auxiliary-function derivations in Lee and Seung, NIPS
  2000. This is a particular family of fitting rules, distinct from the general NMF factorization, every
  multiplicative optimizer, generic EM and the fixed-prior Iterated Wiener Filter. An update of one entire
  factor block is different from simultaneously changing both factors from stale values. Four candidate
  identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms and 450 preceding
  native IDs, names and aliases, with no normalized match. Ignored/hidden full-checkout searches returned
  the same 106 matched-line set in each checkout after the prior merge. All matched excerpts from 76 files
  were read; they are discovery context, not existing concept records. The semantic search covered all
  pinned labels and scoped synonyms and returned 212 rows: 205 byte-equivalent prior readings and seven
  additional rows, all inspected. Twenty-three annotated AIO nodes with outgoing edges comprise 21 unchanged
  prior readings and two new inspections. Thirty contextual YAMLs, including seven native neighbors, comprise
  25 unchanged prior readings and five complete new readings. This absence assessment is bounded to the
  pinned snapshot and inspected maintained corpus.'
