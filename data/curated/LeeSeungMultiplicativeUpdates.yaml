claims:
- claim_id: squared-error-update
  kind: mechanism
  statement: For squared error and well-defined positive denominators, update H elementwise as H <- H*(W^T
    V)/(W^T W H) with W fixed. Update W analogously as W <- W*(V H^T)/(W H H^T) with H fixed, evaluating
    each block rule against its current other factor. Multiplication and division of corresponding entries
    are elementwise. The proof uses a quadratic auxiliary function whose diagonal curvature majorizes
    W^T W, with current positive coordinates required in its displayed derivation.
  evidence:
  - source_id: method-source
    locator: Section 4, Equation 4, PDF p. 3; Section 6, Lemma 2 and Equations 12-19, PDF pp. 4-5
    relation: supports
- claim_id: divergence-update
  kind: mechanism
  statement: For generalized KL divergence, H_aμ is multiplied by [sum_i W_ia V_iμ/(WH)_iμ]/[sum_i W_ia],
    and W_ia by [sum_μ H_aμ V_iμ/(WH)_iμ]/[sum_μ H_aμ], with the other block fixed. Jensen majorization
    of the negative logarithm gives the source auxiliary function. With valid ratios and the stated domain,
    exact minimization of each auxiliary does not increase the corresponding objective. These are two
    objective-specific rules, not a universal multiplicative update for arbitrary losses.
  evidence:
  - source_id: method-source
    locator: Section 4, Equation 5, PDF p. 3; Section 6, Lemma 3 and Equations 20-33, PDF pp. 5-6
    relation: supports
- claim_id: descent-boundaries
  kind: limitation
  statement: Monotone objective values do not alone prove convergence of factor matrices to a local minimum.
    In a curator scalar example V=1 and W=H=0.5, updating both factors simultaneously from their old values
    sets both to 2 and raises squared error from 0.5625 to 9. A separate fixed-W example W=[[1,0],[1,1]],
    V=[1,2]^T and H=[1.5,0]^T is unchanged by the H rule, although the zero coordinate has half-squared-error
    derivative -0.5 and increasing it lowers the loss. This is a zero-locked nonoptimal block state with
    positive denominators, not a claim about an inspected author implementation.
  evidence:
  - source_id: method-source
    locator: Sections 4 and 6-7, PDF pp. 3-7; curator finite counterexamples to unrestricted update and
      local-optimum interpretations
    relation: supports
limitations:
- The rules require defined denominators and an explicit zero policy. The proof for positive current coordinates
  does not automatically cover arbitrary boundary initializations; multiplicative zeros may remain locked.
- Sequential block descent is not a license to update both blocks from stale factors. Arbitrary epsilon
  denominators, clipping, approximate updates or added penalties change the algorithm and require separate
  analysis.
- The objective is generally nonconvex jointly in W and H. Descent, bounded objective values and an auxiliary-function
  proof do not establish unique factors, a global optimum or the source discussion’s unrestricted local-optimum
  guarantee.
- Finite arithmetic verifies selected update and boundary claims; no author software, empirical model
  fitting or benchmark was executed.
