id: AIMech:SoftDTW
name: Soft-DTW
aliases:
- Soft dynamic time warping
concept_kind: mathematical_method
definition: A time-series discrepancy obtained by applying a temperature-controlled soft minimum to the
  summed local costs of all monotone endpoint-to-endpoint alignment paths; positive temperature and differentiable
  local costs permit differentiation with respect to the series.
identity_notes: This proposal denotes the uncorrected discrepancy, not ordinary minimum-cost DTW, the
  later self-similarity-corrected soft-DTW divergence, or a trained model. The existing GCFL+ record uses
  DTW inside a federated clustering procedure and has a different identity. Exact names, expanded names
  and publication identifiers were searched with hidden and ignored files included; normalized corpus
  identities were compared separately.
definition_evidence:
- source_id: soft-dtw-2017
  locator: Section 2.1, PDF pp. 2-3; definition of gamma-soft-DTW and Algorithm 1
  relation: supports
claims:
- claim_id: forward-and-backward-recursion
  kind: mechanism
  statement: The forward dynamic program replaces each hard minimum with a log-sum-exp soft minimum. A
    reverse pass through stored intermediate costs computes the gradient; after forming the local cost
    matrix, value and gradient computation require O(nm) time and storage.
  evidence:
  - source_id: soft-dtw-2017
    locator: Sections 2.1-2.3, Algorithms 1-2, PDF pp. 3-4
    relation: supports
- claim_id: entropic-bias
  kind: limitation
  statement: The uncorrected discrepancy can be negative. With positive temperature and the squared Euclidean
    local cost, the follow-up analysis shows that equal input series need not minimize it; it should not
    be described as a valid divergence.
  evidence:
  - source_id: divergences-2021
    locator: Section 3, Proposition 2 and Figure 2, PDF p. 4
    relation: supports
