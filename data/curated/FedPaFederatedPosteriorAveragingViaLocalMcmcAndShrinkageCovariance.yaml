claims:
- claim_id: r412-gaussian-posterior-product-quadratic-objective-and-fedavg-identity-covariance-bias
  kind: mechanism
  statement: Propositions 1 and 2 show that under local Laplace/Gaussian posterior approximations N(mu_i, Sigma_i), the global posterior mode mu = (sum_{i=1}^N q_i Sigma_i^{-1})^{-1} (sum_{i=1}^N q_i Sigma_i^{-1} mu_i) minimizes the global quadratic objective Q(theta) = (1/2) theta^T (sum_i q_i Sigma_i^{-1}) theta - (sum_i q_i Sigma_i^{-1} mu_i)^T theta whose stochastic client gradient is Delta_i = Sigma_i^{-1}(theta - mu_i), revealing that FedAvg implicitly sets Sigma_i = I and therefore converges to a biased fixed point whenever client precision matrices Sigma_i^{-1} are heterogeneous and anisotropic.
  evidence:
  - source_id: r412-primary-pdf
    locator: Section 3.2-3.3 (Propositions 1 and 2, Eqs. 3-6, Figure 1)
    relation: supports
- claim_id: r412-sherman-morrison-dynamic-programming-for-matrix-free-shrinkage-covariance-inversion
  kind: mechanism
  statement: Theorem 3 and Appendix C (Algorithm 2) prove that using the Ledoit-Wolf shrinkage covariance estimator Sigma_hat_ell = rho_ell I + (1 - rho_ell) S_hat_ell with rho_ell = 1 / (1 + (ell - 1) rho) over ell local MCMC epoch means x_1,...,x_ell, the unnormalized matrix tilde_Sigma_t = I + rho (t - 1) S_hat_t satisfies the rank-1 recurrence tilde_Sigma_t = tilde_Sigma_{t-1} + gamma_t u_t u_t^T with u_t = x_t - bar_x_{t-1} and gamma_t = rho (t - 1) / t, enabling exact computation of Delta_hat_ell = Sigma_hat_ell^{-1}(x_0 - bar_x_ell) in O(ell^2 d) time and O(ell d) memory without ever instantiating or communicating a d x d matrix.
  evidence:
  - source_id: r412-primary-pdf
    locator: Section 4.2 Efficient Local Posterior Covariance Estimation (Theorem 3, Eq. 8) & Appendix C (Algorithm 2)
    relation: supports
- claim_id: r412-burn-in-epochs-and-local-sample-storage-limitation
  kind: limitation
  statement: FedPA requires an initial burn-in phase of communication rounds before activating posterior covariance preconditioning so that local SG-MCMC chains mix near a local mode, and each client must store ell >= 2 d-dimensional epoch-mean vectors during local training to form rank-1 covariance updates.
  evidence:
  - source_id: r412-primary-pdf
    locator: Section 4.1-4.3 (Table 1, Algorithm 1) & Section 5
    relation: supports
- claim_id: r412-federated-emnist-cifar100-stackoverflow-and-reddit-benchmarks-application
  kind: application
  statement: Evaluated on federated EMNIST-62, CIFAR-100, StackOverflow tag prediction and next-word prediction, and Reddit language modeling, improving convergence speed and final test accuracy over FedAvg and adaptive FedOpt baselines.
  evidence:
  - source_id: r412-primary-pdf
    locator: Section 5 Experiments (Tables 2-3, Figures 2-4)
    relation: supports
