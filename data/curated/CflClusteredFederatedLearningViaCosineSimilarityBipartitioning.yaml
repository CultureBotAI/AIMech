id: AIMech:CflClusteredFederatedLearningViaCosineSimilarityBipartitioning
name: CFL (Clustered Federated Learning via Cosine Similarity Bipartitioning)
concept_kind: algorithm
review_status: DRAFT
definition: "A recursive model-agnostic clustered federated learning algorithm (Sattler, M\xFCller, & Samek 2021, Algorithm 1 & Algorithm 2) that detects client data incongruence whenever a cluster model theta^* approaches a stationary point of its aggregate empirical risk (0 <= ||sum_{i in c} (|D_i|/|D_c|) Delta theta_i|| < varepsilon_1) while individual client update norms remain large (max_{i in c} ||Delta theta_i|| > varepsilon_2 > 0, Eqs. 32-33), computes the pairwise cosine similarity matrix alpha_{i,j} = <Delta theta_i, Delta theta_j> / (||Delta theta_i|| ||Delta theta_j||) (Eq. 13), and recursively bipartitions the cluster into c_1 cup c_2 = c by minimizing the maximum cross-cluster similarity argmin_{c_1 cup c_2 = c} max_{i in c_1, j in c_2} alpha_{i,j} in O(|c|^3) time whenever the separation bound gamma_max < sqrt((1 - alpha_cross^max) / 2) (Eq. 39) holds."
identity_notes: Distinct from IFCA (AIMech:IfcaIterativeFederatedClusteringAlgorithm, Ghosh et al. 2020), which requires specifying a fixed number of clusters k upfront and broadcasts all k cluster models to every client in each round for minimum-loss cluster assignment, whereas CFL requires no prior knowledge of k, communicates only a single cluster model per client per round, and recursively splits clusters top-down at stationary points via gradient cosine-similarity minimax bipartitioning.
aliases:
- CFL
- Clustered Federated Learning via Cosine Similarity Bipartitioning
- Recursive Cosine-Similarity Bipartitioning for Clustered Federated Learning
