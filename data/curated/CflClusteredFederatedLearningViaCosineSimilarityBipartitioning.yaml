claims:
- claim_id: r414-cosine-similarity-separation-theorem-for-incongruent-distributions
  kind: mechanism
  statement: Theorem 1 (Separation Theorem) and Corollary 1 prove that for m clients drawn from k incongruent data-generating distributions at a stationary point theta^* of the global objective with relative empirical gradient noise gamma_i = ||nabla R_{I(i)}(theta^*) - nabla r_i(theta^*)|| / ||nabla R_{I(i)}(theta^*)|| < 1, the minimum intra-cluster cosine similarity satisfies alpha_intra^min >= 1 - 2 gamma_max^2 while the minimax bipartition achieves cross-cluster similarity alpha_cross^max <= cos(pi / (k - 1)) H_{i^*,j^*} + sqrt(1 - cos^2(pi / (k - 1))) sqrt(1 - H_{i^*,j^*}^2) (where H_{i,j} = sqrt(1 - gamma_i^2) sqrt(1 - gamma_j^2) - gamma_i gamma_j), guaranteeing exact separation whenever the separation gap g(alpha) = alpha_intra^min - alpha_cross^max > 0.
  evidence:
  - source_id: r414-primary-pdf
    locator: Section IV-A Separation Theorem (Theorem 1, Corollary 1, Definition 2, Eqs. 17-31) & Appendix A (Lemmas 2-4, Proof of Theorem 5)
    relation: supports
- claim_id: r414-stationary-point-incongruence-criterion-and-orthogonal-encryption-invariance
  kind: mechanism
  statement: Splitting only when ||sum_{i in c} (|D_i|/|D_c|) Delta theta_i|| < varepsilon_1 and max_{i in c} ||Delta theta_i|| > varepsilon_2 prevents premature splitting on congruent clients while recursively building a parameter tree enabling instant warm-start re-clustering under distribution shifts; furthermore, because inner products and Euclidean norms are invariant under orthonormal transformations (<P x, P y> = <x, y>, ||P x|| = ||x||), CFL operates identically on client weight updates encrypted with a shared random permutation or orthogonal matrix P (Section V-B).
  evidence:
  - source_id: r414-primary-pdf
    locator: Section IV-B-C (Eqs. 32-44, Algorithm 2, Figure 2) & Section V Privacy Preservation (Eqs. 45-46)
    relation: supports
- claim_id: r414-stationary-point-wait-and-threshold-hyperparameter-limitation
  kind: limitation
  statement: CFL must wait for the current cluster model to approach a stationary point (||Delta theta_c|| < varepsilon_1) before triggering each bipartition step, and requires tuning the stationarity threshold varepsilon_1 and client incongruence threshold varepsilon_2.
  evidence:
  - source_id: r414-primary-pdf
    locator: Section IV-B (Eqs. 32-39, Table I)
    relation: supports
- claim_id: r414-label-swap-and-rotated-mnist-cifar10-and-agnews-clustering-application
  kind: application
  statement: Applied to multi-task federated learning under label-swapped and rotated MNIST, CIFAR-10, and AG-News benchmarks with CNN and LSTM architectures, recovering the ground-truth client clusters and outperforming single-model FL.
  evidence:
  - source_id: r414-primary-pdf
    locator: Section VI Experiments (Figures 3-8, Tables II-III)
    relation: supports
