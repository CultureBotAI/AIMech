claims:
- claim_id: votek-discounted-knn-graph-scoring-mechanism
  kind: mechanism
  statement: Vote-k builds a directed graph G = (V, E) connecting each unlabeled instance to its k nearest cosine-similarity neighbors in Sentence-BERT embedding space and scores each candidate u by summing s(v) = rho^{-|{l in L | (v, l) in E}|} (rho > 1) over all remaining vertices v that have an edge to u, promoting both high neighborhood density and coverage diversity.
  evidence:
  - source_id: r738-primary-pdf
    locator: Section 2.1 & Appendix G.1 Algorithm 1 (Lines 2-7), pp. 3 & 21
    relation: supports
- claim_id: votek-confidence-bucket-stratification-mechanism
  kind: mechanism
  statement: After annotating the first M/10 examples selected by Vote-k, the algorithm uses them as in-context demonstrations to compute average log-probability confidence scores on all remaining unlabeled instances, partitions the unlabeled pool into M equal-sized confidence percentile buckets, and selects the highest-scoring Vote-k instance from each of the first 9M/10 buckets while discarding the top 10% most confident buckets.
  evidence:
  - source_id: r738-primary-pdf
    locator: Section 2.1 & Appendix G.1 Algorithm 1 (Lines 8-18), pp. 3 & 21
    relation: supports
- claim_id: votek-annotation-efficiency-and-domain-shift-application
  kind: application
  statement: Paired with similarity-based prompt retrieval across 10 classification, commonsense reasoning, dialogue state tracking, semantic parsing, QA, and summarization benchmarks, Vote-k achieves a 12.9% and 11.4% relative gain over random annotation under budgets of 18 and 100 examples and matches supervised fine-tuning with 10-100x fewer annotations.
  evidence:
  - source_id: r738-primary-pdf
    locator: Section 3.3 & Section 4.1-4.3, pp. 5-8, Tables 2-3 & Figure 2
    relation: supports
  - source_id: r738-metadata-cr
    locator: DBLP bibliographic record Hongjin Su et al. ICLR 2023
    relation: supports
- claim_id: votek-similarity-retrieval-coupling-limitation
  kind: limitation
  statement: The diversity and representativeness gains of Vote-k selective annotation depend critically on pairing the annotated pool with similarity-based test-time prompt retrieval; when prompts are sampled randomly at test time from the Vote-k pool, performance drops and fails to improve over random annotation.
  evidence:
  - source_id: r738-primary-pdf
    locator: Section 4.4, p. 8, Table 4
    relation: supports
