id: AIMech:VoteKSelectiveAnnotationForInContextLearning
name: Vote-k Selective Annotation for In-Context Learning
concept_kind: algorithm
review_status: DRAFT
definition: A graph-based selective annotation algorithm for few-shot in-context learning that constructs a directed k-nearest-neighbor graph over dense sentence embeddings of an unlabeled dataset, iteratively selects an initial fraction (M/10) of examples to annotate by maximizing a discounted in-degree score where each vertex's vote is exponentially decayed by the number of its already-selected neighbors, evaluates the language model's predictive confidence on the remaining unlabeled pool using those initial annotations, and selects the remaining 9M/10 examples via the discounted vote-k score stratified across confidence-percentile buckets.
identity_notes: Distinct from test-time prompt retrieval methods such as KATE (AIMech:KATEkNNAugmentedInContextExampleSelection) and EPR (AIMech:EPREfficientPromptRetrievalForInContextLearning), which assume the entire training pool is already annotated and select prompts per test query, whereas Vote-k operates before annotation to choose a compact, diverse, and representative subset L of size M from an unlabeled pool X to be human-annotated. Also distinct from pure facility-location or greedy embedding-diversity coreset selection, which do not combine exponentially discounted kNN graph voting with in-context LM confidence stratification.
aliases:
- Vote-k Selective Annotation
- Vote-k Graph-Based Selective Annotation
- Selective Annotation with Vote-k
