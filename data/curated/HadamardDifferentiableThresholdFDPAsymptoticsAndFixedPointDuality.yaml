limitations:
- The functional Delta-method Central Limit Theorem (Theorem 3.2) requires the existence and uniqueness
  of a strictly positive interior right crossing point tau^* = T(G) > 0 (Conditions C.1-C.3); when the
  target FDR level alpha falls below the critical value alpha^* = 1/g(0) (as in the Laplace location model
  of Figure 2 on page 1076 where alpha^* = 0.23840584 for theta = 2, pi_0 = 0.5), tau^* = 0, the number
  of rejections R_m is stochastically bounded as m -> infty, and the sqrt(m) Gaussian limit does not apply
  (Sections 3.3, 4.1, and 6, pages 1074-1076, 1088-1089).
- 'Unlike FDR08 and Sto02(lambda)/STS04(lambda), the adaptive procedures BR08(lambda) and BKY06(lambda)
  are not universally more powerful than BH95 asymptotically: BR08(lambda) >> BH95 iff tau^*_{BH95} >=
  alpha*lambda (page 1080), and BKY06(lambda) >> BH95 iff G(u_lambda) >= lambda (so whenever G(x) <= sqrt(x)
  on [0, 1], BH95 is strictly more powerful than BKY06(lambda) for every lambda in (0, 1), pages 1083
  and 1089).'
- 'Three minor typographical slips in the primary source were identified and verified during full-text
  inspection: (1) in the last displayed equation of the proof of Proposition 7.5 (page 1097), the ''+''
  sign between nabla_F U_{(G, A(G))}(H) and A_dot_G(H)*nabla_alpha U_{(G, A(G))} is omitted (whereas the
  statement of Proposition 7.5 at the top of page 1097 writes the sum correctly), (2) in the statement
  of Theorem 7.13 (page 1101, line 4), the second term of X is printed with a ''+'' sign before p^*(1
  - p^*)*zeta(tau^*)*Z_1(tau^*)/G_1(tau^*) whereas the proof of Theorem 7.13 at the bottom of page 1101
  and Theorems 4.7, 4.10, and 7.14 all have the correct ''-'' sign, and (3) in Table 2 (page 1108), the
  row for G_hat_m writes pi_0*G_hat_{0,m} + G_hat_{1,m}, omitting the factor (1 - pi_0) written on pages
  1069-1070.'
- All 46 pages of the full-text PDF of Neuvial (2008, Electronic Journal of Statistics 2:1065-1110, arXiv:0803.2111v2,
  DOI:10.1214/08-EJS207) were read. Constructed numerical checks in research/discovery/hadamard-differentiable-threshold-fdp-asymptotics-and-fixed-point-duality-boundaries.py
  verify (1) Section 4.1 Figure 2 Laplace criticality value alpha^* = 1/g(0) = 0.23840584 at theta = 2,
  pi_0 = 0.5, (2) Section 4 and Table 1 exact asymptotic thresholds, attained asymptotic FDRs, and asymptotic
  FDP variances under the Gaussian location model (pi_0 = 0.6, mu = 2.5, alpha = 0.1, lambda = 0.5) together
  with the Section 4.3 power reversal G(x) <= sqrt(x) where BH95 dominates BKY06(lambda) (tau^*_{BH95}
  = 0.00277008 > tau^*_{BKY06} = 0.00110293), and (3) Section 5 Theorems 5.2, 5.4, and 5.6 exact fixed-point
  convergence of iterated Sto02(t_n) to tau^*_{FDR08} = 0.052192013 and iterated BKY06(lambda) to tau^*_{BR08(lambda)}
  = 0.0488615394 at lambda = alpha/(1 + alpha).
