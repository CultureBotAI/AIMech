      4.12, 4.15, Corollary 4.16, Theorem 4.20, and Section 7.3.2, pages 1104–1106, Propositions 7.15–7.17
    relation: supports
- claim_id: fixed-point-iteration-duality-between-one-stage-and-two-stage-adaptive-procedures
  kind: mechanism
  statement: 'Section 5 (pages 1083-1087) establishes a formal duality between one-stage adaptive procedures
    T(F) = sup{u in [0, lambda] : F(u) >= c_alpha(F, u)} satisfying Condition C.13 (u -> c_alpha(G, u)/u
    is nonincreasing on [0, lambda]) and the associated family of two-stage Simes-line procedures T_t(F)
    = sup{u in [0, 1] : F(u) >= (c_alpha(F, t)/t)*u} with asymptotic thresholds tau(t) = T_t(G). Theorem
    5.2 (pages 1085-1086) proves that (i) t <= tau^* implies tau(t) in [t, tau^*] and t >= tau^* implies
    tau(t) in [tau^*, t], and (ii) for any initial parameter t_0 = t in (0, lambda], the iterated sequence
    t_{i+1} = tau(t_i) converges monotonically to the one-stage asymptotic threshold lim_{n->infty} t_n
    = tau^* = T(G), while Corollary 5.3 proves that T_t >> T iff tau(t) > tau^* iff t > tau^* iff t >
    tau(t). Applying Theorem 5.2 with c_alpha(F, u) = (u/alpha)*(1 - F(u))/(1 - u) proves that the asymptotic
    threshold of procedure FDR08 is the exact fixed point of iterating Sto02(lambda) (Theorem 5.4, page
    1086) and Sto02(lambda) >> FDR08 iff lambda > tau^{Sto02}(lambda) (Corollary 5.5, page 1087). Symmetrically,
    applying Theorem 5.2 with c_alpha(F, u) = (u/alpha)*(1 - F(u))/(1 - lambda) proves that the asymptotic
    threshold of procedure BR08(lambda) is the exact fixed point of iterating BKY06(lambda) starting from
    t_0 = u(lambda) (Theorem 5.6, page 1087) and BR08(lambda) >> BKY06(lambda) iff tau^*_{BR08(lambda)}
    >= lambda - alpha*(1 - lambda) (Corollary 5.7, which always holds when lambda <= alpha/(1 + alpha)).'
  evidence:
  - source_id: neuvial2008-pdf
    locator: Section 5, pages 1083–1087, Condition C.13, Theorems 5.2, 5.4, 5.6, Corollaries 5.3, 5.5,
      5.7, Section 6, pages 1088–1089, Table 1, and Section 7.4, pages 1106–1107
    relation: supports
  - source_id: neuvial2008-abs
    locator: Abstract (interpretation of one-stage adaptive procedures BR08 and FDR08 as fixed points
      in the iteration of two-stage adaptive procedures BKY06 and Sto02)
    relation: supports
