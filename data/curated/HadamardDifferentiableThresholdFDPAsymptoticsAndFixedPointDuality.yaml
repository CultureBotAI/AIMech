id: AIMech:HadamardDifferentiableThresholdFDPAsymptoticsAndFixedPointDuality
name: Hadamard-differentiable threshold functional false discovery proportion central limit theorems and
  adaptive fixed-point iteration duality
aliases:
- Neuvial Functional Delta-Method FDP Asymptotics and Threshold Function Framework
- Hadamard-Differentiable Threshold Function T(F) = U(F, A(F)) Central Limit Theorem
- Fixed-Point Iteration Duality Between One-Stage (FDR08, BR08) and Two-Stage (Sto02, BKY06) Adaptive
  FDR Procedures
concept_kind: mathematical_method
definition: 'An asymptotic empirical-process and functional Delta-method framework introduced by Pierre
  Neuvial (2008, Electronic Journal of Statistics 2:1065-1110, arXiv:0803.2111v2, DOI:10.1214/08-EJS207)
  that characterizes the limiting distribution of the random rejection threshold T(G_hat_m) and the achieved
  False Discovery Proportion FDP_m(T(G_hat_m)) = V(G_hat_{0,m}, G_hat_{1,m}) / (R(pi_0*G_hat_{0,m} + (1
  - pi_0)*G_hat_{1,m}) vee (1/m)) of multiple testing procedures under independent p-values. Representing
  any threshold procedure on cadlag distribution functions D[0, 1] as T(F) = U(F, A(F)) with U(F, alpha)
  = sup{u in [0, 1] : F(u) >= r_alpha(u)}, rejection curve r_alpha, and level function A : D[0, 1] ->
  [0, 1] (Definitions 2.1-2.2, Section 2.2), Theorem 3.2 and Theorem 7.13 prove that when T has a unique
  interior right crossing point tau^* = T(G) in (0, 1) where G(tau^*) = r(A(G), tau^*) and g(tau^*) <
  d_u r(A(G), tau^*) (Definition 3.7, Conditions C.1-C.3), T is Hadamard-differentiable at G tangentially
  to C[0, 1] with derivative T_dot_G(H) = (H(tau^*) - d_alpha r(A(G), tau^*)*A_dot_G(H)) / (d_u r(A(G),
  tau^*) - g(tau^*)) (Proposition 7.11, Corollary 7.12), and sqrt(m)*(FDP_m(T(G_hat_m)) - p(tau^*)) converges
  in distribution to the centered Gaussian limit X = p^*(1 - p^*)*(Z_0(tau^*)/tau^* - Z_1(tau^*)/G_1(tau^*))
  + p_dot(tau^*)*T_dot_G(Z), while o(m^{-1/2}) threshold perturbations are asymptotically equivalent (Definition
  3.5, Proposition 3.6). Applying this theorem yields explicit Central Limit Theorems and asymptotic power
  comparisons for BH95, BH95 Oracle, one-stage adaptive procedures FDR08(lambda) and BR08(lambda), and
  two-stage plug-in procedures Sto02(lambda)/STS04(lambda) and BKY06(lambda) (Section 4, Theorems 4.2,
  4.7, 4.10, 4.12, 4.15, Corollary 4.16, Theorem 4.20, Table 1), and establishes a formal fixed-point
  iteration duality proving that the asymptotic threshold of the one-stage procedure FDR08 is the fixed
  point of iterating the two-stage procedure Sto02(lambda) and the asymptotic threshold of BR08(lambda)
  is the fixed point of iterating BKY06(lambda) (Section 5, Theorems 5.2, 5.4, 5.6, Corollaries 5.3, 5.5,
  5.7).'
identity_notes: Distinct from all 442 pinned AIO concepts and all 601 previously curated AIMech concepts.
  While AIMech:OneAndTwoStageAdaptiveStepUpFDRUnderDependence (Blanchard & Roquain 2008) introduces the
  finite-sample one-stage procedure BR08(lambda) and studies finite-sample FDR control of one- and two-stage
  adaptive procedures under independence and dependence, AIMech:AsymptoticallyOptimalRejectionCurveFDRControl
  (Finner, Dickhaus, & Roters 2009) derives the AORC f_alpha(u) = u / (alpha + (1 - alpha)*u) (procedure
  FDR08) and its almost-sure crossing-point FDR limit, and AIMech:ExactStepUpStepDownFDPMomentsAndLFCAnalysis
  (Roquain & Villers 2011) analyzes exact finite-sample moments of the FDP, none of those records formulate
  the Hadamard-differentiable threshold functional T(F) = U(F, A(F)) on D[0, 1] and the functional Delta-method
  Central Limit Theorem for sqrt(m)*(FDP_m(T(G_hat_m)) - p(tau^*)) (Theorems 3.2, 7.3, 7.13, Proposition
  7.11, Corollary 7.12), the o(m^{-1/2}) perturbation asymptotic equivalence criterion (Proposition 3.6,
  Proposition 7.16), the explicit Gaussian limit distributions and variances of BH95, BH95o, FDR08(lambda),
  BR08(lambda), Sto02(lambda)/STS04(lambda), and BKY06(lambda) (Theorems 4.2, 4.7, 4.10, 4.12, 4.15, Corollary
  4.16, Theorem 4.20), or the fixed-point iteration duality Theorems 5.2, 5.4, and 5.6 linking Sto02(lambda)
  to FDR08 and BKY06(lambda) to BR08(lambda) with Corollaries 5.3, 5.5, and 5.7.
