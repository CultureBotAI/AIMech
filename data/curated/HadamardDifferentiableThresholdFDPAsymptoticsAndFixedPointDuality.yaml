claims:
- claim_id: hadamard-differentiable-threshold-functional-and-fdp-central-limit-theorem
  kind: mechanism
  statement: 'Writing the False Discovery Proportion achieved by a threshold functional T : D[0, 1] ->
    [0, 1] as FDP_m(T(G_hat_m)) = V(G_hat_{0,m}, G_hat_{1,m}) / (R(pi_0*G_hat_{0,m} + (1 - pi_0)*G_hat_{1,m})
    vee (1/m)) with V(F_0, F_1) = pi_0*F_0(T(pi_0*F_0 + (1 - pi_0)*F_1)) and R(F) = F(T(F)) (Section 2.2,
    pages 1068-1071), Theorem 3.2 (pages 1072-1073) and Theorem 7.3 (page 1092) prove via Donsker''s invariance
    principle (Theorem 3.1) and the functional Delta method that if tau^* = T(G) > 0 and T is Hadamard-differentiable
    at G tangentially to C[0, 1] with derivative T_dot_G (Condition C.1), then sqrt(m)*(T(G_hat_m) - tau^*)
    ->_d T_dot_G(Z), lim_{m->infty} FDR_m(T(G_hat_m)) = p(tau^*) = pi_0*tau^*/G(tau^*), and sqrt(m)*(FDP_m(T(G_hat_m))
    - p(tau^*)) ->_d X = p(tau^*)*(1 - p(tau^*))*(Z_0(tau^*)/tau^* - Z_1(tau^*)/G_1(tau^*)) + p_dot(tau^*)*T_dot_G(Z).
    For threshold functionals T(F) = U(F, A(F)) with U(F, alpha) = sup{u in [0, 1] : F(u) >= r_alpha(u)},
    Proposition 7.11, Corollary 7.12, and Theorem 7.13 (pages 1099-1101) prove that if T has a unique
    interior right crossing point tau^* in (0, 1) with G(tau^*) = r(A(G), tau^*) and g(tau^*) < d_u r(A(G),
    tau^*) (Conditions C.2-C.3), r is C^1, and A is Hadamard-differentiable at G, then T_dot_G(H) = (H(tau^*)
    - d_alpha r(A(G), tau^*)*A_dot_G(H)) / (d_u r(A(G), tau^*) - g(tau^*)), and any perturbed procedure
    T_m satisfying T(F - eps_m) <= T_m(F) <= T(F) with eps_m = o(m^{-1/2}) has identical asymptotic FDP
    distribution (Proposition 3.6, pages 1073-1074).'
