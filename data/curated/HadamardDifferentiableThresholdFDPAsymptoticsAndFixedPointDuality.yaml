- claim_id: bh95-criticality-and-one-stage-adaptive-fdr08-br08-asymptotic-distributions
  kind: mechanism
  statement: 'For the BH95 procedure (r_alpha(u) = u/alpha, A = alpha), Condition C.2 holds iff alpha
    > alpha^* = inf_{u->0} u/G(u) = lim_{u->0} 1/g(u) (Condition C.4, page 1075, illustrated in Figure
    2, page 1076 for Laplace location statistics with theta = 2, pi_0 = 0.5 where alpha^* = 2/(1 + e^2)
    ~= 0.23840584), and because d_u r_alpha(tau^*) = 1/alpha = G(tau^*)/tau^* implies zeta(tau^*) = 0,
    the alternative empirical-process fluctuation Z_1(tau^*) cancels out of the FDP limit: sqrt(m)*(FDP_m(T^{BH95}(G_hat_m))
    - pi_0*alpha) ->_d N(0, (pi_0*alpha)^2*(1 - tau^*)/tau^*) (Theorem 4.2, pages 1075-1076; Oracle BH95o
    in Corollary 4.3, pages 1076-1077). For the one-stage AORC procedure FDR08(lambda) truncated at lambda
    >= kappa = alpha*(1 - pi_0)/((1 - alpha)*pi_0) (Definition 4.5, Condition C.6), all lambda in [kappa,
    1) are asymptotically equivalent (Proposition 4.6), and under Conditions C.3, C.4, and C.7 (alpha
    < pi_0), Theorem 4.7 (page 1078) proves asymptotic mean p^* = alpha*pi_0 / pi_0_bar(tau^*) in [pi_0*alpha,
    alpha] (where pi_0_bar(t) = (1 - G(t))/(1 - t)) and limit X^{FDR08} with zeta(tau^*) = -(1 - pi_0_bar(tau^*))*pi_0_bar(tau^*)/alpha
    / (pi_0_bar(tau^*)^2/alpha - g(tau^*)). For the one-stage procedure BR08(lambda) with r_alpha(u) =
    b_alpha^lambda(u) = u / (alpha*(1 - lambda) + u) on [0, lambda] (Definition 4.8), Theorem 4.10 (page
    1079) proves asymptotic mean p^* = alpha*pi_0*(1 - lambda)/(1 - G(tau^*)) <= alpha under Conditions
    C.3, C.8 (alpha*(1 - lambda) > alpha^*), and C.9 (G(lambda) <= (lambda/alpha)*(1 - G(lambda))/(1 -
    lambda)), and shows that BR08(lambda) >> BH95 iff tau^*_{BH95} >= alpha*lambda (page 1080).'
  evidence:
  - source_id: neuvial2008-pdf
    locator: Section 4.1–4.2, pages 1075–1080, Figure 2, Conditions C.4–C.9, Theorem 4.2, Corollary 4.3,
      Proposition 4.6, Theorems 4.7 and 4.10, and Section 7.3.1, pages 1102–1103, Theorem 7.14
    relation: supports
- claim_id: two-stage-plug-in-sto02-sts04-and-bky06-asymptotic-distributions
  kind: mechanism
  statement: 'For two-stage Simes-line plug-in procedures T(F) = sup{u in [0, 1] : F(u) >= u / A(F)} (Section
    4.3, Definition 4.11, page 1080), Theorem 4.12 proves that if A is Hadamard-differentiable at G and
    A(G) > alpha^* (Condition C.10), then sqrt(m)*(FDP_m(T(G_hat_m)) - pi_0*A(G)) ->_d pi_0*A(G)*(Z_0(tau^*)/tau^*
    + A_dot_G(Z)/A(G)). For Storey''s procedure Sto02(lambda) with A(F) = alpha / pi_0_bar^F(lambda) =
    alpha*(1 - lambda)/(1 - F(lambda)) and the finite-sample conservative variant STS04(lambda), Proposition
    7.16 (page 1104) proves asymptotic equivalence under Conditions C.9 and C.11 (alpha > pi_0_bar(lambda)*alpha^*),
    and Theorem 4.15 and Corollary 4.16 (pages 1081-1082) prove that sqrt(m)*(FDP_m(T^{Sto02}(G_hat_m))
    - (pi_0/pi_0_bar(lambda))*alpha) ->_d X^{Sto02} ~ N(0, Var(X^{Sto02})) where for tau^* <= lambda,
    Var(X^{Sto02}(lambda)) = (pi_0*alpha/pi_0_bar(lambda))^2 * {(1 - tau^*)/tau^* + Var(Z(lambda))/(1
    - G(lambda))^2 + 2*pi_0/pi_0_bar(lambda)}. For the two-stage procedure BKY06(lambda) with A(F) = alpha*(1
    - lambda)/(1 - F(U(F, lambda))) and first-stage BH95 threshold u(lambda) = U(G, lambda) (Definition
    4.17), Theorem 4.20 (page 1083) proves under Conditions C.8 and C.12 (lambda > alpha^*) that the asymptotic
    mean FDP is pi_0*alpha*(1 - lambda)/(1 - G(u(lambda))) <= alpha with limit X^{BKY06(lambda)} = (pi_0*alpha*(1
    - lambda)/(1 - G(u(lambda)))) * (Z_0(tau^*)/tau^* + Z(u(lambda)) / ((1 - alpha*(1 - lambda)*g(u(lambda)))*(1
    - G(u(lambda))))), and shows that BKY06(lambda) >> BH95 iff G(u_lambda) >= lambda iff G^2(u_lambda)
    >= u_lambda.'
  evidence:
