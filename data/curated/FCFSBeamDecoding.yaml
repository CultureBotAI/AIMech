claims:
- claim_id: search-procedure
  kind: mechanism
  statement: At each sequence length, expand the continuing hypotheses and scan the candidate pool in
    decreasing score order. Move an encountered EOS-ending hypothesis into the persistent finished set;
    otherwise keep it in the next continuing beam, up to width k. Stop during this selection when k completed
    hypotheses have accumulated and return the best stored completion. The paper also imposes a maximum
    generation length.
  evidence:
  - source_id: method-source
    locator: Figure 1 with p=1, printed p. 77 / PDF p. 1; Section 2 and Figures 2–3, printed pp. 78–79
      / PDF pp. 2–3
    relation: supports
- claim_id: finished-versus-active
  kind: scope
  statement: Finished hypotheses accumulate outside the k-wide continuing beam in FCFS. In the contrasted
    vanilla procedure, completed hypotheses remain among the beam candidates and can later fall out. These
    are different search policies despite a shared beam width.
  evidence:
  - source_id: finished-versus-active
    locator: Section 2 and Figures 1–3, printed pp. 77–79 / PDF pp. 1–3
    relation: supports
