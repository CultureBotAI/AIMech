name: First-come, first-served beam decoding
definition: The sequence beam-decoding procedure described by Kasai and colleagues that stores completed
  hypotheses separately from the continuing beam and stops when the accumulated number of completed hypotheses
  reaches the beam width, returning the highest-scoring stored completion.
concept_kind: algorithm
identity_notes: FCFS here names a sequence-decoding policy, not first-in-first-out queue scheduling. Completed
  sequences leave the active beam and remain in a separate set. This differs from the paper’s vanilla
  beam decoder, where finished and unfinished hypotheses compete for the same beam slots, and from score-prioritized
  per-length best-first beam search. The original policy is the patience-controlled family’s p=1 case.
  No normalized identity match was found across the 442 AIO and 141 prior native records; ignored-inclusive
  text hits in the main checkout were prior discovery leads and incidental substrings such as builds in
  records, source text and dependencies, not existing concept records.
limitations:
- The count-based stopping rule can discard unfinished candidates and is not a global optimality certificate
  or a guarantee of equality to vanilla beam decoding.
- The record identifies the paper’s specified procedure. Claims about particular library defaults are
  historical context, not assertions about current software versions.
- The simplified pseudocode assumes that candidate selection and completion return are defined. Exhausted
  candidate pools, absence of any EOS completion, ties and maximum-length handling require explicit implementation
  policies.
- The score and any length penalty affect candidate selection and comparison of completed outputs. A fixed
  beam width alone does not determine output quality.
- The paper’s favorable comparisons are task/model dependent; no numerical benchmark gain or universal
  generation-quality claim is curated.
