claims:
- claim_id: method
  kind: mechanism
  statement: Initialize teacher parameters from the student and a center c=0. Generate two global crops
    and optional local crops from each image; the teacher sees the global crops and the student sees all
    crops. For raw K-dimensional outputs g, use P_s(v)=softmax(g_s(v)/tau_s) and P_t(v)=softmax((g_t(v)−c)/tau_t),
    with positive temperatures and a sharpened teacher distribution. Average cross-entropy −sum_i P_t(v)_i
    log P_s(v′)_i over teacher global crops and student crops of the same image, excluding the identical
    view, and average over images in the minibatch. Stop gradients through P_t, update student parameters
    by the loss, and update teacher parameters by theta_t←lambda theta_t+(1−lambda)theta_s, with lambda
    in [0,1]. Update c by an exponential moving average with center momentum in [0,1) of the raw teacher
    outputs over all global views in the distributed batch for use on subsequent batches. Both branches
    share backbone and projection-head architecture; downstream features are taken from the backbone before
    the head.
