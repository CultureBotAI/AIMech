name: DINO self-distillation
definition: A self-supervised representation-learning procedure that matches cross-view student probabilities
  to centered and sharpened probabilities from a momentum teacher, without a separate prediction head
  or explicit negative-pair objective.
concept_kind: algorithm
identity_notes: This is Caron et al.’s 2021 DINO self-distillation method, supporting both vision-transformer
  and convolutional backbones. It is not the later DINO object detector, DINOv2/v3, or a particular checkpoint.
  The bare acronym is not asserted as an unqualified alias. Its same-architecture student/teacher branches
  differ from BYOL’s online-only predictor and normalized vector regression. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 187 prior native IDs/names/aliases. Ignored-inclusive
  searches of both full checkouts found no discovery-checkout hits and nine unrelated main-environment
  substrings (Pygments and Sphinx locale/bundle text). Exact neighboring AIO definitions, synonyms and
  incident edges were inspected; task/network vocabulary does not make these algorithms equivalent.
limitations:
- The centering prose on printed p. 9653 says to add c, whereas Algorithm 1 subtracts the running center.
  The pinned author implementation also subtracts it; this record follows the algorithm and implementation
  and preserves the discrepancy.
- The teacher is updated from the student, not supplied as an independently trained larger model. Its
  output coordinates are learned representation probabilities, not verified semantic class labels.
- Centering and sharpening are empirical collapse-control choices, not a proof that all initializations,
  temperatures, momentum schedules or datasets avoid collapsed representations.
- A larger number of local crops changes the cross-view objective. The two-view pseudocode is a specialization;
  losses exclude the teacher/student pair from the identical crop.
- The pinned implementation uses zero center initialization, distributed raw-output averaging and matched
  initial student/teacher weights. Its specific default temperature schedule differs from the paper’s
  reported experimental schedule; this record does not equate all defaults.
- No DINO detector mechanism, later DINO variant, segmentation accuracy claim, trained checkpoint or executed
  benchmark is asserted.
