id: AIMech:PAIRPassageCentricSimilarityRelationForDenseRetrieval
name: PAIR Passage-Centric Similarity Relation for Dense Passage Retrieval
concept_kind: algorithm
review_status: DRAFT
definition: 'A dense passage retrieval training algorithm that jointly enforces query-centric similarity relations (pulling query q toward positive passage p^+ and pushing q away from negative passages p^- in N_P via L_Q(q, p^+, N_P) = -log(exp(f(q, p^+)) / (exp(f(q, p^+)) + sum_{p^- in N_P} exp(f(q, p^-))))) and passage-centric similarity relations (pushing positive passage p^+ away from negative passages p^- in N_P via L_P(q, p^+, N_P) = -log(exp(-f(p^+, p^+)) / (exp(-f(p^+, p^+)) + sum_{p^- in N_P} exp(f(p^+, p^-))))) under a combined objective L(q, p^+, N_P) = (1 - alpha) L_Q(q, p^+, N_P) + alpha L_P(q, p^+, N_P) trained in two stages: a pre-training stage on denoised synthetic pseudo-queries with decaying weight alpha > 0 followed by a fine-tuning stage on human-labeled queries with alpha = 0.'
identity_notes: Distinct from DPR (AIMech:DensePassageRetrieval) and RocketQA (AIMech:RocketQADenoisedHardNegativeSampling), which optimize only query-passage similarity f(q, p) without explicitly penalizing passage-passage inner products f(p^+, p^-); and distinct from GPL (AIMech:GPLGenerativePseudoLabelingForDenseRetrieval), which distills cross-encoder query-passage margins on synthetic queries rather than optimizing a passage-centric contrastive repulsion loss L_P.
aliases:
- PAIR
- PAIR Passage-Centric Dense Passage Retrieval
- Leveraging Passage-Centric Similarity Relation for Improving Dense Passage Retrieval
