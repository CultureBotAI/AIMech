claims:
- claim_id: pair-passage-centric-contrastive-loss
  kind: mechanism
  statement: 'Under the geometric separation condition (Assumption 1: max(||q - p^+||, ||p^+ - p^-||) < ||q - p^-||), query-centric similarity alone cannot prevent hard negative passages p^- from clustering near p^+; PAIR introduces the passage-centric contrastive loss L_P(q, p^+, N_P) = -log(exp(-f(p^+, p^+)) / (exp(-f(p^+, p^+)) + sum_{p^- in N_P} exp(f(p^+, p^-)))) (Equation 2) and combines it with L_Q via L = (1 - alpha) L_Q + alpha L_P (Equation 3) to explicitly minimize positive-negative passage inner products f(p^+, p^-).'
  evidence:
  - source_id: r759-primary-pdf
    locator: Sections 2.1-2.3, Assumption 1, Equations 1-3, Figure 1, pp. 2-3
    relation: supports
  - source_id: r759-primary-pdf
    locator: main() verification of query_centric_loss L_Q, passage_centric_loss L_P, and combined PAIR loss under clustered vs. separated hard negatives
    relation: supports
- claim_id: pair-two-stage-pseudo-query-training
  kind: mechanism
  statement: To overcome data sparsity when estimating both query-centric and passage-centric similarity relations, PAIR generates synthetic queries from passages via a T5/BART generator, filters out noisy pseudo-labels and false negatives with a cross-encoder, pre-trains the dual-encoder with dynamic decay of alpha from alpha_0 > 0, and then fine-tunes on labeled target queries with alpha = 0 (Section 2.4).
  evidence:
  - source_id: r759-primary-pdf
    locator: Section 2.4 Two-Stage Training Procedure, pp. 3-4
    relation: supports
- claim_id: pair-benchmark-applications
  kind: application
  statement: PAIR achieves 37.9 MRR@10 and 86.4% Recall@50 on MS MARCO Passage Ranking Dev and 74.9% Recall@5 / 83.5% Recall@20 on Natural Questions test, outperforming RocketQA and prior dense retrievers while reducing positive-negative passage cosine similarity (Tables 1, 3, and 4).
  evidence:
  - source_id: r759-primary-pdf
    locator: Section 3.2 Main Results & Section 3.3 Detailed Analysis, Tables 1-4, pp. 5-7
    relation: supports
  - source_id: r759-metadata-cr
    locator: BibTeX citation record for arXiv:2108.06027 (Findings of ACL-IJCNLP 2021)
    relation: supports
- claim_id: pair-unit-norm-and-pseudo-query-limitation
  kind: limitation
  statement: When passage embeddings are not L2-normalized, the exp(-f(p^+, p^+)) term in L_P can encourage growing the norm ||p^+|| unless unit-norm constraints or careful decay of alpha are applied, and the two-stage pipeline requires generating and cross-encoder-filtering millions of synthetic queries.
  evidence:
  - source_id: r759-primary-pdf
    locator: Sections 2.2-2.4 & Section 3.1 Implementation Details, pp. 3-5
    relation: supports
