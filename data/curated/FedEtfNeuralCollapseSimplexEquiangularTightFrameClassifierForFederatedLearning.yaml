claims:
- claim_id: r461-synthetic-simplex-etf-and-balanced-feature-loss-mechanism
  kind: mechanism
  statement: Synthesizes a fixed C-simplex ETF classifier V_ETF = sqrt(C / (C - 1)) U (I_C - (1 / C) 1_C 1_C^T) with pairwise cosine similarity -1 / (C - 1) (Definition 3.1, Equations 3-4) and trains l_2-normalized projected features mu alongside a learnable temperature scalar beta using the balanced feature loss ell^g(w, V_ETF; x, y) weighted by local class sample counts n_{k,c}^gamma (Equations 5-7), aligning all clients' class representations toward the optimal Neural Collapse (NC1-NC3) geometry without classifier drift.
  evidence:
  - source_id: r461-primary-pdf
    locator: Section 3.2 (Equations 3-4) & Section 4.1 Improving Generalization by ETF Classifier (Equations 5-8), pp. 3-5
    relation: supports
- claim_id: r461-two-stage-alternating-personalized-adaptation-scope
  kind: scope
  statement: Supports both global model generalization and local personalization via a two-stage post-training adaptation protocol (Section 4.2, Equations 9-11, Algorithm 2) that first adapts the backbone {u, beta} with {p, V_ETF} frozen and then alternates finetuning {V_ETF, beta} and {p, beta} under unweighted cross-entropy loss to match skewed local test distributions.
  evidence:
  - source_id: r461-primary-pdf
    locator: Section 4.2 Personalized Adaptation by Local Finetuning (Equations 9-11) & Appendix A Algorithm 2, pp. 5-6, 13
    relation: supports
- claim_id: r461-feature-dimension-lower-bound-and-projection-layer-limitation
  kind: limitation
  statement: Requires the projection feature dimension d to satisfy d >= C - 1 so that an orthonormal frame U in R^{d x C} with U^T U = I_C can embed a C-class Simplex ETF, and introduces an extra projection MLP g(p; h) plus hyperparameter gamma for balanced loss weighting.
  evidence:
  - source_id: r461-primary-pdf
    locator: Section 3.2 Definition 3.1 & Section 4.1 Equations 5-6, pp. 3-5
    relation: supports
- claim_id: r461-long-tailed-and-heterogeneous-federated-vision-application
  kind: application
  statement: Applied to heterogeneous and long-tailed federated visual recognition on CIFAR-10, CIFAR-100, and Tiny-ImageNet across Dirichlet label skew and partial client participation.
  evidence:
  - source_id: r461-primary-pdf
    locator: Section 5 Experiments (Tables 1-4, Figures 3-6), pp. 6-9
    relation: supports
