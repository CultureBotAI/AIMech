id: AIMech:FedEtfNeuralCollapseSimplexEquiangularTightFrameClassifierForFederatedLearning
name: FedETF (Neural-Collapse-Inspired Federated Learning with Synthetic Fixed Simplex ETF Classifier)
concept_kind: algorithm
review_status: DRAFT
definition: A neural-collapse-inspired federated learning algorithm (Li et al. 2023, Sections 3.2-4.2, Definition 3.1, Equations 3-11, Algorithms 1-2) that eliminates local classifier bias under non-IID data by replacing learnable linear classifiers with a synthetic, globally fixed Simplex Equiangular Tight Frame (ETF) classifier matrix V_ETF = sqrt(C / (C - 1)) U (I_C - (1 / C) 1_C 1_C^T) in R^{d x C} (d >= C - 1, U^T U = I_C) whose columns satisfy unit l_2-norm and maximal equiangular separation v_i^T v_j = (C / (C - 1)) delta_{i,j} - 1 / (C - 1) (Equations 3-4), projecting client backbone features onto the unit hypersphere mu = g(p; f(u; x)) / ||g(p; f(u; x))||_2 (Equation 5), training {u, p, beta} globally via a class-frequency-balanced feature loss ell^g(w, V_ETF; x, y) = -log[(n_{k,y}^gamma exp(beta v_y^T mu)) / sum_{c in [C]} n_{k,c}^gamma exp(beta v_c^T mu)] with learnable scalar temperature beta (Equations 6-8), and adapting locally via two-stage alternating personalized finetuning (Equations 9-11).
identity_notes: Distinct from CCVR (AIMech:CcvrClassifierCalibrationWithVirtualRepresentationsForFederatedLearning, Luo et al. 2021), which trains standard unconstrained classifiers during federated learning and recalibrates the classifier post-hoc using Gaussian virtual features; and distinct from FedBABU (AIMech:FedBabuFederatedLearningWithBodyAggregationAndBodyUpdate, Oh et al. 2022), which freezes a randomly initialized orthogonal or uniform classifier head rather than synthesizing an exact Simplex Equiangular Tight Frame V_ETF with a projection layer, learnable temperature scaling beta, and power-law balanced feature loss.
aliases:
- FedETF
- Simplex Equiangular Tight Frame Federated Learning
- Neural-Collapse Synthetic Fixed ETF Classifier for Heterogeneous Federated Learning
