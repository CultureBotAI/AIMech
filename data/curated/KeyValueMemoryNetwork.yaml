    artificial neural architecture; the AIO target is broader.
- target: AIO:AttentionLayer
  relation: related_match
  rationale: Key addressing uses dot-product soft attention. This relates one component to the pinned
    layer concept without equating the complete architecture with a software layer or asserting an inspected
    API implementation.
limitations:
- The named architecture is distinct from generic key-value storage, original Memory Networks and the
  original MemN2N parameterizations.
- Supplied representations, initial candidate selection and output candidates bound the system; arbitrary
  writable memory, exact retrieval and unlimited context are not established.
- WikiMovies and WikiQA differ in memory construction, metrics and training enhancements. No author code,
  training or benchmark replication was performed.
- All ten pages of arXiv1606.03126v2 were visually read. Other versions and author code were not inspected;
  constructed examples illustrate boundaries only. DRAFT remains.
