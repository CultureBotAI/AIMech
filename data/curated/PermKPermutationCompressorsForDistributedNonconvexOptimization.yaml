id: AIMech:PermKPermutationCompressorsForDistributedNonconvexOptimization
name: PermK Permutation Compressors for Distributed Nonconvex Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A family of correlated n-node unbiased random sparsification operators C = (C_1, ..., C_n) (PermK) that jointly generate a random permutation pi of coordinates (when d >= n, with d = q*n and k = q) or nodes (when n >= d, with n = q*d and k = 1) so that each worker i transmits a disjoint block of coordinates scaled by d/k, satisfying the negative-correlation AB-inequality E[||(1/n) sum_{i=1}^n C_i(x_i) - (1/n) sum_{i=1}^n x_i||^2] <= A * (1/n) sum_{i=1}^n ||x_i||^2 - B * ||(1/n) sum_{i=1}^n x_i||^2 with A = B = 1 (when d >= n) or A = B = (d - 1) / (n - 1) (when n >= d).
identity_notes: Introduced by Rafal Szlendak, Alexander Tyurin, and Peter Richtarik (ICLR 2022; arXiv:2110.03300). Distinct from independent RandK sparsification, where each node independently samples k coordinates yielding B = 0 and A = (d - k) / (n * k) without inter-node variance cancellation; and distinct from MARINA (Gorbunov et al., ICML 2021; Round 391), which provides the variance-reduced distributed framework analyzed under independent compressors whereas PermK introduces the AB-assumption and negatively correlated permutation compressors that strictly improve MARINA's theoretical complexity.
