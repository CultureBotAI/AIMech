claims:
- claim_id: permk-coupled-permutation-sparsification-and-exact-input-variance-mechanism
  kind: mechanism
  statement: When d = q*n, PermK samples a uniform random permutation pi of {1, ..., d} and assigns worker i the coordinate block {pi_{q(i-1)+1}, ..., pi_{q*i}} scaled by n, achieving exact variance E[||(1/n) sum_{i=1}^n C_i(x_i) - x_bar||^2] = (1/n) sum_{i=1}^n ||x_i||^2 - ||x_bar||^2 = IV_1({x_i}) (Theorem 1, A = B = 1); when n = q*d, PermK partitions the n workers into d groups of size q via a random permutation of {1, ..., n} so each worker transmits 1 coordinate scaled by d, achieving exact variance ((d - 1) / (n - 1)) * IV_1({x_i}) (Theorem 3, A = B = (d - 1) / (n - 1)).
  evidence:
  - source_id: r558-primary-pdf
    locator: Section 2 Proposition 1, Section 4 Definitions 1-2 & Theorems 1 and 3, pp. 3, 5-6
    relation: supports
- claim_id: permk-marina-hessian-variance-acceleration-scope
  kind: scope
  statement: Under the AB-assumption and the Hessian-variance quantity L_+-^2 = sup_{x != y} ((1/n) sum_i ||grad f_i(x) - grad f_i(y)||^2 - ||grad f(x) - grad f(y)||^2) / ||x - y||^2 <= L_+^2 - L_-^2 (Definition 3), Theorem 5 and Corollaries 1-2 prove that MARINA with PermK achieves step size gamma <= 1 / (L_- + sqrt(((1 - p)/p) * ((A - B) * L_+^2 + B * L_+-^2))), improving communication and oracle complexity over independent RandK by up to sqrt(n) when d >= n and sqrt(d) when n >= d.
  evidence:
  - source_id: r558-primary-pdf
    locator: Section 5 Definition 3, Section 6 Theorem 5, Corollaries 1-2, & Table 2, pp. 6-8
    relation: supports
- claim_id: permk-shared-prng-seed-and-divisibility-handling-limitation
  kind: limitation
  statement: Implementing PermK without central coordination overhead requires all workers to share a synchronized pseudo-random permutation seed across rounds, and when n does not divide d (or d does not divide n), residual coordinates must be handled via block-diagonal concatenation or RandR padding (Appendix F).
  evidence:
  - source_id: r558-primary-pdf
    locator: Section 4.1-4.2 & Appendix F Generalizations when n does not divide d, pp. 5-6, 26-29
    relation: supports
- claim_id: permk-marina-nonconvex-quadratic-and-autoencoder-training-application
  kind: application
  statement: Applied within MARINA to distributed nonconvex logistic regression with nonconvex regularizer on w8a and mushRoom datasets, homogeneous/heterogeneous quadratic optimization with controlled Hessian variance, and autoencoder training on MNIST.
  evidence:
  - source_id: r558-primary-pdf
    locator: Section 7 Experiments, Figures 1-2, pp. 8-9
    relation: supports
