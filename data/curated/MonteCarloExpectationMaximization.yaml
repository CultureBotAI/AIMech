claims:
- claim_id: current-conditional-objective
  kind: mechanism
  statement: At current theta_k, obtain m_k latent completions from the conditional law p(z|y;theta_k).
    For candidate theta form Q_hat_k(theta)=m_k^(-1) sum_j log f(y,z_kj;theta), and maximize over theta
    to obtain the next fit. The simulated completions remain fixed while this sampled objective is optimized.
    The baseline MCEM calculation replaces the preceding sampled objective at each iteration; it does
    not recursively average objectives from earlier parameter values.
  evidence:
  - source_id: saem-source
    locator: Section 2 Eq5 and Section 3 MCEM/SAEM comparison, pp.96-98 / PDF3-5
    relation: supports
- claim_id: integration-not-averaged-estimator
  kind: scope
  statement: The Monte Carlo average is taken over complete log objectives or their sufficient statistics
    before maximization. In general this is different from averaging the complete-data maximizer over
    imputations. A MAP objective can be represented by an appropriate complete log posterior, but simulating
    latent completions at a current parameter does not by itself sample a posterior distribution over
    that parameter.
  evidence:
  - source_id: saem-source
    locator: Sections 1-2, pp.94-97 / PDF1-4; Eq4-5 and fixed-parameter conditional-law definition
    relation: supports
- claim_id: finite-sample-boundaries
  kind: limitation
  statement: Maximizing a finite sampled Q does not certify improvement of the exact Q or observed likelihood.
    The saved valid Gaussian example gives an MCEM update with lower observed likelihood than its starting
    value. Monte Carlo count, dependence and integration error require their own analysis; apparently
    stable parameters or the exact-EM ascent argument alone do not establish convergence of this stochastic
    procedure.
  evidence:
  - source_id: saem-source
    locator: Section 2 Eq4-5, pp.96-97 / PDF3-4; Section 3 sampling discussion, p.98 / PDF5; finite Gaussian
      curator calculation in discovery ledger
    relation: supports
limitations:
- The full mechanism source inspected here is the 1999 primary SAEM paper, which explicitly presents MCEM
  for comparison. The original Wei-Tanner 1990 paper was identified through publisher metadata/abstract
  but its university PDF returned 403; no unseen original proofs or poor-man data-augmentation details
  are claimed.
- The simple unweighted sample mean requires draws from the intended conditional law. MCMC samples are
  generally dependent and need appropriate exploration/ergodicity conditions; importance sampling requires
  its own weighting. A local-observation heuristic is not certified full-posterior sampling.
- Finite Monte Carlo noise can persist near a stationary point. No generic fixed-sample-size convergence
  theorem, universal rate, adaptive sample-size rule or global optimum is asserted.
- The complete objective must be well defined and its maximization admissible. Boundary or unbounded likelihoods,
  nonidentifiability, poor initialization and numerical errors remain model-specific limitations.
- All 35 pages of the comparison source were read. Finite algebraic checks are curator examples, not historical
  software, a reproduced fit or empirical performance evidence.
