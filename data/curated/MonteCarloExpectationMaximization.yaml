name: Monte Carlo Expectation Maximization
aliases:
- MCEM
- Monte Carlo EM
concept_kind: algorithm
definition: An expectation-maximization method that approximates the current conditional expected complete-data
  log objective by Monte Carlo integration and maximizes that sampled objective to update the parameters.
identity_notes: MCEM approximates the E-step of a latent-data fitting procedure. It differs from recursive
  objective averaging in SAEM, conditional expectation of a completed-data estimator in ICE, and Bayesian
  data-augmentation sampling of the parameter itself. Specialized synthetic-data or image-model applications
  do not exhaust this general algorithm. All 442 pinned AIO labels/scoped synonyms and 470 preceding native
  IDs, names and aliases were compared with no normalized identity match. Ignored-inclusive whole-checkout
  fixed-string searches found 218 matched lines in each checkout; context windows for all 41 distinct
  matched texts were read. BayesianDataAugmentation, HiddenMarkovTree and IterativeConditionalEstimation
  mention applications or adjacent estimators, not these identities. All 225 semantic label/synonym rows
  were recomputed and verified identical to the preceding fully read inventory. Sixteen annotated AIO
  nodes and outgoing edges comprise fourteen verified prior readings and two new readings. Thirty-four
  contextual YAMLs comprise twenty-seven byte-verified prior readings and seven full new readings. Absence
  is bounded to this pin, maintained corpus and inspected neighborhood. No normalized name/alias matches
  among 442 pinned and 470 maintained records. BayesianDataAugmentation, HiddenMarkovTree and IterativeConditionalEstimation
  matches are applications or adjacent estimators, not duplicate generic MCEM, SAEM or MCMC-SAEM records.
  The inspected sufficient-statistic maximization and fixed-data scope distinguish SAEM from averaged
  parameter gradients, ICE and sequential-task continual learning. Persistent Markovian simulation distinguishes
  the MCMC extension from the exact-conditional-draw base theorem.
