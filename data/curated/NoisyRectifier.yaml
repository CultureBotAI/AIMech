claims:
- claim_id: method
  kind: mechanism
  statement: For a preactivation a, sample zero-mean additive noise z and output max(0,a+z). With the
    source’s standard logistic density sigma(z)*(1-sigma(z)), the probability of a positive output is
    sigma(a), and the conditional mean output is log(1+exp(a)). These identities are specific to that
    logistic-noise choice, not arbitrary zero-mean noise. Holding a sampled noise value fixed, the derivative
    with respect to a is 1 on the positive side and 0 on the negative side, with a nondifferentiable boundary
    at a+z=0. Noise can occasionally turn an otherwise inactive unit on or an active unit off. The source
    also suggests adjusting a unit bias when a moving activity rate falls below a chosen target; that
    heuristic is additional to the forward activation rule.
