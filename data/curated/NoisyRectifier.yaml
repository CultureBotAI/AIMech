name: Noisy rectifier
definition: A stochastic activation that adds zero-mean noise to a preactivation and then applies the
  positive-part rectifier, producing h=max(0,a+z).
concept_kind: mathematical_method
identity_notes: 'This record covers the noisy rectifier described in Bengio et al. Section 2.1, with standard
  logistic noise as the analytically characterized special case. It is a stochastic activation, distinct
  from deterministic ReLU or softplus, input-only corruption, weight-noise dense layers and multiplicative
  dropout. The paper credits earlier rectifier work; this record does not claim that the 2013 paper invented
  noisy rectification. No normalized identity match was found across all 442 pinned AIO labels/scoped
  synonyms and 337 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored
  and hidden files in worktree and main, returning 22 and 22 lines respectively. All 15 unique matched
  line contents were inspected in full: the preceding gradient-estimator records, their cited Bengio source,
  saved source-reading scopes, reviews and open discovery leads, not existing candidate records. Exact
  checkout counts and differences are retained in the ledger. Thirteen exact AIO CLASS nodes with scoped
  synonyms/comments and outgoing edges and six full native neighboring records were inspected. Absence
  is bounded to this snapshot and semantic neighborhood.'
limitations:
- Equality of the logistic-noise mean to softplus does not make a sampled noisy rectifier a deterministic
  softplus unit. Passing the mean through a nonlinear downstream loss does not generally preserve the
  expected loss.
- The standard logistic activation and mean formulas change with the noise distribution or scale. Gaussian
  noise is mentioned as a practical alternative, but it does not inherit the displayed logistic identities.
- Occasional activation permits gradient flow for some samples but does not guarantee that inactive units
  recover promptly, that every derivative-through-expectation interchange is valid, or that conditional
  computation saves wall-clock time.
- No empirical speed, accuracy or sparsity advantage is asserted. The original authors’ implementation
  and later noisy-activation variants were not audited.
