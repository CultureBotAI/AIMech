name: Product of Student-t
aliases:
- Product of Student-t Model
- PoT
concept_kind: model_family
definition: A normalized energy-based density on continuous observations formed from products of Student-t-shaped
  factors of linear filter responses, with a positive finite joint normalizer and optional grouping of
  filter energies.
identity_notes: This is a specified analysis-product model within the maintained Product of Experts family.
  Sparse filter responses need not be independent, and the model differs from a directed sparse synthesis
  dictionary with independent source coefficients. The square invertible case connects to noiseless Student-t
  ICA; an overcomplete analysis product is a different generalization. Grouped quadratic responses retain
  the stated family extension. The paper also proposes nonquadratic powers, which are broader generalized
  factors and are not all literally Student-t distributions. Iterated Wiener Filter is a separately represented
  inference algorithm, not another name for this density. Four candidate identities were compared against
  all 442 pinned AIO IDs, labels and scoped synonyms and 447 preceding native IDs, names and aliases.
  Sparse coding matches the exact synonym and definition of AIO:SparseLearning and is reused; none of
  the three selected additions has a normalized identity match. Ignored/hidden full-checkout searches
  returned 47 lines each in worktree and main, with identical matched-line sets after merge. All 47 matched
  lines were read; they contain the existing sparse-coding class, its source/export and prior discovery
  context. All 205 semantic label/synonym rows were read and verified unchanged. Twenty-four annotated
  AIO nodes and outgoing edges comprise 23 unchanged prior readings and one new symmetry-network inspection.
  Thirty-two contextual YAMLs comprise 31 unchanged prior readings and one fully read new record, including
  eight native neighbors. Absence and no-match assessments are bounded to this snapshot and inspected
  neighborhood.
