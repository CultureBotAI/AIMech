name: Fast persistent contrastive divergence
definition: A persistent-chain RBM learning algorithm that adds rapidly updated, rapidly decaying auxiliary
  parameters to the sampling energy while retaining separate regular parameters for the model distribution.
concept_kind: algorithm
identity_notes: This is fast PCD from Tieleman and Hinton, not a generic fast implementation of PCD. Its
  temporary energy overlay is separate from the parameters defining the learned model. It differs from
  momentum alone, partial smoothing of positive gradients, ordinary persistent sampling and fast-weight
  memory architectures used for prediction. All 442 pinned AIO labels/scoped synonyms and 370 preceding
  native IDs/names/aliases were compared, with no normalized identity match. Fixed-string searches included
  ignored and hidden files throughout both worktree and main, returning 29 lines each; all 22 unique matched
  contents were read. Hits described CD as a training component, a pending lead or a boundary from CD-PercLoss,
  not an existing candidate record. All 61 semantic label/synonym hits, 21 exact annotated AIO nodes with
  outgoing edges, corresponding generated records and four native neighbors were inspected. Previously
  fully read contextual files were verified byte-identical. Absence is bounded to this snapshot and inspected
  neighborhood.
limitations:
- The negative phase uses a changing overlay and is not an unbiased equilibrium estimate for the base
  theta model merely because each conditional is tractable. Fast parameters intentionally change the sampling
  landscape; improved mixing is a motivation supported by particular experiments, not a universal guarantee.
- Section 6 computes h-minus as a vector of conditional probabilities and then writes a visible draw conditioned
  on h-minus while calling this a full Gibbs update. Exact binary block Gibbs also requires drawing a
  hidden state; using the probability vector directly gives a distinct mean-field-style transition. This
  record preserves the intended combined-parameter sampling mechanism without certifying an uninspected
  implementation or silently resolving that pseudocode ambiguity.
- The pseudocode computes negative statistics at the current particles before advancing them, then updates
  both parameter sets. Changing the ordering or using regular instead of combined parameters in the negative
  conditionals changes the stated procedure. Final conditional expectations for statistics and sampled
  states for transitions must be distinguished.
- Fast decay, learning-rate schedules, particle count and initialization influence the procedure. The
  paper tests alternatives, and its 19/20 decay and 100 chains are not universal optimal settings. Fast
  PCD does not mean that fast parameters contribute to the final base model’s normalized density.
- The source’s mixing discussion and restricted MNIST/Micro-NORB experiments do not certify global convergence,
  asymptotic unbiasedness, universally better likelihood or optimal general hyperparameters. No author-code
  or empirical-performance reproduction was performed.
