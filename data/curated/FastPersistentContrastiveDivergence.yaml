claims:
- claim_id: method
  kind: mechanism
  statement: Maintain regular parameters theta, auxiliary fast parameters phi and persistent visible configurations.
    Compute positive statistics using hidden conditional probabilities under theta given the data. Compute
    negative statistics at the fantasy configurations using hidden conditionals under theta+phi, and advance
    the persistent chains with the combined sampling parameters. Use the same positive-minus-negative
    statistic difference g to increment theta by eta_regular*g and set phi to rho*phi+eta_fast*g. The paper’s
    pseudocode uses rho=19/20, initializes fast parameters at zero and regular parameters at small random
    values, and uses 100 initially zero visible chains. Its initial experiments keep the fast learning
    rate constant while reducing the regular rate, and later examine alternative schedules. These numerical
    settings instantiate the method rather than defining every FPCD variant. The reported model probability
    is defined by theta alone; the fast overlay shapes fantasy-particle exploration and decays quickly.
