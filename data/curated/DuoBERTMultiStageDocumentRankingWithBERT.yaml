claims:
- claim_id: duobert-three-segment-pairwise-bert-classification-and-loss
  kind: mechanism
  statement: "Following stage H_0 (BM25 retrieving k_0 candidates R_0) and stage H_1 (monoBERT scoring [CLS] q [SEP] d_i [SEP] trained with pointwise cross-entropy loss L_mono = -sum_{j in J_pos} log(s_j) - sum_{j in J_neg} log(1 - s_j), Equation 1, to select top-k_1 candidates R_1), stage H_2 (duoBERT) takes query q as sentence A (truncated to 62 tokens), candidate d_i as sentence B (223 tokens), and candidate d_j as sentence C (223 tokens)\u2014each with its own learned segment type embedding A, B, C so total length <= 512\u2014and projects the [CLS] vector to pairwise preference probability p_{i,j} trained via L_duo = -sum_{i in J_pos, j in J_neg} log(p_{i,j}) - sum_{i in J_neg, j in J_pos} log(1 - p_{i,j}) (Section 3.3, Equation 2)."
  evidence:
  - source_id: r783-primary-pdf
    locator: Sections 3.1-3.3, Figure 1 & Equations 1-2, pp. 3-4
    relation: supports
  - source_id: r783-primary-pdf
    locator: mono_bert_loss() and duo_bert_loss() verification
    relation: supports
- claim_id: duobert-pairwise-probability-aggregation-operators
  kind: mechanism
  statement: At inference time, duoBERT evaluates k_1(k_1 - 1) ordered candidate pairs in R_1 and aggregates p_{i,j} over competitor set J_i = {0 <= j < |R_1|, j != i} into a per-document score s_i via SUM (s_i = sum_{j in J_i} p_{i,j}, Equation 3), Condorcet-inspired BINARY (s_i = sum_{j in J_i} 1_{p_{i,j} > 0.5}, Equation 4), MIN (Equation 5), MAX (Equation 6), or m-sample SAMPLE (Equation 7), where SUM and BINARY consistently achieve the highest effectiveness while MAX severely degrades monoBERT accuracy (Section 3.3 & Section 5, Tables 1-2).
  evidence:
  - source_id: r783-primary-pdf
    locator: Section 3.3 & Section 5, Equations 3-7 & Tables 1-2, pp. 4, 6-8
    relation: supports
  - source_id: r783-primary-pdf
    locator: aggregate_duobert_scores() and main() verification of SUM/BINARY/MIN vs MAX failure
    relation: supports
- claim_id: duobert-msmarco-and-treccar-cascading-ranking-application
  kind: application
  statement: On MS MARCO passage ranking and TREC 2017 CAR, the BM25 (k_0 = 1000) -> monoBERT (k_1 = 50) -> duoBERT pipeline improves MS MARCO Dev / Eval MRR@10 from 18.7 / 19.0 (BM25) to 37.2 / 36.5 (+monoBERT), 38.2 / 37.0 (+duoBERT_SUM), 38.3 Dev (+duoBERT_BINARY), and 39.0 / 37.9 with Target Corpus Pre-training (TCP, Table 1), while on TREC CAR it raises MAP from 15.3 (BM25) to 34.8 (+monoBERT) and 36.9 (+duoBERT_SUM or duoBERT_BINARY, Table 2), with k_1 = 20 capturing nearly the full gain at only 40% extra latency over monoBERT (Section 5.2, Figure 3).
  evidence:
  - source_id: r783-primary-pdf
    locator: Section 5, Tables 1-3 & Figures 2-4, pp. 6-10
    relation: supports
- claim_id: duobert-quadratic-pairwise-inference-cost-and-length-truncation-limitation
  kind: limitation
  statement: Because duoBERT executes k_1(k_1 - 1) full BERT forward passes per query (e.g., 50 x 49 = 2,450 additional BERT inferences on top of k_0 = 1000 monoBERT inferences, totaling 3,450 BERT passes per query at k_1 = 50), inference cost grows quadratically in k_1 (Sections 3.3 & 5.2, Figures 3-4), and fitting two candidate documents alongside the query within BERT's 512-token window requires truncating each candidate to at most 223 tokens (Section 3.3).
  evidence:
  - source_id: r783-primary-pdf
    locator: Section 3.3 & Sections 5.2-5.3, Figures 3-4, pp. 4, 7-9
    relation: supports
