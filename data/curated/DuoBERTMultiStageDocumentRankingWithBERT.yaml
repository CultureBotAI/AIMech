id: AIMech:DuoBERTMultiStageDocumentRankingWithBERT
name: monoBERT and duoBERT Multi-Stage Document Ranking
concept_kind: architecture
review_status: DRAFT
definition: A three-stage cascading document ranking architecture (H_0 -> H_1 -> H_2) in which a bag-of-words BM25 stage H_0 retrieves top-k_0 candidates R_0 from an inverted index, a pointwise BERT binary relevance classifier stage H_1 (monoBERT) scores each (q, d_i) pair independently via [CLS] cross-entropy classification to retain the top-k_1 <= k_0 candidates R_1, and a pairwise BERT stage H_2 (duoBERT) jointly encodes triples (query q as sentence A, candidate d_i as sentence B, candidate d_j as sentence C with three distinct segment embeddings) to predict the probability p_{i,j} that d_i is more relevant than d_j across all k_1(k_1 - 1) ordered pairs, aggregating the pairwise probabilities via SUM or Condorcet BINARY voting to produce the final ranking R_2.
identity_notes: Distinct from listwise cross-encoder fusion architectures such as HLATR (AIMech:HLATRHybridListAwareTransformerReranking), which model cross-document interactions over pre-computed pointwise [CLS] vectors in a single listwise Transformer pass rather than running k_1(k_1 - 1) full BERT forward passes over concatenated (q, d_i, d_j) token triples; and distinct from CEDR (AIMech:CEDRContextualizedEmbeddingsForDocumentRanking), which is a single-stage pointwise re-ranker fusing multi-layer token similarity matrices with [CLS].
aliases:
- duoBERT
- monoBERT and duoBERT
- Multi-Stage Document Ranking with BERT
