id: AIMech:LoRAMoE
name: LoRAMoE
concept_kind: architecture
review_status: DRAFT
definition: A Mixture-of-Experts-style parameter-efficient fine-tuning architecture that freezes the pre-trained backbone feed-forward linear weights W_0 to preserve parametric world knowledge, introduces N parallel low-rank experts Delta W_{E_i} = B_i A_i gated by a trainable softmax router G(x) = Softmax(x W_g) as o = W_0 x + (alpha / r) sum_{i=1}^N omega_i B_i A_i x, and enforces a Localized Balancing Constraint L_lbc = sigma^2(I o Q) / mu(I o Q) during supervised fine-tuning to partition experts into world-knowledge-aligning experts and downstream-task experts while balancing utilization within each group.
identity_notes: Distinct from HydraLoRA (AIMech:HydraLoRA, which shares a single down-projection matrix A across multiple up-projection heads B_k without type-partitioned localized balancing), from MoLE (AIMech:MoLEMixtureOfLoRAExperts, which freezes pre-trained LoRAs and gates over their concatenated layer outputs), and from standard sparsely-gated MoE layers (which replace the entire FFN with full-rank experts and apply a single-distribution global coefficient-of-variation balancing loss). Formulated by Dou et al. (ACL 2024, arXiv:2312.09979).
aliases:
- LoRAMoE Plugin with Localized Balancing Constraint
- Localized-Balanced Mixture of LoRA Experts for World Knowledge Retention
- MoE-Style LoRA Plugin for Alleviating World Knowledge Forgetting
