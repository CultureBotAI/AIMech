claims:
- claim_id: loramoe-ffn-plugin-forward-routing-mechanism
  kind: mechanism
  statement: In each Transformer FFN block, LoRAMoE freezes the pre-trained linear weight matrix W_0 in R^{d_in x d_out} and adds N trainable low-rank experts Delta W_{E_i} = B_i A_i (A_i in R^{d_in x r}, B_i in R^{r x d_out}, r << min(d_in, d_out)) weighted by a router G(x) = Softmax(x W_g) so that the layer output is o = W_0 x + (alpha / r) sum_{i=1}^N omega_i B_i A_i x.
  evidence:
  - source_id: r687-primary-pdf
    locator: Section 3.1 Architecture, Eq. 1-5 and Figure 4, p. 3-5
    relation: supports
- claim_id: loramoe-localized-balancing-constraint-mechanism
  kind: mechanism
  statement: Given the sample-level expert importance matrix Q_{n,m} = sum_{j=1}^{T_m} G(x_j)_n for expert n and training sample m and the binary-group affinity coefficient matrix I_{n,m} = 1 + delta when Type_e(n) = Type_s(m) and 1 - delta when Type_e(n) != Type_s(m) (delta in [0, 1]), LoRAMoE minimizes L_total = L + beta * L_lbc with L_lbc = sigma^2(I o Q) / mu(I o Q), softly specializing subsets of experts to world-knowledge vs. downstream tasks while balancing utilization within each expert group and requiring no task-type labels at inference time.
  evidence:
  - source_id: r687-primary-pdf
    locator: Section 3.2 Localized Balancing Constraint, Eq. 6-9 & Appendix C Eq. 10-12, p. 5-6, 11-13
    relation: supports
- claim_id: loramoe-large-scale-sft-knowledge-retention-application
  kind: application
  statement: LoRAMoE is applied to large-scale multi-task supervised fine-tuning of LLaMA-2-7B on 3 million instruction samples spanning reading comprehension, NLI, translation, summarization, coreference, and closed-book QA (TriviaQA, Natural Questions, HotpotQA), improving world-knowledge benchmark scores by an average of 35.3% (up to 63.9%) over vanilla SFT and 30.9% over single-LoRA PEFT while matching or exceeding SFT on downstream tasks.
  evidence:
  - source_id: r687-primary-pdf
    locator: Section 4.1-4.4, Tables 2-3 and Figure 7, p. 6-8
    relation: supports
- claim_id: loramoe-coarse-binary-task-taxonomy-limitation
  kind: limitation
  statement: During training, the Localized Balancing Constraint requires partitioning training datasets into pre-defined coarse task categories (world-knowledge vs. other downstream tasks) to construct the importance coefficient matrix I_{n,m}, and its extension to finer-grained multi-category expert taxonomies and models larger than 7B parameters remains unverified.
  evidence:
  - source_id: r687-primary-pdf
    locator: Section 7 Limitations, p. 9
    relation: supports
