name: SHapley additive explanations
definition: An additive feature-attribution framework assigning Shapley values to a prediction through
  a specified function for evaluating feature subsets.
concept_kind: mathematical_method
identity_notes: SHAP denotes the attribution framework, not the software package or any one estimator
  such as Kernel SHAP. LIME instead fits a locally weighted surrogate objective that need not recover
  these Shapley values.
aio_mappings:
- target: AIO:Model
  relation: related_match
  rationale: The framework attributes predictions of a predictive model through feature-subset evaluations.
    This directly supported analysis relationship does not equate the explanation method with a model
    or assert a model superclass.
limitations:
- Feature-subset evaluation and dependence assumptions affect the interpretation; the paper distinguishes
  conditional expectations from independence approximations.
- Attribution values do not by themselves establish causal effects or that a model is safe to deploy.
