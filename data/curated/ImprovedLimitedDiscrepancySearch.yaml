  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: For each budget k from zero through the supplied maximum depth, recursively track remaining
    depth D and discrepancies k. In the binary Figure 3, visit the preferred child when D>k, leaving k
    unchanged; visit the nonpreferred child when k>0, reducing k by one. Both moves reduce D by one. When
    D=k, only nonpreferred choices remain possible along a path that reaches the depth bound. The printed
    procedure visits the preferred branch before the nonpreferred branch when both are allowed.
  evidence:
  - source_id: method-source
    locator: Improved Limited Discrepancy Search and Figure 3, printed p. 287 / PDF p. 2; Interior Node
      Overhead of ILDS, printed p. 288 / PDF p. 3
    relation: supports
- claim_id: repeated-prefixes
  kind: limitation
  statement: Maximum-depth paths are generated once across discrepancy passes, but shorter leaves and
    internal nodes can recur. The paper’s uniform-tree overhead analysis and its negative number-partitioning
    results are distinct from a universal performance guarantee.
  evidence:
  - source_id: repeated-prefixes
    locator: Printed pp. 287–288 and 290–291 / PDF pp. 2–3 and 5–6
    relation: supports
