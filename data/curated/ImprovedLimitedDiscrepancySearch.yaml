name: Improved limited discrepancy search
definition: Korf’s discrepancy-search variant that uses a supplied maximum search depth and remaining
  discrepancy count to generate each path to that depth in the pass corresponding to its exact number
  of nonpreferred choices, avoiding the original method’s repeated maximum-depth paths.
concept_kind: algorithm
identity_notes: ILDS is the 1996 improvement to LDS, not a generic label for any later discrepancy-search
  modification. Its exact-count guarantee concerns leaves at the specified maximum depth; shallower leaves
  and internal nodes can still be revisited. The supplied depth bound differs from a bound on the depths
  at which discrepancies are allowed. No normalized identity match was found across the 442 AIO and 141
  prior native records; ignored-inclusive text hits in the main checkout were prior discovery leads and
  incidental substrings such as builds in records, source text and dependencies, not existing concept
  records.
limitations:
- A valid upper bound on maximum depth is an input. A loose bound or pruning that creates shallower leaves
  reduces the benefit because those leaves may be visited on several passes.
- Visiting each maximum-depth leaf once does not mean visiting every internal node once; repeated prefixes
  remain.
- The complete uniform-tree expansion analysis is conditional on that tree shape. It does not establish
  an unconditional wall-clock advantage on pruned trees or early-terminated searches.
- The procedure’s discrepancy priority does not guarantee that the first goal is shortest or globally
  minimum-cost. No universal superiority over DFS is asserted.
- The 1996 prose gives a depth-three original-LDS path count inconsistent with its own displayed counting
  formula and the original paper’s trace. No literal 19-path count is adopted.
