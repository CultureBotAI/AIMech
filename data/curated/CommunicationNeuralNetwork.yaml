- target: AIO:ArtificialNeuralNetwork
  relation: broad_match
  rationale: Shared learned per-agent modules, continuous hidden communication and output decoders form
    a particular artificial neural architecture. The target is broader; the basic architecture does not
    require temporal recurrence, the named GCN operator, a probabilistic graphical-model task or learned
    attention weights.
limitations:
- The named identity is Sukhbaatar, Szlam and Fergus’s Communication Neural Net (CommNet), not every communication
  network or language-model agent system.
- The broadcast equations assume at least two agents; the local formula requires a nonempty chosen neighborhood.
  No author-code audit supplies omitted edge-case conventions.
- Per-agent output distributions are permutation equivariant under consistent relabeling. The global question-answering
  variant has a different final readout; the two are not interchangeable.
- All nine main-paper pages were read. Supplementary material, author code and other versions were not
  inspected. Tiny exact calculations check pooling identities only; no training, hardware experiment or
  benchmark replication was performed. DRAFT remains.
