claims:
- claim_id: r440-primal-dual-metric-recursion-and-network-independent-step-size
  kind: mechanism
  statement: Introducing the dual sequence d^{k+1} = d^k - alpha^{-1}(I - W_tilde)(X^k - alpha nabla S(X^k)) and metric M = alpha^{-1} I - (I - W_tilde)^{-1} + I (Section II-B, Equation 6), NIDS is equivalent to the symmetric primal-dual proximal iteration (X^k - X^{k+1}) + alpha(d^k - d^{k+1}) = alpha(nabla S(X^k) - nabla S(X^{k-1})) with X^{k+1} = prox_{alpha R}(X^k - alpha d^{k+1} - alpha nabla S(X^k)), which remains positive-definite and convergent for any 0 < alpha_i < 2 / L_i regardless of how close lambda_2(W) is to 1 (Theorem 1).
  evidence:
  - source_id: r440-primary-pdf
    locator: Section II-B Equivalence to a Primal-Dual Algorithm (Equation 6) & Section III-A Sublinear Rate (Theorem 1), pp. 4496-4498
    relation: supports
- claim_id: r440-separated-function-and-consensus-linear-convergence-rate
  kind: mechanism
  statement: When the smooth local objectives s_i are mu_i-strongly convex and r_i = 0, Theorem 2 proves global linear convergence at rate O((1 - max(1 - alpha mu / 2, (1 - c)(1 - lambda_2(W)) / 2))^{-k}), cleanly separating the optimization condition number L / mu from the network spectral gap 1 - lambda_2(W) so that O(L/mu + 1/(1 - lambda_2(W))) log(1/epsilon) iterations suffice instead of their product.
  evidence:
  - source_id: r440-primary-pdf
    locator: Section III-B Linear Convergence Rate for Smooth Strongly Convex Objectives (Theorem 2, Remark 3), pp. 4499-4501
    relation: supports
- claim_id: r440-smallest-eigenvalue-bound-and-two-step-history-limitation
  kind: limitation
  statement: Choosing the mixing shift parameter c >= 1 / (1 - lambda_n(W)) requires a lower bound on the smallest eigenvalue lambda_n(W) of the symmetric mixing matrix W (e.g., c = 1/2 when lambda_n(W) >= -1), and each node must store two consecutive primal iterates X^k, X^{k-1} and gradients nabla S(X^k), nabla S(X^{k-1}).
  evidence:
  - source_id: r440-primary-pdf
    locator: Section II-A Algorithm Description & Assumption 1, pp. 4495-4496
    relation: supports
- claim_id: r440-decentralized-sparse-lasso-and-quadratic-sensing-application
  kind: application
  statement: Applied to decentralized sparse signal recovery (L_1-regularized LASSO) and ill-conditioned distributed quadratic estimation over poorly connected networks.
  evidence:
  - source_id: r440-primary-pdf
    locator: Section IV Numerical Experiments (Figures 1-4), pp. 4501-4504
    relation: supports
