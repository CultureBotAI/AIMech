id: AIMech:NidsNetworkIndependentStepSizeDecentralizedProximalGradientMethod
name: NIDS (Network-Independent Step-Size Decentralized Proximal-Gradient Method)
concept_kind: algorithm
review_status: DRAFT
definition: A decentralized composite optimization algorithm (Li, Shi, & Yan 2019, Section II, Equation 4) for minimizing (1/n) sum_{i=1}^n (s_i(x) + r_i(x)) over an undirected connected network with symmetric doubly stochastic mixing matrix W that updates X^{k+1} = prox_{alpha R}(W_tilde X^k + X^k - W_tilde X^{k-1} - alpha nabla S(X^k) + alpha W_tilde nabla S(X^{k-1})) using the affine-shifted consensus matrix W_tilde = ((1 + c) I + (1 - c) W) / 2 with c in [1 / (1 - lambda_n(W)), 1), admitting any network-independent step size alpha_i in (0, 2 / L_i) identical to centralized proximal gradient descent.
identity_notes: Distinct from EXTRA (AIMech:ExtraExactFirstOrderAlgorithmForDecentralizedConsensusOptimization, Shi et al. 2015) and PG-EXTRA, which apply the raw mixing matrix W in the gradient difference term X^{k+1} = W X^k + X^k - W_tilde X^{k-1} - alpha(nabla S(X^k) - nabla S(X^{k-1})) and therefore restrict step sizes by the spectral gap of W (alpha < 2 lambda_min(W_tilde) / L), whereas NIDS multiplies the previous gradient by W_tilde inside the proximal argument so the maximal stable step size alpha < 2 / L is completely independent of the network topology.
