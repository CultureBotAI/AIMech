limitations:
- Continuous action mixtures are deterministic relaxed memory updates, not automatically discrete stack
  semantics or an exact ensemble of symbolic trajectories.
- Historical pinned code fixes stack capacity; full pushes can irreversibly discard bottom entries. The
  paper growing-memory abstraction does not certify this implementation as dynamically unbounded.
- Hard argmax action selection and gradual sharpening/refinement/pruning are different procedures. Ties,
  numerical precision and finite sharpening limit ideal discrete-operation interpretations. Strict softmax
  positivity at finite logits refers to ideal real arithmetic, not a promise of strictly interior floating-point
  results.
- Stack count, read depth, no-op availability, sentinel boundaries and hidden recurrence vary by configuration;
  no single benchmark recipe defines all variants.
- All nine conference-paper pages and complete pinned README.md, StackRNN.h and Nonlinearity.h were read.
  Supplement, task drivers and other dependencies were not audited; no source execution, training or empirical
  replication was performed.
- Source tasks, sequence lengths, supervision and tuning constrain the reported generalization. No unlimited
  exact memory, universal LSTM replacement or independently verified performance claim is made.
