id: AIMech:RocketQADenoisedHardNegativeSampling
name: RocketQA (Cross-Batch and Denoised Hard Negative Dense Passage Retrieval Training)
concept_kind: algorithm
review_status: DRAFT
definition: A four-step multi-stage training algorithm for dual-encoder dense passage retrieval that (1) trains an initial dual-encoder M_D^(0) on labeled data D_L using differentiable all-gather cross-batch negatives across A GPUs (yielding A*B - 1 negatives per question for per-GPU batch size B), (2) trains a cross-encoder M_C on top-k candidates retrieved by M_D^(0), (3) trains a second dual-encoder M_D^(1) using denoised hard negatives mined from M_D^(0)'s top ranks that M_C predicts as negative with high confidence (score < 0.1), and (4) trains a final dual-encoder M_D^(2) on D_L plus pseudo-labeled external questions D_U filtered by M_C (< 0.1 for negatives, > 0.9 for positives).
identity_notes: Introduced by Qu, Ding, Liu, Liu, Ren, Zhao, Dong, Wu, and Wang (NAACL-HLT 2021, pp. 5835-5847, arXiv:2010.08191). Distinguished from DPR (Karpukhin et al., 2020), which uses single-GPU in-batch negatives and BM25 hard negatives, from ANCE (Xiong et al., 2021), which asynchronously mines top-k dense negatives without cross-encoder denoising (suffering from ~70% false negatives among unannotated top retrieved MS MARCO passages), and from GPL (Wang et al., 2022), which uses synthetic T5 query generation and MarginMSE soft-label distillation for unsupervised target domain adaptation.
aliases:
- RocketQA Dense Passage Retrieval Training
- RocketQA Denoised Hard Negative Pipeline
- RocketQA Multi-Stage Dual-Encoder Training
