claims:
- claim_id: rocketqa-cross-batch-and-denoised-hard-negative-mechanism
  kind: mechanism
  statement: RocketQA shares passage embeddings across A GPUs via a differentiable all-gather operator to expand the negative pool from B - 1 to A*B - 1 negatives per question (e.g., 8 * 512 - 1 = 4095 on MS MARCO), trains a cross-encoder M_C on M_D^(0)'s top-k retrieval distribution, and removes false negatives (which account for ~70% of top unannotated passages retrieved on MS MARCO, including 75% at rank 5 and 52% at rank 10) by retaining only top-retrieved passages with M_C(q, p) < 0.1 as denoised hard negatives and labeling unlabeled queries Q_U with M_C(q, p) > 0.9 as positives.
  evidence:
  - source_id: r750-primary-pdf
    locator: Section 3.3-3.4 (Figures 2-3), Section 4.1.3, & Section 4.2.2 (Figure 5), pp. 4-6, 8
    relation: supports
  - source_id: r750-primary-pdf
    locator: count_negatives_per_question, filter_rocketqa_candidates & main
    relation: supports
- claim_id: rocketqa-msmarco-and-nq-progressive-stage-gains
  kind: scope
  statement: On MS MARCO Passage Ranking, RocketQA's consecutive stages improve Dev MRR@10 from 32.39 (in-batch negatives) to 33.32 (Step 1 cross-batch negatives), whereas un-denoised hard negatives collapse MRR@10 to 26.03; cross-encoder hard-negative denoising (Step 3) raises MRR@10 to 36.38 and cross-encoder data augmentation (Step 4) reaches 37.02 MRR@10 (and 82.7% Recall@20 on Natural Questions).
  evidence:
  - source_id: r750-primary-pdf
    locator: Section 4.2.1 (Table 2) & Section 4.2.2 (Table 3), pp. 7-8
    relation: supports
  - source_id: r750-primary-pdf
    locator: dual_encoder_nll_loss & main
    relation: supports
- claim_id: rocketqa-large-batch-and-sequential-pipeline-limitation
  kind: limitation
  statement: RocketQA requires a costly four-stage sequential training and re-indexing pipeline (three dual-encoder training stages totaling 60 epochs on MS MARCO plus an ERNIE-large cross-encoder training and inference pass over millions of pairs), and increasing the random negative batch size beyond an optimal threshold (e.g., > 4096) degrades optimization performance on fixed-size datasets.
  evidence:
  - source_id: r750-primary-pdf
    locator: Section 3.4, p. 5; Section 4.1.3, pp. 6-7; Section 4.2.2 (Figure 4), p. 8
    relation: supports
