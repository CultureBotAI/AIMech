  relation: supports
claims:
- claim_id: score-and-aggregation
  kind: mechanism
  statement: Let E be a finite set of word pairs with human scores h_e and model weights M_e, and choose
    an integer m with 0<=m<=|E|. Order E by descending M using an explicit tie convention, and set Evoc_m(M,h)=sum_{r=1}^m
    h_{pi_M(r)}. For K topics, Evoc-1 is the unweighted mean of the K separate top-m scores; Evoc-2 is
    the top-m score after averaging their weight vectors over the same judged pairs. The paper derives
    APM weights mainly from edge coefficients, with node-based fallback for insufficient nonzero edges,
    and uses products of topic-word probabilities for independent multinomial topic models. A strictly
    increasing transformation of one weight vector preserves its rank-based score under the same tie handling.
    Separately rescaling topics before their weight vectors are averaged can change Evoc-2 even when every
    individual score and Evoc-1 stays unchanged.
  evidence:
  - source_id: method-source
    locator: Section 4, PDF/printed pp.5-6, Equation (4), ranking invariance, pair weights and topic aggregation
    relation: supports
- claim_id: evaluation-scope
  kind: scope
  statement: The reported evaluation maps human-rated synsets to word/POS entries, averages two directed
    ratings to obtain undirected pair scores, and retains 1646 such entries across 4049 BNC documents.
    Human-scored pairs are split equally between tuning and testing for model selection; this is distinct
    from holding out all test documents from unsupervised fitting. The reported comparisons use m=50,
    selected topic counts and model-specific parameter grids. Those design choices specify this historical
    evaluation and do not establish universal topic coherence, causal relations or performance on unjudged
    word pairs.
  evidence:
  - source_id: method-source
    locator: Sections 4.1-4.2, PDF/printed pp.6-8; Figure 2 and Table 1
    relation: supports
  - source_id: method-supplement
    locator: Appendix C, printed p.11 / supplemental PDF p.2, Table 2; Appendix E, p.13 / PDF p.4, Table
      3
    relation: supports
