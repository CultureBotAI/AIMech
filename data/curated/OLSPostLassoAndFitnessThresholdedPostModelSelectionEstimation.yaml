- claim_id: fitness-thresholded-lasso-binary-search-and-post-thresholded-lasso-tradeoff
  kind: scope
  statement: 'Sections 2.3, 2.5, and 5.2-5.3 (pp. 7-9 and 17-20, Theorems 6-7, Corollary 3, Remarks 5.2-5.3,
    Equations 2.8-2.10, 2.13-2.14, and 5.2-5.4) introduce the data-driven fitness-based threshold t_gamma
    := max{t >= 0 : Q_hat(beta_tilde^t) - Q_hat(beta_hat) <= gamma} for gamma <= 0 (specifically gamma
    = (Q_hat(beta_tilde^0) - Q_hat(beta_hat)) / 2 < 0, Equation 2.14), which is computable exactly by
    binary search over sort{|beta_hat_j| : j in T_hat} in at most ceil(log_2 |T_hat|) OLS solves (p. 9)
    and guarantees that OLS post-fit Lasso obeys Theorem 5''s rate bound with m_hat replaced by the strictly
    smaller or equal false-positive count m_tilde := |T_tilde(t_gamma) \ T| <= m_hat (Theorem 6, Equation
    5.2), outperforming OLS post-Lasso whenever m_tilde = o_P(m_hat) and T subseteq T_tilde wp -> 1 (Remark
    5.2); by contrast, traditional hard thresholding at level t (OLS post-t Lasso, Theorem 7) incurs an
    explicit goodness-of-fit loss gamma_t := ||beta_hat_t - beta_hat||_{2,n} <= t sqrt(phi(m_t) m_t) whenever
    T not subseteq T_tilde(t), requiring t = O(sigma sqrt(log p / n)) (e.g., t = c_tilde lambda / n) to
    preserve the near-oracle rate (Equation 5.4).'
