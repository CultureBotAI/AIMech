id: AIMech:OLSPostLassoAndFitnessThresholdedPostModelSelectionEstimation
name: OLS post-Lasso and fitness-thresholded post-model selection estimation
aliases:
- Gauss-Lasso and OLS Post-Fit Lasso High-Dimensional Sparse Regression
- OLS Post-Model Selection with Sublinear Restricted Sparse Eigenvalue Sparsity Bounds
- Data-Driven Fitness-Thresholded Lasso (fit-Lasso) and Post-Selection Least Squares
concept_kind: mathematical_method
definition: 'OLS post-Lasso and fitness-thresholded post-model selection estimation are a nonasymptotic
  two-step high-dimensional nonparametric regression methodology introduced by Belloni and Chernozhukov
  (2013, Bernoulli 19(2):521-547, arXiv:1001.0188v5, DOI:10.3150/11-BEJ410) that applies ordinary least
  squares (OLS) to the covariate support T_hat(t) := support(beta_hat(t)) selected by a first-step L1-penalized
  Lasso estimator beta_hat in argmin_beta {Q_hat(beta) + (lambda/n)||beta||_1} with data-driven noise-gradient
  quantile penalty lambda = c'' sigma_hat Lambda(1 - alpha | X) (Equation 2.12). Benchmarking against
  the oracle risk minimization program min_{0<=k<=p^n} (c_k^2 + sigma^2 k / n) with oracle target beta_0,
  support T (|T| = s), and approximation error c_s^2 = E_n[(f_. - x_.'' beta_0)^2] (Equations 2.2-2.4),
  Section 3.3 combines empirical presparsity (Lemma 2) with the sublinearity of restricted sparse eigenvalues
  phi(ceil(ell k)) <= ceil(ell) phi(k) (Lemma 3) to prove the sharp false-positive sparsity bound m_hat
  := |T_hat \ T| <= s [min_{m in M} phi(m ^ n)] L_n = O_P(s) (Theorem 3). For any generic first-step selector
  T_hat, Theorem 4 proves via Samorodnitsky-Talagrand empirical process control (Lemmas 4-5) that the
  post-selection OLS estimator beta_tilde in argmin_{beta_{T_hat^c}=0} Q_hat(beta) satisfies ||f_tilde
  - f||_{P_n,2} <= K_varepsilon sigma sqrt((m_hat log p + (m_hat + s) log(e mu(m_hat))) / n) + 3 c_s +
  sqrt((B_n)_+ ^ (C_n)_+) where B_n := Q_hat(beta_hat) - Q_hat(beta_0) and C_n := Q_hat(beta_{0 T_hat})
  - Q_hat(beta_0), establishing that OLS post-Lasso (t = 0) and OLS post-fit Lasso (with data-driven goodness-of-fit
  threshold t_gamma := max{t >= 0 : Q_hat(beta_tilde^t) - Q_hat(beta_hat) <= gamma}, gamma <= 0, Equations
  2.9 and 2.14) achieve the near-oracle rate O_P(sigma sqrt(s log p / n) + c_s) even when model selection
  misses true components (T not subseteq T_hat) and achieve strictly faster rates than Lasso (down to
  the exact oracle rate O_P(sigma sqrt(s/n) + c_s)) when T subseteq T_hat and m_hat = o_P(s) (Theorems
  5-6, Corollaries 2-3).'
identity_notes: Evaluated against all 442 pinned AIO records and 615 maintained curated concepts in AIMech.
  Distinct from AIMech:DoubleDebiasedMachineLearningWithNeymanOrthogonalityAndCrossFitting (Chernozhukov
  et al. 2018) and AIMech:DebiasedLassoWithNodewisePrecisionMatrixRelaxation (van de Geer et al. 2014),
  which construct Neyman-orthogonal scores or one-step nodewise-precision-debiased estimators for asymptotically
  normal confidence intervals of low-dimensional target parameters, whereas the present concept analyzes
  unpenalized second-step OLS refitting on the support T_hat(t) selected by Lasso, thresholded Lasso (t-Lasso),
  or data-driven fitness-thresholded Lasso (fit-Lasso) for full nonparametric regression function estimation
  under the min{(B_n)_+, (C_n)_+} empirical-fit trade-off (Theorem 4) and sublinear restricted sparse
  eigenvalue sparsity bounds (Lemma 3, Theorem 3). Distinct from AIMech:SimultaneousNormalEquationPostSelectionConfidenceRegions
  (Kuchibhotla et al. 2020) and AIMech:UniformInSubmodelDeterministicLinearRegressionAndFunctionalDependenceBounds
  (Kuchibhotla et al. 2021), which provide uniform-over-all-submodels deterministic inequalities and post-selection
  confidence regions rather than two-step Lasso/fit-Lasso selection and OLS refitting.
