- claim_id: generic-post-model-selection-min-fit-loss-bound-and-ols-post-lasso-rates
  kind: mechanism
  statement: Sections 4 and 5.1 and Appendices A.2-A.3 (pp. 14-17 and 23-26, Theorems 4-5, Corollary 2,
    Lemmas 4-5, Remark 5.1, Equations 4.1, 5.1, and A.3-A.8) establish for any first-step model selector
    beta_hat with support T_hat (m_hat = |T_hat \ T|) that the post-selection OLS estimator beta_tilde
    in argmin_{beta_{T_hat^c}=0} Q_hat(beta) satisfies Q_hat(beta_tilde) - Q_hat(beta_0) <= B_n ^ C_n
    where B_n := Q_hat(beta_hat) - Q_hat(beta_0) and C_n := Q_hat(beta_{0 T_hat}) - Q_hat(beta_0) (which
    vanishes identically whenever T subseteq T_hat); combined with the Samorodnitsky-Talagrand uniform
    empirical process maximal inequality over F_m (Lemmas 4-5, Equations A.3-A.6), Theorem 4 proves ||f_tilde
    - f||_{P_n,2} <= K_varepsilon sigma sqrt((m_hat log p + (m_hat + s) log(e mu(m_hat))) / n) + 3 c_s
    + sqrt((B_n)_+ ^ (C_n)_+), and using Lasso optimality B_n <= (lambda/n)(||delta_hat_T||_1 - ||delta_hat_{T^c}||_1)
    <= (lambda sqrt(s) / (n kappa(1))) ||delta_hat||_{2,n} (Equations A.7-A.8), Theorem 5 and Corollary
    2 prove that OLS post-Lasso achieves the near-oracle rate O_P(sigma sqrt(s log p / n) + c_s) even
    when T not subseteq T_hat and strictly improves to O_P(sigma sqrt(o(s) log p / n) + sigma sqrt(s/n)
    + c_s) when m_hat = o_P(s) and T subseteq T_hat wp -> 1 (or the exact oracle rate O_P(sigma sqrt(s/n)
    + c_s) when T = T_hat wp -> 1).
