limitations:
- 'Homoscedastic Gaussian Error Assumption (Condition M) and Restricted Eigenvalue / Restricted Sparse
  Eigenvalue Conditions: The nonasymptotic finite-sample bounds in Theorems 1-7 assume fixed (or conditioned)
  covariates with i.i.d. Gaussian errors epsilon_i ~ N(0, sigma^2) (Condition M, Equation 2.1), restricted
  eigenvalue kappa(c_bar) > 0 (Condition RE(c_bar)), and restricted sparse eigenvalue kappa_tilde(m_hat)
  > 0 (Condition RSE(m_hat)).'
- 'Sensitivity of Traditional Hard Thresholding (OLS Post-t Lasso) to Imperfect Support Selection: Unlike
  OLS post-Lasso and OLS post-fit Lasso, traditional hard thresholding at level t (Theorem 7) can suffer
  degraded convergence rates or inconsistency when true oracle coefficients are not well-separated from
  zero and t is chosen larger than O(sigma sqrt(log p / n)), incurring the extra fit loss gamma_t = ||beta_hat_t
  - beta_hat||_{2,n} <= t sqrt(phi(m_t) m_t) whenever T not subseteq T_tilde(t).'
- 'Primary-Source Typographical Notes in Belloni & Chernozhukov (2013, arXiv:1001.0188v5): Verified five
  self-correcting typographical slips in the primary manuscript: (1) Section 2.3 (p. 7, paragraph below
  Equation 2.10) prints ''thresholded Lassol'' instead of ''thresholded Lasso,''; (2) Lemma 1 (p. 10,
  first display) prints ''||delta||'' in the denominators of the quadratic forms delta'' E[x_tilde x_tilde'']
  delta instead of ''||delta||^2'' (cf. Condition RSE(m) on p. 9); (3) Theorem 4 (p. 15, display 2, bound
  on C_n) prints ''k_hat'' inside log(s choose k_hat) + k_hat log(e mu(0)) without defining k_hat in the
  theorem statement (by Lemma 4(2) just below on p. 15, k_hat := |T \ T_hat| is the number of missed oracle
  components); (4) Remark 5.3 (p. 20, paragraph 2, line 6) refers to ''Lasso''s rate of convergence given
  in Lemma 1'' where it means ''Corollary 1'' (p. 12); and (5) Proof of Theorem 1 (p. 21, display 2) drops
  the factor ''c_bar'' before ''||delta_T||_1'' in the middle inequality of the chain for ||delta_{T^c}||_1
  > 2 c_bar ||delta_T||_1, while the final inequality ''<= (1/2) ||delta_{T^c}||_1 + (c/(c-1))(n/lambda)
  c_s^2'' holds directly from c_bar ||delta_T||_1 < (1/2) ||delta_{T^c}||_1.'
- All 27 pages of the full-text PDF of Belloni & Chernozhukov (2013, Bernoulli 19(2):521-547, arXiv:1001.0188v5)
  were read. Constructed numerical checks in research/discovery/ols-post-lasso-and-fitness-thresholded-model-selection-boundaries.py
  verify (1) Section 2.1 oracle risk minimization and Proof of Theorem 2 Step 2 residual correlation bounds,
  (2) Remark 3.1 / Equation (A.1) Lasso KKT prediction-error lower bound and Lemma 3 restricted sparse
  eigenvalue sublinearity, (3) Theorems 4-5 post-selection fit inequality Q_hat(beta_tilde) - Q_hat(beta_0)
  <= B_n ^ C_n and Equation (A.7) Lasso optimality bound, and (4) Equations (2.9) and (2.14) fitness-thresholded
  Lasso binary search, exact oracle support recovery, Monte Carlo risk ordering, and Theorem 7 thresholding
  loss bound gamma_t <= t sqrt(phi(m_t) m_t).
