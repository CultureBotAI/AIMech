- claim_id: sublinear-restricted-sparse-eigenvalues-and-sharp-lasso-sparsity-bound
  kind: mechanism
  statement: 'Section 3.3 and Appendix A.1 (pp. 13-14 and 22-23, Lemmas 2-3, Theorem 3, Equations 3.3-3.4
    and A.2) bound the number of false-positive covariates m_hat := |T_hat \ T| selected by Lasso: Lemma
    2 proves the empirical presparsity inequality sqrt(m_hat) <= sqrt(s) sqrt(phi(m_hat)) 2 c_bar / kappa(c_bar)
    + 3(c_bar + 1) sqrt(phi(m_hat)) n c_s / lambda (or m_hat <= s phi(m_hat) L_n where L_n = [2 c_bar
    / kappa(c_bar) + 3(c_bar + 1) n c_s / (lambda sqrt(s))]^2, Equation A.2), and combining this with
    the sublinearity property phi(ceil(ell k)) <= ceil(ell) phi(k) for any integer k >= 0 and ell >= 1
    (Lemma 3) and ceil(k) < 2k proves Theorem 3 that m_hat <= s [min_{m in M} phi(m ^ n)] L_n where M
    = {m in N : m > s phi(m ^ n) 2 L_n}, guaranteeing m_hat = O_P(s) even when the full-sample maximum
    eigenvalue phi(n) diverges.'
