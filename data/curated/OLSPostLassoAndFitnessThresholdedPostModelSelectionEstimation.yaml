claims:
- claim_id: oracle-risk-minimization-data-driven-penalty-and-kkt-lower-bound
  kind: mechanism
  statement: Sections 2.1, 2.4, 3.1-3.2 and Appendix A.1 (pp. 4-8, 10-13, and 21-22, Theorems 1-2, Corollary
    1, Remark 3.1, Equations 2.1-2.12, 3.1, and A.1) formulate the nonparametric oracle risk minimization
    program min_{0<=k<=p^n} (c_k^2 + sigma^2 k / n) where c_k^2 := min_{||beta||_0<=k} E_n[(f_. - x_.'
    beta)^2] (Equations 2.2-2.4), proving by optimality of beta_0 that the approximation residual r_.
    = f_. - x_.' beta_0 satisfies E_n[x_{.j} r_.] = 0 for j in T and |E_n[x_{.j} r_.]| <= min{sigma/sqrt(n),
    c_s} for j in T^c (Proof of Theorem 2 Step 2, p. 22); under the data-driven penalty lambda = c' sigma_hat
    Lambda(1 - alpha | X) dominating the score cn||S||_infty = cn||2 E_n[x_. epsilon_.]||_infty (Equations
    2.11-2.12) and restricted eigenvalue RE(c_bar), Theorem 1 proves ||beta_hat - beta_0||_{2,n} <= (1
    + 1/c) lambda sqrt(s) / (n kappa(c_bar)) + 2 c_s while Remark 3.1 and Equation (A.1) prove from the
    Lasso KKT conditions on T_hat that ||f_hat - f||_{P_n,2} >= (1 - 1/c) lambda sqrt(|T_hat|) / (2 n
    sqrt(phi(m_hat))), so Lasso cannot converge faster than sigma sqrt(s log p / n) whenever |T_hat| >=_P
    s (Corollary 1).
