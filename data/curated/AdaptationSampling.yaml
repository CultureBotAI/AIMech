id: AIMech:AdaptationSampling
name: Adaptation sampling
concept_kind: algorithm
aliases: []
definition: An online optimizer-hyperparameter controller that compares sample quality under a current
  and a hypothetical setting, using either fresh evaluations or importance-weighted reuse of existing
  observations, to decide how to adapt the setting.
definition_evidence:
- source_id: schaul2011-thesis
  locator: Section 2.4.4, PDF pp. 48–49 / printed pp. 24–25, direct and virtual adaptation sampling.
  relation: supports
- source_id: wierstra2014
  locator: Section 3.2, PDF pp. 11–13 / printed pp. 959–961, controller definition and NES example.
  relation: supports
claims:
- claim_id: direct-hyperparameter-comparison
  kind: mechanism
  statement: Given an algorithm setting theta, a sampling law pi_theta and a quality measure psi for its
    samples, direct adaptation sampling evaluates fresh samples under a nearby hypothetical setting theta_prime.
    It retains the new setting when the chosen quality comparison indicates sufficient improvement and
    otherwise reverts. The comparison acts at the algorithm-hyperparameter level, with progress over time
    as its motivation; it is not itself the base optimizer’s natural-gradient update. The source gives
    a Mann–Whitney comparison as an example, not a complete universal testing protocol.
  evidence:
  - source_id: schaul2011-thesis
    locator: Section 2.4.4, PDF p. 48 / printed p. 24, direct adaptation sampling and meta-level quality
      comparison.
    relation: supports
  - source_id: wierstra2014
    locator: Section 3.2, PDF p. 11 / printed p. 959, direct procedure and progress-versus-fitness distinction.
    relation: supports
- claim_id: virtual-density-ratio-reuse
  kind: mechanism
  statement: Virtual adaptation sampling reuses samples z_i drawn under pi_theta. It compares their existing
    quality values once with unit weights and once with weights w_i_prime = pi_theta_prime(z_i) / pi_theta(z_i).
    The weights represent the hypothetical law while the observed quality values remain unchanged. This
    can avoid fresh quality evaluations for the comparison, but the two groups reuse the same observations
    and are not independent samples.
  evidence:
  - source_id: schaul2011-thesis
    locator: Section 2.4.4, PDF p. 48 / printed p. 24, two virtual-adaptation bullets.
    relation: supports
  - source_id: wierstra2014
    locator: Section 3.2, PDF p. 11 / printed p. 959, importance ratio and weighted copies of the same
      quality values.
    relation: supports
- claim_id: reported-weighted-rank-comparison
  kind: mechanism
  statement: For quality values s_i and s_j_prime with positive weights w_i and w_j_prime, the thesis
    defines U as the sum of w_i*w_j_prime over pairs with s_i greater than s_j_prime, plus half that product
    for equal values. It sets m = sum_i w_i and m_prime = sum_j w_j_prime, then uses mu = m*m_prime/2
    and variance m*m_prime*(m+m_prime+1)/12 in a normal comparison. These are the source’s reported weighted-statistic
    and approximation formulas. They do not establish nominal independent-sample calibration for the paired,
    importance-weighted virtual mode.
  evidence:
  - source_id: schaul2011-thesis
    locator: Appendix B, PDF p. 121 / printed p. 97, weighted U, weight masses, normal mean/standard deviation
      and directional comparisons; paired reuse in Section 2.4.4, PDF p. 48. The body’s Appendix A pointer
      is incorrect in this copy.
    relation: supports
- claim_id: nes-counterfactual-scale-learning-rate
  kind: mechanism
  statement: In the concrete NES application, the controller adapts the learning rate eta_sigma of the
    global search scale. It forms the hypothetical distribution that would result from the previous optimizer
    state using 1.5 times the current eta_sigma, then weights the current population by the hypothetical-to-actual
    density ratio and compares its fitness ranks with their weighted counterpart. The hypothetical learning-rate
    change is distinct from directly multiplying the current search scale by 1.5 or adapting every optimizer
    block learning rate.
  evidence:
  - source_id: schaul2012
    locator: Section 2.2 and Algorithm 2, PDF p. 2 / printed p. 222, eta_sigma scope, hypothetical distribution
      from theta_(t-1) and density ratios.
    relation: supports
  - source_id: wierstra2014
    locator: Section 3.2, PDF pp. 12–13 / printed pp. 960–961; Algorithm 4 on p. 13, input and hypothetical-update
      lines.
    relation: supports
- claim_id: empirical-increase-or-return-policy
  kind: mechanism
  statement: The described NES policy starts from a conservative initial learning rate. When its improvement
    criterion succeeds, it sets eta_sigma_new = min((1+c_prime)*eta_sigma, 1); otherwise it sets eta_sigma_new
    = (1-c_prime)*eta_sigma + c_prime*eta_sigma_init. The reported defaults are c_prime = 0.1 and rho
    = 1/2 - 1/(3*(d+1)) for search dimension d. These are empirical controller settings, not optimality
    or nominal error-rate guarantees. The unspecified test-return and rank-orientation conventions in
    the displayed pseudocode remain explicit limitations.
  evidence:
  - source_id: schaul2011-thesis
    locator: Section 2.4.4, PDF p. 49 / printed p. 25, hypothetical 1.5 rate, empirical rho, 1.1 increase/cap
      and return toward the initial rate.
    relation: supports
  - source_id: schaul2012
    locator: Section 2.2 and Algorithm 2, PDF p. 2 / printed p. 222; Table 1, PDF p. 3 / printed p. 223.
    relation: supports
- claim_id: modes-and-composition-boundary
  kind: scope
  statement: The source distinguishes direct fresh-evaluation adaptation from virtual reuse and also discusses
    combining reweighted observations with some new hypothetical-law samples of weight one. Fresh sampling
    and reuse are therefore explicit modes, not interchangeable implementations. The 2012 paper calls
    the combination of xNES with the controller xNES-as. That combined optimizer, generic importance sampling,
    importance mixing and the weighted comparison statistic are not exact aliases of the adaptation-sampling
    controller.
  evidence:
  - source_id: schaul2011-thesis
    locator: Section 2.4.4, PDF pp. 48–49 / printed pp. 24–25, direct/virtual distinction and optional
      interpolation using new samples.
    relation: supports
  - source_id: wierstra2014
    locator: Section 3.2, PDF p. 11 / printed p. 959, optional fresh samples accompanying reuse.
    relation: supports
  - source_id: schaul2012
    locator: Section 2.2, PDF p. 2 / printed p. 222, naming of the xNES-as combination.
    relation: supports
