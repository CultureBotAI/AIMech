  rationale: No inspected pinned target supplies a sufficiently informative identity or necessary defining-component
    relation for the general comparison-based controller. Optional learning applications and host-optimizer
    components do not justify forcing a mapping.
  examined_targets:
  - target: AIO:MetaLearning
    rejection_reason: The source uses meta-learning in a broad optimizer-control sense. The pinned target
      specifically concerns metadata about machine-learning experiments; that scope is not inherent to
      this general controller.
  - target: AIO:TrainingStrategy
    rejection_reason: The pinned definition concerns model training and preprocessing. The controller
      can adapt black-box search without training a machine-learning model.
  - target: AIO:MathematicalFunction
    rejection_reason: The pinned definition is broad and is not restricted to scalar functions. Generic
      computational describability supplies no sufficiently informative identity or necessary specific-component
      match for this family of sampling, comparison and controller procedures.
  - target: AIO:ExponentialFunction
    rejection_reason: Scalar exponentiation is a component of a possible underlying NES update, not a
      mandatory defining operation of the general adaptation-sampling controller.
  - target: AIO:ReinforcementLearning
    rejection_reason: A possible policy-search application does not make an environment/reward learning
      interface inherent to the controller.
  - target: AIO:ProbabilisticHiddenLayer
    rejection_reason: Evaluating sampling densities does not supply a predictive category-estimation hidden
      layer.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Coverage and calibration problems are limitations of a comparison, not an identity
      mapping to a bias category.
  - target: AIO:ActiveLearning
    rejection_reason: Extra objective or quality evaluations do not inherently constitute interactive
      labeling or a predictive query-selection task.
  - target: AIO:KnowledgeTransfer
    rejection_reason: Reusing evaluations within a search is not inherently transfer of knowledge between
      entities. The target’s related Adaptation synonym does not establish equivalence.
  - target: AIO:MetaLearningLLM
    rejection_reason: No language model, pretrained prior or few-shot task-adaptation mechanism is required.
  - target: AIO:EvolutionaryLLM
    rejection_reason: No language model is required; the related evolutionary algorithms synonym does
      not identify this controller.
  - target: AIO:RegularizationLayer
    rejection_reason: No layer-specific parameter or activity penalty is required.
  - target: AIO:MachineLearningTask
    rejection_reason: The controller can operate on arbitrary black-box search. Adapting optimizer settings
      does not by itself identify the pinned task of building methods that learn from data.
limitations:
- The weighted normal approximation is not established as calibrated for reused importance-weighted groups.
  In the equal-law case with finite ratios equal to one, both groups contain the same n quality values.
  Pair symmetry, including ties, makes U=n²/2 deterministically, whereas the displayed substituted variance
  is n²*(2*n+1)/12>0 for n>0. This bounded curator derivation refutes that expression as the actual variance
  in this paired case; it is not an author-issued erratum, a general error-rate calculation or a claim
  that every independent direct-sampling test is invalid.
- The thesis Appendix B gives half credit for equal values but displays no tie-adjusted variance. Integer
  weights as repeated observations explain the pair-count identity, not independence or valid variance.
  Adaptive choice of the hypothetical law, repeated comparisons and dependence between the reused groups
  require separate calibration. Empirical rho is not asserted to be a valid nominal significance level.
- The thesis and journal prose attach weights to unchanged quality values. The 2012 Algorithm 2 and 2014
  Algorithm 4 instead write a set containing weight times rank, which must not silently be implemented
  as altered rank values. Their weighted-Mann-Whitney return value and rank/tail convention are not fully
  specified; the threshold branch is not certified as a literal implementation of the thesis’s directional
  normal comparisons. No repaired pseudocode or author-code behavior is claimed.
- Ratios need finite, positive sampling densities at reused observations and defined finite hypothetical
  densities. Representing hypothetical-law expectations also requires suitable proposal coverage and integrability;
  positivity only at observed points does not establish global support coverage or stable weights. Large
  distribution changes can create large as well as small ratios. A weighted finite batch need not reveal
  an improvement, and no automatic effective-sample-size or numerical safeguard is supplied.
- Direct mode spends fresh evaluations, while virtual mode reuses expensive quality observations and still
  needs hypothetical-density evaluation and comparison work. The optional interpolation using fresh samples
  is not required in every mode. No cost-free controller, general variance reduction, monotonic progress,
  convergence, universal noise robustness or benchmark advantage is asserted.
- The concrete NES rule concerns the global-scale learning rate and empirical defaults. It is distinct
  from xNES or SNES themselves, natural-gradient geometry, IGO flow, CMA-ES evolution-path control, Rprop
  gradient-sign updates and population-based model copying. The source’s increase/decrease analogy with
  Rprop does not establish an exact alias. Underlying full-covariance NES formulas are not re-certified
  by this controller description.
- 'Primary reading is limited to the declared methods and context: the thesis Section 2.4.4 and Appendix
  B, journal Section 3.2, and the 2012 Section 2.2/Algorithm 2 and defaults. The thesis body incorrectly
  points to Appendix A; the acquired 134-page author copy places the weighted test in Appendix B, PDF
  p. 121 / printed p. 97. Its cover dates and the separately inspected TUM repository metadata are retained
  without claiming byte equivalence to the repository PDF. The full thesis and empirical figures/tables
  were not audited.'
- The 2012 proceedings paper notes that its use of the known target fitness for restart decisions was
  outside the BBOB guidelines; its numerical comparisons are not imported here. Its initial sandbox DNS
  download failure and separate successful retry remain in the research provenance. An author BibTeX fetch
  was unsupported by the web tool. No author implementation, benchmark, statistical test or calculator
  was executed for this controller assessment.
