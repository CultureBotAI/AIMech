aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The original core algorithm performs approximate inference through the parent, child and
    coparent neighborhoods of a directed acyclic probabilistic model. The pinned BayesianNetwork class
    denotes that model architecture, whereas VMP denotes an inference procedure; this is a direct algorithm-to-model
    relation, not equivalence or an is-a assertion.
limitations:
- The conjugate-exponential core requires a normalizable coordinate distribution, computable current sufficient-statistic
  expectations, fixed model and declared factorization. Sparse graph structure alone does not make all
  moments cheap. No Fisher-covariance inverse is needed for these analytic conjugate updates, even when
  a convenient sufficient-statistic representation is redundant.
- Mean-field restrictions omit dependence between blocks. Initialization, update order and partition can
  affect the result. A curator example p(x,y) proportional to exp(2*x*y) on {-1,+1}^2 has the uniform-product
  exact coordinate fixed point but an indefinite ELBO Hessian with eigenvalues 1 and -3; therefore fixed-point
  convergence is not a universal local-optimality certificate. The source’s stronger local-minimum prose
  is not adopted.
- The Gaussian example’s displayed normalizing constant in Equation 22 uses -log(2*pi) rather than -0.5*log(2*pi);
  the latter is required for absolute evidence although the constant cancels from local parameter updates.
  The source calls Gamma b a scale in one passage, while its displayed density and updates use a rate.
  The record follows the density and states the convention.
- Nonconjugate logistic-bound updates optimize an additional bound, not necessarily the original ELBO.
  Continuous point-mass approximations have singular entropy issues. The gamma-shape sampling extension’s
  unconditional transformed log-concavity claim has a counterexample preserved in the source notes; no
  adaptive-rejection sampler is certified here.
- VIBES is the paper’s historical implementation context. Its code was not downloaded, inspected or executed.
  The Gaussian-mixture demonstration and reported bounds do not establish general accuracy, runtime or
  exact model-selection performance. A positive-parameter Dirichlet mean is not exactly zero merely because
  a component is described as pruned.
- The full 34-page primary paper was read, including all figures, Table 1, Algorithm 1, Appendix A and
  references. The saved rational and analytic examples check message equivalence, uncertainty propagation
  and stationary-point boundaries; no source experiment, fitted posterior or benchmark was reproduced.
  The record remains DRAFT; author self-review is not independent approval.
