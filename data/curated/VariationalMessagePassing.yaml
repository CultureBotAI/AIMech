id: AIMech:VariationalMessagePassing
name: Variational message passing
aliases:
- VMP
concept_kind: algorithm
definition: A variational inference algorithm that organizes conjugate-exponential coordinate updates
  as local messages carrying expected sufficient statistics and natural-parameter contributions through
  a Bayesian network.
identity_notes: 'No normalized identity match across 442 pinned AIO IDs, labels and all scoped synonyms
  and 551 native IDs, names and aliases, including VMP and conjugate spelling variants. Full-checkout
  fixed-string searches included ignored and hidden files in the recovery, old discovery and original
  Documents checkouts, with 58, 0 and 1 matched lines. All 42 distinct contents were read, including the
  complete generated NCVMP search string: matches are the newer nonconjugate algorithm, pending source
  leads and an unrelated word. Assessed all 15 semantic AIO rows and 122 native names/definitions, six
  full annotated AIO CLASS nodes with incident edges/generated YAML and six full native context records.
  VMP supplies graph-local sufficient-statistic message routing and closed conjugate coordinate updates,
  beyond a mean-field family and objective alone. It differs from BBVI stochastic gradients, NCVMP expected-log-gradient
  fixed-point proposals, VEM model-parameter alternation and ICM point-state maximization. This record
  covers the original conjugate-exponential core; auxiliary-bound, sampling and structured extensions
  need their own assumptions. Absence is bounded to the inspected pin and corpus.'
