claims:
- claim_id: method
  kind: mechanism
  statement: Hold all coordinates outside the selected block fixed at their current values. Propose a
    block value from q(new|old,rest), and accept with min(1, pi(new|rest)q(old|new,rest)/(pi(old|rest)q(new|old,rest)))
    where defined; otherwise retain the old block. This is the substitution of the full conditional into
    Tierney’s Metropolis rule. The conditional normalization cancels, so an evaluable joint target ratio
    at the fixed rest can be used. Combine these conditional-invariant transitions, and any exact Gibbs
    steps, by a fixed cycle or fixed-probability mixture. A finite valid transition per selected block
    preserves the joint target without independently resampling that block.
