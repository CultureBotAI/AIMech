name: Metropolis-within-Gibbs sampling
definition: A componentwise Monte Carlo scheme that uses Metropolis–Hastings transitions targeting full
  conditional distributions for one or more coordinate blocks, optionally combined with exact Gibbs updates
  for other blocks.
concept_kind: algorithm
identity_notes: The distinction is between an exact draw from a full conditional and a Markov transition
  that preserves it. The latter can be used within a cycle or fixed mixture of block updates. This record
  does not define every hybrid MCMC composition as Metropolis-within-Gibbs and does not require a nested
  chain to be run to equilibrium at each update. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive full-checkout
  searches found prior discovery leads for Gibbs and slice sampling plus unrelated environment substring
  hits, not existing concept records. Existing HMM/MRF models and general Metropolis–Hastings were inspected
  to distinguish model, general transition and specialized algorithm scope.
limitations:
- The proposal-density ratio is required unless the block proposal is symmetric at the fixed values of
  the other coordinates.
- A rejected proposal leaves the current block unchanged. Repeating until acceptance changes the transition
  unless its effect is separately accounted for.
- A valid conditional kernel need not explore its support well. Joint convergence and mixing require additional
  conditions on the target, proposals and update schedule.
- Fixed mixtures and cycles preserve the target, but Tierney explicitly warns that convergence properties
  of an individual component do not transfer indiscriminately to a cycle.
- History-dependent tuning, stale parallel updates and approximate target evaluations are outside this
  fixed-kernel definition. No optimal number of inner steps is claimed.
