claims:
- claim_id: fish-mask-diagonal-fisher-kl-sensitivity-selection
  kind: mechanism
  statement: FISH Mask approximates parameter importance via the diagonal Fisher information F_hat_theta = (1/N) sum_{i=1}^N E_{y ~ p_theta(y|x_i)}[(grad_theta log p_theta(y|x_i))^2] (or the empirical Fisher using ground-truth labels y_i), which governs the second-order KL divergence E_x[D_KL(p_theta(y|x) || p_{theta+delta}(y|x))] = delta^T F_theta delta + O(delta^3), and selects the fixed subset {theta_i | F_hat_{theta_i} >= sort(F_hat_theta)_k} using as few as N = 32 to 1024 samples before gradient descent begins.
  evidence:
  - source_id: r695-primary-pdf
    locator: Section 2.1-2.2, Equations 1-3, pp. 3-4; Section 4.4.1-4.4.2, Figure 2, pp. 7 & 10
    relation: supports
- claim_id: fish-mask-glue-transfer-distributed-and-checkpoint-efficiency
  kind: application
  statement: "On BERT_LARGE across the GLUE test server, FISH Mask updating only 0.5% of parameters per task achieves an 82.6 average score\u2014matching 100% dense fine-tuning (82.5) and outperforming Diff Pruning at 0.5% (81.5), BitFit at 0.08% (81.2), and a 0.5% Random Mask (76.8)\u2014while reducing ResNet-34 CIFAR-10 checkpoint disk storage by 5x at 10% mask sparsity (93.9% accuracy when refreshed every epoch, matching standard training)."
  evidence:
  - source_id: r695-primary-pdf
    locator: Section 4.1-4.3, Tables 1-2 & Figures 2-3, pp. 6-9
    relation: supports
- claim_id: fish-mask-from-scratch-warmup-and-extreme-sparsity-limitation
  kind: limitation
  statement: When training ResNet-34 from scratch on CIFAR-10, fixing a single FISH Mask across the entire training run without periodic refresh or 5 epochs of dense warmup degrades validation accuracy (e.g., dropping to 78.5% at 0.5% fixed mask sparsity vs. 93.9% standard training), and segmenting the FISH Mask into non-overlapping worker partitions in distributed BERT fine-tuning underperforms sharing a single global FISH Mask across workers.
  evidence:
  - source_id: r695-primary-pdf
    locator: Section 4.2-4.3, Table 2, pp. 8-9; Appendix A, Table 3, p. 14
    relation: supports
