id: AIMech:FISHMask
name: FISH Mask
concept_kind: algorithm
review_status: DRAFT
definition: A sparse gradient-based neural network training and parameter-efficient transfer learning algorithm (Fisher-Induced Sparse uncHanging Mask) that pre-computes a fixed binary parameter mask before training (or at coarse epoch intervals) and updates only the selected k parameters over many subsequent gradient descent iterations. To measure how strongly each parameter theta_i affects the model output distribution p_theta(y|x) under local KL divergence E_x[D_KL(p_theta(y|x) || p_{theta+delta}(y|x))] = delta^T F_theta delta + O(delta^3), FISH Mask estimates the diagonal Fisher information F_hat_theta = (1/N) sum_{i=1}^N E_{y ~ p_theta(y|x_i)} [(grad_theta log p_theta(y|x_i))^2] (or its supervised empirical Fisher variant (1/N) sum_{i=1}^N (grad_theta log p_theta(y_i|x_i))^2) over N examples and constructs the fixed mask {theta_i | F_hat_{theta_i} >= sort(F_hat_theta)_k} corresponding to a target mask sparsity level.
identity_notes: Distinct from Diff Pruning (AIMech:DiffPruning), which optimizes a trainable stretched Hard-Concrete mask over an additive diff vector throughout training at the cost of extra memory and 1.5x-2x slower minibatches, and from BitFit (AIMech:BitFit), which heuristically updates only bias vectors (and cannot be applied to bias-free architectures such as T5). Also distinct from Fisher weight pruning methods, which zero out weights to sparsify the network rather than keeping all pre-trained weights intact while restricting gradient updates to the top-k Fisher coordinates.
aliases:
- Fisher-Induced Sparse uncHanging Mask
- FISH Mask Training
- Fisher-Induced Fixed Sparse Mask
- Top-k Fisher Sparse Update Mask
