claims:
- claim_id: r439-hadamard-rank-multiplication-and-minimal-parameter-propositions
  kind: mechanism
  statement: By Proposition 1, for W_1 = X_1 Y_1^T of rank <= r_1 and W_2 = X_2 Y_2^T of rank <= r_2, the Hadamard product W = W_1 odot W_2 satisfies rank(W) <= r_1 r_2 and achieves full rank min(m, n) whenever r_1 r_2 >= min(m, n); by Proposition 2, for any fixed target rank bound R^2 = r_1 r_2, choosing r_1 = r_2 = R uniquely minimizes the total parameter count to 2 R (m + n), and Proposition 3 extends the same rank bound rank(W^{(1)}) = rank(W^{(2)}) <= R^2 to 4D convolutional tensors with 2 R (O + I + R K_1 K_2) parameters.
  evidence:
  - source_id: r439-primary-pdf
    locator: Section 2.1-2.2 Low-Rank Hadamard Product and Convolutional Extension (Propositions 1, 2, and 3) & Appendix A Proofs
    relation: supports
- claim_id: r439-pfedpara-global-personal-additive-multiplicative-decomposition
  kind: mechanism
  statement: In pFedPara (Section 2.3, Eq. 4), parameterizing each layer as W = W_1 odot (W_2 + 1) = W_1 + W_1 odot W_2 decomposes the weight matrix into an additive global low-rank component W_glo = W_1 (aggregated across clients by the server) and a client-specific residual W_per = W_1 odot W_2 modulated by the local factor W_2, halving communication cost relative to FedPara while preserving rank(W) <= r_1 (r_2 + 1).
  evidence:
  - source_id: r439-primary-pdf
    locator: Section 2.3 Personalized FedPara (pFedPara, Equation 4) & Section 3.3 Personalized FL Evaluation
    relation: supports
- claim_id: r439-bilinear-factor-nonconvexity-and-small-kernel-overhead-limitation
  kind: limitation
  statement: Introduces four-factor multilinear product landscapes during local gradient updates and requires 2 R (O + I + R K_1 K_2) < O I K_1 K_2 (i.e., R <= sqrt(O I / 2)) to achieve parameter savings on convolutional layers.
  evidence:
  - source_id: r439-primary-pdf
    locator: Section 2.1 Property 1 & Section 2.2 Convolutional Layer Extension
    relation: supports
- claim_id: r439-communication-efficient-vgg-resnet-and-lstm-federated-training-application
  kind: application
  statement: Applied to communication-efficient federated training of VGG16, ResNet-18, and LSTM models on CIFAR-10, CIFAR-100, CINIC-10, and Shakespeare under IID and non-IID partitions, reducing communication costs by 3x to 10x at matching or higher accuracy.
  evidence:
  - source_id: r439-primary-pdf
    locator: Section 3 Experiments (Figures 3-6, Tables 1-3)
    relation: supports
