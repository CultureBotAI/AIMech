id: AIMech:FedParaAndPFedParaLowRankHadamardProductParameterization
name: FedPara and pFedPara (Low-Rank Hadamard Product Parameterization for Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A communication-efficient layer parameterization for federated learning and its personalized variant (Hyeon-Woo, Ye-Bin, & Oh 2022, Section 2, Equations 1-4, Propositions 1-3) that expresses each weight matrix W in R^{m x n} as the Hadamard (element-wise) product of two low-rank matrices W = W_1 odot W_2 = (X_1 Y_1^T) odot (X_2 Y_2^T) with X_1 in R^{m x r_1}, Y_1 in R^{n x r_1}, X_2 in R^{m x r_2}, and Y_2 in R^{n x r_2} (and 4D convolutional kernels via Tucker mode-1/mode-2 products W_conv = (T_1 x_1 X_1 x_2 Y_1) odot (T_2 x_1 X_2 x_2 Y_2)), transmitting only the low-rank factors during federated aggregation; in pFedPara (Section 2.3, Equation 4), W = W_1 odot (W_2 + 1) = W_1 odot W_2 + W_1 transfers only the global factor W_1 to the server while keeping W_2 strictly local on each client.
identity_notes: Distinct from PowerSGD (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback, Vogels et al. 2019), which compresses full-model gradients via power-iteration low-rank approximations with error feedback rather than reparameterizing the model weights via an unconstrained-rank Hadamard product of low-rank factors, and from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning, Collins et al. 2021), which splits personalization by network depth (shared body vs local head) rather than intra-layer Hadamard decomposition W_1 odot (W_2 + 1).
aliases:
