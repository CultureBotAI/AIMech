claims:
- claim_id: sparse-means-two-regime-phase-transition-and-power-hotspot
  kind: mechanism
  statement: 'In the two-class sparse Gaussian means model where fraction pi_1 of J hypotheses have known
    negative effect M < 0 and fraction pi_0 = 1 - pi_1 have zero effect (Section 3.2, Proposition 3.1,
    Section 9.1), optimal p-value weights maximizing expected power at level q exhibit a phase transition
    at pi_1 Phi(-|M|/2) = q: when |M| is small enough that pi_1 Phi(-|M|/2) > q, all weight is placed
    on the large effects (w_1 = 1/pi_1, w_0 = 0) with optimal power p^* = pi_1 Phi(Phi^{-1}(q/pi_1) +
    |M|), whereas when |M| is large enough that pi_1 Phi(-|M|/2) <= q, the interior stationary point c_1
    = -|M|/2 of Phi(c - M) - Phi(c) is feasible so w_1 = Phi(-|M|/2)/q < 1/pi_1 and strictly positive
    weight w_0 = (q - pi_1 Phi(-|M|/2)) / (pi_0 q) > 0 is allocated to zero-mean hypotheses because large
    effects are already detected with high probability, yielding a 3-to-4-fold power boost over unweighted
    Bonferroni in the sparse moderate-effect hotspot (Figure 1a).'
  evidence:
  - source_id: dobriban2015-bayesweights-ar5iv
    locator: Section 3.2, lines 198–207, Proposition 3.1, Figure 1(a); Section 9.1, lines 38–48
    relation: supports
  - source_id: dobriban2015-bayesweights-crossref
    locator: Biometrika 102(4):753–766 publication record
    relation: supports
- claim_id: exact-small-q-bayes-weights-and-spjotvoll-convergence
  kind: mechanism
  statement: Under uncertain Gaussian prior effect sizes mu_i ~ N(eta_i, sigma_i^2) with marginal test
    standard deviation gamma_i = sqrt(sigma_i^2 + 1) > 1, each summand w_i -> Phi((Phi^{-1}(q w_i) - eta_i)
    / gamma_i) of the marginal expected discovery objective is non-concave (strictly concave followed
    by strictly convex), yet for any dual multiplier lambda >= 1 the generic Lagrangian term f(c; eta_i,
    gamma_i) = Phi((c - eta_i) / gamma_i) - lambda Phi(c) attains its unique global maximum on R union
    {+infinity} at the smaller quadratic root c_1(eta_i, gamma_i; lambda) = (-eta_i - gamma_i sqrt(eta_i^2
    + 2(gamma_i^2 - 1) log(gamma_i lambda))) / (gamma_i^2 - 1) (Lemma 9.1); consequently, whenever q satisfies
    the mild small-q feasibility condition sum_{i=1}^J Phi(c_1(eta_i, gamma_i; 1)) >= J q (Condition 5,
    Proposition 3.4), the unique root lambda >= 1 solving sum_{i=1}^J Phi(c_1(eta_i, gamma_i; lambda))
    = J q yields the exact global Bayes optimal weights w_i = Phi(c_1(eta_i, gamma_i; lambda)) / q in
    O(J) cost per Newton iteration (Theorem 3.2), and for any eta_i < 0 the Bayes weight converges smoothly
    to the deterministic Spjotvoll weight Phi(eta_i / 2 + log(lambda) / eta_i) / q as sigma_i -> 0+ (Proposition
    3.3, Section 9.3).
  evidence:
  - source_id: dobriban2015-bayesweights-ar5iv
    locator: Section 3.3, lines 208–232, Theorem 3.2, Propositions 3.3–3.4; Section 9.2–9.4, lines 49–81,
      Lemma 9.1
    relation: supports
  - source_id: dobriban2015-bayesweights-abs
    locator: Abstract (Gaussian prior non-convexity and near-exact efficient algorithm)
    relation: supports
- claim_id: infinite-variance-symmetry-breaking-and-general-q-jump-solver
  kind: mechanism
  statement: As all prior standard errors sigma_i -> infinity (gamma_i -> infinity), non-concavity causes
    a symmetry-breaking phenomenon where assigning maximum weight 1/q to floor(J q) hypotheses (for non-integer
    J q) and distributing the remaining budget equally achieves limiting expected power (J + floor(J q))
    / 2, strictly exceeding the limiting power J / 2 of uniform weighting w_i = 1 (Section 3.3); for general
    q in [0, 1] when Condition (5) fails (lambda in (0, 1)), each Lagrangian summand switches its global
    maximum from c_1(eta_i, gamma_i; lambda) to +infinity (weight 1/q) at a unique threshold k_i = k(eta_i,
    gamma_i) in [l(eta_i, gamma_i), 1] where l(eta_i, gamma_i) = gamma_i^{-1} exp(-eta_i^2 / (2(gamma_i^2
    - 1))) and d(k_i; eta_i, gamma_i) = f(c_1(eta_i, gamma_i; k_i)) - (1 - k_i) = 0 (Lemma 9.2), enabling
    Algorithm 2 to sort the thresholds k_i and binary search in O(J log J) operations to produce weights
    that are globally optimal for a nearby level q* satisfying |q* - q| <= 1/(2J) (Theorem 3.5, Section
    9.5).
  evidence:
  - source_id: dobriban2015-bayesweights-ar5iv
    locator: Section 3.3, lines 223–237, Theorem 3.5; Section 9.5.1–9.5.2, lines 82–131 and 401–420, Lemma
      9.2
    relation: supports
- claim_id: worst-case-maximin-advantage-and-frequentist-type-i-error-validity
  kind: mechanism
  statement: Accounting for prior uncertainty sigma_i > 0 regularizes p-value weights by shrinking extreme
    Spjotvoll weights nonlinearly toward 1, preventing the severe power loss suffered by deterministic
    Spjotvoll weighting when it places zero weight on small prior means under uncertain effect sizes and
    giving Bayes weights a worst-case maximin power/regret advantage across sigma in {0, 1} as well as
    higher reliability than exponential weighting or two-stage top-candidate filtering (Section 4.1–4.2,
    Figures 3–4); furthermore, because the Bayes weights w_i >= 0 depend only on independent prior data
    (such as a prior GWAS with eta_i = (N_i / N_{0i})^{1/2} T_{0i} and sigma_i^2 = phi N_i / N_{0i} in
    iGWAS) and satisfy sum_{i=1}^J w_i <= J, weighted Bonferroni (or weighted Benjamini-Hochberg) retains
    strong frequentist PFER and FWER control at alpha = J q without requiring independence of the current
    test statistics T_i and even if the Gaussian prior or pleiotropy model is completely misspecified
    (Section 3.1, Section 5.2–5.3).
  evidence:
  - source_id: dobriban2015-bayesweights-ar5iv
    locator: Section 3.1, lines 191–193; Section 4.1–4.2, lines 239–254, Figures 3–4; Section 5.1–5.3,
      lines 255–270
    relation: supports
