id: AIMech:BayesOptimalPValueWeightingUnderGaussianPrior
name: Bayes optimal p-value weighting under a Gaussian prior on the effect sizes
aliases:
- Bayes P-Value Weights
- Gaussian-Prior Optimal P-Value Weighting
- Uncertainty-Regularized Spjotvoll P-Value Weighting
- Informed Genome-Wide Association Study Bayes Weighting (iGWAS)
concept_kind: mathematical_method
definition: 'A frequentist multiple hypothesis testing p-value weighting methodology (and informed genome-wide
  association study procedure, iGWAS) introduced by Dobriban, Fortney, Kim, & Owen (2015, Biometrika 102(4):753-766,
  arXiv:1504.02935v1, DOI:10.1093/biomet/asv050) for testing J one-sided Gaussian mean hypotheses H_i:
  mu_i >= 0 against mu_i < 0 using test statistics T_i | mu_i ~ N(mu_i, 1) and one-sided p-values P_i
  = Phi(T_i) at per-test significance level q in [0, 1] (controlling the per-family and family-wise error
  rates strongly at alpha = J q, or false discovery rate via weighted Benjamini-Hochberg) when prior effect-size
  information is uncertain and modeled by independent Gaussian priors mu_i ~ N(eta_i, sigma_i^2). Whereas
  classical Spjotvoll p-value weighting (Spjotvoll 1972; Wasserman & Roeder 2006; Roeder & Wasserman 2009;
  Rubin et al. 2006) assumes exact known effect sizes (sigma_i = 0) and maximizes a strictly concave objective,
  positive prior variance sigma_i > 0 induces marginal test statistics T_i ~ N(eta_i, gamma_i^2) with
  gamma_i = sqrt(sigma_i^2 + 1) > 1, rendering the marginal expected discovery objective sum_{i=1}^J Phi((Phi^{-1}(q
  w_i) - eta_i) / gamma_i) over w_i in [0, 1/q], sum_{i=1}^J w_i = J non-concave (each summand has a concave
  interval followed by a convex interval). Despite this non-concavity, whenever q satisfies the mild small-q
  condition sum_{i=1}^J Phi(c_1(eta_i, gamma_i; 1)) >= J q (Condition 5, Proposition 3.4), the exact global
  Bayes optimal weights take the closed form w_i = Phi(c_1(eta_i, gamma_i; lambda)) / q where c_1(eta_i,
  gamma_i; lambda) = (-eta_i - gamma_i sqrt(eta_i^2 + 2(gamma_i^2 - 1) log(gamma_i lambda))) / (gamma_i^2
  - 1) and lambda >= 1 is the unique dual multiplier found in O(J) cost per Newton step (Theorem 3.2),
  recovering the Spjotvoll weights Phi(eta_i / 2 + log(lambda) / eta_i) / q as sigma_i -> 0+ (Proposition
  3.3); for general q in [0, 1] when lambda in (0, 1), sorting the unique jump-discontinuity thresholds
  k_i = k(eta_i, gamma_i) in [l(eta_i, gamma_i), 1] where each summand''s global maximum jumps from c_1(eta_i,
  gamma_i; k_i) to +infinity (weight 1/q) solves the non-convex problem in O(J log J) steps for a nearby
  level q* with |q* - q| <= 1/(2J) (Theorem 3.5).'
identity_notes: No normalized identity match for Bayes optimal p-value weighting under a Gaussian prior
  on the effect sizes across all 442 pinned AIO records and 590 maintained IDs, names, aliases and scoped
  synonyms. Only frontier reference matches in Round 194 and Round 195 discovery artifacts were found.
  Distinct from AIMech:OptimalMultiWeightedStepUpProcedureForFDRControl (Roquain & van de Wiel 2009),
  which assumes known alternative p-value CDFs F_i with strictly decreasing densities (strictly concave
  F_i) to construct a rejection-proportion-indexed multi-weight function W^*(u) for step-up and step-down
  FDR control, whereas Dobriban, Fortney, Kim, & Owen (2015) model uncertain prior effect sizes mu_i ~
  N(eta_i, sigma_i^2) with gamma_i = sqrt(sigma_i^2 + 1) > 1, proving that prior uncertainty makes the
  static p-value weight optimization non-convex and deriving the exact quadratic-root critical values
  c_1(eta_i, gamma_i; lambda) for lambda >= 1 (Theorem 3.2) and the O(J log J) jump-discontinuity solver
  over k_i in [l(eta_i, gamma_i), 1] for lambda < 1 (Theorem 3.5); and distinct from AIMech:AdaptiveDataDrivenOptimalPValueWeighting
  (Durand 2019, ADDOW / crADDOW) and AIMech:CovariatePoweredCrossWeightedMultipleTesting (Ignatiadis &
  Huber 2021, IHW), which estimate data-driven group or covariate weights directly from observed p-values.
