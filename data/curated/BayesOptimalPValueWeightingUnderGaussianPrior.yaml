aio_mappings:
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Bayes optimal p-value weighting allocates per-hypothesis significance thresholds q w_i using
    independent Gaussian prior effect-size distributions while strongly controlling the frequentist family-wise
    error rate or false discovery rate to prevent false-positive multiplicity inflation (AIO:DataDredgingBias).
limitations:
- When the significance level q is large enough that Condition (5) fails (lambda* < 1), the Lagrangian
  sum of weights W(lambda) has jump discontinuities of size (1 - r_i)/q at the thresholds k_i = k(eta_i,
  gamma_i), so an exact dual solution satisfying W(lambda) = J may not exist; in Case 2 of Section 9.5.2,
  Algorithm 2 instead returns weights that are globally optimal for a perturbed level q* within |q* -
  q| <= 1/(2J) (Theorem 3.5).
- Valid frequentist type I error control requires that the prior summary statistics (eta_i, sigma_i) be
  statistically independent of the current study test statistics T_i (for example, shared control cohorts
  across GWAS studies can violate independence, Section 6.2 & Section 10.5), and in pleiotropic GWAS applications
  there is no principled a priori rule for tuning the overdispersion parameter phi without external validation
  data (Section 5.2 & Section 6.5).
- The analytical Bayes weights formula relies on the Gaussian means model T_i | mu_i ~ N(mu_i, 1) with
  Gaussian prior mu_i ~ N(eta_i, sigma_i^2); non-Gaussian likelihoods or order/box constraints on the
  weights require general convex-programming approximations such as Princessp (Dobriban 2017).
- All 762 lines of Dobriban, Fortney, Kim, & Owen (2015, Biometrika 102(4):753-766, arXiv:1504.02935v1,
  DOI:10.1093/biomet/asv050) were read. Constructed numerical checks in research/discovery/bayes-optimal-p-value-weighting-under-gaussian-prior-boundaries.py
  verify (1) Proposition 3.1 sparse-means two-regime phase transition (Regime 2 positive zero-mean weight
  w_0 = 1.001538, p^* = 0.002999 > all-on-M power 0.002, and hotspot power ratio = 3.052 > 3.0), (2) Theorem
  3.2 exact small-q Bayes weights (lambda^* = 6.726987, budget error = 5.329070518200751e-15, global Lagrangian
  optimality = True) and Proposition 3.3 convergence to Spjotvoll weights as sigma -> 0+ (max diff shrinking
  from 0.695122152 at sigma = 1.0 to 1.98e-07 at sigma = 1e-4), (3) Section 3.3 sigma -> infinity symmetry
  breaking (power = 5.99983 vs. uniform 5.00013) and Theorem 3.5 / Lemma 9.2 general-q jump solver (max
  root error = 1.1102230246251565e-16, |q^* - q| = 0.025041 <= 1/(2J) = 0.0625), and (4) Section 4.2 maximin
  advantage over Spjotvoll weights (Bayes worst-case regret = 0.009176 < Spjotvoll regret = 0.026571,
  min relative efficiency = 0.857032 > 0.686113) and exact frequentist FWER control under prior misspecification
  (FWER = 0.0456 <= 0.05).
