definition: A recursive best-first search variant that adds a finite nonnegative epsilon
  tolerance to the competitive expansion threshold, retaining the baseline regeneration
  and backup structure while using additional incumbent stopping conditions when a
  solution-quality certificate is required.
definition_evidence:
- source_id: hatem2015
  locator: Author PDF p.3 / official p.1153, RBFS-epsilon paragraph; baseline Figure
    1 on author p.2 / official p.1152
  relation: supports
concept_kind: algorithm
claims:
- claim_id: additive-threshold-relaxation
  kind: mechanism
  statement: The variant replaces the competitive comparison F(best)<=B in RBFS with
    F(best)<=B+epsilon. Interpreting epsilon as a finite nonnegative cost tolerance
    lets search continue within a subtree beyond the unrelaxed competing bound; this
    changes traversal eligibility rather than the static heuristic formula.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, RBFS-epsilon paragraph; Figure 1 on
      author p.2 / official p.1152
    relation: supports
- claim_id: baseline-regeneration-and-backup
  kind: mechanism
  statement: The proposed change is to the upper-bound comparison of the baseline
    procedure. Conditional inheritance of previously backed-up values, selection of
    the best two children, recursive competition with the alternative branch, and
    return-value backup retain their baseline roles. The explicit empty-successor
    return and finite-F guard remain relevant; the additive relaxation does not replace
    them.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.2 / official p.1152, Figure 1 and explanation; author p.3
      / official p.1153, first variant paragraph
    relation: supports
- claim_id: incumbent-quality-stopping
  kind: scope
  statement: The source requires continued branch-and-bound after finding an incumbent
    when optimality is required, and gives f(goal)<=w*B as a bounded-suboptimal stopping
    condition. Here that certificate is interpreted with a sound uninflated lower
    bound B, w>=1 and h(goal)=0 so f(goal) is the solution cost; the relaxed traversal
    threshold B+epsilon is not substituted for the certificate.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, RBFS-epsilon paragraph and quality
      stopping condition
    relation: supports
- claim_id: parameter-and-overhead-scope
  kind: scope
  statement: The paper identifies the useful epsilon choice as potentially domain-
    or instance-dependent and explicitly says this modification does not improve its
    theoretical O(N^2) total-expansion upper bound. This additive variant is presented
    separately from both the multiplicative kth-root split and the later histogram-controlled
    RBFS_CR method.
  evidence:
  - source_id: hatem2015
    locator: Author PDF p.3 / official p.1153, first two variant paragraphs and RBFS_CR
      subsection
    relation: supports
limitations:
- The variant is specified as a modification of baseline Figure 1, not a complete
  separate executable listing. Root/caller initialization, tie handling, numeric infinities
  and complete incumbent-management conventions require explicit implementation decisions;
  the finite-F guard and empty-successor return must not be silently dropped.
- A first goal reached under an additive relaxed threshold need not be optimal. The
  source’s incumbent certificate requires a sound uninflated competitive lower bound;
  arbitrary weighted or relaxed values cannot be reused as that lower bound without
  justification. An unqualified first-goal or optimality guarantee is not claimed.
- Finite epsilon>=0 is the bounded interpretation used here; negative or infinite
  tolerance behavior is not certified. Epsilon has the units of f and is not itself
  a multiplicative quality factor. At epsilon=0 the upper-bound comparison reduces
  algebraically to the baseline comparison, without proving that all unspecified implementation
  choices coincide.
- No automatic parameter-selection rule or universal reduction in work follows. Larger
  epsilon can change ordering and the quality-stopping work, and the source retains
  an O(N^2) expansion bound. The conditional O(N) histogram-overhead theorem and its
  additional assumptions concern RBFS_CR, not this variant.
- Depth-linear path/sibling storage presumes bounded branching and node data; optional
  transposition tables have separate costs. The source description does not establish
  completeness or termination for arbitrary cyclic, infinite, negative-cost or unsolvable
  graph inputs.
- Reported performance depends on domain, heuristic, implementation and tolerance.
  The square-root puzzle’s epsilon=16 is a particular setting, and Dockyard uses an
  unlimited transposition table. Historical Java/hardware results and the anytime
  RBFS-versus-RBFS_CR curves are not portable speedups or evidence about this variant’s
  total memory; no experiment is reproduced here.
- The author and official 2015 PDFs are two byte artifacts of one work with matching
  normalized page bodies, not independent studies. The later 2024 ILBFS source labels
  an epsilon relaxation RBFS_CR, whereas the defining 2015 source separates them.
  This terminology difference and the retained source/version/code questions do not
  justify merging their identities.
