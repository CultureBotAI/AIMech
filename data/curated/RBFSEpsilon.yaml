identity_notes: 'This record denotes the 2015 additive competitive-threshold RBFS
  variant. A finite nonnegative epsilon changes continuation eligibility relative
  to the alternative-derived bound while retaining the baseline recursive organization.
  Its separately qualified incumbent certificate is not an unqualified first-goal
  guarantee. Ordinary RBFS, histogram-controlled RBFS_CR and the kth-root split are
  distinct procedure scopes; epsilon=0 is an algebraic comparison endpoint, not a
  global alias. The source-local RBFSϵ label is retained, with no generic epsilon-search
  alias. Later 2024 use of RBFS_CR for an epsilon relaxation remains a source terminology
  question. Current insertion context was reconciled at merged commit c222454fe2e2ce2b9be5fd78a01d47e9961d1f26:
  807 native and 442 pinned AIO records, 4,946 identity-field occurrences and 3,781
  normalized values. Four ignored- and hidden-inclusive roots returned 165 matching
  contents / 1,085 occurrences, all byte-identical to the bound prior readings; no
  candidate exact normalized identity collision was found. All 1,249 native and generated
  record files match that evidence. Earlier full 25-node / 92-edge AIO and native-neighbor
  readings are reused with attribution, not claimed as fresh whole-ontology review.
  Source tracking uses existing main 912 while preserving prior IE, main 6/7/822/911
  responsibilities and every historical source question.'
