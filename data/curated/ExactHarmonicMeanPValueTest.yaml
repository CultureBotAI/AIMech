id: AIMech:ExactHarmonicMeanPValueTest
name: Exact harmonic mean p-value combination test
aliases:
- EHMP
- Exact Harmonic Mean P-Value Test
concept_kind: mathematical_method
definition: A statistical p-value combination method that aggregates m hypothesis test p-values p_1, ...,
  p_m in (0, 1] with non-negative weights w_1, ..., w_m summing to 1 via the weighted reciprocal sum T_HMP(p)
  = sum_{j=1}^m w_j / p_j (whose terms X_j = 1 / p_j follow standard Pareto(1, 1) distributions on [1,
  infinity) under Uniform(0, 1)), evaluates the finite-sample null density and cumulative distribution
  function for arbitrary weights using Laplace-transform contour integration expressed via second-order
  exponential integrals (and switches to the unequal-weight Landau domain-of-attraction limit for large
  m), and inverts the test statistic to construct connected, strictly convex confidence regions.
identity_notes: No normalized identity match for the Exact Harmonic Mean P-Value combination test across
  all 442 pinned AIO records and 566 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only frontier-tracking references
  in  the Round 171 discovery report. Distinct from AIMech:HalfCauchyCombinationTest (HCCT), which maps
  p_j to [0, infinity) via tan((1 - p_j) * pi / 2) rather than to [1, infinity) via 1 / p_j and uses sine/cosine
  integral Laplace transforms rather than second-order exponential integral Laplace transforms. Distinct
  from the asymptotic equal-weight Harmonic Mean P-Value (HMP) approximation of Good (1958) and Wilson
  (2019), which applies the m -> infinity equal-weight Landau limit without exact finite-m unequal-weight
  Laplace contour integration or convex confidence-region inversion.
