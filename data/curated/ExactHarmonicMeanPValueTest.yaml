- target: AIO:DataDredgingBias
  relation: related_match
  rationale: The exact harmonic mean p-value combination test aggregates multiple (potentially dependent)
    hypothesis test p-values to control global Type I error and mitigate false-positive inflation under
    multiple testing (AIO:DataDredgingBias). AIO:DataDredgingBias denotes the multiple-testing interpretation
    bias rather than the statistical combination method.
limitations:
- Direct evaluation of the second-order exponential integral Ei_2(z) in Theorem A.1 via standard special-function
  routines overflows for large real arguments because Ei(x) grows as exp(x) / x; numerical contour integration
  requires evaluating the exponentially scaled ratio Ei(x) / exp(x) (for example via Ramanujan's series
  expansion).
- Because the individual Pareto(1, 1) terms X_j = 1 / p_j are bounded below by 1 with infinite mean, the
  null distribution of T_HMP(p) shifts upward at rate log m as the number of studies m grows, and applying
  the asymptotic equal-weight Landau approximation of Wilson (2019) at small m or under strongly unequal
  weights distorts finite-sample Type I error.
- Like HCCT, inverting T_HMP(p(theta)) <= c_{m, 1 - alpha} produces an empty confidence set when inter-study
  inconsistency exceeds the critical threshold, and asymptotic tail validity under dependence is guaranteed
  in the extreme right tail (t -> infinity) rather than uniformly at moderate significance levels.
- All 2,200 lines of Liu, Meng, & Pillai (2025, arXiv:2501.01065v1) were read. No author contour-integration
  package or empirical GWAS dataset was executed; constructed numerical checks in research/discovery/exact-harmonic-mean-pvalue-boundaries.py
  verify the exact m = 2 unequal-weight Pareto(1, 1) convolution density/CDF, large-p insensitivity, Example
  1 confidence-interval convexity, and Theorem A.2 Landau location shifts only.
