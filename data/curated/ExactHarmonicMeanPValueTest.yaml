claims:
- claim_id: pareto-reciprocal-statistic-and-laplace-contour-null
  kind: mechanism
  statement: For individual p-values p_j in (0, 1] and non-negative weights w_1, ..., w_m summing to 1,
    EHMP forms T_HMP(p) = sum_{j=1}^m w_j / p_j, where each X_j = 1 / p_j has Pareto(1, 1) density f(x)
    = x^(-2) I_{x >= 1} under Uniform(0, 1), and computes the exact finite-m null density f_{Pareto, w}(x)
    and CDF for arbitrary unequal weights via Laplace-transform contour integration of X_j - 1 expressed
    in terms of the second-order exponential integral Ei_2(z) and Ramanujan's scaled series for Ei(x)
    / exp(x) to avoid numerical overflow.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 2.1, lines 287–289; Section 2.3, lines 305–327; Appendix A, Theorem A.1, lines 1645–1654
    relation: supports
- claim_id: unequal-weight-landau-domain-of-attraction-limit
  kind: mechanism
  statement: For a triangular array of non-negative weights w_j^(m) summing to 1 with max_j w_j^(m) ->
    0 as m -> infinity and i.i.d. Pareto(1, 1) variables X_j, the rescaled and shifted statistic (pi /
    2) * (sum_{j=1}^m w_j^(m) X_j - A_m) converges in distribution to Landau(0, 1) with location shift
    A_m = 1 - gamma - sum_{j=1}^m w_j^(m) log w_j^(m), where gamma is the Euler-Mascheroni constant.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Appendix A, Theorem A.2, lines 1656–1674; Appendix E, Proof of Theorem A.2, lines 2151–2160
    relation: supports
- claim_id: convex-confidence-regions-via-pareto-convexity-dominance
  kind: mechanism
  statement: Because the Pareto(1, 1) convexity transform dominates the standard Half-Cauchy transform
    on (0, 1), each reciprocal p-value term 1 / p_j(theta) for univariate t-tests (k_j >= 1) or multivariate
    Hotelling's T^2 tests (k_j >= d_j + 1) is strictly convex in theta, guaranteeing that inverting T_HMP(p(theta))
    <= c_{m, 1 - alpha} yields a single connected finite interval in R and a bounded convex confidence
    region in R^d whenever the projection row spaces {Row(P_j)} span R^d.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 3.1, lines 374–380; Appendix A, Theorem A.3, lines 1675–1680; Appendix E, Proof of
      Theorem A.3, lines 2161–2165
    relation: supports
- claim_id: large-p-insensitivity-and-tail-resilience-under-dependence
  kind: application
  statement: Because 1 / p_j >= 1 for all p_j in (0, 1] and approaches 1 as p_j -> 1, T_HMP(p) is bounded
    below by 1 and insensitive to large p-values near 1, while belonging to the alpha = 1 Landau domain
    of attraction so that extreme right-tail calibration remains resilient across dependent studies.
  evidence:
  - source_id: liu-meng-pillai2025
    locator: Section 1.2, Table 1, lines 282–283; Section 2.4–2.5, Proposition 2.6, lines 341–368
    relation: supports
