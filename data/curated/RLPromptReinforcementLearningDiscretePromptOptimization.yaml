id: AIMech:RLPromptReinforcementLearningDiscretePromptOptimization
name: RLPrompt Reinforcement Learning Discrete Prompt Optimization
concept_kind: algorithm
review_status: DRAFT
definition: A gradient-free discrete text prompt optimization algorithm that formulates prompt construction z = [z_1, ..., z_T] in V^T as a sequential reinforcement learning problem max_theta R(y_LM(z_hat, x)) with z_hat ~ prod_{t=1}^T pi_theta(z_t | z_{<t}, x), parameterizes the policy pi_theta by inserting a single trainable MLP module into a frozen compact policy language model (such as distilGPT-2), and trains theta via on-policy Soft Q-Learning using input-specific z-score reward normalization z-score(z, x) = (R_x(z) - mean_{z'} R_x(z')) / stdev_{z'} R_x(z') and piecewise margin rewards R(x, c) = lambda_1^{1-Correct} lambda_2^{Correct} Gap_z(c).
identity_notes: Distinct from AutoPrompt (Shin et al., EMNLP 2020, AIMech:AutoPromptGradientGuidedDiscretePromptSearch), which requires white-box gradients from the target LM, from Black-Box Tuning (Sun et al., ICML 2022, AIMech:BBTBlackBoxTuningForLanguageModelAsAService), which optimizes continuous soft prompt embeddings via CMA-ES in a random linear subspace and requires server-side continuous embedding injection, and from heuristic discrete prompt enumeration/editing methods such as GrIPS (Prasad et al., 2022).
aliases:
- RLPrompt
- Reinforcement Learning Discrete Text Prompt Optimization
- Policy-Network Discrete Prompt Optimization with Stabilized Rewards
