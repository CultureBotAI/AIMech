claims:
- claim_id: r726-claim-policy-mlp-and-sql
  kind: mechanism
  statement: Rather than directly editing discrete vocabulary tokens or requiring gradients from the target task LM, RLPrompt inserts a 1-hidden-layer MLP (2048 hidden units, 3.1M parameters or 3.8% of backbone size) into a frozen 82M-parameter distilGPT-2 policy LM, updates only the MLP parameters via on-policy Soft Q-Learning (SQL), and discards the policy network after training to deploy the deterministic greedy discrete prompt.
  evidence:
  - source_id: r726-primary-pdf
    locator: Section 2.2-2.3 & Appendix A.1, Equation 2, Figure 1, pp. 3-4, 15
    relation: supports
- claim_id: r726-claim-zscore-and-piecewise-reward
  kind: mechanism
  statement: To stabilize RL training against input-dependent reward scales and adversarial single-class collapse, RLPrompt normalizes rewards across sampled prompt batches Z(x) per input via z-score(z, x) = (R_x(z) - mean R_x) / stdev R_x and uses a piecewise hinge-like classification reward R(x, c) = lambda_1^{1-Correct} lambda_2^{Correct} (P_z(c) - max_{c' != c} P_z(c')) that multiplies positive margins (Correct = 1) by a larger bonus weight lambda_2 > lambda_1.
  evidence:
  - source_id: r726-primary-pdf
    locator: Section 2.4, Section 3.1, & Section 3.2, Equations 3-4, Figures 3, 5, and 6, pp. 4-8, 15-17
    relation: supports
- claim_id: r726-claim-classification-style-and-cross-lm-transfer
  kind: application
  statement: With only 5 discrete tokens, RLPrompt achieves 75.8% average 16-shot accuracy on RoBERTa-large across 7 classification benchmarks (outperforming Fine-Tuning at 69.5%, Soft Prompt Tuning at 69.2%, Black-Box Tuning at 74.7%, GrIPS at 69.4%, and AutoPrompt at 56.7%), achieves state-of-the-art joint score J(C,S,F) = 61.4 on unsupervised Yelp sentiment style transfer with GPT-2-xl, and discovers gibberish discrete prompts that transfer across different LM families and scales (e.g., from RoBERTa to GPT-2 and from smaller to larger models).
  evidence:
  - source_id: r726-primary-pdf
    locator: Section 3.1-3.3, Tables 2-4, Figures 2 and 4, pp. 5-9
    relation: supports
- claim_id: r726-claim-gibberish-fluency-tradeoff-limitation
  kind: limitation
  statement: Prompts discovered by RLPrompt are typically high-perplexity ungrammatical gibberish (e.g., perplexity 254K on GPT-2), and constraining the policy's action space via top-20 LM probability filtering to enforce human-readable fluency reduces prompt perplexity to 82.1 but degrades Yelp style transfer joint performance J(C,S,F) from 61.4 to 46.7; moreover, RLPrompt lags full-model fine-tuning on many-class tasks with larger total training sets such as 10-class Yahoo and 14-class DBPedia.
  evidence:
  - source_id: r726-primary-pdf
    locator: Section 3.3 & Appendix A.2, Tables 5 and 8, pp. 8, 15-16
    relation: supports
