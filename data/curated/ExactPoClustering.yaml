id: AIMech:ExactPoClustering
name: Exact PoClustering
aliases:
- Maximal-clique PoClustering
concept_kind: algorithm
definition: A dissimilarity-based clustering construction that accumulates maximal cliques of pairwise-distance
  threshold graphs and organizes their sets by inclusion with diameter labels, allowing overlapping clusters
  and multiple parents.
identity_notes: At the start of this three-candidate batch, compared all 442 pinned AIO and 662 native
  IDs, names, aliases and scoped synonyms against OHC, exact PoClustering and the PoClustering edge-clique-cover
  heuristic; no normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the
  recovery, older discovery and original Documents checkouts returned 17, 0, 64 lines for the combined
  candidate terms. All lines were read. Recovery matches are pending discovery/source-reading notes; the
  older checkout has no matches; original-checkout hits are ECC certificate-authority names and eccenca
  namespaces in ignored dependency files, not clustering records. Semantic search including clustering,
  clique, poset, pyramid, fuzzy and DAG terms covered 41 AIO and 225 native definitions. The 41 AIO and
  224 previously read native definitions were unchanged; the new Llama definition and full record were
  read. Eleven complete annotated AIO node/edge/generated contexts and five full native records were assessed.
  Retain exhaustive threshold maximal-clique construction with diameter labels, distinct from PoClustering
  edge-cover pruning, OHC density-tolerance expansion, Llama neighbor unions and SCC weak-component partitions.
definition_evidence:
- source_id: poclustering2006
  locator: Section 3, Definitions 3.1–3.2 and Property 3.1, pp. 3–4; Section 4 and Algorithm 1, p. 4
  relation: supports
claims:
- claim_id: threshold-maximal-cliques
  kind: mechanism
  statement: At each distinct dissimilarity threshold, form the graph whose edges connect pairs at or
    below that value and enumerate its maximal cliques. Accumulate distinct clique sets across thresholds,
    label them by their diameters and order them by inclusion. Maximal means not contained in a larger
    clique at that threshold; it does not mean a single largest clique.
  evidence:
  - source_id: poclustering2006
    locator: Section 3, Definitions 3.1–3.2 and Property 3.1, pp. 3–4; Section 4 and Algorithm 1, p. 4
    relation: supports
  - source_id: poclustering2007
    locator: Sections 3–4, Equation 3.1 and Theorem 4.1, PDF pp. 3–4
    relation: supports
- claim_id: diameter-labelled-representation
  kind: scope
  statement: 'Exact threshold edge coverage supplies a cluster containing each pair at its own dissimilarity
    threshold. Its dissimilarity is therefore recoverable as the minimum diameter among retained clusters
    containing that pair. The diameter labels are essential: scaling every nonzero distance preserves
    the unlabelled inclusion family while changing the numerical distances. The 2007 paper defers its
    broader correspondence-theorem proof to an uninspected technical report.'
  evidence:
  - source_id: poclustering2006
    locator: Section 3, Definitions 3.1–3.2 and Property 3.1, PDF pp. 3–4
    relation: supports
  - source_id: poclustering2007
    locator: Sections 3–4 and Theorem 4.1, PDF pp. 3–4; reference 12, p. 6
    relation: supports
- claim_id: inclusion-and-zero-distance
  kind: limitation
  statement: A smaller cluster diameter does not imply inclusion between arbitrary clusters, despite the
    biconditional wording in the 2007 abstract. The main construction uses inclusion as a separate relation.
    Also, allowing zero dissimilarity between distinct objects conflicts with simultaneously requiring
    every singleton and strictly increasing diameter along inclusion. A positive off-diagonal restriction
    or an explicit treatment of zero-distance equivalence is needed for those additional conditions.
  evidence:
  - source_id: poclustering2006
    locator: Section 3 and Property 3.1, PDF pp. 3–4
    relation: supports
  - source_id: poclustering2007
    locator: Abstract, p. 1; Sections 3–4, pp. 3–4
    relation: supports
- claim_id: exact-versus-heuristic
  kind: scope
  statement: Enumerating all maximal cliques can produce exponentially many sets. The later edge-clique-cover
    heuristic retains a potentially smaller family intended to cover graph edges, rather than enumerating
    every maximal clique. Pairwise-distance information and full cluster-family recovery are different
    requirements, so this exact construction is kept distinct from that heuristic.
  evidence:
  - source_id: poclustering2006
    locator: Sections 3–4, PDF pp. 3–4
    relation: supports
  - source_id: poclustering2007
    locator: Sections 4–5, PDF pp. 4–5
    relation: supports
- claim_id: pseudocode-boundaries
  kind: limitation
  statement: The 2006 printed driver updates a threshold-specific edge set while its loop condition names
    the original edge set, and leaves some initial collections implicit. Its incremental clique-update
    deletion test compares raw intersections with endpoint cliques; without adding the new edge endpoints
    that test does not perform the stated containment pruning. Equal-weight edges also require careful
    threshold-level handling. The mathematical threshold construction is not a certification of that literal
    pseudocode.
  evidence:
  - source_id: poclustering2006
    locator: Algorithms 1–2 and accompanying text, PDF pp. 4–5
    relation: supports
- claim_id: evaluation-scope
  kind: scope
  statement: The 2006 Gene Ontology study derives gene dissimilarities from annotation categories and
    assesses recovery of those categories, rather than independently predicting function from expression
    alone. Its best-match Jaccard score is directional. Table values qualify conflicting prose summaries
    of accuracy and recovery, and they do not establish universal biological or clustering superiority.
  evidence:
  - source_id: poclustering2006
    locator: Section 5, Tables 2–4 and evaluation definitions, PDF pp. 5–6
    relation: supports
