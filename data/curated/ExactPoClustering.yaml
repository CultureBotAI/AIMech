- target: AIO:HierarchicalClustering
  relation: related_match
  rationale: The construction produces a cluster-inclusion partial order that generalizes a tree hierarchy.
    This maps to the related task, not a tree-equivalence or algorithm/task is-a assertion.
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The generic construction groups objects from supplied pairwise dissimilarities; annotation-derived
    evaluation inputs do not make its identity a supervised classifier.
limitations:
- This record covers the exact maximal-clique construction, not the later PoClustering edge-clique-cover
  heuristic or every abstract partially ordered set.
- Numerical distance recovery requires retained diameter information and threshold edge coverage. The
  cited UNC technical report was not located in the bounded search and was not read; no general theorem
  certification is claimed.
- Zero off-diagonal distances, tied thresholds and literal pseudocode require the stated qualifications.
  No unqualified NP-completeness claim is adopted from wording that lacks an explicit decision problem.
- Finite exact examples illustrate representation, scaling, zero-distance and clique-cover boundaries;
  they are not an author implementation or benchmark.
- All six pages of each 2006 and 2007 paper were read, including figures, algorithms, tables and references.
  No author code, datasets or alternative revisions were audited or executed. This record remains DRAFT.
