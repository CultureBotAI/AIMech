id: AIMech:FloraGradientCompression
name: Flora Gradient Compression
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient neural network optimization algorithm that compresses gradient accumulation and momentum states into an O(n r) sublinear space using on-the-fly seed-generated Gaussian random down-projection matrices A_{t,W} ~ N(0, 1/r), decompresses updates directly into the full weight matrix W in R^{n x m}, and periodically resamples the random projection matrix with inter-subspace momentum transfer to achieve high-rank weight updates.
identity_notes: Distinct from standard LoRA (AIMech:LoRA, which maintains two explicit adapter matrices B and A whose total weight change is confined to a fixed rank-r subspace), from federated FLoRA (AIMech:FloraStackingBasedFederatedHeterogeneousLowRankAdaptation, which stacks heterogeneous-rank client LoRA adapters on a federated server), from GaLore (AIMech:GaLoreGradientLowRankProjection, which computes costly singular value decompositions of gradients and stores explicit projection matrices rather than regenerating Gaussian random projections on the fly from scalar random seeds and transferring momentum via M_{t,W} A_{t,W} (A'_W)^T), and from ReLoRA (AIMech:ReLoRA, which requires an initial full-rank warm-start phase and periodic LoRA merge-and-reinit restarts). Formulated by Hao, Cao, and Mou (ICML 2024, PMLR 235:17554-17571, arXiv:2402.03293).
aliases:
- FLORA (From LoRA to High-Rank Updates)
- Flora Resampled Random-Projection Gradient Compression
- Flora Sublinear-Memory Random Projection Optimizer
