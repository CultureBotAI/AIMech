claims:
- claim_id: flora-lora-random-projection-dynamics-theorem
  kind: mechanism
  statement: Flora proves (Theorem 2.1) that under SGD with learning rate eta and bounded cumulative gradient ||sum_{t=0}^T grad_W L_t||_F <= L, LoRA's factors evolve as A_T = A_0 + eta A_0 f_A(T) and B_T = eta f_B(T) A_0^T with ||f_A(t)||_2 <= eta L^2 (1 - (eta^2 L^2)^t) / (1 - eta^2 L^2), so for small eta << 1/L the LoRA update is dominated by random gradient down-projection by A_0^T and up-projection by A_0 satisfying E[A_0^T A_0] = I_m when A_0 ~ N(0, 1/r).
  evidence:
  - source_id: r684-primary-pdf
    locator: Section 2.1-2.3, Theorem 2.1, Observation 2.2, and Theorem 2.4, p. 2-3
    relation: supports
- claim_id: flora-sublinear-accumulation-and-momentum-subspace-transfer
  kind: mechanism
  statement: For each weight matrix W in R^{n x m}, Flora stores only a compressed state C_W or M_{t,W} in R^{n x r} (O(n r) memory) and a scalar random seed s_{t,W} used to regenerate A_{t,W} ~ N_{s_{t,W}}(0, 1/r) in R^{r x m} on the fly; every kappa steps, Flora resamples a new seed s_{t+1,W}, transfers compressed momentum across subspaces via M' <- M_{t,W} A_{t,W} (A'_W)^T, updates M_{t+1,W} <- beta M' + (1 - beta) G_{t,W} (A'_W)^T, and decompresses the high-rank step M_{t+1,W} A'_W directly onto W.
  evidence:
  - source_id: r684-primary-pdf
    locator: 'Section 2.4 Our method: FLORA, Algorithms 1 and 2, p. 4-5'
    relation: supports
- claim_id: flora-transformer-training-and-finetuning-application
  kind: application
  statement: Flora is applied to fine-tuning and training from scratch of T5 (up to 3B), GPT-2 (up to 1.5B), Vision Transformers, and Llama-2 architectures up to 7B on summarization (XSum), translation (IWSLT17), image classification (CIFAR-100), and C4 language modeling, matching full-matrix optimization quality while reducing optimizer state memory overhead by up to 70%.
  evidence:
  - source_id: r684-primary-pdf
    locator: Section 3 Experiments, Tables 1-4 & Appendix C Tables 5-6, p. 5-8, 16-17
    relation: supports
- claim_id: flora-resampling-interval-distortion-and-backprop-activation-memory
  kind: limitation
  statement: Flora compresses only optimizer states (gradient accumulation and momentum) rather than backpropagation activations unless paired with activation checkpointing and layer-by-layer updates, and resampling the random projection matrix too frequently (e.g., kappa = 1) accumulates projection transfer distortion that degrades momentum convergence.
  evidence:
  - source_id: r684-primary-pdf
    locator: Section 2.4 Memory analysis & Section 3.3 The effect of kappa in momentum, Table 3, p. 5, 7-8
    relation: supports
