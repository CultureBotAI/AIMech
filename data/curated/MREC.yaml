id: AIMech:MREC
name: MREC
aliases: []
definition: A recursive heuristic search algorithm that retains an explicit search
  graph within available additional memory, explores unstored successors virtually
  when that storage is unavailable, and backs up remaining-cost estimates between
  bounded recursive passes.
identity_notes: MREC denotes Sen and Bagchi's 1989 recursive best-first memory-controlled
  procedure, with an explicitly stored graph and virtual unstored successors, backed-up
  remaining costs and a separate recursion stack. It is not LIMMARK, REC_A, MA*, A*
  with an OPEN list, learned IDA*IM, or a generic A*/IDA* hybrid title; the zero-additional-graph-memory
  endpoint does not make the complete method an IDA* alias. Preserve the inclusive
  UPDATE recursion test versus the adjacent strict prose comparison; MREC’s early
  goal-found return bypasses the final node-bound backup assignments. The actual cohort
  358 collection at dd7a5a99eb412b5b587efb1e598cbb760a9bba0d contains 1,236 records
  (794 native and 442 pinned AIO), 4,903 identity-field occurrences including local
  IDs and 3,745 normalized values. Candidate IDs, names, aliases and retained source
  spellings have no normalized collision in that inventory. The collection includes
  ignored and hidden files in four-root text searches; semantic raw-search assessment
  is separately attributed. All 1,230 records in the older scientific-research inventory
  retain their bytes; six later additions were read as current definition/identity
  context. The seven normalized matches concern existing A*, IDA*, IDA*IM, beam-stack
  and RBFS-family contexts, not candidate identities. Current memory-search source
  owner 911 is only partially resolved; MA*/MAO* and separate IE owner 912 remain
  pending.
claims:
- claim_id: stored-and-virtual-search
  kind: mechanism
  statement: EXPLORE descends recursively from the start. At an explicit tip it adds
    successors and edges when memory permits; otherwise UPDATE explores successors
    without adding them to the explicit graph. The algorithm uses no OPEN list.
  evidence:
  - source_id: mrec1989
    locator: Section 2, printed pp. 297–298 / PDF pp. 1–2; EXPLORE and UPDATE
    relation: supports
- claim_id: retained-graph-estimates
  kind: mechanism
  statement: EXPAND initializes a newly stored successor estimate with its heuristic
    value and records an edge to that successor; when the successor is already in
    the explicit graph, it adds the edge without creating another stored node. UPDATE
    uses the stored estimate when available and the heuristic estimate otherwise.
  evidence:
  - source_id: mrec1989
    locator: Section 2, printed p. 298 / PDF p. 2; EXPAND and UPDATE pseudocode
    relation: supports
- claim_id: inclusive-recursion-and-backup
  kind: mechanism
  statement: In the printed UPDATE pseudocode, a successor is explored recursively
    when its current estimate plus transition cost is less than or equal to the current
    node bound. The recursive bound is the current bound minus that cost. If no goal
    terminates the traversal early, the returned node bound is the minimum resulting
    successor estimate plus transition cost, and a stored node receives that updated
    bound; the goal-found branch instead records the path and returns before those
    final backup assignments.
  evidence:
  - source_id: mrec1989
    locator: Section 2, printed p. 298 / PDF p. 2; UPDATE pseudocode, inclusive test
      newb + c(n,n_i) <= bnode
    relation: supports
- claim_id: extra-memory-control
  kind: scope
  statement: The parameter M describes storage additional to the implicit recursion
    stack. With no additional graph storage the method operates in the IDA* manner;
    with storage available it retains explicit graph information between recursive
    passes rather than becoming an OPEN-based A* implementation.
  evidence:
  - source_id: mrec1989
    locator: Abstract and Sections 1–2, printed pp. 297–299 / PDF pp. 1–3; property
      1 and property 2
    relation: supports
