id: AIMech:uniCOILUnifiedContextualizedInvertedList
name: uniCOIL Unified Contextualized Inverted List Sparse Retrieval
concept_kind: architecture
review_status: DRAFT
definition: A learned sparse retrieval architecture that extends Contextualized Inverted List (COIL) by reducing the token representation dimension to d = 1 so the Transformer encoder outputs scalar contextualized term weights, applying a ReLU operation on the output term weights to guarantee non-negativity, expanding corpus documents prior to encoding with doc2query-T5 predicted queries to resolve exact-match vocabulary mismatch, and quantizing both document and query term weights into 8-bit integer impact scores that are indexed and evaluated via inner products in unmodified standard inverted indexes such as Lucene/Anserini.
identity_notes: Distinct from COIL (AIMech:COILContextualizedInvertedList), which stores d = 32 real-valued contextualized token vectors requiring custom vector-inverted-list infrastructure (~40 GB index on MS MARCO) and allows negative weights; distinct from DeepCT (AIMech:DeepCTContextAwareTermImportanceEstimationForFirstStageRetrieval), which trains a regression model on pseudo-ground-truth term frequencies without document expansion or query-term weighting and still relies on BM25's IDF/length-normalization formula; and distinct from SPLADE (AIMech:SPLADESparseLexicalAndExpansionModel), which performs end-to-end MLM-logit vocabulary expansion rather than combining d = 1 COIL scalar impact weighting with external doc2query-T5 expansion.
aliases:
- uniCOIL
- Unified Contextualized Inverted List
- uniCOIL Sparse Impact Retrieval
