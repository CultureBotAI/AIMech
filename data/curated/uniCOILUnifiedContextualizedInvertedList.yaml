claims:
- claim_id: unicoil-scalar-relu-projection-and-8bit-impact-quantization
  kind: mechanism
  statement: uniCOIL reduces COIL's token representation dimension from d = 32 to d = 1 to produce scalar term weights, adds a ReLU activation on the output term weights to force non-negative values amenable to inverted-index traversal, and quantizes both document and query term weights into 8-bit integer impact scores (Section 3), compressing the MS MARCO passage index to 1.3 GB in standard Lucene/Anserini compared to ~40 GB for COIL-tok, 26 GB for TCT-ColBERTv2, and 154 GB for ColBERT (Section 4).
  evidence:
  - source_id: r775-primary-pdf
    locator: Section 3 & Section 4, pp. 3-5
    relation: supports
  - source_id: r775-primary-pdf
    locator: unicoil_term_impacts() and inverted_index_impact_score() verification of ReLU clamping and 8-bit quantization
    relation: supports
- claim_id: unicoil-doc2query-t5-expansion-compensating-scalar-degeneration
  kind: mechanism
  statement: "Within the two-component sparse learned retrieval decomposition (expansion model + term weighting model, Section 2), unexpanded uniCOIL achieves 0.315 MRR@10 on MS MARCO Dev (below 32-dimensional COIL-tok's 0.341), but combining uniCOIL with doc2query-T5 document expansion raises MRR@10 to 0.352\u2014surpassing both unexpanded COIL-tok (0.341) and DeepImpact (0.326) without requiring multi-dimensional weight vectors or custom retrieval infrastructure (Section 3, Table 2)."
  evidence:
  - source_id: r775-primary-pdf
    locator: Sections 2-3, Table 2 rows (2a)-(2h), pp. 2-4
    relation: supports
  - source_id: r775-primary-pdf
    locator: main() verification that doc2query-expanded uniCOIL outperforms unexpanded uniCOIL under vocabulary mismatch
    relation: supports
- claim_id: unicoil-tct-colbertv2-dense-sparse-hybrid-fusion-application
  kind: application
  statement: "When top-1000 sparse candidates from doc2query-T5-expanded uniCOIL are fused with top-1000 dense candidates from TCT-ColBERTv2 by normalizing both score distributions into range(0, 1) and computing s_dense + alpha * s_sparse, the hybrid system achieves 0.378 MRR@10 on MS MARCO Passage Dev\u2014matching TCT-ColBERTv2 + DeepImpact (0.378) and outperforming standalone RocketQA (0.370), ColBERT (0.360), and COIL-full (0.355) (Section 3, Table 2 rows (3a)-(4g))."
  evidence:
  - source_id: r775-primary-pdf
    locator: Section 3, Table 2 rows (3a)-(4g), pp. 3-4
    relation: supports
  - source_id: r775-primary-pdf
    locator: minmax_normalize() and hybrid fusion verification
    relation: supports
- claim_id: unicoil-external-expansion-dependency-and-exact-match-limitation
  kind: limitation
  statement: Because uniCOIL's scalar token weighting only assigns impact scores to tokens present in its input text, without an external document-expansion stage (such as doc2query-T5) it remains restricted to exact lexical matching and suffers a 2.6-point MRR@10 drop relative to 32-dimensional COIL-tok (0.315 vs. 0.341, Section 2 & Section 3, Table 2).
  evidence:
  - source_id: r775-primary-pdf
    locator: Section 2 (Expansions for sparse representation) & Section 3, Table 2 rows (2e) & (2g), pp. 2-4
    relation: supports
