claims:
- claim_id: r436-simultaneous-elimination-of-local-variance-and-network-heterogeneity
  kind: mechanism
  statement: Whereas decentralized SGD under constant step size alpha converges only to an error ball proportional to both intra-node sample variance nu^2 and inter-node gradient heterogeneity zeta^2 = (1/n) sum_{i=1}^n ||nabla f_i(x^*)||^2 (Eq. 2), coupling local SAGA/SVRG estimators (which drive intra-node variance to zero as x_i^k -> x^*, Lemmas 3-4) with gradient tracking y_i^k (which preserves bar_y^k = bar_r^k and eliminates zeta^2) achieves exact global Q-linear convergence to x^* without any neighborhood floor (Theorems 1-2).
  evidence:
  - source_id: r436-primary-pdf
    locator: Section I Introduction (Equation 2), Section III Main Results (Theorems 1-2), & Section IV Convergence Analysis (Lemmas 2-4)
    relation: supports
- claim_id: r436-complexity-bounds-and-big-data-network-independent-linear-speedup
  kind: mechanism
  statement: For L-smooth mu-strongly convex functions with condition number Q = L / mu, spectral gap 1 - sigma of W, M = max_i m_i, and m = min_i m_i, GT-SAGA (Theorem 1) achieves epsilon-accuracy in O(max{M, (M/m) Q^2 (1 - sigma)^{-2}} log(1/epsilon)) component gradient evaluations and communication rounds, while GT-SVRG (Theorem 2) with inner loop T = O(Q^2 (1 - sigma)^{-2} log Q) achieves O((M + Q^2 (1 - sigma)^{-2} log Q) log(1/epsilon)) component gradients and O(Q^2 (1 - sigma)^{-2} log Q log(1/epsilon)) communications; in the big-data regime m ~ M >> Q^2 (1 - sigma)^{-2}, both attain network-independent O(M log(1/epsilon)) complexity, yielding an exact 1/n linear speedup over centralized SAGA/SVRG (Remark 1, Table I).
  evidence:
  - source_id: r436-primary-pdf
    locator: Section III Main Results (Theorem 1, Theorem 2, Remark 1, Remark 2, Table I), pp. 6259-6261
    relation: supports
- claim_id: r436-storage-versus-synchronization-tradeoff-limitation
  kind: limitation
  statement: GT-SAGA requires O(p m_i) local memory at each node i to store all m_i component gradients, whereas GT-SVRG avoids O(p m_i) storage (using O(p) memory) but requires synchronized periodic full-batch gradient evaluations nabla f_i(x_i^{t T}) every T iterations (Remark 2).
  evidence:
  - source_id: r436-primary-pdf
    locator: Section III Remark 2 (Comparison between GT-SAGA and GT-SVRG), p. 6260
    relation: supports
- claim_id: r436-decentralized-logistic-regression-on-real-benchmark-datasets-application
  kind: application
  statement: Applied to decentralized l_2-regularized logistic regression across undirected exponential, grid, and random geometric graphs on CIFAR-10, MNIST, a9a, and w8a.
  evidence:
  - source_id: r436-primary-pdf
    locator: Section V Numerical Experiments (Figures 1-5), pp. 6265-6267
    relation: supports
