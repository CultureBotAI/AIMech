    pinned attention-layer concept. This does not identify the whole model with one software layer or
    claim a verified API implementation.
limitations:
- This is the named end-to-end soft-read architecture, distinct from the original Memory Network framework
  and its hard-retrieval MemNN instantiation.
- External memory here is a supplied finite buffer with learned embeddings; no unlimited storage, general
  dynamic write controller or exact reasoning algorithm is established.
- QA and language-model configurations have different queries, tying, encodings, nonlinearities and output
  protocols.
- All nine primary proceedings pages were visually read. Supplement, other versions and author code were
  not inspected. Constructed algebraic examples do not train or replicate a model. DRAFT remains.
