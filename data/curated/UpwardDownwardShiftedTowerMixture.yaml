limitations:
- The maintained scope uses finite strictly positive normalized probabilities and exact paired orders,
  including ties. Zero-current completions, approximate normalization and adaptive ordering are outside
  this scope.
- The source calls this equal mixture UDST. Generic circular shifting, the individual ST/UST/DST/HST/OHST
  policies and arbitrary mixtures of invariant kernels are not exact aliases for this construction.
- Figure 9’s middle caption uses a DST subscript while its reversed construction is identified as UST.
  The paired geometry and Equations 101–104 support the maintained relation. No author-issued correction
  is claimed.
- The exact overlap specification does not certify the printed direct sampler at closed-uniform endpoints
  or floating-point boundaries. Original curator checks and source lineage are retained; author software
  and empirical benchmarks were not executed.
