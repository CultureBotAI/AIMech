aio_mappings:
- target: AIO:FederatedLearning
  relation: broad_match
  rationale: FLAME is a backdoor-resilient federated learning aggregation framework combining dynamic cosine-distance clustering, median-norm clipping, and adaptive Gaussian noise injection.
- target: AIO:Clustering
  relation: related_match
  rationale: FLAME uses HDBSCAN density-based clustering on pairwise cosine distances of client weight vectors to filter out angularly deviating backdoor updates.
limitations:
- Fails when the Poisoned Model Rate reaches or exceeds 50% (PMR >= 50%), because the majority cluster and median clipping norm can be controlled by malicious clients.
- Realizing FLAME privately over Secure Two-Party Computation (STPC) increases server-side computation time by up to three orders of magnitude.
