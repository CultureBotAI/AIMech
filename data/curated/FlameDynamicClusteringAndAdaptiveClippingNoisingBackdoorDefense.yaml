id: AIMech:FlameDynamicClusteringAndAdaptiveClippingNoisingBackdoorDefense
name: FLAME Dynamic Clustering and Adaptive Clipping-Noising Backdoor Defense
concept_kind: algorithm
review_status: DRAFT
definition: A three-stage federated learning backdoor defense framework that (1) computes pairwise cosine distances c_ij = 1 - (W_i . W_j)/(||W_i||_2 ||W_j||_2) across all n client models and applies HDBSCAN density-based clustering with minimum cluster size floor(n/2) + 1 to admit the majority benign cluster while rejecting angularly deviating backdoor outliers, (2) clips admitted model updates W_bl^c = G_{t-1}^* + (W_bl - G_{t-1}^*) * min(1, S_t / e_bl) to the median Euclidean update norm S_t = MEDIAN(e_1, ..., e_n) across all n clients, and (3) injects adaptive Gaussian parameter noise N(0, sigma^2 I) with sigma = lambda * S_t and lambda = (1/varepsilon) * sqrt(2 ln(1.25/delta)) into the averaged model.
identity_notes: Introduced by Nguyen et al. (USENIX Security 2022, pp. 1415-1432, arXiv:2101.02281). Distinct from fixed-two-cluster defenses such as Auror (Shen et al. 2016) and Krum, which fail when an attacker simultaneously injects multiple backdoors or honeypot outliers (pigeonhole principle), and from CRFL (AIMech:CrflCertifiablyRobustFederatedLearningViaParameterClippingAndSmoothing), which clips and perturbs the aggregated global model for randomized parameter smoothing rather than combining HDBSCAN pairwise cosine filtering with median-update-norm adaptive clipping before noise injection.
aliases:
- FLAME Taming Backdoors in Federated Learning
- FLAME Federated Backdoor Defense Framework
- FLAME HDBSCAN Cosine Clustering and Adaptive Clipping-Noising
