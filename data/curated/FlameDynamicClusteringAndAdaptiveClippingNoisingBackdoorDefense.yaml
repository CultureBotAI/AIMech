claims:
- claim_id: c1-mechanism-hdbscan-pairwise-cosine-dynamic-clustering
  kind: mechanism
  statement: FLAME computes the n x n pairwise cosine distance matrix c_ij = 1 - (W_i . W_j)/(||W_i|| ||W_j||) (Eq. 2) and runs HDBSCAN with min_cluster_size = floor(n/2) + 1 and min_samples = 1 to extract the single dense majority cluster (b_1, ..., b_L) while labeling all remaining models as individual outliers, preventing scale-boosted updates from altering angular distances and defeating simultaneous multi-backdoor or honeypot clustering attacks.
  evidence:
  - source_id: r530-primary-pdf
    locator: Section 3 Equation (2), Section 4.3.1, Algorithm 1 Lines 6-7, Figure 5, and Appendix E, pp. 4, 6, 19
    relation: supports
- claim_id: c2-mechanism-median-euclidean-clipping-and-adaptive-dp-noise
  kind: mechanism
  statement: FLAME computes Euclidean distances e_i = ||W_i - G_{t-1}^*||_2 across all n submitted models (including clustering-rejected models), sets the dynamic clipping bound S_t = MEDIAN(e_1, ..., e_n) so that S_t lies within the benign update norm range whenever k < n/2, scales each admitted model via W_bl^c = G_{t-1}^* + (W_bl - G_{t-1}^*) * min(1, S_t / e_bl), and adds Gaussian noise N(0, sigma_G^2 I) with sigma_G = (S_t / varepsilon) * sqrt(2 ln(1.25 / delta)) to the averaged model G_t = (1/L) sum_{l=1}^L W_bl^c.
  evidence:
  - source_id: r530-primary-pdf
    locator: Section 4.3.2, Algorithm 1 Lines 8-14, and Section 5.1 Theorem 1 & Equations (5)-(7), pp. 6-9
    relation: supports
- claim_id: c3-application-backdoor-mitigation-and-stpc-private-aggregation
  kind: application
  statement: FLAME eliminates constrain-and-scale, Distributed Backdoor Attack (DBA), Edge-Case, and PGD backdoors across Reddit LSTM word prediction, CIFAR-10/MNIST/Tiny-ImageNet image classification, and DIoT GRU network intrusion detection with less than 0.4% main-task accuracy drop, and supports Secure Two-Party Computation (STPC) over arithmetic shares between two non-colluding servers.
  evidence:
  - source_id: r530-primary-pdf
    locator: Section 7.1 Tables 3-4 and Section 8 Figure 10, pp. 10-14
    relation: supports
- claim_id: c4-limitation-honest-majority-assumption-and-stpc-overhead
  kind: limitation
  statement: FLAME requires a strict honest majority (Poisoned Model Rate PMR = k/n < 50%) so that the HDBSCAN minimum cluster size floor(n/2) + 1 and the median clipping bound S_t are dominated by benign updates, and its cryptographic STPC realization incurs up to three orders of magnitude server runtime overhead compared to plaintext FLAME.
  evidence:
  - source_id: r530-primary-pdf
    locator: Section 7.3 Figure 7 and Appendix G, pp. 12, 19-20
    relation: supports
