id: AIMech:ElectionCodingForByzantineRobustSignSgd
name: Election Coding for Byzantine-Robust SignSGD with Majority Vote
concept_kind: algorithm
review_status: DRAFT
definition: "A coding-theoretic hierarchical majority-voting framework proposed by Sohn, Han, Choi, and Moon (NeurIPS 2020) that protects 1-bit compressed SignSGD with Majority Vote against b Byzantine workers by redundantly allocating n training data partitions across n workers via a binary allocation matrix G in {0, 1}^{n x n}\u2014constructed either randomly via i.i.d. Bernoulli(p) connections or deterministically via a three-block shifted matrix\u2014so that each worker transmits the local majority bit c_i = maj({m_j}_{j in P_i}) of its assigned partition gradient signs and the master decodes the global majority vote hat{mu} = maj(y_1, ..., y_n)."
identity_notes: 'Distinct from uncoded SignSGD with Majority Vote (AIMech:SignSgdCompressedOptimisationWithMajorityVote, which corresponds to G = I_n with redundancy r = 1 and fails whenever Byzantine flips exceed the margin of the majority vote), from DRACO (AIMech:DracoByzantineResilientDistributedTrainingViaRedundantGradients, which uses cyclic/fractional repetition codes over real-valued full-precision gradients with linear redundancy r = 2b + 1), and from DETOX (AIMech:DetoxRedundancyBasedHierarchicalByzantineRobustGradientAggregation, which combines group majority filtering with full-precision geometric median / Krum aggregation). Election Coding (Sohn et al., NeurIPS 2020 / arXiv:1910.06093, Section 2.2, pp. 3-7) preserves 1-bit worker-to-master and master-to-worker communication while providing two explicit code families: (1) Random Bernoulli Codes where G_{ij} ~ Bern(p) with p = Theta(sqrt(log(n)/n)), achieving vanishing global sign estimation error P(hat{mu} != sign(g)) < 1/Delta (Lemma 1 & Theorem 1) and O(1/sqrt(T)) non-convex convergence (Theorem 2); and (2) Deterministic Algebraic Codes (Algorithm 1, Lemma 2, & Theorem 3) with block structure [I_s, 0; 0, A; 1_{(n-s-L) x n}] where s = (n-1)/2 - b and L = floor((n-(2b+1))/(2(b+1))) + 1, guaranteeing exact majority recovery P(hat{mu} != mu) = 0 under any b < floor(n/2) Byzantine bit-flip attacks.'
aliases:
- Election Coding
- Election-Coded SignSGD-MV
- Bernoulli and Deterministic Election Codes for SignSGD
