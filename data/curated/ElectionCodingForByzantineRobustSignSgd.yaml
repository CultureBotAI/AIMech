claims:
- claim_id: election-coding-hierarchical-majority-encoder-decoder-and-deterministic-allocation-matrix
  kind: mechanism
  statement: 'Given n data partitions with coordinate-wise gradient signs m_j = sign(tilde{g}_j) in {+1, -1} and a binary allocation matrix G in {0, 1}^{n x n}, each worker i computes the local majority bit c_i = E_i(m; G) = maj({m_j}_{j in P_i}) over its assigned partitions P_i = {j : G_{ij} = 1} and transmits y_i in {+1, -1} to the parameter server, which decodes hat{mu} = maj(y_1, ..., y_n) and updates w_{t+1} = w_t - gamma hat{mu}; Algorithm 1 constructs a deterministic matrix G with top-left identity I_s (s = (n-1)/2 - b), L shifted rows of weight 2b+1, and bottom all-ones rows.'
  evidence:
  - source_id: r536-primary-pdf
    locator: Section 2.2, Equation (1), p. 4; Section 4, Algorithm 1 and Figure 3, pp. 6-7
    relation: supports
- claim_id: election-coding-perfect-b-byzantine-tolerance-and-bernoulli-convergence-theorems
  kind: scope
  statement: Lemma 2 and Theorem 3 prove that the deterministic code in Algorithm 1 satisfies the necessary and sufficient condition sum_{v=1}^{floor(n/2)} |S_v(m)| <= floor(n/2) - b for all weight-floor(n/2) vectors m, achieving perfect b-Byzantine tolerance P(hat{mu} != mu) = 0 for 0 < b < floor(n/2) with computational redundancy r = (n + 2b + 1)/2 - (L - 1/2)(n - (2b + 1))/n (Equation 5); for random Bernoulli codes with p = Theta(sqrt(log(n)/n)), Theorems 1 and 2 prove P(hat{mu} != sign(g)) < 1/Delta and non-convex stationarity (1/T) sum_{t=0}^{T-1} E[||g(w_t)||_1] <= O(1/sqrt(T)).
  evidence:
  - source_id: r536-primary-pdf
    locator: Section 3.1-3.2, Lemma 1 & Theorems 1-2, pp. 5-6; Section 4, Lemma 2 & Theorem 3, Equation (5), pp. 6-7
    relation: supports
- claim_id: election-coding-data-replication-and-computational-redundancy-limitation
  kind: limitation
  statement: Election Coding requires replicating data partitions across multiple workers (preventing its direct use when raw local data cannot be shared across nodes) and incurs a computational redundancy factor r = ||G||_0 / n > 1 proportional to the number of partitions assigned per worker.
  evidence:
  - source_id: r536-primary-pdf
    locator: Section 2.2, p. 4; Section 4, Theorem 3, Equation (5), p. 7; Appendix A.4, pp. 10-11
    relation: supports
- claim_id: election-coding-distributed-resnet-and-logistic-regression-application
  kind: application
  statement: Applied to Byzantine-resilient 1-bit distributed training of ResNet-18 and ResNet-50 on CIFAR-10 and high-dimensional logistic regression on the Amazon Employee Access dataset on Amazon EC2 clusters under reverse-sign and directional Byzantine attacks.
  evidence:
  - source_id: r536-primary-pdf
    locator: Section 5.1-5.2, Figures 4-6, pp. 7-9; Appendix A, Table A.1 and Figures A.1-A.4, pp. 10-12
    relation: supports
