claims:
- claim_id: r364-claim-one-sided-and-two-sided-pcps-characterization-and-svd-tightness
  kind: mechanism
  statement: Writing C = A A^T, C_tilde = A_tilde A_tilde^T = C + E, and Y = I - P for any rank-k orthogonal projection P, A_tilde is a one-sided PCPS with error epsilon if E <= 0 and sum_{i=1}^k |lambda_i(E)| <= epsilon*||A_{r\k}||_F^2 (Lemma 5), and a two-sided PCPS if E = E_1 + E_2 + E_3 + E_4 with -epsilon_1 C <= E_1 <= epsilon_1 C, sum_{i=1}^k |lambda_i(E_2)| <= epsilon_2*||A_{r\k}||_F^2, tr(E_2) <= epsilon_2'*||A_{r\k}||_F^2, tr(E_3^T C^+ E_3) <= epsilon_3^2*||A_{r\k}||_F^2, and tr(E_4 C^+ E_4^T) <= epsilon_4^2*||A_{r\k}||_F^2 (Lemma 6); consequently, projecting A onto its top m = ceil(k/epsilon) exact or (1 + epsilon')-approximate right singular vectors yields a one-sided PCPS in dimension d' = ceil(k/epsilon) (Theorems 7-8, and Theorem 9 for general low-rank approximations), which is optimal by a matching simplex-plus-Gaussian-cloud lower bound showing d' >= ceil(k/epsilon) is necessary for SVD reduction (Theorem 21, Appendix A).
  evidence:
  - source_id: r364-primary-pdf
    locator: Section 2.2-3.1, Definitions 1-2 and Lemmas 3-4, pp. 4-7; Section 4.2, Lemmas 5-6, pp. 8-10; Section 5.1-5.3, Theorems 7, 8, and 9, pp. 11-12; Appendix A-B, Theorem 21, pp. 29-34
    relation: supports
- claim_id: r364-claim-spectral-norm-reduction-oblivious-sketching-and-column-selection
  kind: mechanism
  statement: 'Decomposing A = W_1 B + W_2 B via B_1 = Z^T and B_2 = (sqrt(k)/||A_{r\k}||_F)*(A - A Z Z^T) with 1 <= ||B B^T||_2 <= 2 and tr(B B^T) <= 3k reduces two-sided PCPS construction to spectral norm approximation ||B R R^T B^T - B B^T||_2 < epsilon and trace preservation tr(B_2 R R^T B_2^T) - tr(B_2 B_2^T) <= epsilon*k (Lemma 10, Lemma 11); this establishes (1 + epsilon) PCPS guarantees for oblivious random projections (Theorem 12: d'' = O(k/epsilon^2) dense JL, O(k^2/epsilon^2) CountSketch, or O_tilde(k/epsilon^2) OSNAP), non-oblivious random projection AZ onto the row span of RA with d'' = O(k/epsilon) (Theorem 16, Lemmas 17-18), randomized leverage-plus-residual column sampling with d'' = O(k log(k/delta)/epsilon^2) in O(nnz(A) log(d/delta) + k d log(d/delta)) time (Lemma 13, Theorem 14), and deterministic BSS column selection with d'' = O(k/epsilon^2) (Theorem 15).'
  evidence:
  - source_id: r364-primary-pdf
    locator: Section 1.2, Table 1, p. 2; Section 6, Lemma 10, pp. 12-14; Section 7-8, Lemmas 11, 13, 17, and 18, and Theorems 12, 14, 15, and 16, pp. 14-20; Appendix C, Lemma 26 and Theorem 27, pp. 34-36
    relation: supports
- claim_id: r364-claim-sublinear-log-k-dimension-random-projection-for-kmeans
  kind: mechanism
  statement: "For k-means clustering specifically, splitting A = P^* A + (I - P^*)A = B + B_bar where P^* is the optimal k-cluster projection matrix and B has only k distinct rows (the optimal cluster centroids), multiplying by a Johnson-Lindenstrauss matrix R^T with only d' = O(log(k/delta)/epsilon^2) columns\u2014independent of n and d and sublinear in k\u2014simultaneously preserves all pairwise centroid distances (hence ||B - P_tilde B||_F <= (1 + epsilon)*||B R^T - P_tilde B R^T||_F) and the Frobenius norms ||B_bar R^T||_F <= (1 + epsilon)*||B_bar||_F and ||(A - P^* A)R^T||_F <= (1 + epsilon)*||A - P^* A||_F, proving via the triangle inequality (3 + 6*epsilon)*sqrt(gamma) that any gamma-approximate k-means clustering P_tilde of A_tilde = A R^T achieves ||A - P_tilde A||_F^2 <= (9 + epsilon)*gamma*||A - P^* A||_F^2 (Theorem 19)."
  evidence:
  - source_id: r364-primary-pdf
    locator: Section 1.2, Table 1, p. 2; Section 9, Theorem 19 and Eq. (27), pp. 21-22
    relation: supports
