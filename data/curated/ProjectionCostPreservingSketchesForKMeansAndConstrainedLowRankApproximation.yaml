id: AIMech:ProjectionCostPreservingSketchesForKMeansAndConstrainedLowRankApproximation
name: Projection-Cost Preserving Sketches for k-Means Clustering and Constrained Low-Rank Approximation
concept_kind: preprocessing_method
review_status: DRAFT
definition: A Rank-k Projection-Cost Preserving Sketch (PCPS) is a linear dimensionality-reduction sketch A_tilde in R^{n x d'} (with d' << d) of a data matrix A in R^{n x d}, introduced by Cohen, Elder, Musco, Musco, and Persu (2015), such that for all rank-k orthogonal projection matrices P in R^{n x n} simultaneously, there exists a fixed non-negative constant c >= 0 independent of P satisfying (1 - epsilon)*||A - PA||_F^2 <= ||A_tilde - P*A_tilde||_F^2 + c <= (1 + epsilon)*||A - PA||_F^2 (Definition 1, two-sided error) or ||A - PA||_F^2 <= ||A_tilde - P*A_tilde||_F^2 + c <= (1 + epsilon)*||A - PA||_F^2 (Definition 2, one-sided error). Because k-means clustering is equivalent to minimizing ||A - X_C X_C^T A||_F^2 over rank-k cluster indicator projection matrices P = X_C X_C^T, any gamma-approximate solution P_tilde on A_tilde yields a (1 + epsilon)*gamma-approximate solution for A across k-means clustering and general constrained rank-k approximation problems.
identity_notes: Distinct from AIMech:FrequentDirectionsDeterministicMatrixSketching (Round 363), which compresses n rows into ell rows in R^{ell x d} to approximate the row space A^T A in row-update streams, whereas a Projection-Cost Preserving Sketch reduces column dimension from d to d' = O(k/epsilon) or O(k/epsilon^2) in R^{n x d'} so that left rank-k projections P in R^{n x n} (such as k-means cluster indicator projections X_C X_C^T) preserve ||(I - P)A||_F^2 up to a P-independent shift c. Also distinct from AIMech:KMeansPlusPlusSeeding (Round 194), which seeds k-means cluster centers in the ambient dimension d rather than reducing feature dimension d' prior to clustering.
aliases:
- Projection-Cost Preserving Sketch (PCPS)
- Rank-k Projection-Cost Preserving Dimensionality Reduction
- Cohen-Elder-Musco-Musco-Persu k-Means Dimensionality Reduction
