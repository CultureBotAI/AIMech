name: Multiple-try Metropolis within Gibbs
definition: A coordinate-update sampler that applies a multiple-try Metropolis transition to a conditional
  target while holding all other coordinates fixed.
concept_kind: algorithm
identity_notes: This is the MTM-Gibbs construction in Liu–Liang–Wong Section 5.2, a specific multiple-candidate
  Metropolis-within-Gibbs kernel. It need not draw exactly from a full conditional in one update and does
  not replace that conditional with a gridded interpolation. No normalized match was found across all
  442 pinned AIO labels/scoped synonyms and 175 prior native IDs/names/aliases. Full-checkout searches
  included ignored and hidden files in both worktrees; the only text hit was an unrelated installed-package
  checksum substring. Existing general Metropolis-Hastings, Metropolis-within-Gibbs and random-walk records
  were inspected to resolve these specialization boundaries.
limitations:
- This is conditional target invariance, not an exact independent conditional draw or independence of
  successive full states.
- Use the complete backward-reference correction. Keeping only the weighted candidate selection defines
  a different procedure.
- Zero forward total weight is handled by retaining the current coordinate; finite, meaningful target/proposal
  weights are required.
- Support, coordinate scheduling and irreducibility determine whether the full chain can explore the target.
  No benchmark advantage over Gibbs or other conditional kernels is asserted.
