claims:
- claim_id: method
  kind: mechanism
  statement: For a chosen coordinate i, fix x_−i and use the unnormalized scalar target pi_i(z)=pi(x_−i,z).
    Draw k independent yj from T(x_i,·), compute w(yj,x_i)=pi_i(yj)T(yj,x_i)lambda(yj,x_i), and select
    y in proportion to these weights. Draw k−1 reference values from T(y,·), append the old x_i, and accept
    using the forward-to-reference total-weight ratio of MTM. On acceptance replace only coordinate i;
    otherwise keep the full state. T may depend on the fixed remaining coordinates; its forward/reverse
    support and symmetric lambda requirements hold within that conditional update.
  evidence:
