  rationale: No inspected AIO target denotes this complete cardinality-constrained residual search; unconstrained
    partition search and learned-model categories are not equivalent identities.
  examined_targets:
  - target: AIO:GraphLanguageModel
    rejection_reason: Graph-structured language modeling is distinct from arithmetic subpartition manipulation.
  - target: AIO:ReasoningLLM
    rejection_reason: A language model with explicit reasoning is not a number-partitioning algorithm.
  - target: AIO:NeuroSymbolicLLM
    rejection_reason: A neural-symbolic language-model architecture is not this nonlearning search or
      heuristic.
  - target: AIO:MachineLearningTask
    rejection_reason: Balancing a given multiset does not learn a method from data.
  - target: AIO:MathematicalFunction
    rejection_reason: An algorithm evaluating differences and choosing a partition is distinct from the
      mathematical functions it uses.
  - target: AIO:ReinforcementLearning
    rejection_reason: There is no reward-based learned policy or exploration/exploitation learning in
      the curated deterministic procedure.
limitations:
- The source’s named Complete BLDM procedure handles feasible absolute cardinality targets; its fast BLDM
  first-solution guarantee is limited to balanced targets. Bins are interchangeable and the scope is two-way
  partitioning.
- Necessary cardinality bounds do not certify a feasible completion. Signed effective counts, zero-valued
  residuals and original memberships must remain consistent.
- The constructed implementation checks 23 valid targets on eight fixed instances, not all possible inputs.
  Its copying and sorting choices are not assertions about author-code memory or timing.
- All 12 primary preprint pages were read. Author code, later journal versions and empirical performance
  were not inspected or replicated.
