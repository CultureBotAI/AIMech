limitations:
- T-Few is a composite training and prediction recipe. IA3 parameterization, Adafactor optimization, the
  T0 checkpoint and gradient-free in-context learning are distinct identities.
- The documented Banking77 exception must be retained alongside the default objective. The source’s broad
  unchanged-recipe wording does not override its detailed protocol.
- Candidate length normalization alters rankings and training gradients; it does not remove all prompt,
  tokenization, class-count or label-string effects.
- Complete sixteen-page main paper and eight-page supplement visually inspected. All empirical results
  are source reports; no author code, model fitting, paid provider, hardware timing or benchmark replication
  was executed.
