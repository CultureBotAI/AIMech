id: AIMech:TFewFineTuning
name: T-Few Fine-Tuning
aliases:
- T-Few
concept_kind: algorithm
definition: A few-shot classification fine-tuning recipe that adapts a pretrained T0 model through IA3
  activation vectors, multitask pretraining of those vectors and combined language-modeling, unlikelihood
  and length-normalized candidate objectives, with documented task-specific exceptions.
identity_notes: Compared all 442 pinned AIO and 632 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 153, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 40 AIO and 92 native definitions, with every matched definition
  read. 7 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. Retain
  the composite T-Few recipe, separately from IA3 activation scaling, Adafactor optimization, generic
  few-shot fine-tuning, gradient-free in-context learning and a trained T0 checkpoint.
