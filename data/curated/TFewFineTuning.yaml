claims:
- claim_id: adaptation-stages
  kind: mechanism
  statement: The recipe begins with a pretrained T0 backbone, adds IA3 key/value/feedforward scaling vectors
    and pretrains the added vectors on the T0 multitask mixture for 100,000 steps with batch size 16.
    Downstream task adaptation trains the added parameters for 1000 steps with batch size 8 using Adafactor,
    a learning-rate setting of 3e-3, linear decay and 60 warmup steps. The base weights are frozen during
    this parameter-efficient adaptation; the pretrained backbone itself required earlier training.
  evidence:
  - source_id: liu2022ia3
    locator: Sections 3.3–3.5, main PDF pp. 6–7
    relation: supports
- claim_id: token-level-unlikelihood
  kind: mechanism
  statement: The unlikelihood term averages negative log(1-p) over tokens of all incorrect candidate strings,
    with each conditional token probability evaluated under that incorrect string’s preceding tokens and
    the input. It is not negative log of one minus the probability of an entire incorrect sequence. A
    token shared by a correct and an incorrect candidate can receive opposing language-model and unlikelihood
    contributions.
  evidence:
  - source_id: liu2022ia3
    locator: Section 3.2, main PDF p. 5, Equation 1; constructed token/sequence example
    relation: supports
- claim_id: length-normalized-candidate-objective
  kind: mechanism
  statement: For each candidate string, beta is its mean conditional token log probability. A softmax
    over beta scores produces a candidate classification loss for the correct string. Exponentiating beta
    gives a geometric mean of token probabilities, not a normalized whole-sequence probability. The ordinary
    correct-string language-model loss, token unlikelihood loss and length-normalized candidate loss are
    summed with unit coefficients in the stated general recipe.
  evidence:
  - source_id: liu2022ia3
    locator: Section 3.2, main PDF p. 5, Equation 2 and following paragraph; constructed ranking and derivative
      example
    relation: supports
- claim_id: banking77-exception
  kind: limitation
  statement: The supplemental RAFT protocol turns off the unlikelihood term on Banking77 because its 77
    classes cause memory issues. It also includes all labels in that task’s input and replaces periods
    in labels with commas. These documented changes qualify the main paper’s broad description of a recipe
    used without task-specific modifications; an unchanged three-loss recipe for every reported task is
    not supported.
  evidence:
  - source_id: liu2022ia3supp
    locator: Appendix G, supplemental PDF p. 2/printed 18
    relation: supports
- claim_id: evaluation-and-cost-boundaries
  kind: scope
  statement: The recipe was designed using T0-3B and evaluated with a larger T0 backbone on configured
    few-shot classification and RAFT tasks. Comparisons use sampled subsets and prompts; imported GPT-3
    results do not use the same known training examples or the same backbone. Reported aggregate accuracy,
    adaptation FLOPs and historical hardware costs do not imply superiority on every task, universal latency
    savings or current service prices. Generative tasks are identified as future work.
  evidence:
  - source_id: liu2022ia3
    locator: Sections 3.1 and 4–5, main PDF pp. 4–5 and 8–10
    relation: supports
  - source_id: liu2022ia3supp
    locator: Appendices E–G and Tables 8–11, supplemental PDF pp. 2 and 7–8/printed 18 and 23–24
    relation: supports
