claims:
- claim_id: paired-squared-slack-regression
  kind: mechanism
  statement: For m observations and C,mu>0, the displayed formulation minimizes ||w||²+b²+C/(mu*m)*sum_i(xi_i²+xi_i_star²)+2*C*epsilon_bar,
    subject to y_i-f_i<=epsilon_bar+xi_i and f_i-y_i<=epsilon_bar+xi_i_star, where f_i=w^T*phi(x_i)+b.
    The bias is penalized and the paired slack errors are squared. The source displays no nonnegativity
    constraint on the learned epsilon_bar. This formulation is distinct from L1-slack SVR and from a learned-width
    formulation explicitly requiring epsilon_bar>=0.
  evidence:
  - source_id: tsang2006
    locator: Section III-A, printed p1129 / PDF p4, Equations9-15
    relation: supports
  - source_id: tsang2005
    locator: Sections3.1-3.3, PDF pp3-5, Equations6-15 and Property3
    relation: supports
- claim_id: two-copy-simplex-dual-and-recovery
  kind: mechanism
  statement: Let alpha=(lambda,lambda_star)>=0 sum to1 and v=(y,-y). The scaled dual maximizes (2/C)*v^T*alpha-alpha^T*Ktilde*alpha,
    where Ktilde has diagonal blocks K+11^T+(mu*m/C)*I and off-diagonal blocks -(K+11^T). Thus m original
    observations yield2m transformed points. Recover w=C*sum_i(lambda_i-lambda_i_star)*phi(x_i), b=C*sum_i(lambda_i-lambda_i_star),
    xi_i=mu*m*lambda_i, xi_i_star=mu*m*lambda_i_star and epsilon_bar=v^T*alpha-C*alpha^T*Ktilde*alpha.
    The original primal optimum equals C² times this unshifted scaled-dual optimum.
  evidence:
  - source_id: tsang2006
    locator: Section III-A, printed p1129 / PDF p4, Equations9-15
    relation: supports
  - source_id: tsang2006
    locator: Section III-B, printed p1130 / PDF p5; Appendix Property3 proof, printed p1139 / PDF p14
    relation: supports
  - source_id: tsang2005
    locator: Sections3.1-3.3, PDF pp3-5, Equations6-15 and Property3
    relation: supports
- claim_id: core-vector-regression-training
  kind: mechanism
  statement: Choose Delta=(2/C)*v-diag(Ktilde)+eta*1>=0 and apply center-constrained MEB core growth to
    the2m transformed points. Add an outside point, solve the enlarged core problem and recover the regression
    coefficients from its simplex weights. This is the regression-specific application of the generalized
    CVM solver. A selected transformed point, an original observation and a nonzero final regression coefficient
    are different notions; the two copies of an observation can contribute with opposite signs.
  evidence:
  - source_id: tsang2006
    locator: Sections III-A and III-B, printed pp1129-1130 / PDF pp4-5, Equations11-22
    relation: supports
  - source_id: tsang2005
    locator: Sections3.1-3.3, PDF pp3-5, Equations6-15 and Property3
    relation: supports
- claim_id: learned-width-and-loss-interpretation
  kind: limitation
  statement: The missing nonnegative-width constraint is material to interpreting the displayed formulation.
    An exact curator calculation with one zero-feature observation y=0, C=mu=1 gives optimal lambda=lambda_star=1/2,
    w=b=0, xi=xi_star=1/2 and epsilon_bar=-1/2, with primal and scaled-dual value-1/2. The mean paired-slack
    sum equals mu=1, whereas max(|y-f|-epsilon_bar,0)=1/2. Thus the paper’s interpretation of mu as the
    ordinary epsilon-insensitive error needs a nonnegative-width qualification; it is not asserted unconditionally
    here. This result follows from the displayed primal/dual, not from executing historical CVR code.
  evidence:
  - source_id: tsang2006
    locator: Section III-A, printed p1129 / PDF p4, Equations9-15
    relation: supports
  - source_id: tsang2005
    locator: Section3.1, PDF p3; exact curator derivation in research/discovery/generalized-core-vector-boundaries.py
    relation: supports
- claim_id: shifted-scaled-objective-guarantee
  kind: limitation
  statement: With exact core optimization and exhaustive all-point termination, a core radius R gives
    R²<=p_star/C²+eta<=(1+epsilon)²*R² for the original primal optimum p_star. This is a bound on the
    shifted and scaled objective, not a multiplicative bound on p_star alone; p_star can be negative,
    as the exact zero-output example shows. Tolerance is not a test-error bound. Finite inner numerical
    tolerance, sampled searches, kernel costs and total input storage require separate treatment.
  evidence:
  - source_id: tsang2006
    locator: Section III-C Property3, printed p1131 / PDF p6; Appendix proof, printed p1139 / PDF p14
    relation: supports
  - source_id: tsang2005
    locator: Section3.3.1, PDF p5, Property3 and its proof
    relation: supports
- claim_id: version-and-application-boundaries
  kind: scope
  statement: The 2005 ICML CVR paper is an abridged precursor to the 2006 generalized-CVM paper, not a
    separate CVR identity. The earlier paper applies regression fits to implicit surface reconstruction
    using nonzero level sets and multiscale residual fitting. Historical regression comparisons use specified
    datasets, hyperparameter choices, hardware, LIBSVM/SVMlight versions and different loss formulations;
    the 2006 paper notes a change in LIBSVM version. These experiments do not establish universal speed,
    sparsity or prediction superiority. No historical software or benchmark was reproduced.
  evidence:
  - source_id: tsang2006
    locator: Section I ending, printed p1127 / PDF p2; Section V, printed pp1132-1137 / PDF pp7-12, including
      footnote7 on p1132
    relation: supports
  - source_id: tsang2005
    locator: Sections4.1-4.2 and5, PDF pp5-8
    relation: supports
