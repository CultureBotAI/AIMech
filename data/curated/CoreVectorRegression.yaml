id: AIMech:CoreVectorRegression
name: Core vector regression
aliases:
- CVR
concept_kind: algorithm
definition: A support-vector regression training algorithm that approximates a penalized-bias, paired
  squared-slack formulation with a learned unconstrained margin using a center-constrained minimum enclosing
  ball over two transformed points per observation.
identity_notes: This record denotes the CVR formulation and training method introduced by Tsang-Kwok-Lai2005
  and developed by Tsang-Kwok-Zurada2006. It is distinct from the general solver, generic SVR, standard
  nonnegative-width variants, least-squares regression and a fitted model instance. Compared all 442 pinned
  AIO IDs, labels and scoped synonyms with all 515 preceding native IDs, names and aliases. No normalized
  identity collision was found for either candidate. Fixed-string whole-word searches of both checkouts
  included ignored and hidden files, expanded names, CVR/GCVM/CVM acronyms and source identifiers. All
  147 distinct matched-text windows were read; the post-merge repeat has the same distinct windows in
  both checkouts. Hits describe original CVM/BVM, their reviews and unresolved extensions, not an existing
  generalized-CVM or CVR record. All 93 semantic AIO rows were reused after exact equality checks, and
  all 44 native name/definition matches were read. Fifteen annotated AIO CLASS nodes and outgoing edges
  plus 22 contextual YAMLs were inspected or reused after unchanged-byte checks. This assessment is bounded
  to the pinned and maintained corpus.
