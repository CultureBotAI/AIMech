claims:
- claim_id: open-entry-budget
  kind: mechanism
  statement: In the source’s finite uniform alternating game-tree presentation, ITERSSS*
    receives an OPEN-entry budget M with M >= M0, where M0 = ceil(d/2) * (b - 1) +
    1 for a MAX root, depth d and branching factor b. It initializes the root as LIVE
    and INACTIVE with an infinite upper-bound value and SPACE = M - 1.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 1 and Section 2, printed pp. 163–164 / PDF pp. 1–2; inclusive
      M >= M0 premise on printed p. 164
    relation: supports
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* initialization on printed p. 164 / PDF p. 2; first(OPEN,
      FLAG) and phase description on printed p. 165 / PDF p. 3
    relation: supports
- claim_id: flag-restricted-selection
  kind: mechanism
  statement: OPEN entries carry a value h, a LIVE or SOLVED status, and an ACTIVE
    or INACTIVE type. Selection takes the greatest h among entries whose type equals
    FLAG and resolves ties by lexicographically smaller Dewey codes. FLAG begins INACTIVE,
    switches to ACTIVE on a capacity-blocked MAX expansion or absence of an eligible
    entry, and does not switch back.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* initialization on printed p. 164 / PDF p. 2; first(OPEN,
      FLAG) and phase description on printed p. 165 / PDF p. 3
    relation: supports
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* nonterminal LIVE MAX branch, printed p. 164 / PDF
      p. 2
    relation: supports
- claim_id: terminal-and-min-advance
  kind: mechanism
  statement: A selected LIVE terminal is assigned min(h, v), becomes SOLVED and ACTIVE.
    A selected LIVE nonterminal MIN node is replaced by its first child, which inherits
    h, receives LIVE status and takes the current FLAG as its type.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* LIVE terminal, LIVE MIN and SOLVED MAX cases, printed
      pp. 164–165 / PDF pp. 2–3
    relation: supports
- claim_id: capacity-gated-max-expansion
  kind: mechanism
  statement: A selected LIVE nonterminal MAX node is replaced by all b children only
    when SPACE >= b - 1; the children inherit h and FLAG, and SPACE decreases by b
    - 1. Otherwise that node stays in OPEN as INACTIVE and FLAG becomes ACTIVE.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* nonterminal LIVE MAX branch, printed p. 164 / PDF
      p. 2
    relation: supports
- claim_id: solved-max-sibling-progression
  kind: mechanism
  statement: For a selected SOLVED nonroot MAX node, ITERSSS* removes that node and
    passes its h to the next sibling as LIVE and ACTIVE. After the last sibling it
    instead inserts the MIN parent as SOLVED and ACTIVE. The displayed branch explicitly
    excludes the root.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* LIVE terminal, LIVE MIN and SOLVED MAX cases, printed
      pp. 164–165 / PDF pp. 2–3
    relation: supports
- claim_id: solved-min-purge-and-reactivation
  kind: mechanism
  statement: For a selected SOLVED MIN node x, the procedure removes other OPEN entries
    below its parent whose h is no greater than h(x), releasing one entry of SPACE
    per removal. If an inactive entry remains below that parent, it activates one
    at greatest depth and retains x; otherwise it replaces x by the parent as SOLVED
    and ACTIVE with the same h.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, SOLVED MIN branch and inactivesucc helper, printed p. 165
      / PDF p. 3; explanatory paragraph on printed p. 166 / PDF p. 4
    relation: supports
- claim_id: abstract-space-bookkeeping
  kind: mechanism
  statement: 'Under the displayed conceptual replacements, SPACE equals M minus the
    number of OPEN entries: initialization uses one entry, one-for-one replacements
    leave SPACE unchanged, MAX expansion consumes b - 1 entries, and each purge removal
    releases one. This describes the stable OPEN-entry bookkeeping, not a bound on
    total implementation memory.'
  evidence:
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* initialization on printed p. 164 / PDF p. 2; first(OPEN,
      FLAG) and phase description on printed p. 165 / PDF p. 3
    relation: supports
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* LIVE terminal, LIVE MIN and SOLVED MAX cases, printed
      pp. 164–165 / PDF pp. 2–3
    relation: supports
  - source_id: bhattacharya1986
    locator: Section 2, ITERSSS* nonterminal LIVE MAX branch, printed p. 164 / PDF
      p. 2
    relation: supports
  - source_id: bhattacharya1986
    locator: Section 2, SOLVED MIN branch and inactivesucc helper, printed p. 165
      / PDF p. 3; explanatory paragraph on printed p. 166 / PDF p. 4
    relation: supports
- claim_id: source-stated-pruning-scope
  kind: scope
  statement: Using the paper’s solution-tree and fixed-order quantities A_L(x) and
    B(x), Theorem 4.4 states that A_L(x) >= B(x) is sufficient for ITERSSS* not to
    examine x. The paper combines this one-way condition with its specified alpha-beta
    pruning characterization to state inclusion of the terminal nodes examined by
    ITERSSS* within those examined by that comparator.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 4, Definition 4.1 on printed p. 166 / PDF p. 4; Definitions 4.2–4.4,
      Theorems 4.1–4.4 and omitted-proof statement on printed p. 167 / PDF p. 5
    relation: supports
- claim_id: source-stated-sss-endpoint
  kind: scope
  statement: For the presented uniform tree, the paper states that setting M = b^ceil(d/2)
    yields the same operation as SSS*. This is a source-stated sufficient full-memory
    setting for the parameterized procedure, not a claim that it is the smallest budget
    producing a matching terminal count on every instance.
  evidence:
  - source_id: bhattacharya1986
    locator: Section 1, printed p. 163 / PDF p. 1; Example 2.2 and Table 1, printed
      p. 166 / PDF p. 4; Section 5, printed p. 167 / PDF p. 5
    relation: supports
