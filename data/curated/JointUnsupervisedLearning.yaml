name: Joint unsupervised learning of deep representations and image clusters
definition: An image representation and clustering procedure that alternates periods of graph-based agglomerative
  merging with convolutional-network updates from a cluster-derived weighted triplet objective.
concept_kind: algorithm
identity_notes: JULE denotes Yang et al.’s CVPR 2016 joint procedure. It couples a changing image representation
  to an irreversible agglomeration history; it is neither generic hierarchical clustering nor an ordinary
  fixed-label triplet embedding. The published method and its appendix are the authority here; the later
  Torch reimplementation is not treated as the original Caffe experiment code. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 199 preceding native IDs/names/aliases.
  Ignored-inclusive word-delimited searches of both full checkouts found eight prior discovery/review
  references in each. Short acronyms were compared in normalized record identities; broad text searches
  used the full names and longer aliases. Nearest maintained mechanisms and seven exact AIO nodes with
  incident edges were inspected.
limitations:
- Cluster count, graph neighborhood sizes, bandwidth, initialization and unrolling schedule are inputs
  or hyperparameters. Agglomerative merges are irreversible; a later representation update does not undo
  earlier mistaken merges.
- The cluster-to-sample loss reduction and minibatch neighbor restriction are approximations. Its positive
  weight depends on the merge history and is simplified in practice; it is not asserted to be one exact
  generic hinge-triplet objective or an exact gradient through all merge decisions.
- The appendix separates exact linkage from optional faster affinity updates under extra assumptions.
  Similar empirical results do not make those updates algebraically identical.
- The procedure does not certify a global optimum or semantic categories. No implementation, gradient
  or benchmark reproduction was performed; the linked current Torch repository explicitly differs from
  the original Caffe implementation.
