claims:
- claim_id: claim-stochastic-greedy-overlap-probability-and-marginal-gain-lemma
  kind: mechanism
  statement: When sampling s = (n/k) log(1/epsilon) elements uniformly at random from V \ A, the probability that the random sample R intersects the residual optimal set A^* \ A satisfies Pr[R cap (A^* \ A) != empty] >= 1 - exp(-(s/n)|A^* \ A|) >= (1 - exp(-s k / n)) * (|A^* \ A| / k) = (1 - epsilon) * (|A^* \ A| / k) by concavity of 1 - exp(-(s/n)x) on x = |A^* \ A| in [0, k] (Equation 3); since the greedy choice a in R has marginal gain at least that of a uniformly random element of R cap (A^* \ A), the expected single-step gain satisfies E[Delta(a | A)] >= ((1 - epsilon)/k) * sum_{a in A^* \ A} Delta(a | A) (Lemma 2).
  evidence:
  - source_id: r348-primary-pdf
    locator: Appendix 'Analysis', Lemma 2 and Equation 3, p. 5
    relation: supports
  - source_id: r348-arxiv-abs
    locator: 'Abstract: randomized algorithm STOCHASTIC-GREEDY achieving (1 - 1/e - epsilon) approximation in expectation'
    relation: supports
- claim_id: claim-stochastic-greedy-linear-time-approximation-guarantee
  kind: mechanism
  statement: 'For any non-negative monotone submodular function f: 2^V -> R_+, combining Lemma 2 with monotonicity and submodularity (sum_{a in A^* \ A_i} Delta(a | A_i) >= f(A^*) - f(A_i)) yields E[f(A_{i+1}) - f(A_i)] >= ((1 - epsilon)/k) * E[f(A^*) - f(A_i)], which by induction over k steps proves E[f(A_k)] >= (1 - (1 - (1 - epsilon)/k)^k) f(A^*) >= (1 - exp(-(1 - epsilon))) f(A^*) >= (1 - 1/e - epsilon) f(A^*) using at most k * (n/k) log(1/epsilon) = n log(1/epsilon) function evaluations, independent of the cardinality constraint k (Theorem 1).'
  evidence:
  - source_id: r348-primary-pdf
    locator: Section 'STOCHASTIC-GREEDY Algorithm', Algorithm 1 and Theorem 1, p. 3; Appendix 'Analysis', Proof of Theorem 1, p. 5
    relation: supports
  - source_id: r348-metadata-cr
    locator: AAAI 2015 bibliographic record, pp. 1812-1818
    relation: supports
- claim_id: claim-stochastic-greedy-monotonicity-and-cardinality-constraint-scope
  kind: limitation
  statement: The (1 - 1/e - epsilon) approximation proof of Theorem 1 relies critically on monotonicity of f (so that f(A^* union A_i) >= f(A^*) and therefore sum_{a in A^* \ A_i} Delta(a | A_i) >= f(A^*) - f(A_i)) and on a simple cardinality constraint |A| <= k (where any element of R can be added without violating independence constraints), and holds in expectation over the random subsets R rather than deterministically on every sample path.
  evidence:
  - source_id: r348-primary-pdf
    locator: Section 'STOCHASTIC-GREEDY Algorithm', Theorem 1, p. 3; Appendix 'Analysis', Proof of Theorem 1 (submodularity and monotonicity step), p. 5
    relation: supports
