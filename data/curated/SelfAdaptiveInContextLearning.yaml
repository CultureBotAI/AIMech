id: AIMech:SelfAdaptiveInContextLearning
name: Self-Adaptive In-Context Learning
concept_kind: algorithm
review_status: DRAFT
definition: An instance-level two-stage select-then-rank algorithm for in-context learning (TopK+MDL) that first narrows the training pool to a small set of candidate demonstrations for each individual test input using a semantic selection module, and then ranks sampled subsets and permutations of those candidates without a validation set by selecting the organization that minimizes the expected Shannon-Huffman codelength (predictive entropy) of the language model's output label distribution under the Minimum Description Length principle.
identity_notes: Distinct from corpus-level entropy prompt ordering (AIMech:GlobalEAndLocalEEntropyBasedPromptOrdering), which selects a single demonstration permutation for the entire dataset by maximizing predictive entropy over a generated probing set, whereas Self-Adaptive In-Context Learning selects a custom combination and ordering per test instance by minimizing predictive codelength (entropy). Also distinct from single-stage nearest-neighbor selection (AIMech:KATEkNNAugmentedInContextExampleSelection), which fixes a single distance-based ordering without MDL organization ranking.
aliases:
- Self-Adaptive ICL
- TopK+MDL In-Context Example Selection and Ordering
- Minimum Description Length In-Context Example Organization
