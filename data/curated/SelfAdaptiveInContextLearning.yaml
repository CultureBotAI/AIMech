claims:
- claim_id: sicl-two-stage-select-then-rank-mechanism
  kind: mechanism
  statement: To make combinatorial search over in-context example subsets and permutations tractable for each test instance without a validation set, Self-Adaptive ICL first retrieves a small candidate pool (e.g., 30 examples via TopK semantic similarity, Vote-k, or DPP) and then samples a window of candidate k-example organizations for ranking.
  evidence:
  - source_id: r737-primary-pdf
    locator: Section 4.1-4.2 & Section 5.1, pp. 3-5
    relation: supports
- claim_id: sicl-mdl-codelength-minimization-objective
  kind: mechanism
  statement: The ranking stage evaluates each candidate organization c by approximating the Shannon-Huffman codelength required to transmit the test label under the language model's predictive distribution, c* = argmin_{c in C} -sum_{y_i in Y} p(y_i | c, x) log_2 p(y_i | c, x), favoring organizations that produce confident, low-entropy predictions.
  evidence:
  - source_id: r737-primary-pdf
    locator: Section 4.3-4.4, pp. 3-4, Equations 2-5
    relation: supports
- claim_id: sicl-nlu-and-qa-benchmark-application
  kind: application
  statement: Self-Adaptive ICL (TopK+MDL) is applied across eight sentiment, natural language inference, topic classification, and commonsense question answering benchmarks with GPT-2-XL, OPT, BLOOM, and GPT-Neo, achieving a 40% relative accuracy improvement over random in-context prompting and 17% over TopK+LocalE.
  evidence:
  - source_id: r737-primary-pdf
    locator: Section 5.1-5.2, pp. 4-6, Table 1
    relation: supports
  - source_id: r737-metadata-cr
    locator: DBLP bibliographic record Zhiyong Wu et al. ACL 2023
    relation: supports
- claim_id: sicl-multi-window-inference-cost-limitation
  kind: limitation
  statement: Ranking a window of W candidate organizations per test example requires W separate forward inference passes through the language model at test time, creating an explicit trade-off between ranking accuracy and inference latency.
  evidence:
  - source_id: r737-primary-pdf
    locator: Section 6.4 & Section 8, pp. 8-9, Figure 3(c)
    relation: supports
