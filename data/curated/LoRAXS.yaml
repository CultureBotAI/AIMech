id: AIMech:LoRAXS
name: LoRA-XS
concept_kind: algorithm
review_status: DRAFT
definition: An ultra-parameter-efficient low-rank adaptation algorithm that initializes and freezes each module's low-rank projection matrices from the rank-r truncated SVD of the pre-trained weights (A = U_r Sigma_r, B = V_r^T) and optimizes only a small r x r latent matrix R inserted between them (W' = W + U_r Sigma_r R V_r^T), making the trainable parameter count r^2 per module independent of the model's hidden dimensions.
identity_notes: 'Distinct from AIMech:LowRankAdaptation (which trains A in R^{m x r} and B in R^{r x n} requiring (m+n)r parameters per module), AIMech:VeraVectorBasedRandomMatrixAdaptation (which shares frozen random matrices and learns diagonal scaling vectors of size n + r per module that still grow linearly with hidden dimension n), and AIMech:PissaPrincipalSingularValuesAndSingularVectorsAdaptation (which initializes A and B with the top-r SVD of W but updates all (m+n)r entries of A and B during training). LoRA-XS (Low-Rank Adaptation with eXtremely Small number of parameters; Klaudia Balazy, Mohammadreza Banaei, Karl Aberer, & Jacek Tabor, ECAI 2025, arXiv:2405.17604) proves (Section 3.2, Theorem 1 & Appendix B) that for fixed orthonormal U_r, V_r, the mapping p_{U_r, V_r}(X) = U_r (U_r^T X V_r) V_r^T is the Frobenius-orthogonal projection onto the r^2-dimensional subspace S^r_{U_r, V_r} = {U_r R V_r^T : R in R^{r x r}}, and that the top-r SVD factors of W minimize the Frobenius approximation distance under the pre-training gradient alignment assumption W ~ (1/k) sum_i G_i. By freezing A = U_r Sigma_r and B = V_r^T and training only R ~ N(0, sigma^2) in R^{r x r}, LoRA-XS reduces trainable parameters by a factor of 2n/r relative to LoRA and (n+r)/r^2 relative to VeRA while merging into W post-training with zero inference latency.'
aliases:
- Low-Rank Adaptation with Extremely Small Number of Parameters
- Frozen-SVD Latent r-by-r Low-Rank Adaptation
- SVD-Subspace Latent Matrix Low-Rank Adaptation
