claims:
- claim_id: loraxs-frob-orthogonal-projection-and-truncated-svd-optimality
  kind: mechanism
  statement: 'For orthonormal U_r in R^{m x r} and V_r in R^{n x r}, the operator p_{U_r, V_r}(X) = U_r [U_r^T X V_r] V_r^T is an idempotent, self-adjoint Frobenius orthogonal projection onto the r^2-dimensional subspace S^r_{U_r, V_r} = {U_r R V_r^T : R in R^{r x r}}, and by the Eckart-Young-Mirsky theorem the top-r singular vectors of the mean gradient G minimize d(G; S^r_{A, B}) (Theorem 1).'
  evidence:
  - source_id: r676-primary-pdf
    locator: Section 3.2 (Theorem 1, Observation 3.1, Equations 3-4) & Appendix B (Equations 5-6), pp. 3-4, 10
    relation: supports
- claim_id: loraxs-hidden-dimension-independent-r-squared-parameter-scaling
  kind: mechanism
  statement: "By freezing A = U_r Sigma_r and B = V_r^T and optimizing only R in R^{r x r} (initialized as N(0, (10^{-5})^2)), LoRA-XS requires L * q * r^2 trainable parameters across L layers and q modules\u2014independent of hidden dimension n\u2014achieving a 2n/r parameter reduction over LoRA and an (n+r)/r^2 reduction over VeRA with < 1% one-time SVD initialization overhead."
  evidence:
  - source_id: r676-primary-pdf
    locator: Section 3.3 (p. 5) & Appendix C.1-C.3 (Equations 7-12, Tables 5-6, p. 11)
    relation: supports
- claim_id: loraxs-application-glue-commonsense-and-math-reasoning-efficiency
  kind: application
  statement: LoRA-XS outperforms or matches LoRA and VeRA on RoBERTa-large GLUE (88.03 average at rank 16 with 24.6K parameters vs. 87.83 for VeRA with 61K and 87.82 for LoRA with 800K), improves LLaMA2-7B and LLaMA3-8B commonsense reasoning (+2.9% and +4.5% over LoRA while cutting parameters from 56M-57M to 3.67M), and surpasses 168M-200M LoRA on Mistral-7B and Gemma-7B GSM8K using 3.21M-3.67M parameters.
  evidence:
  - source_id: r676-primary-pdf
    locator: Section 4.2-4.3 (Tables 1-3, Figure 1), pp. 2, 6-7
    relation: supports
- claim_id: loraxs-limitation-pretraining-alignment-assumption-and-output-dense-sensitivity
  kind: limitation
  statement: Because LoRA-XS restricts updates to the fixed span of the top-r singular vectors of W, its weight-SVD initialization advantage diminishes on downstream tasks whose gradient distribution diverges from pre-training (such as SST-2 sentiment classification, where random-matrix SVD slightly outperforms SVD of W), and output dense layers suffer larger accuracy drops under small r than self-attention projections.
  evidence:
  - source_id: r676-primary-pdf
    locator: Section 3.2 (p. 4), Section 5 (Table 4, p. 7), Appendix F.2 (Table 11, p. 18) & Appendix G.1 (Table 12, p. 19-20)
    relation: supports
