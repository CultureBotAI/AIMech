claims:
- claim_id: claim-01
  kind: mechanism
  statement: 'Grothendieck''s inequality (Theorem 3.1) guarantees that for any real matrix B in R^{n x n}, the supremum of |<B, X>| over the positive semidefinite polytope M_G = {X >= 0 : |X_{ii}| <= 1} is bounded by K_G ||B||_{infty -> 1} = K_G max_{s, t in {-1,1}^n} |s^T B t| with K_G <= pi/(2 log(1 + sqrt(2))) < 1.783, allowing SDP optimality <A, X_hat> >= <A, X_0> to be converted directly into <E[A], X_0 - X_hat> <= 2 K_G ||A - E[A]||_{infty -> 1} (Lemma 6.1).'
  evidence:
  - source_id: r320-primary-pdf
    locator: Section 3, Theorem 3.1 and Corollary 3.3, pp. 8-9; Section 6.1, Lemma 6.1, p. 15
    relation: supports
  - source_id: r320-metadata-cr
    locator: Bibliographic metadata for Probability Theory and Related Fields 165(3-4):1025-1049
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For general stochastic block models where within-community edge probabilities exceed p_in and between-community probabilities are at most p_out with gap g_min = p_in - p_out > 0, Lemma 6.2 establishes the population curvature <E[A], X_0 - X> >= (g_min / 2) ||X - X_0||_F^2 on the feasible SDP set, which combined with Bernstein cut-norm concentration E||A - E[A]||_{infty -> 1} <= 6 sqrt(n^3 g_R) (Lemma 7.1) proves ||X_hat - X_0||_F / n <= epsilon whenever the effective SNR satisfies (a - b)^2 / (a + b) >= C epsilon^{-4} (or C epsilon^{-2} for community sign classification in Theorem 1.1) even when average degrees are O(1) and high-degree hubs destroy spectral concentration.
  evidence:
  - source_id: r320-primary-pdf
    locator: Section 1, Theorems 1.1-1.3, pp. 2-5; Section 6.2, Lemma 6.2, pp. 15-16; Section 7, Lemma 7.1, pp. 16-18
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Because Grothendieck's inequality controls the l_infty -> l_1 norm across all sign vectors up to universal constant factors K_G, the resulting sufficient SNR condition (a - b)^2 / (a + b) >= C epsilon^{-2} carries non-sharp constant factors C and guarantees correlated partial recovery (1 - epsilon fraction of vertices) rather than the sharp Kesten-Stigum detection threshold (a - b)^2 / (2(a + b)) = 1.
  evidence:
  - source_id: r320-primary-pdf
    locator: Section 1.2, Discussion of Theorem 1.1 and Kesten-Stigum threshold, pp. 3-4
    relation: supports
