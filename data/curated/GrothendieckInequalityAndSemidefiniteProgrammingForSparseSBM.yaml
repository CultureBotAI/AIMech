id: AIMech:GrothendieckInequalityAndSemidefiniteProgrammingForSparseSBM
name: Grothendieck Inequality and Semidefinite Programming for Sparse SBM
concept_kind: mathematical_method
review_status: DRAFT
definition: 'Grothendieck Inequality and Semidefinite Programming for Sparse SBM is an analytical framework introduced by Guedon and Vershynin (2016) for proving polynomial-time partial community recovery in constant-average-degree sparse stochastic block models via semidefinite programming (SDP). Rather than analyzing spectral concentration in the operator norm ||A - E[A]||_{2 -> 2} (which fails when average degree d = O(1) due to vertices of degree Omega(log n / log log n)), the framework pairs three modular ingredients: (1) elementary Bernstein concentration of the cut norm / l_infty -> l_1 operator norm ||A - E[A]||_{infty -> 1} = max_{x, y in {-1,1}^n} |x^T (A - E[A]) y| <= C sqrt(n^3 g_R) at constant average degree (Lemma 7.1), (2) Grothendieck''s inequality (Theorem 3.1), which lifts cut-norm concentration to uniform control over all positive semidefinite matrices X in M_G = {X >= 0 : diag(X) <= I_n} via max_{X in M_G} |<A - E[A], X>| <= K_G ||A - E[A]||_{infty -> 1} with Grothendieck constant K_G <= pi/(2 log(1 + sqrt(2))) < 1.783, and (3) strong convexity / curvature of the population objective <E[A], X_0 - X> >= (g_min / 2) ||X - X_0||_F^2 (Lemma 6.2), yielding the deterministic perturbation bound ||X_hat - X_0||_F / n <= 2 sqrt(2 K_G) sqrt(||A - E[A]||_{infty -> 1} / (n^2 g_min)).'
identity_notes: Distinct from exact recovery at logarithmic average degree p = a log(n)/n via dual certificate construction (AIMech:StochasticBlockModelExactRecoveryPhaseTransitionAndSemidefiniteProgramming) and Hashimoto non-backtracking spectral clustering (AIMech:NonBacktrackingWalkMatrixAndKestenStigumSpectralRedemption). Specifically captures the Guedon-Vershynin (2016) Grothendieck inequality SDP perturbation principle (Theorem 3.1, Lemma 6.1, Lemma 6.2, and Lemma 7.1) that achieves arbitrary fraction 1 - epsilon community recovery in constant-average-degree sparse networks without degree trimming whenever the signal-to-noise ratio (a - b)^2 / (a + b) >= C epsilon^{-2} (Theorems 1.1-1.4).
aliases:
- Grothendieck Inequality SDP Analysis for Sparse Stochastic Block Model
- Guedon-Vershynin Grothendieck Community Detection Bound
- l_infty-to-l_1 Cut-Norm Grothendieck SDP Perturbation Method
