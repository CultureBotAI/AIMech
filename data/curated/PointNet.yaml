name: PointNet
definition: A neural architecture for unordered point clouds that applies shared pointwise feature extraction
  and symmetric max pooling to produce a global representation, with a per-point prediction extension
  for segmentation.
concept_kind: architecture
identity_notes: This is the original PointNet architecture, including its classification and segmentation
  paths. It is distinct from PointNet++'s hierarchical local grouping and from a generic set-pooling model.
limitations:
- Permutation invariance of a global output and permutation equivariance of per-point predictions are
  different properties.
- Learned alignment modules do not establish exact invariance to every geometric transformation; no universal
  accuracy or robustness claim is curated.
