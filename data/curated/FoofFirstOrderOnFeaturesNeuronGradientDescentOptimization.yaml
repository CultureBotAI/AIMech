id: AIMech:FoofFirstOrderOnFeaturesNeuronGradientDescentOptimization
name: FOOF (Fast First-Order Optimizer / First-Order Gradient Descent on Neurons)
concept_kind: algorithm
review_status: DRAFT
definition: A layer-wise neural network optimization algorithm that performs gradient descent in neuron activation space rather than weight space by solving a ridge-regularized least-squares problem for the weight update Delta_W that moves layer pre-activations B = W A along their loss gradient E = dL/dB, resulting in the update (Delta_W)^T = eta * (lambda * I + A A^T)^{-1} A E^T that preconditions standard weight gradients solely by the inverse damped input-activation covariance (lambda * I + A A^T)^{-1} without any second-order loss or output-gradient curvature factor.
identity_notes: Distinct from K-FAC (AIMech:KfacKroneckerFactoredApproximateCurvature), which preconditions weight gradients from both sides using both the input-activation covariance factor (A A^T + lambda_A I)^{-1} and the Monte-Carlo Fisher output-gradient factor (E_F E_F^T + lambda_E I)^{-1}; FOOF completely omits the second Kronecker factor (and its extra Fisher backward pass), relying strictly on zero-th order input activations A A^T and first-order gradients A E^T. Distinct from Natural Neural Networks (Desjardins et al., 2015), which reparameterize layers via explicit singular value decompositions of centered activations rather than amortizing direct damped matrix inversions (Sigma_l + lambda I)^{-1}.
aliases:
- FOOF
- Fast First-Order Optimizer
- First-Order-On-Features
- Gradient Descent on Neurons
