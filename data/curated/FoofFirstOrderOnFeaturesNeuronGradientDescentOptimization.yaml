claims:
- claim_id: foof-neuron-space-proximal-least-squares-update-mechanism
  kind: mechanism
  statement: For a layer with weight matrix W in R^{n x m}, input activations A in R^{m x D}, pre-activations B = W A in R^{n x D}, and backpropagated output derivatives E = dL/dB in R^{n x D}, FOOF minimizes min_{Delta_W} || (Delta_W) A - eta * E ||_F^2 + (lambda / 2) || Delta_W ||_F^2 to obtain the closed-form update (Delta_W)^T = eta * (lambda * I + A A^T)^{-1} A E^T, resolving conflicting per-datapoint gradients in neuron output space.
  evidence:
  - source_id: r643-primary-pdf
    locator: Section 4 Equations (5)-(6) and Appendix F Toy Example, pages 5-6, 19
    relation: supports
- claim_id: foof-amortized-input-covariance-inversion-mechanism
  kind: mechanism
  statement: In stochastic mini-batch training (Algorithm 1), FOOF maintains an exponential moving average Sigma_l <- m * Sigma_l + (1 - m) A_l A_l^T of the input-activation second moment during the S steps preceding every T-th step, and recomputes the damped inverse P_l = (Sigma_l + lambda I)^{-1} only once every T steps, eliminating K-FAC's extra Fisher backward pass and second matrix inversion.
  evidence:
  - source_id: r643-primary-pdf
    locator: Section 4.1, Appendix D.1, and Appendix K Algorithm 1, pages 6, 15, 33
    relation: supports
- claim_id: foof-heuristic-damping-kfac-alignment-scope
  kind: scope
  statement: Controlled ablations against exact subsampled and full-batch natural gradients demonstrate that K-FAC with theoretically standard damping (A A^T (x) E_F E_F^T + lambda I) performs no better than SGD, whereas factored heuristic damping (A A^T + lambda_A I) (x) (E_F E_F^T + lambda_E I) drives the second Kronecker factor toward a scalar multiple of the identity and increases cosine similarity between K-FAC and FOOF toward 1.
  evidence:
  - source_id: r643-primary-pdf
    locator: Section 3.1-3.2 Figures 1-3 and Section 4.2 Figures 3B-4C, pages 2-7
    relation: supports
- claim_id: foof-mlp-and-wideresnet-speedup-application
  kind: application
  statement: Across MLPs on Fashion-MNIST and MNIST, VGG11 on SVHN, and Wide ResNet-18 on CIFAR-10 and CIFAR-100, FOOF achieves lower or comparable training loss and faster per-update progress than K-FAC, Adam, and SGD with momentum while running approximately 1.5x faster than K-FAC in wall-clock time.
  evidence:
  - source_id: r643-primary-pdf
    locator: Section 4.2 Figures 4-5 and Appendix J.5 Figures J.16-J.18, pages 6-7, 30
    relation: supports
- claim_id: foof-deep-autoencoder-trajectory-limitation
  kind: limitation
  statement: On deep bottleneck autoencoder benchmarks (MNIST, CURVES, and FACES), although a single FOOF update along K-FAC's trajectory achieves greater immediate mini-batch loss reduction than K-FAC, training along FOOF's own full trajectory reaches slightly higher final reconstruction loss than K-FAC.
  evidence:
  - source_id: r643-primary-pdf
    locator: Section 5 Limitations and Appendix J.1 Figures J.19-J.21, pages 7-8, 26, 31
    relation: supports
