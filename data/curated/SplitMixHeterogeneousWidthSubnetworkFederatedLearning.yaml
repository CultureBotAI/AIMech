id: AIMech:SplitMixHeterogeneousWidthSubnetworkFederatedLearning
name: Split-Mix Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A model-heterogeneous federated learning and in-situ customization algorithm (Split-Mix; Hong, Wang, Wang, and Zhou, ICLR 2022) that decomposes a full-width network into M = floor(1 / r) independent base sub-networks W = {w_{i,r}}_{i=1}^M of base width ratio r in (0, 1] initialized with rescaled Kaiming initialization matching the full-width variance. In each round t, client k with width budget R_k in {r, 2r, ..., 1} draws floor(R_k / r) base sub-networks via shuffled cyclic without-replacement sampling (SampleBaseModels, Algorithm 2), trains them independently in parallel on local data (LocalUpdate, Algorithm 3), and returns updates aggregated per base sub-network weighted by participating clients' sample sizes (Algorithm 1 lines 7-9). At deployment, an on-demand R-width model aggregates predictions of K_R = floor(R / r) base sub-networks via F(x; W^T) = (1 / K_R) sum_{i=1}^{K_R} f(x; w_{i,r}^T) (Algorithm 1 line 11), and for joint adversarial robustness customization (Split-Mix+DAT) mixes Dual Batch-Normalization statistics via DBN(x) = (1 - lambda) BN_c(x) + lambda BN_n(x) for lambda in [0, 1] (Eq. 2).
identity_notes: Distinct from nested width-slimming heterogeneous FL algorithms such as HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning; Diao et al., ICLR 2021) and FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning; Horvath et al., NeurIPS 2021), which slice nested prefix channel blocks from a single monolithic parameter tensor (causing wider channel blocks to be trained exclusively on wide-budget clients) rather than decomposing the model into M = floor(1/r) modular width-r base sub-networks sampled cyclically across all clients and ensembled on demand at inference time. Distinct from FedRolex (AIMech:FedRolexModelHeterogeneousFederatedLearningWithRollingSubModelExtraction; Alam et al., NeurIPS 2022), which extracts a deterministic rolling channel window from a single global model rather than maintaining M independent width-r base sub-networks with training-free Dual Batch-Normalization mixing.
