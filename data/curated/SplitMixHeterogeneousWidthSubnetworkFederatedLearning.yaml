claims:
- claim_id: split-mix-cyclic-base-subnetwork-sampling-and-ensemble-inference-mechanism
  kind: mechanism
  statement: In Split-Mix (Algorithms 1-3), the server initializes M = floor(1 / r) base sub-networks {w_{i,r}}_{i=1}^M of width ratio r using rescaled Kaiming initialization with the x1 full-width fan-in variance, assigns each client k with width budget R_k a subset W_k^t of floor(R_k / r) base sub-networks via shuffled cyclic sampling without replacement (Algorithm 2), aggregates each base model w_{i,r}^{t+1} over all clients k whose W_k^t contains w_{i,r}, and constructs an on-demand R-width predictor at inference by averaging K_R = floor(R / r) base sub-network outputs F(x; W^T) = (1 / K_R) sum_{i=1}^{K_R} f(x; w_{i,r}^T).
  evidence:
  - source_id: r506-primary-pdf
    locator: Section 4.1 Customize Model Size via Width-wise Splitting and Mixing, Algorithms 1-3, pp. 4-6
    relation: supports
- claim_id: split-mix-dat-dual-batch-normalization-in-situ-robustness-customization-scope
  kind: scope
  statement: Split-Mix+DAT (Section 4.2, Eq. 2, p. 6; Algorithm 4, p. 14) equips each base sub-network with Dual Batch-Normalization (DBN) consisting of separate clean (BN_c) and PGD-adversarial (BN_n) normalization branches optimized under local loss (1 - beta) ell(f(x; BN_c), y) + beta ell(f(x + delta; BN_n), y), enabling training-free in-situ trade-off between standard accuracy and adversarial robustness after FL training via layer-wise linear interpolation DBN(x) = (1 - lambda) BN_c(x) + lambda BN_n(x) for lambda in [0, 1].
  evidence:
  - source_id: r506-primary-pdf
    locator: Section 4.2 Customize Robustness by Mixing Dual Batch Normalization, Eq. (2), p. 6; Appendix A.2 Algorithm 4, p. 14
    relation: supports
- claim_id: split-mix-discrete-width-granularity-and-pseudo-residual-overhead-limitation
  kind: limitation
  statement: Split-Mix restricts customizable model widths to discrete integer multiples of the base width ratio r (R in {r, 2r, ..., M r}), requires tuning beta and PGD inner maximization steps on clients capable of adversarial training in Split-Mix+DAT, and incurs M-way parallel forward passes at full-width R = 1 inference (Section 4.1-4.2, pp. 4-6; Appendix B.1, pp. 14-16).
  evidence:
  - source_id: r506-primary-pdf
    locator: Section 4.1-4.2, pp. 4-6; Appendix B.1 Customize Model Widths, pp. 14-16
    relation: supports
- claim_id: split-mix-domain-shift-and-heterogeneous-budget-image-classification-application
  kind: application
  statement: Applied to budget-heterogeneous and domain-heterogeneous federated image classification and in-situ robustness customization on CIFAR-10, DomainNet, and Digits (MNIST, SVHN, USPS, SynthDigits, MNIST-M) using PreActResNet-18, AlexNet, and ConvNet backbones.
  evidence:
  - source_id: r506-primary-pdf
    locator: Section 5 Experiments, Figures 4-7, Table 1, pp. 6-9
    relation: supports
