claims:
- claim_id: neftune-length-and-dimension-invariant-uniform-embedding-noise-scaling
  kind: mechanism
  statement: For a token sequence of length L and embedding dimension d, sampling epsilon ~ Uniform(-1, 1)^{L x d} i.i.d. and forming X'_emb = X_emb + (alpha / sqrt(L d)) epsilon produces a non-adversarial perturbation with expected Euclidean norm alpha / sqrt(3) independent of L and d and zero additional backward passes.
  evidence:
  - source_id: r673-primary-pdf
    locator: 'Section 2 (NEFTune: Noisy Embedding Instruction Finetuning) & Algorithm 1, pp. 2-3'
    relation: supports
- claim_id: neftune-instruction-overfitting-mitigation-and-intra-token-preservation
  kind: mechanism
  statement: NEFTune increases training loss on the instruction dataset while lowering held-out test loss and training-prompt ROUGE-L/BLEU memorization scores (preventing verbatim lock-in to training responses), while maintaining <= 0.4% nearest-neighbor vocabulary token flips and preserving n-gram log-diversity.
  evidence:
  - source_id: r673-primary-pdf
    locator: Section 5.1-5.2 (Figures 4-5, Table 4) & Appendix A.3 (Figures 6-8), pp. 7-8, 14-16
    relation: supports
- claim_id: neftune-application-llama2-opt-qlora-instruction-tuning
  kind: application
  statement: Applied to LLaMA-2-7B across Alpaca, Evol-Instruct, ShareGPT, and OpenPlatypus, NEFTune boosts GPT-4 AlpacaEval win rate by +15.1 percentage points on average (including 29.79% -> 64.69% on Alpaca), improves RLHF-tuned LLaMA-2-Chat-7B (+7.30%) and LLaMA-2-70B (+13.78%), and improves QLoRA fine-tuning while preserving OpenLLM Leaderboard accuracy on MMLU, ARC, HellaSwag, and TruthfulQA.
  evidence:
  - source_id: r673-primary-pdf
    locator: Section 4 (Tables 1-3, Figures 1-3), pp. 1, 4-6
    relation: supports
- claim_id: neftune-limitation-verbosity-shift-and-safety-refusal-tradeoff
  kind: limitation
  statement: NEFTune induces substantially longer, more verbose completions (which correlate with LLM-judge preferences on AlpacaEval), yields smaller gains under 4-bit QLoRA than under full-parameter fine-tuning, and can affect safety-aligned checkpoints' refusal behavior against toxic outputs if applied without safety re-alignment.
  evidence:
  - source_id: r673-primary-pdf
    locator: Section 4 (p. 4-5), Section 5.2-5.3 (pp. 7-8), Section 6-7 (pp. 9-10)
    relation: supports
