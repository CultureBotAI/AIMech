claims:
- claim_id: asymptotic-linearity-clt-and-consistent-variance-overestimation
  kind: mechanism
  statement: For a triangular array of independent observations y_i in Y_{i,n} (i = 1, ..., n) with joint
    distribution P_n in P_n and stacked candidate parameter estimators theta_hat_n(y) = (theta_hat'_{M_{1,n},
    n}(y), ..., theta_hat'_{M_{d,n}, n}(y))' in R^k (k = sum_{j=1}^d m(M_{j,n})), Condition 1 (Section
    2, page 8) requires theta_hat_n(y) - theta^*_n = r_n(y) + Delta_n(y) with r_n(y) = sum_{i=1}^n g_{i,n}(y_i),
    E_n(g_{i,n}(y_i)) = 0, uniform componentwise Lindeberg condition lim_{n -> infty} sup_{P_n in P_n}
    max_{j=1,...,k} [V_n(r_n)]_j^{-1} sum_{i=1}^n E_n([g^{(j)}_{i,n}]^2 1_{{|g^{(j)}_{i,n}| >= eps sqrt([V_n(r_n)]_j)}})
    = 0, and uniformly negligible remainder diag(V_n(r_n))^{dagger/2} Delta_n ->^{P_n} 0. Using Pollak
    (1972) and Raikov's (1938) theorem, Lemma 2.2 and Lemma B.1 (pages 9-10, 38-39) prove that d_w(P_n
    o [diag(V_n(r_n))^{dagger/2}(theta_hat_n - theta^*_n)], N(0, corr(V_n(r_n)))) -> 0 and d_w(P_n o [diag(S_n)^{dagger/2}(theta_hat_n
    - theta^*_n)], N(0, corr(S_n))) ->^{P_n} 0 for S_n = sum_{i=1}^n g_{i,n}(y_i) g'_{i,n}(y_i). When
    model misspecification shifts the observable score summands by non-stochastic biases a^{(j)}_{i,n}
    so that g_tilde^{(j)}_{i,n}(y) = g_hat^{(j)}_{i,n}(y) + a^{(j)}_{i,n}, Proposition 2.7 and Lemma B.4(3)
    (pages 14-15, 44-46) prove that the uncentered empirical second moment nu_hat^2_{j,n}(y) = sum_{i=1}^n
    [g_tilde^{(j)}_{i,n}(y)]^2 satisfies P_n(sqrt([V_n(r_n)]_j / nu_hat^2_{j,n}) >= 1 + varepsilon) ->
    0 (consistent overestimation, reducing to exact consistency when [V_n(r_n)]_j^{-1} sum_{i=1}^n [a^{(j)}_{i,n}]^2
    -> 0 by Remark 2.8), so Theorem 2.6 guarantees uniform asymptotic coverage >= 1 - alpha for CI^{(j),
    oest}_{1-alpha, M_hat_n} (Equation 2.7), with Lemma 2.9 (page 16) bounding K_{1-alpha}(Gamma) <= B_alpha(rank(Gamma),
    k) = min_{lambda in (0, 1)} sqrt(q_{1 - lambda*alpha, rank(Gamma)} + 2 log(k / ((1 - lambda)*alpha))).
  evidence:
