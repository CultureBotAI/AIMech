    locator: Section 3.3, Pages 22-28, Conditions X2 & H, Equations (3.5)-(3.7), Lemmas 3.9-3.10, Theorem
      3.11, Remark 3.12; Appendix D, Pages 52-63, Lemmas D.1-D.2, Corollary D.3, Lemmas D.4-D.7
    relation: supports
  - source_id: bps2020-crossref
    locator: The Annals of Statistics 48(1):440-463 abstract
    relation: supports
