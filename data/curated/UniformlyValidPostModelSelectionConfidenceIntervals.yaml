limitations:
- The uniform multivariate central limit theorem in Lemma 2.2 treats the total number of stacked candidate
  parameters k = sum_{j=1}^d m(M_{j,n}) and the regressor dimension p as fixed independent of sample size
  n (Section 2, Footnote 6, page 8).
- Because uniformly consistent estimation of the true error variance sigma_n^2 is impossible under unbounded
  model misspecification when tau > 1 (Proposition 3.5), the consistent variance overestimator nu_hat^2_{j,n}
  = sum_{i=1}^n [g_tilde^{(j)}_{i,n}]^2 intentionally overestimates [V_n(r_n)]_j when misspecification
  biases a^{(j)}_{i,n} are large, yielding conservative coverage for severely misspecified working models
  while adapting to exact consistency when the selected model is well-specified (Proposition 2.7, Remark
  2.8, Proposition 3.4).
- 'Four minor typographical notes in arXiv:1611.01043v4 were identified and verified during full-text
  inspection: (1) Section 1.1 (page 4, line 11) prints ''sample spitting procedure'' for ''sample splitting
  procedure''; (2) Remark 3.13 (page 28, line 16) prints ''Conditon 1'' for ''Condition 1''; (3) Sections
  4.1-4.2 (pages 29-30) refer to ''Table 3'' and ''Table 4'' (the Appendix A table numbers on pages 36-37)
  when discussing what are labeled ''Table 1'' and ''Table 2'' in Section 4; and (4) Appendix D.8 (page
  61, line 1) prints ''\beta^*_{\mathbb{M}.n}'' with a period instead of a comma in the subscript.'
- All 70 pages of the full-text PDF of Bachoc, Preinerstorfer, & Steinberger (2020, The Annals of Statistics
  48(1):440-463, arXiv:1611.01043v4, DOI:10.1214/19-AOS1815) were read. Constructed numerical checks in
  research/discovery/uniformly-valid-post-model-selection-confidence-intervals-boundaries.py verify (1)
  Proposition 2.7 consistent variance overestimation under misspecification and Remark 2.8 exact consistency
  under well-specification, (2) Proposition 3.4 homoskedastic variance adaptation, Theorem 3.3 vs. Theorem
  3.2 PoSI constants, and Proposition 3.5's impossibility mixture, (3) Theorem 3.6 heteroskedastic Eicker
  sandwich PoSI coverage with Lemma 2.9's B_alpha(min(k, p), k) bound under significance hunting, and
  (4) Remark 3.12 / Corollary D.3 canonical logistic link score rank reduction from B_alpha(min(k, n),
  k) to B_alpha(min(k, p), k).
