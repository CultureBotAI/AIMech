    relation: supports
- claim_id: homoskedastic-linear-model-adaptation-and-uniform-impossibility
  kind: mechanism
  statement: In the misspecified homoskedastic linear regression model y = mu_n + u_n with E_n(u_n) =
    0, V_n(u_n) = sigma_n^2 I_n, and candidate regressor subsets M in I under Condition X1 (Section 3.1,
    pages 16-21, Equations 3.1-3.2), the stacked OLS influence matrix G_n in R^{k x n} has known deterministic
    correlation matrix corr(Gamma_n) = corr(G_n G'_n), and Proposition 3.4 (page 20, proved in Appendix
    C.3, page 50) shows that the submodel residual variance estimator sigma_hat^2_{M,n}(y) = (n - |M|)^{-1}
    y'(I_n - P_{X_n[M]}) y satisfies sigma_hat^2_{M,n} / sigma_n^2 = (1 + o_{P_n}(1))(1 + ||(I_n - P_{X_n[M]})
    mu_n / sigma_n||^2 / (n - |M|)) uniformly over P_n^{(lm)}(delta, tau). Consequently, sigma_hat^2_{M,n}
    consistently overestimates sigma_n^2 under misspecification and adapts to exact consistency whenever
    mu_n in span(X_n[M]), so Theorem 3.2 (page 18) guarantees uniform asymptotic coverage >= 1 - alpha
    for CI^{(j), lm}_{1-alpha, M} = beta_hat^{(j)}_{M,n} +- sqrt(sigma_hat^2_{M,n} [(X_n[M]' X_n[M])^{-1}]_j)
    K_{1-alpha}(corr(Gamma_n)) (Equation 3.3), and Theorem 3.3 (page 19) replaces Gamma_n by the smaller
    d x d covariance matrix Xi_n when covering a single data-selected coefficient j_hat_n in {1, ...,
    |M_hat_n|}. Conversely, Proposition 3.5 (page 21, proved in Appendix C.4, pages 50-51) proves that
    whenever limsup_{n -> infty} rank(X_n)/n < 1 and tau > 1, no sequence of estimators tilde_sigma_n^2
    can estimate sigma_n^2 uniformly consistently over P_n^{(lm)}(delta, tau).
  evidence:
  - source_id: bps2020-pdf
    locator: Section 3.1, Pages 16-21, Condition X1, Equations (3.1)-(3.3), Theorems 3.2-3.3, Propositions
      3.4-3.5; Appendix C.1-C.4, Pages 47-51
    relation: supports
