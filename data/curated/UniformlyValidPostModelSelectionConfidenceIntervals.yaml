id: AIMech:UniformlyValidPostModelSelectionConfidenceIntervals
name: Uniformly valid post-model-selection confidence intervals via consistent variance overestimation
concept_kind: mathematical_method
aliases:
- Bachoc-Preinerstorfer-Steinberger uniformly valid post-model-selection confidence intervals
- Asymptotically uniformly valid PoSI confidence intervals under model misspecification
- Consistent variance overestimation post-selection confidence intervals (CI^{oest}, CI^{lm}, CI^{hlm},
  CI^{bin})
- Heteroskedastic Eicker and Fahrmeir binary regression post-model-selection confidence intervals
definition: A general post-model-selection inference framework and family of confidence intervals CI^{(j)}_{1-alpha,
  M_hat_n}(y) = theta_hat^{(j)}_{M_hat_n, n}(y) +- sqrt(sigma_hat^2_{rho(M_hat_n)+j, n}(y)) * K_hat_n(y)
  (Bachoc, Preinerstorfer, & Steinberger 2020, Equation 2.6) for stacked asymptotically linear estimators
  theta_hat_n(y) - theta^*_n = sum_{i=1}^n g_{i,n}(y_i) + Delta_n(y) in R^k (k = sum_{j=1}^d m(M_{j,n}))
  satisfying Condition 1, guaranteeing asymptotic coverage liminf_{n -> infty} inf_{P_n in P_n} inf_{M_hat_n}
  P_n(theta^{*(j)}_{M_hat_n, n} in CI^{(j)}_{1-alpha, M_hat_n}(y)) >= 1 - alpha uniformly over both arbitrary
  data-driven model selectors M_hat_n and rich classes of possibly misspecified triangular-array distributions
  P_n (Equations 1.1-1.3, Lemma 2.2, Theorem 2.4, Theorem 2.6). Because uniformly consistent estimation
  of the true error variance sigma_n^2 is impossible under unbounded model misspecification (Proposition
  3.5), the framework replaces consistent variance estimators with consistent variance overestimators
  nu_hat^2_{j,n}(y) = sum_{i=1}^n [g_tilde^{(j)}_{i,n}(y)]^2 constructed from observable score summands
  g_tilde^{(j)}_{i,n}(y) = g_hat^{(j)}_{i,n}(y) + a^{(j)}_{i,n} that include unobservable deterministic
  misspecification shifts a^{(j)}_{i,n}, satisfying P_n(sqrt([V_n(r_n)]_j / nu_hat^2_{j,n}) >= 1 + varepsilon)
  -> 0 for all misspecification sequences and adapting to exact consistency when misspecification is negligible
  (Proposition 2.7, Remark 2.8). Paired with either the known-correlation PoSI constants K_{1-alpha}(corr(Gamma_n))
  and K_{1-alpha}(corr(Xi_n)) in homoskedastic linear regression (Theorems 3.2-3.3, Proposition 3.4) or
  the distribution-free rank-adaptive bound B_alpha(rank(Gamma), k) = min_{lambda in (0, 1)} sqrt(q_{1
  - lambda*alpha, rank(Gamma)} + 2 log(k / ((1 - lambda)*alpha))) (Lemma 2.9), the framework yields uniformly
  valid post-selection confidence intervals for heteroskedastic linear regression with Eicker sandwich
  variances and B_alpha(min(k, p), k) (Theorem 3.6) and for misspecified binary regression with joint
  link and regressor selection via Fahrmeir quasi-MLE sandwich variances and B_alpha(min(k, n), k) (Theorem
  3.11), which reduces to B_alpha(min(k, p), k) under the canonical logistic link (Remark 3.12, Corollary
  D.3).
identity_notes: Distinct from AIMech:ValidPostSelectionInferencePoSIConstant (Berk, Brown, Buja, Zhang,
  & Zhao 2013, The Annals of Statistics 41(2):802-837, arXiv:1206.6451), which defines the fixed-design
  Gaussian homoskedastic linear regression PoSI constant K(X, M_all, alpha, r) assuming an independent
  homoskedastic error variance estimator sigma_hat^2 ~ (sigma^2 / r) chi^2_r exists. Distinct from AIMech:RestrictedIsometryPostSelectionInferenceConstantBounds
  (Bachoc, Blanchard, & Neuvial 2018, Electronic Journal of Statistics 12(2):3736-3757, arXiv:1804.07566v2),
  which bounds the fixed-design Gaussian PoSI constant under s-sparse Restricted Isometry Property assumptions.
  Distinct from AIMech:PostModelSelectionPredictorPoSIConfidenceIntervals (Bachoc, Leeb, & Pötscher 2019,
  The Annals of Statistics 47(3):1475-1504, arXiv:1412.4605v3), which constructs post-selection confidence
  intervals for linear predictors x_0'[M_hat] beta^*_{M_hat} under full or active-only observation of
  a new covariate vector x_0 in homoskedastic linear regression. Bachoc, Preinerstorfer, & Steinberger
  (2020, The Annals of Statistics 48(1):440-463, arXiv:1611.01043v4, DOI:10.1214/19-AOS1815) establish
  a general triangular-array asymptotic linearity framework (Condition 1, Lemma 2.2) across arbitrary
  model families, prove that uniformly consistent estimation of sigma_n^2 is impossible under unbounded
  misspecification (Proposition 3.5), introduce consistent variance overestimation nu_hat^2_{j,n} = sum_{i=1}^n
  [g_tilde^{(j)}_{i,n}]^2 (Theorem 2.6, Proposition 2.7), and construct uniformly valid post-selection
  confidence intervals for homoskedastic linear models (Theorems 3.2-3.3), heteroskedastic linear models
  via Eicker sandwich estimators (Theorem 3.6), and misspecified binary regression with joint link and
  regressor selection via Fahrmeir quasi-MLE sandwich estimators (Lemmas 3.9-3.10, Theorem 3.11, Remark
  3.12, Corollary D.3).
