    locator: arXiv:1611.01043v4 abstract
    relation: supports
- claim_id: heteroskedastic-eicker-sandwich-post-selection-confidence-intervals
  kind: mechanism
  statement: In misspecified heteroskedastic linear regression P_n^{(het)}(delta, tau) with independent
    errors u_{i,n} of heterogeneous variances sigma^2_{i,n} satisfying max_{i,j} (sum_{l=1}^n [G^{(j)}_{l,n}]^2
    sigma^2_{l,n})^{-1} [G^{(j)}_{i,n}]^2 sigma^2_{i,n} <= tau / n, Theorem 3.6 (Section 3.2, pages 21-22,
    proved in Appendix C.5, page 51) proves that combining the Eicker (1963) sandwich variance estimator
    sigma_hat^2_{j, M, n}(y) = sum_{i=1}^n (e'_j (X_n[M]' X_n[M])^{-1} X_{i,n}[M]')^2 u_hat^2_{i, M, n}(y)
    (where u_hat_{M,n}(y) = (I_n - P_{X_n[M]}) y) with the rank-bounded PoSI constant B_alpha(min(k, p),
    k) (since rank(V_n(r_n)) = rank(G_n diag(sigma^2_{1,n}, ..., sigma^2_{n,n}) G'_n) <= min(k, p)) yields
    confidence intervals CI^{(j), hlm}_{1-alpha, M}(y) = beta_hat^{(j)}_{M,n}(y) +- sqrt(sigma_hat^2_{j,
    M, n}(y)) B_alpha(min(k, p), k) (Equation 3.4) with uniform asymptotic coverage >= 1 - alpha over
    P_n^{(het)}(delta, tau) and all model selectors M_hat_n.
  evidence:
  - source_id: bps2020-pdf
    locator: Section 3.2, Pages 21-22, Equation (3.4), Theorem 3.6; Appendix C.5, Page 51
    relation: supports
- claim_id: misspecified-binary-regression-fahrmeir-sandwich-and-canonical-link-reduction
  kind: mechanism
  statement: In misspecified binary regression P_n^{(bin)}(tau) where independent binary outcomes y_i
    in {0, 1} have arbitrary success probabilities p_{i,n} = P_n(y_i = 1) in [1/tau, 1 - 1/tau] and working
    models M = (M, P_{M, h}) jointly select both a regressor subset M in I and a link function h in H
    under Conditions X2 and H (Section 3.3, pages 22-28), Lemmas 3.9-3.10 (pages 25-26, proved in Appendix
    D.4-D.5, pages 53-58) prove unique existence of the Kullback-Leibler projection target beta^*_{M,n}
    = argmin_{beta in R^{|M|}} KL(P_n, P_{M,h,beta}) solving sum_{i=1}^n [p_{i,n} phi_dot_1(X_{i,n}[M]
    beta) + (1 - p_{i,n}) phi_dot_2(X_{i,n}[M] beta)] X'_{i,n}[M] = 0 (Equation 3.5) and uniform consistency
    of the quasi-MLE beta_hat_{M,n}. Theorem 3.11 (page 27, proved in Appendix D.6-D.8, pages 58-63) proves
    that pairing the Fahrmeir (1990) sandwich variance estimator S_tilde_{M,n}(y) = J_hat^{-1}_{M,n}(beta_hat_{M,n})
    V_hat_{M,n}(s_n) J_hat^{-1}_{M,n}(beta_hat_{M,n}) (Equation 3.6) with B_alpha(min(k, n), k) yields
    confidence intervals CI^{(j), bin}_{1-alpha, M}(y) = beta_hat^{(j)}_{M,n}(y) +- sqrt([S_tilde_{M,n}(y)]_j)
    B_alpha(min(k, n), k) (Equation 3.7) with uniform asymptotic coverage >= 1 - alpha over P_n^{(bin)}(tau).
    Moreover, Remark 3.12 (page 27) and Corollary D.3 (page 53) prove that for the canonical logistic
    link h^{(c)}(gamma) = e^gamma / (1 + e^gamma), phi_dot_1(gamma) - phi_dot_2(gamma) === 1, so the score
    vectors lie in the p-dimensional column space of X'_n and rank(V_n(r_n)) <= min(k, p), reducing the
    binary regression PoSI constant from B_alpha(min(k, n), k) to B_alpha(min(k, p), k).
  evidence:
