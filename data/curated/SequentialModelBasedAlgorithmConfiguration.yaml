name: Sequential Model-based Algorithm Configuration
definition: A sequential algorithm-configuration procedure that uses random-forest performance models
  to propose parameter settings and compares candidate settings with an incumbent through adaptive evaluations
  on shared problem instances and random seeds.
concept_kind: algorithm
identity_notes: The primary scope is the original 2011 SMAC procedure, not every sequential model-based
  optimizer or every later SMAC software release. It configures a target algorithm over a set or distribution
  of instances and returns one incumbent configuration; it is not per-instance algorithm selection, a
  prediction forest by itself, or population-based transfer of trained model weights. Its model-guided
  proposals distinguish it from ROAR, which shares the intensification procedure but samples configurations
  at random. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  262 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in both worktree and main checkout, returning 9 lines in each checkout. These were prior candidate
  leads, source references and neighboring-method mentions, not existing records for these identities.
  Ten exact AIO CLASS nodes with synonyms and outgoing edges and eight neighboring native mechanisms were
  inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The original method explicitly lacks adaptive capping of individual poor runs. Its adaptive allocation
  of additional evaluations must not be equated with the censored-runtime handling or other features of
  later SMAC releases.
- Surrogate uncertainty and early empirical comparisons do not certify an optimal configuration or generalization
  to unseen instance distributions. The paper’s asymptotic argument assumes a finite configuration space,
  consistent cost estimates and unbounded evaluation growth; the displayed experimental procedure caps
  incumbent evaluations with maxR=2000. These conditions are not an unconditional guarantee for the capped
  implementation or continuous spaces.
- Instance features are optional; the result is a single configuration and does not require test-instance
  feature computation. The reviewed source is an author-hosted manuscript, not a claim that its 15 PDF
  pages match the publisher’s page layout. No benchmark result or executable implementation was reproduced.
