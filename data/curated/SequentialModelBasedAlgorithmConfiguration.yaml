claims:
- claim_id: method
  kind: mechanism
  statement: Initialize with an evaluation of the default configuration, or a random setting when no default
    is available. Fit a random-forest surrogate using configuration values and, when available, training-instance
    features. Aggregate each tree’s predictions over instances according to the chosen cost metric, then
    derive predictive moments across trees. For runtime optimization the paper uses log-transformed responses
    while preserving the original aggregation objective through inverse transformation at leaves. Rank
    proposals by expected improvement, using its log-cost formulation, and search for promising settings
    with multistart one-coordinate local changes plus randomly sampled acquisition candidates. Interleave
    guided proposals with uniformly sampled configurations. The intensification routine compares a challenger
    and incumbent on shared instance/seed evaluations, enlarges the challenger’s evaluated subset in doubling
    batches, rejects it when its empirical cost is worse, and replaces the incumbent when the challenger
    has matched the available evaluation set and is at least as good. Repeat model fitting and configuration
    comparisons within the overall configuration budget.
