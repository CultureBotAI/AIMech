id: AIMech:HighDimensionalIsingModelSelectionViaL1RegularizedLogisticRegression
name: High-Dimensional Ising Model Selection via L1-Regularized Logistic Regression
concept_kind: mathematical_method
aliases:
- High-Dimensional Ising Model Selection Using l_1-Regularized Logistic Regression (Ravikumar, Wainwright,
  & Lafferty 2010)
- High-Dimensional Graphical Model Selection Using l_1-Regularized Logistic Regression
- Nodewise L1-Regularized Logistic Regression Pseudo-Likelihood for Ising Markov Random Field Structure
  Recovery
definition: 'High-Dimensional Ising Model Selection via L1-Regularized Logistic Regression is a nodewise
  convex pseudo-likelihood graphical model structure learning method and primal-dual witness sparsistency
  framework introduced by Ravikumar, Wainwright, and Lafferty (2010, Annals of Statistics 38(3):1287-1319,
  arXiv:0804.4202v1, DOI:10.1214/09-AOS691) for recovering the signed edge set E*_{st} = sign(theta*_{st})
  of a p-vertex binary Ising Markov random field P_{theta*}(x) = (1/Z(theta*)) exp(sum_{(s,t) in E} theta*_{st}
  x_s x_t) on {-1, +1}^p with maximum degree d without computing the #P-hard partition function Z(theta*).
  Exploiting the logistic conditional distribution P_{theta*}(x_r | x_{\r}) = 1 / (1 + exp(-2 x_r sum_{t
  in V \ r} theta*_{rt} x_t)) (Equation 4), the method solves for each node r in V the convex program
  min_{theta_{\r} in R^{p-1}} {ell(theta; {x^{(i)}}) + lambda_n ||theta_{\r}||_1} (Equations 5-7) and
  estimates the signed neighborhood N_hat_pm(r) = {sign(theta_hat_{ru}) u | u in V \ r, theta_hat_{ru}
  != 0} (Equation 8). Under dependency conditions Lambda_min(Q*_{SS}) >= C_min > 0, Lambda_max(E_{theta*}[X_{\r}
  X_{\r}^T]) <= D_max (Equation 12) and mutual incoherence |||Q*_{S^c S} (Q*_{SS})^{-1}|||_infty <= 1
  - alpha (Equation 13) on the population Fisher information matrix Q*_r = E_{theta*}[eta(X; theta*) X_{\r}
  X_{\r}^T] with conditional variance weight eta(u; theta) = 4 exp(2 u_r sum_{t != r} theta_{rt} u_t)
  / (exp(2 u_r sum_{t != r} theta_{rt} u_t) + 1)^2 (Equations 9-11), Theorem 1 (Equations 15-16) proves
  simultaneous signed graph recovery across all p nodes with sample complexity n = Omega(d^3 log p) and
  theta*_min = Omega(1/d) for lambda_n = 2 sqrt((log p)/n), whereas Proposition 1 (Equation 26) proves
  that n = Omega(d^2 log p) and theta*_min = Omega(1/sqrt(d)) suffice when Assumptions A1-A2 hold directly
  on the sample Fisher matrix Q^n.'
identity_notes: Resolved against all 442 pinned AIO records and 628 maintained AIMech records. Distinct
  from AIMech:PrimalDualWitnessAndSharpThresholdsForHighDimensionalNoisyLassoSparsityRecovery (Wainwright
  2009, IEEE Trans. Inf. Theory 55(5):2183-2202, which analyzes linear Lasso regression under Gaussian
  noise where the Hessian is constant, whereas nodewise Ising logistic regression has a parameter-dependent
  Fisher information matrix Q(theta) weighted by eta(X; theta) = sech^2(sum_{t != r} theta_{rt} X_t) and
  a non-zero quadratic Taylor remainder R^n controlled via Lemmas 3-4), from AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework
  (Negahban et al. 2012, Statistical Science 27(4):538-557, which bounds l_2 parameter estimation error
  under Restricted Strong Convexity rather than exact signed graph recovery via population Fisher mutual
  incoherence), and from AIO:LogisticRegression and AIO:LassoRegression.
