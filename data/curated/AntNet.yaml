name: AntNet
definition: A distributed adaptive routing algorithm in which forward agents sample network paths and
  backward agents use the measured trip times to update local traffic models and probabilistic routing
  tables.
concept_kind: algorithm
identity_notes: This record denotes the 1998 datagram-network AntNet formulation. Forward ants experience
  ordinary data queues and backward ants return with priority; the proposed later scheme using fast forward
  ants and estimated virtual delays is a separate extension. It is an instantiated routing method within
  the ant-colony approach, not all ACO algorithms, a static TSP optimizer, Q-routing, or a generic multi-agent
  system. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and
  295 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
  files in worktree and main, returning 57 and 57 lines respectively. Text hits were prior candidate leads
  and neighboring-method mentions in maintained records, saved reviews and discovery reports; they did
  not identify an existing record for these candidates. Six exact AIO CLASS nodes with scoped synonyms/comments
  and outgoing edges and six native neighboring mechanisms were inspected. Absence is bounded to this
  snapshot and semantic neighborhood.
limitations:
- Backward traversal requires bidirectional links; forward and reverse costs need not be equal. The simulation
  omits full transport-layer error, flow and congestion control, so its comparisons are not deployment
  guarantees or universal superiority claims.
- The full-neighbor queue formula uses l_n=1−q_n/sum(q) and weights P_n+alpha*l_n. Zero queue sums and
  sampling from the restricted unvisited set require a declared normalization/fallback convention. The
  record does not silently treat the full-neighbor denominator as normalized after exclusions. Zero local
  traffic also needs a destination-selection convention.
- Every selected completed route receives positive reinforcement in the baseline, including poorly scored
  routes; alternatives decrease by normalization. This is not a negative reward on the selected bad route.
  At r=1 other probabilities become zero, so the algebra alone supplies no permanent full-support guarantee.
  Positive probabilities remain positive under a finite power reweighting in exact arithmetic; that transformation
  suppresses rather than categorically forbids rare data routes.
- The score’s interval is a deliberately rough asymmetric estimate built from adaptive statistics, not
  a calibrated confidence guarantee. Score parameters, window reset, zero dispersion, denominators, queue
  behavior and finite precision require declared conventions. Returned information can already be stale
  under changing traffic.
- The explicit method and Figure 3 allow good-subpath updates; Section 8.3’s one-destination summary is
  a simplification. Relations to actor–critic, Monte Carlo and temporal-difference learning are qualified
  analogies in the paper; the method does not inherit tabular Q-learning convergence or require TD bootstrapping.
  No author simulator or empirical benchmark was run.
