claims:
- claim_id: method
  kind: mechanism
  statement: At each node maintain destination-specific next-hop probabilities summing to one and local
    statistics of experienced trip times, including mean, variance and a recent best time. Periodically
    launch forward ants with destinations biased by local data traffic. They share data queues, record
    visited nodes and elapsed times, and choose among unvisited neighbors whenever any are available,
    falling back to all neighbors only when all have already been visited. Within that eligible set, choices
    use routing probabilities plus an instantaneous queue-length heuristic. On revisiting a node, remove
    the cycle from memory; discard an ant if the cycle consumed more than half its current age. At the
    destination, create a backward ant carrying the recorded path; it returns along that path through
    higher-priority queues. At each visited node, use forward-trip elapsed times to update the destination’s
    local statistics and reinforce the neighbor leading forward toward that destination. Statistically
    good subpaths can also update their corresponding destinations. For a chosen forward neighbor f and
    reinforcement r in (0,1], set P_f_new=P_f+r*(1−P_f) and each other P_n_new=(1−r)*P_n. The inspected
    scoring scheme combines a recent-best-time ratio with a dispersion-based correction and a normalized
    nonlinear squash; it rewards a path relative to local traffic conditions. Data packets sample from
    a power-reweighted routing table, whereas forward ants also use queue heuristics. Updates are concurrent
    and local; measured forward times, not recursively bootstrapped estimates from downstream nodes, supply
    the feedback.
