name: Otsu thresholding
definition: A histogram-based threshold-selection algorithm that partitions ordered gray levels by maximizing
  class-weighted between-class variance, equivalently minimizing within-class variance for a fixed histogram.
concept_kind: algorithm
identity_notes: The binary method chooses a global intensity threshold without labeled training data or
  a fitted parametric intensity density. Its ordered multilevel extension jointly selects several thresholds
  using the same variance decomposition. It is not a supervised classifier, a learned activation threshold,
  adaptive spatial thresholding or a guarantee of semantically correct image segmentation. The threshold
  search depends on intensity counts and order, not spatial adjacency. Thresholds with the same partition
  can be equivalent even when their numeric values differ. No normalized identity match was found across
  all 442 pinned AIO labels and all scoped synonyms and 397 preceding native IDs, names and aliases for
  these three concepts. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, yielding 12 and 12 matched lines; all 9 unique contents were read. Hits represent citations
  and discovery leads rather than records of these identities. All 161 semantic label/synonym hits were
  read. Forty fully annotated exact CLASS nodes and outgoing edges were inspected:24 byte-verified after
  prior full reading and 16 freshly read. Fifty contextual YAMLs comprise 40 generated and 10 native records:28
  byte-verified after prior reading and 22 freshly read. Any truncated display was reread in smaller batches.
  Short acronyms were included in the complete normalized identity comparison. Absence is bounded to the
  pin, native collection and inspected semantic neighborhood.
limitations:
- An empty histogram has no probability distribution. A constant-intensity histogram has no admissible
  nonempty binary split and has zero total variance, so the separability ratio is undefined without an
  added convention. Implementations must state how they handle these cases.
- Multiple thresholds can maximize the objective. The paper does not prescribe a universal tie rule such
  as averaging all maximizing thresholds. Quantization, bin selection and intensity transformations can
  affect the result; the stated invariance is for corresponding affine intensity transformations, not
  arbitrary nonlinear remapping.
- 'Section III D suggests that the objective is always unimodal while acknowledging no proof. That universal
  claim is not adopted: the original finite histogram with equal counts at 0, 10, 11, 21 has two separated
  maximizing threshold plateaus with a lower objective at 10. A full scan preserves the global objective;
  an assumed-unimodal local search need not.'
- The variance criterion measures statistical separation in intensity space. It does not require visibly
  bimodal histograms and does not ensure that the selected classes correspond to the desired objects.
  Spatial connectivity, texture and semantic labels are absent from this objective.
- The multilevel criterion requires a joint ordered-threshold optimization or another justified optimizer.
  The linear scan complexity above is for the binary case, not every multilevel search.
- The three small illustrative character, texture and cell images are application examples, not a modern
  accuracy benchmark or a universal comparison. The PDF shares pages with unrelated articles and a book
  review; those passages are excluded from evidence. No author implementation or image evaluation was
  run.
