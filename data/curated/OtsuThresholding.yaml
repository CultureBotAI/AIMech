claims:
- claim_id: method
  kind: mechanism
  statement: For nonnegative counts n_i at ordered gray levels i with positive total N, use p_i=n_i/N
    and total mean mu_T=sum_i i*p_i. For every binary threshold k admitting two nonempty classes, set
    w=sum_(i<=k) p_i and m=sum_(i<=k) i*p_i. Compute between-class variance B(k)=(mu_T*w-m)^2/[w*(1-w)]
    and choose a global maximizer. Cumulative counts and first moments give an O(L) scan over L gray levels
    after histogram construction. At fixed total variance T, within-class variance is T-B(k); if T>0,
    maximizing the separability ratio B(k)/T gives the same maximizers. The source’s multilevel extension
    jointly partitions the ordered levels into nonempty classes and maximizes sum_c w_c*(mu_c-mu_T)^2;
    recursive binary splitting is not automatically equivalent to that joint optimum.
