claims:
- claim_id: r480-adversarial-hard-sample-mining-minimax-distillation-mechanism
  kind: mechanism
  statement: In each round's I server fine-tuning iterations, FedFTG first updates the conditional generator G(z, y; theta) for I_g steps to maximize the weighted KL discrepancy L_{md} minus the semantic cross-entropy penalty lambda_{cls} L_{cls} and diversity loss lambda_{dis} L_{dis} (mining hard synthetic samples where the averaged global model omega disagrees with local teacher models {omega_t^k}), and then updates the global model omega for I_d steps to minimize L_{md} on those hard samples (Zhang et al. 2022, Section 4.1, Equations 3-8, Algorithm 2).
  evidence:
  - source_id: r480-primary-pdf
    locator: Section 4.1 (Equations 3-8, Algorithm 2), pp. 4-5
    relation: supports
- claim_id: r480-customized-label-sampling-and-class-level-ensemble-weighting-mechanism
  kind: mechanism
  statement: To handle extreme non-IID label skew across active clients S_t, FedFTG samples synthetic labels according to the active corpus class proportion p_t(y) = (sum_{k in S_t} n_k^y) / (sum_{y', k in S_t} n_k^{y'}) (Equation 9) and assigns each local teacher k the class-conditional importance weight alpha_t^{k,y} = n_k^y / sum_{i in S_t} n_i^y (Equation 10), preventing clients with zero or few samples of class y from corrupting the ensemble teacher logits for class y (Zhang et al. 2022, Section 4.2, Equations 9-10, Table 4).
  evidence:
  - source_id: r480-primary-pdf
    locator: Section 4.2 (Equations 9-10), p. 5, and Section 5.3 (Table 4), p. 7
    relation: supports
- claim_id: r480-plug-and-play-server-finetuning-for-federated-optimizers-application
  kind: application
  statement: Applied both standalone and as a plug-and-play server-side fine-tuning module on top of FedAvg, FedProx, FedDyn, and MOON on Dirichlet-skewed CIFAR-10, CIFAR-100, Tiny-ImageNet, and MNIST/FEMNIST benchmarks (Zhang et al. 2022, Section 5, Tables 1-4, Figures 3-5).
  evidence:
  - source_id: r480-primary-pdf
    locator: Section 5.1-5.3 (Tables 1-4, Figures 3-5), pp. 6-8
    relation: supports
- claim_id: r480-class-count-disclosure-and-server-generator-compute-limitation
  kind: limitation
  statement: Requires clients to report their per-class sample counts {n_k^y} (or requires estimating them via synthetic forward passes) to compute p_t(y) and alpha_t^{k,y}, and adds I * (I_g + I_d) server-side generator-and-teacher forward/backward passes per communication round (Zhang et al. 2022, Section 4.2, p. 5).
  evidence:
  - source_id: r480-primary-pdf
    locator: Section 4.1-4.2 (Algorithm 2, Equations 9-10), pp. 4-5
    relation: supports
