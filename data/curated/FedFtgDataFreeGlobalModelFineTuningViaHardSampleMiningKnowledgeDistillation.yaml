id: AIMech:FedFtgDataFreeGlobalModelFineTuningViaHardSampleMiningKnowledgeDistillation
name: FedFTG (Data-Free Global Model Fine-Tuning via Hard Sample Mining Knowledge Distillation)
concept_kind: algorithm
review_status: DRAFT
definition: 'A server-side data-free knowledge distillation algorithm for non-IID federated learning (Zhang, Shen, Ding, Tao, & Duan 2022, Section 4, Equations 2-10, Algorithms 1-2) that fine-tunes the FedAvg-aggregated server model omega_t after each communication round by jointly training a conditional generator G(z, y; theta) -> x_tilde and the global model omega in an adversarial hard-sample mining minimax game: min_omega max_theta E_{z ~ N(0,I), y ~ p_t(y)} [L_{md} - lambda_{cls} L_{cls} - lambda_{dis} L_{dis}] (Equation 8), where L_{md} = sum_{k in S_t} alpha_t^{k,y} D_{KL}(sigma(f(x_tilde; omega)) || sigma(f(x_tilde; omega_t^k))) (Equations 3-4) measures prediction discrepancy between the global model and uploaded client models {omega_t^k}, L_{cls} = sum_{k in S_t} alpha_t^{k,y} L_{CE}(sigma(f(x_tilde; omega_t^k)), y) (Equations 5-6) enforces class-consistent synthetic semantics, L_{dis} = exp((1/Q^2) sum_{i,j} (-||x_tilde_i - x_tilde_j||_2 ||z_i - z_j||_2)) (Equation 7) prevents generator mode collapse, and p_t(y) = (sum_{k in S_t} n_k^y) / (sum_{y'', k in S_t} n_k^{y''}) (Equation 9) and alpha_t^{k,y} = n_k^y / sum_{i in S_t} n_i^y (Equation 10) weight synthetic classes and local teacher ensembles by exact per-class client sample counts.'
identity_notes: Distinct from FedGen (AIMech:FedGenDataFreeKnowledgeDistillationForHeterogeneousFederatedLearning, Zhu, Hong, & Zhou 2021), which broadcasts a lightweight latent-feature generator to clients to regularize local training rather than adversarially mining hard input-space pseudo-samples x_tilde on the server to fine-tune the global model omega_t via minimax discrepancy maximization (Equation 8); and distinct from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning, Lin et al. 2020), which requires an external unlabeled proxy dataset on the server and uses uniform client logit averaging rather than data-free adversarial generation with class-specific ensemble weights alpha_t^{k,y} (Equation 10).
aliases:
- FedFTG
- Fine-Tuning Global Model via Data-Free Knowledge Distillation
- Adversarial Hard-Sample Data-Free Federated Global Fine-Tuning
