id: AIMech:PABEEPatienceBasedEarlyExitForBERT
name: 'PABEE: Patience-Based Early Exit for Pretrained Language Models'
concept_kind: algorithm
review_status: DRAFT
definition: An input-adaptive dynamic early-exit inference and training algorithm for deep neural networks and pre-trained language models that attaches an internal classifier or regressor C_i to each intermediate layer L_i, trains all n classifiers jointly with a depth-weighted objective L = (sum_{j=1}^n j * L_j) / (sum_{j=1}^n j), and terminates forward propagation at layer j as soon as the cross-layer agreement counter cnt_i (incremented when arg max(y_i) == arg max(y_{i-1}) for classification or |y_i - y_{i-1}| < tau for regression, and reset to 0 otherwise) reaches a predefined patience hyperparameter t.
identity_notes: 'Introduced by Wangchunshu Zhou, Canwen Xu, Tao Ge, Julian McAuley, Ke Xu, and Furu Wei (NeurIPS 2020, arXiv:2006.04152). Distinct from single-layer confidence or entropy early-exit mechanisms such as BranchyNet, Shallow-Deep Networks, DeeBERT, and FastBERT (Round 807): instead of trusting a single low layer''s potentially over-confident softmax score, PABEE requires t consecutive inter-layer agreements (t + 1 agreeing layers in a row), which supports both classification and continuous regression (e.g., STS-B), mitigates deep-layer overthinking, and creates an implicit multi-layer ensemble defense against adversarial attacks.'
aliases:
- PABEE
- Patience-Based Early Exit
- BERT Loses Patience Early-Exit Inference
