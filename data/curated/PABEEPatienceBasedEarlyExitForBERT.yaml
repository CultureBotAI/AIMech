claims:
- claim_id: r808-claim-cross-layer-patience-recurrence-and-depth-weighted-loss
  kind: mechanism
  statement: PABEE attaches internal classifiers/regressors C_1, ..., C_{n-1} to intermediate layers L_1, ..., L_{n-1} trained jointly via the depth-weighted objective L = (sum_{j=1}^n j * L_j) / (sum_{j=1}^n j) (Eq. 6), and during inference updates a patience counter cnt_i = cnt_{i-1} + 1 if arg max(y_i) == arg max(y_{i-1}) (classification, Eq. 2) or |y_i - y_{i-1}| < tau (regression, Eq. 3) and cnt_i = 0 otherwise, halting at the first layer j where cnt_j == t (or falling back to C_n).
  evidence:
  - source_id: r808-primary-pdf
    locator: Section 3.2 (Inference, Equations 1-3) & Section 3.3 (Training, Equations 4-6), Page 4
    relation: supports
  - source_id: r808-primary-pdf
    locator: pabee_classify_exit, pabee_regress_exit, and weighted_training_loss verification in main()
    relation: supports
- claim_id: r808-claim-theorem1-accuracy-improvement-bound
  kind: mechanism
  statement: In binary classification with n internal classifiers of error rate q and final classifier error rate p, the early-stopping probability is lower-bounded by p_stop > q^{t+1} + (1 - q)^{t+1} >= (1/2)^t (Eq. 7) and the early-stopped misclassification probability is upper-bounded by p_misc < q^{t+1} + (n - t - 1)(1 - q)q^{t+1} (Eq. 8), guaranteeing that PABEE strictly reduces overall error below conventional full-depth inference whenever n - t < ((1/(2q))^t * (p/q) - q) / (1 - q) (Theorem 1 & Eq. 11).
  evidence:
  - source_id: r808-primary-pdf
    locator: Section 3.4 (Theoretical Analysis, Theorem 1) & Appendix B (Proof of Theorem 1, Equations 7-11), Pages 5 & 13-14
    relation: supports
  - source_id: r808-primary-pdf
    locator: exact_iid_pabee_stats and Equations 7, 8, and 11 verification for n=12, q=0.2, p=0.1, t=4 in main()
    relation: supports
- claim_id: r808-claim-glue-accuracy-speedup-and-adversarial-robustness
  kind: application
  statement: Adding fewer than 40K parameters (0.33% of ALBERT-base) and no extra training time, PABEE with patience t = 6 accelerates ALBERT-base by 1.57x across 8 GLUE tasks while increasing the GLUE dev macro-score from 84.4 to 85.1 (and test macro-score from 80.4 to 80.9), accelerates 24-layer ALBERT-large by 2.42x with higher accuracy, and increases after-attack accuracy against TextFooler black-box adversarial attacks by over 3x on SNLI (19.3% vs. 5.5%) and MNLI (30.2%/25.6% vs. 9.8%/7.9%).
  evidence:
  - source_id: r808-primary-pdf
    locator: Section 4.4-4.6, Tables 1-5 & Figures 3-4, Pages 6-8
    relation: supports
- claim_id: r808-claim-inverted-u-patience-and-single-branch-limitation
  kind: limitation
  statement: PABEE exhibits an inverted-U accuracy curve with respect to the patience hyperparameter t (too small t exits prematurely by chance, while too large t allows a single overthinking late layer to reset cnt_i and force fallback to the final classifier C_n), and the sequential counter formulation applies directly only to single-branch sequential backbones (such as Transformers and ResNets) rather than multi-branch DAG architectures.
  evidence:
  - source_id: r808-primary-pdf
    locator: Section 4.5 (Impact of Patience) & Section 5 (Discussion), Pages 7-9
    relation: supports
