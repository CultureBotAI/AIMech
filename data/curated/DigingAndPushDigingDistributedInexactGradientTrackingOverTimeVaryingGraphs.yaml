id: AIMech:DigingAndPushDigingDistributedInexactGradientTrackingOverTimeVaryingGraphs
name: DIGing and Push-DIGing (Distributed Inexact Gradient Tracking Over Time-Varying Graphs)
concept_kind: algorithm
review_status: DRAFT
definition: 'A pair of geometrically convergent distributed gradient tracking algorithms over time-varying graphs (Nedic, Olshevsky, & Shi 2017, Sections 2 and 4, Algorithms 1-2): (1) Distributed Inexact Gradient Tracking (DIGing, Algorithm 1), which updates x(k+1) = W(k) x(k) - alpha y(k) and y(k+1) = W(k) y(k) + nabla f(x(k+1)) - nabla f(x(k)) with y(0) = nabla f(x(0)) over B-connected sequences of doubly stochastic matrices W(k); and (2) Push-DIGing (Algorithm 2), which achieves geometric convergence over time-varying B-strongly-connected directed graphs using column-stochastic matrices C(k) via u(k+1) = C(k)(u(k) - alpha y(k)), v(k+1) = C(k) v(k), x(k+1) = V(k+1)^{-1} u(k+1), and y(k+1) = C(k) y(k) + nabla f(x(k+1)) - nabla f(x(k)).'
identity_notes: Distinct from DSGT and GSGT (AIMech:DsgtAndGsgtDistributedStochasticGradientTracking, Pu & Nedic 2021), which analyze noisy stochastic gradients G(x_k, xi_k) over static expectation-doubly-stochastic graphs, and from Stochastic Gradient Push (AIMech:StochasticGradientPushAndOverlapSgpForDistributedDeepLearning, Assran et al. 2019), which omits the gradient tracker y(k) and achieves sublinear O(1 / sqrt(n K)) convergence rather than global R-linear geometric convergence O(lambda^k) over time-varying directed graphs.
aliases:
- DIGing and Push-DIGing
- Distributed Inexact Gradient Tracking
- Push-DIGing
