claims:
- claim_id: r431-small-gain-cyclic-loop-and-explicit-geometric-convergence-rate
  kind: mechanism
  statement: By modeling the four error sequences (||x - x^*||, ||y - bar_y||, ||bar_y||, ||x(k) - x(k-1)||) in exponentially weighted l_infty^{lambda} norms and bounding their B-step consensus contraction factor delta in [0, 1) (Lemma 3.3), the small-gain theorem (Theorem 3.5) proves that whenever the cyclic product gamma_1 gamma_2 gamma_3 gamma_4 < 1 holds, DIGing converges globally at the explicit R-linear rate O(lambda^k) with lambda = (1 - alpha bar_mu / 1.5)^{1/(2B)}, achieving polynomial complexity O(n^{4.5} bar_kappa^{1.5} ln(1 / varepsilon)) under lazy Metropolis weights (Theorem 3.7, Theorem 3.14, Corollaries 3.15-3.16).
  evidence:
  - source_id: r431-primary-pdf
    locator: Section 3 Small-Gain Convergence Analysis (Lemmas 3.3-3.13, Theorem 3.7, Theorem 3.14, Corollaries 3.15-3.16)
    relation: supports
- claim_id: r431-push-diging-row-stochastic-similarity-transformation-on-digraphs
  kind: mechanism
  statement: In Push-DIGing (Algorithm 2), scaling the column-stochastic matrix C(k) by the diagonal PushSum weight matrix V(k) = diag(v(k)) defines the similarity-transformed matrix tilde_R(k) = V(k+1)^{-1} C(k) V(k) which is strictly row-stochastic (tilde_R(k) 1 = 1, Eq. 4.4), converting the de-biased iterate evolution into x(k+1) = tilde_R(k)(x(k) - alpha V(k)^{-1} y(k)) (Eq. 4.6a) while C(k) preserves 1^T y(k) = 1^T nabla f(x(k)), establishing global R-linear convergence O((lambda_P)^k) over time-varying B-strongly-connected directed graphs (Theorem 4.13).
  evidence:
  - source_id: r431-primary-pdf
    locator: Section 4 Push-DIGing for Time-Varying Directed Graphs (Algorithm 2, Equations 4.1-4.8, Lemmas 4.1-4.12, Theorem 4.13)
    relation: supports
- claim_id: r431-exact-gradient-and-bounded-intercommunication-interval-limitation
  kind: limitation
  statement: Guarantees exact geometric convergence only for deterministic (noiseless) local gradients under bounded B-connected communication intervals and uniform positive lower bounds tau > 0 on nonzero mixing weights.
  evidence:
  - source_id: r431-primary-pdf
    locator: Section 2.2 Assumptions 1-4 & Section 4.2 Assumptions 2'-3'
    relation: supports
- claim_id: r431-time-varying-wireless-sensor-network-huber-and-logistic-estimation-application
  kind: application
  statement: Applied to distributed Huber loss minimization and regularized logistic regression over time-varying undirected and directed multi-agent graphs.
  evidence:
  - source_id: r431-primary-pdf
    locator: Section 5 Numerical Experiments (Figures 1-4), pp. 2627-2630
    relation: supports
