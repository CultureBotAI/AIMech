name: MAX–MIN Ant System
definition: An ant-colony optimization algorithm that reinforces solution components from a single selected
  best ant per iteration, constrains pheromone trails between lower and upper limits, and initializes
  trails high to encourage early exploration.
concept_kind: algorithm
identity_notes: This record denotes MAX–MIN Ant System as described in the inspected 1999 author preprint
  associated with the 2000 journal article. It retains the defining bounded-trail and single-best reinforcement
  mechanism. Iteration-best, global-best and mixed schedules are specified choices; local search, candidate
  lists and pheromone smoothing are optional configurations. It is not the unbounded all-ant Ant System
  update or the selected ACS greedy/local-update rule. No normalized identity match was found across all
  442 pinned AIO labels/scoped synonyms and 288 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 10 and 10 lines respectively.
  Every text hit was a prior candidate lead. Six exact AIO CLASS nodes with scoped synonyms/comments and
  outgoing edges and five native neighboring mechanisms were inspected. Absence is bounded to this snapshot
  and semantic neighborhood.
limitations:
- Positive lower trails provide nonzero probabilities only for choices that remain eligible and have positive
  finite heuristic weights with a finite positive normalizer. The paper’s optional nearest-neighbor candidate
  lists exclude otherwise feasible choices, and its fallback is deterministic maximization; positive bounds
  therefore do not prove full tour support for that implementation.
- The p_best lower-limit heuristic assumes the simplified TSP branching model, alpha=1 and negligible
  heuristic differences; changing the pheromone exponent changes the displayed probability relation. Choosing
  p_best=1 yields tau_min=0 in the displayed formula, which does not satisfy a strict positive-bound premise.
  Small n, changing branch counts and numerical underflow require additional configuration decisions.
- The geometric-series argument bounds a recurrence under a maximum deposit. That argument alone does
  not establish that every changing trail sequence has a limit, nor that a finite run reaches the global
  optimum. The source’s trail-bound notion of convergence must not be equated with optimality or all ants
  taking the same tour.
- Equal high pheromone does not imply uniform construction when heuristic weights differ. Best-so-far
  reinforcement, iteration-best mixing, candidate lists, local search, smoothing and restart rules affect
  behavior and must be declared. The reported TSP/QAP comparisons are not reproduced and no universal
  performance guarantee is asserted.
