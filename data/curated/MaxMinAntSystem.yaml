claims:
- claim_id: method
  kind: mechanism
  statement: 'Construct solutions by choosing feasible components with probabilities proportional to tau^alpha*eta^beta,
    as in Ant System. For positive-cost minimization, select one iteration-best or best-so-far solution
    according to the declared reinforcement schedule. Evaporate every trail using retention rho and add
    1/f(best) only to components of that selected solution, with zero deposit elsewhere. Clip the resulting
    trails to [tau_min,tau_max] after each iteration. The source initializes trails at a high value that
    is brought to the upper limit; this preserves initial exploration pressure relative to low trails.
    Its upper-limit estimate is tau_max=1/((1−rho)*f(best_so_far)), updated when the best cost improves.
    For the source’s TSP lower-limit heuristic, n is the number of cities and avg=n/2 approximates the
    number of choices at each step. The displayed formula uses unit pheromone exponent alpha=1, equal
    decision probabilities and negligible heuristic differences: with p_dec=p_best^(1/n), tau_min=tau_max*(1−p_dec)/((avg−1)*p_dec),
    capped at tau_max if larger. This is an approximate configuration rule, not the exact probability
    of reconstructing a real tour. Positive limits, 0<=rho<1, a valid denominator and declared handling
    of boundary parameters are required for this account.'
