aio_mappings:
- target: AIO:BayesianNetwork
  relation: related_match
  rationale: The diagnostic splits information about latent quantities in Bayesian hierarchical graphical
    models. BayesianNetwork provides representation context, not the INLA approximation or group-wise
    diagnostic; this is a related mapping, not an asserted subclass or equivalence.
limitations:
- This is the INLA linear-predictor specialization of node-conflict assessment, not the general INLA fitting
  algorithm, arbitrary separator splitting, or a simultaneous maxT adjustment.
- The paper’s posterior-as-prior description is not accepted as a general frozen nuisance cut. The inspected
  2026 ordinary integration path reweights hyperparameters using local data; historical releases, user-selected
  exceptional paths and runtime behavior remain unverified.
- Independent marginal replication and paired shared-nuisance replication have different covariances.
  Neither a normal approximation nor a pseudoinverse alone establishes null support, calibration or error
  control.
- The pinned helper’s absolute rank and relative pseudoinverse cutoffs can disagree and depend differently
  on scale. No correction to upstream R-INLA code or claim of a released fix is made.
- All 22 pages of arXiv v4 were read, including Figures 1–5, Table 1 and references. Its margin date is
  2017-11-01 and title-page date 2017-11-02. The one-dimensional introductory difference has inconsistent
  sign labels; the record consistently uses remaining minus within. A prose/Table 1 discrepancy is retained
  in the discovery notes without importing empirical values.
- Official source inspection is limited to the named revision and cited functions. No R-INLA installation,
  compilation, model fitting, MCMC, benchmark, biomedical inference or repeated-data calibration was performed.
  Constructed algebraic examples illustrate weighting, covariance and rank boundaries only.
