claims:
- claim_id: r427-exact-inter-worker-heterogeneity-cancellation-and-nonconvex-rate
  kind: mechanism
  statement: Whereas D-PSGD suffers a stationary drift proportional to outer gradient variance zeta^2 = (1/n) sum_{i=1}^n ||nabla f_i(x) - nabla f(x)||^2, D2's gradient difference G(X_t; xi_t) - G(X_{t-1}; xi_{t-1}) cancels the heterogeneous mean nabla f_i(x^*) at a stationary point X^* = [x^*, ..., x^*] (leaving only intra-worker sampling variance 2 n sigma^2) while preserving the global mean update X_bar_{t+1} = X_bar_t - gamma G_bar_t (Eq. 4), achieving the smooth non-convex convergence rate O(sigma / sqrt(n T)) completely independent of ongoing inter-worker variance zeta^2 (Section 5, Theorem 2, Corollary 3).
  evidence:
  - source_id: r427-primary-pdf
    locator: Section 4-5 Theoretical Analysis (Equation 4, Theorem 2, Corollary 3, Table 1) & Supplemental Material (Lemmas 4-8, Proof of Theorem 2)
    relation: supports
- claim_id: r427-mixing-matrix-eigenvalue-stability-threshold-minus-one-third
  kind: mechanism
  statement: Decomposing W = P Lambda P^T shows that each non-consensus eigenmode y_t^{(i)} (i >= 2) evolves according to the second-order characteristic polynomial r^2 - 2 lambda_i r + lambda_i = 0 with roots u_i, v_i = lambda_i +/- sqrt(lambda_i^2 - lambda_i) (Supplemental Lemma 6-7), which decay geometrically if and only if -1/3 < lambda_n(W) <= lambda_2(W) < 1; when lambda_n(W) <= -1/3, |v_n| >= 1 and the non-consensus mode diverges (Supplemental Material, lines 882-883).
  evidence:
  - source_id: r427-primary-pdf
    locator: Section 5 Assumption 1 & Supplemental Material (Lemmas 6-7, Equations 11-15)
    relation: supports
- claim_id: r427-indefinite-mixing-matrix-shift-and-two-step-memory-limitation
  kind: limitation
  statement: Requires the smallest eigenvalue of the mixing matrix W to satisfy lambda_n(W) > -1/3 (requiring a lazy self-weight shift (W + alpha I)/(1 + alpha) on bipartite graphs where lambda_n(W) = -1) and requires storing both the previous iterate X_{t-1} and previous stochastic gradient G(X_{t-1}; xi_{t-1}).
  evidence:
  - source_id: r427-primary-pdf
    locator: Section 4-5 Algorithm 1, Assumption 1 & Supplemental Material Lemma 7
    relation: supports
- claim_id: r427-non-iid-lenet-and-resnet-cifar10-decentralized-training-application
  kind: application
  statement: Applied to decentralized ring-topology training of LeNet and ResNet-20 on pathologically label-partitioned CIFAR-10 and MNIST where each worker holds only 1 or 2 classes, converging cleanly where D-PSGD diverges or stalls.
  evidence:
  - source_id: r427-primary-pdf
    locator: Section 6 Experiments (Figures 1-4), pp. 4853-4855
    relation: supports
