id: AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData
name: D2 (Decentralized Training over Decentralized Heterogeneous Data)
concept_kind: algorithm
review_status: DRAFT
definition: A heterogeneity-invariant decentralized stochastic optimization algorithm (Tang et al. 2018, Section 4, Algorithm 1, Equation 3) over a symmetric doubly stochastic mixing matrix W that eliminates the inter-worker data-heterogeneity variance zeta^2 of standard Decentralized Parallel SGD (D-PSGD) by replacing the single-step gossip update X_{t+1} = (X_t - gamma G(X_t; xi_t)) W with the two-step gradient-difference recurrence X_{t+1} = (2 X_t - X_{t-1} - gamma G(X_t; xi_t) + gamma G(X_{t-1}; xi_{t-1})) W initialized via X_1 = (X_0 - gamma G(X_0; xi_0)) W.
identity_notes: Distinct from centralized federated control-variate methods such as SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning) and FedDyn (AIMech:FedDynDynamicRegularizationForFederatedLearning), which require a central server to aggregate control variates or model states, and from compressed decentralized methods DCD-PSGD/ECD-PSGD (AIMech:DcdPsgdAndEcdPsgdCompressedDecentralizedParallelStochasticGradientDescent) and Choco-SGD (AIMech:ChocoSgdAndChocoGossipDecentralizedCompressedOptimization), whose convergence bounds depend on the inter-worker gradient dissimilarity zeta^2.
aliases:
