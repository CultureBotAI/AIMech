name: Iterative conditional estimation
definition: An incomplete-data parameter-estimation procedure that repeatedly replaces a chosen complete-data
  estimator by its conditional expectation given observed data under the current parameter estimate.
concept_kind: algorithm
identity_notes: ICE specifies expectation of an estimator, not maximization of an expected complete-data
  log likelihood as in EM. The estimator may be maximum likelihood, least squares or another supported
  complete-data estimator. Shared applications to hidden Markov models do not make ICE a model family,
  an ICM label optimizer or a synonym for every stochastic EM method. Its behavior depends on the selected
  estimator and parameterization. The short acronym is scoped to this estimation procedure. No normalized
  identity match was found across all 442 pinned AIO labels and all scoped synonyms and 394 preceding
  native IDs, names and aliases for these three concepts. Full-checkout fixed-string searches included
  ignored and hidden files in worktree and main, yielding 64 and 64 matched lines; all 44 unique contents
  were read. Hits represent neighboring records, citations and discovery leads rather than records of
  these identities. All 97 semantic label/synonym hits were read. Twenty-one fully annotated exact CLASS
  nodes and outgoing edges were verified identical to the preceding inspection, and three additional nodes
  were read. Twenty-eight contextual YAMLs were byte-verified after prior full reading and four freshly
  read, totaling 24 generated and eight native contextual records. Short acronyms were included in the
  complete normalized identity comparison. The absence assessment is bounded to the pin, native collection
  and inspected semantic neighborhood.
limitations:
- The complete-data estimator must be defined on posterior-supported completed data and have the required
  moments. Empty mixture components, boundary or infinite MLEs, constrained parameter spaces and nonidentifiability
  need explicit conventions; a conditional mean can leave a nonconvex parameter space.
- Conditional expectation is the least-squares approximation to an integrable squared-error target under
  a fixed law. That fact does not prove decreasing true parameter error, observed-likelihood monotonicity
  or global convergence across ICE iterations with changing laws.
- The Delmas equivalence uses the mean/expectation parameter psi, although the source calls it canonical;
  its natural parameter phi is distinct. The claim is not automatic for arbitrary coordinates, curved/constrained
  exponential families or boundary estimates. A nonlinear transformation does not generally commute with
  conditional expectation.
- For Gaussian mixtures, expectation of a complete-data class mean or variance containing a random class
  count differs in general from a ratio of expected sufficient statistics. The usual Gaussian-parameter
  ICE update therefore cannot simply be replaced by an EM update without checking the conditions.
- Monte Carlo approximation requires valid posterior sampling and appropriate convergence conditions.
  Correlated Gibbs samples, finite sample counts and apparently steady parameters do not by themselves
  certify exact expectations or convergence. A one-sample version can resemble stochastic EM for a specific
  complete-data estimator; it is not every stochastic-approximation EM algorithm.
- The inspected examples in Delmas contain scaling/covariance notation issues, and its introductory suggestion
  that mixed discrete-continuous data make likelihood irrelevant is not adopted. The definition and qualified
  coordinate comparison do not certify all printed example formulas. Neither inspected paper provides
  a universal empirical performance guarantee; no fitting, benchmark or author-code run was performed.
