claims:
- claim_id: method
  kind: mechanism
  statement: Let observed data be y and hidden data h, and choose a complete-data estimator T(h,y) of
    a parameter theta. From a valid current theta_k, set theta_(k+1)=E_(theta_k)[T(H,y)|Y=y], when this
    expectation exists and remains admissible. A finite hidden space permits a posterior-weighted sum;
    otherwise average T over appropriate posterior samples as a Monte Carlo approximation. This average
    is taken after evaluating the estimator on each completed datum. It generally differs from applying
    a nonlinear estimator to expected sufficient statistics. With a complete-data maximum-likelihood estimator,
    ICE averages an argmax, whereas EM takes an argmax after averaging the log likelihood. For a regular
    full identifiable exponential family with a valid finite interior complete-data MLE and an invertible
    mean-parameter map, the expectation coordinate psi=E_theta[s(H,Y)] has complete-data estimator s(H,Y),
    so ICE and EM coincide in that coordinate. Nonlinear reparameterization need not preserve equality
    of their updates.
