- claim_id: concentration-set-minimality-and-benjamini-hochberg-sandwich-bounds
  kind: mechanism
  statement: 'Defining the concentration set Z_alpha = L_{z_alpha} of the z_alpha smallest p-values and
    the Benjamini-Hochberg rejection set B_alpha = L_{b_alpha} with b_alpha = max{1 <= i <= m : m * p_{(i)}
    <= i * alpha} (Equation 11), Lemma 4 proves that: (1) d_alpha(S) = d_alpha(S cap Z_alpha) for every
    S subseteq {1, ..., m}, so no hypothesis outside Z_alpha contributes to any non-trivial discovery
    bound; (2) Z_alpha is the unique minimal set with property (1) (if d_alpha(S) = d_alpha(S cap Y) for
    all S, then Z_alpha subseteq Y); (3) d_alpha(Z_alpha) = m - h_alpha; and (4) m - h_alpha <= z_alpha
    <= b_alpha (Z_alpha subseteq B_alpha), yielding the universal discovery sandwich |S cap R_alpha| <=
    d_alpha(S) <= |S cap Z_alpha| <= |S cap B_alpha| and the non-trivial BH-set FDP bound q_alpha(B_alpha)
    = (b_alpha - m + h_alpha) / b_alpha < 1 whenever b_alpha > 0. Moreover, for any q in [0, 1], Lemma
    5 proves alpha * q_alpha(B_q) <= pi_hat_alpha * q (with equality iff pi_hat_alpha * q = 0, and more
    strongly q_alpha(B_q) <= pi_hat_alpha * q / alpha - 1 / b_q when b_q > 0 and pi_hat_alpha * q > 0),
    strictly improving upon the Lehmann-Romano (2005) Markov bound q / alpha simultaneously over all q
    and bounding the simultaneously median-unbiased estimator q_hat(B_q) = q_{1/2}(B_q) <= 2 * q * pi_hat_{1/2}
    (Equation 12).'
  evidence:
  - source_id: gmks2019-pdf
    locator: Section 5, Pages 8-11, Equations (11)-(12), Lemmas 4-5, Figure 2; Appendix A, Pages 19-20,
      Equation (20)
    relation: supports
- claim_id: simes-detectability-limit-and-non-vanishing-non-consonant-power
  kind: mechanism
  statement: 'Under Efron''s mixture model P_n(x) = gamma * x + (1 - gamma) * P_{1,n}(x) (Equation 13)
    with independent (or Glivenko-Cantelli weakly dependent) p-values, as m -> infty at fixed sample size
    n, Lemma 6 and Lemma 7 prove that pi_hat_alpha = h_alpha / m ->^P bar_pi_alpha = inf_{0 <= x < 1}
    (1 - P(x * alpha)) / (1 - x) > 0 when P(alpha) < 1 (and 0 otherwise). While Hommel''s elementary FWER
    rejection set R_alpha = {1 <= i <= m : h_alpha * p_i <= alpha} has vanishing discovery fraction |R_alpha|
    / m ->^P 0 whenever P(alpha) < 1 and P(0) = 0 (Equation 14), Theorem 2 proves that for any q in [0,
    1] such that P is Simes-detectable at q * alpha (meaning bar_pi_{q*alpha} < 1, i.e., P(x * q * alpha)
    > x for some x in [0, 1) or P(q * alpha) = 1), the data-dependent set J_m = B_{tilde_alpha_m, m} with
    tilde_alpha_m = q * alpha * bar_pi_alpha / pi_hat_{alpha,m} satisfies q_alpha(J_m) <= bar_pi_alpha
    * q for all m and lim_{m -> infty} P(|J_m| / m >= y) = 1 for some y > 0, establishing non-vanishing
    average discovery power driven asymptotically by non-consonant rejections.'
  evidence:
