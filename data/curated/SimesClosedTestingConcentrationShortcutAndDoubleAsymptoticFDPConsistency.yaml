claims:
- claim_id: hommel-h-characterization-and-exact-linear-time-all-subset-shortcut
  kind: mechanism
  statement: 'In closed testing with Simes local tests I in U_alpha iff min_{1 <= i <= |I|} |I| * p_{(i:I)}
    / i <= alpha, Hommel''s worst-case non-rejected intersection size h_alpha = max{0 <= i <= m : K_i
    not in U_alpha} (computed in O(m log m) time via bisection on the i largest p-values K_i = {r_{m-i+1},
    ..., r_m}) satisfies t_alpha({1, ..., m}) = h_alpha, yielding the (1 - alpha)-upper confidence bound
    pi_hat_alpha = h_alpha / m on the true null proportion |T| / m (Lemma 1, Equation 9), and characterizes
    closed-testing rejections via I in X_alpha iff exists 1 <= i <= |I| such that h_alpha * p_{(i:I)}
    <= i * alpha (Lemma 2). Consequently, for every nonempty subset S subseteq {1, ..., m}, the simultaneous
    (1 - alpha)-lower confidence bound on true discoveries d_alpha(S) = |S| - t_alpha(S) is given exactly
    by d_alpha(S) = max_{1 <= u <= |S|} (1 - u + |{i in S : h_alpha * p_i <= u * alpha}|) (Theorem 1,
    Equation 10), where the maximizing u is bounded above by z_alpha - m + h_alpha + 1 with z_alpha =
    min{m - h_alpha <= i <= m : h_alpha * p_{(i)} <= (i - m + h_alpha + 1) * alpha} for h_alpha < m and
    0 for h_alpha = m (Lemma 3), allowing exact evaluation in O(|S|) time via counting sort on c_i = ceil(h_alpha
    * p_i / alpha) and strictly improving upon the approximate O(|S|^2) shortcut of Goeman & Solari (2011)
    (e.g., on the Figure 1 example with m = 4 and alpha/2 < p_1 <= p_2 <= p_3 <= 2*alpha/3 < alpha < p_4,
    where R_alpha = empty, t_alpha({1,2,3}) = 1 < |{1,2,3} \ R_alpha| = 3, and t_alpha({1,2}) = 1 whereas
    the 2011 shortcut fails on L_2 = {1,2} with bound 2).'
  evidence:
