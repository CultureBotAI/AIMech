limitations:
- 'Finite-sample validity of Simes-based closed testing requires the Simes inequality P(exists 1 <= i
  <= |T| : |T| * p_{(i:T)} <= i * alpha) <= alpha (Equation 5) to hold for the true null intersection
  hypothesis T, which holds under independence and certain positive dependence structures (e.g., MTP_2
  / PRDS) but can be violated under arbitrary negative oradversarial dependence.'
- 'Double-limit consistency plim_{(m,n) -> infty} q_{alpha,m,n}(S_m) = gamma_S (Theorem 3) critically
  requires both m -> infty and n -> infty and a non-vanishing subset proportion plim_{m -> infty} |S_m|
  / m = c > 0 (Equation 17): if m is fixed while n -> infty, the probability of underestimating pi(S_m)
  does not vanish; if c = 0 (such as singleton sets |S_m| = 1 or vanishing sets), the reference line endpoint
  alpha * |S_m| / h_{m,n} -> 0 competes with the alternative convergence rate and the double-limit result
  fails (Section 7, page 15).'
- 'Primary-source typographical notes verified in arXiv:1611.06739v2: (1) in Section 4 (page 7, line 4),
  the review of the Goeman & Solari (2011) shortcut on L_j writes ''t_alpha(L_j) <= |S| - d'' instead
  of ''t_alpha(L_j) <= |L_j| - d'' (or ''j - d''); (2) in Section 4 (page 8, paragraph before Lemma 3),
  the prose states ''we may restrict the values of u that need to be considered further to u <= z_alpha'',
  whereas Lemma 3 immediately below gives the exact shifted upper bound ''1 <= u <= z_alpha - m + h +
  1''; (3) in the caption of Figure 2 (page 10), ''(i + 1, p_i)'' is printed with un-ordered subscript
  p_i instead of ordered p_{(i)}; and (4) in the proof of Theorem 3 (page 23, 3 lines from bottom), ''If
  gamma > 0 we have P_n(alpha) <= P(alpha) < alpha'' prints ''< alpha'' where P(alpha) = 1 - gamma + alpha
  * gamma < 1 (the condition P(alpha) < 1 required by Lemma 6).'
- All 27 pages of the full-text PDF of Goeman, Meijer, Krebs, & Solari (2019, Biometrika 106(4):841-856,
  arXiv:1611.06739v2, DOI:10.1093/biomet/asz041) were read. Constructed numerical checks in research/discovery/simes-closed-testing-concentration-shortcut-and-fdp-consistency-boundaries.py
  verify (1) Section 3 Figure 1 non-consonant rejections and failure of the Goeman-Solari (2011) shortcut
  on L_2 = {1,2}, (2) Lemmas 1-5 and Theorem 1 across all 256 subsets of an 8-hypothesis problem, and
  (3) Lemma 6, Theorem 2 non-vanishing power vs. vanishing Hommel FWER power, and Theorem 3 double-limit
  consistency.
