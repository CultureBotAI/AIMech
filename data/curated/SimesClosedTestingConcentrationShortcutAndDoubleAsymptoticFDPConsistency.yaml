- claim_id: double-asymptotic-fdp-consistency-at-arbitrary-relative-rates
  kind: mechanism
  statement: For any infinite target subset S subseteq N whose finite-m truncation S_m = S cap {1, ...,
    m} has non-vanishing relative size plim_{m -> infty} |S_m| / m = c > 0 (Equation 17) and whose conditional
    p-value distribution P^S_n(x) = gamma_S * x + (1 - gamma_S) * P^S_{1,n}(x) (Equation 15) has a consistent
    alternative lim_{n -> infty} P^S_{1,n}(x) = 1 for all x in (0, 1] that is weakly increasing in n (Equation
    16), Theorem 3 and Hildebrandt's iterated-limit theorem (Lemma 8) prove that for every fixed confidence
    level alpha in (0, 1), plim_{(m,n) -> infty} q_{alpha,m,n}(S_m) = gamma_S = plim_{m -> infty} pi(S_m)
    at arbitrary relative growth rates of m and n, whereas the Benjamini-Hochberg rejection set at fixed
    alpha satisfies plim_{(m,n) -> infty} |B_{alpha,m,n}| / m = (1 - gamma) / (1 - alpha * gamma) > 1
    - gamma whenever gamma > 0.
  evidence:
