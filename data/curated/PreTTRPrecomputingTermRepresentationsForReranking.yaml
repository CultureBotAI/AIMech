claims:
- claim_id: prettr-lower-layer-cross-segment-attention-masking-and-split-execution
  kind: mechanism
  statement: 'PreTTR masks cross-segment attention in layers L_1, ..., L_l so query tokens ([CLS]; q; [SEP]) and document tokens (d; [SEP]) attend only within their own segments, while removing the mask in layers L_{l+1}, ..., L_n (Section 4.1, Figures 1-2): this makes index-time document encoding through layers 1..l mathematically independent of the query, reduces query-time Transformer layer traversal cost by approximately (n - l) / n, and further accelerates layer L_n by computing only the [CLS] output representation used by W_combine (Equation 1 & Section 6.3).'
  evidence:
  - source_id: r780-primary-pdf
    locator: Sections 3-4.1 & 6.3, Figures 1-2 & Equation 1, pp. 3-5, 8
    relation: supports
  - source_id: r780-primary-pdf
    locator: self_attention_layer() verification of zero difference between masked joint and decoupled index/query encoding
    relation: supports
- claim_id: prettr-gelu-token-compression-with-upper-layer-attention-mse-loss
  kind: mechanism
  statement: To compress the layer-l token representations s_l in R^{m x d} before disk storage, PreTTR inserts a bottleneck encoder r = GELU(s_l W_comp + b_comp) in R^{m x e} (e < d) and linear batch-normalized decoder s_hat_l in R^{m x d} between layers L_l and L_{l+1}, pre-training the compression parameters on unlabeled text to minimize the average mean squared error of the upper-layer attention score tensors L(a_{l+1}, ..., a_n, a_hat_{l+1}, ..., a_hat_n) = (1 / (n - l)) * sum_{i=l+1}^n MSE(a_i, a_hat_i) (Equation 2) prior to end-to-end relevance fine-tuning (Section 4.2).
  evidence:
  - source_id: r780-primary-pdf
    locator: Section 4.2, Equation 2, p. 5
    relation: supports
  - source_id: r780-primary-pdf
    locator: compress_decompress() and attention_mse_loss() verification
    relation: supports
- claim_id: prettr-webtrack-and-robust04-speedup-and-storage-reduction-application
  kind: application
  statement: 'On TREC WebTrack 2012 and TREC Robust 2004, PreTTR accelerates Vanilla BERT top-100 document re-ranking by up to 42.2x at l = 11 on WebTrack (0.046s vs. 1.941s per query with no statistically significant loss in P@20: 0.3380 vs. 0.3460, Tables 3 & 5) and 9.2x at l = 10 on Robust04 (0.266s vs. 2.437s), generalizes to RoBERTa (up to 56.3x speedup) and DistilBERT (up to 24.1x speedup, Table 6), and reduces ClueWeb09-B token storage by up to 97.5% (from 112 TB to 2.8 TB) when combining spam filtering, e = 128 compression, and 16-bit floats (Section 6.2, p. 7).'
  evidence:
  - source_id: r780-primary-pdf
    locator: Section 6, Tables 3-6, pp. 7-9
    relation: supports
- claim_id: prettr-per-token-storage-footprint-and-high-layer-graded-relevance-limitation
  kind: limitation
  statement: Even with e = 128 compression and 16-bit floating-point storage, storing per-token representations for web-scale corpora requires multiple terabytes (2.8 TB on ClueWeb09-B and 195 GB at e = 256 on Robust04, Section 6.2), and deferring query-document interaction until the final layer (l = 11) significantly degrades graded relevance metrics (ERR@20 on WebTrack and both P@20 and nDCG@20 on longer Robust04 queries, Table 3 & Section 6.4).
  evidence:
  - source_id: r780-primary-pdf
    locator: Sections 6.1-6.2 & 6.4, Tables 3-4, pp. 7-9
    relation: supports
