id: AIMech:PreTTRPrecomputingTermRepresentationsForReranking
name: PreTTR Precomputing Transformer Term Representations
concept_kind: architecture
review_status: DRAFT
definition: "A decoupled-layer Transformer document re-ranking architecture and token-representation compression method that applies a cross-segment attention mask in the first l layers L_1, ..., L_l of an n-layer Transformer during training\u2014preventing query tokens ([CLS]; q; [SEP]) from attending to document tokens (d; [SEP]) and vice versa\u2014so that layer-l document token representations s_l in R^{m x d} can be precomputed offline at index time, compressed to dimension e < d via a GELU bottleneck encoder-decoder pre-trained to minimize mean squared error on the attention score matrices of the remaining n - l layers, and concatenated at query time with the layer-l query representations to execute only layers L_{l+1}, ..., L_n (computing only the [CLS] token in the final layer L_n)."
identity_notes: Distinct from ColBERT (AIMech:ColBERTContextualizedLateInteraction), which encodes queries and documents completely independently through all Transformer layers and interacts only via a parameter-free sum-of-MaxSim dot-product operator at the output; and distinct from standard cross-encoder Transformer distillation (such as TinyBERT or DistilBERT), which reduces total layer count for both query and document at query time rather than precomputing the first l document layers at index time and executing only the upper n - l interaction layers online.
aliases:
- PreTTR
- Precomputing Transformer Term Representations
- PreTTR Split-Layer Transformer Re-Ranking
