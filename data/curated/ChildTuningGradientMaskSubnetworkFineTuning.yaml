claims:
- claim_id: r716-claim-task-free-variance
  kind: mechanism
  statement: Task-free Child-Tuning_F samples a binary gradient mask M_t ~ Bernoulli(p_F) at each iteration and scales reserved gradients by 1/p_F to preserve unbiased expectation E[Delta w] = -eta dL/dw while increasing update covariance Sigma[Delta w] = (eta^2 sigma_g^2 / (p_F |B|)) I_k + ((1 - p_F) eta^2 / p_F) diag(dL/dw)^2, encouraging convergence to flatter local minima with lower sharpness rho <= O(1/sigma^2).
  evidence:
  - source_id: r716-primary-pdf
    locator: Section 2.2 & Appendix E, Theorems 1-2, Equations 4-9 and 11-25, pp. 3, 13-15
    relation: supports
- claim_id: r716-claim-task-driven-fisher
  kind: mechanism
  statement: Task-driven Child-Tuning_D estimates task-specific parameter importance before fine-tuning via the empirical diagonal Fisher Information Matrix F^(i)(w) = (1/|D|) sum_{j=1}^{|D|} (d log p(y_j|x_j; w)/dw^(i))^2 on downstream labeled data D and freezes the complement of the top-p_D child network C_0 = ... = C_T to its pretrained weights w_0 throughout optimization.
  evidence:
  - source_id: r716-primary-pdf
    locator: Section 2.3, Equation 10, p. 4
    relation: supports
- claim_id: r716-claim-glue-transfer-application
  kind: application
  statement: Across BERT_LARGE, XLNet_LARGE, RoBERTa_LARGE, and ELECTRA_LARGE on GLUE tasks (CoLA, RTE, MRPC, STS-B), Child-Tuning improves average score by 1.50 to 8.60 points over vanilla fine-tuning, boosts out-of-domain NLI transfer by up to 1.53 points and cross-task transfer by up to 7.06 points, and combines orthogonally with R3F for a +1.84 point gain on BERT_LARGE.
  evidence:
  - source_id: r716-primary-pdf
    locator: Section 3.3-4.1, Tables 1-3, Figure 2, pp. 5-7
    relation: supports
- claim_id: r716-claim-non-child-retention-limitation
  kind: limitation
  statement: Unlike model pruning, Child-Tuning requires retaining all non-child parameters at their pretrained values during both training and inference; zeroing out non-child parameters after Child-Tuning_D reduces average accuracy across CoLA, RTE, MRPC, and STS-B by 33.89 points and causes complete collapse (0.00 Matthews correlation) on CoLA.
  evidence:
  - source_id: r716-primary-pdf
    locator: Section 4.3, Table 5, pp. 7-8
    relation: supports
