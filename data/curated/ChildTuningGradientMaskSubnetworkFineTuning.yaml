id: AIMech:ChildTuningGradientMaskSubnetworkFineTuning
name: Child-Tuning Gradient-Masked Subnetwork Fine-Tuning
concept_kind: algorithm
review_status: DRAFT
definition: A fine-tuning algorithm for large-scale pretrained language models that executes the forward pass across the entire pretrained network while masking out backward gradients outside a selected parameter subset (the child network) via a binary gradient mask w_{t+1} = w_t - eta * (dL(w_t)/dw_t odot M_t), where the child network is chosen either in a task-free manner by drawing M_t ~ Bernoulli(p_F) with 1/p_F unbiased gradient scaling (Child-Tuning_F) or in a task-driven manner by selecting the top-p_D fraction of parameters with the highest empirical diagonal Fisher information F^(i)(w) = (1/|D|) sum_j (d log p(y_j|x_j; w)/dw^(i))^2 prior to training (Child-Tuning_D).
identity_notes: Distinct from model pruning (which removes non-selected parameters during inference, causing severe accuracy collapse when applied to the non-child complement), from Mixout (Lee et al., ICLR 2020, which stochastically swaps parameters with pretrained weights), and from Diff-Pruning or Adapter tuning (which introduce extra trainable masks or bottleneck modules aimed at storage reduction rather than full-network forward pass with backward gradient masking).
aliases:
- Child-Tuning
- Child-Tuning_F and Child-Tuning_D
- Child Network Gradient-Masked Fine-Tuning
