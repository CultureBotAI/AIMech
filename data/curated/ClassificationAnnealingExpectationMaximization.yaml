name: Classification Annealing Expectation Maximization
aliases:
- Classification Annealing EM
- CAEM
concept_kind: algorithm
definition: A stochastic hard-clustering algorithm that samples component assignments from current mixture
  posterior probabilities raised to an inverse positive temperature, maximizes the completed-data classification
  likelihood, and lowers the temperature according to a chosen schedule.
identity_notes: 'The Celeux-Govaert CAEM construction changes the random label distribution within classification
  EM. It differs from deterministic tempered EM, decreasing-step sufficient-statistic SAEM, and Metropolis
  simulated annealing with an accept/reject transition. Temperature one recovers the SEM assignment law;
  the low-temperature limit concentrates on maximal posterior components but retains random choice among
  ties. No normalized identity matches among 442 pinned and 473 maintained records, including the bare
  acronym probes. Existing supplemented EM and cross-entropy optimization are distinct methods; qualified
  aliases avoid claiming SEM or CEM as unique names. ICE, MCEM, SAEM, deterministic tempered EM, simulated
  annealing and k-means provide neighboring but different scopes. Existing stochastic-EM frontier and
  incidental references are not records of the new identities. The absence assessment is bounded to this
  snapshot and corpus. Identity-search counts: 227 matched lines in the worktree and 245 in main; all
  137 distinct matching-text windows were read, with ignored and hidden files included.'
