aio_mappings:
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: The defining procedure estimates a hard grouping of unlabeled observations alongside fitted
    component parameters. The pinned target is a clustering task, so the algorithm is related without
    an is-a assertion. The word classification in the historical name does not identify the explicitly
    supervised AIO:Classification class.
claims:
- claim_id: powered-posterior
  kind: mechanism
  statement: At temperature tau_m>0, set s_ik proportional to [p_k f_k(x_i)]^(1/tau_m), equivalently t_ik^(1/tau_m),
    and normalize across components. Draw a hard label independently for each observation from s_i and
    maximize the corresponding completed-data likelihood. The power applies to the entire weight-times-density
    product. The next iteration uses the updated parameters and scheduled temperature; it is not a fractional-responsibility
    M-step or a Metropolis acceptance test.
  evidence:
  - source_id: cem-source
    locator: Section 4.2 Eq4.6, p.11 / PDF13; Section 3 M-step, p.5 / PDF7
    relation: supports
- claim_id: endpoint-and-ties
  kind: scope
  statement: At tau=1, the assignment law equals SEM. Holding positive component scores fixed while tau
    approaches zero concentrates mass on maximal scores; with multiple tied maxima, their limiting probabilities
    are equal rather than the smallest-index tie choice specified for deterministic CEM. Literal division
    by tau=0 is undefined. This fixed-score limit does not establish that a changing-parameter cooling
    run converges to a global solution.
  evidence:
  - source_id: cem-source
    locator: Section 4.2 Eq4.6 and SEM/CEM interpolation discussion, p.11 / PDF13; Section 3 tie rule,
      p.5 / PDF7; curator temperature and tie calculations
    relation: supports
- claim_id: schedule-and-stopping
  kind: limitation
  statement: The report gives geometric cooling tau_(m+1)=a*tau_m as a practical choice and explicitly
    says its analogous CAEM convergence result has not yet been proved. The printed range includes a=1,
    which does not cool. Its experiments use a=0.97 and stop when a partition is unchanged; an unchanged
    stochastic partition over a finite comparison is not proof of future absorption. Neither a geometric
    schedule nor the simulated-annealing analogy supplies a global-convergence guarantee.
  evidence:
  - source_id: cem-source
    locator: Section 4.2 cooling and convergence discussion, p.12 / PDF14; Section 5 experimental settings,
      pp.12-13 / PDF14-15
    relation: supports
limitations:
- Positive temperature does not repair zero component scores, empty sampled classes or inadmissible completed-data
  fits. These require the selected model and explicit restart, constraint or deletion rules; such changes
  alter the procedure.
- The source’s informal SAEM blend on p.12 repeats EM in both terms despite referring to a stochastic
  contribution. The unseen original annealed-SAEM method is not inferred from that printed expression
  or merged with CAEM.
- The 1991 report’s empirical settings and tables do not establish an optimal schedule, a universal ranking,
  statistical uncertainty calibration or semantic correctness of clusters. The final 1992 journal full
  text and author code were not obtained.
- No author implementation or historical numerical experiment was reproduced. Finite curator calculations
  check formula boundaries, not empirical performance or a repaired convergence proof.
