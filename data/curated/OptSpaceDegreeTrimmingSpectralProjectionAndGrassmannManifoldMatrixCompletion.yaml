claims:
- claim_id: claim-degree-trimming-and-rank-r-spectral-projection-rmse-bound
  kind: mechanism
  statement: In the sparse regime $|E| = \Theta(n)$, the untrimmed observed matrix $M^E$ possesses maximum vertex degree $\Theta(\log n / \log\log n)$ whose localized singular values $\Omega(\sqrt{\log n/\log\log n}\,M_{\min})$ overwhelm the true signal singular values $\Theta((|E|/n)M_{\min})$; zeroing rows with degree $> 2|E|/m$ and columns with degree $> 2|E|/n$ produces $\widetilde{M}^E$ whose rank-$r$ projection $\mathrm{T}_r(\widetilde{M}^E)$ satisfies $\|M - \mathrm{T}_r(\widetilde{M}^E)\|_F / \|M\|_F \le C \kappa^2 (\frac{\alpha r n}{|E|})^{1/2}$ with high probability (Theorem 1.1 & Lemma 5.1).
  evidence:
  - source_id: kmo2010-optspace-pdf
    locator: Section 1.1-1.2, Theorem 1.1, pp. 2981-2982; Section 3 & 5, Lemma 3.2 & Lemma 5.1, pp. 2984-2988
    relation: supports
  - source_id: kmo2010-optspace-abs
    locator: Abstract
    relation: supports
- claim_id: claim-grassmann-manifold-local-parabolic-curvature-and-exact-completion-theorem
  kind: mechanism
  statement: Minimizing the variable-projected cost $F(X,Y) = \min_{S\in\mathbb{R}^{r\times r}} \mathcal{F}(X,Y,S)$ on the Grassmann product manifold $\mathrm{G}(m,r)\times\mathrm{G}(n,r)$ initialized at $(X_0,Y_0)$ from $\mathrm{T}_r(\widetilde{M}^E)$ satisfies quadratic upper and lower bounds $C_1 \epsilon \sigma_{\min}^2 d((X,Y),(U,V))^2 \le F(X,Y) \le C_2 \epsilon \sigma_{\max}^2 d((X,Y),(U,V))^2$ (Lemma 6.4) and positive geodesic second derivative $\frac{\mathrm{d}^2}{\mathrm{d}t^2}F(X(t),Y(t))|_{t=0} \ge C_1\epsilon^2 \sigma_{\min}^4 d((X,Y),(U,V))^2 - C_2\epsilon \sigma_{\max}^2 d((X,Y),(U,V))^3$ along the geodesic connecting $(X,Y)$ to $(U,V)$ (Lemma 6.5), guaranteeing exact matrix completion $\lim_{k\to\infty} X_k S_k Y_k^\top = M$ once $|E| \ge C\kappa^6 n r \max(\mu_0 \log n, \mu_0^2 r \kappa^4)$ (Theorem 1.2).
  evidence:
  - source_id: kmo2010-optspace-pdf
    locator: Section 1.3-1.4, Theorem 1.2, pp. 2982-2983; Section 6, Remark 6.1, Equations (24)-(31), & Lemmas 6.4-6.5, pp. 2988-2995
    relation: supports
  - source_id: kmo2010-optspace-cr
    locator: IEEE Transactions on Information Theory 56(6):2980-2998 (2010) metadata
    relation: supports
- claim_id: claim-scope-equivalence-of-geodesic-chordal-and-projection-metrics-on-grassmann-manifolds
  kind: scope
  statement: Remark 6.1 (Equation 24) establishes global bi-Lipschitz equivalence on $\mathrm{G}(m,r)$ between the geodesic distance $d_g(X_1,X_2) = \sqrt{\sum_{i=1}^r \theta_i^2}$, chordal distance $d_c(X_1,X_2) = \sqrt{\sum_{i=1}^r (2\sin(\theta_i/2))^2}$, and projection distance $d_p(X_1,X_2) = \frac{1}{\sqrt{2}m}\|X_1 X_1^\top - X_2 X_2^\top\|_F = \sqrt{\sum_{i=1}^r \sin^2\theta_i}$ via $\frac{1}{\pi}d_g \le \frac{1}{\sqrt{2}}d_c \le d_p \le d_c \le d_g$.
  evidence:
  - source_id: kmo2010-optspace-pdf
    locator: Section 6.1, Remark 6.1 & Equations (24)-(27), pp. 2989-2990
    relation: supports
- claim_id: claim-limitation-incoherence-conditions-and-sixth-power-condition-number-scaling
  kind: limitation
  statement: OptSpace's exact recovery guarantee (Theorem 1.2) requires incoherence conditions A0 ($\|u_i\|^2 \le \mu_0 r/m$, $\|v_j\|^2 \le \mu_0 r/n$) and A1 ($|M_{ij}| \le \mu_1 \sqrt{r/(mn)}\sigma_1$), and its sample complexity scales with the sixth to tenth power of the condition number $\kappa = \sigma_{\max}/\sigma_{\min}$.
  evidence:
  - source_id: kmo2010-optspace-pdf
    locator: Section 1.4, Equations (5)-(7) & Theorem 1.2, p. 2983
    relation: supports
