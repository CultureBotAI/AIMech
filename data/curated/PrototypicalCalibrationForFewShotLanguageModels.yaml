claims:
- claim_id: proca-gmm-log-probability-cluster-estimation
  kind: mechanism
  statement: Given an N-way classification task, PROCA normalizes the language model's label-token logits into an N-dimensional log-probability vector x for each unlabeled example in an estimate set D_esti and estimates N prototypical Gaussian clusters P_G(X | mu_n, Sigma_n) using the Expectation-Maximization algorithm.
  evidence:
  - source_id: r736-primary-pdf
    locator: Section 3.1, pp. 3-4, Equations 1-3
    relation: supports
- claim_id: proca-bipartite-matching-and-weights-cutting-inference
  kind: mechanism
  statement: PROCA assigns the N estimated clusters to the N target labels by maximizing the Cluster-Label Assignment score CLA(e, k) = sum_{n=1}^N mu_{n, k_n} via the Kuhn-Munkres weighted bipartite matching algorithm, selects the EM run e* that maximizes CLA(e, k*(e)), and classifies each test example by argmax_n P_G(x | mu_n*, Sigma_n*) while discarding the mixture weights alpha_n to remain robust under class imbalance.
  evidence:
  - source_id: r736-primary-pdf
    locator: Section 3.2-3.4, pp. 4-5, Equations 4-7
    relation: supports
- claim_id: proca-zero-and-few-shot-text-classification-application
  kind: application
  statement: PROCA is applied to zero- and few-shot classification across GPT-2, GPT-Neo, GPT-J, and BLOOM-176B on nine text classification benchmarks (SST-2, SST-5, MR, Subj, AP, AGNews, DBPedia, RTE, and TREC), improving accuracy by an average of 13% over standard argmax decoding and 6% over Contextual Calibration while sharply reducing sensitivity to prompt templates and demonstration permutations.
  evidence:
  - source_id: r736-primary-pdf
    locator: Section 4.1-4.4, pp. 5-8, Table 1 & Figures 4-6
    relation: supports
  - source_id: r736-metadata-cr
    locator: DBLP bibliographic record Zhixiong Han et al.
    relation: supports
- claim_id: proca-closed-label-space-limitation
  kind: limitation
  statement: PROCA requires a fixed, closed N-class label space to fit an N-component Gaussian Mixture Model and solve the N-by-N bipartite cluster-label assignment, making it inapplicable to open-ended text generation or free-form question answering.
  evidence:
  - source_id: r736-primary-pdf
    locator: Section 6, p. 10
    relation: supports
