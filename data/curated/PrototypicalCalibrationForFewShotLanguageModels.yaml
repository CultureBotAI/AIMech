id: AIMech:PrototypicalCalibrationForFewShotLanguageModels
name: Prototypical Calibration for Few-Shot Language Models
concept_kind: algorithm
review_status: DRAFT
definition: A decision-boundary calibration algorithm for zero- and few-shot language model classification (PROCA) that models the N-dimensional log-probability output vectors over an unlabeled in-domain estimate set as an N-component Gaussian Mixture Model estimated via Expectation-Maximization, aligns the learned prototypical Gaussian clusters to the N target categories by solving a maximum-weight bipartite matching problem on the cluster mean coordinates, selects the highest-scoring EM run, and classifies test inputs by assigning them to the cluster with maximum Gaussian density while discarding mixture weights.
identity_notes: Distinct from Contextual Calibration (AIMech:CalibrateBeforeUseContextualCalibration) and Domain-Conditional PMI (AIMech:PMIDCDomainConditionalPointwiseMutualInformation), which apply diagonal scaling or subtract a single content-free/domain-premise baseline probability rather than estimating full class-conditional Gaussian covariances and means over the output distribution of an unlabeled estimate set. Also distinct from Prototypical Networks in metric meta-learning, which compute Euclidean distances to labeled support-set averages in a learned encoder representation space rather than fitting an unsupervised GMM with bipartite matching over frozen language-model log-probability outputs.
aliases:
- PROCA
- Prototypical Calibration
- GMM-Based Prototypical Decision Boundary Calibration
