claims:
- claim_id: claim-01
  kind: mechanism
  statement: For any N x N positive semidefinite L-ensemble kernel L = sum_{n=1}^N lambda_n v_n v_n^T, Proposition 3.1 (Equations 8-10) proves that the k-DPP distribution P_L^k(Y) = det(L_Y) / sum_{|Y'|=k} det(L_{Y'}) decomposes as the mixture of rank-k elementary projection DPPs P_L^k(Y) = (1 / e_k(lambda_1, ..., lambda_N)) sum_{|J|=k} (prod_{n in J} lambda_n) P^{V_J}(Y), where the partition function sum_{|Y|=k} det(L_Y) = e_k(lambda_1, ..., lambda_N) is computed exactly in O(N k) operations via the recurrence e_l^n = e_l^{n-1} + lambda_n e_{l-1}^{n-1} with base cases e_0^n = 1 and e_l^0 = 0 for l > 0 (Algorithm 2, Equation 12).
  evidence:
  - source_id: r334-primary-pdf
    locator: Section 3.1, Equations 5-8, p. 1195; Section 3.3, Proposition 3.1, Equations 9-12, and Algorithm 2, pp. 1196-1197
    relation: supports
  - source_id: r334-arxiv-abs
    locator: Abstract and Section 5 (k-DPPs for fixed-size diverse subset selection)
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Given the eigendecomposition of L (or of the dual Gram matrix B^T B when L = B B^T with B in R^{D x N} and D << N), Algorithm 1 draws an exact sample Y ~ P_L^k in O(N k^2) time by first backward-sampling an index subset J subseteq {1, ..., N} of size |J| = k using the conditional inclusion probabilities Pr(n in J | l remaining) = lambda_n e_{l-1}^{n-1} / e_l^n in O(N k) time, and then sequentially selecting k items from the elementary projection DPP P^{V_J} with probabilities (1/|V|) sum_{v in V} (v^T e_i)^2 followed by orthogonal projection of V onto the subspace perpendicular to e_i.
  evidence:
  - source_id: r334-primary-pdf
    locator: Section 2.2, Lemma 2.1 (Equation 4), p. 1194; Section 3.3-3.4, Algorithm 1 and High-Dimensional Dual Representation, pp. 1196-1197
    relation: supports
  - source_id: r334-metadata-cr
    locator: Foundations and Trends in Machine Learning 5(2-3):123-286 bibliographic record
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Exact k-DPP normalization and sampling require full eigendecomposition of the N x N kernel L (costing O(N^3) time, or O(N D^2) when a rank-D feature factorization L = B B^T is available and k <= D), and unlike standard unconditioned DPPs whose marginal kernels K = L(L+I)^{-1} have closed-form subset marginals det(K_A), k-DPPs are scale-invariant (P_{alpha L}^k = P_L^k) and do not admit a single PSD marginal kernel K representing all higher-order inclusion probabilities.
  evidence:
  - source_id: r334-primary-pdf
    locator: Section 3.2-3.4, Comparison with scaled standard DPPs (Equation 11) and eigendecomposition complexity O(N D^2), pp. 1195-1197
    relation: supports
