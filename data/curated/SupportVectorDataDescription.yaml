id: AIMech:SupportVectorDataDescription
name: Support vector data description
aliases:
- SVDD
- Support vector domain description
- L1-loss SVDD
concept_kind: algorithm
definition: A one-class support-estimation algorithm that learns a sphere in an input or kernel feature
  space by minimizing squared radius plus linearly penalized nonnegative distance-constraint violations,
  then accepts a query when its feature lies within or on the learned sphere.
identity_notes: 'This record covers the target-only linear-slack method called support vector domain description
  in 1999 and support vector data description in 2004, with later qualifications to its optimization.
  L1 refers to the slack loss, not an L1 norm on the sphere center. The negative-example extension and
  squared-hinge-loss variant change the optimization and are not exact aliases. Sphere support estimation
  does not include SVC graph-component labeling or the general origin-separating one-class hyperplane
  formulation. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 502 preceding native
  IDs, names and aliases. No normalized candidate identity collision was found. Full fixed-string whole-word
  searches included ignored and hidden files in both checkouts, expanded names, acronyms and source identifiers.
  All 15 matches per checkout, eight distinct texts at 30 locations, were inspected as source queries,
  search terms and pending leads in the preceding discovery ledger, not existing concepts. Ten annotated
  AIO nodes and outgoing edges, their generated records, and three native neighbors were inspected or
  checked against unchanged complete readings. Four SAT Novelty-family records were inspected only for
  names, definitions and identity notes: those flip heuristics are unrelated. Absence is bounded to this
  pin and inspected corpus.'
