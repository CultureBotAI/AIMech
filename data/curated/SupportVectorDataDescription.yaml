claims:
- claim_id: convex-formulation
  kind: mechanism
  statement: For N target observations and C>0, use squared radius t>=0, center a and slacks xi_i>=0 to
    minimize t+C*sum_i xi_i subject to ||Phi(x_i)-a||²<=t+xi_i. This is a convex reformulation of the
    radius-variable problem and satisfies a strict-feasibility condition supporting strong duality. The
    objective penalizes violation magnitudes, not an exact count of rejected examples. The optimal center
    is unique, but the radius and slacks can have multiple optima.
  evidence:
  - source_id: tax2004
    locator: Section 2.1, printed pp.47-49 / PDF pp.3-5, Equations 1-15
    relation: supports
  - source_id: chang-revisit
    locator: Sections 2.2-3.1, PDF pp.4-7, Equation 7, Theorem 2 and Corollary 1; Appendix A, pp.15-16
    relation: supports
- claim_id: dual-and-small-penalty
  kind: mechanism
  statement: 'For C>1/N, the usual dual maximizes sum_i alpha_i*K_ii-alpha^T*K*alpha subject to sum_i
    alpha_i=1 and 0<=alpha_i<=C, and a=sum_i alpha_i*Phi(x_i). For 0<C<1/N this equality-simplex dual
    is infeasible even though the primal is feasible: its optimum has t=0 and the feature-space sample
    mean as center. At C=1/N the same zero-radius solution is optimal, but additional positive-radius
    optima may exist. Dividing the original radius stationarity equation by R silently omits R=0. For
    C>1 the method reduces to the minimum sphere enclosing all training features.'
  evidence:
  - source_id: chang-revisit
    locator: Sections 2.3 and 3.2, PDF pp.5-11, Theorems 4 and 6, Equations 9-26; Appendices B and D,
      pp.16-17
    relation: supports
- claim_id: radius-and-prediction
  kind: mechanism
  statement: For C>1/N and an optimal dual solution, squared distances d_i² to the center bound an optimal
    t by max_{alpha_i<C} d_i² <= t <= min_{alpha_i>0} d_i². A free coefficient 0<alpha_i<C fixes the radius;
    otherwise choosing the interval midpoint is an implementation convention. Bounded coefficients need
    not be strictly outside the sphere. Accept a query when K(x,x)-2*sum_i alpha_i*K(x_i,x)+alpha^T*K*alpha<=t.
    For observations {-2,-1,1,2} with a linear kernel and C=1/2, a=0 and every t in [1,4] achieves objective
    4; this illustrates different acceptance regions at the same optimum.
  evidence:
  - source_id: tax2004
    locator: Section 2.1, printed p.49 / PDF p.5, Equations 14-15
    relation: supports
  - source_id: chang-revisit
    locator: Section 3.2, PDF pp.9-11, Theorem 5 and Equations 20-23; Appendix A, p.16, Equation 41; Appendix
      C, p.17
    relation: supports
- claim_id: gaussian-and-boundary-scope
  kind: mechanism
  statement: A Gaussian kernel exp(-||x-y||²/s²) gives a weighted kernel-score acceptance region without
    explicitly constructing features. It can produce a non-spherical region in input space. The narrow-width
    equal-weight limit assumes distinct training inputs; the exact constant-kernel limit is degenerate
    and does not select a unique coefficient vector. Comparisons with one-class hyperplane support estimation
    require the stated kernel/normalization conditions rather than general method identity. The boundary
    estimate is not by itself a normalized density model or a component-labeling rule.
  evidence:
  - source_id: tax1999
    locator: Section 3, printed pp.1193-1194 / PDF pp.3-4
    relation: supports
  - source_id: tax2004
    locator: Sections 2.1 and 2.3, printed pp.50-54 / PDF pp.6-10, Equations 16-21 and 30-35; curator
      constant-Gram qualification
    relation: supports
- claim_id: support-count-and-error
  kind: limitation
  statement: The papers use support-vector fractions to guide target-error and kernel-width choices. The
    2004 account distinguishes essential from nonessential vectors and gives a leave-one-out bound/estimate;
    the raw support fraction is not universally equal to observed leave-one-out rejection or a calibrated
    future error rate. With two identical training features and C=2, a valid two-support-vector representation
    has radius zero, while either leave-one-out fit accepts the omitted duplicate. For the nonnegative
    equality-simplex coefficients the fraction at the upper bound is at most 1/(N*C); bounded coefficients
    can be on the boundary, and this count bound cannot be transferred unchanged to signed negative-example
    coefficients.
  evidence:
  - source_id: tax1999
    locator: Section 4, printed pp.1194-1195 / PDF pp.4-5, Equation 11
    relation: supports
  - source_id: tax2004
    locator: Section 2.4, printed pp.55-56 / PDF pp.11-12, Equation 36; curator duplicate-feature and
      coefficient-sum calculations
    relation: supports
- claim_id: empirical-and-extension-boundaries
  kind: limitation
  statement: The published tests depend on target/negative sampling, feature dimension, preprocessing,
    kernel width and target-rejection settings. The 2004 paper reports failures when a pump training set
    covers too little operating range and cautions that overlapping negative examples can worsen its separate
    negative-example extension. Its reverse distance constraints are not the convex target-only formulation
    above. These studies do not establish universal performance superiority or immunity to distribution
    changes.
  evidence:
  - source_id: tax1999
    locator: Sections 5-6 and Discussion, printed pp.1195-1199 / PDF pp.5-9
    relation: supports
  - source_id: tax2004
    locator: Section 2.2, printed pp.51-52 / PDF pp.7-8; Sections 3-5, pp.57-65 / PDF pp.13-21, Tables
      1-4 and Figures 4-7
    relation: supports
