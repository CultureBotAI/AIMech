aio_mappings:
- target: AIO:BinaryClassification
  relation: related_match
  rationale: AIO:BinaryClassification is related through the accept-versus-reject prediction task. Its
    Classification parent is under SupervisedLearning, whereas this particular algorithm learns a target-class
    description without requiring representative negative training examples. This is a related task mapping,
    not algorithm-task equivalence, an is-a assertion or a claim of two-class supervision. Inspected BinaryClassification,
    Classification, SupervisedLearning, UnsupervisedLearning, MachineLearningTask, SupportVectorMachine,
    Model, Network, KernelLayer and UnsupervisedClustering, including definitions and outgoing edges.
    The supervised category-separating network definition of SupportVectorMachine does not identify a
    sphere support estimator. The clustering task assigns groups, while this method supplies an acceptance
    region; generic models, networks and kernel layers do not identify the algorithm. All 442 class labels
    and 153 semantic matches retain byte-verified prior readings; expanded description/hinge/enclosing/classification
    searches added no rows. SupportVectorClustering adds graph labeling; DBSCAN uses neighborhood density
    connectivity; KernelPCA extracts variance directions. These contexts do not receive renewed scientific
    approval.
