claims:
- claim_id: cfsi-fourier-amplitude-interpolation-and-phase-retention
  kind: mechanism
  statement: Given local image x_i^k in R^{H x W x C} at client k, its 2D discrete Fourier transform F(x_i^k)(u,v,c) = sum_{h=0}^{H-1} sum_{w=0}^{W-1} x_i^k(h,w,c) exp(-j 2 pi (h u / H + w v / W)) (Eq. 1) is decomposed into amplitude spectrum A_i^k and phase spectrum P_i^k; sampling external amplitude A_j^n (n != k) from the shared distribution bank A and interpolating low-frequency components under centered binary mask M = 1_{(h,w) in [-alpha H:alpha H, -alpha W:alpha W]} with ratio lambda in [0, 1] (Eq. 2) followed by inverse Fourier reconstruction x_{i,lambda}^{k->n} = F^{-1}(A_{i,lambda}^{k->n}, P_i^k) (Eq. 3) transfers continuous multi-source appearance distributions while retaining local phase P_i^k and semantic labels y_i^k.
  evidence:
  - source_id: r497-primary-pdf
    locator: Section 3.2, Eqs. (1)-(3), pp. 3-4; Figure 2, p. 4; Section 7.3, Figure 9, pp. 12-13
    relation: supports
- claim_id: boundary-oriented-episodic-meta-learning-and-infonce-loss
  kind: mechanism
  statement: In Boundary-oriented Episodic Learning (BEL), client k first performs an inner-loop meta-train update theta_hat^k = theta^k - beta nabla_{theta^k} L_seg(x_i^k; theta^k) (Eq. 4), extracts K boundary-related and K background-related region features h_{i bd}^k = (sum_{h,w} Z_i^k * y_{i bd}^k) / (sum_{h,w} y_{i bd}^k) and h_{i bg}^k = (sum_{h,w} Z_i^k * y_{i bg}^k) / (sum_{h,w} y_{i bg}^k) via masked average pooling (Eq. 5) across x_i^k and its K-1 transformed counterparts t_i^k, and optimizes theta^k on L_seg(x_i^k; theta^k) + L_seg(t_i^k; theta_hat^k) + gamma L_boundary(x_i^k, t_i^k; theta_hat^k) (Eqs. 6-9), where L_boundary averages the InfoNCE loss l(h_m, h_p) over all 2 * C(K, 2) intra-class positive pairs across the 2K region features.
  evidence:
  - source_id: r497-primary-pdf
    locator: Section 3.3, Eqs. (4)-(9), pp. 4-5; Section 4.4, Figures 5 and 7, pp. 7-8
    relation: supports
- claim_id: medical-image-segmentation-unseen-domain-generalization-scope
  kind: application
  statement: On leave-one-domain-out federated evaluation across 4 retinal fundus imaging sites (Drishti-GS, RIM-ONE-r3, REFUGE) and 6 prostate T2-weighted MRI sites (NCI-ISBI13, I2CVB, PROMISE12), ELCFS improves average unseen-domain Dice over FedAvg from 85.01% to 87.03% (HD from 15.93 to 13.07) on optic disc/cup segmentation and from 85.57% to 87.39% (HD from 12.42 to 10.88) on prostate MRI segmentation (Tables 1-2, p. 7).
  evidence:
  - source_id: r497-primary-pdf
    locator: Section 4.1-4.3, Tables 1-2, pp. 6-7; Section 7.1-7.2, Tables 3-5, p. 12
    relation: supports
- claim_id: shared-amplitude-bank-and-second-order-episodic-cost-limitation
  kind: limitation
  statement: ELCFS requires constructing and distributing a cross-client amplitude spectrum bank A = [A^1, ..., A^K] (which shares frequency-domain amplitude statistics across sites), generating K-1 inverse-FFT images per training sample, and differentiating the meta-objective L_meta(x_i^k, t_i^k; theta_hat^k) through the inner-loop update theta_hat^k with respect to theta^k, increasing local memory and computation per step relative to standard FedAvg.
  evidence:
  - source_id: r497-primary-pdf
    locator: Section 3.2-3.3, Eqs. (2)-(4) and (8)-(9), pp. 3-5; Section 4.2, p. 6
    relation: supports
