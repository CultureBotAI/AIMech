claims:
- claim_id: event-topic-group-generation
  kind: mechanism
  statement: Each topic has a Dirichlet-distributed group mixture and word vector. Every entity draws
    a group separately for each topic. An event chooses one topic uniformly, generates its word attributes
    from that topic and generates observed pairwise agreement indicators using Beta-distributed event/group-pair
    probabilities. Entity group assignments are shared across events assigned to the same topic, whereas
    the agreement-rate variables are event-specific. The worked relation is symmetric; a precise implementation
    must declare its participating pairs, missing observations and self-pair policy.
  evidence:
  - source_id: method-source
    locator: Section 2, PDF pp.2-3, Figure 1 and six generative steps
    relation: supports
- claim_id: collapsed-and-tempered-inference
  kind: mechanism
  statement: Integrating group mixtures, word vectors and event block rates yields group updates combining
    a leave-entity-out group factor with Beta-integrated likelihood ratios for affected incident relations
    in matching-topic events. Event-topic updates combine a leave-event-out Dirichlet-multinomial word
    factor with the whole event's integrated agreement likelihood under the candidate topic groups. The
    printed group formula multiplies a topic indicator inside the product over all events, which would
    zero weights when an unrelated event is present; the prose-consistent interpretation restricts the
    product to matching events. The experiments raise the text factor to powers five and five hundred
    for Senate and UN data, respectively, changing the target relative to the untempered model.
  evidence:
  - source_id: method-source
    locator: Section 2, PDF p.3, Gibbs conditionals and modality-balancing paragraph
    relation: supports
- claim_id: derived-agreement-scope
  kind: limitation
  statement: Conditionally independent pairwise agreement observations define a model of the derived relation
    network, not automatically a coherent generative law for underlying individual votes. For three entities
    in one block, three pairwise disagreements have integrated probability 1/4 under a uniform Beta block
    prior, although no binary vote assignment can realize that triangle. This does not invalidate a model
    scoped to observed agreement networks; it limits interpretation as a complete individual-vote model.
  evidence:
  - source_id: method-source
    locator: Section 2, PDF pp.2-3, pairwise generation; Section 3.1, PDF p.4, agreement observations
    relation: supports
