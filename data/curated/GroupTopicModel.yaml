name: Group-topic model
definition: A probabilistic model family jointly assigning topics to relation-bearing events and topic-specific
  latent groups to entities, using event text and event-specific group-pair agreement probabilities.
concept_kind: model_family
identity_notes: Scoped to Wang, Mohanty and McCallum's NIPS2005 group-topic model. Each entity has a separate
  group assignment for each topic; each event chooses one topic. Agreement probabilities are indexed by
  event and group pair, as shown by the event plate, rather than being one global rate for a topic/group
  pair. This differs from author-topic or ART models that condition on observed participants without a
  pairwise agreement likelihood, and from a token-wise document topic mixture. The conference year follows
  official proceedings, not the author PDF filename. No normalized candidate identity matched all 442
  pinned AIO IDs, labels and scoped synonyms or 438 preceding native IDs, names and aliases. Full-checkout
  searches included ignored and hidden files in both checkouts; eleven matching lines per checkout came
  from four unique prior discovery-ledger contents with pending leads and bibliography context. All matching
  excerpts were read. All 205 semantic label/synonym hits and 21 annotated AIO nodes with outgoing edges
  were byte-verified against prior readings. Twenty-nine contextual YAMLs comprise 28 unchanged prior
  readings and one fully read final round103 native target verified against its saved review inputs. No
  candidate record is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- Fixed topic and group counts, symmetric binary agreement and event-specific Beta rates define the inspected
  construction. General asymmetric or continuous relations are suggested without a complete evaluated
  extension. The text's i<=j notation does not settle every practical self-pair or missing-participant
  policy.
- The printed collapsed formulas require consistent removal of old assignments and the correct scopes
  for entity, word and relation counts. Modality powers define a tempered posterior weighting, not exact
  inference under the original untempered generative process. No behavior of uninspected author software
  is inferred from a display error.
- The selected Senate and UN studies compare joint fitting with a sequential unigram-mixture/blockstructure
  baseline using fixed, somewhat arbitrarily chosen counts. Agreement Index results and selected political
  group interpretations do not demonstrate causal influence, validated ideological truth or general future
  prediction.
- Finite calculations check 4096 group/event conditionals for untempered and power-five synthetic examples
  with explicitly chosen distinct unordered pairs. They do not reproduce the original preprocessing, power-five-hundred
  benchmark or author implementation.
