id: AIMech:GradSkipAndGradSkipPlusCommunicationAcceleratedLocalGradientMethodsWithGradientSkipping
name: GradSkip and GradSkip+ Communication-Accelerated Local Gradient Methods with Gradient Skipping
concept_kind: algorithm
review_status: DRAFT
definition: A family of communication-accelerated distributed local gradient methods (GradSkip in Algorithm 2 and its generalized compression-operator formulation GradSkip+ in Algorithm 3) that augment ProxSkip/Scaffnew's randomized consensus-skipping probability p with client-specific local gradient skipping probabilities q_i in (0, 1], whereby client i skips computing its true local gradient nabla f_i(x_i^t) with probability 1 - q_i (substituting its local shift control variate h_i^t for a fake local step hat{x}_i^{t+1} = x_i^t) and reduces expected per-client local gradient evaluations per communication round from 1/p to min{1/p, 1/(1 - q_i)} without degrading the accelerated O(sqrt(kappa_max) log(1/eps)) communication complexity.
identity_notes: Distinct from ProxSkip / Scaffnew (Mishchenko et al., ICML 2022; which sets q_i = 1 for all clients and forces every client to compute 1/p local gradients per communication round regardless of local condition number kappa_i = L_i / mu). GradSkip and GradSkip+ (Maranjyan, Safaryan, & Richtarik, arXiv:2210.16402) decouple local gradient computation frequency q_i from communication frequency p.
aliases:
