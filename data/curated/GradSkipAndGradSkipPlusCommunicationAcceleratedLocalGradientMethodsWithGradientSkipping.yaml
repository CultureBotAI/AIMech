claims:
- claim_id: gradskip-coupled-bernoulli-communication-and-local-gradient-skipping-mechanism
  kind: mechanism
  statement: In GradSkip (Algorithm 2), at each iteration t the server flips a global coin theta_t ~ Bernoulli(p); when theta_t = 1 (communication round), every client i sets lambda_i^t = 1, evaluates nabla f_i(x_i^t), takes step hat{x}_i^{t+1} = x_i^t - gamma (nabla f_i(x_i^t) - h_i^t), averages x_i^{t+1} = (1/n) sum_j (hat{x}_j^{t+1} - (gamma/p) h_j^t), and updates its control variate h_i^{t+1} = h_i^t + (p/gamma)(x_i^{t+1} - hat{x}_i^{t+1}); when theta_t = 0 (local round), each client independently flips eta_i^t ~ Bernoulli(q_i) and skips computing nabla f_i(x_i^t) whenever eta_i^t = 0 by substituting tilde{g}_i^t = h_i^t so hat{x}_i^{t+1} = x_i^t.
  evidence:
  - source_id: r562-primary-pdf
    locator: Section 4 Algorithm 2 & Lemma 4.1 pp. 5-6
    relation: supports
- claim_id: gradskip-heterogeneous-condition-number-computational-reduction-scope
  kind: scope
  statement: For L_i-smooth mu-strongly convex local objectives with condition numbers kappa_i = L_i / mu and kappa_max = max_i kappa_i (Theorem 4.3 & Section 4.3 Equations 11-13), choosing gamma = 1 / L_max, p = 1 / sqrt(kappa_max), and q_i = (1 - 1/kappa_max)(kappa_i / kappa_max) contracts the Lyapunov function Psi^t at rate (1 - 1/kappa_max), preserving Scaffnew's accelerated O(sqrt(kappa_max) log(1/eps)) communication rounds while reducing client i's expected local gradient computations per communication round to E[tau_i] = (1 - p(1 - q_i)) / (p + q_i - p q_i) <= min{1/p, 1/(1 - q_i)} (Lemma B.1).
  evidence:
  - source_id: r562-primary-pdf
    locator: Section 4.2 Theorem 4.3, Section 4.3 Equations (11)-(13) pp. 6-7 & Appendix B Lemma B.1 p. 14
    relation: supports
  - source_id: r562-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: gradskip-strong-convexity-and-synchronized-communication-trigger-limitation
  kind: limitation
  statement: The linear convergence rate O(sqrt(kappa_max) log(1/eps)) and condition-number-matched skipping schedule q_i require mu-strong convexity (Assumption 3.2) and a shared global Bernoulli communication coin theta_t ~ Bernoulli(p) across participating clients.
  evidence:
  - source_id: r562-primary-pdf
    locator: Section 3 Assumptions 3.1-3.2 p. 4 & Algorithm 2 Line 4 p. 5
    relation: supports
- claim_id: gradskip-heterogeneous-federated-optimization-with-unequal-client-compute-application
  kind: application
  statement: Applied to federated regularized logistic regression across clients with heterogeneous data smoothness constants L_i and unequal local computational speeds.
  evidence:
  - source_id: r562-primary-pdf
    locator: Section 6 Experiments pp. 9-10
    relation: supports
