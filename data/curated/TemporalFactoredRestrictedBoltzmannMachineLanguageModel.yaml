claims:
- claim_id: method
  kind: mechanism
  statement: Apply shared FRBM parameters to successive overlapping word windows. Connect hidden state
    h_tau to h_(tau+1) so that the current hidden bias becomes b_h+A h_tau; conditional on that earlier
    state, the current word and hidden variables retain an FRBM joint with its own normalizer. Exact prediction
    must account for uncertainty in previous hidden states. The proposed online approximation instead
    substitutes their inferred probabilities p_tau, computes p_(tau+1)=sigmoid(b_h+A p_tau+sum_i W_i^T
    r_word_i) after observing the current window, and predicts the next word using the FRBM word distribution
    with the correspondingly shifted bias. Learning uses these approximate filtered probabilities, applies
    contrastive-divergence updates to individual model instances, and combines them. The temporal-weight
    update contrasts current hidden probabilities and their reconstruction, multiplied by the preceding
    filtered vector; it does not propagate an exact likelihood gradient through the full latent history.
