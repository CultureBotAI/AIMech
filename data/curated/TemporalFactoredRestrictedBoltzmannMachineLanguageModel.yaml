aio_mappings:
- target: AIO:AutoregressiveLanguageModel
  relation: broad_match
  rationale: The primary construction predicts the next word from preceding words, defining sequential
    word conditionals. The pinned AIO target is broader than this temporally linked factored latent-word
    architecture. This mapping uses sequential-probability scope, not an empirical generation-quality
    claim. FactoredLanguageModel denotes explicit linguistic factors, not factorized neural weight matrices;
    ImplicitLanguageModel and EnergyBasedLLM describe non-autoregressive sequence energies rather than
    these next-word conditionals.
- target: AIO:RestrictedBoltzmannMachine
  relation: related_match
  rationale: The architecture uses an undirected RBM interaction between the current categorical word
    and binary hidden state, with context affecting hidden inputs. A related mapping records that explicit
    component/conditional construction without asserting that the entire autoregressive or temporally
    linked sequence model is one unconditioned RBM.
