name: Temporal factored restricted Boltzmann machine language model
definition: A sequential extension of the factored RBM language model that directs information from the
  preceding binary hidden state into the current hidden bias, propagating context beyond the explicit
  word window.
concept_kind: architecture
identity_notes: 'This is the temporal FRBM in Mnih and Hinton’s 2007 language-model paper. It extends
  the factored categorical-word construction with shared hidden-to-hidden weights A. It is distinct from
  the static FRBM, the broader temporal RBM with additional visible-history connections, and deterministic
  recurrent language models. Its approximate filtering algorithm is not the exact latent-state model.
  All 442 pinned AIO labels/scoped synonyms and 358 preceding native IDs/names/aliases were compared,
  with no normalized identity match. Full-checkout fixed-string searches included ignored and hidden files
  in both worktree and main, returning 33 lines each. All 24 unique matched contents were read: LBL source
  references and model contrasts, discovery leads and saved review context. These do not constitute existing
  candidate records. All 85 semantic label/synonym hits and 22 exact AIO nodes were inspected, alongside
  corresponding generated records and four complete native neighbors. Previously read contextual files
  were checked for byte identity. Absence is bounded to this snapshot and inspected neighborhood.'
limitations:
- Replacing an uncertain earlier hidden state by its mean inside a sigmoid or a context-dependent normalized
  word distribution is generally not exact marginalization. Observing a new word can also change the posterior
  over previous hidden states.
- The cited temporal-RBM source explicitly ignores future evidence for online learning and notes that
  changes in its parameter-dependent approximate posterior can decrease the variational bound. Approximate
  filtering plus finite CD therefore does not guarantee monotonic likelihood or bound improvement.
- The recurrent path permits dependence beyond the explicit context window, but does not guarantee faithful
  long-range memory, tractable exact filtering or a particular effective context length.
- This construction has directed temporal links and undirected current word–hidden interactions. It is
  not equivalent to a single unconditioned RBM, a pure directed Bayesian network parameterization, or
  a deep belief network merely because latent states are present.
- The static FRBM marginal’s printed bias-sign conflict remains qualified when its conditional prediction
  is reused. No implementation audit, empirical superiority or exact sequence-likelihood result is asserted.
