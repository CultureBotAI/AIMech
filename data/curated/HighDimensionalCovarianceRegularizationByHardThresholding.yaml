claims:
- claim_id: schur-operator-bound-positive-definiteness-and-weak-lq-bias
  kind: mechanism
  statement: 'For a symmetric p x p matrix M, the hard-thresholding operator T_s(M) = [m_{ij} 1(|m_{ij}| >= s)] (Eq. 3) preserves symmetry and is invariant under variable permutations P M P^T, unlike the banding operator B_k(M) = [m_{ij} 1(|i - j| <= k)], and whenever ||T_s(M) - M||_{(2,2)} <= eps and lambda_min(M) > eps, T_s(M) is strictly positive definite because v^T T_s(M) v >= lambda_min(M) - eps > 0 for all unit vectors v (Eq. 4). Over the permutation-invariant weak-l_q covariance uniformity class U_tau(q, c_0(p), M) = {Sigma : sigma_{ii} <= M, sum_{j=1}^p |sigma_{ij}|^q <= c_0(p) for all i} (0 <= q < 1), the Schur/Holder bound ||Sigma||_{(2,2)} <= ||Sigma||_{(1,1)} = max_j sum_i |sigma_{ij}| (Eq. 2) implies lambda_max(Sigma) <= M^{1-q} c_0(p), and the deterministic thresholding bias satisfies ||T_t(Sigma) - Sigma||_{(1,1)} = max_i sum_{j=1}^p |sigma_{ij}| 1(|sigma_{ij}| <= t) <= t^{1-q} c_0(p) (Eq. 13).'
  evidence:
  - source_id: bl2008-covariance-thresholding-pdf
    locator: Section 2, Equations (1)-(4), p. 4; Section 2.1, p. 5; Section 2.2, Equation (13), p. 7
    relation: supports
- claim_id: uniform-operator-inverse-and-frobenius-convergence-rates
  kind: mechanism
  statement: For n i.i.d. Gaussian or sub-Gaussian observations (E[e^{t X_{ij}^2}] <= K < infty for |t| <= eta_j) with (log p)/n = o(1), decomposing ||T_t(Sigma_hat) - T_t(Sigma)||_{(1,1)} into false-positive, false-negative, and active-entry estimation errors I + II + III (Eqs. 14-22) and setting t_n = M'*sqrt(log p / n) for sufficiently large M' yields uniform operator-norm convergence ||T_{t_n}(Sigma_hat) - Sigma||_{(2,2)} = O_P(c_0(p) ((log p)/n)^{(1-q)/2}) on U_tau(q, c_0(p), M), uniform precision-matrix convergence ||(T_{t_n}(Sigma_hat))^{-1} - Sigma^{-1}||_{(2,2)} = O_P(c_0(p) ((log p)/n)^{(1-q)/2}) on U_tau(q, c_0(p), M, eps_0) (Theorem 1), and normalized squared Frobenius convergence p^{-1} ||T_{t_n}(Sigma_hat) - Sigma||_F^2 = O_P(c_0(p) ((log p)/n)^{1-q/2}) (Theorem 2, Eq. 23; Appendix Eqs. 42-45). Under finite polynomial moments E|X_{ij}|^{2(1+gamma)} <= K (gamma > 0), setting t_n = M p^{2/(1+gamma)} n^{-1/2} yields ||T_{t_n}(Sigma_hat) - Sigma||_{(2,2)} = O_P(c_0(p) (p^{2/(1+gamma)}
    / n^{1/2})^{1-q}) (Section 2.3, Eqs. 24-25).
  evidence:
  - source_id: bl2008-covariance-thresholding-pdf
    locator: Section 2.2, Theorem 1, Theorem 2, and Equations (6)-(23), pp. 6-9; Section 2.3, Equations (24)-(25), p. 9; Section 2.5, p. 10; Appendix, Proof of Theorem 2 and Equations (42)-(45), pp. 22-23
    relation: supports
- claim_id: sample-splitting-cross-validation-oracle-equivalence
  kind: scope
  statement: For data-driven threshold selection by N-split cross-validation R_hat(s) = N^{-1} sum_{nu=1}^N ||T_s(Sigma_hat_{1,nu}) - Sigma_hat_{2,nu}||_F^2 (Eq. 27), Proposition 1 (Pinelis max-projection inequality, Eq. 30) and Theorem 3 (general sample-splitting oracle inequality, Eqs. 31-38) establish that if the oracle estimator mu_hat^o satisfies |mu_hat^o - mu(P)|^2 = Omega_P(r_n), E_P max_{1<=j<=J} |(v_j, W_1 - mu)|^2 <= C rho(J), and rho(J_n) (log J_n)/B_n = o(r_n), then the sample-splitting selector mu_hat^c achieves |mu_hat^c - mu(P)|^2 = |mu_hat^o - mu(P)|^2 (1 + o_P(1)). Combined with Wick-theorem variance bounds (Lemma A.1, Eq. 46), chi-square MGF tail bounds (Lemma A.2, Eqs. 47-54), and rho(J) <= C(q, c_0, M) (log J)^2 p (Lemma A.3, Eqs. 55-57), searching over a grid of J thresholds with validation size B_n = n eps(n, p) and (log J)^3 = o(n^{q/2} c_0(p) (log p)^{1-q/2} eps(n, p)) yields Frobenius oracle equivalence ||T_{s_hat}(Sigma_hat) - Sigma||_F = ||T_o(Sigma_hat) - Sigma||_F
    (1 + o_P(1)) and achieves the optimal rate K c_0(p) p ((log p)/n)^{1-q/2} over U_tau(q, c_0(p), M) (Theorem 4, Eqs. 39-40).
  evidence:
  - source_id: bl2008-covariance-thresholding-pdf
    locator: Section 3.1-3.3, Proposition 1, Theorem 3, Theorem 4, and Equations (27)-(40), pp. 11-15; Appendix, Lemmas A.1-A.3, Proof of Theorem 4, and Equations (46)-(57), pp. 23-27
    relation: supports
