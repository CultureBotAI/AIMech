aio_mappings:
- target: AIO:PrincipalComponentAnalysis
  relation: related_match
  rationale: Operator-norm consistency ||T_{t_n}(Sigma_hat) - Sigma||_{(2,2)} -> 0 of the hard-thresholded covariance estimator guarantees consistency of leading eigenvalues and principal component eigenvectors (EOFs), which Bickel & Levina (2008, Sections 1, 4, 5, and 6) establish as a primary application of covariance thresholding.
- target: AIO:LassoRegression
  relation: related_match
  rationale: Hard thresholding T_s(Sigma_hat) is the entrywise l_0 thresholding counterpart to l_1 (Lasso) soft-thresholding and penalized likelihood covariance/precision estimation (Section 1, pp. 2-3).
limitations:
- 'Finite-sample positive definiteness is not automatically guaranteed for arbitrary threshold values s: T_s(Sigma_hat) can exhibit small negative eigenvalues when s is large relative to lambda_min(Sigma) (as observed in the climate data EOF analysis, Section 5, p. 19), and positive definiteness is guaranteed only when ||T_s(Sigma_hat) - Sigma_hat||_{(2,2)} < lambda_min(Sigma_hat) (Eq. 4, p. 4) or asymptotically as (log p)/n -> 0 on U_tau(q, c_0(p), M, eps_0).'
- Cross-validation threshold selection (Theorem 4, Eq. 40) proves rate optimality under the normalized Frobenius norm p^{-1} ||T_{s_hat}(Sigma_hat) - Sigma||_F^2 rather than directly under the spectral/operator norm ||T_{s_hat}(Sigma_hat) - Sigma||_{(2,2)}^2 (Section 3.1, Eqs. 28-29, p. 11).
- When variables possess a known true ordering and belong to the polynomial decay class V(eps_0, alpha, C), thresholding achieves rate ((log p)/n)^{(1-q)/2} with 1 - q < alpha / (alpha + 1), which is slightly slower than the ordered banding rate ((log p)/n)^{alpha / (2(alpha + 1))} (Section 2.5, p. 10; Table 1, p. 16).
- 'Primary-source typographical notes verified during full-text inspection of arXiv:0901.3079v1: (1) p. 5, third display from bottom writes V(eps, alpha, C) subset U(eps_0, alpha, C_1), omitting subscript 0 on the first eps; (2) p. 5, second display from bottom writes sum_j |sigma_{ij}|^q <= eps_0^{-q} + C*(alpha+1)q/((alpha+1)q - 1) with factor C instead of C^q (or 2*C^q) from |sigma_{ij}|^q <= C^q |i-j|^{-(alpha+1)q}; (3) p. 13, Eq. (33) writes the oracle estimator mu_hat^o with superscript zero as mu_hat^0 on the left-hand side 2(mu_hat^c - mu_hat^0, W_bar_B - mu); and (4) p. 26, display below Eq. (56) in the proof of Lemma A.3 writes int_{x^2}^infty e^{-sqrt(t)*delta} dt = int_x^infty v e^{-v*delta} dv = x e^{-x*delta} + delta^{-1} e^{-x*delta}, omitting the Jacobian factor 2 from dt = 2v dv and the delta^{-1}, delta^{-2} factors (absorbed into the generic constant C).'
