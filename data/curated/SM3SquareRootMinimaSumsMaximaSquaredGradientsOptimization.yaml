id: AIMech:SM3SquareRootMinimaSumsMaximaSquaredGradientsOptimization
name: SM3 (Square-root of Minima of Sums of Maxima of Squared-gradients Method)
concept_kind: algorithm
review_status: DRAFT
definition: 'A memory-efficient adaptive gradient optimization algorithm (Algorithms SM3-I and SM3-II) that covers the d model parameters with k nonempty sets {S_r}_{r=1}^k (bigcup_{r=1}^k S_r = [d]), maintains a single running accumulator mu_t(r) per covering set r in [k], estimates each parameter''s cumulative squared gradient via the minimum over its covering sets (nu_t(i) = min_{r: S_r ni i} mu_t(r) with mu_t(r) = mu_{t-1}(r) + max_{j in S_r} g_t^2(j) in SM3-I, or the tighter recursion nu''_t(i) = min_{r: S_r ni i} mu''_{t-1}(r) + g_t^2(i) and mu''_t(r) = max_{j in S_r} nu''_t(j) in SM3-II), and updates parameters via w_{t+1}(i) = w_t(i) - eta g_t(i) / sqrt(nu_t(i)).'
identity_notes: Distinct from Adafactor and CAME (Round 598), which factorize matrix second moments via rank-1 non-negative matrix factorization and act as fixed-learning-rate Adam variants, SM3 applies to arbitrary-order tensors (or any parameter cover) by maintaining O(k) set-level upper-bound accumulators that Sandwich AdaGrad's cumulative squared gradients (sum_{s=1}^t g_s^2(i) <= nu'_t(i) <= nu_t(i)) and enjoy provable online convex regret guarantees.
aliases:
- SM3 Optimizer
