claims:
- claim_id: c-r601-online-convex-regret-and-tighter-sm3-ii-sandwich-bound
  kind: mechanism
  statement: 'For convex loss functions l_1, ..., l_T with max_t ||w_t - w^*||_inf <= D and eta = D, SM3-I guarantees online regret sum_{t=1}^T (l_t(w_t) - l_t(w^*)) <= 2 D sum_{i=1}^d sqrt(min_{r: S_r ni i} sum_{t=1}^T max_{j in S_r} g_t^2(j)) (Proposition 1, p. 4), while SM3-II''s sequence nu''_t(i) is monotonically increasing and satisfies the tighter sandwich bound sum_{s=1}^t g_s^2(i) <= nu''_t(i) <= nu_t(i) for all t, i (Claim 2 & Proposition 3, pp. 4, 6, 13).'
  evidence:
  - source_id: r601-primary-pdf
    locator: Section 3-3.1, Proposition 1, Claim 2, & Proposition 3, pp. 4-6; Appendix A.1-A.2, p. 13
    relation: supports
- claim_id: c-r601-codimension-one-slice-cover-memory-and-activation-pattern-fidelity
  kind: mechanism
  statement: Using co-dimension 1 tensor slices as the parameter cover reduces auxiliary second-moment memory for a p-order tensor of shape n_1 x ... x n_p from Theta(prod_{i=1}^p n_i) to Theta(sum_{i=1}^p n_i), and whenever stochastic gradients exhibit row- or column-tied activation patterns (g_s(j) approx g_s(i) for all j in some covering slice S_r ni i), SM3's accumulators and regret bound tightly match full per-parameter AdaGrad (Section 4 & Appendix B.1, pp. 6-7, 14).
  evidence:
  - source_id: r601-primary-pdf
    locator: Section 4, Figure 1, pp. 6-7; Appendix B.1, Figure 5, p. 14
    relation: supports
- claim_id: c-r601-transformer-bert-large-and-amoebanet-scaling
  kind: application
  statement: By eliminating per-parameter second-moment storage, SM3 doubles feasible TPU batch sizes on WMT'14 en->fr Transformer-Big (reaching 40.50 BLEU vs Adafactor 39.65 at batch size 768 with ~2x faster convergence), scales BERT-Large Masked-LM training linearly up to batch size 2^{16} (reducing wall-time to 70% accuracy by ~35%), and achieves 78.71% top-1 / 94.31% top-5 accuracy with AmoebaNet-D on ImageNet (Section 5.1-5.3, Tables 1-2 & Figures 2-4, pp. 8-10).
  evidence:
  - source_id: r601-primary-pdf
    locator: Section 5.1-5.3, Tables 1-2 & Figures 2-4, pp. 8-10
    relation: supports
- claim_id: c-r601-worst-case-cover-looseness-and-uncompressed-momentum
  kind: limitation
  statement: Because nu_t(i) >= sum_{s=1}^t g_s^2(i), SM3's worst-case regret bound is never smaller than AdaGrad's and can degrade when gradients lack correlated activation patterns across the chosen cover sets, and SM3 only compresses second-order statistics while leaving first-order momentum buffers at O(d) memory when momentum (beta_1 > 0) is enabled.
  evidence:
  - source_id: r601-primary-pdf
    locator: Section 3-4, pp. 4, 6; Section 6 & Appendix C, Table 3, pp. 10, 15
    relation: supports
