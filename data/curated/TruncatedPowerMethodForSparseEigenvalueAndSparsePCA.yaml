claims:
- claim_id: claim-01
  kind: mechanism
  statement: Each TPower iteration decomposes the cardinality-constrained quadratic maximization into a linear lower-bound maximization y_t = argmax_{||y||_2=1, ||y||_0<=k} x_{t-1}^T A y = Truncate(A x_{t-1}, F_t)/||Truncate(A x_{t-1}, F_t)||_2 where F_t = supp(A x_{t-1}, k), ensuring monotonic ascent x_{t-1}^T A x_{t-1} <= x_{t-1}^T A x_t <= x_t^T A x_t for any positive semidefinite matrix A and convergence to a fixed point satisfying the fixed-support eigenvector equation (A x)_{F} = lambda x_F with lambda >= max_{i not in F} |(A x)_i| / min_{i in F} |x_i|.
  evidence:
  - source_id: r313-primary-pdf
    locator: Section 2.2, Algorithm 1 and derivation, p. 902; Section 3.1, Proposition 1, pp. 903-904; Appendix A, Proof of Proposition 1, pp. 916-917
    relation: supports
  - source_id: r313-metadata-cr
    locator: Abstract and JMLR v14 paper record (pp. 899-925)
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: For a target eigenvector x_bar with sparsity |supp(x_bar)| <= s and perturbation E = A - A_bar with sparse spectral norm rho(s+k; E) <= epsilon, the untruncated power step x'_t = A x_{t-1}/||A x_{t-1}||_2 satisfies Lemma 3's alignment bound sqrt(1 - |x'_t^T x_bar|^2) <= gamma_{k+2s} sqrt(1 - |x_{t-1}^T x_bar|^2) + sqrt(2)*epsilon/lambda_bar, and the k-truncation step satisfies Lemma 4's alignment preservation |x_t^T x_bar| >= |x'_t^T x_bar| - min(sqrt(s/k), (1 + sqrt(2*s/k)) sqrt(1 - |x'_t^T x_bar|^2)), yielding geometric contraction sqrt(1 - |x_t^T x_bar|^2) <= mu sqrt(1 - |x_{t-1}^T x_bar|^2) + c*epsilon whenever mu = (1 + sqrt(1 + (1+sqrt(2))^2 s/k)) gamma_{k+2s} < 1 (Theorem 1).
  evidence:
  - source_id: r313-primary-pdf
    locator: Section 3.2, Theorem 1, Corollary 1, and Theorem 2, pp. 904-907; Appendix B, Lemmas 2-4 and Proof of Theorem 1, pp. 918-922
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Because the k-sparse eigenvalue objective is non-convex and invariant to sign flips, TPower is a local ascent method whose convergence to the global sparse eigenvector requires both an initial iterate x_0 with strictly positive alignment |x_0^T x_bar| > c*epsilon/(1-mu) (preventing orthogonal initialization trapping in complementary coordinates) and a sparsity-over-relaxation factor k/s > 1 + 4/(gamma_{k+2s}-1)^{-2} when the restricted condition ratio gamma_{k+2s} is not sufficiently small.
  evidence:
  - source_id: r313-primary-pdf
    locator: Section 2.2, Initialization discussion, p. 902; Section 3.2, Theorem 1 Condition 4 and Remark 5, pp. 905-906
    relation: supports
