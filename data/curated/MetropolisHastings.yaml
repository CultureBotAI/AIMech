  relation: supports
claims:
- claim_id: method
  kind: mechanism
  statement: At a current state x with positive target mass or density pi(x), draw y from q(y|x). For
    a supported proposal define R=pi(y)q(x|y)/(pi(x)q(y|x)), and accept y with probability min(1,R); on
    rejection record x again. A common unknown normalizing constant in pi cancels. The accepted-move probabilities
    satisfy detailed balance with pi. For symmetric q the proposal factors cancel, recovering the Metropolis
    choice. A valid target-invariant kernel is not by itself a finite-run convergence certificate.
  evidence:
  - source_id: method-source
    locator: Section 2.2, Equations (4)–(6), Metropolis choice of s_ij and continuous-density discussion,
      printed pp. 99–101 / PDF pp. 3–5
    relation: supports
- claim_id: error-and-mixing
  kind: limitation
  statement: 'Hastings distinguishes invariance from practical error assessment: initial-state effects,
    correlated samples, incomplete exploration and inaccurate ratio calculations can undermine finite-run
    estimates.'
  evidence:
  - source_id: error-and-mixing
    locator: Sections 2.1 and 2.6, printed pp. 98–99 and 104–105 / PDF pp. 2–3 and 8–9
    relation: supports
