name: Metropolis–Hastings sampling
definition: A Markov chain Monte Carlo algorithm that proposes a new state from a specified transition
  distribution and accepts it with the smaller of one and the target-density ratio multiplied by the reverse-to-forward
  proposal ratio, otherwise retaining the current state.
concept_kind: algorithm
identity_notes: This record denotes the usual Metropolis acceptance choice within Hastings’s more general
  family of reversible updates. It is not the whole MCMC family, a Markov-chain model, the Barker acceptance
  rule or an independent-draw generator. Asymmetric proposals require the proposal-ratio correction. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 153 prior native
  IDs/names/aliases. Both checkout text searches included ignored and hidden files and returned no matches
  for the selected exact IDs, full labels, aliases and source titles. Existing HMM and Markov random field
  records describe probability models, not these sampling or tuning procedures.
limitations:
- The target must be proper, and the proposal and acceptance calculation must be defined on the relevant
  support. A proposed move with no reverse support has zero acceptance; zero-over-zero expressions are
  not a general operational rule.
- Target invariance does not ensure irreducibility, aperiodicity, rapid mixing, independent samples or
  convergence from every start. Those properties depend on the target and proposal.
- Rejections repeat the current state. Keeping only accepted moves without correcting their weighting
  changes the sampling process.
- Poor proposals, isolated modes, finite precision and inadequate run length can yield misleading estimates;
  acceptance rate alone does not establish adequate exploration.
- The record does not reproduce an implementation or assert a universal acceptance target, speed improvement
  or numerical posterior result.
