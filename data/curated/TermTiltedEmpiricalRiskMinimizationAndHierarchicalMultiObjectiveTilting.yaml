claims:
- claim_id: r496-claim-1
  kind: mechanism
  statement: Under generalized linear model and strict-saddle assumptions (Assumptions 1-4), as the tilt parameter t in R increases, the t-tilted solution theta_breve(t) in argmin_theta R_tilde(t; theta) monotonically reduces empirical loss variance (d/dt var(f(theta_breve(t))) < 0, Theorem 4), monotonically increases the cosine similarity between the loss vector f(theta_breve(t)) and the all-ones vector 1_N (d/dt s(f(theta_breve(t)), 1_N) > 0, Theorem 5), and increases the Shannon entropy H(w(tau; theta_breve(t))) of the tilted gradient weights (Theorem 6), while trading off average loss against max-loss for t > 0 (Theorem 2) and against min-loss for t < 0 (Theorem 3).
  evidence:
  - source_id: r496-primary-pdf
    locator: Section 2, pp. 3-4; Appendix E, pp. 23-29, Theorems 1-8
    relation: supports
- claim_id: r496-claim-2
  kind: mechanism
  statement: Hierarchical multi-objective TERM J_tilde(t, tau; theta) (Equation 4) recovers sample-level TERM R_tilde(t; theta) when tau = t (Lemma 7), has closed-form factored gradient weights w_{g,x}(t, tau; theta) = w_g(t, tau; theta) w_{g,x}(tau; theta) (Lemma 6, Equations 44-52), and is solved in the stochastic setting (Algorithm 2) by maintaining a tilted moving-average estimator R_tilde_{g,tau} <- (1/tau) log((1 - lambda) exp(tau R_tilde_{g,tau}) + lambda exp(tau R_tilde_{B,tau})) and sampling groups from a Gumbel-Softmax distribution with logits R_tilde_{g,tau} + (1/t) log |g| and temperature 1/t.
  evidence:
  - source_id: r496-primary-pdf
    locator: Sections 3-4, pp. 4-5, Equation 4, Algorithm 1; Appendix C, pp. 19-20, Lemmas 6-7; Appendix H, pp. 34-35, Algorithms 2-4
    relation: supports
- claim_id: r496-claim-3
  kind: limitation
  statement: For t < 0, R_tilde(t; theta) can become non-convex with spurious local minima even when individual losses f(x_i; theta) are strongly convex (requiring continuation from t = 0) and can overfit to structured or adversarial outliers (Section 5.1 & Appendix H.1, Figure 14); for t -> +inf, the local smoothness constant beta(t) scales linearly as O(t) (Lemma 4, Equation 31), slowing gradient-descent convergence rate (1 - beta_min / (C_1 + C_2 t))^m (Theorem 13).
  evidence:
  - source_id: r496-primary-pdf
    locator: Appendix B, pp. 17-18, Lemma 4; Appendix H.1, pp. 35-36, Theorem 13, Figure 8; Appendix I.2, p. 39, Figure 14
    relation: supports
- claim_id: r496-claim-4
  kind: application
  statement: Applied to robust regression on Drug Discovery under 20%-80% target corruption, robust DNN classification on CIFAR-10 with noisy labels and crowd-sourced spammers, fair PCA on Default Credit, fair federated learning on Vehicle sensor data, and hierarchical class-imbalance plus 30% label-noise classification on HIV-1 (achieving 0.778 rare-class and 0.900 overall accuracy with TERM_sc vs. 0.240 and 0.831 for ERM at 1:20 imbalance).
  evidence:
  - source_id: r496-primary-pdf
    locator: Section 5, pp. 5-8, Tables 1-3, Figures 3-5; Appendix I.2, pp. 38-41, Tables 5-8
    relation: supports
