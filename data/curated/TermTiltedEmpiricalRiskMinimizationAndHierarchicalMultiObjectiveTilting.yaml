id: AIMech:TermTiltedEmpiricalRiskMinimizationAndHierarchicalMultiObjectiveTilting
name: TERM (Tilted Empirical Risk Minimization and Hierarchical Multi-Objective Tilting)
concept_kind: algorithm
review_status: DRAFT
definition: 'A parametric family of exponentially tilted risk minimization objectives and batch/stochastic first-order solvers (Li, Beirami, Sanjabi, & Smith 2021, Sections 1-4, Equations 2-4, Lemmas 1-7, Theorems 1-10, Algorithms 1-4) that generalizes standard Empirical Risk Minimization (ERM) via a real-valued tilt hyperparameter t in R \ {0}: R_tilde(t; theta) := (1 / t) log((1 / N) sum_{i in [N]} exp(t f(x_i; theta))) (Equation 2), with continuous extension R_tilde(0; theta) = R_bar(theta) = (1 / N) sum_{i in [N]} f(x_i; theta), R_tilde(-inf; theta) = min_{i in [N]} f(x_i; theta), and R_tilde(+inf; theta) = max_{i in [N]} f(x_i; theta) (Lemma 2). Its tilted gradient dynamically reweights individual sample gradients exponentially by their relative loss: grad_theta R_tilde(t; theta) = sum_{i in [N]} w_i(t; theta) grad_theta f(x_i; theta) with w_i(t; theta) = exp(t f(x_i; theta)) / sum_{j in [N]} exp(t f(x_j; theta)) = (1 / N) exp(t (f(x_i; theta) - R_tilde(t; theta))) (Lemma 1, Equation 3), magnifying high-loss samples to reduce loss variance and promote fairness when t > 0 or suppressing high-loss outliers when t < 0. For compound problems involving both group fairness/imbalance and sample-level noise across groups g in [G], hierarchical multi-objective TERM optimizes J_tilde(t, tau; theta) := (1 / t) log((1 / N) sum_{g in [G]} |g| exp(t R_tilde_g(tau; theta))) where R_tilde_g(tau; theta) := (1 / tau) log((1 / |g|) sum_{x in g} exp(tau f(x; theta))) (Equation 4).'
identity_notes: Distinct from q-FFL (AIMech:QFairFederatedLearningAlphaFairResourceAllocation, Li et al. 2020), which raises positive losses to a polynomial power (1/(q+1)) F_k^{q+1}(w) for q >= 0 only and cannot take negative exponents to suppress outliers or nest hierarchical group/sample tilts; and distinct from Agnostic Federated Learning (AIMech:AgnosticFederatedLearningMinimaxDistributionallyRobustOptimization, Mohri et al. 2019), which solves a hard minimax saddle-point problem min_w max_{lambda in Lambda} L_lambda(w) rather than a smooth, tunable cumulant-generating log-sum-exp objective spanning min-loss (t -> -inf), average-loss (t -> 0), and max-loss (t -> +inf).
