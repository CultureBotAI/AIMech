  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: For matrix parameters, row and column statistics reconstruct a factored second-moment estimate
    used to normalize gradients; the inspected implementation also clips update RMS and scales steps using
    parameter RMS.
  evidence:
