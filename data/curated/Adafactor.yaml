id: AIMech:Adafactor
name: Adafactor
definition: An adaptive gradient optimization method that approximates matrix-valued second-moment statistics
  using row and column factors.
concept_kind: algorithm
identity_notes: Adafactor factors the adaptive second-moment state; it is not low-rank adaptation of model
  weights such as LoRA. Vector parameters use an unfactored second-moment estimate.
definition_evidence:
- source_id: pytorch-docs
