claims:
- claim_id: spot-source-prompt-tuning-mechanism
  kind: mechanism
  statement: SPoT introduces source prompt tuning as an intermediate stage between pre-training and target prompt tuning that optimizes a shared continuous prompt matrix rho in R^{L x E} (L = 100 tokens) prepended to embedded inputs while keeping the base model frozen, using the learned source prompt to initialize target prompt tuning and achieving +10.1 and +2.4 point average SuperGLUE accuracy gains over vanilla Prompt Tuning on T5 Base (220M) and T5 XXL (11B), matching or exceeding full ModelTuning across all model scales while tuning 27,000x fewer task-specific parameters (410K vs. 11B).
  evidence:
  - source_id: r698-primary-pdf
    locator: Section 2.1.4 Training details, p. 4; Section 2.2 Effect of SPoT, Table 1 & Figure 1, pp. 4-5; Appendix A Table 4 & Appendix D Table 5, pp. 16-17
    relation: supports
- claim_id: spot-task-embedding-similarity-mechanism
  kind: mechanism
  statement: To predict task transferability without brute-force search, SPoT defines a task's embedding e^t as its prompt checkpoint after 10,000 prompt-tuning steps and measures similarity between tasks t^1, t^2 via either Cosine Similarity of Average Tokens sim(t^1, t^2) = cos((1/L) sum_i e^1_i, (1/L) sum_j e^2_j) or Per-token Average Cosine Similarity sim(t^1, t^2) = (1/L^2) sum_i sum_j cos(e^1_i, e^2_j), exploiting the ranked source prompts via Best of Top-k, Top-k Weighted Average sum_{r=1}^k alpha_r rho^{s_r} with alpha_r = sim(e^{s_r}, e^t) / sum_{l=1}^k sim(e^{s_l}, e^t), or Top-k Multi-task Mixture to eliminate 69% of the candidate source space while retaining 90% of the oracle transfer quality gain.
  evidence:
  - source_id: r698-primary-pdf
    locator: Section 3 Predicting task transferability, p. 5; Section 3.2 Defining task similarity through prompts, pp. 6-7; Section 3.3 Predicting transferability via similarity & Table 3, pp. 7-8
    relation: supports
- claim_id: spot-nlp-benchmark-application
  kind: application
  statement: Applied across GLUE, SuperGLUE, and a 26-task (160 source-target pair) transferability study spanning natural language inference, question answering, paraphrase/semantic similarity, sentiment analysis, and commonsense reasoning, where transferring MNLI -> CB reduces relative error by 58.9% (92.7 to 97.0) and Frozen T5 1.1 XXL + SPoT achieves 89.2 on the SuperGLUE test leaderboard.
  evidence:
  - source_id: r698-primary-pdf
    locator: Section 3.1 Measuring transferability, Table 2 & Figure 3, pp. 5-6; Appendix D Table 5, p. 17; Appendix E Tables 6-7, p. 19
    relation: supports
- claim_id: spot-negative-transfer-and-similarity-limitation
  kind: limitation
  statement: Mixing all source datasets indiscriminately (C4 + 55 supervised tasks) underperforms selective source mixtures such as GLUE due to task interference and negative transfer, and prompt-based task embedding cosine similarity does not capture all transferability factors such as source dataset size or task difficulty (showing non-significant correlation on 6 of 10 target tasks such as BoolQ where MNLI yields a 19.0% relative error reduction despite 0.4 cosine similarity).
  evidence:
  - source_id: r698-primary-pdf
    locator: Section 2.2 Effect of SPoT, p. 4; Section 3.3 Correlation between task similarity and task transferability, p. 8; Section 5 Limitations & Future work, p. 9; Appendix G Figure 8, p. 21
    relation: supports
