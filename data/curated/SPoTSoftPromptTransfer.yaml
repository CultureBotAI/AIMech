id: AIMech:SPoTSoftPromptTransfer
name: SPoT (Soft Prompt Transfer)
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient prompt-based transfer learning methodology for frozen pre-trained language models that introduces an intermediate source prompt tuning stage to learn a continuous soft prompt on one or more source tasks and uses it to initialize target prompt tuning, coupled with a prompt-library retrieval algorithm that interprets early-checkpoint task prompts as task embeddings and ranks candidate source tasks via token cosine similarity.
identity_notes: Introduced by Tu Vu, Brian Lester, Noah Constant, Rami Al-Rfou, and Daniel Cer (ACL 2022, arXiv:2110.07904). Distinct from vanilla Prompt Tuning (Lester et al., EMNLP 2021; AIMech Round 675), which initializes soft prompts from sampled vocabulary or class-label tokens directly on each target task without cross-task prompt transfer or prompt-based task embedding retrieval. Both generic SPoT (transferring a single multi-task or single-task source prompt to all target tasks) and targeted SPoT (retrieving top-k source prompts from a prompt library via Average-Token or Per-Token Average Cosine Similarity of 10K-step prompt checkpoints using Best of Top-k, Top-k Weighted Average, or Top-k Multi-task Mixture) are lumping-cohesive variants within this single record.
aliases:
- Soft Prompt Transfer
- SPoT Prompt Transfer
- Targeted Soft Prompt Transfer with Prompt-Based Task Embeddings
