name: Triplet Markov chain
definition: A latent-variable sequence-model family that introduces an auxiliary process so that the joint
  hidden, auxiliary and observed process is first-order Markov, while the hidden–observed pair obtained
  by marginalizing the auxiliary process need not be Markov.
concept_kind: model_family
identity_notes: The inspected construction uses finite hidden X and auxiliary U states with an observed
  Y process, and models the Markov triplet T_t=(X_t,U_t,Y_t). The auxiliary variable is a stochastic latent
  coordinate, not the emitted-symbol stack or queue used by an auxiliary-memory HMM. Pairwise Markov chains
  embed through a constant or redundant auxiliary coordinate; general triplet models allow hidden–observed
  pair laws outside that subclass. Independent factorial hidden chains and particular evidential models
  impose additional structure and are not synonyms of the generic triplet family. No normalized identity
  match was found across all 442 pinned AIO labels and all scoped synonyms and 388 preceding native IDs,
  names and aliases for the three selected concepts. Full-checkout fixed-string searches included ignored
  and hidden files in both worktree and main, yielding 8 and 8 matched lines; all 8 unique contents were
  read. Hits are prior pending leads and primary-reference context, not records of these identities. All
  78 semantic label/synonym hits and 22 fully annotated exact AIO CLASS nodes with outgoing edges were
  read. Twenty-six contextual YAMLs were byte-verified after prior full reading and three freshly read,
  totaling 22 generated and seven native contextual records. Short acronym identities were compared across
  the complete normalized record inventory. Absence is bounded to the pinned source, maintained collection
  and inspected semantic neighborhood.
limitations:
- Inference cost depends on the enlarged state cardinality |X|*|U| and the transition structure. Finite
  auxiliary-state forward–backward tractability is not a constant-cost claim as those spaces grow.
- 'Summing over U is essential: maximizing over U first can change the chosen X state. Statewise marginal
  decoding, joint augmented-path decoding and marginal MAP of the whole X path are different objectives.'
- The finite forward/backward update range is t=1,...,T-1 with the stated initial/terminal messages; the
  manuscript prints a range including zero without defining the corresponding message. Posterior formulas
  require nonzero observation evidence.
- The conditional-symmetry hypothesis in Proposition2.1 is part of that result. It is not adopted as an
  unconditional characterization of all possible Markov projections.
- The evidential/Dempster–Shafer construction in Section2.2 is a particular application. Its proportional
  factors require a consistent normalization treatment before use as conditional transition rows; the
  generic model record does not certify those displayed factors or the evidential theorem.
- Despite the title of Section3.2, the displayed image segmentations use supervised parameter estimates.
  Remark3.2 reports that attempted unsupervised EM on those noisy images did not give good results. The
  source’s synthetic successes do not establish universal superiority or global convergence.
