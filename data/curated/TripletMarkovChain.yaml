aio_mappings:
- target: AIO:MarkovChain
  relation: broad_match
  rationale: The complete triplet T_t=(X_t,U_t,Y_t) is a first-order stochastic state by definition, making
    the AIO Markov-chain family broader. The mapping applies to this augmented joint process, not its
    hidden–observed projection or the target marginal.
- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: A finite normalized triplet-state chain has an acyclic directed factorization, with within-slice
    factors obtainable by the probability chain rule. The generic Bayesian-network family is broader and
    does not require the particular hidden/auxiliary/observed partition.
