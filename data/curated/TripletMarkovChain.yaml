claims:
- claim_id: method
  kind: mechanism
  statement: Specify a normalized initial law and first-order transition kernels for T_t=(X_t,U_t,Y_t).
    The observable/target joint law p(x,y) is obtained by summing the complete triplet law over auxiliary
    paths u. For observed y, treat V_t=(X_t,U_t) as the augmented hidden state and apply the pairwise-chain
    forward–backward recursions with observed kernels p(v_(t+1),y_(t+1)|v_t,y_t). The product of forward
    and backward messages gives p(v_t,y); sum over u_t at fixed x_t and divide by p(y) to obtain p(x_t|y).
    Maximizing this marginalized posterior gives the per-position marginal-posterior-mode estimate. Neither
    X nor (X,Y), nor even the marginal pair (X,U), is required to be Markov in the generic family. A simple
    source example uses a Markov auxiliary U and conditionally independent (X_t,Y_t) pairs given U_t;
    its hidden–observed pair can still fail to be Markov. The experiments use more restricted subclasses,
    including a Markov (X,U) process with conditionally independent observations given that pair.
