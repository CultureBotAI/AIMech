aio_mappings:
- target: AIO:BinaryClassification
  relation: related_match
  rationale: AIO:BinaryClassification is related through the eventual accept/reject task of the trained
    support description. Its Classification ancestry is under SupervisedLearning; this related mapping
    asserts neither algorithm-task equivalence, is-a membership nor two-class supervision. AIO:SupportVectorMachine
    describes a supervised category-separating network with layer relationships, not this one-class subset-training
    procedure. UnsupervisedLearning and MachineLearningTask describe task scope; KernelLayer is a component,
    TrainingStrategy is defined as preprocessing, and DataPreparation/SelectionAndSamplingBias do not
    identify the iterative algorithm. Native SVDD defines sphere estimation, L2-loss SVDD changes the
    slack objective, SVC adds graph-component labels, CVM/generalized CVM use different enclosing-ball
    reductions and BVM changes center updates. Regression and density-model matches do not identify CSVDD.
limitations:
- The stopping quota applies the expanded sphere. Neither a full-data soft-SVDD objective approximation
  nor a prediction/generalization guarantee follows from it.
- Source complexity depends on parameter choices, kernel cost, subset solves and radius/center assumptions.
  Input storage is separate.
- All six primary PDF pages were visually read. Exact rational calculations test stated formulas and an
  allowed initialization; no historical implementation, optimizer or benchmark was executed.
- CSVDD remains a native DRAFT. Later CVDD variants, the related MPhil thesis, RAPID, minimax/LP novelty
  methods and later regularized or accelerated support descriptions remain unresolved.
