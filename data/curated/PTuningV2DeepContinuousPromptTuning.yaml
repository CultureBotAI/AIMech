id: AIMech:PTuningV2DeepContinuousPromptTuning
name: P-Tuning v2 Deep Continuous Prompt Tuning
concept_kind: algorithm
review_status: DRAFT
definition: A parameter-efficient deep continuous prompt tuning method for natural language understanding and token-level sequence labeling that freezes the pretrained Transformer backbone, prepends independent trainable continuous prefix prompt vectors across multiple or all Transformer layers rather than only the input embedding layer, and attaches a randomly initialized linear classification head over token or [CLS] representations in place of language-modeling verbalizers, tuning 0.1% to 3% of model parameters.
identity_notes: Distinct from single-layer Prompt Tuning (Lester et al., EMNLP 2021, AIMech:PromptTuning) and original P-Tuning (Liu et al., 2021), which insert continuous prompts only in the input embedding layer with verbalizers and underperform on models below 10B parameters and on sequence tagging tasks; also distinct from Prefix-Tuning (Li & Liang, ACL 2021, AIMech:PrefixTuning), which targets autoregressive natural language generation with mandatory MLP reparameterization rather than bidirectional NLU and token-level sequence tagging with task-dependent reparameterization and linear token classification heads.
aliases:
- P-Tuning v2
- PT-2 Deep Prompt Tuning for NLU
- Multi-Layer Continuous Prompt Tuning for NLU and Sequence Tagging
