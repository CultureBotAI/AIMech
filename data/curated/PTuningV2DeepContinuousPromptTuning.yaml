claims:
- claim_id: r717-claim-deep-layer-prompts
  kind: mechanism
  statement: P-Tuning v2 inserts independent trainable continuous prompts as prefix tokens into every layer (or a selected deep layer interval) of a frozen pretrained Transformer rather than only the input embedding layer, increasing per-task tunable capacity from ~0.01% to 0.1%-3% of backbone parameters and giving deeper-layer prompts direct influence over output predictions.
  evidence:
  - source_id: r717-primary-pdf
    locator: Section 3.2 & Section 4.3, Figures 2-3, pp. 2-3, 5
    relation: supports
- claim_id: r717-claim-linear-head-no-verbalizer
  kind: mechanism
  statement: To support token-level sequence labeling tasks that are incompatible with single-token language-modeling verbalizers, P-Tuning v2 replaces the verbalizer and LM head with a randomly initialized linear classification head over token representations (or [CLS] for sequence classification) and optionally shares continuous prompts across multi-task pre-training before per-task adaptation.
  evidence:
  - source_id: r717-primary-pdf
    locator: Section 3.3 & Section 4.3, Tables 1 and 4, Appendix A, pp. 3, 5, 7
    relation: supports
- claim_id: r717-claim-scale-and-task-universality
  kind: application
  statement: Across bidirectional NLU backbones spanning 330M to 10B parameters (BERT-large, RoBERTa-large, DeBERTa-xlarge, GLM-xlarge, GLM-xxlarge), P-Tuning v2 matches full fine-tuning on SuperGLUE and closes the massive accuracy gap of single-layer prompt tuning on NER (CoNLL03, OntoNotes 5.0, CoNLL04), extractive QA (SQuAD 1.1 and 2.0, where single-layer PT drops to 1.0-2.4 EM on SQuAD 1.1 and 50.2 EM on SQuAD 2.0), and SRL (CoNLL05, CoNLL12).
  evidence:
  - source_id: r717-primary-pdf
    locator: Section 4.1-4.2, Tables 2-3, Figure 1, pp. 1, 4-5
    relation: supports
- claim_id: r717-claim-prompt-length-reparam-limitation
  kind: limitation
  statement: 'Optimal prompt length and MLP reparameterization utility in P-Tuning v2 vary substantially across tasks and datasets: hard sequence labeling tasks require long prefix prompts (around 100 tokens, which increases attention key/value sequence length at every layer), and MLP reparameterization improves RTE and CoNLL04 but degrades performance on CoNLL12 compared to direct embedding optimization.'
  evidence:
  - source_id: r717-primary-pdf
    locator: Section 3.3 & Appendix B, Figure 4, pp. 3, 8
    relation: supports
