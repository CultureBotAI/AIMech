id: AIMech:DiffGrad
name: diffGrad
concept_kind: algorithm
review_status: DRAFT
definition: A first-order adaptive stochastic gradient optimization algorithm that modulates Adam's bias-corrected parameter update by an element-wise diffGrad Friction Coefficient (DFC) xi_{t,i} = 1 / (1 + exp(-|Delta g_{t,i}|)) in [0.5, 1) driven by the first-order backward difference of consecutive gradients Delta g_{t,i} = g_{t-1,i} - g_{t,i}, updating parameters via theta_{t,i} = theta_{t-1,i} - (alpha_t * xi_{t,i} / (sqrt(v_hat_{t,i}) + epsilon)) * m_hat_{t,i} so that rapid gradient changes incur low friction (xi_{t,i} -> 1) and vanishing gradient changes near optima incur high friction (xi_{t,i} -> 0.5) to prevent overshooting.
identity_notes: Distinct from Adam and AMSGrad (which rely solely on exponential moving averages of past gradients m_t and squared gradients v_t without immediate short-term gradient-difference friction) and from AdaBelief (AIMech:AdaBelief, which replaces v_t in the denominator with the EMA of (g_t - m_t)^2). diffGrad retains Adam's bias-corrected moments m_hat_t and v_hat_t and multiplies the step size by the bounded logistic friction factor xi_t = 1 / (1 + exp(-|g_{t-1} - g_t|)) in [0.5, 1).
aliases:
- Difference of Gradients Adaptive Optimization
- Dynamic Friction Sigmoid Adaptive Moment Estimation
- Short-Term Gradient-Change Clamped Adam
