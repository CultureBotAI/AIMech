claims:
- claim_id: diffgrad-friction-coefficient-and-update-rule
  kind: mechanism
  statement: At step t, diffGrad computes the element-wise absolute difference between consecutive gradients |Delta g_{t,i}| = |g_{t-1,i} - g_{t,i}|, passes it through the abs-sigmoid diffGrad Friction Coefficient xi_{t,i} = 1 / (1 + exp(-|g_{t-1,i} - g_{t,i}|)) bounded strictly in [0.5, 1), and updates parameters via theta_{t,i} = theta_{t-1,i} - (alpha_t * xi_{t,i} / (sqrt(v_hat_{t,i}) + epsilon)) * m_hat_{t,i}.
  evidence:
  - source_id: r612-primary-pdf
    locator: Section III, Equations 8-14 and Figure 1, p. 2-4
    relation: supports
  - source_id: r612-metadata-cr
    locator: Bibliographic metadata for Dubey et al. 2020 (DOI:10.1109/TNNLS.2019.2955777)
    relation: supports
- claim_id: diffgrad-online-convex-regret-bound
  kind: scope
  statement: Under Theorem 1 of Dubey et al. (2020), for convex online functions f_t with ||nabla f_t(theta)||_2 <= G, ||nabla f_t(theta)||_inf <= G_inf, and diameter ||theta_n - theta_m||_2 <= D, diffGrad with alpha_t = alpha / sqrt(t) and beta_{1,t} = beta_1 * lambda^{t-1} achieves O(sqrt(T)) regret bounded by R(T) <= (D^2 / (alpha * (1 - beta_1))) * sum_{i=1}^d sqrt(T * v_hat_{T,i}) + (alpha * (1 + beta_1) * G_inf / ((1 - beta_1) * sqrt(1 - beta_2) * (1 - gamma)^2)) * sum_{i=1}^d ||g_{1:T,i}||_2 + sum_{i=1}^d (D_inf^2 * G_inf * beta_1) / ((1 - beta_1) * (1 - lambda)^2 * alpha).
  evidence:
  - source_id: r612-primary-pdf
    locator: Section III-A (Convergence Analysis), Theorem 1, Lemma 2, and Appendix I, p. 4-5, 10-12
    relation: supports
- claim_id: diffgrad-overshoot-prevention-and-cnn-classification-applications
  kind: application
  statement: diffGrad prevents Adam's momentum-induced overshooting out of narrow global valleys on non-convex synthetic objectives (F1-F3) and improves top-1 validation accuracy over Adam, AMSGrad, AdaGrad, and RMSprop on CIFAR-10 and CIFAR-100 across ResNet-18, ResNet-50, ResNet-101, DenseNet-121, MobileNet, SENet, ShuffleNet, VGG16, and GoogleNet.
  evidence:
  - source_id: r612-primary-pdf
    locator: Section III-B (Optimization Toy Examples), Figure 3, and Section IV (Experimental Results), Tables I-IV, p. 5-9
    relation: supports
- claim_id: diffgrad-mini-batch-noise-sensitivity-and-previous-gradient-storage
  kind: limitation
  statement: diffGrad must store the previous step's full gradient tensor g_{t-1} in memory (increasing optimizer state from 2P to 3P floats), and under high mini-batch gradient variance the instantaneous difference |g_{t-1,i} - g_{t,i}| can remain large even near a stationary point, keeping xi_{t,i} close to 1.
  evidence:
  - source_id: r612-primary-pdf
    locator: Section III, Equations 8-14, and Section IV-B, p. 3-4, 7-8
    relation: supports
