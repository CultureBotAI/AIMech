claims:
- claim_id: correlation-matrix-scale-invariance-and-gaussian-concentration-envelope
  kind: mechanism
  statement: 'For linear Gaussian regression Y = mu + epsilon (epsilon ~ N(0, sigma^2 I_n)), submodel
    family M subset M_all = {M subset {1, ..., p} : rank(X_M) = |M|}, and dual projection vectors w_{M,
    i} = v_{M, i} / ||v_{M, i}|| where v_{M, i} is the i-th column of X_M (X_M^t X_M)^{-1} (Equations
    1-5), the PoSI constant K(X, M, alpha, r) = q_{1 - alpha}(gamma_{M, r}) with gamma_{M, r} = (1 / N)
    max_{M in M, i in M} |w_{M, i}^t xi| (Definition 2.1, Equation 6) is invariant to column rescaling
    and depends on X only through the correlation matrix corr(X^t X) = D X^t X D: if corr(X^t X) = corr(Z^t
    Z), then K(X, M, alpha, r) = K(Z, M, alpha, r) (Lemma 2.2, page 5, Appendix B). Moreover, by the Cirel''son-Ibragimov-Sudakov
    Gaussian concentration inequality (Theorem A.1) and studentized conditioning on N ~ sqrt(chi^2_r /
    r) (Proposition A.2, Equations 19-20), K(X, M, alpha, r) <= T(E[gamma_{M, infty}], r, 1 - alpha/2)
    where T(mu, infty, 1 - alpha/2) = mu + sqrt(2 log(2 / alpha)) and for finite r > 0, T(mu, r, 1 - alpha/2)
    <= (mu + sqrt(2 log(2 / alpha))) / (1 - 2 * sqrt(2 log(2 / alpha)) / r)_+ (Proposition 2.3, Equation
    8, and Lemma A.3, Equation 22), while for the s-sparse model collection M_s = {M in M_all : |M| <=
    s}, E[gamma_{M_s, infty}] <= U_sparse(p, s) = sqrt(2 s log(6p / s)) (Lemma 2.4, page 5).'
  evidence:
