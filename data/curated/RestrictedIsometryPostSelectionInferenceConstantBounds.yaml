      2.4; Appendix A, Pages 14-16, Equations (19)-(24), Theorem A.1, Proposition A.2, Lemma A.3; Appendix
      B, Pages 16-18
    relation: supports
  - source_id: bbn2018-crossref
    locator: Electronic Journal of Statistics 12(2):3736-3757 abstract
    relation: supports
- claim_id: restricted-isometry-perturbation-upper-bound-on-gaussian-width
  kind: mechanism
  statement: 'Defining the raw Restricted Isometry Property (RIP) constant kappa(X, s) = sup_{M in M_s}
    ||X_M^t X_M - I_{|M|}||_op and the scale-invariant correlation-matrix RIP constant delta(X, s) = sup_{M
    in M_s} ||corr(X_M^t X_M) - I_{|M|}||_op (Definition 3.1, Equations 9-10), Lemma 3.2 (page 6, Appendix
    B) proves that delta(X, s) <= 2 * kappa(X, s) / (1 - kappa(X, s)) whenever kappa(X, s) < 1 (and delta(X,
    s) = kappa(X, s) when all columns of X have unit norm). Whenever delta = delta(X, s) < 1, writing
    C_M = corr(X_M^t X_M) = Z_M^t Z_M for unit-norm columns z_{M, i} = X_{M, i} / ||X_{M, i}||, the spectrum
    of C_M lies in [1 - delta, 1 + delta], so ||C_M^{-1} e_i|| in [(1 + delta)^{-1}, (1 - delta)^{-1}]
    and ||C_M^{-1/2} e_i|| in [(1 + delta)^{-1/2}, (1 - delta)^{-1/2}] (Equations 14-15), which bounds
    the Euclidean distance between the dual projection vector w_{M, i} and z_{M, i} by ||w_{M, i} - z_{M,
    i}|| <= (1 + delta)^{1/2} * (||C_M^{-1} e_i - e_i|| + |1 - ||C_M^{-1/2} e_i|||) <= 2 * delta * c(delta)
    with c(delta) = sqrt(1 + delta) / (1 - delta) (Equation 16). Taking expectations of sup_{M in M_s,
    i in M} |z_{M, i}^t xi| + sup_{M in M_s, i in M} |(w_{M, i} - z_{M, i})^t xi| proves Theorem 3.3 (Equation
    11, page 7): E[gamma_{M_s, infty}] <= U_RIP(p, s, delta) = sqrt(2 log(2p)) + 2 * delta * (sqrt(1 +
    delta) / (1 - delta)) * sqrt(2 s log(6p / s)).'
  evidence:
  - source_id: bbn2018-pdf
    locator: Section 3.1-3.2, Pages 6-8, Equations (9)-(16), Definition 3.1, Lemma 3.2, Theorem 3.3, Figure
      1; Appendix B, Pages 17-18
    relation: supports
  - source_id: bbn2018-abs
    locator: arXiv:1804.07566v2 abstract
    relation: supports
- claim_id: computable-concentration-and-beta-fisher-union-split-posi-bounds
  kind: mechanism
  statement: 'Section 3.3 and Appendix C (Pages 9, 18-20, Figure 2, Equation 25) derive two computable
    upper bounds on the PoSI constant K(X, M_s, alpha, r) when delta = delta(X, s) < 1: (1) the Gaussian-concentration
    bound U_bar_RIP(p, s, delta) = T(U_RIP(p, s, delta), r, 1 - alpha/2) via Proposition 2.3 and Theorem
    3.3, and (2) the direct Beta-Fisher quantile union-split bound U_tilde_RIP(p, s, delta) = inf_{t in
    (0, 1)} {B_{t*alpha}(n wedge p, r, p) + 2 * delta * c(delta) * B_{(1-t)*alpha}(n wedge p, r, |M_s|)}
    where |M_s| = sum_{i=1}^s i * comb(p, i) and B_beta(d, r, k) is the union-bound envelope for the maximum
    of k projections of a spherical / Beta-Fisher variate in dimension d = n wedge p (equal to sqrt(d)
    * sqrt(q_{1 - beta/(2k)}(Beta(1/2, (d - 1)/2))) when r = infty and sqrt(d) * sqrt(q_{1 - beta/(2k)}(Fisher(1,r)/d))
    when r < infty, Equation 25), which avoids the additive concentration slack sqrt(2 log(2 / alpha))
    and yields strictly tighter PoSI constants than U_bar_RIP for small delta (Figure 2, page 9).'
  evidence:
  - source_id: bbn2018-pdf
    locator: Section 3.3, Page 9, Figure 2; Appendix C, Pages 18-20, Equation (25)
    relation: supports
- claim_id: block-equicorrelated-rip-lower-bound-and-minimax-rate-optimality
  kind: mechanism
  statement: 'For integers p >= 2 and 1 <= k <= p - 1 and correlation parameter c >= 0 with k * c^2 <
    1, Section 4 (Equation 17, page 10) constructs the unit-column design Z^{(c, k)} whose Gram matrix
    has unit diagonal, pairwise correlation c between column p and each of the first k columns, and 0
    elsewhere. Lemma 4.1 (page 10) proves that for any s <= k <= p - 1, kappa(Z^{(c, k)}, s) = delta(Z^{(c,
    k)}, s) = c * sqrt(s - 1), attained by every submodel M of size s containing p and s - 1 indices from
    {1, ..., k}. Partitioning {1, ..., k} into floor(k / s) >= 4 disjoint blocks I_j of size s - 1 and
    setting M_j = I_j cup {p}, Equation (18) (page 11) shows w_{M_j, p}^t xi = (1 / sqrt(1 - (s - 1) *
    c^2)) * (xi_p - c * sum_{i in I_j} xi_i), whence Sudakov''s lower bound on the independent block sums
    proves Proposition 4.2 (page 10): K(Z^{(c, k)}, M_s, alpha, infty) >= A * (c * (s - 1) / sqrt(1 -
    (s - 1) * c^2)) * sqrt(log floor(k / s)) - sqrt(2 log 2) for a universal constant A > 0 (and E[gamma_{M_s,
    infty}] >= A * (c * (s - 1) / sqrt(1 - (s - 1) * c^2)) * sqrt(log floor(k / s))). Corollary 4.3 (pages
    11-12) concludes that for any regime s_p = O(p^gamma) (0 <= gamma < 1) and delta_p = O(p^{-lambda})
    (lambda >= 0), the worst-case PoSI constant over {X : delta(X, s_p) <= delta_p} scales as Theta(sqrt(log
    p) + delta_p * sqrt(s_p * log p)), proving that Theorem 3.3 is minimax rate-optimal whenever delta_p
    = O(1).'
  evidence:
