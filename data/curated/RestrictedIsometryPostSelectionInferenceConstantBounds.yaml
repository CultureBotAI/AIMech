id: AIMech:RestrictedIsometryPostSelectionInferenceConstantBounds
name: Restricted isometry post-selection inference (PoSI) constant upper and lower bounds
concept_kind: mathematical_method
aliases:
- RIP-based post-selection inference (PoSI) constant bounds (Bachoc-Blanchard-Neuvial 2018)
- Correlation-matrix restricted isometry interpolation for universal post-selection confidence intervals
- Gaussian-width and Beta-Fisher quantile bounds for the sparse PoSI constant
- Block-equicorrelated minimax lower bound for the sparse PoSI constant
definition: 'A post-selection inference methodology for linear Gaussian regression Y = mu + epsilon (epsilon
  ~ N(0, sigma^2 I_n)) that bounds the Berk-Brown-Buja-Zhang-Zhao (2013) Post-Selection Inference (PoSI)
  constant K(X, M_s, alpha, r)—the (1 - alpha) quantile of the studentized maximum projection statistic
  gamma_{M_s, r} = (1 / N) max_{M in M_s, i in M} |w_{M, i}^t xi| over all s-sparse submodels M_s = {M
  subset {1, ..., p} : rank(X_M) = |M| <= s} where w_{M, i} = v_{M, i} / ||v_{M, i}|| and v_{M, i} is
  the i-th column of X_M (X_M^t X_M)^{-1}—as an explicit function of the correlation-matrix Restricted
  Isometry Property (RIP) constant delta(X, s) = sup_{M in M_s} ||corr(X_M^t X_M) - I_{|M|}||_op. Because
  K(X, M, alpha, r) depends on X only through corr(X^t X) (Lemma 2.2) and satisfies the Cirel''son-Ibragimov-Sudakov
  Gaussian-concentration quantile bound K(X, M, alpha, r) <= T(E[gamma_{M, infty}], r, 1 - alpha/2) (Proposition
  2.3), decomposing each dual projection vector w_{M, i} into its normalized column z_{M, i} = X_{M, i}
  / ||X_{M, i}|| plus a residual of norm at most 2 * delta * c(delta) with c(delta) = sqrt(1 + delta)
  / (1 - delta) yields the RIP-interpolating Gaussian-width upper bound E[gamma_{M_s, infty}] <= U_RIP(p,
  s, delta) = sqrt(2 log(2p)) + 2 * delta * c(delta) * sqrt(2 s log(6p / s)) (Theorem 3.3) and the sharper
  Beta-Fisher quantile union-split bound U_tilde_RIP(p, s, delta) = inf_{t in (0, 1)} {B_{t*alpha}(n wedge
  p, r, p) + 2 * delta * c(delta) * B_{(1-t)*alpha}(n wedge p, r, |M_s|)} (Section 3.3), smoothly interpolating
  between the orthogonal-design rate sqrt(2 log(2p)) (delta = 0) and the generic sparse rate sqrt(2 s
  log(6p / s)) (Lemma 2.4). A matching lower bound on block-equicorrelated designs Z^{(c, k)} with exact
  RIP constant delta(X, s) = c * sqrt(s - 1) (Lemma 4.1) proves K(X, M_s, alpha, infty) >= A * (c * (s
  - 1) / sqrt(1 - (s - 1) * c^2)) * sqrt(log floor(k / s)) - sqrt(2 log 2) (Proposition 4.2) and establishes
  minimax rate optimality whenever delta_p = O(p^{-lambda}) (Corollary 4.3).'
identity_notes: Distinct from AIMech:ValidPostSelectionInferencePoSIConstant (Berk, Brown, Buja, Zhang,
  & Zhao 2013, The Annals of Statistics 41(2):802-837, arXiv:1206.6451) and AIMech:SimultaneousLinearContrastPostSelectionInference
  (Scheffé / simultaneous sphere-intersection bounds), which introduce the all-subsets PoSI constant K(X,
  M_all, alpha, r), orthogonal vs. worst-case full-model scaling O(sqrt(p)), and canonical-angle sphere-packing
  bounds without Restricted Isometry Property (RIP) perturbation bounds over s-sparse model families M_s.
  Bachoc, Blanchard, & Neuvial (2018, Electronic Journal of Statistics 12(2):3736-3757, arXiv:1804.07566v2,
  DOI:10.1214/18-EJS1490) establish correlation-matrix scale invariance of K(X, M, alpha, r) (Lemma 2.2),
  Gaussian-concentration control of studentized maxima via T(E[gamma_{M, infty}], r, 1 - alpha/2) (Proposition
  2.3, Proposition A.2, Lemma A.3), the correlation-matrix RIP constant delta(X, s) <= 2*kappa(X, s)/(1
  - kappa(X, s)) (Lemma 3.2), the explicit RIP perturbation upper bound U_RIP(p, s, delta) = sqrt(2 log(2p))
  + 2*delta*(sqrt(1+delta)/(1-delta))*sqrt(2s log(6p/s)) (Theorem 3.3) and Beta-Fisher quantile union-split
  bound U_tilde_RIP(p, s, delta) (Section 3.3), and the matching block-equicorrelated lower bound (Lemma
  4.1, Proposition 4.2, Corollary 4.3). Also distinct from AIMech:ReferenceFamilyJERPostHocConfidenceBounds
  (Blanchard, Neuvial, & Roquain 2020) and AIMech:ForestStructuredDKWPostHocConfidenceBounds (Durand,
  Blanchard, Neuvial, & Roquain 2020), which bound false positive counts in multiple hypothesis testing
  rather than linear regression submodel projection coefficients.
