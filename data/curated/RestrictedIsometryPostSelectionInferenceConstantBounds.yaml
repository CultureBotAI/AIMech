    inference constant K(X, M_s, alpha, r) for s-sparse submodels in linear Gaussian regression (AIO:LinearRegression).
- target: AIO:DataDredgingBias
  relation: related_match
  rationale: Valid post-selection confidence intervals calibrated by K(X, M_s, alpha, r) guarantee simultaneous
    (1 - alpha) coverage regardless of the data-driven model selection procedure, preventing post-selection
    data-dredging invalidation (AIO:DataDredgingBias).
limitations:
- Theorem 3.3 and the computable bounds U_bar_RIP(p, s, delta) and U_tilde_RIP(p, s, delta) require the
  correlation-matrix Restricted Isometry Property constant delta(X, s) < 1 and become non-informative
  compared to the generic sparse bound U_sparse(p, s) = sqrt(2 s log(6p / s)) (Lemma 2.4) once 2 * delta
  * sqrt(1 + delta) / (1 - delta) >= 1 (i.e., delta >= 0.36, Section 3.2, page 8, Figure 1).
- Evaluating delta(X, s) = sup_{|M| <= s} ||corr(X_M^t X_M) - I_{|M|}||_op exactly over all comb(p, s)
  sparse submodels of a deterministic design matrix X is NP-hard in general (though delta(X, s) can be
  upper-bounded via the mutual coherence (s - 1) * max_{i != j} |corr(X^t X)_{i, j}| or high-probability
  subgaussian random-matrix bounds, Section 5, pages 12-13).
- 'Three minor typographical slips in arXiv:1804.07566v2 were identified and verified during full-text
  inspection: (1) in Section 2.1 (page 3, line 4), ''irrespective of the model selection mehod used''
  prints ''mehod'' for ''method''; (2) in Section 5 (page 12, line 13), the coverage display writes ''P(forall
  i in M_hat, (M_hat)_{i.M_hat} in CI_{i, M_hat}) >= 1 - alpha'', printing ''(M_hat)_{i.M_hat}'' instead
  of the projected regression coefficient ''(beta_{M_hat})_{i.M_hat}'' (cf. Equation 5 on page 3); and
  (3) in Appendix A Lemma A.3 (page 14, fourth line from bottom), the inline bound ''(mu + sqrt(2 log(2/alpha))/(1
  - 2*sqrt(2 log(2/alpha))/r)_+'' omits the closing parenthesis after ''sqrt(2 log(2/alpha))'' in the
  numerator (whereas Equation 22 in the proof on page 15 correctly writes ''(mu + sqrt(2 log(2/alpha)))
  / (1 - 2*sqrt(2 log(2/alpha))/r)_+'').'
- All 22 pages of the full-text PDF of Bachoc, Blanchard, & Neuvial (2018, Electronic Journal of Statistics
  12(2):3736-3757, arXiv:1804.07566v2, DOI:10.1214/18-EJS1490) were read. Constructed numerical checks
  in research/discovery/restricted-isometry-posi-constant-bounds-boundaries.py verify (1) Lemma 2.2 column-scale
  invariance, Lemma 2.4 sparse cardinality inequality, and Lemma A.3 finite-r quantile bound, (2) Theorem
  3.3 RIP Gaussian-width bound and Section 3.3 Figure 2 comparison (U_orth < U_RIP < U_tilde_RIP < U_bar_RIP
  << U_sparse), and (3) Lemma 4.1 exact RIP constant delta(Z^{(c, k)}, s) = c * sqrt(s - 1), Equation
  (18) block inverse identity, and Theorem 3.3 vector perturbation inequality ||w_{M, i} - z_{M, i}||
  <= 2 * delta * c(delta).
