limitations:
- This record describes the 2014 Kramer et al. CliXO method. Later software releases and extensions require
  separate version and mechanism assessment; the author version-0.3 landing page was read only as provenance
  context.
- The paper supplies a heuristic with noise and missing-edge assumptions, not a certified reconstruction
  of arbitrary ontologies or a semantic ontology reasoner. Distance editing and invisible terms limit
  lossless interpretations.
- The static necessary-clique example does not establish how an implementation orders or removes the current
  pool. Terminal flushing, tie processing and the distance-scaling conventions remain unverified implementation
  questions.
- The missing-edge example in Section 2.2.2 says k+1, while Section 3.2 correctly gives two k−1 cliques
  sharing k−2 vertices. Figure 3 legend and prose also differ about the no-completion parameter setting;
  no disputed numeric result is adopted here.
- All nine primary PDF pages, references, equations, algorithm and figures were read. No author source
  code, experimental datasets, supplementary material or alternative paper version was audited or executed.
  Constructed predicate checks are not benchmark replication. This record remains DRAFT.
