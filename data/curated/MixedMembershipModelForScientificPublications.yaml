name: Mixed-membership model for scientific publications
definition: A generative document model in which one Dirichlet-distributed membership vector mixes aspect-specific
  word distributions for an abstract and aspect-specific reference distributions for its bibliography.
concept_kind: model_family
identity_notes: 'Scoped to the word/reference multinomial model fitted by Erosheva, Fienberg and Lafferty
  in their 2004 scientific-publication study. The broader mixed-membership framework and proposed Bernoulli
  citation alternatives are not exact aliases for this selected model. Shared document memberships couple
  two observation channels; no word-to-reference alignment, author identity or latent network-block membership
  is assumed. No normalized candidate identity matched all 442 pinned AIO IDs, labels and scoped synonyms
  or 426 preceding native IDs, names and aliases. Both full-checkout searches included ignored and hidden
  files; 13 matching lines in each checkout came from four unique file contents containing prior frontier
  leads, contextual distinctions and a cached bibliography mention. Matching concept excerpts were inspected;
  the long cached web transcript was not reread in full. Semantic search returned 204 label/synonym hits:
  200 verified unchanged from prior reading and four newly read. Eighteen annotated AIO CLASS nodes and
  outgoing edges comprise 16 verified unchanged and two newly read; 30 contextual YAMLs comprise 25 unchanged
  prior readings, two newly read AIO records and three final records verified against the round101 scientific-review
  inputs. No candidate identity is present within this bounded pinned-snapshot and maintained-corpus search.'
limitations:
- The main model treats references as multinomial draws with replacement although observed bibliographies
  are represented by presence indicators. Bernoulli inclusion models that use absent references and publication-time
  restrictions are discussed on pp.4-5 as alternatives; they are not the fitted multinomial model.
- The p.4 display labels its integrated document likelihood p(theta|d), but it is not a posterior over
  parameters. Conditional independence given memberships is stronger than exchangeability alone. Shared
  latent proportions explain modeled dependence, not causal citation relationships or objectively true
  scientific disciplines.
- Reported results concern a selected PNAS Biological Sciences 1997-2001 corpus and a chosen eight-aspect
  fit. Topic counts were compared informally, and aspect interpretations used high-probability words/references.
  Neither universal model-selection optimality nor recovery of a unique semantic partition follows.
- 'An unweighted average of document loadings does not generally equal a pooled token-level percentage
  when document lengths differ. Source figure cross-references are inconsistent: use the actual Figure
  1 on preprint p.9 and Table 4 on p.13. No source implementation or benchmark was executed.'
