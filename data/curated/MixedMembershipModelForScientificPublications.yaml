claims:
- claim_id: shared-membership-channels
  kind: mechanism
  statement: For fixed K aspects, each aspect has a categorical word distribution and a separate categorical
    reference-ID distribution. Each document draws lambda from Dirichlet(alpha). Conditional on lambda,
    its word tokens are sampled from the lambda-weighted word mixture and its reference entries from the
    lambda-weighted reference mixture, with channel lengths conditioned on. Equivalently, each word or
    reference draws its own aspect label from the same lambda. The document likelihood integrates the
    product of both channel likelihoods over lambda; their conditional independence does not imply marginal
    independence. Removing the reference observations yields a word-only LDA-type model, whereas fixed
    rather than random membership vectors give a PLSA-style alternative.
  evidence:
  - source_id: method-source
    locator: Mixed Membership Models, preprint pp.2-3; Mixed Membership Models for Documents, pp.3-4,
      Equations (7)-(11)
    relation: supports
- claim_id: approximation-and-loadings
  kind: mechanism
  statement: The reported analysis estimates parameters through a variational approximation to the shared-membership
    likelihood; expectation propagation is discussed as another approximate approach. Approximate document
    membership posteriors supply loadings, summarized by Dirichlet means and compared descriptively with
    official publication categories. This is unsupervised aspect discovery with external category comparison,
    not supervised recovery of those labels. General corpus fitting is computationally demanding even
    though small finite cases can be integrated by explicit expansion; approximate EM and posterior summaries
    do not guarantee exact likelihoods or global optima.
  evidence:
  - source_id: method-source
    locator: Estimating the Model, preprint p.5; Results, pp.7-10, Figure 1 p.9 and Table 4 p.13
    relation: supports
