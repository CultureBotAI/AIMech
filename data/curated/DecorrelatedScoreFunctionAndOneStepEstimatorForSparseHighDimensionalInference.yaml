claims:
- claim_id: claim-decorrelated-score-asymptotic-normality-and-local-power
  kind: mechanism
  statement: "Under Assumptions 3.1\u20133.4 and product sparsity rate $\\eta_1(n) + \\eta_2(n) + s^*\\eta_1(n)\\eta_2(n) + (s^* \\vee s^{\\prime *})\\eta_1(n)\\sqrt{\\log d / n} = o(n^{-1/2})$ (yielding $(s^* \\vee s^{\\prime *})\\log d = o(\\sqrt{n})$ when $\\eta_1(n) \\asymp \\sqrt{s^*\\log d / n}$ and $\\eta_2(n) \\asymp \\sqrt{s^{\\prime *}\\log d / n}$), the decorrelated score statistic $\\widehat{U}_n = \\sqrt{n}\\widehat{S}(0, \\widehat{\\boldsymbol{\\gamma}})\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}}^{-1/2}$ converges in distribution to $N(0, 1)$ under $H_0: \\theta^* = 0$ (Theorem 3.7) and to $N(-c(I^*_{\\theta|\\boldsymbol{\\gamma}})^{1/2}, 1)$ under local alternatives $H_{1n}: \\theta^* = c n^{-1/2}$ (Theorem 3.15), while the one-step estimator $\\widetilde{\\theta} = \\widehat{\\theta} - \\widehat{S}(\\widehat{\\boldsymbol{\\beta}})/\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}}$ satisfies $\\sqrt{n}(\\widetilde{\\theta} - \\theta^*)(\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}})^{1/2} \\rightsquigarrow N(0, 1)$ attaining the semiparametric efficiency bound $(I^*_{\\theta|\\boldsymbol{\\gamma}})^{-1}$ (Corollary 3.10) and uniform validity over parameter classes $\\Omega_0, \\Omega_1$ (Theorems 3.18 and 3.22)."
  evidence:
  - source_id: nl2017-decorr-pdf
    locator: Section 3, pages 9-16, Theorems 3.7, 3.15, 3.18, 3.22, Corollary 3.10; Appendix B, pages 36-46
    relation: supports
- claim_id: claim-linear-and-glm-decorrelated-score-instantiation
  kind: mechanism
  statement: "In high-dimensional linear models $Y_i = \\theta Z_i + \\boldsymbol{\\gamma}^T\\mathbf{X}_i + \\varepsilon_i$, the one-step estimator $\\widetilde{\\theta}$ equals the exact closed-form root of $\\widehat{S}(\\theta, \\widehat{\\boldsymbol{\\gamma}}) = 0$ and coincides algebraically with the Zhang\u2013Zhang low-dimensional projection estimator when $\\widehat{\\mathbf{w}}$ is estimated via Lasso $n^{-1}\\sum_{i=1}^n (Z_i - \\mathbf{w}^T\\mathbf{X}_i)^2 + \\lambda'\\|\\mathbf{w}\\|_1$ (Section 4.1, Equations 4.5\u20134.6), whereas in sparse generalized linear models with log-partition $b(\\eta_i)$, $\\widetilde{\\mathbf{w}}$ is estimated directly by the single weighted Lasso regression $\\arg\\min_{\\mathbf{w}} (2n)^{-1}\\sum_{i=1}^n b''(\\mathbf{Q}_i^T\\widehat{\\boldsymbol{\\beta}})(Z_i - \\mathbf{w}^T\\mathbf{X}_i)^2 + \\lambda'\\|\\mathbf{w}\\|_1$ without computing the full $d \\times d$ inverse weighted Gram matrix required by van de Geer et al. (Section 5, Equation 5.2, Theorem 5.3)."
  evidence:
  - source_id: nl2017-decorr-pdf
    locator: Sections 4-5, pages 16-24, Equations (4.1)-(4.7), (5.1)-(5.3), Theorems 4.3 and 5.3
    relation: supports
- claim_id: claim-multiplier-bootstrap-and-misspecified-generalized-score
  kind: mechanism
  statement: "For high-dimensional null hypotheses $H_0: \\boldsymbol{\\theta}^* = \\mathbf{0} \\in \\mathbb{R}^{d_0}$ with $\\log d_0 = o(n^{1/7})$, the supremum statistic $\\widehat{T}_n = \\|\\sqrt{n}\\widehat{S}(\\mathbf{0}, \\widehat{\\boldsymbol{\\gamma}})\\|_\\infty$ is consistently calibrated by the Gaussian multiplier bootstrap $\\widehat{\\mathbf{N}}_e = n^{-1/2}\\sum_{i=1}^n e_i(\\nabla_{\\boldsymbol{\\theta}}\\ell_i(\\mathbf{0}, \\widehat{\\boldsymbol{\\gamma}}) - \\widehat{\\mathbf{W}}^T\\nabla_{\\boldsymbol{\\gamma}}\\ell_i(\\mathbf{0}, \\widehat{\\boldsymbol{\\gamma}}))$ with $e_i \\sim N(0,1)$ satisfying $\\sup_{\\alpha \\in (0,1)}|\\mathbb{P}_{H_0}(\\widehat{T}_n > c_N(\\alpha)) - \\alpha| = o(1)$ (Section 6.1, Theorem 6.1); under model misspecification or general non-likelihood loss functions $L(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma})$, the generalized score statistic $\\widehat{U}_n^{\\prime} = \\sqrt{n}\\widehat{S}(0, \\widehat{\\boldsymbol{\\gamma}})(\\widehat{\\Sigma}_{\\theta|\\boldsymbol{\\gamma}})^{-1/2}$ replaces the information identity with the sandwich variance estimator $\\widehat{\\Sigma}_{\\theta|\\boldsymbol{\\gamma}} = \\widehat{J}_{\\theta\\theta} - 2\\widehat{\\mathbf{w}}^T\\widehat{\\mathbf{J}}_{\\boldsymbol{\\gamma}\\theta} + \\widehat{\\mathbf{w}}^T\\widehat{\\mathbf{J}}_{\\boldsymbol{\\gamma}\\boldsymbol{\\gamma}}\\widehat{\\mathbf{w}}$ where $\\widehat{\\mathbf{J}} = n^{-1}\\sum_{i=1}^n \\nabla L_i(\\widehat{\\boldsymbol{\\beta}})\\nabla L_i(\\widehat{\\boldsymbol{\\beta}})^T$ (Sections 6.2\u20136.3, Theorems 6.4 and 6.8)."
  evidence:
  - source_id: nl2017-decorr-pdf
    locator: Section 6, pages 24-31, Equations (6.1)-(6.11), Theorems 6.1, 6.4, and 6.8; Appendix D, pages 49-59
    relation: supports
