limitations:
- Asymptotic normality of the decorrelated score statistic and one-step estimator requires both the initial parameter sparsity s* = ||gamma*||_0 and the score-projection sparsity s'^* = ||w*||_0 to satisfy the ultra-sparse product rate (s* v s'^*) log d = o(sqrt(n)) (Theorems 3.7, 4.3, and 5.3); if the inverse Fisher information direction w* = (I*_{gamma,gamma})^{-1} I*_{gamma,theta} is dense, the remainder term sqrt(n)(w_hat - w*)^T nabla^2_{gamma,gamma} ell (gamma_hat - gamma*) need not vanish.
- 'The Gaussian multiplier bootstrap for high-dimensional null hypotheses H_0: theta* = 0 in R^{d_0} requires log d_0 = o(n^{1/7}) together with sub-exponential score and Hessian moment bounds (Assumptions 6.1-6.3, Theorem 6.1).'
- 'Primary-source typographical audit of Ning & Liu (2017, arXiv:1412.8765v2) uncovered five minor notation and typographical issues that are corrected in this record: (1) Section 3.1 Assumption 3.4 (p. 10) writes ''sqrt(n) v^{*T} nabla ell(0, gamma*) / sqrt(v^T I* v) -> N(0,1)'' omitting the superscript ''*'' on ''v*'' inside the denominator (corrected in Assumption 3.12 on p. 12); (2) Section 3.3 Remark 3.24 Eq. (3.14) (p. 15) writes ''|P_{beta*}(T_n = 1) - psi_alpha)| = 0'' with an unmatched closing parenthesis after ''psi_alpha''; (3) Section 5.3 p. 24 line 11 writes ''Bases on these assumptions'' instead of ''Based on these assumptions''; (4) Section 6.1 display for N_hat_e (p. 26) and Appendix D.1 Proof of Theorem 6.1 (p. 49) write ''N_hat_e = n^{-1/2} sum_{i=1}^n e_i(nabla_theta ell_i(0, gamma_hat) - W_hat^T nabla_gamma ell(0, gamma_hat))'' omitting the sample subscript ''i'' on the second ''ell_i(0, gamma_hat)''; and (5) Appendix C.3 Lemma C.5 Eq. (C.3) (p. 48) defines the constrained estimator w_bar in the first bound but writes ''(w_tilde - w*)^T X_i'' instead of ''(w_bar - w*)^T X_i'' in the second display.'
