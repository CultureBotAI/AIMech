id: AIMech:DecorrelatedScoreFunctionAndOneStepEstimatorForSparseHighDimensionalInference
name: Decorrelated Score Function and One-Step Estimator for Sparse High-Dimensional Inference
concept_kind: algorithm
review_status: DRAFT
definition: "A general hypothesis-testing and confidence-region methodology (introduced by Yang Ning and Han Liu in 2017) for a low-dimensional or growing parameter of interest $\\boldsymbol{\\theta} \\in \\mathbb{R}^{d_0}$ in the presence of a high-dimensional sparse nuisance parameter $\\boldsymbol{\\gamma} \\in \\mathbb{R}^{d-d_0}$ ($d \\gg n$) under smooth empirical risk or negative log-likelihood $\\ell(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma}) = n^{-1}\\sum_{i=1}^n \\ell_i(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma})$. By projecting the target score $\\nabla_{\\boldsymbol{\\theta}}\\ell(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma})$ onto the nuisance tangent space via $\\mathbf{w}^* = (\\mathbf{I}_{\\boldsymbol{\\gamma}\\boldsymbol{\\gamma}}^*)^{-1}\\mathbf{I}_{\\boldsymbol{\\gamma}\\boldsymbol{\\theta}}^*$ where $\\mathbf{I}^* = \\mathbb{E}_{\\boldsymbol{\\beta}^*}(\\nabla^2\\ell(\\boldsymbol{\\beta}^*))$, the method defines the population *decorrelated score function* $S(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma}) = \\nabla_{\\boldsymbol{\\theta}}\\ell(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma}) - \\mathbf{w}^{*T}\\nabla_{\\boldsymbol{\\gamma}}\\ell(\\boldsymbol{\\theta}, \\boldsymbol{\\gamma})$ satisfying $\\mathbb{E}_{\\boldsymbol{\\beta}^*}[\\nabla_{\\boldsymbol{\\theta}}\\ell(\\boldsymbol{\\theta}^*, \\boldsymbol{\\gamma}^*)S^T(\\boldsymbol{\\theta}^*, \\boldsymbol{\\gamma}^*)] = \\mathbf{0}$ (Equation 2.4). Given an initial penalized M-estimator $\\widehat{\\boldsymbol{\\beta}} = (\\widehat{\\boldsymbol{\\theta}}, \\widehat{\\boldsymbol{\\gamma}})$ (Equation 2.5) and a Dantzig-selector or penalized quadratic projection estimator $\\widehat{\\mathbf{w}}$ (Equations 2.6\u20132.7), the plug-in decorrelated score $\\widehat{S}(\\boldsymbol{\\theta}, \\widehat{\\boldsymbol{\\gamma}}) = \\nabla_{\\boldsymbol{\\theta}}\\ell(\\boldsymbol{\\theta}, \\widehat{\\boldsymbol{\\gamma}}) - \\widehat{\\mathbf{w}}^T\\nabla_{\\boldsymbol{\\gamma}}\\ell(\\boldsymbol{\\theta}, \\widehat{\\boldsymbol{\\gamma}})$ converts first-order nuisance estimation bias into the second-order Taylor product $(\\widehat{\\mathbf{w}} - \\mathbf{w}^*)^T\\nabla^2_{\\boldsymbol{\\gamma}\\boldsymbol{\\gamma}}\\ell(\\boldsymbol{\\theta}, \\widetilde{\\boldsymbol{\\gamma}})(\\widehat{\\boldsymbol{\\gamma}} - \\boldsymbol{\\gamma}^*)$ without inverting the full $d \\times d$ Hessian. This yields the asymptotically normal score statistic $\\widehat{U}_n = \\sqrt{n}\\widehat{S}(\\mathbf{0}, \\widehat{\\boldsymbol{\\gamma}})\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}}^{-1/2} \\rightsquigarrow N(0, 1)$ where $\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}} = \\nabla^2_{\\theta\\theta}\\ell(\\widehat{\\boldsymbol{\\beta}}) - \\widehat{\\mathbf{w}}^T\\nabla^2_{\\boldsymbol{\\gamma}\\theta}\\ell(\\widehat{\\boldsymbol{\\beta}})$ (Algorithm 1, Theorem 3.7), the semiparametrically efficient *one-step estimator* $\\widetilde{\\theta} = \\widehat{\\theta} - \\widehat{S}(\\widehat{\\boldsymbol{\\beta}})/\\widehat{I}_{\\theta|\\boldsymbol{\\gamma}}$ (Equation 2.9, Corollary 3.10), the Gaussian multiplier bootstrap supremum test $\\widehat{T}_n = \\|\\sqrt{n}\\widehat{S}(\\mathbf{0}, \\widehat{\\boldsymbol{\\gamma}})\\|_\\infty$ for high-dimensional nulls $H_0: \\boldsymbol{\\theta}^* = \\mathbf{0} \\in \\mathbb{R}^{d_0}$ (Section 6.1, Theorem 6.1), and sandwich-variance-adjusted tests under model misspecification and general non-likelihood losses (Sections 6.2\u20136.3, Theorems 6.4 and 6.8)."
identity_notes: "Resolved against all 442 pinned AIO concepts and 671 maintained AIMech concepts. Distinct from `AIMech:LowDimensionalProjectionAndDebiasedLassoConfidenceIntervalsForHighDimensionalLinearAndGeneralizedLinearModels` (Zhang & Zhang 2014 / van de Geer et al. 2014, which invert or row-project the empirical predictor Gram matrix to de-bias point estimates directly), from `AIMech:GaussianGraphicalModelPrecisionMatrixEstimationWithNodewiseLassoAndL1PenalizedLikelihood` (Meinshausen & B\xFChlmann 2006 / Yuan & Lin 2007, which estimate Gaussian graphical model edges and precision matrices rather than performing hypothesis tests via score Hilbert-space projections), from `AIMech:OrthogonalScoreAndWeightedDoubleSelectionPostSelectionInferenceInHighDimensionalQuantileRegression` (Belloni, Chernozhukov, & Kato 2019, which construct density-weighted check-loss instruments specifically for non-smooth quantile regression), and from `AIMech:DoubleDebiasedMachineLearningWithNeymanOrthogonalScoresAndCrossFitting` (Chernozhukov et al. 2018, which rely on sample-splitting cross-fitting with generic black-box ML nuisance learners rather than full-sample Dantzig/Lasso score projection with product sparsity $(s^* \\vee s^{\\prime *})\\log d = o(\\sqrt{n})$, semiparametric one-step updates, and multiplier bootstrap tests for growing $d_0$)."
