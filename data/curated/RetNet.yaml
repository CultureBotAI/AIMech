name: Retentive network
definition: An autoregressive neural sequence architecture that stacks pre-normalized residual blocks
  combining gated multi-scale retention with feedforward transformations, with parallel, recurrent and
  chunkwise forms of retention.
concept_kind: architecture
identity_notes: RetNet denotes Sun and colleagues' architecture, not a generic recurrent network or an
  attention-based Transformer language model. Its retention operation is a component, while the architecture
  also specifies gating, normalization, residual paths and feedforward blocks.
limitations:
- Constant recurrent decoding cost is with respect to prior sequence length at fixed model dimensions,
  not constant total work for a whole sequence or arbitrary model size.
- The mathematical parallel, recurrent and chunkwise representations do not by themselves establish identical
  finite-precision outputs for every implementation; numerical score-normalization details matter.
- This record does not generalize the paper's reported benchmark or hardware results.
