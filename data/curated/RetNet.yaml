claims:
- claim_id: sequence-mechanism
  kind: mechanism
  statement: Retention projects position-modulated queries, keys and values and combines causal query-key
    interactions with exponential distance decay. Different heads use fixed decay scales; headwise normalization
    and a swish gate combine their outputs. Recurrent evaluation updates a decayed key-value state, and
    chunkwise evaluation combines parallel within-chunk interactions with recurrent cross-chunk state.
