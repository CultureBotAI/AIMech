  relation: supports
claims:
- claim_id: search-procedure
  kind: mechanism
  statement: Retain the current, previous, successor and relay layers, with relay references used to divide
    path reconstruction into smaller searches. If chronological backtracking reaches a layer no longer
    stored, replay from the start using the saved beam-stack ranges to rebuild it. For the general non-unit-cost
    case in the paper, retain the best goal information and delay path reconstruction until backtracking
    begins.
  evidence:
  - source_id: method-source
    locator: Memory efficiency and Divide-and-conquer beam search, PDF p. 4; Divide-and-conquer beam-stack
      search and Figure 1, PDF p. 5; continuation on PDF p. 6
    relation: supports
- claim_id: disk-variant-boundary
  kind: scope
  statement: A separately described external-memory option stores old layers on disk instead of regenerating
    them. Restoring a layer also requires the previous layer for duplicate detection and repairing relay
    references; disk use is an optional implementation extension, not part of every DCBSS execution.
  evidence:
  - source_id: external-memory-boundary
    locator: Using external memory, PDF p. 6
    relation: supports
