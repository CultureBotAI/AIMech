id: AIMech:StemStochasticTwoSidedMomentumForFederatedLearning
name: STEM (Stochastic Two-Sided Momentum for Federated Learning)
concept_kind: algorithm
review_status: DRAFT
definition: A federated non-convex stochastic optimization algorithm (Khanduri et al. 2021, Section 2, Algorithm 1, Equations 2-5) in which each client k in {1, ..., K} updates its local parameters x_{t+1}^{(k)} = x_t^{(k)} - eta_t d_t^{(k)} using a STORM-style recursive stochastic momentum estimator d_t^{(k)} = (1/b) sum_{xi in B_t^{(k)}} nabla f^{(k)}(x_t^{(k)}; xi) + (1 - a_t)(d_{t-1}^{(k)} - (1/b) sum_{xi in B_t^{(k)}} nabla f^{(k)}(x_{t-1}^{(k)}; xi)), and every I steps the server aggregates and broadcasts both the global model bar_x_t = (1/K) sum_{k=1}^K x_t^{(k)} and the global momentum direction bar_d_t = (1/K) sum_{k=1}^K d_t^{(k)}.
identity_notes: Distinct from single-node STORM (AIMech:StormStochasticRecursiveMomentumForNonconvexOptimization, Cutkosky & Orabona 2019), which operates on a single machine without periodic multi-step local updates or inter-client heterogeneity, from SlowMo (AIMech:SlowMoSlowMomentumForCommunicationEfficientDistributedSgd, Wang et al. 2020), which applies klassical Polyak momentum only at the outer server synchronization step with O(epsilon^{-2}) sample complexity, and from MIME (AIMech:MimeMimickingCentralizedStochasticAlgorithmsInFederatedLearning, Karimireddy et al. 2021), which holds server statistics fixed during local steps.
aliases:
- STEM
- Stochastic Two-Sided Momentum
- STEM Federated Recursive Momentum
