claims:
- claim_id: r432-sample-and-communication-complexity-tradeoff-curve-theorem
  kind: mechanism
  statement: By setting the local update period I = O((T / K^2)^{nu / 3}) and minibatch size b = O((T / K^2)^{1/2 - nu / 2}) for any trade-off parameter nu in [0, 1], STEM achieves E||nabla f(bar_x_a)||^2 = O_tilde(1 / (K^{2 nu / 3} T^{1 - nu / 3})) (Theorem 3.1), simultaneously attaining near-optimal per-client sample complexity O_tilde(K^{-1} epsilon^{-3/2}) (total O_tilde(epsilon^{-3/2})) and communication complexity O_tilde(epsilon^{-1}) across the entire spectrum nu in [0, 1] without requiring large O(epsilon^{-1}) minibatches when nu = 1 (b = O(1), I = O((T / K^2)^{1/3}), Corollary 3.2).
  evidence:
  - source_id: r432-primary-pdf
    locator: Section 3 Convergence Analysis (Theorem 3.1, Corollary 3.2, Table 1) & Appendix B (Lemmas B.1-B.5, Proof of Theorem 3.1)
    relation: supports
- claim_id: r432-fedavg-minibatch-local-step-tradeoff-comparison
  kind: mechanism
  statement: In contrast, momentum-less FedAvg along the trade-off curve I = O((T / K^3)^{nu / 6}) and b = O((T / K^3)^{1/3 - nu / 3}) achieves only E||nabla f(bar_x_a)||^2 = O(1 / (K^{nu / 2} T^{2/3 - nu / 6})), requiring O(K^{-1} epsilon^{-2}) per-client samples and O(epsilon^{-3/2}) communication rounds for every nu in [0, 1] (Theorem 3.2, Corollary 3.3).
  evidence:
  - source_id: r432-primary-pdf
    locator: Section 3.1 Federated Averaging Trade-off (Theorem 3.2, Corollary 3.3, Figure 1)
    relation: supports
- claim_id: r432-two-gradient-evaluations-per-minibatch-and-dual-payload-limitation
  kind: limitation
  statement: Requires two stochastic gradient evaluations per local step on the same minibatch B_t^{(k)} (at x_t^{(k)} and x_{t-1}^{(k)}) under mean-squared smoothness, and doubles communication payload at synchronization rounds by transmitting both x_t^{(k)} and d_t^{(k)}.
  evidence:
  - source_id: r432-primary-pdf
    locator: Section 2 Algorithm 1, Assumption 1 & Section 3 Remark 1
    relation: supports
- claim_id: r432-heterogeneous-cifar10-and-mnist-cnn-federated-training-application
  kind: application
  statement: Applied to federated non-IID training of convolutional neural networks on MNIST and CIFAR-10 across heterogeneous client partitions, outperforming FedAvg, SCAFFOLD, and server-only momentum baselines across varying minibatch sizes and local periods.
  evidence:
  - source_id: r432-primary-pdf
    locator: Section 4 Numerical Experiments (Figures 2-3), pp. 6058-6059
    relation: supports
