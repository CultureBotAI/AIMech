claims:
- claim_id: rocketqav2-dynamic-listwise-kl-distillation
  kind: mechanism
  statement: RocketQAv2 normalizes dual-encoder and cross-encoder relevance scores across the candidate passage list C_q = {p^+, p^-_1, ..., p^-_{K-1}} using listwise softmax distributions p~_de(q, p_i) and p~_ce(q, p_i) (Equations 5-6) and jointly optimizes L_final = L_kl + L_ce where L_kl = sum_{i=1}^K p~_ce(q, p_i) log(p~_ce(q, p_i) / p~_de(q, p_i)) and L_ce = -log p~_ce(q, p^+) (Equations 7-8), allowing the dual-encoder to track continuous listwise score changes of the cross-encoder online during training.
  evidence:
  - source_id: r758-primary-pdf
    locator: Section 2.2 Dynamic Listwise Distillation, Equations 5-8, pp. 2-3
    relation: supports
  - source_id: r758-primary-pdf
    locator: main() verification of listwise softmax KL divergence L_kl, cross-encoder NLL L_ce, and gradient descent step
    relation: supports
- claim_id: rocketqav2-hybrid-data-augmentation
  kind: mechanism
  statement: To construct high-quality candidate lists C_q for joint training and iterative refinement, RocketQAv2 applies hybrid data augmentation (Section 2.3, Figure 1b) that combines dual-encoder hard-negative retrieval with cross-encoder denoising to filter out false negatives (unlabeled relevant passages) while retaining informative hard negatives.
  evidence:
  - source_id: r758-primary-pdf
    locator: Section 2.3 Hybrid Data Augmentation & Section 3.2 Analysis, Figure 1b, Tables 3-5, pp. 2-6
    relation: supports
- claim_id: rocketqav2-benchmark-applications
  kind: application
  statement: On MS MARCO Passage Ranking and Natural Questions (NQ), RocketQAv2 improves both dense retrieval and passage reranking over RocketQA and prior methods, reaching 38.8 MRR@10 and 86.2% Recall@50 in dense retrieval on MS MARCO Dev (41.9 MRR@10 after reranking) and 75.1% Recall@5 / 83.7% Recall@20 on NQ test (Tables 1-2).
  evidence:
  - source_id: r758-primary-pdf
    locator: Section 3.1 Main Results, Tables 1-2, pp. 4-5
    relation: supports
  - source_id: r758-metadata-cr
    locator: BibTeX citation record for arXiv:2110.07367 (EMNLP 2021)
    relation: supports
- claim_id: rocketqav2-computational-overhead-limitation
  kind: limitation
  statement: Because RocketQAv2 evaluates both the dual-encoder and the cross-encoder on all K passages in the candidate list C_q at every joint training step and requires a warmed-up cross-encoder for initial hybrid data augmentation, its per-step GPU memory and compute cost during training is substantially higher than training a standalone dual-encoder.
  evidence:
  - source_id: r758-primary-pdf
    locator: Section 2.3 Training Procedure & Section 3.1 Implementation Details, pp. 3-4
    relation: supports
