definition_evidence:
- source_id: saem-source
  locator: Section 3 Eq6, pp.97-98 / PDF4-5; Section 6 Eq30, p.107 / PDF14
  relation: supports
claims:
- claim_id: recursive-expectation
  kind: mechanism
  statement: 'Simulate latent completions under the current conditional law and update Q_k(theta)=(1-gamma_k)Q_(k-1)(theta)+gamma_k
    times the current sample mean of complete log objectives. Maximize Q_k to obtain the next parameter.
    For the stated curved exponential family, store sufficient statistics instead: s_k=s_(k-1)+gamma_k(S(z_k)-s_(k-1)),
    followed by theta_k=theta_hat(s_k). The one-draw construction can therefore retain past information
    without storing every prior completion.'
  evidence:
  - source_id: saem-source
    locator: Section 3 Eq6, pp.97-98 / PDF4-5; M1-M5, pp.99-100 / PDF6-7; Section 6 Eq30, p.107 / PDF14
    relation: supports
- claim_id: step-sizes-and-stationary-set
  kind: scope
  statement: The single-draw stationary-set theorem requires a smooth curved-exponential complete model
    and maximizer map, exact conditional simulation given the past, finite continuous second moments,
    step sizes in [0,1] with divergent sum and finite sum of squares, and almost-sure containment of the
    statistic iterates in a compact subset of their domain. Under those hypotheses the distance to the
    stated stationary sets tends to zero. Step-size conditions alone do not supply stability, point convergence,
    a global maximum or observed-likelihood ascent at every iteration.
  evidence:
  - source_id: saem-source
    locator: Section 6 SAEM1-SAEM4 and Theorem 5, pp.107-109 / PDF14-16
    relation: supports
- claim_id: averaging-and-estimation-boundaries
  kind: scope
  statement: Recursive averaging of the expected objective precedes its maximization. Optional averaging
    of fitted parameter iterates is a separate operation with additional local stability, moment and step-size
    conditions. Averaging statistics before a nonlinear maximizer need not equal averaging parameter values.
    Simulation-iteration uncertainty around a fixed-data solution is distinct from sampling uncertainty
    of the statistical estimator.
  evidence:
  - source_id: saem-source
    locator: Sections 5.1 and 7, pp.104-106 and 110-113 / PDF11-13 and 17-20; Eq26 and Eq48-55
    relation: supports
- claim_id: source-sign-and-zero-step
  kind: limitation
  statement: 'In Eq6, gamma=0 freezes the accumulated objective, while gamma=1 replaces it by the current
    Monte Carlo objective; the paragraph identifying gamma=0 with ordinary stochastic EM is inconsistent
    with that recursion. The 1999 covariance prose also reverses the Hessian sign: its H=G-Delta Delta^T
    estimates the observed log Hessian, while observed information is -H, as explicitly used in the 2004
    follow-up. These printed statements are not used as implementation rules.'
  evidence:
  - source_id: saem-source
    locator: Section 3 Eq6 and following paragraph, p.97 / PDF4; Section 3 Eq11 and Hessian prose, p.99
      / PDF6
    relation: supports
  - source_id: mcmc-source
    locator: Section 2.3 Eq8-10, p.119 / PDF5; compare 1999 Section 3 Eq6 and Eq11, pp.97,99 / PDF4,6
    relation: supports
limitations:
- The core mechanism is supported independently of the source’s stronger local-maximizer and averaging
  claims. Those results need additional isolated-stationary-point, curvature, excitation and local-rate
  hypotheses. Their printed exposition contains sign/wording inconsistencies; no blanket theorem repair
  or global convergence certification is claimed.
- A finite stochastic update need not increase the observed likelihood. The finite Gaussian example lowers
  it even with a positive averaging weight; stabilization and convergence need separate arguments.
- The source’s expanding-compact reset scheme, approximate conditional maximizations and stochastic-gradient
  extensions introduce additional assumptions. They are not silently covered by the core exact-maximizer
  theorem.
- The source’s Eq27 average-noise expression omits a Jacobian factor present in its later proof, and its
  Section 8 Newton direction and convexity wording conflict with concave maximization. These extension
  formulas are not implemented or endorsed by this record.
- Independent exact conditional draws are an assumption of the inspected base theorem, not a property
  of a short MCMC run. The separately scoped MCMC-SAEM extension handles a different noise structure.
- All 52 pages of the two primary papers were read. No author software, historical fit, empirical speed
  comparison or uncertainty-calibration study was reproduced.
