id: AIMech:CMARankMuCovarianceUpdate
name: CMA rank-mu covariance update
concept_kind: mathematical_method
aliases: []
definition: A covariance-valued update component introduced in the 2003 CMA-ES construction that forms
  an equal-weight second moment of selected mutation steps about the old sampling mean and blends it with
  an evolution-path outer product and the previous search covariance.
definition_evidence:
- source_id: hansen2003
  locator: Section 3, PDF pp. 5–6 / printed pp. 4–5, motivation and Equations 10–11; Section 2, PDF p.
    4 / printed p. 3, sampling and evolution-path definitions.
  relation: supports
claims:
- claim_id: selected-old-mean-second-moment
  kind: mechanism
  statement: For integer search dimension n>=1, current mean m, positive global scale sigma and covariance
    C=B*D^2*B^T, write each selected offspring step as y_i=(x_i-m)/sigma=B*D*z_i. With an integer mu>=1
    selected offspring, the original equal-weight construction forms Z=(1/mu)*sum_i(y_i*y_i^T). The steps
    use the old sampling mean and scale. Z is their uncentered second moment, not their covariance about
    the newly selected mean and not the outer product of their average step.
  evidence:
  - source_id: hansen2003
    locator: Section 2, PDF p. 4 / printed p. 3, Equations 1–4; Section 3, PDF p. 6 / printed p. 5, Equation
      10. The centering distinction is a direct algebraic reading of these formulas.
    relation: supports
- claim_id: path-and-population-covariance-blend
  kind: mechanism
  statement: The source retains the evolution path p_new=(1-c_c)*p+sqrt(c_c*(2-c_c))*sqrt(mu)*mean_i(y_i),
    then updates the search covariance by C_new=(1-c_cov)*C+c_cov*(alpha*p_new*p_new^T+(1-alpha)*Z). Here
    alpha is the source alpha_cov in [0,1]. The path outer product represents accumulated mean-step information,
    while Z uses individual selected steps from the current generation. This is a covariance-update component,
    not a complete initialization, sampling, selection or termination algorithm.
  evidence:
  - source_id: hansen2003
    locator: Section 2, PDF p. 4 / printed p. 3, Equations 5–6; Section 3, PDF p. 6 / printed p. 5, Equations
      10–11.
    relation: supports
- claim_id: blend-endpoints-and-host-boundary
  kind: scope
  statement: At alpha=1 the blend recovers the rank-one covariance rule reviewed in the source; alpha=0
    uses Z as the sole added moment, and alpha=1/mu is the hybrid configuration studied there. The paper
    labels these Orig-CMA, New-CMA and Hybr-CMA. These are configurations of the construction, not asserted
    exact aliases for its component identity. The modification leaves the host global step-size adaptation
    unchanged, so its scalar exponential update is outside the defining Eq. 10–11 component.
  evidence:
  - source_id: hansen2003
    locator: Section 3, PDF pp. 5–6 / printed pp. 4–5, unchanged global step-size statement and text following
      Equation 11; Section 6 opening paragraph, PDF p. 8 / printed p. 7, variant names.
    relation: supports
- claim_id: rank-and-positive-definite-domain
  kind: scope
  statement: Z is positive semidefinite and has rank at most min(mu,n). Equality requires the selected
    vectors to have the corresponding span; the source’s equality statement is interpreted with this generic
    full-span qualification. For positive-definite C, alpha in [0,1] and 0<=c_cov<1, the blend remains
    positive definite. At c_cov=1, the positively weighted path and selected steps must together span
    the space to ensure positive definiteness. These are exact-arithmetic consequences of the outer-product
    blend, not numerical-conditioning guarantees.
  evidence:
  - source_id: hansen2003
    locator: Section 3, PDF p. 6 / printed p. 5, Equation 10 and its rank statement, followed by Equation
      11. The rank bound and positive-definiteness conditions are explicit curator linear-algebra consequences.
    relation: supports
- claim_id: neutral-selection-and-path-initialization-scope
  kind: scope
  statement: 'Under the paper’s neutral-selection or unchanged selected-law idealization, independent
    zero-mean selected Gaussian steps with covariance C give E[Z]=C. This is not an unbiasedness claim
    under arbitrary fitness selection. The analogous path second moment additionally depends on its distribution:
    with frozen C, p_0=0 and 0<c_c<=1, the first path has E[p_1*p_1^T]=c_c*(2-c_c)*C. Consequently the
    first covariance expectation is [1-c_cov*alpha*(1-c_c)^2]*C. This bounded curator derivation distinguishes
    zero initialization from a stationary path idealization; it is not a theorem about the full adaptive
    run.'
  evidence:
  - source_id: hansen2003
    locator: Section 2, Equation 5, PDF p. 4 / printed p. 3, and zero-path initialization on PDF p. 5
      / printed p. 4; Section 3, Equations 13–14 on PDF p. 6 / printed p. 5 and the expectation paragraph
      continuing on PDF p. 7 / printed p. 6. The first-step expectations are curator algebra under the
      stated frozen-law assumptions.
    relation: supports
- claim_id: empirically-chosen-covariance-rate
  kind: scope
  statement: 'The source couples the new covariance mechanism to an empirical learning-rate prescription:
    Equation 12 blends the original rate 2/(n+sqrt(2))^2 with min(1,(2*mu-1)/((n+2)^2+mu)), using alpha
    and 1-alpha. Section 4 obtains this expression by trial and error on ellipsoidal tests and chooses
    conservative rates below the measured optima. Its experimental choice lambda=4*mu is not a universal
    requirement of the covariance formula, and the prescription is not asserted optimal for arbitrary
    objectives.'
  evidence:
  - source_id: hansen2003
    locator: Section 3, Equation 12, PDF p. 6 / printed p. 5; Section 4, PDF p. 7 / printed p. 6, experimental
      rate selection and Equation 15; Section 5 continuation, PDF p. 8 / printed p. 7, population-size
      setting.
    relation: supports
