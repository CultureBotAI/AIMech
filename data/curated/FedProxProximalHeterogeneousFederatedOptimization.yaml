claims:
- claim_id: r385-gamma-inexact-proximal-surrogate-and-partial-work-aggregation
  kind: mechanism
  statement: By replacing the unconstrained local objective F_k(w) of FedAvg with the proximal surrogate h_k(w; w^t) = F_k(w) + (mu / 2) * ||w - w^t||^2 (whose gradient at w^t equals grad F_k(w^t)) and formalizing variable device- and round-dependent local computation via Definition 2's gamma_k^t-inexactness condition ||grad h_k(w_k^{t+1}; w^t)|| <= gamma_k^t * ||grad F_k(w^t)|| for gamma_k^t in [0, 1), Algorithm 2 aggregates partial updates from straggling devices while restricting local iterate deviation ||w_k^{t+1} - w^t|| <= ((1 + gamma_k^t) / bar_mu) * ||grad F_k(w^t)||.
  evidence:
  - source_id: r385-primary-pdf
    locator: Section 3.1-3.2 Definitions 1-2, Algorithm 2, and Appendix A.1 Equations (6)-(7), pp. 3-5, 13
    relation: supports
- claim_id: r385-b-dissimilarity-nonconvex-expected-descent-guarantee
  kind: mechanism
  statement: Under Definition 3's B-local dissimilarity E_k[||grad F_k(w)||^2] <= B^2 * ||grad f(w)||^2 for L-smooth, L_minus-weakly convex local functions with bar_mu = mu - L_minus > 0, Theorem 4 and Corollary 9 prove that each round satisfies E_{S_t}[f(w^{t+1})] <= f(w^t) - rho * ||grad f(w^t)||^2 with rho = (1 - gamma * B) / mu - (L * B * (1 + gamma)) / (mu * bar_mu) - (L * (1 + gamma)^2 * B^2) / (2 * bar_mu^2 * K) > 0, achieving O(L * B^2 * Delta / epsilon) iteration complexity to an epsilon-stationary point (Theorem 6 and Corollary 7).
  evidence:
  - source_id: r385-primary-pdf
    locator: Section 4 Definition 3, Assumption 1, Theorem 4, Remark 5, Theorem 6, and Corollaries 7-9, pp. 5-6
    relation: supports
- claim_id: r385-proximal-penalty-tuning-and-nonzero-bias-limitation
  kind: limitation
  statement: Setting mu too large slows convergence on IID data by excessively restricting local updates near w^t, and under non-vanishing gradient variance sigma^2 > 0 at the optimum (Theorem 11), dissimilarity B_epsilon <= sqrt(1 + sigma^2 / epsilon) grows as epsilon -> 0, requiring larger mu = O(L * sigma^2 / epsilon) and K = O(sigma^2 / epsilon).
  evidence:
  - source_id: r385-primary-pdf
    locator: Section 5.3.1-5.3.2 (Choosing mu) and Appendix A.2 Corollary 10 & Theorem 11, pp. 8-9, 14
    relation: supports
- claim_id: r385-heterogeneous-federated-benchmarks-application
  kind: application
  statement: Applied to federated multinomial logistic regression on MNIST and FEMNIST and nonconvex LSTM language/sentiment modeling on Shakespeare and Sent140 under 50% and 90% device straggler rates, improving testing accuracy by 22% on average in highly heterogeneous settings.
  evidence:
  - source_id: r385-primary-pdf
    locator: Section 5 Experiments, Table 1 and Figures 1-3, pp. 6-9
    relation: supports
