id: AIMech:FedProxProximalHeterogeneousFederatedOptimization
name: FedProx Proximal Heterogeneous Federated Optimization with Variable Inexact Local Work
concept_kind: algorithm
review_status: DRAFT
definition: A federated optimization framework (FedProx) for statistically and systemically heterogeneous networks in which each round t samples K devices (with probabilities p_k) and each selected device k computes a gamma_k^t-inexact local minimizer w_{k}^{t+1} of the proximal-regularized local surrogate h_k(w; w^t) = F_k(w) + (mu / 2) * ||w - w^t||^2 satisfying ||grad h_k(w_k^{t+1}; w^t)|| <= gamma_k^t * ||grad F_k(w^t)|| with gamma_k^t in [0, 1) determined by device-specific systems constraints, followed by server aggregation w^{t+1} = (1/K) sum_{k in S_t} w_k^{t+1}, guaranteeing O(1/epsilon) nonconvex stationarity convergence under B-local gradient dissimilarity without dropping straggler devices or requiring stateful client memory.
identity_notes: Distinct from control-variate drift correction (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning, which requires persistent client state c_i and 2x communication rather than a stateless proximal surrogate), from uniform-epoch periodic local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent, which corresponds to mu = 0 with fixed homogeneous local steps), and from centralized proximal stochastic gradient methods (AIMech:SpiderBoostAndProximalSpiderBoostWithMomentumForNonconvexOptimization). Narrower than AIO:FederatedLearning, which covers general federated learning without specifying proximal local surrogates or gamma_k^t-inexact partial-work aggregation.
