claims:
- claim_id: primal-dual-witness-kkt-characterization-and-deterministic-design-consistency
  kind: mechanism
  statement: Assuming the s x s sub-Gram matrix X_S^T X_S on the true support S = supp(beta*) (|S| = s,
    N = |S^c| = p - s) is invertible, Lemma 1 (Section 2.1, p. 4, Equations 9a-9b, 10a-10b; proved in
    Appendix A, p. 18, Equations 35-36) establishes by solving the restricted KKT system (1/n) X_S^T X_S
    (beta_hat_S - beta*_S) - (1/n) X_S^T w = -lambda_n b (where b := sgn(beta*_S)) and substituting beta_hat_S
    = beta*_S + U into the off-support subgradient equation that there exists an optimal Lasso solution
    beta_hat achieving exact signed support recovery sgn(beta_hat) = sgn(beta*) if and only if the off-support
    dual variables V_j := X_j^T {X_S (X_S^T X_S)^{-1} lambda_n b - [X_S (X_S^T X_S)^{-1} X_S^T - I_n]
    (W/n)} satisfy M(V) := {max_{j in S^c} |V_j| <= lambda_n} (Equations 9a, 11) and the on-support perturbations
    U_i := e_i^T ((1/n) X_S^T X_S)^{-1} [(1/n) X_S^T W - lambda_n b] preserve the signs of beta*_S (Equations
    9b, 10a, for which M(U) := {max_{i in S} |U_i| <= rho_n := min_{i in S} |beta*_i|}, Equation 12, is
    sufficient). For deterministic designs X with column norms ||X_j||_2^2 = n satisfying mutual incoherence
    ||X_{S^c}^T X_S (X_S^T X_S)^{-1}||_infty <= 1 - epsilon (epsilon in (0, 1]) and minimum eigenvalue
    Lambda_min((1/n) X_S^T X_S) >= C_min > 0 (Equations 14a-14b), Proposition 1 (Section 2.2, p. 6, Equation
    15) proves P(R(X, beta*, W, lambda_n)) -> 1 whenever lambda_n -> 0 satisfies (n lambda_n^2) / log(p
    - s) -> +infty and (1/rho_n) {sqrt((log s)/n) + lambda_n ||((1/n) X_S^T X_S)^{-1}||_infty} -> 0.
  evidence:
  - source_id: wainwright2009-sharp-lasso-pdf
    locator: Sections 2.1-2.3 and Appendix A, pp. 4-8, 18, Lemma 1, Proposition 1, Equations (9a)-(16),
      (35)-(36)
    relation: supports
- claim_id: sharp-sample-complexity-thresholds-and-noisy-versus-noiseless-scaling-separation
  kind: mechanism
  statement: 'For random Gaussian designs X_k ~ N(0, Sigma) with unit diagonal satisfying Lambda_min(Sigma_{SS})
    >= C_min > 0, Lambda_max(Sigma) <= C_max < +infty, ||(Sigma_{SS})^{-1}||_infty <= D_max < +infty (Equation
    17), and population mutual incoherence ||Sigma_{S^c S} (Sigma_{SS})^{-1}||_infty <= 1 - epsilon for
    epsilon in (0, 1] (Equation 18), Theorem 1 (Section 3.1, pp. 8-9, Equations 20-21) defines the explicit
    thresholds theta_l := (sqrt(C_max) - sqrt(C_max - 1/C_max))^2 / (C_max (2 - epsilon)^2) <= 1 and theta_u
    := C_max / (epsilon^2 C_min) >= 1 and proves that as s, (n - s), (p - s) -> +infty, for any constant
    nu > 0: (a) if n < 2(theta_l - nu) s log(p - s) + s + 1, then P[R(X, beta*, W, lambda_n)] -> 0 for
    any non-increasing sequence lambda_n > 0; and (b) if n > 2(theta_u + nu) s log(p - s) + s + 1 and
    lambda_n -> 0 satisfies (n lambda_n^2) / log(p - s) -> +infty and (1/rho_n)[lambda_n + sqrt((log s)/n)]
    -> 0, then P[R(X, beta*, W, lambda_n)] -> 1. For the uniform (standard) Gaussian ensemble Sigma =
    I_{p x p} (C_min = C_max = 1, epsilon = 1), theta_l = theta_u = 1 so the threshold n = 2s log(p -
    s) + s + 1 is sharp; consequently, Corollaries 1 and 2 (pp. 9-10) prove that under linear sample scaling
    n = gamma p (gamma in (0, 1)), noisy Lasso fails with probability converging to 1 for any linear-fraction
    sparsity s = alpha p (requiring n > 2 alpha p log[(1 - alpha)p] + alpha p), in sharp contrast to noiseless
    Basis Pursuit.'
  evidence:
