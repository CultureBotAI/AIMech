    locator: Sections 3.1-3.2, pp. 8-10, Theorem 1, Corollaries 1, 2, and 3, Equations (17)-(22)
    relation: supports
- claim_id: conditional-gaussian-inverse-wishart-decomposition-and-sudakov-fernique-order-statistics
  kind: mechanism
  statement: Conditioned on (X_S, W), Lemma 2 (Section 3.3.1, p. 11, Equations 23-25; proved in Appendix
    D.1, p. 19, Equations 40a-40b) proves that the off-support dual vector (V | W, X_S) is Gaussian with
    mean bounded by |E[V | W, X_S]| <= lambda_n (1 - epsilon) 1 and conditional covariance cov[V | W,
    X_S] = M_n Sigma_{(S^c | S)} = M_n [Sigma_{S^c S^c} - Sigma_{S^c S} (Sigma_{SS})^{-1} Sigma_{S S^c}],
    where M_n := lambda_n^2 b^T (X_S^T X_S)^{-1} b + (1/n^2) W^T [I_n - X_S (X_S^T X_S)^{-1} X_S^T] W.
    Lemma 3 (p. 11, Equations 26-27; proved in Appendix D.2, pp. 20-21, Equations 41-46, using the inverse-Wishart
    expectation E[(X_S^T X_S)^{-1}] = (Sigma_{SS})^{-1} / (n - s - 1), Siskind's second-moment formula
    for n > s + 3, and the rank-(n - s) orthogonal projection R = I_n - X_S (X_S^T X_S)^{-1} X_S^T) proves
    E[M_n] = (lambda_n^2 / (n - s - 1)) b^T (Sigma_{SS})^{-1} b + sigma^2 (n - s) / n^2 and P[|M_n - E[M_n]|
    >= delta E[M_n]] -> 0. Lemmas 4-5 (p. 12, Appendix D.3-D.4, pp. 22-23) upper-bound E[max_{j in S^c}
    Z_tilde_j] via the Sudakov-Fernique inequality and Gaussian Lipschitz concentration to prove Theorem
    1(b), while Lemmas 7-8 (Section 3.4, p. 15, Appendix D.6-D.7, pp. 25-27, Equations 50-52) apply Chatterjee's
    quantitative Sudakov-Fernique error bound E[max_{j in S^c} Z_j] >= E[max_{j in S^c} X_j] - sqrt(Delta*
    log N) with Delta* <= 2 v* (C_max - 1/C_max) to prove Theorem 1(a).
  evidence:
  - source_id: wainwright2009-sharp-lasso-pdf
    locator: Sections 3.3-3.4 and Appendices B-D, pp. 11-15, 18-27, Lemmas 2-11, Equations (23)-(33),
      (39a)-(52)
    relation: supports
