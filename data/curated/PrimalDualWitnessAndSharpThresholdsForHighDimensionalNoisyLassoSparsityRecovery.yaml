id: AIMech:PrimalDualWitnessAndSharpThresholdsForHighDimensionalNoisyLassoSparsityRecovery
name: Primal-Dual Witness Method and Sharp Thresholds for High-Dimensional Noisy Lasso Sparsity Recovery
concept_kind: mathematical_method
aliases:
- Sharp Thresholds for High-Dimensional and Noisy Sparsity Recovery Using l_1-Constrained Quadratic Programming
  (Wainwright 2009)
- Wainwright Primal-Dual Witness Method for Exact Signed Support Recovery of the Lasso
- Sharp Sample Complexity Phase Transition n = 2s log(p - s) + s + 1 for Noisy Lasso Sparsity Recovery
- Wainwright (2006/2009) Mutual Incoherence Threshold Theory for High-Dimensional Lasso Support Recovery
definition: 'Primal-Dual Witness Method and Sharp Thresholds for High-Dimensional Noisy Lasso Sparsity
  Recovery is a convex-optimality and high-dimensional phase-transition analysis framework introduced
  by Wainwright (2009, IEEE Transactions on Information Theory 55(5):2183-2202, arXiv:math/0605740v1)
  for characterizing exact signed support recovery sgn(beta_hat) = sgn(beta*) of an s-sparse vector beta*
  in R^p (S = supp(beta*), |S| = s, N = |S^c| = p - s) from n noisy linear observations Y = X beta* +
  W (W ~ N(0, sigma^2 I_n)) via the Lasso min_{beta in R^p} {(1/(2n)) ||Y - X beta||_2^2 + lambda_n ||beta||_1}
  (Equation 3). Assuming X_S^T X_S is invertible, Lemma 1 (Equations 9a-9b, 10a-10b; Appendix A, Equations
  35-36) reduces exact signed support recovery R(X, beta*, W, lambda_n) via Karush-Kuhn-Tucker primal-dual
  witness construction to two extreme order-statistic events: off-support dual feasibility M(V) := {max_{j
  in S^c} |V_j| <= lambda_n} (Equation 11) and on-support sign consistency beta*_S + U_S having sign b
  = sgn(beta*_S) (secured by M(U) := {max_{i in S} |U_i| <= rho_n := min_{i in S} |beta*_i|}, Equation
  12). For random Gaussian ensembles X_k ~ N(0, Sigma) satisfying eigenvalue bounds Lambda_min(Sigma_{SS})
  >= C_min > 0, Lambda_max(Sigma) <= C_max < +infty, ||(Sigma_{SS})^{-1}||_infty <= D_max (Equation 17),
  and mutual incoherence ||Sigma_{S^c S} (Sigma_{SS})^{-1}||_infty <= 1 - epsilon for epsilon in (0, 1]
  (Equation 18), Theorem 1 (Equations 20-21) establishes explicit threshold constants theta_l := (sqrt(C_max)
  - sqrt(C_max - 1/C_max))^2 / (C_max (2 - epsilon)^2) <= 1 and theta_u := C_max / (epsilon^2 C_min) >=
  1 such that for any nu > 0, P[R(X, beta*, W, lambda_n)] -> 0 whenever n < 2(theta_l - nu) s log(p -
  s) + s + 1, whereas P[R(X, beta*, W, lambda_n)] -> 1 whenever n > 2(theta_u + nu) s log(p - s) + s +
  1 and lambda_n -> 0 satisfies (n lambda_n^2) / log(p - s) -> +infty and (1/rho_n)[lambda_n + sqrt((log
  s)/n)] -> 0; for the standard Gaussian ensemble Sigma = I_p, theta_l = theta_u = 1, yielding the exact
  sharp threshold n = 2s log(p - s) + s + 1.'
identity_notes: 'Resolved against all 442 pinned AIO records and 626 maintained AIMech records. Distinct
  from AIMech:RestrictedEigenvaluePropertiesForCorrelatedGaussianDesigns (Raskutti, Wainwright, & Yu 2010,
  JMLR 11:2241-2259, which establishes Restricted Eigenvalue and Restricted Nullspace conditions for l_2/l_1
  estimation error without mutual incoherence), from AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework
  (Negahban, Ravikumar, Wainwright, & Yu 2012, Statistical Science 27(4):538-557, which bounds l_2 and
  regularizer estimation error under RSC), from AIMech:MinimaxEstimationRatesForHighDimensionalLinearRegressionOverLqBalls
  (Raskutti, Wainwright, & Yu 2011, IEEE Trans. Inf. Theory 57(10):6976-6994, which derives l_2 prediction
  and estimation minimax rates over l_q balls), and from AIO:LassoRegression: Wainwright (2009, IEEE Trans.
  Inf. Theory 55(5):2183-2202, arXiv:math/0605740v1) formulates the KKT primal-dual witness reduction
  to Gaussian extreme order statistics (Lemma 1, Equations 9-12), proves deterministic design consistency
  under mutual incoherence (Proposition 1), and establishes the sharp sample complexity phase transition
  thresholds theta_l and theta_u (Theorem 1, Corollaries 1-3) via conditional inverse-Wishart variance
  concentration and Sudakov-Fernique / Chatterjee Gaussian comparison bounds (Lemmas 2-8).'
