id: AIMech:ExactDiffusionAdaptCorrectCombineDistributedOptimization
name: Exact Diffusion (Adapt-Correct-Combine Distributed Optimization)
concept_kind: algorithm
review_status: DRAFT
definition: 'A bias-corrected distributed optimization algorithm over locally balanced left-stochastic combination matrices A (A^T 1 = 1, A p = p, P A^T = A P, Yuan et al. 2019, Section II-D and Section IV, Algorithm 1, Equations 58-61) that eliminates the O(mu_max^2) steady-state bias of standard Adapt-Then-Combine (ATC) diffusion by executing a three-stage Adapt-Correct-Combine (ACC) recursion at each agent k: psi_{k,i} = w_{k,i-1} - (q_k mu_o / p_k) nabla J_k(w_{k,i-1}) (Adapt), phi_{k,i} = psi_{k,i} + w_{k,i-1} - psi_{k,i-1} (Correct), and w_{k,i} = sum_{l in N_k} bar_a_{lk} phi_{l,i} with bar_A = (I_N + A)/2 (Combine).'
identity_notes: Distinct from EXTRA (Shi et al. 2015) and D2 (AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData, Tang et al. 2018), which apply a Combine-Then-Adapt (CTA) update without mixing the gradient difference through bar_A^T and require symmetric doubly stochastic matrices, whereas Exact Diffusion uses an Adapt-Then-Combine structure W_i = bar_A^T (2 W_{i-1} - W_{i-2} - M(nabla J^o(W_{i-1}) - nabla J^o(W_{i-2}))) (Eq. 103) that operates directly on non-symmetric locally balanced left-stochastic combination policies without known Perron eigenvectors when q_k = p_k.
aliases:
- Exact Diffusion
- Adapt-Correct-Combine Exact Diffusion
- ACC Exact Diffusion Distributed Optimization
