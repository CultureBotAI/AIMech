id: AIMech:BBTBlackBoxTuningForLanguageModelAsAService
name: Black-Box Tuning (BBT) for Language-Model-as-a-Service
concept_kind: algorithm
review_status: DRAFT
definition: A derivative-free continuous prompt optimization method for Language-Model-as-a-Service (LMaaS) inference APIs that exploits the low intrinsic dimensionality of large pretrained language models by parameterizing a D-dimensional continuous prompt p in R^D as an increment p = A z + p_0 over initial vocabulary embeddings p_0 via a fixed uniform random projection matrix A in R^{D x d} from a low-dimensional subspace z in [-5, 5]^d (with d << D), and iteratively optimizes z* = arg min_{z in Z} L(f(A z + p_0; X_tilde), Y_tilde) using the Covariance Matrix Adaptation Evolution Strategy (CMA-ES) querying only forward-pass masked-token logits Y_hat = f(p; X_tilde).
identity_notes: Distinct from gradient-based Prompt Tuning (Lester et al., EMNLP 2021, AIMech:PromptTuning) and P-Tuning v2 (AIMech:PTuningV2DeepContinuousPromptTuning), which require backward-pass gradient access to the language model, and from RLPrompt (Deng et al., EMNLP 2022, AIMech:RLPromptReinforcementLearningDiscretePromptOptimization), which optimizes discrete vocabulary tokens via a policy network and Soft Q-Learning rather than continuous prompt increments in a random linear subspace via CMA-ES.
aliases:
- Black-Box Tuning
- BBT
- BBT Derivative-Free Subspace Prompt Tuning
- CMA-ES Intrinsic-Subspace Black-Box Prompt Tuning
