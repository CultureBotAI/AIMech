name: Nonnegative Matrix Factorization
aliases:
- NMF
concept_kind: mathematical_method
definition: A matrix-decomposition method that represents or approximates a nonnegative data matrix as
  the product of two entrywise nonnegative factor matrices, so each data column is expressed by additive
  nonnegative combinations of basis columns.
identity_notes: 'The mathematical factorization is distinct from a particular fitting algorithm, trained
  dictionary or application. The separately represented Lee-Seung multiplicative updates optimize two
  specified objectives. Nonnegative factors need not be sparse, orthogonal or uniquely determined; this
  is not the exact sparse-coding identity in AIO or ordinary PCA. Non-negative and British factorisation
  spellings name the same method. Four candidate identities were compared against all 442 pinned AIO IDs,
  labels and scoped synonyms and 450 preceding native IDs, names and aliases, with no normalized match.
  Ignored/hidden full-checkout searches returned the same 106 matched-line set in each checkout after
  the prior merge. All matched excerpts from 76 files were read; they are discovery context, not existing
  concept records. The semantic search covered all pinned labels and scoped synonyms and returned 212
  rows: 205 byte-equivalent prior readings and seven additional rows, all inspected. Twenty-three annotated
  AIO nodes with outgoing edges comprise 21 unchanged prior readings and two new inspections. Thirty contextual
  YAMLs, including seven native neighbors, comprise 25 unchanged prior readings and five complete new
  readings. This absence assessment is bounded to the pinned snapshot and inspected maintained corpus.'
