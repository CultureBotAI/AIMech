claims:
- claim_id: factorization-scope
  kind: mechanism
  statement: For V in the nonnegative n-by-m matrices, seek W of size n-by-r and H of size r-by-m with
    nonnegative entries and V approximately W H. Columns of W supply basis elements and columns of H their
    nonnegative coefficients. Choosing r below the data dimensions yields a compressed representation
    with product rank at most r, but small r is a modeling choice rather than a consequence of nonnegativity.
    Factors can be dense.
  evidence:
  - source_id: method-source
    locator: Sections 1-2, Equation 1, PDF pp. 1-2
    relation: supports
- claim_id: objectives-and-zeros
  kind: scope
  statement: The inspected source fits either squared Frobenius error ||V-WH||_F^2 or generalized KL divergence
    sum_ij[V_ij log(V_ij/(WH)_ij)-V_ij+(WH)_ij]. The latter is a divergence between nonnegative arrays,
    not necessarily normalized probability distributions and not a symmetric distance. By continuity a
    zero V entry contributes the corresponding reconstruction, while a positive V entry with zero reconstruction
    gives infinite divergence. An observed zero contributes to these objectives; it is not automatically
    a missing value.
  evidence:
  - source_id: method-source
    locator: Section 3, Equations 2-3, PDF p. 2; curator boundary conventions of the displayed divergence
    relation: supports
- claim_id: identifiability
  kind: limitation
  statement: Nonnegativity supports additive representations but does not guarantee recovery of unique
    physical parts or causes. For any positive diagonal D, W D and D^(-1) H give the same reconstruction,
    and a common factor permutation also preserves it. The nonconvex joint fitting problem and chosen
    objective further affect the result. These algebraic ambiguities remain even when a factorization
    has small reconstruction error.
  evidence:
  - source_id: method-source
    locator: Sections 1-3, PDF pp. 1-2; curator invariances of Equation 1
    relation: supports
limitations:
- No universal sparsity, uniqueness, causal interpretation or global optimization guarantee follows from
  the nonnegative constraint. Additional constraints or probabilistic models define narrower methods.
- The two inspected objectives are representative source formulations, not an exhaustive definition of
  every NMF loss or algorithm. Missing-data masks, regularization, sparse constraints and probabilistic
  count models require their own specification.
- The inspected paper is an algorithm and proof contribution; no new benchmark ranking, author implementation,
  empirical fitting or parts-recognition result was reproduced.
