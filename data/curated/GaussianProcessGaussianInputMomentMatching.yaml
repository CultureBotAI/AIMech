limitations:
- Closed-form moments here concern the zero-mean squared-exponential GP and a prescribed Gaussian test-input
  distribution with fixed hyperparameters. Other kernels, non-Gaussian inputs, uncertain training locations
  or hyperparameter integration require further treatment. The method does not automatically estimate
  the input distribution or solve a general errors-in-variables problem.
- Exact first and second moments do not make the mixture Gaussian or its Gaussian credible intervals calibrated.
  A unit-kernel f(0)=0 example in the curator calculator has a fourth moment different from that of the
  matched Gaussian. Input integration can also lower variance relative to evaluating the GP only at the
  input mean; uncertainty is not guaranteed to increase at every step.
- Iterative lag covariance and observation noise must be handled consistently. A singular Gaussian input
  covariance can occur when initial lags are exact; Gaussian expectations have well-defined degenerate
  limits, but an implementation must not blindly invert that input covariance. Noise in training K_y and
  future observation noise have different roles.
- The earlier Taylor report is contextual evidence for a distinct local approximation. Its notation changes
  the meaning of kernel width parameters between sections. The proceedings text also contains a lengthscale
  irrelevance statement inconsistent with its displayed kernel and ambiguous trace/parenthesis typography;
  the record uses the total-variance identity and directly checked scalar integrals instead of reproducing
  those ambiguities.
- The source’s Mackey–Glass and pH illustrations do not establish universal forecasting superiority or
  calibration. The proceedings pH test count is printed as an unresolved placeholder; the earlier technical
  report has different preprocessing and results, so its count is not silently transferred. No comparative
  numerical performance claim is curated.
- No author implementation, fitted GP, stochastic trajectory simulation or benchmark was executed. Curator
  analytic and numerical-quadrature checks establish only the displayed mathematical examples. The record
  remains DRAFT after author self-review; correlation-aware trajectory methods require their own identity
  and implementation-scope assessments.
