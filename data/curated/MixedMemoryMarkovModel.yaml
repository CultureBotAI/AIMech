- target: AIO:BayesianNetwork
  relation: broad_match
  rationale: For a finite time window and specified initial history, normalized conditional factors and
    latent predecessor selectors form a directed acyclic probabilistic model. This compact mixed-memory
    parameterization is narrower than the pinned BayesianNetwork class.
- target: AIO:MarkovChain
  relation: related_match
  rationale: The multicomponent case has a first-order joint vector state, while the scalar case can use
    multiple predecessor lags and the hidden extension marginalizes states. The pinned first-order MarkovChain
    definition is related temporal structure, not an exact identity or an unqualified parent for every
    observed process.
