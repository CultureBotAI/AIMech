claims:
- claim_id: method
  kind: mechanism
  statement: For a scalar k-order sequence, write p(i_t|i_(t-1),...,i_(t-k))=sum_mu psi(mu) a_mu(i_t|i_(t-mu)),
    with nonnegative selector weights summing to one and each transition table normalized over the current
    state. Given observed predecessor and current values, a selector responsibility is proportional to
    psi(mu) a_mu(i_t|i_(t-mu)); parameter re-estimation can use these expected selector-weighted counts.
    For a vector state I_t with components nu, the first-order multicomponent form is p(I_t|I_(t-1))=product_nu
    sum_mu psi_nu(mu) a_nu,mu(i_t^nu|i_(t-1)^mu). Thus current components are conditionally independent
    given the complete previous vector, despite possible marginal dependence. The hidden extension uses
    this transition and an emission p(J_t|I_t)=product_nu sum_mu phi_nu(mu) b_nu,mu(j_t^nu|i_t^mu). Fully
    observed parameter counts scale quadratically rather than exponentially in the number of components
    for fixed alphabet size; exact hidden posterior inference can still be exponential. The paper instead
    illustrates a coordinate Viterbi approximation that fixes other hidden chains while optimizing one
    chain path.
