name: Mixed memory Markov model
definition: A family of compact temporal probability models whose component transition distributions are
  convex mixtures of transition tables indexed by a single selected predecessor lag or component.
concept_kind: model_family
identity_notes: 'This record covers the mixed-memory construction of Saul and Jordan, including higher-order
  scalar, multicomponent first-order and hidden-state extensions. Mixed memory means a latent selector
  chooses one predecessor for a component distribution. It does not mean external neural memory, a mixture
  selecting an entire HMM, independent factorial chains, or an unrestricted full higher-order transition
  table. EM and coordinate Viterbi are estimation/inference procedures, not aliases for the model. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 379 preceding
  native IDs/names/aliases for the four researched candidate names. Both full-checkout fixed-string searches
  included ignored and hidden files, with 7 and 7 matching lines. All 6 unique matched contents were read:
  pending leads and preceding source/review context, not existing records of these three new identities.
  Expanded source IDs, plurals, Gibbs-machine and mixture-transition terminology were included. All 63
  semantic label/synonym hits, 17 exact fully annotated AIO CLASS nodes with outgoing edges, their generated
  YAMLs and six native neighbors were read or byte-verified after prior complete reading. Markov mixtures
  of experts substantially overlaps the existing IOHMM family, so no fourth ID or unconditional alias
  is created. Absence is bounded to the pinned vocabulary and inspected neighborhood.'
limitations:
- A convex sum of single-predecessor effects cannot represent every higher-order interaction; for example
  an unrestricted XOR dependence on two binary predecessors is not additive in this way. Compact parameter
  counts do not establish universal expressiveness.
- The displayed vector transition explicitly assumes conditional independence of current components given
  the previous vector. The source’s broad wording about avoiding strong conditional-independence assumptions
  must not override its product factorization.
- Selector weights are properties of a fitted parameterization, not uniquely identified causal influence
  or a generally valid measure of correlation. Initial histories and observed-window boundaries must be
  specified when counting transitions.
- In the hidden extension, exact EM needs joint posterior expectations of selectors and hidden-state indicator
  products. Equations (20) and (22) display hidden indicators outside the expectation, which is not a
  general full-posterior EM formula; clamping a path changes the calculation. Equation (17) also reverses
  emission arguments relative to Equation (16).
- Coordinate Viterbi improves or preserves the joint path score under an exact single-chain update, but
  need not reach global MAP or optimize the marginal observed likelihood. Ties and stopping rules require
  care.
- The Bach example illustrates the authors’ approximate procedure. Figure 2 uses joint path log probability,
  not exact marginal likelihood. No accuracy, causal discovery, training reproduction or general scaling
  guarantee for hidden inference is curated.
