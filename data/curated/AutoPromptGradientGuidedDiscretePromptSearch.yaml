claims:
- claim_id: r718-claim-gradient-trigger-search
  kind: mechanism
  statement: AutoPrompt initializes shared trigger tokens [T] to [MASK] and at each step approximates the log-likelihood change of swapping the j-th trigger token x_trig^(j) with vocabulary token w in V via the inner product w_in^T grad_{x_trig^(j)} log p(y|x_prompt), evaluating the top-k candidates V_cand with k forward passes to retain the trigger replacement that maximizes marginalized label likelihood.
  evidence:
  - source_id: r718-primary-pdf
    locator: Section 2.1-2.2, Equations 1-2, p. 3
    relation: supports
- claim_id: r718-claim-automated-label-token-selection
  kind: mechanism
  statement: For classification tasks whose labels do not directly map to single vocabulary words, AutoPrompt trains a logistic classifier p(y|h^(i)) proportional to exp(h^(i) * y + beta_y) on the [MASK] contextualized representation h^(i) and substitutes the MLM output word embeddings w_out to select the top-k scoring words V_y = top-k_{w in V} [exp(w_out * y + beta_y)] as class label tokens.
  evidence:
  - source_id: r718-primary-pdf
    locator: Section 2.3, Equations 3-5, pp. 3-4
    relation: supports
- claim_id: r718-claim-probing-and-low-data-application
  kind: application
  statement: Without fine-tuning any model weights, AutoPrompt achieves 91.4% test accuracy with RoBERTa-large on SST-2 sentiment analysis, outperforms finetuned BERT and RoBERTa on low-data SICK-E natural language inference, and reaches 43.34% Precision@1 on the LAMA fact retrieval benchmark (exceeding manual LAMA prompts at 31.10% and LPAQA at 34.10%).
  evidence:
  - source_id: r718-primary-pdf
    locator: Sections 3-6, Tables 1, 2, 4, and 5, Figure 2, pp. 4-9
    relation: supports
- claim_id: r718-claim-ungrammatical-imbalance-limitation
  kind: limitation
  statement: Discrete prompts discovered by greedy search over vocabulary tokens lack human interpretability and grammaticality, struggle on tasks such as QQP and RTE (performing near chance) or under severe class imbalance where prompts amplify majority-class prior probability, and drop sharply on counterfactual relation extraction sentences where objects are synthetically perturbed (e.g., BERT P@1 dropping from 90.73% to 56.43%).
  evidence:
  - source_id: r718-primary-pdf
    locator: Section 6 & Section 7, Table 5, pp. 8-9
    relation: supports
