id: AIMech:AutoPromptGradientGuidedDiscretePromptSearch
name: AutoPrompt Gradient-Guided Discrete Prompt Search
concept_kind: algorithm
review_status: DRAFT
definition: An automated discrete prompt construction and knowledge-probing algorithm for pretrained language models that maps task inputs x_inp into a cloze template containing a prediction token [MASK] and shared discrete trigger tokens x_trig, automatically selects class-associated label token sets V_y via a logistic classifier over [MASK] contextual representations scored against output word embeddings w_out, and iteratively updates each trigger token x_trig^(j) by evaluating the top-k vocabulary candidates V_cand = top-k_{w in V} [w_in^T grad_{x_trig^(j)} log p(y|x_prompt)] under a first-order gradient approximation of the marginalized label log-likelihood p(y|x_prompt) = sum_{w in V_y} p([MASK]=w|x_prompt) while keeping all language model weights frozen.
identity_notes: Distinct from continuous soft prompt methods such as Prompt Tuning (AIMech:PromptTuning), Prefix-Tuning (AIMech:PrefixTuning), and WARP (AIMech:WARPWordLevelAdversarialReProgramming), which optimize continuous vectors in embedding space, and from manual cloze prompting (LAMA, Petroni et al., 2019) or corpus-mined/paraphrased prompting (LPAQA, Jiang et al., 2020), which do not perform gradient-guided discrete trigger token search.
aliases:
- AutoPrompt
- AutoPrompt Gradient-Guided Prompt Generation
- Gradient-Guided Discrete Trigger Prompt Search
