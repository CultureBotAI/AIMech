claims:
- claim_id: method
  kind: mechanism
  statement: For a traveling-salesman tour, at each construction decision draw q uniformly in [0,1]. If
    q<=q0, choose an unvisited city maximizing tau_ij*eta_ij^beta; otherwise sample proportionally to
    those same weights over the unvisited set. Apply the selected local rule tau_ij_new=(1−rho)*tau_ij+rho*tau0
    to traversed edges during construction. After all tours finish, update edges belonging to the shortest
    tour found so far with tau_ij_new=(1−alpha)*tau_ij+alpha/L_best. The scope of this global step follows
    Section III’s explicit best-tour-edge restriction; edges outside that tour do not undergo this global
    update. Figure 3 organizes construction into steps. Appendix A has all ants choose a step before its
    local-update loop, so sequential whole-tour construction is not assumed. Retain the best-so-far tour
    and reset per-tour feasibility state before the next iteration. Parameter settings, tie handling and
    repeated updates to an edge must be declared for an executable implementation.
