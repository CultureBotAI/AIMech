name: Ant Colony System
definition: An ant-colony optimization algorithm that combines a greedy-or-proportional construction rule,
  local pheromone updates during construction, and global pheromone updates restricted to a selected best
  tour.
concept_kind: algorithm
identity_notes: The selected baseline is the paper’s global-best ACS with local interpolation toward the
  initial trail tau0. It is distinct from Ant System’s all-ant deposits, MAX–MIN trail clipping, and the
  Ant-Q variant whose local target uses a discounted maximum future trail. Iteration-best reinforcement
  and ACS with local search are explicitly described variants, not silently incorporated into the baseline.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 288 preceding
  native IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden files in worktree
  and main, returning 10 and 10 lines respectively. Every text hit was a prior candidate lead. Six exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- 'The local update moves a trail toward tau0: it decreases a trail only when that trail exceeds tau0,
  increases it below tau0, and leaves equality unchanged. It is not unconditional evaporation. At q0=1
  the displayed decision uses only maximization, apart from tie handling, so positive trails alone do
  not supply probabilistic exploration.'
- 'There is a source presentation ambiguity: Equation 4 defines zero deposit off the best tour, while
  Section III explicitly restricts the global update to best-tour edges. Appendix A’s global loop uses
  stale ant-indexed endpoints inside a generic edge loop, and its repeat jump does not explicitly reset
  all tour state. The record follows the main-text scope and supplies the necessary state-reset qualification;
  it does not claim the appendix is directly executable or that an official erratum was checked.'
- Random initial cities, heuristic powers, q0, alpha, rho and tau0 are configuration choices. Repeated
  local updates and their ordering affect trails; independent construction of entire tours is not an equivalent
  schedule. Zero distances, zero denominators, constraints and numerical underflow need handling.
- The paper’s task-specific comparisons, optional local search and qualitative improvement claims do not
  establish universal superiority or finite-run global optimality. Ant-Q’s reinforcement-learning connection
  does not make the selected tau0 rule a Bellman update.
