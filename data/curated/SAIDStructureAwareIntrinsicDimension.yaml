id: AIMech:SAIDStructureAwareIntrinsicDimension
name: Structure-Aware Intrinsic Dimension (SAID)
concept_kind: algorithm
review_status: DRAFT
definition: A subspace fine-tuning and intrinsic-dimensionality measurement methodology for pre-trained neural networks that reparameterizes m-layer parameter updates in a d-dimensional random subspace via the Fastfood transform augmented with m jointly learned layer-wise scaling scalars theta^D_i = theta^D_{0,i} + lambda_i P(theta^{d-m})_i, estimating the minimum subspace dimension d_90 required to reach 90% of full fine-tuning performance and yielding compression-based generalization bounds O(sqrt(d / m_samples)) independent of the full model parameter count D.
identity_notes: Introduced by Armen Aghajanyan, Luke Zettlemoyer, and Sonal Gupta (ACL/IJCNLP 2021, pp. 7319-7328, arXiv:2012.13255). Extends the layer-unaware Direct Intrinsic Dimension (DID) objective-landscape subspace method of Li et al. (ICLR 2018, theta^D = theta^D_0 + theta^d M with Fastfood matrix M = H G Pi H B) by trading m subspace parameters for m layer-wise scaling weights lambda_i across m layers so capacity concentrates on task-relevant layers. Both SAID and its layer-unaware baseline DID for pre-trained model fine-tuning are covered together in this record.
aliases:
- SAID Subspace Fine-Tuning
- Structure Aware Intrinsic Dimension
- SAID and DID Intrinsic Dimensionality Fine-Tuning
