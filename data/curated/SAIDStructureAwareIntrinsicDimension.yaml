claims:
- claim_id: said-fastfood-layerwise-reparameterization-mechanism
  kind: mechanism
  statement: SAID parameterizes full model weights theta^D across m layers around frozen pre-trained weights theta^D_0 via theta^D_i = theta^D_{0,i} + lambda_i P(theta^{d-m})_i (Eq. 3), where P projects from R^{d-m} to R^D in O(D log d) time and O(D) memory via the Fast Walsh-Hadamard Transform using the Fastfood factorization M = H G Pi H B (with Hadamard matrix H, Gaussian diagonal G, permutation Pi, and Rademacher diagonal B, Eq. 2), and lambda in R^m are jointly learned layer-wise scalars that achieve d_90 = 207 on MRPC and d_90 = 774 on QQP for RoBERTa-Large (improving over layer-unaware DID d_90 = 322 on MRPC).
  evidence:
  - source_id: r699-primary-pdf
    locator: Section 3 Intrinsic Dimensionality of Finetuning, Eqs. 1-3, pp. 2-3; Section 4.2 Analysis & Table 1, p. 4
    relation: supports
- claim_id: said-pretraining-compression-and-bound-mechanism
  kind: mechanism
  statement: Because a classifier fine-tuned via SAID or DID in d dimensions is losslessly (0, S)-compressible using a helper string consisting of the initial pre-trained weights theta^D_0 and the single random seed generating M, discretization into r quantization states yields the asymptotic generalization bound L_0(f) <= L_hat_0(f) + O(sqrt(d / m)) (Theorem 1, Eqs. 5 & 7-8) on a dataset of m samples, independent of the full parameter count D, while pre-training updates and larger parameter counts D monotonically reduce downstream d_90.
  evidence:
  - source_id: r699-primary-pdf
    locator: Section 5.1-5.3, Figures 2-5, pp. 5-7; Section 5.3.1 Generalization Bounds, Theorem 1, p. 8; Appendix A.1 Proofs, Definition 1, Remark 1 & Eqs. 6-8, pp. 10-11
    relation: supports
- claim_id: said-glue-and-pretraining-analysis-application
  kind: application
  statement: Applied to measure d_90 across GLUE and NLP classification benchmarks (MRPC, QQP, Yelp Polarity, SST-2, MNLI, ANLI) and across 18 pre-trained Transformer checkpoints (BERT, RoBERTa, BART, Electra, ALBERT, XLNet, T5, XLM-R), encoding complex NLP tasks such as MRPC within the RoBERTa-Large framework using roughly 200 parameters (< 1 KB of task-specific storage) plus a single random seed.
  evidence:
  - source_id: r699-primary-pdf
    locator: Section 4.1-4.2, Figure 1 & Table 1, p. 4; Section 5, pp. 5-6; Section 5.1-5.2, Figures 2-3, pp. 5-6
    relation: supports
- claim_id: said-random-projection-and-sgd-bound-limitation
  kind: limitation
  statement: Restricting subspace projections to random Fastfood transforms yields only a crude upper bound on the true intrinsic dimension (which is computationally intractable to compute exactly), evaluating d_90 requires binary search across multiple subspace training runs and learning rates, and Theorem 1's compression generalization bound applies explicitly to models trained with the SAID/DID subspace method rather than proving that unconstrained full-parameter SGD optimizes within that low-dimensional subspace.
  evidence:
  - source_id: r699-primary-pdf
    locator: Section 3 Background, p. 2; Section 4.2 Analysis, p. 4; Section 5.1 Pre-Training Intrinsic Dimension Trajectory, p. 5; Section 5.3.1 Generalization Bounds, p. 8
    relation: supports
