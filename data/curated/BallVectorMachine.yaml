id: AIMech:BallVectorMachine
name: Ball vector machine
aliases:
- BVM
concept_kind: algorithm
definition: An approximate SVM training procedure that uses fixed-radius enclosing-ball center updates
  in a transformed kernel feature space, with multiscale tolerance and radius-refinement variants that
  avoid CVM’s repeated core quadratic programs.
identity_notes: 'This record denotes the Tsang-Kocsor-Kwok BVM procedure. Its fixed-radius core and optional
  refinement are distinguished explicitly; a feasible enclosing radius is not assumed to be the minimum
  radius. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 513 preceding native IDs,
  names and aliases. No normalized identity collision was found for either candidate. Whole-word fixed-string
  searches of both checkouts included ignored and hidden files, expanded names, CVM/BVM acronyms and primary-source
  identifiers. All 22 matches per checkout were inspected in 14 distinct text windows at 44 locations:
  prior queries and unresolved discovery notes, not existing records. All 93 semantic AIO rows and 35
  native name/definition matches were read. Twelve annotated AIO CLASS nodes and outgoing edges and 17
  contextual YAMLs were inspected or reused after unchanged-byte checks. This is a bounded local corpus
  assessment.'
