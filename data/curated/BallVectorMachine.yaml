  relation: supports
claims:
- claim_id: fixed-radius-center-update
  kind: mechanism
  statement: For a finite feature set, 0<epsilon<=1 and a supplied positive radius r>=R_star, initialize
    the center at a feature point. If a point z lies beyond (1+epsilon)*r, set beta=r/||c-phi(z)|| and
    c_new=phi(z)+beta*(c-phi(z)); otherwise terminate after checking all points. The update is the smallest
    center movement that places z on the radius-r boundary and is a convex combination. Any violating
    point suffices. Kernel coefficients can represent the center, and no inner quadratic program is required.
  evidence:
  - source_id: tsang2007
    locator: Sections 3.1-3.2, printed pp912-914 / PDF pp2-4, Algorithms 2-3 and Equations 5-6
    relation: supports
- claim_id: iteration-guarantees-and-search-cost
  kind: limitation
  statement: 'The fixed-radius procedure requires at most O(1/epsilon²) violating-point updates under
    r>=R_star and the stated initialization. A multiscale version halves tolerance successively and warm-starts
    centers; its O(1/epsilon) iteration result is proved for r=R_star. That stronger rate is not established
    for every larger feasible radius. These are update bounds: finding a violator or certifying all-point
    coverage, kernel-evaluation costs and input storage must also be accounted for. A sampled stopping
    check is not an exhaustive certificate.'
  evidence:
  - source_id: tsang2007
    locator: Sections 3.1-3.2, printed pp913-914 / PDF pp3-4, Propositions 1 and 3; curator separation
      of search work
    relation: supports
- claim_id: l2-transformed-kernel-and-feasible-radius
  kind: mechanism
  statement: For binary L2 SVM training, use Ktilde_ij=y_i*y_j*(k_ij+1)+delta_ij/C. If k has constant
    diagonal kappa, the transformed diagonal is kappa_tilde=kappa+1+1/C, as follows from Equation 3, including
    its bias coordinate. The radius sqrt(kappa_tilde) is a feasible upper bound on the optimal MEB radius,
    since all transformed points have that norm. It need not be the minimum radius. For finite n and C>0,
    alpha^T*Ktilde*alpha>=1/(n*C)>0 on the simplex, hence R_star²<kappa_tilde. The nearby prose diagonal
    that omits +1 is not substituted for the displayed kernel.
  evidence:
  - source_id: tsang2007
    locator: Sections 2 and 3.4, printed pp912,914-915 / PDF pp2,4-5, Equations 3 and 12; curator diagonal
      and finite-slack-term derivation
    relation: supports
  - source_id: tsang2005
    locator: Section 3.2.2, printed pp369-370 / PDF pp7-8, Equations 12-17 and following transformed-feature
      display
    relation: supports
- claim_id: fixed-radius-not-minimum-center
  kind: limitation
  statement: Reducing epsilon at a radius strictly larger than R_star does not in general recover the
    MEB center. For unit-norm points (1,0) and (-7/25,24/25), the fixed-r=1 update from the first point
    stops at (13/25,9/25), with distances 3/5 and 1. The true MEB center is (9/25,12/25), radius 4/5,
    and the center error remains 1/5 as tolerance tends to zero. This exact geometric illustration concerns
    Algorithm 2, not a historical SVM benchmark or the full radius-refinement procedure.
  evidence:
  - source_id: tsang2007
    locator: Sections 3.1-3.2, printed pp912-914 / PDF pp2-4, Algorithms 2-3 and Equations 5-6
    relation: supports
  - source_id: tsang2007
    locator: Section 3.2, printed pp913-914 / PDF pp3-4, Proposition 2; exact curator example in research/discovery/core-ball-vector-boundaries.py
    relation: supports
- claim_id: optional-radius-refinement
  kind: mechanism
  statement: The source’s Algorithm 4 augments every feature by a zero coordinate and starts the center
    with an extra coordinate r. After an approximate radius-r enclosure, let u be the final extra center
    coordinate. If u²>(2*epsilon+epsilon²)*r², replace r by sqrt((1+epsilon)²*r²-u²) and repeat; otherwise
    stop. The paper’s experiments explicitly use only one iteration of Algorithm 4. This refinement is
    distinct from assuming the initial feasible radius is already optimal.
  evidence:
  - source_id: tsang2007
    locator: Section 3.3, printed p914 / PDF p4, Algorithm 4; Section 4 footnote 4, printed p915 / PDF
      p5
    relation: supports
- claim_id: asymptotic-and-prediction-scope
  kind: limitation
  statement: The paper motivates near equality of the feasible and optimal radii using high-dimensional
    Gaussian data and a Gaussian kernel. Its limiting argument additionally needs the class-count imbalance
    divided by n to vanish; merely having two reasonably populated classes does not ensure that. The center-distance
    bounds retain their dependence on r/R_star, and coefficient or score proximity does not by itself
    guarantee identical predicted labels or test accuracy. No finite-sample equality R_star=sqrt(kappa_tilde)
    is asserted.
  evidence:
  - source_id: tsang2007
    locator: Sections 3.2 and 3.4, printed pp913-915 / PDF pp3-5, Propositions 2-3 and Equations 9-12;
      curator finite-radius qualification
    relation: supports
- claim_id: procedure-identity-and-evaluation
  kind: scope
  statement: BVM denotes the enclosing-ball approach to the stated SVM formulation, with multiscale and
    radius-refinement variants described in the same paper. It is separate from CVM’s repeated core MEB
    fits, generic SVM, support-vector domain estimation and sphere-based cluster labeling. The ten-dataset
    experiments use particular kernels, C values, tolerances, versions, hardware, time cutoffs and multiclass
    availability; they do not establish a universal speed or accuracy ranking.
  evidence:
  - source_id: tsang2007
    locator: Sections 2-5, printed pp912-918 / PDF pp2-8; Tables 1-4 and Figures 2-4
    relation: supports
