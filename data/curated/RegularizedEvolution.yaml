- target: AIO:TrainingStrategy
  relation: related_match
  rationale: The original search procedure organizes repeated model training and validation to select
    architectures. This supports a relation to the pinned training-strategy scope without adopting its
    preprocessing wording as the algorithm definition. The outer search algorithm is neither equivalent
    to nor asserted to be a subclass of that AIO target, a trained network or a layer.
