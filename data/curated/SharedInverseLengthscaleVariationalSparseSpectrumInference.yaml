aio_mappings:
- target: AIO:RegressionAnalysis
  relation: related_match
  rationale: The procedure estimates a probabilistic input-to-scalar-response relation through a specified
    finite spectral model and variational posterior. RegressionAnalysis denotes its task, not this shared-parameter
    model, factorization or fitting algorithm; this is an algorithm-to-task relation without equivalence
    or an is-a assertion.
limitations:
- This is the base shared-inverse-lengthscale spectral inference procedure. Mean-field restrictions can
  underrepresent coefficient/spectral dependence, and initialization and local stationary structure can
  affect the result. A finite mixture over uncertain inverse-lengthscales and scales is not automatically
  one Gaussian process with the original squared-exponential kernel. No general posterior-accuracy, runtime
  or model-selection superiority is asserted.
- Proper Gaussian factors, finite current expectations and normalizable scale factors are required. The
  n=1 scale density can be proper while its second moment diverges. The paper’s particular scale initialization
  has positive C_gamma only for n>2 with positive response variance and positive C_sigma only for m>1
  with positive response variance; it is not a universal initializer for all positive n,m.
- The source’s Algorithm 1 covariance/mean lines are interpreted as one Gaussian natural-parameter proposal
  with both derivatives evaluated at the old mean and covariance, as derived by the general NCVMP formula.
  Appendix C has an inconsistent printed covariance evaluation point. Recomputing the mean derivative
  after changing only the covariance would be a different update. The saved scalar F1–F4 check supports
  this convention; no executable author implementation is certified.
- Adaptive Algorithm 2 permits natural steps above one and introduces positive-definiteness and objective
  checks. Its printed step-size initialization/index/reset control flow remains ambiguous, so it is not
  asserted as a separately verified controller here. The simplified Equation 12 objective applies after
  the scale-coordinate updates; it is not automatically valid for arbitrary trial lambda changes with
  stale scale factors. A stopping tolerance is not a convergence proof.
- The source calls lambda a lengthscale although its displayed squared-exponential exponent uses inverse-lengthscale
  magnitudes. Its spectral-density covariance prose conflicts with the subsequent feature reparameterization.
  Componentwise sign changes at fixed finite spectral draws do not generally leave the finite model unchanged.
  The predictive display’s inner/outer feature transpose is resolved by the preceding squared-response
  expectation and the declared column-vector dimensions; this record uses the outer moment R_star.
- All 21 preprint pages and all 19 pages of the supporting Wand paper were read. Journal metadata does
  not establish inspection of the complete Tan journal PDF. Direct access to the author’s publication
  page later succeeded, but the inspected sparse-spectrum entry and home-page links yielded no code link;
  this is not an exhaustive code-absence conclusion. No author code, model fitting loop, training or benchmark
  was run. Supplied-parameter arithmetic checks feature moments, scale normalization, a Gaussian coordinate,
  one scalar derivative example and predictive moments; DRAFT remains.
