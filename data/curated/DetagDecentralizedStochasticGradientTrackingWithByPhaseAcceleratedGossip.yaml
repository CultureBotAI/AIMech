claims:
- claim_id: detag-by-phase-accelerated-gossip-and-gradient-tracker-mechanism
  kind: mechanism
  statement: Within each phase k of R iterations, each worker i simultaneously accumulates R stochastic gradient batches g_(k) at fixed parameters x_{k,i} while applying R steps of Accelerated Gossip AG(z, W) with extrapolation weight eta = (1 - sqrt(1 - lambda^2)) / (1 + sqrt(1 - lambda^2)) to both the model replica x_tilde and gradient tracker y, contracting consensus error by factor rho = (1 - sqrt(1 - lambda_2(W)))^R before performing the phase-end tracker update y_{t+1,i} <- y_{t+1,i} + g_(k) - g_(k-1).
  evidence:
  - source_id: r552-primary-pdf
    locator: Section 6 Algorithms 2-3 & Appendix B.4 Equations (52)-(61), pp. 9-10, 24
    relation: supports
- claim_id: detag-near-optimal-nonconvex-sample-and-communication-complexity-scope
  kind: scope
  statement: For L-smooth non-convex objectives with bounded initial heterogeneity (1/n) sum_i ||grad f_i(0) - grad f(0)||^2 <= varsigma_0^2 and gossip second eigenvalue lambda, setting phase length R = max((1/2) log n, (1/2) log(varsigma_0^2 T / (Delta * L))) / sqrt(1 - lambda) enables DeTAG to reach an epsilon-stationary point in O(Delta * L * sigma^2 / (n * B * epsilon^4) + Delta * L * log(n + varsigma_0 * n / (epsilon * sqrt(Delta * L))) / (epsilon^2 * sqrt(1 - lambda))) iterations, matching the information-theoretic lower bound of Corollary 1 up to a logarithmic factor.
  evidence:
  - source_id: r552-primary-pdf
    locator: Section 4 Theorem 1 & Corollary 1, Section 6 Theorem 3, Table 2, pp. 3, 7, 10
    relation: supports
- claim_id: detag-phase-length-and-spectral-gap-tuning-limitation
  kind: limitation
  statement: Requires tuning or estimating the gossip acceleration parameter eta (which depends on the second largest eigenvalue lambda of W) and the phase length R, and holds the model query point x_{k,i} fixed across the R inner steps of each phase.
  evidence:
  - source_id: r552-primary-pdf
    locator: Section 6 Understanding the phase length R & Appendix A.1-A.2, pp. 10, 18-19
    relation: supports
- claim_id: detag-unshuffled-cifar-sparse-graph-training-application
  kind: application
  statement: Applied to decentralized training of LeNet on unshuffled non-IID CIFAR-10 and ResNet-20 on CIFAR-100 across sparse ring topologies with small spectral gaps (1 - lambda down to 4e-4).
  evidence:
  - source_id: r552-primary-pdf
    locator: Section 7 Experiments, Figures 2-3, pp. 10-12
    relation: supports
