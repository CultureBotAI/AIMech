id: AIMech:DetagDecentralizedStochasticGradientTrackingWithByPhaseAcceleratedGossip
name: DeTAG Decentralized Stochastic Gradient Tracking with By-Phase Accelerated Gossip
concept_kind: algorithm
review_status: DRAFT
definition: A decentralized stochastic non-convex optimization algorithm (DeTAG) that partitions training into phases of length R, concurrently executing R steps of momentum-accelerated gossip z_{r+1,i} = (1 + eta) sum_{j in N_i U {i}} z_{r,j} W_{ji} - eta z_{r-1,i} with eta = (1 - sqrt(1 - lambda^2)) / (1 + sqrt(1 - lambda^2)) on both the model replica x_tilde and gradient tracker y while accumulating B*R stochastic gradient queries at the fixed phase point x_{k,i}, and updating x_{k+1} = AG_R(x_k - alpha * y_k) and y_{k+1} = AG_R(y_k + g_tilde_k - g_tilde_{k-1}) at each phase boundary to achieve near-minimax-optimal sample and communication complexity.
identity_notes: Introduced by Yucheng Lu and Christopher De Sa (ICML 2021, PMLR Vol. 139, pp. 7111-7123; arXiv:2006.08085). Distinct from standard Decentralized Stochastic Gradient Tracking (DSGT / GT-DSGD, Pu & Nedic 2020; Zhang & You 2019; Xin et al. 2021), which corresponds to the unaccelerated single-step special case R = 1, eta = 0 and incurs suboptimal O((1 - lambda)^(-3)) spectral-gap dependence; and distinct from RelaySum / RelaySGD (Vogels et al., NeurIPS 2021, Round 549), which routes unattenuated sums over spanning trees rather than running by-phase Chebyshev-accelerated gossip with gradient tracking on arbitrary doubly-stochastic gossip matrices.
aliases:
- DeTAG
- Decentralized Stochastic Gradient Tracking with By-Phase Accelerated Gossip
- By-Phase Accelerated Gossip Gradient Tracking
