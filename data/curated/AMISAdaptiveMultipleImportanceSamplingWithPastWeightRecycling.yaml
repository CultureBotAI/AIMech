claims:
- claim_id: incremental-deterministic-mixture-past-weight-recycling
  kind: mechanism
  statement: At each adaptation stage t = 1, ..., T, AMIS evaluates the new proposal density q_t(x; theta^{t-1}) on all previously generated particles x_i^l (0 <= l <= t-1) to incrementally update their unnormalized mixture denominators delta_i^l <- delta_i^l + N_t q_t(x_i^l) and importance weights omega_i^l = pi(x_i^l) / [delta_i^l / sum_{j=0}^t N_j] (Algorithm 1, Equations 2-5), achieving exact deterministic-mixture pooling in (T+1) sum_{t=0}^T N_t density evaluations.
  evidence:
  - source_id: r833-primary-pdf
    locator: Section 2-3, Equations 2-5 and Algorithm 1, pp. 3-6
    relation: supports
- claim_id: student-t-moment-matching-and-ess-scale-hierarchy-initialization
  kind: mechanism
  statement: AMIS updates multivariate Student-t proposal parameters T_3(mu^t, Sigma^t) using the pooled deterministic-mixture importance weights across all stages 0 <= l <= t (Equation 6) and initializes the baseline covariance scale via a geometric hierarchy sigma_0 * 2^eta,eta in {-4,...,8}, selecting the scale that maximizes the Effective Sample Size (ESS) before launching sequential adaptation (Section 4).
  evidence:
  - source_id: r833-primary-pdf
    locator: Section 3, Equation 6, pp. 6-7; Section 4, pp. 7-9
    relation: supports
- claim_id: banana-shaped-posterior-and-population-genetics-application
  kind: application
  statement: AMIS is applied to Bayesian posterior integration, marginal likelihood estimation, and population genetics coalescent inference, substantially increasing Effective Sample Size and reducing estimator mean squared error on strongly twisted banana-shaped target distributions compared to unrecycled Population Monte Carlo.
  evidence:
  - source_id: r833-primary-pdf
    locator: Section 6, Figures 2-5, pp. 11-16
    relation: supports
- claim_id: adaptive-proposal-dependence-bias-and-quadratic-stage-cost-limitation
  kind: limitation
  statement: Because adapted proposal parameters theta^t depend on earlier simulated particles, the retroactively reweighted terms for fixed stage sizes N_t are not strictly unbiased in finite samples (exhibiting bias when N_t = 1, Section 5) and require N_T -> infinity for asymptotic consistency (Lemma 1), while evaluating every new proposal on all past draws incurs O(T sum_{t=0}^T N_t) proposal evaluations.
  evidence:
  - source_id: r833-primary-pdf
    locator: Section 3, p. 5; Section 5, Lemma 1 and Figure 1, pp. 9-11
    relation: supports
