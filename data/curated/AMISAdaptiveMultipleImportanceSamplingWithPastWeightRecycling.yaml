id: AIMech:AMISAdaptiveMultipleImportanceSamplingWithPastWeightRecycling
name: AMIS Adaptive Multiple Importance Sampling with Past-Weight Recycling
concept_kind: algorithm
review_status: DRAFT
definition: An adaptive importance sampling algorithm that iteratively updates parametric proposal distributions (such as multivariate Student-t densities fitted via weighted moment matching) while recycling all previously simulated particles at every iteration t by incrementally updating each past particle's Owen-Zhou deterministic multiple mixture denominator delta_i^l <- delta_i^l + N_t q_t(x_i^l) and recomputing importance weights omega_i^l = pi(x_i^l) / (delta_i^l / sum_{j=0}^t N_j) across the entire pooled trajectory.
identity_notes: No AIO class represents Adaptive Multiple Importance Sampling (AMIS); MarkovChain (AIO:MarkovChain) is the closest broad match covering iterative stochastic simulation and Monte Carlo sampling processes.
aliases:
- Adaptive Multiple Importance Sampling
- AMIS Past-Weight Recycling Importance Sampler
- Cornuet-Marin-Mira-Robert Adaptive Multiple Importance Sampling
