claims:
- claim_id: expand-fit-reduce-reset
  kind: mechanism
  statement: Specify an expanded complete-data density p_X(y_com|theta_star,alpha) that recovers the original
    augmentation at alpha_0 and whose observed density equals the original density at theta=R(theta_star,alpha).
    At each iteration embed the current theta with alpha_0, compute expanded conditional sufficient moments,
    maximize expanded Q over the expanded parameters, reduce by R, and reset the auxiliary parameter to
    alpha_0 for the next E step. The observed-density equality makes expanded EM ascent transfer to the
    original likelihood.
  evidence:
  - source_id: method-source
    locator: Sections 3.1-3.2, Equations 3.1-3.2 and Theorem 1, pp.758-759 / PDF pp.5-6
    relation: supports
- claim_id: fixed-degrees-t-expansion
  kind: mechanism
  statement: For a p-dimensional t distribution with fixed positive degrees of freedom nu, old latent
    weights are w_i=(nu+p)/(nu+delta_i), with delta_i the old scatter-based squared Mahalanobis distance.
    Ordinary EM uses the weighted mean and scatter sum_i w_i(y_i-mu_new)(y_i-mu_new)^T/N. Expanding the
    mean of the latent gamma scale yields alpha_new=sum_i w_i/N. Dividing the expanded scatter by alpha_new
    reduces to the original t model, giving denominator sum_i w_i instead of N; the next iteration resets
    alpha to one. This normalization follows from the stated expansion and reduction.
  evidence:
  - source_id: method-source
    locator: Section 2, pp.756-758 / PDF pp.3-5
    relation: supports
- claim_id: scalar-normal-example
  kind: mechanism
  statement: For y|z~Normal(z,1), z~Normal(theta,sigma_squared), with known positive sigma_squared, ordinary
    EM updates theta to m=(theta_old+sigma_squared*y)/(1+sigma_squared). Expanding the conditional observation
    mean to z+alpha gives theta_star_new=m and alpha_new=y-m. The reduction theta_star+alpha returns theta_new=y
    in one iteration, while ordinary EM contracts its error by 1/(1+sigma_squared). This exact example
    does not establish one-step convergence for other expansions.
  evidence:
  - source_id: method-source
    locator: Section 3.4, pp.761-762 / PDF pp.8-9; curator scalar arithmetic
    relation: supports
- claim_id: local-rate-boundary
  kind: limitation
  statement: The information-matrix comparison linearizes at a converged likelihood solution under the
    stated differentiability, invertibility and positive-information conditions. It orders the slowest
    local linear convergence direction relative to the parent EM and permits equality. The paper’s global
    rate terminology refers to the extremal local direction, not convergence from arbitrary initializations.
    It does not order every finite iterate or total computational time.
  evidence:
  - source_id: method-source
    locator: Section 3.3, pp.760-761 / PDF pp.7-8; Section 5, pp.768-769 / PDF pp.15-16
    relation: supports
limitations:
- Finding a useful likelihood-preserving expansion is problem-specific. Additional free observed-model
  parameters without a valid reduction do not constitute this PX-EM construction.
- Monotone bounded likelihood values alone do not prove parameter convergence or global optimality. Approximate
  expanded maximization and matrix/scatter boundary cases need separate validity and ascent checks.
- The probit second-moment expression printed on p.766 fails the zero-predictor half-normal check, and
  the Poisson latent-count expectation printed on p.768 conflicts with the stated Poisson split. These
  curator-identified discrepancies are retained in the ledger; the record does not assert those example
  formulas.
- All seventeen source PDF pages were read and two formulas reread at higher resolution. Finite calculations
  check scalar reduction, one fixed-nu t update and elementary moment contradictions; no historical fit,
  source implementation, clinical conclusion or benchmark was reproduced.
