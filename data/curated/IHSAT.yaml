name: IHSAT
definition: A GenSAT variant that chooses the least recently flipped variable among all flips that do
  not decrease the satisfied-clause count, or among all variables when no nondecreasing flip exists.
concept_kind: algorithm
identity_notes: 'IHSAT combines ISAT’s indifferent candidate-set rule with HSAT’s history-based picking
  rule in Gent and Walsh’s 1993 paper. It is not merely another name for greedy HSAT: a neutral old candidate
  can be selected while a positive-gain candidate exists, and when every move worsens the score, age selection
  can choose a move worse than the least-decreasing alternative. Memory is scoped to the current attempt
  and does not impose a tabu prohibition. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 325 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 90 and 90 lines respectively. All
  64 unique hit contents were inspected: neighboring variant and source references, saved reviews and
  candidate leads, not existing candidate records. Exact checkout counts and differences are retained
  in the ledger. Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five
  full native neighboring records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The fallback pool when all gains are negative contains all variables; it is not restricted to least-worsening
  moves. Replacing the nonnegative pool with only maximum-gain candidates yields a different rule.
- The oldest-variable selector is deterministic once the current attempt and fixed ordering are specified,
  but initialization remains randomized. A rule excluding recent moves for a tenure would introduce tabu
  behavior not required by IHSAT.
- The 1993 evidence is empirical. No completeness, polynomial runtime or universal superiority is established
  by the inspected method description, and no numerical benchmark claim is curated.
- The GenSAT loop checks satisfaction before each flip; exact final-flip return handling and budget boundaries
  must be declared in an implementation. Finite failure is not an UNSAT certificate. No author solver
  was executed.
