claims:
- claim_id: method
  kind: mechanism
  statement: Begin a GSAT/GenSAT attempt with a random complete assignment and fresh attempt-local flip
    history. If the formula is not satisfied, compute each variable’s gain in satisfied-clause count if
    flipped. If any gain is nonnegative, make every variable with gain at least zero a candidate, without
    favoring a larger improvement over a neutral flip. If all gains are negative, make every variable
    a candidate. From this pool choose the one whose last flip in the current attempt was longest ago;
    treat never-flipped variables as oldest and break their ties with a fixed arbitrary ordering, as in
    HSAT. Flip it, update its timestamp and repeat within the selected attempt budget. New attempts retain
    the GSAT initialization behavior and reset the current-attempt history.
  evidence:
