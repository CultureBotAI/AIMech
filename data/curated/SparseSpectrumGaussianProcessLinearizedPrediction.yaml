claims:
- claim_id: fixed-feature-posterior
  kind: mechanism
  statement: For fixed frequencies omega_i, the source uses a 2m-dimensional feature vector with cosine
    and sine entries scaled by sigma_f/sqrt(m). With Gaussian coefficient prior N(0,I) and scalar Gaussian
    observation noise of variance sigma_n^2, its trained coefficient posterior is N(alpha,S), where alpha=A^{-1}*Phi*y,
    S=sigma_n^2*A^{-1} and A=Phi*Phi^T+sigma_n^2*I. The fixed-input response has mean alpha^T*phi(x) and
    variance sigma_n^2+phi(x)^T*S*phi(x). Uncertain-input prediction integrates a prescribed X~N(mu,Sigma)
    independently of this fixed coefficient posterior, conditional on the training data, frequencies and
    hyperparameters. These prediction methods do not require one particular training solver once the posterior
    coefficient moments are supplied.
  evidence:
  - source_id: pan2017
    locator: Section 2, Equations 4, 6–7 and following remark, PDF pp. 2–3; Section 3 assumptions, PDF
      p. 3
    relation: supports
  - source_id: pan2017-supp
    locator: Sections 2–3.1, Equations 1–5 and Gaussian-input assumptions, PDF pp. 1–2
    relation: supports
- claim_id: local-mean-frozen-variance
  kind: mechanism
  statement: SSGP-Lin linearizes m(x)=alpha^T*phi(x) at the input mean mu and evaluates the conditional
    response variance at mu. With J=Dphi(mu) of size 2m by d and column gradient g=J^T*alpha, the approximate
    mean is m(mu) and variance is sigma_n^2+phi(mu)^T*S*phi(mu)+g^T*Sigma*g. The cosine feature derivative
    is -sigma_k*sin(omega_i^T*mu)*omega_i^T and the sine derivative is sigma_k*cos(omega_i^T*mu)*omega_i^T.
    This formula omits posterior-mean curvature and input-dependent conditional-variance curvature. Nonnegative
    component variances give a nonnegative scalar variance, which does not establish approximation accuracy.
  evidence:
  - source_id: pan2017
    locator: Section 3.2, Equations 12–14, PDF p. 5
    relation: supports
  - source_id: pan2017-supp
    locator: Section 3.1, definition of M=Dphi, PDF p. 2; Section 3.5, PDF pp. 5–6
    relation: supports
- claim_id: local-cross-covariance
  kind: mechanism
  statement: With column input X, the local input-response cross-covariance is Sigma*g, a d by 1 column.
    For two conditionally independent scalar output models with independent residual noise, the off-diagonal
    response covariance is g_a^T*Sigma*g_b. This retains covariance induced by the shared uncertain input
    while freezing each conditional variance. It does not model conditional cross-output covariance. The
    main paper’s M underbrace and final input-response covariance orientation are inconsistent; the supplemental
    definition M=Dphi and explicit matrix dimensions determine the formulas used here.
  evidence:
  - source_id: pan2017
    locator: Section 3.2, Equations 12 and 15–16, PDF p. 5
    relation: supports
  - source_id: pan2017-supp
    locator: Section 3.1, PDF p. 2; Section 3.5, PDF pp. 5–6; Section 6.1, PDF p. 12
    relation: supports
- claim_id: distinct-variance-truncation
  kind: limitation
  statement: Freezing the conditional variance differs from the earlier Girard local GP approximation,
    which adds one half of the trace of its conditional-variance Hessian times Sigma. In a curator finite-feature
    illustration Y=W*cos(X), with independent W~N(0,1) and X~N(0,2), SSGP-Lin gives variance 1, exact
    integration gives (1+exp(-4))/2, and retaining the second-order conditional-variance term gives -1.
    This limiting rank-one coefficient example distinguishes the truncations; it is not a trained-model
    benchmark or a claim that the earlier method always fails. Both local approximations can differ substantially
    from exact moments away from a sufficiently local input regime.
  evidence:
  - source_id: pan2017
    locator: Section 3.2, Equation 14, PDF p. 5
    relation: supports
  - source_id: pan2017-supp
    locator: Section 3.5, PDF pp. 5–6
    relation: supports
  - source_id: girard-tr2002
    locator: Sections 3.3–3.4, Equations 14–22, PDF pp. 8–9
    relation: supports
- claim_id: sequential-use
  kind: limitation
  statement: The source uses these prediction transforms inside Bayesian filtering and future-state prediction
    for control. Gaussian moment propagation alone does not retain the full predictive shape or all dependence
    between a repeatedly used uncertain dynamics function and subsequent states. Hewing and colleagues
    explicitly analyze the successive-evaluation independence approximation in Pan-style trajectory prediction.
    This prediction transform is therefore not an exact shared-function trajectory inference algorithm
    or, by itself, a complete filter or controller.
  evidence:
  - source_id: pan2017
    locator: Section 4.1 prediction and filtering stages, PDF pp. 5–6; Section 4.2, PDF pp. 6–7
    relation: supports
  - source_id: hewing2020
    locator: Introduction and Sections 2–3, PDF pp. 1–4; distinct trajectory constructions, PDF pp. 5–7
    relation: supports
