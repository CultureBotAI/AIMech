  rationale: The primary source repeatedly applies the transform to predict future dynamical states in
    filtering and model predictive control. This is a demonstrated forecasting application, not a restriction
    of the generic prediction algorithm to time series.
limitations:
- Mean linearization and frozen conditional variance can miss both mean and variance curvature. Positive
  covariance is not a guarantee of accurate moments, calibrated uncertainty or performance superiority.
- The input Gaussian is prescribed independently of the fixed trained coefficient posterior. Frequencies,
  hyperparameters, training data and feature count are conditioned on rather than integrated out; finite-feature
  kernel approximation remains a separate source of error.
- The displayed variance includes a future independent observation-noise term once. A latent-function
  prediction omits that additive future-noise term while retaining the trained posterior coefficient covariance.
- Multivariate cross-output formulas assume conditionally independent scalar models and independent residual
  noises. Shared input covariance remains; correlated-output priors and correlated measurement noises
  require additional terms.
- Gaussian representations and repeated independent-input propagation discard predictive shape and shared-function
  temporal dependence. Filtering updates and belief-space controller optimization are additional algorithms,
  not identities of this prediction transform.
- Source notation inconsistencies were checked against the supplement and independent algebra. Table 1
  spectral-density constants, controller derivative formulas, runtime claims and numerical comparative
  performance are not asserted here. No author implementation, training, paid provider or benchmark was
  run; analytic examples are curator illustrations. The record remains DRAFT.
