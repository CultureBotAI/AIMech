id: AIMech:SparseSpectrumGaussianProcessLinearizedPrediction
name: Sparse-spectrum Gaussian-process linearized uncertain-input prediction
aliases:
- SSGP-Lin
concept_kind: algorithm
definition: A local uncertain-input prediction algorithm for a fixed sparse-spectrum Gaussian-process
  posterior that linearizes the posterior mean at the Gaussian input mean, freezes the conditional variance
  there, and uses the resulting approximate mean and covariance for a Gaussian output representation.
identity_notes: 'Compared all 442 pinned AIO IDs, labels and scoped synonyms and 543 maintained IDs, names
  and aliases: neither proposed identity nor its acronym matched. Full-text searches in the recovery,
  older discovery and original Documents checkouts included ignored and hidden files and returned 98,
  0 and 0 lines; all 62 distinct matched strings were read. Hits concern pending sparse-spectrum leads,
  source reading notes and scope distinctions in existing GP records. Read all 39 semantic AIO rows and
  107 native name/definition neighbors, seven complete annotated AIO CLASS nodes with incident edges and
  generated records, and four native context records. The fixed finite-feature posterior differs from
  the full squared-exponential kernel model; SSGP-EMM integrates its moments, whereas SSGP-Lin linearizes
  its mean and freezes its conditional variance. Neither identity denotes learning the underlying sparse-spectrum
  regression model, general Fourier feature construction, a complete Bayesian filter, or a model predictive
  controller. The earlier Girard Taylor record retains a conditional-variance Hessian term that SSGP-Lin
  omits. Absence is bounded to this inspected pin and corpus.'
