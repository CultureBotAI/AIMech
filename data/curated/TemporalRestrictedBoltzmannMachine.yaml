name: Temporal restricted Boltzmann machine
definition: A neural sequence architecture that multiplies time-indexed conditional RBM distributions
  whose visible and hidden biases depend on preceding visible and hidden states through shared temporal
  weights.
concept_kind: architecture
identity_notes: 'This record covers the original single-layer temporal RBM construction of Sutskever and
  Hinton, with its finite lag window and omitted-edge special cases. The full architecture has visible-to-visible,
  visible-to-hidden and hidden-to-hidden history connections. It is distinct from temporal FRBM’s factored
  categorical-word construction, RTRBM’s deterministic recurrent state, and the observed-history-only
  autoregressive CRBM. Multilayer stacking is an extension rather than part of this single-layer identity;
  a filtering algorithm does not define the latent probabilistic model. All 442 pinned AIO labels/scoped
  synonyms and 361 preceding native IDs/names/aliases were compared, with no normalized identity match.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main, returning
  24 lines each. All 18 unique matched contents were read: temporal FRBM source references, model contrasts,
  a discovery lead and saved review context, rather than existing candidate records. All 44 semantic label/synonym
  hits and 21 exact AIO nodes were inspected, alongside corresponding generated records and four complete
  native neighbors. Previously read contextual files were checked for byte identity. Absence is bounded
  to this snapshot and inspected neighborhood.'
limitations:
- The conditional partition depends on history, including previous hidden states. It is not one sequence-independent
  global constant, and exact posterior Gibbs updates can require ratios of such partitions.
- A factorial posterior given known latent history does not imply factorial or exact filtering after uncertain
  history is marginalized. Mean substitution through nonlinear normalized factors is generally approximate,
  and future observations can revise earlier hidden-state posteriors.
- The paper explicitly notes that changing its parameter-dependent approximate posterior can reduce the
  variational bound. Finite CD, mean visible reconstructions and ignoring future evidence provide no monotonic
  bound or likelihood guarantee.
- TRBM-HH denotes the variant with hidden-to-hidden links omitted, not one retaining only those links.
  For fully observed visible sequences its hidden posterior is factorial; missing observations and multilayer
  compositions change that inference problem.
- The displayed construction has no past-hidden-to-current-visible links; a footnote mentions those as
  a possible extension. Gaussian visible units, deeper compositions and different lag structures require
  their own stated assumptions. No empirical ranking, long-memory guarantee or author-code behavior is
  certified.
