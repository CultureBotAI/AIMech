claims:
- claim_id: method
  kind: mechanism
  statement: For binary vectors v_t and h_t, set the visible bias a_t=a+sum_k A_k^T v_(t-k) and hidden
    bias b_t=b+sum_k B_k^T h_(t-k)+sum_k C_k^T v_(t-k). Define p(v_t,h_t|history)=exp(v_t^T C_0 h_t+a_t^T
    v_t+b_t^T h_t)/Z_t(history), and multiply these normalized factors over time using shared parameters
    and the source’s learned initial contributions for unavailable earlier states. Conditional on observed
    current and previous visibles and known previous hidden states, the current hidden posterior factorizes
    with probabilities sigmoid(C_0^T v_t+b_t). Unknown previous hidden states generally require marginalization;
    the proposed online filter instead substitutes their inferred probability vectors in b_t. Learning
    treats these approximate filtered states as context and uses per-step contrastive-divergence updates.
    The original paper distinguishes this approximation from smoothing with future observations and from
    an exact likelihood gradient.
