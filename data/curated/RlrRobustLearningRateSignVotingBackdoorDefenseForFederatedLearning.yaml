id: AIMech:RlrRobustLearningRateSignVotingBackdoorDefenseForFederatedLearning
name: RLR Robust Learning Rate Sign-Voting Backdoor Defense for Federated Learning
concept_kind: algorithm
review_status: DRAFT
definition: A server-side federated learning backdoor defense that adjusts the server's learning rate vector eta_theta in {+eta, -eta}^d coordinate-wise at each communication round t according to the supermajority sign consensus of participating client updates Delta_t^k = w_t^k - w_t, setting eta_{theta, i} = +eta if |sum_{k in S_t} sgn(Delta_{t,i}^k)| >= theta and eta_{theta, i} = -eta otherwise, and updating the global model via element-wise product w_{t+1} = w_t + eta_theta odot g({Delta_t}) so that coordinates lacking honest sign consensus move in the loss-maximizing direction.
identity_notes: Introduced by Ozdayi, Kantarcioglu, and Gel (AAAI 2021, Vol. 35, No. 10, pp. 9268-9276, DOI:10.1609/aaai.v35i10.17118, arXiv:2007.03767). Distinct from SignSGD with majority vote (AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization, Bernstein et al. 2018), which discards update magnitudes and updates by eta * sgn(sum_k sgn(Delta_t^k)), whereas RLR preserves the full-precision aggregated update magnitude (e.g., FedAvg or coordinate-wise median) and flips the sign of the server learning rate to -eta on any coordinate where the absolute sum of update signs falls below threshold theta. Also distinct from FoolsGold (AIMech:FoolsGoldCosineSimilaritySybilDefenseForFederatedLearning), which assigns scalar per-client learning rates alpha_k based on historical cosine similarity rather than per-dimension sign-voting learning rates.
aliases:
- Robust Learning Rate for Federated Learning
- RLR Federated Backdoor Defense
- FedAvg with Robust Learning Rate
