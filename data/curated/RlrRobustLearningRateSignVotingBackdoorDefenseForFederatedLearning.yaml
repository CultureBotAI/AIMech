claims:
- claim_id: c1-mechanism-coordinate-sign-vote-learning-rate-inversion
  kind: mechanism
  statement: Given client updates {Delta_t^k}_{k in S_t} at round t and a server learning threshold hyperparameter theta, RLR sets the i-th coordinate server learning rate to eta_{theta, i} = +eta if |sum_{k in S_t} sgn(Delta_{t,i}^k)| >= theta and eta_{theta, i} = -eta otherwise (Eq. 5), equivalently multiplying the aggregated update by the diagonal unitary operator (2 I_t - I) with ||2 I_t - I||_2 = 1 so that coordinates below the sign-consensus threshold ascend rather than descend the empirical loss surface (Eqs. 6, 8-9).
  evidence:
  - source_id: r529-primary-pdf
    locator: Section 3 Equations (5)-(6) and Appendix D.1 Equations (8)-(9), pp. 3, 13
    relation: supports
- claim_id: c2-scope-nonconvex-convergence-under-population-weighted-symmetry
  kind: scope
  statement: Under L-Lipschitz smooth local objectives with bounded stochastic gradient variance sigma^2, population-weighted symmetric unimodal gradient noise (Eq. 7), universal update norm bound M, and sign-inversion probability Pr(1 - I_{|sum sgn(Delta_{t,i}^k)| >= theta} | F_t) <= p_0 < 0.25, Theorem 1 proves that RLR satisfies (1/T) sum_{t=0}^{T-1} E[||nabla f(w_hat_t)||^2] <= 2(f(w_hat_0) - f^*)/(eta T) + L^2 M^2 + L eta sigma^2 / n.
  evidence:
  - source_id: r529-primary-pdf
    locator: Section 3 Theorem 1 and Appendix D.2 Equations (10)-(21), pp. 3-4, 13-15
    relation: supports
- claim_id: c3-application-trojan-and-distributed-backdoor-defense
  kind: application
  statement: Combined with FedAvg, coordinate-wise median, or weight-clipping and Gaussian noise, RLR reduces trojan backdoor accuracy from 99-100% to 0-3.4% on i.i.d. Fashion-MNIST and non-i.i.d. Federated EMNIST and defends CIFAR-10 against partitioned Distributed Backdoor Attacks (DBA) where FoolsGold, Comed, and SignSGD fail.
  evidence:
  - source_id: r529-primary-pdf
    locator: Section 4, Tables 1-2, and Figures 2-5, pp. 4-7
    relation: supports
- claim_id: c4-limitation-threshold-selection-and-convergence-slowdown
  kind: limitation
  statement: Applying RLR from the beginning of training slows convergence and slightly reduces clean validation accuracy on non-i.i.d. client distributions where honest updates naturally disagree in sign, requiring careful tuning of theta in [K*F + 1, K - K*F] or delayed activation near convergence.
  evidence:
  - source_id: r529-primary-pdf
    locator: Section 4 (Removing Backdoor During Training), Section 6, and Appendix A & C.1 Figure 6, pp. 5, 7, 9-10
    relation: supports
