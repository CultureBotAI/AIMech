  rationale: This procedure adapts a family of Markov transition kernels that are target-invariant at
    frozen settings. Its sampled-state history is not assumed to be a homogeneous Markov chain, and adaptive
    validity requires separate assumptions. AIO MarkovChain is a process/model beneath Network; this is
    a related method-to-process mapping, not equivalence, an is-a assertion or a convergence guarantee.
    The frozen joint population target depends on the ladder; the cold marginal remains pi. This does
    not assert one invariant joint law throughout adaptation.
