name: Adaptive parallel tempering
definition: A parallel-tempering algorithm that adapts temperature gaps and within-replica random-walk
  proposal parameters through projected stochastic approximation.
concept_kind: algorithm
identity_notes: This record is the fixed-replica-count Miasojedow–Moulines–Vihola 2012 construction. Its
  multiplicative inverse-temperature parameterization and all-pair swap-probability updates differ from
  later author software using increments of reciprocal temperatures and updates for selected pairs. No
  normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 181 prior native
  IDs/names/aliases. Ignored-inclusive searches of both full checkouts found prior discovery leads, neighboring
  sampler discussions and unrelated author-name/environment substrings. Existing random-walk Metropolis,
  delayed-rejection, fixed symmetric delayed-rejection and RAM records were inspected; shared components
  do not make these procedures equivalent.
limitations:
- The record uses projected covariance and log-scale adaptation with separate step sequences; the mean
  recursion itself is not projected. Finite rho bounds keep ordered positive inverse temperatures, and
  the replica count is fixed.
- Every rho update uses a hypothetical adjacent swap probability at the post-propagation state, not just
  the pair actually selected or a binary swap outcome.
- The strong-law and temperature-convergence results have different hypotheses. Temperature convergence
  additionally needs stronger step conditions and the target solution inside the projection bounds; projection
  alone does not guarantee the desired rate is attainable.
- The continuous-target results assume the stated tail/contour, moment and step-size conditions. Experiments
  omitting projections do not prove unrestricted adaptive validity.
- The optional RAM proposal variant in Section 2.3 uses a physical increment where the original RAM paper
  uses a standardized proposal direction. That variant is excluded here; the covariance-based construction
  is the inspected core.
- No changing-replica-count method, unrestricted adaptive convergence, universal efficiency claim or benchmark
  reproduction is asserted.
