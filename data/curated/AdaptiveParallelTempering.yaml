claims:
- claim_id: method
  kind: mechanism
  statement: With fixed L≥2, alpha_star in (0,1) and epsilon in (0,1), set beta1=1 and beta_(l+1)=beta_l
    exp(−exp(rho_l)). Initialize within the parameter constraint sets and positive target support. At
    each iteration use the previous temperatures and proposal covariances for an adjacent exchange followed
    by local Gaussian Metropolis moves. From the retained post-propagation population X_new, compute every
    adjacent hypothetical exchange probability h_l=min(1,[pi(X_(l+1))/pi(X_l)]^(beta_l−beta_(l+1))). Update
    each rho_l by projection of rho_l+gamma1_n(h_l−alpha_star) onto a fixed finite interval. For each
    replica update mu_l=(1−gamma2_n)mu_l+gamma2_n X_new,l, and project (1−gamma2_n)Gamma_l+gamma2_n(X_new,l−mu_old,l)(X_new,l−mu_old,l)^T
    onto matrices with eigenvalues in [epsilon,epsilon^−1]. Update T_l by interval projection of T_l+gamma3_n(alpha_local,l−alpha_star),
    where alpha_local is that iteration’s local proposal acceptance probability. Use Sigma_l=exp(T_l)Gamma_l
    for later Gaussian proposals. Thus T is log variance, not log standard deviation; all adaptation follows
    the completed transition.
