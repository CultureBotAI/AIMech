claims:
- claim_id: r388-frozen-server-statistics-and-generic-optimizer-reduction
  kind: mechanism
  statement: Lemma 5 demonstrates that updating momentum or adaptive preconditioner statistics V(g, s) locally at every client step biases the statistics toward client-specific gradients, whereas Theorem I proves that for any optimizer A = (U, V) with linear step map U(g_1 + g_2, s) = U(g_1, s) + U(g_2, s), keeping s_{t-1} fixed during K local steps yields an exact server step x_t = x_{t-1} - eta_tilde * U(c_t + e_t, s_{t-1}) with effective step size eta_tilde = K * eta and bounded local drift perturbation ||e_t||^2 <= L^2 * E_K^t.
  evidence:
  - source_id: r388-primary-pdf
    locator: Section 3.1-3.3 Algorithm 1, Appendix C Lemma 5, and Section 4.1 Theorem I, pp. 4-6, 17-20
    relation: supports
- claim_id: r388-hessian-dissimilarity-and-mimemvr-complexity
  kind: mechanism
  statement: Under delta-bounded Hessian dissimilarity ||nabla^2 f_i(x) - nabla^2 f(x)|| <= delta (Assumption A2*, where delta <= L and delta = 0 for homogeneous-curvature objectives even under arbitrarily large gradient dissimilarity G^2), Lemma 3 bounds the variance of the Mime SVRG correction by delta^2 ||y - x||^2, and Theorem IV proves that MimeMVR finds an epsilon-stationary point of nonconvex objectives in O(((1+delta) G^2 F / (S * eps^2))^{3/4} + (delta * sigma^2 / sqrt(S) + delta * G^2) / eps^{3/2} + (delta * K + L) / (eps * K)) rounds, matching the Omega((G / (sqrt(S) * eps))^{3/2}) lower bound of Theorem III and beating server-only momentum when delta << L.
  evidence:
  - source_id: r388-primary-pdf
    locator: Section 2 Assumption A2*, Appendix B Lemma 3, and Section 4.2 Theorems III & IV, pp. 3, 6-8, 15
    relation: supports
- claim_id: r388-full-local-gradient-and-communication-overhead-limitation
  kind: limitation
  statement: Full Mime requires each active client to compute its full-batch local gradient nabla f_i(x_{t-1}) and evaluate two stochastic gradients per local step (at y_{i,k-1} and x_{t-1}) while broadcasting both x_{t-1}, s_{t-1}, and c_t (2x-3x downlink/uplink overhead), whereas MimeLite avoids the SVRG correction at the cost of an extra O(G^2) gradient-dissimilarity drift term.
  evidence:
  - source_id: r388-primary-pdf
    locator: Section 3.2-3.3 Algorithm 1, Theorem I, and Section 4.2 Theorem V (MimeLiteMVR), pp. 5-8
    relation: supports
- claim_id: r388-stateless-cross-device-federated-deep-learning-application
  kind: application
  statement: Applied to stateless cross-device federated learning on EMNIST-62 (ResNet-18), CIFAR-100, and Shakespeare character-level LSTM benchmarks using MimeSGD, MimeMom, MimeAdam, and MimeMVR, outperforming FedAvg, FedAvgM, FedAdam, and SCAFFOLD under low client sampling rates.
  evidence:
  - source_id: r388-primary-pdf
    locator: Section 5 Experimental Analysis, Figures 1-2 & Table 2, pp. 8-9
    relation: supports
