name: Real-valued neural autoregressive density estimator
definition: A fully visible neural autoregressive density architecture for real-valued vectors that shares
  input-to-hidden parameters across ordered scalar conditional mixture-density models.
concept_kind: architecture
identity_notes: 'This record denotes Uria, Murray and Larochelle’s original RNADE family. It extends binary
  NADE by replacing Bernoulli outputs with real-valued mixture conditionals. Deterministic prefix features
  and NADE-style input sharing distinguish it from separate untied conditional networks and from a stochastic
  latent RBM. Mixture-of-Gaussians and mixture-of-Laplace outputs are reported variants, not identity
  aliases for every Gaussian or Laplace mixture. No normalized identity match was found across all 442
  pinned AIO labels/scoped synonyms and 349 preceding native IDs/names/aliases. Full-checkout fixed-string
  searches included ignored and hidden files in worktree and main, returning 5 and 5 lines respectively.
  All 3 unique matched line contents were inspected in full: the prior NADE-variant lead, RNADE source
  URL and previous review exclusion, not existing candidate records. Exact checkout counts and differences
  are retained in the ledger. Seventeen exact AIO CLASS nodes with scoped synonyms/comments and outgoing
  edges and five full native neighboring records were inspected. Absence is bounded to this snapshot and
  semantic neighborhood.'
limitations:
- The variable ordering, conditional family, hidden capacity, component count and optimization restrict
  the fitted density. Exact density evaluation does not make arbitrary missing-variable posterior inference
  a forward pass or establish data-model agreement.
- Linear scaling in dimensionality holds with fixed hidden and mixture sizes; it does not omit their cost.
  The final prefix update is unnecessary, consistent with the declared H by (D-1) input-weight matrix.
- The supplement labels several log-density derivative formulas as derivatives of p rather than log p.
  Its Algorithm 2 also uses a log-shaped expression with a positive squared-residual term as if it were
  a component density in responsibilities, and has prefix/index ambiguities. A literal finite example
  produces invalid responsibilities. The curated mechanism follows the main-paper normalized densities
  and prefix equations; this is not a claim about author-code behavior.
- The experimental standard-deviation gradient rescaling is not the raw likelihood gradient or Newton’s
  variance scaling. Exponential scales remain susceptible to approaching zero; regularization and model
  selection matter.
- No performance ranking, convergence guarantee, exact posterior claim or full executable implementation
  validation is included.
