claims:
- claim_id: method
  kind: mechanism
  statement: For an ordered real-valued vector x, evaluate p(x)=product_d p(x_d|x_<d). Start a_1=c and
    update a_(d+1)=a_d+x_d W[:,d] when another conditional remains. At each position, a learned scalar
    rho_d rescales the shared prefix preactivation; sigmoid or rectified-linear units produce deterministic
    hidden features h_d. Separate position-specific output matrices map those features to scalar-mixture
    parameters. In RNADE-MoG, softmax gives component weights, linear outputs give means, and exponentials
    give positive standard deviations. Summing the normalized scalar Gaussian components gives each conditional
    density; multiplying the conditionals yields a normalized joint without a global partition-function
    estimate. Complete-vector log densities and their derivatives are directly evaluable; prefix recurrence
    and fixed hidden/component sizes give cost linear in the number of dimensions, with output work O(DHK).
    Ancestral generation samples each scalar from the mixture conditioned on previously generated values.
    The experimental mean-output gradient rescaling by component standard deviation is a training heuristic,
    separate from the exact log-density derivative. The paper also substitutes Laplace mixture conditionals.
