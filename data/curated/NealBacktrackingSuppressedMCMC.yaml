aio_mappings:
- target: AIO:MarkovChain
  relation: related_match
  rationale: The algorithm constructs a transition on ordered state pairs with a specified target marginal.
    The AIO target describes a stochastic process/model; this is a method-to-process association without
    equivalence, subclass status, or inheritance of the exported Network and ProbabilisticHiddenLayer
    assertions.
limitations:
- This local label denotes Neal’s finite-state conditional-kernel construction. Generic nonreversible
  MCMC, lifted MCMC and non-backtracking graph walks are not asserted as exact aliases.
- The expanded-chain irreducibility requirement must be checked separately. The uncorrected automatic-irreducibility
  claim is not adopted.
- The target invariance statement and the asymptotic-variance comparison have different assumptions. Neither
  implies finite-run or computational superiority.
- The inspected 2004 arXiv report is retained with its printed simulation caveat. No corrected fast implementation
  or equivalence to uninspected author-hosted PDF bytes is claimed.
- The Diaconis–Miclo article was inspected selectively, including its correction on PDF p. 32; this is
  not a full review of its spectral results.
- The exact curator calculations do not execute author software or reproduce benchmarks. DRAFT remains.
