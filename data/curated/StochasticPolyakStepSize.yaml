id: AIMech:StochasticPolyakStepSize
name: Stochastic Polyak Step-Size
concept_kind: algorithm
review_status: DRAFT
definition: 'An adaptive learning-rate selection rule for stochastic gradient descent on finite-sum or streaming objectives min_{x in R^d} f(x) = (1 / n) sum_{i=1}^n f_i(x) that sets the per-iteration step size for sampled component i_k to gamma_k = (f_i(x^k) - f_i^*) / (c ||nabla f_i(x^k)||^2) (or its bounded variant SPS_max: gamma_k = min{(f_i(x^k) - f_i^*) / (c ||nabla f_i(x^k)||^2), gamma_b}), where f_i^* = inf_x f_i(x) is the known component-loss infimum (zero for standard unregularized surrogate losses or closed-form via the r-Lambert W_r function for l_2-regularized binary losses), c > 0 is a curvature scaling factor, and gamma_b > 0 is an optional upper bound or adaptive smoothing cap gamma_b^k = tau^{b/n} gamma^{k-1}.'
identity_notes: Distinct from classical deterministic Polyak step-size (Polyak, 1987, which requires full objective evaluations f(x^k), full subgradients g^k, and the global minimum f^*), from ALI-G (Berrada et al., 2020, which adds a denominator regularizer delta > 0 that prevents exact convergence under interpolation), from L4 (Rolinek & Martius, 2018, which estimates f_i^* online using three hyperparameters without convergence guarantees), and from Stochastic Armijo Line Search (SLS, Vaswani et al., 2019, which requires expensive backtracking function evaluations).
aliases:
- SPS
- SPS_max
- Bounded Stochastic Polyak Step-Size
- Stochastic Polyak Learning Rate
