name: HashCRBM
definition: A conditional RBM training and prediction method that uses spectral hashing of inputs to retrieve
  distinct training-output configurations and normalizes the conditional model only over that input-dependent
  support.
concept_kind: algorithm
identity_notes: 'This is the HashCRBM method of Mnih, Larochelle and Hinton. It combines a fixed learned
  input hash with restricted-support conditional energy modeling; neither a generic conditional RBM nor
  spectral hashing alone defines the method. Retrieval supplies possible output configurations, while
  learned free energies determine their conditional weights. It is not ordinary k-nearest-neighbor voting
  or a categorical feature hashing layer. The source allows analogous restricted-support learning for
  other computable energy models; this record describes its named conditional-RBM construction. All 442
  pinned AIO labels/scoped synonyms and 367 preceding native IDs/names/aliases were compared, with no
  normalized identity match. Full-checkout fixed-string searches included ignored and hidden files in
  both worktree and main, returning 37 lines each. All 27 unique matched contents were read: conditional-RBM
  source references, contrasting method descriptions, pending leads and saved review context, rather than
  existing candidate identities. All 45 semantic label/synonym hits and 23 exact annotated AIO nodes were
  inspected, alongside corresponding generated records and three complete native neighbors. Previously
  read contextual files were checked for byte identity. Absence is bounded to this snapshot and inspected
  neighborhood.'
limitations:
- Exact normalization and gradients refer to the deliberately restricted conditional model, not the original
  full-output-space CRBM. Outputs outside V(u) have zero joint probability, and a joint-mode predictor
  cannot return them.
- Coordinate-wise marginal decisions can lie outside the joint support; this is a loss-dependent prediction
  decision, not positive model probability for the assembled vector or evidence of factorized output variables.
- The retrieved set must be nonempty. The displayed formula supplies no distribution for an empty test-time
  set; any fallback needs an explicit additional convention. Finite training likelihood also requires
  the observed target in the support, as occurs when its own stored input is retrieved.
- Repeated output configurations across buckets must be deduplicated. Counting occurrences instead changes
  the base weighting and therefore the distribution and gradients. The n+1 lookup count does not bound
  the number of retrieved outputs or make their scoring cost constant.
- The input code uses a rectangular spectral-hashing approximation; retrieval can omit useful outputs,
  and coverage assumptions suit limited output variability. A larger Hamming ball is a separate cost/coverage
  choice. No universal prediction quality, convergence or author-code behavior is certified.
