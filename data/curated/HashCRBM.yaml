claims:
- claim_id: method
  kind: mechanism
  statement: 'From paired training examples (u,v), learn spectral binary codes for the inputs u and store
    their associated output vectors v under the code keys. For a query input, the paper retrieves its
    code bucket and every bucket at Hamming distance one: n+1 bucket accesses for an n-bit code. Union
    the returned output configurations and remove duplicates to obtain V(u). For nonempty V(u), define
    p(v|u)=1[v in V(u)] exp(-F(v,u))/sum_(z in V(u)) exp(-F(z,u)), where F is the conditional RBM free
    energy after summing its hidden units. Fit the conditional energy parameters by exact gradients of
    this restricted-model negative log likelihood; for a training target in V(u), the gradient is grad
    F(v,u) minus the restricted-model expectation of grad F(z,u). The hash map and support are fixed during
    this differentiation. Joint-mode prediction selects the lowest-free-energy retrieved configuration.
    Alternatively, compute each output-bit marginal by summing the restricted probabilities and choose
    its mode, which minimizes additive bit-error risk and can produce a vector outside V(u).'
