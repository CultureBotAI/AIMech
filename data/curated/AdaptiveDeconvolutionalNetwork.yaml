aio_mappings:
- target: AIO:DeconvolutionalNetwork
  relation: broad_match
  rationale: The pinned definition covers unsupervised hierarchical image representation through deconvolution.
    This record narrows that family to the 2011 adaptive-switch architecture and original-image layer-training
    objective; it does not duplicate the generic 2010 concept.
- target: AIO:SparseLearning
  relation: related_match
  rationale: Convolutional sparse coding is central to the architecture, while adaptive switches and multilevel
    reconstruction specify more than a fixed linear dictionary-learning formulation. The relationship
    is methodological, without asserting identity.
limitations:
- The fixed-switch linear algebra is conditional; the complete adaptive inference and learning procedure
  is nonlinear and nonconvex. Sparsity alone gives no general uniqueness or exact-recovery guarantee.
- The earlier 2010 architecture already supports multilevel image reconstruction at inference. Its absence
  of interlayer pooling does not imply absence of pooling in downstream classification descriptors.
- The AIO family definition is used for the broad mapping. Its listed PoolingLayer component needs separate
  upstream context assessment because the cited 2010 generative layers omit pooling while the downstream
  classifier pools descriptors; this record does not endorse or change that upstream relation.
- Both complete eight-page primary papers were visually inspected. The 2011 PDF was obtained from a university
  course mirror after direct author-host DNS failures; byte equivalence with the author-hosted PDF is
  unverified. No author code, training or empirical replication.
