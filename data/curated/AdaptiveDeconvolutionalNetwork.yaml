id: AIMech:AdaptiveDeconvolutionalNetwork
name: Adaptive Deconvolutional Network
aliases: []
concept_kind: architecture
definition: An unsupervised hierarchical image-representation architecture that alternates convolutional
  sparse synthesis with spatial and cross-map pooling switches and fits each layer through a reconstruction
  path to the original image.
identity_notes: Compared all 442 pinned AIO and 623 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 3, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 12 AIO and 21 native definitions, with every matched definition
  read. 5 full annotated AIO node/edge/generated contexts and 1 full native records were inspected. Retain
  the named adaptive2011 architecture as a narrower member of the AIO DeconvolutionalNetwork family. Its
  spatial/cross-map switches and original-image layer-training objective distinguish it from the2010 layerwise-trained
  architecture. The latter already performs multilevel image reconstruction at inference, which is not
  asserted novel here. The local concept is not a generic sparse-learning identity, fixed-dictionary basis-pursuit
  optimization, sparse autoencoder, deep belief network or unpooling layer.
definition_evidence:
- source_id: zeiler2011
  locator: Sections 2–2.2, PDF pp. 2–4, Equations 1–8 and Figures 2–3
  relation: supports
claims:
- claim_id: original-image-layer-objective
  kind: mechanism
  statement: Each layer combines original-image squared reconstruction error, weighted by lambda/2, with
    an L1 penalty on its current feature maps. Shared filters and image-specific maps and switches define
    the reconstruction. The 2010 predecessor trains layers against preceding-layer features without interlayer
    pooling, but already uses multilevel image-space reconstruction during inference. The adaptive construction
    therefore differs in its switches and layer-training objective, rather than uniquely introducing all
    multilevel reconstruction.
  evidence:
  - source_id: zeiler2011
    locator: Sections 1.1–2.2, PDF pp. 2–4, Equations 1–4 and Algorithm 1
    relation: supports
  - source_id: zeiler2010
    locator: Sections 3.1–3.3, PDF pp. 3–5, Equations 3 and 10–12
    relation: supports
- claim_id: signed-pooling-and-partial-unpooling
  kind: mechanism
  statement: Pooling selects the largest absolute activation within a neighborhood spanning spatial positions
    and adjacent feature maps, retaining its sign and location. With switches fixed, a binary selection
    matrix P pools and its transpose U inserts pooled values at selected locations with zeros elsewhere.
    Unpooling after pooling discards unselected values; it does not generally recover the original feature
    map. The data-dependent selection is nonlinear even though fixed-switch selection and insertion are
    linear.
  evidence:
  - source_id: zeiler2011
    locator: Section 2, PDF pp. 2–3, Figure 3 and pooling/unpooling definitions; direct signed-projection
      examples
    relation: supports
- claim_id: conditional-reconstruction-and-inference
  kind: mechanism
  statement: For fixed lower-layer filters and switches, reconstruction is the linear chain R_l=F_1 U_s1
    F_2 U_s2 ... F_l. Its transpose propagates image residuals back to the current maps. Inference takes
    a gradient step, applies signed soft thresholding, and updates the current switches by pooling and
    immediate unpooling. Intermediate reconstructed maps receive no additional sparsity penalties in this
    objective. A transpose is an adjoint, not generally an inverse.
  evidence:
  - source_id: zeiler2011
    locator: Sections 2–2.1, PDF pp. 3–4, Equations 4–7, footnote 1 and Algorithm 1; direct adjoint and
      finite-difference checks
    relation: supports
- claim_id: finite-optimization-and-nonuniqueness
  kind: limitation
  statement: 'The reported training alternates finite feature-inference steps with conjugate-gradient
    filter updates and unit-length filter normalization, proceeding layer by layer. Changing switches
    and filters make the complete optimization nonconvex; the finite procedure does not certify a global
    optimum or exact classical ISTA convergence. The source statement that the sparsity regularizer ensures
    a unique overcomplete representation needs additional assumptions: duplicate unit dictionary atoms
    yield different equally optimal coefficient splits even with the squared-error plus L1 objective.'
  evidence:
  - source_id: zeiler2011
    locator: Section 2, PDF p. 2, uniqueness statement; Sections 2.1–2.2, p. 4, Algorithm 1; direct duplicate-atom
      counterexample
    relation: supports
- claim_id: classification-and-evaluation-boundaries
  kind: scope
  statement: The learned representation is combined with a separately trained spatial-pyramid classifier.
    High-layer activations are projected separately into first-layer maps because their switch-dependent
    bases differ across images, and their spatial pyramids are aggregated. Caltech-101/256 experiments
    and transfer trials concern configured four-layer models and this classifier. Qualitative reconstructions
    do not establish unique object-part semantics, exact recovery or general disentanglement. Finite accuracy
    and historical CPU/GPU timing observations do not establish universal improvement or current speed;
    inference-time regularization settings also differ from training settings.
  evidence:
  - source_id: zeiler2011
    locator: Sections 3–4.6, PDF pp. 4–8, Tables 1–3, Figures 4–7 and footnotes 5–6
    relation: supports
