name: Stochastic depth
definition: A residual-network training procedure that randomly bypasses residual transformations during
  training and uses all residual transformations with survival-probability scaling during inference.
concept_kind: algorithm
identity_notes: This record covers the original 2016 stochastic-depth procedure with a block-survival
  draw per minibatch and test-time residual scaling. It is a training procedure for residual networks,
  not the residual architecture itself. Modern per-example drop-path functions, inverted scaling conventions
  and learned dynamic-depth methods require separate version assessment. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 276 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  5 and 5 lines respectively. Every text hit was a prior candidate lead or a closely related variant lead.
  Nine exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and three native neighboring
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- 'Identity bypass is conditional on the skip path and activation: a post-addition ReLU clips negative
  skip values, and a dimension-changing projection is not the same operation as an identity map. The procedure
  cannot be transferred to an arbitrary incompatible block by merely deleting its output.'
- The survival schedule in the core method varies with network depth, not automatically with elapsed training
  time. The paper’s final-block probability of0.5 is an experimental choice. Mini-batch sampling and inference
  scaling differ from later per-example or inverted-scaled implementations.
- Survival-weighted inference is a practical combination of shared-weight subnetworks, not generally the
  exact expected prediction of the stochastic nonlinear network. Reduced expected active-block count does
  not by itself guarantee a proportional wall-clock saving; computation must actually be bypassed.
- The source’s empirical gradient and benchmark observations do not certify absence of vanishing gradients,
  universal regularization improvement or arbitrarily deep trainability. No author code or trained network
  was executed.
