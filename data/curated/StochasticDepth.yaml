claims:
- claim_id: method
  kind: mechanism
  statement: Assign each residual block a survival probability and, for each training minibatch, sample
    whether to execute its residual transformation. An active block adds its residual output to the skip
    path before the architecture’s output activation; an inactive block bypasses the residual transformation
    while preserving the skip path. The source’s identity reduction relies on its nonnegative activations
    and compatible skip connection. It proposes a linear decrease in survival probability with block depth
    from an always-present input to a chosen last-block probability, while also considering a uniform
    assignment. The expected number of active residual blocks is the sum of their survival probabilities.
    During inference, activate every residual transformation and multiply its output by its training survival
    probability before adding the skip path. The original convention does not divide active training residuals
    by the survival probability.
