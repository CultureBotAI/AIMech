  rationale: No examined AIO target denotes this pivot-based structural centrality estimation procedure.
    Sampling, ranking and possible feature use do not by themselves establish identity with a bias, clustering,
    preprocessing or neural-learning concept.
  examined_targets:
  - target: AIO:Clustering
    rejection_reason: Scores estimate vertex centrality without assigning groups or clusters.
  - target: AIO:UnsupervisedClustering
    rejection_reason: Selecting pivot sources is not an unlabeled-object grouping task.
  - target: AIO:MathematicalFunction
    rejection_reason: This identity is a traversal, source-selection and aggregation procedure, rather
      than solely a mathematical function or activation.
  - target: AIO:DataPreparation
    rejection_reason: The defined objective is estimating structural centrality, not cleaning or organizing
      machine-learning data. Incidental feature use does not establish a mapping.
  - target: AIO:GraphLanguageModel
    rejection_reason: Graph distances and dependencies do not define language modeling.
  - target: AIO:RankingBias
    rejection_reason: Estimating a ranking does not identify the belief that highly ranked information
      is most relevant.
  - target: AIO:SelectionAndSamplingBias
    rejection_reason: Selection effects are a limitation to analyze, not the identity of the estimation
      algorithm; uniform and nonuniform strategies are distinguished.
  - target: AIO:RepresentationBias
    rejection_reason: This is an estimation procedure, not the bias concept concerning nonrepresentative
      subgroups and generalization.
  - target: AIO:DeepActiveLearning
    rejection_reason: Choosing graph traversal sources does not query training labels or fit a deep neural
      network.
limitations:
- The detailed maintained formulation is bounded to connected simple undirected unweighted graphs and
  relative score vectors. Other graph domains, raw-score normalization and implementation conventions
  need separate evidence.
- The inspected source is the August 18, 2006 manuscript associated with the 2007 publication. No claim
  of exact agreement with an unseen journal-layout copy, author implementation or raw experimental data
  is made.
- 'Mixed is unresolved: prose on page 10 names Random, MaxMin and MinSum, whereas Table 1 names MaxMin,
  MaxSum and Random. No one composition is asserted as the tested code.'
- 'The manuscript’s page 7 absolute-tail display lacks the factor needed for a general two-sided iid bound:
  a single equally likely 0/1 variable at deviation 1/2 has event probability one, greater than its printed
  exp(-1/2) bound. This is an elementary curator counterexample to the inspected display, not an audit
  of a later version or author code. No replacement finite-sample guarantee for this procedure is claimed.'
- Table and figure graph sizes and inversion-metric terminology differ in the inspected copy. The discovery
  report preserves both readings rather than inferring an undocumented preprocessing rule.
- Finite exact examples are illustrations, not model training, benchmark replication, empirical confidence
  intervals or proof of unbiasedness for nonlinear normalized outputs. No author software, paid service
  or data upload was used. DRAFT remains after author self-review.
