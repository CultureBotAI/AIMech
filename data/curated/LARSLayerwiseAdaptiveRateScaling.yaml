claims:
- claim_id: c-r594-layerwise-weight-to-gradient-trust-scaling
  kind: mechanism
  statement: Because the ratio ||w^l||_2 / ||nabla L(w^l)||_2 varies by orders of magnitude across layers and between weights and biases (e.g., 5.76 for conv1.w vs 1345 for fc6.w in AlexNet-BN at iteration 1, Table 2), LARS defines a local learning rate lambda^l = eta ||w_t^l||_2 / (||g_t^l||_2 + beta ||w_t^l||_2) (Eqs. 5-6) so that the layer update norm is proportional to ||w_t^l||_2 and independent of gradient magnitude, mitigating both vanishing and exploding layer gradients.
  evidence:
  - source_id: r594-primary-pdf
    locator: Section 4, Table 2, Equations (4)-(6), & Algorithm 1, p. 4
    relation: supports
- claim_id: c-r594-alexnet-and-resnet50-32k-batch-scaling
  kind: application
  statement: Coupled with Batch Normalization and polynomial decay, LARS scales ImageNet training of AlexNet-BN and ResNet-50 to mini-batch sizes up to B = 32K (matching the B = 512/256 baseline accuracies up to B = 8K/16K and within 0.7% on ResNet-50 at B = 32K), whereas standard linear scaling with warmup diverges on AlexNet above B = 2K.
  evidence:
  - source_id: r594-primary-pdf
    locator: Section 3, Table 1, p. 3; Section 5, Tables 3-4 & Figures 3-5, pp. 5-7
    relation: supports
- claim_id: c-r594-extreme-batch-step-count-and-attention-limitation
  kind: limitation
  statement: At B = 32K on AlexNet-BN, fixed-epoch training still loses 2.6% accuracy (57.8% vs 60.2% at 100 epochs) because very large mini-batches perform too few parameter updates when stochastic gradients are already close to true gradients, requiring 200 epochs to recover 59.9% accuracy (Table 5).
  evidence:
  - source_id: r594-primary-pdf
    locator: Section 5, Table 3(b), p. 5; Section 6, Table 5, p. 7
    relation: supports
