id: AIMech:LARSLayerwiseAdaptiveRateScaling
name: LARS (Layer-wise Adaptive Rate Scaling)
concept_kind: algorithm
review_status: DRAFT
definition: A layerwise adaptive large-batch optimization algorithm (Algorithm 1) that assigns each network layer l (weights and biases separately) a local learning rate lambda^l = eta * ||w_t^l||_2 / (||g_t^l||_2 + beta ||w_t^l||_2) proportional to the ratio of the l2 norm of the layer's parameters ||w_t^l||_2 to the l2 norm of its stochastic gradient ||g_t^l||_2 plus weight-decay term beta ||w_t^l||_2, scaled by a layerwise trust coefficient eta < 1 and combined with global learning rate gamma_t and heavy-ball momentum v_{t+1}^l = m v_t^l + gamma_{t+1} lambda^l (g_t^l + beta w_t^l).
identity_notes: Distinct from coordinatewise adaptive optimizers such as Adam, RMSProp, and AdaGrad in that LARS computes a single scalar learning rate lambda^l per layer rather than per weight and scales the update magnitude proportionally to the layer's weight norm ||w_t^l||_2. Distinct from LAMB in that LARS normalizes raw or momentum gradients by their layerwise l2 norm without coordinatewise second-moment preconditioning 1 / sqrt(v_hat_t).
aliases:
- LARS Optimizer
- Layer-wise Adaptive Learning Rate Scaling
- SGD with LARS
