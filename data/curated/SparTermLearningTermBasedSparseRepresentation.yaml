claims:
- claim_id: sparterm-mlm-initialized-relu-summed-importance-predictor
  kind: mechanism
  statement: SparTerm's importance predictor F(p) encodes each token w_i of passage p with BERT into contextualized hidden state h_i, projects h_i to a vocabulary-sized logit vector I_i = Transform(h_i) E^T + b in R^v using a GELU + LayerNorm linear transformation and shared word embedding matrix E initialized from BERT's pre-trained MLM head (Equation 2), and sums non-negative activations across all L passage tokens via I = sum_{i=0}^L ReLU(I_i) (Equation 3).
  evidence:
  - source_id: r782-primary-pdf
    locator: Section 3.2, Figure 2b & Equations 2-3, p. 3
    relation: supports
  - source_id: r782-primary-pdf
    locator: importance_predictor() and sparterm_representation() verification
    relation: supports
- claim_id: sparterm-orthogonal-binary-gating-controller-and-weighted-bce-training
  kind: mechanism
  statement: To enforce sparsity (||G(p)|| < lambda, G(p) in {0, 1}^v) while preserving natural-language input to BERT, SparTerm's gating controller operates in either literal-only mode G(p) = BoW(p) or expansion-enhanced mode G_{le} = G_e + BoW(p) where G_e = Binarizer(G) odot (~BoW(p)) (with binarization threshold 0.7, Equations 4-6 & Section 4.2), pre-training the gating distribution G via asymmetric binary cross-entropy loss L_exp = -lambda_1 sum_{T_j=0} log(1 - G_j) - lambda_2 sum_{T_k=1} log(G_k) (lambda_1 = 1e-3, lambda_2 = 1.0, Equation 8) before end-to-end ranking optimization with L_rank (Equations 7 & 9).
  evidence:
  - source_id: r782-primary-pdf
    locator: Sections 3.3-3.4 & 4.2, Figure 2c & Equations 4-9, pp. 3-5
    relation: supports
  - source_id: r782-primary-pdf
    locator: expansion_enhanced_gating(), expansion_bce_loss(), and ranking_nll_loss()
    relation: supports
- claim_id: sparterm-msmarco-passage-and-document-full-ranking-application
  kind: application
  statement: "On MS MARCO Passage full ranking, SparTerm (expansion-enhanced) achieves 27.94 Dev MRR@10 and 92.45% Recall@1000\u2014outperforming BM25 (18.6 / 85.71%), DeepCT (24.3 / 91.0%), Doc2query (21.5 / 89.1%), and Doc2query-T5 on MRR@10 (27.7, Table 2)\u2014while on MS MARCO Document ranking with PassageRetrievalMax it reaches 29.0 MRR@10, surpassing BM25 (24.5) and HDCT(decay) (28.7, Table 3)."
  evidence:
  - source_id: r782-primary-pdf
    locator: Sections 5.1-5.2, Tables 2-3, pp. 5-6
    relation: supports
- claim_id: sparterm-non-differentiable-binarizer-frozen-gate-limitation
  kind: limitation
  statement: Because the step-function Binarizer(G) in Equation 4 is non-differentiable and the Gating Controller uses an independent 110M-parameter BERT_base network that does not share weights with the Importance Predictor, the Gating Controller must be pre-trained separately for 50k steps and then frozen during the subsequent 100k ranking fine-tuning steps (Section 4.2).
  evidence:
  - source_id: r782-primary-pdf
    locator: Section 4.2 (Implementation), p. 5
    relation: supports
