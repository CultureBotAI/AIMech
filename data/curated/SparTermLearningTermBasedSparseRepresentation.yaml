id: AIMech:SparTermLearningTermBasedSparseRepresentation
name: SparTerm Learning Term-Based Sparse Representation for Fast Text Retrieval
concept_kind: architecture
review_status: DRAFT
definition: A term-based sparse retrieval representation framework that maps an input text p into a vocabulary-sized sparse vector p' = F(p) odot G(p) in R^v by taking the element-wise product of (1) a dense semantic importance predictor F(p) = sum_{i=0}^L ReLU(Transform(h_i) E^T + b) initialized from a pre-trained Masked Language Model (MLM) head and summed over token positions, and (2) a sparse binary gating controller G(p) in {0, 1}^v that activates either literal bag-of-words terms only (G(p) = BoW(p)) or literal terms plus non-overlapping threshold-binarized expansion terms (G_{le} = (Binarizer(G) odot ~BoW(p)) + BoW(p)).
identity_notes: Distinct from SPLADE (AIMech:SPLADESparseLexicalAndExpansionModel), which eliminates the separate binary gating network G(p) and achieves sparsity by applying log(1 + ReLU(.)) to MLM logits under differentiable FLOPS regularization; and distinct from EPIC (AIMech:EPICExpansionViaPredictionOfImportanceWithContextualization), which produces dense |V|-dimensional document vectors scaled by softplus token weights and a sigmoid [CLS] quality gate without binary gating or inverted-index full-ranking execution.
aliases:
