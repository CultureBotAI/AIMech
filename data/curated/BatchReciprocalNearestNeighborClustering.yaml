claims:
- claim_id: reciprocal-batch-passes
  kind: mechanism
  statement: For each current cluster, find the set of other clusters attaining its minimum dissimilarity.
    A pair is reciprocal when each belongs to the other’s nearest-neighbor set, equivalently its pair
    distance attains both minima. The method alternates finding reciprocal pairs, merging a batch, and
    recomputing nearest-neighbor information until a single cluster remains. Simultaneous disjoint pair
    merges are a logical batch, not a claim of parallel hardware execution.
  evidence:
  - source_id: derham1980
    locator: Introduction and Sections2.3,3.2, printedpp135,137,140 / PDFpp2,4,7
    relation: supports
- claim_id: matrix-distance-updates
  kind: mechanism
  statement: The stored-distance realization updates dissimilarities between the new clusters and remaining
    clusters. When both endpoints represent newly merged pairs, the paper extends the usual two-cluster
    recurrence to four original clusters; the linkage coefficients and cluster weights determine that
    update. This separates the merge-search procedure from the selected linkage criterion.
  evidence:
  - source_id: derham1980
    locator: Sections2.1,3.1–3.3, printedpp136,139–140 / PDFpp3,6–7
    relation: supports
- claim_id: vector-realization
  kind: mechanism
  statement: For the cited centroid and variance strategies, a second realization retains the observation
    coordinates, merged representative coordinates and cluster weights and recomputes distances from them.
    It avoids retaining the full pairwise-distance matrix. The reported N(K+5) storage formula is accounting
    for that specific implementation with N observations and K variables, not a universal memory bound
    for every reciprocal-neighbor method.
  evidence:
  - source_id: derham1980
    locator: Sections4.1–4.2 and5, printedpp141–143 / PDFpp8–10
    relation: supports
- claim_id: criterion-and-tie-scope
  kind: scope
  statement: The source presents exact hierarchical construction for the named monotone single-link, diameter,
    average and variance strategies, while explicitly treating nonmonotone centroid strategies as heuristic.
    This does not establish correctness for arbitrary history-dependent recurrences. With ties, reciprocal
    pairs can overlap; a disjoint selection convention is needed to make a batch executable, and the printed
    merge-all-pairs instruction does not specify one.
  evidence:
  - source_id: derham1980
    locator: Introduction, Sections2.1,2.3,3.2 and4.1, printedpp135–137,140–141 / PDFpp2–4,7–8
    relation: supports
  - source_id: mullner2011
    locator: 'Section3.2, Theorem1 and footnote1, PDFpp12–16: limits of general reciprocal-pair arguments'
    relation: supports
- claim_id: passes-and-output-boundaries
  kind: limitation
  statement: 'A pass need not merge many pairs: the batch procedure can find only one reciprocal pair
    and therefore require repeated global scans. Few passes in examples do not imply the later nearest-neighbor-chain
    algorithm’s quadratic bound. Merge heights within a batch need not be globally ordered; constructing
    a stepwise sequence requires attention to linkage conditions, chronological dependencies and tie handling.'
  evidence:
  - source_id: benzecri1982
    locator: Section1, printedpp209–210 / PDFpp2–3
    relation: supports
  - source_id: derham1980
    locator: Section3.3, printedp140 / PDFp7
    relation: supports
  - source_id: mullner2011
    locator: Sections2.2 and3.2, PDFpp4–5,11–16
    relation: supports
- claim_id: historical-evaluation-scope
  kind: performance
  statement: The reported comparison uses three constructed hierarchies with 32, 64 and 128 observations
    and two variables on a CDC6500, with time in milliseconds and storage in words. BASE and DIST timings
    average seven strategies, while DONN averages only the three coordinate-compatible strategies. These
    differing workloads and small synthetic examples do not establish a universal speedup or a modern
    hardware ranking.
  evidence:
  - source_id: derham1980
    locator: Section5 and comparison table, printedp143 / PDFp10
    relation: supports
  evaluation:
    task: Historical hierarchical-clustering timing and memory comparison.
    dataset_and_split: Three constructed two-variable hierarchies with32,64 and128 observations; no train/test
      split.
    model_and_version: deRham1980 BASE,DIST and DONN implementations as described in Section5; no author
      code executed.
    metric_and_units: CPU time in milliseconds and storage in machine words.
    result: The source reports comparison tables for these three constructed inputs; this record draws
      no universal speedup or contemporary ranking from them.
    baseline: BASE conventional implementation compared with DIST stored-distance and DONN coordinate
      implementations.
    conditions: CDC6500. BASE/DIST average seven strategies; DONN averages only three coordinate-compatible
      strategies.
    uncertainty: Different strategy workloads and small synthetic inputs limit comparability. No historical
      hardware run, timing replication or uncertainty estimate was produced by the curator.
