limitations:
- Section2.3 gives the correct mutual-membership definition, but its displayed M shortcuts include a self-membership
  expression and equate equality of nearest-distance minima with reciprocity. The supported definition
  requires the pair distance to attain both minima; equal minima alone are insufficient.
- The finite curator implementation makes tied batches executable through an explicit lexicographic disjoint
  matching. This is a curator extension, not a tie rule attributed to the source or a claim of identical
  trees under arbitrary ties.
- Curator checks cover2,880 four-object cases with distinct initial distances and2,916 cases allowing
  ties across four linkages. Later merges may introduce ties even in the first set. Stable height ordering
  is checked against greedy merge admissibility; this is finite evidence, not a universal proof.
- The original six-point variance example is checked using exact ESS increments:125,212.5,250,1381.25
  and19225/12. The source rounds displayed values, including212.5 to213; the rounded tables are not exact
  recurrence identities.
- This record does not conflate the batch scan, a reusable reciprocal chain, or cached-bound selection
  of a globally closest pair. None implies a globally optimal fixed-count partition or automatic selection
  of a unique cluster count.
- Complete cited primary PDFs were visually inspected. No author software, CDC benchmark, modern implementation
  or floating-point behavior was executed; only finite curator calculations were run.
