id: AIMech:BatchReciprocalNearestNeighborClustering
name: Batch reciprocal-nearest-neighbor agglomeration
aliases:
- Reciprocal-neighbor batch clustering
- de Rham reciprocal-neighbor clustering
concept_kind: algorithm
definition: An agglomerative clustering procedure that alternates finding reciprocal nearest-neighbor
  pairs across the current clusters with merging a batch of such pairs and updating cluster dissimilarities,
  rather than choosing one globally closest pair or extending a reusable nearest-neighbor chain.
identity_notes: Compared all 442 pinned AIO and 653 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 57, 0, 0 lines. All distinct match contents were
  read, including generated index rows repeating the fully read corrected nearest-neighbor-chain record.
  Recovery hits concern shared primary-source references, chain implementation context or pending batch-procedure
  discovery notes; none identifies an existing standalone batch record. Both other checkouts returned
  no matches including ignored and hidden files. Semantic matching covered 26 AIO and 170 native definitions,
  all read; unchanged definitions were byte-compared with the preceding full assessment. 9 full annotated
  AIO node/edge/generated contexts and 4 full native records were inspected. Retain the two-phase batch
  reciprocal-pair search from deRham1980. It differs from a linkage criterion, a reusable nearest-neighbor
  chain, globally certified cached-bound selection and nearest-neighbor label voting. The later RS pruning/representative
  method has a different procedure and remains a separate lead.
