claims:
- claim_id: method
  kind: mechanism
  statement: Select a layer k from an eligible set S, which may include the input layer. Forward a minibatch
    and its randomly shuffled copy to layer k. Draw lambda from Beta(a,a), a>0, and mix both the paired
    layer representations and the paired one-hot targets using lambda and 1−lambda. Continue the forward
    pass from the mixed representation and compute the prediction loss against the mixed soft target.
    Backpropagate through the whole graph, including the network before the mixing layer, so the representations
    themselves can adapt. The reported implementation choice uses one layer and one coefficient per minibatch.
    With only the input layer eligible, S={0}, the objective reduces to original input MixUp; allowing
    hidden layers is the distinguishing extension. The objective averages over examples, mixing coefficients
    and eligible layers.
