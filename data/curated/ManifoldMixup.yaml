name: Manifold Mixup
definition: A neural-network training procedure that interpolates paired examples’ representations at
  a selected network layer and interpolates their labels with the same coefficient, then trains the entire
  network on the mixed representation-target pairs.
concept_kind: algorithm
identity_notes: This is the end-to-end hidden-representation extension of input MixUp, not an alias for
  MixUp’s input-only case, interpolation of fixed extracted features, or a separate trained model. It
  uses observed labels, rather than ICT’s mixed teacher predictions on unlabeled inputs. Its name does
  not guarantee that interpolated representations lie on a true data manifold. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 238 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 34 lines in each from prior discovery, saved reviews and related native records. Ten exact
  AIO CLASS nodes, their scoped synonyms and outgoing edges, plus five neighboring native mechanisms were
  inspected. This absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- Representations being mixed must be compatible at the selected layer. The eligible layers and mixing
  distribution remain choices.
- The source’s flattening theorem is framed under idealized function-class, dimensionality and minimization
  conditions; it does not guarantee the same geometry for every finite trained network.
- Interpolated labels impose an inductive bias and need not equal the true conditional targets between
  examples.
- The paper explicitly distinguishes single-step adversarial results from full adversarial robustness.
  No empirical robustness or accuracy claim is imported.
