limitations:
- Diff-Gauss pooling here denotes the Swietojanski–Renals activation-value unit, not spatial Gaussian
  pooling, Gaussian rasterization, a complete acoustic DNN, or the speaker-adaptation algorithm that changes
  its parameters.
- The positive-precision sharp limit is nearest-value selection. Bounded output does not imply monotonicity
  in every input. Input-dependent weights generally make aggregation nonlinear even with fixed learned
  parameters; zero precision gives a linear arithmetic mean.
- Constructed derivatives and counterexamples assess the stated mathematical rule, not author software
  or numerical stability. No implementation, training or benchmark replication was performed.
- The complete eleven-page arXiv1603.09630v2 paper was visually inspected. Other paper versions and the
  author thesis were search context only.
