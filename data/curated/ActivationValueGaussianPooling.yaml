id: AIMech:ActivationValueGaussianPooling
name: Activation-Value Gaussian Pooling
aliases:
- Diff-Gauss pooling
concept_kind: mathematical_method
definition: A parameterized neural pooling unit that averages a group of transformed activations using
  normalized Gaussian-kernel weights determined by each activation’s distance from a learned pool mean.
identity_notes: Compared all 442 pinned AIO and 625 native IDs, names, aliases and scoped synonyms; no
  normalized identity match. Ignored- and hidden-inclusive fixed-string searches of the recovery, older
  discovery and original Documents checkouts returned 9, 0, 0 lines. All distinct match contents were
  inspected. Semantic matching covered 32 AIO and 55 native definitions, with every matched definition
  read. 4 full annotated AIO node/edge/generated contexts and 3 full native records were inspected. Retain
  the source’s activation-value Gaussian pooling unit, with Diff-Gauss pooling scoped to that unit. It
  differs from the2012spatial Gaussian pooling/unpooling component, stochastic spatial selection, learned
  absolute-power units and the speaker-adaptation procedure. Similar names used for Gaussian rasterization
  are not aliases. This is a scalar parameterized mathematical computation over a group, not the entire
  acoustic network.
definition_evidence:
- source_id: swietojanski2016
  locator: Section III-B, PDF p. 3, Equations 5–8 and Figure 1
  relation: supports
claims:
- claim_id: value-dependent-kernel-aggregation
  kind: mechanism
  statement: The demonstrated unit forms z_i=eta*tanh(w_i^T*x+b_i), assigns u_i proportional to exp[-beta*(z_i-mu)^2/2]
    within the group, and outputs sum_i u_i*z_i. The pool has its own mean, precision and shared amplitude.
    For finite real values the normalized weights are positive and sum to one, so the output lies in the
    input-value convex hull. These kernels compare activation values with a mean, not spatial coordinates,
    and use probability normalization rather than the square-root normalization of spatial Gaussian unpooling.
  evidence:
  - source_id: swietojanski2016
    locator: Section III-B, PDF p. 3, Equations 5–8
    relation: supports
- claim_id: precision-limits-and-nonlinearity
  kind: limitation
  statement: Zero precision gives the ordinary arithmetic mean. As positive precision tends to infinity
    with a fixed mean, weight concentrates on activation values nearest that mean, which need not be the
    largest values. Equal-distance ties retain their equal limiting weights. The source’s unconditional
    maximum-limit wording therefore needs qualification. Because the weights depend on input values, the
    pooling operation is generally nonlinear even if its preceding tanh transformation is removed; treating
    the weighted average as a fixed linear combination would miss that dependence.
  evidence:
  - source_id: swietojanski2016
    locator: Section III-B, PDF p. 3, discussion following Equations 5 and 8; direct sharp-limit and scaling
      counterexamples
    relation: supports
- claim_id: coupled-input-and-parameter-gradients
  kind: mechanism
  statement: Backpropagation differentiates both the explicit weighted values and their input-dependent
    weights. Writing f=sum_i u_i*z_i gives df/dz_j=u_j*[1-beta*(z_j-mu)*(z_j-f)]. Also df/dmu=beta*Var_u(z),
    and df/dbeta=-Cov_u(z,(z-mu)^2)/2. The input derivative can be negative even though the output is
    a positive-weight average. These identities hold for the finite normalized kernel rule and do not
    specify numerical underflow handling in an implementation.
  evidence:
  - source_id: swietojanski2016
    locator: Section IV-B, PDF p. 4, Equations 12–21; direct algebra and finite-difference checks
    relation: supports
- claim_id: amplitude-and-adaptation-boundaries
  kind: mechanism
  statement: Scaling eta changes the values entering the Gaussian kernel and can therefore change the
    normalized weights as well as the output amplitude. It is not generally identical to multiplying the
    final pooled value by a hidden-unit contribution factor. The source compares speaker-dependent updates
    to means, precisions and amplitudes, alongside optional post-pooling contribution scaling. A pooling
    unit and a procedure that adapts its parameters are separate concepts.
  evidence:
  - source_id: swietojanski2016
    locator: Sections III-B and V, PDF pp. 3–5; Section VII-B, pp. 6–8, Table IV and Figure 1; direct
      inside-versus-after-pooling scaling example
    relation: supports
- claim_id: finite-acoustic-evaluation-scope
  kind: scope
  statement: The unit is evaluated within supervised speaker-independent DNN/HMM acoustic models and subsequent
    adaptation on TED, AMI and Switchboard. The reported Gaussian configuration uses groups of three activations
    and 1,175 pooled units per hidden layer, with corpus-specific input features and decoding pipelines.
    Word-error rates and historical GPU training times concern those configured systems; they do not establish
    universal superiority, negligible cost or a guarantee that adapting the pooling parameters improves
    unseen speech. The paper’s normal precision initialization and gradient updates do not document a
    general positivity constraint or every numerical edge-case safeguard.
  evidence:
  - source_id: swietojanski2016
    locator: Sections VI–VII, PDF pp. 5–9, Tables I–VII and Gaussian initialization paragraph on p. 6
    relation: supports
