id: AIMech:Sparsegen
name: Sparsegen
definition: >-
  A parameterized probability mapping that minimizes squared distance from
  a transformed score vector g(z), minus lambda times the squared output
  norm, over the probability simplex, for lambda less than one.
concept_kind: mathematical_method
identity_notes: >-
  The general probability-mapping family of the 2018 primary paper, not a
  trained model. Sparsegen-lin and sparsehourglass are specialized members,
  not aliases for the whole family. Identity search and mapping context are
  retained in the discovery ledger.
definition_evidence:
  - source_id: laha-2018
    locator: Section 3, printed/PDF page 3, equation (1)
    relation: supports
claims:
  - claim_id: scaled-projection
    kind: mechanism
    statement: >-
      The mapping equals sparsemax applied to g(z)/(1-lambda). Choosing
      g(z)=z and lambda=0 recovers sparsemax; the general family is not
      identical to that special case.
    evidence:
      - source_id: laha-2018
        locator: Section 3, page 3, equation (2); Section 3.1, page 4, Example 3
        relation: supports
  - claim_id: parameter-scope
    kind: limitation
    statement: >-
      Output sparsity depends on the transformation, parameter and input;
      a zero-valued output coordinate is not guaranteed for every input.
    evidence:
      - source_id: laha-2018
        locator: Sections 3 and 3.2, pages 3-4, Figure 2 sparse and non-sparse regions
        relation: supports
evidence_sources:
  - source_id: laha-2018
    title: On Controllable Sparse Alternatives to Softmax
