claims:
- claim_id: token-time-generation
  kind: mechanism
  statement: 'The fitted construction gives each document a Dirichlet topic mixture, each topic a corpus-shared
    categorical word vector, and each topic a Beta timestamp density on a normalized bounded interval.
    A token draws a topic, a word and a timestamp; fitting copies the document timestamp to every token.
    Word distributions remain fixed across time, while topic-specific time densities influence assignment.
    The alternative description generates one timestamp from a document-mixture-weighted combination of
    topic densities. These are different generative laws: repeating topic-time factors, even with inverse-length
    weighting, is not generally identical to one mixture density for a document timestamp.'
  evidence:
  - source_id: method-source
    locator: Section 2, PDF pp.2-4, Figure 1(b,c), generative steps and alternative description
    relation: supports
- claim_id: time-weighted-inference
  kind: mechanism
  statement: With topic timestamp parameters fixed, the collapsed token assignment weight combines leave-one-out
    document-topic and topic-word predictive factors with the assigned topic's timestamp density. The
    paper introduces an exponent to balance time and word contributions and updates Beta parameters from
    empirical moments. These adaptations change the fitting objective and require positive valid shapes
    and safeguards for empty topics or zero variance. The printed density uses (1-t)^(psi1-1)*t^(psi2-1),
    whereas its moment estimates assign psi1=mean*c and psi2=(1-mean)*c. A coherent calculation must use
    one consistent shape convention; for the conventional Beta(a,b), the density is proportional to t^(a-1)*(1-t)^(b-1).
    No behavior of uninspected historical software is inferred from this notation conflict.
  evidence:
  - source_id: method-source
    locator: Section 2, PDF pp.3-4, conditional and Algorithm 1; Appendix A p.10, density and moment estimates
    relation: supports
