name: Topics over Time model
definition: A topic-model family combining fixed topic-word distributions with topic-specific continuous
  timestamp densities, so that words and their observed times jointly inform document topic assignments.
concept_kind: model_family
identity_notes: Scoped to Wang and McCallum's KDD2006 Topics over Time model, especially its fitted token-level
  timestamp construction with Beta densities over normalized time. The paper also proposes a distinct
  single-document-timestamp view. Fixed topic-word distributions distinguish TOT from dynamic topic models
  with evolving word probabilities; continuous observed time does not imply a Markov process or point-process
  intensity. TOT is a source acronym within this scope. No normalized candidate identity matched all 442
  pinned AIO IDs, labels and scoped synonyms or 432 preceding native IDs, names and aliases. Full-checkout
  searches included ignored and hidden files in both checkouts; six matching lines per checkout came from
  three unique file contents containing prior frontier leads, bibliography context and a cached publication-list
  mention. All candidate-matching excerpts were read; the long cached browser transcript was not reread
  in full. All 205 semantic label/synonym hits were byte-verified unchanged from prior reading. Eighteen
  annotated AIO CLASS nodes and outgoing edges comprise 17 verified prior inspections and one fresh reading.
  Twenty-seven contextual YAMLs comprise 25 unchanged prior readings, one fresh generated AIO reading
  and one final round102 native record verified against its fully read review inputs. No candidate record
  is present within this bounded pinned-snapshot and maintained-corpus search.
limitations:
- A repeated timestamp provides one density factor per token unless explicitly reweighted. Its restriction
  to one common timestamp is not automatically a normalized single-time document density. The proposed
  balancing exponent does not prove equivalence between the two generative descriptions.
- Bayes inversion can produce a token-topic probability given time using an assumed or estimated topic
  prior. This is not generally the same quantity as the posterior mean of a random document topic vector,
  despite notation on p.4. Continuous density values are not probabilities; endpoint handling, normalization
  range and balancing conventions matter.
- One Beta per topic limits temporal shapes. Extending the bounded time range for prediction is a modeling
  choice rather than a guarantee of future extrapolation. Fixed word distributions do not directly model
  changing word meanings, and topic split/merge interpretations are descriptive.
- Historical evaluations use selected address, email and NIPS collections with heuristic preprocessing
  and particular finite samples. Topic names, KL distinctness, thresholded co-occurrence and decade prediction
  do not establish causal trends, universal semantic accuracy or future forecasting. No author code or
  benchmark was executed.
