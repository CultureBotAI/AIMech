id: AIMech:DistilBERTKnowledgeDistillationDuringPretraining
name: 'DistilBERT: Knowledge Distillation During Pre-training'
concept_kind: learning_paradigm
review_status: DRAFT
definition: 'A task-agnostic Transformer knowledge distillation paradigm that compresses a pre-trained bidirectional encoder during the pre-training phase by initializing a student of identical hidden width and half the layer count from every other teacher layer, removing token-type embeddings and the output pooler, and optimizing a linear combination of three objectives over large-batch dynamic-masked pre-training corpora: temperature-scaled soft-target distillation cross-entropy L_ce = sum_i t_i * log(s_i) with p_i = exp(z_i/T)/sum_j exp(z_j/T), masked language modeling loss L_mlm, and hidden-state direction-alignment cosine embedding loss L_cos.'
identity_notes: Introduced by Sanh, Debut, Chaumond, and Wolf (NeurIPS 2019 Workshop on Energy Efficient Machine Learning and Cognitive Computing, EMC^2, arXiv:1910.01108). Distinct from task-specific fine-tuning distillation methods such as BERT-PKD (Round 802, which distills normalized intermediate patience representations during downstream fine-tuning), from TinyBERT (Round 800, which enforces MSE on layer-wise attention matrices and projected hidden states across both pre-training and data-augmented fine-tuning), and from MiniLM (Round 801, which transfers only the last layer's query-key attention and value-relation distributions without intermediate layer initialization or cosine hidden-state loss). DistilBERT retains identical hidden dimension d between teacher and student so that every other teacher layer directly initializes a corresponding student layer without linear projection matrices.
aliases:
- DistilBERT
- DistilBERT Triple-Loss Pre-training Distillation
- Triple-Loss Pre-training Transformer Distillation
