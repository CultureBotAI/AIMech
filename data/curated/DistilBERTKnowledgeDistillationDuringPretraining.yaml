claims:
- claim_id: r803-claim-triple-loss-formulation
  kind: mechanism
  statement: DistilBERT trains the student language model during pre-training using a triple loss that linearly combines soft-target distillation loss L_ce = sum_i t_i * log(s_i) over temperature-scaled vocabulary probabilities p_i = exp(z_i/T) / sum_j exp(z_j/T), the standard masked language modeling cross-entropy L_mlm, and a cosine embedding loss L_cos that aligns the directions of the student and teacher hidden state vectors.
  evidence:
  - source_id: r803-primary-pdf
    locator: Section 2 (Knowledge distillation) & Section 3 (Student initialization), Pages 2-3, plus Table 4 ablation, Page 4
    relation: supports
  - source_id: r803-primary-pdf
    locator: distillation_ce and cosine_embedding_loss verification in main()
    relation: supports
- claim_id: r803-claim-architecture-and-alternating-init
  kind: mechanism
  statement: Because reducing the last dimension of Transformer tensors has a smaller impact on modern linear-algebra computation efficiency than reducing the number of layers, DistilBERT preserves the teacher's hidden dimension while halving the number of layers, removes token-type embeddings and the pooler, and initializes the 6-layer student by taking one layer out of every two from the 12-layer teacher.
  evidence:
  - source_id: r803-primary-pdf
    locator: 'Section 3 (DistilBERT: a distilled version of BERT), Page 2, and Table 4 ablation (-3.69 GLUE macro-score without teacher initialization), Page 4'
    relation: supports
  - source_id: r803-primary-pdf
    locator: Parameter accounting for 12-layer BERT-base (109.5M) vs 6-layer DistilBERT (66.4M, ~40% reduction) in main()
    relation: supports
- claim_id: r803-claim-glue-and-squad-efficiency
  kind: application
  statement: Pre-trained with dynamic masking and large batches (up to 4000 examples per batch) on English Wikipedia and Toronto BookCorpus, DistilBERT reduces BERT-base parameter count by 40% (66M vs. 110M) and speeds up CPU inference by 60% (and mobile on-device inference by 71%) while retaining 97% of BERT-base performance on the GLUE benchmark (77.0 vs. 79.5 macro-score) and achieving 85.8 F1 on SQuAD v1.1 (86.9 F1 when combined with task-specific fine-tuning distillation from a BERT-base teacher).
  evidence:
  - source_id: r803-primary-pdf
    locator: Section 4 (Experiments), Tables 1-3, Pages 2-4
    relation: supports
- claim_id: r803-claim-fixed-width-and-token-type-limitation
  kind: limitation
  statement: Because DistilBERT relies on direct layer-taking initialization from the teacher and removes token-type (segment) embeddings, the student must maintain the exact same hidden dimension as the teacher (preventing arbitrary hidden-width reduction without projection layers) and cannot use explicit segment-ID embeddings to distinguish sentence pairs.
  evidence:
  - source_id: r803-primary-pdf
    locator: Section 3 (Student architecture & initialization), Page 2
    relation: supports
