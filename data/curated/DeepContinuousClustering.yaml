aio_mappings:
- target: AIO:UnsupervisedClustering
  relation: related_match
  rationale: DCC learns groups from unlabeled observations. The AIO target is the task, while this local
    record specifies the joint representation-and-clustering algorithm; no equivalence or subclass assertion
    is made.
- target: AIO:DimensionalityReduction
  relation: related_match
  rationale: Learning a lower-dimensional nonlinear representation is an explicit jointly optimized part
    of DCC. The AIO target describes that task, not this particular algorithm or an assertion that its
    learned representation always preserves semantics.
limitations:
- The nonconvex network and robust objective provide no general global-optimum or semantic-cluster-recovery
  guarantee. Graph, architecture, initialization, continuation and extraction choices affect results.
- Not requiring K does not establish correct recovery of the true cluster count. Reconstruction discourages
  some representation distortions without certifying semantic fidelity.
- Printed equations, continuation, threshold-graph scope and stopping rules differ from the pinned implementation.
  Static differences and standalone scalar checks are not end-to-end execution results.
- All 11 versioned primary pages and the complete cited files were read. Other source revisions, graph-building
  code, complete architecture/feature-extraction code, datasets and checkpoints were not audited or executed.
- No model fitting, author-code execution, empirical replication or formal convergence certification was
  performed. The record remains DRAFT.
