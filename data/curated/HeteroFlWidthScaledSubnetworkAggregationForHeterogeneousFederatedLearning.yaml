claims:
- claim_id: r447-nested-submatrix-partitioned-aggregation-mechanism
  kind: mechanism
  statement: By nesting local weight matrices W_l^P subset W_l^{P-1} subset ... subset W_l^1 = W_g at the top-left corner and averaging each disjoint difference set W_g^{p-1, t+1} \ W_g^{p, t+1} only over the m - m_{t+1}^{(p)} clients with complexity index p_i <= p - 1 (Equations 2-4), HeteroFL enables smallest submodels (W_g^P) to benefit from all m clients while higher-capacity outer blocks are updated without zero-padding bias.
  evidence:
  - source_id: r447-primary-pdf
    locator: Section 3.1 Heterogeneous Models (Equations 1-4, Figure 1), pp. 3-5
    relation: supports
- claim_id: r447-static-batch-norm-scaler-and-masked-cross-entropy-mechanism
  kind: mechanism
  statement: To prevent activation magnitude shift across width levels r^{p-1} and running-statistic divergence across non-IID submodels, HeteroFL introduces a parameter-free Scaler module multiplying activations by 1/r^{p-1}, replaces running-moment Batch Normalization during training with Static Batch Normalization (sBN) followed by post-training local moment recalculation, and applies Masked Cross-Entropy on the output layer under non-IID labels (Sections 3.2-3.4).
  evidence:
  - source_id: r447-primary-pdf
    locator: Section 3.2 Static Batch Normalization, Section 3.3 Scaler & Section 3.4 Masked Cross-Entropy, pp. 4-6
    relation: supports
- claim_id: r447-fixed-per-round-width-assignment-and-high-tier-sample-scarcity-limitation
  kind: limitation
  statement: Because each client trains only its fixed assigned width p_i during a round without random prefix dropout across smaller widths, high-capacity parameter blocks W_g^1 \ W_g^2 receive updates only from the highest-tier clients and are not explicitly regularized to preserve submodel accuracy when evaluated at smaller prefix widths.
  evidence:
  - source_id: r447-primary-pdf
    locator: Section 3.1 Equations 2-4 & Section 4 Experiments (Tables 2-5), pp. 4-8
    relation: supports
- claim_id: r447-mnist-cifar10-and-wikitext2-heterogeneous-federated-application
  kind: application
  statement: Applied to computation- and communication-constrained federated learning across 5 exponentially scaled complexity tiers (a-e) on MNIST, CIFAR-10 (ResNet-18), and WikiText-2 (Transformer).
  evidence:
  - source_id: r447-primary-pdf
    locator: Section 4 Experiments (Tables 1-5, Figures 2-3), pp. 6-9
    relation: supports
