id: AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning
name: HeteroFL (Computation and Communication Efficient Federated Learning for Heterogeneous Clients)
concept_kind: algorithm
review_status: DRAFT
definition: A system-heterogeneous federated learning framework (Diao, Ding, & Tarokh 2021, Section 3, Equations 1-4, Algorithm 1) that allocates nested top-left width-scaled submatrices W_l^p in R^{d_l^p x k_l^p} with d_l^p = r^{p-1} d_g, k_l^p = r^{p-1} k_g (parameter ratio |W_l^p| / |W_g| = r^{2(p-1)}) from a single global model W_g to clients of computation complexity level p in {1, ..., P}, stabilizes cross-width training via a 1/r^{p-1} Scaler module and static Batch Normalization (sBN), and updates each disjoint parameter partition W_g^{p-1, t+1} \ W_g^{p, t+1} by averaging exclusively over the m - m_{t+1}^{(p)} clients capable of training level p-1 (Equations 2-4).
identity_notes: Distinct from FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning, Horvath et al. 2021), which randomly samples prefix widths p ~ D_P during local client SGD (Ordered Dropout) and applies self-distillation from each client's maximal submodel rather than training a single fixed submodel level p_i per client round with a 1/r^{p-1} activation Scaler and static Batch Normalization.
aliases:
- HeteroFL
- Heterogeneous Federated Learning via Width-Scaled Subnetworks
