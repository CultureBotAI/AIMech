name: Cutout
definition: A training-image augmentation method that removes information from a randomly located square
  region by replacing that region with zeros in the normalized input while keeping the original target.
concept_kind: preprocessing_method
identity_notes: This record denotes the original random square masking procedure. It is distinct from
  unit-level Dropout, input-and-label MixUp, replacement with content from another image, and an augmentation
  policy that merely includes a cutout operation. A policy implementation can use a different fill value
  or mask-size convention without redefining the original paper’s exact rule. No normalized identity match
  was found across all 442 pinned AIO labels/scoped synonyms and 238 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in both worktree and main checkout,
  returning 34 lines in each from prior discovery, saved reviews and related native records. Ten exact
  AIO CLASS nodes, their scoped synonyms and outgoing edges, plus five neighboring native mechanisms were
  inspected. This absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
limitations:
- A removed region can contain the class-defining information; suitable mask size depends on image scale,
  data and task.
- Masking with unchanged labels assumes that the remaining image supports the original target. This is
  an inductive bias, not a semantic guarantee.
- The record does not assert a universal mask length, implementation-specific integer rounding, channel
  convention, benchmark gain or robustness guarantee.
