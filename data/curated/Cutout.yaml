claims:
- claim_id: method
  kind: mechanism
  statement: 'For each training image, randomly choose a pixel within the image as the center of a fixed-size
    square mask. Set pixels in the overlapping image region to zero; the square may extend beyond the
    image boundaries, so its visible area can be smaller than the specified square. Apply the mask during
    training with the original label. The paper applies cutout to zero-centered data: zero denotes the
    normalization origin rather than necessarily a black pixel in the unnormalized image. Mask size is
    a tunable parameter. At test time, use the complete image without cutout or the activation rescaling
    associated with dropout. The earlier feature-activation-guided masking investigation and the fully-contained
    mask used with 50% probability are explored alternatives, not the final random-center rule.'
  evidence:
