id: AIMech:AdaBoundAndAmsBoundDynamicLearningRateBoundsOptimization
name: AdaBound and AMSBound Dynamic Learning-Rate Bounds Optimization
concept_kind: algorithm
review_status: DRAFT
definition: 'AdaBound and AMSBound are first-order adaptive stochastic optimization algorithms (Luo, Xiong, Liu, & Sun, ICLR 2019) that eliminate both extremely large and extremely small late-stage learning rates in Adam and AMSGrad by clipping the element-wise adaptive learning rate alpha / sqrt(V_t) to a pair of dynamic monotone bound functions [eta_l(t), eta_u(t)]: eta_hat_t = Clip(alpha / sqrt(V_t), eta_l(t), eta_u(t)), eta_t = eta_hat_t / sqrt(t), and x_{t+1} = Pi_{F, diag(eta_t^{-1})}(x_t - eta_t odot m_t), where V_t = diag(v_t) for AdaBound and V_t = diag(v_hat_t) with v_hat_t = max(v_hat_{t-1}, v_t) for AMSBound, and where the non-decreasing lower bound eta_l(t) (initialized at 0) and non-increasing upper bound eta_u(t) (initialized at infinity) both converge smoothly to a constant final step size alpha* as t -> infinity, inducing a continuous transition from adaptive gradient methods early in training to SGD (with momentum) asymptotically.'
identity_notes: Distinct from Adam (Kingma & Ba, 2015), which sets eta_l(t) = 0 and eta_u(t) = infinity and can fail to converge on convex problems due to either huge or tiny learning rates (Theorems 1-3); distinct from AMSGrad (Reddi et al., 2018), which enforces non-increasing step sizes via v_hat_t = max(v_hat_{t-1}, v_t) to curb large learning rates but does not bound tiny learning rates from below; distinct from SWATS (Keskar & Socher, 2017), which performs a discrete hard switch from Adam to SGD at a thresholded step rather than a continuous dynamic-bound transformation; and distinct from Padam (Chen et al., 2020), which scales the second-moment denominator exponent to v_hat_t^p with p in (0, 1/2] rather than clipping step sizes to time-varying bounds [eta_l(t), eta_u(t)].
aliases:
- AdaBound
- AMSBound
- Adaptive Gradient Methods with Dynamic Bound of Learning Rate
- Dynamic Learning-Rate Bound Adaptive Moment Estimation
