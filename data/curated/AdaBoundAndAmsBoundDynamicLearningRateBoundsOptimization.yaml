claims:
- claim_id: theorem1-nonconvergence-of-adam-from-tiny-learning-rates
  kind: mechanism
  statement: Theorem 1 (Section 3, p. 4 & Appendix B, Eqs. 2-3, p. 12-13) proves that for the 1D online convex optimization sequence over F = [-2, 2] with f_t(x) = -100 for x < 0, f_t(x) = -x for 0 <= x <= 1 and t mod C = 1, f_t(x) = 2x for 0 <= x <= 1 and t mod C = 2, and 0 otherwise, where C in N satisfies 5 * beta_2^{C-2} <= (1 - beta_2)/(4 - beta_2) (Eq. 3), Adam with beta_1 = 0 and any initial step size alpha > 0 satisfies V_{Ct+1} - 4 V_{Ct} >= (4 - beta_2)[(1 - beta_2)/(4 - beta_2) - 5 * beta_2^{C-2}] >= 0, keeping x_t >= 0 for all t in N and suffering non-vanishing average regret R_T / T >= 100 as T -> infinity because the corrective gradient +2 at t mod C = 2 is scaled down by a larger second-moment accumulator than the wrong-direction gradient -1 at t mod C = 1.
  evidence:
  - source_id: r608-primary-pdf
    locator: Section 3, Theorem 1, p. 4; Appendix B, Eqs. 2-3, p. 12-13
    relation: supports
- claim_id: theorem4-and-theorem5-online-convex-regret-bounds
  kind: mechanism
  statement: Theorems 4 and 5 and Corollary 4.1 (Section 4, p. 5 & Appendix E-F, p. 14-17) prove that under beta_1 = beta_{11}, beta_{1t} <= beta_1, beta_1 / sqrt(beta_2) < 1, monotone bounds eta_l(t+1) >= eta_l(t) > 0 and eta_u(t+1) <= eta_u(t) converging to alpha* with L_infty = eta_l(1) and R_infty = eta_u(1), bounded diameter ||x - y||_infty <= D_infty, and bounded gradients ||nabla f_t(x)||_2 <= G_2, both AdaBound (Algorithm 2) and AMSBound (Algorithm 3) satisfy R_T <= (D_infty^2 sqrt(T) / (2(1 - beta_1))) sum_{i=1}^d eta_hat_{T,i}^{-1} + (D_infty^2 / (2(1 - beta_1))) sum_{t=1}^T sum_{i=1}^d beta_{1t} eta_{t,i}^{-1} + (2 sqrt(T) - 1) R_infty G_2^2 / (1 - beta_1) = O(sqrt(T)) when beta_{1t} = beta_1 lambda^{t-1} or beta_{1t} = beta_1 / t.
  evidence:
  - source_id: r608-primary-pdf
    locator: Section 4, Theorem 4 & Corollary 4.1, p. 5-6; Appendix E-F, Theorem 5, p. 14-17
    relation: supports
- claim_id: canonical-rational-bound-functions-and-deep-network-generalization
  kind: application
  statement: Using the canonical bound functions eta_l(t) = (1 - 1 / ((1 - beta)t + 1)) alpha* and eta_u(t) = (1 + 1 / ((1 - beta)t)) alpha* with default alpha = 0.001, alpha* = 0.1, beta_1 = 0.9, and beta_2 = 0.999 (Section 4-5, p. 6-9; Appendix G-H, p. 17-19), AdaBound and AMSBound match the early convergence speed of Adam/AMSGrad while improving CIFAR-10 test accuracy by ~2% over Adam on DenseNet-121 and surpassing SGDM by ~1% on ResNet-34, and reduce Penn Treebank test perplexity by over 2.8% relative to Adam on 3-layer LSTM language models while remaining robust across alpha* in [0.001, 1] and beta in [beta_1, beta_2].
  evidence:
  - source_id: r608-primary-pdf
    locator: Section 4-5, Table 2 & Figures 2-4, p. 6-9; Appendix G-H, Figures 5-8, p. 17-19
    relation: supports
  - source_id: r608-arxiv-abs
    locator: Abstract
    relation: supports
- claim_id: modest-gains-on-shallow-models-and-bound-schedule-specification
  kind: limitation
  statement: Section 5.4-6 (p. 8-9) notes that on simple shallow architectures such as a 1-layer perceptron on MNIST or a 1-layer LSTM on Penn Treebank, the test accuracy or perplexity improvement of AdaBound and AMSBound over Adam and SGD is modest (~1.1% on 1-layer LSTM), that on recurrent language modeling tasks AdaBound and AMSBound do not match Adam's very earliest-epoch drop in perplexity, and that the algorithms require specifying two dynamic bound schedules eta_l(t) and eta_u(t) together with a target SGD step size alpha*.
  evidence:
  - source_id: r608-primary-pdf
    locator: Section 5.2, 5.4, 5.5, and Section 6 Future Work, p. 7-9
    relation: supports
