id: AIMech:ADOREOptimizingDenseRetrievalModelTrainingWithHardNegatives
name: ADORE and STAR Hard-Negative Dense Retrieval Training Framework
concept_kind: algorithm
review_status: DRAFT
definition: 'A two-stage hard-negative training algorithm and theoretical optimization framework for bi-encoder dense retrieval that first trains both query and document encoders with STAR (Stable Training Algorithm for dense Retrieval) by minimizing a weighted RankNet pairwise objective alpha L_r(theta) + L_s(theta) (0 < alpha << 1) combining static pre-retrieved hard negatives L_s(theta) with reused in-batch random negatives L_r(theta), and then freezes the resulting pre-computed (and optionally product-quantized) document index to train the query encoder with ADORE (Algorithm for Directly Optimizing Ranking pErformance) using online dynamic top-K hard negatives D^-_theta = {d^- : 1_{pi(d^-) <= K_q} = 1} retrieved at every step under a metric-weighted LambdaLoss L(d^+, d^-) = Delta_M log(1 + exp(f(q, d^-) - f(q, d^+))), where Delta_M is the change in target IR metric (such as MRR) caused by swapping the ranks of d^+ and d^-.'
identity_notes: Distinct from ANCE (AIMech:ANCEApproximateNearestNeighborNegativeContrastiveLearning), which periodically re-encodes the entire corpus and rebuilds the ANN index every several thousand steps to refresh static hard negatives without random-negative stabilization or metric-weighted LambdaLoss; and distinct from RocketQA (AIMech:RocketQADenoisedHardNegativeSampling), which uses a cross-encoder teacher to filter static hard negatives rather than online query-side dynamic hard negative retrieval against a fixed document index.
aliases:
- ADORE
- STAR and ADORE
- ADORE+STAR
- Algorithm for Directly Optimizing Ranking Performance
- Stable Training Algorithm for Dense Retrieval and ADORE
