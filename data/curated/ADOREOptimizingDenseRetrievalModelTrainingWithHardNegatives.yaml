claims:
- claim_id: adore-random-vs-top-k-hard-negative-theory
  kind: mechanism
  statement: Using the exact rank identity pi(d^+) = delta(d^+) + 1 + sum_{d^- in D^-} 1_{f(q, d^+) < f(q, d^-)} (Equation 3), uniform random negative sampling minimizes total pairwise errors sum_q sum_{d^+} (pi(d^+) - delta(d^+) - 1) (Equation 5), which is unbounded (up to |C|) and empirically dominated by a tiny fraction of difficult queries (0.2% of queries contributing 60% of total errors in Figure 3), whereas top-K hard negative sampling minimizes bounded top-K pairwise errors min(pi(d^+) - delta(d^+) - 1, K) (Equation 6, Theorem 4.1).
  evidence:
  - source_id: r761-primary-pdf
    locator: Sections 3-4 & Section 8.1, Equations 3-6, Theorem 4.1, Figure 3, Table 1, pp. 3, 6-7
    relation: supports
  - source_id: r761-primary-pdf
    locator: main() verification of rank_position identity Eq. 3 and bounded top-K error vs unbounded random error
    relation: supports
- claim_id: adore-static-vs-dynamic-hard-negative-mrr-bound
  kind: mechanism
  statement: 'Static hard negative sampling over a fixed set D^-_s has a loose quality bound phi(D^-_s) = min_{d^- in D^-_s} pi(d^-) in [1, |C| - |D^-_s| + 1] (Equation 8) so that even when training loss on D^-_s reaches zero, inf(MRR) = E_q[1 / (phi(D^-_s) - |D^+|)] ~ 1/|C| (Equation 9); by contrast, dynamic hard negative sampling D^-_theta = {d^- : 1_{pi(d^-) <= K_q} = 1} (Equation 10) bounds phi(D^-_theta) in [1, |D^+| + 1] and guarantees MRR = 1 when training loss reaches zero (Equations 11-12).'
  evidence:
  - source_id: r761-primary-pdf
    locator: Section 5 Static vs. Dynamic Hard Negatives & Section 8.2, Equations 7-12, Figure 4, pp. 4, 7
    relation: supports
  - source_id: r761-primary-pdf
    locator: main() verification of static zero-loss MRR < 1.0 vs dynamic zero-loss MRR == 1.0
    relation: supports
- claim_id: adore-star-and-lambdaloss-query-optimization
  kind: application
  statement: Combining STAR document-encoder training (alpha L_r(theta) + L_s(theta), Equation 13) with ADORE query-encoder training under LambdaLoss L(d^+, d^-) = Delta_M log(1 + exp(f(q, d^-) - f(q, d^+))) (Equation 15) achieves 0.347 MRR@10 on MS MARCO Dev Passage and 0.405 MRR@100 on MS MARCO Dev Doc with an 18x-179x training speedup over ANCE and supports end-to-end training directly against Product Quantization (PQ) compressed indexes (Tables 2-5).
  evidence:
  - source_id: r761-primary-pdf
    locator: Sections 6 & 8.3-8.4, Equations 13-15, Tables 2-5, pp. 4-9
    relation: supports
  - source_id: r761-metadata-cr
    locator: BibTeX citation record for arXiv:2104.08051 (SIGIR 2021)
    relation: supports
- claim_id: adore-frozen-document-encoder-limitation
  kind: limitation
  statement: Because ADORE avoids periodic corpus re-indexing by freezing pre-computed document embeddings throughout dynamic hard negative retrieval, ADORE only updates the query encoder and cannot directly update the document encoder based on dynamic retrieval results; furthermore, over-compressed PQ indexes (e.g., PQ=6) degrade search quality so severely that ADORE degenerates toward random negative sampling (Section 8.4.2, Section 9).
  evidence:
  - source_id: r761-primary-pdf
    locator: Section 6.3, Section 8.4.2 & Section 9 Conclusion, Table 5, pp. 5, 9-10
    relation: supports
