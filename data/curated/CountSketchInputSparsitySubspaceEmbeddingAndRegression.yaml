claims:
- claim_id: claim-01
  kind: mechanism
  statement: For the sparse embedding matrix S = Phi D in R^{t x n} with a single uniformly hashed bucket h(i) in [t] and random Rademacher sign sigma_i in {-1, +1} per column i, the matrix product S A is computable in O(nnz(A)) arithmetic operations, satisfies the exact unbiased second-moment identity E[(S^T S)_{ij}] = delta_{ij} (so E[||S x||_2^2] = ||x||_2^2 and E[||S A||_F^2] = ||A||_F^2), and preserves the Euclidean norm of any subset of heavy rows isolated into distinct hash buckets with exact isometry.
  evidence:
  - source_id: r331-primary-pdf
    locator: Section 1.2, Construction of S = Phi D, p. 6; Section 2.1, Theorem 2.3 and Lemma 2.5 (heavy/light row decomposition), pp. 13-16
    relation: supports
  - source_id: r331-arxiv-abs
    locator: 'Abstract: sparse subspace embeddings running in O(nnz(A)) input-sparsity time'
    relation: supports
- claim_id: claim-02
  kind: scope
  statement: Theorem 2.3 and Theorem 2.6 prove that for t = O(d^2 / epsilon^2) rows, S = Phi D is a (1 +/- epsilon)-l_2 subspace embedding for any d-dimensional subspace V in R^n with constant probability, and combining CountSketch preconditioning with iterative refinement solves min_x ||A x - b||_2 to (1 + epsilon) relative residual error in O(nnz(A) log(1/epsilon) + d^3 log^2 d + d^2 log(1/epsilon)) time.
  evidence:
  - source_id: r331-primary-pdf
    locator: Section 2.1, Theorem 2.3, p. 14; Section 2.2, Theorem 2.6 (Overconstrained Least Squares), pp. 16-17
    relation: supports
  - source_id: r331-metadata-cr
    locator: STOC 2013 bibliographic record, pp. 81-90
    relation: supports
- claim_id: claim-03
  kind: limitation
  statement: Because S = Phi D hashes each row of A to a single bucket without prior Hadamard spreading, avoiding collisions among up to d high-leverage (spiky canonical basis) rows by the birthday paradox requires target dimension t = Omega(d^2 / epsilon^2) rather than O(d / epsilon^2), and hash collisions between two heavy basis rows with opposite effective signs cause destructive cancellation that breaks the subspace embedding property.
  evidence:
  - source_id: r331-primary-pdf
    locator: Section 2.1, Proof of Lemma 2.5 (perfect hashing of heavy rows W requires t = Omega(|W|^2) = Omega(d^2)), pp. 15-16
    relation: supports
