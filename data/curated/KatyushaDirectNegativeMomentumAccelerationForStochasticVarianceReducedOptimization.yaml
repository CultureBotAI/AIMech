id: AIMech:KatyushaDirectNegativeMomentumAccelerationForStochasticVarianceReducedOptimization
name: Katyusha Direct Negative-Momentum Acceleration for Stochastic Variance-Reduced Optimization
concept_kind: algorithm
review_status: DRAFT
definition: Katyusha Direct Negative-Momentum Acceleration for Stochastic Variance-Reduced Optimization is a direct, primal-only accelerated stochastic gradient method introduced by Allen-Zhu (2017, 2018) for composite convex finite-sum minimization min_{x in R^d} {F(x) = (1/n) sum_{i=1}^n f_i(x) + psi(x)}, where each f_i is convex and L-smooth and psi is sigma-strongly convex. Whereas naive Nesterov momentum on stochastic gradients accumulates variance errors, Katyusha (Algorithm 1) couples three iterate sequences (x_k, y_k, z_k) with a periodic SVRG snapshot x_tilde^s (updated every m = 2n iterations as an exponentially weighted average x_tilde^{s+1} = (sum_{j=0}^{m-1} (1 + alpha*sigma)^j)^{-1} sum_{j=0}^{m-1} (1 + alpha*sigma)^j y_{sm+j+1}) via the convex combination x_{k+1} = tau_1 z_k + tau_2 x_tilde^s + (1 - tau_1 - tau_2) y_k. Here tau_1 = min{sqrt(m*sigma/(3L)), 1/2} is the classical Nesterov linear-coupling momentum weight, alpha = 1/(3*tau_1*L) is the mirror step size, and tau_2 = 1/2 is the Katyusha 'negative momentum' weight, which acts as a retracting magnet toward the snapshot x_tilde^s so that the inner-product error <grad f(x_{k+1}), x_tilde^s - x_{k+1}> in the tight SVRG variance bound E[||grad_tilde_{k+1} - grad f(x_{k+1})||^2] <= 2L(f(x_tilde^s) - f(x_{k+1}) - <grad f(x_{k+1}), x_tilde^s - x_{k+1}>) (Lemma 2.4) is algebraically canceled in the linear-coupling step (Lemmas 2.6-2.7). Theorem 2.1 proves that Katyusha achieves an epsilon-additive minimizer in an optimal O((n + sqrt(n*L/sigma)) log((F(x_0) - F(x^*))/epsilon)) stochastic gradient iterations without outer-inner Catalyst reductions or Fenchel dual conjugates.
identity_notes: Distinct from Catalyst Universal Acceleration (`AIMech:CatalystUniversalAccelerationForFirstOrderOptimization`), which wraps a variance-reduced solver inside an inexact proximal-point outer loop and incurs an extra O(log(L/sigma)) factor and only O(sqrt(b)) mini-batch parallel speedup, and from unaccelerated SVRG, SAGA, or SARAH (`AIMech:SARAHStochasticRecursiveGradientForFiniteSumOptimization`), which have O((n + L/sigma) log(1/epsilon)) linear dependence on the condition number kappa = L/sigma. Specifically captures the three-way iterate coupling x_{k+1} = tau_1 z_k + tau_2 x_tilde^s + (1 - tau_1 - tau_2) y_k with Katyusha negative momentum tau_2, the Lemma 2.4 tight Bregman variance bound cancellation, the direct non-strongly convex variant Katyusha^{ns} (Algorithm 2, Theorem 4.1), the mini-batch non-uniform smoothness variant Katyusha1 (Algorithm 3, Theorem 5.4), and the non-Euclidean Bregman variant Katyusha2 (Section 6, Theorems 6.1-6.2).
aliases:
- Katyusha Momentum Accelerated Stochastic Variance Reduced Gradient
- Katyusha Direct Primal-Only Accelerated Stochastic Gradient Method
- Katyushans Direct Non-Strongly Convex Accelerated SVRG
