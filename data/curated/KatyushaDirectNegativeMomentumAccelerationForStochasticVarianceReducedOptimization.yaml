claims:
- claim_id: claim-katyusha-negative-momentum-variance-cancellation
  kind: mechanism
  statement: For convex L-smooth component functions f_i(x), the SVRG variance-reduced gradient estimator grad_tilde_{k+1} = grad f(x_tilde) + grad f_i(x_{k+1}) - grad f_i(x_tilde) satisfies the tight Bregman-divergence variance bound E[||grad_tilde_{k+1} - grad f(x_{k+1})||^2] <= 2L(f(x_tilde) - f(x_{k+1}) - <grad f(x_{k+1}), x_tilde - x_{k+1}>) (Lemma 2.4); coupling the proximal gradient descent step on y_{k+1} (Lemma 2.3) and proximal mirror descent step on z_{k+1} (Lemma 2.5) via the Katyusha momentum combination x_{k+1} = tau_1 z_k + tau_2 x_tilde + (1 - tau_1 - tau_2) y_k with tau_2 = 1/2 and tau_1 <= 1/(3*alpha*L) exactly cancels the potentially positive inner-product term -tau_2 <grad f(x_{k+1}), x_tilde - x_{k+1}> against the convexity split alpha <grad f(x_{k+1}), x_{k+1} - z_k> (Lemmas 2.6 and 2.7).
  evidence:
  - source_id: r343-primary-pdf
    locator: Section 2.1, Lemmas 2.3, 2.4, 2.5, 2.6, and 2.7, pp. 8-11
    relation: supports
  - source_id: r343-arxiv-abs
    locator: 'Abstract: Katyusha momentum (''negative momentum'' on top of Nesterov''s momentum) incorporated into variance-reduction'
    relation: supports
- claim_id: claim-katyusha-optimal-accelerated-rates-and-minibatch-speedup
  kind: mechanism
  statement: Theorem 2.1 proves that with epoch length m = Theta(n) and snapshot weights theta^j = (1 + alpha*sigma)^j, Katyusha achieves E[F(x_tilde^S)] - F(x^*) <= epsilon in O((n + sqrt(n*L/sigma)) log((F(x_0) - F(x^*))/epsilon)) stochastic gradient iterations (satisfying the homogeneous objective decrease HOOD property without logarithmic condition-number loss, Corollary 3.2), while Katyusha^{ns} (Algorithm 2, Theorem 4.1) with epoch-varying tau_{1,s} = 2/(s+4) achieves O((F(x_0) - F(x^*))/S^2 + L||x_0 - x^*||^2/(m S^2)) directly for non-strongly convex objectives, and mini-batch Katyusha1 (Algorithm 3, Theorem 5.4) with importance sampling p_i = L_i/(n L_bar) and tau_2 = min{L_bar/(2 L b), 1/2} achieves O((n + b*sqrt(L/sigma) + sqrt(n*L_bar/sigma)) log((F(x_0) - F(x^*))/epsilon)) total stochastic gradient evaluations, yielding optimal linear parallel speedup across b <= b_0 = sqrt(n*L_bar/L) >= sqrt(n) processors.
  evidence:
  - source_id: r343-primary-pdf
    locator: Section 2, Algorithm 1 and Theorem 2.1, pp. 7-14; Section 4, Algorithm 2 and Theorem 4.1, pp. 14-16; Section 5, Algorithm 3 and Theorem 5.4, pp. 16-20
    relation: supports
  - source_id: r343-metadata-cr
    locator: 'JMLR 18(221):1-51 abstract: optimal accelerated convergence rate and optimal parallel linear speedup in the mini-batch setting'
    relation: supports
- claim_id: claim-katyusha-non-euclidean-norm-and-zero-negative-momentum-instability
  kind: limitation
  statement: Omitting the negative momentum magnet by setting tau_2 = 0 (naive Nesterov momentum on variance-reduced gradients) fails to cancel the stochastic gradient error accumulation unless the mini-batch size b is very large (Section 1.1, Section 7.1, Figure 1c, and Remark 5.7), and when generalized to arbitrary non-Euclidean norms ||.|| with Bregman divergence V_x(y) (Katyusha2, Section 6, Theorem 6.1), mini-batching b i.i.d. gradient samples does not in general reduce the dual-norm variance E[||xi_bar - mu||_*^2] by a factor of 1/b, limiting the worst-case non-Euclidean mini-batch complexity to O((n + sqrt(b n L_bar / sigma)) log(1/epsilon)) (Section 6.2).
  evidence:
  - source_id: r343-primary-pdf
    locator: Section 6.1-6.2, Theorem 6.1 and Remarks on Non-Euclidean Mini-Batch Variance, pp. 20-21; Section 7.1, Figure 1, p. 22; Appendix A, Footnote 21, p. 25
    relation: supports
