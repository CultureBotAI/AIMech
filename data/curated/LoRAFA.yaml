claims:
- claim_id: lorafa-frozen-down-projection-activation-memory-elimination
  kind: mechanism
  statement: By freezing the base weights W_0 and the down-projection matrix A in R^{d_{in} x r}, LoRA-FA avoids computing gradients with respect to A and therefore discards the full input activation tensor X in R^{b x s x d_{in}}, caching only the low-rank intermediate activation X A in R^{b x s x r} (reducing adapter activation memory from 2bsd + 2bsr bytes to 2bsr bytes per linear layer).
  evidence:
  - source_id: r666-primary-pdf
    locator: Table 1, Section 5 (LoRA-FA is more memory efficient) & Appendix C.3, pp. 3, 5, 20
    relation: supports
- claim_id: lorafa-closed-form-gram-inverse-gradient-correction
  kind: mechanism
  statement: To minimize the Frobenius discrepancy ||(alpha/r) A g^B - g||_F^2 between the induced low-rank weight gradient and the full gradient g while ensuring non-increasing loss dL <= 0, LoRA-FA precomputes K = (A^T A)^{-1} in R^{r x r} once at initialization and transforms the raw gradient g^B_{LoRA-FA} into g^B = (r/alpha)^2 (A^T A)^{-1} g^B_{LoRA-FA} before updating AdamW moments.
  evidence:
  - source_id: r666-primary-pdf
    locator: Section 4 (Theorem 4.1), Appendix A.2 (Equations 15-27) & Appendix B (Algorithm 1), pp. 4, 16-19
    relation: supports
- claim_id: lorafa-application-glue-gsm8k-humaneval-and-long-context-sft
  kind: application
  statement: Evaluated on RoBERTa-base/large (GLUE), LLaMA2-7B, LLaMA3-8B, Qwen3-8B, and DeepSeek-V2-Lite across GSM8K, HumanEval, and MT-Bench, LoRA-FA matches or outperforms LoRA, DoRA, and LoRA-Pro while cutting peak training memory by over 27 GB on LLaMA2-7B and sustaining higher Model FLOPs Utilization (MFU).
  evidence:
  - source_id: r666-primary-pdf
    locator: Section 6 (Experiments), Tables 2-4 & Figure 2, pp. 6-8
    relation: supports
- claim_id: lorafa-limitation-fixed-column-subspace-and-svd-init-blind-spot
  kind: limitation
  statement: Because the induced weight update Delta_W = -(alpha/r) P_A g is orthogonally projected onto the fixed r-dimensional column space of the frozen initial matrix A, any gradient component orthogonal to col(A) is lost ( capturing r/m of gradient energy in expectation under Gaussian initialization and suffering zero update energy in orthogonal directions under truncated-SVD initialization).
  evidence:
  - source_id: r666-primary-pdf
    locator: Appendix E.3 (Initialization of A) & Appendix E.5 (Limitations), pp. 23-25
    relation: supports
