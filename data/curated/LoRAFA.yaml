id: AIMech:LoRAFA
name: LoRA-FA
concept_kind: algorithm
review_status: DRAFT
definition: A memory-efficient low-rank adaptation algorithm that freezes the randomly initialized down-projection matrix A and updates only the zero-initialized up-projection matrix B using a precomputed Gram-inverse gradient correction (r/alpha)^2 (A^T A)^{-1} g^B_{LoRA-FA}, eliminating the need to cache full-dimension layer input activations X during the forward pass.
identity_notes: Distinct from AIMech:LowRankAdaptation (LoRA), which updates both A in R^{d_{in} x r} and B in R^{r x d_{out}} and must retain the full input activation tensor X in R^{b x s x d_{in}} in GPU memory to compute dL/dA = (alpha/r) X^T (dL/dY) B^T during backpropagation, and from AIMech:LoraPlusEfficientLowRankAdaptationWithAsymmetricLearningRates (LoRA+), which still updates both A and B with asymmetric learning rates. LoRA-FA (Longteng Zhang, Lin Zhang, Shaohuai Shi, Xiaowen Chu, and Bo Li, arXiv:2308.03303) proves that stacked linear low-rank updates collapse to single-layer linear regression within the column space of A_0 (Theorem 3.1) and derives the closed-form gradient correction g^B = (r/alpha)^2 (A^T A)^{-1} g^B_{LoRA-FA} (Theorem 4.1) that minimizes the Frobenius norm discrepancy ||(alpha/r) A g^B - g||_F^2 against the full-fine-tuning gradient g while guaranteeing dL <= 0. Because A is frozen, only the r-dimensional intermediate activation X A in R^{b x s x r} (2bsr bytes instead of 2bsd + 2bsr bytes) is stored for backpropagation, and K = (A^T A)^{-1} in R^{r x r} is precomputed once at initialization.
aliases:
- LoRA with Frozen-A
- Memory-Efficient Low-Rank Adaptation with Frozen Projection-Down Matrix
- LoRA-FA Parameter-Efficient Fine-Tuning
