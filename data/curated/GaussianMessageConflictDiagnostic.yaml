aio_mappings:
- target: AIO:RandomEffectsModel
  relation: related_match
  rationale: The diagnostic assesses agreement between a clustered random-effects prior and unit-specific
    likelihood information in a fitted Bayesian GLMM. RandomEffectsModel supplies the defining model context;
    it does not denote this message-separation diagnostic. The association is method-to-model relatedness,
    without equivalence or is-a.
limitations:
- The prior and likelihood messages need not equal genuine predictive-prior and likelihood-posterior distributions.
  Independence, full-data substitution and Gaussian approximation are substantive assumptions; large cluster
  counts alone do not prove their accuracy.
- A standalone likelihood message requires positive-definite R_i. A proper combined q(a_i) does not repair
  an improper separated message, and a pseudoinverse silently changes the procedure. Numerical quadrature
  and near-singular curvature can affect both message parameters and tail scores.
- Tail orientation is explicit because the original 2007 discussion contains a reversed displayed difference
  mean on journal p. 419 / PDF p. 11 and an inconsistent inequality in Figure 4 caption on journal p.
  439 / PDF p. 31. This record follows delta=prior-likelihood and the corresponding probability algebra,
  not those conflicting display fragments.
- The Gaussian reference tail is not a general null calibration theorem. Multiple tested units, estimated
  hyperparameters, reference-prior choice, data reuse and selected follow-up require separate assessment.
  No automated rejection threshold, FDR guarantee or domain diagnosis is asserted.
- All 42 pages of the 2014 preprint, 36 pages of the 2007 journal PDF and 21 pages of the supporting 2013
  reprint were read. No author software, model fitting or empirical calibration simulation was run. The
  independent calculation constructs one local Poisson stationary block under supplied globals, compares
  its message with an exact scalar likelihood posterior, and checks Gaussian and singular-message boundaries;
  it does not optimize the global factors or reproduce reported experiments.
