id: AIMech:GaussianMessageConflictDiagnostic
name: Gaussian message conflict diagnostic
aliases: []
concept_kind: algorithm
definition: A Bayesian GLMM screening procedure that separates Gaussian prior and likelihood natural-parameter
  messages at local variational fixed points and computes conflict scores from an approximately independent
  Gaussian difference. It approximates predictive-prior versus unit-likelihood disagreement using full-data
  fitted factors.
identity_notes: 'No normalized identity match across 442 pinned AIO and 556 maintained IDs, names, aliases
  and scoped synonyms for the proposed Gaussian-message and general cross-validated conflict diagnostics.
  Fixed-string searches of the recovery, older discovery and original Documents checkouts included ignored
  and hidden files and returned 59, 0 and 0 lines. All 59 were assessed: prior source links, the stochastic
  fitting record and its generated/review mirrors, and explicit pending diagnostic leads. Assessed 50
  semantic AIO rows and 177 native names/definitions, reusing 31 and 130 verified unchanged rows and reading
  all 19 and 47 additional rows. Ten complete AIO nodes, annotations, incident edges and generated records
  were read or verified unchanged; four full native context records were read or verified against prior
  readings. The source phrase mixed messages diagnostics denotes this Gaussian approximation to prior-likelihood
  conflict scoring, not the separate GLMM fitting algorithm. It is distinct from generic NCVMP, the full-data
  and stochastic GLMM fitting procedures, distance-based local outlier factors and the simulation-based
  cross-validated comparator. This is a descriptive AIMech algorithm identity bounded to the inspected
  source and corpus.'
definition_evidence:
- source_id: tan2014
  locator: Sections 5–5.2, PDF pp. 17–21
  relation: supports
claims:
- claim_id: fitted-glmm-context
  kind: scope
  statement: The inspected diagnostic applies to the partially noncentered Poisson-log or Bernoulli-logit
    GLMM with a_i=u_i+B_i*beta and predictor eta_i=V_i*beta+Z_i*a_i, where a_i|beta,D~N(B_i*beta,D). Its
    input is a fitted block-factorized approximation q(beta)q(D)product_i q(a_i), with q(beta)=N(m,Q),
    q(D)=IW(nuq,Sq) and q(a_i)=N(m_i,Q_i). Require proper factors, finite Gaussian moments and a local
    Gaussian NCVMP fixed point for every assessed unit at the final fixed global factors. Stochastic global
    fitting alone can leave local factors stale; the source calls for a final local refresh. The diagnostic
    compares prior and likelihood messages about unit random effects; it does not itself fit the model
    or prove that a flagged unit is erroneous.
  evidence:
  - source_id: tan2014
    locator: Sections 5–5.2, PDF pp. 17–21; final local refresh, PDF p. 21
    relation: supports
- claim_id: prior-message
  kind: mechanism
  statement: 'Write A=E_q[D^-1]=nuq*Sq^-1. The Gaussian prior message has precision A, mean m_prior=B_i*m
    and covariance C_prior=A^-1=Sq/nuq. These natural parameters follow from the a_i-dependent part of
    E_q(beta,D)[log p(a_i|beta,D)]. After normalization it is a Gaussian function of a_i. It is not the
    arithmetic predictive mixture integral p(a_i|beta,D)q(beta)q(D) d beta dD: when nuq>r+1 that mixture
    has covariance Sq/(nuq-r-1)+B_i*Q*B_i^T, generally different. A pointwise Jensen bound on an unnormalized
    expected-log kernel does not establish a density lower bound after separate normalization. The mixture-moment
    comparison is curator reasoning under the stated independent factors.'
  evidence:
  - source_id: tan2014
    locator: Section 5.2 prior-message construction and Jensen argument, PDF p. 19
    relation: supports
- claim_id: likelihood-message
  kind: mechanism
  statement: 'At the same local state, let G_i and F_i be expected first and second cumulant derivatives
    under the Gaussian predictor. For positive-exposure Poisson observations, both equal E_i*exp(t_i+v_i/2),
    elementwise, where t_i=V_i*m+Z_i*m_i and v_i=diag(V_i*Q*V_i^T+Z_i*Q_i*Z_i^T). For Bernoulli-logit
    they are standard-normal expectations of sigmoid(T) and sigmoid(T)*(1-sigmoid(T)), with T=t_ij+sqrt(v_ij)*Z0
    and Z0~N(0,1). Define R_i=Z_i^T*diag(F_i)*Z_i and s_i=Z_i^T*(y_i-G_i). If R_i is positive definite,
    the standalone likelihood message is N(m_lik,C_lik), with C_lik=R_i^-1 and m_lik=m_i+C_lik*s_i. Positive
    semidefinite curvature alone does not suffice: rank-deficient Z_i gives a singular R_i and no proper
    Gaussian density on the full r-dimensional space, even when the combined posterior factor is proper.
    The normalized expectations here follow the 2013 Appendix B; the 2014 Appendix B display on PDF p.
    37 and the 2013 Section 4.3 display on PDF p. 8 both omit a half in the Gaussian exponent.'
  evidence:
  - source_id: tan2014
    locator: Section 5.2 likelihood-message expressions, PDF p. 20; Appendix B cumulant definitions, PDF
      pp. 37–38
    relation: supports
  - source_id: tan2013
    locator: Appendix B normalized Gaussian construction, PDF pp. 19–20; contrast Section 4.3 display,
      PDF p. 8
    relation: supports
- claim_id: fixed-point-combination
  kind: mechanism
  statement: 'At a local fixed point, Q_i^-1=A+R_i and A*(m_i-B_i*m)=s_i. Thus the prior and likelihood
    natural parameters add to those of q(a_i): Q_i^-1*m_i=A*m_prior+R_i*m_lik. Equivalently, the ratio
    q(a_i)/N(a_i;m_prior,C_prior) is proportional to the likelihood Gaussian when its precision is positive
    definite. Away from the fixed point, summing the current messages produces the local Gaussian proposal,
    not necessarily the stored q(a_i); the ratio interpretation and diagnostic must not silently assume
    that stale local parameters satisfy these equations.'
  evidence:
  - source_id: tan2014
    locator: Section 5.2 natural-parameter sum and ratio argument, PDF p. 20; local optimization requirement,
      PDF p. 21
    relation: supports
- claim_id: gaussian-conflict-score
  kind: mechanism
  statement: Under the additional approximation that the two message-based replicates are independent,
    their difference delta=a_prior-a_lik is Gaussian with mean d=m_prior-m_lik and covariance C=C_prior+C_lik.
    In one dimension define the lower tail P(delta<=0)=Phi(-d/sqrt(C)), the upper tail as one minus that
    value, and the two-sided score as twice their minimum. State the selected tail explicitly. For r-dimensional
    positive-definite C, the source uses d^T*C^-1*d and the upper chi-square tail with r degrees of freedom
    under a Gaussian-difference approximation. These are probabilities or reference-tail scores from the
    constructed approximation; this algebra alone does not establish uniform frequentist p-values or false-positive
    control under repeated data.
  evidence:
  - source_id: tan2014
    locator: Section 5.1 difference and tail definitions, PDF p. 18; independent Gaussian-message approximation,
      PDF p. 19
    relation: supports
  - source_id: marshall2007
    locator: Section 4, Equations 7–11, journal pp. 418–420 / PDF pp. 10–12; Appendix A1 calibration distinctions,
      journal pp. 429–430 / PDF pp. 21–22
    relation: supports
- claim_id: leave-one-out-boundary
  kind: limitation
  statement: The simulation-based comparator draws a predictive-prior replicate using hyperparameters
    fitted without the assessed unit and a likelihood replicate from that unit with a reference prior.
    The variational messages instead use the full-data fitted factors, replace hyperparameter mixtures
    by expected-log Gaussian messages, and neglect replicate dependence. The likelihood-message interpretation
    invokes a uniform reference prior, whereas the source comparison uses Jeffreys priors for its likelihood
    replications. Nuisance fixed effects learned from other units can still couple the two replications.
    Full-data fitting, factorization, reference-prior choice and approximate Gaussian likelihood messages
    therefore prevent treating this diagnostic as exact leave-one-unit-out conflict analysis. The source
    describes its approximation argument as nonrigorous.
  evidence:
  - source_id: tan2014
    locator: Sections 5.1–5.2, PDF pp. 17–20; Appendix C reference-prior likelihood replications, PDF
      p. 39
    relation: supports
  - source_id: marshall2007
    locator: Sections 3–4, journal pp. 415–420 / PDF pp. 7–12; Section 6 full-data approximations, journal
      pp. 422–424 / PDF pp. 14–16
    relation: supports
- claim_id: screening-and-evaluation
  kind: scope
  statement: The source proposes the message diagnostic as an initial screen, with selected units eligible
    for closer Monte Carlo assessment. Its comparisons use small GLMM datasets and transformed tail-probability
    agreement with simulation-based comparators; those comparisons do not establish universal calibration,
    multiple-testing control or a clinical decision rule. Changing the centered/partially noncentered
    factorization can change the approximate messages and scores. A common invertible linear transformation
    of an already constructed Gaussian difference preserves its Mahalanobis statistic, but this algebraic
    invariance does not imply invariance across separately fitted variational parametrizations. No diagnostic
    threshold is made intrinsic to this concept.
  evidence:
  - source_id: tan2014
    locator: Section 5.2 screening and parametrization discussion, PDF pp. 19–21; Sections 6.1–6.2 and
      Appendix D diagnostic comparisons, PDF pp. 21–28 and 40–42
    relation: supports
