name: Contrastive predictive coding
definition: A representation-learning procedure that encodes observations, summarizes preceding representations
  as context, and jointly trains these components to distinguish future representations from sampled alternatives
  using InfoNCE.
concept_kind: algorithm
identity_notes: 'CPC denotes the van den Oord et al. procedure, with configurable encoders and ordered
  context. It uses InfoNCE but is not identical to that loss. It differs from DIM local-to-global feature
  matching and from SimCLR augmentation-pair learning. An autoregressive context module is part of the
  original procedure; a GRU and raw-input reconstruction are not requirements. No normalized identity
  match was found across all 442 pinned AIO labels/scoped synonyms and 203 preceding native IDs/names/aliases.
  Ignored-inclusive word-delimited searches of both full checkouts returned 52 worktree and 75 main-checkout
  lines: existing component discussions and discovery/review references, plus unrelated ignored dependency
  text in main. Short acronyms were compared in normalized identities. Four nearest maintained mechanisms
  and eleven exact AIO candidate nodes with direct parent edges were inspected.'
limitations:
- The bound is at most log(N) and depends on the negative proposal. Same-speaker, same-sequence or otherwise
  conditional negatives used in particular experiments do not automatically satisfy the ideal independent
  marginal sampling assumptions.
- The original appendix uses an approximate substitution in its derivation. The population bound is supported
  here by Poole et al.’s separate proof, not by promoting that approximation to an exact equality.
- Finite critics, finite samples and incomplete optimization do not guarantee density-ratio recovery or
  an accurate numerical mutual-information estimate. Future-predictive information can include nuisance
  factors.
- Only declared primary passages were inspected. No CPC implementation, training run or benchmark was
  reproduced.
