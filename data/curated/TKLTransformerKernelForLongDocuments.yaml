id: AIMech:TKLTransformerKernelForLongDocuments
name: 'TKL: Transformer-Kernel Model with Local Self-Attention for Long Document Retrieval'
concept_kind: architecture
review_status: DRAFT
definition: "A long-document neural re-ranking architecture (Hofst\xE4tter, Zamani, Mitra, Craswell, & Hanbury, SIGIR 2020) that contextualizes document token sequences d_{1:m} (up to thousands of tokens) in fixed-size moving windows of width w with overlap o using a multi-layer highway Transformer\u2014reducing self-attention complexity from O(L^2) to O(L * w) and skipping pure-padding windows\u2014computes cosine similarity RBF kernel activations K_{i,j}^k = exp(-(cos(q_i, d_j) - mu_k)^2 / (2 sigma^2)), sums activations within sliding saturation regions K_i^{r,k} = sum_{j=r}^{r+r_size} K_{i,j}^k, applies a learned query-salience conditioned power saturation function K_hat_i^{r,k} = a_i * (K_i^{r,k})^{1/b_i} - c_i, and aggregates the resulting relevance topography s^r via top-local-max_{t,f}(s^r) W_s over the top-t non-overlapping local maxima and their f immediate neighbors."
identity_notes: Distinct from the short-text TK model (AIMech:TKTransformerKernelModelForReRanking, which applies full self-attention over the first ~200 tokens and uses fixed log saturation over the entire document). TKL introduces overlapping local self-attention windows with minibatch padding-chunk skipping, a learned non-linear power saturation function conditioned on query-term salience e_i and region token count c_len, and two-stage local/global topography pooling via top-local-max_{t,f}.
aliases:
- TKL Long-Document Ranking Model
- Transformer-Kernel for Long Text
- Local Self-Attention Transformer-Kernel Model
