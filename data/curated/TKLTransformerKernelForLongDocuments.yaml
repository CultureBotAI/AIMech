claims:
- claim_id: tkl-windowed-local-attention-and-salience-saturation-mechanism
  kind: mechanism
  statement: TKL contextualizes document tokens in overlapping windows of width w and overlap o (concatenating interior slices d_hat_{1:m} = [TF(d_{1:w+o})_{1:w}; TF(d_{w-o:2w+o})_{o:-o}; ...] and skipping pure-padding windows), computes RBF kernel activations K_{i,j}^k, sums them in sliding windows of size r_size, applies the learned power saturation K_hat_i^{r,k} = a_i * (K_i^{r,k})^{1/b_i} - c_i conditioned on query-term salience e_i (initialized with IDF) and region token count c_len, and scores the top-t non-overlapping local maxima and their f neighboring regions via s = top-local-max_{t,f}(s^r) W_s.
  evidence:
  - source_id: r786-primary-pdf
    locator: Section 3, Equations (1)-(7), p. 2
    relation: supports
  - source_id: r786-primary-pdf
    locator: sliding_windows_non_pad, learned_saturation, and top_local_max verification
    relation: supports
- claim_id: tkl-long-document-bias-mitigation-scope
  kind: scope
  statement: By extending contextualized kernel pooling to 2,000-4,000 document tokens and detecting relevant regions beyond the 500th word, TKL significantly improves nDCG@10 and MRR@10 over TK on TREC 2019 Deep Learning Track document ranking while mitigating the under-retrieval bias against longer relevant documents.
  evidence:
  - source_id: r786-primary-pdf
    locator: Section 1, Figure 1, p. 1; Section 5, Tables 1-2, Figures 2-3, pp. 3-4
    relation: supports
- claim_id: tkl-window-boundary-context-limitation
  kind: limitation
  statement: Because TKL restricts document self-attention to local sliding windows of width w with overlap o rather than full document-wide attention, long-range contextual dependencies across distant paragraphs cannot interact during token contextualization and are only aggregated at the relevance topography stage.
  evidence:
  - source_id: r786-primary-pdf
    locator: Section 1, p. 1; Section 3, Equation (1), p. 2
    relation: supports
