- claim_id: group-structured-norm-oracle-inequality-and-glm-truncated-rsc
  kind: scope
  statement: For block-(1, alpha) group-structured regularization ||theta||_{G, alpha} = sum_{t=1}^{N_G}
    ||theta_{G_t}||_alpha with alpha in [2, infty] over N_G disjoint groups of maximum size m (Equation
    44), Proposition 1 (p. 16; proved in v1 Appendix C.1, p. 31, via Gordon-Slepian comparison and peeling)
    proves that any Sigma-Gaussian random design X satisfies ||X Delta||_2^2 / n >= kappa_1 ||Delta||_2^2
    - kappa_2 rho_G^2(alpha*) ||Delta||_{1, alpha}^2 (Equation 45) with rho_G(alpha*) := E[max_{t=1,...,N_G}
    ||epsilon_{G_t}||_{alpha*} / sqrt(n)] (yielding rho_G(2) <= sqrt(m/n) + sqrt((3 log N_G)/n) in Equation
    46). Under block normalization |||X_{G_t}|||_{alpha -> 2} / sqrt(n) <= 1 (Equation 47) and penalty
    lambda_n >= 2 sigma {m^{1 - 1/alpha} / sqrt(n) + sqrt((log N_G)/n)} (Equation 48, verified via Sudakov-Fernique
    Gaussian comparison in Lemma 5, v1 pp. 32-34), Corollary 4 (Equation 49) establishes the oracle bound
    ||theta_hat_{lambda_n} - theta*||_2^2 <= (4 lambda_n^2 / kappa_L^2) s_G + (4 lambda_n / kappa_L) sum_{t
    not in S_G} ||theta*_{G_t}||_alpha for any group subset S_G of size s_G with probability at least
    1 - 2 / N_G^2, specializing to O((s_G m + s_G log N_G)/n) for alpha = 2 (Equation 50), O(R_q (m/n
    + (log N_G)/n)^{1 - q/2}) over block l_q-balls B_q(R_q; G, 2), and O((s_G m^2 + s_G log N_G)/n) for
    alpha = +infty. Furthermore, for canonical generalized linear models (Equations 41-43 in v3; Section
    6 and Appendix D in v1, pp. 20-23 and 34-40, Proposition 2, Corollary 5, Lemma 6), applying the Lipschitz
    quadratic truncation function phi_tau(u) (v1 Equation 64) and the Ledoux-Talagrand contraction inequality
    proves uniform local RSC delta L(Delta, theta*) >= kappa_1 ||Delta||_2^2 - kappa_2 ((log p)/n) ||Delta||_1^2
    for all ||Delta||_2 <= 1, yielding ||theta_hat_{lambda_n} - theta*||_2^2 <= c_1 (s log p)/n.
