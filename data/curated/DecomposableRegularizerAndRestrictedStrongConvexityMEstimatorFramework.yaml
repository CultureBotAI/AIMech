id: AIMech:DecomposableRegularizerAndRestrictedStrongConvexityMEstimatorFramework
name: Decomposable Regularizer and Restricted Strong Convexity M-Estimator Framework
concept_kind: mathematical_method
aliases:
- A Unified Framework for High-Dimensional Analysis of M-Estimators with Decomposable Regularizers (Negahban,
  Ravikumar, Wainwright, & Yu 2012)
- Subspace-Decomposable Regularizer and Restricted Strong Convexity M-Estimation Theory
- Star-Shaped Error Constraint Set and Subspace Compatibility Constant Framework
- Negahban-Ravikumar-Wainwright-Yu Decomposable Regularizer M-Estimator Analysis
definition: 'Decomposable Regularizer and Restricted Strong Convexity M-Estimator Framework is a non-asymptotic
  high-dimensional statistical analysis methodology introduced by Negahban, Ravikumar, Wainwright, and
  Yu (2012, Statistical Science 27(4):538-557, DOI:10.1214/12-STS400, arXiv:1010.2731v1/v3) for establishing
  finite-sample consistency and minimax-optimal convergence rates of convex regularized M-estimators theta_hat_{lambda_n}
  in argmin_{theta in R^p} {L(theta; Z_1^n) + lambda_n R(theta)} with convex differentiable loss L and
  norm regularizer R. The framework isolates two coupled structural properties: (1) subspace decomposability
  R(theta + gamma) = R(theta) + R(gamma) for all theta in M and gamma in M_bar^perp across a model subspace
  M subseteq M_bar subseteq R^p and perturbation subspace M_bar^perp := {v in R^p : <u, v> = 0 for all
  u in M_bar} (Definition 1, Equation 3), which under the dual-norm regularization condition lambda_n
  >= 2 R*(nabla L(theta*; Z_1^n)) (Equation 16) forces the estimation error Delta_hat = theta_hat_{lambda_n}
  - theta* into the star-shaped constraint set C(M, M_bar^perp; theta*) := {Delta in R^p : R(Delta_{M_bar^perp})
  <= 3 R(Delta_{M_bar}) + 4 R(theta*_{M^perp})} (Lemma 1, Equation 17; reducing to a cone when theta*
  in M); and (2) restricted strong convexity (RSC) of the first-order Taylor series error delta L(Delta,
  theta*) := L(theta* + Delta) - L(theta*) - <nabla L(theta*), Delta> >= kappa_L ||Delta||^2 - tau_L^2(theta*)
  over C(M, M_bar^perp; theta*) (Definition 2, Equation 19; or over the critical spherical shell K(delta;
  M, M_bar, theta*) = C(M, M_bar^perp; theta*) cap {||Delta|| = delta} in arXiv:1010.2731v1 Equations
  16-19). In terms of the subspace compatibility constant Psi(M_bar) := sup_{u in M_bar \ {0}} R(u)/||u||
  (Definition 3, Equation 21), Theorem 1 (Equation 22) proves the deterministic master bound ||theta_hat_{lambda_n}
  - theta*||^2 <= 9 (lambda_n^2 / kappa_L^2) Psi^2(M_bar) + (lambda_n / kappa_L){2 tau_L^2(theta*) + 4
  R(theta*_{M^perp})}, cleanly separating estimation error and approximation error across coordinate l_1
  sparsity (Corollaries 2-3), block-(1, alpha) group-structured norms (Proposition 1, Corollary 4), generalized
  linear models (Proposition 2, Corollary 5), and nuclear-norm low-rank matrix regression.'
identity_notes: 'Resolved against all 442 pinned AIO records and 622 maintained AIMech records. Distinct
  from AIMech:RandomizedSketchesOfConvexProgramsWithTangentConeGaussianWidthGuarantees (Pilanci & Wainwright
  2015, IEEE Trans. Inf. Theory 61(9):5096-5115, arXiv:1404.7203v1, which analyzes randomized dimensionality-reducing
  sketches min_{x in C} ||S(Ax - y)||_2^2 of a fixed convex program via tangent-cone Gaussian widths W(AK)),
  from AIMech:IterativeHessianSketchForConstrainedLeastSquares (Pilanci & Wainwright 2016, JMLR 17(53):1-38,
  arXiv:1411.0347v1), and from AIMech:NewtonSketchRandomizedHessianProjectedOptimization (Pilanci & Wainwright
  2017, SIAM J. Optim. 27(1):205-245, arXiv:1505.02250v1), as well as from AIO:LassoRegression, AIO:LinearRegression,
  and AIO:LogisticRegression: Negahban, Ravikumar, Wainwright, & Yu (2012, Statistical Science 27(4):538-557,
  arXiv:1010.2731v1/v3) establish the general deterministic and probabilistic theory of high-dimensional
  regularized M-estimators via subspace decomposability R(theta + gamma) = R(theta) + R(gamma) on (M,
  M_bar^perp), dual-norm penalty selection lambda_n >= 2 R*(nabla L(theta*)), the star-shaped error constraint
  set C(M, M_bar^perp; theta*), restricted strong convexity with tolerance tau_L(theta*), and the subspace
  compatibility constant Psi(M_bar).'
