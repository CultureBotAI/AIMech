- claim_id: exact-and-lq-ball-weak-sparsity-lasso-minimax-optimal-rates
  kind: mechanism
  statement: 'For the linear model y = X theta* + w (Equation 26) with column-normalized design ||X_j||_2
    / sqrt(n) <= 1 (Equation 32) and sigma-sub-Gaussian noise w (Equation 33), setting lambda_n = 4 sigma
    sqrt((log p)/n) ensures lambda_n >= 2 ||(1/n) X^T w||_infty with probability at least 1 - c_1 exp(-c_2
    n lambda_n^2). For s-sparse theta* under the restricted eigenvalue condition ||X theta||_2^2 / n >=
    kappa_L ||theta||_2^2 over the cone C(S) = {Delta : ||Delta_{S^c}||_1 <= 3 ||Delta_S||_1} (Equations
    28-29), Corollary 2 (p. 13, Equation 34) proves ||theta_hat_{lambda_n} - theta*||_2^2 <= (64 sigma^2
    / kappa_L^2) (s log p)/n and ||theta_hat_{lambda_n} - theta*||_1 <= (24 sigma / kappa_L) s sqrt((log
    p)/n). For weakly sparse theta* in the l_q-ball B_q(R_q) := {theta in R^p : sum_{i=1}^p |theta_i|^q
    <= R_q} (q in [0, 1]) and designs satisfying ||X theta||_2^2 / n >= kappa_1 ||theta||_2^2 - kappa_2
    ((log p)/n) ||theta||_1^2 (Equation 31, holding with probability at least 1 - c_1 exp(-c_2 n) for
    Sigma-Gaussian ensembles), thresholding at S_eta := {j : |theta*_j| > eta} with eta = lambda_n / kappa_1
    (Equation 37) bounds |S_eta| <= eta^{-q} R_q (Equation 39) and ||theta*_{S_eta^c}||_1 <= R_q eta^{1-q}
    (Equation 40); Lemma 2 (p. 14; proved in v1 Appendix B, pp. 30-31) certifies RSC with kappa_L = kappa_1
    / 4 and tau_L^2(theta*) = 8 kappa_2 ((log p)/n) ||theta*_{S_eta^c}||_1^2, yielding Corollary 3 (Equation
    36): ||theta_hat_{lambda_n} - theta*||_2^2 <= c_0 R_q ((sigma^2 / kappa_1^2) (log p)/n)^{1 - q/2}
    whenever sqrt(R_q)((log p)/n)^{1/2 - q/4} <= 1.'
