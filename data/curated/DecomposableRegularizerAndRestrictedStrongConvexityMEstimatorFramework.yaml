claims:
- claim_id: subspace-decomposability-star-shaped-error-set-and-deterministic-master-bound
  kind: mechanism
  statement: 'Given a subspace pair M subseteq M_bar of R^p and perturbation subspace M_bar^perp := {v
    in R^p : <u, v> = 0 for all u in M_bar} with inner-product norm ||.||, a norm regularizer R is decomposable
    with respect to (M, M_bar^perp) if R(theta + gamma) = R(theta) + R(gamma) for all theta in M and gamma
    in M_bar^perp (Definition 1, Equation 3). Concrete instances include: (1) coordinate l_1 regularization
    R(theta) = ||theta||_1 on M(S) = M_bar(S) = {theta : theta_{S^c} = 0} with dual norm ||v||_infty and
    subspace compatibility constant Psi(M(S)) = sqrt(|S|) (Example 1, Equations 5-6); (2) block-(1, alpha_vec)
    group norms ||theta||_{G, alpha_vec} = sum_{t=1}^{N_G} ||theta_{G_t}||_{alpha_t} on disjoint groups
    G = {G_1, ..., G_{N_G}} with M(S_G) = M_bar(S_G), dual norm max_{t=1,...,N_G} ||v_{G_t}||_{alpha_t*}
    (1/alpha_t + 1/alpha_t* = 1), and Psi(M(S_G)) = sqrt(|S_G|) for alpha_t >= 2 (Example 2, Equations
    7-10, 15); and (3) the nuclear norm |||Theta|||_nuc = sum_j sigma_j(Theta) on R^{p_1 x p_2} with Frobenius
    error norm, where M(U, V) = {Theta : row(Theta) subseteq V, col(Theta) subseteq U} (dim r^2) is strictly
    contained in M_bar(U, V) = (M_bar^perp(U, V))^perp (dim r(p_1 + p_2 - r), rank <= 2r, Psi(M_bar(U,
    V)) = sqrt(min{2r, p_1, p_2})), M_bar^perp(U, V) = {Theta : row(Theta) subseteq V^perp, col(Theta)
    subseteq U^perp}, and R*(N) = |||N|||_op = sigma_1(N) (Example 3, Equations 11-13b). Whenever lambda_n
    >= 2 R*(nabla L(theta*; Z_1^n)) (Equation 16), Lemma 3 (arXiv:1010.2731v1 Appendix A.1, p. 27, Equations
    54-55) proves R(theta* + Delta) - R(theta*) >= R(Delta_{M_bar^perp}) - R(Delta_{M_bar}) - 2 R(theta*_{M^perp})
    and L(theta* + Delta) - L(theta*) >= -(lambda_n / 2)[R(Delta_{M_bar}) + R(Delta_{M_bar^perp})], which
    via F(Delta_hat) <= 0 establishes Lemma 1 (Equation 17): Delta_hat = theta_hat_{lambda_n} - theta*
    belongs to the star-shaped set C(M, M_bar^perp; theta*) := {Delta in R^p : R(Delta_{M_bar^perp}) <=
    3 R(Delta_{M_bar}) + 4 R(theta*_{M^perp})}. Under restricted strong convexity delta L(Delta, theta*)
    >= kappa_L ||Delta||^2 - tau_L^2(theta*) over C(M, M_bar^perp; theta*) (Equation 19), Theorem 1 (p.
    10, Equation 22; proved via Lemma 4 in arXiv:1010.2731v1 Appendix A.2, pp. 28-30, Equations 57-59)
    proves ||theta_hat_{lambda_n} - theta*||^2 <= 9 (lambda_n^2 / kappa_L^2) Psi^2(M_bar) + (lambda_n
    / kappa_L){2 tau_L^2(theta*) + 4 R(theta*_{M^perp})}, and when theta* in M and tau_L(theta*) = 0 (Corollary
    1, v1 Equations 22a-22b / v3 Equations 25a-25b), ||theta_hat_{lambda_n} - theta*|| <= (2 lambda_n
    / kappa_L) Psi(M_bar) and R(theta_hat_{lambda_n} - theta*) <= (6 lambda_n / kappa_L) Psi^2(M_bar).'
