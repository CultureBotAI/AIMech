definition_evidence:
- source_id: method-source
  locator: Sections 2–3, Equations (1)–(2), Theorems 1–2, printed p. 2135 / PDF p. 2
  relation: supports
claims:
- claim_id: method
  kind: mechanism
  statement: Expand the current beam by one token and retain the highest-scoring candidates under a fixed
    beam policy. Do not extend EOS-complete hypotheses. Maintain the best completed hypothesis encountered
    in retained beams. Once that incumbent exists, stop when the maximum current prefix score is at most
    its score. Products of conditional probabilities in [0,1], or their cumulative log probabilities,
    cannot increase with extension, so descendants of retained active prefixes cannot improve the incumbent
    when the inequality holds.
  evidence:
  - source_id: method-source
    locator: Sections 2–3, Equations (1)–(2), Theorems 1–2, printed p. 2135 / PDF p. 2
    relation: supports
- claim_id: score-versus-quality
  kind: limitation
  statement: The unmodified probability objective can favor short translations; the source therefore introduces
    bounded length rewards. The stopping certificate is a search-score statement, not a quality guarantee.
  evidence:
  - source_id: score-versus-quality
    locator: Section 4 and Section 5.2 discussion, printed pp. 2136 and 2138 / PDF pp. 3 and 5
    relation: supports
