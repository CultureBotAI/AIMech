name: Beam decoding with a monotone-score stopping certificate
definition: A layer-based sequence beam decoder that retains the best completed hypothesis seen so far
  and stops when the highest current prefix score cannot exceed that incumbent under a score that never
  increases with extension.
concept_kind: algorithm
identity_notes: This is Huang, Zhao and Ma’s 2017 optimal-ending procedure, with optimality explicitly
  limited by the retained beam. It differs from stopping on a completed top-ranked item without remembering
  earlier completions, from counting completed outputs, and from score-prioritized best-first expansion
  with per-length budgets. No normalized identity match was found across the 442 AIO and 146 prior native
  records; both checkout text searches included ignored and hidden files and returned no matches for the
  selected exact IDs, full labels, aliases and source titles.
limitations:
- The certificate concerns descendants of retained beam prefixes. It does not recover prefixes pruned
  by finite width or guarantee global MAP decoding.
- A non-increasing extension score and a stored completed incumbent are required. Length normalization
  or positive rewards can invalidate the raw-prefix bound and need a different certificate.
- The paper compares stopping times under the same beam evolution and a specific historical top-completed
  baseline. It does not establish universally fastest decoding or current software defaults.
- Better model score does not imply better translation quality; the source reports short-output problems
  under pure probability scoring.
- Finite resource limits, absent EOS completions, empty beams and tie conventions need explicit implementation
  policies. No unconditional finite-time termination claim is made.
id: AIMech:OptimalStoppingBeamDecoding
