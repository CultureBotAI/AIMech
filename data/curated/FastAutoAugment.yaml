claims:
- claim_id: method
  kind: mechanism
  statement: Form repeated stratified train/exploration splits. Train a classifier on each model-training
    split, then hold its weights fixed while exploring augmentation policies on that split’s held-out
    labeled examples. A subpolicy composes image operations with individual application probabilities
    and magnitudes; the published search uses continuous probability and normalized magnitude values in
    [0,1]. Use Bayesian hyperparameter optimization, implemented with a tree-structured Parzen estimator,
    to propose policies according to their predictive scores. The paper frames the goal as maximizing
    augmented-split accuracy and states that its practical objective minimizes categorical cross-entropy.
    Select top policies from each search stage and split, merge their subpolicies, and train the final
    classifier on the full training data with the selected augmentation. The published configuration uses
    two operations per subpolicy and five subpolicies per candidate policy, but these are protocol choices.
    The method uses classifier predictions as a proxy for matching distributions; it does not directly
    compute a distributional divergence. Its essential efficiency distinction is reuse of fixed model
    weights during candidate scoring, while initial and final classifier training are still required.
  evidence:
  - source_id: method-source
    locator: Section 3, Equations (1)–(4), Figure 2 and Algorithm 1, PDF pp. 3–6; Section 4 setup on p.
      6
    relation: supports
- claim_id: implementation-profile
  kind: mechanism
  statement: 'The pinned search.py evaluates a saved model in evaluation mode on multiple stochastic augmented
    views of held-out examples. For non-singleton validation batches, its default top1_valid reward is
    the mean indicator that any view of each example is classified correctly. Its logged minus_loss has
    a different reduction: each unreduced cross-entropy array has shape(batch,), concatenation flattens
    views and examples into one vector, and min(axis=0) yields one minimum for the whole batch. The Accumulator
    sums the negatives of those batch-wide scalar minima and divides by the total example count. This
    is neither ordinary mean cross-entropy nor a mean of per-example best-view losses. Search and selection
    use top1_valid by default, not this logged loss. data.py samples a subpolicy for each image and keeps
    baseline training transforms for these held-out views. The active augment_list(False) contains 15
    operations, with SamplePairing commented out, while the paper lists 16. The inspected search loop
    performs one repetition per split rather than the paper’s reported two. These are version-specific
    conventions, not silently combined definitions.'
  evidence:
