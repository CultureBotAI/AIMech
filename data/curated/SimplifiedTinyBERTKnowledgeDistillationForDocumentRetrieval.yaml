claims:
- claim_id: simplified-tinybert-one-step-joint-hard-and-intermediate-loss
  kind: mechanism
  statement: Simplified TinyBERT merges the two task-specific distillation steps of TinyBERT into a single joint objective L = L_attn + L_hidn + L_emb + L_soft (Equation 1) and incorporates ground-truth binary relevance cross-entropy L_hard over balanced query-passage pairs (constructed by reserving the top-5 teacher-scored passages from relevant documents as positives and sampling negatives from irrelevant documents) to optimize L_h = L_attn + L_hidn + L_emb + L_soft + L_hard (Equation 2).
  evidence:
  - source_id: r797-primary-pdf
    locator: Section 3.1 (Method) & Section 4.1 (Data preprocessing), pp. 3-5, Equations (1)-(2)
    relation: supports
  - source_id: r797-primary-pdf
    locator: simplified_tinybert_loss and filter_positive_passages_by_teacher verification
    relation: supports
- claim_id: simplified-tinybert-training-time-reduction
  kind: mechanism
  statement: 'Merging the two task-specific distillation steps into a single step reduces second-stage training time on 3.3M MS MARCO query-passage pairs by 42%-52% across student configurations: from 29.95h to 14.37h (2.08x) for L6_H768, from 20.45h to 11.30h (1.81x) for L6_H384, from 18.93h to 10.05h (1.88x) for L3_H768, and from 15.87h to 9.22h (1.72x) for L3_H384 (Table 3).'
  evidence:
  - source_id: r797-primary-pdf
    locator: Section 4.2 (Simplified TinyBERT can be trained faster, Table 3), p. 6
    relation: supports
  - source_id: r797-primary-pdf
    locator: second-stage training time savings verification
    relation: supports
- claim_id: simplified-tinybert-ms-marco-and-trec-dl-15x-speedup
  kind: application
  statement: When distilling BERT-Base (L12_H768, 109M parameters, 22.9G FLOPs) on MS MARCO document ranking with BERT-MaxP aggregation, Simplified TinyBERT improves the 6-layer student L6_H768 (2x speedup) to 0.3848 MRR@10 on MS MARCO Dev and 0.6774 NDCG@10 on TREC 2019 DL Test, and enables the 3-layer student L3_H384 (17M parameters, 1.5G FLOPs, 15x speedup) to achieve 0.3614 MRR@10 on MS MARCO Dev and 0.6698 NDCG@10 on TREC 2019 DL Test, significantly outperforming both standard TinyBERT (0.3453 MRR@10, 0.6230 NDCG@10) and the 12-layer BERT-Base teacher (0.3523 MRR@10, 0.6644 NDCG@10, Table 1 & Table 2).
  evidence:
  - source_id: r797-primary-pdf
    locator: Section 4.2 (Results), pp. 4-6, Tables 1-2
    relation: supports
- claim_id: simplified-tinybert-general-distillation-and-large-pair-requirement
  kind: limitation
  statement: When student hidden dimensions differ from the teacher (such as H=384 in L3_H384 vs. H=768 in BERT-Base), Simplified TinyBERT still requires a 3-epoch general distillation stage over 3.5 GB of English Wikipedia text prior to task-specific distillation and relies on millions of teacher-scored query-passage pairs (3.3M pairs) for convergence.
  evidence:
  - source_id: r797-primary-pdf
    locator: Section 3.1-3.2 & Section 4.1 (Dataset), pp. 3-5
    relation: supports
