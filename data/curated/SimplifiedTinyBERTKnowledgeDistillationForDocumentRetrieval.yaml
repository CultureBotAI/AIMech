id: AIMech:SimplifiedTinyBERTKnowledgeDistillationForDocumentRetrieval
name: Simplified TinyBERT (Knowledge Distillation for Document Retrieval)
concept_kind: learning_paradigm
review_status: DRAFT
definition: A knowledge distillation method for passage-level BERT-MaxP document re-ranking (Chen, He, Hui, Sun, & Sun, ECIR 2021) that simplifies TinyBERT's two-step task-specific distillation stage by (1) merging intermediate-layer distillation (attention MSE L_attn, hidden-state MSE L_hidn, and embedding MSE L_emb) and prediction-layer soft-label cross-entropy distillation (L_soft) into a single joint optimization step L = L_attn + L_hidn + L_emb + L_soft, and (2) adding ground-truth hard-label cross-entropy L_hard over teacher-filtered positive and negative document passages to form L_h = L_attn + L_hidn + L_emb + L_soft + L_hard, reducing task-specific distillation time by 42%-52% while enabling a 15x faster 3-layer student (L3_H384) to outperform its 12-layer BERT-Base teacher.
identity_notes: "Distinct from original TinyBERT (Jiao et al., 2020, which splits task-specific distillation into two sequential steps\u2014first optimizing L_attn + L_hidn + L_emb and then optimizing L_soft alone without hard labels) and from Margin-MSE (AIMech:MarginMSECrossArchitectureKnowledgeDistillationForNeuralRanking, which distills pairwise score margins across heterogeneous ranking architectures without intermediate layer matching). Simplified TinyBERT jointly optimizes all five losses L_h = L_attn + L_hidn + L_emb + L_soft + L_hard in one task-specific step over top-5 teacher-filtered positive passages per relevant document."
aliases:
- Simplified TinyBERT
- Simplified TinyBERT for Document Retrieval
- One-Step Hard-Label TinyBERT Distillation for Document Ranking
