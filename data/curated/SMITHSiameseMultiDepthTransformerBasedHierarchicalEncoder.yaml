id: AIMech:SMITHSiameseMultiDepthTransformerBasedHierarchicalEncoder
name: 'SMITH: Siamese Multi-depth Transformer-based Hierarchical Encoder for Long-Form Document Matching'
concept_kind: architecture
review_status: DRAFT
definition: A two-tower Siamese ('Dual-Encoder') hierarchical Transformer architecture for long-to-long document semantic matching (Yang, Zhang, Li, Bendersky, & Najork, CIKM 2020) that packs natural sentences into L_d sentence blocks {S_1, ..., S_{L_d}} of max length L_s via greedy sentence filling, encodes tokens within each block using an L_1-layer sentence-level Transformer to extract L2-normalized block [CLS] embeddings h_i in R^H, contextualizes {h_1, ..., h_{L_d}} with an L_2-layer document-level Transformer to produce L2-normalized document embeddings E(d_s), E(d_c) scored by cosine similarity cos(E(d_s), E(d_c)), and pre-trains jointly with masked word prediction and dynamic in-batch masked sentence block contrastive prediction L_pretrain = L_sp + L_wp.
identity_notes: Distinct from cross-encoder passage aggregation rankers such as PARADE (AIMech:PARADEPassageRepresentationAggregationForDocumentReranking, which jointly encodes query-passage pairs) and from RNN-based hierarchical document matchers such as HAN and SMASH RNN. SMITH is a representation-focused Siamese dual encoder supporting offline vector indexing up to 2,048 tokens, reducing self-attention memory complexity from O(b * A * L * N^2) to O(b * A * L * (L_s * N + (N / L_s)^2)) via greedy sentence filling and two-level Transformers.
aliases:
- SMITH Hierarchical Document Matching Encoder
- Siamese Multi-depth Transformer-based Hierarchical Encoder
- SMITH Dual-Encoder for Long-Form Document Matching
