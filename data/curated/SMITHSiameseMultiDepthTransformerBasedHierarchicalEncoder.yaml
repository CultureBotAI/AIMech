claims:
- claim_id: smith-greedy-sentence-filling-and-two-level-transformer-mechanism
  kind: mechanism
  statement: SMITH splits a document of length N into L_d = N / L_s blocks of max length L_s by greedily packing complete natural sentences into each block until adding the next sentence would exceed L_s, encodes each block with an L_1-layer sentence-level Transformer, and feeds the L2-normalized block representations plus block position embeddings into an L_2-layer document-level Transformer, reducing attention memory complexity from O(b * A * L * N^2) to O(b * A * L * (L_s * N + (N / L_s)^2)) (Eq. 3).
  evidence:
  - source_id: r790-primary-pdf
    locator: Section 4.1.1-4.1.3, Equations (1)-(3), Figures 2-3, pp. 4-6
    relation: supports
  - source_id: r790-primary-pdf
    locator: greedy_sentence_filling, count_padding_tokens, and smith_attention_memory_ops verification
    relation: supports
- claim_id: smith-dynamic-masked-sentence-block-pretraining-mechanism
  kind: mechanism
  statement: During unsupervised pre-training, SMITH dynamically masks m randomly sampled sentence block vectors h_k per document with a learned mask vector h_hat, predicts contextual block vectors S_hat_j from the document-level Transformer, and minimizes the in-batch softmax cross-entropy L_sp = -(1/B) sum_{i=1}^B log(exp(S_hat_i h_i^T) / sum_{r=1}^B exp(S_hat_i h_r^T)) over all B = b * m masked blocks jointly with masked word prediction L_pretrain = L_sp + L_wp (Eqs. 4-7).
  evidence:
  - source_id: r790-primary-pdf
    locator: Section 4.2.1-4.2.2, Equations (4)-(7), p. 6
    relation: supports
  - source_id: r790-primary-pdf
    locator: masked_sentence_block_loss verification
    relation: supports
- claim_id: smith-siamese-no-early-cross-document-token-interaction-limitation
  kind: limitation
  statement: Because SMITH is a representation-focused Siamese dual encoder that encodes source and candidate documents independently into single vectors for offline ANN indexing, it cannot perform early token-by-token cross-attention between the two documents and requires tuning sentence-level Transformer depth L_1 against intermediate activation memory costs.
  evidence:
  - source_id: r790-primary-pdf
    locator: Section 2, p. 3; Section 5.2.1, p. 8; Section 5.5, Table 6, p. 9
    relation: supports
