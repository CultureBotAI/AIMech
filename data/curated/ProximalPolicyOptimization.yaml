name: Proximal policy optimization
definition: A family of policy-gradient algorithms alternating collected interaction data with repeated
  optimization of a surrogate objective using clipping or an adaptive KL penalty.
concept_kind: algorithm
identity_notes: PPO is a policy-optimization algorithm family. It is distinct from the broad reinforcement-learning
  task and from DPO's direct preference-fitting objective; PPO is not synonymous with its clipped variant
  alone.
aio_mappings:
- target: AIO:ReinforcementLearning
  relation: related_match
  rationale: PPO is a particular policy-gradient procedure within reinforcement-learning practice; the
    AIO class denotes the broader task.
limitations:
- Clipping the surrogate objective is not an explicit hard bound on all policy changes.
- The record covers the original clipped and KL-penalized variants without asserting task-independent
  performance.
id: AIMech:ProximalPolicyOptimization
