claims:
- claim_id: mechanism
  kind: mechanism
  statement: The clipped variant takes the minimum of unclipped and clipped probability-ratio advantage
    terms; another variant uses an adaptive KL-divergence penalty, and the algorithm performs multiple
    minibatch epochs on collected trajectories.
