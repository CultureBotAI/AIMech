claims:
- claim_id: method
  kind: mechanism
  statement: Compute global spatial average and maximum descriptors for every channel. Pass both through
    the same two-layer bottleneck MLP, with ReLU after its reduction layer, sum the resulting channel
    logits and apply sigmoid. Broadcast the channel weights over space and multiply them into the input
    tensor. From this channel-refined tensor, compute average and maximum maps over the channel axis,
    concatenate these two spatial maps, apply a convolution with a 7-by-7 kernel and sigmoid, then multiply
    the spatial weights across all channels. Thus the second attention stage depends on the output of
    the first, rather than being computed in parallel from the original tensor. The paper’s residual example
    applies the component before skip addition; the learned component also operates during inference.
  evidence:
  - source_id: method-source
    locator: Section3, Equations1–3 and Figure2, PDF pp.4–6; residual placement Figure3, PDFp.7; arrangement
      discussion PDFp.9; interpretability scope Sections4.3–4.4, PDF pp.10–13; conclusion PDFp.14
    relation: supports
  - source_id: pinned-code
    locator: ChannelGate, ChannelPool, SpatialGate, BasicConv and CBAM classes, complete MODELS/cbam.py
      at the cited commit
    relation: supports
- claim_id: implementation-convention
  kind: scope
  statement: The pinned author implementation follows channel-then-spatial gating with average/max channel
    descriptors sharing one MLP. Its spatial path uses a bias-free 7-by-7 convolution followed by batch
    normalization and sigmoid, with no intervening ReLU. Optional pooling choices and no_spatial are exposed
    as code configurations. This static inspection does not establish runtime compatibility or reproduction
    of a trained checkpoint.
  evidence:
  - source_id: pinned-code
    locator: ChannelGate.forward, SpatialGate.__init__/forward, BasicConv and CBAM.forward in MODELS/cbam.py
    relation: supports
