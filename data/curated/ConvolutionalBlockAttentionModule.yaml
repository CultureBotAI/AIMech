name: Convolutional Block Attention Module
definition: A convolutional feature refinement component that sequentially applies learned channel attention
  and then spatial attention to an intermediate feature tensor.
concept_kind: layer
identity_notes: This record covers the canonical channel-first CBAM configuration from the 2018 paper.
  It is a reusable component rather than a complete CNN, detector or gradient-based explanation method.
  Spatial-first, parallel, channel-only and alternative pooling configurations are separately assessed
  variants, not silent replacements of this selected procedure. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 279 preceding native IDs/names/aliases. Full-checkout
  fixed-string searches included ignored and hidden files in worktree and main, returning 6 and 6 lines
  respectively. Every text hit was a prior candidate lead or a closely related variant lead. Seven exact
  AIO CLASS nodes with scoped synonyms/comments and outgoing edges and three native neighboring mechanisms
  were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- Average and maximum channel descriptors share the same MLP parameters. The sum occurs before sigmoid,
  not between independently sigmoid-normalized channel weights. Spatial pooling runs over channels, whereas
  the channel stage pools over spatial positions.
- Reversing the stages or computing both from the original input generally changes the transformation.
  The spatial kernel and reduction ratio were selected empirically; the pinned implementation exposes
  alternative pooling and a channel-only switch, which are not the canonical configuration asserted here.
- Independent sigmoid gates need not sum to one. Each multiplicative gate attenuates immediate feature
  magnitude; relative emphasis is not an absolute amplification guarantee. The learned weights add parameters
  and computation.
- The source’s Grad-CAM visualizations and selected-image user study do not certify causal faithfulness,
  calibrated object probabilities or universal interpretability. CBAM itself is not Grad-CAM or a complete
  object detector, and no benchmark improvement or hardware-independent speed claim is curated.
