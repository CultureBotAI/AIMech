name: Hierarchical log-bilinear language model
definition: A next-word language architecture that computes one linear context feature vector and uses
  its dot products with internal-node vectors to assign normalized vocabulary-tree probabilities, summing
  path probabilities when a word has multiple codes.
concept_kind: architecture
identity_notes: 'This is Mnih and Hinton’s 2008 HLBL architecture, not a synonym for every hierarchical
  language model or the hierarchical-softmax component. It combines a position-weighted linear context
  representation with learned node vectors. Flat LBL, Morin–Bengio’s node-conditioned nonlinear network,
  and the tree-building algorithm each have distinct scopes. One-code and multiple-code forms are explicitly
  part of the source’s model family. All 442 pinned AIO labels/scoped synonyms and 355 preceding native
  IDs/names/aliases were compared, with no normalized identity match. Full-checkout fixed-string searches
  included ignored and hidden files in both worktree and main, returning 54 lines each. All 41 unique
  matched contents were read: source references, complete-model contrasts, frontier leads and prior review
  context for the hierarchical-softmax component. None is an existing record for these complete architectures.
  Twenty exact AIO nodes and their generated records plus four complete native neighbors were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.'
limitations:
- The linear context feature is reusable across nodes; it does not include Morin–Bengio’s node-dependent
  tanh hidden computation. A diagonal transform is a restriction on the model parameters, not a requirement
  for the general probability construction.
- The tree defines its own normalized distribution and need not reproduce flat-LBL probabilities for matching-looking
  parameters. Tree choice and finite context constrain the representation.
- Target cost includes context computation plus the visited path nodes. Multiple codes require their summed
  probability and increase work; a general adaptive or full binary tree need not have logarithmic worst-case
  depth. Reporting every word probability requires at least linear output work.
- Multiple codes need not represent distinct senses. The source’s discussion reports that replicated words
  were often rare or difficult to cluster and notes that averaging their contexts can lose multimodal
  usage structure.
- The paper’s mean-code-length statistic sums lengths over all codes of a word before frequency weighting;
  treating it as the mean of that word’s code lengths would understate its reported evaluation work.
- No universal semantic clustering quality, speedup, predictive advantage, convergence guarantee or author
  implementation behavior is asserted. The tree-building procedure is described as architectural context,
  not separately curated as an equivalent model.
