claims:
- claim_id: method
  kind: mechanism
  statement: Using the 2008 column-vector convention, form r_hat=sum_i C_i r_context_i once for the preceding
    words. At internal node j, assign left-branch probability sigmoid(r_hat^T q_j+b_j) and use its complement
    for the right branch. Multiply the decisions along a leaf code. With one leaf per word this is its
    probability; with multiple codes, sum all disjoint leaf probabilities assigned to that word. Optimize
    the penalized observed-word log likelihood. For multiple codes, differentiating the log of that sum
    weights each path gradient by its posterior share of the word’s probability; choosing one path or
    averaging their log losses is a different objective. The paper uses diagonal C_i to reduce context-transformation
    cost. Its data-driven trees bootstrap features from a random-tree model and represent each word by
    the mean predicted context feature at its occurrences before recursive clustering; balanced, adaptive
    and multiple-code tree policies are distinct choices.
