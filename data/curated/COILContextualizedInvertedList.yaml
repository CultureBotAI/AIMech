id: AIMech:COILContextualizedInvertedList
name: COIL Contextualized Inverted List
concept_kind: architecture
review_status: DRAFT
definition: A contextualized exact lexical match retrieval architecture and inverted-list index structure that encodes document tokens offline with a pretrained Transformer language model into low-dimensional contextualized vectors v_j^d = W_tok LM(d, j) + b_tok in R^{n_t} grouped by surface token t in V into contextualized inverted lists I^t = {v_j^d | d_j = t, d in C}, and at query time encodes query tokens into v_i^q = W_tok LM(q, i) + b_tok to traverse only the inverted lists J = {I^t | t in q} of overlapping terms and compute the contextualized exact token match score s_tok(q, d) = sum_{q_i in q cap d} max_{d_j = q_i} (v_i^q)^T v_j^d (COIL-tok), optionally augmented with a projected [CLS] dot-product score s_full(q, d) = s_tok(q, d) + (v_cls^q)^T v_cls^d (COIL-full) to mitigate vocabulary mismatch.
identity_notes: Distinct from classical bag-of-words inverted-list retrievers such as BM25 and scalar LM term-weighting methods such as DeepCT (Dai & Callan, SIGIR 2019, equivalent to n_t = 1 scalar term importance without context-dependent vector similarity); distinct from single-vector dense retrievers such as DPR (AIMech:DensePassageRetrieval), which rely solely on global [CLS] matching without token-level exact match; and distinct from ColBERT (Khattab & Zaharia, SIGIR 2020, AIMech:ColBERTContextualizedLateInteraction), which computes Cartesian all-to-all soft MaxSim across all query and document token vectors rather than traversing inverted lists of exact overlapping surface tokens.
aliases:
- COIL
- Contextualized Inverted List
- COIL-tok and COIL-full
- COIL Contextualized Exact Lexical Match Architecture
