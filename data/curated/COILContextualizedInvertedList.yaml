claims:
- claim_id: r743-claim-contextualized-exact-match-scoring
  kind: mechanism
  statement: COIL projects Transformer token states of dimension n_lm = 768 down to n_t (e.g., n_t = 32 or 8) via v_i^q = W_tok LM(q, i) + b_tok and v_j^d = W_tok LM(d, j) + b_tok, scoring only overlapping surface tokens q_i in q cap d via max-pooled dot products s_tok(q, d) = sum_{q_i in q cap d} max_{d_j = q_i} (v_i^q)^T v_j^d so polysemous mentions (such as 'cabinet' in government vs. kitchen cupboard contexts, scoring 16.75 vs. 7.23) are disambiguated in token-specific embedding spaces.
  evidence:
  - source_id: r743-primary-pdf
    locator: Section 3.2 & Section 5.3, Equations 3-5, Table 4, pp. 4, 8-9
    relation: supports
- claim_id: r743-claim-blas-inverted-list-and-cls-hybrid
  kind: mechanism
  statement: COIL stacks the contextualized mention vectors in each token's inverted list I^t = {v_j^d | d_j = t, d in C} into a contiguous matrix M in R^{n_t x |I^t|} so query-time traversal of J = {I^t | t in q} (|J| << |I|) executes as parallel BLAS matrix-vector products followed by max-scatter and sort, while COIL-full adds a projected [CLS] inner product (v_cls^q)^T v_cls^d (with n_c = 768 or 128) to bridge vocabulary mismatch.
  evidence:
  - source_id: r743-primary-pdf
    locator: Section 3.2-3.3 & Appendix A.1-A.2, Equations 6-9, Figures 3-5, pp. 3-5, 12-13
    relation: supports
- claim_id: r743-claim-msmarco-trec-dl-application
  kind: application
  statement: On MS MARCO Passage retrieval, COIL-tok (n_t = 32) achieves 0.341 Dev MRR@10 and 0.660 TREC DL 2019 NDCG@10 (outperforming BM25 at 0.184, DeepCT at 0.243, DocT5Query at 0.278, and Dense at 0.304), while COIL-full (n_c = 768, n_t = 32) reaches 0.355 Dev MRR@10, 0.963 Recall@1K, and 0.704 DL2019 NDCG@10 (and 0.397 Dev MRR@10 / 0.636 DL2019 NDCG@10 on MS MARCO Document ranking), with compressed COIL-full (n_c = 128, n_t = 8) running in 113ms CPU / 21ms GPU and COIL-tok (n_t = 8) in 55ms CPU / 16ms GPU.
  evidence:
  - source_id: r743-primary-pdf
    locator: Section 5.1-5.2, Tables 1-3, pp. 6-8
    relation: supports
- claim_id: r743-claim-vocabulary-mismatch-and-index-limitation
  kind: limitation
  statement: Pure exact-match COIL-tok (n_c = 0) cannot match query and document terms that have no surface lexical overlap (scoring 0.341 MRR@10 and 0.949 Recall@1K vs. 0.355 MRR@10 and 0.963 Recall@1K for COIL-full), and storing multi-dimensional vector postings for every token mention in the corpus (~500M token mentions in MS MARCO passage) increases index memory compared to scalar BM25 inverted lists.
  evidence:
  - source_id: r743-primary-pdf
    locator: Section 3.2, Section 5.1, & Section 5.2, Tables 1 and 3, pp. 4, 6-8
    relation: supports
