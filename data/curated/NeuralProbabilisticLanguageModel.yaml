name: Neural probabilistic language model
definition: A neural finite-context language architecture that jointly learns a shared word-embedding
  lookup and a nonlinear predictor of the next-word distribution using concatenated context embeddings
  and a vocabulary softmax.
concept_kind: architecture
identity_notes: 'This record is scoped to Bengio, Ducharme, Vincent and Jauvin’s published 2003 architecture,
  especially its tanh feed-forward formulation with optional direct input-to-output weights. It does not
  designate every neural probabilistic model of language, or assert historical priority over the earlier
  work acknowledged by the paper. It differs from LBL’s tied bilinear output embeddings and Morin–Bengio’s
  tree-node-conditioned nonlinear predictor. All 442 pinned AIO labels/scoped synonyms and 358 preceding
  native IDs/names/aliases were compared, with no normalized identity match. Full-checkout fixed-string
  searches included ignored and hidden files in both worktree and main, returning 33 lines each. All 24
  unique matched contents were read: LBL source references and model contrasts, discovery leads and saved
  review context. These do not constitute existing candidate records. All 85 semantic label/synonym hits
  and 22 exact AIO nodes were inspected, alongside corresponding generated records and four complete native
  neighbors. Previously read contextual files were checked for byte identity. Absence is bounded to this
  snapshot and inspected neighborhood.'
limitations:
- The specified feed-forward formulation has a finite context window and a fixed vocabulary. It is not
  a recurrent state model or a tree-normalized output architecture.
- The flat vocabulary softmax incurs vocabulary-dependent computation even when only the observed next-word
  likelihood is required. Joint learning is nonconvex and does not guarantee optimality or universally
  meaningful semantic distances.
- An input-embedding row absent from an example’s context has zero gradient from that example’s likelihood,
  even if its word is the target. This statement excludes regularization, which can still affect unused
  rows. Output-word parameters remain separate and can receive gradients.
- 'Sharing the lookup matrix does not discard context order: concatenation places embeddings in different
  slots with distinct subsequent weights. Optional direct weights change the parameterization but not
  probability normalization.'
- The paper warns that regularizing W and H without C can permit a compensating growth of embedding scale.
  Smooth feature sharing motivates generalization, but does not prove correct probabilities for every
  unseen combination. No benchmark superiority or author-code behavior is certified.
