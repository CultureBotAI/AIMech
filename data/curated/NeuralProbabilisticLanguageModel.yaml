claims:
- claim_id: method
  kind: mechanism
  statement: Look up each preceding word in a shared matrix C and concatenate the n-1 context embeddings
    in their specified positions into x. Compute vocabulary logits y=b+W x+U tanh(d+H x), where direct
    weights W may be set to zero. Apply the vocabulary softmax and multiply next-word conditionals to
    obtain sequence probabilities under the chosen context convention. Jointly optimize the embeddings
    and network parameters by stochastic gradient ascent on the corpus log likelihood with regularization;
    a weight-decay term added to a maximized objective has the negative penalty sign. The input embedding
    lookup is shared across context positions, while the output matrices and biases are separately learned
    parameters. Contributions from repeated appearances of the same context word accumulate in its embedding
    row. The paper also discusses mixing the resulting predictions with an interpolated trigram model,
    which is an additional ensemble choice.
