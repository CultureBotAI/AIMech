id: AIMech:FedCurvFisherInformationRegularizedFederatedLearning
name: FedCurv (Fisher-Information-Regularized Federated Learning for Non-IID Data)
concept_kind: algorithm
review_status: DRAFT
definition: 'A curvature-regularized federated learning algorithm (Shoham et al. 2019, Section 3, Equations 1-5) that mitigates catastrophic forgetting across statistically heterogeneous (non-IID) clients by augmenting each client s''s local empirical loss L_s(theta) in round t with an Elastic Weight Consolidation (EWC) quadratic penalty weighted by the diagonal empirical Fisher information matrices diag(I_{t-1,j}) of all other participating clients j in S \ {s}: L~_{t,s}(theta) = L_s(theta) + lambda * sum_{j in S \ {s}} (theta - theta^hat_{t-1,j})^T diag(I_{t-1,j}) (theta - theta^hat_{t-1,j}) (Equation 4), decoupled for linear communication overhead into aggregated server statistics P_{t-1} = sum_{j in S} diag(I_{t-1,j}) and Q_{t-1} = sum_{j in S} diag(I_{t-1,j}) theta^hat_{t-1,j} via L~_{t,s}(theta) = L_s(theta) + lambda * theta^T (P_{t-1} - diag(I_{t-1,s})) theta - 2*lambda * theta^T (Q_{t-1} - diag(I_{t-1,s}) theta^hat_{t-1,s}) + const (Equation 5).'
identity_notes: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization, Li et al. 2020), which penalizes isotropic Euclidean distance (mu/2)*||theta - w^{t-1}||_2^2 around the scalar-averaged global model without parameter-wise Fisher curvature weighting or peer-model decoupling; and distinct from FFL-ERL / Fisher-weighted server model fusion, as FedCurv applies the peer-summed diagonal Fisher quadratic regularizer directly during local client SGD optimization via aggregated server vectors (P_{t-1}, Q_{t-1}).
aliases:
- FedCurv
- Fisher-Information-Regularized Federated Learning
- Federated Curvature Regularization
- EWC-Regularized Federated Learning
