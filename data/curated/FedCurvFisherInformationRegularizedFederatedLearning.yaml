claims:
- claim_id: r452-decoupled-fisher-quadratic-penalty-mechanism
  kind: mechanism
  statement: Rewrites the pairwise peer Fisher penalty sum_{j in S \ {s}} (theta - theta^hat_{t-1,j})^T diag(I_{t-1,j}) (theta - theta^hat_{t-1,j}) (Equation 4) into the algebraically identical decoupled form theta^T (P_{t-1} - diag(I_{t-1,s})) theta - 2 * theta^T (Q_{t-1} - diag(I_{t-1,s}) theta^hat_{t-1,s}) + const (Equation 5), reducing per-round communication from O(|S|) vectors per client to exactly 3 parameter-sized vectors (model parameters plus two Fisher summary vectors) independent of the number of clients.
  evidence:
  - source_id: r452-primary-pdf
    locator: Section 3 Equations 4-5, p. 3
    relation: supports
- claim_id: r452-laplace-posterior-multi-task-scope
  kind: scope
  statement: Interprets each communication round of non-IID federated learning as distributed multi-task continual learning under a diagonal Laplace approximation of the joint log-posterior log p(theta | D) (Equations 1-3), preventing local SGD steps with large local epoch counts E from overwriting parameters with high Fisher information on other clients' data.
  evidence:
  - source_id: r452-primary-pdf
    locator: Section 3 Equations 1-4 & Section 4 Experimental Results, pp. 2-5
    relation: supports
- claim_id: r452-diagonal-fisher-approximation-and-communication-factor-limitation
  kind: limitation
  statement: Approximates each client's local Hessian by the diagonal of the empirical Fisher information matrix diag(I_{t,s}), omitting off-diagonal parameter correlations, and increases per-round communication bandwidth by a factor of up to 3 compared to vanilla FedAvg (reduced to 2 in round-initial Fisher evaluation variants).
  evidence:
  - source_id: r452-primary-pdf
    locator: Section 3 Bandwidth Reduction Discussion & Section 5 Conclusions, pp. 3-5
    relation: supports
- claim_id: r452-non-iid-classification-communication-reduction-application
  kind: application
  statement: Applied to non-IID federated image classification where each client holds examples from only a strict subset of classes, reducing the communication rounds required to reach target test accuracy under large local epoch budgets.
  evidence:
  - source_id: r452-primary-pdf
    locator: Section 4 Experimental Results (Figures 1-3, Table 1), pp. 4-5
    relation: supports
