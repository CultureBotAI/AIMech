id: AIMech:ResilientBackpropagation
name: Resilient backpropagation
definition: A gradient-based optimization method that adapts coordinate step sizes using successive gradient
  signs and takes sign-directed parameter steps.
concept_kind: algorithm
identity_notes: Rprop is an optimizer using backpropagated gradients, not the backpropagation procedure
  for computing those gradients. Update magnitude is controlled by step size rather than current gradient
  magnitude.
definition_evidence:
- source_id: pytorch-docs
  locator: Rprop.__doc__, algorithm lines 169–203
  relation: supports
claims:
- claim_id: update-rule
  kind: mechanism
  statement: Repeated gradient signs increase a coordinate's bounded step size, while a sign reversal
    decreases it; in the cited variant the reversal also suppresses that coordinate's current update.
  evidence:
  - source_id: pytorch-docs
    locator: Rprop.__doc__, algorithm lines 169–203
    relation: supports
