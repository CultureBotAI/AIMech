id: AIMech:GlfcGlobalLocalForgettingCompensationForFederatedClassIncrementalLearning
name: GLFC (Global-Local Forgetting Compensation)
concept_kind: algorithm
review_status: DRAFT
definition: GLFC (Global-Local Forgetting Compensation) is a federated class-incremental learning (FCIL) algorithm that mitigates both local catastrophic forgetting caused by client class imbalance between old and new classes and global catastrophic forgetting caused by non-i.i.d. cross-client class distributions by combining (1) a local class-aware gradient compensation loss L_GC that normalizes per-sample binary cross-entropy by separate old-class and new-class average gradient magnitudes (G_o and G_n), (2) a class-semantic relation distillation loss L_RD that aligns current predictions P_l^t(X_{lb}^t, Theta_l^{r,t}) with hybrid targets Y_l^t(X_{lb}^t, Theta_l^{t-1}) incorporating soft old-class probabilities from the globally selected best old model Theta^{t-1}, and (3) a proxy server S_P that detects task transitions via local prediction entropy jumps and selects Theta^{t-1} using perturbed prototype gradients nabla Gamma_{lc}.
identity_notes: Introduced by Jiahua Dong, Lixu Wang, Zhen Fang, Gan Sun, Shichao Xu, Xiao Wang, and Qi Zhu in 'Federated Class-Incremental Learning' (CVPR 2022, pp. 10154-10163, DOI:10.1109/CVPR52688.2022.00992; arXiv:2203.11473). Distinct from FedWeIT (Yoon et al. ICML 2021), which addresses task-incremental federated continual learning with known task IDs at test time and parameter decomposition into masked base weights and sparse task-adaptive weights rather than single-head class-incremental learning; and distinct from centralized class-incremental learning methods (iCaRL, Rebuffi et al. CVPR 2017; PODNet, Douillard et al. ECCV 2020), which assume a single centralized exemplar store without heterogeneous client groups S_o, S_b, S_n or proxy-server prototype gradient reconstruction.
aliases:
- GLFC
- Global-Local Forgetting Compensation
- Global-Local Forgetting Compensation for Federated Class-Incremental Learning
