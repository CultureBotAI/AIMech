    is broader across its feed-forward, sequential and spatial instantiations.
- target: AIO:LongShortTermMemory
  relation: related_match
  rationale: The grid generalizes LSTM memory transforms across computational axes. The pinned target
    specifically denotes a recurrent network processing sequences; this relation does not assert that
    every one-dimensional feed-forward Grid LSTM instance has that narrower temporal scope.
limitations:
- Distinct dimensional memories remain coupled through hidden-state computations; separate memory streams
  are not independent networks.
- Optional non-LSTM axes, priority schedules and parameter-tying choices remain explicit variants, not
  interchangeable aliases.
- The printed output-gate convention and inconsistent character-model parameter counts are recorded without
  inferring unseen implementation details.
- Fixed-length tests, finite stopping samples, different comparison protocols and task-specific ensembles
  limit generalization claims. All fifteen pages of arXiv1507.01526v3 were visually read; no author code,
  other versions, training or benchmark replication. DRAFT remains.
