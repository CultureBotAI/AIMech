claims:
- claim_id: method
  kind: mechanism
  statement: For each selected minority-class training example, find a configured number k of nearest
    neighbors within the minority class and randomly choose neighbors according to the requested oversampling
    amount. In the prose and Table1 formulation, construct a synthetic vector as the original vector plus
    a random fraction between zero and one of the neighbor-minus-original vector, retaining the minority-class
    label. The paper uses k=5 in its implementation, but k and the oversampling amount are parameters.
    Its pseudocode treats percentages below100 by selecting a random subset of minority examples; higher
    amounts are expressed as integral multiples of100. Majority-class undersampling is a separately described
    operation that may be combined with SMOTE, not a required step of synthetic generation.
