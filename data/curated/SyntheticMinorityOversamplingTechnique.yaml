name: Synthetic Minority Over-sampling Technique
definition: A minority-class oversampling method that generates synthetic labeled feature vectors by interpolating
  between an observed minority example and selected neighbors from the same class.
concept_kind: preprocessing_method
identity_notes: This record denotes the original continuous-feature SMOTE method. It generates training
  examples rather than fitting a classifier. It differs from replacement sampling, majority undersampling,
  cross-class input/label mixing in MixUp, and hidden-representation mixing. SMOTE-NC and the proposed
  nominal-only SMOTE-N extension require separate feature-distance and synthesis rules. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 273 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  18 and 18 lines respectively. Every text hit was a prior candidate lead. Eleven exact AIO CLASS nodes
  with scoped synonyms/comments and outgoing edges and five native neighboring mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The Section4.2 prose and Table1 describe one random scalar per synthetic vector, placing it on a line
  segment. Pseudocode line21 draws gap inside the attribute loop; independent per-coordinate draws generally
  produce a point in the coordinatewise rectangle rather than on that segment. The record follows the
  stated interpolation mechanism and does not certify these descriptions as identical executable code.
- Interpolation requires a meaningful continuous feature space and suitable neighbor distances. It does
  not guarantee a new distinct vector, a plausible observation, or a point inside the true minority-class
  support; identical endpoints and overlap with majority regions can defeat those interpretations.
- The original paper’s nominal-continuous and nominal-only extensions are distinct from this core method.
  Sampling percentages and tie/neighbor conventions need implementation choices; the pseudocode is not
  a complete contract for every modern library.
- The source discusses possible overlap with majority-class space and results that vary by dataset and
  learner. Synthetic labels are an inductive assumption, not new observed ground truth, and oversampling
  does not universally improve minority detection or calibrated probabilities. No comparative performance
  result is asserted.
