id: AIMech:SubPsiUniformBoundaryConfidenceSequences
name: Sub-psi uniform boundary confidence sequences
aliases:
- Time-Uniform Nonparametric Nonasymptotic Sub-Psi Confidence Sequences
- Polynomial Stitched Sub-Gamma Uniform Boundary (S_alpha)
- Conjugate Mixture Sub-Psi Uniform Boundaries (Normal, Beta-Binomial, Gamma-Exponential, Gamma-Poisson)
- Discrete Mixture Sub-Psi Uniform Boundary (DM_alpha)
- Self-Normalized Empirical Bernstein Sub-Exponential Confidence Sequence
concept_kind: mathematical_method
definition: 'A general nonparametric, nonasymptotic sequential estimation and boundary-crossing framework
  (Howard, Ramdas, McAuliffe, & Sekhon 2021) for any pair of adapted processes (S_t, V_t)_{t>=0} satisfying
  the sub-psi condition exp(lambda S_t - psi(lambda) V_t) <= L_t(lambda) for a non-negative supermartingale
  L_t(lambda) with E[L_0(lambda)] <= l_0 and a CGF-like function psi : [0, lambda_max) -> R_>=0 (canonical
  sub-Bernoulli psi_B, sub-Gaussian psi_N, sub-Poisson psi_P, sub-exponential psi_E, and sub-gamma psi_G;
  Definitions 1–3, Proposition 1), constructing curved time-uniform boundaries u(V_t) via geometric epoch
  stitching (Theorem 1), analytical conjugate mixtures (Propositions 2–10), geometric-grid discrete mixtures
  (Theorem 2), and inverted stitching (Theorem 3) such that P(exists t >= 1 : S_t >= u(V_t)) <= alpha
  and the induced confidence sequence (C_t)_{t>=1} satisfies P(forall t >= 1 : theta_t in C_t) >= 1 -
  alpha equivalently at all arbitrary stopping times tau (Lemma 3).'
identity_notes: No normalized identity match for Sub-psi uniform boundary confidence sequences across
  all 442 pinned AIO records and 575 maintained IDs, names, aliases and scoped synonyms. Fixed-string
  searches across data, sources, research, history, and reviews returned only lines in Round 180 discovery
  artifacts where Howard, Ramdas, McAuliffe, & Sekhon (2021, arXiv:1810.08240) was queued as a pending
  frontier lead. Distinct from AIMech:BettingConfidenceSequencesForBoundedMeans (Waudby-Smith & Ramdas
  2024), which constructs multiplicative linear betting capital processes K_t(m) = prod_{i=1}^t (1 + lambda_i(m)(X_i
  - m)) and predictable plug-in intervals for [0, 1]-bounded observations rather than sub-psi exponential
  supermartingale uniform boundaries u(V_t) over intrinsic variance time V_t across the five canonical
  sub-psi families (sub-Bernoulli, sub-Gaussian, sub-Poisson, sub-exponential, sub-gamma), polynomial
  epoch stitching S_alpha(v), conjugate beta-binomial/gamma-exponential/gamma-Poisson mixtures, geometric
  discrete mixtures DM_alpha(v), inverted stitching, and matrix finite-LIL eigenvalue bounds.
