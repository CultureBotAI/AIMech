limitations:
- 'No uniform boundary can be simultaneously tight across all intrinsic variance times V_t: conjugate
  mixture boundaries with positive density at the origin grow asymptotically at rate O(sqrt(v log v))
  (Proposition 2) rather than the O(sqrt(v log log v)) iterated-logarithm rate of polynomial stitched
  (Theorem 1) and LIL discrete mixture boundaries (Theorem 2), trading asymptotic looseness as v -> infinity
  for tighter intervals over approximately three orders of magnitude around the Lambert-W-tuned target
  variance time m (Section 3.5, Proposition 3).'
- Except for the two-sided normal mixture (Proposition 5), the closed-form upper bound for the one-sided
  normal mixture (Proposition 6), and polynomial stitched sub-gamma boundaries (Theorem 1), evaluating
  conjugate mixture boundaries (beta-binomial Propositions 7–8, gamma-exponential Proposition 9, gamma-Poisson
  Proposition 10) and discrete mixture boundaries (Theorem 2) requires numerical root-finding over s at
  each step t together with incomplete Beta or incomplete Gamma special functions (Appendix D).
- Theorem 4's self-normalized empirical Bernstein confidence sequence and Corollary 2's adaptive IPW ATE
  confidence sequence require known a priori support bounds X_t in [a, b] a.s. (and propensity scores
  P_t bounded away from 0 and 1 in [p_min, 1 - p_min]) to fix the sub-exponential scale parameter c =
  b - a (or c = 2 / p_min); naively substituting empirical variance V_t into a scale-free sub-Gaussian
  normal mixture (Equation 24) fails violently on heavily skewed bounded distributions (Section 5, Figure
  4a).
- All 1,696 lines of Howard, Ramdas, McAuliffe, & Sekhon (2021, arXiv:1810.08240) were read. Constructed
  numerical checks in research/discovery/sub-psi-uniform-boundary-confidence-sequences-boundaries.py verify
  the strict five-family sub-psi hierarchy and Proposition 1 sub-gamma reduction, Theorem 1 epoch stitching
  endpoint symmetry and dominance plus Theorem 3 inverted stitching, Propositions 3/5/6/9 Lambert W_{-1}
  tuning and gamma-exponential-to-normal convergence plus Theorem 2 discrete mixture accuracy, and Theorem
  4 / Corollary 2 empirical Bernstein and IPW ATE coverage vs. Section 5's skewed-distribution naive self-normalized
  counterexample.
