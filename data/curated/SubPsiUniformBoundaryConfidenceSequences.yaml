claims:
- claim_id: sub-psi-cumulant-hierarchy-and-universal-sub-gamma-reduction
  kind: mechanism
  statement: The five canonical CGF-like functions psi_{B,g,h}(lambda) = (1/(gh)) log((g e^{h lambda}
    + h e^{-g lambda})/(g+h)), psi_N(lambda) = lambda^2/2, psi_{P,c}(lambda) = c^{-2}(e^{c lambda} - c
    lambda - 1), psi_{E,c}(lambda) = c^{-2}(-log(1 - c lambda) - c lambda), and psi_{G,c}(lambda) = lambda^2
    / (2(1 - c lambda)) satisfy the strict pointwise ordering psi_{B,1,1}(lambda) < psi_N(lambda) < psi_{P,1}(lambda)
    < psi_{E,1}(lambda) < psi_{G,1}(lambda) on lambda in (0, 1) together with the universal sub-Poisson-to-sub-gamma
    bound psi_{P,c}(lambda) <= psi_{G,c/3}(lambda) for all lambda in [0, 3/c) (Proposition 1), so every
    sub-psi process is sub-gamma (and sub-exponential) with scale parameter c' and any sub-gamma or sub-exponential
    uniform boundary applies universally across all five families with optimal variance-rescaling constants
    a given by Proposition 11 and Table 1.
  evidence:
  - source_id: howard-ramdas-mcauliffe-sekhon2021-subpsi
    locator: Section 2, lines 135–218, Definitions 1–2, Equations 2–6, Proposition 1, Figure 2; Appendix
      B, lines 1336–1342, Proposition 11 and Table 1
    relation: supports
  - source_id: shin-ramdas-rinaldo2024-edetectors
    locator: Section 5.1, lines 560–615, Table 2 (Canonical sub-psi CGF-like pair hierarchy)
    relation: supports
- claim_id: polynomial-epoch-stitching-and-inverted-stitching-uniform-boundaries
  kind: mechanism
  statement: Partitioning intrinsic variance time into geometric epochs [m eta^k, m eta^{k+1}) for eta
    > 1, m > 0 and intersecting tangent linear boundaries g_k(v) = r_k / lambda_k + (psi_{G,c}(lambda_k)/lambda_k)
    v tuned via the exact inverse psi_{G,c}^{-1}(u) = 2u / (c u + sqrt(2u + c^2 u^2)) at lambda_k = psi_{G,c}^{-1}(r_k
    / (m eta^{k+1/2})) achieves exact normalized endpoint symmetry g_k(m eta^k)/eta^{k/2} = g_k(m eta^{k+1})/eta^{(k+1)/2}
    and yields the closed-form sub-gamma stitched boundary S_alpha(v) = sqrt(k_1^2 v l(v) + c^2 k_2^2
    l(v)^2) + c k_2 l(v) with k_1 = (eta^{1/4} + eta^{-1/4})/sqrt(2), k_2 = (sqrt(eta) + 1)/2, and l(v)
    = s log log(eta v / m) + log(zeta(s)/(alpha log^s eta)), growing at the iterated-logarithm rate O(sqrt(v
    log log v)) (Theorem 1, Appendix A.1 Equations 29–37); conversely, Theorem 3's inverted stitching
    bounds the sub-Gaussian upcrossing probability of any nonnegative strictly concave curve g(v) over
    [1, v_max] by sum_{k=0}^{lceil log_eta v_max rceil - 1} exp(-2 a_k b_k) using secant intercepts a_k
    and slopes b_k.
  evidence:
  - source_id: howard-ramdas-mcauliffe-sekhon2021-subpsi
    locator: Section 3.1, lines 221–248, Equations 7–11, Theorem 1; Section 3.4, lines 278–286, Equations
      18–20, Theorem 3; Appendix A.1, lines 1096–1129, Equations 29–37; Appendix A.7, lines 1298–1313,
      Lemma 8 and Proof of Theorem 3
    relation: supports
- claim_id: conjugate-and-discrete-mixture-boundaries-with-lambert-w-optimal-tuning
  kind: mechanism
  statement: 'Integrating exp(lambda S_t - psi(lambda) V_t) against a mixing distribution F produces a
    supermartingale M_t whose inverted boundary M_alpha(v) = sup{s : m(s, v) < l_0/alpha} is continuous,
    increasing, and concave (Lemma 9), achieves asymptotic rate sqrt(2 c v log(v)/2) when psi''''(0+)
    = c > 0 (Proposition 2), and is unimprovable over 1-sub-Gaussian processes (Proposition 4), yielding
    closed-form or special-function conjugate boundaries for two-sided and one-sided normal mixtures (Propositions
    5–6), beta-binomial mixtures (Propositions 7–8), gamma-exponential mixtures (Proposition 9), and gamma-Poisson
    mixtures (Proposition 10), where the normalized boundary u(v)/sqrt(v) of the two-sided normal mixture
    is uniquely minimized at intrinsic time m when the precision parameter satisfies m / rho = -W_{-1}(-alpha^2
    / (e l_0^2)) - 1 via the lower Lambert W_{-1} branch (Proposition 3, Section C.1), and Theorem 2''s
    geometric-grid discrete mixture DM_alpha(v) with lambda_k = lambda_bar / eta^{k+1/2} and w_k = lambda_bar
    (eta - 1) f(lambda_bar / eta^k) / eta^{k+1} conservatively upper-bounds exact continuous mixtures
    for arbitrary nonincreasing densities f.'
  evidence:
  - source_id: howard-ramdas-mcauliffe-sekhon2021-subpsi
    locator: Section 3.2–3.6, lines 249–328, Equations 12–17 and 21, Propositions 2–4, Theorem 2; Appendix
      A.2–A.5, lines 1130–1291, Lemma 2, Propositions 5–10, Lemmas 4–7; Appendix C.1–C.2, lines 1344–1375,
      Lemma 9
    relation: supports
- claim_id: self-normalized-empirical-bernstein-and-adaptive-ipw-ate-confidence-sequences
  kind: application
  statement: 'For any sequence X_t in [a, b] a.s. with average conditional expectation mu_t = t^{-1} sum_{i=1}^t
    E_{i-1}[X_i] and any [a, b]-valued F_{t-1}-predictable sequence X_hat_t, the centered sum S_t = sum_{i=1}^t
    (X_i - E_{i-1}[X_i]) is sub-exponential with scale c = b - a and empirical variance process V_t =
    sum_{i=1}^t (X_i - X_hat_i)^2 via Fan et al.''s inequality exp(lambda xi - psi_{E,1}(lambda) xi^2)
    <= 1 + lambda xi without taking a union bound over separate mean and variance concentration events,
    yielding the time-uniform empirical Bernstein confidence sequence P(forall t >= 1 : |X_bar_t - mu_t|
    < u(V_t)/t) >= 1 - 2 alpha (Theorem 4, Appendix A.8) that avoids the severe false-positive inflation
    of the naive self-normalized sub-Gaussian mixture (Equation 24) on skewed bounded distributions (Section
    5, Figure 4a), and extends directly to sequential Neyman-Rubin average treatment effect estimation
    ATE_t under adaptive treatment assignment P_t in [p_min, 1 - p_min] with scale c = 2 / p_min (Corollary
    2) as well as matrix martingale finite-LIL eigenvalue bounds (Corollaries 4–5).'
  evidence:
  - source_id: howard-ramdas-mcauliffe-sekhon2021-subpsi
    locator: Section 4.1–4.3, lines 329–395, Equations 22–23, Theorem 4, Corollaries 2–5; Section 5, lines
      440–515, Equation 24, Figure 4a; Appendix A.8–A.10, lines 1315–1335
    relation: supports
