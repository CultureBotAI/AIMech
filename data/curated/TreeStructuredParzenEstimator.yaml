name: Tree-structured Parzen Estimator
definition: A sequential hyperparameter optimization method that separates observations by a loss quantile,
  fits tree-structured densities for the better and remaining configurations, and proposes evaluations
  using their density ratio as an expected-improvement ranking.
concept_kind: algorithm
identity_notes: TPE is the particular two-density sequential optimizer introduced by Bergstra et al.,
  not every Parzen density estimator, every expected-improvement method, Gaussian-process regression or
  the downstream Fast AutoAugment policy search that uses it. The quantile threshold groups observations
  for density fitting; it need not equal the best observed loss. Names and author order follow the inspected
  proceedings PDF. No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms
  and 250 preceding native IDs/names/aliases. Full-checkout fixed-string searches included ignored and
  hidden files in both worktree and main checkout, returning 9 lines in each checkout. These were references
  within neighboring records, their review and the prior discovery ledger, not records for the proposed
  identities. Fourteen exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring native
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The ratio ranking assumes the paper’s two-region conditional model and a finite, positive improvement
  constant. It is not the numerical value of expected improvement without that constant, nor an optimality
  or calibration guarantee.
- The derivation after Equation (3) prints an integral without the factor y in an expanded numerator.
  The unexpanded integral of (y*−y)*p(y) gives the density-ratio ranking recorded here. This is an explicit
  source qualification, not an author-issued erratum or a claim to reproduce a software implementation.
- The original tree-structured factorization encodes conditional activation and the specified density
  families. It does not establish arbitrary dependency modeling or identity with later multivariate TPE
  variants.
- Prior choices, density bandwidths, quantile selection, observations and finite candidate sampling affect
  search. No universal efficiency, final objective improvement or benchmark advantage is asserted.
