id: AIMech:SAWBStatisticsAwareWeightBinningQuantization
name: SAWB Statistics-Aware Weight Binning Quantization
concept_kind: algorithm
review_status: DRAFT
definition: A low-bitwidth neural network weight quantization algorithm that determines the symmetric clipping threshold alpha_w* minimizing weight quantization mean-squared error in closed form as a linear combination of the empirical second-moment root sqrt(E[w^2]) and first absolute moment E[|w|] using bitwidth-specific regression coefficients calibrated across canonical weight distributions.
identity_notes: No AIO class represents Statistics-Aware Weight Binning (SAWB); ArtificialNeuralNetwork (AIO:ArtificialNeuralNetwork) is the closest broad match covering neural network weight quantization.
aliases:
- SAWB
- Statistics-Aware Weight Binning
- SAWB Weight Quantizer
definition_evidence:
- source_id: r828-primary-pdf
  locator: Full-text primary paper (all sections and appendices verified)
  relation: supports
- source_id: r828-arxiv-abs
  locator: arXiv abstract page
  relation: supports
- source_id: r828-metadata-cr
  locator: Crossref DOI bibliographic metadata
  relation: supports
claims:
- claim_id: two-moment-linear-regression-optimal-clipping-scale
  kind: mechanism
  statement: SAWB computes the optimal symmetric weight clipping threshold alpha_w* = c_1 sqrt(E[w^2]) - c_2 E[|w|] using bitwidth-specific constants (c_1, c_2) calibrated across Gaussian, uniform, Laplacian, gamma, Weibull, and logistic distributions, avoiding per-iteration grid search.
  evidence:
  - source_id: r828-primary-pdf
    locator: Section 2.2, Equations 4-5, Figure 3, and Table 2, pp. 3-4
    relation: supports
- claim_id: outlier-resilient-uniform-weight-binning
  kind: mechanism
  statement: By clipping weights outside [-alpha_w*, +alpha_w*] before uniform 2^k-level binning and rescaling to [-alpha_w*, +alpha_w*], SAWB prevents extreme weight outliers from expanding the quantization step size across the bulk of the weight distribution.
  evidence:
  - source_id: r828-primary-pdf
    locator: Section 2.2, Equation 4 and Figure 3(a), pp. 3-4
    relation: supports
- claim_id: ultra-low-bitwidth-cnn-and-rnn-weight-quantization-application
  kind: application
  statement: SAWB is combined with PACT activation clipping to quantize convolutional and recurrent neural network weights down to 2-bit and 4-bit precision with full-precision accuracy on ImageNet and Penn Treebank.
  evidence:
  - source_id: r828-primary-pdf
    locator: Section 3, Figures 4-5 and Table 1, pp. 5-8
    relation: supports
- claim_id: symmetric-zero-mean-distribution-assumption-limitation
  kind: limitation
  statement: Because the SAWB regression coefficients (c_1, c_2) are calibrated on zero-mean symmetric distributions, strongly skewed or multimodal weight distributions can deviate from the predicted MSE-optimal clipping threshold.
  evidence:
  - source_id: r828-primary-pdf
    locator: Section 2.2, Figure 3(b) and Table 2, p. 4
    relation: supports
