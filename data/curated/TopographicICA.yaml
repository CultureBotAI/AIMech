name: Topographic Independent Component Analysis
aliases:
- Topographic ICA
- TICA
concept_kind: model_family
definition: A linear latent-component model whose otherwise conditionally independent source components
  share random scales through fixed overlapping neighborhoods, allowing nearby component energies to be
  dependent while supporting a topographic organization of the representation.
identity_notes: 'Scoped to Hyvarinen, Hoyer and Inki’s 2001 generative construction and its approximate
  estimation. Topography describes higher-order statistical dependence of component amplitudes, not Euclidean
  proximity of prototypes, causal structure or arbitrary spatial data. This differs from ordinary mutually
  independent ICA, Kohonen maps and the undirected Product of Student-t analysis density. Overlapping
  neighborhoods distinguish it from disjoint independent subspaces; the source likelihood surrogate is
  not silently substituted for the exact directed model. Four candidate identities were compared against
  all 442 pinned AIO IDs, labels and scoped synonyms and 450 preceding native IDs, names and aliases,
  with no normalized match. Ignored/hidden full-checkout searches returned the same 106 matched-line set
  in each checkout after the prior merge. All matched excerpts from 76 files were read; they are discovery
  context, not existing concept records. The semantic search covered all pinned labels and scoped synonyms
  and returned 212 rows: 205 byte-equivalent prior readings and seven additional rows, all inspected.
  Twenty-three annotated AIO nodes with outgoing edges comprise 21 unchanged prior readings and two new
  inspections. Thirty contextual YAMLs, including seven native neighbors, comprise 25 unchanged prior
  readings and five complete new readings. This absence assessment is bounded to the pinned snapshot and
  inspected maintained corpus.'
