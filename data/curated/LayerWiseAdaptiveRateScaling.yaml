limitations:
- Bare LARS is not asserted as an alias because AIMech already uses it for Least-angle regression, an
  unrelated equiangular regression algorithm. This record uses the expanded optimizer name.
- The mechanism follows Equations 5–6 of arXiv1708.03888v3 and an explicitly consistent current-step indexing.
  The displayed Algorithm 1 omits eta in one line and has schedule/counter inconsistencies; no literal
  pseudocode reproduction or author implementation audit is claimed.
- A zero-norm fallback, epsilon, clipping rule, bias/normalization exclusion and precise parameter grouping
  are implementation decisions not specified by the inspected formula. Later similarly named optimizer
  variants require separate source and identity assessments.
- The fresh-increment norm statement does not bound momentum accumulation or establish universal stability,
  scale invariance of an entire network, convergence or generalization.
- Source prose, printed ratios and experimental tables contain inconsistencies retained in the discovery
  notes. This record makes no universal no-accuracy-loss assertion or numerical performance claim.
- The complete eight-page September 13, 2017 technical-report preprint was inspected. Later Berkeley/ICLR
  versions and the linked author implementation were not treated as identical evidence. No training, source
  software execution or empirical evaluation occurred.
