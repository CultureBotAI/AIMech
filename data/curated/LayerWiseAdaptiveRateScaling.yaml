id: AIMech:LayerWiseAdaptiveRateScaling
name: Layer-wise adaptive rate scaling
aliases: []
concept_kind: algorithm
definition: A gradient optimization method that multiplies each selected layer or parameter block direction
  by a scalar based on its current weight L2 norm relative to its gradient L2 norm, together with a trust
  coefficient and global learning rate. Its stated weight-decay extension scales a combined gradient-and-decay
  direction using a sum-of-norms denominator and can be composed with momentum.
identity_notes: Compared all 442 pinned AIO and 563 maintained IDs, names, aliases and scoped synonyms.
  The initial bare LARS candidate alias matched AIMech:LeastAngleRegression; its complete record and proposal
  context establish an unrelated equiangular regression algorithm. Removed that ambiguous alias. The expanded
  optimizer identity then had no normalized match. Ignored- and hidden-inclusive fixed-string searches
  of the recovery, older discovery and original Documents checkouts returned 330, 262 and 267 lines, including
  the original ignored virtual environment. Canonical hits identify the regression acronym, author surnames
  and pending optimizer leads; long historical reports and generated mirrors were classified but not all
  reread. Read all ten semantic AIO rows and 85 native definitions, three complete annotated AIO nodes
  with incident edges and generated YAML, and six full native context records. Layer-wise weight/gradient-norm
  scaling differs from ordinary SGD, coordinate-wise Adam/RMSprop moments, decoupled AdamW decay, matrix-orthogonalized
  Muon and least-angle regression. This record does not assign the same identity to every later LARS/LARC/LAMB
  implementation.
definition_evidence:
- source_id: you2017
  locator: Section 4, Equations 4–6 and Algorithm 1, PDF/printed p. 4
  relation: supports
claims:
- claim_id: block-scalar-adaptation
  kind: mechanism
  statement: For a selected layer or parameter block with nonzero weight and gradient L2 norms, the basic
    local multiplier is lambda_t=eta*norm(w_t)/norm(g_t), where g_t is the current minibatch objective
    gradient and eta is a positive trust coefficient. A global learning-rate schedule gamma_t supplies
    the fresh descent increment gamma_t*lambda_t*g_t. This is one scalar per chosen block, rather than
    a coordinate-wise accumulated gradient-moment denominator or a new network layer.
  evidence:
  - source_id: you2017
    locator: Section 4, Equations 4–5, PDF/printed p. 4; comparison with Adam and RMSprop, p. 2
    relation: supports
- claim_id: coupled-decay-extension
  kind: mechanism
  statement: For nonnegative coupled weight decay beta, Equation 6 uses lambda_t=eta*norm(w_t)/(norm(g_t)+beta*norm(w_t))
    and scales the combined direction g_t+beta*w_t. The denominator is the sum of two norms with the decay
    coefficient, not norm(g_t+beta*w_t). Decay therefore participates in the adaptive multiplier and momentum
    direction; this is not an independent decoupled shrinkage step.
  evidence:
  - source_id: you2017
    locator: Section 4, Equation 6 and Algorithm 1, PDF/printed p. 4
    relation: supports
- claim_id: momentum-and-schedule
  kind: mechanism
  statement: 'A consistently indexed momentum composition is v_(t+1)=m*v_t+gamma_t*lambda_t*(g_t+beta*w_t),
    followed by w_(t+1)=w_t-v_(t+1), starting with zero velocity. Here gamma_t denotes the schedule value
    applied to the current update. This record retains eta from Equations 5–6: Algorithm 1 lists eta but
    omits it from its local-multiplier line, computes gamma_t but uses gamma_(t+1), and omits an explicit
    loop-counter increment. Polynomial decay and warm-up are schedule choices in the examples, not the
    identity of the norm-ratio adaptation.'
  evidence:
  - source_id: you2017
    locator: Section 4, Equations 4–6 and Algorithm 1, p. 4; Section 5 and footnote 6, p. 5; ResNet training
      setup, p. 7
    relation: supports
- claim_id: relative-increment-boundary
  kind: limitation
  statement: With no decay, nonzero norms and nonnegative gamma_t, the fresh increment has norm gamma_t*eta*norm(w_t)
    and is unchanged by multiplying g_t by a positive scalar. With beta>=0 and a positive denominator,
    the triangle inequality bounds the fresh combined-direction increment by that same quantity. These
    are algebraic properties of the stated formula, not a bound on the whole accumulated momentum displacement,
    a general stability theorem, or a solution of a trust-region subproblem.
  evidence:
  - source_id: you2017
    locator: Section 4, Equations 4–6 and momentum composition, PDF/printed p. 4; mathematical consequences
      qualified by the stated conditions
    relation: supports
- claim_id: zero-norm-and-implementation-boundaries
  kind: limitation
  statement: The primary formula leaves a zero denominator undefined and supplies no epsilon or fallback
    policy. At zero weight norm with a positive denominator it gives zero fresh increment; existing momentum
    can still move the block. Bias/normalization exclusions, parameter grouping, clipping and zero-norm
    handling must be specified by a concrete implementation and cannot be inferred from the method name.
    The source discusses weights and biases separately, but does not establish a universal exclusion rule.
  evidence:
  - source_id: you2017
    locator: Section 4, Table 2, Equations 5–6 and Algorithm 1, p. 4; separate weight/bias local-rate
      plots, Figure 2, p. 5
    relation: supports
- claim_id: scope-and-evidence-limits
  kind: limitation
  statement: The primary study targets large-batch convolutional-network training with synchronous minibatch
    gradients, global schedules, momentum and model-specific experimental settings. Its reported accuracy
    depends on architecture, batch size, schedule and training duration. The norm-ratio rule does not
    by itself guarantee convergence, eliminate every vanishing/exploding-gradient problem, preserve accuracy
    at arbitrary batch size, or establish distributed speedup. This record curates the mechanism without
    importing a numerical benchmark or claiming a source training reproduction.
  evidence:
  - source_id: you2017
    locator: Abstract and Sections 1–2, pp. 1–2; Sections 3–7, Tables 1–5 and Figures 1–5, pp. 3–7
    relation: supports
