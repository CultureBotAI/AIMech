claims:
- claim_id: r650-claim-reparam-hessian-estimator
  kind: mechanism
  statement: Under a Gaussian variational posterior q(theta) = N(m, diag(sigma^2)), Stein's identity / the reparameterization trick yields E_q[nabla^2 ell_bar(theta)] = E_q[nabla ell_bar(theta) * (theta - m) / sigma^2], allowing IVON to obtain an unbiased single-sample stochastic diagonal Hessian estimator hhat = ghat * (theta - m) / sigma^2 using only the standard mini-batch gradient ghat at theta ~ q(theta) with zero extra backpropagation passes.
  evidence:
  - source_id: r650-primary-pdf
    locator: Section 2.2, Equation (4) and Theorem 1 discussion, p. 3-4
    relation: supports
- claim_id: r650-claim-positive-riemannian-hessian-update
  kind: mechanism
  statement: To prevent negative diagonal Hessian estimates from invalidating the Gaussian variance sigma^2 = 1 / (lambda * (h + delta)), IVON incorporates a higher-order Riemannian correction term in the exponential moving average update h <- (1 - beta_2) * h + beta_2 * hhat + 0.5 * (1 - beta_2)^2 * (h - hhat)^2 / (h + delta), which guarantees h_t + delta > 0 whenever h_{t-1} + delta > 0 and hhat >= -(h_{t-1} + delta).
  evidence:
  - source_id: r650-primary-pdf
    locator: Algorithm 1, Line 4 and Section 2.2 'Ensuring positivity of h', Equation (5), p. 2-4
    relation: supports
- claim_id: r650-claim-gpt2-llm-and-uncertainty-applications
  kind: application
  statement: "IVON trains large-scale foundation models from scratch\u2014including GPT-2 (125M to 773M parameters on OpenWebText) and ResNet-50 on ImageNet\u2014matching or improving upon AdamW's validation perplexity and accuracy while directly providing posterior weight variances for calibrated predictive uncertainty, out-of-distribution detection, sensitivity analysis, and model merging."
  evidence:
  - source_id: r650-primary-pdf
    locator: Section 3.1 (GPT-2 Pretraining, Figure 1 & Table 1) and Section 3.2-3.4, p. 4-8
    relation: supports
- claim_id: r650-claim-effective-sample-size-tuning-limitation
  kind: limitation
  statement: IVON introduces an explicit effective sample size hyperparameter lambda and initial Hessian scale h_0 that govern the exploration noise sigma = 1 / sqrt(lambda * (h + delta)); mis-specifying lambda (too small) injects excessive weight perturbation noise that degrades optimization, whereas setting lambda too large collapses q(theta) toward a deterministic point estimate.
  evidence:
  - source_id: r650-primary-pdf
    locator: Section 2.3 'Practical Choices & Hyperparameters', p. 4; Appendix C, p. 16-17
    relation: supports
