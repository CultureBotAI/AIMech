id: AIMech:IvonImprovedVariationalOnlineNewtonForLargeDeepNetworks
name: Improved Variational Online Newton (IVON)
concept_kind: algorithm
review_status: DRAFT
definition: 'Improved Variational Online Newton (IVON) is a scalable variational Bayesian learning algorithm for deep neural networks that optimizes a diagonal Gaussian posterior q(theta) = N(m, diag(sigma^2)) over network weights with nearly identical computational and memory cost to Adam. Rather than computing expensive per-sample squared gradients or Gauss-Newton Hessian approximations, IVON estimates the diagonal expected Hessian h strictly from standard mini-batch stochastic gradients ghat evaluated at a single weight perturbation theta ~ q(theta) via Stein''s identity / the reparameterization trick: hhat = ghat * (theta - m) / sigma^2. It combines an exponential moving average of hhat with a strictly positive Riemannian natural-gradient update ensuring h + delta > 0 without coordinate clipping, and sets the effective preconditioner scale to sigma = 1 / sqrt(lambda * (h + delta)) where lambda is the effective sample size.'
identity_notes: Must be distinguished from standard deterministic adaptive optimizers (Adam, AdamW, AdaHessian) which maintain point estimates m without sampling theta ~ N(m, diag(sigma^2)) and therefore neither optimize the variational free energy L(q) = lambda * E_q[ell_bar(theta)] + D_KL(q || p) nor yield posterior weight variances sigma^2 for Bayesian model averaging, weight pruning, or uncertainty calibration. Also distinct from Variational Online Newton (VON, Khan et al., 2018) and Variational Online Gauss-Newton (VOGN, Osawa et al., 2019), which require per-example gradient squares or explicit Hessian-vector products that incur prohibitive memory and runtime overhead on large language models such as GPT-2 and ResNet-50.
