    finite MEX is not equivalent to the pinned function.
limitations:
- MEX here is the SimNets operator, not MATLAB mex tooling or similarly named identifier registries. The
  record describes a scalar operation, not every MEX layer or a complete network.
- The direct exponential formula can overflow in finite-precision arithmetic; constructed examples use
  a shifted log-sum-exp calculation. Mathematical limits do not prescribe a numerically stable zero-parameter
  implementation.
- Equal group size and a common parameter are material to the unweighted nested-collapse identity. Finite
  smoothing, derivative weights and exact limiting maxima remain distinct.
- The complete original 19-page primary version is reused with its original access timestamp and hash.
  Author code, later Deep SimNets full text and model training were not inspected; DRAFT remains.
