aio_mappings:
- target: AIO:UnsupervisedLearning
  relation: related_match
  rationale: The AIO target describes the task of learning patterns from unlabeled observations, whereas
    this local record specifies one support-estimation algorithm. The relation captures that learning
    setting without equating an algorithm with a task or asserting a subclass edge. Users may supply a
    selected target class; the mathematical objective does not require negative training examples. BinaryClassification
    and Classification inherit supervised task scope and do not identify this objective. KernelLayer is
    a neural component, and generic Model/Network nodes do not identify the estimator.
- target: AIO:SupportVectorMachine
  relation: related_match
  rationale: The origin-relative kernel hyperplane and norm/slack optimization are directly related to
    support-vector classification. The pinned AIO target specifically describes a supervised category-separating
    network, so it is not treated as an exact or broader identity for this one-class support estimator.
    The source explicitly derives the connection and its changed objective. Native SVDD has only a conditional
    constant-diagonal correspondence; KernelPCA optimizes variance directions and SVC additionally assigns
    connected components.
limitations:
- Kernel, scaling, regularization and threshold conventions affect the region; support estimation does
  not guarantee calibrated future error or detection of every anomaly.
- All29 journal pages were read, but the earlier technical report and external proof dependencies were
  not independently audited. Asymptotic claims remain qualified.
- Exact rational examples were executed without training a model, running a historical implementation
  or reproducing a benchmark.
- This remains a native DRAFT; supervised nu algorithms, percentile feature extraction and regularized
  manifolds remain distinct discovery leads.
