id: AIMech:OneClassSupportVectorMachine
name: One-class support vector machine
aliases:
- OCSVM
- One-class SVM
- Single-class support vector machine
concept_kind: algorithm
definition: A support-estimation algorithm that optimizes a kernel feature-space score relative to the
  origin using a norm penalty, a learned offset and linearly penalized shortfalls controlled by nu, then
  accepts a query when its score meets the learned threshold.
identity_notes: This record denotes the original origin-relative one-class hyperplane support estimator
  in Scholkopf, Platt, Shawe-Taylor, Smola and Williamson (2001). It does not denote supervised nu-SVC
  or nu-SVR, sphere-fitting SVDD, support-vector clustering with component assignment, or later negative-example
  feature extraction. Compared all442 pinned AIO IDs, labels and scoped synonyms with all519 preceding
  native IDs, names and aliases, with no normalized collision. Fixed-string whole-word searches in both
  checkouts included ignored and hidden files, expanded names, acronyms, DOI and paper identifiers. All11
  distinct matched-text windows were read; the locations are prior discovery leads and neighboring method
  context. All125 semantic AIO rows and114 native identity rows exactly match the preceding read capture;
  the additional RAPID row and full record were read. Thirty complete contextual record readings were
  retained with matching hashes. Absence is bounded to the inspected pin and corpus.
definition_evidence:
- source_id: scholkopf2001
  locator: Section 3, PDF pp4-7 / printed pp1446-1449, Equations 3.4-3.12
  relation: supports
claims:
- claim_id: soft-origin-objective
  kind: mechanism
  statement: For a nonempty sample of n observations, a positive-semidefinite kernel with feature map
    Phi, and 0<nu<=1, minimize (1/2)||w||^2 + sum_i xi_i/(nu*n) - rho subject to w.Phi(x_i)>=rho-xi_i
    and xi_i>=0. The offset rho is unrestricted. The method learns from the supplied observations without
    requiring a representative negative class. It does not minimize input-space Lebesgue volume, and a
    degenerate feature configuration need not yield a nonzero separating normal.
  evidence:
  - source_id: scholkopf2001
    locator: Sections 2-3, PDF pp3-5 / printed pp1445-1447, Equations 3.1-3.6
    relation: supports
- claim_id: dual-score-and-threshold
  kind: mechanism
  statement: The dual minimizes (1/2)*alpha^T*K*alpha subject to sum_i alpha_i=1 and 0<=alpha_i<=C, where
    C=1/(nu*n). The score is g(x)=sum_i alpha_i*k(x_i,x); accept g(x)>=rho, including equality. A coefficient
    strictly between zero and C fixes rho=g(x_i). Such a coefficient need not exist. KKT conditions instead
    bound rho below by max_{alpha_i>0} g(x_i) and above by min_{alpha_i<C} g(x_i); an empty upper-bound
    set gives no finite upper bound. Different optimal offsets can give different acceptance regions.
    The primal normal is fixed by strict convexity in w, while coefficients can be nonunique for a singular
    Gram matrix.
  evidence:
  - source_id: scholkopf2001
    locator: Section 3, PDF pp4-6 / printed pp1446-1448, Equations 3.4-3.12 and sign convention; KKT interval
      derived from these constraints; research/discovery/ocsvm-boundaries.py
    relation: supports
- claim_id: finite-nu-bounds
  kind: scope
  statement: 'At an exact optimum, nu bounds the fraction of strictly rejected training observations from
    above and the fraction of positive expansion coefficients from below. The paper states these properties
    under rho!=0. Neither bound requires equality in a finite sample; a coefficient at its upper bound
    can lie on the accepted boundary. A support-vector count is not a calibrated future rejection probability
    or a guaranteed sparse fraction. With the analytic nonconstant kernel k(x,y)=1+x*y and four balanced
    points -3/4,-1/4,1/4,3/4, nu=1/2 admits optimal weights 1/4, rho=1 and a constant score: all four
    points are support vectors and none is rejected. This is a finite illustration, not an iid asymptotic
    counterexample.'
  evidence:
  - source_id: scholkopf2001
    locator: Section 5 Proposition 3, PDF p11 / printed p1453; Appendix B proof sketch, PDF p23 / printed
      p1465; curator calculation in research/discovery/ocsvm-boundaries.py
    relation: supports
- claim_id: sphere-correspondence
  kind: scope
  statement: For 0<nu<1, a kernel whose diagonal k(x,x) is constant over both training and query inputs
    makes the matched-penalty SVDD and hyperplane dual objectives differ only by scale and a constant.
    Compatible radius and offset choices then give the same acceptance rule. This restricted correspondence
    does not identify the algorithms for arbitrary kernels. For linear-kernel observations 1 and 2 with
    nu=1/4, the exact hyperplane rule accepts x>=1, while matched-penalty SVDD accepts only 1<=x<=2. Training-only
    diagonal equality also does not justify dropping the query diagonal.
  evidence:
  - source_id: scholkopf2001
    locator: Section 3, PDF pp6-7 / printed pp1448-1449, Equations 3.13-3.17 and following comparison;
      curator calculation in research/discovery/ocsvm-boundaries.py
    relation: supports
- claim_id: pairwise-optimization
  kind: mechanism
  statement: The proposed SMO adaptation updates two coefficients while preserving their sum and the box
    constraints. For positive pair curvature k_ii+k_jj-2*k_ij, the unconstrained second-coefficient update
    adds (g_i-g_j)/(k_ii+k_jj-2*k_ij), then clips to the jointly feasible interval before recovering the
    first coefficient. Zero curvature cannot be handled by dividing that formula. The paper alternates
    full and non-bound KKT scans and refers to fallback selection rules; it also discusses tolerance adjustments
    and a modification for pathological convergence cases. This describes an optimization procedure, not
    a universal runtime or implementation-convergence guarantee.
  evidence:
  - source_id: scholkopf2001
    locator: Section 4, PDF pp7-9 / printed pp1449-1451, Equations 4.1-4.8 and termination discussion
    relation: supports
- claim_id: density-and-endpoint
  kind: limitation
  statement: At nu=1 the constraints force every expansion coefficient to 1/n. For appropriately normalized
    density kernels this recovers a Parzen-type score, but does not by itself determine a useful acceptance
    threshold. The source explicitly changes the offset in its Parzen comparison. For linear-kernel observations
    1 and 2 at nu=1, offsets 3 and 4 share the exact optimal objective -9/8 but respectively accept one
    and zero training points. For smaller nu, nonuniform learned weights generally differ from an ordinary
    unweighted kernel-density estimate; an arbitrary kernel score is not a normalized probability density.
  evidence:
  - source_id: scholkopf2001
    locator: Section 3, PDF p6 / printed p1448; Figure 2 caption, PDF p14 / printed p1456; curator endpoint
      calculation in research/discovery/ocsvm-boundaries.py
    relation: supports
- claim_id: generalization-scope
  kind: limitation
  statement: The paper gives a high-probability bound for rejection outside an enlarged region using offset
    rho-gamma with gamma>0, under iid sampling, a distribution without discrete components and the stated
    function-class/complexity conditions. It does not set the original region’s future rejection probability
    exactly to nu or establish unconditional complete-support recovery. The authors describe the bound
    as loose and unsuitable for direct parameter selection. Their asymptotic nu-equality discussion depends
    on additional distribution, kernel and vanishing-boundary-fraction arguments; it is not asserted here
    as a general guarantee for every kernel.
  evidence:
  - source_id: scholkopf2001
    locator: Section 5, PDF pp11-13 / printed pp1453-1455, Proposition 3 and Theorem 1; Appendix B, PDF
      pp23-26 / printed pp1465-1468
    relation: supports
- claim_id: evaluation-boundaries
  kind: limitation
  statement: The experiments use selected two-dimensional examples and USPS digits with specified Gaussian
    width and nu. The digit-zero experiment trains on training-set zeros and tests against zeros and other
    digits. A separate outlier experiment fits the USPS test set itself after adding ten class-label coordinates,
    so that study is neither a held-out test nor an unlabeled-pixel-only experiment. Reported SMO scaling
    uses small selected subsets and is explicitly described as noisy. These studies do not establish universal
    accuracy, kernel choice, robustness or computational scaling. No numerical performance advantage is
    curated.
  evidence:
  - source_id: scholkopf2001
    locator: Section 6, PDF pp13-18 / printed pp1455-1460, Figures 1-6 and Table 1; discussion PDF pp19-21
      / printed pp1461-1463
    relation: supports
