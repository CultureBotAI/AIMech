name: Squeeze-and-Excitation block
definition: A neural-network feature recalibration component that globally averages each channel, transforms
  the resulting descriptor through a learned bottleneck, and applies sigmoid-derived channel weights to
  the input feature maps.
concept_kind: layer
identity_notes: This is the SE component from the 2018 paper, not a complete SENet architecture or its
  trained checkpoints. The component receives the feature tensor produced by a preceding transformation.
  Its channel weights vary with the input but are shared over spatial positions within each channel. SE
  block is the scoped alias; the paper title denotes networks assembled using these units. No normalized
  identity match was found across all 442 pinned AIO labels/scoped synonyms and 279 preceding native IDs/names/aliases.
  Full-checkout fixed-string searches included ignored and hidden files in worktree and main, returning
  6 and 6 lines respectively. Every text hit was a prior candidate lead or a closely related variant lead.
  Seven exact AIO CLASS nodes with scoped synonyms/comments and outgoing edges and three native neighboring
  mechanisms were inspected. Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The sigmoid gates are independent weights, not a softmax distribution or guaranteed class probabilities.
  For finite real logits they lie strictly between zero and one, so the immediate scaling cannot increase
  absolute input-feature magnitudes; emphasis is relative to other channels and the surrounding network.
  Floating-point saturation can reach numerical endpoints.
- Global averaging discards spatial arrangement in the descriptor. Channel gating therefore does not itself
  supply a location-specific attention map, although the spatial feature tensor is retained in the output.
- Reduction ratio, placement and surrounding architecture affect cost and behavior. Additional learned
  weights and operations do not imply negligible cost on every device. The source’s interpretation of
  particular channel activations is not a causal explanation or a universal accuracy claim. No author
  implementation or trained model was executed.
