claims:
- claim_id: method
  kind: mechanism
  statement: For each channel of a spatial feature tensor, average all spatial values to obtain a channel
    descriptor. Pass that descriptor through a fully connected dimensionality reduction, ReLU, fully connected
    expansion to the original channel count and elementwise sigmoid. Broadcast each resulting weight across
    its corresponding spatial feature map and multiply elementwise. The reduction ratio controls the bottleneck
    capacity; the paper uses 16 in its main experiments rather than requiring that value for the concept.
    In its residual-network integration, this recalibration operates on the non-identity transformation
    before addition of the skip path. The module has learned parameters and remains part of the network
    during inference.
