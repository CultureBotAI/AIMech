name: Bottleneck Attention Module
definition: A convolutional feature refinement component that combines parallel channel and spatial attention
  branches and adds the resulting gated features back to its input, originally proposed for network downsampling
  bottlenecks.
concept_kind: layer
identity_notes: This record denotes Park and colleagues’ 2018 bottleneck attention module, scoped to the
  summation convention of arXiv1807.06514v2. The pinned author implementation uses a different fusion
  operation, recorded explicitly below. BAM is an ambiguous acronym also used by the 2021 Balanced Attention
  Mechanism paper; only the qualified bottleneck alias is assigned here. The module is distinct from sequential
  CBAM, channel-only SE and a complete CNN. No normalized identity match was found across all 442 pinned
  AIO labels/scoped synonyms and 279 preceding native IDs/names/aliases. Full-checkout fixed-string searches
  included ignored and hidden files in worktree and main, returning 6 and 6 lines respectively. Every
  text hit was a prior candidate lead or a closely related variant lead. Seven exact AIO CLASS nodes with
  scoped synonyms/comments and outgoing edges and three native neighboring mechanisms were inspected.
  Absence is bounded to this snapshot and semantic neighborhood.
limitations:
- The record distinguishes the selected paper’s SUM fusion from the pinned author code’s product fusion
  and normalization placement. These yield different attention maps; neither the repository README nor
  a shared module name proves that code reproduces the selected paper equations.
- For finite real logits the residual multiplier 1+sigmoid(logit) lies between one and two. The module
  therefore cannot directly attenuate the absolute magnitude of a nonzero input element; suppression in
  source prose is relative to other features or downstream computation. Floating-point sigmoid can reach
  numerical endpoints.
- The branch maps are constrained by their channel/spatial structure rather than arbitrary independent
  attention values at every tensor position. Learned attention is not automatically a calibrated explanation
  or semantic object mask. Placement and hyperparameters affect overhead and empirical results.
- The inspected standalone bam.py references gate_activation in ChannelGate without a parameter or binding
  for that name in the module. Its average-pooling call also assumes square spatial maps to produce a
  single descriptor. Static reading is not a successful runtime validation; no author code, model or supplementary
  benchmark was executed. The final BMVC PDF was inaccessible during this assessment.
