claims:
- claim_id: method
  kind: mechanism
  statement: From the same input feature tensor, form a channel branch using global spatial averaging
    and a bottleneck MLP, and a spatial branch using a 1-by-1 channel reduction, two dilated 3-by-3 convolutions
    and a 1-by-1 projection to one spatial map. The selected paper equations place batch normalization
    at the outputs of both branches. Broadcast the channel and spatial logits to the input tensor shape,
    sum them and apply sigmoid to obtain the attention map. Multiply that map by the input and add the
    result back to the input. The source commonly places modules at downsampling bottlenecks and also
    studies other placements; its reduction ratio 16 and dilation 4 are experimental settings. The learned
    attention computation operates in both training and inference.
  evidence:
  - source_id: method-source
    locator: Section3, Equations1–4, PDF pp.3–5; branch fusion and placement comparisons Section4.1, PDF
      pp.6–8; other placements Section4.6 and conclusion, PDF pp.9–10
    relation: supports
- claim_id: paper-code-boundary
  kind: limitation
  statement: The selected paper adds broadcast channel and spatial branch logits before sigmoid. The inspected
    BAM.forward instead multiplies those branch outputs before applying sigmoid and adding one. The code
    places batch normalization and ReLU in intermediate branch blocks rather than the terminal batch-normalization
    positions displayed in the paper equations. These are explicit source-version differences, not equivalent
    rewritings; the concept record uses the paper convention and does not certify the code as an exact
    implementation of it.
  evidence:
  - source_id: method-source
    locator: Section3 Equations2–4 and Section4.1 Combining methods, PDF pp.4–5,7
    relation: supports
  - source_id: pinned-code
    locator: ChannelGate.__init__, SpatialGate.__init__ and BAM.forward in MODELS/bam.py
    relation: supports
