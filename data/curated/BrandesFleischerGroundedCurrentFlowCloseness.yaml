limitations:
- Connected simple undirected positive-conductance graphs with n>=3 only. Disconnected components, singleton
  cases, signed conductances and directed networks require other definitions.
- Algorithm 2 and Definition 3 differ by n-1 in the inspected source. The maintained output follows the
  explicit algorithm, and the alternative normalized quantity is labeled separately. Information-centrality
  naming is not an unqualified normalization identity.
- The chapter’s literal cycle equation for currents is inconsistent with its Ohm law for unequal conductances.
  The maintained construction uses the explicit weighted Laplacian and potential drops; no corrected source
  edition is claimed.
- Dense inverses and streaming numerical solves have different storage and precision requirements. Finite
  rational graphs verify selected equalities and scaling, not general floating-point stability or the
  performance of historical software.
- All twelve chapter pages and references were read, with method equations and Figure 1 visually inspected.
  No author code, raw data or closeness benchmark was run. This structural score does not establish causality
  or trained-model performance. DRAFT remains.
