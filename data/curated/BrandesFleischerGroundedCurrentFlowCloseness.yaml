id: AIMech:BrandesFleischerGroundedCurrentFlowCloseness
name: Brandes–Fleischer grounded current-flow closeness computation
aliases:
- Brandes-Fleischer grounded resistance-sum closeness algorithm
concept_kind: algorithm
definition: An exact network-analysis algorithm that accumulates effective-resistance sums from successive
  columns of an embedded grounded-Laplacian inverse and returns their reciprocals; the inspected Algorithm
  2 omits the n-1 normalization used in the same chapter’s closeness definition.
definition_evidence:
- source_id: brandesfleischer2005
  locator: Section 4, Algorithm 2, PDF p. 9 / printed p. 541; normalization contrast with Definition 3,
    PDF p. 5 / printed p. 537
  relation: supports
claims:
- claim_id: domain-and-resistance
  kind: scope
  statement: The maintained domain is a connected simple undirected graph with n>=3 and positive edge
    conductances. Ground one vertex and embed the inverse of the reduced weighted Laplacian in C with
    a zero ground row and column. Effective resistance between v and w is R_vw=C_vv+C_ww-2C_vw, the potential
    drop for unit current from v to w. It is positive for distinct vertices and independent of the chosen
    ground.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 2, Equation 1, PDF p. 3 / printed p. 535; Definition 3 and proof, PDF pp. 5–6 / printed
      pp. 537–538
    relation: supports
- claim_id: column-accumulation
  kind: mechanism
  statement: Initialize q(v)=0. For each inverse column indexed by v and every vertex w, add C_vv-2C_wv
    to q(v) and C_vv to q(w), including w=v. After all columns, q(v)=n C_vv-2 sum_w C_wv+trace(C)=sum_w
    R_vw. Algorithm 2 returns 1/q(v). Including the diagonal terms in both updates cancels them; the ground
    column is zero. Column order does not change the exact final sum.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 4, Algorithm 2, PDF p. 9 / printed p. 541; explicit accumulator algebra in research/discovery/grounded-closeness-boundaries.py
    relation: supports
- claim_id: normalization-discrepancy
  kind: limitation
  statement: The source defines n_C=n-1 and uses n_C divided by the resistance sum in Definition 3, but
    its proof and Algorithm 2 omit that factor. This record preserves the explicit Algorithm 2 output
    1/sum_w R_vw; multiplying it by n-1 yields the stated normalized definition. On the unit triangle,
    these values are 3/4 and 3/2 respectively. No unqualified numerical identity with every convention
    called information centrality is asserted.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 3, PDF p. 4 / printed p. 536; Definition 3 and proof, PDF pp. 5–6 / printed pp. 537–538;
      Algorithm 2, PDF p. 9 / printed p. 541; curator triangle example
    relation: supports
- claim_id: computation-and-numerics
  kind: scope
  statement: With a dense reduced inverse, forming and accumulating all n columns costs O(n^2) beyond
    inversion and uses O(n^2+m) storage. The source also describes obtaining columns as needed from reduced
    linear solves, allowing the column accumulator to avoid storing the whole inverse. Numerical solve
    time, accuracy and preconditioner storage require implementation-specific assumptions; the chapter’s
    rough conjugate-gradient and condition-number discussion is not an unconditional exact floating-point
    guarantee.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 4, matrix and streaming-column discussion, PDF pp. 8–9 / printed pp. 540–541; explicit
      dense and accumulator accounting is curator interpretation
    relation: supports
- claim_id: distance-and-weight-boundaries
  kind: limitation
  statement: This uses effective resistance rather than shortest-path length in general. On a tree, effective
    resistance equals the unique-path sum of reciprocal conductances, so matched-normalization closeness
    values agree. On a unit triangle, inverse resistance-sum closeness is 3/4 but inverse shortest-path-sum
    closeness is 1/2. Multiplying all conductances by a positive factor multiplies this closeness by the
    same factor. These finite graph examples and scaling consequences do not make the score dimensionless
    or bounded by one.
  evidence:
  - source_id: brandesfleischer2005
    locator: Definition 3, PDF p. 5 / printed p. 537; Section 6 tree comparison, PDF p. 11 / printed p.
      543; explicit curator examples in research/discovery/grounded-closeness-boundaries.py
    relation: supports
- claim_id: method-and-evidence-scope
  kind: limitation
  statement: Algorithm 2 computes reciprocal resistance sums; it is distinct from the chapter’s exact
    and sampled betweenness algorithms and from the earlier information-centrality construction using
    an inverse of L plus the all-ones matrix. The inspected chapter supplies a mathematical mechanism;
    its Appendix A experiment concerns betweenness. No empirical closeness speedup, replicated author
    implementation, causal interpretation or learned predictive performance is asserted.
  evidence:
  - source_id: brandesfleischer2005
    locator: Section 3.2, Equation 2, PDF p. 5 / printed p. 537; Section 4 and Algorithm 2, PDF pp. 8–9
      / printed pp. 540–541; Appendix A/Figure 1, PDF p. 12 / printed p. 544
    relation: supports
identity_notes: 'Compared all 442 pinned AIO and 690 native identities; no normalized match. Ignored-
  and hidden-inclusive searches of three full checkouts returned 203,0,0 lines, read as the Newman and
  current-flow records/reports and prior chapter leads or query strings. Semantic assessment covered 147
  AIO and 524 native definitions: all 147 AIO and 523 prior native rows verified unchanged and one newly
  selected native row read. Nine complete AIO contexts and five full native neighbors were assessed. Algorithm2
  accumulates columns of a grounded inverse and reciprocates effective-resistance sums. It is distinct
  from the current-flow score alone, exact or sampled betweenness, shortest-path closeness sampling and
  the chapter’s separate L-plus-J information-centrality construction. The explicit output follows the
  algorithm’s inverse-sum convention, with Definition3’s n-1 multiplier separately identified.'
