claims:
- claim_id: method
  kind: mechanism
  statement: Partition the state into coordinates or blocks. Select a block, draw its new value from the
    target conditional distribution given all other current values, and leave those other values unchanged.
    Each conditional-resampling kernel preserves the joint target. Composing these kernels in a fixed
    sweep, or mixing them with fixed selection probabilities, also preserves that target. Later steps
    in a sweep use the values already updated earlier in that sweep. Exact conditional draws do not make
    the resulting successive joint states independent.
  evidence:
  - source_id: method-source
    locator: Section 2.2, Conditioning and the Gibbs Sampler, and Section 2.4, Combining Strategies; printed
      pp. 2 and 8 / PDF pp. 4 and 10
    relation: supports
- claim_id: finite-image-gibbs
  kind: scope
  statement: Geman and Geman update one image site by drawing from its Gibbs conditional using current
    neighboring states. Their fixed-temperature sampling construction is distinct from the later cooling
    procedure for minimum-energy configurations. The finite-state convergence discussion assumes strictly
    positive configuration probabilities and repeated site visits.
  evidence:
  - source_id: finite-image-gibbs
    locator: Sections XI–XII, Gibbs Sampler and Theorems A–B, printed pp. 730–731 / PDF pp. 10–11
    relation: supports
