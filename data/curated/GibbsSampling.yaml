name: Gibbs sampling
definition: A Markov chain Monte Carlo algorithm that repeatedly draws a coordinate or block from its
  full conditional distribution given the current values of the remaining coordinates.
concept_kind: algorithm
identity_notes: This record denotes exact conditional resampling, including fixed coordinate cycles and
  fixed random-scan mixtures. It is a sampling procedure, not a Gibbs distribution, Markov random field,
  annealing schedule or conditional maximization method. Metropolis-within-Gibbs replaces some exact conditional
  draws by invariant transitions and is represented separately. No normalized identity match was found
  across all 442 pinned AIO labels/scoped synonyms and 159 prior native IDs/names/aliases. Ignored-inclusive
  full-checkout searches found prior discovery leads for Gibbs and slice sampling plus unrelated environment
  substring hits, not existing concept records. Existing HMM/MRF models and general Metropolis–Hastings
  were inspected to distinguish model, general transition and specialized algorithm scope.
limitations:
- The full conditional distributions must be compatible with a proper joint target and be sampled correctly.
  An approximate conditional draw is not automatically an exact Gibbs step.
- Target invariance alone does not establish irreducibility, aperiodicity, convergence from every start
  or rapid mixing. Coordinate dependence and disconnected support can obstruct exploration.
- The finite positive-state convergence theorem in Geman and Geman has explicit site-visit and positivity
  assumptions; it is not a theorem for every continuous, constrained or parallel Gibbs implementation.
- Simultaneously updating dependent coordinates using stale neighbors is outside the stated sequential
  mechanism; valid parallel or adaptive scan schemes need separate arguments.
- Fixed-temperature posterior sampling and a cooling schedule for optimization are different procedures.
  No universal convergence rate or image-restoration performance is asserted.
