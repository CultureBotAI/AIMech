name: CURE clustering
definition: An agglomerative clustering procedure that represents each cluster by several scattered points
  shrunk toward its mean and merges the pair with the smallest distance between their representative points.
concept_kind: algorithm
identity_notes: CURE uses a set of representative locations, unlike centroid-only k-means or graph-cut
  normalization in CHAMELEON. This record describes the original vector-data clustering rule and explicitly
  qualifies the faster representative-reuse and sampled-data enhancements. Recomputing representatives
  from all merged observations and selecting from old representatives need not give identical merges.
  No normalized identity match was found across all 442 pinned AIO labels/scoped synonyms and 223 preceding
  native IDs/names/aliases. Word-delimited fixed-string searches of both full checkouts, including ignored
  and hidden files, returned 2 worktree lines in discovery context and 6 main-checkout lines including
  four unrelated ignored dependency matches. Six neighboring native records and nine exact AIO nodes with
  scoped synonyms and outgoing edges were inspected.
limitations:
- The mean-and-shrink description assumes a vector representation with a meaningful distance and arithmetic
  mean. The source’s mention of nonmetric similarities does not make the same operations defined for arbitrary
  categorical objects.
- The improved representative-reuse step restricts the candidate set and can alter the selected representatives
  and later merges. Unshrinking from locations alone is undefined at alpha=1; it requires alpha<1 or retained
  original scattered points.
- Sampling and partial partition clustering may miss rare groups or irreversibly combine points before
  the final pass. The paper’s two-stage small-cluster outlier removal is heuristic and can remove genuine
  small clusters.
- Representative count, shrink fraction, sampling, partitioning, distance, outlier rules and target count
  matter. The method does not guarantee recovery of arbitrary true shapes or universal outlier robustness,
  and its indexing/runtime claims are dimension-dependent. No implementation or benchmark was reproduced.
