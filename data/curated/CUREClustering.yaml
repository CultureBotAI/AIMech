claims:
- claim_id: method
  kind: mechanism
  statement: 'Start with singleton clusters. Represent a cluster C by up to c selected points, with c
    a positive integer: choose the first farthest from its mean, then choose each next point to maximize
    its minimum distance to already selected points. Shrink every selected p to p+alpha(mean(C)−p), for
    a chosen shrink fraction in [0,1]. Define cluster distance as the minimum distance between a representative
    from each cluster, repeatedly merge the closest pair and stop at the requested count. In the original
    merge procedure recompute the mean with observation-count weights and select scattered points from
    the merged observations. The improved merge considers the at-most-2c old scattered points, recovered
    from their shrunken representatives when unshrinking is defined, and then shrinks new selections toward
    the merged mean. Large-data enhancements cluster a random sample, optionally partially cluster sample
    partitions before merging their partial clusters, and label remaining observations by the nearest
    selected final representative.'
