id: AIMech:HighDimensionalGaussianGraphicalModelNeighborhoodSelectionWithTheLasso
name: High-Dimensional Gaussian Graphical Model Neighborhood Selection with the Lasso
concept_kind: mathematical_method
aliases:
- Meinshausen-Buhlmann Neighborhood Selection
- Lasso Gaussian Graphical Model Neighborhood Selection
- Nodewise Lasso Covariance Selection
- High-Dimensional Graphs and Variable Selection with the Lasso
definition: 'High-Dimensional Gaussian Graphical Model Neighborhood Selection with the Lasso is a nodewise
  L1-penalized regression method (Meinshausen & Buhlmann 2006, The Annals of Statistics 34(3):1436-1462,
  arXiv:math/0608017v1) for estimating the conditional independence graph G = (Gamma(n), E) of a p(n)-dimensional
  multivariate Gaussian vector X = (X_1, ..., X_p) ~ N(mu, Sigma) with precision matrix K(n) = Sigma^{-1}(n)
  when p(n) = O(n^gamma) grows polynomially with sample size n. Exploiting the identity theta_b^a = -K_{ab}(n)
  / K_{aa}(n) for the optimal linear prediction coefficients theta^a = argmin_{theta: theta_a = 0} E[(X_a
  - sum_{k in Gamma(n)} theta_k X_k)^2] (Equations 1-2), the method solves for each node a in Gamma(n)
  the nodewise Lasso estimator theta_hat^{a, lambda} = argmin_{theta: theta_a = 0} {n^{-1} ||X_a - X theta||_2^2
  + lambda ||theta||_1} (Equation 3) to estimate the neighborhood ne_hat_a^lambda = {b in Gamma(n) : theta_hat_b^{a,
  lambda} != 0}, and aggregates nodewise neighborhoods into an undirected edge set via intersection E_hat^{lambda,
  AND} = {(a, b) : a in ne_hat_b^lambda and b in ne_hat_a^lambda} (Equation 7) or union E_hat^{lambda,
  OR} = {(a, b) : a in ne_hat_b^lambda or b in ne_hat_a^lambda} (Equation 8). Whereas the prediction-oracle
  penalty lambda_oracle is inconsistent for neighborhood selection as p(n) -> infty (Proposition 1), under
  Assumptions 1-6 including Neighborhood Stability |S_a(b)| = |sum_{k in ne_a} sign(theta_k^{a, ne_a})
  theta_k^{b, ne_a}| < delta < 1 for all b not in ne_a (Equation 5, Assumption 6), choosing lambda_n ~
  d n^{-(1-varepsilon)/2} with kappa < varepsilon < xi guarantees exponential Type I and Type II error
  decay P(ne_hat_a^lambda = ne_a) = 1 - O(exp(-c n^varepsilon)) and P(E_hat^lambda = E) = 1 - O(exp(-c
  n^varepsilon)) (Theorems 1-2, Corollary 1), while setting lambda(alpha) = (2 sigma_hat_a / sqrt(n))
  Phi_tilde^{-1}(alpha / (2 p(n)^2)) (Equation 9) controls the finite-sample familywise probability of
  falsely connecting distinct connectivity components at level alpha (Theorem 3).'
identity_notes: Resolved against all 442 pinned AIO records and 629 maintained AIMech records. Distinct
  from AIMech:HighDimensionalIsingModelSelectionViaL1RegularizedLogisticRegression (Ravikumar, Wainwright,
  & Lafferty 2010, Annals of Statistics 38(3):1287-1319, which estimates binary Ising Markov random fields
  on {-1, +1}^p via nodewise L1-regularized logistic regression with a parameter-dependent Fisher information
  matrix, whereas Meinshausen & Buhlmann 2006 estimate continuous Gaussian graphical model precision-matrix
  sparsity K_{ab} = 0 via nodewise squared-error Lasso, prove prediction-oracle inconsistency in Proposition
  1, introduce Neighborhood Stability S_a(b) in Equation 5, and establish finite-sample connectivity component
  FWER control in Theorem 3), from AIMech:PrimalDualWitnessAndSharpThresholdsForHighDimensionalNoisyLassoSparsityRecovery
  (Wainwright 2009, IEEE Trans. Inf. Theory 55(5):2183-2202, which analyzes single-response linear regression
  support recovery threshold theta(p, k, n) rather than p-node Gaussian graphical model covariance selection,
  AND/OR edge aggregation, and connectivity component FWER control), and from AIO:LassoRegression and
  AIO:LinearRegression.
