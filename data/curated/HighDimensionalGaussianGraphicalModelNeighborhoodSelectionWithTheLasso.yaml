claims:
- claim_id: gaussian-precision-matrix-neighborhood-identity-and-prediction-oracle-inconsistency
  kind: mechanism
  statement: 'For X = (X_1, ..., X_{p(n)}) ~ N(mu, Sigma(n)) with inverse covariance (precision) matrix
    K(n) = Sigma^{-1}(n), the optimal population linear prediction vector theta^a = argmin_{theta: theta_a
    = 0} E[(X_a - sum_{k in Gamma(n)} theta_k X_k)^2] (Equation 1) satisfies theta_b^a = -K_{ab}(n) /
    K_{aa}(n) for all b in Gamma(n) \ {a}, so the graphical neighborhood ne_a = {b in Gamma(n) \ {a} :
    K_{ab}(n) != 0} coincides with the support {b in Gamma(n) : theta_b^a != 0} estimated by the nodewise
    Lasso theta_hat^{a, lambda} = argmin_{theta: theta_a = 0} (n^{-1} ||X_a - X theta||_2^2 + lambda ||theta||_1)
    (Equation 3). Proposition 1 (Section 2.2, pp. 5-6; proved in Appendix, pp. 20-22, Equations A.20-A.22)
    proves that for p(n) -> infty with p(n) = o(n^gamma) and Sigma_{ab}(n) = s in (0, 1) as the sole off-diagonal
    covariance entry, the prediction-oracle penalty lambda_oracle = argmin_lambda E[(X_a - sum_{k in Gamma(n)}
    theta_hat_k^{a, lambda} X_k)^2] is inconsistent: P(ne_hat_a^{lambda_oracle} != ne_a) -> 1 as n ->
    infty because any strictly shrunk candidate (0, tau_max, 0, ..., 0) with tau_max < s (Equation A.20)
    admits a perturbation (0, tau_max + delta_theta, delta_theta, 0, ..., 0) along an independent noise
    variable X_3 with directional sign match (Equation A.22) that reduces expected prediction risk by
    L_{delta_theta} - L_0 = -2(s - tau_max) delta_theta + 2 delta_theta^2 < 0 for 0 < delta_theta < (1/2)(s
    - tau_max).'
  evidence:
  - source_id: mb2006-ggm-lasso-pdf
    locator: Sections 2.1-2.2, pp. 3-6, Equations (1)-(3), Proposition 1; Appendix, pp. 19-22, Equations
      (A.20)-(A.22)
    relation: supports
- claim_id: neighborhood-stability-condition-and-exponential-nodewise-support-consistency
  kind: mechanism
  statement: 'Under Assumptions 1-5 (polynomial dimension growth p(n) = O(n^gamma), non-degenerate conditional
    variance Var(X_a | X_{Gamma(n)\{a}}) >= v^2 > 0, sparsity max_a |ne_a| = O(n^kappa) with 0 <= kappa
    < 1, bounded restricted L1 norm ||theta^{a, ne_b \ {a}}||_1 <= vartheta < infty, and minimum partial
    correlation |pi_{ab}| >= delta n^{-(1-xi)/2} for (a, b) in E with xi > kappa) together with Assumption
    6 (Neighborhood Stability: |S_a(b)| < delta < 1 for all b not in ne_a, where S_a(b) := sum_{k in ne_a}
    sign(theta_k^{a, ne_a}) theta_k^{b, ne_a}, Equation 5; satisfied whenever the L1-perturbed population
    problem has ne_a(eta) = ne_a(0) in Proposition 2, automatically on acyclic tree graphs where |S_a(b)|
    = sqrt(1 - v^2) < 1, or under diagonal dominance of Sigma^{-1}(n)), choosing lambda_n ~ d n^{-(1-varepsilon)/2}
    with kappa < varepsilon < xi yields exponential control of both false positives and false negatives:
    Theorem 1 (p. 9; Appendix, pp. 23-25) proves P(ne_hat_a^lambda subseteq ne_a) = 1 - O(exp(-c n^varepsilon))
    (while Proposition 3 proves P(ne_hat_a^lambda subseteq ne_a) -> 0 if |S_a(b)| > 1), and Theorem 2
    (p. 10; Appendix, pp. 25-26) proves P(ne_a subseteq ne_hat_a^lambda) = 1 - O(exp(-c n^varepsilon))
    via Lemmas A.1-A.3 (pp. 15-19, Equations A.1-A.19).'
  evidence:
  - source_id: mb2006-ggm-lasso-pdf
    locator: Sections 2.3-2.5, pp. 6-10, Assumptions 1-6, Equations (4)-(6), Propositions 2-4, Theorems
      1-2; Appendix, pp. 15-20, 22-26, Lemmas A.1-A.3, Equations (A.1)-(A.19), (A.23)-(A.33)
    relation: supports
- claim_id: and-or-edge-aggregation-consistency-and-finite-sample-connectivity-component-fwer-bound
  kind: scope
  statement: 'Defining the estimated graph edge set by either the intersection rule E_hat^{lambda, AND}
    = {(a, b) : a in ne_hat_b^lambda and b in ne_hat_a^lambda} (Equation 7) or the union rule E_hat^{lambda,
    OR} = {(a, b) : a in ne_hat_b^lambda or b in ne_hat_a^lambda} (Equation 8), Corollary 1 (Section 3,
    p. 11) proves under the conditions of Theorems 1-2 that P(E_hat^lambda = E) = 1 - O(exp(-c n^varepsilon))
    -> 1 as n -> infty for both estimators. Furthermore, for any finite sample size n in N without requiring
    Assumptions 1-6, setting the penalty lambda(alpha) = (2 sigma_hat_a / sqrt(n)) Phi_tilde^{-1}(alpha
    / (2 p(n)^2)) where Phi_tilde = 1 - Phi and sigma_hat_a^2 = n^{-1} <X_a, X_a> (Equation 9), Theorem
    3 (Section 3, p. 13; proved in Appendix, p. 27) guarantees that the probability of falsely joining
    any two distinct connectivity components C_a = {b in Gamma(n) : a ~ b} of G is bounded by alpha: P(exists
    a in Gamma(n) : C_hat_a^lambda not subseteq C_a) <= alpha (for both E_hat^{lambda(alpha), AND} and
    E_hat^{lambda(alpha), OR}).'
  evidence:
  - source_id: mb2006-ggm-lasso-pdf
    locator: Section 3, pp. 11-13, Equations (7)-(9), Corollary 1, Theorem 3; Appendix, p. 27, Proof of
      Theorem 3
    relation: supports
