  summary: pFedLA and HeurpFedLA (Layer-Wised Hypernetwork Model Aggregation for Personalized Federated
    Learning) is a distinct concept.
  details: Distinct from pFedHN (AIMech:PFedHnPersonalizedFederatedHypernetworks, Shamsian et al. 2021),
    where a single hypernetwork directly generates the target neural network's raw weight tensors theta_i
    = HN(v_i; psi) rather than generating an N x n cross-client layer-wise convex combination matrix alpha_i
    = HN_i(v_i; psi_i) to aggregate clients' locally trained layer parameters {theta_j^{ln}}; and distinct
    from FedFomo (AIMech:FedFomoFirstOrderModelOptimizationForPersonalizedFederatedLearning, Zhang et
    al. 2021) and FedAMP (AIMech:FedAmpFederatedAttentiveMessagePassingForPersonalizedCrossSiloFederatedLearning,
    Huang et al. 2021), which compute whole-model scalar aggregation weights using parameter/loss distances
    rather than hypernetwork-parameterized layer-granular aggregation matrices.
