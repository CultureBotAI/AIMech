  summary: Generalized LoRA is a distinct concept.
  details: Distinct from standard LoRA (AIMech:LoRA, which tunes only an additive
    low-rank weight residual B without weight scaling A, layer-wise prompt vector
    C, or bias scale/shift tensors D and E), from DoRA (AIMech:DoraWeightDecomposedLowRankAdaptation,
    which normalizes column-wise weight directions and learns a magnitude vector rather
    than searching heterogeneous support tensor types {LoRA, vector, scalar, none}
    in a multi-path supernet), and from DyLoRA (AIMech:DyLoRADynamicSearchFreeLowRankAdaptation,
    which orders ranks within a single LoRA pair via nested dropout rather than searching
    across five distinct support tensor roles). Formulated by Chavan et al. (arXiv:2306.07967).
