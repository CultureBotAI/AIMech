  summary: ACProp Momentum-Centered Asynchronous Adaptive Gradient Optimization is a distinct concept.
  details: Distinct from synchronous uncentered adaptive optimizers (AIMech:Adam, AIMech:RMSProp, AIMech:AMSGrad,
    AIMech:RAdam), which include g_t^2 inside the step-t denominator v_t; distinct from synchronous centered
    adaptive optimizers (AIMech:AdaBelief, AIMech:SDProp), which center the second moment via (g_t - m_t)^2
    but evaluate s_t synchronously in the step-t denominator; and distinct from asynchronous uncentered
    optimizers (AIMech:AdaShift), which decorrelate numerator and denominator using uncentered v_{t-n}
    that decays exponentially to zero during zero-gradient intervals.
