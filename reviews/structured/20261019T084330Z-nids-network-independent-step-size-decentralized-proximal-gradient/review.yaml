  summary: NIDS (Network-Independent Step-Size Decentralized Proximal-Gradient Method)
    is a distinct concept.
  details: Distinct from EXTRA (AIMech:ExtraExactFirstOrderAlgorithmForDecentralizedConsensusOptimization,
    Shi et al. 2015) and PG-EXTRA, which apply the raw mixing matrix W in the gradient
    difference term X^{k+1} = W X^k + X^k - W_tilde X^{k-1} - alpha(nabla S(X^k) -
    nabla S(X^{k-1})) and therefore restrict step sizes by the spectral gap of W (alpha
    < 2 lambda_min(W_tilde) / L), whereas NIDS multiplies the previous gradient by
    W_tilde inside the proximal argument so the maximal stable step size alpha < 2
    / L is completely independent of the network topology.
