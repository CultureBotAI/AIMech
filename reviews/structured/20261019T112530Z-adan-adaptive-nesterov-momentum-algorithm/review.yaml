  summary: Adan (Adaptive Nesterov Momentum Algorithm) is a distinct concept.
  details: 'Distinct from Nadam (Dozat 2016), AdamW (Loshchilov and Hutter 2019),
    Lion (AIMech:LionEvoSignMomentumOptimizer), and AdEMAMix (AIMech:AdEMAMixDualExponentialMovingAverageOptimizer):
    Adan derives its update from an algebraic rearrangement of Nesterov''s extrapolated
    gradient (Lemma 1, Eq. 4) that maintains a dedicated gradient-difference EMA v_k
    with its own decay coefficient beta_2, preconditioning the combined vector m_k
    + (1 - beta_2) v_k by the RMS of the composite Nesterov perturbation g_k + (1
    - beta_2)(g_k - g_{k-1}) and applying exact proximal scaling (1 + lambda_k eta)^{-1}
    for decoupled L2 regularization.'
