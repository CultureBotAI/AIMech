  details: Retain Neal’s finite reversible-base transformation with previous/current-state
    memory as a distinct algorithm. It is not every non-backtracking graph walk or
    every lifted/nonreversible Markov chain. The conditional Liu step is an ingredient,
    not equivalence to general Gibbs sampling or Metropolis-within-Gibbs. Pairwise
