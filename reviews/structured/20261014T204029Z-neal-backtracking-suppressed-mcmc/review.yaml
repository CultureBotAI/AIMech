  summary: Supported within the stated assumptions, inspected passages and finite-calculation
    scope.
  details: The exclusion proposal T(b,c)/(1−T(b,a)) multiplied by min[1,(1−T(b,a))/(1−T(b,c))]
    gives exactly Equation 16’s minimum of two ratios. This verifies the equation-defined
    implementation, separately from the faulty fast branch. When T(b,a)=1, the conditional
    update retains a after the swap; it does not hold the complete pair fixed. The
    two-state alternating example checks that distinction and avoids any unsupported
    0/0 formula. The locators are Section 3 p. 5 Equation 9 for the conditional proposal
    and Section 4 p. 8 Equation 16 for the specialization.
