  summary: Supported within the stated assumptions, inspected passages and finite-calculation
    scope.
  details: Base detailed balance gives mu(a,b)=pi(b)*T(b,a). Conditional balance implies
    sum_a T(b,a)*U_b(a,c)=T(b,c), so the swap/update transition preserves mu(b,c)=pi(b)*T(b,c).
    Summing either coordinate gives pi. This establishes invariance from the stated
    positive-support stochastic kernels without using the erroneous automatic-irreducibility
    claim. Off-diagonal domination reduces the conditional diagonal but does not establish
    connectivity of the pair state space or ordinary detailed balance of the composed
    transition.
