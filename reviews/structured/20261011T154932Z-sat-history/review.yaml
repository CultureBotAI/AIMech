assessments:
- assessment_id: hsat
  area: evidence
  topic: Identity, definition, mechanism, limitations, provenance and explicit AIO
    assessment
  outcome: supported
  target_ids:
  - AIMech:HSAT
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - hsat-source-0
  summary: 'HSAT changes the choice among the global GSAT best-score candidates; it
    does not choose the globally oldest variable regardless of score. The history
    is local to the current attempt, unlike clause-weight or near-solution reuse across
    attempts. It does not impose a tabu exclusion or prohibit an immediate repeat
    when that variable is the only best candidate. IHSAT changes the candidate set
    using the indifferent ISAT rule and is a distinct variant. The deterministic tie
    rule does not make the complete HSAT procedure deterministic because its GSAT
    initialization remains randomized. No normalized identity match was found across
    all 442 pinned AIO labels/scoped synonyms and 322 preceding native IDs/names/aliases.
    Full-checkout fixed-string searches included ignored and hidden files in worktree
    and main, returning 52 and 53 lines respectively. All twenty unique hit contents
    were inspected: neighboring variant references, saved reviews and discovery leads,
    generic novelty wording and an ignored Sphinx comment, not existing candidate
    records. The checkout differences are retained in the ledger. Nine exact AIO CLASS
    nodes with scoped synonyms/comments and outgoing edges and five full native neighboring
    records were inspected. Absence is bounded to this snapshot and semantic neighborhood.'
  details: 'Start an attempt with a random complete assignment as in GSAT and initialize
    the attempt-local flip history. If the formula is not satisfied, evaluate each
    variable by the change in the total number of satisfied clauses caused by flipping
    it. Form the set of variables with greatest score increase, including zero or
    negative best gains when no improving flip exists. Among those candidates, choose
    the one whose last flip in the current attempt was longest ago. Variables never
    flipped in that attempt are treated as oldest; when several such variables are
    candidates, use an arbitrary fixed ordering. Flip the chosen variable, update
    its timestamp and continue within the declared attempt budget. New attempts reset
    the current-attempt history. The source retains the GenSAT outer attempts and
    GSAT candidate-score rule while changing the picking rule. Limits: The 1993 paper
    provides empirical comparisons, not a general convergence, polynomial-time or
    universal performance guarantee. Its conjectures about the importance of randomness
    and greediness are experimental claims on studied tasks. The fixed ordering for
    never-flipped ties must be declared. Selecting the oldest variable outside the
    best-score candidate set, using a tabu tenure, or retaining timestamps across
    attempts changes the stated method. The GenSAT pseudocode checks satisfaction
    before each flip. A final permitted flip needs an explicitly declared post-flip
    check if an implementation is to return a model found exactly at that boundary;
    finite unsuccessful search does not prove UNSAT. Attempt budgets, formula representation
    and score-update costs remain implementation parameters. Historical information
    is bookkeeping rather than necessarily a learning task; no author solver or benchmark
    was executed.'
