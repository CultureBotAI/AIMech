  summary: DCD-PSGD and ECD-PSGD (Difference-Compression and Extrapolation-Compression
    Decentralized Parallel SGD) is a distinct concept.
  details: Distinct from Choco-SGD and Choco-Gossip (AIMech:ChocoSgdAndChocoGossipDecentralizedCompressedOptimization,
    Koloskova, Stich, & Jaggi 2019), which introduce a consensus stepsize gamma in
    (0, 1] on the gossip step x_{t+1} = x_t - eta g_t + gamma sum_j w_{ij} (x_hat_j
    - x_hat_i) to support biased contractive compressors, whereas DCD-PSGD applies
    full-weight gossip W to unbiasedly compressed differences and ECD-PSGD uses harmonic
    O(1/t) extrapolation-averaging.
