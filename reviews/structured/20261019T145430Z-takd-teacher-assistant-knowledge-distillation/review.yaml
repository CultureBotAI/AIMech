  summary: Teacher Assistant Knowledge Distillation (TAKD) is a distinct concept.
  details: 'Introduced by Seyed-Iman Mirzadeh, Mehrdad Farajtabar, Ang Li, Nir Levine,
    Akihiro Matsukawa, and Hassan Ghasemzadeh (AAAI 2020, Vol. 34, No. 04, pp. 5191-5198,
    arXiv:1902.03393, doi:10.1609/aaai.v34i04.5963). Distinct from direct single-step
    Baseline Knowledge Distillation (BLKD, Hinton et al. 2015), from multi-teacher
    ensemble distillation (which averages parallel teachers of similar large capacity),
    and from online Deep Mutual Learning (which co-trains peer networks simultaneously):
    TAKD proves both empirically and via VC generalization bounds (Eqs. 4-12) that
    an overly large teacher degrades a fixed small student, and resolves this by sequential
    capacity-ordered intermediary distillation.'
