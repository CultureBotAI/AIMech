  summary: Distinct mathematical_method for sparse permutation-invariant concentration
    matrix estimation and Cholesky-LQA optimization.
  details: Resolved as a distinct AIMech-native mathematical_method concept from Rothman,
    Bickel, Levina, and Zhu (2008, Electronic Journal of Statistics 2:494-515; arXiv:0801.4837v2,
    DOI:10.1214/08-EJS176). Distinct from AIMech:HighDimensionalCovarianceEstimationByL1PenalizedLogDeterminantDivergence
    (Ravikumar, Wainwright, Raskutti, & Yu 2011), which requires the edge-Hessian
    mutual incoherence (irrepresentable) condition ||Gamma_{S^c S}(Gamma_{SS})^{-1}||_{L1}
    <= 1 - alpha to construct a primal-dual witness for elementwise l_infty error
    and signed edge recovery, whereas SPICE uses convex Frobenius-sphere localization
    G(Delta) = Q(Omega_0 + Delta) on Theta_n(M) without any irrepresentable condition
    and introduces correlation rescaling Omega_tilde_lambda = W_hat^{-1} K_hat_lambda
    W_hat^{-1} to eliminate the O_P(sqrt(p(log p)/n)) diagonal estimation penalty
    and achieve the operator-norm rate O_P(sqrt((s + 1)(log p)/n)), plus a Cholesky-reparameterized
    Omega = T^T T local quadratic approximation (LQA) coordinate descent solver for
    general l_q penalties whose non-convex stationary points are proved globally optimal
    (Proposition 1). Also distinct from AIMech:ConstrainedL1MinimizationForSparsePrecisionMatrixEstimation
    (Cai, Liu, & Luo 2011, which solves p columnwise linear programs without a log-determinant
    barrier), from AIMech:HighDimensionalCovarianceRegularizationByHardThresholding
    (Bickel & Levina 2008b, which thresholds the sample covariance matrix Sigma_hat),
    and from AIMech:MinimaxOptimalTaperingForHighDimensionalCovarianceMatrixEstimation
    (Cai, Zhang, & Zhou 2010, which tapers ordered bandable covariance matrices).
