  title: Replace theme-only ExplainableLLM mappings for SHAP and LIME
  description: The two general explanation methods are linked to a specific LLM class
    solely through their shared explanation theme. That rationale falls short of the
    current mapping policy. A direct relation to the predictive-model object is supported
    by the defining sources. The existing disclaimers already prevent equivalence
    or LLM-efficacy claims, so this is a bounded mapping-precision defect.
