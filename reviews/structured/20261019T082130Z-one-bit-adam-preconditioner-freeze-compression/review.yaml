  summary: 1-bit Adam (Two-Stage Preconditioner-Frozen Error-Compensated Adam) is
    a distinct concept.
  details: Distinct from linear error-compensated SGD methods such as DoubleSqueeze
    (AIMech:DoubleSqueezeDoublePassErrorCompensatedCompression) and Sparsified SGD
    with Error Memory (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression),
    which lack adaptive coordinate-wise preconditioning V^{-1}, and from server-adaptive
    FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam), which
    updates adaptive moments on the server after uncompressed pseudo-gradient aggregation
    rather than freezing Adam's second moment to restore linear error-feedback cancellation.
