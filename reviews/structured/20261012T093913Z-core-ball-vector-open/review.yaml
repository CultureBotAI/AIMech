  summary: Retain this native DRAFT algorithm.
  details: 'An approximate kernel training algorithm that reformulates supported constant-diagonal
    simplex quadratic programs as minimum enclosing balls and repeatedly enlarges
    a core subset with a violating point while reoptimizing its ball. This record
    denotes the original Tsang-Kwok-Cheung CVM procedure and its stated L2 SVM reformulation,
    with exhaustive and practical sampled-search distinctions. It does not conflate
    every SVM loss, generalized CVM, core vector regression, core vector data description
    or BVM. Compared all 442 pinned AIO IDs, labels and scoped synonyms with all 513
    preceding native IDs, names and aliases. No normalized identity collision was
    found for either candidate. Whole-word fixed-string searches of both checkouts
    included ignored and hidden files, expanded names, CVM/BVM acronyms and primary-source
    identifiers. All 22 matches per checkout were inspected in 14 distinct text windows
    at 44 locations: prior queries and unresolved discovery notes, not existing records.
    All 93 semantic AIO rows and 35 native name/definition matches were read. Twelve
    annotated AIO CLASS nodes and outgoing edges and 17 contextual YAMLs were inspected
    or reused after unchanged-byte checks. This is a bounded local corpus assessment.'
- assessment_id: corevectormachine-mapping
  area: grounding
  topic: Related algorithm-to-model AIO mapping
  outcome: supported
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
