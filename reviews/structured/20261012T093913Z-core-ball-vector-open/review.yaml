  - source-locators
  summary: Scientific statement is supported, but the CVM source locator needs correction.
  details: 'CVM is an approximate training procedure for supported kernel quadratic
    programs, not a synonym for generic SVM, a learned classifier instance, support-vector
    data description or BVM. BVM replaces repeated core MEB optimization with fixed-radius
    center movement and optional radius refinement. The original and critique experiments
    involve selected datasets, regularization, kernels, software, tolerances and hardware;
    no universal runtime or accuracy advantage, current implementation validation
    or reproduced benchmark is asserted. Locators: Sections 2-4.1, printed pp365-372
    / PDF pp3-10, Equations 1-19 and CVM iteration; Sections 2-3, printed pp912-915
    / PDF pp2-5; Section 5, printed pp376-389 / PDF pp14-27; Sections 2-4, printed
