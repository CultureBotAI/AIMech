  - tsang2005
  summary: Related mapping is supported without equivalence or subclassing.
  details: The algorithm trains a particular support-vector formulation, making AIO:SupportVectorMachine
    a related model-family target. The pinned target is a Network with layer relations
    and supervised classification/regression scope; it is not identical to this training
    algorithm. Related matching asserts neither equivalence nor subclassing. BinaryClassification,
    Classification, SupervisedLearning and UnsupervisedLearning are tasks, not the
    specific solver; encoding labels in a feature map does not make binary training
    unsupervised. KernelLayer is a component, TrainingStrategy is described as preprocessing,
    and DataPreparation or SelectionAndSamplingBias do not identify the procedure.
    Native SVDD fits a support boundary, SVC adds component labeling, kernel PCA extracts
