- assessment_id: corevectormachine-constant-diagonal-reduction
  area: evidence
  topic: constant diagonal reduction
  outcome: supported
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - finite-boundaries
  summary: Supported within the stated assumptions and evidence-access scope.
  details: 'For feature vectors with a positive-semidefinite kernel, the minimum-enclosing-ball
    dual maximizes sum_i alpha_i*K_ii-alpha^T*K*alpha over nonnegative coefficients
    summing to one. Its center is the feature combination defined by alpha. If K_ii
    is constant kappa, this differs from maximizing -alpha^T*K*alpha only by kappa.
    Dropping the diagonal term for a nonconstant-diagonal kernel changes the optimization.
    Kernel normalization additionally requires positive self-similarities and changes
    the feature geometry. Locators: Sections 2-4.1, printed pp365-372 / PDF pp3-10,
    Equations 1-19 and CVM iteration'
- assessment_id: corevectormachine-specific-l2-svm
  area: evidence
  topic: specific l2 svm
  outcome: concern
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - finite-boundaries
  - source-locators
  summary: Scientific statement is supported, but the CVM source locator needs correction.
  details: 'The binary formulation minimizes ||w||²+b²-2*rho+C*sum_i xi_i² subject
    to y_i*(w^T*phi(x_i)+b)>=rho-xi_i, with C>0 and labels +/-1. Its transformed kernel
    is Ktilde_ij=y_i*y_j*(k_ij+1)+delta_ij/C, with constant diagonal kappa+1+1/C when
    k_ii=kappa. The simplex dual maximizes -alpha^T*Ktilde*alpha. Recover w=sum_i
    alpha_i*y_i*phi(x_i), b=sum_i alpha_i*y_i and xi_i=alpha_i/C. This uses squared
    slack loss and penalized bias; it is not every L1-hinge or unpenalized-bias SVM.
    The source also derives an L2 one-class formulation, which has a different transformed
    kernel. Locators: Section 3.1, printed pp367-369 / PDF pp5-7, Equations 7-13'
- assessment_id: corevectormachine-growing-core-reoptimization
  area: evidence
  topic: growing core reoptimization
  outcome: supported
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - finite-boundaries
  summary: Supported within the stated assumptions and evidence-access scope.
  details: 'For 0<epsilon<=1, maintain a subset of transformed observations and its
    exact minimum enclosing ball. If any training feature lies farther than (1+epsilon)
    times the current radius, add a farthest such feature and recompute the subset
    MEB; stop only when all features satisfy the bound. Kernel expansions compute
    distances without explicit feature coordinates. Added core observations are not
    deleted, although their optimized coefficients can become zero; core membership
    is not identical to final support-vector membership. The practical implementation
    uses warm-started SMO for the inner problem. Locators: Sections 2-4.1, printed
    pp365-372 / PDF pp3-10, Equations 1-19 and CVM iteration'
- assessment_id: corevectormachine-radius-and-shifted-objective-guarantee
  area: evidence
  topic: radius and shifted objective guarantee
  outcome: supported
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - loosli2007
  - finite-boundaries
  summary: Supported within the stated assumptions and evidence-access scope.
  details: 'With exact subset optimization and exhaustive outside-point checking,
    the final core radius R satisfies R<=R_star<=(1+epsilon)*R. For the stated simplex
    quadratic program, the corresponding relative approximation is on the shifted
    objective p_star+kappa_tilde=R_star². It is not a relative guarantee on the unshifted
    SVM objective, classifier labels or test accuracy. Finite inner-solver and outer
    termination tolerances must be distinguished. Locators: Section 4.2, printed pp372-374
    / PDF pp10-12, Equations 21-25; Section 3, printed pp295-298 / PDF pp5-8'
- assessment_id: corevectormachine-sampled-search-is-not-global-certification
  area: evidence
  topic: sampled search is not global certification
  outcome: concern
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - finite-boundaries
  - source-locators
  summary: Scientific statement is supported, but the CVM source locator needs correction.
  details: 'The implementation samples 59 observations to approximate the farthest-point
    search and repeats probabilistic checks near termination. Under independent sampling
    with replacement, 59 draws hit the farthest 5 percent with probability about 0.9515,
    but miss a single violating observation among 1000 with probability about 0.9427.
    These curator calculations distinguish a rank-sampling statement from a certificate
    that every point is enclosed; they do not diagnose the historical random generator
    or reproduce the implementation. Locators: Section 4.1.2, printed p371 / PDF p9;
    Section 5.1, printed p377 / PDF p15; curator calculations in research/discovery/core-ball-vector-boundaries.py'
- assessment_id: corevectormachine-qualified-computational-cost
  area: evidence
  topic: qualified computational cost
  outcome: concern
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - tsang2005
  - finite-boundaries
  - source-locators
  summary: Scientific statement is supported, but the CVM source locator needs correction.
  details: 'The paper derives O(n/epsilon²+1/epsilon^4) work for full farthest-point
    scans with its stated core-size and inner-QP cost model, treating kernel evaluations
    as constant cost. Its O(1/epsilon²) auxiliary QP workspace bound excludes the
    input dataset. Practical implementations store the input and may use caches; approximate
    sampling and numerical solves alter what is certified. Fixed-epsilon bounds do
    not establish unconditional sample-size-independent total runtime or memory. Locators:
    Section 4.3, printed pp374-375 / PDF pp12-13; Section 5.1, printed pp376-377 /
    PDF pp14-15'
- assessment_id: corevectormachine-historical-critique-and-disagreement
  area: evidence
  topic: historical critique and disagreement
  outcome: supported
  target_ids:
  - AIMech:CoreVectorMachine
  evidence_ids:
  - loosli2007
  - tsang-reply-context
  - finite-boundaries
  summary: Supported within the stated assumptions and evidence-access scope.
  details: 'Loosli and Canu report sensitivity and reproduction difficulties for selected
    checkers experiments using the CVM v1.1 Linux binary downloaded in April 2006,
    alongside specific LIBSVM and SimpleSVM comparisons. Their analysis discusses
    inner and outer stopping rules and makes an equivalence assumption for part of
    the derivation. The authors’ reply is retained as abstract-only context: it disputes
    parts of the stopping analysis and attributes some behavior to historical sampling.
    Neither account is treated as a universal verdict on every CVM implementation,
    and the reply’s full derivation was unavailable here. Locators: Sections 2-4,
    printed pp292-298 / PDF pp2-8, especially p297 inner-criterion assumption; Abstract;
    no full reply equations or experiments inspected'
- assessment_id: corevectormachine-identity-and-empirical-boundary
  area: evidence
