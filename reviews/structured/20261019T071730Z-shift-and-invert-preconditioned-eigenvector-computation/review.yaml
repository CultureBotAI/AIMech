  summary: Shift-and-Invert Preconditioning for Faster Leading Eigenvector Computation
    is a distinct concept.
  details: Distinct from Randomized Block Krylov Methods for Stronger and Faster Approximate
    SVD (`AIMech:RandomizedBlockKrylovMethodsForStrongerAndFasterApproximateSVD`),
    which applies polynomial Krylov subspace iteration with full matrix-matrix multiplications
    in O(nnz(A) k log(d) / sqrt(epsilon)) time where nnz(A) and 1/sqrt(gap) are multiplied
    together, whereas Shift-and-Invert Preconditioning with SVRG additively separates
    nnz(A) from d sr(A) / gap^2 and achieves true log(1/epsilon) linear convergence
    in both offline and O(d)-memory streaming PCA.
