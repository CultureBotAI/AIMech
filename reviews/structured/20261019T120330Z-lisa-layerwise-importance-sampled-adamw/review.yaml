  summary: LISA (Layerwise Importance Sampled AdamW) is a distinct concept.
  details: Distinct from BAdam (AIMech:BAdamBlockCoordinateAdamFullParameterOptimization), which partitions
    all model layers into D blocks of equal status and updates one block per K-step epoch via cyclic or
    random-reshuffling block coordinate descent; LISA is grounded in the empirical skewness of layerwise
    weight norms w^{(ell)} = (1/T) sum_{t=1}^T ||theta_t^{(ell)}||_2 in LoRA (where embedding and LM head
    norms exceed intermediate layers by 10^2x), assigning importance-sampling probabilities {1.0, gamma/N_L,
    ..., gamma/N_L, 1.0} so E and H remain continuously active while gamma intermediate layers are sampled
    every K steps. Distinct from LoRA (AIMech:LoraLowRankAdaptation), which freezes base weights and constrains
    updates to rank-r adapter matrices across all layers.
