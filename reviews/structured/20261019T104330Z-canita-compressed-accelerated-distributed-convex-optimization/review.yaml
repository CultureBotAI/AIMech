  summary: CANITA Compressed Accelerated Gradient Method for Distributed Convex Optimization
    is a distinct concept.
  details: Distinct from non-accelerated DIANA (Mishchenko et al., 2019; O((1 + omega/n)
    L / eps) in general convex settings), ADIANA (Li et al., ICML 2020; requires strong
    convexity mu > 0), and uncompressed ANITA (Li, 2021). CANITA (Li & Richtarik,
    NeurIPS 2021, arXiv:2107.09461) is the first distributed method with communication
    compression to achieve the accelerated O(sqrt(L/eps)) leading term on general
    smooth convex objectives.
