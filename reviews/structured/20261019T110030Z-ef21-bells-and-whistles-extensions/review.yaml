  summary: EF21 Algorithmic Extensions (EF21-SGD, EF21-PAGE, EF21-PP, EF21-BC, EF21-HB,
    EF21-Prox) is a distinct concept.
  details: Distinct from baseline EF21 (which requires full-batch local gradients,
    full client participation, uncompressed server broadcasts, no momentum, and smooth
    unconstrained objectives) and from EF-BV (which decomposes compressors into bias
    and variance parameters using an auxiliary scaling lambda). The EF21 extensions
    directly generalize the Markov compression recursion g_i^{t+1} = g_i^t + C_i^t(u_i^{t+1}
    - g_i^t) across six orthogonal operational axes.
