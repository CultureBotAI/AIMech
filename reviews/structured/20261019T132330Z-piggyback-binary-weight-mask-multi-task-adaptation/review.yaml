  summary: Piggyback Binary Weight-Mask Multi-Task Adaptation is a distinct concept.
  details: Distinct from PackNet (Mallya & Lazebnik, CVPR 2018, AIMech:PackNetIterativePruningContinualLearning),
    which prunes and modifies network weights sequentially and degrades as tasks are
    added, from Edge-Popup (Ramanujan et al., CVPR 2020, AIMech:EdgePopupUntrainedSubnetworkScoreOptimization)
    and SupSup (AIMech:SupSupSupermasksInSuperposition), which discover fixed-sparsity
    top-k% subnetworks in randomly initialized networks without task-specific classification
    heads, and from Residual Adapters (Rebuffi et al., NeurIPS 2017), which insert
    additional trainable convolutional filter banks.
