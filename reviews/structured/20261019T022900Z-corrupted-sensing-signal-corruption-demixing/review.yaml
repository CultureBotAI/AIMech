  summary: Corrupted Sensing Convex Signal-Corruption Demixing and Subdifferential
    Distance Bounds is a distinct mathematical_method unifying constrained and penalized
    signal-corruption separation with dense-regime subdifferential distance bounds.
  details: Distinct from standard uncorrupted atomic-norm linear inverse recovery
    (`AIMech:AtomicNormConvexGeometryAndTangentConeGaussianWidthForLinearInverseProblems`),
    conic kinematic demixing under random orthogonal transformations $z_0 = x_0 +
    U y_0$ (`AIMech:ConicStatisticalDimensionIntrinsicVolumeConcentrationAndPhaseTransitions`),
    and proximal denoising / uncorrupted projected LASSO risk (`AIMech:WorstCaseProximalDenoisingNMSEAndSubdifferentialMeanSquaredDistance`).
    Foygel & Mackey (2014) specifically analyze the asymmetric Gaussian sensing-plus-direct-corruption
    model $y = \Phi x^\star + v^\star + z$ ($\Phi \in \mathbb{R}^{n \times p}$, $v^\star
    \in \mathbb{R}^n$), establish universal penalized demixing guarantees with explicit
    penalty ratio $\lambda = t_{\text{cor}}/t_{\text{sig}}$ without requiring knowledge
    of $\|x^\star\|_{\text{sig}}$ or $\|v^\star\|_{\text{cor}}$, prove the weak-decomposability
    gap bound $\min_{t \ge 0}\eta(t \cdot \partial\|x\|) \le \omega(T \cap \mathbb{B}^p)
    + 6$ (Proposition 1), and derive dense-regime subdifferential squared-distance
    bounds strictly below $p$ via dual-norm Gaussian widths (Propositions 3-5).
