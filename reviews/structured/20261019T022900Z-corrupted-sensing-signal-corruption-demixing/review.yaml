  summary: 'Verified in pure Python: (1) for l_1 subdifferential squared distance
    in R^p (p=1000), Foygel & Mackey''s dense-regime bound Eq. (9) p*(1 - (2/pi)*(1
    - s/p)^2) is strictly below p for all s/p < 1 and strictly tighter than Chandrasekaran
    et al.''s bound Eq. (8) 2s*log(p/s) + 1.5*s for all s/p >= 0.07 (at s/p = 0.07:
    0.449388 vs 0.477296; at s/p = 0.25: 0.641901 vs 1.068147); (2) Proposition 4
    block-sparse l_1/l_2 dense bound Eq. (25) at k=5, m=200, s=40 evaluates to 0.420535*p
    (Monte Carlo mean: 0.413873*p) vs sparse bound Eq. (24) 0.877510*p, and Proposition
    5 nuclear-norm bound at m1=50, m2=40, r=4 evaluates to 0.983644*m1*m2 < m1*m2;
    and (3) Corollary 1 Wyner coding max corruption fraction where psi_l1(gamma_0)
    = 0.5 solves to gamma_0 = 0.192845 (~= 19.3%), and Theorems 1 & 2 recovery thresholds
    at p=500, s_sig=5, n=1200, gamma_cor=0.02 satisfy tau_thm1 = 13.5816 < tau_thm2
    = 30.8745 < mu_n = 34.6266 with penalty ratio lambda = t_cor/t_sig = 0.88295.'
