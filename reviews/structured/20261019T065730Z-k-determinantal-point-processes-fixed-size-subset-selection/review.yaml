  summary: k-Determinantal Point Processes for Fixed-Size Subset Selection is a distinct
    concept.
  details: Distinct from Volume Sampling for Matrix Approximation and Projective Clustering
    (`AIMech:VolumeSamplingForMatrixApproximationAndProjectiveClustering`), which
    analyzes the multiplicative (k+1)! ||A - A_k||_F^2 row-span projection error of
    simplex-volume sampling for low-rank matrix approximation and projective clustering
    rather than conditional L-ensemble inference, quality-diversity decompositions
    L_{ij} = q_i phi_i^T phi_j q_j, and the elementary symmetric polynomial DP sampler
    of Kulesza and Taskar (2011). Also distinct from standard unconditioned DPPs,
    which cannot enforce a hard cardinality budget |Y| = k.
