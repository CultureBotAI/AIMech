  summary: Byrd-SAGA Byzantine-Resilient Distributed SAGA with Geometric Median Aggregation
    is a distinct concept.
  details: 'Distinct from standard SAGA (AIMech:SagaStochasticAverageGradientAmeliore,
    which uses single-machine or fragile mean aggregation and fails under a single
    Byzantine worker) and from Byzantine-robust SGD aggregators such as Krum, Geometric
    Median SGD, Bulyan (AIMech:BulyanByzantineResilientGradientAggregation), RSA (AIMech:RsaByzantineRobustStochasticAggregationForHeterogeneousDatasets),
    and Bucketing (AIMech:BucketingForAgnosticByzantineRobustAggregationOnHeterogeneousDatasets):
    Byrd-SAGA (Wu, Ling, Chen, & Giannakis, IEEE TSP 2020) couples per-worker SAGA
    finite-sum variance reduction with server-side geometric median aggregation so
    that the inner stochastic gradient variance sigma^2 vanishes along the optimization
    trajectory, removing the O(C_alpha^2 sigma^2 / mu^2) asymptotic error floor of
    Byzantine-resilient SGD.'
