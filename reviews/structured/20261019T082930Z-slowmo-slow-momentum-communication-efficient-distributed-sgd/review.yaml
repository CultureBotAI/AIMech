  summary: SlowMo (Slow Momentum for Communication-Efficient Distributed SGD) is a
    distinct concept.
  details: Distinct from standard Local SGD (AIMech:LocalSgdPeriodicAveragingParallelStochasticGradientDescent,
    Stich 2019), which corresponds to the memoryless special case alpha = 1, beta
    = 0 without outer slow momentum u_t, and from FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam,
    Reddi et al. 2021), which focuses on adaptive second-moment server preconditioners
    (FedAdagrad, FedYogi, FedAdam) under partial client participation rather than
    wrapping decentralized gossip/SGP and local base optimizers with outer Polyak
    momentum and proving BMUF/Lookahead non-convex convergence.
