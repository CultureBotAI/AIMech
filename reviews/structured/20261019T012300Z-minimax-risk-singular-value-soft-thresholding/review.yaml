  summary: Minimax Risk and Least-Favorable Subspace Characterization of Matrix Denoising
    by Singular Value Soft Thresholding is a distinct mathematical method separating
    proportional-rank SVST minimax decision theory from fixed-rank optimal singular
    value shrinkage and hard thresholding.
  details: Checked against all 442 pinned AIO concepts and 648 maintained AIMech concepts.
    Distinct from AIMech:LossSpecificOptimalSingularValueShrinkageForMatrixDenoising
    (Gavish & Donoho 2017) and AIMech:OptimalSingularValueHardThresholdingAtFourOverSqrtThree
    (Gavish & Donoho 2014), which analyze fixed low-rank r << m_n, n spiked matrix
    asymptotics via Benaych-Georges-Nadakuditi singular vector rotation cosines c(x),
    tilde_c(x), whereas Donoho & Gavish (2014) analyze the proportional-rank regime
    r_n / m_n -> rho in (0, 1) where the signal subspace has macroscopic dimension
    and the residual (m-r) x (n-r) noise block follows a compressed Marcenko-Pastur
    law with effective aspect ratio gamma = (tilde_rho - rho tilde_rho)/(rho - rho
    tilde_rho); and distinct from AIMech:SingularValueThresholdingForMatrixCompletion
    (Cai, Candes, & Shen 2010), which introduces iterative Uzawa singular value soft
    thresholding for incomplete matrix completion without SURE singular-value monotonicity
    or minimax risk curves.
