  - identity
  summary: Related mappings are bounded curator assessments.
  details: This finite-lag input-output model family provides a representation used
    in time-series analysis and system identification. The pinned target is an analysis
    task, so this is a model/task relationship rather than equivalence or an is-a
    assertion. Both represent dependence on lagged outputs and other inputs. The pinned
    ARDL definition does not resolve nonlinear function classes or the exclusion of
    lagged errors. A shared lag structure warrants a related mapping, not identity
    or an inferred subclass from an underspecified definition. This finite-lag input-output
    model family provides a representation used in time-series analysis and system
    identification. The pinned target is an analysis task, so this is a model/task
    relationship rather than equivalence or an is-a assertion. Both use autoregressive
    and lagged-error structure. The pinned ARMA class describes stationary-series
    modeling; this record allows nonlinear functions and exogenous inputs and does
    not imply stationarity. The shared structure supports a related mapping, not an
    exact or broader-class claim.
- assessment_id: r0-finite-lag-predictor
  area: evidence
  topic: finite-lag-predictor
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveExogenousModel
  evidence_ids:
  - chen-luo1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'In the strictly causal scalar formulation, y_t=f(y_{t−1},…,y_{t−ny},u_{t−1},…,u_{t−nu})+e_t.
    The lag orders and function parameterization are model choices. The 1989 OLS paper
    defines NARX by omitting lagged noise from its general NARMAX form; the current
    additive noise term remains. Setting that term to zero gives a deterministic recurrence.
    A neural network is not required by this definition. Locators: Section 2, Equations
    1–6, PDF p. 3 / printed p. 1874'
- assessment_id: r0-parameter-estimation-boundary
  area: evidence
  topic: parameter-estimation-boundary
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveExogenousModel
  evidence_ids:
  - chen-luo1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'For a fixed polynomial NARX structure, measured lagged input/output values
    form a fixed design matrix and coefficient fitting can be posed as linear least
    squares. Structure selection and coefficient estimation are distinct from the
    model family. Being linear in coefficients does not make the observed dynamics
    linear, and a least-squares fit alone establishes neither physical causation nor
    valid generalization. Locators: Section 2, Equations 6–13 and structure-selection
    discussion, PDF pp. 3–5 / printed pp. 1874–1876; curator exact examples in research/discovery/narx-narmax-boundaries.py'
- assessment_id: r0-local-representation-boundary
  area: evidence
  topic: local-representation-boundary
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveExogenousModel
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'A chosen output-history recurrence must be well-defined on its stated
    domain. In the source example x_next=x+u, y=x+x², solving for x gives two possible
    branches unless the state is restricted. States x=0 and x=−1 have the same current
    output 0; with the same input u=1/4 their next outputs are 5/16 and −3/16. Thus
    those one-step observed arguments alone do not define a global single-valued update
    across both branches. This example does not rule out other history lengths or
    restricted-domain representations. Locators: Section 2.2, Example 1, PDF p. 3
    / printed p. 1015; curator exact examples in research/discovery/narx-narmax-boundaries.py'
- assessment_id: r0-polynomial-scope
  area: evidence
  topic: polynomial-scope
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveExogenousModel
  evidence_ids:
  - chen-luo1989
  - chen-billings1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'A polynomial parameterization expands finite lag variables into monomials
    and is linear in the monomial coefficients, while it can be nonlinear in the input
    and output values. The continuous scalar recurrence function on a specified compact
    finite-dimensional lag domain can be uniformly approximated by some polynomial;
    this does not prescribe a fixed degree, identify coefficients from finite observations,
    justify extrapolation, or guarantee stable recursive trajectories. The general
    model family is not restricted to polynomial parameterizations. Locators: Section
    2, Equations 6–13, PDF pp. 3–5 / printed pp. 1874–1876; Section 4, Equations 34–43,
    PDF pp. 9–11 / printed pp. 1021–1023; curator exact examples in research/discovery/narx-narmax-boundaries.py'
- assessment_id: r0-identification-use
  area: evidence
  topic: identification-use
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveExogenousModel
  evidence_ids:
  - chen-luo1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'The OLS study uses polynomial NARX structure selection to model measured
    pilot liquid-level input-output data. This is a documented system-identification
    use, not evidence that all NARX fits recover a physical mechanism or outperform
    alternative models. The generic family also permits formulations other than the
    particular polynomial fit. Locators: Section 6, Example 1, Figure 2 and Table
    1, PDF p. 21 / printed p. 1892'
- assessment_id: r1-lagged-error-recurrence
  area: evidence
  topic: lagged-error-recurrence
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveMovingAverageExogenousModel
  evidence_ids:
  - chen-luo1989
  - chen-billings1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'In the strictly causal scalar form, y_t=F(y_{t−1},…,y_{t−ny},u_{t−1},…,u_{t−nu},e_{t−1},…,e_{t−ne})+e_t.
    Removing explicit lagged-error dependence gives NARX; removing exogenous inputs
    gives a NARMA form. The moving-average terminology here concerns lagged errors
    inside a possibly nonlinear function, not a running arithmetic average of observations.
    Finite-lag recurrence structure does not require a neural network. Locators: Section
    2, Equations 1–6, PDF p. 3 / printed p. 1874; Section 6, Equations 69–72, PDF
    p. 16 / printed p. 1028'
- assessment_id: r1-innovation-versus-fitted-residual
  area: evidence
  topic: innovation-versus-fitted-residual
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveMovingAverageExogenousModel
  evidence_ids:
  - chen-billings1989
  - chen-luo1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'In the conditional-mean innovation construction, the prediction is the
    conditional expectation of the current output given available past information,
    and the innovation is output minus that expectation. This interpretation requires
    the relevant moments and information set; it does not imply independent Gaussian
    errors. The companion OLS formulation separately assumes zero-mean independent
    noise. For an estimated model with chosen parameters, recursively computed prediction
    residuals are parameter-dependent and are not automatically the true innovations
    of the data-generating system. Locators: Section 6, Equations 58–69 and 77–81,
    PDF pp. 15–16,18 / printed pp. 1027–1028,1030; Section 2, Equations 1–5 and noise
    definition, PDF p. 3 / printed p. 1874'
- assessment_id: r1-latent-error-estimation
  area: evidence
  topic: latent-error-estimation
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveMovingAverageExogenousModel
  evidence_ids:
  - chen-luo1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'Polynomial expansion is formally linear in coefficients, but lagged noise
    variables are not directly observed. Consequently the regressor matrix is not
    fixed directly from input-output measurements. The OLS paper describes an iterative
    extension that substitutes prediction residuals, rebuilds noise-containing regressors
    and refits. This is one estimator for the family; its reported few-iteration behavior
    is not a universal convergence guarantee or a definition of NARMAX itself. Locators:
    Sections 2 and 5, Equations 83–91, PDF pp. 5,18–20 / printed pp. 1876,1889–1891'
- assessment_id: r1-residual-initialization-and-stability
  area: evidence
  topic: residual-initialization-and-stability
  outcome: supported
  target_ids:
  - AIMech:NonlinearAutoregressiveMovingAverageExogenousModel
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Supported within explicit source and mathematical conditions.
  details: 'Prediction with lagged errors requires residual initialization. Model
    invertibility asks whether residual sequences from different initializations forget
    that difference for the specified model and input process. Linearity in lagged
    errors alone is insufficient: in y_t=u_{t−1}²+a*e_{t−1}+e_t, two residual recursions
    driven by identical observations differ by (−a)^t times their initial difference.
    With initial difference 1, the difference after eight steps is 1/256 for a=1/2
