  summary: PPT Pre-Trained Prompt Tuning for Few-Shot Learning is a distinct concept.
  details: Distinct from vanilla Prompt Tuning (Lester et al., EMNLP 2021, AIMech:PromptTuning),
    which initializes soft prompts randomly or from vocabulary word embeddings and
    suffers high variance and poor accuracy in few-shot settings, and from SPoT (Vu
    et al., ACL 2022, AIMech:SPoTSoftPromptTransfer), which transfers soft prompts
    from supervised source tasks rather than self-supervised pre-training on unlabeled
    corpora via unified Pattern-Verbalizer Pairs.
