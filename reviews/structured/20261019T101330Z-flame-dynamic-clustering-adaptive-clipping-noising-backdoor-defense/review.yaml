  summary: FLAME Dynamic Clustering and Adaptive Clipping-Noising Backdoor Defense
    is a distinct concept.
  details: Introduced by Nguyen et al. (USENIX Security 2022, pp. 1415-1432, arXiv:2101.02281).
    Distinct from fixed-two-cluster defenses such as Auror (Shen et al. 2016) and
    Krum, which fail when an attacker simultaneously injects multiple backdoors or
    honeypot outliers (pigeonhole principle), and from CRFL (AIMech:CrflCertifiablyRobustFederatedLearningViaParameterClippingAndSmoothing),
    which clips and perturbs the aggregated global model for randomized parameter
    smoothing rather than combining HDBSCAN pairwise cosine filtering with median-update-norm
    adaptive clipping before noise injection.
