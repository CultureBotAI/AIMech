  rationale: Concrete and Gumbel-Softmax are one distributional concept with objective-specific
    qualifications. Hard-forward straight-through differentiation changes the estimator,
    while conditional-max ancestral sampling is a separate exact finite-distribution
    algorithm. Shared Gumbel noise does not equate these mechanisms.
limitations:
- Adversarial author self-review only; all records remain DRAFT.
- Positive-temperature relaxed and straight-through gradients need not equal the gradient
  of a discrete objective; training objectives require their own density and regularity
  assumptions.
- Ancestral exactness concerns a finite normalized Bayesian DAG and consistent conditional
  maxima, not arbitrary graphical models or certified numerical software.
- Only the declared PDF pages and finite curator examples were inspected. No author
  implementation, model execution or numerical benchmark was run.
- There are 187 pending inspection leads plus unresolved dispositions; discovery remains
