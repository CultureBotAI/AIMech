  summary: Retain Concrete as an alias of the Gumbel-Softmax relaxation.
  details: The two primary sampling formulas agree after cancellation of a common
    log-weight shift. Positive temperature yields a continuous simplex vector; argmax
    rounding is categorical at every positive temperature, and zero temperature is
    only a limit. Infinite temperature approaches the uniform vector, not uniform
    density. The binary equal-weight temperature-one case has uniform density, a special
    case rather than a general Dirichlet identity. Pathwise gradients can target the
    relaxed objective without being unbiased for the discrete objective. Both claim-level
    citations support the distribution/objective distinction; Concrete’s criticism
    is not extrapolated to every historical implementation.
