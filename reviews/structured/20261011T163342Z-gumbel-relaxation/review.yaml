  details: 'The downstream derivative is evaluated using the hard forward state and
    multiplied by the soft sample Jacobian. This generally differs from differentiating
    the fully relaxed loss or the hard argmax itself. Exact hard-sample probabilities
    do not establish an unbiased discrete gradient: the finite binary calculation
    gives expected straight-through gradient 1/6 versus exact discrete-objective gradient
    1/4. The record explicitly requires a usable downstream derivative and does not
    turn a discrete black-box reward into one.'
