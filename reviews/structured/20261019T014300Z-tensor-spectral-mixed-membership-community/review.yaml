  summary: Tensor Spectral Decomposition of Centered 3-Star Graph Moments for Dirichlet
    Mixed-Membership Community Models is a distinct algorithm solving dyadic network
    MMSBs via 5-way vertex partitioning, Dirichlet 3-star moment centering, and neighborhood-initialized
    tensor power iteration.
  details: Checked against all 442 pinned AIO concepts and 650 maintained AIMech concepts.
    Distinct from `AIMech:OrthogonalTensorPowerMethodForLatentVariableModels` (Anandkumar,
    Ge, Hsu, Kakade, & Telgarsky 2014, JMLR 15:2773-2832), which analyzes general
    symmetric orthogonal tensor power iteration for exchangeable multi-view, GMM,
    ICA, and topic models where views are conditionally independent given a single
    node's latent state, whereas in MMSB networks every edge $G_{u,v}$ couples TWO
    vertices' Dirichlet membership vectors $\pi_u$ and $\pi_v$, requiring 5-way vertex
    partitioning $(X, Y, A, B, C)$ for conditional independence, Dirichlet $\alpha_0$-centering
    of 3-star subgraph count tensors against cross-partition pair moments, neighborhood
    SVD initialization with adaptive threshold deflation, and the linear pseudo-inverse
    $\hat{Q}$ estimator for $\hat{P} = \hat{Q} G \hat{Q}^\top$. Also distinct from
    `AIMech:MixedMembershipStochasticBlockmodel` (Airoldi, Blei, Fienberg, & Xing
    2008), which defines the generative model and nested variational EM inference
    without tensor spectral moment centering or polynomial-time $\ell_1$/$\ell_\infty$
    recovery guarantees.
