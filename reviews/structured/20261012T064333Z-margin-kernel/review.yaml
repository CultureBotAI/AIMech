limitations:
- Adversarial author self-review only; both records remain DRAFT.
- The first history command failed argument validation before creating a sidecar;
  the documented actor and event enums were used successfully on retry. Required final
  gates passed.
- All twelve pages of Zhao-Kwok-Zhang2009 were visually read, including equations,
  pseudocode, experiments and bibliography. Printed page equals PDF page plus 637.
  Pages 8-9 were rechecked during final formulation drafting.
- 'The binary aggregate score constraint is a relaxation of label-count balance, not
  a generally equivalent replacement. A zero-feature counterexample proves distinct
  feasible predictions and objective minima: at n=4,l=1,C=1,b=1/4 the relaxed objective
  is 3/4; a balanced two-positive/two-negative labeling has average hinge (max(0,1-b)+max(0,1+b))/2>=1
  for every b, attained at b=0 with zero weights. The finite bias grid supplements
  this analytic inequality rather than proving it alone.'
- The mixed kernel uses nonnegative L2-bounded weights, with closed quadratic-over-linear
  regularization at zero weight. An arbitrary sum of weighted feature vectors can
  introduce cross terms and is not its general feature map.
- At zero scores, a zero absolute-value subgradient can leave the binary inner solver
  at a non-locally-optimal point; tied multiclass top scores make every printed strict
  winner indicator zero. Implementation conventions and initialization are therefore
  material limits.
- No global-optimum, unconditional local-optimum, universal convergence or linear
  end-to-end runtime claim. The printed Equation3.21 linear beta-sum term differs
  from the stated squared-weight constraint; that proof inconsistency is recorded
  without pretending to refute every possible complexity result. Kernel feature dimension
  and construction costs also matter.
- No numeric benchmark claims, historical implementation execution, model training,
  paid service or complete-paper redistribution. Primary abstracts and citations for
  six follow-up cohorts do not certify their unread methods.
- Two additions bring the native collection to 498; 442 pinned AIO records are unchanged.
  There are 422 pending frontier cohorts plus other unresolved dispositions; discovery
  has not reached saturation.
