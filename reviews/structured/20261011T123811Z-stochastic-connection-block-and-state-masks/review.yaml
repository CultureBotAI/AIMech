assessments:
- assessment_id: dropconnect
  area: evidence
  topic: Identity, definition, mechanism, source conventions and AIO relations
  outcome: supported
  target_ids:
  - AIMech:DropConnect
  evidence_ids:
  - identity
  - mapping
