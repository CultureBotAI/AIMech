assessments:
- assessment_id: wakesleepalgorithm
  area: evidence
  topic: Identity, definition, mechanism, limitations, provenance and explicit AIO
    assessment
  outcome: supported
  target_ids:
  - AIMech:WakeSleepAlgorithm
  evidence_ids:
  - identity
  - mapping
