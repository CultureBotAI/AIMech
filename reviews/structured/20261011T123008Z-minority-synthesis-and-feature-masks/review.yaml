  summary: Retain continuous-feature SMOTE as a preprocessing method.
  details: The prose and Table1 support scalar interpolation among minority-class
    neighbors. The per-attribute random gap inside the pseudocode loop is explicitly
    distinguished, not silently asserted as equivalent. Majority undersampling is
    optional composition; cross-class target mixing and nominal variants are different
    mechanisms. Synthetic labels and neighbor geometry do not guarantee true minority-support
    membership, distinct observations or better performance.
