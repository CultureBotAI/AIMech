  - neighbors
  summary: Retain the 2019 ADL feature-map layer.
  details: Channel averages supply the spatial map, thresholding supplies one branch
    and sigmoid weights the other. Branch probability is distinct from pixel-drop
    fraction. The source does not specify threshold equality; no executable tie rule
    is invented. Training-only parameter-free map operations do not imply zero computation
    or calibrated localization. Background reliance is an explicitly inspected failure
    mode. Dot-product attention and full bounding-box prediction are different concepts.
- assessment_id: mapping-boundaries
  area: grounding
  topic: Preprocessing versus layers and exact attention/dropout definitions
  outcome: supported
  target_ids:
  - AIMech:SyntheticMinorityOversamplingTechnique
  - AIMech:DropBlock
  - AIMech:AttentionBasedDropoutLayer
  evidence_ids:
  - identity
  - mapping
  - neighbors
  summary: Retain three distinct concepts with broad and related mappings.
  details: SMOTE maps broadly to DataAugmentation as a particular synthesis preprocessing
    method. DropBlock and ADL map broadly to generic Layer and relate to DropoutLayer
    while retaining their distinct masks, normalization and gating. Exact AttentionLayer
    denotes dot-product/Luong attention, which ADL does not implement. RegularizationLayer
    describes additive loss penalties, not these transformations; MaskingLayer skips
    sequence timesteps; SpatialDropout2D drops whole maps; ImageAugmentationLayer/PreprocessingLayer
    have different placement or modality scope. SamplingBias is a bias concept, not
    SMOTE identity. Eleven exact AIO nodes with scoped synonyms/comments/edges and
    five native neighbors were inspected.
