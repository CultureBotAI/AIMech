  - neighbors
  summary: Retain DropBlock with source and pinned-code conventions.
  details: The pinned author-linked TensorFlow function resolves gamma as the drop-seed
    probability. Expanded blocks overlap, so desired drop fraction is approximate.
    Per-mask paper normalization and whole-mask-tensor code normalization differ,
    and the code lacks a zero-retention guard. Ordinary inference is identity; source
    diagnostic inference perturbations are not the default prediction rule. Static
    inspection does not certify runtime compatibility or reproduction of the 2018
    experiment.
