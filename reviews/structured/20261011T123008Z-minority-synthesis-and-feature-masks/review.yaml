- assessment_id: dropblock
  area: evidence
  topic: Identity, definition, mechanism, source conventions and AIO relations
  outcome: supported
  target_ids:
  - AIMech:DropBlock
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - dropblock-source-0
  - dropblock-source-1
  summary: DropBlock defines a structured dropout transformation of intermediate convolutional
    feature maps, rather than an entire CNN, input-only Cutout augmentation or always-whole-channel
    SpatialDropout. The paper’s default uses separate spatial masks for feature channels;
    a shared-channel mask is an examined alternative. A block spanning a whole map
    and a block of size1 are boundary settings, not equivalence of the general methods.
    No normalized identity match was found across all 442 pinned AIO labels/scoped
    synonyms and 273 preceding native IDs/names/aliases. Full-checkout fixed-string
    searches included ignored and hidden files in worktree and main, returning 18
    and 18 lines respectively. Every text hit was a prior candidate lead. Eleven exact
    AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native
    neighboring mechanisms were inspected. Absence is bounded to this snapshot and
    semantic neighborhood.
  details: 'During training, sample block seeds within the spatial region whose expanded
    square blocks fit inside the feature map, suppress the union of those blocks,
    multiply activations by the resulting keep mask and normalize using the observed
    retained-mask fraction. The paper uses a block size and a seed probability gamma
    computed approximately from the desired keep probability, block area and number
    of valid centers. Overlap makes the formula approximate. The author-linked pinned
    TensorFlow implementation confirms gamma as the probability that a valid center
    becomes a drop seed. It supports square feature maps, clamps block size to map
    width, expands zeros using minimum pooling, and computes normalization from the
    resulting mask tensor as a whole. During ordinary inference, the transformation
    returns its input unchanged. The paper recommends a linear decrease of keep probability
    from1 to a target during training; this schedule is an experimental choice rather
    than a new learned mask. Limits: Algorithm1 writes M~Bernoulli(gamma) while expanding
    zero entries, yet Equation1 and the pinned implementation use gamma as the drop-seed
    rate. These literal conventions differ under the usual Bernoulli success convention;
    the implementation resolves the convention used here without claiming an author-issued
    erratum. The gamma expression does not guarantee the target retained fraction
    at every location or in every realization. Block overlap and edge coverage matter.
    The paper’s per-mask normalization and the pinned implementation’s whole-mask-tensor
    normalization should not be silently equated. Both the displayed ratio and inspected
    code require a nonzero retained fraction; the inspected function has no all-zero-mask
    guard. Valid block sizes, probabilities, tensor shapes and numerical safeguards
    are implementation requirements, not consequences of the name DropBlock. Random
    blocks are independent of a semantic object annotation and may remove useful information.
    The experiments with masking at inference are diagnostic perturbations, separate
    from the ordinary identity behavior. Reported architecture-specific gains and
    robustness do not establish universal benefits, and no author code or model was
    executed.'
  dimensions:
  - name: concept-kind
    value: layer
    definition: A training-data preprocessing procedure or a defined neural-network
      feature-map component, not a trained classifier or complete localization architecture.
    evidence_ids:
    - dropblock-source-0
    - dropblock-source-1
  - name: aio-relations
    value: 'broad_match: AIO:Layer; related_match: AIO:DropoutLayer'
    definition: The method is represented as the defined neural-network component
      that transforms an input feature map for subsequent layers. The generic AIO
      Layer is broader than this particular transformation. DropBlock shares stochastic
      training-time activation suppression with dropout. Its contiguous blocks, overlapping
      coverage and realized-mask normalization differ from the pinned independent-unit/fixed-rate
      description, so this is a related association rather than equivalence or a forced
      subclass claim.
    evidence_ids:
    - mapping
- assessment_id: attentionbaseddropoutlayer
  area: evidence
  topic: Identity, definition, mechanism, source conventions and AIO relations
  outcome: supported
  target_ids:
  - AIMech:AttentionBasedDropoutLayer
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - attentionbaseddropoutlayer-source-0
  summary: This is the 2019 ADL component, not a complete localization network or
    a trained checkpoint. Its self-attention map is a channel average of feature activations,
    not dot-product query/key attention. It differs from random-block DropBlock, whole-channel
    dropout and Cutout by selecting strongly activated spatial regions from the current
    feature map and alternating their suppression with continuous importance gating.
    No normalized identity match was found across all 442 pinned AIO labels/scoped
    synonyms and 273 preceding native IDs/names/aliases. Full-checkout fixed-string
    searches included ignored and hidden files in worktree and main, returning 18
    and 18 lines respectively. Every text hit was a prior candidate lead. Eleven exact
    AIO CLASS nodes with scoped synonyms/comments and outgoing edges and five native
    neighboring mechanisms were inspected. Absence is bounded to this snapshot and
    semantic neighborhood.
  details: 'Average the input convolutional feature tensor over channels to obtain
    one spatial attention map. Set a threshold to a configured fraction gamma of that
    map’s maximum; construct a binary drop mask that suppresses positions above the
    threshold. Separately apply a sigmoid to the attention map to obtain importance
    weights. On a training iteration, choose the drop mask with the configured drop
    rate and otherwise choose the importance map, then multiply the selected spatial
    map into the input features across channels. These map operations add no trainable
    parameters; gradients through the importance branch train the surrounding classifier.
    ADL is disabled at testing and returns the feature map unchanged, without a train/test
    distribution compensation step. The source uses image-level classification labels
    and a separate heatmap extraction/localization procedure; ADL itself does not
    output an object bounding box. Limits: The drop rate controls how often the drop-mask
    branch is selected, not the fraction of pixels removed. Thresholding depends on
    the activation distribution; the source prose specifies greater-than and less-than
    comparisons but leaves equality at the threshold unresolved. The record does not
    invent a tie rule or implementation-specific batching convention. Sigmoid importance
    weights lie between zero and one and reweight regions relative to each other;
    they do not necessarily amplify raw activation magnitudes. The averaged attention
    map is a heuristic signal, not a calibrated explanation or guaranteed object mask.
    No added trainable parameters does not mean zero training computation. Placement,
    threshold and branch probability are choices; classification and localization
    can trade off, and low-level maps need not capture class-specific object regions.
    The source explicitly shows that attention suppression can encourage reliance
    on co-occurring background rather than the object. The inspected evaluation is
    single-object localization; broader segmentation compatibility is a proposed application,
    not an established universal result. No benchmark superiority or complete-object-coverage
    guarantee is asserted.'
  dimensions:
  - name: concept-kind
    value: layer
    definition: A training-data preprocessing procedure or a defined neural-network
      feature-map component, not a trained classifier or complete localization architecture.
    evidence_ids:
    - attentionbaseddropoutlayer-source-0
  - name: aio-relations
    value: 'broad_match: AIO:Layer; related_match: AIO:DropoutLayer'
    definition: ADL is a specific input-to-output feature-map component inside a classifier,
      so the generic AIO Layer has broader scope. ADL stochastically suppresses activations
      during training, which relates it to dropout. Its activation-dependent mask,
      alternative sigmoid branch and lack of the pinned fixed-rate dropout rescaling
      prevent identity or an unqualified subclass assertion.
    evidence_ids:
    - mapping
