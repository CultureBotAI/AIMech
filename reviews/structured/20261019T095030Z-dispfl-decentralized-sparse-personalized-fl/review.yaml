  summary: 'DisPFL: Decentralized Sparse Training for Personalized Federated Learning
    is a distinct concept.'
  details: Distinct from centralized sparse FL algorithms such as PruneFL (AIMech:PruneFlAdaptiveDistributedParameterPruningForFederatedLearning;
    Jiang et al., IEEE TNNLS 2023), which maintains a single shared global pruned
    mask reconfigured by a central server to minimize global empirical risk rather
    than personalized per-client ERK masks over a decentralized peer-to-peer topology.
    Distinct from dense decentralized SGD algorithms such as D-PSGD (Lian et al.,
    2017) and D^2 (AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData;
    Tang et al., ICML 2018), which communicate and average full dense parameter vectors
    across all nodes rather than performing support-intersection-normalized averaging
    combined with local magnitude pruning and gradient-magnitude regrowth.
