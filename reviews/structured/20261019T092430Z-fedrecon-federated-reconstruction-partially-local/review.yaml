  summary: FedRecon (Federated Reconstruction for Partially Local Federated Learning)
    is a distinct concept.
  details: Distinct from stateful partially local methods such as FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers,
    Arivazhagan et al. 2019), FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning,
    Collins et al. 2021), and LG-FedAvg (AIMech:LgFedAvgLocalGlobalRepresentationsFederatedLearning,
    Liang et al. 2020), all of which require clients to persistently store their private
    parameters across communication rounds and cannot directly evaluate on unseen
    stateless cross-device clients without a reconstruction step; FedRecon discards
    local parameters after every round and reconstructs them on the fly via support/query
    splitting, naturally generalizing to unseen clients at inference time via ReconEval.
