  snapshot_sha256: 1f2fe51989fb5fade732a782814568252c6d056aec22e0824a8dddf46bfd7c42
  support: supports
  summary: 'Verified in pure Python across six regimes: (1) Proposition 3 equivalence
    between Soft-IPOD and Huber''s M-estimator holds to 1e-13 (||X^T psi_H(y - X*beta_hat;
    lambda)||_inf = 1e-13) and concomitant scale sigma^2 matches ||r_S||_2^2 / (n
    - p) to 0.0; (2) Theorem 1 equivalence between alternating Algorithm 1 and H-compressed
    Algorithm 2 holds to 0.0 with zero objective descent violations under both continuous
    P_Theta_H and discrete l_0 penalties, and two-stage M-score ||X^T psi_Theta_H(H*gamma_hat
    + r_0; lambda)||_inf = 1e-14 (Proposition 2); (3) on a leveraged mask design (n=30,
    p=2, |O|=6) violating Proposition 1''s irrepresentable condition (irr_norm = 1.9810926
    > 1), Soft-IPOD achieves 0/60 exact support recoveries across all lambda in [0.1,
    12.0] and OLS suffers l_2 error 0.5704719, whereas Hard-IPOD with leverage-adjusted
    thresholds lambda_i = lambda*sqrt(1 - h_i)*sigma recovers the exact outlier set
    [0, 1, 2, 3, 4, 5], reduces beta l_2 error 34.8x to 0.01638866, and matches clean-subset
    OLS to 0.0; (4) Proposition 4 regression and scale equivariance holds to 0.0;
    and (5) in high-dimensional p > n (n=35, p=50) regression with s=2 active predictors
    and k=2 gross outliers, joint Hybrid Hard-Ridge + Hard TISP (Eq. 6.1) recovers
    exact supports [0, 1] for both beta and gamma and reduces l_2 error from 0.87123823
    to 0.04933417.'
