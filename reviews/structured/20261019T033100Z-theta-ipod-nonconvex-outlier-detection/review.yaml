  summary: Theta-IPOD Thresholding-Based Iterative Outlier Detection and Mean-Shift
    Penalized Regression is a distinct algorithm family connecting nonconvex mean-shift
    penalties with two-stage redescending M-estimators.
  details: Resolved against all 442 pinned AIO concepts and 658 maintained AIMech
    concepts. Distinct from `AIMech:ScaledLassoAndHuberConcomitantPenalizedJointSparseRegression`
    (Sun & Zhang 2012, which establishes the convex joint $(\beta, \sigma)$ concomitant-scale
    objective for uncorrupted high-dimensional sparse regression and builds on She
    & Owen's Proposition 3 equivalence between Huber's concomitant estimator and soft-thresholded
    mean-shift $\ell_1$ penalty, without nonconvex $\Theta$-IPOD redescending outlier
    detection, leverage rescaling $\lambda_i = \lambda\sqrt{1-h_i}\hat{\sigma}$, Proposition
    1 irrepresentable failure analysis for soft-IPOD, or joint $(\beta, \gamma)$ high-dimensional
    TISP), distinct from `AIMech:CorruptedSensingConvexSignalCorruptionDemixingAndSubdifferentialDistanceBounds`
    (Foygel & Mackey 2014, which analyzes convex signal-corruption demixing under
    subgaussian sensing matrices via subdifferential Gaussian-width distance bounds),
    distinct from `AIMech:JusticePursuitL1MinimizationUnderSparseArbitraryCorruptions`
    (Laska et al. 2009, noiseless $\ell_1$ pursuit for sparse signal plus sparse corruption),
    and distinct from `AIMech:MinimaxConcavePenaltyAndPLUSAlgorithm` (Zhang 2010,
    path-following MCP variable selection on $\beta$ rather than observation-level
    mean-shift $\gamma$ outlier detection and $M$-estimation duality).
