- assessment_id: ptn-identity
  area: identity
  topic: Concept boundary and actual owner
  outcome: supported
  summary: 'The maintained concept retains its accepted architecture scope with its
    exact accepted aliases []. Actual root decisions retain owner 908 and distinct
    residuals. The supporting historical identity scope is: Perspective Transformer
    Nets denotes the original 2016 image-to-volume encoder–decoder framework with
    a supplied-camera projection component and silhouette-based training. The component
    is nested, while PTN-Proj and PTN-Comb are objective regimes, not automatic separate
    identities or aliases. The complete framework differs from the maintained SpatialTransformer
    localization-and-warp module, attention-based Transformer networks, generic max
    pooling and image-reconstructing autoencoders. Historical research on 15 October
    2026 examined 745 native and 442 pinned AIO records, with four ignored/hidden-inclusive
    whole-checkout searches returning no candidate hits. The normalized comparison
    covered IDs, names, aliases and all scoped synonyms; a retained count memo distinguishes
    3,565 occurrences in those fields from 4,752 when local-ID suffixes are included.
    Source-agent semantic reading covered 31 selected definitions, complete SpatialTransformer,
    18 exact AIO nodes with 142 incident edge entries and 33 selected frontier objects;
    all 908 main and 393 nested scalar frontier fields were mechanically searched.
    These attributed historical checks are not a current creation-time absence assertion
    or a saturation claim. The later cohort337 report has already created pending
    owner 908 for Perspective Transformer Nets; future curation must reuse that owner
    and refresh the actual current identity and frontier context, rather than append
    a duplicate lead.'
