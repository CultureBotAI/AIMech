  summary: Main Section 3.1 supplies the averaged squared silhouette loss, volume
    loss and weighted sum. Experimental Design names PTN-Proj, CNN-Vol and PTN-Comb.
    The statement preserves these training regimes within one architecture and distinguishes
    missing 3D targets from the remaining mask/camera supervision.
  target_ids:
  - AIMech:PerspectiveTransformerNets
  evidence_ids:
  - record-ptn
  - scientific-support
  - src-yan2016-main
- assessment_id: ptn-staged-encoder-and-volume-training
  area: evidence
  topic: Claim staged-encoder-and-volume-training
  outcome: supported
  summary: Main Section 3.3 states encoder pretraining followed by volume learning,
    the recurrent rotation curriculum and neighboring-view minibatches; p. 5 names
    ADAM. Equation 5 is reported as a desired invariant representation. The cited
    curriculum paper was not independently audited, and no exact latent equality or
    encoder-freezing behavior is inferred.
  target_ids:
  - AIMech:PerspectiveTransformerNets
  evidence_ids:
  - record-ptn
  - scientific-support
  - src-yan2016-main
- assessment_id: ptn-single-image-inference-and-multiview-training
  area: evidence
  topic: Claim single-image-inference-and-multiview-training
  outcome: supported
  summary: The input mapping f(I) is single-view, while the training losses use other
    views of the same object. Main implementation details explicitly include 24 projections;
    Supplement Section 2 defines the two eight-view protocols and limits their experiments
    to one category. No uninspected aggregate numerical performance claim is added.
  target_ids:
