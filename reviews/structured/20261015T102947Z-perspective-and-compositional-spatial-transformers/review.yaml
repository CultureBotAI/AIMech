  - src-yan2016-supplement
- assessment_id: ptn-trilinear-tent-sampling-and-max-projection
  area: evidence
  topic: Claim trilinear-tent-sampling-and-max-projection
  outcome: supported
  summary: Both displayed Equation 4 formulas multiply three tent factors and maximize
    along disparity. The term trilinear describes that exact three-axis product, despite
    the supplement saying bilinear. The statement does not convert max into a ray
    sum, calibrated occupancy probability or physical visibility solver; gradients
    and boundary behavior remain individually qualified.
  target_ids:
  - AIMech:PerspectiveTransformerNets
  evidence_ids:
  - record-ptn
  - scientific-support
  - src-yan2016-main
  - src-yan2016-supplement
