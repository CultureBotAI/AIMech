    transform. Supplement Equations 1–2 and the opening normalization definitions
    on p. 2 support the printed source/target relation. The claim reports that relation
    as source notation; limitation 1 retains the unresolved conventional inverse-calibration/extrinsics
    interpretation, so no silent matrix repair or author-code certification is implied.
  target_ids:
