  - calculation
  summary: The substantive mechanism is supported within its stated family and scope.
  details: Let y_nd be output d observed at training input x_n and phi_n the K-dimensional
    column of features at that input. Define L_nd=E_q[log N(y_nd;phi_n^T*a_d,tau^{-1})],
    the per-observation, per-output expected Gaussian log likelihood under q(a_d)q(omega).
    For a nonempty batch S of uniformly sampled observations, Equation 9 uses (N/|S|)*sum_{n
    in S,d} L_nd-KL(q(A)||p(A))-KL(q(omega)||p(omega)), retaining the explicit diagonal
    coefficient family of fVSSGP. With fixed current variational parameters and the
    stated uniform sampling, its expectation is the full fVSSGP objective; gradient
    unbiasedness additionally requires valid differentiation under expectation. Stochastic
    optimization updates spectral and coefficient variational parameters using this
    noisy objective or its gradients. A sampled value need not be a lower bound pointwise.
    Subsampling the already collapsed VSSGP log determinant and matrix inverse would
    be a different estimator.
