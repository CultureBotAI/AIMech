  summary: Retain both named variants with their distinct additive deposits.
  details: Rank-AS sums sigma−1 selected current contributions with weights sigma−mu
    and adds sigma times the archived-tour term. Inverse positive cost remains, so
    preserved rank does not imply preserved deposits. The elite method retains every
    current ant’s ordinary deposit and adds e times the archive term. Current and
    archived contributions are additive even for the same tour. Zero elite weight
    recovers the base method; sigma=1 gives archive-only rank reinforcement. Neither
    method inherits MAX–MIN clipping or guarantees optimality. The manuscript dates
    and named-variant identity are preserved.
