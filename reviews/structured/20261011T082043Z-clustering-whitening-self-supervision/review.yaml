assessments:
- assessment_id: deepcluster
  area: evidence
  topic: Identity, source support, mechanism, limitations and mapping
  outcome: supported
  target_ids:
  - AIMech:DeepCluster
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - deepcluster-source
  - deepcluster-source-1
  - deepcluster-source-2
  - deepcluster-source-3
  summary: This record covers the original k-means-based DeepCluster procedure of
    Caron et al. It is not generic deep clustering, standalone k-means, DeepCluster-v2,
    or a particular pretrained model. Cluster assignments provide training targets;
    the k-means centroid matrix is not used as the discriminative classifier. No normalized
    identity match was found across all 442 pinned AIO labels/scoped synonyms and
    195 prior native IDs/names/aliases. Ignored-inclusive, word-delimited searches
    of both full checkouts found nine prior discovery/review references in each plus
    six unrelated language-stemmer tokens in the main environment. An initial substring
    search also matched unrelated layer-name suffixes. Neighboring k-means, SwAV,
    Barlow Twins and VICReg mechanisms and exact AIO definitions/edges were inspected;
    shared components do not establish identity.
  details: 'Extract features of the unlabeled training images with the current encoder
    while holding its parameters fixed. In the original reported configuration, PCA-reduce
    and whiten these features, then L2-normalize them before k-means. Cluster them
    by alternating nearest-centroid assignment and centroid updates toward the squared-distance
    objective; use the resulting hard cluster indices as pseudo-labels. The paper
    handles empty clusters by perturbing a selected nonempty centroid and reassigning
    its members between the two centers. Then hold pseudo-labels fixed and optimize
    the encoder and a classification head with cross-entropy on augmented images.
    Sample approximately uniformly across nonempty pseudo-label groups so large clusters
    do not dominate training. Repeat full-dataset feature extraction, clustering and
    discriminative training. The pinned author implementation reinitializes the final
    linear classifier for each reclustering round, uses 20 k-means iterations, and
    uses sampled pseudo-labels rather than differentiating through k-means. Limitations:
    K-means is nonconvex and the finite iteration implementation does not certify
    a global optimum. The alternating clustering and classification stages are not
    a proof of descent for one common objective or of general convergence. Empty-cluster
    repair and pseudo-label sampling are practical safeguards, not a universal guarantee
    against collapsed representations. The inspected wrapper delegates clustering
    to Faiss; its library internals were not audited. Uniform training exposure to
    pseudo-label groups does not force equal cluster sizes. Cluster IDs can be permuted
    or change between rounds and are not verified semantic class labels. PCA dimension
    256, Sobel filtering, architecture, augmentations and epoch schedule describe
    the original experimental configuration. Whitening and L2 normalization require
    suitable numerical handling; no performance equivalence for arbitrary variants
    is asserted. Training discards ImageNet class labels, but the paper selects hyperparameters
    using labeled Pascal VOC validation. Full-dataset feature extraction has a cost;
    no training or benchmark reproduction was performed.'
