  summary: Retain geometric k-means pseudo-label learning and balanced prediction-based
    transport as distinct procedures.
  details: DeepCluster holds features fixed during k-means, then trains the encoder
    and a newly initialized final classifier from fixed cluster labels. Cluster-size
    sampling does not impose equal cluster counts. SeLa uses model probabilities in
    dataset-global constrained transport; the pinned CPU/GPU implementations include
    1/K and 1/N marginal factors missing from the paper’s displayed reciprocal updates
    and harden the soft plan by argmax before cross-entropy training. Hardening need
    not preserve balance, and finite regularization/SGD do not inherit ideal convergence
    claims. The resolved review issue clarifies that integral hard count assignments
    are NQ, not mass-normalized Q. This is a direct scaling consequence of Q=q/N in
    the primary paper.
