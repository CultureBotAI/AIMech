- assessment_id: sela
  area: evidence
  topic: Identity, source support, mechanism, limitations and mapping
  outcome: supported
  target_ids:
  - AIMech:SeLa
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - sela-source
  - sela-source-1
  - sela-source-2
  summary: SeLa denotes Asano et al.’s simultaneous clustering and representation-learning
    procedure. It differs from k-means-based DeepCluster and online cross-view SwAV.
    Its global transport formulation and the author implementation’s hardening of
    soft assignments are distinguished explicitly. No normalized identity match was
    found across all 442 pinned AIO labels/scoped synonyms and 195 prior native IDs/names/aliases.
    Ignored-inclusive, word-delimited searches of both full checkouts found nine prior
    discovery/review references in each plus six unrelated language-stemmer tokens
    in the main environment. An initial substring search also matched unrelated layer-name
    suffixes. Neighboring k-means, SwAV, Barlow Twins and VICReg mechanisms and exact
    AIO definitions/edges were inspected; shared components do not establish identity.
  details: 'Let p_ki be the network softmax probability for class k on image i, for
    N images and K classes. At a self-labelling step hold model parameters fixed and
    form P_ki=p_ki/N. Approximately minimize <Q,−log P>+(1/lambda) KL(Q||r c^T), lambda>0,
    over nonnegative K-by-N Q with row masses r_k=1/K and column masses c_i=1/N. With
    A=P^lambda, obtain Q=diag(alpha) A diag(beta) by alternating alpha=r/(A beta)
    and beta=c/(A^T alpha), using elementwise division. A conditional soft code would
    be N Q_:i; the pinned author implementation instead takes y_i=argmax_k Q_ki, without
    gradients through assignment, and trains the encoder and head on these hard pseudo-labels
    using cross-entropy and image augmentation until the next global reassignment.
    This practical hardening need not preserve exact equal class counts. Multiple
    heads can supply separate self-labellings sharing one feature extractor. Limitations:
    The paper’s displayed reciprocal Sinkhorn updates omit marginal factors; this
    record states the 1/K and 1/N factors required by its constraints and confirmed
    in the pinned CPU and GPU implementations. Probabilities, log probabilities and
    mass-normalized joint matrices must not be conflated. The original hard equal-size
    partition assumes K divides N. For other N≥K it needs integer count capacities
    differing by at most one. With integer count capacities, the unregularized transport
    problem admits an extreme optimum for which NQ is an integral one-hot assignment
    matrix: the mass-normalized Q has entries 0 or 1/N. Arbitrary tied optimal mixtures
    and entropy-regularized plans need not be hard assignments. Finite regularization
    and finite iteration approximate the original combinatorial assignment. Columnwise
    argmax can destroy balance; uniform soft plans are feasible. The paper’s ideal
    alternating-objective convergence claim is not a guarantee for this approximate
    hard-label/SGD implementation or against every collapsed state. The mutual-information
    interpretation concerns labels and data indices under the stated marginal and
    fitted-model assumptions, not a measured mutual information between continuous
    embeddings. Global prediction storage and reassignment scale with images and classes.
    Cluster count, augmentation, optimization and the balanced-class prior affect
    the learned grouping; semantic labels and universal benchmark improvements are
    not guaranteed.'
