  summary: Retain hard sample-covariance whitening with positive-view distance and
    discrete cluster-assignment mutual information.
  details: W-MSE differentiates through centering, sample covariance and a Cholesky
    transform, then compares normalized positive views. Its aligned view-partition
    slicing uses separate whitening groups and all unordered same-image pairs. Full-rank
    covariance requires more samples than dimensions and still depends on the actual
    sample rank. Shrinkage and subsequent norm projection alter exact identity covariance;
    decorrelation is not independence or a spherical-distribution theorem. IIC instead
    forms a differentiable symmetrized outer-product joint over discrete assignment
    labels and optimizes its mutual information. It has no detached pseudo-label step.
    Constant labels have zero information but optimization and semantic recovery are
    not certified. The ideal formula, optional entropy weights and different paper/code
    epsilon-clamping order are kept distinct. Segmentation requires inverse geometric
    alignment and displacement-specific information estimates.
