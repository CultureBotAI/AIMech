  summary: W-MSE refers to Ermolov et al.’s normalized whitening mean-squared-error
    method. It is not generic MSE, a standalone whitening transform, Barlow Twins
    cross-correlation matching or VICReg soft covariance regularization. The unnormalized
    Euclidean ablation is distinguished from the normalized default. No normalized
    identity match was found across all 442 pinned AIO labels/scoped synonyms and
    195 prior native IDs/names/aliases. Ignored-inclusive, word-delimited searches
    of both full checkouts found nine prior discovery/review references in each plus
    six unrelated language-stemmer tokens in the main environment. An initial substring
    search also matched unrelated layer-name suffixes. Neighboring k-means, SwAV,
    Barlow Twins and VICReg mechanisms and exact AIO definitions/edges were inspected;
    shared components do not establish identity.
  details: 'Generate d≥2 augmented views of each of N images and pass them through
    a shared encoder and projection head. For a whitening group of m projected vectors
    in R^p, center by the group mean and compute sample covariance Sigma=sum_i(v_i−mean)(v_i−mean)^T/(m−1).
    When Sigma is positive definite, factor Sigma=L L^T and transform each vector
    to z_i=L^−1(v_i−mean). For nonzero z normalize u_i=z_i/||z_i|| and minimize the
    average ||u_i−u_j||^2 over all N d(d−1)/2 unordered same-image view pairs. Backpropagate
    through both views and whitening, including its batch statistics. In batch slicing,
    place each image’s views in separate view partitions, apply the same random image-index
    permutation to every partition, split each into groups, and whiten each group
    separately; compare corresponding positive views afterward. Repeat slicing and
    average losses if configured. The procedure requires no negative-pair loss, prediction
    head, momentum teacher or stopped target. Limitations: Exact Cholesky whitening
    requires positive-definite covariance. A centered group has rank at most m−1,
    so m>p is necessary but not sufficient. The paper’s group-size heuristic is not
    a rank or numerical-stability guarantee. The pinned code optionally replaces Sigma
    by (1−epsilon)Sigma+epsilon I. Whitening that regularized matrix does not generally
    give the original centered samples identity covariance. A collapsed group is outside
    the exact unregularized construction; numerical regularization does not prove
    every optimizer avoids collapse. Identity covariance expresses second-order decorrelation
    and unit variances. It does not prove statistical independence, Gaussianity or
    a rotationally symmetric distribution. Subsequent L2 normalization generally changes
    covariance again. Whitening is group-dependent: absence of explicit negatives
    does not mean independent per-example training. Group composition, common view
    permutations, embedding dimension and repeated slicing affect the computation.
    The pinned slicing implementation requires the image batch size to be divisible
    by its group size. Zero-norm handling and covariance regularization matter. The
    main record states normalized squared Euclidean distance; the supplement’s unnormalized
    variant and any element-averaged MSE convention are not silently identified. No
    runtime, gradient implementation or benchmark was reproduced.'
