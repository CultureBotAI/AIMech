  summary: FedMix (Approximation of Mixup under Mean Augmented Federated Learning)
    is a distinct concept.
  details: Distinct from standard Mixup (AIMech:MixupVicinalRiskMinimizationByConvexSampleInterpolation,
    Zhang et al. 2018), which requires direct access to raw sample pairs (x_i, y_i)
    and (x_j, y_j); and distinct from NaiveMix within MAFL (Equation 1), which directly
    evaluates f((1 - lambda) x_i + lambda x_bar_j) on averaged inputs without the
    input-Jacobian correction term lambda (partial ell / partial x) . x_bar_j derived
    in Proposition 1.
