  summary: AD-PSGD (Asynchronous Decentralized Parallel Stochastic Gradient Descent)
    is a distinct concept.
  details: Distinct from synchronous D-PSGD (Lian et al. 2017), which blocks all n
    workers at a global barrier at every iteration so step time is dictated by the
    slowest worker max_{i in [n]} t_i, and from centralized Asynchronous Parallel
    SGD (Hogwild! / Lian et al. 2015), which suffers a central parameter-server communication
    bottleneck and lacks peer-to-peer doubly stochastic gossip averaging W_k.
