  summary: Retain Optimal multi-weighted step-up procedure for false discovery rate
    control as a distinct DRAFT mathematical_method.
  details: OptimalMultiWeightedStepUpProcedureForFDRControl establishes the deterministic
    rejection-proportion-indexed multi-weighting framework W(u) over sum_{i=1}^m W_i(u)
    = m, derives the closed-form Lagrangian optimal weight function W_i*(u) = (alpha
    u)^{-1} f_i^{-1}(y*(u)) (Proposition 3.2), proves the m = 2 counterexample for
    unmodified SU(W) (Lemma C.1), and establishes exact finite-sample FDR control
    for damped SU(W_tilde) and SD(W_tilde) (Theorem 4.1) and non-asymptotic Hoeffding
    oracle bounds (Theorem 4.2), whereas AdaptiveDataDrivenOptimalPValueWeighting
    (Durand 2019) estimates group null proportions and Grenander LCM CDFs from data
    over K_hat.
