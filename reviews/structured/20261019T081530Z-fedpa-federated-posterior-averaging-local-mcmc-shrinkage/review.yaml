  summary: FedPA (Federated Posterior Averaging via Local MCMC and Shrinkage Covariance)
    is a distinct concept.
  details: Distinct from FedAvg and FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam),
    which correspond to the biased identity-covariance special case Sigma_hat_i =
    I (rho = 0) and converge to the arithmetic mean of local modes rather than the
    global posterior mode (sum_i q_i Sigma_i^{-1})^{-1} (sum_i q_i Sigma_i^{-1} mu_i)
    when client posteriors have heterogeneous anisotropic curvatures, and from FedMA
    (AIMech:FedMaFederatedMatchedAveragingViaLayerWiseBayesianNonparametricMatching,
    which uses a Beta-Bernoulli Process for layer-wise neuron permutation matching
    rather than local MCMC sampling and shrinkage covariance preconditioning).
