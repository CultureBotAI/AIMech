- assessment_id: fastcondensedprototypebaseddomaindescription-sampled-candidate-selection
  area: evidence
  topic: sampled candidate selection
  outcome: supported
  target_ids:
  - AIMech:FastCondensedPrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Maintain selected prototype pairs S, covered reference points C, eligible
    candidate pool E and remaining sampling pool Dprime. Draw T from Dprime, compute
    each sampled point''s kth self-included neighbor distance against full D, retain
    sampled candidates P with r_i<=theta, and form their neighborhoods using d(x_i,y)+r_i<=rho*theta.
    Add P to E. Greedily select from E by largest residual neighborhood gain, breaking
    ties by smaller radius, and insert while gain>(1-eta)*k. The inner loop ends when
    the chosen candidate belongs to the current P or fails the gain test; older candidates
    can be inserted first. Remove T union C from Dprime after the iteration. Stored
    radii are unchanged at prediction. Source locators: Figure 3 steps 1-2g and accompanying
    Section 5 prose, author p6 / PDF p7'
- assessment_id: fastcondensedprototypebaseddomaindescription-adaptive-sampling-and-stopping
  area: evidence
  topic: adaptive sampling and stopping
  outcome: supported
  target_ids:
  - AIMech:FastCondensedPrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Initialize sigma=1, count=k+1 and countstar=0. The nominal sample size
    is ((1-a)*sigma+a)*s, with a=0.1 in the source. After selecting candidates, count
    is the last residual gain, countstar is the maximum gain seen, and sigma is updated
    to log(count)/log(countstar). The default outer loop continues while count>(1-eta)*k.
    Here eta controls marginal gain, not CPDD''s total covered fraction. A low-gain
    sample does not prove that no useful unsampled candidate remains; the source acknowledges
    that default stopping is heuristic. Source locators: Figure 3, author p6 / PDF
    p7; Section 5 stopping discussion, author p7 / PDF p8'
- assessment_id: fastcondensedprototypebaseddomaindescription-exhaustion-theorem-counterexample
  area: evidence
  topic: exhaustion theorem counterexample
  outcome: supported
  target_ids:
  - AIMech:FastCondensedPrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  - finite-boundaries
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Theorem 5.1 proposes eta=1 and changing the outer guard to Dprime nonempty
    as a consistency condition. A curator trace of the printed flow disproves sufficiency
    of that change alone: let D={0,1/10,10,101/10}, k=1, theta=1/5, rho=eta=1 and
    s=4. The first sample T=D has zero radii and two disconnected two-point neighborhoods.
    Selecting any current-sample candidate covers only one pair; the inner loop then
    ends. Removing T union C empties Dprime, so the modified guard exits while two
    originally accepted points remain uncovered. Gain=count=countstar=2 makes the
    log update defined, so this failure is independent of log singularities. The trace
    does not certify how any historical implementation behaved. Source locators: Figure
    3, author p6 / PDF p7; Theorem 5.1 and proposed guard change, author p7 / PDF
    p8; executable curator trace in research/discovery/prototype-domain-boundaries.py'
