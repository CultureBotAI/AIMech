- assessment_id: condensedprototypebaseddomaindescription-greedy-cover-construction
  area: evidence
  topic: greedy cover construction
  outcome: supported
  target_ids:
  - AIMech:CondensedPrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Compute r_i as each x_i''s kth self-included neighbor distance in full
    D, and retain candidate prototypes with r_i<=theta. Form N_i={y in D:d(x_i,y)+r_i<=rho*theta}.
    Starting from empty S and covered set C, select a candidate maximizing |N_i minus
    C|, break gain ties in favor of smaller r_i, and add its pair (x_i,r_i) and neighborhood
    to S and C. The baseline rho=eta=1 stops once every eligible prototype location
    is covered, following the surrounding prose. Further equal-gain, equal-radius
    ties are unspecified. Prediction uses the stored radii and original theta. Source
    locators: Figure 1, author p4 / PDF p5; Section 4 algorithm and parameter descriptions,
    author p5 / PDF p6'
- assessment_id: condensedprototypebaseddomaindescription-baseline-approximation-scope
  area: evidence
  topic: baseline approximation scope
  outcome: supported
  target_ids:
  - AIMech:CondensedPrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'For nonempty derived prototype set P at rho=eta=1, each prototype covers
    itself and its neighborhood contains only eligible reference locations. The intended
    full-cover loop is greedy set cover, so its selected count is at most (1+ln|P|)
    times a minimum cover count. This is a cardinality approximation for the finite
    reference-consistency objective, not exact minimum size, equality of all new-query
    decisions or a classification-risk guarantee. It is not automatically a guarantee
    for partial-cover settings or FastCPDD. Source locators: Section 4 and Theorem
    4.1, author p5 / PDF p6; Definition 2.5, author p3 / PDF p4'
- assessment_id: condensedprototypebaseddomaindescription-printed-guard-and-parameter-boundaries
  area: evidence
  topic: printed guard and parameter boundaries
  outcome: supported
  target_ids:
