  - finite-boundaries
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'The printed description leaves sample-size rounding or clipping, empty
    candidate maxima, exhausted sampling pools and log-zero or log-one updates unresolved.
    Isolated k=1 neighborhoods can give count=countstar=1, making the stated update
    0/0. If M distinct observations are sampled without replacement from the remaining
    pool, computing their distances to full D requires M*|D|<=|D|^2 distance evaluations;
    this permits quadratic worst-case work and does not establish subquadratic total
    runtime. The baseline CPDD set-cover approximation is not transferred to this
    heuristic. Source locators: Figure 3 and Section 5 computational analysis, author
    pp6-7 / PDF pp7-8; exact unit-gain boundary calculation'
