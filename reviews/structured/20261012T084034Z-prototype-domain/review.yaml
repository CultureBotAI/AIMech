boundary_decisions:
- action: retain
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  - AIMech:CondensedPrototypeBasedDomainDescription
  - AIMech:FastCondensedPrototypeBasedDomainDescription
  evidence_ids:
  - identity
  - mapping
  - angiulli2012
  - finite-boundaries
  rationale: PDD computes a decision from supplied offset prototypes; CPDD greedily
    selects from the complete derived candidates; FastCPDD samples and accumulates
    candidates with heuristic stopping. These have distinct procedural roles and do
    not inherit identical decision regions, subset outputs or guarantees. Keep them
    separate from NNDD distance norms, CNNDD reference selection, local ratios, neighbor
    voting and medoid optimization.
limitations:
- Adversarial author self-review only; all three records remain DRAFT.
- All15 pages of the exact author PDF were visually read for this round; two prior
  identity pages were reused after byte verification and thirteen remaining pages
  were read. Author-page locators are not an inferred journal offset. The2008 full
  version and historical code were not compared.
- PDD is a prediction rule; CPDD is intended full-candidate greedy coverage; FastCPDD
  is sampled selection. Agreement of derived PDD with infinity-norm NNDD on D is not
  global identity. Stored prototype radii are measured in full D, not recomputed after
  selection.
- The printed CPDD <= guard fails to terminate at full coverage. The record follows
  the prose-defined stop and preserves the defect. Eta partial coverage and rho-shrunken
  feasibility are distinct from baseline full-cover guarantees.
- An exact positive-gain example refutes Dprime exhaustion as a sufficient FastCPDD
  consistency condition under the printed inner-loop flow. Unit-gain log0/0, sample
  rounding/clipping and empty candidate conventions remain unresolved. No unpublished
  repair or certified historical behavior is asserted.
- No numerical performance advantage is curated. Complexity is stated as distance-evaluation
  work rather than unverified total runtime; population probability analyses and selected
  experiments are not distribution-free guarantees.
- Exact-name, code and erratum queries plus the public15-repository lab inventory
  did not identify a correcting implementation, a bounded finding only. One sandbox
  API failure was resolved by authorized network retry. Publisher challenge and institutional
  PDF error were not bypassed or treated as source absence.
- No full PDF is redistributed. Exact rational examples and one explicit pseudocode
  trace were executed without statistical training or historical benchmarks.
- The three additions bring native DRAFT records to511, while442 generated AIO records
  remain unchanged. Four new pending source cohorts and the complete frontier leave438
  pending cohorts, so discovery has not saturated.
