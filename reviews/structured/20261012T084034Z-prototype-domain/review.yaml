  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'The described construction computes all reference pairwise distances,
    giving quadratic distance-evaluation work in |D|; stored neighborhood incidence
    can also be quadratic. That fact alone does not bound every implementation''s
    greedy-update cost by quadratic time. Reported size, timing and accuracy comparisons
    are conditional on datasets, metrics, thresholds, k, rho, eta and implementations,
