  summary: Retain the source-scoped native DRAFT algorithm with a related binary-task
    mapping.
  details: 'A heuristic for selecting PDD prototypes that samples remaining reference
    observations, computes their radius offsets against the full dataset, accumulates
    eligible candidates, and greedily selects them by uncovered-reference gain with
    an adaptive sampling schedule. FastCPDD, also called FCPDD, is the sampled candidate-selection
    variant introduced in Section 5 of Angiulli''s PDD paper. It is distinct from
    full-candidate CPDD and the PDD prediction rule. The conceptual sampling and selection
    policy is supported; the printed pseudocode has unresolved boundary conventions,
    and its stated exhaustion modification does not by itself establish the claimed
    consistency guarantee. Compared all 442 pinned AIO IDs, labels and scoped synonyms
    with all 508 preceding native IDs, names and aliases. No normalized candidate
    identity collision was found. Fixed-string whole-word searches included ignored
    and hidden files in both checkouts, candidate aliases, acronyms and source identifiers.
    All 103 matched lines per checkout, 61 distinct texts at 206 locations, were inspected:
    these are the preceding NNDD record and its generated pages, provenance, discovery
    and review context, including explicit pending CPDD/FastCPDD leads. The 85 semantic
    AIO rows and 65 preceding native identity matches were unchanged from their fully
    read prior search; the two new native neighbors were fully read. Twelve annotated
    AIO nodes and outgoing edges were read; twenty-three contextual YAMLs were reused
    after unchanged-byte checks. Absence is bounded to this pin and corpus, and wider
    identity-field matches are not full scientific reviews.'
