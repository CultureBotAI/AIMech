assessments:
- assessment_id: prototypebaseddomaindescription-identity
  area: identity
  topic: Definition, local identity and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  evidence_ids:
  - identity
  - mapping
  - angiulli2012
  summary: Retain the source-scoped native DRAFT algorithm with a related binary-task
    mapping.
  details: 'A one-class decision rule that accepts a query when its metric distance
    to at least one prototype, plus that prototype''s stored radius offset, is no
    greater than a common threshold. PDD is the radius-offset prediction rule, distinct
    from CPDD and FastCPDD algorithms for choosing its prototypes. Its dataset-derived
    construction stores each eligible reference point with its kth-neighbor distance
    measured against the original dataset. Agreement with infinity-norm NNDD on original
    reference observations does not make the rules identical on new queries. A qualified
    PDD alias avoids assigning every use of the acronym to this concept. Compared
    all 442 pinned AIO IDs, labels and scoped synonyms with all 508 preceding native
    IDs, names and aliases. No normalized candidate identity collision was found.
    Fixed-string whole-word searches included ignored and hidden files in both checkouts,
    candidate aliases, acronyms and source identifiers. All 103 matched lines per
    checkout, 61 distinct texts at 206 locations, were inspected: these are the preceding
    NNDD record and its generated pages, provenance, discovery and review context,
    including explicit pending CPDD/FastCPDD leads. The 85 semantic AIO rows and 65
    preceding native identity matches were unchanged from their fully read prior search;
    the two new native neighbors were fully read. Twelve annotated AIO nodes and outgoing
    edges were read; twenty-three contextual YAMLs were reused after unchanged-byte
    checks. Absence is bounded to this pin and corpus, and wider identity-field matches
    are not full scientific reviews.'
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: Prediction or prototype selection, not a trained checkpoint or benchmark
      result.
    evidence_ids:
