- assessment_id: prototypebaseddomaindescription-radius-offset-decision
  area: evidence
  topic: radius offset decision
  outcome: supported
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Given metric d, positive threshold theta and prototype pairs (x_i,r_i),
    accept query y iff some i satisfies d(x_i,y)+r_i<=theta; reject otherwise. The
    score can be written as the minimum of these offset distances. Each eligible nonnegative
    radius contributes a metric ball with query radius theta-r_i. The general definition
    calls r_i real; interpreting r_i itself as a geometric radius requires nonnegativity,
    as provided by the dataset-derived construction. The rule is not a neighbor-label
    vote, local density ratio or calibrated probability. Source locators: Section
    2 and Definition 2.1, author p2 / PDF p3'
- assessment_id: prototypebaseddomaindescription-dataset-derived-prototypes
  area: evidence
  topic: dataset derived prototypes
  outcome: supported
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'For a finite dataset D and 1<=k<=|D|, compute each reference point''s
    kth ordered neighbor distance in the full D, including itself at distance zero.
    Retain (x,r_x) only when r_x<=theta. These radii remain attached to selected prototypes;
    they are not recomputed after condensation. At k=1 all radii are zero and the
    full rule is a union of radius-theta balls. Equal-distance neighbor identities
    do not alter kth distance values, although selection ties can alter a subsequent
    condensed set. Source locators: Definitions 2.2-2.3, author pp2-3 / PDF pp3-4;
    Section 4 prototype construction, author p5 / PDF p6'
- assessment_id: prototypebaseddomaindescription-reference-correspondence-not-global-identity
  area: evidence
  topic: reference correspondence not global identity
  outcome: supported
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  - finite-boundaries
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Theorem 2.4 gives agreement between the full derived PDD and infinity-norm
    NNDD on observations in D. Triangle inequality makes the derived PDD acceptance
    region a subset of the full NNDD region, but equality need not hold on new queries.
    For D={0,2}, k=2 and theta=2, both radii are 2: PDD accepts just its two prototype
    locations, whereas NNDD also accepts midpoint 1. This curator example rules out
    a global reading of the abstract''s equivalence wording. Source locators: Definition
    2.3 and Theorem 2.4, author p3 / PDF p4; exact curator calculation in research/discovery/prototype-domain-boundaries.py'
- assessment_id: prototypebaseddomaindescription-consistent-subset-scope
  area: evidence
  topic: consistent subset scope
  outcome: supported
  target_ids:
  - AIMech:PrototypeBasedDomainDescription
  evidence_ids:
  - angiulli2012
  - finite-boundaries
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'A PDD-consistent subset preserves the full prototype rule''s decisions
    at every original prototype location. For the eligible dataset-derived prototype
    set, all such locations are accepted, and preserving them also preserves all full-set
    NNDD decisions on D, including rejected observations omitted from the prototype
    set. Subsetting fixed prototypes can only shrink acceptance. Reference agreement
    therefore does not establish identical new-query decisions or universally improved
    generalization, nor does it require a minimum-cardinality subset. Source locators:
    Definitions 2.5 and Theorem 2.6, author p3 / PDF p4; the rejection branch''s printed
    +1 sign conflicts with Definition 2.1 and is not adopted'
- assessment_id: condensedprototypebaseddomaindescription-identity
  area: identity
  topic: Definition, local identity and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:CondensedPrototypeBasedDomainDescription
  evidence_ids:
  - identity
  - mapping
  - angiulli2012
  summary: Retain the source-scoped native DRAFT algorithm with a related binary-task
    mapping.
  details: 'A greedy prototype-selection procedure that constructs kth-neighbor radius
    offsets from the full reference dataset and repeatedly chooses the prototype covering
    the most still-uncovered eligible reference locations under the PDD distance rule.
    CPDD chooses radius-bearing prototypes for PDD. It is distinct from the PDD prediction
    rule, CNNDD subset selection with neighbor distances recomputed by an NNDD classifier,
    and the sampled FastCPDD heuristic. The baseline here follows the prose-defined
    full-cover stopping condition at rho=eta=1; the source''s printed loop guard is
    explicitly inconsistent with that stopping description. Compared all 442 pinned
    AIO IDs, labels and scoped synonyms with all 508 preceding native IDs, names and
    aliases. No normalized candidate identity collision was found. Fixed-string whole-word
    searches included ignored and hidden files in both checkouts, candidate aliases,
    acronyms and source identifiers. All 103 matched lines per checkout, 61 distinct
    texts at 206 locations, were inspected: these are the preceding NNDD record and
    its generated pages, provenance, discovery and review context, including explicit
    pending CPDD/FastCPDD leads. The 85 semantic AIO rows and 65 preceding native
    identity matches were unchanged from their fully read prior search; the two new
    native neighbors were fully read. Twelve annotated AIO nodes and outgoing edges
