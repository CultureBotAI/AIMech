  summary: Retain PDD, CPDD and FastCPDD as distinct concepts.
  details: PDD evaluates an offset-distance threshold from supplied prototypes. CPDD
    constructs a subset using full-candidate residual coverage. FastCPDD samples candidate
    pools and uses adaptive sample sizes and gain stopping. Shared prediction or a
    common paper does not equate these procedures; FastCPDD need not reproduce CPDD
    output. Radius offsets computed in full D remain attached to the selected prototypes,
    unlike NNDD recomputing query-neighbor distances in a condensed reference set.
