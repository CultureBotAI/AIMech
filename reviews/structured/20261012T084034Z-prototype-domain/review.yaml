  - finite-boundaries
  summary: Supported with the explicit assumptions, counterexamples and source limitations
    retained.
  details: 'Figure 1 prints while |C|<=eta|P|. At eta=1 and complete coverage, that
    guard remains true while every residual gain is zero, so the literal loop need
    not terminate. The narrative instead stops after at least the requested fraction
    is covered. Shrinking rho below 1 can make that requested coverage infeasible:
    D={0,2}, k=2, theta=2 gives two eligible radius-2 prototypes, but rho=3/4 makes
    both N_i empty. Reducing eta permits partial coverage; with the same D and rho=1,
    eta=1/2 can stop after one prototype and lose the other original accepted decision.
    These source-boundary calculations are not an attributed implementation repair.
    Source locators: Figure 1 and Section 4, author pp4-5 / PDF pp5-6; exact curator
    calculations in research/discovery/prototype-domain-boundaries.py'
- assessment_id: condensedprototypebaseddomaindescription-computation-and-evaluation-boundaries
  area: evidence
