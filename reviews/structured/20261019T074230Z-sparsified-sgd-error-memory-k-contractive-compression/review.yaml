  summary: Sparsified Stochastic Gradient Descent with Error Memory for k-Contractive
    Gradient Compression is a distinct concept.
  details: Distinct from unbiased stochastic quantization (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding,
    which requires E[Q(g)] = g and cannot analyze biased deterministic Top-k sparsification),
    from 1-bit sign compression without contractive residual bounds (AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization),
    from EF21 Markov gradient-difference compression (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization,
    which compresses gradient differences grad f_i(x^{t+1}) - g_i^t rather than step-scaled
    gradient plus error memory), and from low-rank matrix subspace compression (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback).
    No pinned AIO class covers k-contractive sparsified SGD with error memory or its
    perturbed virtual-iterate convergence guarantee.
