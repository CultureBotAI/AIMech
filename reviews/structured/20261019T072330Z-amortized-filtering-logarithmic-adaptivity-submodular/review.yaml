  summary: Amortized-Filtering and Iterative-Filtering for Optimal Logarithmic-Adaptivity
    Submodular Maximization is a distinct concept.
  details: Distinct from AIMech:GreeDiTwoStageDistributedSubmodularMaximization (Round
    359), which partitions data across MapReduce machines but runs sequential k-round
    greedy selection on each machine (Omega(k) adaptivity), and from AIMech:StochasticGreedyLinearTimeMonotoneSubmodularMaximization
    (Round 348), which reduces total oracle evaluations to O(n log(1/epsilon)) across
    k sequential rounds. Also distinct from AIMech:SieveStreamingAndSieveStreamingPlusPlusForSubmodularMaximization
    (Round 350), which is a single-pass streaming threshold algorithm achieving 1/2
    - epsilon rather than a low-adaptivity parallel algorithm achieving 1 - 1/e -
    epsilon.
