  summary: 'Verified in pure Python on n=45, p=60, s=2: (1) across Gaussian, heavy-tailed
    Cauchy, and heteroscedastic Laplace location-scale models sharing latent uniforms
    u_i = F_{y_i|x_i}(y_i|x_i), the maximal rescaled rankscore process Lambda (Eq.
    2.6) over U = {0.25, 0.50, 0.75} is identically 20.20725942 (max pairwise difference
    0.0), with 90th conditional quantile Lambda(0.90 | X) = 22.07190387 <= 2.5 * W_U
    * sqrt(n*log(p)); (2) the Restricted Nonlinear Impact (RNI) minorization bound
    min(||J_u^{1/2} delta||^2 / 4, q*||J_u^{1/2} delta||) (Lemma 4, Eq. 3.7, q = 0.09002622)
    lower-bounds the exact population excess check risk across both quadratic and
    linear regimes; and (3) primal l1-QR and dual rankscore LP (Eqs. C.1-C.2) converge
    with duality gap 3.7e-07, active complementary slackness error 1e-07, exact support
    recovery S_hat = [0, 1] (||delta_{T_u^c}||_1 = 0.0 <= c_0 ||delta_{T_u}||_1),
    and Post-l1-QR refitting reduces l_2 parameter error 8.4x from 0.19027079 to 0.02260417
    and empirical check risk from 0.08993882 to 0.04227305.'
