  summary: Grothendieck Inequality and Semidefinite Programming for Sparse SBM is
    a distinct concept.
  details: Distinct from exact recovery at logarithmic average degree p = a log(n)/n
    via dual certificate construction (AIMech:StochasticBlockModelExactRecoveryPhaseTransitionAndSemidefiniteProgramming)
    and Hashimoto non-backtracking spectral clustering (AIMech:NonBacktrackingWalkMatrixAndKestenStigumSpectralRedemption).
    Specifically captures the Guedon-Vershynin (2016) Grothendieck inequality SDP
    perturbation principle (Theorem 3.1, Lemma 6.1, Lemma 6.2, and Lemma 7.1) that
    achieves arbitrary fraction 1 - epsilon community recovery in constant-average-degree
    sparse networks without degree trimming whenever the signal-to-noise ratio (a
    - b)^2 / (a + b) >= C epsilon^{-2} (Theorems 1.1-1.4).
