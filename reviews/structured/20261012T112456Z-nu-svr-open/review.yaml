  summary: Retain the source-scoped algorithm identity.
  details: 'A supervised regression algorithm that jointly fits a regularized kernel
    expansion and a nonnegative constant epsilon-insensitive tube half-width, using
    nu to penalize the width relative to linearly penalized residual excesses. The
    original symmetric constant-width nu-SVR in Scholkopf, Smola, Williamson and Bartlett
    (2000) is the selected identity. It differs from fixed-epsilon SVR parameterization,
    the paper’s supplied parametric-insensitivity extension, later learned-insensitivity/twin
    models, supervised nu-SVC and one-class support estimation. Compared all442 pinned
    AIO IDs, labels and scoped synonyms against all520 preceding native IDs, names
    and aliases, without a normalized collision. Full-text fixed-string whole-word
    searches in both checkouts included ignored and hidden files, expanded labels,
    acronyms, DOI and paper identifiers. Read all25 distinct matching text windows
    across88 locations: these are the existing one-class record context, its review/renderings
