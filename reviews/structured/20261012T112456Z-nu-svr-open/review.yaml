  summary: Supported within the stated source and mathematical scope.
  details: 'For n>=1 input/real-response pairs and a positive-semidefinite kernel
    with feature map Phi, fit f(x)=w.Phi(x)+b by minimizing (1/2)||w||^2+C*(nu*epsilon+sum_i(xi_i+xi_star_i)/n),
    with C>0, nu>=0, epsilon>=0 and nonnegative slacks. The constraints are f(x_i)-y_i<=epsilon+xi_i
    and y_i-f(x_i)<=epsilon+xi_star_i. Thus the symmetric, input-independent tube
    half-width is optimized jointly with the fit; C and the kernel still require specification.
    Locator: Section 2, PDF pp4-6 / printed pp1210-1212, Equations 2.1-2.15'
- assessment_id: dual-and-recovery
  area: evidence
  topic: dual and recovery
  outcome: supported
  target_ids:
  - AIMech:NuSupportVectorRegression
  evidence_ids:
  - scholkopf2000
  - finite-certificates
  summary: Supported within the stated source and mathematical scope.
  details: 'Write beta_i=alpha_star_i-alpha_i. The dual maximizes sum_i beta_i*y_i-(1/2)*beta^T*K*beta,
    subject to sum_i beta_i=0, 0<=alpha_i,alpha_star_i<=C/n and sum_i(alpha_i+alpha_star_i)<=C*nu.
    Prediction is sum_i beta_i*k(x_i,x)+b. A free alpha_i gives f(x_i)-y_i=epsilon;
    a free alpha_star_i gives y_i-f(x_i)=epsilon. These equations can recover b and
    epsilon when adequate free coefficients exist. Otherwise the original KKT inequalities
    must be respected; neither an interior coefficient nor unique b, epsilon or dual
    coefficients is guaranteed. Locator: Section 2, PDF pp5-6 / printed pp1211-1212,
    Equations 2.6-2.15 and following KKT discussion; exact certificates in research/discovery/nu-svm-boundaries.py'
- assessment_id: conditional-nu-counts
  area: evidence
  topic: conditional nu counts
  outcome: supported
  target_ids:
  - AIMech:NuSupportVectorRegression
  evidence_ids:
  - scholkopf2000
  - finite-certificates
  summary: Supported within the stated source and mathematical scope.
  details: 'At an exact optimum with epsilon>0, the fraction of training observations
    strictly outside the tube is at most nu, and the fraction with a nonzero expansion
    coefficient is at least nu. The two sides separately obey the corresponding nu/2
    bounds relative to the entire sample, not relative to each side. These are inequalities,
    not exact finite counts or calibrated test error. For four zero inputs with responses
    -1,-1,1,1, C=1 and nu=1/2, an exact optimum has b=0, epsilon=1 and four free coefficients
    of magnitude1/8: every point is a support vector and none is outside. The paper’s
    asymptotic equality additionally uses iid data, conditional-density regularity
    and function-class arguments; it is not asserted here unconditionally. Locator:
    Section 2 Proposition 1 and discussion, PDF pp7-8 / printed pp1213-1214; finite
    certificate in research/discovery/nu-svm-boundaries.py'
- assessment_id: fixed-epsilon-correspondence
  area: evidence
  topic: fixed epsilon correspondence
  outcome: concern
  target_ids:
  - AIMech:NuSupportVectorRegression
  evidence_ids:
  - scholkopf2000
  - finite-certificates
  summary: Source-scope wording needs refinement.
  details: 'Fixing epsilon at a value learned by nu-SVR, while retaining the same
    C, gives an epsilon-SVR problem sharing that fitted primal optimum. This conditional
    correspondence does not make arbitrary independently selected epsilon and nu interchangeable.
    The original nu-SVR estimates one constant tube half-width; asymmetric quantile
    losses, supplied heteroscedastic basis functions and later learned parametric-insensitive
    methods have different objectives or constraints. Locator: Section 2 Proposition
    2, PDF pp8-9 / printed pp1214-1215; Sections 3 and 5, PDF pp10 and12-14 / printed
    pp1216 and1218-1220'
