  summary: Supported within the stated source and mathematical scope.
  details: 'The linear penalty outside the tube yields resistance to local response
    changes that keep those observations strictly outside on the same side; an existing
    optimum remains valid after matching slack changes. This is not resistance to
    arbitrary input leverage or unlimited contamination. The paper’s proposed asymptotically
    optimal nu calculation assumes a specified additive-noise scale family and convergence
    of the regression estimator, and is justified in a location-estimation model.
    The authors explicitly identify these restrictions; it is not a universal automatic
    nu selector. Locator: Section 3 Proposition 3, PDF pp9-10 / printed pp1215-1216;
    Section 4 and its final caveats, PDF pp10-12 / printed pp1216-1218'
