  summary: Supported within the stated source and mathematical scope.
  details: 'A positive nu need not produce a positive epsilon. With all inputs and
    responses zero, zero coefficients, b=0 and epsilon=0 attain the exact minimum,
    so the positive-width support-count lower bound cannot be applied. At nu=0 an
    unpenalized sufficiently wide tube permits a constant fit. For nu>1, epsilon=0
    reduces the loss to absolute residuals. At nu=1, epsilon and b can be nonunique:
    with two zero inputs, responses -1 and1 and C=1, (b,epsilon)=(0,0),(1/2,0),(0,1)
    all attain objective1. The fitted function or accepted tube can therefore vary
    between optimal solutions. Locator: Section 2, PDF pp6-8 / printed pp1212-1214,
    endpoint discussion and Equations 2.1-2.15; exact certificates in research/discovery/nu-svm-boundaries.py'
