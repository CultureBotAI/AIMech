    only forced by epsilon>0. Positive width prevents both paired multipliers at one
    observation from being positive. Capped strict errors and fixed total mass then
    give the finite count inequalities. The balanced four-response certificate has
    zero errors and full support atnu1/2; epsilon0 permits zero support. Atnu1, free
