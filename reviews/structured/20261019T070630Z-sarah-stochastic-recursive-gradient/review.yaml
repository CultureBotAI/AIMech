  summary: SARAH Stochastic Recursive Gradient for Finite-Sum Optimization is a distinct
    concept.
  details: Distinct from SVRG, which uses the conditionally unbiased snapshot difference
    grad f_{i_t}(w_t) - grad f_{i_t}(w_0) + v_0 whose inner-loop step variance does
    not vanish as t -> infinity within a single outer loop, from SAG/SAGA, which require
    O(n d) storage of n past component gradients, and from SPIDER (`AIMech:SPIDERStochasticPathIntegratedDifferentialEstimatorForNonConvexOptimization`),
    which couples recursive path-integrated differential estimation with normalized
    gradient descent (stepsize proportional to epsilon / ||v^k||) and negative-curvature
    search for non-convex first- and second-order stationarity. Specifically captures
    the SARAH recursive estimator (Equation 2), the exact martingale variance identity
    (Lemma 2) and convex error bound (Lemma 3), the inner-loop linear contraction
    of E[||v_t||^2] (Theorems 1a-1b), the outer-loop linear rate sigma_m < alpha_m
    (Theorem 4 and Remark 1), and the adaptive SARAH+ inner stopping rule ||v_{t-1}||^2
    > gamma ||v_0||^2 (Algorithm 2).
