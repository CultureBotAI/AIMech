  the rationale or rejections.
- Required checks must be actual retained completed logs, with failed attempts and
  successful replacements distinguished. Canonical review validate/save/check remain
  separate actions. All unrelated frontier objects remain unchanged and no exhaustion
  or DRAFT promotion is inferred.
