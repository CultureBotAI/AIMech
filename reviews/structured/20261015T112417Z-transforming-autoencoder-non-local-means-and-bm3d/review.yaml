limitations:
- Author self-review with supporting agents is not independent scientific approval.
  Full_text is acquisition access; historical source-agent, supporting and selective
  root reading scopes remain separately attributed.
- Known transformations and changed target images remain supervision. Finite first-level
  capsules retain one-instance and competence limits; presence is not calibrated,
  pose matrices are not constrained to an affine or rotation manifold, and no dynamic-routing
  or learned-hierarchy result is inferred. The fixed-invertible coordinate-gauge illustration
  is a functional nonuniqueness argument under flexible generation, not a trained-model
  failure. Exact author-copy and reading boundaries remain explicit.
- The discrete denominator discrepancy is disclosed against the coherent continuous
  normalizer. Noise-distance and conditional-mean arguments retain distinct-index,
  normalized spatial weights, signal independence, center exclusion and unread-proof
  limits. Finite positive-bandwidth averaging is not unbiasedness or generic consistency.
  Original pixelwise NLM remains separate from later IPOL patchwise details, and finite
  experiments/parameter choices do not establish universal quality or cost.
