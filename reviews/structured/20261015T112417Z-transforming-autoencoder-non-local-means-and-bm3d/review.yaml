  adaptive-selection variance caveats, the all-zero Wiener-gain denominator gap, and
  a bounded structured-transform ordering witness. Practical transform/profile choices
  and color/later variants remain scoped. Manuscript bytes and pagination are distinguished
  from final publisher metadata; no author-code failure, benchmark reproduction or
  universal optimality is claimed.
