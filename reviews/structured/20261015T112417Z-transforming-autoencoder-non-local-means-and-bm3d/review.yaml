- assessment_id: tae-identity
  area: identity
  topic: Concept boundary and actual owner
  outcome: supported
  summary: 'The maintained concept retains its accepted architecture scope with its
    exact accepted aliases []. Actual root decisions retain owner 237 and distinct
    residuals. The supporting historical identity scope is: This record denotes the
    original 2011 transformation-supervised first-level capsule encoder–generator
    architecture. Translation, affine and preliminary stereo configurations are uses
    of that architecture. It does not identify generic capsule networks, later dynamic
    routing or a demonstrated trained part–whole hierarchy. The supplied transformation
    acts on capsule pose outputs before generation; this differs from learned spatial-grid
    resampling, accumulated-warp alignment and supplied-camera silhouette projection.
    Historical research on 15 October 2026 at 09:47:05–09:47:19 UTC inventoried 748
    native and 442 pinned AIO records. Normalized IDs, local IDs, names, aliases and
    scoped synonyms had no candidate collision; all 1,190 inventoried file hashes
    were checked unchanged within that collection. Four fixed-string, word-boundary
    searches included ignored and hidden files and returned 87, 88, 256 and 273 occurrences:
    all 704 were the same repeated pending-owner label in historical discovery reports.
    The full content and occurrence order were accounted for. Semantic inspection
    read 54 selected definitions, 64 selected frontier labels, six relevant complete
    frontier objects, three complete maintained neighboring records and 18 exact AIO
    nodes with 120 incident-edge entries. All fields of the 909 main and 393 nested
    frontier rows were queried mechanically; unrelated full objects were not all manually
    reread. These findings describe that historical snapshot, not a later creation
    base. The accepted prospective PTN and compositional spatial-transformer boundaries
    were considered separately. Existing owner 237 names this method; its retained
    2015 Spatial Transformer URL is historical context, while Hinton, Krizhevsky and
    Wang 2011 supplies the defining evidence. No duplicate frontier leaf or source-family
    saturation is implied.'
  target_ids:
