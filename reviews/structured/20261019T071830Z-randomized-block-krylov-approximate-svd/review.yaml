  summary: Randomized Block Krylov Iteration for Gap-Independent Approximate SVD and
    Principal Component Analysis is a distinct concept.
  details: Distinct from generic PrincipalComponentAnalysis (AIO:PrincipalComponentAnalysis)
    and DimensionalityReduction (AIO:DimensionalityReduction), which do not specify
    randomized block Krylov subspace construction or Chebyshev polynomial spectral
    tail suppression. Distinct from AIMech:CountSketchInputSparsitySubspaceEmbeddingAndRegression
    (Round 331) and AIMech:RelativeErrorCURMatrixDecompositionViaSubspaceLeverageSampling
    (Round 332), which are non-iterative input-sparsity sketching and column-row subset
    selection methods providing Frobenius-norm low-rank approximation rather than
    gap-independent O(log(d)/sqrt(epsilon)) spectral-norm and per-vector PCA variance
    bounds. Also distinct from AIMech:ShiftAndInvertPreconditioningForFasterEigenvectorComputation
    (Round 354), which accelerates top-1 eigenvector computation under an explicit
    relative eigengap via SVRG linear system solves on (lambda I - A)^{-1} rather
    than gap-independent rank-k block Krylov subspace projection.
