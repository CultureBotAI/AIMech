  summary: Exact one-dimensional calculations reproduce the original ten-value ESS
    of 101/2 and five-value trace 0, 1/2, 5/2, 79/6, 434/5. A fixed tie order on 1,2,3,4,6
    gives a two-cluster ESS of 5 versus an available 4. Three recurrence checks equal
    twice the direct ESS increment. Unequal cluster sizes make the minimum-increment
    pair differ from the nearest centroids. On 0,1,2,5,10, feeding ordinary rather
    than squared distances into the same linear recurrence changes the third merge.
    Full squared-distance heights agree with twice the direct increments. These are
    finite curator calculations, not execution of the paper’s software or universal
    certification.
