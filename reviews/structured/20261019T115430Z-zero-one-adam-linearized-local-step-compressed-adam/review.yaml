  summary: 0/1 Adam (Linearized Adaptive-Freezing and Local-Step Compressed Adam)
    is a distinct concept.
  details: Distinct from 1-bit Adam (AIMech:OneBitAdamErrorCompensatedPreconditionedMomentum,
    Tang et al. 2021), which is a special case of Algorithm 4 with T_v = {0, ...,
    T_0 - 1} and T_u = {0, ..., T - 1} (requiring a long continuous full-precision
    warmup stage that can take >50% of wall-clock training time and disallowing local
    steps). Distinct from Qsparse-local-SGD (Basu et al. 2019) and Local SGD (Stich
    2018), which apply local steps to linear SGD without adaptive second-moment preconditioning
    or linear momentum state reconstruction from compressed trajectory buffers.
