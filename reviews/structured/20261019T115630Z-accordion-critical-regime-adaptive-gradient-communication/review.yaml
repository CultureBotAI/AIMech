  summary: Accordion (Critical-Regime Adaptive Gradient Communication and Batch-Size
    Scheduler) is a distinct concept.
  details: Distinct from static gradient compressors such as PowerSGD (AIMech:PowerSGDLowRankGradientCompression,
    Vogels et al. 2019), Top-K sparsification (AIMech:TopKGradientSparsification,
    Aji & Heafield 2017), and QSGD (AIMech:QSGDQuantizedStochasticGradientDescent,
    Alistarh et al. 2017), which use a fixed compression ratio throughout training.
    Distinct from AdaComp (AIMech:AdaCompAdaptiveResidualGradientCompression, Chen
    et al. 2018), which is a specific bin-level residual sparsifier/quantizer rather
    than a critical-regime controller that wraps arbitrary compressors (PowerSGD,
    Top-K) and batch-size schedules.
