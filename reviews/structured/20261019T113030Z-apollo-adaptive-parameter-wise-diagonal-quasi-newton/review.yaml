  summary: Apollo (Adaptive Parameter-wise Diagonal Quasi-Newton Optimizer) is a distinct concept.
  details: 'Distinct from L-BFGS, SdLBFGS (Wang et al. 2017), AdaHessian (AIMech:AdaHessianAdaptiveSecondOrderOptimizer),
    and Sophia (AIMech:SophiaSecondOrderClippedStochasticOptimization): Apollo requires zero Hessian-vector
    products or multi-step secant history buffers; instead it solves the minimum-Frobenius-norm diagonal
    update min_B ||B - B_t||_F subject to the parameter-wise weak secant equation s_t^T B_{t+1} s_t =
    s_t^T y_t (Eqs. 6-7), applies stepsize bias correction y''_t = eta_t y_t so B_{t+1} is invariant to
    eta_t (Eq. 8), and enforces positive definiteness via elementwise rectified absolute values max(|B_{t+1}|,
    sigma) (Eq. 11).'
