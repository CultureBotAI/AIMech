    which score and retrieve each demonstration independently and can select redundant
    near-duplicate examples, whereas CEIL optimizes the determinant of a conditional
    DPP submatrix log det(L'_S) = (1/lambda) sum_{i in S} r_i + log det(L_S) to capture
    negative pairwise interactions and compositional coverage across the selected
    subset.
