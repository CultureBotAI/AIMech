  summary: TART (Task-Aware Retrieval with Instructions) is a distinct concept.
  details: Introduced by Asai, Schick, Lewis, Chen, Izacard, Riedel, Hajishirzi, and
    Yih (Findings of ACL 2023, pp. 3994-4022, arXiv:2211.09260). Distinguished from
    standard zero-shot dense retrievers (such as Contriever or GTR) that condition
    only on the query q, from UPR (Sachan et al., 2022) which uses a fixed question-generation
    prompt to compute log p(q | d) rather than adapting relevance to arbitrary task
    instructions t, and from Promptagator (Dai et al., 2023) which trains separate
    task-specific retrievers on LLM-generated synthetic queries.
