  summary: FedNTD (Federated Not-True Distillation for Global Knowledge Preservation)
    is a distinct concept.
  details: Distinct from FedLSD (Federated Local Self-Distillation) and full-logit
    client-side knowledge distillation methods that distill all C logits including
    the ground-truth class y, which couples the distillation gradient with in-local
    class adaptation L_KL^true and degrades new local knowledge acquisition under
    severe non-IID skew; and distinct from server-side ensemble distillation methods
    such as FedDF (AIMech:FedDfEnsembleKnowledgeDistillationForFederatedModelFusion,
    Lin et al. 2020) and FedGEN (AIMech:FedGenDataFreeKnowledgeDistillationForHeterogeneousFederatedLearning,
    Zhu et al. 2021), as FedNTD operates purely during client local training without
    proxy datasets or generative models.
