  summary: CodedPrivateML Lagrange-Coded Stochastic Quantization for Distributed Training
    is a distinct concept.
  details: Introduced by Jinhyun So, Basak Guler, and A. Salman Avestimehr (IEEE Journal
    on Selected Areas in Information Theory, Vol. 2, No. 1, pp. 441-451, 2021; arXiv:1902.00641).
    Distinct from general Lagrange Coded Computing (Yu et al., AISTATS 2019, Round
    536), which is a one-shot finite-field polynomial evaluation primitive that does
    not include multi-column independent stochastic weight quantization W_bar^(t)
    = [w_bar^(t),1, ..., w_bar^(t),r] or unbiased polynomial sigmoid gradient updates;
    and distinct from Analog Lagrange Coded Computing (Soleymani et al., IEEE JSAIT
    2021, Round 548), which operates over complex floating-point roots of unity with
    Gaussian masks rather than prime finite fields F_p with stochastic rounding.
