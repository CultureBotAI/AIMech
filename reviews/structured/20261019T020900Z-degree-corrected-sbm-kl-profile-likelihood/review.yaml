  summary: Degree-Corrected Stochastic Blockmodel and Edge-Stub Kullback-Leibler Divergence
    Profile Log-Likelihood is a distinct mathematical_method for heterogeneous-degree
    community detection.
  details: Checked against all 442 pinned AIO concepts and 652 maintained AIMech concepts.
    Distinct from `AIMech:TensorSpectralDecompositionForDirichletMixedMembershipCommunityModels`
    (Anandkumar, Ge, Hsu, & Kakade 2014, JMLR 15(66):2239-2312), which models fractional
    simplex community memberships $\pi_u \sim \operatorname{Dir}(\alpha)$ without
    vertex-specific degree heterogeneity parameters $\theta_i$ and recovers $(\Pi,
    P)$ via 5-way vertex-partitioned $\alpha_0$-centered 3-star subgraph count tensors,
    whereas Karrer & Newman (2011) formulate hard group assignments $g_i \in \{1,
    \dots, K\}$ with explicit per-vertex degree propensities $\theta_i$, derive closed-form
    MLEs $\hat{\theta}_i = k_i / \kappa_{g_i}$ and $\hat{\omega}_{rs} = m_{rs}$ that
    preserve the exact expected degree sequence $\langle k_i \rangle = k_i$, prove
    equivalence of the profile log-likelihood $\sum_{rs} m_{rs}\log(m_{rs}/(\kappa_r
    \kappa_s))$ to the edge-end Kullback-Leibler divergence $D_{\text{KL}}(p_K \parallel
    p_{\text{degree}})$ against the configuration-model stub null rather than the
    Erdős-Rényi vertex-count null $p_1(r,s) = n_r n_s / n^2$, and establish an $O(K
    + \langle k\rangle)$ single-vertex shift identity $\Delta \mathcal{L}$ for Kernighan-Lin-style
    local search.
