  details: 'Specify a normalized initial joint distribution p(z_1) and a normalized
    joint transition kernel K_t(z_(t+1)|z_t) for z_t=(x_t,y_t). The finite joint law
    is p(z_1)*product_t K_t(z_(t+1)|z_t). A classical HMM results when the initial
    law factors as pi(x_1)*b_(x_1)(y_1) and K_t factors as a(x_(t+1)|x_t)*b_(x_(t+1))(y_(t+1)).
    General pairwise kernels may retain dependencies removed by those restrictions.
    Given the entire observed sequence y, the posterior over x has a chain factorization
    even if its unconditioned marginal process is not Markov. Define alpha_1(x_1)=p(x_1,y_1),
    propagate alpha_(t+1)(x_(t+1)) by summing alpha_t(x_t)*K_t(x_(t+1),y_(t+1)|x_t,y_t),
    and propagate beta backward with beta_T=1 using the same observed kernel. Normalizing
    alpha_t*beta_t yields the state posterior; including the intervening kernel yields
    adjacent-state posterior probabilities. The source also writes the chain density
    using consistent adjacent joint marginals divided by interior single-position
    marginals, and discusses iterative conditional estimation from hidden-state posterior
    expectations or samples. Limitations: A Markov joint process need not have Markov
    hidden or observed marginals. Conversely, a special parameter choice can make
    those marginals Markov; non-Markov behavior is permitted, not required by the
    definition. The source’s adjacent-marginal density ratios require mutually consistent
    marginals and valid support. Arbitrary pairwise tables cannot be inserted as if
    they were consistent marginals. A normalized initial law and transition kernels
    provide an explicit finite-horizon convention. The converse characterization in
    Proposition2.3 uses an additional symmetry hypothesis. It is not an unrestricted
    criterion for every hidden marginal to be Markov. The forward recurrence is used
    only for t=1,...,T-1; the printed index range beside Equation(3.3) does not correctly
    delimit that update. Posterior normalization requires positive observation evidence.
    Iterative conditional estimation is not automatically identical to EM and does
    not, by its name alone, establish likelihood monotonicity, identifiability or
    global convergence. Stationary parameterizations must preserve the consistency
    of their pair marginals. The primary experiments use specified synthetic chains
    and a noisy image whose scan is explicitly neither an exact HMC nor PMC. They
    do not show universal segmentation superiority, and no empirical result or author-code
    reproduction is curated.'
