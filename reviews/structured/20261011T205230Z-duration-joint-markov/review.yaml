  summary: All three models have broad BayesianNetwork mappings from their normalized
    finite-horizon directed factorizations. The explicit-duration model has a related
    MarkovChain mapping for its embedded or duration-augmented process; its marginal
    hidden label need not be first-order Markov. Pairwise and triplet models have
    broad MarkovChain mappings specifically for their defining complete joint states
    (X,Y) and (X,U,Y), not for projected or hidden marginals. The broad direction
    means the AIO target has broader conceptual scope; it adds no upstream axiom.
    ProbabilisticGraphicalModel is a machine-learning task in this pin, not a more
    precise model identity, and no extra task mapping is necessary. CausalGraphicalModel
    adds unsupported causal semantics. ExponentialSmoothingStateSpaceModel requires
    trend/seasonal exponential smoothing; VectorAutoregression requires linear autoregression.
    TemporalBias is sampling bias, not a temporal process model. AutoregressiveLanguageModel,
    MemoryAugmentedLLM, FactorizedLLM and FactoredLanguageModel require language-model
    scope. MemoryCellLayer, RecurrentLayer and ProbabilisticHiddenLayer denote components;
    LSTM, GRU and RNN denote neural architectures; VAE adds an autoencoder. None identifies
    these stochastic chain constructions. SupervisedLearning, UnsupervisedLearning
    and MachineLearningTask denote learning contexts rather than these model families;
    TrainingStrategy is preprocessing-scoped. Native HMM, IOHMM, mixed-memory Markov,
    factorial HMM, contextual-emission HMM, auxiliary-memory HMM and Boltzmann chain
    distinguish ordinary memoryless emissions, external-input conditioning, mixtures
    over predecessor lags, independent hidden-chain products, distant-state emissions,
    emitted-symbol memories and undirected normalized chains. Reading these neighbors
    does not renew their scientific approval.
