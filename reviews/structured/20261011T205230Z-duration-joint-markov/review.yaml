  details: 'Specify a normalized initial law and first-order transition kernels for
    T_t=(X_t,U_t,Y_t). The observable/target joint law p(x,y) is obtained by summing
    the complete triplet law over auxiliary paths u. For observed y, treat V_t=(X_t,U_t)
    as the augmented hidden state and apply the pairwise-chain forward–backward recursions
    with observed kernels p(v_(t+1),y_(t+1)|v_t,y_t). The product of forward and backward
    messages gives p(v_t,y); sum over u_t at fixed x_t and divide by p(y) to obtain
    p(x_t|y). Maximizing this marginalized posterior gives the per-position marginal-posterior-mode
    estimate. Neither X nor (X,Y), nor even the marginal pair (X,U), is required to
    be Markov in the generic family. A simple source example uses a Markov auxiliary
    U and conditionally independent (X_t,Y_t) pairs given U_t; its hidden–observed
    pair can still fail to be Markov. The experiments use more restricted subclasses,
    including a Markov (X,U) process with conditionally independent observations given
    that pair. Limitations: Inference cost depends on the enlarged state cardinality
    |X|*|U| and the transition structure. Finite auxiliary-state forward–backward
    tractability is not a constant-cost claim as those spaces grow. Summing over U
    is essential: maximizing over U first can change the chosen X state. Statewise
    marginal decoding, joint augmented-path decoding and marginal MAP of the whole
    X path are different objectives. The finite forward/backward update range is t=1,...,T-1
    with the stated initial/terminal messages; the manuscript prints a range including
    zero without defining the corresponding message. Posterior formulas require nonzero
    observation evidence. The conditional-symmetry hypothesis in Proposition2.1 is
    part of that result. It is not adopted as an unconditional characterization of
    all possible Markov projections. The evidential/Dempster–Shafer construction in
    Section2.2 is a particular application. Its proportional factors require a consistent
    normalization treatment before use as conditional transition rows; the generic
    model record does not certify those displayed factors or the evidential theorem.
    Despite the title of Section3.2, the displayed image segmentations use supervised
    parameter estimates. Remark3.2 reports that attempted unsupervised EM on those
    noisy images did not give good results. The source’s synthetic successes do not
    establish universal superiority or global convergence.'
