  summary: The inspected construction is a discrete-time, finite-state hidden semi-Markov
    model with state-specific duration distributions and conditionally independent
    emissions. It separates entry into a state from persistence within that state,
    rather than obtaining every dwell time from repeated self-transitions of an ordinary
    time-homogeneous HMM. The record is a model family, not the Yu–Kobayashi forward–backward
    algorithm. General continuous-time, duration-dependent destination and hybrid
    variants require their own evidence; they are not automatically covered by the
    detailed mechanism here. No normalized identity match was found across all 442
    pinned AIO labels and all scoped synonyms and 388 preceding native IDs, names
    and aliases for the three selected concepts. Full-checkout fixed-string searches
    included ignored and hidden files in both worktree and main, yielding 8 and 8
    matched lines; all 8 unique contents were read. Hits are prior pending leads and
    primary-reference context, not records of these identities. All 78 semantic label/synonym
    hits and 22 fully annotated exact AIO CLASS nodes with outgoing edges were read.
    Twenty-six contextual YAMLs were byte-verified after prior full reading and three
