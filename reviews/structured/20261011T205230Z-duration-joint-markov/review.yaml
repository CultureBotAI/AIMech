  rationale: An HSMM specifies state sojourn durations and can be represented by duration
    augmentation. A PMC specifies a Markov hidden–observed pair; a TMC instead permits
    a non-Markov pair by adding an auxiliary latent process. Subclass embeddings and
    shared inference techniques do not make these model-family identities equivalent.
    Preserve all three local IDs and the explicitly directed AIO mappings.
limitations:
- Adversarial author self-review only; all targets remain DRAFT.
- The triplet PDF is a2002conference manuscript with a corresponding2003SPIE citation.
  PDF locators and byte identity are retained; inaccessible publisher DOI access did
  not supply mechanism evidence.
- A later primary paper was inspected only in web excerpts for context and bibliographic
  corroboration, not fully visually reviewed. Guedon2003 remains abstract/bibliographic
  context only.
- The initial vendored-check attempt failed because sandbox DNS access was unavailable.
  Its output is preserved as contextual evidence; the authorized retry passed without
  modifying governed files.
- Fixed finite calculations are mathematical examples, not empirical validation, author-code
  reproduction, model fitting or universal proofs.
- 215 pending inspection leads plus unresolved dispositions remain; discovery is ongoing.
