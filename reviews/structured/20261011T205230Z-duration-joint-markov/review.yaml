  summary: The inspected construction uses finite hidden X and auxiliary U states
    with an observed Y process, and models the Markov triplet T_t=(X_t,U_t,Y_t). The
    auxiliary variable is a stochastic latent coordinate, not the emitted-symbol stack
    or queue used by an auxiliary-memory HMM. Pairwise Markov chains embed through
    a constant or redundant auxiliary coordinate; general triplet models allow hidden–observed
    pair laws outside that subclass. Independent factorial hidden chains and particular
    evidential models impose additional structure and are not synonyms of the generic
    triplet family. No normalized identity match was found across all 442 pinned AIO
    labels and all scoped synonyms and 388 preceding native IDs, names and aliases
    for the three selected concepts. Full-checkout fixed-string searches included
    ignored and hidden files in both worktree and main, yielding 8 and 8 matched lines;
    all 8 unique contents were read. Hits are prior pending leads and primary-reference
    context, not records of these identities. All 78 semantic label/synonym hits and
    22 fully annotated exact AIO CLASS nodes with outgoing edges were read. Twenty-six
    contextual YAMLs were byte-verified after prior full reading and three freshly
    read, totaling 22 generated and seven native contextual records. Short acronym
