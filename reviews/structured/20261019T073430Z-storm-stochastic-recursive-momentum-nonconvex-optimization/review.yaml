  summary: STORM (Stochastic Recursive Momentum) for Single-Loop Adaptive Variance-Reduced
    Non-Convex SGD is a distinct concept.
  details: Distinct from SPIDER (Round 345, Fang et al. 2018) and SARAH (Round 344,
    Nguyen et al. 2017), which use an unweighted recursive estimator v_t = nabla f(x_t,
    xi_t) - nabla f(x_{t-1}, xi_t) + v_{t-1} (corresponding to a_t = 0) whose accumulated
    martingale variance grows linearly with t and requires periodic double-loop restarts
    with O(sigma^2/varepsilon^2) or O(n) checkpoint mega-batches, whereas STORM multiplies
    the previous error by (1 - a_t) < 1 with a_t = c * eta_{t-1}^2 to damp accumulated
    error in a single loop without any mega-batch checkpoints.
