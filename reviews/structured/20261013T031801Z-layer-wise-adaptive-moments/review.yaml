  evidence_ids:
  - you2020
  - calculation
  summary: Supported within the stated equation and source-version conditions.
  details: The ideal zero-epsilon zero-decay case has a common positive correction
    scalar that cancels during normalization. The constructed decay and positive-epsilon
    examples break that equivalence. With beta values zero and positive epsilon, g/(abs(g)+epsilon)
    is not an exact sign vector. The record qualifies the source ablation interpretation
    and does not recommend disabling safeguards.
