  summary: Supported within the stated equation and source-version conditions.
  details: Positive epsilon protects the coordinate denominator, not cancellation
    between the ratio and decay. The pinned dense and sparse code explicitly falls
    back to ratio one at zero weight or update norm and exposes exclusion patterns.
    Partitioning the same vector changes allocation across normalized blocks.
- assessment_id: bias-correction-and-sign-limit
  area: evidence
  topic: bias-correction-and-sign-limit
  outcome: supported
  target_ids:
