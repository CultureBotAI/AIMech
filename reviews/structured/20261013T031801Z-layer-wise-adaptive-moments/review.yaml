  summary: Constructed vectors corroborate the mathematical boundaries.
  details: For w=[3,4], gradient=[1,100] and rate .02, corrected first-step ratios
    [1,1] yield a .1-norm displacement, distinct from normalizing the raw gradient.
    At zero epsilon and decay, omitting correction leaves that direction unchanged;
    adding decay .1 or epsilon .1 gives different increments. A second gradient [4,1]
    distinguishes raw-state persistence from feeding back corrected states. Decay
    can exactly cancel the moment ratio; zero weight and clipped-phi cases distinguish
    the paper formula from the ratio-one implementation fallback. Whole-vector and
    coordinatewise partitions produce different steps. These are finite algebraic
    examples, not TensorFlow or training results.
