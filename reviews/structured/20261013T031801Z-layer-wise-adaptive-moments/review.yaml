  summary: Retain LAMB as a distinct DRAFT optimizer.
  details: The pinned official implementation expands LAMB as Layer-wise Adaptive
    Moments. The method combines coordinate-wise moment scaling with block normalization
    of the combined update. LARS and CLARS normalize different gradient quantities;
    Adam and RMSprop lack this layer trust ratio. NovoGrad is a separately named primary
    lead despite the similar title phrase. Canonical hit lines were read and historical
    report/rendered paths classified with bounded excerpts; no claim that every historical
    report was fully reread.
