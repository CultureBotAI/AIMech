  summary: Zeno Suspicion-Based Fault-Tolerant Distributed Stochastic Gradient Descent
    is a distinct concept.
  details: Distinct from majority-based geometric or coordinate-wise robust aggregation
    rules that require q < m/2 without a server validation loss check (Krum, Bulyan,
    Trimmed-Mean, Coordinate-Wise Median), and distinct from FLTrust (which computes
    a server reference gradient on a root dataset and ReLU-clips cosine similarities
    rather than evaluating loss descent f_r(x) - f_r(x - gamma u) - rho ||u||^2).
    Specifically denotes the Zeno algorithm of Xie, Koyejo, & Gupta (ICML 2019, PMLR
    97:6893-6901, Definitions 2-3, Algorithm 1, Lemma 1, Theorem 1).
