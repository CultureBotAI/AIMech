  area: evidence
  topic: conditional-block-descent
  outcome: supported
  target_ids:
  - AIMech:KSVD
  evidence_ids:
  - aharon2006
  - calculation-ksvd
  summary: Supported within the stated assumptions and inspected passages.
  details: For fixed other products and active set, minimizing squared error is equivalent
    to maximizing d^T E_R E_R^T d over unit d. The supplied leading singular vector
    attains this optimum, and the old block is feasible. The 250 supplied spectra
    and 8750 finite comparisons supplement this algebra. The deliberately poor feasible
    recoder gives 0→4→2 and does not refute a named OMP implementation. Neither conditional
    descent nor monotone objective values alone proves convergence to a local minimizer.
