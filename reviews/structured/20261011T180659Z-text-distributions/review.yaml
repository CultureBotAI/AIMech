  summary: Retain hierarchical softmax separately from its surrounding language models.
  details: A four-leaf example gives probabilities(.48,.12,.12,.28) summing to1; target-path
    NLL derivatives match branch probability minus indicator. Summing disjoint leaves
    assigned to one word preserves normalization. A three-symbol equal-frequency optimal
    prefix code has mean length5/3 greater than log2(3), and an eight-leaf full comb
    has depth7. The record therefore conditions cost on path length, rejects an unqualified
    logarithmic bound and preserves full-vocabulary output cost. Morin’s shared nonlinear
    node predictor and HLBL’s linear context model use this factorization but remain
    distinct whole-model candidates. A tree probability is exact for its own parameterization,
    not necessarily numerically equal to a given flat softmax.
