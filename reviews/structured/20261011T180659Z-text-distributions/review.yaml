assessments:
- assessment_id: replicatedsoftmax
  area: evidence
  topic: Identity, definition, mechanism, limitations, source provenance and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:ReplicatedSoftmax
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - replicatedsoftmax-source-0
  summary: 'This is the original Replicated Softmax model of Salakhutdinov and Hinton.
    It specializes a restricted Boltzmann machine to word-count sufficient statistics
    across documents of different lengths. It is distinct from repeatedly applying
    the ordinary softmax function, from the expected-count Constrained Poisson update
    discussed in the paper, and from the directed deterministic-feature Document NADE
    architecture. All 442 pinned AIO labels/scoped synonyms and 352 preceding native
    IDs/names/aliases were compared, with no normalized identity match. Both full-checkout
    searches included ignored and hidden files; worktree returned 15 lines and main
    19. All 16 unique matched contents were read: DocNADE contrasts, frontier and
    review references, plus four ignored-environment Sage/Pygments entries unrelated
    to AI SAGE. Twenty-one exact AIO nodes and four complete native neighbors were
    inspected. Absence is bounded to this snapshot and semantic neighborhood.'
  details: 'For a document with D word positions, vocabulary counts n_k and binary
    hidden states h_j, use energy E(V,h)=-sum_jk W_jk h_j n_k-sum_k b_k n_k-D sum_j
    a_j h_j. The joint probability is proportional to exp(-E) with a partition function
    for that length. Hidden units are conditionally independent given words, with
    P(h_j=1|V)=sigmoid(D a_j+sum_k W_jk n_k). Given h, positions independently draw
    words from softmax(b_k+sum_j W_jk h_j); equivalently, sample D word counts from
    the corresponding multinomial. Parameter sharing makes the ordered-word probability
    permutation invariant. A count-vector probability includes the number of distinct
    ordered realizations. Learning contrasts data and model sufficient statistics;
    the paper approximates the model term with finite alternating Gibbs steps initialized
    at data. Limitations: Tractable hidden posteriors do not make the partition function
    or equilibrium model expectation tractable. Finite-step contrastive-divergence
    updates are not exact maximum-likelihood gradients; deterministic expected counts
    are not the same as multinomial Gibbs sampling. The model is conditional on document
    length and supplies no document-length distribution. Its hidden feature vector
    has independent conditional Bernoulli coordinates, not topic proportions constrained
    to sum to one. For ordinary counting measure on K^D ordered word assignments and
    F binary hidden units, the zero-weight, zero-bias partition is K^D times 2^F.
    The AIS discussion’s printed Z_0=2^F needs a corresponding normalized base-measure
    convention or visible-state factor; it is not adopted unchanged as that counting-measure
    partition. This is a mathematical qualification of the displayed derivation, not
