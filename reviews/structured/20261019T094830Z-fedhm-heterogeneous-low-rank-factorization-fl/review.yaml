  summary: 'FedHM: Efficient Federated Learning for Heterogeneous Models via Low-Rank
    Factorization is a distinct concept.'
  details: Distinct from channel width-slimming heterogeneous FL methods such as HeteroFL
    (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning;
    Diao et al., ICLR 2021), FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning;
    Horvath et al., NeurIPS 2021), and FedRolex (AIMech:FedRolexModelHeterogeneousFederatedLearningWithRollingSubModelExtraction;
    Alam et al., NeurIPS 2022), which extract subset channels along width rather than
    factorizing layers via truncated SVD and recovering full matrices U V^T prior
    to aggregation. Distinct from FedPara (AIMech:FedParaAndPFedParaLowRankHadamardProductParameterization;
    Hyeon-Woo et al., ICLR 2022), which parameterizes homogeneous client layers via
    a Hadamard product of two low-rank matrices (W = (X_1 Y_1^T) odot (X_2 Y_2^T))
    without server-side SVD redistributions across heterogeneous client ranks.
