  summary: Entropic Gromov-Wasserstein Discrepancy and Barycenter Averaging is a distinct
    concept.
  details: Distinct from standard linear Wasserstein optimal transport (`AIMech:SinkhornDistancesAndEntropicRegularizedOptimalTransport`)
    and linear Wasserstein barycenters (`AIMech:FastWassersteinBarycentersAndSmoothedDualSubgradientDescent`),
    which require a cross-domain ground cost matrix M_{ij} between points in a shared
    ambient space. Specifically captures the Peyré, Cuturi, and Solomon (2016) entropic
    regularization of Mémoli's Gromov-Wasserstein discrepancy (Equations 2-4), the
    Proposition 1 O(N^2 M + N M^2) separable-loss factorization, the Proposition 2
    / Algorithm 1 iterative Sinkhorn solver, and the Propositions 3-5 / Algorithm
    2 closed-form L_2 and KL relational barycenter updates.
