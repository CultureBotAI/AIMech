- assessment_id: joint-values-and-derivatives
  area: evidence
  topic: joint-values-and-derivatives
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: The claim is supported with its stated qualifications.
  details: 'A differentiable GP prior supplies joint covariance blocks for function
    values and selected partial derivatives by differentiating its kernel. The inspected
    formulation uses a squared-exponential kernel with coordinate-specific lengthscales.
    These latent derivatives are coupled to the observed function values; their virtual
    sign information is distinct from measuring a derivative magnitude. For a unit
    one-dimensional squared-exponential kernel, the derivative–derivative covariance
    at separation d is (1-d²)*exp(-d²/2), which can be zero or negative away from
    the same point. Evidence locators: Section 2, printed p. 646 / PDF p. 2; Section
    3 Equation 6, p. 647 / PDF p. 3; kernel derivative check in research/discovery/monotonic-gp-boundaries.py'
- assessment_id: probit-sites-and-ep
  area: evidence
  topic: probit-sites-and-ep
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: The claim is supported with its stated qualifications.
  details: 'At each chosen location and input coordinate, positive derivative information
    contributes Phi(f_prime/nu), with nu>0 and Phi the standard-normal CDF. EP replaces
    these non-Gaussian factors with Gaussian sites and approximates the joint posterior.
    Gaussian observation likelihoods are used for regression; binary probit classification
    applies EP to class-observation factors as well. Hyperparameters maximize an approximate
    joint marginal likelihood in the inspected procedure rather than being integrated
    out. Evidence locators: Section 3, Equations 5–10 and subsequent inference/prediction
    equations, printed pp. 647–648 / PDF pp. 3–4'
- assessment_id: virtual-point-placement
  area: evidence
  topic: virtual-point-placement
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: The claim is supported with its stated qualifications.
  details: 'The source proposes grids in low dimensions, selected observed covariate
    locations in higher dimensions, and iterative placement where the current predictive
    derivative has high probability of being negative. Points can be added, moved
    or removed after conditioning. Dense computation scales cubically in the combined
    number of real and virtual observations, and a grid grows exponentially with input
    dimension; spacing relative to the fitted lengthscale affects how constraints
    influence intervening locations. Evidence locators: Section 3.1, printed pp. 648–649
    / PDF pp. 4–5; Section 5, p. 652 / PDF p. 8'
- assessment_id: approximate-monotonicity
  area: evidence
  topic: approximate-monotonicity
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: The claim is supported with its stated qualifications.
  details: 'Finite derivative sites and an EP approximation do not guarantee a globally
    monotone function. As a logical finite-site counterexample, f(x)=2x³-3x²+x has
    derivative 1 at x=0 and x=1, but -1/2 at x=1/2. Finite nu also gives positive
    likelihood to negative slopes. Even the Gaussian matching a standard normal truncated
    to a positive derivative retains about 0.0928 probability below zero. This last
    value is a curator one-site limiting calculation, not a measured violation rate
    for the paper’s models or a run of its EP implementation. Evidence locators: Section
    3 Equation 5 and Gaussian approximation, printed p. 647 / PDF p. 3; Section 4.2
    and conclusion, pp. 651–652 / PDF pp. 7–8; curator calculations in research/discovery/monotonic-gp-boundaries.py'
- assessment_id: derivative-sign
  area: consistency
  topic: Sign information, Gaussian sites and direct derivative values
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: The record preserves the distinction between a sign factor and an observed
    derivative magnitude.
  details: Kernel derivatives define a joint Gaussian prior for derivative values,
    while a probit sign likelihood makes the posterior non-Gaussian. Gaussian EP sites
    approximate that factor; they are not measured slopes. A unit squared-exponential
    kernel has derivative covariance1 at zero separation,0 at separation1 and negative
    covariance at2, so positive same-point variance does not imply every cross-covariance
    is positive.
- assessment_id: guarantee
  area: scope
  topic: Finite site placement versus global monotonicity
  outcome: supported
  target_ids:
  - AIMech:MonotonicGaussianProcessWithVirtualDerivatives
  evidence_ids:
  - paper
  - calculation
  summary: Neither a finite grid nor Gaussian moment matching supplies a global guarantee.
  details: The cubic example has positive endpoint slopes yet a negative midpoint
    slope and decreasing interior values. It is a logical counterexample, explicitly
    not claimed to be a sample from the squared-exponential GP. Positive likelihood
    at slope-1 with nu1 demonstrates soft support; the paper uses nu1e-6, so the displayed
    number is not attributed to that experiment. The half-normal limit has mean sqrt(2/pi),
    variance1-2/pi and its matching Gaussian has negative mass0.0928166. This is a
    one-site limiting derivation, not a claim about a full fitted EP violation rate.
