  summary: Both related mappings have direct method scope support.
  details: The Gaussian-observation variant estimates a response relationship while
    adding derivative-sign information. The target names a broad task, whereas this
    record specifies an inference procedure; the mapping does not assert identity
    or an upstream subclass. The source extends the procedure to two-class probit
