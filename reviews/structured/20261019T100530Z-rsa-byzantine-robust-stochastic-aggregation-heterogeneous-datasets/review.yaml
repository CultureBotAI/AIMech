  summary: Byzantine-Robust Stochastic Aggregation for Heterogeneous Datasets is a
    distinct concept.
  details: Distinct from gradient-averaging or robust gradient-aggregation rules that
    assume i.i.d. worker gradients (Krum, Bulyan, Trimmed-Mean, Coordinate-Wise Median,
    Geometric Median / RFA), and distinct from proximal heterogeneous federated optimization
    without Byzantine robustness (FedProx). Specifically denotes the l_1-norm and
    l_p-norm Regularized Stochastic Aggregation (RSA) methods of Li, Xu, Chen, Giannakis,
    & Ling (AAAI 2019, Eqs. 5-11, Proposition 1, Theorems 1-4).
