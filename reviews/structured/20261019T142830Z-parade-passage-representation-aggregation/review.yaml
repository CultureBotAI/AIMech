  summary: 'PARADE: Passage Representation Aggregation for Document Reranking is a
    distinct concept.'
  details: Distinct from passage score aggregation methods such as BERT-MaxP and Birch
    (which collapse each passage representation p_i^cls into a scalar relevance score
    s_i before pooling across passages) and from CEDR (which averages token/CLS similarity
    matrices into kernel-pooling neural rankers). PARADE aggregates the high-dimensional
    passage [CLS] representation vectors themselves via hierarchical Transformer or
    CNN layers and supports logit-level MSE knowledge distillation L = alpha * L_CE
    + (1 - alpha) * ||z^t - z^s||^2 into compact student backbones.
