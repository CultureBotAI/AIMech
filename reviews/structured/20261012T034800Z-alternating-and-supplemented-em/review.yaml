  summary: Treat symmetry as a useful diagnostic without certification.
  details: Both methods require a sufficiently converged regular interior fit and
    nonsingular information. Near-unit missing-information fractions amplify errors;
    zero perturbation denominators and exactly converged coordinates need special
    treatment. A common wrong curvature scaling gives a symmetric but wrong diagonal
