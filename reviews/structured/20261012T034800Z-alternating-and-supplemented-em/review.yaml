  details: 'At a regular interior fit theta*, let Ic be the conditional expected negative
    complete-data Hessian and D the EM map derivative using input-coordinate rows
    and output-coordinate columns. The missing-information identity gives Io=(I-D)Ic,
    so Vobs=Ic^(-1)(I-D)^(-1). Equivalently add Ic^(-1)D(I-D)^(-1) to the complete-data
    covariance. The factors and derivative convention matter; a single scalar convergence
    rate cannot replace the full Jacobian in a multiparameter problem. Obtain a tightly
    converged fit and expected complete information. Perturb one input coordinate
    away from theta*, holding the other input coordinates at theta*, and perform one
    full ordinary EM update. Divide each output change from theta* by the input perturbation
    to approximate one row of D, using stabilized ratios as perturbations approach
    the fit. Section 3 implements SEM by making CMSTEPS a joint Q maximization and
    setting the separate CM derivative to zero. Inverse observed curvature is an asymptotic
    uncertainty approximation requiring a regular interior fit and nonsingular information.
    Ratio calculations become unreliable with inaccurate fitting, tiny denominators
    or missing-information fractions near one. Components reaching their fitted values
    exactly can require special treatment instead of zero-denominator ratios. Inspecting
    asymmetry is a useful diagnostic, but symmetric output does not certify the correct
    covariance or statistical coverage. Limitations: The inspected full-text mechanism
    source is the 1995 primary follow-up, not the original 1991 paper. Original-paper
    access remains a documented evidence gap; no unseen original proof is claimed.
    The method additionally requires expected complete-data information. The simple
    sufficient-statistic implementation assumes an appropriate exponential-family
    complete model; general expected-curvature calculation may require integration.
    Boundary optima, nonidentifiability, singular information and incomplete convergence
    can invalidate the inverse-curvature calculation or its statistical interpretation.
    It does not provide a full posterior distribution or guaranteed finite-sample
    interval coverage. The source’s strong informal language about symmetry assuring
    correctness is not adopted as a theorem. A wrong common information scaling can
    preserve symmetry while giving wrong variances. Finite Gaussian matrix checks
    are not a calibration study or replication of the source examples.'
