    estimates, shifts held within each block, and immediate projection updates are
    essential. The author correction supersedes restoration of stale old pixels. Two
    finite Poisson sweeps increase likelihood and revive a zero coordinate; a scalar
    penalized root solves its own surrogate. SAGE1/2/3 are variants, while the existing
    sparse additive text model is a different SAGE identity.
