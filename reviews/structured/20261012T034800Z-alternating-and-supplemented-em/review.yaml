limitations:
- Adversarial author self-review only; all four records remain DRAFT.
- 'All 107 new PDF pages visually read: AECM58 including cover/discussions/reply,
  SAGE1994 author15-page copy, SAGE1995 thirteen pages, SECM21 pages. The original
  1991 SEM PDF returned 403; cached text/screenshot attempts are not certified full
  visual inspection. The 1995 primary follow-up explicitly supplies the complete SEM
  special-case implementation.'
- Primary1994 SAGE copy has different pagination from the final14-page journal article.
  All locators use its actual PDF pages; the author errata and 1995 follow-up govern
  the retained corrections.
- Both Hero and Fessler author bibliography entries were inspected. Fessler adds the
  important Lemma 6 separability restriction beyond the previously read Hero excerpt.
  Source snapshots are hashed and only relevant entries were read; not the entire
  large Fessler catalog.
- Initial Harvard downloads returned 403; an initial Python SAGE download failed certificate
  issuer verification. Author alternatives downloaded with normal system curl TLS
  verification. A MarkIrwin course-page curl request failed hostname verification
  and was not bypassed.
- The source Gaussian residual sign and SECM example covariance/information wording
  inconsistencies were inspected and retained. Published author errata are distinguished
  from curator-derived mathematical checks.
- Likelihood ascent, stationary-limit conditions, local rate comparisons, computation
  time and uncertainty calibration are separate claims. Symmetry is useful but does
  not certify correct covariance.
- No author software, historical fit, trained model, phantom study, clinical result
  or confidence-interval coverage study was reproduced. Complete source PDFs are not
  redistributed.
- Nine new provisional cohorts leave 403 pending leads and other unresolved dispositions.
  All 596 prior labels were checked and ignored-inclusive full-checkout label searches
  found no exact new-label hits. This does not prove all underlying methods are new,
  and no saturation is claimed.
