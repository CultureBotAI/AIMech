  summary: FedCorr (Multi-Stage Federated Learning for Heterogeneous Label Noise Correction)
    is a distinct concept.
  details: Distinct from centralized noisy-label learning methods such as DivideMix
    (AIMech:DivideMixLearningWithNoisyLabelsAsSemiSupervisedLearning, Li et al. 2020)
    and Co-teaching (AIMech:CoTeachingRobustTrainingOfDeepNeuralNetworksWithExtremelyNoisyLabels,
    Han et al. 2018), which assume a single centralized dataset with homogeneous noise
    and cannot distinguish clean versus noisy clients or bound non-IID weight divergence
    across distributed clients; and distinct from Byzantine-robust gradient aggregators
    (such as Krum or Trimmed Mean), which discard client updates rather than correcting
    corrupted local sample labels.
