  summary: EF21 Markov-Compressor Error Feedback for Heterogeneous Nonconvex Distributed
    Optimization is a distinct concept.
  details: Distinct from classical error-compensated SGD (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression,
    which compresses step-scaled gradients plus residual memory m_t + eta_t * g_t,
    requires bounded gradient norms, and suffers an O(1/alpha^2) dependence in heterogeneous
    distributed settings), from unbiased stochastic quantization (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding),
    and from uncompressed variance-reduced nonconvex optimizers (AIMech:PageProbabilisticGradientEstimatorForNonconvexOptimization).
    No pinned AIO class covers EF21 or Markov gradient-difference error feedback.
