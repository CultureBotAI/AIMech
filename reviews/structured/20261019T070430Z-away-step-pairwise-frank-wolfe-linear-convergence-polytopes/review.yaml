  summary: Away-Step and Pairwise Frank-Wolfe Linear Convergence on Polytopes is a
    distinct concept.
  details: Distinct from standard Frank-Wolfe / Conditional Gradient, which moves
    only toward vertices s_t in A and stagnates at O(1/t) when the optimum lies on
    a facet, and from projected gradient methods such as Catalyst or Soft-Impute,
    which require Euclidean or Bregman projections onto M at every step rather than
    linear minimization oracle (LMO) calls. Specifically captures the active-set Away-Steps
    (Algorithm 1) and Pairwise (Algorithm 2) conditional gradient updates, the drop-step
    amortisation bound, the Pyramidal Width PWidth(A) and Geometric Strong Convexity
    mu_f^G = mu * delta^2 (Theorem 6), and the exact simplex/cube pyramidal widths
    (Section 3.1 and Lemma 4).
