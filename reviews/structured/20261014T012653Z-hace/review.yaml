  summary: Supported within the stated primary-source and mathematical scope.
  details: Equation 9 divides cross-group observed edges by possible pairs; the named
    substitution at the end of page 4 supports HAC-E. The three-vertex path illustrates
    that density and the Equation 5 profile guide can rank pairs differently, without
    claiming either full implementation selects those pairs.
