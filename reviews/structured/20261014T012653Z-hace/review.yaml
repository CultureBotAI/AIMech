  - park2011
  - calculation
  summary: Supported within the stated primary-source and mathematical scope.
  details: For disjoint nonempty groups in a binary graph, mean adjacency equals edge
    density and mean one-minus-adjacency is its complement. Additivity of edge counts
    gives weights proportional to merged group sizes. The example gives 2/3 rather
    than the equal-weight 3/4, but establishes no implementation or stopping equivalence.
