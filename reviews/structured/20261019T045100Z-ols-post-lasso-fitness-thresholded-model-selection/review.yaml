  summary: 'Verified in pure Python across two regimes: (1) on an n=40, p=12 correlated
    design, exact subset enumeration confirms Lemma 3''s sparse eigenvalue sublinearity
    phi(l*k) <= ceil(l)*phi(k) across all (k, l) pairs (e.g., phi(2) = 1.475191 <=
    2*phi(1) = 2.0, phi(6) = 2.026816 <= 3*phi(2) = 4.425573); and (2) on an n=60,
    p=45 sparse regression instance (s=3, T=[0, 1, 2]) where Lasso selects T_hat =
    [0, 1, 2, 3] (1 false positive), Remark 3.1''s deterministic shrinkage lower bound
    holds strictly (lasso_pred_error = 0.28324 >= 0.030868), unthresholded OLS Post-Lasso
    reduces empirical risk Q_hat from 0.092189 to 0.060505 and nearly halves prediction
    error from 0.28324 to 0.146349, and Equation 2.11 fitness thresholding (t_gamma
    = 1.249326) prunes the false positive to recover the exact support [0, 1, 2] and
    reduces prediction error 3.8x over Lasso to 0.074447.'
