  summary: OLS Post-Lasso and Fitness-Thresholded Post-Model-Selection Estimation
    in High-Dimensional Sparse Models is a distinct two-stage algorithm and oracle
    rate theory.
  details: Resolved against all 442 pinned AIO concepts and 662 maintained AIMech
    concepts. Distinct from `AIMech:L1PenalizedAndPostPenalizedQuantileRegressionProcessInHighDimensionalSparseModels`
    (Belloni & Chernozhukov 2011, which analyzes the check-loss $\ell_1$-QR and post-$\ell_1$-QR
    process across quantiles $u \in \mathcal{U}$ under conditional density regularity
    and pivotal score suprema), distinct from `AIMech:PostDoubleSelectionHighDimensionalTreatmentEffectInference`
    (Belloni, Chernozhukov, & Hansen 2014, which performs union-of-supports double
    selection across outcome and treatment equations for semiparametric causal treatment-effect
    inference rather than single-equation OLS Post-Lasso prediction/estimation oracle
    inequalities, Lemma 3 sparse-eigenvalue sublinearity, Remark 3.1 Lasso shrinkage
    lower bounds, and Equation 2.11 fitness-thresholded support pruning), distinct
    from `AIMech:AdaptiveLassoOracleVariableSelection` (Zou 2006, reweighted $\ell_1$
    penalization under fixed-$p$ or asymptotic beta-min assumptions), and distinct
    from `AIO:LassoRegression` and `AIO:LinearRegression`.
