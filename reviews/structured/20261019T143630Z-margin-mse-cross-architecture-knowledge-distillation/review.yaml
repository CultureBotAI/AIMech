  summary: Margin-MSE Cross-Architecture Knowledge Distillation for Neural Ranking
    is a distinct concept.
  details: Distinct from homogeneous model-compression knowledge distillation (such
    as DistilBERT, TinyBERT, or TwinBERT, which compress a teacher into a smaller
    student of the same architectural family or match hidden states/attention matrices)
    and from pointwise score MSE distillation (Equation 13). Because different ranking
    architectures exhibit vastly different raw output score ranges and offsets (e.g.,
    BERT_CAT scores centered near 0 vs. BERT_DOT/ColBERT dot-product scores centered
    around +70 to +160 vs. TK scores centered below 0), pointwise MSE forces unnatural
    score shifts, whereas Margin-MSE optimizes only the relative pairwise margin M(Q,
    P^+) - M(Q, P^-) and seamlessly corrects false negatives whenever the teacher
    assigns a negative margin M_t(Q, P^+) - M_t(Q, P^-) < 0.
