  summary: Conformer-Kernel with Query Term Independence for Document Retrieval is
    a distinct concept.
  details: Distinct from TK (AIMech:TKTransformerKernelRankingModel, which contextualizes
    both query and document with quadratic self-attention) and TKL (AIMech:TKLTransformerKernelForLongDocuments,
    which applies TK over overlapping sliding windows of long documents). Conformer-Kernel
    replaces quadratic self-attention with separable self-attention (Equations 5-6)
    inside a parallel Convolution+Transformer (Conformer) block and optionally enforces
    Query Term Independence (CK with QTI) by combining a learned explicit batch-scaled
    BM25 sub-model s_{t,d}^{(explicit)} (Equations 9-10) with an implicit Conformer-Kernel
    sub-model s_{t,d}^{(implicit)} (Equations 11-16) whose non-negative combined scores
    s_{t,d} = ReLU(alpha * s_{t,d}^{(explicit)} + (1 - alpha) * s_{t,d}^{(implicit)}
    + b_comb) can be pre-computed offline for top-k vocabulary terms per document.
