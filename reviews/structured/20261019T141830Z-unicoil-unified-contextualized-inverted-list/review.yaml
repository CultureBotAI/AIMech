  summary: uniCOIL Unified Contextualized Inverted List Sparse Retrieval is a distinct
    concept.
  details: Distinct from COIL (AIMech:COILContextualizedInvertedList), which stores
    d = 32 real-valued contextualized token vectors requiring custom vector-inverted-list
    infrastructure (~40 GB index on MS MARCO) and allows negative weights; distinct
    from DeepCT (AIMech:DeepCTContextAwareTermImportanceEstimationForFirstStageRetrieval),
    which trains a regression model on pseudo-ground-truth term frequencies without
    document expansion or query-term weighting and still relies on BM25's IDF/length-normalization
    formula; and distinct from SPLADE (AIMech:SPLADESparseLexicalAndExpansionModel),
    which performs end-to-end MLM-logit vocabulary expansion rather than combining
    d = 1 COIL scalar impact weighting with external doc2query-T5 expansion.
