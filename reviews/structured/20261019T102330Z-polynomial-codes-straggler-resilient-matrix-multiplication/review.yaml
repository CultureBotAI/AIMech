  summary: Polynomial Codes for Straggler-Resilient High-Dimensional Coded Matrix
    Multiplication is a distinct concept.
  details: Distinct from Lagrange Coded Computing (AIMech:LagrangeCodedComputingForResilientSecureAndPrivateDistributedLearning,
    which encodes a dataset of K separate inputs via Lagrange interpolation polynomials
    to evaluate a single multivariate polynomial f(X_i) on each batch), from Gradient
    Coding (AIMech:GradientCodingForStragglerResilientDistributedOptimization, which
    encodes partial loss gradients over replicated data blocks), and from MatDot and
    PolyDot Codes (AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication,
    which split A into column blocks and B into row blocks to compute inner-product
    sums sum_i A_i B_i with recovery threshold 2m - 1 at higher worker-to-master communication
    cost). Polynomial Codes (Yu, Maddah-Ali, & Avestimehr, NeurIPS 2017, pp. 4403-4413
    / arXiv:1705.10464, Section II-IV, Definition 2, Equations 14-18, Theorems 1-5)
    achieve the information-theoretically minimum recovery threshold K_{poly} = mn
    = Theta(1) independent of N under minimum worker-to-master communication load
    L* = r t log_2 q (Theorems 1-3), and extend via the (alpha, beta) = (1, 1) code
    (Equations 31-33, Theorem 4) to distributed convolution c = a * b with recovery
    threshold K_{conv-poly} = m + n - 1.
