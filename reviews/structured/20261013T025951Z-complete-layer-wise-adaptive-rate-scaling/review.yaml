  summary: Retain CLARS as a distinct DRAFT algorithm.
  details: The published rate divides by the mean individual-example gradient norm,
    which differs from the norm of their mean. Identical aggregate gradients can therefore
    produce different CLARS increments. Ordinary SGD, coordinatewise Adam/RMSprop
    and Hamiltonian sampler warmup do not have this identity. The record does not
    silently equate the author implementation with the published equation.
