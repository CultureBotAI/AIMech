  - calculation
  summary: Constructed examples support the stated distinctions.
  details: At weight norm 5, global rate .2 and eta .1, coherent gradients [1,0] and
    [3,0] give fresh norm .1 and coherence 1 despite positive gradient variance 1.
    Orthogonal gradients give coherence 1/sqrt2 and fresh norm .0707106781. Opposite
    gradients have positive denominator but zero mean/fresh increment. Batches with
    the same aggregate [1,0] give increments .1 or .05 depending on individual norms;
    averaging grouped gradients can double the ideal step. A mean-squared-norm variant
    gives .04 instead of .1. With illustrative v0=w0 and beta .9, Equation 4 displacement
    .19 exceeds fresh bound .1. These are finite constructed vector identities, not
    a training or empirical variance study.
