  summary: FedDF (Ensemble Distillation for Robust Model Fusion in Federated Learning)
    is a distinct concept.
  details: Distinct from coordinate-wise parameter-averaging schemes such as FedAvg,
    FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization), FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization),
    and FedOpt (AIMech:FedOptAdaptiveServerOptimizationFedAdagradFedYogiFedAdam),
    which cannot fuse heterogeneous neural network architectures and suffer functional
    collapse when averaging heavily drifted non-linear client weights, and from FedMA
    (AIMech:FedMaFederatedMatchedAveragingViaLayerWiseBayesianNonparametricMatching,
    which performs layer-wise Hungarian permutation alignment in weight space without
    unlabeled server-side logit distillation).
