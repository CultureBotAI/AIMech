  summary: Gradient Centralization is a distinct concept.
  details: 'Distinct from activation normalizations (Batch Normalization, Layer Normalization, Group Normalization)
    and from weight reparameterizations (Weight Normalization, Weight Standardization): whereas Weight
    Standardization enforces e^T w = 0 directly on weights and therefore breaks pretrained ImageNet checkpoints
    whose initial weights have non-zero mean e^T w^0 != 0, Gradient Centralization projects gradients
    onto the hyperplane e^T (w - w^0) = 0, preserving any pretrained initialization w^0 while embedding
    into SGDM, Adam, or AdamW in a single line of code.'
