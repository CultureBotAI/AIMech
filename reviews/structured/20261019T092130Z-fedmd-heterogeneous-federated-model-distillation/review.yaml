  summary: FedMD (Heterogeneous Federated Learning via Public-Dataset Model Distillation)
    is a distinct concept.
  details: Distinct from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning,
    Lin et al. 2020), which exchanges model weights and performs ensemble distillation
    on the server into global prototype architectures rather than communicating only
    public-dataset logits f_k(x_i^0) and distilling on each client via alternating
    Digest and Revisit phases; and distinct from FedGKT (AIMech:FedGktGroupKnowledgeTransferForEdgeFederatedLearning,
    He et al. 2020), which exchanges intermediate feature maps and private-sample
    logits between small edge encoders and a large server classifier.
