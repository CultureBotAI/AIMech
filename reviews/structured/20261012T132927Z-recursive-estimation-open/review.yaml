- assessment_id: r0-prediction-error-update
  area: evidence
  topic: prediction-error-update
  outcome: supported
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'For the squared prediction-error criterion, let epsilon_t=y_t-yhat_t and
    let psi_t denote the recursive predictor-sensitivity approximation. The displayed
    Gauss–Newton form updates R_t=(1-gamma_t)R_(t-1)+gamma_t*psi_t*psi_t^T and theta_t=theta_(t-1)+gamma_t*R_t^(-1)*psi_t*epsilon_t,
    with positive-definite curvature handling as needed. The positive update sign
    corresponds to minus the residual-loss gradient because epsilon=y-yhat. R approximates
    curvature; it is not the exact Hessian of every nonlinear objective. Other search
    directions belong to the broader prediction-error method family. Locator: Section
    3, Equations 18–25, PDF p. 5 / printed p. 572'
- assessment_id: r0-residual-dependent-sensitivity
  area: evidence
  topic: residual-dependent-sensitivity
  outcome: supported
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'For a fixed parameter theta and predictor theta^T*phi_t(theta) built from
    past residuals, the total sensitivity is psi_t=phi_t-sum_i[theta^T*(partial phi_t/partial
    epsilon_(t-i))]*psi_(t-i). The online algorithm uses previous parameter estimates
    and stored residuals/sensitivities. This is a recursive approximation based on
    the fixed-parameter derivative, not exact differentiation through the entire sequence
    of changing parameter updates. Treating phi as parameter-independent generally
    changes the direction. Locator: Sections 2–3, Equations 8–12 and 24–25, PDF pp.
    3–5 / printed pp. 570–572'
- assessment_id: r0-linear-noise-filter
  area: evidence
  topic: linear-noise-filter
  outcome: supported
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'With a nonlinear process predictor and a constant-coefficient linear lagged-error
    polynomial C(q^-1)=1+sum_i c_i*q^-i, the source writes the sensitivity recursion
    as filtering the current regressor through 1/C. The leading coefficient is 1.
    Predictor/filter stability concerns residual reconstruction and differs from stability
    of the physical system dynamics. Merely making the noise terms linear in past
    errors does not guarantee a stable filter. Locator: Sections 2–4.1, Equations
    15,26–30, PDF pp. 4,6 / printed pp. 571,573'
- assessment_id: r0-inverse-curvature-form
  area: evidence
  topic: inverse-curvature-form
  outcome: supported
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'An algebraically equivalent inverse update uses P_t=[P_(t-1)-P_(t-1)*psi_t*psi_t^T*P_(t-1)/(lambda_t+psi_t^T*P_(t-1)*psi_t)]/lambda_t
    and theta_t=theta_(t-1)+P_t*psi_t*epsilon_t, where P_t=gamma_t*R_t^(-1) and lambda_t=gamma_(t-1)*(1-gamma_t)/gamma_t.
    The equivalence requires well-defined inverses and nonzero denominators; the gain
    and forgetting factors are linked rather than arbitrary independent choices. Exact
    two-dimensional calculations check this identity for a specified positive-definite
    common state. Locator: Section 3, Equations 19–23, PDF p. 5 / printed p. 572;
    exact curator calculations in research/discovery/recursive-estimation-boundaries.py'
- assessment_id: r0-conditional-convergence
  area: evidence
  topic: conditional-convergence
  outcome: concern
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Scientific scope is supported; the precise locator needs correction.
  details: 'The ODE-based convergence discussion assumes a stable predictor domain,
    admissible parameter restrictions, suitable smoothness and data/moment limits,
    decreasing gains, and positive-definite curvature. It concerns local behavior
    under those conditions, not unconditional global minimization. For general nonlinear
    noise the stable domain can depend on unknown input/output statistics, preventing
    straightforward enforcement. The source’s recommendation to use simpler noise
    models is not a universal convergence proof. Locator: Section 4, particularly
    4.1 conditions (a)–(e), Equations 32–44 and 4.4, PDF pp. 7–8,15 / printed pp.
    574–575,582'
- assessment_id: r0-fixed-structure-identification-use
  area: evidence
  topic: fixed-structure-identification-use
  outcome: supported
  target_ids:
  - AIMech:RecursivePredictionErrorEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'The paper applies recursive prediction-error estimation to a simulated
    closed-loop polynomial system and a measured pilot liquid-level system. Model
    structures are determined beforehand. For the liquid-level example, recursive
    and offline estimators use the same selected NARMAX structure. These examples
    establish a documented parameter-identification use; they are not held-out accuracy,
    causal recovery or universal superiority evidence. Locator: Section 6, Examples
    1–2, Tables 1–3 and Figures 1–6, PDF pp. 17–26 / printed pp. 584–593'
- assessment_id: r1-raw-regressor-update
  area: evidence
  topic: raw-regressor-update
  outcome: supported
  target_ids:
  - AIMech:PseudoLinearRegressionEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'For yhat_t=theta_(t-1)^T*phi_t with regressors that may depend on past
    estimated residuals, the basic recursive pseudo-linear estimator uses epsilon_t=y_t-yhat_t,
    R_t=(1-gamma_t)R_(t-1)+gamma_t*phi_t*phi_t^T, and theta_t=theta_(t-1)+gamma_t*R_t^(-1)*phi_t*epsilon_t.
    It uses phi in place of the prediction-error method’s sensitivity psi. This is
    the unfiltered form displayed in the source; additional filtering defines further
    variants. Locator: Section 5, Equations 83–85, PDF pp. 15–16 / printed pp. 582–583'
- assessment_id: r1-surrogate-derivative-boundary
  area: evidence
  topic: surrogate-derivative-boundary
  outcome: supported
  target_ids:
  - AIMech:PseudoLinearRegressionEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'When phi depends on theta through earlier residuals, using phi alone omits
    part of the total derivative. In the fixed-parameter example yhat_t=b*x_t+c*epsilon_(t-1),
    epsilon_0=0, x=(1,4), y=(1,3), and b=c=1/2, the second regressor is (4,1/2) while
    the total prediction sensitivity is (7/2,1/2). Starting a single update from the
    same P_previous=I and lambda=1 gives increments (4/23,1/46) for the raw-regressor
    rule and (7/36,1/36) for the sensitivity rule. These are curator calculations
    comparing a common state, not two complete adaptive trajectories or a performance
    ranking. Locator: Sections 2–3 and 5, Equations 8–12,21,83–85, PDF pp. 3–5,15–16
    / printed pp. 570–572,582–583; exact curator calculations in research/discovery/recursive-estimation-boundaries.py'
- assessment_id: r1-least-squares-special-cases
  area: evidence
  topic: least-squares-special-cases
  outcome: supported
  target_ids:
  - AIMech:PseudoLinearRegressionEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'The source identifies recursive extended least squares for an ARMAX model
    as a pseudo-linear regression example. It is a specialized member, not an alias
    for every pseudo-linear estimator. If regressors truly do not depend on the parameters
    or their residual history, the omitted derivative terms vanish and the basic recursion
    reduces to ordinary recursive least-squares fitting. Linear appearance in coefficients
    with residual-dependent regressors does not by itself make the full prediction-error
    criterion quadratic in those coefficients. Locator: Sections 2–3 and 5, Equations
    8–12,19,83–85, PDF pp. 3–5,15–16 / printed pp. 570–572,582–583'
- assessment_id: r1-invertibility-versus-positive-real-condition
  area: evidence
  topic: invertibility-versus-positive-real-condition
  outcome: supported
  target_ids:
  - AIMech:PseudoLinearRegressionEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'For linear-model RELS, the source’s convergence discussion adds correct
    model specification and the strict positive-real condition Re[1/C°(exp(i*omega))-1/2]>0
    for all frequencies, together with the applicable regularity conditions. Stable
    inversion alone does not imply that stronger condition: C(q^-1)=(1+0.9*q^-1)^2
    has both C* roots at -0.9, while the displayed test at zero frequency equals -161/722.
    This exact example shows failure of a sufficient condition; it does not prove
    that a particular RELS run diverges. Locator: Sections 4.1 and 5, Equations 29–30
    and 86–88, PDF pp. 6,16 / printed pp. 573,583; exact curator calculations in research/discovery/recursive-estimation-boundaries.py'
- assessment_id: r1-nonlinear-convergence-scope
  area: evidence
  topic: nonlinear-convergence-scope
  outcome: supported
  target_ids:
  - AIMech:PseudoLinearRegressionEstimation
  evidence_ids:
  - chen-billings1989
  - calculations
  summary: Claim is supported within its stated boundary.
  details: 'Extending the recursion to nonlinear polynomial regressors does not automatically
    transfer linear-model convergence results. The source notes that existence of
    input/noise second-moment limits alone may be insufficient for the required nonlinear
    regressor moment limits, and leaves more general data-dependent noise-model analysis
    for further study. The paper’s Section 6 simulations use the recursive prediction-error
    estimator; they are not reported comparative evaluations of pseudo-linear regression.
    Locator: Section 5, Equations 89–91 and closing paragraph, and Section 6, PDF
