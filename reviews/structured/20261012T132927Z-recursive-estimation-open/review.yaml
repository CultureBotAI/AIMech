  summary: Related AIO mappings are supported curator inferences.
  details: The squared-residual criterion and recursive least-squares algebra directly
    relate these parameter updates to residual-squared fitting. The pinned target
    describes an overdetermined fitting analysis, not this recursive estimator; the
    pseudo-linear approximation also need not minimize the full nonlinear prediction-error
