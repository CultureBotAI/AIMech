  summary: Supported within the stated primary-source and mathematical scope.
  details: For positive mu and eta<1, inverting [(1-eta)mu,(1+eta)mu] gives the stated
    ratio interval. Eta<=rho/(1+rho) suffices for a two-sided factor 1+rho. The weighted-star
    family has diameter below 2 while mu/Delta tends to zero as n grows, so the manuscript’s
    informal diameter equivalence cannot support an unrestricted weighted relative
    guarantee.
