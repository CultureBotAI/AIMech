  rationale: This audit establishes distinct accepted identifiers and complete import
    coverage, not whether those identifiers denote scientifically distinct concepts.
    Before lumping or splitting any pair, compare its scope, primary definitions and
    intended abstraction with evidence and upstream maintainers. Keep existing identifiers
    unchanged pending that discriminating review.
  evidence_ids:
  - pinned-source
  - manifest-and-mapping
limitations:
- Literature support, mechanisms, performance, bias claims and scientific class boundaries
  were not reassessed. Every generated record remains NOT_REVIEWED.
- All 442 targets were reviewed for the stated deterministic identity/provenance/coverage
  questions only. A passing result does not certify the ontology definitions or hierarchy.
- Unaccepted upstream requests, new literature concepts and model/software instances
  are outside this resolved-ID cohort. No claim of global AI-concept exhaustion is
  made.
- The saved review is a self-review; the agent also prepared the separate candidate
  proposals.
- The pre-save structured-review check reported no prior saved reviews. It verified
  bundle integrity rules, not pre-existing scientific coverage.
