- assessment_id: populationbasedaugmentation
  area: evidence
  topic: Identity, definition, mechanism, source conventions and mappings
  outcome: supported
  target_ids:
  - AIMech:PopulationBasedAugmentation
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - populationbasedaugmentation-source-0
  - populationbasedaugmentation-source-1
  - populationbasedaugmentation-source-2
  summary: PBA learns a time-dependent augmentation schedule using population-based
    training; it is not identical to general PBT, fixed-policy AutoAugment, fixed-model
    Fast AutoAugment scoring, or a population ensemble used at inference. The transferred
    artifact is the schedule, not the child model checkpoint. No normalized identity
    match was found across all 442 pinned AIO labels/scoped synonyms and 247 preceding
    native IDs/names/aliases. Full-checkout fixed-string searches included ignored
    and hidden files in both worktree and main checkout, returning 6 lines in the
    worktree and 6 in main. These were prior candidate leads, not concept records.
    Twelve exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring
    native mechanisms were inspected. Absence is bounded to this snapshot and semantic
    neighborhood.
  details: 'Train a population of randomly initialized child classifiers and periodically
    compare their validation performance. In the published truncation-selection configuration,
    a bottom-quartile member copies the weights and augmentation hyperparameters of
    a top-quartile member, then perturbs those hyperparameters and continues training
    without reinitializing the copied weights. Each policy has two entries for each
    of 15 operation types, excluding SamplePairing, with one magnitude and one application
    probability per entry: 60 scalar hyperparameters. The probability grid is 0 to
    1 in tenths and magnitude indices are 0 through 9. To augment an image, shuffle
    the 30 entries, draw an operation-count cap of 0,1 or 2 with probabilities 0.2,0.3
    or 0.5, then scan entries and probabilistically apply each until that many operations
    have actually been applied or the list is exhausted. Each hyperparameter is reset
    uniformly with probability 0.2; otherwise its integer grid index is shifted up
    or down by a uniformly sampled amount in {0,1,2,3} and clipped to its domain.
    The source uses an epoch per step, an exploit/explore interval of three epochs
    and initially zero probabilities/magnitudes. Retain the selected schedule along
    the winning training lineage and discard the child weights when training the final
    model; schedules can be stretched to a different training duration. These numerical
    settings are the published configuration, not universal PBT requirements. The
    pinned exploration code stores probability indices as integers0..10 and magnitude
    indices as integers0..9, applies reset or signed local perturbations and clips
    to the matching bounds. The augmentation function decrements its sampled cap only
    after an operation passes its probability test, stopping at zero or the end of
    the shuffled list. Repeated operation types are possible because the policy contains
    two entries per type; applying the same type twice does not require sampling with
    replacement from a one-entry-per-type list. Limits: The count distribution sets
    a maximum number of successful applications, not a guarantee of exactly that many
    operations. At zero probabilities no operation is applied even when the cap is
    positive; this is distinct from sampling exactly two operations. Each probability
    perturbation operates on an integer tenths-grid index, not by adding an unscaled
    integer to a probability in[0,1]. Some operations ignore magnitude. The retained
    schedule can change non-monotonically; a hypothesis that augmentation should strengthen
    through training is not a monotonicity constraint. Validation-guided population
    selection and schedule transfer can depend on population size, search data, model,
    duration and transformation choices. No guaranteed schedule quality, universal
    transfer, cost ratio or benchmark advantage is asserted. The source PDF and arXiv
    author list place Xi Chen last; the PMLR landing metadata orders the authors differently.
    Bibliographic order here follows the inspected primary PDF.'
