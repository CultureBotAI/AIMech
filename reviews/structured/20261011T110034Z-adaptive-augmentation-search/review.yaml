assessments:
- assessment_id: fastautoaugment
  area: evidence
  topic: Identity, definition, mechanism, source conventions and mappings
  outcome: supported
  target_ids:
  - AIMech:FastAutoAugment
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - finite-conventions
  - fastautoaugment-source-0
  - fastautoaugment-source-1
  - fastautoaugment-source-2
  - fastautoaugment-source-3
  - fastautoaugment-source-4
  summary: Fast AutoAugment is a policy-search algorithm, distinct from AutoAugment’s
    controller rewards after child-model training, PBA’s evolving schedules, CTAugment’s
    online parameter feedback and the separately named Faster AutoAugment. It is not
    a single transform, density estimator or trained checkpoint. Paper and pinned
    implementation conventions are represented separately. No normalized identity
    match was found across all 442 pinned AIO labels/scoped synonyms and 247 preceding
    native IDs/names/aliases. Full-checkout fixed-string searches included ignored
    and hidden files in both worktree and main checkout, returning 6 lines in the
    worktree and 6 in main. These were prior candidate leads, not concept records.
    Twelve exact AIO CLASS nodes with synonyms and outgoing edges and six neighboring
    native mechanisms were inspected. Absence is bounded to this snapshot and semantic
    neighborhood.
  details: 'Form repeated stratified train/exploration splits. Train a classifier
    on each model-training split, then hold its weights fixed while exploring augmentation
    policies on that split’s held-out labeled examples. A subpolicy composes image
    operations with individual application probabilities and magnitudes; the published
    search uses continuous probability and normalized magnitude values in [0,1]. Use
    Bayesian hyperparameter optimization, implemented with a tree-structured Parzen
    estimator, to propose policies according to their predictive scores. The paper
    frames the goal as maximizing augmented-split accuracy and states that its practical
    objective minimizes categorical cross-entropy. Select top policies from each search
    stage and split, merge their subpolicies, and train the final classifier on the
    full training data with the selected augmentation. The published configuration
    uses two operations per subpolicy and five subpolicies per candidate policy, but
    these are protocol choices. The method uses classifier predictions as a proxy
    for matching distributions; it does not directly compute a distributional divergence.
    Its essential efficiency distinction is reuse of fixed model weights during candidate
    scoring, while initial and final classifier training are still required. The pinned
    search.py evaluates a saved model in evaluation mode on multiple stochastic augmented
    views of held-out examples. For non-singleton validation batches, its default
    top1_valid reward is the mean indicator that any view of each example is classified
    correctly. Its logged minus_loss has a different reduction: each unreduced cross-entropy
    array has shape(batch,), concatenation flattens views and examples into one vector,
    and min(axis=0) yields one minimum for the whole batch. The Accumulator sums the
    negatives of those batch-wide scalar minima and divides by the total example count.
    This is neither ordinary mean cross-entropy nor a mean of per-example best-view
    losses. Search and selection use top1_valid by default, not this logged loss.
    data.py samples a subpolicy for each image and keeps baseline training transforms
    for these held-out views. The active augment_list(False) contains 15 operations,
    with SamplePairing commented out, while the paper lists 16. The inspected search
    loop performs one repetition per split rather than the paper’s reported two. These
    are version-specific conventions, not silently combined definitions. Limits: High
    predictive scores on augmented held-out examples do not prove label preservation,
    equality of data distributions, global optimality or improved final generalization.
    Section3.2.1 describes split-model training without augmentation, whereas Section3.3
    specifies default augmentation rules. The pinned data loader retains baseline
    crop/flip transformations; the record does not assert an absence of all augmentation.
    The paper’s Equation4 prints expected min(loss−threshold,0), a nonpositive quantity.
    It should not be silently identified with the usual nonnegative improvement or
    assigned an unstated maximization direction. The method-level record identifies
    TPE search without asserting an author-issued correction. Paper and code differ
    in scoring, active operation count and search repetitions. No claim that the inspected
    code exactly reproduces the paper experiment or that any-view correctness is deployable
    test accuracy is made. Search settings, baseline transforms, proxy/full-data choices
    and policy transfer depend on the task. No speedup, benchmark outcome or author-code
    execution is claimed. The inspected evaluator squeezes correctness arrays before
    taking their length; this code-profile description is scoped to non-singleton
    validation batches and does not assert successful execution for every batch size.
    The logged loss also depends on batch grouping, unlike an ordinary mean of per-example
    losses.'
