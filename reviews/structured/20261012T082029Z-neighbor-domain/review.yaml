  summary: The record limits the source hardness argument instead of treating every
    printed step as established.
  details: The general metric k1 dominating-set reduction suffices for a general hardness
    statement. The arbitrary-k forward step as written needs care when a dominating
    set has fewer than k members, because infinity padding prevents a finite-threshold
    acceptance. A complete three-vertex graph with k2 has a dominating singleton but
    no size-one reference preserving the full accepted decisions. No fixed-k or fixed-dimensional
