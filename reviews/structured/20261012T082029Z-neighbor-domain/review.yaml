  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  - finite-boundaries
  summary: The record does not promote training consistency into lower true risk.
  details: A subset preserves both the original accepted and rejected training decisions.
    Its acceptance region is contained in the full-reference region, but may shrink
    outside the training points. D={0,1},k1,theta1 and S={0} preserve both training
    decisions while rejecting query2 that D accepts. This harms a normal query2 and
    helps an abnormal one. A compression-bound discussion is not a universal empirical
    improvement guarantee.
