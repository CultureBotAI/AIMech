- assessment_id: condensednearestneighbordatadomaindescription-two-scans-and-augmentation
  area: evidence
  topic: two scans and augmentation
  outcome: supported
  target_ids:
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  summary: Supported within the stated assumptions and source-reading scope.
  details: 'Process the observations in order, inserting an observation when the current
    reference subset rejects it. Partition selected references into currently accepted
    and rejected points, and maintain neighbor information for the rejected selected
    points. The second dataset scan considers earlier omitted observations needed
    to determine whether those selected rejections also occur under the full reference
    set. For selected points accepted by the full set but still rejected by the subset,
    augment the subset with stored neighboring observations until their acceptance
    is restored. Objects truly rejected by the full reference rule remain selected
    and rejected. The two scans and the final augmentation are distinct phases. Source
    locators: angiulli2007: Section4, authorp4 / PDFp5; Figure1, authorp3 / PDFp4'
- assessment_id: condensednearestneighbordatadomaindescription-consistency-and-prediction
  area: evidence
  topic: consistency and prediction
  outcome: supported
  target_ids:
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  - finite-boundaries
  summary: Supported within the stated assumptions and source-reading scope.
  details: 'The intended output S preserves NNDD_D(p)=NNDD_S(p) for every p in D at
    the supplied metric, k, theta and r. The full-set rule can already reject supplied
    observations; consistency preserves those rejections rather than treating all
    inputs as accepted labels. At fixed parameters, subset acceptance can only shrink,
    so new-query agreement and improved generalization do not follow from training
    consistency. For D={0,1}, k=1 and theta=1, starting with0 can produce S={0}; query2
    changes from accepted to rejected. A test distribution concentrated on normal
    query2 therefore has worse classification error after this condensation. Source
    locators: angiulli2007: Section3, authorp3 / PDFp4; Section4 Equation1 and subset
    inequality, authorp4 / PDFp5; curator finite example'
- assessment_id: condensednearestneighbordatadomaindescription-order-and-nonminimum-output
  area: evidence
  topic: order and nonminimum output
  outcome: supported
  target_ids:
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  - finite-boundaries
  summary: Supported within the stated assumptions and source-reading scope.
  details: 'The greedy selection can depend on input order and is not guaranteed to
    have minimum cardinality. With D={0,1,2}, k=1 and theta=1, order(0,1,2) selects{0,2},
    while order(1,0,2) selects{1}; both preserve all original decisions but differ
    in size and accept query3 differently. For D={0,2}, k=2 and theta=1, the full
    rule rejects both points. The described procedure retains both, although a singleton
    subset is already consistent because insufficient-reference padding makes it reject
    all queries. These exact cases demonstrate why reference consistency and minimum-size
    optimization are different properties. Source locators: angiulli2007: Section4,
    authorp4 / PDFp5, original-outlier retention; Section5.2, authorp11 / PDFp12,
    explicit greedy/nonminimum qualification; curator checks in research/discovery/neighbor-domain-boundaries.py'
- assessment_id: condensednearestneighbordatadomaindescription-computational-cost-scope
  area: evidence
  topic: computational cost scope
  outcome: supported
  target_ids:
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  summary: Supported within the stated assumptions and source-reading scope.
  details: 'Two passes reduce dataset scanning but do not establish linear computation.
    With n original objects and s retained references, the source bounds distance/heap
    work by O(n*s*(c_d+log k)), where c_d is one distance computation''s cost; s can
    be n. It gives O(s*k) neighbor-storage cost, in addition to storing retained object
    representations and ordinary input access. The retained subset can therefore approach
    the original size, and the pairwise work can be quadratic. Historical timing comparisons
    depend on hardware, implementations and selected operating parameters. Source
    locators: angiulli2007: Section4, authorpp4-5 / PDFpp5-6; Section5.2 and Figure7,
    authorpp11-12 / PDFpp12-13'
- assessment_id: condensednearestneighbordatadomaindescription-evaluation-and-theorem-limits
  area: evidence
  topic: evaluation and theorem limits
  outcome: supported
  target_ids:
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  summary: Supported within the stated assumptions and source-reading scope.
  details: 'The experiments cover synthetic and UCI one-versus-rest settings, generally
    using Euclidean object distances and r=1, with ten-fold cross-validation and parameter
    sweeps for ROC comparisons. Results do not establish universal superiority: the
    satellite damp-grey-soil row in Table1 favors the reported SVM comparison, despite
    the surrounding blanket best-on-all-data wording. Noise robustness is conditional;
    the shuttle contamination experiment samples added training contaminants from
    its abnormal test population. The minimum-subset hardness discussion is for general
    metric inputs and does not certify CNNDD optimality or an unexamined fixed-dimensional
    Euclidean hardness claim. No numerical performance advantage is curated. Source
    locators: angiulli2007: Section3 Theorem1, authorp3 / PDFp4; Section5, authorpp5-13
    / PDFpp6-14; Table1, authorp9 / PDFp10; Section5.3 contamination protocol, authorp13
    / PDFp14'
- assessment_id: rule-versus-reference-selection
  area: consistency
  topic: Prediction and condensation identities
  outcome: supported
  target_ids:
  - AIMech:NearestNeighborDistanceNormDataDescription
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - identity
  - mapping
  - angiulli2007
  summary: Retain NNDD and CNNDD as distinct procedures.
  details: NNDD maps a query to a decision using a supplied reference set, metric,
    neighbor count, threshold and aggregation norm. CNNDD constructs a subset intended
    to preserve those decisions on the original reference observations. It is neither
    a second name for the prediction formula nor the Tax-Duin local spacing ratio.
    Supervised neighbor voting, supervised metric learning, clustering, sphere estimation
    and medoid optimization are distinct contextual mechanisms.
- assessment_id: norm-and-reference-boundaries
  area: consistency
  topic: Self inclusion, missing neighbors and parameter direction
  outcome: supported
  target_ids:
  - AIMech:NearestNeighborDistanceNormDataDescription
  - AIMech:CondensedNearestNeighborDataDomainDescription
  evidence_ids:
  - angiulli2007
  - finite-boundaries
  summary: Definitions preserve self inclusion, infinity padding and fixed-parameter
    monotonicity.
  details: The same reference point is its first neighbor; fewer than k reference
    observations make the score infinite. Norms of a fixed distance vector decrease
    as r grows, whereas appending a neighbor cannot decrease the norm. Source proportional-error
    language is retained only as monotonicity, and tuned norm comparisons are not
    interpreted as fixed-threshold inequalities. The exact vector(3/5,4/5) rejects
    at r1 but accepts at r2 and infinity under threshold1. k1 accepts all self-included
    training points; k2 need not.
