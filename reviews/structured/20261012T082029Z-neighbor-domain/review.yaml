  rationale: NNDD defines prediction from a reference set, while CNNDD selects a subset
    preserving its original-reference decisions. Different outputs and procedural
    roles justify distinct algorithm identities. Keep local ratios, supervised voting,
    medoid selection and later prototype-offset rules separate; reference-data agreement
    does not establish global identity.
limitations:
- Adversarial author self-review only; both native records remain DRAFT.
- All15 pages of the2007 author PDF were visually read. Its cover is followed by author
  pages1-14, not the journal pagination. Only PDFpp3-4 of the later15-page PDD manuscript
  were visually read; its remaining method and evaluation sections are pending.
- NNDD predicts using a distance-vector norm; CNNDD selects a reference-consistent
  subset. Reference consistency preserves full-set rejections and does not certify
  new-query agreement, minimum cardinality or universally better risk. Two scans do
  not establish linear runtime.
- Source shorthand concerning neighbor ranks, proportional error, fixed-threshold
  norm comparisons and the arbitrary-k hardness reduction is explicitly qualified.
  Table1 contains a counterexample to the surrounding blanket superiority wording.
  No numerical performance advantage is curated.
- The original2005 proceedings method was not compared in full. The later author cover
  cites a2011 DOI version while the catalogue lists the2012 final issue; the exact
  inspected URL/hash and limited reading scope are retained.
- The prior round's dev-host PDF timeout was resolved through the author catalogue's
  public siloe host. Direct PubMed opening was uninformative and later web screenshots
  timed out; public-author downloads and local rendering were successful. These are
  access limits, not evidence of source absence.
- No full PDF is redistributed. Exact finite examples and the k=1 greedy specialization
  were checked, without fitting statistical models, running historical implementations
  or reproducing benchmarks.
- The two additions bring native DRAFT records to508; all442 generated AIO records
  remain unchanged. Four new pending source cohorts and the complete accounted frontier
  leave435 pending cohorts. Discovery has not saturated.
