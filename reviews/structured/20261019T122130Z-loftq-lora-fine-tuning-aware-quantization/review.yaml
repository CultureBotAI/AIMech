  summary: LoRA-Fine-Tuning-Aware Quantization (LoftQ) is a distinct concept.
  details: Distinct from QLoRA (Dettmers et al., 2023; AIMech:QloraQuantizedLowRankAdaptation),
    which quantizes W once without regard to LoRA (Q = q_N(W)) and initializes A B^T
    = 0 with Gaussian A and zero B, causing severe starting-point discrepancy ||W
    - Q||_F in the 2-bit to 4-bit regime. Also distinct from PiSSA (Meng et al., 2024;
    AIMech:PissaPrincipalSingularValuesAndSingularVectorsAdaptation), which performs
    SVD directly on the full-precision weight W rather than alternating quantization
    and SVD on the quantization residual W - Q_t.
