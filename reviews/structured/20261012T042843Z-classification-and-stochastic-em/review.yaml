  summary: Do not inherit ordinary EM ascent from hard completion.
  details: In a normalized mixture with known Bernoulli component probabilities 4/5
    and 1/5, observations (1,1,0), and initial weight 7/9, posterior-mode labels are
    (0,0,1). The completed fit changes the weight to 2/3. Completed likelihood rises
    from 6272/91125 to 256/3375 while marginal likelihood falls from 4/27 to 18/125.
    That same completion has SEM probability 1568/3375. The entropy identity is verified
    for actual posterior responsibilities, not arbitrary sampled hard labels. These
    finite counterexamples qualify the report prose following Eq 4.4.
