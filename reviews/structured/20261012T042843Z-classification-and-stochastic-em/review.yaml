  summary: Restrict equivalence and convergence claims to their conditions.
  details: Fixed equal weights and common spherical covariance recover the k-means
    variance criterion. Estimated weights or unequal covariances change it. With zero-mean
    Gaussian components of standard deviations 3 and 0.5 and equal weights, outer
    observations at +/-3 select the broad component and inner observations at +/-0.1
    select the narrow one, so assignment convex hulls overlap. The classification
    objective is affine in the continuous label matrix; the local-rate proposition
    and its external coordinate theorem are not generically certified. Finite profiled
    objectives, admissible M-steps and consistent tie/maximizer choices matter.
