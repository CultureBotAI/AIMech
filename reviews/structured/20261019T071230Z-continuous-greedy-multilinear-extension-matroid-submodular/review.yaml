  summary: Continuous Greedy and Multilinear Extension for Matroid-Constrained Monotone
    Submodular Maximization is a distinct concept.
  details: Distinct from Stochastic-Greedy Linear-Time Monotone Submodular Maximization
    (`AIMech:StochasticGreedyLinearTimeMonotoneSubmodularMaximization`), which accelerates
    discrete greedy under a simple cardinality constraint |S| <= k via random candidate
    subset sampling of size (n/k) log(1/epsilon) and still suffers a 1/2 approximation
    barrier on general matroids, and from Away-Step and Pairwise Frank-Wolfe Linear
    Convergence on Polytopes (`AIMech:AwayStepAndPairwiseFrankWolfeLinearConvergenceOnPolytopes`),
    which minimizes strongly convex smooth objectives over polytopes rather than maximizing
    the non-concave multilinear extension F(y) of a monotone submodular set function
    via upward-monotone direction dominance and pipage rounding.
