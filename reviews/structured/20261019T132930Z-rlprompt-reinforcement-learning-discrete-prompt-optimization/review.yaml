  summary: RLPrompt Reinforcement Learning Discrete Prompt Optimization is a distinct
    concept.
  details: Distinct from AutoPrompt (Shin et al., EMNLP 2020, AIMech:AutoPromptGradientGuidedDiscretePromptSearch),
    which requires white-box gradients from the target LM, from Black-Box Tuning (Sun
    et al., ICML 2022, AIMech:BBTBlackBoxTuningForLanguageModelAsAService), which
    optimizes continuous soft prompt embeddings via CMA-ES in a random linear subspace
    and requires server-side continuous embedding injection, and from heuristic discrete
    prompt enumeration/editing methods such as GrIPS (Prasad et al., 2022).
