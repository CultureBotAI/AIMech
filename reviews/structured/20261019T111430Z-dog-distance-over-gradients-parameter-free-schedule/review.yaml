  summary: DoG (Distance over Gradients Parameter-Free Step Size Schedule) is a distinct
    concept.
  details: Distinct from LARS, LAMB, and Fromage in that DoG scales the step size
    by the maximum distance from the initial point max_{i<=t} ||x_i - x_0|| rather
    than the current parameter norm ||x_t|| and requires no multiplicative learning-rate
    hyperparameter (c = 1). Distinct from D-Adaptation and Prodigy in that DoG directly
    plugs the empirical displacement r_bar_t into the SGD step-size numerator instead
    of a dual regret lower bound d_hat_t.
