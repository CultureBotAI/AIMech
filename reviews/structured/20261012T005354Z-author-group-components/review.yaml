  rationale: Document-level persona sharing, event-specific agreement rates and heterogeneous
    harmonium couplings define distinct model families. Broad Model and related topic/RBM
    mappings preserve AIO abstraction without forcing exact matches.
limitations:
- Adversarial author self-review only; all three records remain DRAFT.
- All 28 pages of three author-hosted primary PDFs were visually read, including equations,
  figures, tables and bibliographies. APT locators give printed and PDF pages; GT
  and GCA use PDF pages. No author-code execution is asserted.
- APT and GCA are the inspected KDD2007 versions. GT is the NIPS2005 paper despite
  its author filename/index year. Alternative draft/chapter versions and PDF copies
  are not certified equivalent.
- APT shares one persona across a document. GT uses event-specific agreement rates
  and models a derived pairwise relation network. GCA log-hidden coordinates have
  a Gaussian law conditional on all visible observations, with count-based sufficient
  statistics and residual rotation ambiguity.
- Printed equation qualifications, missing-modality uncertainty, approximate CD, heuristic
  counts, selected empirical splits and incomplete scoring protocols remain explicit.
  No uninspected implementation defect or data leakage is alleged.
- Twelve new provisional cohorts leave 308 pending leads plus other unresolved dispositions.
  The author-index extension cohort remains partially addressed. All three additions
  remain DRAFT.
