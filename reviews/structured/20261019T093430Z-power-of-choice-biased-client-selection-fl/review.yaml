  summary: 'Power-of-Choice (Biased Loss-Based Client Selection Strategies for Federated
    Learning: pow-d, cpow-d, and rpow-d) is a distinct concept.'
  details: Distinct from unbiased partial-participation FedAvg (McMahan et al. 2017;
    Li et al. 2020), which corresponds to the d = m special case (rho_bar = rho_tilde
    = 1, zero selection bias but no O(1/rho_bar) convergence acceleration); and distinct
    from q-Fair Federated Learning (AIMech:QFairFederatedLearningAlphaFairResourceAllocation,
    Li et al. 2020), which reweights the global objective to sum_k (p_k/(q+1)) F_k(w)^{q+1}
    under unbiased client sampling rather than altering the client selection policy
    via power-of-d highest-loss candidate filtering.
