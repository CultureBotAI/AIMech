  summary: Scaling & Shifting Your Features is a distinct concept.
  details: 'Distinct from Batch Normalization (AIO:BatchNormalizationLayer), Layer
    Normalization, FiLM, and AdaIN: SSF-ADA modulates outputs of general backbone
    operations (MSA, MLP, and normalization layers) rather than only normalization
    layers, and uses task-level input-independent parameters (gamma, beta) so they
    can be folded into preceding linear weights at inference time without conditional
    generator networks or nonlinear activations. Distinct from BitFit (AIMech:BitFit),
    which only tunes existing bias terms without multiplicative channel scaling or
    post-operation residual shifts, and from Adapter / VPT methods that retain unmergeable
    modules or extra tokens at inference time.'
