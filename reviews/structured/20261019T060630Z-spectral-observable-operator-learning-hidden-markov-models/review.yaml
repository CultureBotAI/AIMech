  details: 'Resolved against all 442 pinned AIO concepts and 701 maintained AIMech
    concepts. Distinct from `AIO:MarkovChain`, `AIO:PrincipalComponentAnalysis`, and
    `AIMech:OrthogonalTensorDecompositionAndRobustTensorPowerMethodForLatentVariableModels`:
    whereas tensor decomposition recovers individual columns of $O$ and $T$ via third-order
    tensor power iterations, Hsu-Kakade-Zhang''s LEARN-HMM directly estimates the
    similarity-transformed observable operators $B_x = (U^\top P_{3,x,1})(U^\top P_{2,1})^\dagger$
    via SVD and matrix pseudoinverse without recovering $O$ or $T$ explicitly (Theorem
    6).'
