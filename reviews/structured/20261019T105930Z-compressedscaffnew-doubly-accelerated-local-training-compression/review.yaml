  summary: CompressedScaffnew is a distinct concept.
  details: Distinct from uncommitted or uncompressed Scaffnew/ProxSkip (which requires
    full d-dimensional vector communication at every triggered sync round) and from
    independent random sparsifiers (which break Scaffnew's zero-sum control-variate
    invariant sum_{i=1}^n h_i^t = 0). CompressedScaffnew couples local training with
    a shared s-active-per-row permutation mask so that the control-variate updates
    sum to zero coordinatewise while compressing uplink communication by factor s/n.
