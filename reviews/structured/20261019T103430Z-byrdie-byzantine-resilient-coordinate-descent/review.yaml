  summary: ByRDiE Byzantine-Resilient Distributed Coordinate Descent for Decentralized
    Learning is a distinct concept.
  details: Introduced by Zhixiong Yang and Waheed U. Bajwa (IEEE Transactions on Signal
    and Information Processing over Networks, Vol. 5, No. 4, pp. 611-627, 2019; arXiv:1708.08155).
    Distinct from BRIDGE (Fang, Yang, & Bajwa, IEEE TSIPN 2022, Round 546), which
    performs simultaneous full-vector gradient descent with coordinate-wise trimmed
    mean in a single loop rather than sequential coordinate-by-coordinate T-step inner
    updates; and distinct from ClippedGossip (He, Karimireddy, & Jaggi, 2022, Round
    545), which clips neighbor model differences in L2 norm around a node's own iterate.
