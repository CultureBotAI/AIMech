  summary: Prototypical Calibration for Few-Shot Language Models is a distinct concept.
  details: Distinct from Contextual Calibration (AIMech:CalibrateBeforeUseContextualCalibration)
    and Domain-Conditional PMI (AIMech:PMIDCDomainConditionalPointwiseMutualInformation),
    which apply diagonal scaling or subtract a single content-free/domain-premise
    baseline probability rather than estimating full class-conditional Gaussian covariances
    and means over the output distribution of an unlabeled estimate set. Also distinct
    from Prototypical Networks in metric meta-learning, which compute Euclidean distances
    to labeled support-set averages in a learned encoder representation space rather
    than fitting an unsupervised GMM with bipartite matching over frozen language-model
    log-probability outputs.
