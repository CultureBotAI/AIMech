  summary: FedRolex (Model-Heterogeneous Federated Learning with Rolling Sub-Model
    Extraction) is a distinct concept.
  details: Distinct from HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning,
    Diao et al. 2021) and FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning,
    Horvath et al. 2021), which use static prefix sub-model extraction S_{n,i}^{(j)}
    = {0, 1, ..., floor(beta_n K_i) - 1} independent of round j (Equation 6) so that
    the global server model cannot exceed the largest client model and higher-index
    parameters are never trained on low-capacity clients' data; and distinct from
    Federated Dropout (Caldas et al. 2018), which extracts random node subsets each
    round (Equation 5) and requires O(I log I + I(m-1) log log I) expected rounds
    rather than m I rounds to update all I sub-models at least m times.
