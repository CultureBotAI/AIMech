- assessment_id: corevectorregression-mapping
  area: grounding
  topic: Related algorithm-to-model AIO mapping
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - mapping
  - tsang2006
  summary: Related matching is supported without equivalence or subclassing.
  details: This training algorithm has a direct relationship to support-vector formulations.
    AIO:SupportVectorMachine is a related model/network target whose definition covers
    supervised classification and regression, with Network ancestry and layer relations.
    It is not equivalent to this solver or an is-a assertion about the algorithm.
    RegressionAnalysis, Classification, BinaryClassification, SupervisedLearning and
    UnsupervisedLearning describe task scope; they do not identify the optimization
    procedure. LinearRegression, Least-squares Analysis and RidgeRegression do not
    encode the source-specific paired-slack CVR objective. KernelLayer is a component
    and TrainingStrategy is defined as preprocessing. Original CVM requires a constant-diagonal
    reduction, BVM uses different center updates, SVDD estimates a sphere and SVC
    adds cluster labeling; shared kernels, spheres or output tasks do not establish
    identity.
- assessment_id: corevectorregression-paired-squared-slack-regression
  area: evidence
  topic: paired squared slack regression
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'For m observations and C,mu>0, the displayed formulation minimizes ||w||²+b²+C/(mu*m)*sum_i(xi_i²+xi_i_star²)+2*C*epsilon_bar,
    subject to y_i-f_i<=epsilon_bar+xi_i and f_i-y_i<=epsilon_bar+xi_i_star, where
    f_i=w^T*phi(x_i)+b. The bias is penalized and the paired slack errors are squared.
    The source displays no nonnegativity constraint on the learned epsilon_bar. This
    formulation is distinct from L1-slack SVR and from a learned-width formulation
    explicitly requiring epsilon_bar>=0. Locators: Section III-A, printed p1129 /
    PDF p4, Equations9-15; Sections3.1-3.3, PDF pp3-5, Equations6-15 and Property3'
- assessment_id: corevectorregression-two-copy-simplex-dual-and-recovery
  area: evidence
  topic: two copy simplex dual and recovery
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'Let alpha=(lambda,lambda_star)>=0 sum to1 and v=(y,-y). The scaled dual
    maximizes (2/C)*v^T*alpha-alpha^T*Ktilde*alpha, where Ktilde has diagonal blocks
    K+11^T+(mu*m/C)*I and off-diagonal blocks -(K+11^T). Thus m original observations
    yield2m transformed points. Recover w=C*sum_i(lambda_i-lambda_i_star)*phi(x_i),
    b=C*sum_i(lambda_i-lambda_i_star), xi_i=mu*m*lambda_i, xi_i_star=mu*m*lambda_i_star
    and epsilon_bar=v^T*alpha-C*alpha^T*Ktilde*alpha. The original primal optimum
    equals C² times this unshifted scaled-dual optimum. Locators: Section III-A, printed
    p1129 / PDF p4, Equations9-15; Section III-B, printed p1130 / PDF p5; Appendix
    Property3 proof, printed p1139 / PDF p14; Sections3.1-3.3, PDF pp3-5, Equations6-15
    and Property3'
- assessment_id: corevectorregression-core-vector-regression-training
  area: evidence
  topic: core vector regression training
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'Choose Delta=(2/C)*v-diag(Ktilde)+eta*1>=0 and apply center-constrained
    MEB core growth to the2m transformed points. Add an outside point, solve the enlarged
    core problem and recover the regression coefficients from its simplex weights.
    This is the regression-specific application of the generalized CVM solver. A selected
    transformed point, an original observation and a nonzero final regression coefficient
    are different notions; the two copies of an observation can contribute with opposite
    signs. Locators: Sections III-A and III-B, printed pp1129-1130 / PDF pp4-5, Equations11-22;
    Sections3.1-3.3, PDF pp3-5, Equations6-15 and Property3'
- assessment_id: corevectorregression-learned-width-and-loss-interpretation
  area: evidence
  topic: learned width and loss interpretation
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'The missing nonnegative-width constraint is material to interpreting the
    displayed formulation. An exact curator calculation with one zero-feature observation
    y=0, C=mu=1 gives optimal lambda=lambda_star=1/2, w=b=0, xi=xi_star=1/2 and epsilon_bar=-1/2,
    with primal and scaled-dual value-1/2. The mean paired-slack sum equals mu=1,
    whereas max(|y-f|-epsilon_bar,0)=1/2. Thus the paper’s interpretation of mu as
    the ordinary epsilon-insensitive error needs a nonnegative-width qualification;
    it is not asserted unconditionally here. This result follows from the displayed
    primal/dual, not from executing historical CVR code. Locators: Section III-A,
    printed p1129 / PDF p4, Equations9-15; Section3.1, PDF p3; exact curator derivation
    in research/discovery/generalized-core-vector-boundaries.py'
- assessment_id: corevectorregression-shifted-scaled-objective-guarantee
  area: evidence
  topic: shifted scaled objective guarantee
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'With exact core optimization and exhaustive all-point termination, a core
    radius R gives R²<=p_star/C²+eta<=(1+epsilon)²*R² for the original primal optimum
    p_star. This is a bound on the shifted and scaled objective, not a multiplicative
    bound on p_star alone; p_star can be negative, as the exact zero-output example
    shows. Tolerance is not a test-error bound. Finite inner numerical tolerance,
    sampled searches, kernel costs and total input storage require separate treatment.
    Locators: Section III-C Property3, printed p1131 / PDF p6; Appendix proof, printed
    p1139 / PDF p14; Section3.3.1, PDF p5, Property3 and its proof'
- assessment_id: corevectorregression-version-and-application-boundaries
  area: evidence
  topic: version and application boundaries
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2006
  - tsang2005
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'The 2005 ICML CVR paper is an abridged precursor to the 2006 generalized-CVM
    paper, not a separate CVR identity. The earlier paper applies regression fits
    to implicit surface reconstruction using nonzero level sets and multiscale residual
    fitting. Historical regression comparisons use specified datasets, hyperparameter
    choices, hardware, LIBSVM/SVMlight versions and different loss formulations; the
    2006 paper notes a change in LIBSVM version. These experiments do not establish
    universal speed, sparsity or prediction superiority. No historical software or
    benchmark was reproduced. Locators: Section I ending, printed p1127 / PDF p2;
    Section V, printed pp1132-1137 / PDF pp7-12, including footnote7 on p1132; Sections4.1-4.2
    and5, PDF pp5-8'
