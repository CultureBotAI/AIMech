- action: retain
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2005
  - tsang2006
  - identity
  rationale: The general constrained-ball solver and the specific paired squared-slack
    regression objective/recovery have distinct scopes. Their shared implementation
    does not make them equivalent. The2005 and2006 CVR sources remain one regression
    identity.
limitations:
- Adversarial author self-review only; both records remain DRAFT.
- All23 primary PDF pages were visually inspected, including mathematical displays,
  plots, tables, appendices and references. The2005 proceedings PDF has no visible
  page labels; citations use PDF pages. The2006 article uses printed/PDF locators.
- Historical implementation access failed. No optimizer, model training, paid provider,
  dataset upload or benchmark was run. Exact rational algebra is not reproduced software
  behavior.
- The learned negative-width example is a curator derivation from the displayed CVR
  formulation. It limits the unconditional mean-loss interpretation; it does not claim
  how inaccessible historical code behaves.
- Multiplicative guarantees apply shifted/scaled objectives, under exact core solves
  and exhaustive checking. Auxiliary storage excludes input data; abstract efficiency
  and historical performance claims are not generalized.
- Rigid-core, total-soft-margin and multiview extensions are abstract-level leads
  with uninspected full methods. The equal-mean CVR lead is provisional secondary
  metadata after primary-opening failure. Bibliographies do not certify all referenced
  algorithms.
- The collection reaches517 maintained DRAFT concepts;442 generated AIO records are
  unchanged. There are443 pending cohorts plus other unresolved dispositions, so discovery
  continues.
