- assessment_id: generalizedcorevectormachine-center-constrained-simplex-reduction
  area: evidence
  topic: center constrained simplex reduction
  outcome: supported
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'For a finite positive-semidefinite Gram matrix K and objective max b^T*alpha-alpha^T*K*alpha
    over alpha>=0 with sum(alpha)=1, choose eta so Delta=b-diag(K)+eta*1 is nonnegative.
    Augment each feature by sqrt(Delta_i) and constrain the added center coordinate
    to zero. The minimum-enclosing-ball dual becomes max alpha^T*(diag(K)+Delta)-alpha^T*K*alpha,
    which is the original objective plus eta. This removes the constant-diagonal restriction
    and permits a linear objective term; it does not solve arbitrary quadratic programs
    with different feasible constraints or indefinite kernels. Locators: Sections
    III-B and III-C, printed pp1129-1131 / PDF pp4-6, Equations16-22; Algorithm1 on
    printed p1129 / PDF p4'
- assessment_id: generalizedcorevectormachine-constrained-core-growth-and-distance
  area: evidence
  topic: constrained core growth and distance
  outcome: supported
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'Maintain a core subset and its exact center-constrained minimum enclosing
    ball. Check whether every transformed point lies within the current radius multiplied
    by 1+epsilon; otherwise add a farthest outside point and recompute the constrained
    core ball. The center is c=sum_i alpha_i*phi_i in the unaugmented feature coordinates,
    and squared distance to augmented point j is alpha^T*K*alpha-2*(K*alpha)_j+K_jj+Delta_j.
    Kernel evaluation avoids explicit feature coordinates. The procedure differs from
    BVM fixed-radius center movement and extends the original CVM reduction. Locators:
    Sections III-B and III-C, printed pp1129-1131 / PDF pp4-6, Equations16-22; Algorithm1
    on printed p1129 / PDF p4'
- assessment_id: generalizedcorevectormachine-shift-dependent-approximation
  area: evidence
  topic: shift dependent approximation
  outcome: supported
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'Under exact core optimization and exhaustive outside-point checks, the
    final core radius R satisfies R<=R_star<=(1+epsilon)*R. Therefore the multiplicative
    objective certificate concerns the objective after addition of eta. Changing eta
    preserves the exact maximizing alpha but can alter when an approximate run stops.
    As an exact curator illustration, use base points0 and2, b=diag(K), eta=10000
    and epsilon=1/1000. The one-point core at0 has radius squared10000 and the other
    squared distance10004, below the expanded squared radius10020.01; it can pass
    enclosure although its unshifted objective is0 and the exact optimum is1 at center1.
    With eta0 the same core fails. This is a stopping-test example, not a claim about
    the historical implementation or predictive error. Locators: Sections III-B and
    III-C, printed pp1129-1131 / PDF pp4-6, Equations16-22; Algorithm1 on printed
    p1129 / PDF p4; Section III-C Property3, printed p1131 / PDF p6; Appendix proof,
    printed p1139 / PDF p14; exact curator derivation in research/discovery/generalized-core-vector-boundaries.py'
- assessment_id: generalizedcorevectormachine-core-size-and-implementation-limits
  area: evidence
  topic: core size and implementation limits
  outcome: supported
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'For positive approximation tolerance in the stated small-tolerance regime,
    the exact farthest-point/core-optimization analysis gives O(1/epsilon) core size
    and updates, with linear dependence on dataset size at fixed epsilon under the
    paper’s kernel-cost and inner-QP model. Dense-core auxiliary space is O(1/epsilon²),
    excluding input storage. Selecting eta and finding or certifying violations still
    require data access. The experiments instead use numerical SMO, caches, all data
    in memory and59-point probabilistic searches. Sampled termination is not an exhaustive
    enclosure certificate, and the paper’s bounds do not imply size-independent total
    memory, dimension-independent kernel cost or universal practical speed. Locators:
    Section III-C, printed p1131 / PDF p6; Section V introduction, printed p1132 /
    PDF p7; Appendix, printed p1138 / PDF p13'
- assessment_id: generalizedcorevectormachine-formulation-and-empirical-scope
  area: evidence
  topic: formulation and empirical scope
  outcome: supported
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  - finite-boundaries
  summary: Supported within the displayed formulation and stated assumptions.
  details: 'The source derives generalized reductions for its paired squared-slack
    regression formulation, binary L2 SVM with observation-specific penalties, and
    a pair-difference ranking formulation with squared slack and a learned margin.
    These are specific reformulations, not every SVR or ranking-SVM variant. The reported
    experiments concern regression and imbalanced face classification; ranking experiments
    are explicitly future work. Shared optimization machinery does not imply universal
    accuracy, generalization, fairness or performance superiority. Locators: Sections
    III-A, IV and V-VI, printed pp1129-1137 / PDF pp4-12; ranking future-work statement
    on printed p1137 / PDF p12'
