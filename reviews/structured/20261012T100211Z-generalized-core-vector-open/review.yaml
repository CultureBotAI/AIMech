  details: A support-vector regression training algorithm that approximates a penalized-bias,
    paired squared-slack formulation with a learned unconstrained margin using a center-constrained
    minimum enclosing ball over two transformed points per observation. This record
    denotes the CVR formulation and training method introduced by Tsang-Kwok-Lai2005
    and developed by Tsang-Kwok-Zurada2006. It is distinct from the general solver,
    generic SVR, standard nonnegative-width variants, least-squares regression and
