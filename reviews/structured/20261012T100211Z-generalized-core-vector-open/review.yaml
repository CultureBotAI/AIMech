- assessment_id: matrix-and-objective-sign
  area: consistency
  topic: PSD matrix versus concave maximization
  outcome: concern
  target_ids:
  - AIMech:GeneralizedCoreVectorMachine
  evidence_ids:
  - tsang2006
  summary: Clarify the definition’s matrix condition.
  details: For K positive semidefinite, the maximized objective b^T*alpha-alpha^T*K*alpha
    has negative-semidefinite Hessian-2K. The record’s detailed formula and reduction
    are correct. The definition should attribute positive semidefiniteness to K, not
    to the maximized quadratic objective.
- assessment_id: adversarial-width-scaling
  area: consistency
  topic: Negative width, paired loss and C-squared scaling
  outcome: supported
  target_ids:
  - AIMech:CoreVectorRegression
  evidence_ids:
  - tsang2005
  - tsang2006
  - finite-boundaries
  summary: The record makes the source-specific learned-width limitation explicit.
  details: The displayed primal imposes no nonnegative epsilon_bar. The exact one-point
    zero-output case gives epsilon_bar=-1/2 with both paired slacks1/2; their mean
    sum1 differs from conventional width-loss1/2. At C2 the primal is-1 and unscaled
    dual-1/4, confirming C². These are mathematical deductions, not inaccessible code
    behavior. A nonnegative-width convention would change the feasible formulation
    and cannot be silently assumed.
