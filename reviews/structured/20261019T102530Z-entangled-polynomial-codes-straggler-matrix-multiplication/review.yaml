  summary: Entangled Polynomial Codes for Straggler-Resilient Distributed Matrix Multiplication
    is a distinct concept.
  details: 'Distinct from Polynomial Codes (AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication,
    which restrict p = 1 and partition input matrices only along their outer dimensions)
    and from MatDot and PolyDot Codes (AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication,
    where PolyDot achieves recovery threshold m^2 (2p - 1) for m = n because unaligned
    inner-dimension cross-terms double the polynomial degree in p): Entangled Polynomial
    Codes (Yu, Maddah-Ali, & Avestimehr, ISIT 2018 / IEEE TIT 2020) assign exponent
    strides (alpha, beta, theta) = (1, p, p m) with reversed inner-dimension powers
    x_i^j and x_i^{p-1-j''} to align all p summands of each C_{k,k''} onto x_i^{p-1
    + k p + k'' p m}, reducing the recovery threshold by a factor of 2 to p m n +
    p - 1 and further to 2 R(p, m, n) - 1 via bilinear-complexity tensor decompositions.'
