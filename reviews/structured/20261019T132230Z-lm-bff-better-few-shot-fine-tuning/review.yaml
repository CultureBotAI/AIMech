  summary: LM-BFF Better Few-Shot Fine-Tuning of Language Models is a distinct concept.
  details: Distinct from Pattern-Exploiting Training (PET, Schick & Schütze, EACL
    2021, AIMech:PatternExploitingTraining), which uses manually crafted patterns
    and unlabeled data distillation, from AutoPrompt (Shin et al., EMNLP 2020, AIMech:AutoPromptGradientGuidedDiscretePromptSearch),
    which performs gradient-guided discrete trigger token search on frozen MLMs requiring
    large training sets, and from frozen GPT-3 In-Context Learning (AIMech:InContextLearning),
    which concatenates up to 32 random examples without parameter updates or class-balanced
    similarity filtering.
