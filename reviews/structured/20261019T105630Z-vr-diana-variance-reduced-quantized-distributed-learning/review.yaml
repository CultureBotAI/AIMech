  summary: VR-DIANA and SVRG-DIANA (Variance-Reduced Distributed Learning with Gradient
    Quantization) is a distinct concept.
  details: Distinct from baseline DIANA (Mishchenko et al., 2019; Round 389), which
    does not incorporate local finite-sum variance reduction and only converges to
    an O(sigma^2 / (mu^2 * n)) neighborhood under stochastic gradients. Also distinct
    from ADIANA (Li et al., 2020; Round 390), which accelerates full-batch or L-SVRG
    DIANA via Nesterov momentum, and from QSVRG (Alistarh et al., 2017; Round 378),
    which requires broadcasting exact uncompressed full gradients at the start of
    every epoch.
