  summary: 'SMITH: Siamese Multi-depth Transformer-based Hierarchical Encoder for
    Long-Form Document Matching is a distinct concept.'
  details: Distinct from cross-encoder passage aggregation rankers such as PARADE
    (AIMech:PARADEPassageRepresentationAggregationForDocumentReranking, which jointly
    encodes query-passage pairs) and from RNN-based hierarchical document matchers
    such as HAN and SMASH RNN. SMITH is a representation-focused Siamese dual encoder
    supporting offline vector indexing up to 2,048 tokens, reducing self-attention
    memory complexity from O(b * A * L * N^2) to O(b * A * L * (L_s * N + (N / L_s)^2))
    via greedy sentence filling and two-level Transformers.
