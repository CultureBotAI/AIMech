  summary: CoT-MAE Contextual Masked Auto-Encoder for Dense Passage Retrieval is a
    distinct concept.
  details: Distinct from SEED-Encoder (AIMech:SEEDPreTrainingStrongTextEncoderUsingWeakDecoder),
    Condenser (AIMech:CondenserPreTrainingArchitectureForDenseRetrieval), RetroMAE
    (AIMech:RetroMAERetrievalOrientedMaskedAutoEncoder), and SimLM (AIMech:SimLMRepresentationBottleneckPreTraining),
    all of which perform single-span internal auto-encoding where the decoder reconstructs
    the same text span encoded into [CLS] rather than cross-span context-supervised
    masked auto-encoding over paired neighboring spans (T_A, T_B); and distinct from
    coCondenser (AIMech:CoCondenserUnsupervisedCorpusAwareLanguageModelPreTraining),
    which uses a discriminative corpus-level contrastive loss across spans rather
    than generative context-MLM reconstruction.
