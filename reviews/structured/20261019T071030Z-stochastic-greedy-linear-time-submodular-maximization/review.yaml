  summary: Stochastic-Greedy Linear-Time Monotone Submodular Maximization is a distinct
    concept.
  details: Distinct from K-Determinantal Point Processes for Fixed-Size Subset Selection
    (`AIMech:KDeterminantalPointProcessesForFixedSizeSubsetSelection`), which samples
    fixed-size subsets with probability proportional to principal minor determinants
    det(L_Y) using elementary symmetric polynomials rather than maximizing general
    monotone submodular set functions, and from classical Greedy (Nemhauser, Wolsey,
    & Fisher 1978) or Lazy-Greedy (Minoux 1978), whose oracle complexity scales with
    k as O(n k). Specifically captures the per-step random candidate sub-sampling
    s = (n/k) log(1/epsilon) (Algorithm 1), the concavity-based overlap probability
    bound Pr[R cap (A^* \ A) != empty] >= (1 - epsilon)|A^* \ A|/k (Lemma 2), the
    cardinality-independent O(n log(1/epsilon)) complexity and (1 - 1/e - epsilon)
    approximation guarantee (Theorem 1), and its combination with lazy upper-bound
    evaluations.
