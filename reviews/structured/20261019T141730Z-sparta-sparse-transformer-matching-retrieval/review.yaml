  summary: SPARTA Sparse Transformer Matching for Retrieval is a distinct concept.
  details: Distinct from SPLADE (AIMech:SPLADESparseLexicalAndExpansionModel), which
    uses the Masked Language Modeling output head on contextualized query and document
    encoders with explicit L1/FLOPS sparsity regularization rather than non-contextualized
    query word embeddings max-pooled against contextualized answer+context BERT tokens
    with a scalar ReLU threshold b; and distinct from COIL (AIMech:COILContextualizedInvertedList)
    and DeepCT (AIMech:DeepCTContextAwareTermImportanceEstimationForFirstStageRetrieval),
    which restrict index entries to exact tokens appearing in the document rather
    than scoring and indexing latent non-appearing vocabulary terms (such as question
    words 'who', 'where', and synonyms).
