  summary: Shampoo (Preconditioned Stochastic Tensor Optimization) is a distinct concept.
  details: Distinct from diagonal AdaGrad and Adam in that Shampoo maintains full
    per-mode covariance matrices H_t^i rather than purely elementwise diagonal accumulators,
    and distinct from full-matrix AdaGrad in that it implicitly preconditions the
    vectorized gradient via the Kronecker product bigotimes_{i=1}^k (H_t^i)^{1/(2k)}
    with O(sum_i n_i^2) storage and O(sum_i n_i^3) inversion cost instead of O(prod_i
    n_i^2) and O(prod_i n_i^3). Distinct from K-FAC in that Shampoo is model-oblivious
    and relies solely on tensor-contracted outer products of observed gradients rather
    than architecture-specific activation/backpropagation Fisher factorizations.
