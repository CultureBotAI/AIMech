  summary: 'MobileBERT: Compact Task-Agnostic BERT with Bottleneck Structures and
    Progressive Knowledge Transfer is a distinct concept.'
  details: 'Introduced by Zhiqing Sun, Hongkun Yu, Xiaodan Song, Renjie Liu, Yiming
    Yang, and Denny Zhou (ACL 2020, pp. 2158-2170, arXiv:2004.02984, doi:10.18653/v1/2020.acl-main.195).
    Distinct from shallow-and-wide BERT distillation methods such as DistilBERT (Round
    803), BERT-PKD (Round 802), TinyBERT (Round 800), and MiniLM (Round 801): MobileBERT
    preserves the full 24-layer depth of BERT_LARGE to avoid the capacity loss of
    depth reduction and narrows intra-block hidden dimensions via matched inter-block
    linear bottlenecks (d_inter = 512) so that Feature Map Transfer (Eq. 2) and Attention
    Transfer (Eq. 3) require no auxiliary projection matrices.'
