  summary: PreTTR Precomputing Transformer Term Representations is a distinct concept.
  details: Distinct from ColBERT (AIMech:ColBERTContextualizedLateInteraction), which
    encodes queries and documents completely independently through all Transformer
    layers and interacts only via a parameter-free sum-of-MaxSim dot-product operator
    at the output; and distinct from standard cross-encoder Transformer distillation
    (such as TinyBERT or DistilBERT), which reduces total layer count for both query
    and document at query time rather than precomputing the first l document layers
    at index time and executing only the upper n - l interaction layers online.
