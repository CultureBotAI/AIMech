  summary: monoBERT and duoBERT Multi-Stage Document Ranking is a distinct concept.
  details: Distinct from listwise cross-encoder fusion architectures such as HLATR
    (AIMech:HLATRHybridListAwareTransformerReranking), which model cross-document
    interactions over pre-computed pointwise [CLS] vectors in a single listwise Transformer
    pass rather than running k_1(k_1 - 1) full BERT forward passes over concatenated
    (q, d_i, d_j) token triples; and distinct from CEDR (AIMech:CEDRContextualizedEmbeddingsForDocumentRanking),
    which is a single-stage pointwise re-ranker fusing multi-layer token similarity
    matrices with [CLS].
