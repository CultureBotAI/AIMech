  summary: ANITA Optimal Loopless Accelerated Variance-Reduced Gradient Method is
    a distinct concept.
  details: 'Distinct from double-loop accelerated variance-reduced methods such as
    Katyusha (Allen-Zhu 2017) and Varag (Lan et al. 2019), and distinct from fixed-probability
    loopless Katyusha (L-Katyusha, Kovalev et al. 2020, which only handles strongly
    convex objectives mu > 0 with constant p_t = p): ANITA uses a single-loop structure
    with a dynamic three-stage snapshot probability schedule {p_t} in the general
    convex regime (mu = 0), achieving the first optimal O(n) stochastic gradient complexity
    matching the Woodworth-Srebro Omega(n) lower bound when n >= 1/epsilon^2.'
