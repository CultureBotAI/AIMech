limitations:
- Adversarial author self-review only; all three records remain DRAFT.
- All31pages of three primary PDFs were visually read. The fifteen-page sparse-coding
  scan has little extractable text; visual reading includes its figures, rotated Figure9
  and Appendix. Printed sparse-coding page=PDFpage+3310; other locators use PDF page
  numbers.
- The records use the inspected author-hosted ICML 2007 paper and official NIPS 2002
  file. Metadata author order and title-page institution grouping are preserved. No
  other PDF copy is certified byte-equivalent.
- RBM-CF observation-mask omission differs from marginalization, and exact single-query
  scoring differs from the experimental plug-in approximation. Available test-pair
  masks are not withheld rating labels.
- PoT requires a proper joint normalizer; positive exponents and full rank alone are
  insufficient. Its reported pseudoinverse sampler is generally approximate. IWF descends
  a fixed objective but can reach different local minima.
- The historical Netflix comparisons and single displayed denoising example do not
  establish universal gains. No author implementation, model training or benchmark
  was run.
- Generic sparse coding reuses AIO:SparseLearning. Eleven new provisional cohorts
  leave337pending leads and other unresolved dispositions. All additions remain DRAFT;
  no global saturation is claimed.
