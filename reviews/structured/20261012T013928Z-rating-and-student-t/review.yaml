  summary: This is the explicitly named inference procedure in Welling, Osindero and
    Hinton 2002, not the PoT probability family, a one-pass Wiener filter, a learned
    denoising autoencoder or a training algorithm for the filters. Its iterates estimate
    the latent clean observation under fixed model parameters. It is separately represented
    from generic sparse coding already covered by AIO:SparseLearning. Four candidate
    identities were compared against all 442 pinned AIO IDs, labels and scoped synonyms
    and 447 preceding native IDs, names and aliases. Sparse coding matches the exact
    synonym and definition of AIO:SparseLearning and is reused; none of the three
    selected additions has a normalized identity match. Ignored/hidden full-checkout
    searches returned 47 lines each in worktree and main, with identical matched-line
    sets after merge. All 47 matched lines were read; they contain the existing sparse-coding
    class, its source/export and prior discovery context. All 205 semantic label/synonym
    rows were read and verified unchanged. Twenty-four annotated AIO nodes and outgoing
    edges comprise 23 unchanged prior readings and one new symmetry-network inspection.
    Thirty-two contextual YAMLs comprise 31 unchanged prior readings and one fully
    read new record, including eight native neighbors. Absence and no-match assessments
    are bounded to this snapshot and inspected neighborhood.
  details: 'For noisy y, positive-definite noise covariance Sigma, fixed filters J,
    positive exponents alpha and nonnegative grouping weights W, minimize F(x)=0.5(y-x)^T
    Sigma^(-1)(y-x)+sum_i alpha_i log[1+0.5 sum_j W_ij(J_j^T x)^2]. Ungrouped factors
    use identity W. At the current x set gamma_i=[1+0.5 sum_j W_ij(J_j^T x)^2]^(-1),
    form D=diag(W^T(alpha*gamma)), and solve [Sigma^(-1)+J D J^T]x_new=Sigma^(-1)y.
    The bound log(t)<=gamma*t-log(gamma)-1 is tight at gamma=1/t; exact bound minimization
    therefore does not increase the fixed objective. Sigma positive definite ensures
    the linear solve is unique even if J is rank deficient. Interpreting F as a proper-prior
    MAP objective additionally requires the PoT prior to normalize. The log-potential
    makes the full objective generally nonconvex. Monotone exact updates do not guarantee
    its global minimum, and MAP is not generally the squared-error-optimal posterior
    mean. A scalar proper-prior calculation with alpha=10, noise variance 1 and y=8.5
    reaches distinct strict local minima from starting values 0 and 8.5, with objectives
    approximately 32.03555 and 32.08788. The higher solution cannot be globally optimal.
    This is a curator counterexample to a universal optimization guarantee, not a
    reported author experiment. In the source special case of square orthonormal filters,
    isotropic noise and identity grouping, the stationary condition separates into
    scalar cubic equations. Other structured cases require their own derivation. Multiple
    stationary roots require objective comparison; a root alone is not a global-optimum
    certificate. The source applies the procedure to overlapping transformed image
    patches and averages restored patches, using a complete set of filters learned
    on natural images. This patch-processing and preprocessing context is part of
    the reported denoising experiment, not a definition of all Wiener filters or evidence
    of general benchmark superiority. Limitations: The algorithm fixes filters, exponents
    and grouping weights while optimizing the clean observation. It does not fit the
    prior, estimate a noise model automatically or sample posterior uncertainty. Descent
    follows exact auxiliary updates and exact linear solves for the same fixed objective.
    Approximate solves, changing parameters or a different noise model need separate
    analysis. Nonconvexity allows initialization-dependent local minima. MAP and posterior-mean
    estimates optimize different decision criteria; the source description of MAP
    as optimal is not an unconditional minimum-MSE theorem. The source reports a single
    displayed noisy-image comparison with known Gaussian noise, overlapping patches
    and matched whitening/DC handling. It does not establish universal denoising gains
    or the proposed future benefits of overcomplete/grouped priors. No author software
    or empirical denoising experiment was run. Finite arithmetic checks verify mathematical
    boundaries, not historical implementation correctness.'
