  summary: ME-BERT Multi-Vector Dense Retrieval is a distinct concept.
  details: Distinct from ColBERT (AIMech:ColBERTContextualizedLateInteraction), which
    encodes every query token and every document token and sums maximum similarities
    across all query tokens (requiring multiple MIPS queries per user query plus post-processing
    rather than a single query vector searched against m fixed vectors per document);
    and distinct from Poly-encoders (AIMech:PolyEncoderArchitecture), which apply
    a softmax-weighted attention step over m context codes before computing the final
    query dot product (preventing direct single-query sublinear MIPS indexing).
