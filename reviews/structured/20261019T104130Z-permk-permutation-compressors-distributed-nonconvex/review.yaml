  summary: PermK Permutation Compressors for Distributed Nonconvex Optimization is
    a distinct concept.
  details: Introduced by Rafal Szlendak, Alexander Tyurin, and Peter Richtarik (ICLR
    2022; arXiv:2110.03300). Distinct from independent RandK sparsification, where
    each node independently samples k coordinates yielding B = 0 and A = (d - k) /
    (n * k) without inter-node variance cancellation; and distinct from MARINA (Gorbunov
    et al., ICML 2021; Round 391), which provides the variance-reduced distributed
    framework analyzed under independent compressors whereas PermK introduces the
    AB-assumption and negatively correlated permutation compressors that strictly
    improve MARINA's theoretical complexity.
