  summary: Post-Local Stochastic Gradient Descent is a distinct concept.
  details: 'Distinct from standard single-phase Local SGD / Parallel SGD (which uses
    constant H > 1 from initialization t = 0 and suffers early optimization degradation
    at large K and H), from gradual local-step warmup schedules, and from outer-momentum
    wrappers (SlowMo): Post-Local SGD specifically delays local multi-step updates
    until the trajectory enters the basin of a local minimum at the first learning-rate
    decay t'', simultaneously preserving Phase-1 optimization stability and injecting
    K-fold amplified structured gradient noise in Phase 2 to escape sharp minima.'
