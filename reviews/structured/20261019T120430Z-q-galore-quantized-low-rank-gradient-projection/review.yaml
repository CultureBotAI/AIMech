  summary: Q-GaLore (Quantized GaLore with INT4 Projection and Layer-Adaptive Low-Rank
    Gradients) is a distinct concept.
  details: Distinct from GaLore (AIMech:GaLoreGradientLowRankProjection), which maintains
    full BF16/FP16 master weights, stores projection matrices in 16-bit floating point
    (or 8-bit in Q-GaLore baseline), and recomputes SVD projections at a fixed uniform
    interval across all layers. Distinct from QLoRA (AIMech:QloraQuantizedLowRankAdaptation),
    which freezes 4-bit NormalFloat base weights and optimizes only additive low-rank
    adapter matrices rather than updating the full-rank weight matrix in INT8 via
    quantized low-rank gradient projections.
