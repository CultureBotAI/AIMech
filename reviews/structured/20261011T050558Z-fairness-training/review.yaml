  snapshot_sha256: bcdbc1454b2ac525b1e7ec6a6dc2a5c5874f079415e24ec8ccb1fdce12e75dca
  support: supports
  summary: 'A cost-sensitive classification reduction that alternates classifier best
    responses with exponentiated-gradient updates of bounded Lagrange multipliers
