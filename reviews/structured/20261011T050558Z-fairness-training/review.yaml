  accessed_at: '2026-10-11T04:57:23Z'
  snapshot_sha256: 3095f69e500acc3bb26a18d17ea77a7045c34b5ae48c60792dfcf176e73e24cc
  support: supports
  summary: 'A variational autoencoder architecture for learning representations with
