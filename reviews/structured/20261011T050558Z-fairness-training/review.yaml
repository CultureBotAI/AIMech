limitations:
- Scientific adversarial author self-review, not independent approval; all five records
  remain DRAFT.
- Matching group-average prototype assignments is distinguished from matching the
  distribution of probability-vector representations; unrestricted downstream parity
  is not asserted.
- The reduction guarantees retain cost-sensitive oracle, multiplier cap, conditioning-event
  and finite-sample assumptions. Deterministic grid selection does not inherit the
  randomized-mixture guarantee.
- VFAE’s sensitive-variable-conditioned, semi-supervised construction is not mapped
  as an unqualified subclass of the pin’s unsupervised VAE definition.
- The VFAE printed objective-sign and bandwidth conventions have not been reconciled
  against an authoritative implementation; the record avoids executable formulas and
  quantitative claims.
- Adversarial fairness claims retain expressivity, convergence and optimization assumptions.
  FR-Train’s projection-stability observation is limited to its authors’ setting.
- The attempted author-lab VFAE repository URL returned 404; no implementation inspection
  or repository absence beyond that URL is claimed.
- No benchmark reproduction, full proof certification or general fairness verdict
  was performed. All required local gates passed and discovery remains ongoing.
