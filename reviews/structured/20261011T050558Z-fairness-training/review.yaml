- evidence_id: zhangadversarialdebiasing-method
  kind: primary_source
  reference: https://arxiv.org/pdf/1801.07593v1
  locator: Section 3 equation (1), PDF pp. 2–3; Section 5 Propositions 1–3 and footnote
    4, PDF pp. 3–4; Section 8, PDF p. 6
  accessed_at: '2026-10-11T04:57:22Z'
  snapshot_sha256: 0b59ae87abf1e2d6502295f77aff764c25fbc3929cb6de56c54299b270437d93
  support: supports
  summary: 'An adversarial learning algorithm that trains a task predictor alongside
    a protected-attribute adversary, modifying the predictor gradient with a projection
    term and an opposing adversary-loss term to target a selected statistical fairness
    condition. The cited method construction and scoped limitations were inspected.
    Rendered pages actually inspected: 3, 4.'
- evidence_id: zhangadversarialdebiasing-method-stability-followup
  kind: primary_source
  reference: https://proceedings.mlr.press/v119/roh20a/roh20a.pdf
  locator: Section 3.1, PDF p. 4, paragraph discussing Adversarial Debiasing immediately
    before Section 3.2
  accessed_at: '2026-10-11T05:00:25Z'
  snapshot_sha256: eeb654425e3d6be9ad51c776a5fc5260474dc4bf1a27a21462596d05da548273
  support: supports
  summary: 'The FR-Train authors explicitly omit the Zhang et al. projection term,
    reporting that it worsened training stability in their experiments. This is a
    setting-dependent design observation, not evidence that projection-based adversarial
    debiasing always fails. This evidence supports the stated scope or limitation,
    not an unrestricted fairness guarantee. Rendered pages actually inspected: 4.'
assessments:
- assessment_id: learningfairrepresentations-method
  area: evidence
  topic: Method identity, optimization/model assumptions, source support and mapping
    direction
  outcome: supported
  target_ids:
  - AIMech:LearningFairRepresentations
  evidence_ids:
  - learningfairrepresentations-method
  - identity-search
  - mapping
  - learningfairrepresentations-method-representation-critique
  summary: The named LFR algorithm learns a prototype representation and a prediction
    rule. It is distinct from the general aim of learning fair representations, the
    finite-population FairnessLP formulation, and the later Variational Fair Autoencoder.
    The learned metric variant does not make it identical to AIO MetricLearning, which
    denotes a deep neural network in this pin.
  details: Fairness, reconstruction and predictive utility are weighted objectives;
    finite training and a nonzero penalty weight do not guarantee exact population
    parity. Equal group means of assignment probabilities do not imply equality of
    the distributions of the full assignment-probability vectors. Arbitrary nonlinear
    downstream processing or thresholding requires a separate fairness assessment.
    The method encourages local similarity; it does not certify the full supplied-metric
    pairwise Lipschitz criterion for every pair of individuals. The group-specific
    distance variant uses group membership for its mapping. Out-of-sample representation
    availability is not a proof of out-of-sample fairness.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specific training algorithm or variational architecture, distinct
      from a criterion, task or fitted instance.
    evidence_ids:
    - learningfairrepresentations-method
  - name: mapping-direction
    value: related_match to AIO:Classification
    definition: Learns a representation and prediction rule for classification. The
      algorithm is related to the classification task; the pin’s RepresentationLearning
      and MetricLearning classes specifically describe deep neural networks and are
      not asserted as exact or broad identities for this prototype method.
    evidence_ids:
    - learningfairrepresentations-method
    - mapping
- assessment_id: exponentiatedgradientfairclassification-method
  area: evidence
  topic: Method identity, optimization/model assumptions, source support and mapping
    direction
  outcome: supported
  target_ids:
  - AIMech:ExponentiatedGradientFairClassification
  evidence_ids:
  - exponentiatedgradientfairclassification-method
  - identity-search
  - mapping
  summary: This is Algorithm 1 of Agarwal et al., not generic exponentiated-gradient
    optimization. It returns a distribution over classifiers and is distinct from
    the paper’s deterministic-candidate grid-search reduction and from postprocessing
    a fixed classifier.
  details: The optimization analysis assumes a cost-sensitive best-response oracle;
    heuristic base learners need not realize the exact oracle guarantees. Bounds retain
    optimization tolerance, the multiplier-norm cap and statistical error, including
    dependence on the number of observations in each conditioning event. The constraint
    representation excludes conditioning events that depend on the learned predictor;
    the paper identifies predictive parity and calibration as outside this formulation.
    Protected attributes are required for training constraints. No separate protected-attribute
    argument is needed at prediction time only when the chosen feature vector and
    base classifier do not require it.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specific training algorithm or variational architecture, distinct
      from a criterion, task or fitted instance.
    evidence_ids:
    - exponentiatedgradientfairclassification-method
  - name: mapping-direction
    value: related_match to AIO:BinaryClassification
    definition: Trains binary classifiers under conditional-moment constraints. The
      reduction is a learning algorithm related to the binary classification task,
      not an equivalent task or ontology subclass assertion.
    evidence_ids:
    - exponentiatedgradientfairclassification-method
    - mapping
- assessment_id: gridsearchfairclassification-method
  area: evidence
  topic: Method identity, optimization/model assumptions, source support and mapping
    direction
  outcome: supported
  target_ids:
  - AIMech:GridSearchFairClassification
  evidence_ids:
  - gridsearchfairclassification-method
  - identity-search
  - mapping
  summary: The paper’s Section 3.4 grid search is a separate reduction producing deterministic
    candidates. It shares a cost-sensitive oracle with the randomized exponentiated-gradient
    reduction but does not inherit that procedure’s mixture or saddle-point stopping
    rule. It is not generic hyperparameter grid search or the bivariate causal-sensitivity
    grid procedure.
  details: A finite grid and heuristic cost-sensitive learner do not guarantee a globally
    optimal fair deterministic classifier. The paper explicitly allows lower accuracy
    or constraint violation when choosing a deterministic candidate; the randomized-mixture
    guarantees should not be transferred automatically. Grid search is intended for
    small numbers of effective constraint dimensions and scales poorly as that dimension
    grows. Fairness is assessed under the specified empirical constraints and sampling
    context; evaluation on unseen or shifted data is separate.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specific training algorithm or variational architecture, distinct
      from a criterion, task or fitted instance.
    evidence_ids:
    - gridsearchfairclassification-method
  - name: mapping-direction
    value: related_match to AIO:BinaryClassification
    definition: Constructs binary classification candidates using fairness-dependent
      costs. This relates the reduction to its task without equating algorithm and
      task.
    evidence_ids:
    - gridsearchfairclassification-method
    - mapping
- assessment_id: variationalfairautoencoder-method
  area: evidence
  topic: Method identity, optimization/model assumptions, source support and mapping
    direction
  outcome: supported
  target_ids:
  - AIMech:VariationalFairAutoencoder
  evidence_ids:
  - variationalfairautoencoder-method
  - identity-search
  - mapping
  summary: VFAE denotes the MMD-regularized semi-supervised variational architecture
    introduced by Louizos et al. It is distinct from the paper’s unregularized VAE
    baseline, prototype-based LFR, ordinary autoencoding and the model-dependent FAIRLEARNING
    algorithm. Prior independence and aggregated-posterior matching do not establish
    causal counterfactual fairness.
  details: Independence in the generative prior does not alone ensure independence
    of inferred representations; the MMD regularizer addresses remaining group dependence.
    Finite data, optimization, kernel choice and random-feature approximation limit
    how strongly matching can be claimed; no exact population independence or universal
    fairness guarantee is asserted. The encoder conditions on the sensitive variable.
    Semi-supervised here allows missing task labels, not arbitrary absence of sensitive-attribute
    information. The paper reports sampling the inferred latent representation for
    prediction rather than replacing it by its mean. Numerical objective-sign and
    bandwidth conventions are not certified by this conceptual record.
  dimensions:
  - name: concept-kind
    value: architecture
    definition: A specific training algorithm or variational architecture, distinct
      from a criterion, task or fitted instance.
    evidence_ids:
    - variationalfairautoencoder-method
  - name: mapping-direction
    value: related_match to AIO:VariationalAutoEncoder
    definition: Uses variational autoencoding with additional sensitive-variable conditioning,
      a supervised component and MMD regularization. Because the pinned target definition
      specifies unsupervised learning, this mapping records the architectural relationship
      without asserting an unqualified subclass relation.
    evidence_ids:
