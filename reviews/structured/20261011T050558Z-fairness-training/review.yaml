  summary: This record isolates Zhang, Lemoine and Mitchell’s projection-based method.
    It is not the whole family of adversarial fairness approaches, a generative adversarial
    network, or generic gradient reversal. Different adversary inputs target different
    fairness constraints rather than defining synonyms for those criteria.
  details: The source’s convergence argument assumes convexity/concavity, differentiability
    and convergence; it explicitly notes that the convexity/concavity assumptions
    usually fail for neural networks. Turning adversarial indistinguishability into
    a population fairness condition requires a sufficiently expressive and well-optimized
    adversary. Failure of a restricted adversary to detect dependence is not proof
    of general independence. Training can be unstable and is sensitive to optimization
    settings and loss weighting; the method does not guarantee convergence or exact
    finite-sample fairness. The projection describes an ideal gradient construction.
    This record does not certify every finite-step or adaptive-optimizer implementation,
    and omits numerical benchmark claims.
