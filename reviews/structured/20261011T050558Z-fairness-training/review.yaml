  snapshot_sha256: 3095f69e500acc3bb26a18d17ea77a7045c34b5ae48c60792dfcf176e73e24cc
  support: supports
  summary: 'Louizos and colleagues identify a higher-order-distribution limitation
    of matching average LFR assignment probabilities: groups can have the same average
