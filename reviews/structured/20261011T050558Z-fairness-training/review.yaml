  accessed_at: '2026-10-11T04:57:22Z'
  snapshot_sha256: bcdbc1454b2ac525b1e7ec6a6dc2a5c5874f079415e24ec8ccb1fdce12e75dca
  support: supports
  summary: 'A fairness-aware classification reduction that evaluates cost-sensitive
    classifier best responses over a grid of Lagrange-multiplier-derived costs and
    selects a deterministic candidate with a desired empirical accuracy–fairness tradeoff.
    The cited method construction and scoped limitations were inspected. Rendered
    pages actually inspected: 4, 6, 7.'
