  summary: Oblivious Sparse Norm-Approximating Projections (OSNAP) for Fast Numerical
    Linear Algebra is a distinct concept.
  details: Distinct from AIMech:ProjectionCostPreservingSketchesForKMeansAndConstrainedLowRankApproximation
    (Round 364), which preserves rank-k left projection costs ||(I - P)A||_F^2 + c
    in O(k/varepsilon^2) dimensions (and uses OSNAP as an underlying sketching primitive),
    whereas OSNAP is a sparse oblivious subspace embedding preserving ||Pi U y||_2
    in (1 +- varepsilon)*||y||_2 for all y in R^d simultaneously—equivalently bounding
    all singular values of Pi U in [1 - varepsilon, 1 + varepsilon] via a Bai-Yin
    moment method on generalized dot-product multigraphs. Also distinct from AIMech:FrequentDirectionsDeterministicMatrixSketching
    (Round 363), which is a deterministic SVD-shrinkage sketch requiring O(n*d*ell)
    time rather than O(s*nnz(A)) sparse hashing time.
