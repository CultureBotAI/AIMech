  summary: WNGrad is a distinct concept.
  details: Motivated by the Pythagorean norm growth ||v_{k+1}||_2^2 = ||v_k||_2^2
    + (eta^2 / ||v_k||_2^2) ||P_{v_k^perp} nabla f||_2^2 of Weight Normalization on
    the unit sphere (Equation 4), WNGrad satisfies b_{k+1}^2 = b_k^2 + 2 ||g_k||_2^2
    + ||g_k||_2^4 / b_k^2, avoiding square-root operations while remaining invariant
    to rescaling f -> lambda f when b_1 = C ||nabla f(x_1)||_2 (Remark 2.2). Also
    includes momentum extensions WNGrad-Momentum and WN-Adam (Algorithm 4).
