  summary: DIANA Distributed Learning with Compressed Gradient Differences is a distinct
    concept.
  details: Distinct from QSGD (AIMech:QsgdCommunicationEfficientStochasticGradientQuantization,
    which quantizes raw gradients g_i^k directly without memory shifts h_i^k and therefore
    suffers non-vanishing quantization variance at x^* whenever nabla f_i(x^*) !=
    0, recovered as the special case alpha = 0, h_i^0 = 0, p = 2 of DIANA), from EF21
    (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization,
    which uses biased contractive compressors on deterministic gradients with error
    state g_i^{t+1} = g_i^t + C(nabla f_i(x^{t+1}) - g_i^t) rather than unbiased l_p
    quantization with damping step size alpha <= alpha_p and proximal composite support
    R(x)), and from Sparsified SGD with Error Memory (AIMech:SparsifiedSgdWithErrorMemoryForKContractiveGradientCompression).
    No pinned AIO class covers DIANA or compressed gradient-difference shift learning.
