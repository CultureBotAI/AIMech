  summary: Fed-ET (Heterogeneous Ensemble Knowledge Transfer with Confidence-Weighted
    Consensus and Diversity Regularization) is a distinct concept.
  details: Distinct from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning,
    Lin et al. 2020), which averages client logits with uniform weights without intra-logit
    variance confidence weighting, dissenting-client diversity KL regularization,
    or bi-directional representation-layer transfer to a strictly larger server model;
    and distinct from FedAUX (AIMech:FedAuxCertaintyWeightedUnsupervisedAuxiliaryEnsembleDistillationForFederatedLearning,
    Sattler et al. 2021), which requires clients to access auxiliary data and train
    separate logistic-regression out-of-distribution certainty scorers rather than
    weighting client teachers purely at the server via intra-logit probability variance
    sigma_s^2(w_k, x) and regularizing with dissenting-client KL divergence.
