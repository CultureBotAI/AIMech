  summary: BRIDGE Byzantine-Resilient Decentralized Gradient Descent is a distinct
    concept.
  details: 'Distinct from ByRDiE (Yang & Bajwa, 2019, which updates and screens one
    coordinate at a time across d sequential network-wide communication rounds and
    d local gradient evaluations per iteration) and from ClippedGossip (AIMech:ClippedGossipSelfCenteredClippingForByzantineRobustDecentralizedLearning,
    which clips neighbor differences in L2 norm around node i''s own state withlocal
    momentum): BRIDGE (Fang, Yang, & Bajwa, IEEE TSIPN 2022) performs a single full-vector
    broadcast and gradient step per iteration coupled with neighbor-set statistical
    screening (BRIDGE-T/-M/-K/-B) and establishes both algorithmic consensus O(sqrt(d)/t)
    and high-probability statistical sample-complexity convergence O(sqrt(d ||alpha_m||^2
    log(2/delta) / N)) on strongly convex and locally strongly convex nonconvex risks.'
