  summary: Measured Continuous Greedy Algorithm for Constrained Monotone and Non-Monotone
    Submodular Maximization is a distinct concept.
  details: Distinct from AIMech:ContinuousGreedyAndMultilinearExtensionForMatroidSubmodularMaximization
    (Round 349, Calinescu et al. 2011), which updates y_e(t + delta) = y_e(t) + delta
    * I_e(t) without the (1 - y_e(t)) damping factor—causing coordinates to reach
    1 too quickly and failing on non-monotone submodular functions where F(y(t) vee
    1_{OPT}) requires bounding max_e y_e(t) <= 1 - e^{-t} via Lemma III.5—and which
    cannot run past stopping time T = 1 on high-density monotone packing polytopes.
