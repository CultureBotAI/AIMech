  summary: Polytropon (Latent Task-Skill Allocation for Modular Multitask Learning)
    is a distinct concept.
  details: Introduced by Edoardo M. Ponti, Alessandro Sordoni, Yoshua Bengio, and
    Siva Reddy (2022/ICLR 2023, arXiv:2202.13914; official implementation github.com/McGill-NLP/polytropon,
    referred to as SKILLED / Polytropon). Distinct from MoE and MoLE (AIMech Round
    686), which route tokens via competitive softmax/top-k gating conditioned on the
    input rather than learning a non-competitive variable-subset binary soft partition
    Z over skills conditioned on the task, and distinct from HyperFormer (AIMech Round
    703), which entangles task knowledge inside a continuous hypernetwork rather than
    recombining discrete modular skill parameterizations.
