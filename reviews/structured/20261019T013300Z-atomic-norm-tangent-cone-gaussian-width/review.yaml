  summary: 'Verified analytically and via Monte Carlo: (1) on the l_inf k-face cone
    T_A(x*) = (-R_+)^{p-k} x R^k and its polar N_A(x*) = R_+^{p-k} x {0}^k, Moreau
    orthogonal decomposition g = Pi_N(g) + Pi_T(g) holds to < 1e-12 with E[dist(g,
    N)^2] = (p+k)/2, E[dist(g, T)^2] = (p-k)/2, and exact sum p = 40.0 (Lemma 3.7,
    Corollary 3.8, Proposition 3.12); (2) for s=5 sparse vectors in R^{100}, the exact
    normal-cone variational integral inf_t E[dist(g, N)^2] = 20.39 matches Monte Carlo
    (20.38) and lies strictly below the closed-form Proposition 3.10 bound 2*s*log(p/s)
    + (5/4)*s = 36.21; (3) for orthogonal matrices O(m) at X* = I_m, dim(so(m)) +
    (1/2)dim(Sym_m) = (3m^2 - m)/4 = 105.0 at m=12 (Proposition 3.13); and (4) Moreau
    proximal/dual-ball decomposition x = Pi_A(x; mu) + Lambda_A(x; mu) and <x - Pi_A(x;
    mu), Pi_A(x; mu)> = mu ||Pi_A(x; mu)||_A hold to < 1e-10 for both A_{l1} and A_{linf}
    (Section 5, Eqs. 18-29).'
