  summary: Atomic Norm Convex Geometry and Tangent Cone Gaussian Width for Linear
    Inverse Problems is a distinct mathematical method unifying sparse, low-rank,
    sign, orthogonal, permutation, and algebraic-variety recovery via atomic gauges
    and tangent/normal cone polarity.
  details: Distinct from specific compressed-sensing, matrix-completion, or singular-value-thresholding
    records (`AIMech:RestrictedIsometryPropertyForCompressedSensing`, `AIMech:NuclearNormConvexRelaxationForMatrixCompletion`,
    `AIMech:SingularValueThresholdingForMatrixCompletion`, `AIMech:MinimaxRiskOfMatrixDenoisingBySingularValueSoftThresholding`),
    which analyze a single norm ($\ell_1$ or nuclear norm) or direct matrix denoising
    ($\Phi = I$). Chandrasekaran, Recht, Parrilo, & Willsky (2012) formulate the general
    atomic-set gauge/support-function theory over arbitrary compact atomic sets $\mathcal{A}$
    (unifying sparse vectors, low-rank matrices, sign vectors, orthogonal matrices,
    permutation matrices, and algebraic varieties), prove the polar normal-cone distance
    bound $w(\mathcal{C} \cap \mathbb{S}^{p-1}) \le \mathbb{E}_g[\operatorname{dist}(g,
    \mathcal{C}^*)]$ via Lagrangian duality, and analyze the computational-statistical
    sample-complexity tradeoff across semidefinite theta-body outer relaxations $\mathrm{TH}_k(I)$.
