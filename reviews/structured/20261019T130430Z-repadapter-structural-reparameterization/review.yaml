  summary: RepAdapter (Structurally Re-parameterized Visual Adapter) is a distinct
    concept.
  details: Introduced by Gen Luo, Minglang Huang, Yiyi Zhou, Xiaoshuai Sun, Guannan
    Jiang, Zhiyu Wang, and Rongrong Ji (2023, arXiv:2302.08106). Distinct from parallel
    non-linear visual adapters such as AdaptFormer (Chen et al., NeurIPS 2022; AIMech
    Round 696) and post-FFN non-linear sequential adapters (Houlsby et al., ICML 2019;
    AIMech Round 677), which cannot be merged into Transformer blocks due to intervening
    non-linearities, and distinct from SSF (Lian et al., NeurIPS 2022; AIMech Round
    692), which applies element-wise affine modulation rather than a dense-to-sparse
    bottleneck projection. Both full RepAdapter (placed before both MHA and FFN) and
    the lightweight RepAdapter_attn variant (placed only before MHA) are covered within
    this single record.
