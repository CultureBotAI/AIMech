assessments:
- assessment_id: ng-metric-dependent-local-direction
  area: evidence
  topic: Claim metric-dependent-local-direction
  outcome: supported
  summary: The source proof on 1998 PDF pp.3–4 minimizes the first-order term g^T
    a under a metric-length constraint. With symmetric positive-definite G, Cauchy–Schwarz
    gives the stated normalized negative inverse-metric direction; the sign and square-root
    denominator are correct. The record explicitly requires g nonzero for that normalization
    and does not turn the local linearization into an exact finite-radius nonlinear
    minimizer. Equation2.5 is a later additive use, not an omitted normalization requirement.
  target_ids:
  - AIMech:NaturalGradient
  evidence_ids:
  - record-naturalgradient
  - src-amari1998
  - src-amari1996-nips9
- assessment_id: ng-model-fisher-statistical-metric
  area: evidence
  topic: Claim model-fisher-statistical-metric
  outcome: concern
  summary: The statistical expectation is under the model density, and the conditional
    example includes a fixed input distribution and model output law. Equation3.5
    and the explicit log-score calculation on PDF16 support both log derivatives;
    the visually retained Equation3.11 mismatch is not silently certified. Finite
    score moments and nondegenerate coordinates explain why an ordinary inverse needs
    qualifications. An observed-label outer-product sample is not automatically the
    model expectation. NIPS9 Equation11 corroborates this, but its section locator
    must be corrected from3 to4; the claim itself is supported.
  target_ids:
  - AIMech:NaturalGradient
  evidence_ids:
  - record-naturalgradient
  - src-amari1998
  - src-amari1996-nips9
  - locator-audit
- assessment_id: ng-sampled-loss-gradient-use
  area: evidence
  topic: Claim sampled-loss-gradient-use
  outcome: concern
  summary: The source distinguishes expected loss L from one-observation l and permits
    a separately chosen preconditioning matrix before selecting G inverse. The record
    therefore correctly describes a sampled metric-gradient use rather than a complete
    universally specified optimizer. Independence and a fixed data law are part of
    the stated setup; no finite-step monotonicity follows. For example, even G=1 and
    a quadratic loss can increase after an excessively large step. Equations3.1–3.2
    are correctly identified by page/equation but belong to Section3, not subsection3.1;
