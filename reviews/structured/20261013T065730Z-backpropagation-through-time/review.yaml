    full native records were inspected. Matches are source mentions, existing architecture
    training descriptions, prior derivative reviews and the pending nested lead. BPTT
    differentiates a temporally unfolded computation in reverse order. RTRL propagates
    parameter sensitivities forward; the same fixed objective can have the same gradient
