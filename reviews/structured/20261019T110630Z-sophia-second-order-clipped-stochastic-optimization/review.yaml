  summary: Sophia (Second-Order Clipped Stochastic Optimization) is a distinct concept.
  details: Distinct from Adam/AdamW (which precondition by the empirical Fisher diagonal
    v_t = EMA(g_t odot g_t) computed with true labels y_b rather than model-sampled
    labels hat{y}_b ~ p(theta, x_b), conflating residual loss magnitude with curvature)
    and from unclipped diagonal Newton/AdaHessian methods (which can converge to local
    maxima or saddle points under negative curvature and require every-step Hessian-vector
    products). Whenever a coordinate's curvature h_{t,[i]} <= 0 or m_{t,[i]} / (gamma
    h_{t,[i]}) > rho, Sophia automatically falls back to clipped SignGD/Lion-like
    constant displacement +-eta_t rho on that coordinate.
