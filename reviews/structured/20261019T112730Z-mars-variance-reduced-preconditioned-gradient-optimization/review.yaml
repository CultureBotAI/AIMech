  summary: MARS (Make vAriance Reduction Shine Preconditioned Optimizer Framework) is a distinct concept.
  details: 'Distinct from unpreconditioned STORM (AIMech:StormStochasticRecursiveMomentumForNonconvexOptimization),
    AdamW, Lion (AIMech:LionEvoSignMomentumOptimizer), and Shampoo (AIMech:ShampooKroneckerFactoredPreconditionedOptimizer):
    MARS unifies preconditioned adaptive optimization and recursive variance reduction through Proposition
    3.2, introducing the control-variate scaling factor gamma_t that continuously interpolates between
    standard exponential moving average momentum (gamma_t = 0) and full recursive momentum (gamma_t =
    1) before applying diagonal, elementwise-sign, or orthogonal-matrix preconditioning H_t.'
