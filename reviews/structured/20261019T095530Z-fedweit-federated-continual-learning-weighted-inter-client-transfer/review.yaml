  summary: FedWeIT (Federated Weighted Inter-Client Transfer) is a distinct concept.
  details: Introduced by Jaehong Yoon, Wonyong Jeong, Giwoong Lee, Eunho Yang, and
    Sung Ju Hwang in 'Federated Continual Learning with Weighted Inter-client Transfer'
    (ICML 2021, PMLR 139:12073-12086; arXiv:2003.03196). Distinct from single-machine
    Additive Parameter Decomposition (APD, Yoon et al. ICLR 2020), which has no cross-client
    attention transfer term sum_{i != c} alpha_{i,j}^{(t)} A_i^{(j)} nor sparse masked
    base-parameter aggregation theta_G = (1/|C^{(r)}|) sum_c B_c^{(t,r)} odot m_c^{(t,r)};
    distinct from FedCurv (Shoham et al. 2019) and FedProx (Li et al. 2018), which
    store all task knowledge in a single shared parameter vector theta_G without task-adaptive
    decomposition; and distinct from GLFC (Dong et al. CVPR 2022), which addresses
    class-incremental federated learning via gradient compensation and relation distillation
    rather than task-incremental parameter decomposition.
