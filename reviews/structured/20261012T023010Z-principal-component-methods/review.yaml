- assessment_id: ojalearningrule
  area: evidence
  topic: Definition, identity, claim support, limitations and AIO mapping direction
  outcome: supported
  target_ids:
  - AIMech:OjaLearningRule
  evidence_ids:
  - identity
  - mapping
