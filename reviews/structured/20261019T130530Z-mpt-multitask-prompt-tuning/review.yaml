  summary: MPT (Multitask Prompt Tuning) is a distinct concept.
  details: Introduced by Zhen Wang, Rameswar Panda, Leonid Karlinsky, Rogerio Feris,
    Huan Sun, and Yoon Kim (ICLR 2023, arXiv:2303.02861). Distinct from SPoT (Vu et
    al., ACL 2022; AIMech Round 698), which trains a single unfactorized prompt on
    a source mixture or retrieves top-k source prompts by cosine similarity without
    multiplicative rank-one prompt decomposition or knowledge distillation from per-task
    teacher prompts. Both single-target adaptation (MPT, tuning (l x d) + (l + d)
    parameters per task) and multitask target group adaptation (MPT*, sharing P^*
    across tau target tasks for (l x d)/tau + (l + d) parameters per task) are covered
    within this record.
