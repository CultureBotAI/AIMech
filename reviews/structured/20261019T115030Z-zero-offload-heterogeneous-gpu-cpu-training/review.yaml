  summary: ZeRO-Offload is a distinct concept.
  details: Distinct from GPU-only model-state sharding (ZeRO-1/2/3, which require
    aggregate GPU memory to hold all model states), from layer-to-layer weight swapping
    (L2L, which keeps optimizer compute on GPU, incurs 28M CPU-GPU communication per
    step, and cannot scale across multiple GPUs), and from ZeRO-Infinity (which builds
    on ZeRO-3 to partition parameters and offload to NVMe plus CPU with memory-centric
    tiling).
