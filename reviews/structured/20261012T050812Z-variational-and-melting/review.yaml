  summary: 'This record denotes Wong’s complete melting procedure plus fractional-free-energy
    persistence selection. At one inverse temperature, the center update is the Gaussian
    mean-shift weighted mean; the outer heating path, original-point membership tree
    and selection stage distinguish the named algorithm. Weights are normalized over
    original observations, not mixture components. Cluster independence means separate
    center updates using the same data, not statistical independence of clusters.
    Heating decreases inverse temperature, unlike DAEM cooling toward one. No normalized
    match across all 442 pinned AIO labels/scoped synonyms and 480 native IDs/names/aliases,
    including GAM and VEM probes. Full-checkout searches include ignored and hidden
    files in worktree and main;59 and 61 matched lines reduce to 31 distinct text
    windows, all read. Hits denote topic-model fitting steps, prior frontier leads,
    unrelated GAM generalized-additive-model context or programming mnemonics. GAM
    is the joint distribution/parameter KL-descent framework, not GEM with its exact
    current E-step. Variational EM fits model parameters with a restricted posterior
    family; BBVI is a stochastic variational-gradient procedure, NVIL specifies amortized
    stochastic learning, and structured factorial-HMM inference is model-specific.
    Melting shares its fixed-bandwidth weighted-mean update with Gaussian mean shift;
    its named outer heating, membership tree and persistence selection supply the
    distinct scope. Bare GAM/VEM aliases are qualified. Absence is bounded to this
    snapshot, corpus and inspected semantic neighborhood. Identity-search counts:
    59 matched lines in the worktree and 61 in main; all 31 distinct matching-text
    windows were read, with ignored and hidden files included.'
  details: 'For each center y and beta>0, assign original points weights P_y,beta(x)=exp(-beta*||x-y||^2)/sum_u
    exp(-beta*||u-y||^2). Iterate y_new=sum_x x*P_y,beta(x) at fixed beta. Start centers
    at observations at a sufficiently high initial beta, retain their point memberships,
    track converged centers, and combine memberships when centers coalesce. Decrease
    beta and warm-start the retained centers; the printed schedule divides beta by
    1.05 and uses 200 inner iterations in demonstrations. The weighting set remains
    the original observations, not an unweighted replacement by merged centers. For
    nominal cluster Q at its tracked center, fractional free energy M_Q(beta)=sum_(x
    in Q)P_y,beta(x) is a membership weight fraction. Choose a threshold M_T; a cluster
    is good where its fraction exceeds that threshold, and robustness is the corresponding
    range of logarithmic scales. Greedily select the most robust good cluster, remove
    its ancestors and descendants from consideration, and repeat. Observations not
    covered by selected clusters remain in a leftover set; complete coverage is hoped
    for in the source, not guaranteed. Threshold choice and tie handling affect the
    result. Stationary centers satisfy the weighted-mean equation for F=-log Z/beta,
    but not every fixed point is a local minimum or exponentially attracting. For
    points{-1,+1}, the update is tanh(2*beta*y): at beta=1, y=0 stays at an unstable
    free-energy maximum if initialized exactly there; at beta=0.5, the critical map
    tanh(y) has derivative one and no uniform local geometric rate. The one-dimensional
    bifurcation condition 2*beta*weighted_variance=1 does not establish higher-dimensional
    global cluster recovery. The printed merge step says more than two coincident
    clusters, while the surrounding prose describes two-cluster mergers; this record
    uses the intended two-or-more interpretation explicitly. Exact coincidence tolerance,
    robust tie policy and a universally adequate initial scale are not specified.
    Finite inner iteration does not certify convergence or finite exact tree completion.
    Selected synthetic and SAR demonstrations do not establish universal density/shape
    insensitivity, semantic cluster-count recovery or superiority to ISODATA under
    arbitrary initialization. Limitations: High initial beta is a data-dependent choice.
    Euclidean rotation invariance does not guarantee recovery of arbitrary anisotropic
    clusters. The method can be costly because each center uses all original points
    at many scales. The 1992 thesis, cited SAR original studies and Tam implementation
    report remain uninspected. Suggested continuation, grouping and adaptive-step
    speedups are not certified implementations here. No historical software, benchmark
    or source experiment was reproduced. Saved normalized finite calculations challenge
    bounded formula/prose claims, not the complete conditional convergence theorems.'
