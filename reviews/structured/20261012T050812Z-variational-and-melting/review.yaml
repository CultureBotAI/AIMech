  - variationalexpectationmaximization-source-0
  summary: 'This record denotes variational EM with point-estimated model parameters
    and an explicitly restricted latent-posterior family, as analyzed by Gunawardana-Byrne.
    It is not all variational inference, an inference-only fit with fixed model parameters,
    fully Bayesian parameter inference, an amortized architecture, or a particular
    score/pathwise gradient estimator. Mean-field factorization is one family choice
    rather than the definition. Exact global coordinate solves are the clean projection
    realization; partial numerical solves need their own progress conditions. No normalized
    match across all 442 pinned AIO labels/scoped synonyms and 480 native IDs/names/aliases,
    including GAM and VEM probes. Full-checkout searches include ignored and hidden
    files in worktree and main;59 and 61 matched lines reduce to 31 distinct text
    windows, all read. Hits denote topic-model fitting steps, prior frontier leads,
    unrelated GAM generalized-additive-model context or programming mnemonics. GAM
    is the joint distribution/parameter KL-descent framework, not GEM with its exact
    current E-step. Variational EM fits model parameters with a restricted posterior
    family; BBVI is a stochastic variational-gradient procedure, NVIL specifies amortized
    stochastic learning, and structured factorial-HMM inference is model-specific.
    Melting shares its fixed-bandwidth weighted-mean update with Gaussian mean shift;
    its named outer heating, membership tree and persistence selection supply the
    distinct scope. Bare GAM/VEM aliases are qualified. Absence is bounded to this
    snapshot, corpus and inspected semantic neighborhood. Identity-search counts:
    59 matched lines in the worktree and 61 in main; all 31 distinct matching-text
    windows were read, with ignored and hidden files included.'
  details: 'Choose a normalized tractable family q_lambda(z) on latent states compatible
    with observed x and a model p_theta(x,z). At fixed theta optimize F(lambda,theta)=E_q[log
    p_theta(x,z)-log q_lambda(z)], equivalently minimize KL(q_lambda||p_theta(z|x)).
    Then, holding q fixed, maximize its expected complete-data log likelihood over
    theta and repeat. Exact coordinate optima give the source’s restricted projection
    formulation; checked partial ascent steps give a generalized realization. The
    latent family, model support and finite expectations must be specified. The lower
    bound equals log p_theta(x)-KL(q_lambda||p_theta(z|x)). Bound ascent therefore
    does not generally imply observed-likelihood ascent or exact posterior recovery.
    At a differentiable interior fixed pair with a stationary parameter M-step, the
    observed log-likelihood gradient equals the theta gradient of that KL gap with
    q fixed. A zero gap is sufficient for the usual touching-bound argument, but zero
    gradient of the gap can also occur when the gap is positive; stationary error
    is not necessarily a local error minimum. The source’s broad claim that an independence
    approximation permits likelihood stationarity only in an exact-family degenerate
    case is not adopted as a general impossibility theorem. In the saved normalized
    counterexample, p_theta(y,z)=Bernoulli_theta(y)*r(z), fixed correlated r has probabilities(0.3,0.2,0.2,0.3),
    and the unique best product approximation is uniform. Its positive KL gap is independent
    of theta, so variational EM still attains the observed-data likelihood optimum.
    This qualifies the general prose without refuting the conditional GAM theorem.
    A mean-field fixed-point equation alone does not establish the global restricted
    E minimizer. The GAM convergence assumptions, including compactness, continuity,
    closed maps and sufficient strict progress, remain necessary for the cited conditional
    result. The printed fixed-q Boltzmann KL derivative has the opposite sign: the
    correct derivative is model moment minus q moment, although setting either sign
    to zero gives the same moment equation. Marginal independence of one pair does
    not alone imply a zero direct interaction when other latent paths can cancel its
    marginal association. Limitations: A restricted variational optimum is not automatically
    a stationary point of observed likelihood, a local maximum, a global optimum or
    an accurate posterior. Conversely, approximation error alone does not preclude
    likelihood stationarity. The broad family accommodates structured approximations;
    it does not equate the existing factorial-HMM procedure, BBVI, NVIL or topic models.
    No original Jordan 1999 chapter or uninspected implementation is claimed read.
    No historical software, benchmark or source experiment was reproduced. Saved normalized
    finite calculations challenge bounded formula/prose claims, not the complete conditional
    convergence theorems.'
