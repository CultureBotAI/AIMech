  summary: FedDyn Dynamic Regularization for Federated Learning is a distinct concept.
  details: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization,
    which penalizes (mu/2)||theta - theta^{t-1}||^2 without the dynamic linear gradient-alignment
    term -<nabla L_k(theta_k^{t-1}), theta>, so client minimizers do not align with
    theta* when nabla L_k(theta*) != 0), from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning,
    which doubles communication payload by transmitting control variate updates Delta
    c_i alongside model parameters), and from FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization).
    No pinned AIO class covers FedDyn.
