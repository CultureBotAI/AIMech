  summary: MARINA Faster Non-Convex Distributed Learning with Compression is a distinct
    concept.
  details: Distinct from DIANA (AIMech:DianaDistributedLearningWithCompressedGradientDifferences,
    which forms an unbiased gradient estimator by compressing g_i^k - h_i^k against
    stored per-worker shift vectors h_i^k and achieves worse O(omega/n + omega^{2/3}/n^{2/3})
    scaling in nonconvex optimization), from EF21 (AIMech:Ef21MarkovCompressorErrorFeedbackForHeterogeneousNonconvexOptimization,
    which supports biased contractive compressors without uncompressed synchronization
    rounds c_k = 1, whereas MARINA uses independent unbiased quantizers across workers
    to obtain a 1/sqrt(n) multi-node variance reduction factor), and from centralized
    PAGE/SARAH/SPIDER (AIMech:SARAHStochasticRecursiveGradientForFiniteSumOptimization
    and AIMech:SPIDERStochasticPathIntegratedDifferentialEstimatorForNonConvexOptimization,
    which do not compress worker-to-server communication). No pinned AIO class covers
    MARINA.
