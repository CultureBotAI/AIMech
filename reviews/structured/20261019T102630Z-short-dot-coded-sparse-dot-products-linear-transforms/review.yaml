  summary: Short-Dot Coded Sparse Dot Products for Straggler-Resilient Linear Transforms
    is a distinct concept.
  details: 'Distinct from Maximum Distance Separable (MDS) coded matrix-vector multiplication
    (Lee et al., 2015/2018, which requires K = M processors to finish but forces every
    processor to store and compute a full N-length dot product) and from Polynomial
    / MatDot / Entangled Polynomial Codes (AIMech:PolynomialCodesForStragglerResilientHighDimensionalCodedMatrixMultiplication,
    AIMech:MatDotAndPolyDotCodesForStragglerResilientCodedMatrixMultiplication, AIMech:EntangledPolynomialCodesForStragglerResilientDistributedMatrixMultiplication,
    which encode dense block submatrices of two matrices A and B): Short-Dot (Dutta,
    Cadambe, & Grover, NeurIPS 2016 / IEEE TIT 2019) jointly encodes M rows into P
    sparse vectors of length s = (N/P)(P - K + M) by solving for K - M padded rows
    Z that annihilate cyclic (K - M)-subsets of rows in B A_tilde, trading a slightly
    higher recovery threshold K >= M for shorter per-worker dot products, reduced
    worker memory, and reduced input communication.'
