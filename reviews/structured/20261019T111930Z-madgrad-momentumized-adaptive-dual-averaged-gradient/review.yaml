  summary: MADGRAD (Momentumized, Adaptive, Dual Averaged Gradient Method) is a distinct
    concept.
  details: 'Distinct from standard mirror-descent AdaGrad and DA-AdaGrad in four ways:
    (1) centering the dual-averaging proximity function at x_0 rather than the origin
    0 (inducing an implicit decaying regularizer (1 / (4 sqrt(k))) ||x_k - x_0||^2),
    (2) weighting gradients by lambda_k = gamma_k sqrt(k + 1) so the leading gradient
    weight remains constant during flat learning-rate phases, (3) replacing the square-root
    denominator with a cube-root denominator nu_{k+1}^{1/3} derived from an L2-norm
    hindsight penalty ||s||_2^2 <= c, and (4) incorporating momentum via inline iterate
    interpolation x_{k+1} = (1 - c_{k+1}) x_k + c_{k+1} z_{k+1}.'
