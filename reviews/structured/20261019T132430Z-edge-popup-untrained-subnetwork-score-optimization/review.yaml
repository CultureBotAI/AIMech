  summary: Edge-Popup Untrained Subnetwork Score Optimization is a distinct concept.
  details: Distinct from stochastic Bernoulli supermask sampling (Zhou et al., NeurIPS
    2019), which samples binary masks stochastically on every forward pass and suffers
    high gradient variance at scale, from Discovering Neural Wirings (DNW, Wortsman
    et al., NeurIPS 2019), which selects top-k% edges by weight magnitude while modifying
    the weights themselves, from Piggyback (AIMech:PiggybackBinaryWeightMaskMultiTaskAdaptation),
    which thresholds masks on ImageNet-pretrained backbones with a trained linear
    classifier head, and from SupSup (AIMech:SupSupSupermasksInSuperposition), which
    extends Edge-Popup to multi-task superposition and one-shot entropy-based task
    inference.
