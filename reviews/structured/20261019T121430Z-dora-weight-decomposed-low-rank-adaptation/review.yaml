  summary: Weight-Decomposed Low-Rank Adaptation (DoRA) is a distinct concept.
  details: Distinct from standard Low-Rank Adaptation (LoRA, Hu et al., 2022), which
    updates W' = W_0 + B A directly without column-wise directional normalization
    ||W_0 + B A||_c or an independent magnitude vector m, causing LoRA to exhibit
    a positive coupling between magnitude and directional changes that struggles to
    make fine-grained directional adjustments without simultaneous large magnitude
    shifts. Also distinct from Weight Normalization (Salimans & Kingma, 2016), which
    trains full weight matrices V from random initialization rather than freezing
    W_0 and adapting V via a low-rank increment Delta V = B A.
