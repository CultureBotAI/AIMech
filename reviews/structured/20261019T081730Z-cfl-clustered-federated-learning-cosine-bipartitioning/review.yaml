  summary: CFL (Clustered Federated Learning via Cosine Similarity Bipartitioning)
    is a distinct concept.
  details: Distinct from IFCA (AIMech:IfcaIterativeFederatedClusteringAlgorithm, Ghosh
    et al. 2020), which requires specifying a fixed number of clusters k upfront and
    broadcasts all k cluster models to every client in each round for minimum-loss
    cluster assignment, whereas CFL requires no prior knowledge of k, communicates
    only a single cluster model per client per round, and recursively splits clusters
    top-down at stationary points via gradient cosine-similarity minimax bipartitioning.
