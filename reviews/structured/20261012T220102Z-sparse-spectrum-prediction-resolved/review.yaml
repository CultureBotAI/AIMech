- assessment_id: identity
  area: identity
  topic: Retain two named prediction transforms
  outcome: supported
  target_ids:
  - AIMech:SparseSpectrumGaussianProcessExactMomentMatching
  - AIMech:SparseSpectrumGaussianProcessLinearizedPrediction
  evidence_ids:
