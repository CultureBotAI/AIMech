  summary: Ditto Fair and Robust Personalized Federated Multi-Task Learning is a distinct
    concept.
  details: Distinct from pFedMe (AIMech:PFedMePersonalizedFederatedLearningWithMoreauEnvelopes,
    where the global model w minimizes the sum of Moreau envelopes F_i(w) and therefore
    depends directly on the local personalized iterates theta_i, making w vulnerable
    to local personalization state changes and requiring extra inner-loop steps before
    updating w) and from q-FFL (AIMech:QFairFederatedLearningAlphaFairResourceAllocation,
    which learns a single global model w whose fairness-oriented reweighting of high-loss
    devices degrades robustness under Byzantine corruption).
