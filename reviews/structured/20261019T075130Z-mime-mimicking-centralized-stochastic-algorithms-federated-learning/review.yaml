  summary: Mime Framework for Mimicking Centralized Stochastic Algorithms in Federated
    Learning is a distinct concept.
  details: Distinct from SCAFFOLD (AIMech:ScaffoldStochasticControlledAveragingForFederatedLearning,
    which requires stateful clients to store persistent control variates c_i across
    rounds and fails when clients are stateless or sampled once), from FedDyn (AIMech:FedDynDynamicRegularizationForFederatedLearning,
    which also requires stateful client gradient vectors), and from FedNova (AIMech:FedNovaNormalizedAveragingForHeterogeneousFederatedOptimization,
    which normalizes local step lengths rather than freezing server optimizer statistics
    s_{t-1} and applying cross-device SVRG control variates). No pinned AIO class
    covers Mime or stateless cross-device optimizer mimicking.
