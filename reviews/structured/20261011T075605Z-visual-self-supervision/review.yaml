assessments:
- assessment_id: simclr
  area: evidence
  topic: Identity, mechanism, source scope, limitations and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:SimCLR
  evidence_ids:
  - identity
  - mapping
  - simclr-source
  summary: This is the original 2020 SimCLR procedure, not a particular ResNet checkpoint,
    the general contrastive-learning category or SimCLR v2. It uses current-batch
    views and a shared gradient-trained encoder/projection head, rather than a queue
    of historical keys or a momentum target encoder. No normalized identity match
    was found across all 442 pinned AIO labels/scoped synonyms and 187 prior native
    IDs/names/aliases. Ignored-inclusive searches of both full checkouts found no
    discovery-checkout hits and nine unrelated main-environment substrings (Pygments
    and Sphinx locale/bundle text). Exact neighboring AIO definitions, synonyms and
    incident edges were inspected; task/network vocabulary does not make these algorithms
    equivalent.
  details: 'For a minibatch of N≥2 images, independently augment each image twice
    to obtain 2N views. Encode each with the same f and nonlinear projection head
    g, giving z_i=g(f(v_i)). With nonzero projected vectors and temperature tau>0,
    set s_ik=z_i^T z_k/(||z_i|| ||z_k||). For anchor i and its paired view j, use
    loss ell(i,j)=−log[exp(s_ij/tau)/sum_(k≠i) exp(s_ik/tau)]. The denominator contains
    the positive j and the 2N−2 other-image views, while excluding i itself. Average
    over all 2N directed positive pairs and update both f and g by gradients. After
    pretraining, discard g and use the representation before projection from f for
    downstream learning. Limitations: The source’s image realization composes crop/resize/flip,
    color distortion and Gaussian blur. These choices determine the prediction task;
    an augmentation policy may remove information needed downstream. Views from other
    images serve as negatives by construction, not by verified semantic dissimilarity.
    This does not establish class labels or guarantee that semantically related images
    never oppose one another. The source uses global batch normalization to mitigate
    same-device information leakage between positive views. Distributed normalization
    and optimization choices matter to reproducing its experiments. Projection normalization
    requires meaningful nonzero vectors and numerically stable loss evaluation. Batch
    size, temperature, architecture and training schedule affect the procedure’s empirical
    behavior. Reported ImageNet and transfer comparisons are context-specific. No
    universal performance advantage, mutual-information explanation, trained checkpoint
    or reproduced benchmark is asserted.'
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specified representation-learning procedure, not a checkpoint or
      reported benchmark outcome.
    evidence_ids:
    - simclr-source
  - name: aio-assessment
    value: 'related_match: AIO:SelfsupervisedLearning; related_match: AIO:ContrastiveLearning'
    definition: This is an algorithm for learning representations from relationships
      between unlabeled views. The pinned AIO target is a MachineLearningTask; this
      is a related algorithm-to-task mapping, not equivalence or an is-a assertion.
      The algorithm implements positive/negative representation comparisons. The pinned
      AIO target is exported beneath DeepNeuralNetwork; this related mapping preserves
      the algorithm versus network/approach distinction rather than asserting equivalence
      or subclass membership.
    evidence_ids:
    - identity
    - mapping
- assessment_id: momentumcontrast
  area: evidence
  topic: Identity, mechanism, source scope, limitations and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:MomentumContrast
  evidence_ids:
  - identity
  - mapping
  - momentumcontrast-source
  summary: This is original MoCo from the 2020 paper, with its image instance-discrimination
    realization. The momentum acts on encoder parameters, not on per-example memory-bank
    embeddings. It is distinct from MoCo v2/v3 and from large-batch end-to-end contrastive
    training. No normalized identity match was found across all 442 pinned AIO labels/scoped
    synonyms and 187 prior native IDs/names/aliases. Ignored-inclusive searches of
    both full checkouts found no discovery-checkout hits and nine unrelated main-environment
    substrings (Pygments and Sphinx locale/bundle text). Exact neighboring AIO definitions,
    synonyms and incident edges were inspected; task/network vocabulary does not make
    these algorithms equivalent.
  details: 'Initialize key-encoder parameters from the query encoder and maintain
    a finite FIFO queue of K≥1 encoded keys. For each image draw two augmented views,
    form normalized query q and current positive key k+, and use loss −log[exp(q·k+/tau)/(exp(q·k+/tau)+sum_(k
    in queue)exp(q·k/tau))] with tau>0. Stop gradients through the key outputs and
    queue; update the query encoder from the minibatch loss. In paper Algorithm 1,
    next update key parameters as theta_k←m theta_k+(1−m)theta_q, m in [0,1), enqueue
    the keys already computed for this batch, and remove the oldest batch to maintain
    the queue. The queue decouples dictionary size from current minibatch size; the
    momentum encoder reduces changes between key representations created at different
    iterations. Limitations: Queued keys were encoded at different parameter states.
    A slow update aims to improve consistency; it does not make historical keys identical
    to recomputed current-encoder outputs. The image realization treats different
    images as negatives. This is instance discrimination, not verification that all
    negative pairs belong to different semantic classes. The paper’s distributed ResNet
    implementation shuffles the key minibatch across GPUs and restores correspondence
    after encoding to reduce batch-normalization leakage. Other normalization choices
    need their own reproduction checks. The displayed algorithm abstracts queue initialization
    and requires a valid finite dictionary. Temperature, queue length, momentum and
    augmentation are tuning choices; no single setting is universally optimal. This
    record specifies the original paper’s update order and scope. It does not import
    later MoCo variants, claim independent samples, or reproduce benchmark training.'
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specified representation-learning procedure, not a checkpoint or
      reported benchmark outcome.
    evidence_ids:
    - momentumcontrast-source
  - name: aio-assessment
    value: 'related_match: AIO:SelfsupervisedLearning; related_match: AIO:ContrastiveLearning'
    definition: This is an algorithm for learning representations from relationships
      between unlabeled views. The pinned AIO target is a MachineLearningTask; this
      is a related algorithm-to-task mapping, not equivalence or an is-a assertion.
      The algorithm implements positive/negative representation comparisons. The pinned
      AIO target is exported beneath DeepNeuralNetwork; this related mapping preserves
      the algorithm versus network/approach distinction rather than asserting equivalence
      or subclass membership.
    evidence_ids:
    - identity
    - mapping
- assessment_id: bootstrapyourownlatent
  area: evidence
  topic: Identity, mechanism, source scope, limitations and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:BootstrapYourOwnLatent
  evidence_ids:
  - identity
  - mapping
  - bootstrapyourownlatent-source
  - bootstrapyourownlatent-source-1
  summary: BYOL is the 2020 online/target learning procedure, not statistical bootstrap
    resampling or a particular trained network. Only the online branch has the prediction
    head. Its normalized regression objective has no explicit negative-pair term or
    historical key queue. No normalized identity match was found across all 442 pinned
    AIO labels/scoped synonyms and 187 prior native IDs/names/aliases. Ignored-inclusive
    searches of both full checkouts found no discovery-checkout hits and nine unrelated
    main-environment substrings (Pygments and Sphinx locale/bundle text). Exact neighboring
    AIO definitions, synonyms and incident edges were inspected; task/network vocabulary
    does not make these algorithms equivalent.
  details: 'Generate two augmented views v and v′ of each image. The online branch
    computes p(v)=q_theta(g_theta(f_theta(v))), and the target branch computes z_xi(v′)=g_xi(f_xi(v′)).
    Normalize both nonzero vectors and minimize their squared distance, plus the reversed-view
    term p(v′) versus z_xi(v), averaged over the batch. Stop gradients at target projections
    and optimize only the online encoder, projector and predictor. After the optimizer
    step update the corresponding target encoder/projector parameters by xi←tau xi+(1−tau)theta
    with tau in [0,1] and a chosen decay schedule. The target branch has no predictor
    to update. After training retain the online encoder f_theta and discard the training
    heads and target branch for the stated downstream representation. Limitations:
    The paper’s general same-architecture wording is qualified by its explicit online-only
    predictor in Figure 2 and the algorithm. Matching encoder/projector weights are
    averaged; a nonexistent target predictor is not required. Absence of an explicit
    negative-pair term does not prove collapse impossible. The source’s conditional-variance
    explanation assumes an optimal predictor and simplified unnormalized, unsymmetrized
    dynamics; it is an intuition, not a general convergence theorem. Batch normalization
    still couples examples. The batch-size ablation also accumulates gradients to
    control effective update size; it does not establish unconditional batch-size
    independence. Augmentation, normalization, predictor design and target-decay schedule
    affect training. tau=1 freezes the target and tau=0 copies the online parameters;
    these endpoints do not by themselves reproduce the usual slow-target regime. Vector
    normalization needs a defined nonzero-norm numerical treatment. No universal transfer
    benefit, benchmark reproduction or model checkpoint is asserted.'
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A specified representation-learning procedure, not a checkpoint or
      reported benchmark outcome.
    evidence_ids:
