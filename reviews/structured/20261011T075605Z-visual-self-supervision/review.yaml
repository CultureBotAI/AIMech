- assessment_id: dinoselfdistillation
  area: evidence
  topic: Identity, mechanism, source scope, limitations and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:DINOSelfDistillation
  evidence_ids:
  - identity
  - mapping
  - dinoselfdistillation-source
  - dinoselfdistillation-source-1
  summary: This is Caron et al.’s 2021 DINO self-distillation method, supporting both
    vision-transformer and convolutional backbones. It is not the later DINO object
    detector, DINOv2/v3, or a particular checkpoint. The bare acronym is not asserted
    as an unqualified alias. Its same-architecture student/teacher branches differ
    from BYOL’s online-only predictor and normalized vector regression. No normalized
    identity match was found across all 442 pinned AIO labels/scoped synonyms and
    187 prior native IDs/names/aliases. Ignored-inclusive searches of both full checkouts
    found no discovery-checkout hits and nine unrelated main-environment substrings
    (Pygments and Sphinx locale/bundle text). Exact neighboring AIO definitions, synonyms
    and incident edges were inspected; task/network vocabulary does not make these
    algorithms equivalent.
  details: 'Initialize teacher parameters from the student and a center c=0. Generate
    two global crops and optional local crops from each image; the teacher sees the
    global crops and the student sees all crops. For raw K-dimensional outputs g,
    use P_s(v)=softmax(g_s(v)/tau_s) and P_t(v)=softmax((g_t(v)−c)/tau_t), with positive
    temperatures and a sharpened teacher distribution. Average cross-entropy −sum_i
    P_t(v)_i log P_s(v′)_i over teacher global crops and student crops of the same
    image, excluding the identical view, and average over images in the minibatch.
    Stop gradients through P_t, update student parameters by the loss, and update
    teacher parameters by theta_t←lambda theta_t+(1−lambda)theta_s, with lambda in
    [0,1]. Update c by an exponential moving average with center momentum in [0,1)
    of the raw teacher outputs over all global views in the distributed batch for
    use on subsequent batches. Both branches share backbone and projection-head architecture;
    downstream features are taken from the backbone before the head. Limitations:
    The centering prose on printed p. 9653 says to add c, whereas Algorithm 1 subtracts
    the running center. The pinned author implementation also subtracts it; this record
    follows the algorithm and implementation and preserves the discrepancy. The teacher
    is updated from the student, not supplied as an independently trained larger model.
    Its output coordinates are learned representation probabilities, not verified
    semantic class labels. Centering and sharpening are empirical collapse-control
    choices, not a proof that all initializations, temperatures, momentum schedules
    or datasets avoid collapsed representations. A larger number of local crops changes
    the cross-view objective. The two-view pseudocode is a specialization; losses
    exclude the teacher/student pair from the identical crop. The pinned implementation
    uses zero center initialization, distributed raw-output averaging and matched
    initial student/teacher weights. Its specific default temperature schedule differs
    from the paper’s reported experimental schedule; this record does not equate all
    defaults. No DINO detector mechanism, later DINO variant, segmentation accuracy
    claim, trained checkpoint or executed benchmark is asserted.'
