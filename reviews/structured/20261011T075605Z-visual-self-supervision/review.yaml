- assessment_id: current-batch-versus-queue
  area: scope
  topic: Contrastive dictionary and encoder update boundaries
  outcome: supported
  target_ids:
  - AIMech:SimCLR
  - AIMech:MomentumContrast
  evidence_ids:
  - simclr-source
  - momentumcontrast-source
  - mapping
  summary: Retain SimCLR and original MoCo as distinct procedures.
  details: SimCLR includes the current positive and other-image views but excludes
    the anchor from its denominator, averaging all directed positive pairs. Both shared
    encoder and projection head receive gradients, and downstream features precede
    the head. MoCo instead has one current positive plus a historical FIFO negative
    dictionary, a stopped key branch and EMA key parameters. Paper Algorithm 1 updates
    query parameters then key parameters, then enqueues already-computed keys. Queue
    initialization is abstracted by the source and is not invented. Neither negative
    construction guarantees semantic class separation. Their shared contrastive objective
    does not establish equivalence.
- assessment_id: regression-versus-probability-distillation
  area: scope
  topic: BYOL predictor and DINO centered teacher distribution
  outcome: supported
  target_ids:
  - AIMech:BootstrapYourOwnLatent
  - AIMech:DINOSelfDistillation
  evidence_ids:
