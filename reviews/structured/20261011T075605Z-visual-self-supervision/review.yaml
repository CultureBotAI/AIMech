  - bootstrapyourownlatent-source-1
  - dinoselfdistillation-source
  - dinoselfdistillation-source-1
  - mapping
  summary: Retain BYOL and DINO self-distillation as distinct methods.
  details: BYOL symmetrizes normalized prediction-to-target regression and has an
    online-only predictor. Its target encoder/projector are EMA updated after online
    optimization. DINO has matching backbone/head architecture without a separate
    predictor, cross-entropy between probability outputs, a teacher restricted to
    global crops, and same-view exclusions. Pinned code averages loss over images
    and valid crop pairs; its center is a distributed mean of raw teacher logits,
    updated for the next forward evaluation. The source prose adds c, whereas Algorithm
    1 and pinned code subtract the stored running mean. The record follows the latter
    and discloses the discrepancy. Teacher-temperature parser defaults differ from
    the experimental paper schedule and even the warmup help string; no universal
    default is asserted. Neither collapse-control construction is promoted into a
    general noncollapse theorem.
