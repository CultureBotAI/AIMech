  summary: Supported within the stated assumptions and inspected passages.
  details: 'The operational update accepts to (y,p) and rejects to (x,-p). The ratio
    pi(y)/pi(x) cancels a common normalizer. A zero-density proposal is rejected with
    a sign reversal, not clipped, reflected or resampled. A negative control that
    keeps the sign on both outcomes fails the augmented uniform-target balance: at
    x=1/4 with sigma=1 on[0,1], incoming plus-sign density is approximately 0.325333678
    rather than1/2. This example audits the sign rule; it is not an author experiment
    or a performance measure.'
- assessment_id: two-stage-invariance-construction
  area: evidence
  topic: two-stage-invariance-construction
  outcome: supported
  target_ids:
  - AIMech:GustafsonGuidedWalkMetropolis
  evidence_ids:
  - gustafson1998
  - calculation
  summary: Supported within the stated assumptions and inspected passages.
  details: 'The first-stage augmented proposal(x,p)->(x+p*abs(z),-p) is symmetric
    because the reversed sign points back with the same half-normal density. MH preserves
    pi(x)/2; unconditional sign negation preserves the uniform sign factor. The independent
    incoming-flow derivation gives accepted density A_p(x)/2 plus rejection density
    [pi(x)-A_p(x)]/2, exactly pi(x)/2. The displayed continuous cancellation is analytic;
    the numerical erf value is only a bounded illustration. Dropping the final flip
    from this two-stage representation leaves a different valid reversible MH kernel,
    whereas keeping the operational sign on both outcomes is the invalid negative
    control. The composed guided walk can be nonreversible: rightward accepted plus-sign
    moves have no direct reverse with unchanged plus sign. None of this establishes
    a general convergence rate or all-target ergodicity theorem.'
