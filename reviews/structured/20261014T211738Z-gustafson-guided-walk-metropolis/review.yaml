limitations:
- Author self-review, not independent scientific approval or DRAFT promotion.
- No general Harris-recurrence or mixing-rate theorem, adaptive-scale validity, universal
  efficiency, author simulation replication or complete simultaneous-vector algorithm.
  Disconnected density support alone is not evidence of reducibility because half-normal
  jumps are unbounded; no such counterexample was established. Sigma=0 is outside
  the definition. The position projection retains sign memory and is not automatically
  the same Markov chain as ordinary random-walk MH.
- The exact continuous-flow identity concerns joint stationarity; a one-step position
  marginal alone is an insufficient check of the stored-sign rule.
- The numerical erf illustration is labeled floating evaluation of an analytic identity,
  not a finite exact half-normal transition matrix or a benchmark.
- A primary source inconsistency is preserved as a limitation, not silently corrected
  into an optimal-acceptance claim.
