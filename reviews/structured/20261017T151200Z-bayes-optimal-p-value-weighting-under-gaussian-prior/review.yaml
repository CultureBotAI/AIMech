  summary: Retain Bayes optimal p-value weighting under a Gaussian prior on the effect
    sizes as a distinct DRAFT mathematical_method.
  details: BayesOptimalPValueWeightingUnderGaussianPrior solves the non-convex static
    p-value weighting problem under uncertain Gaussian effect-size priors mu_i ~ N(eta_i,
    sigma_i^2) with marginal variance gamma_i^2 = sigma_i^2 + 1 > 1 via exact quadratic-root
    critical values c_1(eta_i, gamma_i; lambda) for lambda >= 1 (Theorem 3.2) and
    O(J log J) jump-discontinuity search over k_i in [l(eta_i, gamma_i), 1] for lambda
    < 1 (Theorem 3.5), whereas OptimalMultiWeightedStepUpProcedureForFDRControl (Roquain
    & van de Wiel 2009) constructs threshold-varying weight functions W*(u) under
    strictly concave known F_i.
