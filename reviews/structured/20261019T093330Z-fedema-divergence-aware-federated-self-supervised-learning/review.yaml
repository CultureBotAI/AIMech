  summary: FedEMA (Federated Divergence-Aware Exponential Moving Average Update for
    Self-Supervised Learning) is a distinct concept.
  details: Distinct from MOON (AIMech:MoonModelContrastiveFederatedLearning, Li et
    al. 2021), which adds a supervised model-contrastive representation loss between
    local and global encoders on labeled client data rather than performing unlabeled
    Siamese self-supervised learning with L2-divergence-scaled exponential moving
    average parameter interpolation; and distinct from APFL (AIMech:ApflAdaptivePersonalizedFederatedLearningViaConvexGlobalLocalModelInterpolation,
    Deng et al. 2020), which learns a gradient-updated mixing scalar alpha_i between
    separate global and local supervised models rather than dynamically setting the
    online-network EMA decay rate mu = min(lambda_k ||W_g^r - W_k^{r-1}||_2, 1) from
    encoder L2 divergence in Siamese self-supervised learning.
