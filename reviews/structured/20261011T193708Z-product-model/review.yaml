  summary: All 88 semantic label/synonym hits and 20 exact fully annotated AIO nodes
    with outgoing edges were read. Corresponding generated records were fully read
    (five) or byte-verified unchanged after prior full reading (15); four native neighbors
    were fully read. The only normalized candidate hit is Product of experts as a
    related synonym of FactorizedLLM. Its language-specific definition and parent
    do not identify the generic product family. PoE has a narrow match to RBM because
    the primary source explicitly derives RBMs as a special case; the direction means
    the target is narrower. PoHMM relates to MarkovChain components and the task-scoped
    ProbabilisticGraphicalModel rather than forced is-a assertions. Logarithmic pooling
    relates to EnsembleLearning as an expert-probability aggregation method without
    guaranteeing its improvement aim. BayesianNetwork is directed, CausalGraphicalModel
    requires causal assumptions, ProbabilisticHiddenLayer is a layer, PoolingLayer
    spatially downsamples, and TrainingStrategy is preprocessing in this pin. FactorizedLLM,
    FactoredLanguageModel, MixtureofExpertsLLM, EnergyBasedLLM and ImplicitLanguageModel
    have language-specific or different factorization/routing scopes. Generic products
    need not be neural networks or Boltzmann machines. ProbabilisticTopicModel is
    text-topic-specific. SupervisedLearning, UnsupervisedLearning and MachineLearningTask
    denote tasks, not these model or probability-combination identities. Native HMM
    provides the component model, SAGE a particular additive log text model, MDN an
    arithmetic conditional mixture, and CD a parameter-learning algorithm. Context
    inspection does not newly scientifically approve preceding records.
