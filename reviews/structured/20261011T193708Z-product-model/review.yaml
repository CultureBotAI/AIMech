  summary: Retain PoHMM as a distinct normalized product sequence model.
  details: A two-expert finite example has different global normalizers at sequence
    lengths one and two. Complete-observation latent posterior factorization and Gibbs
    stationarity hold to below 6e-17, while integrating out an observation creates
    a 0.07322 dependence discrepancy. Locally normalizing emission products while
    retaining independent chain priors gives a different directed model, with visible-probability
    discrepancy 0.10437. The global log-score derivative agrees with central differences
    to 7.94e-12. The Brown posterior-expectation derivative notation is interpreted
    as the expectation of a score with posterior weights held fixed; source pseudocode
    probability/log-probability slips are qualified.
