  details: 'For observations x, form p(x)=product_m f_m(x;theta_m)/Z(theta), with
    Z the sum or integral of the product over x and 0<Z<infinity. Expert factors may
    be unnormalized; multiplying one by a positive x-independent constant cancels
    in the final normalization. For parameters local to expert m, the exact log-likelihood
    derivative is its log-factor derivative at the data minus the expectation of that
    derivative under the full product model. In the latent-expert construction, f_m(x)=sum_hm
    f_m(x,h_m), and separate expert hidden variables are conditionally independent
    given a completely observed x, allowing separate inference when each expert is
    tractable. This does not imply independence of observed coordinates or independence
    of experts after some observations are marginalized. Restricted Boltzmann machines
    instantiate the family with one expert per hidden unit, whereas product HMMs use
    complete HMM sequence distributions as factors. Limitations: The normalizer must
    be finite and positive. Continuous expert densities being individually normalized
    does not alone guarantee that their product is integrable; nonoverlapping supports
    can also make normalization impossible. Tractable inference within each expert
    does not make the product normalizer, model sampling or likelihood learning automatically
    tractable. Exact likelihood derivatives involve the full product distribution;
    short-chain CD is a distinct approximate learning procedure. Experts need not
    use disjoint input dimensions, be individually well fitted, or produce a sharper
    or better calibrated distribution in every setting. A product of Gaussian factors
    remains Gaussian when well defined, so Gaussian factors alone do not represent
    arbitrary multimodality. Conditional independence is between separate latent expert
    states given all modeled observations. Missing observations can couple the experts.
    The original architecture is not defined by a sparse router or an arithmetic average
    of expert predictions. Unit exponent products and geometric opinion averages are
    not interchangeable: multiplying duplicate factors can sharpen a distribution,
    while identical distributions pooled with exponent weights summing to one remain
    unchanged. No empirical advantage or author implementation is certified.'
