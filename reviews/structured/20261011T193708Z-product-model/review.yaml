  - finite-conventions
  - productofexperts-source-0
  - productofexperts-source-1
  summary: This record denotes the general normalized-product construction, including
    latent-variable experts, rather than an arithmetic mixture, a training algorithm
    or a language-model-specific factorization. The original cooperative-learning
    setting does not require experts to be separately trained. AIO FactorizedLLM has
    Product of experts as a related synonym, but its definition and parent restrict
    it to large language models; that related synonym does not identify the general
    family. Logarithmic opinion pooling uses normalized exponent weights and has a
    separate aggregation scope. All 442 pinned AIO labels/scoped synonyms and 373
    preceding native IDs/names/aliases were compared. The sole normalized hit is Product
    of experts as a related synonym of FactorizedLLM; its language-specific definition
    and parent distinguish it from the generic candidate. Both full-checkout fixed-string
    searches included ignored and hidden files and returned 59 lines each. All 29
    unique matched contents were read; other hits concern citations, training components,
    prior boundary discussions or pending leads. All 88 semantic label/synonym hits,
