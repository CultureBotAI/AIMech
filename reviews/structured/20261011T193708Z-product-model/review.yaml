  rationale: PoE is the general normalized-product model family. PoHMM specializes
    its experts to complete HMM sequence distributions with a length-dependent global
    normalizer. Logarithmic opinion pooling aggregates probability assessments with
    exponent weights summing to one. Their related algebra does not make model specialization
    and probability aggregation identical, nor does a language-model related synonym
    provide generic equivalence. Retain all three explicit scopes and directional
    AIO mappings.
