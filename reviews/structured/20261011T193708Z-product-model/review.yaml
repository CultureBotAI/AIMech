- evidence_id: finite-conventions
  kind: record_content
  reference: research/discovery/product-model-boundaries.py
  locator: Product versus geometric pooling; KL identities and common likelihood updates;
    HMM normalization, conditional independence, Gibbs invariance, score derivatives
    and tempering
  accessed_at: '2026-10-11T19:32:35Z'
  snapshot_sha256: 845a1884c795f3e3470aefba17ff049681a713ea446216b327c2275167f269e8
  support: supports
  summary: Original finite probability calculations distinguish unweighted products
    from normalized geometric pooling, verify the KL decomposition with A=-logZ, identical-expert
    invariance, zero veto and common-likelihood update commutation. A two-expert,
    two-state, length-two PoHMM has normalizers0.443 and0.209916 at lengths one and
    two. Its complete-observation hidden posterior factorizes to2.78e-17, and the
    enumerated blocked Gibbs kernel preserves its visible distribution to5.56e-17.
    Marginalizing an observation creates a0.07322 factorization discrepancy. The global
    likelihood score agrees with central differences to7.94e-12. A locally normalized
    directed emission construction differs by0.10437, and emission-only tempering
    differs from powers of whole marginals by0.03266. These are mathematical witnesses,
    not training, AIS execution or benchmark reproduction.
