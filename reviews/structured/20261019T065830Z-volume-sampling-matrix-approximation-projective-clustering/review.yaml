  summary: Volume Sampling for Matrix Approximation and Projective Clustering is a
    distinct concept.
  details: Distinct from Relative-Error CUR Matrix Decomposition via Subspace Leverage
    Sampling (`AIMech:RelativeErrorCURMatrixDecompositionViaSubspaceLeverageSampling`),
    which samples O(k log k / epsilon^2) columns/rows i.i.d. using precomputed SVD
    leverage scores rather than joint k-subset volume sampling of exactly k rows with
    multiplicative factor (k + 1), and from k-Determinantal Point Processes for Fixed-Size
    Subset Selection (`AIMech:KDeterminantalPointProcessesForFixedSizeSubsetSelection`),
    which addresses exact two-phase sampling and conditional L-ensemble inference
    in machine learning rather than the Cauchy-Binet ratio bound E[||A - pi_{H_S}(A)||_F^2]
    <= (k+1)||A - A_k||_F^2, Proposition 4.1 simplex lower bound, and projective clustering
    PTAS of Deshpande et al. (2006).
