  details: Distinct from HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning,
    Diao et al. 2021), which trains each client only at its single static capability
    width p_max^i rather than stochastically sampling all prefix widths p <= p_max^i
    via Ordered Dropout and self-distillation to enforce SVD-ordered representation
    importance across nested submodels.
