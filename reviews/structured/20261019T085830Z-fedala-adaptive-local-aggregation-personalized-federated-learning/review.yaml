  summary: FedALA (Adaptive Local Aggregation for Personalized Federated Learning)
    is a distinct concept.
  details: Distinct from APFL (Adaptive Personalized Federated Learning, Deng et al.
    2020), which mixes a separately trained local model and global model using a single
    scalar mixing coefficient alpha_i in [0, 1] after or parallel to full-model training;
    and distinct from FedPer (AIMech:FedPerFederatedLearningWithPersonalizationLayers)
    and FedRep (AIMech:FedRepSharedRepresentationPersonalizedFederatedLearning, Collins
    et al. 2021), which hard-code binary layer splits (sigma in {0, 1}) and discard
    all global information in the personalized head layers rather than learning element-wise
    [0, 1]-clipped pre-training initialization masks W_i^p.
