  summary: Exact Diffusion (Adapt-Correct-Combine Distributed Optimization) is a distinct
    concept.
  details: Distinct from EXTRA (Shi et al. 2015) and D2 (AIMech:D2VarianceReducedDecentralizedTrainingOverHeterogeneousData,
    Tang et al. 2018), which apply a Combine-Then-Adapt (CTA) update without mixing
    the gradient difference through bar_A^T and require symmetric doubly stochastic
    matrices, whereas Exact Diffusion uses an Adapt-Then-Combine structure W_i = bar_A^T
    (2 W_{i-1} - W_{i-2} - M(nabla J^o(W_{i-1}) - nabla J^o(W_{i-2}))) (Eq. 103) that
    operates directly on non-symmetric locally balanced left-stochastic combination
    policies without known Perron eigenvectors when q_k = p_k.
