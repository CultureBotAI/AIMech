  summary: Enumerated 32 DCM-LDA states and verified 160 fixed-parameter collapsed
    conditionals; identical words integrate to 1/3 within a shared book emission versus
    1/4 across books. Verified the base-two Jensen-Shannon shared-support identity
    and its logarithm-dependent disjoint-support constant. A proper two-token, two-supertopic
    PAM special case has exact target (1/3,1/6,1/6,1/3); the full sweep preserves
    it but a subsequent pruned sweep changes it to (13/27,1/54,1/54,13/27), total
    variation 8/27. A full sweep has positive reachability between every pair of states,
    showing why reachability alone does not certify invariance. The displayed moment
    rule gives alpha=(1/8,1/8) for uniform-Beta moments rather than the consistent
    (1,1). Nine-state categorical/Gaussian EFH checks preserve probabilities under
    orthogonal rotations and compensated category shifts. Gaussian coupling 1.2 yields
    a negative joint precision eigenvalue despite proper unit-variance conditionals;
    positive Poisson coupling has divergent diagonal mass. These are curator calculations,
    not author-code or empirical reproduction.
