- assessment_id: exponentialfamilyharmonium
  area: evidence
  topic: Identity, definition, inference interpretation, limitations and mappings
  outcome: supported
  target_ids:
  - AIMech:ExponentialFamilyHarmonium
  evidence_ids:
  - identity
  - mapping
