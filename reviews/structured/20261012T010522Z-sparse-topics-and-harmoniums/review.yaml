  - sparsepachinkoallocationinference-source-0
  summary: Scoped to the sparse PAM inference techniques in Li and McCallum's submitted
    2008 manuscript, particularly Sections 3.2.2-3.2.3. This is an algorithm for the
    already represented PAM model, with an LDA specialization, rather than a new dense
    probability-model identity. Sparse count-block storage is an exact implementation
    choice; deleting candidate paths from a Gibbs conditional is an approximation.
    The source calls its settings sparse PAM/sPAM and sparse LDA/sLDA; these names
    are not asserted aliases of every later sparse-LDA algorithm. No normalized candidate
    identity matched all 442 pinned AIO IDs, labels and scoped synonyms or 441 preceding
    native IDs, names and aliases. Full-checkout searches included ignored and hidden
    files in both checkouts; twelve matching lines per checkout came from five unique
    prior discovery-ledger contents and the existing GCA mapping rationale. All matching
    excerpts were read. All 205 semantic label/synonym hits and 21 annotated AIO nodes
    with outgoing edges were byte-verified against prior readings. Thirty contextual
    YAMLs comprise 27 unchanged prior readings, two fully read final native targets
    verified against saved review inputs, and a fully read Metropolis-Hastings record.
    No candidate record is present within this bounded pinned-snapshot and maintained-corpus
    search.
  details: 'For a document, collect its currently used supertopics C and subtopics
    C-prime. Remove a token''s old assignment, form the union of document subtopics
    and subtopics with positive corpus counts for that token''s word, and restrict
    new paths to C times that union. Renormalize the usual collapsed path weights
    on this candidate set, sample an assignment and update counts and active sets.
    The source initializes document sets before token removal; precise membership
    maintenance must preserve a defined candidate set. Zero count-block storage alone
    does not remove the positive prior mass of unoccupied paths. Pruned updates cannot
    introduce a supertopic absent from the document. Alternating with full sampling
    restores possible routes into omitted states, but does not by itself preserve
    the exact target distribution: the pruned kernel need not leave that target invariant.
    In a two-token, two-supertopic PAM special case, the target over assignments is
    (1/3,1/6,1/6,1/3); one full sweep followed by one pruned sweep changes it to (13/27,1/54,1/54,13/27).
    The reported average 98 percent retained conditional mass is a local empirical
    statistic, not a bound on the final posterior error. No acceptance correction
    is provided. Sparse initialization fits a small document subset before gradually
    adding documents. A new document permits all supertopics; an already seen word
    permits subtopics with positive corpus word counts, while a previously unseen
    word permits all subtopics. The sparse-LDA experiment starts with 10000 documents
    and doubles the corpus every five iterations. Multiple chains are also used. Separate
    empirical-moment hyperparameter updates change the sampling target during fitting;
    the displayed Dirichlet formula divides by an aggregated concentration expression
    rather than following the usual alpha_j=mean_j*concentration identity, so that
    display is not adopted as a verified implementation recipe. Limitations: The complete
    schedule of full versus pruned updates and all active-set edge cases are not specified.
    Fixed valid hyperparameters permit analysis of the transition rule; corpus growth,
    empirical-moment adaptation and heuristic pruning do not jointly certify an exact
    stationary posterior sampler. The displayed moment update also needs valid variance
    and logarithm domains. A uniform Beta example has moment-consistent alpha=(1,1),
    whereas the literal displayed aggregation gives (1/8,1/8). This is a qualification
    of the printed formula, not a claim about uninspected author code. AP/SJMN retrieval
    and large Rexa experiments use particular topic counts, chain combinations, initialization
    and hardware. Non-significant tests between best retrieval results do not establish
    posterior equivalence. Dense-PAM human judgment, likelihood and classification
    experiments are separate from evidence about sparse inference. The retrieval scorer
    averages plug-in word probabilities across chains before multiplying query terms
    and mixes them termwise with a smoothed document model. It is not automatically
    the average whole-query posterior predictive law. Finite transition checks do
    not reproduce the author implementation or benchmark.'
