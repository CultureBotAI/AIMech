limitations:
- Adversarial author self-review only; all three records remain DRAFT.
- All 50 pages of three primary PDFs were visually read, including equations, tables,
  figures and bibliographies. DCM-LDA uses printed and PDF locators; sparse PAM printed
  pages 2-32 equal PDF pages; EFH uses PDF pages. No author-code execution is asserted.
- DCM-LDA is the inspected JCDL2007 version. Sparse PAM is the author-hosted submitted
  2008 manuscript with unresolved publication placeholders. EFH is the official NIPS2004
  paper. Alternative draft and later versions are not certified equivalent.
- DCM-LDA book-specific emissions differ from corpus-shared LDA emissions; its clustering
  and topic-selection fitting approximations are explicit. Sparse storage is distinguished
  from support pruning, and full/pruned alternation is not certified target-invariant.
  EFH requires a proper joint normalizer, not merely locally proper conditionals.
- Printed moment-update qualifications, approximate CD, incomplete sampling schedules,
  retrieval scoring conventions and selected empirical evaluations remain explicit.
  No uninspected implementation defect or universal performance guarantee is alleged.
- Thirteen new provisional cohorts leave 320 pending leads plus other unresolved dispositions.
  Generic EFH partially addresses the harmonium cohort; other modalities and author-index
  extensions remain unresolved. All three additions remain DRAFT.
