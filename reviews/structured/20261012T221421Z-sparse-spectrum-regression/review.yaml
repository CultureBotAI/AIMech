  summary: Retain the model family separately from its fitting and prediction algorithms.
  details: Generic GaussianProcessRegression permits arbitrary GP kernels. The original
    finite paired-feature prior gives a narrower model family with explicit covariance
    structure. Fixed-frequency and optimized-frequency variants appear in the source;
    learning frequencies is not a defining requirement of every SSGP model. SSGP-EMM
    and SSGP-Lin instead transform a supplied posterior under uncertain test inputs.
    The directly evidenced acronym is SSGP; the unevidenced SSGPR spelling is retained
    only as a search term.
