  details: Distinct from FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning,
    Horvath et al. 2021), which randomly samples prefix widths p ~ D_P during local
    client SGD (Ordered Dropout) and applies self-distillation from each client's
    maximal submodel rather than training a single fixed submodel level p_i per client
    round with a 1/r^{p-1} activation Scaler and static Batch Normalization.
