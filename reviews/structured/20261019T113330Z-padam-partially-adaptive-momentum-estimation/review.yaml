  summary: Padam Partially Adaptive Momentum Estimation Optimization is a distinct
    concept.
  details: Distinct from AMSGrad (Reddi et al., 2018), which fixes p = 1/2 and requires
    a small base learning rate alpha_t to prevent coordinates with tiny v_hat_{t,i}
    << 1 from overshooting early in training; distinct from AdaMax (Kingma & Ba, 2015),
    which generalizes the L_p norm of current and past gradients while keeping the
    overall scale of adaptation homogeneous of degree 0 in gradient magnitude, whereas
    Padam intentionally reduces the denominator power to v_hat_t^p with p in (0, 1/2];
    and distinct from AdaBound (Luo et al., 2019), which clips adaptive learning rates
    to time-dependent intervals [eta_l(t), eta_u(t)].
