  summary: AdaBound and AMSBound Dynamic Learning-Rate Bounds Optimization is a distinct
    concept.
  details: Distinct from Adam (Kingma & Ba, 2015), which sets eta_l(t) = 0 and eta_u(t)
    = infinity and can fail to converge on convex problems due to either huge or tiny
    learning rates (Theorems 1-3); distinct from AMSGrad (Reddi et al., 2018), which
    enforces non-increasing step sizes via v_hat_t = max(v_hat_{t-1}, v_t) to curb
    large learning rates but does not bound tiny learning rates from below; distinct
    from SWATS (Keskar & Socher, 2017), which performs a discrete hard switch from
    Adam to SGD at a thresholded step rather than a continuous dynamic-bound transformation;
    and distinct from Padam (Chen et al., 2020), which scales the second-moment denominator
    exponent to v_hat_t^p with p in (0, 1/2] rather than clipping step sizes to time-varying
    bounds [eta_l(t), eta_u(t)].
