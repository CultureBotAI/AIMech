  summary: ANCE Approximate Nearest Neighbor Negative Contrastive Learning is a distinct
    concept.
  details: Distinct from Dense Passage Retrieval (Karpukhin et al., EMNLP 2020, AIMech:DensePassageRetrieval),
    which uses static BM25 negatives and local in-batch negatives; distinct from RocketQA
    (Qu et al., NAACL 2021, AIMech:RocketQADenoisedHardNegativeSampling), which uses
    cross-batch negatives and cross-encoder hard-negative denoising across discrete
    pipeline generations; and distinct from REALM (Guu et al., ICML 2020, AIMech:REALMRetrievalAugmentedLanguageModelPreTraining),
    which trains a masked language model jointly with a neural knowledge retriever
    using marginal log-likelihood over documents rather than variance-reducing global
    hard-negative contrastive estimation for first-stage ad-hoc and OpenQA dense retrieval.
