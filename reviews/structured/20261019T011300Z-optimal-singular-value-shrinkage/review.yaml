  summary: 'Verified analytically and via Monte Carlo: (1) exact forward/inverse rectangular
    singular value bijection y(x) = sqrt((x + 1/x)(x + beta/x)) and x(y) above 1 +
    sqrt(beta); (2) exact identity eta_fro^*(y) = x(y) c(x(y)) tilde_c(x(y)) = (1/y)
    sqrt((y^2 - beta - 1)^2 - 4 beta), nuclear-norm bulk neighborhood threshold x_0
    > beta^{1/4} where c(x_0) tilde_c(x_0) = s(x_0) tilde_s(x_0) (x_0 = sqrt(2), y_0
    = 3/sqrt(2) ~= 2.1213 at beta = 1), and exact 2x2 reciprocal-quadratic operator-norm
    minimizer z_1(x, beta) x(y) <= x(y); (3) strict ordering 0 <= eta_nuc^* <= eta_{S_1.5}^*
    <= eta_fro^* <= eta_{S_4}^* <= eta_op^*; and (4) finite-sample Monte Carlo (n=60,
    m=45, beta=0.75, r=2) confirming Frobenius MSE 3.041 (asymptotic 3.224) < hard
    thresholding 4.099 < soft thresholding 5.623.'
