  summary: Loss-Specific Optimal Singular Value Shrinkage for Low-Rank Matrix Denoising
    is a distinct mathematical method separating continuous/loss-specific singular
    value shrinkage from hard singular value truncation and symmetric covariance eigenvalue
    shrinkage.
  details: Checked against all 442 pinned AIO concepts and 647 maintained AIMech concepts.
    Distinct from AIMech:OptimalSingularValueHardThresholdingAtFourOverSqrtThree (Gavish
    & Donoho 2014, which restricts the estimator to discontinuous hard truncation
    1(y >= tau_*) y with worst-case square-matrix AMSE 3 r sigma^2, whereas Gavish
    & Donoho 2017 optimize over all continuous and discontinuous univariate singular
    value shrinkers eta(y) across general orthogonal-invariant losses, achieving worst-case
    square-matrix AMSE 2 r sigma^2 via eta_fro^*(y) = sqrt((y^2 - 4)_+) and deriving
    distinct closed-form nuclear-norm and operator-norm shrinkers); distinct from
    AIMech:LossSpecificOptimalEigenvalueShrinkageForSpikedCovarianceMatrices (Donoho,
    Gavish, & Johnstone 2018, which shrinks sample covariance eigenvalues toward a
    positive bulk baseline 1 using a single symmetric QR basis W_n and identical left/right
    eigenvector cosines c(ell), whereas Gavish & Donoho 2017 shrink rectangular matrix
    singular values toward 0 using distinct left and right Gram-Schmidt orthogonal
    bases W_n, tilde_W_n and asymmetric left/right singular vector cosines c(x) !=
    tilde_c(x)); and distinct from AIMech:SingularValueThresholdingForMatrixCompletion
    (Cai, Candes, & Shen 2010, iterative soft thresholding for incomplete matrix completion).
