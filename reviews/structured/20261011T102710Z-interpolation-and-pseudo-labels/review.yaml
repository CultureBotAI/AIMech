  summary: FixMatch’s defining combination is weak-to-strong consistency with confidence-masked
    hard pseudo-labels. It differs from MixMatch’s soft guessed targets and interpolation,
    ReMixMatch’s distribution alignment and anchored soft targets, and an EMA-target
    Mean Teacher. AIO SemiSupervisedLLM is a narrower, differently structured LLM
    model class, not this classifier-training algorithm. No normalized identity match
    was found across all 442 pinned AIO labels/scoped synonyms and 234 preceding native
    IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
    files in both worktree and main checkout, returning 21 lines in each from prior
