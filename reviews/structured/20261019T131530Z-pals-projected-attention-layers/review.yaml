  summary: Projected Attention Layers is a distinct concept.
  details: Introduced by Asa Cooper Stickland and Iain Murray (ICML 2019, PMLR 97:5986-5995, arXiv:1902.02671)
    as Projected Attention Layers (PALs). Distinct from Houlsby bottleneck adapters and AdapterFusion
    (AIMech:AdapterFusion), which insert serial feed-forward down/up-projection modules within each layer;
    from AdaptFormer (AIMech:AdaptFormer), which places parallel bottleneck MLP branches alongside FFN
    sublayers in Vision Transformers; and from HyperFormer (AIMech:HyperFormerSharedHypernetworkAdapter),
    which generates serial adapter weights via a shared task-conditioned hypernetwork.
