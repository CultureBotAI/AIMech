  summary: TernGrad (Stochastic Ternary Gradient Quantization for Distributed Deep
    Learning) is a distinct concept.
  details: Distinct from deterministic sign-based compression SignSGD (AIMech:SignSgdAndMajorityVoteCompressedNonconvexOptimization,
    Bernstein et al. 2018), which maps coordinates deterministically to {-1, +1} without
    zero level or unbiased probabilistic rounding, and from multi-level L2-norm quantized
    SGD QSGD (AIMech:QsgdQuantizedStochasticGradientDescentWithEliasCoding, Alistarh
    et al. 2017), which normalizes by the Euclidean norm ||g_t||_2 rather than the
    infinity norm s_t = ||g_t||_infty with layer-wise sigma-clipping.
