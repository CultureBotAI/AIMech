  summary: FedMA (Federated Matched Averaging via Layer-Wise Bayesian Nonparametric
    Matching) is a distinct concept.
  details: Distinct from coordinate-wise parameter averaging (FedAvg, FedProx) which
    ignores the permutation invariance of neural network hidden units and averages
    misaligned neurons, from single-round one-shot Probabilistic Federated Neural
    Matching (PFNM, which applies only to shallow fully connected networks without
    layer-wise freezing and retraining), and from FedDF (AIMech:FedDfEnsembleDistillationForRobustModelFusionInFederatedLearning,
    which fuses models in output logit space using unlabeled server data rather than
    matching weights layer-by-layer via Hungarian assignment).
