  details: Distinct from heuristic multiplicative update rules for NMF (`AIO:NonnegativeMatrixFactorization`)
    and FastAnchorWords / RecoverL2 word-co-occurrence topic modeling (AIMech:AnchorWordsAndRecoverL2TopicWordMatrixFactorization).
    Specifically captures the Arora-Ge-Kannan-Moitra (2012/2016) formalization of
    Separable NMF (Definition 5.1), the exact simplicial 'Loner' LP algorithm (Theorem
    5.4 and Claim 5.5), the alpha-robust simplicial condition (Definition 5.6), the
    noisy Robust-Loners algorithm and error bound 10 epsilon/alpha + 7 epsilon (Theorem
    5.7 and Claims 5.8-5.10), and the fixed-inner-dimension exact NMF algebraic decidability
    algorithm in time (nm)^{O(r^2 2^r)} (Theorem 4.1).
