  details: 'For a finite latent window s_1,...,s_T, specify a normalized initial law
    pi and row-normalized transition table A. In the source’s one-sided Gaussian construction
    with integer lag Delta between1 andT-1, observations x_1,...,x_(T-Delta) have
    conditional means u_(s_t)+v_(s_(t+Delta)) and identity covariance. The joint density
    is pi(s_1) times product_(t=1)^(T-1) A_(s_t,s_(t+1)) times product_(t=1)^(T-Delta)
    Normal(x_t;u_(s_t)+v_(s_(t+Delta)),I). Given the complete hidden path, observations
    are independent, but each observation couples two hidden positions in posterior
    inference. For binary states, expanding the Gaussian terms produces a long-range
    pair interaction K=-(u_+-u_-) dot (v_+-v_-)/4. At hidden index j, the contribution
    through the delayed v term uses observation x_(j-Delta), when that observation
    lies within the valid window. Summing the normalized joint density over paths
    gives the observed likelihood. The paper approximates the hidden posterior by
    retaining a tractable chain and treating added interactions through structured
    mean field; that inference choice is separate from model identity. Limitations:
    The source’s Equation(23) omits the initial-state law and Equation(26) suppresses
    boundary corrections. The normalized finite-window convention is stated explicitly
    here; other endpoint or padding choices define different models. Equation(26)
    uses the contemporaneous observation in a combined unary expression. In a general
    sequence, a delayed-state contribution must instead use the corresponding earlier
    observation; this cannot be repaired only by ignoring endpoints. The prior remains
    first-order, but the conditioned hidden distribution generally has long-range
    interactions. A standard HMM forward–backward pass over the original single state
    is not automatically exact; exact inference can require an expanded state with
    cost growing with context width. The Gaussian additive-mean, identity-covariance
    form is the inspected example, not a claim that every contextual emission distribution
    must have that form. The synthetic Figure1 uses five states and two-sided context
    rather than only the displayed binary one-sided specialization. A usual HMM can
    retain marginal correlations over many time steps. The distinction is added direct
    conditional dependency through emissions, not the existence of any long-lag correlation
    or a causal interpretation of future context. No speech benchmark or accuracy
    guarantee is asserted.'
