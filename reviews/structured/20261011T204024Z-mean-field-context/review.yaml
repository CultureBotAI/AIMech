  rationale: Mean-field Boltzmann learning estimates two parameter-learning phases.
    The Saul–Jordan sequence family changes emission dependence across hidden times
    while retaining a Markov prior. The Yoon–Vaidyanathan family stores emitted symbols
    and conditions subsequent emissions/transitions on memory. Shared context-sensitive
    terminology is not equivalence. Preserve the three IDs and directional mappings;
    create no duplicate adaptive-mixture ID from an overlapping primary construction.
limitations:
- Adversarial author self-review only; all targets remain DRAFT.
- The author and journal memory-HMM PDFs are distinct versions with separate SHA256
  values. The journal supports the final record; both were visually read in full.
- Jacobs is scanned; OCR succeeded but a sampled equation-containing page remains
  garbled, so visual reading controls the overlap assessment.
- A preliminary mapping-helper lookup used a nonexistent coupled-HMM filename and
  stopped before writes; ignored-inclusive inventory resolved the intended existing
  mixed-memory neighbor. No failed corpus gate or record substitution was hidden.
- Public web PDF redirect access failed, while ordinary public HTTPS retrieval succeeded.
  A PMC context page was recaptcha-only and supplied no mechanism evidence.
- Finite mathematical witnesses are not data fitting, author-code reproduction, empirical
  validation or universal convergence/correctness proofs.
- 212 pending leads plus unresolved dispositions remain; discovery is active.
