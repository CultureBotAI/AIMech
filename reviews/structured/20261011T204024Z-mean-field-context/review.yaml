  details: 'The basic model has silent start/end states, ordinary single-emission
    states S, and paired states P_n and C_n sharing a dedicated memory Z_n. On visiting
    P_n, emit a symbol from its state distribution and store that symbol in Z_n. On
    visiting C_n, retrieve and remove a symbol from Z_n, then emit according to a
    distribution conditioned on the retrieved symbol. After this emission, choose
    the C_n transition distribution according to whether its memory is empty. The
    source uses disjoint empty-memory and nonempty-memory destination sets, each with
    its own normalized row; only the row valid for the current memory is active. A
    completed valid path starts with empty memories, avoids reads from empty memory
    and balances each pair’s writes and reads. Ordinary and storage-state transitions
    do not depend on context in the basic formulation. A last-in-first-out stack with
    deterministic matching emissions can reproduce a prefix in reverse order; a first-in-first-out
    queue can reproduce it in the same order. Hidden control paths and their induced
    memory histories determine the probability of a symbol string, which requires
    summing over valid paths. Limitations: The effective state includes memory contents.
    The finite control-state label alone generally lacks the Markov property; a Viterbi
    table retaining only time and that label can discard necessary history. Equation(8)
    compresses the two context-specific transition tables into one notation. Its entries
    must still be restricted to the active destination set: summing the empty and
    nonempty rows over their union gives mass two rather than a transition distribution.
    Equal total counts of paired states do not prevent a prefix memory underflow.
    Model topology, active transition masks, initial memories and termination conventions
    must enforce valid paths. Local normalization alone does not ensure almost-sure
    termination; a distribution over finite complete strings requires that condition
    or explicit conditioning. The polynomial interval algorithms in SectionsIII–V
    assume nested, noncrossing pairings and the specified emission dependence. The
    broader stack/queue family can have crossings, for which those algorithms cannot
    be directly reused. Their general implementation correctness was not independently
    proved or reproduced. Ordinary finite HMMs can have long-lag statistical correlations.
    The source’s broad contrast is qualified to constraints requiring unbounded memory,
    such as exact arbitrary-length copying, rather than every distant correlation.
    The grammar expressivity discussion is not adopted as an equivalence theorem for
    unrestricted memory models. The synthetic RNA-symbol examples do not establish
    biological prediction performance, global parameter-estimation convergence or
    superiority to all grammar models. No author code, training or benchmark was executed.'
