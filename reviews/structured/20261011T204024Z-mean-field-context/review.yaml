  summary: 'Mean-field Boltzmann learning has related BoltzmannMachineNetwork and
    SupervisedLearning mappings: it is a two-phase parameter-learning algorithm, not
    the model or task. The emission-context HMM has a broad BayesianNetwork mapping
    from its finite normalized DAG factorization and a related MarkovChain mapping
    for its latent first-order prior, not its observed marginal or conditioned hidden
    posterior. The auxiliary-memory HMM has a related MarkovChain mapping: the effective
    Markov state includes the memory; its finite control state alone is insufficient.
    It also has a related ProbabilisticGraphicalModel mapping to the task context
    of structured latent-state inference, not a task superclass. CausalGraphicalModel
    requires unsupported causal semantics. MemoryAugmentedLLM, MixtureofExpertsLLM,
    FactorizedLLM and FactoredLanguageModel are language-specific. MemoryCellLayer,
    RecurrentLayer and ProbabilisticHiddenLayer are components; LSTM, GRU and RNN
    are neural architectures, not symbolic stack/queue HMM identities. VAE adds an
    autoencoder. RestrictedBoltzmannMachine is a restricted model architecture, not
    the general learning algorithm. TrainingStrategy is preprocessing-scoped; generic
    MachineLearningTask and UnsupervisedLearning do not specify the supervised conditional
    phase procedure. EnsembleLearning does not make overlapping expert constructions
    separate identities. Native HMM, HMDT, IOHMM, BoltzmannChain, MixedMemory, FHMM,
    two mean-field inference methods, PCD, MDN and HME distinguish ordinary emission
    independence, hierarchical/conditional state transitions, undirected normalization,
    predecessor mixtures, separate latent chains, inference versus learning, stochastic
    persistent negative phases and conditional mixtures. Contextual reading does not
    renew those records’ scientific approval.'
