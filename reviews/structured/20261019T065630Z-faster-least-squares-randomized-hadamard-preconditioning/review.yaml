  summary: Faster Least Squares Approximation via Randomized Hadamard Preconditioning
    is a distinct concept.
  details: Distinct from Subsampled Randomized Hadamard Transform Subspace Embedding
    (`AIMech:SubsampledRandomizedHadamardTransformSubspaceEmbedding`), which analyzes
    only the matrix-Chernoff singular value bounds of Phi V for a fixed orthonormal
    basis V without the response-residual cross-term condition ||U_A^T X^T X b^perp||_2^2
    <= epsilon Z^2 / 2 or parameter recovery bounds ||x_opt - tilde{x}_opt||_2, and
    from CountSketch Input-Sparsity Subspace Embedding and Regression (`AIMech:CountSketchInputSparsitySubspaceEmbeddingAndRegression`).
    Specifically captures the Drineas et al. (2011) Randomized Hadamard leverage-flattening
    Lemma 3, the deterministic two-condition least-squares perturbation framework
    (Lemmas 1-2, Equations 8-21), and the Algorithm 1 / Algorithm 2 fast least-squares
    solvers.
