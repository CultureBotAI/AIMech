    claim. For a positive Gaussian scale, the location and log-scale scores are s/sigma
    and s squared - 1; their population Fisher block is diag(1/sigma squared, 2),
    giving the one-half log-scale factor. This bounded analytical explanation requires
    the Gaussian family. Raw expected-fitness gradient identities additionally require
    suitable regularity and integrability. Finite sampled updates, separate learning
    rates and nonlinear reparameterizations do not inherit an unconditional objective-improvement,
    convergence or exact finite-step invariance guarantee. A rotated diagonal covariance
