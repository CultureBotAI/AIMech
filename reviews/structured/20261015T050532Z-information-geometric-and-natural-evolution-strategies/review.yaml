    description in Section 3 is per individual or final coordinate update, not a population-size-free
    bound on an entire generation. The default lambda in Section 5 depends on dimension;
    sorting, evaluations and retaining a batch of vectors add costs. No benchmark
    speedup, global optimum or universal high-dimensional advantage is asserted. Positive
    scales are preserved by finite exact-real exponentials, but finite-precision overflow,
    underflow and numerically degenerate scales require implementation-specific safeguards.
