  summary: SoRA (Sparse Low-Rank Adaptation) is a distinct concept.
  details: Distinct from AdaLoRA (AIMech:AdaLoRAAdaptiveBudgetAllocationForLoRA, which
    imposes explicit SVD orthogonality penalties R(U, V) = ||U^T U - I_p||_F^2 + ||V^T
    V - I_q||_F^2 and prunes triplets using heuristic moving-average weight-gradient
    sensitivity scores), from DyLoRA (AIMech:DyLoRADynamicSearchFreeLowRankAdaptation,
    which trains prefix sub-ranks via nested-dropout-style random rank sampling without
    sparse gating), and from RoSA (AIMech:RoSA, which trains a low-rank matrix plus
    a separate full-dimensional sparse residual matrix W^S). Formulated by Ding, Lv,
    Wang, Chen, Zhou, Liu, and Sun (EMNLP 2023, arXiv:2311.11696).
