  summary: Self-Adaptive In-Context Learning is a distinct concept.
  details: Distinct from corpus-level entropy prompt ordering (AIMech:GlobalEAndLocalEEntropyBasedPromptOrdering),
    which selects a single demonstration permutation for the entire dataset by maximizing
    predictive entropy over a generated probing set, whereas Self-Adaptive In-Context
    Learning selects a custom combination and ordering per test instance by minimizing
    predictive codelength (entropy). Also distinct from single-stage nearest-neighbor
    selection (AIMech:KATEkNNAugmentedInContextExampleSelection), which fixes a single
    distance-based ordering without MDL organization ranking.
