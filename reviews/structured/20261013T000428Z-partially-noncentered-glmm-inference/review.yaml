- assessment_id: model-and-coordinates
  area: evidence
  topic: model-and-coordinates
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  summary: Supported under the specified factor domain and source qualifications.
  details: For independent clusters, use Bernoulli observations with logit link or
    Poisson observations with log link and known positive exposures. Let the predictor
    be eta_i=X_i*beta+Z_i*u_i, with u_i|D~N(0,D), beta~N(0,Sigma0) and D~IW(nu,S);
    require positive-definite Sigma0,S and nu>r-1 for r-dimensional random effects.
    Arrange the shared fixed/random design and cluster-constant covariates so X_i*beta=Z_i*C_i*beta_RG1+X_i_G2*beta_G2.
    For a specified r-by-r W_i set B_i=[(I-W_i)*C_i,0], a_i=u_i+B_i*beta and V_i=X_i-Z_i*B_i.
    Then eta_i=V_i*beta+Z_i*a_i and a_i|beta,D~N(B_i*beta,D). This invertible unit-Jacobian
    change preserves the model; W_i=0 and W_i=I give the source centered and noncentered
    endpoints. General W_i is a matrix and need not be symmetric or entrywise between
    zero and one.
- assessment_id: coordinate-dependent-family
  area: evidence
  topic: coordinate-dependent-family
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: At fixed W_i approximate the posterior by q(beta)*q(D)*product_i q(a_i),
    with full Gaussian covariance inside each beta and a_i block and q(D)=IW(nuq,Sq).
    This removes dependence across those transformed blocks and with D, not all dependence
    among the original effects. With q means m_beta,m_i and covariances Q_beta,Q_i,
    pulling back gives Cov(u_i,beta)=-B_i*Q_beta, Var(u_i)=Q_i+B_i*Q_beta*B_i^T and
    Cov(u_i,u_j)=B_i*Q_beta*B_j^T for i!=j. These identities follow from u_i=a_i-B_i*beta
    and the declared independent blocks. Changing W_i generally changes the approximating
    family in original coordinates. The objective is the expected log joint plus entropy,
    a lower bound on log model evidence under proper priors and finite expectations.
- assessment_id: curvature-noncentering
  area: evidence
  topic: curvature-noncentering
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: The source chooses W_i=(I_f_i+Dstar^-1)^-1*Dstar^-1 using positive-definite
    Dstar and likelihood curvature I_f_i at selected predictors. Poisson curvature
    is Z_i^T*diag(exposure_i*exp(eta_i))*Z_i; Bernoulli-logit curvature is Z_i^T*diag(s_i*(1-s_i))*Z_i
    with s_i=sigmoid(eta_i). The Poisson observed-count replacement is a heuristic
    proxy. W_i can be fixed after initialization or optionally recomputed from current
    means and Dstar=Sq/(nuq-r-1), which requires nuq>r+1. Matrix multiplication order
    matters. This Gaussian-motivated choice does not guarantee exact GLMM factorization,
    optimal W_i or monotone improvement when W_i is changed.
- assessment_id: predictor-moments
  area: evidence
  topic: predictor-moments
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: Under the current Gaussian blocks, each predictor is normal with mean m_eta_i=V_i*m_beta+Z_i*m_i
    and variance vector v_i=diag(V_i*Q_beta*V_i^T+Z_i*Q_i*Z_i^T). For Poisson, both
    expected first and second derivatives of its cumulant are G_i=F_i=exposure_i*exp(m_eta_i+v_i/2),
    elementwise. For logistic, G_ij=E[sigmoid(m_eta_ij+sqrt(v_ij)*Z0)] and F_ij=E[sigmoid(t)*(1-sigmoid(t))],
    where t is that same scalar normal predictor. The logistic expectations reduce
    to one-dimensional Gaussian integrals. The source approximates softplus and its
    first two derivatives by adaptive Gauss-Hermite quadrature; these exact integral
    identities do not certify finite adaptive-quadrature error or that derivatives
    of a discrete approximation coincide.
- assessment_id: gaussian-block-proposals
  area: evidence
  topic: gaussian-block-proposals
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: 'Hold W fixed during a Gaussian block update and let A=E_q[D^-1]=nuq*Sq^-1.
    At the current beta block set P_beta=Sigma0^-1+sum_i B_i^T*A*B_i+sum_i V_i^T*diag(F_i)*V_i
    and g_beta=-Sigma0^-1*m_beta+sum_i B_i^T*A*(m_i-B_i*m_beta)+sum_i V_i^T*(y_i-G_i).
    Propose Q_beta_new=P_beta^-1 and m_beta_new=m_beta+Q_beta_new*g_beta, with F,G
    and derivatives evaluated at the same old beta state. Then update each cluster
    using current neighboring blocks: P_i=A+Z_i^T*diag(F_i)*Z_i, g_i=-A*(m_i-B_i*m_beta)+Z_i^T*(y_i-G_i),
    Q_i_new=P_i^-1 and m_i_new=m_i+Q_i_new*g_i. Recompute predictor moments after
    changed blocks. Proper priors and exact nonnegative curvature make these precisions
    positive definite; these are Gaussian NCVMP proposals, not exact nonconjugate
    coordinate maxima or general ascent/convergence guarantees.'
- assessment_id: inverse-wishart-coordinate
  area: evidence
  topic: inverse-wishart-coordinate
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: After the Gaussian block proposals, the exact conjugate covariance coordinate
    is nuq=nu+n and Sq=S+sum_i[(m_i-B_i*m_beta)*(m_i-B_i*m_beta)^T+Q_i+B_i*Q_beta*B_i^T],
    where n is the number of clusters. This follows from the expected original random-effect
    outer products, including uncertainty in beta. In the convention used here the
    inverse-Wishart density is proportional to |D|^(-(nuq+r+1)/2)*exp(-tr(Sq*D^-1)/2);
    E[D^-1]=nuq*Sq^-1. Proper factor normalization requires nuq>r-1 and Sq positive
    definite, while its mean additionally needs nuq>r+1. Omitting the beta-covariance
    term would not be this coordinate update.
- assessment_id: gaussian-special-case
  area: evidence
  topic: gaussian-special-case
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Supported under the specified factor domain and source qualifications.
  details: In the motivating Gaussian linear mixed model with shared fixed/random
    design X_i, known positive residual variance sigma2 and known positive-definite
    D, take W_i=(X_i^T*X_i/sigma2+D^-1)^-1*D^-1. Then D^-1*(I-W_i)=(X_i^T*X_i/sigma2)*W_i,
    cancelling the beta–a_i posterior precision blocks. When the posterior is proper,
    the transformed exact Gaussian posterior factorizes into the chosen beta and cluster
    blocks, so one coordinate cycle recovers it. The source uses a flat beta prior;
    a proper Gaussian beta prior preserves this cancellation by adding only to the
    beta precision block, as checked in the curator example. This special-case exactness
    does not extend automatically to unknown D or Bernoulli/Poisson likelihoods, and
    flat-prior model evidence has an arbitrary normalization.
- assessment_id: matrix-order
  area: consistency
  topic: Coordinate map, Gaussian precision and covariance pullback
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: The noncommuting matrix order and induced dependence are correct.
  details: With B=I-W in the shared-design special case, the beta–a precision cross
    term is W^T*G-B^T*A, vanishing iff G*W=A*(I-W). W=(G+A)^-1*A meets this condition
    without symmetry or commutation. Two finite noncommuting examples cancel to about1e-15;
    reversing the order leaves a cross residual about0.1095. Transforming block covariances
    back agrees with direct full-posterior inversion to about2.2e-16. The proper Gaussian
    beta-prior extension is explicitly labeled curator reasoning; the source flat-prior
    example requires a proper posterior and has no normalized model evidence.
- assessment_id: update-domain
  area: consistency
  topic: Gaussian evaluation point and inverse-Wishart normalization
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: Block proposals retain the old derivative state and exact covariance uncertainty
    terms.
  details: The Gaussian covariance proposal and mean gradient use the same current
    block moments; new covariance multiplies that gradient. Later blocks use refreshed
    neighboring moments. Poisson mean and covariance derivatives of an independently
    evaluated expected log joint agree to about5.9e-11 in the supplied state. Sq includes
    residual outer products, local covariance and the transformed beta covariance.
    E[D^-1]=nuq*Sq^-1 is distinct from inverse E[D]; the optional W-update mean exists
    only for nuq>r+1. Source nu=r therefore needs n>1 for that mean, although smaller-n
    IW factors can still normalize. Positive curvature gives positive precision, not
    bound ascent.
- assessment_id: integral-and-bound
  area: consistency
  topic: Exact scalar expectations versus numerical quadrature and attained bound
  outcome: supported
  target_ids:
  - AIMech:PartiallyNoncenteredGLMMVariationalInference
  evidence_ids:
  - tan2013
  - calculation
  summary: The record qualifies both quadrature and evidence interpretation.
  details: Poisson expected counts have exp(mean+variance/2), and logistic G/F are
