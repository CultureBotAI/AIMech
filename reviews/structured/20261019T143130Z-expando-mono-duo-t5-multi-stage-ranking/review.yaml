  summary: 'Expando-Mono-Duo: Multi-Stage Text Ranking with Pretrained Sequence-to-Sequence
    Models is a distinct concept.'
  details: 'Distinct from standalone pointwise MonoT5 (AIMech:MonoT5DocumentRankingWithPretrainedSeq2SeqModels)
    and encoder-only BERT cascade DuoBERT (AIMech:DuoBERTMultiStageDocumentRankingWithBERT).
    Expando-Mono-Duo unifies pre-indexing sequence-to-sequence expansion (H_-1) with
    pointwise (H_1) and pairwise (H_2) sequence-to-sequence T5 reranking, introducing
    duoT5 on prompt ''Query: q Document0: d_i Document1: d_j Relevant:'' with relative
    positional encoding extension to 1,024 tokens and symmetric log/probability pairwise
    aggregation (SYM-SUM-LOG, Eq. 8).'
