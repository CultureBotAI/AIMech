  summary: UniPELT is a distinct concept.
  details: 'Distinct from individual PELT methods (AIMech:LowRankAdaptation, AIMech:PrefixTuning,
    AIMech:BottleneckAdapter, AIMech:BitFit), which modify only a single locus of
    the Transformer layer with static scaling, and from ungated hybrid combinations
    (UniPELT-NoGate) or homogeneous parallel Mixture-of-Experts (MoE) layers: UniPELT
    combines heterogeneous submodules sequentially across multi-head attention projections,
    attention prefixes, and post-FFN residual bottlenecks under input-conditioned
    sigmoid gates G_L, G_P, and G_A.'
