  summary: Sever Spectral Gradient Filtering Meta-Algorithm for Robust Stochastic
    Optimization is a distinct concept.
  details: Introduced by Diakonikolas, Kamath, Kane, Li, Steinhardt, and Stewart (ICML
    2019, PMLR 97:1596-1606, arXiv:1803.02815). Distinct from every-iteration robust-mean-estimation
    projected gradient descent (Appendix D; Prasad et al. 2018), which calls a robust
    mean estimator at every gradient step rather than only at approximate critical
    points of a black-box learner. Also distinct from client-update Byzantine federated
    aggregation rules such as DnC (AIMech:DncDivideAndConquerSpectralByzantineRobustAggregation),
    Multi-Krum (AIMech:KrumAndMultiKrumByzantineResilientGradientAggregation), and
    Bulyan (AIMech:BulyanByzantineResilientGradientAggregation), which aggregate distributed
    worker updates in a single communication round rather than iteratively filtering
    training examples around a black-box empirical risk minimizer.
