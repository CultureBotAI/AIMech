  summary: DRACO Byzantine-Resilient Distributed Training via Redundant Gradients
    is a distinct concept.
  details: Distinct from approximate statistical robust aggregators (Krum, Bulyan,
    Coordinate-Wise Median, Trimmed-Mean, Geometric Median) that do not use algorithmic
    gradient redundancy and do not recover the exact adversary-free gradient sum,
    and distinct from DETOX (which uses logarithmic or small odd redundancy r to filter
    most Byzantine nodes via majority vote before applying approximate hierarchical
    robust aggregation rather than exact coding recovery with r = 2s + 1). Specifically
    denotes the DRACO framework of Chen, Wang, Charles, & Papailiopoulos (ICML 2018,
    PMLR 80:903-912, Definitions 1-2, Theorems 1, 2, 5, Lemmas 3-4, Algorithms 1-2).
