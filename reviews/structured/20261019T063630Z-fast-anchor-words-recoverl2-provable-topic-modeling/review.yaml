  summary: Anchor Words and RecoverL2 Topic-Word Matrix Factorization is a distinct
    concept.
  details: Distinct from variational Bayes or Gibbs sampling for Latent Dirichlet
    Allocation (`AIO:LatentDirichletAllocation`) and from general linear-programming
    Separable NMF (AIMech:SeparableNonnegativeMatrixFactorizationAndRobustLonerRecovery).
    Specifically captures the Arora et al. (2013) word-word co-occurrence formulation
    Q = A R A^T with unbiased diagonal correction tilde{H}_d tilde{H}_d^T - hat{H}_d
    (Section 2.1 and Appendix D.1), the Bayesian posterior simplex reformulation C_{i,k}
    = P(z_1 = k | w_1 = i) (Section 3.1), the RecoverKL/RecoverL2 Exponentiated Gradient
    solver (Algorithms 3 and 5, Theorem 3.1), and the FastAnchorWords greedy subspace-distance
    anchor selection algorithm and its simplex-volume perturbation proof (Algorithm
    4, Theorem 4.2, and Lemma A.3 / Claim A.4).
