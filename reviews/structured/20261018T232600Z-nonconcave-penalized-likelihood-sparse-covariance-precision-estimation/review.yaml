  summary: Distinct mathematical_method for unified folded-concave penalized quasi-likelihood
    estimation and sparsistency across precision, covariance, and Cholesky matrices.
  details: Resolved as a distinct AIMech-native mathematical_method concept from Lam
    and Fan (2009, The Annals of Statistics 37(6B):4254-4278; arXiv:0711.3933v3, DOI:10.1214/09-AOS720).
    Distinct from AIMech:SparsePermutationInvariantCovarianceEstimation (Rothman,
    Bickel, Levina, & Zhu 2008), which studies only the convex L1 penalty on the precision/inverse-correlation
    matrix without establishing sparsistency or addressing L1 shrinkage bias, whereas
    Lam and Fan (2009) unify sparse precision, sparse covariance, and sparse modified
    Cholesky estimation under general nonconvex (folded-concave SCAD and hard-thresholding)
    penalties, prove formal sparsistency theorems (Theorems 2, 4, 6, 8, 10, 12), and
    prove that L1 penalization suffers a fundamental bias-sparsistency incompatibility
    whenever s_{ni} grows faster than O(p_n) (Eqs. 2.3, 2.5, 3.1, 3.3, 4.5) that nonconcave
    penalties eliminate by having a_{ni} = b_{ni} = 0 for large signals. Also distinct
    from AIMech:SmoothlyClippedAbsoluteDeviationPenalizedLikelihood (Fan & Li 2001),
    which formulates fixed- or diverging-dimensional regression/GLM variable selection
    rather than high-dimensional matrix quasi-likelihood log-determinant optimization
    across precision, covariance, and Cholesky parameterizations, and from AIMech:RegularizedCovarianceEstimationByBanding
    (Bickel & Levina 2008a), which bands ordered covariance/Cholesky matrices.
