  summary: FedCurv (Fisher-Information-Regularized Federated Learning for Non-IID
    Data) is a distinct concept.
  details: Distinct from FedProx (AIMech:FedProxProximalHeterogeneousFederatedOptimization,
    Li et al. 2020), which penalizes isotropic Euclidean distance (mu/2)*||theta -
    w^{t-1}||_2^2 around the scalar-averaged global model without parameter-wise Fisher
    curvature weighting or peer-model decoupling; and distinct from FFL-ERL / Fisher-weighted
    server model fusion, as FedCurv applies the peer-summed diagonal Fisher quadratic
    regularizer directly during local client SGD optimization via aggregated server
    vectors (P_{t-1}, Q_{t-1}).
