  summary: Split-Mix Federated Learning is a distinct concept.
  details: Distinct from nested width-slimming heterogeneous FL algorithms such as
    HeteroFL (AIMech:HeteroFlWidthScaledSubnetworkAggregationForHeterogeneousFederatedLearning;
    Diao et al., ICLR 2021) and FjORD (AIMech:FjordOrderedDropoutAndSelfDistillationForHeterogeneousFederatedLearning;
    Horvath et al., NeurIPS 2021), which slice nested prefix channel blocks from a
    single monolithic parameter tensor (causing wider channel blocks to be trained
    exclusively on wide-budget clients) rather than decomposing the model into M =
    floor(1/r) modular width-r base sub-networks sampled cyclically across all clients
    and ensembled on demand at inference time. Distinct from FedRolex (AIMech:FedRolexModelHeterogeneousFederatedLearningWithRollingSubModelExtraction;
    Alam et al., NeurIPS 2022), which extracts a deterministic rolling channel window
    from a single global model rather than maintaining M independent width-r base
    sub-networks with training-free Dual Batch-Normalization mixing.
