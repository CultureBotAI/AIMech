  summary: Self-Normalized Heteroscedastic LASSO Optimal Instrumental Variables and
    Weak-Identification Sup-Score Inference is a distinct algorithm family combining
    iterative self-normalized moderate-deviation loadings, Post-LASSO first-stage
    instrument estimation, and Inverse LASSO weak-IV inference.
  details: Resolved against all 442 pinned AIO concepts and 660 maintained AIMech
    concepts. Distinct from `AIMech:DoubleDebiasedMachineLearningAndNeymanOrthogonalCrossFitting`
    (Chernozhukov et al. 2018, which introduces general cross-fitted Neyman-orthogonal
    scores for arbitrary black-box ML learners rather than Belloni et al.'s 2012 iterative
    self-normalized heteroscedastic penalty loadings $\widehat{\gamma}_j = \sqrt{\mathbb{E}_n[f_{ij}^2
    \widehat{\zeta}_i^2]}$, Post-LASSO optimal instrument construction with additional
    instruments $I_i$, or weak-identification-robust Sup-Score / Inverse LASSO inference),
    distinct from `AIMech:SquareRootLassoPivotalConicSparseRegression` (Belloni, Chernozhukov,
    & Wang 2011, which eliminates homoscedastic noise scale $\sigma$ via conic root-MSE
    loss rather than predictor-specific heteroscedastic self-normalized loadings $\widehat{\gamma}_j$),
    and distinct from `AIMech:L1PenalizedAndPostPenalizedQuantileRegressionProcessInHighDimensionalSparseModels`
    (Belloni & Chernozhukov 2011, which uses distribution-free conditional quantile
    rankscores).
