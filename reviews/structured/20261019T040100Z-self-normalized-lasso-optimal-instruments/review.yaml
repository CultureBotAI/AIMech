  summary: 'Verified in pure Python on a heteroscedastic IV model (n=80, p=100, s=3):
    (1) under heteroscedastic first-stage errors zeta_i with Var(zeta_i | z_i) = (0.35
    * (1 + 0.8 * z_{i1}^2))^2, the self-normalized score max_j |sqrt(n) E_n[f_{ij}
    zeta_i]| / sqrt(E_n[f_{ij}^2 zeta_i^2]) = 2.91208222 is dominated by Phi^{-1}(1
    - gamma/(2p)) = 3.48075641 (Lemma 5), and Algorithm A.1''s iterative refinement
    tightens loading validity bounds from [0.9255008, 1.38023007] to [0.92957305,
    1.07279695] (Lemma 12); (2) Lemma 8''s Post-LASSO KKT orthogonality identity holds
    to 0.0, and Post-LASSO reduces first-stage prediction error ||D_hat - D||_{2,n}
    4.63x relative to LASSO (0.13945612 vs 0.64558289) and 5.38x relative to full
    p=100 2SLS (0.75008384), recovering the exact support [0, 1, 2] while obeying
    Lemma 6''s restricted cone bound; (3) in the second stage with endogeneity rho=0.65,
    full 2SLS suffers severe many-instrument bias (|alpha_2SLS - alpha_0| = 0.37124851)
    whereas Post-LASSO IV achieves |alpha_PL - alpha_0| = 0.09455679 with valid studentized
    t-statistic 1.18987948 <= 1.96 (Theorem 2); and (4) the weak-identification-robust
    Sup-Score test and Inverse LASSO (Eqs. 3.17-3.19) agree on 81/81 grid points (0
    mismatches), retaining true alpha_0 = 1.5 (S_hat(1.5) = 3.24962259 <= Lambda =
    3.82883205, ||beta_IL(1.5)||_1 = 0.0) and rejecting false alpha = 0.2 (S_hat(0.2)
    = 7.45646529 > Lambda, ||beta_IL(0.2)||_1 = 0.77936919 > 0).'
