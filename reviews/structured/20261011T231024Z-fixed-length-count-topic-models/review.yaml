  summary: 'This is the LPMRF topic hierarchy of Inouye et al. 2015, distinct from
    a single LPMRF, a mixture assigning one component per document, and an APM that
    averages topic canonical parameters before drawing a document. Conditional on
    topic allocations, its document law is a convolution of topic count distributions.
    Sparse additive categorical logits and latent binary Replicated Softmax architectures
    do not define this hierarchy. No normalized identity match was found across all
