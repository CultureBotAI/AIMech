    value: broad_match,related_match
    definition: The finite-total distribution maps broad to Model and related to task-scoped
      ProbabilisticGraphicalModel; both topic constructions map broad to Model and
      related to task-scoped ProbabilisticTopicModel. These are local assessments,
      not upstream class assertions. A finite-total support constraint distinguishes
      LPMRF from Cartesian truncation, unbounded auto-Poisson and root-statistic families.
      The summed-topic hierarchy differs from one document-specific distribution at
      averaged canonical parameters, and from a component-selection mixture. Canonical
      rate mixing differs from arithmetic topic-probability mixing. SAGE changes categorical
      log-frequency deviations; Replicated Softmax uses latent binary units and a
      different count-energy construction; hierarchical softmax is an output component.
      SoftmaxFunction and SoftmaxLayer transform vectors or activations and do not
      define these document distributions. FactoredLanguageModel uses linguistic factor
      representations and FactorizedLLM decomposes a large language model; neither
      is identified by topic factorization or an admixture. LanguageModel is sequence-scoped,
      so no automatic broad mapping is asserted for exchangeable bag counts. Neural
      layers, activations, regressions, sparsity penalties and temporal models do
      not supply the same count potentials or latent hierarchy. CausalGraphicalModel
      and BayesianNetwork do not justify causal or directed semantics for these constructions.
      The 27 native neighbors distinguish prior fields and their sampling/estimation
      procedures from the new support and composition rules. Their contextual reading
      does not renew scientific approval.
    evidence_ids:
    - mapping
