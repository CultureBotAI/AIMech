  summary: Retain the fixed-length count family.
  details: Finite support makes every finite symmetric quadratic potential normalizable.
    The Phi=0 multinomial partition and L=0 point mass are explicit. Common theta
    shifts and fixed-total gauges mean parameters need identification conventions.
    Count coordinates are deterministic given the remaining counts and total, so ordinary
    countwise Poisson pseudolikelihood and Cartesian-support graph semantics do not
    transfer. Positive pair coefficients need not give positive marginal covariance
    under a total constraint. Token sequences require a multinomial multiplicity correction;
    the finite witness verifies it. General diagonal parameters require the token
    self term, and a negative largest eigenvalue needs sign care in the printed bound.
