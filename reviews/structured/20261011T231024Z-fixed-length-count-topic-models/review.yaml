  summary: 'APM denotes the Poisson-MRF admixture construction in this source. It
    mixes parameters within one document-specific distribution, rather than choosing
    one topic for the entire document or summing independently drawn fixed-total topic
    vectors. Its narrow canonical-space form differs from LDA probability-space mixing
    and from the broader transformed-parameter admixture framework in the same paper.
    Shared words such as sparse, graphical or softmax do not identify it with SAGE,
    Replicated Softmax or a neural output layer. No normalized identity match was
    found across all 442 pinned AIO labels and all scoped synonyms and 415 preceding
    native IDs, names and aliases. Full-checkout fixed-string searches included ignored
    and hidden files in worktree and main, yielding six and three matched lines; all
    five unique contents were read and describe existing frontier references, not
    records of these identities. The three-character APM acronym was checked in normalized
    identities but omitted from broad text search; the longer LPMRF acronym was included.
    Preparation included the three final GRM records before their merge; their inspected
    bytes are unchanged. All 188 semantic label/synonym hits were read. Fifty-one
    fully annotated exact CLASS nodes and outgoing edges were inspected: 46 byte-verified
    against prior reading and five fully read here. Seventy-eight full contextual
    YAMLs comprise 51 generated and 27 native records: six were fully read during
    this preparation and 72 byte-verified after prior full reading. Absence is bounded
    to the pinned snapshot, maintained corpus and inspected semantic neighborhood.'
  details: 'For k topics sharing a specified proper Poisson-MRF exponential-family
    base, sufficient statistics and count support, let topic natural parameters be
    (theta_j,Theta_j). Draw document weights w from Dirichlet(alpha), alpha_j>0, and
    form theta_bar=sum_j w_j*theta_j and Theta_bar=sum_j w_j*Theta_j. Draw x from
    the normalized base law at these averaged canonical parameters. The paper also
    proposes priors on topic parameters; this construction requires those priors to
    be proper on an admissible parameter domain. Convex combinations of finite natural
    parameters of the same exponential family remain in its finite-partition domain
    by Holder’s inequality. In the raw-count, unbounded, zero-diagonal PMRF case,
    symmetric off-diagonal interactions must be nonpositive. The paper states that
    its positive-interaction implementation instead uses modified sufficient statistics
    from Yang et al. 2013 while retaining abbreviated raw-PMRF notation. Those modifications
    must be specified consistently; averaging invalid positive raw-count parameters
    does not make them proper. In the raw-count Poisson case with all interactions
    zero, canonical mixing averages log rates and hence geometrically mixes rates.
    A modified sufficient statistic need not give an ordinary independent Poisson
    law. LDA mixes word probabilities arithmetically for the same weights; the Poisson-total/multinomial
    identity alone does not equate these document-weight parameterizations. Limitations:
    Topic components must share the same statistics, support and reference measure
    before averaging their natural parameters. Unrestricted positive raw-count Poisson
    interactions are not normalizable; positive-edge plots do not remove that restriction.
    The source uses simplified PMRF notation while stating that a modified-statistic
    model is used. Its precise positive-edge estimator and implementation were not
    inspected, so no implementation behavior or reproducible positive-edge fit is
    certified. The proposed prior’s claimed beta->beta+x posterior closure is not
    generally valid for its interaction coefficient: beta*beta^T+x*x^T differs from
    (beta+x)*(beta+x)^T. Its Gamma analogy also depends on the reference measure,
    gamma and the quadratic penalty. No exact conjugacy or calibrated posterior claim
    is adopted. The displayed approximate-posterior expression is a sum of log-like
    terms despite being labeled as a posterior. Pseudolikelihood, l1 regularization
    and FISTA-like proximal updates are approximate fitting machinery; their availability
    does not make the jointly coupled topic/weight objective globally convex. Canonical
    mixing generally differs from LDA arithmetic probability mixing. The 2015 fixed-length
    paper explicitly treats APM as an indirect relaxation and its summed-topic construction
    as a different model. Neither a single-document Poisson identity nor a coherence
    comparison proves equality of the full Bayesian models. The preliminary 20 Newsgroup
    experiment used only 200 words and reported final APM fits with no interaction
    edges. Those coherence scores do not validate recovered dependency structure.
    Grolier graph illustrations were manually filtered and are qualitative, not causal
    or held-out performance evidence. No author code, fitting or benchmark was reproduced.'
