limitations:
- Adversarial author self-review only; all records remain DRAFT.
- 'All 23 PDF pages were visually read: nine fixed-length main, three fixed-length
  supplement, nine APM main and two APM supplement pages. Extracted fixed-length main
  pp. 4/6, supplemental pp. 1–2 and APM main pp. 3–5 were also read. No full extracted-text
  reading is claimed.'
- The web PDF click returned an internal error for the fixed-length supplement because
  it is a ZIP. Reading the official HTML revealed the ZIP link; the archive downloaded
  successfully and contained one PDF, which was extracted and fully read. Archive
  and extracted-PDF hashes are distinct. No executable archive content was run.
- Fixed-total support changes conditional laws and parameter identifiability. The
  raw-count Poisson regression fit is a surrogate, and token-sampling and eigenvalue
  displays need explicit diagonal/sign conventions. Curve fitting above AIS estimates
  is not exact partition certification.
- 'Extracted text confirms the fixed-length topic objective omits a log and its second
  transfer partition index has the wrong sign for a lost count. Two preliminary visual
  suspicions in the supplemental multinomial derivation were withdrawn: the factorial
  term and final exponential are printed correctly.'
- APM uses abbreviated raw-PMRF notation while stating that modified statistics produce
  positive interactions. No implementation was inspected. The proposed prior update
  has an interaction cross-term mismatch; canonical mixing is not the same parameterization
  as LDA probability mixing. These mathematical qualifications remain explicit.
- No author implementation, empirical fit, current timing result, exact posterior
  calculation or AIS accuracy guarantee was reproduced. Experiments and graph/word
  lists are context only.
- All additions remain DRAFT and need saved adversarial author self-review. Numerous
  neighboring references remain provisional and require identity and primary-method
  inspection; discovery remains active.
- Before formal review, clarified the multinomial topic-allocation weights, raw-count
  scope of geometric rate mixing and degenerate count-dependence cases; final updated
  record bytes were inspected.
