  summary: Retain the summed-topic hierarchy.
  details: The generative model draws weights, total, multinomial topic totals and
    independently normalized fixed-length topic count vectors, then sums them. The
    document marginal explicitly weights each topic-total allocation by its multinomial
    probability. It is a convolution/hierarchy rather than a single model at averaged
    canonical parameters or one component per document. With zero interactions it
    recovers the conditional LDA token construction for fixed topic probabilities,
    without equating arbitrary topic priors or fitting algorithms. Printed posterior
    and count-transfer expressions are qualified. MAP-based test likelihoods and surrogate
    fitting do not establish exact marginal likelihood or posterior inference.
