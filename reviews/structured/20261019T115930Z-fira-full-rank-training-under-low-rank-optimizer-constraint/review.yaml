  summary: Fira (Full-Rank Training under Low-Rank Optimizer Constraint) is a distinct concept.
  details: Distinct from GaLore (AIMech:GaLoreGradientLowRankProjection), which projects the full-rank
    gradient G_t into a rank-r subspace R_t = P_t^T G_t and completely discards the orthogonal residual
    (I - P_t P_t^T) G_t = G_t - P_t R_t; Fira retains the same low-rank optimizer states (mr + 2nr + 1
    floats per m x n matrix) but scales and adds back G_t - P_t R_t using the low-rank adaptive scaling
    factor phi_t(R_t) = ||psi_t(R_t)|| / ||R_t|| alongside a multiplicative norm-growth limiter gamma.
