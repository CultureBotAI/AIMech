    dimensional scaling. Direct likelihood derivatives are distinguished from the
    paper’s mean-gradient rescaling heuristic. In the supplement, expressions printed
    as derivatives of p match log-density derivatives; the finite example verifies
    the missing density factor. A literal Algorithm2 phi computation produces responsibilities
    approximately -0.345 and1.345, while normalized Gaussian factors give valid probabilities
    approximately0.989 and0.011. The curated mechanism follows the main density equations,
