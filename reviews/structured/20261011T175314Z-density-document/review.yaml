    were read. MixtureDensityNetwork broadly maps to ArtificialNeuralNetwork; multiple
    hidden layers are not required, so DeepFeedForwardNetwork/DeepNeuralNetwork would
    impose an unsupported restriction. Perceptron is a binary linear classifier, not
    generic conditional-density output. RNADE and DocumentNADE broadly map to BayesianNetwork
    for their fully visible directed factorizations. DocumentNADE additionally relates
    to ProbabilisticTopicModel without asserting an architecture-to-task subclass
    or temporal-topic mechanism. MixtureofExpertsLLM has distinct sparse language-model
    routing; RBM/Boltzmann nodes are undirected stochastic models; activation/layer
    nodes are components, not whole architectures. Language-model classes provide
    neighboring word-sequence context but do not establish the additive topic-model
