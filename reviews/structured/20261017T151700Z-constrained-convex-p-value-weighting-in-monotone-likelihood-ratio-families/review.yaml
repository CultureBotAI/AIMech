  details: ConstrainedConvexPValueWeightingInMonotoneLikelihoodRatioFamilies proves
    concavity of the ROC power parametrization R_j(q w_j) across general MLR families
    and two-sided canonical exponential families (Propositions 2.1-2.3), establishes
    moderate-q non-monotonicity of unconstrained Spjotvoll weights (Propositions 3.1-3.2),
    and solves the order- and box-constrained convex p-value weighting problem via
    an O(J) tridiagonal-plus-rank-1 interior-point solver (Section 4.2), whereas BayesOptimalPValueWeightingUnderGaussianPrior
    (Dobriban et al. 2015) solves an unconstrained non-convex marginal power optimization
    under Gaussian effect-size uncertainty sigma_i > 0.
