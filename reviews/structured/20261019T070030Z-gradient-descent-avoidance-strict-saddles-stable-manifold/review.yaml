  summary: Gradient Descent Avoidance of Strict Saddle Points via Stable Manifold
    Theorem is a distinct concept.
  details: Distinct from Perturbed Gradient Descent for Escaping Saddle Points in
    Hessian-Lipschitz Optimization (`AIMech:PerturbedGradientDescentForEscapingSaddlePointsInHessianLipschitzOptimization`),
    which modifies gradient descent by injecting uniform ball perturbations to achieve
    polynomial tilde{O}(1/epsilon^2) worst-case runtime, whereas Lee et al. (2016)
    analyze unmodified deterministic gradient descent with random initialization via
    the diffeomorphic Center-Stable Manifold Theorem. Also captures the explicit 2D
    degenerate-saddle counterexample f(x,y) = x^2/2 + y^4/4 - y^3/3 where an open
    plot of initial conditions (0,1) x (-2,0) converges to a non-strict saddle point.
