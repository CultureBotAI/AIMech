  support: supports
  summary: 'A parametric dimensionality-reduction algorithm that trains a neural mapping
    from input points to embedding coordinates using sampled attractive and repulsive
    losses derived from a UMAP neighborhood graph. The cited method construction and
    scoped limitations were inspected. Rendered pages actually inspected: 7.'
- evidence_id: parametricumap-method-sampling-analysis
  kind: primary_source
