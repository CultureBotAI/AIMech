  summary: PaCMAP uses three classes of pair losses and a changing phase schedule,
    rather than TriMap’s coupled triplet loss or UMAP’s fuzzy graph construction.
    The graph-sampling rules and phase weights are defining components, not a proof
    of universal local/global preservation.
  details: Random sampling and the initial coordinates affect the result. The authors
    explicitly state that robustness to initialization is incomplete and that initialization
    scale matters. A mid-near partner is selected by a six-point sample rule, not
    an exact global distance quantile; the method does not guarantee that every such
    partner is outside the nearest-neighbor set. Locally scaled distances select neighbor
    pairs, while optimization uses embedded distances and pair-class weights; the
    original distances are not fitted as an all-pairs metric. The three-phase procedure
    seeks a useful nonconvex layout. No global optimum, exact topology preservation,
    density preservation or universal performance advantage is asserted.
