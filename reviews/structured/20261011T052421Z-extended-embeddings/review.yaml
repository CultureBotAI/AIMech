assessments:
- assessment_id: parametricumap-method
  area: evidence
  topic: Method identity, source versions, objective scope and AIO mapping direction
  outcome: supported
  target_ids:
  - AIMech:ParametricUMAP
  evidence_ids:
  - parametricumap-method
  - identity-search
  - mapping
  - parametricumap-method-sampling-analysis
  summary: The core distinction from AIMech:UMAP is optimization of a shared neural
    input-to-coordinate mapping, rather than one free coordinate vector per training
    point. A parametric t-SNE objective and a generic autoencoder are different constructions;
    the UMAP/autoencoder and supervised hybrids are optional variants.
  details: The graph metric, neighborhood structure, network capacity, optimization
    and sampling affect the learned representation; a reusable mapping does not ensure
    reliable extrapolation to new distributions. Minibatch negative sampling changes
    the effective loss relative to the nominal all-pairs fuzzy cross-entropy. The
    analyzed parametric loss has batch-size and degree-product factors, distinct from
    the nonparametric symmetrized loss. A classifier regularized by graph structure
    requires a graph relevant to its labels; the paper does not establish universal
    semi-supervised improvement. The specified paper and sampling analysis were inspected;
    current software, all supplementary results and universal topology preservation
    were not certified.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A defined algorithm for constructing lower-dimensional coordinates,
      not a fitted embedding or task.
    evidence_ids:
    - parametricumap-method
  - name: mapping-direction
    value: related_match to AIO:DimensionalityReduction
    definition: A specific algorithm for constructing lower-dimensional representations,
      associated with the pinned dimensionality-reduction task. The target inherits
      UnsupervisedLearning under MachineLearningTask; related_match avoids treating
      the algorithm as identical to or a subclass of that task. Shared embedding components
      do not make this concept identical to PCA, MDS or t-SNE.
    evidence_ids:
    - parametricumap-method
    - mapping
- assessment_id: trimap-method
  area: evidence
  topic: Method identity, source versions, objective scope and AIO mapping direction
  outcome: supported
  target_ids:
  - AIMech:TriMap
  evidence_ids:
  - trimap-method
  - identity-search
  - mapping
  - trimap-method-initialization-analysis
  summary: TriMap denotes the sampled triplet embedding algorithm, not a three-valued
    segmentation trimap, generic ordinal embedding, its PCA-based global score, or
    PaCMAP’s pair losses. Version updates to sampling and weights are retained as
    method variations, not silently mixed with the older experiments.
  details: Triplet sampling, weighting, initialization and input metric influence
    the layout; minimizing the sampled objective does not guarantee satisfaction of
    every possible triplet or recovery of a unique manifold. The v2 PDF says its displayed
    experiments use older code. It updates counts from 10×5+5 to 12×4+3 and replaces
    the earlier weight transformation; these are not results for a single identical
    software version. Wang et al.’s initialization critique studies the older 55-triplet
    construction and should not be treated as a direct benchmark of every later revision.
    The separately proposed global score is based on linear reconstruction relative
    to PCA; it is not a universal geometric-fidelity certificate, and its displayed
    normalization requires nonzero PCA residual error.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A defined algorithm for constructing lower-dimensional coordinates,
      not a fitted embedding or task.
    evidence_ids:
    - trimap-method
  - name: mapping-direction
    value: related_match to AIO:DimensionalityReduction
    definition: A specific algorithm for constructing lower-dimensional representations,
      associated with the pinned dimensionality-reduction task. The target inherits
      UnsupervisedLearning under MachineLearningTask; related_match avoids treating
      the algorithm as identical to or a subclass of that task. Shared embedding components
      do not make this concept identical to PCA, MDS or t-SNE.
    evidence_ids:
    - trimap-method
    - mapping
- assessment_id: phate-method
  area: evidence
  topic: Method identity, source versions, objective scope and AIO mapping direction
  outcome: supported
  target_ids:
  - AIMech:PHATE
  evidence_ids:
  - phate-method
  - identity-search
  - mapping
  summary: PHATE uses potential distances between transformed diffusion distributions
    followed by stress fitting; AIMech:DiffusionMaps uses time-scaled Markov eigenvectors.
    PHATE is not generic MDS, a generative diffusion model, a branch-detection procedure
    or the DEMaP evaluation criterion. The core algorithm is distinct from its landmark
    approximation and multislice extensions.
  details: Neighborhood affinities, bandwidth, decay exponent and diffusion time determine
    the geometry; excessive diffusion can remove signal as well as noise. Negative
    logarithms require positive entries. Disconnected or numerically thresholded transitions
    need explicit zero-handling; the paper’s formula alone does not specify a universal
    remedy. A two- or three-dimensional stress fit can distort potential distances
    and does not guarantee global optimization, preservation of every manifold property
    or biological trajectories. The entropy discussion assumes a nonnegative spectrum
    for its probability normalization. This record does not certify that assumption
    for every adaptive kernel or treat the knee heuristic as an optimal-time theorem.
    The inspected PDF is marked corrected; the correction notice and access limitations
    are tracked in the discovery report.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A defined algorithm for constructing lower-dimensional coordinates,
      not a fitted embedding or task.
    evidence_ids:
    - phate-method
  - name: mapping-direction
    value: related_match to AIO:DimensionalityReduction
    definition: A specific algorithm for constructing lower-dimensional representations,
      associated with the pinned dimensionality-reduction task. The target inherits
      UnsupervisedLearning under MachineLearningTask; related_match avoids treating
      the algorithm as identical to or a subclass of that task. Shared embedding components
      do not make this concept identical to PCA, MDS or t-SNE.
    evidence_ids:
    - phate-method
    - mapping
- assessment_id: largevis-method
  area: evidence
  topic: Method identity, source versions, objective scope and AIO mapping direction
  outcome: supported
  target_ids:
  - AIMech:LargeVis
  evidence_ids:
  - largevis-method
  - identity-search
  - mapping
  summary: LargeVis combines a specific approximate-neighbor construction with a probabilistic
    layout objective. It is distinct from t-SNE’s normalized KL objective, UMAP’s
    locally scaled graph weights, LINE graph representations, and generic nearest-neighbor
    search.
  details: Graph construction is approximate; the reported near-perfect neighbor recovery
    on selected datasets is not a guarantee for arbitrary input. The sampled objective
    in equation (6) replaces the all-negative-pairs expression in equation (5); it
    is not asserted to be an unbiased evaluation of every original negative term.
    The linear layout-cost statement assumes fixed embedding dimension and negative-sample
    count with a number of updates proportional to points; it does not establish linear
    cost for all graph construction or convergence. Perplexity, graph quality, negative
    distribution, optimizer and chosen low-dimensional probability function affect
    results. No universal geometric fidelity or benchmark superiority is asserted.
  dimensions:
  - name: concept-kind
    value: algorithm
    definition: A defined algorithm for constructing lower-dimensional coordinates,
      not a fitted embedding or task.
    evidence_ids:
