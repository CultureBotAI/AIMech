limitations:
- Adversarial author self-review, not independent approval; all five records remain
  DRAFT.
- The parametric UMAP sampling qualification uses Theorem 5.1 and its within-batch
  degree-product weighting, rather than reusing the nonparametric effective-loss formula.
- The 2021 TriMap critique uses older weights and 55-triplet defaults; the 2022 v2
  paper mixes updated method notes with older experiments. No claim of a benchmark
  on all current versions is made.
- PHATE log positivity, possible MDS distortion and the stated spectral assumptions
  of its entropy heuristic remain explicit. No universal manifold or biological-trajectory
  guarantee is asserted.
- The corrected PHATE PDF was inspected; the separate correction notice body was available
  as indexed publisher text, while direct publisher access returned preview metadata.
  The discovery report records that distinction.
- LargeVis sampled likelihood and layout-only complexity are distinguished from all-negative-pair
  objectives and approximate graph construction.
- PaCMAP’s second-of-six sampling is not an exact global quantile, and its initialization
  robustness is explicitly incomplete.
- The initial vendored check failed because the sandbox could not resolve raw.githubusercontent.com.
  A network-enabled read-only retry passed all 22 pinned artifacts; both attempts
  are retained in the check summary.
- Only specified method and qualification passages and recorded rendered pages were
  scientifically reviewed. Extraction warnings and uninspected pages are retained
  in the discovery report.
- All required final checks passed. Prior and newly discovered candidates remain;
  discovery is ongoing.
