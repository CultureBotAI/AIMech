  snapshot_sha256: 131723625e0d68e6caac92bd3e904a96000a9b590550fcaf13be33f66a1dceed
  support: supports
  summary: 'The sampling analysis distinguishes Parametric UMAP’s within-batch negative
    samples and gives a batch-size-dependent effective objective with degree-product
