  summary: Fast Wasserstein Barycenters and Smoothed Dual Subgradient Descent is a
    distinct concept.
  details: Distinct from pairwise Sinkhorn distance evaluation (`AIMech:SinkhornDistancesAndEntropicRegularizedOptimalTransport`)
    and from Iterative Bregman Projections (`AIMech:IterativeBregmanProjectionsAndBregmanDykstraRegularizedOptimalTransport`).
    Specifically captures the Cuturi & Doucet (2014) primal-dual entropic smoothing
    of Wasserstein barycenters (Propositions 1 and 2, Equations 6-10), the Algorithm
    3 Sinkhorn primal-dual gradient extractor, the Algorithm 1 entropic mirror descent
    simplex optimizer for fixed-support weights, and the Equation 8 / Algorithm 2
    alternating Newton step for free-support atom locations under squared Euclidean
    ground cost.
