  summary: Retain the named alternating solver with a bounded objective.
  details: The raw-count exponential regression surrogate has separate convex coefficient
    and simplex blocks, but not joint convexity. Topic coefficients are directed nodewise
    parameters with excluded self terms; intercepts are unpenalized. Active-set quadratic
    directions, coordinate updates and backtracking distinguish it from SGD, Adam,
    generic pseudolikelihood and posterior EM. Finite derivatives verify average-objective
    scaling, and the joint Hessian witness defeats a generic joint-convexity assertion.
    Parallel subproblems do not establish universal speedup or global convergence.
