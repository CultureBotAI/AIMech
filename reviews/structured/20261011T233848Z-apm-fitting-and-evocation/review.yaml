limitations:
- Adversarial author self-review only; all records remain DRAFT.
- Thirteen new PDF pages and thirteen source files were completely inspected; the
  dataset binary, author experiments and external post-processing callbacks were not
  analyzed or executed.
- The four-page PDF was extracted from an official ZIP; its member and archive hashes
  are distinct. The source archive is pinned to the exact v0.9.1 commit and all thirteen
  read-file hashes match it.
- Supplement access failed through the web tool but direct public ZIP retrieval succeeded.
  One author landing-page open timed out; the official paper and code were accessible.
  These failures do not establish source absence.
- The public code does not implement the proper positive-edge joint-model modifications
  described in the papers. It also has bounded static numerical/indexing qualifications;
  no universal runtime failure or empirical impact is inferred.
- The existing APM construction remains a proper-base model definition. Its earlier
  ICML paper, supplement and fixed-length comparison were fully read in round98; this
  update adds follow-up evidence without changing those source bytes or claiming a
  new empirical replication.
- The scoring method depends on judged pairs, rating and topic scales, m, ties and
  aggregation. No annotation dataset or historical score was reproduced.
- All maintained records remain DRAFT; review is adversarial author self-review. There
  are 258 pending leads plus other unresolved dispositions; no saturation is claimed.
- Before formal review, separated the source-described proper-base model from the
  inspected raw-count solver and qualified pseudocode, static implementation and score-aggregation
  boundaries; all final record bytes were inspected.
