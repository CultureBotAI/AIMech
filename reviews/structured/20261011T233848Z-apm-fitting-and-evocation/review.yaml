  summary: Retain the score with explicit aggregation and evaluation scope.
  details: The top-m score sums human judgments on a fixed judged-pair set ranked
    by model weights. It is neither a probability nor a metric distance. Evoc-1 averages
    per-topic scores, while Evoc-2 scores averaged weight vectors. Independent rescaling
    preserves individual ranks but can alter Evoc-2; the synthetic witness changes
    it from 1 to 10 while Evoc-1 remains 5.5. Ties, m, rating scales, excluded unjudged
    pairs, sense collapse and direction averaging matter. The historical human-pair
    tuning/test split is not a claim of wholly unseen-document training.
