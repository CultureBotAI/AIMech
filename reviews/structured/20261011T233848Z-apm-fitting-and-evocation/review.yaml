  summary: Synthetic checks verify single-topic ranking invariance, show Evoc-2 changing
    from 1 to 10 under a topic rescaling while Evoc-1 stays 5.5, and expose tie sensitivity.
    Finite differences confirm average Poisson-objective derivatives including 1/n.
    A negative joint Hessian determinant illustrates separate-block but not joint
    convexity. Unequal conditional cross ratios witness incompatibility, positive
    quadratic count weights overwhelm factorial terms along a diagonal, and a static
    index enumeration exposes the released large-n omitted augmented row. A simplex
    pair transfer preserves feasibility. These are curator witnesses, not author-code
    execution or experimental reproduction.
