    ProbabilisticTopicModel mappings remain unchanged. MetricLearning denotes a representation-learning
    network, not evaluation scoring. EvaluationBias, RankingBias and ModelSelectionBias
    describe bias phenomena, not this procedure. AssociationRuleLearning is rule discovery,
    while this score assesses ranked pairs and the optimizer fits regressions. GLM,
    linear/logistic/lasso regression and RegressionAnalysis do not identify a simplex-coupled
    alternating optimizer; neither do feature extraction or generic representations.
