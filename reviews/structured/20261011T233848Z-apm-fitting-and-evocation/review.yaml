    value: related_match,related_match
    definition: The fitting algorithm maps related to TrainingStrategy and ProbabilisticTopicModel,
      preserving algorithm-versus-task scope. The evocation evaluation method maps
      related to ProbabilisticTopicModel because it assesses topic-derived word pairs,
      without claiming that a score is a model or task. The existing APM broad Model
      and related ProbabilisticTopicModel mappings remain unchanged. MetricLearning
      denotes a representation-learning network, not evaluation scoring. EvaluationBias,
      RankingBias and ModelSelectionBias describe bias phenomena, not this procedure.
      AssociationRuleLearning is rule discovery, while this score assesses ranked
      pairs and the optimizer fits regressions. GLM, linear/logistic/lasso regression
      and RegressionAnalysis do not identify a simplex-coupled alternating optimizer;
      neither do feature extraction or generic representations. Native Adam/SGD and
      EM/TEM have different updates; generic pseudolikelihood is an objective principle,
      not this solver. Poisson graphical model modifications differ in support/statistics
      and cannot be inferred from positive fitted coefficients. PLSA/LDA, SAGE and
      Replicated Softmax have different probability laws. Demographic parity is a
      prediction-independence criterion, not a word-pair score. Context reading does
      not renew approval of earlier concepts.
