  summary: FedPer (Federated Learning with Personalization Layers) is a distinct concept.
  details: Distinct from FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning,
    Collins et al. 2021), which alternates separate inner head-only optimization epochs
    and representation-only optimization steps within each round rather than jointly
    updating (W_{B,j}, W_{P_j}) simultaneously via coupled SGD steps (Algorithm 1,
    Line 5); and distinct from FedBABU (AIMech:FedBabuFederatedLearningWithOnlyBodyAggregationAndBodyUpdate,
    Oh et al. 2022), which freezes a shared random head (alpha_h = 0) during federated
    representation training.
