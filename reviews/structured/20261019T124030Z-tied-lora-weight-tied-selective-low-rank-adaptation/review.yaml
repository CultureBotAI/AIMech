  summary: Tied-LoRA is a distinct concept.
  details: Distinct from standard LoRA (AIMech:LoRA, which assigns independent untied
    projection matrices B_i and A_i to every adapted layer without diagonal scaling
    vectors), from VeRA (AIMech:VeRA, which freezes untied randomly initialized matrices
    B_i and A_i and trains only scaling vectors, a special case termed LoRA_vbuA in
    the Tied-LoRA taxonomy), and from PRoLoRA (AIMech:PRoLoRA, which tiles intra-layer
    chunks via roll-based partial rotation and block-shared submatrices rather than
    tying full low-rank projection matrices across transformer layers with selective
    training of {v, B, u, A}). Formulated by Renduchintala, Konuk, and Kuchaiev (NAACL
    2024, arXiv:2311.09578).
