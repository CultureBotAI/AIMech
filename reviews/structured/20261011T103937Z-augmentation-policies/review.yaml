limitations:
- Adversarial author self-review, not independent approval. All five records remain
  DRAFT.
- Only the documented PDF pages/sections and source line ranges were read. ReMixMatch’s
  unstamped author-hosted PDF is not asserted equivalent to an OpenReview release.
- CTAugment paper/code feedback, thresholds, sampling and posterize counts are explicitly
  different. The original arithmetic is not author-issued errata or benchmark verification.
- Augmentations need suitable task semantics and hyperparameters; no unconditional
  label preservation, accuracy gain, policy optimality, representational flattening
  or adversarial robustness is claimed.
- No actionable repository defect was found after source qualifications, so no review
  issue was manufactured. This does not close unrelated historical findings.
- Five additions and a nonempty inherited/new frontier leave discovery active.
