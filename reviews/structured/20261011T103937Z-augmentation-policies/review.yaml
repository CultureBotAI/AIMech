assessments:
- assessment_id: cutout
  area: evidence
  topic: Identity, definition, mechanism, source scope and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:Cutout
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - cutout-source-0
  summary: This record denotes the original random square masking procedure. It is
    distinct from unit-level Dropout, input-and-label MixUp, replacement with content
    from another image, and an augmentation policy that merely includes a cutout operation.
    A policy implementation can use a different fill value or mask-size convention
    without redefining the original paper’s exact rule. No normalized identity match
    was found across all 442 pinned AIO labels/scoped synonyms and 238 preceding native
    IDs/names/aliases. Full-checkout fixed-string searches included ignored and hidden
    files in both worktree and main checkout, returning 34 lines in each from prior
    discovery, saved reviews and related native records. Ten exact AIO CLASS nodes,
    their scoped synonyms and outgoing edges, plus five neighboring native mechanisms
    were inspected. This absence assessment is bounded to the pinned snapshot and
    inspected semantic neighborhood.
  details: 'For each training image, randomly choose a pixel within the image as the
    center of a fixed-size square mask. Set pixels in the overlapping image region
    to zero; the square may extend beyond the image boundaries, so its visible area
    can be smaller than the specified square. Apply the mask during training with
    the original label. The paper applies cutout to zero-centered data: zero denotes
    the normalization origin rather than necessarily a black pixel in the unnormalized
    image. Mask size is a tunable parameter. At test time, use the complete image
    without cutout or the activation rescaling associated with dropout. The earlier
    feature-activation-guided masking investigation and the fully-contained mask used
    with 50% probability are explored alternatives, not the final random-center rule.
    Limits: A removed region can contain the class-defining information; suitable
    mask size depends on image scale, data and task. Masking with unchanged labels
    assumes that the remaining image supports the original target. This is an inductive
    bias, not a semantic guarantee. The record does not assert a universal mask length,
    implementation-specific integer rounding, channel convention, benchmark gain or
    robustness guarantee.'
  dimensions:
  - name: concept-kind
    value: preprocessing_method
    definition: Specific image preprocessing for Cutout; augmentation selection or
      end-to-end representation training for the four algorithms.
    evidence_ids:
    - cutout-source-0
  - name: aio-relations
    value: 'broad_match: AIO:DataAugmentation'
    definition: Cutout is one particular transformation of training images that creates
      masked examples. The pinned AIO class denotes the broader data-augmentation
      method category; the relation is local-to-broader-target and does not edit the
      ontology.
    evidence_ids:
    - mapping
- assessment_id: autoaugment
  area: evidence
  topic: Identity, definition, mechanism, source scope and AIO mapping
  outcome: supported
  target_ids:
  - AIMech:AutoAugment
  evidence_ids:
  - identity
  - mapping
  - neighbors
  - autoaugment-source-0
  summary: AutoAugment denotes a learned policy-search process and its resulting policies,
    not a single image transform or a network checkpoint. It differs from RandAugment’s
    uniform operation sampling and compact target-task hyperparameter search, and
    from CTAugment’s online prediction-feedback adaptation. Reinforcement learning
    is used to choose augmentations here; the child’s classification task is not thereby
    reclassified as reinforcement learning. No normalized identity match was found
    across all 442 pinned AIO labels/scoped synonyms and 238 preceding native IDs/names/aliases.
    Full-checkout fixed-string searches included ignored and hidden files in both
    worktree and main checkout, returning 34 lines in each from prior discovery, saved
    reviews and related native records. Ten exact AIO CLASS nodes, their scoped synonyms
    and outgoing edges, plus five neighboring native mechanisms were inspected. This
    absence assessment is bounded to the pinned snapshot and inspected semantic neighborhood.
  details: 'In the published search space, a policy contains five subpolicies, each
    with two ordered operations. An operation has a type, application probability
    and magnitude; the search uses 16 operation types, 11 probability values and 10
    magnitude values, with magnitude ignored when an operation does not need it. During
    child-model training, select a subpolicy uniformly for each image and apply its
    operations according to their respective probabilities. An autoregressive recurrent
    controller samples the policy decisions. Train the child model on the training
    split with that policy, measure held-out validation accuracy, and use that reward
    to update the controller with proximal policy optimization. The described controller
    emits 30 decisions for the five two-operation subpolicies. After search, concatenate
    the subpolicies from the five best policies into a 25-subpolicy policy for final
    model training. Particular child architectures, search budgets and augmentation
    baselines are experimental settings rather than the identity of the procedure.
    Limits: Searching by training child models requires computation, and a policy
    selected on a smaller proxy model or dataset may not transfer optimally to the
    final training setting. Operation probabilities and magnitudes are task-sensitive;
    an operation can destroy class information. The record follows the augmentation
    decision space and does not import the paper’s unrelated convolutional-cell/block
    wording in the controller hyperparameter paragraph. No claim of globally optimal
    policies, fixed controller architecture, universal policy transfer or benchmark
    improvement is made.'
