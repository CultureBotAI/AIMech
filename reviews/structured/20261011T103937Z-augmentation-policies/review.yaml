  summary: Retain five distinct concepts with justified mappings.
  details: Cutout is a specific training-image transformation and has a local-to-broader
    DataAugmentation mapping. AutoAugment, RandAugment and CTAugment include policy
    selection or adaptation and relate to that augmentation class without forcing
    their full algorithms into its preprocessing scope. Manifold Mixup relates to
    DataAugmentation and SupervisedLearning; it is an end-to-end training objective
    with learned representations, not a preprocessing layer. AIO ImageAugmentationLayer,
    RegularizationLayer and DropoutLayer are not equivalent identities. AutoAugment’s
    controller reward does not turn the child classification task into the AIO ReinforcementLearning
    task. Native MixUp, ICT, MixMatch, ReMixMatch and FixMatch remain distinct from
    these components.
