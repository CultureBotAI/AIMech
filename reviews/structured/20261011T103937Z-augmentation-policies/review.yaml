  summary: RandAugment is distinct from the learned operation probabilities and per-operation
    magnitudes of AutoAugment, the feedback-adapted parameter weights of CTAugment,
    and a particular library’s later RandAugment variant. Reducing the search to N
    and M does not eliminate hyperparameter tuning or make the procedure parameter-free.
    No normalized identity match was found across all 442 pinned AIO labels/scoped
    synonyms and 238 preceding native IDs/names/aliases. Full-checkout fixed-string
