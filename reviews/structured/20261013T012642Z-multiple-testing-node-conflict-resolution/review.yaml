  summary: Supported with the stated assumptions and boundaries.
  details: Specify the data partitions, separator copies, common parameter transformations
    and family of comparisons before interpreting adjusted conflict. The source partitions
    the evidence into Q submodels and compares separator quantities informed by more
    than one partition. Proper partition posteriors are required to define these distributions.
    Poor identification can make comparisons prior-driven or uninformative even when
    a score is computable; calibrated testing requires the separately stated regularity
    and sampling assumptions. Weak data and reference priors can materially determine
    the result. Multiarm trial information must retain its joint structure. Separate
    observed data subsets do not by themselves ensure independent fitted partitions
    when latent or estimated nuisance quantities are shared.
- assessment_id: signed-contrasts
  area: evidence
  topic: signed-contrasts
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - hothorn2008
  - calculation
  summary: Supported with the stated assumptions and boundaries.
  details: 'Let phi stack the declared separator copies, u=h(phi), and K be a fixed
    matrix whose rows encode comparisons. Define Delta=K*u; a pairwise difference
    row contains +1 and -1. K may be rectangular and pairwise comparisons may be redundant.
    From joint draws of u, compute m=E(Delta) and S=Cov(Delta)=K*Cov(u)*K^T. Block-diagonal
    partition covariance requires justified independence. If instead applying a local
    delta approximation on the original phi scale, include the transformation Jacobian
    J: S approximately equals K*J*Cov(phi)*J^T*K^T. A plug-in K*h(E(phi)) approximates,
    rather than generally equals, E(Delta).'
- assessment_id: standardization-and-support
  area: evidence
  topic: standardization-and-support
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - hothorn2008
  - calculation
  summary: Supported with the stated assumptions and boundaries.
  details: For a p-component contrast vector with positive finite diagonal variances,
    set D=diag(S), T=D^(-1/2)*m and R=D^(-1/2)*S*D^(-1/2). Correlation R may be singular
    because comparisons are redundant. Zero-variance or deterministic contrasts require
    an explicit support check and separate handling; they cannot be standardized by
    division by zero. A null vector outside the posterior affine support is not rescued
    by a pseudoinverse. Numerical rank thresholds and covariance approximation affect
    the resulting diagnostics.
- assessment_id: wald-global-score
  area: evidence
  topic: wald-global-score
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - hothorn2008
  - calculation
  summary: Supported with the stated assumptions and boundaries.
  details: One global option is W=m^T*S^+*m, equivalently T^T*R^+*T when the mean
    lies in the covariance range, with + denoting the Moore–Penrose pseudoinverse.
    Under a justified Gaussian null reference on an r-dimensional contrast subspace,
    use the upper chi-square_r tail, where r is the covariance rank. This quadratic
    global assessment differs from max-absolute-statistic testing and does not itself
    identify the inconsistent component. Its reference law needs support and calibration
    assumptions beyond computing a posterior mean and covariance.
- assessment_id: single-step-maxt
  area: evidence
  topic: single-step-maxt
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - hothorn2008
  - calculation
  summary: Supported with the stated assumptions and boundaries.
  details: For a centered joint normal reference Z with covariance R, define M=max_j
    |Z_j| and G_R(c)=P(-c<=Z_j<=c for all j). The global maxT score is 1-G_R(max_j
    |T_j|); a single-step adjusted score for component j is 1-G_R(|T_j|), using the
    same declared comparison family. This is an absolute maximum for two-sided tests,
    not the maximum of signed components. The rectangle probability incorporates correlation
    and can accommodate redundant coordinates under a valid singular normal law. Under
    the same continuous reference, each adjusted score is at least its corresponding
    marginal two-sided normal tail. This comparison does not automatically hold between
    differently approximated or sampled raw and adjusted scores.
- assessment_id: error-control-conditions
  area: evidence
  topic: error-control-conditions
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - hothorn2008
  summary: Supported with the stated assumptions and boundaries.
  details: The joint reference construction targets familywise error, not a false-discovery-rate
    guarantee. Exact or asymptotic repeated-data control requires a valid joint null
    law for the true-null comparisons, an appropriately estimated covariance and a
    declared testing family; posterior Gaussianity alone is insufficient. Hothorn
    and colleagues state a multivariate sampling limit and consistent covariance estimation
    for their general parametric procedure. Applying that reasoning to split Bayesian
    summaries requires verifying the relevant regularity and prior-dominance conditions,
    rather than assuming every split satisfies them. Adaptive partition searches,
    incompatible priors, shared nuisance fitting, weak identification and nonnormal
    posteriors need further assessment.
- assessment_id: interpretation-and-source-boundaries
  area: evidence
  topic: interpretation-and-source-boundaries
  outcome: supported
  target_ids:
  - AIMech:MultipleTestingNodeConflictDiagnostic
  evidence_ids:
  - presanis2017
  - presanis2013
  - hothorn2008
  - calculation
  summary: Supported with the stated assumptions and boundaries.
  details: An adjusted continuous tail is not the posterior probability that two quantities
    are exactly equal. The choice of split, reference prior, scale and testing family
    changes the diagnostic; masking can remain, and a small score does not establish
    which source is wrong or authorize its exclusion. The record uses signed contrast
    matrices, proper normalized posteriors, explicit transformation Jacobians and
    max-absolute tails. It does not import the 2017 source expressions that apply
    a second two-tail transform to an already two-sided density-level score, describe
    difference matrices with only 1s and 0s, or require an invertible contrast matrix.
    These qualifications preserve the method without treating source notation as a
    general theorem.
