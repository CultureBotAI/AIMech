  details: Three independent standard-normal copies and signed differences give covariance
    [[2,1,-1],[1,2,1],[-1,1,2]], rank 2, and mean [2,3,1]. The Wald score is 14/3,
    with chi-square_2 tail 0.0969719679. Max-absolute adjustment instead gives global
