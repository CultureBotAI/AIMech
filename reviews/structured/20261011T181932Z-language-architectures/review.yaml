  summary: Retain the node-conditioned nonlinear architecture.
  details: The exact PDF predictor has separate node embeddings and biases, with shared
    context embeddings and nonlinear-network parameters. The finite example gives
    two hidden values 0.604367777 and -0.379948962 despite parameter sharing; its
    three leaves normalize and the beta gradient agrees with finite differences. W
