  summary: 'All 85 semantic label/scoped-synonym hits were read, followed by 20 complete
    CLASS nodes with annotations/outgoing edges and corresponding generated YAML,
    and four complete native neighbors. All three architectures broadly map to AutoregressiveLanguageModel:
    they model next words from preceding finite context. This uses sequential factorization,
    not the AIO definition’s qualitative performance claim. LanguageModel is also
    broader but redundant. HierarchicalLanguageModel describes multilevel language
    representations rather than uniquely identifying a word-probability tree. ImplicitLanguageModel
    and EnergyBasedLLM score whole sequences without autoregressive factorization,
    unlike LBL’s conditional energy. FactoredLanguageModel denotes explicit linguistic
    factors; FactorizedLLM denotes component/expert decomposition. DeepFeedForwardNetwork
    inherits the multiple-hidden-layer requirement, while the named constructions
    do not require that depth; Perceptron is a binary linear classifier. EmbeddingLayer,
    OutputLayer, SoftmaxLayer, HiddenLayer and ProbabilisticHiddenLayer are components,
    not equivalent complete architectures. BayesianNetwork provides a broader factorization
    viewpoint but not these parameterizations. RBM/Boltzmann identities require stochastic
    undirected structure absent here. HierarchicalSoftmax is an output component;
    DocNADE has additive order-insensitive prefix features, NADE binary fully visible
    conditionals, and ReplicatedSoftmax undirected length-conditioned latent structure.
    These older records are boundary context, not newly approved targets.'
