  summary: Retain flat LBL separately from latent-state and tree-output models.
  details: The 2007 score r_context^T C_i r_word implies column prediction using C_i
    transposed; the 2008 exposition adopts the opposite orientation. The nonsymmetric
    toy matrices yield r_hat=(0.26,0.14), and using the wrong transpose changes the
    features. Position swaps change the word distribution. Central differences verify
    every context-matrix and tied-embedding gradient; omitting the context role fails
    for an embedding also used as a target. Conditional candidate normalization is
    a finite vocabulary sum, not a global sequence-energy partition or a stochastic
    latent-state approximation.
