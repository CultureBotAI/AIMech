  summary: 'This is the original Mnih–Hinton LBL construction. It uses the same word-embedding
    matrix for context and candidate words, has no stochastic hidden variables, and
    retains a flat vocabulary normalizer. HLBL replaces that output parameterization
    with tree-node decisions. The FRBM and temporal FRBM in the same 2007 paper are
    separate latent-variable architectures, not aliases for LBL. All 442 pinned AIO
    labels/scoped synonyms and 355 preceding native IDs/names/aliases were compared,
    with no normalized identity match. Full-checkout fixed-string searches included
    ignored and hidden files in both worktree and main, returning 54 lines each. All
    41 unique matched contents were read: source references, complete-model contrasts,
    frontier leads and prior review context for the hierarchical-softmax component.
    None is an existing record for these complete architectures. Twenty exact AIO
    nodes and their generated records plus four complete native neighbors were inspected.
    Absence is bounded to this snapshot and semantic neighborhood.'
  details: 'In the 2007 row-vector convention, let r_w be a word’s embedding written
    as a column, C_i the transform for context position i, b_r a feature bias and
    b_w a candidate-word bias. The candidate score is sum_i r_context_i^T C_i r_w+b_r^T
    r_w+b_w. Equivalently, form r_hat=b_r+sum_i C_i^T r_context_i once, then take
    score_w=r_hat^T r_w+b_w and apply the vocabulary softmax. The original energy
    is the negative of this score. Maximum-likelihood gradients are observed sufficient
    statistics minus their exact finite-vocabulary conditional expectations. Because
    the embedding matrix is shared, its gradient includes both input-context and candidate-output
    roles. The 2008 exposition writes r_hat=sum_i C_i r_context_i with the opposite
    matrix orientation and without an explicit feature bias; this is a notation/parameterization
    distinction to preserve when comparing formulas. Limitations: The context feature
    computation is linear, while normalization makes word probabilities nonlinear.
    Position-specific transforms preserve context order; the construction is not generally
    a bag-of-words model. Without an additional exact computational method, the original
    flat normalizer requires summing candidate scores over the vocabulary. Absence
    of stochastic hidden variables makes this expectation explicit, not independent
    of vocabulary size. Bilinear scores and shared learned embeddings do not make
    joint parameter fitting a convex optimization problem. Exact likelihood gradients
    do not guarantee a global optimum or calibrated predictions. The energy scores
    one candidate conditional on its context; it is not the unnormalized energy of
    a whole sequence used by the pinned ImplicitLanguageModel or EnergyBasedLLM classes.
    The record covers a fixed-context word model, without asserting long-context capability,
    benchmark superiority, author-code behavior or the mechanisms of the neighboring
    FRBM variants.'
