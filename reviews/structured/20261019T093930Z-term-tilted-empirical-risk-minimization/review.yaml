  summary: TERM (Tilted Empirical Risk Minimization and Hierarchical Multi-Objective
    Tilting) is a distinct concept.
  details: Distinct from q-FFL (AIMech:QFairFederatedLearningAlphaFairResourceAllocation,
    Li et al. 2020), which raises positive losses to a polynomial power (1/(q+1))
    F_k^{q+1}(w) for q >= 0 only and cannot take negative exponents to suppress outliers
    or nest hierarchical group/sample tilts; and distinct from Agnostic Federated
    Learning (AIMech:AgnosticFederatedLearningMinimaxDistributionallyRobustOptimization,
    Mohri et al. 2019), which solves a hard minimax saddle-point problem min_w max_{lambda
    in Lambda} L_lambda(w) rather than a smooth, tunable cumulant-generating log-sum-exp
    objective spanning min-loss (t -> -inf), average-loss (t -> 0), and max-loss (t
    -> +inf).
