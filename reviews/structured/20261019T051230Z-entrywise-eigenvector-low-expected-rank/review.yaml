    terms of the matrix $\ell_\infty$ operator norm $\|\mathbf{E}\|_\infty = \max_i
    \sum_j |E_{ij}|$ requiring $O(r^{5/2}\mu^{3/2}\|\mathbf{E}\|_\infty / (\gamma_0\sqrt{d}))$
