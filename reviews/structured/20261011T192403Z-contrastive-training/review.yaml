  summary: This is persistent contrastive divergence as presented for RBMs by Tieleman.
    Persistence refers to the fantasy-particle sampling state across learning updates,
    not continual-learning tasks or recurrent sequence-model state. It is an instance
    of persistent-chain stochastic-approximation learning, not the original data-restarted
    CD-k rule. Fast PCD adds temporary sampling parameters and remains a separate
    variant. All 442 pinned AIO labels/scoped synonyms and 370 preceding native IDs/names/aliases
    were compared, with no normalized identity match. Fixed-string searches included
    ignored and hidden files throughout both worktree and main, returning 29 lines
    each; all 22 unique matched contents were read. Hits described CD as a training
    component, a pending lead or a boundary from CD-PercLoss, not an existing candidate
    record. All 61 semantic label/synonym hits, 21 exact annotated AIO nodes with
    outgoing edges, corresponding generated records and four native neighbors were
    inspected. Previously fully read contextual files were verified byte-identical.
    Absence is bounded to this snapshot and inspected neighborhood.
  details: 'Maintain a collection of fantasy-particle configurations independently
    of which data minibatch is currently presented. Compute positive-phase sufficient
    statistics from that minibatch, using exact hidden conditional expectations for
    an RBM. Advance the existing fantasy particles by a small number of Gibbs transitions
    under the current model parameters and estimate negative-phase statistics from
    those particles. Update the model parameters from the positive-minus-negative
    difference and retain the particle states for subsequent iterations. The 2008
    experiments use one full Gibbs step per update, one particle per minibatch member
    and no chain resets; those are specified experimental choices, while persistence
    is the defining distinction. If the chain distribution tracks the current equilibrium
    sufficiently closely, its negative statistics approximate those of the model.
    For fixed particle-distribution R, the instantaneous update can be expressed as
    the negative derivative of KL(q_data||p_theta)-KL(R||p_theta), with R held fixed;
    this does not make the whole coupled adaptive process descent on one fixed objective.
    Limitations: Finite transitions, correlated particles and changing parameters
    can leave negative statistics biased for the current equilibrium expectation.
    The small-learning-rate justification depends on mixing relative to parameter
    drift; it is not a guarantee at every finite step size. A persistent chain is
    neither an independent model sample at each iteration nor a proof of rapid mixing.
    The original paper discusses difficulties when strong dependencies or large weights
    slow exploration, and the regularization and learning-rate schedule affect behavior.
    Exact positive-phase inference is available for the binary RBM formulation inspected
    here; that property does not transfer automatically to models with interacting
    latent variables. The paper also examines fully visible MRFs with different update
    costs and sampling structure. The fixed-R contrastive expression is an instantaneous
    derivative description. Particle evolution and parameter adaptation remain coupled;
    the ordinary data-restarted contrastive-divergence objective does not describe
    that entire process. The retained particles and one-step experimental choice do
    not imply that conditional models with changing conditioning inputs have the same
    tracking problem as an unconditional RBM. No universal superiority, global convergence
    or author-code behavior is certified.'
