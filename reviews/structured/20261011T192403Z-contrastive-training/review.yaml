  kind: record_content
  reference: research/discovery/contrastive-training-boundaries.py
  locator: CD versus likelihood and formal-objective gradients; nonzero curl; persistent
    versus restarted transitions; fixed-R derivatives; fast-parameter arithmetic and
    hidden-mean substitution
  accessed_at: '2026-10-11T19:19:30Z'
  snapshot_sha256: e32d57c37dbff0947826ab4c3ce6d73e4f6cf32bd579da4a9abc58f03ced599e
  support: supports
  summary: Exact finite-state arithmetic for a one-visible/one-hidden RBM distinguishes
    CD-1, likelihood and full-CD-objective gradients, reproduces the published nonzero
    cross-partial difference to 4.60e-12 and verifies fixed-kernel invariance. One
    hundred fixed-parameter transitions approach the likelihood gradient in this example,
    without establishing a general mixing rate. Carrying a state distribution across
    two different kernels differs from restarting at the data. Frozen-R contrastive
    derivatives match central differences to 1.14e-11. Fast-overlay arithmetic distinguishes
    regular and sampling probabilities, checks the shared-gradient/decay update and
    shows that substituting hidden means is not the exact binary Gibbs transition.
    These are original mathematical witnesses, not training, implementation or benchmark
    reproduction.
