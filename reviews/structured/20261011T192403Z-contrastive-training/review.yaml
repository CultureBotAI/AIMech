    objective that motivated it. The number of transition steps is an algorithm parameter,
    not a separate architecture. It differs from persistent-chain learning, CD-PercLoss
    prediction search and pairwise representation-learning losses. The short aliases
    are contextual, not evidence of equivalence to every use of those initials. All
    442 pinned AIO labels/scoped synonyms and 370 preceding native IDs/names/aliases
    were compared, with no normalized identity match. Fixed-string searches included
    ignored and hidden files throughout both worktree and main, returning 29 lines
    each; all 22 unique matched contents were read. Hits described CD as a training
    component, a pending lead or a boundary from CD-PercLoss, not an existing candidate
    record. All 61 semantic label/synonym hits, 21 exact annotated AIO nodes with
    outgoing edges, corresponding generated records and four native neighbors were
    inspected. Previously fully read contextual files were verified byte-identical.
    Absence is bounded to this snapshot and inspected neighborhood.
  details: 'For each observed example or minibatch, initialize a Markov chain at the
    data and perform k transitions with the model parameters held fixed. For an RBM,
    alternate sampled hidden and visible blocks, then compute hidden conditional expectations
    at the resulting visible configurations for the negative statistics. Update weights
    by a learning rate times observed-data minus k-step reconstructed visible-hidden
    statistics; update biases by the corresponding first-moment differences. More
    generally, contrast derivatives of the unnormalized log model at the data and
    chain endpoints, treating the endpoints as fixed for the update. The motivating
    objective is C_k(theta)=KL(q_data||p_theta)-KL(q_data T_theta^k||p_theta). Its
    exact derivative also contains the parameter dependence of the k-step distribution;
    the customary CD update omits that contribution. With a fixed ergodic kernel and
    sufficiently long chains, the negative expectation approaches the equilibrium
    expectation; a short-chain update does not assume that limit has been reached.
    For the noiseless binary-RBM CD-1 update, the inspected source gives a one-visible/one-hidden
    counterexample with hidden bias fixed at zero and data visible=0. At weight 1
    and visible bias 0, the cross-partial difference is e*(e-1)*(e+3)/(8*(e+1)^3),
    which is nonzero. This rules out a universal scalar potential for that update
    field. Its constructed cycling regularizer and separate fixed-point results have
    narrower assumptions than a general convergence claim. Limitations: A short-chain
    CD estimate is generally biased for the likelihood gradient and is not generally
    the exact negative gradient of the formal contrastive-divergence objective. A
    small objective or accurate reconstruction can coexist with poor global modeling
    when the chain mixes slowly. The binary-RBM CD-1 field can have unequal cross
    partial derivatives, so it is not universally the gradient of any scalar objective.
    The inspected convergence paper also constructs cycling with a particular nonconvex
    regularizer; this is not a claim that ordinary L2-regularized CD always cycles.
    Existence of a regularized fixed point does not establish convergence to it. Exact
    Gibbs transitions require sampled states. Conditional expectations can replace
    final sufficient statistics by Rao–Blackwellization, but feeding probability-valued
    states into later nonlinear transition conditionals defines a different approximation.
    Hinton Section 8 explicitly uses such a probability-valued visible reconstruction
    in its digit experiment; that variant is not silently equated to exact binary
    Gibbs CD. The original simulations do not prove universal likelihood improvement,
    unbiased learning or global convergence. Their digit classification experiments
    also disclose test-set model selection; no reported ranking is adopted as a general
    property. The algorithm is not tied to an RBM architecture, and the formal objective
    is not merely a difference of mean log likelihoods: distribution-entropy terms
    matter. No author implementation, training run or complete convergence theorem
    is certified.'
