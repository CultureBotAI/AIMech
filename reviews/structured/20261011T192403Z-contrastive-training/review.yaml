  rationale: CD restarts its short chain at the observed data and omits differentiation
    through that chain distribution. PCD retains fantasy-particle states across parameter
    updates. Fast PCD adds a temporary decaying sampling overlay distinct from the
    learned base model. Common model statistics and use of Markov transitions do not
    erase these algorithmic distinctions. AIO associations remain related model/process
    mappings.
limitations:
- Adversarial author self-review only; every target remains DRAFT.
- All 30 Hinton2002, eight Tieleman2008, eight Tieleman2009 and seven Sutskever2010
  pages were visually read. Conversion and access hashes alone do not certify scientific
  content.
- The two Tieleman PDFs have no printed page numbers. Hinton2002 and Sutskever2010
  use explicit printed/PDF offsets; original versions, timestamps and hashes are preserved.
- The FPCD hidden-state pseudocode ambiguity and Sutskever2010 display issues are
  disclosed. The nonzero curl is checked directly; author implementations, general
  convergence proofs and benchmark results are not certified.
- Finite examples check explicitly stated mathematical boundaries, not training outcomes
  or universal mixing behavior.
- 203 pending leads plus unresolved dispositions remain; discovery is active.
