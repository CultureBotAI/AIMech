  details: Resolved against all 442 pinned AIO concepts and 672 maintained AIMech
    concepts. Distinct from `AIMech:TwoStageHardThresholdingWithVotingAndPluralityRuleForInvalidInstruments`
    (Guo, Kang, Cai, & Small 2018, which assumes well-separated invalidity levels
    so $\widehat{\mathcal{V}} = \mathcal{V}$ consistently and suffers post-selection
    undercoverage when locally invalid instruments satisfy $0 < |\pi_j^*/\gamma_j^*|
    < s_j(n)$), from `AIMech:SomeInvalidSomeValidInstrumentalVariablesEstimatorAndMajorityRuleIdentifiability`
    (Kang, Zhang, Cai, & Small 2016, which provides $\ell_1$ penalized point estimation
    under the 50% majority rule without uniform confidence intervals), and from `AIMech:SelfTuningPivotalHighDimensionalInstrumentalVariablesAndSensitivityConfidenceSets`
    (Gautier & Tsybakov 2018, which requires a user-specified bound $\Upsilon$ on
    invalid-instrument violations rather than searching and sampling over majority/plurality
    voting counts).
