  summary: LM Distill + Ranker Distill (Two-Round Knowledge Distillation for BERT
    Rankers) is a distinct concept.
  details: Distinct from single-stage Ranker Distill (which distills a fine-tuned
    BERT ranker directly onto a randomly initialized student and fails to recover
    general language modeling knowledge) and from LM Distill + Fine-tuning (which
    fine-tunes a distilled LM directly on hard search labels and degrades or overfits
    under high compression such as 4-layer H=312 students). By pairing LM Distill
    initialization with Ranker Distill intermediate-attention and output supervision,
    LM Distill + Ranker Distill prevents overfitting past 5M training pairs and achieves
    statistical non-inferiority on both 6-layer (H=768) and 4-layer (H=312) rankers.
