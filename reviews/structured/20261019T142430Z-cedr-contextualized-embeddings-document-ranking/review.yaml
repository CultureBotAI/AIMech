  summary: CEDR Contextualized Embeddings for Document Ranking is a distinct concept.
  details: Distinct from Vanilla BERT cross-encoder re-rankers, which predict relevance
    solely from a linear projection of the final-layer [CLS] vector without computing
    token-to-token cosine similarity matrices or soft term-counting kernels across
    intermediate layers; and distinct from static-embedding interaction rankers (KNRM,
    PACRR, DRMM with GloVe/Word2Vec), where identical surface words always receive
    cosine similarity 1.0 regardless of polysemous context.
