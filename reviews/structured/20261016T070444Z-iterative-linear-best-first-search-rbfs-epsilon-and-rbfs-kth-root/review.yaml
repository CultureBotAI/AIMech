  details: 'Prospective snapshot collected at HEAD bcf1e846fe3d3dbb6d0651d32db6b7045fd28cae
    on goal/discover-ai-concepts-round361: 804 native and 442 AIO records, 4,937 ID/local-ID/name/alias/scoped-synonym
    occurrences and 3,774 normalized values. Four roots searched including ignored
