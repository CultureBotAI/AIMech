assessments:
- assessment_id: ilbfs-claim-principal-branch-and-frontier
  area: evidence
  topic: 'Iterative linear best-first search: principal-branch-and-frontier'
  outcome: supported
  summary: The source describes a path with immediate children, and Table 1 gives
    b*d. The draft explicitly states the bounded branching and node-data interpretation
    instead of a byte cap.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-04
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The explicit TREE representation retains a principal branch of internal
    nodes and their immediate children, while OPEN contains its frontier. With branching
    bounded by b, retained depth bounded by d and bounded per-node data, this path-and-children
    representation uses O(b*d) node storage, which is depth-linear when b is fixed.
- assessment_id: ilbfs-claim-minimum-frontier-selection
  area: evidence
  topic: 'Iterative linear best-first search: minimum-frontier-selection'
  outcome: supported
  summary: The listing places the goal test before collapse and child generation.
    Initialization/exhaustion are left qualified, rather than completed by an invented
    guard.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-05
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The low-level loop selects a node with minimum stored value from OPEN and
    checks for a goal before changing the retained branch. It then generates children
    of the selected node and inserts them into OPEN and TREE. Root, tie and exhaustion
    conventions must be supplied consistently with the qualified source outline.
- assessment_id: ilbfs-claim-eager-bottom-up-collapse
  area: evidence
  topic: 'Iterative linear best-first search: eager-bottom-up-collapse'
  outcome: supported
  summary: Case 2 and Algorithm 2 agree on upward deletion/backup. The claim identifies
    those sources so that the contrary high-level ancestry line remains visible as
    limitation 1.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-06
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: 'When the newly selected node is not a child of the previously expanded
    node, the operational prose and low-level listing collapse the departing branch
    bottom-up: back up the minimum child value, return that parent to OPEN, remove
    its children from OPEN and TREE, and continue toward the parent of the new best
    node. Collapse is triggered by a branch switch rather than by exhausting a fixed
    memory budget.'
- assessment_id: ilbfs-claim-conditional-value-inheritance
  area: evidence
  topic: 'Iterative linear best-first search: conditional-value-inheritance'
  outcome: supported
  summary: Lines 13–15 preserve static values on first generation and condition inheritance
    on the parent being backed up. This avoids importing unconditional first-visit
    pathmax.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-07
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: For a generated child C, the low-level rule first assigns its static evaluation
    f(C). Only when the selected parent has F(best)>f(best) does it raise a child
    value below F(best) to that stored parent value. Ordinary iterations with this
    conditional rule carry out the source’s regeneration process; the rule is not
    unconditional pathmax on an initial visit.
- assessment_id: ilbfs-claim-depth-first-tie-conditioned-collapse-marker
  area: evidence
  topic: 'Iterative linear best-first search: depth-first-tie-conditioned-collapse-marker'
  outcome: supported
  summary: The strict inequality argument explicitly assumes depth-first ties, and
    footnote 8 discusses nonmonotonicity. The claim reports that source argument within
    its stated control process, not a fully reproved invariant.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-08
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: For its particular collapse process, the paper argues that depth-first
    tie handling makes a departing collapsed branch satisfy F(B)>f(B), and uses the
    F>f test to identify prior collapse. The paper explicitly extends these observations
    to nonmonotone static evaluations. This is a source-qualified invariant under
    that process and tie convention, not a universal property of every collapse policy.
- assessment_id: ilbfs-claim-explicit-counterpart-to-full-rbfs
  area: evidence
  topic: 'Iterative linear best-first search: explicit-counterpart-to-full-rbfs'
  outcome: supported
  summary: The explicit/recursive comparison is the source’s stated relationship.
    Independent granularity review accepts a procedural representation without asserting
    a distinct extensional search order.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-09
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The paper presents ILBFS as an iterative counterpart of the compared full
    RBFS formulation, with corresponding search steps under its conventions. ILBFS
    represents the principal branch and alternatives explicitly in OPEN/TREE; RBFS
    retains corresponding information through recursive frames and a competitive bound.
    The distinction is procedural organization, without a claimed new search ordering
    or solution-quality advantage over that counterpart.
- assessment_id: ilbfs-limitation-1
  area: scope
  topic: 'Iterative linear best-first search: limitation 1'
  outcome: supported
  summary: Literal directional mismatch is retained; the operational description has
    named source precedence, not a silent repair.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-10
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The high-level Algorithm 1 line 8 reverses the sibling/ancestor description
    of the branch to collapse relative to the Case 2 prose and low-level Algorithm
    2. The mechanism above follows the latter two explicitly; the literal high-level
    discrepancy is retained and no repaired implementation is certified.
- assessment_id: ilbfs-limitation-2
  area: scope
  topic: 'Iterative linear best-first search: limitation 2'
  outcome: supported
  summary: Inspection of both listings establishes a bounded interface gap, not a
    proven failure of every implementation.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-11
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The printed low-level outline leaves root/NULL-parent conventions, empty-child
    minima and complete infinity/exhausted-frontier handling incompletely specified.
    The compared RBFS listing explicitly includes an empty-successor return and a
    finite-value guard. ILBFS goal testing precedes collapse, and the outline is not
    a complete production interface for every dead end or unsolvable input.
- assessment_id: ilbfs-limitation-3
  area: scope
  topic: 'Iterative linear best-first search: limitation 3'
  outcome: supported
  summary: Generic reopening assumptions do not specify the whole ILBFS duplicate/cycle
    interface. No broader completeness theorem is supplied by this draft.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-12
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The path-and-children description does not provide a complete general graph
    duplicate-state, cycle or reopening policy. Generic best-first discussion assumes
    reopening for inconsistent heuristics, but that is not a demonstrated ILBFS graph
    implementation. No completeness, optimality or termination guarantee is extended
    here to arbitrary infinite spaces, zero-cost cycles or unspecified goal/cost assumptions.
- assessment_id: ilbfs-limitation-4
  area: scope
  topic: 'Iterative linear best-first search: limitation 4'
  outcome: supported
  summary: The general lossy summary and source-specific restoration argument have
    distinct scopes.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-13
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: A generic collapse stores only a frontier summary and is described as lossy
    compression. Its monotone bounded-search restoration discussion must not be promoted
    to an exact inverse for arbitrary collapsed subtrees. The ILBFS-specific F>f regeneration
    argument depends on its own branch-switch and depth-first tie conventions; changing
    those conventions requires a new argument.
- assessment_id: ilbfs-limitation-5
  area: scope
  topic: 'Iterative linear best-first search: limitation 5'
  outcome: supported
  summary: Node count and total memory are separated; no fixed MAX budget is inferred.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-14
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - actual-write
  - actual-reading
  - actual-adversarial
  details: O(b*d) is a retained-node model with bounded branching, attained depth
    and per-node data, not a fixed maximum-node budget or a total-byte guarantee.
    State encodings, heuristic tables, explicit queues, transient allocations and
    any duplicate/transposition tables require separate space accounting; SMA* memory-budget
    properties do not follow from shared backup/deletion ideas.
- assessment_id: ilbfs-limitation-6
  area: scope
  topic: 'Iterative linear best-first search: limitation 6'
  outcome: supported
  summary: The bounded source relationship does not collapse different inheritance
    policies or unread historical versions.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-felner2015-15
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - triple-granularity-review
  - triple-native-context
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The same-step comparison is to the full RBFS formulation reproduced in
    this source under compatible selection and tie conventions. It is not a global
    alias claim for every RBFS version or for SRBFS or Russell’s Iterative Expansion.
    In particular, unconditional first-visit inheritance and conditional inheritance
    can differ with nonmonotone evaluations, and the cited 1993 RBFS journal version
    remains a retained version question.
- assessment_id: ilbfs-limitation-7
  area: scope
  topic: 'Iterative linear best-first search: limitation 7'
  outcome: supported
  summary: Fresh static code and text reading confirms older-first prose versus newer-first
    comparator; full execution behavior remains untested.
  target_ids:
  - AIMech:IterativeLinearBestFirstSearch
  evidence_ids:
  - source-grabovski2024v2-16
  - ilbfs-accepted-preview
  - triple-scientific-support
  - triple-ilbfs-correspondence
  - triple-code-selection
  - ilbfs-code-tile-puzzle-py
  - ilbfs-code-ilbfs-order-py
  - actual-write
  - actual-reading
  - actual-adversarial
  details: The later 2024 text describes its depth-first tie rule as taking the node
    inserted first, while the inspected pinned comparator favors greater creation
