  summary: RocketQAv2 Joint Training for Dense Passage Retrieval and Passage Reranking
    is a distinct concept.
  details: Distinct from RocketQA (AIMech:RocketQADenoisedHardNegativeSampling), which
    alternates separate training stages of the retriever and reranker with static
    pseudo-labels rather than joint synchronous dynamic listwise distillation; distinct
    from TAS-B (AIMech:TASBTopicAwareSamplingBalancedMarginDistillation), which distills
    pairwise score margins from static teacher models using topic-clustered batches;
    and distinct from AR2 (AIMech:AR2AdversarialRetrieverRankerForDenseTextRetrieval),
    which formulates retriever-ranker training as a minimax adversarial game rather
    than mutual listwise KL alignment.
