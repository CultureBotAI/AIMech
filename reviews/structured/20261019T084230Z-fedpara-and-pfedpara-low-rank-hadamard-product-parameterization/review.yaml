  summary: FedPara and pFedPara (Low-Rank Hadamard Product Parameterization for Federated
    Learning) is a distinct concept.
  details: Distinct from PowerSGD (AIMech:PowerSgdLowRankGradientCompressionWithErrorFeedback,
    Vogels et al. 2019), which compresses full-model gradients via power-iteration
    low-rank approximations with error feedback rather than reparameterizing the model
    weights via an unconstrained-rank Hadamard product of low-rank factors, and from
    FedRep (AIMech:FedRepExploitingSharedRepresentationsForPersonalizedFederatedLearning,
    Collins et al. 2021), which splits personalization by network depth (shared body
    vs local head) rather than intra-layer Hadamard decomposition W_1 odot (W_2 +
    1).
