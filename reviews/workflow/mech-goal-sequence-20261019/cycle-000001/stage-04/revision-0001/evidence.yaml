- finding_id: F-C1S4-004
  summary: 'Defer three upstream AIO near-duplicate class pairs (AddLayer/AdditionLayer,
    TransformerLLM/TransformerLanguageModel, ZeroShotLearningLLM/ZeroshotLearning)
    to upstream ontology curation — Targets (6): AIO:AddLayer, AIO:AdditionLayer,
    AIO:TransformerLLM, AIO:TransformerLanguageModel, AIO:ZeroShotLearningLLM, AIO:ZeroshotLearning.
    Native structured review: reviews/structured/20261104T112500Z-c1s4-aio-corpus-category-review/review.yaml.
    Pinned upstream AIO release 2026-07-22 (sources/aio/aio.json) contains three pairs
    of distinct class IRIs with overlapping definitions, parent chains, or cross-linked
    synonyms: (1) AIO:AddLayer (branches: [Layer], parents: [AIO:MergingLayer], definition:
    ''A merging layer that adds a list of inputs taking as input a list of tensors
    all of the same shape.'') and AIO:AdditionLayer (branches: [Layer], parents: [AIO:Layer],
    definition: ''A layer that adds inputs from one or more other layers to cells
    or neurons of a target layer.''); (2) AIO:TransformerLLM (branches: [Model], parents:
    [AIO:TransformerLanguageModel], exact synonym ''Transformer Large Language Model'')
    and AIO:TransformerLanguageModel (branches: [Model], parents: [AIO:LanguageModel],
    exact synonym ''Transformer LM''), whose definitions share the identical relative
    clause ''that uses the transformer architecture based on multi-head attention
    mechanisms allowing it to contextualize tokens within a context window for effective
    language understanding and generation''; and (3) AIO:ZeroShotLearningLLM (branches:
    [Model], parents: [AIO:LargeLanguageModel], exact synonym ''Zero-Shot LLM'', related
    synonym ''zero-shot learning'') and AIO:ZeroshotLearning (branches: [Network],
    parents: [AIO:DeepNeuralNetwork], exact synonym ''ZSL''). Because data/aio/*.yaml
    is generated and upstream identifiers must not be locally rewritten or merged
    without upstream curation, these boundary overlaps are deferred to berkeleybop/artificial-intelligence-ontology.'
  status: deferred
  disposition: Deferred to upstream berkeleybop/artificial-intelligence-ontology (src/ontology/aio-src.csv);
    generated data/aio/*.yaml files must remain exact projections of the pinned AIO
    release (AGENTS.md).
- finding_id: F-C1S4-005
  summary: 'Defer upstream AIO genus-to-hierarchy mismatches on RepresentationLearning,
    ZeroshotLearning, and TrainingStrategy to upstream ontology curation — Targets
    (3): AIO:RepresentationLearning, AIO:ZeroshotLearning, AIO:TrainingStrategy. Native
    structured review: reviews/structured/20261104T112500Z-c1s4-aio-corpus-category-review/review.yaml.
    In pinned upstream AIO release 2026-07-22 (sources/aio/aio.json), AIO:RepresentationLearning
    (branches: [Network], parents: [AIO:DeepNeuralNetwork], definition: ''A deep neural
    network that discovers representations required for feature detection or classification
    from raw data.'') and AIO:ZeroshotLearning (branches: [Network], parents: [AIO:DeepNeuralNetwork],
    definition: ''A deep neural network that predicts classes at test time from classes
    not observed during training.'') are placed under AIO:DeepNeuralNetwork with definitions
    beginning ''A deep neural network that...'' despite denoting learning paradigms/tasks,
    and top-level branch AIO:TrainingStrategy (branches: [TrainingStrategy], parents:
    [owl:Thing]) defines itself with the genus ''A preprocessing used to train machine
    learning models...'' while AIO:Preprocessing is a sibling top-level branch. Deferred
    to upstream berkeleybop/artificial-intelligence-ontology because data/aio/*.yaml
    is generated from the pinned ontology snapshot.'
  status: deferred
  disposition: Deferred to upstream berkeleybop/artificial-intelligence-ontology (src/ontology/aio-src.csv);
    maintained curated records already document these upstream placement caveats in
    aio_mappings[].rationale and identity_notes without mutating generated data/aio/*.yaml.
- finding_id: F-C1S4-006
  summary: 'Defer upstream AIO exact-synonym typo (''Multilayer Perceptoron'') on
    AIO:DeepFeedForwardNetwork to upstream ontology curation — Targets (1): AIO:DeepFeedForwardNetwork.
    Native structured review: reviews/structured/20261104T112500Z-c1s4-aio-corpus-category-review/review.yaml.
    In pinned upstream AIO release 2026-07-22 (sources/aio/aio.json), class AIO:DeepFeedForwardNetwork
    (data/aio/DeepFeedForwardNetwork.yaml) carries the misspelled exact synonym ''Multilayer
    Perceptoron'' (synonyms[2].value) alongside exact synonyms ''DFF'' (synonyms[0].value)
    and ''MLP'' (synonyms[1].value). Deferred to upstream berkeleybop/artificial-intelligence-ontology
    because data/aio/*.yaml is generated and must reproduce sources/aio/aio.json byte-for-byte
    under python -m aimech seed --check.'
  status: deferred
  disposition: Deferred to upstream berkeleybop/artificial-intelligence-ontology (src/ontology/aio-src.csv);
    generated data/aio/DeepFeedForwardNetwork.yaml must remain faithful to the pinned
    upstream snapshot.
