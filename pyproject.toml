[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "aimech"
version = "0.1.0"
description = "AIO-grounded artificial intelligence concepts and evidence-backed curation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSE-DATA", "sources/aio/LICENSE"]
authors = [{name = "AIMech Contributors"}]
dependencies = ["linkml>=1.10,<2", "jsonschema[format]>=4.26,<5", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.3"]

[project.scripts]
aimech = "aimech.cli:main"

[project.urls]
Repository = "https://github.com/CultureBotAI/AIMech"
Ontology = "https://github.com/berkeleybop/artificial-intelligence-ontology"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimech = ["schema/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/validate_id_label_correspondence.py" = ["E741"]
